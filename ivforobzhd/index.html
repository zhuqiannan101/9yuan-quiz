<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>首通电话全流程（汇诚）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%2740%27%3E%3Ctext x=%27100%27 y=%2725%27 fill=%27%23bbb%27 font-size=%2716%27 text-anchor=%27middle%27 font-family=%27sans-serif%27%3EPPT 加载中…%3C/text%3E%3C/svg%3E") center/200px 40px no-repeat;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}
</style>

<script>
const DATA = {"pages":[{"row":2,"stage":"阶段1·首通的定位与价值","p":"P01","topic":"封面：首通电话全流程——中价课首通：定位·流程·话术·质检","script":"各位老师，这节课要给大家讲的是首通电话的全流程。这通电话，对我们和家长来说，都是非常重要的第一印象。 大家换位思考一下：一个孩子坐在教室里，人没有离开、没有跑出教室，是不是就代表这节课孩子听进去、有收获了？ 放到我们首通电话里也是一样：家长没有挂断电话，不代表我们这通电话就打好了、沟通有效。 今天我主要学习首通电话全流程，核心四块 —— 定位、流程、话术、质检。\n很多人容易把这通电话只当成开课通知，打完没有信息沉淀，后续转化很难做。今天不只是给大家话术，先明确这通电话的目标，拆解全流程节点、配套话术，同时讲清楚质检和考核标准。","interact":null,"sku":"","dept":""},{"row":3,"stage":"阶段1·首通的定位与价值","p":"P02","topic":"目录：五大模块（定位价值/六步流程/采集摸底/沟通异议/红线质检）","script":"我们来看今天的课程目录，一共五大模块。\n第一块，首通的定位与价值。我们搞清楚什么是首通、这通电话能给家长带来什么、对我们自己有什么帮助，明确打电话的核心目标，不做无效通话。\n第二块，也是重中之重，首通六步全流程。后面我们会逐个拆解每一步怎么做。\n第三块，信息采集和摸底铺垫。学会收集关键信息，读懂家长的关注点，做到知己知彼。\n第四块，沟通技巧和异议处理。遇到家长疑问、顾虑，有对应的方法去应对。\n第五块，红线和质检。明确通话禁忌，遵守规范，严禁过度承诺，清楚考核标准。\n接下来我们先进入第一部分：首通的定位与价值。","interact":null,"sku":"","dept":""},{"row":4,"stage":"阶段1·首通的定位与价值","p":"P03","topic":"第一章（章节页）：首通的定位与价值","script":"我们进入第一部分，首通的定位与价值。很多新老师会觉得首通就是打个电话通知上课，这个理解是不够的。首通是家长付费之后的第一次深度接触，家长对你的信任和第一印象、对课程的信心，都是在这通电话里建立起来的。首通的重要性在这也会体现出来。","interact":null,"sku":"","dept":""},{"row":5,"stage":"阶段1·首通的定位与价值","p":"P04","topic":"什么是首通：家长半信任状态·购课后第一通服务电话·第一印象只有一次·中价课高客单价口径","script":"我们进入第一部分，先来搞清楚：什么是首通。\n\n首先我们切换到家长的视角来看：家长刚付完费用，这个阶段对我们是处于半信任的状态。钱已经花出去了，但是课程还没有开始上，心里一边抱有期待，一边也会有各种各样的顾虑。\n\n所以首通的本质，就是家长购课之后，我们打出的第一通服务电话。我们要在这通电话里完成信息确认、自我介绍、讲清楚课程安排，提前帮家长化解心里的顾虑。\n\n大家一定要记住，我们和家长的第一印象只有一次。通话里你的声音状态、专业度、安排的条理性，家长都会在这一通电话里感知到，这也是家长建立对我们信任感的关键。\n\n咱们的中价课，在体验课赛道里属于高客单价。愿意花这个费用报名体验课的家长，本身对孩子学习编程这件事，期待和重视程度是很高的，对应的，他们对我们的服务体验标准也会更高。\n首通的通话质量，不只是影响家长感受，还会直接关联后续孩子的出勤、完课情况，以及家长的信任度，最终也会影响我们后续的业务结果。\n\n讲完什么是首通，接下来我们就来看，首通对于家长、对于我们带班老师，分别有什么样的价值。来看一道题，刚付完费的家长处于什么状态？","interact":{"q":"刚付完费的家长处于什么状态？","at":"P04","options":["已经完全信任老师——交了钱就百分百放心","半信任状态——钱花了课还没上，有期待也有顾虑","完全不信任——随时准备申请全额退费","没有任何想法——交完钱自己都忘了这事"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":6,"stage":"阶段1·首通的定位与价值","p":"P05","topic":"首通的价值：对家长=安全感定心丸·对老师=核心数据+学情摸排（不打好就埋雷）","script":"首先是对家长，核心就是给到安全感。线上教育，家长最大的顾虑就是怕钱花出去之后没人跟进、没人管，而首通，就是提前把这颗定心丸给到家长，帮他们打消线上学习的顾虑，让家长觉得这笔钱花得踏实。\n其次就是兼顾个性化。每个孩子的基础、情况都不一样，家长也会有各自的需求和担心。我们要在首通里主动收集这些信息，针对家长的疑问给出对应的解决方案。\n\n然后是对我们自己，同样有两点。\n第一是数据。加微率、出勤率、完课率这些核心指标，直接和大家的绩效挂钩，而这些数据的底子，就是靠首通打下来的。\n第二是学情摸排。我们通过首通，摸清孩子的年龄、编程基础，还有家长的期待，后续的服务和沟通才能因材施教、有的放矢。\n\n反过来讲，大家一定要记住：首通不打，或者打得敷衍、质量差，后面出现的频繁请假、家长失联、甚至投诉问题，根源很多都是在这一步埋下的隐患。所以大家一定要足够重视首通这通电话。\n\n讲完价值，接下来我们来看首通的核心目的。","interact":null,"sku":"","dept":""},{"row":7,"stage":"阶段1·首通的定位与价值","p":"P06","topic":"首通核心目的三件事：①建立信任 ②摸清情况 ③铺垫课程（约好小灶课）","script":"接下来我们明确首通的核心目的，简单来说就是做好三件事。\n\n第一件，建立信任。我们要稳住第一印象、立好老师人设，跟家长讲清楚我是谁、接下来我会怎么带班、怎么给孩子提供服务，让家长放心把孩子交给我们，对老师、对课程建立信心，也为后续的续报转化打好基础。\n\n第二件，摸清情况。我们要一次性收集好孩子的年龄、上课设备，设备是否达标直接关系后续能不能稳定上课；同时了解孩子的编程基础、学习兴趣，还有家长报课的期待和顾虑，并且及时记录下来。有了这些信息，我们后续服务孩子、和家长沟通，才能做到知己知彼。\n\n第三件，铺垫课程。激发家长和孩子对课程的期待，讲明白课程学什么、怎么学，同步约好小灶课，提前强调按时出勤的重要性。只有孩子稳定出勤，我们后面的加微、完课，还有最终的续报，才有保障。\n\n这里大家一定要重点记住：首通不只是简单的通知电话，它是带着明确服务目标的结构化沟通，你说出去的每一句话，都是有任务的每一步都算数。","interact":null,"sku":"","dept":""},{"row":8,"stage":"阶段2·首通全流程六步","p":"P07","topic":"第二章（章节页）：首通全流程六步（顺序经过验证，不能乱）","script":"进入第二部分，首通全流程。这部分是今天的重点。整个首通分为六步，顺序是经过验证的，不能乱：先开场建立身份，再确认课程信息，然后确认孩子的基本情况，接着摸学情挖需求，再立老师人设、提学习要求，最后小灶预约和温馨收尾。挂了电话之后还有记录和留存的动作。大家先把顺序记住，后面我们逐步拆每一步的话术。","interact":null,"sku":"","dept":""},{"row":9,"stage":"阶段2·首通全流程六步","p":"P08","topic":"首通全景：六步+挂机后课后动作（先建身份再要信息·先服务再提要求）","script":"接下来我们进入首通全景，整体就是六大通话步骤，再加挂机之后的配套课后动作，一环扣一环，顺序不能调换。\n\n首先第一步，热情开场。我们上来先自我介绍，清晰告诉家长我是谁、打电话的目的：我是接下来六周全程带孩子上课的带班老师，今天这通电话，主要是跟您对接课程，同步后续全部的学习安排，先把身份立住，让家长知道我们不是随便的推销电话。\n\n第二步，课程确认。这个环节最核心的一件事，就是引导家长添加微信，微信是我们后续长期沟通、发资料、跟进学习最主要的渠道，一定要在这个环节加上。同时和家长核对课表，确认上课时间，还要核对教具快递收货地址，避免后续教具发错、收不到，耽误孩子上课。\n\n第三步，信息确认。我们要核实关键信息：孩子的年龄、平时对接的主要负责人、家里用来上课的设备情况。设备这块一定要重点检查，提前排查设备能不能正常运行，避免等到开课当天，才发现设备不兼容、用不了，导致孩子没法正常上课。\n\n第四步，学情摸底。到这里我们就要深挖信息了，了解孩子之前有没有接触过编程、基础怎么样，孩子对编程的兴趣高不高，同时倾听家长的想法、顾虑和期待，把这些需求都挖出来，方便我们后续针对性服务。\n\n第五步，人设和上课要求。跟家长讲清楚咱们的上课风格，是耐心引导型，还是偏严格督促的类型，让家长提前熟悉你的带班方式；同时同步上课规则，强调按时出勤的重要性，提前给家长建立上课的预期。\n\n第六步，小灶预约和温馨收尾。对本次通话简单复盘，给到家长安心感，浅浅铺垫后续的安排，埋下钩子，方便我们之后继续跟进。\n\n通话结束，挂机之后的动作，同样非常关键，千万不能打完电话就放一边。我们要马上更新学生信息表，把刚刚沟通收集到的家长诉求、孩子情况补充完整，给家长发送配套资料，并且发文字确认，最后及时填好学情记录表。大家一定不要只靠脑子记，信息多了很容易遗忘、记错。\n\n这里有两个关键点，大家一定要刻在心里：\n第一，通话顺序绝对不能乱。我们要先介绍自己、建立身份，再去收集各类信息；先跟家长讲我们能提供什么服务，再提上课相关要求。一旦顺序颠倒，家长的防备和防御心马上就上来，沟通就很难推进。\n第二，每一步都有它对应的任务，不是随便聊聊：开场用来建立身份，信息确认用来规避后续出错，学情摸底用来方便因材施教、分班服务，打造人设是为了积累信任，收尾是为后续跟进留下钩子。\n\n一句话总结：电话里的沟通很重要，但电话结束之后的信息录入工作，和通话本身同等重要。如果聊完之后信息没有落到表格里，没有记录留存，那这一通首通，基本就等于白打了。来看一道题，挂机之后的配套动作是？","interact":{"q":"挂机之后的配套动作是？","at":"P08","options":["打完电话就结束——不用做任何配套动作，聊完就算完成","更新信息表→补充家长诉求→发资料文字确认→完成学期表记录","只靠脑子记——相信自己记得住，不需要落表留存","把记录删掉——等下次打电话的时候再重新填一遍"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":10,"stage":"阶段2·首通全流程六步","p":"P09","topic":"①热情开场：亮明身份·确认主要照顾人·目的前置说清时长；笑着打电话定情绪基调","script":"第一步，热情开场。给一段参考话术：XX爸爸或者妈妈您好，我是核桃编程的课导老师，我姓xx，后面咱们孩子学编程，主要就是我来进行服务和跟进。今天给您打这个电话，一是恭喜咱们孩子的课程已经开通了，二是跟您同步一下接下来上课的安排，大概占用您几分钟。这一步里面藏着三个必须完成的任务，大家一定要记牢。\n第一，亮明身份，告诉家长你的姓氏和岗位；\n第二，确认接电话的人，是不是孩子日常主要对接、负责上课的监护人；\n第三，直白说明我们打电话的目的，还有大概需要多久。\n\n这里有个很关键的技巧，就是目的前置。我们先提前告诉家长，这通电话要聊哪些内容、大概占用多长时间，家长心里有预期，才愿意安心跟我们继续沟通，不会中途着急挂断。\n\n同时还有几个细节需要留意：打电话的时候语速放缓、平稳，不用讲太多复杂信息。如果接通之后，发现家长正在开车、做饭，不方便长时间通话，不要硬聊，主动跟家长约一个方便的时间，再回拨。\n\n另外，开场直接定下整通电话的情绪基调。打电话的时候状态放松、面带微笑，声音听起来会更有亲和力、感染力，家长第一感受也会更好。\n\n开场这一步做好，我们身份立住了，家长放下防备，后面我们再继续加微信、核对信息，沟通起来就顺畅很多。讲完开场，接下来我们进入第二步，课程确认。","interact":null,"sku":"","dept":""},{"row":11,"stage":"阶段2·首通全流程六步","p":"P10","topic":"②课程确认：加微信（服务主阵地）·讲清上课内容和时间·核对快递地址+签收交代","script":"接下来是首通第二步：课程信息确认，这一步我们重点确认三件内容：微信、课表、快递。\n\n先看参考话术，大家可以直接参考：一会儿您留意一下微信，我会给您发一份课表，孩子每一次课的上课时间、课程内容，上面都写得清清楚楚。另外咱们配套课程的教具快递已经寄出了，您记得留意签收，包裹里面会附带一份物品清单，收到之后对照清单核对一下，如果有缺失或者损坏，您直接跟我说，我来帮您处理。\n\n这一步有三个必须完成的任务：\n第一，加上家长微信，并且提醒家长及时通过好友申请。微信是我们后续全部服务的主阵地，课表、学习资料、作业反馈、孩子课堂情况，全部都会在微信同步。微信加不上，后面所有跟进和服务都会寸步难行，是我们开展后续工作的基础。\n第二，跟家长讲清楚上课时间安排，以及每一次课对应的学习内容，让家长提前做到心里有数。\n第三，仔细核对教具快递的收货地址，确认地址准确。\n\n这里有两点需要大家重点留意。教具快递是家长接触到的第一份实物课程素材，也是家长对咱们课程很直观的实物感知，地址一定要核对准确，同时提前跟家长交代好签收、清点、保管的注意事项，避免后续出现漏件、物品损坏的问题。\n如果家长还没有登录客户端，我们可以顺势说明，教具发货、孩子正常上每一次课，都需要用到学号和客户端，借着这个机会，和家长约定好时间，引导家长下载客户端、完成登录，提前做好开课前置准备。\n\n这一步核心就是打通服务通道，提前规避上课、教具相关的风险。等微信、课表、快递信息全部确认好，","interact":null,"sku":"","dept":""},{"row":12,"stage":"阶段2·首通全流程六步","p":"P11","topic":"③信息确认：孩子年纪·学习负责人·上课设备（当场给调优方案，别等开课）","script":"我们来到首通第三步：信息确认，核心核实三样内容：孩子年纪、学习负责人、上课设备。\n\n大家先看参考话术，我们可以这样自然提问：咱们宝贝今年几岁了？平时主要是爸爸还是妈妈陪着上每一次课呀？家里上课准备用电脑还是平板呢？\n\n这一步同样有三个必须落地的任务：\n第一，确认孩子的年纪。年纪直接关系到课程适配，也决定我们后续和孩子沟通、引导的方式；\n第二，锁定学习负责人。明确后续我们主要对接的服务对象，之后约课、学习督促、同步孩子学习反馈，我们都优先和这位负责人沟通；\n第三，确认上课设备。重点确认设备类型，同时检查摄像头、麦克风能不能正常使用，保障孩子可以顺利参与每一次课。\n\n这里有两个重点提醒大家：\n如果当场发现设备配置不足，我们要直接给出调优建议；如果家长准备用平板上课，一定要确认客户端是否兼容，把问题提前排查掉，千万不要等到要上一次课的时候才暴露故障。\n另外，这一步问到的所有信息，全部都要及时落到表格里，年纪、负责人、设备情况，一项都不能遗漏。\n\n这一步就是把基础学情和对接人锁定，规避开课设备风险。信息确认完成之后，我们就进入第四步，学情摸底。","interact":null,"sku":"","dept":""},{"row":13,"stage":"阶段2·首通全流程六步","p":"P12","topic":"④学情摸底：基础/兴趣来源/校内成绩三问·挖到需求继续深挖·图形化了解情况","script":"接下来我们进入首通第四步：学情摸底，核心就是摸清孩子的编程基础、兴趣来源，还有家长的学习期待，这一步是我们做到因材施教的关键。\n\n大家先看参考话术，我们可以这样自然地和家长沟通：咱们宝贝之前接触过编程吗？是自己平时喜欢折腾这些，还是看到别的小朋友学也想试试呀？他在学校里成绩怎么样，特别喜欢哪门课呀？\n\n这一步我们要落实摸底三问：\n第一，询问孩子的编程基础，确认孩子之前有没有接触学习过、学过哪一类内容；\n第二，挖掘兴趣来源，分清是孩子本身自发感兴趣，还是家长主动规划安排学习；\n第三，了解校内成绩情况和孩子偏好的学科。\n\n这里重点提醒大家，挖到需求之后一定要继续深挖，不要浅尝辄止。举个例子，如果家长说报课主要是想锻炼孩子的逻辑思维，我们就顺势追问一句：那您最想先帮孩子改善哪一方面呢？是做题思路、专注力，还是解决问题的习惯？家长说得越具体，我们后续的服务方向就越清晰，才能精准对症下药。\n同时我们也可以顺带问问孩子对图形化这类编程语言有没有了解，用来判断后续和家长沟通时，要不要使用专业术语，避免讲得太深家长听不懂，或者讲得太浅达不到家长预期。\n\n大家一定要记住，学情摸底不是随便闲聊拉家常，我们收集到的每一条信息，都有明确的用处：这些信息会直接决定我们后续小灶课的内容设计、每一次课之后的课堂反馈怎么写，还有后续我们怎么给家长做长期规划、铺垫续报。\n右侧就是我们用来记录信息的学情表，沟通当中问到的内容，要实时记录进去，把孩子画像完整搭建起来，后续所有服务动作都可以对照这份学情表开展。来看一道题，家长说「想锻炼思维」，正确的做法是？","interact":{"q":"家长说「想锻炼思维」，正确的做法是？","at":"P12","options":["结束通话，把时间留给下一通电话","直接跳到下一话题，不在这个问题上停留","继续深挖——追问「最想先改善哪方面」，越具体越好服务","让家长自己想，不追问不引导"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":14,"stage":"阶段2·首通全流程六步","p":"P13","topic":"⑤人设+学习要求：直播实操/每周反馈/选拔好苗子；借「为孩子好」口吻提要求","script":"好，我们来到首通第五步：老师人设 + 学习要求，这一步核心是把我们的带班风格、负责的方式传递给家长，同时顺势同步上课规则，争取家长配合。\n\n大家先看参考话术，我们可以这样和家长沟通：\n另外还有两件比较重要的事情跟您同步一下。第一件是教具快递，您记得留意签收，帮孩子妥善保管好，包裹里面的机器人零件比较细碎，之后我会发一份物品清单给您，您收到之后对照核对，要是有缺失或者损坏，随时跟我说。第二件，咱们是直播实操课，每次上课前我会提前和您确认时间，排好之后尽量不要因为外出游玩这类情况让孩子缺课。如果遇到特殊情况没法参与，一定要提前跟我说。咱们一周安排两次课，一次课时长不会很长，我们一起帮孩子把学习规划稳定下来。咱们会根据孩子前三周的学习状态和课堂表现，筛选表现优秀的孩子重点培养，也麻烦您多关注宝贝的课堂状态，我每周都会及时给您同步孩子的学习情况。\n\n这一步有三大人设要素，大家一定要讲清楚：\n第一，我怎么上课：咱们是直播实操的形式，不是单纯看录播，课堂上会带着孩子动手实操；\n第二，我怎么负责：我会固定每周给家长反馈孩子的学情，让家长清楚孩子每一次课的收获；\n第三，我对孩子的期待：我们会观察孩子前三周的表现，择优进行重点培养，给到孩子更多的关注和机会。\n\n这里有一个沟通技巧，我们所有的学习要求，都要站在为孩子成长着想的角度去表达，像准时上课、保管教具、家长配合跟进这些要求，用这样的口吻提出来，家长的接受度会高很多，不容易产生抵触。\n其中 “选拔好苗子重点培养” 是拉动出勤非常关键的钩子，家长知道前三周的表现会影响后续能不能获得重点培养的机会，会更主动配合，重视孩子的出勤和课堂参与。\n\n这一步我们把信任感建立起来，也提前打好出勤、配合的预防针","interact":null,"sku":"","dept":""},{"row":15,"stage":"阶段2·首通全流程六步","p":"P14","topic":"⑥小灶预约：课前1v1直播小灶——课没开先见面；名额法（今天还有3场）促当场敲定","script":"接下来我们来到首通的第六步：小灶预约，也就是课前 1V1 对接，这也是咱们整通首通电话非常关键的落地动作。\n\n先看参考话术，大家可以这样跟家长沟通：\n我还没有和宝贝正式认识呢，您看什么时候方便，我先给宝贝约一次课前一对一的直播小灶课。一方面我提前和孩子熟悉一下，另一方面带着孩子了解咱们要学什么、怎么学，帮宝贝建立基础的编程认知。我今天还有 3 场小灶名额，您看您和孩子哪个时间合适？\n\n首先我们先明确小灶课的定位：它不是正式的一次课，是首通电话的落地动作。正式课程还没有开启，我们借着这次一对一的机会提前和孩子见面。我们可以近距离熟悉孩子的性格、接受节奏，孩子也能提前认识我、适应我的引导方式。同时我会给孩子简单介绍课程内容，帮孩子建立对编程的认知，减少正式上课的时候陌生、紧张的感觉。\n\n这里有一个很实用的技巧，用名额法制造合理的紧迫感：跟家长说明今天剩余的小灶名额有限，像话术里提到的，我今天还有 3 场名额，适度的稀缺感，更容易推动家长当场敲定时间，而不是一直往后拖延。\n\n在敲定小灶时间之后，我们顺带做收尾确认：还没有通过微信好友的，提醒家长及时通过申请；还没有登录客户端的家长，提醒补充硬件地址，这里只需要确认大致位置，不用追问过于详细的信息，同时和家长约定好下载客户端，不管是教具发货还是后续上每一次课，都需要用到学号和客户端。\n\n最后用结束语收尾：那今天咱们就沟通到这儿啦，之后有任何问题，您随时微信或者电话找我哈。\n\n大家要记住，首通前面聊了很多信息、铺垫了期待，最终的落脚点就是约上这一场小灶课。如果小灶没有约成功，前面很多沟通的价值就打折扣了，所以这一步一定要主动推进、抓住机会敲定时间。\n\n到这里，六步首通电话的话术我们就全部拆解完毕，接下来我们就可以梳理通话结束之后，挂机要完成的配套动作。","interact":null,"sku":"","dept":""},{"row":16,"stage":"阶段2·首通全流程六步","p":"P15","topic":"温馨提示说再见：收尾三件套 留言→政策浅铺→确认时间，说完再挂机","script":"接下来我们来到首通电话的收尾环节：温馨提示说再见。这一步是整通电话的收尾三件套，顺序千万不能乱，顺序是：留言环节 → 政策浅铺 → 确认时间，全部说完之后再挂机，家长听到的最后内容，直接决定这通电话在他心里的整体感受。\n\n我们先拆开看这三件套：\n\n第一个，留言环节。邀请家长帮忙给孩子带一句鼓励或者寄予期待的话。咱们可以这样引导：等下咱们通话结束，您可以和宝贝说一句鼓励的话，比如期待他在编程课里动手创造、多多思考。家长挂完电话之后，大多会主动把这份期待转述给孩子，孩子提前就会对课程、对我们老师产生期待，从一开始就建立正向的学习心态。\n\n第二个，政策浅铺。这里只做轻铺垫，不展开深挖。像编程纳入课堂、对应的赛考通道这类信息，一句话带过就好，不用长篇讲解政策细节、不用当场做规划。参考话术：后续咱们跟着学习，也会对接上编程相关的赛考通道，给孩子多一条发展路径。这块内容留到后面小灶、后续跟进的时候再详细讲，首通里只种下这个印象，讲多了容易给家长造成压力。\n第三个，确认时间。临挂机前，我们再复盘核对一遍首次上课的信息，明确是几号、几点，敲定由谁来提醒孩子，责任落到具体的人身上。避免后续出现记错时间、没人提醒、错过一次课的情况。大家可以这样说：咱们再最后确认一下，咱们第一次上课是 X 号 X 点，到时候是您提醒宝贝准时进课堂，对吧？\n\n这里再跟大家强调一遍顺序的重要性：先做留言，传递温度，拉近距离；再做政策浅铺，拔高价值感；最后确认时间，把最核心、最刚需的上课信息锁定，规避出勤风险。\n\n收尾整套连贯话术参考：\n也麻烦您之后跟宝贝带一句鼓励的话，期待他在编程里多多动手尝试。另外跟您简单提一句，现在编程也逐步走进课堂，后续咱们学习也会对接正规赛考通道，给孩子多一个锻炼方向。咱们最后再确认下，咱们第一次上课是 X 号 X 点，到时候由您这边提醒宝贝准时上课哈。\n\n收尾语气要温和自然，不要急促，说完三件套，再礼貌道别。\n这个收尾环节，前面我们铺垫的信任、规划、期待，在这里稳稳收住，给家长留下专业、贴心、有条理的印象。来看一道题，收尾三件套的正确顺序是？","interact":{"q":"收尾三件套的正确顺序是？","at":"P15","options":["顺序无所谓，说完就挂","确认时间→留言→政策浅铺","政策浅铺→确认时间→留言","留言→政策浅铺→确认时间"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":17,"stage":"阶段2·首通全流程六步","p":"P16","topic":"首通后记录留存：更新信息表·诉求单独记一条·发资料+文字确认（靠表格兜底）","script":"电话挂了，首通还没结束，还有三个记录动作。第一，更新学生信息表，年纪、学习负责人、设备、基础、兴趣、家长的诉求，首通里问到的所有信息，全部落表。第二，补充家长诉求，家长在电话里提的个性化需求，要单独记一条，后面每次和家长沟通之前，先看一眼这一条，服务才有连续性。第三，发送资料加文字确认，课表、教具清单、注意事项，在微信里再发一遍，并且用文字跟家长确认关键信息，比如上课时间，让家长回一句好的，这也算一次书面确认。这里有一条铁律送给大家：及时完成学期表记录，不要考验脑子，记不住。电话里答应家长的事情，靠表格兜底，不靠记忆。","interact":null,"sku":"","dept":""},{"row":18,"stage":"阶段2·首通全流程六步","p":"P17","topic":"学情表的重要性：沟通前快速翻看·找家长关注点——记得好，烦恼少，续报更顺畅","script":"接下来我们讲首通结束之后非常关键的一步：学情表的重要性。很多老师电话聊得很顺畅，但后续回访、跟进的时候容易断档，核心原因就是没有及时把信息落到学情表里。\n\n我们分成三块来看：\n第一块，为什么一定要认真记录学情表？\n首通这一通电话，我们收集了大量信息：孩子的编程基础、兴趣来源、家长的核心诉求、校内学科情况、出勤约定、小灶时间、家长在意的痛点等等。光靠脑子记很容易记混、记漏。不管是之后日常回访，还是到后期铺垫续报沟通，全部都要依托这份学情表来开展。它就是我们服务孩子的信息底座。\n\n第二块，学情表到底该怎么用？\n每次我们要给家长发消息、打电话回访之前，先花几十秒快速翻看一遍学情表，快速抓住这位家长最关心的点、孩子的特点、家长的顾虑和期待。沟通的时候，我们就围绕孩子本身、家长的痛点去聊，而不是千篇一律套统一话术，沟通会更有针对性，家长也能感受到我们是真的在关注他家孩子，而不是批量群发。\n\n第三块，记住一句话：记得好，烦恼少。\n信息完整记录下来，我们前后沟通的内容就能连贯起来，不会出现上次聊的事情这次忘掉的情况。每一次反馈、每一次跟进都有依据，服务做扎实了，后续续报的铺垫也会更加顺畅。\n\n大家一定要记住这个核心口诀：学情表记得好，后面续报烦恼少。\n首通挂断不是工作结束，及时、完整填好学情表，才是把刚才这通电话的价值真正沉淀下来，为后面所有的服务、反馈、续报打好基础。","interact":null,"sku":"","dept":""},{"row":19,"stage":"阶段3·信息采集与摸底铺垫","p":"P18","topic":"第三章（章节页）：信息采集与摸底铺垫（采集清单/摸底提问/认知铺垫/关注地图）","script":"接下来我们进入第三章：信息采集与摸底铺垫。\n这一章，是咱们首通电话里承上启下的核心板块，里面包含四大模块：采集清单、摸底提问、编程认知铺垫、家长关注地图。\n\n很多老师打电话容易犯一个问题：想到哪问到哪，提问零散，聊完之后关键信息缺漏，后面没法精准服务。这一章就是帮我们把学情摸底标准化，我们不是随便聊天，是带着目标、带着清单去采集信息，搭好孩子和家长的完整画像。\n\n首先是采集清单，也就是我们要收集的全部信息项，前面我们学情摸底环节用到的内容，都在这个清单里：孩子编程基础、过往学习经历、兴趣来源、校内成绩、学科偏好、家长核心诉求、对图形化的了解程度等等。清单就是我们的检查项，避免通话结束才发现漏掉关键信息。\n\n第二块是摸底提问，也就是我们的提问话术和追问逻辑。重点记住：听到家长笼统的需求，一定要深挖。比如家长说想锻炼思维，我们不能停在这里，要继续追问，把模糊的期待变具体。提问是有顺序、有节奏的，先了解孩子，再挖掘家长的真实想法，不是一连串审问式提问，是自然沟通。\n\n第三块是编程认知铺垫。我们会借着提问，判断家长和孩子对编程、图形化的认知深浅。如果完全零基础，后面沟通就少用专业术语；如果之前接触过，我们就可以适度拔高，聊对应的赛事、进阶方向，对齐家长认知，避免沟通错位。\n\n第四块是家长关注地图，简单来说，就是把家长的诉求分类标记好：有的家长看重思维能力、有的看重校内辅助、有的看重竞赛升学、有的只是孩子单纯感兴趣。我们把关注点标注清楚，这张 “地图”，就是后面小灶授课、课堂反馈、续报铺垫的方向。\n\n大家要明白，摸底铺垫，不是为了收集信息而收集。我们所有的提问、记录、判断，最终都是为了找准家长的关注点，做到因材施教、精准服务。这一章吃透，我们的学情摸底就不会浮于表面，沟通更有抓手，而不是漫无目的闲聊。","interact":null,"sku":"","dept":""},{"row":20,"stage":"阶段3·信息采集与摸底铺垫","p":"P19","topic":"信息采集清单：六大类必采项与用途（基础/条件/背景/动机/服务/画像）","script":"接下来我们看信息采集清单，这张表就是我们首通电话的采集标尺，分成六大类，每一项都有对应的用途，不是随便问问，每一条信息都服务于后面的教学和服务。\n\n第一类，学员基础信息。必采孩子年级、主要照顾人以及联系方式。拿到这些，我们才能匹配适合孩子的课程，同时确定我们日常对接的服务人，避免之后沟通找不到对接家长。\n\n第二类，上课条件。要确认上课用电脑还是平板、摄像头麦克风是否正常、上课地点。提前排查设备问题，避免正式上课的时候设备故障，耽误孩子上课，减少临场问题。\n\n第三类，学习背景。重点问孩子有没有编程基础、有没有接触过 Python 这类语言，还有校内成绩、擅长或者薄弱的学科。这一项直接决定咱们小灶课怎么分层，跟家长沟通的深浅。零基础就多做科普，有基础就可以往进阶、赛事方向去聊。\n\n第四类，兴趣与动机。我们要搞清楚：孩子是自己喜欢编程，还是家长安排来学？家长报课最期待收获什么，最想改善孩子哪方面？这一步就是深挖真实需求，后面上课、反馈都能贴合孩子情况，因材施教。\n\n第五类，服务安排。确认微信好友有没有加上、快递地址核对、首次上课时间、照顾人的空闲时间。保障后续教具正常发货、准时触达、孩子能够正常出勤上课。\n\n第六类，家长画像。记录家长核心关注点，是看重升学竞赛、兴趣培养，还是逻辑思维锻炼；同时记下家长的沟通习惯，以及当下有没有顾虑。有了这个画像，我们就能定好后续回访、续报的沟通策略，提前做好异议预警。\n\n大家一定要记住，清单是框架，不是审问。我们穿插在聊天里自然提问，一边聊一边记录，通话结束同步填进学情表。这些信息串联起来，就是完整的孩子和家长画像，也是我们后面所有沟通、授课、跟进的依据。来看一道题，「服务安排」类信息的用途是？","interact":{"q":"「服务安排」类信息的用途是？","at":"P19","options":["出勤与触达保障——加微情况、快递地址、首次上课时间、照顾人时间","定沟通策略——针对家长画像定回访策略","小灶课分层——按基础决定小灶课深度","排除设备隐患——设备、摄像头麦克风检查"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":21,"stage":"阶段3·信息采集与摸底铺垫","p":"P20","topic":"摸底提问：表面在问·实际在听（五个问题逐条拆解）；一次只问一个","script":"接下来我们来看摸底提问这一页，核心就是搞懂：我们嘴上在问什么，耳朵重点要听什么，提问不是走流程，每一句都带着目标。\n\n我们一条一条拆开：\n第一个问题：宝贝之前接触过编程吗？\n表面上是了解编程基础，实际我们要判断程度：零基础的孩子，后续沟通、小灶课就要多鼓励、降低门槛；有基础的，继续追问学到哪一步，避免内容重复，也方便匹配更高阶的引导。\n\n第二个问题：是孩子自己想学，还是您给他安排的？\n表面问兴趣来源，实际区分动力来源：如果是孩子自发想学，我们后续多给展示机会、多肯定；如果是家长安排的，我们重点要在小灶课上点燃孩子兴趣，帮孩子建立内驱力，不然很容易出现抵触、坚持不下去的情况。\n\n第三个问题：孩子在学校成绩怎么样，喜欢哪门课？\n表面了解校内情况，实际是找学科挂钩点。比如孩子喜欢数学，我们就多讲编程和逻辑、数学思维的关联；喜欢语文，就可以讲故事、项目创作，把课程价值和孩子现有优势绑定，这就是我们后面铺垫价值的 “弹药”。\n\n第四个问题：平时谁盯着孩子学习比较多？\n表面问家庭分工，实际锁定主要对接人。之后课堂反馈、学习提醒、回访沟通，优先找这位家长，避免消息多头传递、信息脱节，没人跟进学习。\n\n第五个问题：您希望孩子这期学完，最想看到什么变化？\n表面问期待，实际抓家长的核心诉求。这句话挖到的答案，一定要记录进学情表。之后所有的课堂反馈、阶段性沟通、续报铺垫，全部围绕这个诉求来讲，家长才会觉得我们懂他。\n\n最后重点看节奏提醒：一次只问一个问题，等家长回答完，再问下一个。\n千万不要连环抛问题，连问会让家长有被审问的压迫感，回答也容易敷衍应付，信息就摸不准了。我们一问一答，边听边回应，自然穿插，才是舒服的沟通节奏。\n\n这一组提问，刚好对应前面的信息采集清单，一边聊一边把关键信息收齐，为后面的沟通打好基础。","interact":null,"sku":"","dept":""},{"row":22,"stage":"阶段3·信息采集与摸底铺垫","p":"P21","topic":"编程认知铺垫：浅铺一层留足空间——为什么学/为什么现在学/为什么在核桃学","script":"接下来我们进入编程认知铺垫这一页，核心记住标题这句话：浅铺一层，留足空间。\n\n这里分成三个方向，我们依次来看：\n第一块，为什么学编程。\n我们可以简单跟家长提三点：新课标里已经加入信息科技；编程可以锻炼逻辑思维，反过来助力校内各科学习；长期来看，也是发展科技特长、参与信息类赛事的入口。\n\n第二块，为什么现在学。\n重点抓住年龄窗口期：孩子现阶段正是思维习惯养成的黄金阶段，早接触、早建立思维，收益会更明显。\n\n第三块，为什么在核桃学。\n给家长讲清楚我们完整的服务闭环：直播实操上课、配套教具动手练习、课导全程跟班服务，同时还有赛考通道，从学习到赛事，整套体系是完整的。\n\n最关键的是下方的分寸把握，这也是新人最容易踩坑的地方：\n首通只做浅铺，每一点一句话带过，不展开、不深讲、不逼问家长认不认可。\n首通的目标不是当场说服家长，只是先种下认知。深度讲解、价值论证、打消顾虑，全部留给小灶课、课后回访以及后续续报沟通。如果首通讲得太满，后面我们就没有抓手了。\n\n简单总结：首通是轻轻搭框架，不是一次性把所有价值全部说完。","interact":null,"sku":"","dept":""},{"row":23,"stage":"阶段3·信息采集与摸底铺垫","p":"P22","topic":"家长最关心的话题地图：期待类顺着讲·顾虑类提前化解·服务类当场讲清","script":"接下来我们看家长最关心的话题地图，这张图把家长所有关注点分成了三大类：期待类、顾虑类、服务类，同时明确了我们首通里的处理策略。\n\n第一类，期待类，属于正向诉求。\n家长的关注点一般是升学、科技特长生、赛事，还有校内成绩、逻辑思维、学习习惯培养。这一类我们不用强行说服，顺着家长的想法去讲，给到对应的路径和真实案例，并且把这条诉求记在学情表里，后面所有个性化反馈、续报沟通都围绕它展开。\n\n第二类，顾虑类，是我们需要提前化解的。\n高频疑问大家看一下：孩子年纪小能不能学会、上网课伤眼睛、课时太长孩子消化不了、是不是直播、上课设备平板能不能用。这些都是家长很容易冒出来的担心，首通里我们主动覆盖高频顾虑，提前给到解释，避免后面反复纠结。\n\n第三类，服务类，是必须确认清楚的规则项。\n包含上课形式、上课时间、谁来提醒上课、请假流程、教具怎么使用。服务类信息优先在首通一次性讲明白，规则讲清楚，后续回访就不用反复答疑，最省心。\n\n最后重点看使用方式：\n首通沟通的标准动作是：主动覆盖【服务类全部内容】+【顾虑类高频问题】；【期待类】重点记录，不急于一次性讲透，留作后续个性化沟通的抓手。\n\n简单来说：规则当场说清，高频顾虑提前化解，家长的期待好好记下，作为我们之后服务的主线。来看一道题，「服务类」话题包含哪些？","interact":{"q":"「服务类」话题包含哪些？【多选】","at":"P22","options":["怎么上课","什么时间上课、谁提醒","请假怎么办、教具怎么用","升学路径规划"],"answer":0,"answers":[0,1,2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":24,"stage":"阶段4·沟通技巧与异议处理","p":"P23","topic":"第四章（章节页）：沟通技巧与异议处理（先跟后带/听懂心声/四步框架/成交三性）","script":"第四部分，沟通技巧与异议处理。首通话术是骨架，沟通技巧是血肉。这一章是新人非常核心的能力板块，包含四个关键词：先跟后带、听懂心声、四步框架、成交三性。\n\n很多新人遇到家长有顾虑、提异议的时候，第一反应就是着急反驳、急于解释，很容易把天聊僵。这一章就是给大家一套标准化沟通逻辑，不是硬说服，而是先接住情绪，再解决问题。\n\n- 先跟后带：是我们处理异议的底层心法。先认同家长的感受，不抬杠，再慢慢引导，而不是一上来就讲道理。\n- 听懂心声：区分家长表面说出来的话，和藏在背后真实担心。比如家长说 “太贵了”，背后不一定是没钱，可能是担心价值不匹配、怕孩子坚持不下来。\n- 四步框架：一套固定的异议应答流程，遇到任何疑问都可以套用，保证沟通不乱、不跑偏。\n- 成交三性：我们最终要让家长感知到课程的必要性、适合性、确定性，这也是促成信任、提升续报的关键。","interact":null,"sku":"","dept":""},{"row":25,"stage":"阶段4·沟通技巧与异议处理","p":"P24","topic":"破冰与先跟后带：先顺着家长认可感受再带建议；反驳=开启心理防御","script":"我们来看这一页，核心就是先跟后带，也是我们和家长沟通、处理异议最基础的心法。\n什么叫先跟后带？简单说：先顺着家长，认可他的感受和想法，再带出我们的建议。\n千万不要一上来直接反驳，一旦反驳，家长马上拉起心理防线，后面我们讲再多内容，他都听不进去，心里只会觉得：你就是想说服我报课。\n\n左边是反面例子：\n家长提出担心，我们直接一句 “不是的，您理解错了”。这句话一出口，家长立刻警觉，沟通就卡住了。\n\n右边是正确的先跟后带话术：\n“您这个顾虑特别正常，很多家长一开始都这么想…… 其实咱们课程里……”\n先共情接住，再慢慢转折，家长感受到被理解，才愿意继续听我们往下讲。\n\n还有两个配套小动作，大家一定要养成习惯：\n第一，打电话的时候带着微笑。微笑会改变你的语气，隔着电话，家长是能感受到声音里的感染力的；\n第二，不管家长说什么，先接一句：“对”、“是的，我理解”，再接我们后面的内容。\n先接住情绪，再沟通内容，家长才愿意跟着我们的思路聊下去。","interact":null,"sku":"","dept":""},{"row":26,"stage":"阶段4·沟通技巧与异议处理","p":"P25","topic":"听懂家长话里的心声：先回应藏着的担心，再回答字面问题（三例拆解）","script":"这一页讲怎么听懂家长话里的心声。很多新人沟通，只会盯着家长字面的问题去回答，答完之后发现家长还是不放心。核心原因就是：没有读懂这句话背后藏着的真实想法。\n这里有一个核心原则：先回应他藏在里面的担心，再回答表面的问题。\n\n我们一条一条来看：\n第一句，家长问：孩子上一次课学多久啊？\n字面是问时长，真正担心的是：上课时间太长，伤眼睛、孩子坐不住、专注力跟不上。\n那我们回应的时候，就不能只说 “一节课 XX 分钟”，要讲清楚：课程时长是专门适配孩子专注力设计的，还有护眼安排、中途休息，打消他视力和坐不住的顾虑。\n\n第二句，家长问：你们老师带班带多久了？\n表面是问教龄，真实顾虑是：害怕老师是新手、不专业，怕没人跟进孩子学习。\n我们的回应方向，重点给到确定性：讲老师带班经验，同时把整套服务机制说出来 —— 每周反馈、课上答疑、全程跟班，让家长放心，不是只靠老师个人。\n\n第三句，家长说：我们家孩子平时表现可棒了。\n这句话不是单纯闲聊，家长的内心期待是：希望老师能看见孩子、多肯定、多鼓励孩子。\n我们就要顺着夸奖孩子的具体行为，并且给到承诺：课堂上会多给孩子展示、表达的机会。\n\n最后记住要点：\n家长随口的一句话，背后都带着一个具体的担心或者期待。沟通顺序一定是：先接住内心的担心，再回答字面问题。只答字面，家长的顾虑还在，沟通就很难推进。","interact":null,"sku":"","dept":""},{"row":27,"stage":"阶段4·沟通技巧与异议处理","p":"P26","topic":"异议处理四步：共情→聚焦→解决→赋能（完整示范：担心孩子太小学不会）","script":"接下来我们学习标准化异议处理四步框架，不管家长抛出什么样的顾虑，我们都可以按这个顺序走，不会乱、不会慌。\n\n第一步，共情。\n对应咱们前面学的先跟后带，先接住家长的情绪，话术模板就是：您的担心特别正常，我特别理解。先不着急解释，让家长感受到我们站在他这边，放下防备。\n\n第二步，聚焦问题。\n很多家长的顾虑是笼统模糊的，比如 “我怕孩子学不会”“我担心没效果”。这时候我们不要猜，主动提问把问题具体化：您最担心的是哪一点？\n分清到底是怕跟不上、怕伤眼睛，还是怕没时间坚持，找准核心矛盾，才不会答非所问。\n\n第三步，解决问题。\n针对刚刚锁定的这一个顾虑，给出完整方案，方案要包含三块：课程本身的设计、老师会做的动作、需要家长配合的地方。三点讲清楚，方案才扎实，不是空口承诺。\n\n第四步，赋能。\n打消顾虑之后，最后一步要给家长和孩子信心，把家长拉到 “我们一边”，比如：孩子之前的努力您也看到了，咱们一起盯好。\n把这件事变成家校协同，而不是我们单方面推销课程。\n\n给大家串一遍完整示范，比如家长说：我担心孩子太小学不会。\n\n1. 共情：您这个担心特别正常，我特别理解。\n2. 聚焦：您最担心的是孩子跟不上，坐不住吗？\n3. 解决：咱们课程是低龄孩子专属的实操设计，课堂上老师会一步步引导，课导课后跟进反馈，平时您只需要提醒孩子按时上课就可以。\n4. 赋能：孩子本身好奇心很强，咱们一起陪着他慢慢入门。\n\n记住顺序：先共情稳情绪，再聚焦抓重点，再给方案解顾虑，最后赋能树信心。\n跳过前两步，上来直接讲方案，家长听不进去。来做一道判断题：异议处理中跳过共情和聚焦、上来直接讲方案，会发生什么？","interact":{"q":"异议处理中跳过共情和聚焦、上来直接讲方案，会发生什么？","at":"P26","options":["对","错"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":28,"stage":"阶段4·沟通技巧与异议处理","p":"P27","topic":"三大高频异议参考应对：请假/坚持不下去/时间太长——框架不变内容应变","script":"这部分给三个最高频的异议，按四步框架给出参考应对。第一个，老师，孩子有事上不了课，能请假吗。共情：计划赶不上变化很正常。聚焦：问清楚是一次性的冲突，还是经常性的时间问题。解决：能调课的提前报备调课，同时讲清楚缺课对学习连续性的影响。赋能：咱们尽量保证出勤，孩子跟得上，效果才看得到。第二个，我担心孩子坚持不下去，做事三分钟热度。共情：很多孩子一开始都这样，不用焦虑。聚焦：问一下之前放弃是因为没兴趣，还是没成就感。解决：直播实操加教具作品，让学习成果看得见，老师每周反馈、及时鼓励。赋能：前三周咱们一起帮他闯过新鲜期，表现好还能选上好苗子重点培养。第三个，课程时间太长，怕孩子消化不了。共情：怕孩子累着，这个想法特别贴心。聚焦：是担心单次课太长，还是整期的强度。解决：单次课时长是按孩子专注力设计的，中间有节奏安排，作业量也可控。赋能：先按课表上两周，我盯着反馈，有问题咱们随时调。最后强调一句，以上是参考思路，实际话术要按孩子的情况灵活调整，框架不变，内容随机应变。","interact":null,"sku":"","dept":""},{"row":29,"stage":"阶段4·沟通技巧与异议处理","p":"P28","topic":"成交三性：重要性讲值不值·紧迫性讲能不能等·唯一性讲在哪学最合适","script":"接下来我们看成交三性，这是咱们所有家长沟通、异议处理最后的落脚点。不管家长提什么问题，像担心孩子坚持不下来、上课时间不合适、想再等等、或者纠结要不要报，我们先用前面的四步框架把顾虑化解完，最后一定要收回到这三个核心点上。\n\n首先是重要性，也就是为什么要学编程。\n很多家长心里最根本的疑问就是：学这个到底有啥用，是不是单纯玩？咱们要讲清楚，编程不是兴趣消遣，它贴合新课标方向，看重的是逻辑、拆解、推理这些底层思维。这种思维能力，不是只用来写代码，它能帮孩子理清思路，对数学、理科的审题、解题都有正向帮助，是可以迁移到其他学科、长期受益的能力，让家长明白这件事是有价值、值得投入的。\n\n然后是紧迫性，为什么一定要现在这个年龄段学。\n不是催家长报名，而是客观讲孩子的成长特点。咱们这个阶段，正好是逻辑思维塑造的黄金窗口期，孩子好奇心强、愿意动手尝试，入门接受度高，更容易建立自信和兴趣。如果往后拖，等到年级升高，校内作业变多，文化课压力上来，各类补习班、兴趣班排得满满当当，孩子的空余时间会越来越碎片化，到那时候再想新开一门编程，时间挤不出来，孩子也很难沉下心去学。早启蒙，早积累，越往后越被动。\n\n最后是唯一性，为什么选核桃，而不是别的地方。\n市面上能学编程的机构不少，但完整配套的体系很少。咱们是直播实操课，不是单纯看录播；专门设计了护眼模式，照顾长时间线上学习的孩子；同时打通了完整的赛考通道，从日常学习到赛事、等级测评，一条路能走通；再加上稳定的师资团队、标准化的课后跟进服务。直播实操 + 护眼设计 + 赛考通路 + 配套服务，这一整套组合优势，不是随便一家机构都能配齐的，这就是我们独有的优势。\n\n给大家一个简单好记的口诀：重要性讲值不值，紧迫性讲能不能等，唯一性讲在哪学最合适。","interact":null,"sku":"","dept":""},{"row":30,"stage":"阶段5·红线与质检","p":"P29","topic":"第五章（章节页）：红线与质检（通话四不/质检扣分/注意事项/考核标准）","script":"接下来我们进入第五章，红线与质检。前面我们学了沟通方法、异议处理、成交逻辑，这些是帮我们把沟通做好；而这一章，是告诉大家什么绝对不能做、通话怎么考核，守住底线，避免违规扣分。\n\n这一章我们会围绕四块内容展开：通话四不、质检扣分点、注意事项、考核标准。\n很多新人前期沟通话术练得很好，但踩了红线，一通电话直接作废，甚至影响考核成绩，非常可惜。所以这一块大家一定要记牢，它是我们所有通话的安全底线。\n\n“通话四不” 是我们的基础行为准则，是绝对不能触碰的；\n质检扣分点，会告诉大家日常通话里哪些小问题会丢分，比如夸大承诺、回答不规范、态度生硬；\n还有日常沟通里的各类注意事项，比如信息怎么说、赛事政策怎么表述，不能随意承诺；\n最后是整套考核标准，大家清楚自己的通话会按照什么维度打分，知道怎么做才能拿到合格、优质的通话","interact":null,"sku":"","dept":""},{"row":31,"stage":"阶段5·红线与质检","p":"P30","topic":"通话四不红线：不聊敏感话题·不夺命连环问·不垄断话语权·不过度承诺","script":"这一页是通话的四不红线，每一条都直接挂钩质检。第一，不聊敏感话题。和家长沟通要有边界感，可能引起争议和误会的话题一律不碰，比如家庭私事、对其他机构的评价、内部薪酬这些。第二，不夺命连环问。不要连续问一大串问题，每问一个，先等家长的回应和反馈，再问下一个。记住，首通不是审讯。第三，不垄断话语权。沟通是双向互动，如果你发现自己有大段的输出，立刻停下来，互动一句，您对课程还有什么想了解的呀。第四，不过度承诺。对方提的要求你做不到，就不要硬说我可以，答应了又做不到，只会更伤感情。所有的承诺都要留有余地，比如用我尽量、我争取、我帮您协调，这样的说法。","interact":null,"sku":"","dept":""},{"row":32,"stage":"阶段5·红线与质检","p":"P31","topic":"质检扣分点清单：漏必做动作·信息未落表·触犯四不·顺序错乱·状态与话术+挂机自检","script":"接下来我们看质检扣分清单，这是大家通话之后打分的直接依据，每一条都和我们的通话成绩挂钩，我们一条一条拆开讲清楚。\n\n第一点，漏必做动作。\n首通电话有几个硬性动作：加微信、核对快递地址、确认首次上课时间、约小灶课。这几项是规定动作，缺一项就扣一项分，不是说聊得好就可以跳过。很多新人光顾着和家长沟通、讲课程，最后忘了约小灶或者没核对地址，话术再好，照样扣分。\n\n第二点，信息未落表。\n通话里问到的孩子年级、基础情况、家长诉求这些信息，聊完一定要及时录入学生信息表、学期表。记住规则：不落表，视同没有采集。哪怕你电话里问得很全，但是后台没有记录，质检的时候直接判定这项没完成。\n\n第三点，触犯四不红线，这个是从重扣分的，一定要重点警惕。\n包含四类情况：聊敏感话题、连环发问一直逼家长、自顾自大段输出不给家长说话机会、承诺自己做不到的事情。红线问题和普通扣分不一样，一旦踩中，扣分力度会大很多，大家一定要管住自己的表达节奏，不随意许诺。\n\n第四点，顺序错乱。\n流程顺序属于质检硬指标。比如刚接通，还没自我介绍、建立信任，上来就索要信息；或者还没给家长讲清楚配套服务，一上来就催促家长配合上课。流程颠倒，家长体验差，同时直接判定扣分。\n\n最后底部给大家一个非常实用的自检方法：\n每次挂断电话之后，对照六步流程 + 课后动作，自己回放核对一遍：每一步有没有做完、信息有没有及时落表、刚刚有没有许下无法兑现的承诺。养成挂机自查的习惯，能帮我们避开绝大多数扣分。\n\n简单总结：必做动作不能少、采集信息要落表、红线内容绝不碰、沟通流程不乱序，打完电话主动自检，稳定拿到合格通话。来看一道题，每次挂断电话后的自检方法是？","interact":{"q":"每次挂断电话后的自检方法是？","at":"P31","options":["对照「六步流程+课后动作」逐项回放——每步做了没、信息落表没、承诺了什么","不用自检，凭感觉判断这通电话的好坏","只回忆聊得开不开心，不看流程完整度","等质检发现问题再说，自己不用查"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":33,"stage":"阶段5·红线与质检","p":"P32","topic":"考核标准：总分100，流程/规划/表达/答疑各25分，低于60不合格","script":"最后一部分，看一下我们的考核标准。接下来我们看整张通话的打分表，总分 100 分，分成四大板块，每一块各 25 分：流程、规划、表达、答疑，总分低于 60 分就是不合格通话。咱们先把四个维度分别讲清楚，再看不同分数段的要求。\n\n第一个板块：流程，25 分。\n重点考察通话的完整性、信息准确性。我们开场介绍、信息确认、用户挖掘、学习规划、总结强调这一套流程要走全；开课时间、上课周期、设备、赛考这些关键信息，绝对不能说错。\n\n- 0–14 分：流程缺步骤，或者用词、信息出错，内容啰嗦反复；\n- 15–20 分：流程完整，没有知识点错误；\n- 21–25 分：流程完整干净，语言简洁，还能根据情况做合适的补充。\n\n第二个板块：规划，25 分。\n考察大家能不能讲明白核桃的课程体系，课程之间的衔接、学习周期、赛事规划，并且结合孩子的情况、家长期待，给出适配的学习路线，这也是高分的分水岭。\n\n- 0–14 分：能提到体系，但讲得卡顿、不顺畅；\n- 15–20 分：可以顺畅讲清课程和赛事规则；\n- 21–25 分：自然过渡到体系和赛考，自信流畅，还能根据孩子的情况，定制专属的学习、赛事路径，吸引家长。\n\n第三个板块：表达，25 分。\n电话沟通看不到表情，语气、节奏就是我们的门面。核心要求：信息准确传递、和家长建立连接，拉近距离。\n\n- 0–14 分：语气冷淡，有盘问感、敏感话题、磕绊严重、语速混乱；\n- 15–20 分：表达清晰通顺，有少量口误，但不影响理解，语气有起伏；\n- 21–25 分：语气热情，应答流畅，表达利落舒服。\n\n第四个板块：答疑，25 分。\n考验我们的异议处理能力，不是生硬背话术，是听懂诉求、妥善回应。\n\n- 0–14 分：没读懂家长诉求，回应生硬，没有解决问题；\n- 15–20 分：有回应，但是没有完全打消家长顾虑；\n- 21–25 分：稳稳解决家长疑问，还能挖掘家长深层需求，给到可行建议。","interact":null,"sku":"","dept":""},{"row":34,"stage":"阶段5·红线与质检","p":"P33","topic":"通话注意事项汇总：七条行为规范（笑着打/先跟后带/一次一问/随打随填…）","script":"最后把通话注意事项汇总成七条，也是首通的完整行为规范。第一，笑着打电话，声音是有感染力的，家长隔着电话能听出来你的状态。第二，先跟后带，先顺着家长说，再带出自己的建议，不反驳，不争论。第三，一次只问一个问题，问完等回答，家长答完了可以简单回应一下，再问下一个。第四，重要信息即时记录，学期表和信息表随打随填，不要考验自己的脑子。第五，家长时间不合适就约，开车、做饭、带娃的时候主动约一个二次拨打的明确时间。第六，承诺留余地，做不到的不硬答，用我帮您协调、我确认之后回复您这样的话替代。第七，也是最容易忘的一条：首通的目标不是卖课，是建立信任、采齐信息、铺垫课程，后面的事情后面做，不要在首通里着急推任何东西。","interact":null,"sku":"","dept":""},{"row":35,"stage":"阶段5·红线与质检","p":"P34","topic":"结束行动项：默写六步流程·本周对照执行自检·话术卡住找师父·总结定位","script":"到这里，我们整套首通电话的培训内容就全部讲完了，最后这一页，是给大家落地执行的行动清单，分四块，清晰好记。\n\n第一，现在立刻要做的任务：\n把六步流程默写一遍：开场→课程确认→信息确认→学情摸底→人设要求→收尾，同时把挂机之后的记录动作一并写上去。默写不是走形式，目的是让大家把流程刻进脑子里，打电话的时候不用翻笔记，顺序不乱、动作不漏。\n\n第二，本周落地要求：\n大家第一批首通电话，严格对照今天这套课件标准去执行。每一通打完，马上自检：六步流程是不是全部走完了、采集到的信息有没有及时落表。自检就是帮大家规避质检扣分，养成习惯。\n\n第三，求助规则，这条大家一定要记住：\n通话当中如果话术卡住、遇到陌生异议接不住，不要自己硬扛、不要随口乱承诺，随时飞书找师父或者主管求助。我们是团队带教，允许请教，不允许硬撑着说错话、踩红线。\n\n最后是核心总结，也是我们首通电话的底层定位：\n首通是服务电话，不是通知电话。\n我们打电话的目标，不是简单通知上课，核心是三件事：和家长建立信任、完整采集孩子学情信息、给家长铺垫课程价值。沟通的时候保持轻松的状态，笑着打，用好我们前面学的先跟后带，通话结束逐项把信息落表。\n\n今天所有的流程、异议处理、成交逻辑、红线质检，最终都落到这几句话、这几个行动上。接下来大家就按这个标准去练习。","interact":null,"sku":"","dept":""},{"row":36,"stage":"阶段5·红线与质检","p":"P35","topic":"首通后反馈话术：「我备注好啦」给安全感·零基础循序渐进·4个智能硬件作品预期","script":"这一页是咱们首通电话结束之后，发给家长的跟进反馈话术，也是电话沟通的延续，用来巩固信任、承接后面的试听课，大家好好把握这个细节。\n\n我们先拆解这段话术的思路：\n\n\nXX 妈妈，我备注好啦！您也希望孩子这次好好学，咱们零基础起步，我会从最基础的内容循序渐进带他，最后教 XX 完成 4 个智能硬件作品。您说对编程了解的不是特别多，这次上课咱们通过宝贝的表现看效果。宝贝一边学，咱们一边了解！\n\n首先，第一句“我备注好啦”，是给家长安全感，告诉家长刚刚电话里聊到的情况我都记下来了，不是听完就忘，体现我们的细心。\n接着，接住家长的期待：知道家长希望孩子好好学，同时点明孩子是零基础，打消家长担心课程太难、跟不上的顾虑，强调循序渐进，降低焦虑。\n然后抛出清晰的成果预期：可以完成 4 个智能硬件作品，给家长一个看得见、摸得着的学习目标，让家长知道这节课不是单纯听理论，是有产出的。\n最后共情家长：家长本身对编程不熟悉，我们不强行灌输，约定好，跟着孩子课堂表现一起看效果，一边学一边了解。姿态很温和，没有压迫感，很贴合咱们 “先跟后带” 的沟通原则。来看一道题，跟进反馈话术第一句「我备注好啦」的作用是？","interact":{"q":"跟进反馈话术第一句「我备注好啦」的作用是？","at":"P35","options":["给家长安全感——电话里聊到的情况都记下来了，体现细心","催家长续费，顺势推进长期班报名转化","结束对话，礼貌地把电话挂掉","推销新课程，介绍下一期产品"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段1","q":"首通的本质是？","options":[{"k":"A","t":"一通推销电话——核心目标是让家长当场续费报年课"},{"k":"B","t":"购课后的第一通服务电话：确认信息、介绍自己、讲清课程，化解顾虑"},{"k":"C","t":"一通简单的上课通知——告知时间安排就完事"},{"k":"D","t":"可打可不打的回访——有空就打，没空就算了"}],"answer":"B","back":"","sku":""},{"id":"T-S02","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段1","q":"中价课在体验课里属于高客单价，对家长的正确理解是？","options":[{"k":"A","t":"家长真金白银花出来的，对服务体验的要求只会更高"},{"k":"B","t":"和低价课家长没有区别，服务可以打折扣"},{"k":"C","t":"家长对服务没有期待，做到不出错就行"},{"k":"D","t":"家长是冲动消费不用重视，按低价课节奏沟通"}],"answer":"A","back":"","sku":""},{"id":"T-S03","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段1","q":"首通不打或者打得敷衍，后面出现的频繁请假、家长失联甚至投诉，根源很多都是在这第一步埋下的隐患。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-S04","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段1","q":"对老师自己，首通直接影响的核心数据是？","options":[{"k":"A","t":"只有底薪"},{"k":"B","t":"加微率、出勤率、完课率"},{"k":"C","t":"退费率一项"},{"k":"D","t":"没有影响"}],"answer":"B","back":"","sku":""},{"id":"T-S05","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段1","q":"首通核心目的要做的三件事是？【多选】","options":[{"k":"A","t":"建立信任——把老师人设立住"},{"k":"B","t":"摸清情况——一次采齐记录到位"},{"k":"C","t":"铺垫课程——约好小灶课铺垫出勤"},{"k":"D","t":"当场促成续费"}],"answer":"ABC","back":"","sku":""},{"id":"T-S06","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段2","q":"热情开场必须完成的三个任务是？","options":[{"k":"A","t":"我是谁（姓名+身份）、确认对方是主要照顾人、说清电访目的和时长"},{"k":"B","t":"报价、逼单、成交——用优惠快速拿下订单"},{"k":"C","t":"问成绩、问设备、问地址——信息一次问全"},{"k":"D","t":"闲聊拉家常——先混个脸熟再谈正事"}],"answer":"A","back":"","sku":""},{"id":"T-S07","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段2","q":"课程信息确认环节的三个任务是？","options":[{"k":"A","t":"加上微信、讲清上课内容和时间、核对快递收货地址"},{"k":"B","t":"只核对快递地址，课表之后再发"},{"k":"C","t":"直接约续费，趁热打铁锁定长期班"},{"k":"D","t":"只发课表就够了，其他等家长自己问"}],"answer":"A","back":"","sku":""},{"id":"T-S08","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段2","q":"信息确认环节要核实的三样内容是？","options":[{"k":"A","t":"家长收入、家庭住址、车牌"},{"k":"B","t":"孩子体重、身高、视力"},{"k":"C","t":"孩子年纪、学习负责人、上课设备"},{"k":"D","t":"课程价格、赠品、优惠券"}],"answer":"C","back":"","sku":""},{"id":"T-S09","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段2","q":"老师人设的三要素是？","options":[{"k":"A","t":"高冷、神秘、不回应——保持距离感和权威感"},{"k":"B","t":"只讲课、不管人、不反馈——上完课就解散"},{"k":"C","t":"我怎么上课、我怎么负责、我对孩子有期待（直播实操/每周反馈/选拔好苗子）"},{"k":"D","t":"自由发挥不用固定——每次上课风格随意切换"}],"answer":"C","back":"","sku":""},{"id":"T-S10","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段2","q":"小灶课（课前 1v1）的定位是？","options":[{"k":"A","t":"正式的大班课——几十个孩子一起上"},{"k":"B","t":"首通的落地动作——课没开先见面，熟悉孩子、讲解课程、提升编程认知"},{"k":"C","t":"付费加购项目——需要家长额外买"},{"k":"D","t":"可有可无的环节——约不上就算了"}],"answer":"B","back":"","sku":""},{"id":"T-S11","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段3","q":"信息采集清单中，「学习背景」类信息的用途是？","options":[{"k":"A","t":"小灶课分层、沟通深度"},{"k":"B","t":"出勤保障"},{"k":"C","t":"定沟通策略"},{"k":"D","t":"排除设备隐患"}],"answer":"A","back":"","sku":""},{"id":"T-S12","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段3","q":"摸底提问的节奏要求是：一次只问一个问题，等家长回答完再问下一个——连问会让家长应付了事。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-S13","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段3","q":"「您希望孩子这期学完，最想看到什么变化？」实际在听什么？","options":[{"k":"A","t":"孩子的年级——决定用哪一档沟通话术"},{"k":"B","t":"上课设备——排查能不能正常上课"},{"k":"C","t":"快递地址——核对教具寄送到哪里"},{"k":"D","t":"家长的核心诉求——写进信息表，续报和反馈都围绕它"}],"answer":"D","back":"","sku":""},{"id":"T-S14","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段3","q":"首通编程认知铺垫的分寸把握是？","options":[{"k":"A","t":"越深越好，当场说服家长认可课程价值"},{"k":"B","t":"完全不提编程价值，只聊上课安排"},{"k":"C","t":"浅铺一层——每点一句话带过，不展开不深讲不逼问"},{"k":"D","t":"反复追问家长认不认可，逼家长表态"}],"answer":"C","back":"","sku":""},{"id":"T-S15","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段3","q":"首通里对话题地图的标准动作是？","options":[{"k":"A","t":"只聊期待类——顺着家长夸就可以了"},{"k":"B","t":"三类都不用覆盖——想到哪聊到哪"},{"k":"C","t":"全部深讲一遍——不留任何后续沟通空间"},{"k":"D","t":"主动覆盖服务类全部+顾虑类高频项；期待类记下来作个性化抓手"}],"answer":"D","back":"","sku":""},{"id":"T-S16","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段4","q":"「先跟后带」的正确做法是？","options":[{"k":"A","t":"先顺着家长认可他的感受，再带出自己的建议"},{"k":"B","t":"直接指出家长理解错了"},{"k":"C","t":"一上来就讲道理说服"},{"k":"D","t":"冷处理不回应"}],"answer":"A","back":"","sku":""},{"id":"T-S17","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段4","q":"家长问「你们老师带班带多久了」，真正担心的是什么？","options":[{"k":"A","t":"想打听老师的工资收入、福利待遇和排班情况"},{"k":"B","t":"怕老师不专业、是新手——要讲带班经验+服务机制给确定性"},{"k":"C","t":"嫌老师太年轻好看，担心管不住自家孩子"},{"k":"D","t":"随便聊聊，背后没有任何具体的担心"}],"answer":"B","back":"","sku":""},{"id":"T-S18","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段4","q":"异议处理四步的正确顺序是？","options":[{"k":"A","t":"解决→共情→赋能→聚焦"},{"k":"B","t":"共情→聚焦→解决→赋能"},{"k":"C","t":"聚焦→赋能→共情→解决"},{"k":"D","t":"赋能→解决→聚焦→共情"}],"answer":"B","back":"","sku":""},{"id":"T-S19","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段4","q":"应对「我担心孩子坚持不下去」，「聚焦」步骤要问清楚的是？","options":[{"k":"A","t":"家长年收入多少"},{"k":"B","t":"要不要直接退费"},{"k":"C","t":"孩子几年级"},{"k":"D","t":"之前放弃是没兴趣还是没成就感"}],"answer":"D","back":"","sku":""},{"id":"T-S20","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段4","q":"「成交三性」是？【多选】","options":[{"k":"A","t":"重要性——为啥要学"},{"k":"B","t":"紧迫性——为啥现在学"},{"k":"C","t":"唯一性——为啥选核桃"},{"k":"D","t":"随机性——想到哪说到哪"}],"answer":"ABC","back":"","sku":""},{"id":"T-S21","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段5","q":"「通话四不」红线包括？【多选】","options":[{"k":"A","t":"不聊敏感话题"},{"k":"B","t":"不夺命连环问"},{"k":"C","t":"不垄断话语权"},{"k":"D","t":"不主动要好评"}],"answer":"ABC","back":"","sku":""},{"id":"T-S22","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段5","q":"「不落表视同没采集」对应哪条质检扣分点？","options":[{"k":"A","t":"信息未落表"},{"k":"B","t":"顺序错乱"},{"k":"C","t":"状态与话术"},{"k":"D","t":"触犯四不红线"}],"answer":"A","back":"","sku":""},{"id":"T-S23","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段5","q":"首通的硬性必做动作（缺一项扣一项）包括？【多选】","options":[{"k":"A","t":"加微信"},{"k":"B","t":"核对快递地址"},{"k":"C","t":"确认首次上课时间"},{"k":"D","t":"当场促成续费"}],"answer":"ABC","back":"","sku":""},{"id":"T-S24","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段5","q":"首通通话考核总分 100 分，低于多少分为不合格？","options":[{"k":"A","t":"70 分"},{"k":"B","t":"80 分"},{"k":"C","t":"60 分"},{"k":"D","t":"50 分"}],"answer":"C","back":"","sku":""},{"id":"T-S25","type":"阶段练习题","chapter":"首通电话全流程汇诚·阶段5","q":"跟进反馈话术里「教 XX 完成 4 个智能硬件作品」的作用是？","options":[{"k":"A","t":"增加家长负担——暗示家长要陪孩子多练习"},{"k":"B","t":"抛出清晰的成果预期——给家长一个看得见、摸得着的学习目标"},{"k":"C","t":"暗示课程很难——提前给家长打预防针"},{"k":"D","t":"没有作用——只是随口一提的话术"}],"answer":"B","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题","chapter":"首通电话全流程汇诚·全章","q":"这节课「首通电话全流程」的核心四块是？","options":[{"k":"A","t":"开场、报价、逼单、成交"},{"k":"B","t":"加微、催课、催续费、催转介绍"},{"k":"C","t":"问候、闲聊、告别、复盘"},{"k":"D","t":"定位、流程、话术、质检"}],"answer":"D","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题","chapter":"首通电话全流程汇诚·全章","q":"首通六步的正确顺序是？","options":[{"k":"A","t":"热情开场→课程确认→信息确认→学情摸底→人设要求→小灶预约+温馨收尾"},{"k":"B","t":"学情摸底→开场→收尾→课程确认→人设→信息确认"},{"k":"C","t":"课程确认→开场→人设→信息确认→学情→收尾"},{"k":"D","t":"开场→学情→课程确认→收尾→人设→信息确认"}],"answer":"A","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题","chapter":"首通电话全流程汇诚·全章","q":"微信是后续所有服务的阵地：课表、作业、反馈都在微信发，没加上后面寸步难行。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题","chapter":"首通电话全流程汇诚·全章","q":"设备配置不足要当场给调优建议，用平板的确认客户端兼容——别等到上课才发现问题。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题","chapter":"首通电话全流程汇诚·全章","q":"「选拔好苗子重点培养」是拉动出勤的关键钩子，因为前三周表现决定重点培养名额。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题","chapter":"首通电话全流程汇诚·全章","q":"收尾三件套的正确顺序是？","options":[{"k":"A","t":"确认时间→留言→政策浅铺"},{"k":"B","t":"政策浅铺→确认时间→留言"},{"k":"C","t":"留言→政策浅铺→确认时间"},{"k":"D","t":"确认时间→政策浅铺→留言"}],"answer":"C","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题","chapter":"首通电话全流程汇诚·全章","q":"家长在电话里提的个性化需求应该怎么处理？","options":[{"k":"A","t":"听完就忘"},{"k":"B","t":"单独记一条，后面每次沟通前先看一眼"},{"k":"C","t":"只靠脑子记"},{"k":"D","t":"拒绝记录"}],"answer":"B","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题","chapter":"首通电话全流程汇诚·全章","q":"关于学情表的核心口诀是？","options":[{"k":"A","t":"学情表可填可不填"},{"k":"B","t":"学情表只在续报时看"},{"k":"C","t":"学情表给家长填"},{"k":"D","t":"学情表记得好，后面续报烦恼少"}],"answer":"D","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题","chapter":"首通电话全流程汇诚·全章","q":"家长说「我们家孩子平时表现可棒了」，家长的内心期待是？","options":[{"k":"A","t":"想炫耀家庭条件——暗示家长的社会地位和经济实力"},{"k":"B","t":"暗示要退费——先铺垫好印象再谈退费"},{"k":"C","t":"随便客套一下——没有具体的内心期待"},{"k":"D","t":"希望老师能看见孩子、多肯定多鼓励——顺着夸具体行为并承诺多给展示机会"}],"answer":"D","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题","chapter":"首通电话全流程汇诚·全章","q":"首通的目标不是卖课，而是？","options":[{"k":"A","t":"当场成交续费——能推就推，能促就促"},{"k":"B","t":"收集家长隐私——收入、家庭情况都问一遍"},{"k":"C","t":"建立信任、采齐信息、铺垫课程——后面的事后面做"},{"k":"D","t":"介绍完就挂断——通知完上课时间就行"}],"answer":"C","back":"","sku":""}],"timing":{"P01":{"sents":["各位老师，这节课要给大家讲的是首通电话的全流程。","这通电话，对我们和家长来说，都是非常重要的第一印象。"," 大家换位思考一下：一个孩子坐在教室里，人没有离开、没有跑出教室，是不是就代表这节课孩子听进去、有收获了？"," 放到我们首通电话里也是一样：家长没有挂断电话，不代表我们这通电话就打好了、沟通有效。"," 今天我主要学习首通电话全流程，核心四块 —— 定位、流程、话术、质检。\n","很多人容易把这通电话只当成开课通知，打完没有信息沉淀，后续转化很难做。","今天不只是给大家话术，先明确这通电话的目标，拆解全流程节点、配套话术，同时讲清楚质检和考核标准。"],"durs":[5.496,5.424,10.704,8.904,7.656,7.68,10.704]},"P02":{"sents":["我们来看今天的课程目录，一共五大模块。\n","第一块，首通的定位与价值。","我们搞清楚什么是首通、这通电话能给家长带来什么、对我们自己有什么帮助，明确打电话的核心目标，不做无效通话。\n","第二块，也是重中之重，首通六步全流程。","后面我们会逐个拆解每一步怎么做。\n","第三块，信息采集和摸底铺垫。","学会收集关键信息，读懂家长的关注点，做到知己知彼。\n","第四块，沟通技巧和异议处理。","遇到家长疑问、顾虑，有对应的方法去应对。\n","第五块，红线和质检。","明确通话禁忌，遵守规范，严禁过度承诺，清楚考核标准。\n","接下来我们先进入第一部分：首通的定位与价值。"],"durs":[4.008,3.096,10.848,4.44,3.384,3.696,5.688,3.384,4.296,2.712,6.12,4.776]},"P03":{"sents":["我们进入第一部分，首通的定位与价值。","很多新老师会觉得首通就是打个电话通知上课，这个理解是不够的。","首通是家长付费之后的第一次深度接触，家长对你的信任和第一印象、对课程的信心，都是在这通电话里建立起来的。","首通的重要性在这也会体现出来。"],"durs":[3.864,6.672,10.704,3.432]},"P05":{"sents":["首先是对家长，核心就是给到安全感。","线上教育，家长最大的顾虑就是怕钱花出去之后没人跟进、没人管，而首通，就是提前把这颗定心丸给到家长，帮他们打消线上学习的顾虑，让家长觉得这笔钱花得踏实。\n","其次就是兼顾个性化。","每个孩子的基础、情况都不一样，家长也会有各自的需求和担心。","我们要在首通里主动收集这些信息，针对家长的疑问给出对应的解决方案。\n\n","然后是对我们自己，同样有两点。\n","第一是数据。","加微率、出勤率、完课率这些核心指标，直接和大家的绩效挂钩，而这些数据的底子，就是靠首通打下来的。\n","第二是学情摸排。","我们通过首通，摸清孩子的年龄、编程基础，还有家长的期待，后续的服务和沟通才能因材施教、有的放矢。\n\n","反过来讲，大家一定要记住：首通不打，或者打得敷衍、质量差，后面出现的频繁请假、家长失联、甚至投诉问题，根源很多都是在这一步埋下的隐患。","所以大家一定要足够重视首通这通电话。\n\n","讲完价值，接下来我们来看首通的核心目的。"],"durs":[3.96,16.032,2.472,6.168,6.984,3.288,1.872,10.416,2.136,10.272,14.088,4.272,4.368]},"P06":{"sents":["接下来我们明确首通的核心目的，简单来说就是做好三件事。\n\n","第一件，建立信任。","我们要稳住第一印象、立好老师人设，跟家长讲清楚我是谁、接下来我会怎么带班、怎么给孩子提供服务，让家长放心把孩子交给我们，对老师、对课程建立信心，也为后续的续报转化打好基础。\n\n","第二件，摸清情况。","我们要一次性收集好孩子的年龄、上课设备，设备是否达标直接关系后续能不能稳定上课；","同时了解孩子的编程基础、学习兴趣，还有家长报课的期待和顾虑，并且及时记录下来。","有了这些信息，我们后续服务孩子、和家长沟通，才能做到知己知彼。\n\n","第三件，铺垫课程。","激发家长和孩子对课程的期待，讲明白课程学什么、怎么学，同步约好小灶课，提前强调按时出勤的重要性。","只有孩子稳定出勤，我们后面的加微、完课，还有最终的续报，才有保障。\n\n","这里大家一定要重点记住：首通不只是简单的通知电话，它是带着明确服务目标的结构化沟通，你说出去的每一句话，都是有任务的每一步都算数。"],"durs":[6.168,2.304,17.592,2.424,8.664,8.4,6.648,2.52,10.56,6.864,12.72]},"P10":{"sents":["接下来是首通第二步：课程信息确认，这一步我们重点确认三件内容：微信、课表、快递。\n\n","先看参考话术，大家可以直接参考：一会儿您留意一下微信，我会给您发一份课表，孩子每一次课的上课时间、课程内容，上面都写得清清楚楚。","另外咱们配套课程的教具快递已经寄出了，您记得留意签收，包裹里面会附带一份物品清单，收到之后对照清单核对一下，如果有缺失或者损坏，您直接跟我说，我来帮您处理。\n\n","这一步有三个必须完成的任务：\n","第一，加上家长微信，并且提醒家长及时通过好友申请。","微信是我们后续全部服务的主阵地，课表、学习资料、作业反馈、孩子课堂情况，全部都会在微信同步。","微信加不上，后面所有跟进和服务都会寸步难行，是我们开展后续工作的基础。\n","第二，跟家长讲清楚上课时间安排，以及每一次课对应的学习内容，让家长提前做到心里有数。\n","第三，仔细核对教具快递的收货地址，确认地址准确。\n\n","这里有两点需要大家重点留意。","教具快递是家长接触到的第一份实物课程素材，也是家长对咱们课程很直观的实物感知，地址一定要核对准确，同时提前跟家长交代好签收、清点、保管的注意事项，避免后续出现漏件、物品损坏的问题。\n","如果家长还没有登录客户端，我们可以顺势说明，教具发货、孩子正常上每一次课，都需要用到学号和客户端，借着这个机会，和家长约定好时间，引导家长下载客户端、完成登录，提前做好开课前置准备。\n\n","这一步核心就是打通服务通道，提前规避上课、教具相关的风险。","等微信、课表、快递信息全部确认好，"],"durs":[9.048,12.72,16.08,3.12,5.88,9.936,7.584,8.952,5.64,3.216,19.032,18.48,6.504,4.368]},"P11":{"sents":["我们来到首通第三步：信息确认，核心核实三样内容：孩子年纪、学习负责人、上课设备。\n\n","大家先看参考话术，我们可以这样自然提问：咱们宝贝今年几岁了？","平时主要是爸爸还是妈妈陪着上每一次课呀？","家里上课准备用电脑还是平板呢？\n\n","这一步同样有三个必须落地的任务：\n","第一，确认孩子的年纪。","年纪直接关系到课程适配，也决定我们后续和孩子沟通、引导的方式；\n","第二，锁定学习负责人。","明确后续我们主要对接的服务对象，之后约课、学习督促、同步孩子学习反馈，我们都优先和这位负责人沟通；\n","第三，确认上课设备。","重点确认设备类型，同时检查摄像头、麦克风能不能正常使用，保障孩子可以顺利参与每一次课。\n\n","这里有两个重点提醒大家：\n","如果当场发现设备配置不足，我们要直接给出调优建议；","如果家长准备用平板上课，一定要确认客户端是否兼容，把问题提前排查掉，千万不要等到要上一次课的时候才暴露故障。\n","另外，这一步问到的所有信息，全部都要及时落到表格里，年纪、负责人、设备情况，一项都不能遗漏。\n\n","这一步就是把基础学情和对接人锁定，规避开课设备风险。","信息确认完成之后，我们就进入第四步，学情摸底。"],"durs":[8.904,6.048,4.2,3.648,3.528,2.808,6.696,2.808,10.296,2.736,9.264,2.688,5.472,11.208,9.816,5.952,5.064]},"P13":{"sents":["好，我们来到首通第五步：老师人设 + 学习要求，这一步核心是把我们的带班风格、负责的方式传递给家长，同时顺势同步上课规则，争取家长配合。\n\n","大家先看参考话术，我们可以这样和家长沟通：\n","另外还有两件比较重要的事情跟您同步一下。","第一件是教具快递，您记得留意签收，帮孩子妥善保管好，包裹里面的机器人零件比较细碎，之后我会发一份物品清单给您，您收到之后对照核对，要是有缺失或者损坏，随时跟我说。","第二件，咱们是直播实操课，每次上课前我会提前和您确认时间，排好之后尽量不要因为外出游玩这类情况让孩子缺课。","如果遇到特殊情况没法参与，一定要提前跟我说。","咱们一周安排两次课，一次课时长不会很长，我们一起帮孩子把学习规划稳定下来。","咱们会根据孩子前三周的学习状态和课堂表现，筛选表现优秀的孩子重点培养，也麻烦您多关注宝贝的课堂状态，我每周都会及时给您同步孩子的学习情况。\n\n","这一步有三大人设要素，大家一定要讲清楚：\n","第一，我怎么上课：咱们是直播实操的形式，不是单纯看录播，课堂上会带着孩子动手实操；\n","第二，我怎么负责：我会固定每周给家长反馈孩子的学情，让家长清楚孩子每一次课的收获；\n","第三，我对孩子的期待：我们会观察孩子前三周的表现，择优进行重点培养，给到孩子更多的关注和机会。\n\n","这里有一个沟通技巧，我们所有的学习要求，都要站在为孩子成长着想的角度去表达，像准时上课、保管教具、家长配合跟进这些要求，用这样的口吻提出来，家长的接受度会高很多，不容易产生抵触。\n","其中 “选拔好苗子重点培养” 是拉动出勤非常关键的钩子，家长知道前三周的表现会影响后续能不能获得重点培养的机会，会更主动配合，重视孩子的出勤和课堂参与。\n\n","这一步我们把信任感建立起来，也提前打好出勤、配合的预防针"],"durs":[14.52,4.44,4.32,16.32,11.352,4.536,7.992,14.592,4.392,8.688,8.88,9.96,17.784,15.456,6.24]},"P16":{"sents":["电话挂了，首通还没结束，还有三个记录动作。","第一，更新学生信息表，年纪、学习负责人、设备、基础、兴趣、家长的诉求，首通里问到的所有信息，全部落表。","第二，补充家长诉求，家长在电话里提的个性化需求，要单独记一条，后面每次和家长沟通之前，先看一眼这一条，服务才有连续性。","第三，发送资料加文字确认，课表、教具清单、注意事项，在微信里再发一遍，并且用文字跟家长确认关键信息，比如上课时间，让家长回一句好的，这也算一次书面确认。","这里有一条铁律送给大家：及时完成学期表记录，不要考验脑子，记不住。","电话里答应家长的事情，靠表格兜底，不靠记忆。"],"durs":[4.56,11.664,12.912,15.96,6.984,4.848]},"P17":{"sents":["接下来我们讲首通结束之后非常关键的一步：学情表的重要性。","很多老师电话聊得很顺畅，但后续回访、跟进的时候容易断档，核心原因就是没有及时把信息落到学情表里。\n\n","我们分成三块来看：\n","第一块，为什么一定要认真记录学情表？\n","首通这一通电话，我们收集了大量信息：孩子的编程基础、兴趣来源、家长的核心诉求、校内学科情况、出勤约定、小灶时间、家长在意的痛点等等。","光靠脑子记很容易记混、记漏。","不管是之后日常回访，还是到后期铺垫续报沟通，全部都要依托这份学情表来开展。","它就是我们服务孩子的信息底座。\n\n","第二块，学情表到底该怎么用？\n","每次我们要给家长发消息、打电话回访之前，先花几十秒快速翻看一遍学情表，快速抓住这位家长最关心的点、孩子的特点、家长的顾虑和期待。","沟通的时候，我们就围绕孩子本身、家长的痛点去聊，而不是千篇一律套统一话术，沟通会更有针对性，家长也能感受到我们是真的在关注他家孩子，而不是批量群发。\n\n","第三块，记住一句话：记得好，烦恼少。\n","信息完整记录下来，我们前后沟通的内容就能连贯起来，不会出现上次聊的事情这次忘掉的情况。","每一次反馈、每一次跟进都有依据，服务做扎实了，后续续报的铺垫也会更加顺畅。\n\n","大家一定要记住这个核心口诀：学情表记得好，后面续报烦恼少。\n","首通挂断不是工作结束，及时、完整填好学情表，才是把刚才这通电话的价值真正沉淀下来，为后面所有的服务、反馈、续报打好基础。"],"durs":[6.24,10.656,2.208,3.816,14.136,3.552,7.68,3.216,3.192,13.32,15.6,4.224,8.904,7.848,6.312,13.608]},"P19":{"sents":["接下来我们看信息采集清单，这张表就是我们首通电话的采集标尺，分成六大类，每一项都有对应的用途，不是随便问问，每一条信息都服务于后面的教学和服务。\n\n","第一类，学员基础信息。","必采孩子年级、主要照顾人以及联系方式。","拿到这些，我们才能匹配适合孩子的课程，同时确定我们日常对接的服务人，避免之后沟通找不到对接家长。\n\n","第二类，上课条件。","要确认上课用电脑还是平板、摄像头麦克风是否正常、上课地点。","提前排查设备问题，避免正式上课的时候设备故障，耽误孩子上课，减少临场问题。\n\n","第三类，学习背景。","重点问孩子有没有编程基础、有没有接触过 Python 这类语言，还有校内成绩、擅长或者薄弱的学科。","这一项直接决定咱们小灶课怎么分层，跟家长沟通的深浅。","零基础就多做科普，有基础就可以往进阶、赛事方向去聊。\n\n","第四类，兴趣与动机。","我们要搞清楚：孩子是自己喜欢编程，还是家长安排来学？","家长报课最期待收获什么，最想改善孩子哪方面？","这一步就是深挖真实需求，后面上课、反馈都能贴合孩子情况，因材施教。\n\n","第五类，服务安排。","确认微信好友有没有加上、快递地址核对、首次上课时间、照顾人的空闲时间。","保障后续教具正常发货、准时触达、孩子能够正常出勤上课。\n\n","第六类，家长画像。","记录家长核心关注点，是看重升学竞赛、兴趣培养，还是逻辑思维锻炼；","同时记下家长的沟通习惯，以及当下有没有顾虑。","有了这个画像，我们就能定好后续回访、续报的沟通策略，提前做好异议预警。\n\n","大家一定要记住，清单是框架，不是审问。","我们穿插在聊天里自然提问，一边聊一边记录，通话结束同步填进学情表。","这些信息串联起来，就是完整的孩子和家长画像，也是我们后面所有沟通、授课、跟进的依据。","来看一道题，「服务安排」类信息的用途是？"],"durs":[14.808,2.856,4.416,10.368,2.472,7.128,8.256,2.496,10.224,5.664,5.928,2.616,5.784,5.112,7.656,2.376,7.632,6.192,2.496,7.056,4.752,7.368,4.368,7.2,9.12,3.912]},"P20":{"sents":["接下来我们来看摸底提问这一页，核心就是搞懂：我们嘴上在问什么，耳朵重点要听什么，提问不是走流程，每一句都带着目标。\n\n","我们一条一条拆开：\n","第一个问题：宝贝之前接触过编程吗？\n","表面上是了解编程基础，实际我们要判断程度：零基础的孩子，后续沟通、小灶课就要多鼓励、降低门槛；","有基础的，继续追问学到哪一步，避免内容重复，也方便匹配更高阶的引导。\n\n","第二个问题：是孩子自己想学，还是您给他安排的？\n","表面问兴趣来源，实际区分动力来源：如果是孩子自发想学，我们后续多给展示机会、多肯定；","如果是家长安排的，我们重点要在小灶课上点燃孩子兴趣，帮孩子建立内驱力，不然很容易出现抵触、坚持不下去的情况。\n\n","第三个问题：孩子在学校成绩怎么样，喜欢哪门课？\n","表面了解校内情况，实际是找学科挂钩点。","比如孩子喜欢数学，我们就多讲编程和逻辑、数学思维的关联；","喜欢语文，就可以讲故事、项目创作，把课程价值和孩子现有优势绑定，这就是我们后面铺垫价值的 “弹药”。\n\n","第四个问题：平时谁盯着孩子学习比较多？\n","表面问家庭分工，实际锁定主要对接人。","之后课堂反馈、学习提醒、回访沟通，优先找这位家长，避免消息多头传递、信息脱节，没人跟进学习。\n\n","第五个问题：您希望孩子这期学完，最想看到什么变化？\n","表面问期待，实际抓家长的核心诉求。","这句话挖到的答案，一定要记录进学情表。","之后所有的课堂反馈、阶段性沟通、续报铺垫，全部围绕这个诉求来讲，家长才会觉得我们懂他。\n\n","最后重点看节奏提醒：一次只问一个问题，等家长回答完，再问下一个。\n","千万不要连环抛问题，连问会让家长有被审问的压迫感，回答也容易敷衍应付，信息就摸不准了。","我们一问一答，边听边回应，自然穿插，才是舒服的沟通节奏。\n\n","这一组提问，刚好对应前面的信息采集清单，一边聊一边把关键信息收齐，为后面的沟通打好基础。"],"durs":[11.4,2.088,3.696,10.392,7.416,4.704,9.168,11.04,4.944,4.416,6.288,9.936,4.44,4.152,10.488,5.184,4.152,4.272,9.168,6.864,9.096,6.048,9.432]},"P21":{"sents":["接下来我们进入编程认知铺垫这一页，核心记住标题这句话：浅铺一层，留足空间。\n\n","这里分成三个方向，我们依次来看：\n","第一块，为什么学编程。\n","我们可以简单跟家长提三点：新课标里已经加入信息科技；","编程可以锻炼逻辑思维，反过来助力校内各科学习；","长期来看，也是发展科技特长、参与信息类赛事的入口。\n\n","第二块，为什么现在学。\n","重点抓住年龄窗口期：孩子现阶段正是思维习惯养成的黄金阶段，早接触、早建立思维，收益会更明显。\n\n","第三块，为什么在核桃学。\n","给家长讲清楚我们完整的服务闭环：直播实操上课、配套教具动手练习、课导全程跟班服务，同时还有赛考通道，从学习到赛事，整套体系是完整的。\n\n","最关键的是下方的分寸把握，这也是新人最容易踩坑的地方：\n","首通只做浅铺，每一点一句话带过，不展开、不深讲、不逼问家长认不认可。\n","首通的目标不是当场说服家长，只是先种下认知。","深度讲解、价值论证、打消顾虑，全部留给小灶课、课后回访以及后续续报沟通。","如果首通讲得太满，后面我们就没有抓手了。\n\n","简单总结：首通是轻轻搭框架，不是一次性把所有价值全部说完。"],"durs":[8.088,3.456,2.64,5.688,5.064,5.712,2.664,10.536,2.928,14.4,5.736,7.608,5.064,8.184,4.416,6.6]},"P22":{"sents":["接下来我们看家长最关心的话题地图，这张图把家长所有关注点分成了三大类：期待类、顾虑类、服务类，同时明确了我们首通里的处理策略。\n\n","第一类，期待类，属于正向诉求。\n","家长的关注点一般是升学、科技特长生、赛事，还有校内成绩、逻辑思维、学习习惯培养。","这一类我们不用强行说服，顺着家长的想法去讲，给到对应的路径和真实案例，并且把这条诉求记在学情表里，后面所有个性化反馈、续报沟通都围绕它展开。\n\n","第二类，顾虑类，是我们需要提前化解的。\n","高频疑问大家看一下：孩子年纪小能不能学会、上网课伤眼睛、课时太长孩子消化不了、是不是直播、上课设备平板能不能用。","这些都是家长很容易冒出来的担心，首通里我们主动覆盖高频顾虑，提前给到解释，避免后面反复纠结。\n\n","第三类，服务类，是必须确认清楚的规则项。\n","包含上课形式、上课时间、谁来提醒上课、请假流程、教具怎么使用。","服务类信息优先在首通一次性讲明白，规则讲清楚，后续回访就不用反复答疑，最省心。\n\n","最后重点看使用方式：\n","首通沟通的标准动作是：主动覆盖【服务类全部内容】+【顾虑类高频问题】；","【期待类】重点记录，不急于一次性讲透，留作后续个性化沟通的抓手。\n\n","简单来说：规则当场说清，高频顾虑提前化解，家长的期待好好记下，作为我们之后服务的主线。","来看一道题，「服务类」话题包含哪些？"],"durs":[13.704,3.696,9.096,14.88,4.008,12.192,9.84,4.608,7.128,8.64,2.544,7.296,6.864,9.24,3.576]},"P23":{"sents":["第四部分，沟通技巧与异议处理。","首通话术是骨架，沟通技巧是血肉。","这一章是新人非常核心的能力板块，包含四个关键词：先跟后带、听懂心声、四步框架、成交三性。\n\n","很多新人遇到家长有顾虑、提异议的时候，第一反应就是着急反驳、急于解释，很容易把天聊僵。","这一章就是给大家一套标准化沟通逻辑，不是硬说服，而是先接住情绪，再解决问题。\n\n","- 先跟后带：是我们处理异议的底层心法。","先认同家长的感受，不抬杠，再慢慢引导，而不是一上来就讲道理。\n","- 听懂心声：区分家长表面说出来的话，和藏在背后真实担心。","比如家长说 “太贵了”，背后不一定是没钱，可能是担心价值不匹配、怕孩子坚持不下来。\n","- 四步框架：一套固定的异议应答流程，遇到任何疑问都可以套用，保证沟通不乱、不跑偏。\n","- 成交三性：我们最终要让家长感知到课程的必要性、适合性、确定性，这也是促成信任、提升续报的关键。"],"durs":[3.576,3.984,9.744,9.096,8.112,4.224,6.528,6.144,8.04,8.712,10.584]},"P24":{"sents":["我们来看这一页，核心就是先跟后带，也是我们和家长沟通、处理异议最基础的心法。\n","什么叫先跟后带？","简单说：先顺着家长，认可他的感受和想法，再带出我们的建议。\n","千万不要一上来直接反驳，一旦反驳，家长马上拉起心理防线，后面我们讲再多内容，他都听不进去，心里只会觉得：你就是想说服我报课。\n\n","左边是反面例子：\n","家长提出担心，我们直接一句 “不是的，您理解错了”。","这句话一出口，家长立刻警觉，沟通就卡住了。\n\n","右边是正确的先跟后带话术：\n","“您这个顾虑特别正常，很多家长一开始都这么想…… 其实咱们课程里……”\n","先共情接住，再慢慢转折，家长感受到被理解，才愿意继续听我们往下讲。\n\n","还有两个配套小动作，大家一定要养成习惯：\n","第一，打电话的时候带着微笑。","微笑会改变你的语气，隔着电话，家长是能感受到声音里的感染力的；\n","第二，不管家长说什么，先接一句：“对”、“是的，我理解”，再接我们后面的内容。\n","先接住情绪，再沟通内容，家长才愿意跟着我们的思路聊下去。"],"durs":[7.8,2.016,6.288,12.528,2.16,4.776,4.656,3.36,6.456,7.368,4.224,3.408,6.6,7.512,5.952]},"P26":{"sents":["接下来我们学习标准化异议处理四步框架，不管家长抛出什么样的顾虑，我们都可以按这个顺序走，不会乱、不会慌。\n\n","第一步，共情。\n","对应咱们前面学的先跟后带，先接住家长的情绪，话术模板就是：您的担心特别正常，我特别理解。","先不着急解释，让家长感受到我们站在他这边，放下防备。\n\n","第二步，聚焦问题。\n","很多家长的顾虑是笼统模糊的，比如 “我怕孩子学不会”“我担心没效果”。","这时候我们不要猜，主动提问把问题具体化：您最担心的是哪一点？\n","分清到底是怕跟不上、怕伤眼睛，还是怕没时间坚持，找准核心矛盾，才不会答非所问。\n\n","第三步，解决问题。\n","针对刚刚锁定的这一个顾虑，给出完整方案，方案要包含三块：课程本身的设计、老师会做的动作、需要家长配合的地方。","三点讲清楚，方案才扎实，不是空口承诺。\n\n","第四步，赋能。\n","打消顾虑之后，最后一步要给家长和孩子信心，把家长拉到 “我们一边”，比如：孩子之前的努力您也看到了，咱们一起盯好。\n","把这件事变成家校协同，而不是我们单方面推销课程。\n\n","给大家串一遍完整示范，比如家长说：我担心孩子太小学不会。\n\n","1. 共情：您这个担心特别正常，我特别理解。\n","2. 聚焦：您最担心的是孩子跟不上，坐不住吗？\n","3. 解决：咱们课程是低龄孩子专属的实操设计，课堂上老师会一步步引导，课导课后跟进反馈，平时您只需要提醒孩子按时上课就可以。\n","4. 赋能：孩子本身好奇心很强，咱们一起陪着他慢慢入门。\n\n","记住顺序：先共情稳情绪，再聚焦抓重点，再给方案解顾虑，最后赋能树信心。\n","跳过前两步，上来直接讲方案，家长听不进去。","来做一道判断题：异议处理中跳过共情和聚焦、上来直接讲方案，会发生什么？"],"durs":[10.632,2.112,9.192,5.952,2.4,6.312,6.048,8.496,2.496,11.064,4.512,2.112,11.064,5.496,6.24,4.56,5.16,13.176,6,8.016,4.608,7.656]},"P27":{"sents":["这部分给三个最高频的异议，按四步框架给出参考应对。","第一个，老师，孩子有事上不了课，能请假吗。","共情：计划赶不上变化很正常。","聚焦：问清楚是一次性的冲突，还是经常性的时间问题。","解决：能调课的提前报备调课，同时讲清楚缺课对学习连续性的影响。","赋能：咱们尽量保证出勤，孩子跟得上，效果才看得到。","第二个，我担心孩子坚持不下去，做事三分钟热度。","共情：很多孩子一开始都这样，不用焦虑。","聚焦：问一下之前放弃是因为没兴趣，还是没成就感。","解决：直播实操加教具作品，让学习成果看得见，老师每周反馈、及时鼓励。","赋能：前三周咱们一起帮他闯过新鲜期，表现好还能选上好苗子重点培养。","第三个，课程时间太长，怕孩子消化不了。","共情：怕孩子累着，这个想法特别贴心。","聚焦：是担心单次课太长，还是整期的强度。","解决：单次课时长是按孩子专注力设计的，中间有节奏安排，作业量也可控。","赋能：先按课表上两周，我盯着反馈，有问题咱们随时调。","最后强调一句，以上是参考思路，实际话术要按孩子的情况灵活调整，框架不变，内容随机应变。"],"durs":[5.592,4.68,3.528,5.688,7.32,5.664,5.184,4.272,5.52,7.92,7.752,4.44,4.296,4.776,7.776,6.024,9.336]},"P28":{"sents":["接下来我们看成交三性，这是咱们所有家长沟通、异议处理最后的落脚点。","不管家长提什么问题，像担心孩子坚持不下来、上课时间不合适、想再等等、或者纠结要不要报，我们先用前面的四步框架把顾虑化解完，最后一定要收回到这三个核心点上。\n\n","首先是重要性，也就是为什么要学编程。\n","很多家长心里最根本的疑问就是：学这个到底有啥用，是不是单纯玩？","咱们要讲清楚，编程不是兴趣消遣，它贴合新课标方向，看重的是逻辑、拆解、推理这些底层思维。","这种思维能力，不是只用来写代码，它能帮孩子理清思路，对数学、理科的审题、解题都有正向帮助，是可以迁移到其他学科、长期受益的能力，让家长明白这件事是有价值、值得投入的。\n\n","然后是紧迫性，为什么一定要现在这个年龄段学。\n","不是催家长报名，而是客观讲孩子的成长特点。","咱们这个阶段，正好是逻辑思维塑造的黄金窗口期，孩子好奇心强、愿意动手尝试，入门接受度高，更容易建立自信和兴趣。","如果往后拖，等到年级升高，校内作业变多，文化课压力上来，各类补习班、兴趣班排得满满当当，孩子的空余时间会越来越碎片化，到那时候再想新开一门编程，时间挤不出来，孩子也很难沉下心去学。","早启蒙，早积累，越往后越被动。\n\n","最后是唯一性，为什么选核桃，而不是别的地方。\n","市面上能学编程的机构不少，但完整配套的体系很少。","咱们是直播实操课，不是单纯看录播；","专门设计了护眼模式，照顾长时间线上学习的孩子；","同时打通了完整的赛考通道，从日常学习到赛事、等级测评，一条路能走通；","再加上稳定的师资团队、标准化的课后跟进服务。","直播实操 + 护眼设计 + 赛考通路 + 配套服务，这一整套组合优势，不是随便一家机构都能配齐的，这就是我们独有的优势。\n\n","给大家一个简单好记的口诀：重要性讲值不值，紧迫性讲能不能等，唯一性讲在哪学最合适。"],"durs":[7.056,15.504,4.248,6.84,9.696,17.496,4.608,4.8,11.832,19.104,3.768,4.68,5.4,3.84,5.136,7.344,4.848,11.496,8.712]},"P29":{"sents":["接下来我们进入第五章，红线与质检。","前面我们学了沟通方法、异议处理、成交逻辑，这些是帮我们把沟通做好；","而这一章，是告诉大家什么绝对不能做、通话怎么考核，守住底线，避免违规扣分。\n\n","这一章我们会围绕四块内容展开：通话四不、质检扣分点、注意事项、考核标准。\n","很多新人前期沟通话术练得很好，但踩了红线，一通电话直接作废，甚至影响考核成绩，非常可惜。","所以这一块大家一定要记牢，它是我们所有通话的安全底线。\n\n","“通话四不” 是我们的基础行为准则，是绝对不能触碰的；\n","质检扣分点，会告诉大家日常通话里哪些小问题会丢分，比如夸大承诺、回答不规范、态度生硬；\n","还有日常沟通里的各类注意事项，比如信息怎么说、赛事政策怎么表述，不能随意承诺；\n","最后是整套考核标准，大家清楚自己的通话会按照什么维度打分，知道怎么做才能拿到合格、优质的通话"],"durs":[3.912,7.176,7.992,8.064,9.672,5.52,4.992,9.744,8.04,10.104]},"P30":{"sents":["这一页是通话的四不红线，每一条都直接挂钩质检。","第一，不聊敏感话题。","和家长沟通要有边界感，可能引起争议和误会的话题一律不碰，比如家庭私事、对其他机构的评价、内部薪酬这些。","第二，不夺命连环问。","不要连续问一大串问题，每问一个，先等家长的回应和反馈，再问下一个。","记住，首通不是审讯。","第三，不垄断话语权。","沟通是双向互动，如果你发现自己有大段的输出，立刻停下来，互动一句，您对课程还有什么想了解的呀。","第四，不过度承诺。","对方提的要求你做不到，就不要硬说我可以，答应了又做不到，只会更伤感情。","所有的承诺都要留有余地，比如用我尽量、我争取、我帮您协调，这样的说法。"],"durs":[5.064,2.616,11.016,2.544,6.816,2.616,2.64,9.672,2.376,7.008,7.584]},"P31":{"sents":["接下来我们看质检扣分清单，这是大家通话之后打分的直接依据，每一条都和我们的通话成绩挂钩，我们一条一条拆开讲清楚。\n\n","第一点，漏必做动作。\n","首通电话有几个硬性动作：加微信、核对快递地址、确认首次上课时间、约小灶课。","这几项是规定动作，缺一项就扣一项分，不是说聊得好就可以跳过。","很多新人光顾着和家长沟通、讲课程，最后忘了约小灶或者没核对地址，话术再好，照样扣分。\n\n","第二点，信息未落表。\n","通话里问到的孩子年级、基础情况、家长诉求这些信息，聊完一定要及时录入学生信息表、学期表。","记住规则：不落表，视同没有采集。","哪怕你电话里问得很全，但是后台没有记录，质检的时候直接判定这项没完成。\n\n","第三点，触犯四不红线，这个是从重扣分的，一定要重点警惕。\n","包含四类情况：聊敏感话题、连环发问一直逼家长、自顾自大段输出不给家长说话机会、承诺自己做不到的事情。","红线问题和普通扣分不一样，一旦踩中，扣分力度会大很多，大家一定要管住自己的表达节奏，不随意许诺。\n\n","第四点，顺序错乱。\n","流程顺序属于质检硬指标。","比如刚接通，还没自我介绍、建立信任，上来就索要信息；","或者还没给家长讲清楚配套服务，一上来就催促家长配合上课。","流程颠倒，家长体验差，同时直接判定扣分。\n\n","最后底部给大家一个非常实用的自检方法：\n","每次挂断电话之后，对照六步流程 + 课后动作，自己回放核对一遍：每一步有没有做完、信息有没有及时落表、刚刚有没有许下无法兑现的承诺。","养成挂机自查的习惯，能帮我们避开绝大多数扣分。\n\n","简单总结：必做动作不能少、采集信息要落表、红线内容绝不碰、沟通流程不乱序，打完电话主动自检，稳定拿到合格通话。","来看一道题，每次挂断电话后的自检方法是？"],"durs":[11.328,2.616,8.664,6.264,9.312,2.64,9.768,3.888,7.368,6.12,10.968,9.912,2.544,3.192,5.736,6.384,4.944,4.032,13.248,5.04,11.976,4.464]},"P32":{"sents":["最后一部分，看一下我们的考核标准。","接下来我们看整张通话的打分表，总分 100 分，分成四大板块，每一块各 25 分：流程、规划、表达、答疑，总分低于 60 分就是不合格通话。","咱们先把四个维度分别讲清楚，再看不同分数段的要求。\n\n","第一个板块：流程，25 分。\n","重点考察通话的完整性、信息准确性。","我们开场介绍、信息确认、用户挖掘、学习规划、总结强调这一套流程要走全；","开课时间、上课周期、设备、赛考这些关键信息，绝对不能说错。\n\n","- 0–14 分：流程缺步骤，或者用词、信息出错，内容啰嗦反复；\n","- 15–20 分：流程完整，没有知识点错误；\n","- 21–25 分：流程完整干净，语言简洁，还能根据情况做合适的补充。\n\n","第二个板块：规划，25 分。\n","考察大家能不能讲明白核桃的课程体系，课程之间的衔接、学习周期、赛事规划，并且结合孩子的情况、家长期待，给出适配的学习路线，这也是高分的分水岭。\n\n","- 0–14 分：能提到体系，但讲得卡顿、不顺畅；\n","- 15–20 分：可以顺畅讲清课程和赛事规则；\n","- 21–25 分：自然过渡到体系和赛考，自信流畅，还能根据孩子的情况，定制专属的学习、赛事路径，吸引家长。\n\n","第三个板块：表达，25 分。\n","电话沟通看不到表情，语气、节奏就是我们的门面。","核心要求：信息准确传递、和家长建立连接，拉近距离。\n\n","- 0–14 分：语气冷淡，有盘问感、敏感话题、磕绊严重、语速混乱；\n","- 15–20 分：表达清晰通顺，有少量口误，但不影响理解，语气有起伏；\n","- 21–25 分：语气热情，应答流畅，表达利落舒服。\n\n","第四个板块：答疑，25 分。\n","考验我们的异议处理能力，不是生硬背话术，是听懂诉求、妥善回应。\n\n","- 0–14 分：没读懂家长诉求，回应生硬，没有解决问题；\n","- 15–20 分：有回应，但是没有完全打消家长顾虑；\n","- 21–25 分：稳稳解决家长疑问，还能挖掘家长深层需求，给到可行建议。"],"durs":[3.552,13.92,5.352,3.288,4.128,8.04,6.792,6.888,4.536,7.44,3.312,15.072,5.28,4.92,11.304,3.36,5.232,5.976,7.296,7.536,5.952,3.384,6.648,5.904,5.328,7.92]},"P33":{"sents":["最后把通话注意事项汇总成七条，也是首通的完整行为规范。","第一，笑着打电话，声音是有感染力的，家长隔着电话能听出来你的状态。","第二，先跟后带，先顺着家长说，再带出自己的建议，不反驳，不争论。","第三，一次只问一个问题，问完等回答，家长答完了可以简单回应一下，再问下一个。","第四，重要信息即时记录，学期表和信息表随打随填，不要考验自己的脑子。","第五，家长时间不合适就约，开车、做饭、带娃的时候主动约一个二次拨打的明确时间。","第六，承诺留余地，做不到的不硬答，用我帮您协调、我确认之后回复您这样的话替代。","第七，也是最容易忘的一条：首通的目标不是卖课，是建立信任、采齐信息、铺垫课程，后面的事情后面做，不要在首通里着急推任何东西。"],"durs":[5.952,7.128,7.128,7.896,7.608,8.544,7.824,13.008]},"P09":{"sents":["第一步，热情开场。","给一段参考话术：XX爸爸或者妈妈您好，我是核桃编程的课导老师，我姓xx，后面咱们孩子学编程，主要就是我来进行服务和跟进。","今天给您打这个电话，一是恭喜咱们孩子的课程已经开通了，二是跟您同步一下接下来上课的安排，大概占用您几分钟。","这一步里面藏着三个必须完成的任务，大家一定要记牢。\n","第一，亮明身份，告诉家长你的姓氏和岗位；\n","第二，确认接电话的人，是不是孩子日常主要对接、负责上课的监护人；\n","第三，直白说明我们打电话的目的，还有大概需要多久。\n\n","这里有个很关键的技巧，就是目的前置。","我们先提前告诉家长，这通电话要聊哪些内容、大概占用多长时间，家长心里有预期，才愿意安心跟我们继续沟通，不会中途着急挂断。\n\n","同时还有几个细节需要留意：打电话的时候语速放缓、平稳，不用讲太多复杂信息。","如果接通之后，发现家长正在开车、做饭，不方便长时间通话，不要硬聊，主动跟家长约一个方便的时间，再回拨。\n\n","另外，开场直接定下整通电话的情绪基调。","打电话的时候状态放松、面带微笑，声音听起来会更有亲和力、感染力，家长第一感受也会更好。\n\n","开场这一步做好，我们身份立住了，家长放下防备，后面我们再继续加微信、核对信息，沟通起来就顺畅很多。","讲完开场，接下来我们进入第二步，课程确认。"],"durs":[2.376,12.552,10.536,5.16,4.704,6.84,5.472,3.816,12.672,8.112,10.872,4.464,9.768,10.584,4.752]},"P14":{"sents":["接下来我们来到首通的第六步：小灶预约，也就是课前 1V1 对接，这也是咱们整通首通电话非常关键的落地动作。\n\n","先看参考话术，大家可以这样跟家长沟通：\n","我还没有和宝贝正式认识呢，您看什么时候方便，我先给宝贝约一次课前一对一的直播小灶课。","一方面我提前和孩子熟悉一下，另一方面带着孩子了解咱们要学什么、怎么学，帮宝贝建立基础的编程认知。","我今天还有 3 场小灶名额，您看您和孩子哪个时间合适？\n\n","首先我们先明确小灶课的定位：它不是正式的一次课，是首通电话的落地动作。","正式课程还没有开启，我们借着这次一对一的机会提前和孩子见面。","我们可以近距离熟悉孩子的性格、接受节奏，孩子也能提前认识我、适应我的引导方式。","同时我会给孩子简单介绍课程内容，帮孩子建立对编程的认知，减少正式上课的时候陌生、紧张的感觉。\n\n","这里有一个很实用的技巧，用名额法制造合理的紧迫感：跟家长说明今天剩余的小灶名额有限，像话术里提到的，我今天还有 3 场名额，适度的稀缺感，更容易推动家长当场敲定时间，而不是一直往后拖延。\n\n","在敲定小灶时间之后，我们顺带做收尾确认：还没有通过微信好友的，提醒家长及时通过申请；","还没有登录客户端的家长，提醒补充硬件地址，这里只需要确认大致位置，不用追问过于详细的信息，同时和家长约定好下载客户端，不管是教具发货还是后续上每一次课，都需要用到学号和客户端。\n\n","最后用结束语收尾：那今天咱们就沟通到这儿啦，之后有任何问题，您随时微信或者电话找我哈。\n\n","大家要记住，首通前面聊了很多信息、铺垫了期待，最终的落脚点就是约上这一场小灶课。","如果小灶没有约成功，前面很多沟通的价值就打折扣了，所以这一步一定要主动推进、抓住机会敲定时间。\n\n","到这里，六步首通电话的话术我们就全部拆解完毕，接下来我们就可以梳理通话结束之后，挂机要完成的配套动作。"],"durs":[11.088,4.176,7.896,10.152,5.256,7.296,6.288,8.136,10.008,18.648,8.832,17.784,8.952,8.4,9.984,10.608]},"P15":{"sents":["接下来我们来到首通电话的收尾环节：温馨提示说再见。","这一步是整通电话的收尾三件套，顺序千万不能乱，顺序是：留言环节 → 政策浅铺 → 确认时间，全部说完之后再挂机，家长听到的最后内容，直接决定这通电话在他心里的整体感受。\n\n","我们先拆开看这三件套：\n\n","第一个，留言环节。","邀请家长帮忙给孩子带一句鼓励或者寄予期待的话。","咱们可以这样引导：等下咱们通话结束，您可以和宝贝说一句鼓励的话，比如期待他在编程课里动手创造、多多思考。","家长挂完电话之后，大多会主动把这份期待转述给孩子，孩子提前就会对课程、对我们老师产生期待，从一开始就建立正向的学习心态。\n\n","第二个，政策浅铺。","这里只做轻铺垫，不展开深挖。","像编程纳入课堂、对应的赛考通道这类信息，一句话带过就好，不用长篇讲解政策细节、不用当场做规划。","参考话术：后续咱们跟着学习，也会对接上编程相关的赛考通道，给孩子多一条发展路径。","这块内容留到后面小灶、后续跟进的时候再详细讲，首通里只种下这个印象，讲多了容易给家长造成压力。\n","第三个，确认时间。","临挂机前，我们再复盘核对一遍首次上课的信息，明确是几号、几点，敲定由谁来提醒孩子，责任落到具体的人身上。","避免后续出现记错时间、没人提醒、错过一次课的情况。","大家可以这样说：咱们再最后确认一下，咱们第一次上课是 X 号 X 点，到时候是您提醒宝贝准时进课堂，对吧？\n\n","这里再跟大家强调一遍顺序的重要性：先做留言，传递温度，拉近距离；","再做政策浅铺，拔高价值感；","最后确认时间，把最核心、最刚需的上课信息锁定，规避出勤风险。\n\n","收尾整套连贯话术参考：\n","也麻烦您之后跟宝贝带一句鼓励的话，期待他在编程里多多动手尝试。","另外跟您简单提一句，现在编程也逐步走进课堂，后续咱们学习也会对接正规赛考通道，给孩子多一个锻炼方向。","咱们最后再确认下，咱们第一次上课是 X 号 X 点，到时候由您这边提醒宝贝准时上课哈。\n\n","收尾语气要温和自然，不要急促，说完三件套，再礼貌道别。\n","这个收尾环节，前面我们铺垫的信任、规划、期待，在这里稳稳收住，给家长留下专业、贴心、有条理的印象。","来看一道题，收尾三件套的正确顺序是？"],"durs":[5.712,16.944,2.544,2.424,4.968,10.728,12.552,2.4,3.24,10.056,8.568,10.128,2.424,10.944,5.496,10.416,7.056,3.264,6.888,2.928,6.864,10.224,8.712,6.096,10.512,4.08]},"P25":{"sents":["这一页讲怎么听懂家长话里的心声。","很多新人沟通，只会盯着家长字面的问题去回答，答完之后发现家长还是不放心。","核心原因就是：没有读懂这句话背后藏着的真实想法。\n","这里有一个核心原则：先回应他藏在里面的担心，再回答表面的问题。\n\n","我们一条一条来看：\n","第一句，家长问：孩子上一次课学多久啊？\n","字面是问时长，真正担心的是：上课时间太长，伤眼睛、孩子坐不住、专注力跟不上。\n","那我们回应的时候，就不能只说 “一节课 XX 分钟”，要讲清楚：课程时长是专门适配孩子专注力设计的，还有护眼安排、中途休息，打消他视力和坐不住的顾虑。\n\n","第二句，家长问：你们老师带班带多久了？\n","表面是问教龄，真实顾虑是：害怕老师是新手、不专业，怕没人跟进孩子学习。\n","我们的回应方向，重点给到确定性：讲老师带班经验，同时把整套服务机制说出来 —— 每周反馈、课上答疑、全程跟班，让家长放心，不是只靠老师个人。\n\n","第三句，家长说：我们家孩子平时表现可棒了。\n","这句话不是单纯闲聊，家长的内心期待是：希望老师能看见孩子、多肯定、多鼓励孩子。\n","我们就要顺着夸奖孩子的具体行为，并且给到承诺：课堂上会多给孩子展示、表达的机会。\n\n","最后记住要点：\n","家长随口的一句话，背后都带着一个具体的担心或者期待。","沟通顺序一定是：先接住内心的担心，再回答字面问题。","只答字面，家长的顾虑还在，沟通就很难推进。"],"durs":[3.528,7.704,5.28,6.432,2.016,4.2,8.544,14.88,4.272,8.088,14.4,4.944,8.664,8.28,1.92,5.52,5.616,4.92]},"P34":{"sents":["到这里，我们整套首通电话的培训内容就全部讲完了，最后这一页，是给大家落地执行的行动清单，分四块，清晰好记。\n\n","第一，现在立刻要做的任务：\n","把六步流程默写一遍：开场→课程确认→信息确认→学情摸底→人设要求→收尾，同时把挂机之后的记录动作一并写上去。","默写不是走形式，目的是让大家把流程刻进脑子里，打电话的时候不用翻笔记，顺序不乱、动作不漏。\n\n","第二，本周落地要求：\n","大家第一批首通电话，严格对照今天这套课件标准去执行。","每一通打完，马上自检：六步流程是不是全部走完了、采集到的信息有没有及时落表。","自检就是帮大家规避质检扣分，养成习惯。\n\n","第三，求助规则，这条大家一定要记住：\n","通话当中如果话术卡住、遇到陌生异议接不住，不要自己硬扛、不要随口乱承诺，随时飞书找师父或者主管求助。","我们是团队带教，允许请教，不允许硬撑着说错话、踩红线。\n\n","最后是核心总结，也是我们首通电话的底层定位：\n","首通是服务电话，不是通知电话。\n","我们打电话的目标，不是简单通知上课，核心是三件事：和家长建立信任、完整采集孩子学情信息、给家长铺垫课程价值。","沟通的时候保持轻松的状态，笑着打，用好我们前面学的先跟后带，通话结束逐项把信息落表。\n\n","今天所有的流程、异议处理、成交逻辑、红线质检，最终都落到这几句话、这几个行动上。","接下来大家就按这个标准去练习。"],"durs":[11.304,3.024,11.784,9.648,2.592,5.904,8.208,4.656,4.488,10.8,6.192,4.752,3.432,11.616,9,8.448,3.504]},"P35":{"sents":["这一页是咱们首通电话结束之后，发给家长的跟进反馈话术，也是电话沟通的延续，用来巩固信任、承接后面的试听课，大家好好把握这个细节。\n\n","我们先拆解这段话术的思路：\n\n\n","XX 妈妈，我备注好啦！","您也希望孩子这次好好学，咱们零基础起步，我会从最基础的内容循序渐进带他，最后教 XX 完成 4 个智能硬件作品。","您说对编程了解的不是特别多，这次上课咱们通过宝贝的表现看效果。","宝贝一边学，咱们一边了解！\n\n","首先，第一句“我备注好啦”，是给家长安全感，告诉家长刚刚电话里聊到的情况我都记下来了，不是听完就忘，体现我们的细心。\n","接着，接住家长的期待：知道家长希望孩子好好学，同时点明孩子是零基础，打消家长担心课程太难、跟不上的顾虑，强调循序渐进，降低焦虑。\n","然后抛出清晰的成果预期：可以完成 4 个智能硬件作品，给家长一个看得见、摸得着的学习目标，让家长知道这节课不是单纯听理论，是有产出的。\n","最后共情家长：家长本身对编程不熟悉，我们不强行灌输，约定好，跟着孩子课堂表现一起看效果，一边学一边了解。","姿态很温和，没有压迫感，很贴合咱们 “先跟后带” 的沟通原则。","来看一道题，跟进反馈话术第一句「我备注好啦」的作用是？"],"durs":[13.08,2.856,2.88,11.232,6.624,2.976,11.328,14.064,13.32,11.016,5.88,5.064]},"P07":{"sents":["进入第二部分，首通全流程。","这部分是今天的重点。","整个首通分为六步，顺序是经过验证的，不能乱：先开场建立身份，再确认课程信息，然后确认孩子的基本情况，接着摸学情挖需求，再立老师人设、提学习要求，最后小灶预约和温馨收尾。","挂了电话之后还有记录和留存的动作。","大家先把顺序记住，后面我们逐步拆每一步的话术。"],"durs":[3.168,2.472,18.024,3.816,5.064]},"P08":{"sents":["接下来我们进入首通全景，整体就是六大通话步骤，再加挂机之后的配套课后动作，一环扣一环，顺序不能调换。\n\n","首先第一步，热情开场。","我们上来先自我介绍，清晰告诉家长我是谁、打电话的目的：我是接下来六周全程带孩子上课的带班老师，今天这通电话，主要是跟您对接课程，同步后续全部的学习安排，先把身份立住，让家长知道我们不是随便的推销电话。\n\n","第二步，课程确认。","这个环节最核心的一件事，就是引导家长添加微信，微信是我们后续长期沟通、发资料、跟进学习最主要的渠道，一定要在这个环节加上。","同时和家长核对课表，确认上课时间，还要核对教具快递收货地址，避免后续教具发错、收不到，耽误孩子上课。\n\n","第三步，信息确认。","我们要核实关键信息：孩子的年龄、平时对接的主要负责人、家里用来上课的设备情况。","设备这块一定要重点检查，提前排查设备能不能正常运行，避免等到开课当天，才发现设备不兼容、用不了，导致孩子没法正常上课。\n\n","第四步，学情摸底。","到这里我们就要深挖信息了，了解孩子之前有没有接触过编程、基础怎么样，孩子对编程的兴趣高不高，同时倾听家长的想法、顾虑和期待，把这些需求都挖出来，方便我们后续针对性服务。\n\n","第五步，人设和上课要求。","跟家长讲清楚咱们的上课风格，是耐心引导型，还是偏严格督促的类型，让家长提前熟悉你的带班方式；","同时同步上课规则，强调按时出勤的重要性，提前给家长建立上课的预期。\n\n","第六步，小灶预约和温馨收尾。","对本次通话简单复盘，给到家长安心感，浅浅铺垫后续的安排，埋下钩子，方便我们之后继续跟进。\n\n","通话结束，挂机之后的动作，同样非常关键，千万不能打完电话就放一边。","我们要马上更新学生信息表，把刚刚沟通收集到的家长诉求、孩子情况补充完整，给家长发送配套资料，并且发文字确认，最后及时填好学情记录表。","大家一定不要只靠脑子记，信息多了很容易遗忘、记错。\n\n","这里有两个关键点，大家一定要刻在心里：\n","第一，通话顺序绝对不能乱。","我们要先介绍自己、建立身份，再去收集各类信息；","先跟家长讲我们能提供什么服务，再提上课相关要求。","一旦顺序颠倒，家长的防备和防御心马上就上来，沟通就很难推进。\n","第二，每一步都有它对应的任务，不是随便聊聊：开场用来建立身份，信息确认用来规避后续出错，学情摸底用来方便因材施教、分班服务，打造人设是为了积累信任，收尾是为后续跟进留下钩子。\n\n","一句话总结：电话里的沟通很重要，但电话结束之后的信息录入工作，和通话本身同等重要。","如果聊完之后信息没有落到表格里，没有记录留存，那这一通首通，基本就等于白打了。","来看一道题，挂机之后的配套动作是？"],"durs":[10.704,2.832,20.232,2.4,12.744,11.16,2.472,8.064,12.84,2.52,17.016,3,9.744,7.464,3.384,9.36,7.056,14.136,5.712,4.008,3.192,5.112,5.352,6.696,18.312,8.832,8.016,3.768]},"P04":{"sents":["我们进入第一部分，先来搞清楚：什么是首通。\n\n","首先我们切换到家长的视角来看：家长刚付完费用，这个阶段对我们是处于半信任的状态。","钱已经花出去了，但是课程还没有开始上，心里一边抱有期待，一边也会有各种各样的顾虑。\n\n","所以首通的本质，就是家长购课之后，我们打出的第一通服务电话。","我们要在这通电话里完成信息确认、自我介绍、讲清楚课程安排，提前帮家长化解心里的顾虑。\n\n","大家一定要记住，我们和家长的第一印象只有一次。","通话里你的声音状态、专业度、安排的条理性，家长都会在这一通电话里感知到，这也是家长建立对我们信任感的关键。\n\n","咱们的中价课，在体验课赛道里属于高客单价。","愿意花这个费用报名体验课的家长，本身对孩子学习编程这件事，期待和重视程度是很高的，对应的，他们对我们的服务体验标准也会更高。\n","首通的通话质量，不只是影响家长感受，还会直接关联后续孩子的出勤、完课情况，以及家长的信任度，最终也会影响我们后续的业务结果。\n\n","讲完什么是首通，接下来我们就来看，首通对于家长、对于我们带班老师，分别有什么样的价值。","来看一道题，刚付完费的家长处于什么状态？"],"durs":[4.44,8.376,8.136,6.384,9.192,4.896,10.896,4.752,12.792,12.936,8.52,4.44]},"P12":{"sents":["接下来我们进入首通第四步：学情摸底，核心就是摸清孩子的编程基础、兴趣来源，还有家长的学习期待，这一步是我们做到因材施教的关键。\n\n","大家先看参考话术，我们可以这样自然地和家长沟通：咱们宝贝之前接触过编程吗？","是自己平时喜欢折腾这些，还是看到别的小朋友学也想试试呀？","他在学校里成绩怎么样，特别喜欢哪门课呀？\n\n","这一步我们要落实摸底三问：\n","第一，询问孩子的编程基础，确认孩子之前有没有接触学习过、学过哪一类内容；\n","第二，挖掘兴趣来源，分清是孩子本身自发感兴趣，还是家长主动规划安排学习；\n","第三，了解校内成绩情况和孩子偏好的学科。\n\n","这里重点提醒大家，挖到需求之后一定要继续深挖，不要浅尝辄止。","举个例子，如果家长说报课主要是想锻炼孩子的逻辑思维，我们就顺势追问一句：那您最想先帮孩子改善哪一方面呢？","是做题思路、专注力，还是解决问题的习惯？","家长说得越具体，我们后续的服务方向就越清晰，才能精准对症下药。\n","同时我们也可以顺带问问孩子对图形化这类编程语言有没有了解，用来判断后续和家长沟通时，要不要使用专业术语，避免讲得太深家长听不懂，或者讲得太浅达不到家长预期。\n\n","大家一定要记住，学情摸底不是随便闲聊拉家常，我们收集到的每一条信息，都有明确的用处：这些信息会直接决定我们后续小灶课的内容设计、每一次课之后的课堂反馈怎么写，还有后续我们怎么给家长做长期规划、铺垫续报。\n","右侧就是我们用来记录信息的学情表，沟通当中问到的内容，要实时记录进去，把孩子画像完整搭建起来，后续所有服务动作都可以对照这份学情表开展。","来看一道题，家长说「想锻炼思维」，正确的做法是？"],"durs":[13.224,7.368,5.832,4.056,2.976,7.728,8.328,4.848,6.432,10.584,4.488,6.816,16.104,20.664,13.752,4.944]},"P18":{"sents":["接下来我们进入第三章：信息采集与摸底铺垫。\n","这一章，是咱们首通电话里承上启下的核心板块，里面包含四大模块：采集清单、摸底提问、编程认知铺垫、家长关注地图。\n\n","很多老师打电话容易犯一个问题：想到哪问到哪，提问零散，聊完之后关键信息缺漏，后面没法精准服务。","这一章就是帮我们把学情摸底标准化，我们不是随便聊天，是带着目标、带着清单去采集信息，搭好孩子和家长的完整画像。\n\n","首先是采集清单，也就是我们要收集的全部信息项，前面我们学情摸底环节用到的内容，都在这个清单里：孩子编程基础、过往学习经历、兴趣来源、校内成绩、学科偏好、家长核心诉求、对图形化的了解程度等等。","清单就是我们的检查项，避免通话结束才发现漏掉关键信息。\n\n","第二块是摸底提问，也就是我们的提问话术和追问逻辑。","重点记住：听到家长笼统的需求，一定要深挖。","比如家长说想锻炼思维，我们不能停在这里，要继续追问，把模糊的期待变具体。","提问是有顺序、有节奏的，先了解孩子，再挖掘家长的真实想法，不是一连串审问式提问，是自然沟通。\n\n","第三块是编程认知铺垫。","我们会借着提问，判断家长和孩子对编程、图形化的认知深浅。","如果完全零基础，后面沟通就少用专业术语；","如果之前接触过，我们就可以适度拔高，聊对应的赛事、进阶方向，对齐家长认知，避免沟通错位。\n\n","第四块是家长关注地图，简单来说，就是把家长的诉求分类标记好：有的家长看重思维能力、有的看重校内辅助、有的看重竞赛升学、有的只是孩子单纯感兴趣。","我们把关注点标注清楚，这张 “地图”，就是后面小灶授课、课堂反馈、续报铺垫的方向。\n\n","大家要明白，摸底铺垫，不是为了收集信息而收集。","我们所有的提问、记录、判断，最终都是为了找准家长的关注点，做到因材施教、精准服务。","这一章吃透，我们的学情摸底就不会浮于表面，沟通更有抓手，而不是漫无目的闲聊。"],"durs":[4.872,12.072,10.056,11.304,19.8,6.192,5.256,4.632,7.656,9.984,2.808,6.408,4.776,9.456,14.952,8.256,5.016,8.736,7.92]}},"v":{"slides/P01.jpg":"145168d3","slides/P01.png":"afca1d25","slides/P02.jpg":"eafcc16c","slides/P02.png":"ce1b7b9a","slides/P03.jpg":"745aeb15","slides/P03.png":"25e44347","slides/P04.jpg":"61b84aef","slides/P04.png":"dd892a52","slides/P05.jpg":"df6bf87d","slides/P05.png":"bd670d92","slides/P06.jpg":"22b75a71","slides/P06.png":"b3471306","slides/P07.jpg":"b0711085","slides/P07.png":"cb80fa72","slides/P08.jpg":"1b634be2","slides/P08.png":"66cd6f8f","slides/P09.jpg":"9ec018c0","slides/P09.png":"386907e1","slides/P10.jpg":"a6e0dde6","slides/P10.png":"a9a26d96","slides/P11.jpg":"a718c996","slides/P11.png":"095c45ec","slides/P12.jpg":"b69aeae6","slides/P12.png":"b7451bf5","slides/P13.jpg":"30d9a32e","slides/P13.png":"8ed1a152","slides/P14.jpg":"f9bb2d25","slides/P14.png":"5e45dbc7","slides/P15.jpg":"e61c3c93","slides/P15.png":"66ed08d0","slides/P16.jpg":"824f1a0e","slides/P16.png":"4f61cb69","slides/P17.jpg":"affb3a51","slides/P17.png":"52265e53","slides/P18.jpg":"b6ccbb12","slides/P18.png":"722f3ad6","slides/P19.jpg":"a0f4722b","slides/P19.png":"8921cb43","slides/P20.jpg":"95378fab","slides/P20.png":"760a3480","slides/P21.jpg":"b2250134","slides/P21.png":"9fa8007f","slides/P22.jpg":"0da92ac3","slides/P22.png":"d5cf1df6","slides/P23.jpg":"48c3e2f0","slides/P23.png":"ddde3545","slides/P24.jpg":"20ac066e","slides/P24.png":"4cabf794","slides/P25.jpg":"0e31a9dd","slides/P25.png":"c96a0425","slides/P26.jpg" const PASS = 0.6; // 合格线：取自「合格线与重学规则」表「阶段合格线 60%」
const CFG = {"key":"中价_首通汇诚-v1","title":"首通电话全流程（汇诚）","short":"首通电话全流程（汇诚）","tag":"中价课 · 新人训","hero":"P01","titles":{"1":"首通的定位与价值","2":"首通全流程六步","3":"信息采集与摸底铺垫","4":"沟通技巧与异议处理","5":"红线与质检"},"depts":["国润","汇诚"]};
const KEY = CFG.key;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 课程结构 ---------- */
/* 部门 / SKU 可见性：标「通用」或未标的页所有人可见；带标签的页只有选中的部门/SKU 命中才显示（多选任一命中即可） */
const normTag = t => String(t||'').replace(/1部/g,'一部').replace(/2部/g,'二部').replace(/苍穹鼎/g,'苍穹顶').replace(/\s/g,'');
const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return (!CFG.depts || tagOk(p.dept, st && st.depts)) && (!CFG.skus || tagOk(p.sku, st && st.skus)); }
let STAGES = [];
function buildStages(){
  STAGES = [];
  for (const p of DATA.pages) {
    if (!pageVisible(p)) continue;
    let s = STAGES.find(x => x.name === p.stage);
    if (!s) { s = {name:p.stage, num:+(/阶段\s*(\d+)/.exec(p.stage)||[0,STAGES.length+1])[1], pages:[]}; STAGES.push(s); }
    s.pages.push(p);
  }
  for (const s of STAGES) s.quiz = DATA.qs.filter(q => /阶段练习/.test(q.type) && +(/阶段\s*(\d+)/.exec(q.chapter)||[])[1] === s.num);
}
let st = null; buildStages();
const TITLES = CFG.titles || {};
const FINAL = DATA.qs.filter(q => /综合测试/.test(q.type));

/* ---------- 学习记录（仅存本机浏览器） ---------- */
function fresh(){ return {name:'', team:'', sid:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), unlocked:0, heard:{}, passed:{}, tries:{}, best:{}, final:null, finalTries:0, view:'home', cur:{s:0,p:0}, stageSec:{}}; }
try { st = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e) { st = fresh(); }
buildStages();
// 恢复进度链接：#r=base64(JSON {k,sid,passed:[..],best:{..}})，只对本课 key 生效
let RESTORE=null; try { const m=/[#&]r=([^&]+)/.exec(location.hash); if(m){ const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))))); if(o.k===CFG.key) RESTORE=o; history.replaceState(null,'',location.pathname+location.search); } } catch(e) {}
function applyRestore(){ if(!RESTORE) return false; const o=RESTORE; RESTORE=null;
  st.sid=o.sid||st.sid; st.rowCreated=true;
  for(const i of o.passed){ if(!STAGES[i]) continue; st.passed[i]=true; STAGES[i].pages.forEach(p=>st.heard[p.p]=true); }
  st.unlocked=Math.max(st.unlocked, Math.max(-1,...o.passed)+1); Object.assign(st.best,o.best||{}); save(); return true; }
// 后台补进度：cfg.restore = {姓名: {passed,best,sid}}，每人只补一次（妙搭链接带不了 #r=）

function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}

/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid, course:CFG.short||CFG.title, date:nowStr().slice(0,10)}, ev, snapshot(online));
  { const CNm = CFG.short || CFG.title; if (!String(rec.stage||'').startsWith(CNm + '｜')) rec.stage = CNm + (rec.stage ? '｜' + rec.stage : ''); }
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});

function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');

  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }

  if (r) {
