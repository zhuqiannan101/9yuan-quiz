<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>首通电话全流程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}
</style>

<script>
const DATA = {"pages":[{"row":3,"stage":"首通电话全流程·阶段1","p":"P01","topic":"","script":"各位老师，这节课要给大家讲的是首通电话的全流程。这通电话，对我们和家长来说，都是非常重要的第一印象。 大家换位思考一下：一个孩子坐在教室里，人没有离开、没有跑出教室，是不是就代表这节课孩子听进去、有收获了？ 放到我们首通电话里也是一样：家长没有挂断电话，不代表我们这通电话就打好了、沟通有效。 ","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":4,"stage":"首通电话全流程·阶段1","p":"P02","topic":"","script":"先说清楚首通是什么时候打的：首通，是在家长付完钱之后，你作为课导老师和家长的第一通电话。咱们面对的家长，孩子已经在核桃学完了第一阶段六个月的课程，现在要进入第二阶段的图形化算法长期班。这些家长对编程、考级、赛事都有一定的认知，也已经习惯了上一任老师的风格。这时候来了一个新老师的电话，家长心里难免会掂量一下，这个新老师行不行？所以这通电话打得好不好，直接决定了家长对你的第一印象。打个比方，我今天上课穿一身温柔风的衣服，或者穿一身朋克风的衣服，大家对我的第一印象，自然就会往那个风格去靠。电话也是一样，家长看不到你，但能从第一通电话里听出来，你专不专业，温不温柔，细不细心。这些就是家长在首通里最在意的东西。所以今天这节课，咱们就按目录上的四个部分来讲：第一，首通的重要性；第二，首通前的充分准备；第三，首通流程与话术梳理；第四，首通的标准与要求。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":5,"stage":"首通电话全流程·阶段1","p":"P03","topic":"","script":"先来看第一部分，首通的重要性。除了刚才说的第一印象，这通电话还有哪些价值，让它非打不可？咱们一起来看。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":6,"stage":"首通电话全流程·阶段1","p":"P04","topic":"","script":"先说目的。首通的目的可以从两个角度来看，一个是对用户，一个是对老师。对用户来说，我们要做到三件事：第一，和家长建立信任关系；第二，让家长清楚咱们的课程是什么样的，老师的服务是什么样的；第三，针对性地解决家长的疑虑。比如二阶段的家长常会关心，换了新老师孩子能不能适应，接下来的算法课难不难，这些顾虑都要在电话里接住。对老师来说，核心目标也是三件事：第一，了解家长和孩子的基础信息；第二，挖掘孩子潜在的学习需求和痛点；第三，判断这个用户是什么类型的，弄清楚家长当初为什么给孩子报编程课。这里提醒一下，首通的目标里，没有当场说服家长续费这一条，也不是一上来就给孩子安排赛事获奖方案。那大家想一想，首通的价值体现在哪两个方面？","interact":{"q":"首通的价值体现在哪两个方面？","at":"P04","options":["用户、老师","学生、家长","课导、班主任","家长、主管"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":7,"stage":"首通电话全流程·阶段1","p":"P05","topic":"","script":"这道题答案是错，这通电话对家长同样有价值。目的清楚了，再具体看看首通能带来哪四个价值。第一，建立初步联系，构建信任基础。家长是带着期待报的课，这通电话就是你和这个家庭的第一次见面。第二，收集关键信息，精准挖掘真实需求。家长和孩子的基础信息都要收集，比如孩子几年级了，在学校成绩怎么样，性格怎么样。这些信息在之后带班的过程中非常有用，比如你要给孩子做赛事规划，或者到了一些关键节点，有了这些信息，你才能更清楚地回应家长的疑虑。第三，传递课程价值，塑造专业老师形象。要让家长感觉到，这个老师懂教育、懂孩子，把孩子交给这个老师是放心的。第四，规避试学风险，邀约见面会建联。二阶段开课的前几周是试学期，首通里要把可能存在的风险记录下来，后面才有机会提前干预，千万不能等到问题已经爆发了再处理。同时，在电话里把见面会邀约好，为后续和家长建立更紧密的联系打下基础。最后我要强调一句，这些家长已经花了几千块钱进了咱们的班，孩子也实实在在学了半年，他们已经认可编程的价值了。所以首通的核心任务，不是去告诉家长编程有多厉害、多有用，而是让家长相信，我能把孩子带好、教好，让孩子愿意持续学下去，为后续的续报打好基础。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":8,"stage":"首通电话全流程·阶段2","p":"P06","topic":"","script":"接下来进入第二部分，首通前的充分准备。老话说，不打无准备之仗。家长是带着期待报的课，如果你打过去，连孩子几年级、上一阶段学得怎么样、当初为什么报课都不知道，家长的第一反应就是，这个新老师不太靠谱。第一印象一旦打坏，后面很难挽回。尤其是二阶段的家长，已经和上一任老师相处了半年，心里自然会拿你和上一任老师做比较。所以准备工作，就是这通电话的地基。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":9,"stage":"首通电话全流程·阶段2","p":"P07","topic":"","script":"准备工作从哪里入手？核心原则就四个字，知己知彼。具体要做三件事。第一，复盘历史沟通轨迹。翻一翻这个用户过往的咨询记录，还有和上一任老师的聊天记录，梳理家长问过哪些细节、聊到过哪些节点，里面很可能藏着意向线索，或者还没说出口的异议。第二，回顾家长反馈记录。从反馈里找出这个家庭最核心的教育诉求，提前预判家长可能会问什么、顾虑什么、关注什么。比如家长之前反复问过考级的事，那首通里大概率还会问，你就得提前想好怎么接。第三，分析课程互动数据。看看孩子上一阶段的互动频次，锁定孩子的兴趣点在哪；再结合上课时长和互动数据，判断孩子是自信型还是内向型，是不是喜欢玩游戏，有没有不认真上课的情况。这三件事都必须在打电话之前做完，而不是电话接通了再临时去翻记录。页面下方这句话大家记一下：充分的前期准备，是高效沟通与信任建立的基石。好，来看一道题，“充分的前期准备”被称为什么的基石？","interact":{"q":"“充分的前期准备”被称为什么的基石？","at":"P07","options":["高效沟通与信任建立","续报转化","赛考规划","见面会邀约"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":10,"stage":"首通电话全流程·阶段2","p":"P08","topic":"","script":"没错，准备工作的核心原则就是知己知彼。原则讲完了，来看具体怎么操作。这些动作都要在通话前完成。我们的CRM系统里，可以看到家长和上一任老师沟通的基本情况，包括历史聊天记录、通话记录等等。看的时候重点盯两件事，一是警惕退费风险，二是看清家长的报课需求。具体看哪些地方呢？先看班级信息，包括当前所在班级、进出班记录，孩子之前上过几次课，还有通话次数、接通率、平均通话时长、聊天记录次数，这些都能查到。再看通话记录和聊天记录，能听录音就听录音，能看聊天就看聊天，重点看家长说过什么，上一任老师是怎么跟进的。举个例子，大家看截图里这组数据：通话25次，接通率88%，平均通话时长3分19秒；聊天累计343次，其中老师发了283次，家长只回了60次。这说明什么？说明这是一位比较被动、话不多的家长。那你这通电话就要多引导、多提问，而不是干巴巴地介绍课程。做完这些，你要达成的目标只有一个，让家长感觉到核桃编程前后衔接很靠谱，老师们会认真交接孩子的具体情况，报课之前有人管，报课之后更有人管，而且新老师能做得更好。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":11,"stage":"首通电话全流程·阶段2","p":"P09","topic":"","script":"大家要注意，每个家庭的诉求都不一样。有的家长想让孩子升学，有的想锻炼思维，有的就是先试试看。所以光准备还不够，还要甄别归类。看完沟通记录之后，要学会给用户分层，并且及时记录到学情表里。怎么分？我们可以根据自己掌握的轨迹信息，或者和上一任老师沟通，先做初步判断，大致分成三类。第一类，思维型。用户画像是普娃，家长追求的是孩子快乐成长、有可感知的进步，我们提供的是趣味编程学习和托管服务。第二类，混合型，也就是既要又要。用户画像也是普娃，家长兼顾兴趣和升学，需要看到可量化的成果、孩子行为上的改变，以及升学希望的证明。第三类，升学型。用户画像是牛娃，目标是顶级竞赛成绩和特殊升学的最优解，追求的是顶尖资源和效率。比如家长在上一阶段就反复问过比赛和考级，那就可能偏混合型或升学型。不过要注意，聊天记录和轨迹只能帮你做个初步判断，家长的真实想法，还得在首通里通过提问去确认。那大家想一想，思维型用户的画像是？","interact":{"q":"思维型用户的画像是？","at":"P09","options":["普娃，追求孩子快乐成长与可感知进步","普娃，兼顾兴趣与升学","牛娃，目标顶级竞赛成绩与特殊升学最优解","牛娃，追求快乐成长与趣味学习"],"answer":0,"answers":[0],"vote":false,"wrong":"仅弹正确提示继续\n正确提示：我们还需要自己跟家长来打电话了解情况切实的去分层，家长的需求是有可能会变动的"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":12,"stage":"首通电话全流程·阶段2","p":"P10","topic":"","script":"答案是不能，轨迹只能帮你初步判断。分完层，打完电话之后，一定要填写学情表，把了解到的信息记录下来，越细越好。我们手上的用户很多，不可能把每个家庭的诉求都记在脑子里。学情表填得及时、填得完整，任何时候你都能迅速查到这个家长的信息，做到任何阶段都知己知彼。后续入组之后，学部也会提供统一的模板，大家认真记录就可以了。来看一张真实合格的学情表。表头有用户ID、姓名、首通时间、首通录音、年级、性格、成绩、需求、上课设备、编程基础、风险预警重点这些字段。最右边两列是风险预警重点和高危用户，用红、黄、绿三种颜色标记。比如有个孩子，备注写的是孩子时间排满，课前直播来不及，第一次试课，风险预警标了黄灯。这类家长就要置顶微信，重点跟进，课上也要重点盯着孩子的状态，提前规避风险，多做一些额外的服务去维护。红灯代表的就是退费风险的用户，刚开始就提到退费，或者一直联系不上，上阶段就多次缺课，这些都是需要开课前额外多关注的用户。绿灯的家长正常维护就好，但也不能掉以轻心，家长的想法是会变的。这就是分层的意义，信息越全，你打电话的时候心里越有底。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":13,"stage":"首通电话全流程·阶段2","p":"P11","topic":"","script":"下面来看几个真实案例，都来自后台的录音和聊天记录。大家重点看，家长在和班主任的沟通里，会抛出哪些自己在意的点，或者希望老师重视的点。第一个案例，老师在给家长反馈孩子的课堂表现，说孩子评分优异，超过了班上大部分小朋友。结果家长回了一句，感觉现在专注力越来越差。这句话说明什么？说明家长很想提升孩子的专注力，担心孩子学习达不到想要的效果。这种时候，老师怎么回就特别关键。如果你是这个老师你会怎么做？","interact":{"q":"如果你是这个老师你会怎么做？","at":"P11","options":["继续夸奖孩子，不理会，家长听到夸奖就会放心。","接着家长的话回复专注力的问题。"],"answer":1,"answers":[1],"vote":false,"wrong":"直接继续"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":14,"stage":"首通电话全流程·阶段2","p":"P12","topic":"","script":"很明显，应该接着家长的话，去回应专注力的问题。来看这位老师是怎么做的。老师没有对家长的担忧置之不理，而是发出了第一课的知识点汇总，并且告诉家长，这些知识帮助宝贝理解了如何按照顺序执行任务，学会一步一步分析、解决问题，在生活中做计划、理步骤也会更清晰。这就把编程学习和家长关心的专注力、条理性联系在了一起。紧接着，家长又说孩子现在写字难看，阅读理解差，还有专注力和钻研精神不够。老师没有回避，用一段语音给出了回应：写字可以买些练习题让孩子去练；阅读理解差，其实背后是思维能力的问题，很多孩子读完之后没有做总结、做分析。老师针对家长的顾虑给出具体的建议，家长自然就安心了。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":15,"stage":"首通电话全流程·阶段2","p":"P13","topic":"","script":"再看一个案例，这是一通三十多分钟的通话录音。家长聊到夏天的期末考试，说本来以为孩子会考得很差，后来发现题都会做，就是马虎。老师马上接住了马虎这个点，从编程的角度解释：编程是一门非常严谨的学科，孩子但凡多写一个代码、少写一个代码，或者写错一个代码，整个程序就会出现bug，走不通，没办法再往下进行。通过这个解释，老师把编程和孩子的审题能力、细心程度联系了起来。所以请大家记住这两个案例的共同点：家长说什么，你就接什么；家长担心什么，你就给什么方案。千万不要自说自话。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":16,"stage":"首通电话全流程·阶段2","p":"P14","topic":"","script":"学会了怎么接住家长的顾虑，但信息总有不全的时候。如果准备阶段的信息就是不够，比如家长没怎么接过电话，也没怎么和上一任老师沟通过，但还是报了咱们的课，那怎么办？办法只有一个，在通话中用提问把信息补回来。核心原则是，善用开放式提问，挖掘关键细节。什么叫开放式提问？就是不问那种只能回答是或否的问题。封闭式问题，家长答完一句，你就不知道怎么往下接了，通话会很尴尬，信息也补不全。开放式提问，是引导家长从多个角度表达，把信息差补上。也千万别因为信息不够，就自己去猜家长的诉求。来看两个场景示例。场景示例一，背景摸底。不要问孩子之前学过编程吗，这种问题家长一句学过或者没学过就结束了。可以换成，孩子之前有没有接触过编程相关的内容、课程或者小游戏呢？接触过和学过是两个概念，家长会多说很多信息，你还能顺带了解孩子的兴趣程度。放到二阶段的家庭，也可以问，这半年学下来，您觉得孩子在哪些方面变化最明显？场景示例二，需求挖掘。不要问您希望孩子提升成绩吗，可以这样问，您希望孩子通过学习编程，在逻辑思维、动手能力或者其他方面，获得哪些具体的提升？你给家长几个方向，家长就更容易说出真实的期待，你也就知道这通电话后面该往哪里使劲。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":17,"stage":"首通电话全流程·阶段3","p":"P15","topic":"","script":"首通前的准备工作学完了，接下来是今天最重要的部分，第三部分，首通流程与话术梳理。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":18,"stage":"首通电话全流程·阶段3","p":"P16","topic":"","script":"前面我们学完了理论，接下来梳理一下这通电话到底该怎么打。首通的标准框架分三个环节：破冰立人设、挖需下切法、收尾固化信任。第一个环节是破冰立人设。了解完用户情况之后，电话接通第一时间，要亲切温柔地告诉家长，我为什么给您打这个电话，简单介绍一下自己的身份和职责。接着和家长确认上课相关的信息，比如上课时间、孩子上课用的设备，收货地址也要核对清楚。基础信息确认完，就进入第二个环节，挖需下切法，这是整通电话的核心环节。先和家长确认，家里平时是谁负责孩子的学习，在这个基础上去挖需求。然后讲一讲算法阶段的课程安排和价值，问一问家长的需求点，了解清楚之后，带班期间就能有针对性地给孩子做规划。再问问孩子前面上课有没有遇到卡点。同时，可以结合孩子之前的赛考成绩，简单做一些分析，为接下来第二个level的赛事招报做个小小的铺垫。注意是铺垫，不是当场推销。比如孩子上一阶段参加过比赛，你就可以顺着成绩聊聊还有哪些提升空间。通过这些内容，家长了解了你，你也摸清了家长的需求。最后是第三个环节，收尾固化信任。电话最后要把重点内容总结一下，再好好结束通话。挂了电话之后，把这些内容在微信上再发给家长一遍，做好微信闭环。收尾的目的不是再去挖需求，而是再次强化这通电话里沟通的内容，把信任固定下来。最后，整个电话过程中，老师们一定要做到情绪饱满贯彻始终、人设建立形象饱满。","interact":null,"sku":"3299算法","dept":"武汉铁军"},{"row":19,"stage":"首通电话全流程·阶段3","p":"P17","topic":"","script":"前面我们学完了理论，接下来梳理一下这通电话到底该怎么打。首通的标准框架分三个环节：破冰立人设、挖需下切法、收尾固化信任。先明确一点，你班上的用户都已经学了半年编程，家长和孩子对我们的上课模式、老师的带班方式都有一定了解了。所以在第一个环节破冰立人设里，作为即将带孩子的新老师，你要做的第一件事，就是用已知信息立人设。用你提前了解到的孩子情况告诉家长，我和前任老师已经针对咱们孩子的情况做过交接，我是了解孩子的老师，不是一个什么都不知道的新老师。比如你能说出孩子上一阶段上课的状态、擅长哪些内容，家长一听就知道你是做过功课的。第二件事，换老师要前置讲，主动跟家长说明，换老师是因为课程升级了，所以给孩子换了一位更专业的老师。第三件事，时间加硬件确认，把上课时间、硬件材料这些基础信息跟家长确认清楚。接下来进入第二个环节，挖需下切法，这是首通的核心环节。第一部分是识别风险和回顾，这部分是选问的。逐字稿上有几部分内容，大家可以看一下，针对你在扒轨迹时发现的潜在风险点，在这里先问问家长。风险了解得差不多之后，一定要记录到学情表上。下一部分是考级承接，了解一下孩子上个学期有没有参加过比赛或考级，问问家长对比赛的需求和看法。然后是算法预告，给家长讲讲算法阶段的价值和课程内容，也可以根据家长的需求有针对性地讲。接着是见面会邀约，跟家长确认好见面会的时间。最后是第三个环节，收尾固化信任。先确认家长是否想参加转介绍活动，然后硬收尾，把重点信息在微信上再跟家长闭环一下，强化这通电话的内容，把信任固定下来。注意，收尾的目的不是去明确需求，需求在挖需环节就该挖完了。最后，整个电话过程中，老师们一定要做到情绪饱满贯彻始终、人设建立形象饱满。","interact":null,"sku":"3299算法\n2699算法","dept":"西安2部"},{"row":20,"stage":"首通电话全流程·阶段3","p":"P18","topic":"","script":"前面我们学完了理论，接下来梳理一下这通电话到底该怎么打。首通的标准框架分三个环节：破冰立人设、挖需下切法、收尾固化信任。第一个环节是破冰立人设。了解完用户情况之后，电话接通第一时间，要亲切温柔地告诉家长，我为什么给您打这个电话，简单介绍一下自己的身份和职责。接着和家长确认上课相关的信息，比如学习周期、上课时间，在确认的过程中就可以顺带做一些初步的挖需，然后再确认孩子上课用的设备。基础信息确认完，就进入第二个环节，挖需下切法，这是整通电话的核心环节。先和家长确认，家里平时是谁负责孩子的学习，这位负责人一般什么时候有时间，方便后续跟您沟通孩子的学习情况。接着讲一讲算法阶段的课程安排和价值，再去了解家长和孩子的学习目标，了解清楚之后，带班期间就能有针对性地给孩子做规划。也可以问问孩子前面上课有没有遇到卡点。同时，针对孩子之前的赛考成绩，简单做一些分析，为接下来第二个level的赛事招报做个小小的铺垫。注意是铺垫，不是当场推销。比如孩子上一阶段考过级，你就可以顺着成绩聊聊下一步可以往哪个方向努力。通过这些内容，家长了解了你，你也摸清了家长的需求。最后是第三个环节，收尾固化信任。电话最后要把重点信息总结一下，用标准的结束语结束通话。挂了电话之后，把这些内容在微信上再发给家长一遍，做好微信闭环。收尾的目的不是再去挖需求，而是再次强化这通电话里沟通的内容，把信任固定下来。最后，页面左下角这两句话请大家记住：情绪饱满贯彻始终，人设建立形象饱满。","interact":null,"sku":"3299算法","dept":"霞霞部"},{"row":21,"stage":"首通电话全流程·阶段3","p":"P19","topic":"","script":"首通框架梳理完了。如果你手里已经拿到了咱们的首通话术，现在就趁热打铁，对照刚才的框架，把这份逐字稿梳理一遍，看看哪段属于破冰立人设，哪段属于挖需下切法，哪段属于收尾固化信任。然后把话术从头到尾读一遍，要带着感情读，想象电话那头就是一位刚把孩子交给你的二阶段家长。大家确认一下，是否完成熟读一遍话术？","interact":{"q":"是否完成熟读一遍话术？","at":"P18","options":["是","否"],"answer":-1,"answers":[],"vote":true,"wrong":"直接继续"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":22,"stage":"首通电话全流程·阶段4","p":"P20","topic":"","script":"流程和话术都讲完了，最后来看，什么样的首通电话才算达标？这就是第四部分，首通的标准与要求。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":23,"stage":"首通电话全流程·阶段4","p":"P21","topic":"","script":"刚才我们把首通电话的完整框架拆解清楚了，框架要落地，离不开这一页的四大标准与要求，这是每一通首通电话的底层准则：专业规范先行、需求深度挖掘、沟通高效简洁、传递服务温度。第一点，专业规范先行。开场白和结束语都要严格按照标准话术来，不能随心所欲。规范不是束缚，而是帮我们第一时间展现专业素养，建立靠谱的职业形象。家长接起电话的前30秒，就会形成对我们的第一印象，规范得体的表达，就是信任的起点。第二点，需求深度挖掘。这正好对应框架里的挖需下切法。不能单向给家长灌输信息，要多用开放式提问，少用是不是、对不对这类封闭式问题，引导家长把真实的想法、顾虑和期待说出来。抓住了家长的核心痛点和潜在需求，后面的规划和价值传递才能说到点子上，这也是后续转化的基础。比如家长随口提了一句，想让孩子以后去参加比赛，你就要顺着问下去，想参加哪一类，孩子目前准备得怎么样。第三点，沟通高效简洁。首通是有节奏的，要学会把控通话节奏，减少漫无目的的闲聊和无效寒暄。每一句话都要服务于沟通目标，清晰传递核心价值信息，在有限的时间里，把该同步、该确认、该挖掘的内容都落实，不拖沓、不跑题。第四点，传递服务温度。专业、规范、高效，不等于冷冰冰地背稿。打电话时家长看不到我们的表情，但能听出我们的状态，所以全程语调要热情亲切。还要敏锐捕捉家长的情绪，家长有担心、有疑问，要及时给到积极回应和专业建议，让家长感受到我们是真心为孩子考虑，而不是走流程。这四条标准是相辅相成的：专业规范打底，深度挖掘抓需求，高效沟通控节奏，最后用温度留住好感。大家后面练首通的时候，不光要背框架，还要用这四条标准给自己的通话做自检，每打完一通，都对照这四点复盘优化。好，来看一道题，“运用开放式提问技巧，引导客户表达真实诉求”属于哪项首通标准？","interact":{"q":"“运用开放式提问技巧，引导客户表达真实诉求”属于哪项首通标准？","at":"P20","options":["专业规范先行","需求深度挖掘","沟通高效简洁","传递服务温度"],"answer":1,"answers":[1],"vote":false,"wrong":"直接继续"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":24,"stage":"首通电话全流程·阶段4","p":"P22","topic":"","script":"刚才讲的是四大标准，接下来这九条，是首通落地的硬性执行细则，也是大家打完每一通电话自查、质检打分的标尺，每一条都要记牢。第一条，信息完整加流程正确。严格按照首通框架走，破冰、挖需、收尾三个环节不能缺，该确认、该同步的信息全部落实到位，不跳流程，不漏信息。这套框架是很多优秀老师总结出来的经验。第二条，当日完成百分之百。首通有很强的时效性，当天的学员首通要全部打完，不积压，不拖到第二天，让家长报名后第一时间就感受到老师的重视，及时建立信任。第三条，完善数据表。通话结束不是工作的终点，打完电话第一时间，就把挖到的需求、家长的顾虑、孩子的情况和风险点全部填进学情表，不能隔天再补。学情表是后续跟进和续报的依据，记录越全，后面的服务越精准。第四条，笑着打电话。别觉得对方看不见就无所谓，微笑是能通过声音传出去的。带着笑意说话，语调会更柔和亲切，这也是传递服务温度最简单的方法。第五条，自信表述。和家长沟通不要含糊，不要怯场。我们是专业的编程辅导老师，熟悉课程，也熟悉孩子的学习路径。二阶段的家长问到赛事、考级这类问题时，你答得越有底气，家长越愿意相信你给的规划和建议。第六条，不打断。家长在表达想法、吐槽顾虑的时候，要耐心听完，不要中途抢话，哪怕是为了效率也不行。打断很容易让家长产生抵触，沟通氛围一下子就变差了。第七条，多听家长说。首通不是我们单方面宣讲，要把话语权交给家长，多听、多收集信息，才能找准家长的真实诉求，而不是自顾自地背话术。第八条，互动式沟通。拒绝单向念稿，多提问、多呼应，和家长一来一回地交流。单向输出只会让家长觉得枯燥，很容易敷衍着就把电话结束了。第九条，有效沟通不少于15分钟。这里划个重点，不是凑时长，是有效沟通。刨除无效寒暄，真正用在挖需求、聊规划、对齐问题上的时间，不少于15分钟。太短的话，需求很难挖透，信任也很难建立。这九条里，前五条是对我们自身工作动作和状态的要求，后四条是通话过程中的沟通行为准则。后面的模拟演练和质检复盘，都会对照这九条来核对。好，来看一道题，关于首通电话执行标准，以下说法正确的是？","interact":{"q":"关于首通电话执行标准，以下说法正确的是？","at":"P21","options":["首通电话可以延后到次日完成","家长说话时，为了效率可以及时打断、快速引导","首通需要做到互动式沟通，有效沟通时长≥15分钟","通话中以老师讲为主，少让家长说"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":25,"stage":"首通电话全流程·阶段4","p":"P23","topic":"","script":"前面学了首通的框架和执行细则，那一通电话打完，到底好不好、能不能过关，就用这张通话质量评估表来打分。总分100分，分四个维度，每个维度25分，分别是流程、规划、表达、答疑。注意，总分60分以下就是不合格。第一项，流程，25分。考核两件事：一是流程完不完整，从开场介绍、信息确认、用户挖需、学习规划到总结强调，环节不能缺；二是信息准不准确，开课时间、上课周期、设备问题、赛考规划、在线时间这些关键信息不能说错。0到14分，是流程缺步骤或者有用词错误，同一个内容拆到好几处讲，啰嗦反复，内容冗长；15到20分，是流程完整、没有知识点错误，这是基础合格档；21到25分，是流程完整，内容简洁明了，还能结合孩子情况做额外补充，属于高分。第二项，规划，25分，这一项最考验专业功底。包括课程体系和个性化学习规划两部分，既要讲清楚核桃有哪些课程、课程之间怎么衔接、每种课程学多久，也要结合孩子的基础和家长的预期给出合适的路线，包括赛事方向。0到14分，是能提到体系和规划，但讲得零散、卡顿，不顺畅；15到20分，是能顺畅讲清楚课程体系和赛考规划；21到25分，是能自然过渡到体系和赛考部分，自信输出，根据不同孩子的情况规划出不同的课程和赛事道路，引导家长看懂长期价值，这是我们要冲刺的高分标准。第三项，表达，25分。电话沟通，家长看不到我们，全靠声音传递状态。0到14分，是语气冷淡平淡，磕绊多，语速不稳，甚至出现让家长不舒服的反问；15到20分，是表达通顺自然，偶尔有小卡顿，但不影响理解，语气有起伏；21到25分，是语气热情，应答流畅，亲和力强，家长听着舒服。第四项，答疑，25分，考的是应对家长疑问和异议的能力。0到14分，是抓不住家长的真实想法，回答生硬，解决不了诉求；15到20分，是有回应，但没能完全打消家长的顾虑；21到25分，是能从容解决问题，还能顺着家长的提问挖出更深层的需求，给到可行的建议，这是最高标准。总结一下，流程保证我们不漏环节，规划体现我们的专业度，表达传递我们的服务温度，答疑检验我们的应变能力，四个维度缺一不可。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":26,"stage":"首通电话全流程·阶段4","p":"P24","topic":"","script":"恭喜大家完成本节课的学习！请用飞书扫描屏幕上的二维码，填写首通电话全流程调研问卷，把你最真实的感受告诉我们吧！填写完成后，在下面的互动题里确认一下，是否已完成问卷填写？","interact":{"q":"是否已完成问卷填写？","at":"P23","options":["是","否"],"answer":0,"answers":[0],"vote":false,"wrong":"直接继续"},"sku":"3299算法\n2699算法","dept":"通用"}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"首通电话全流程·阶段1","q":"首通的价值中，“规避试学风险”后面要做的是？","options":[{"k":"A","t":"邀约见面会建联"},{"k":"B","t":"确认收货地址"},{"k":"C","t":"说明算法价值"},{"k":"D","t":"赛考规划"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S02","type":"阶段练习题","chapter":"首通电话全流程·阶段1","q":"首通的价值中，“建立初步联系”是为了？","options":[{"k":"A","t":"构建信任基础"},{"k":"B","t":"精准挖掘真实需求"},{"k":"C","t":"塑造专业老师形象"},{"k":"D","t":"邀约见面会建联"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S03","type":"阶段练习题","chapter":"首通电话全流程·阶段1","q":"首通的价值中，“塑造专业老师形象”是通过什么实现的？","options":[{"k":"A","t":"传递课程价值"},{"k":"B","t":"规避试学风险"},{"k":"C","t":"收集关键信息"},{"k":"D","t":"建立初步联系"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S04","type":"阶段练习题","chapter":"首通电话全流程·阶段1","q":"首通时老师主动摸清孩子情况和家长真实诉求，对应首通的哪项价值？","options":[{"k":"A","t":"收集关键信息，精准挖掘真实需求"},{"k":"B","t":"建立初步联系，构建信任基础"},{"k":"C","t":"传递课程价值，塑造专业老师形象"},{"k":"D","t":"规避试学风险，邀约见面会建联"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S05","type":"阶段练习题","chapter":"首通电话全流程·阶段1","q":"关于首通的4项价值，下列说法符合PPT的是？","options":[{"k":"A","t":"规避试学风险，并邀约见面会建联"},{"k":"B","t":"收集关键信息后，当场确定续报方案"},{"k":"C","t":"传递课程价值，重点是推销赛事"},{"k":"D","t":"建立初步联系后，就不需要再挖掘需求"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S06","type":"阶段练习题","chapter":"首通电话全流程·阶段2","q":"首通前准备工作的核心原则，可以概括为四个字？","options":[{"k":"A","t":"知己知彼"},{"k":"B","t":"有问必答"},{"k":"C","t":"主动推销"},{"k":"D","t":"快速开场"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S07","type":"阶段练习题","chapter":"首通电话全流程·阶段2","q":"下列哪项不属于P07列出的首通准备工作？","options":[{"k":"A","t":"复盘历史沟通轨迹"},{"k":"B","t":"回顾家长反馈记录"},{"k":"C","t":"分析课程互动数据"},{"k":"D","t":"确认上课时间&设备"}],"answer":"D","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S08","type":"阶段练习题","chapter":"首通电话全流程·阶段2","q":"下面哪一项不属于课件里划分的用户画像类型？","options":[{"k":"A","t":"普娃：追求快乐与可感知进步"},{"k":"B","t":"牛娃：目标顶级竞赛成绩"},{"k":"C","t":"混合型：兼顾兴趣 + 升学成果"},{"k":"D","t":"躺平型：完全不想孩子学习"}],"answer":"D","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S09","type":"阶段练习题","chapter":"首通电话全流程·阶段2","q":"P09中，针对思维型用户提供的是？","options":[{"k":"A","t":"趣味编程学习与托管服务"},{"k":"B","t":"顶尖资源与效率"},{"k":"C","t":"可量化成果与升学希望证明"},{"k":"D","t":"顶级竞赛成绩规划"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S10","type":"阶段练习题","chapter":"首通电话全流程·阶段2","q":"关于开放式提问，描述正确的是","options":[{"k":"A","t":"用 “是 / 否” 就能回答，快速结束对话"},{"k":"B","t":"引导家长多说，表达真实想法，补齐信息"},{"k":"C","t":"示例：孩子之前学过编程吗？（只能回答学过 / 没学过）"},{"k":"D","t":"信息不足时，直接自己猜测家长诉求"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S11","type":"阶段练习题","chapter":"首通电话全流程·阶段3","q":"首通电话标准框架是什么？","options":[{"k":"A","t":"自我介绍→讲课程→催续费"},{"k":"B","t":"破冰立人设、挖需下切法、收尾固化信任"},{"k":"C","t":"询问学情→分析问题→安排赛事"},{"k":"D","t":"核实信息→推送资料→预 wer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F08","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通标准“沟通高效简洁”的要求是？","options":[{"k":"A","t":"把控通话节奏，减少无效寒暄，在有限时间内达成既定沟通目标"},{"k":"B","t":"严格遵循标准话术，规范开场白与结束语"},{"k":"C","t":"运用开放式提问技巧，引导客户表达真实诉求"},{"k":"D","t":"保持热情亲切的语调，关注客户情绪反馈"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F09","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"混合型用户画像中，家长需要看到的是？","options":[{"k":"A","t":"可量化成果、行为改变及升学希望证明"},{"k":"B","t":"孩子快乐成长与可感知进步"},{"k":"C","t":"顶尖资源与效率"},{"k":"D","t":"趣味编程学习与托管服务"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F10","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通结束后，需要完善数据表单，做好信息记录？","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F11","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"考核标准“答疑”维度达到21-25分的标准是？","options":[{"k":"A","t":"自信且妥善解决家长问题，且能挖掘出深层次的需求并提出可行的意见"},{"k":"B","t":"面对用户的提问，有回应，但未完全解决"},{"k":"C","t":"面对用户的提问，未洞察未解决家长诉求，反应慢、应答生硬"},{"k":"D","t":"语气热情，应答流畅，表达流利"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F12","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"老师首通前复盘历史沟通轨迹，发现家长信息很少，按PPT通话中应怎么做？","options":[{"k":"A","t":"善用开放式提问，挖掘关键细节"},{"k":"B","t":"多用是/否问题，快速确认"},{"k":"C","t":"按自己猜测的需求直接推荐"},{"k":"D","t":"跳过挖需，直接进入收尾"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F13","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通前充分准备，需要做哪些工作","options":[{"k":"A","t":"复盘历史沟通轨迹"},{"k":"B","t":"回顾家长反馈记录"},{"k":"C","t":"分析课程互动数据"},{"k":"D","t":"提前准备好催家长交费的话术"}],"answer":"ABC","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F14","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通完整流程包含哪几个阶段","options":[{"k":"A","t":"破冰·立人设"},{"k":"B","t":"挖需·下切法"},{"k":"C","t":"收尾·固化信任"},{"k":"D","t":"催续费·促转化"}],"answer":"ABC","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F15","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"下列属于P22首通标准与要求的是？（多选，选3项）","options":[{"k":"A","t":"完善数据表"},{"k":"B","t":"笑着打电话"},{"k":"C","t":"不打断"},{"k":"D","t":"有效沟通≥10分钟"}],"answer":"ABC","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F16","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通标准“专业规范先行”的要求包括？（多选，选2项）","options":[{"k":"A","t":"严格遵循标准话术"},{"k":"B","t":"规范开场白与结束语"},{"k":"C","t":"减少无效寒暄"},{"k":"D","t":"关注客户情绪反馈"}],"answer":"AB","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"}],"timing":{"P01":{"sents":["各位老师，这节课要给大家讲的是首通电话的全流程。","这通电话，对我们和家长来说，都是非常重要的第一印象。"," 大家换位思考一下：一个孩子坐在教室里，人没有离开、没有跑出教室，是不是就代表这节课孩子听进去、有收获了？"," 放到我们首通电话里也是一样：家长没有挂断电话，不代表我们这通电话就打好了、沟通有效。"],"durs":[5.496,5.424,10.704,8.904]},"P02":{"sents":["先说清楚首通是什么时候打的：首通，是在家长付完钱之后，你作为课导老师和家长的第一通电话。","咱们面对的家长，孩子已经在核桃学完了第一阶段六个月的课程，现在要进入第二阶段的图形化算法长期班。","这些家长对编程、考级、赛事都有一定的认知，也已经习惯了上一任老师的风格。","这时候来了一个新老师的电话，家长心里难免会掂量一下，这个新老师行不行？","所以这通电话打得好不好，直接决定了家长对你的第一印象。","打个比方，我今天上课穿一身温柔风的衣服，或者穿一身朋克风的衣服，大家对我的第一印象，自然就会往那个风格去靠。","电话也是一样，家长看不到你，但能从第一通电话里听出来，你专不专业，温不温柔，细不细心。","这些就是家长在首通里最在意的东西。","所以今天这节课，咱们就按目录上的四个部分来讲：第一，首通的重要性；","第二，首通前的充分准备；","第三，首通流程与话术梳理；","第四，首通的标准与要求。"],"durs":[9.312,9.552,7.872,7.152,5.736,10.8,9,3.792,7.224,2.904,3.288,3.072]},"P03":{"sents":["先来看第一部分，首通的重要性。","除了刚才说的第一印象，这通电话还有哪些价值，让它非打不可？","咱们一起来看。"],"durs":[3.48,6.288,1.872]},"P05":{"sents":["这道题答案是错，这通电话对家长同样有价值。","目的清楚了，再具体看看首通能带来哪四个价值。","第一，建立初步联系，构建信任基础。","家长是带着期待报的课，这通电话就是你和这个家庭的第一次见面。","第二，收集关键信息，精准挖掘真实需求。","家长和孩子的基础信息都要收集，比如孩子几年级了，在学校成绩怎么样，性格怎么样。","这些信息在之后带班的过程中非常有用，比如你要给孩子做赛事规划，或者到了一些关键节点，有了这些信息，你才能更清楚地回应家长的疑虑。","第三，传递课程价值，塑造专业老师形象。","要让家长感觉到，这个老师懂教育、懂孩子，把孩子交给这个老师是放心的。","第四，规避试学风险，邀约见面会建联。","二阶段开课的前几周是试学期，首通里要把可能存在的风险记录下来，后面才有机会提前干预，千万不能等到问题已经爆发了再处理。","同时，在电话里把见面会邀约好，为后续和家长建立更紧密的联系打下基础。","最后我要强调一句，这些家长已经花了几千块钱进了咱们的班，孩子也实实在在学了半年，他们已经认可编程的价值了。","所以首通的核心任务，不是去告诉家长编程有多厉害、多有用，而是让家长相信，我能把孩子带好、教好，让孩子愿意持续学下去，为后续的续报打好基础。"],"durs":[4.872,4.92,4.056,6.24,4.8,8.04,13.008,4.728,7.128,4.608,12.72,8.184,10.848,14.736]},"P06":{"sents":["接下来进入第二部分，首通前的充分准备。","老话说，不打无准备之仗。","家长是带着期待报的课，如果你打过去，连孩子几年级、上一阶段学得怎么样、当初为什么报课都不知道，家长的第一反应就是，这个新老师不太靠谱。","第一印象一旦打坏，后面很难挽回。","尤其是二阶段的家长，已经和上一任老师相处了半年，心里自然会拿你和上一任老师做比较。","所以准备工作，就是这通电话的地基。"],"durs":[4.104,2.88,12.984,3.624,8.376,3.72]},"P08":{"sents":["没错，准备工作的核心原则就是知己知彼。","原则讲完了，来看具体怎么操作。","这些动作都要在通话前完成。","我们的CRM系统里，可以看到家长和上一任老师沟通的基本情况，包括历史聊天记录、通话记录等等。","看的时候重点盯两件事，一是警惕退费风险，二是看清家长的报课需求。","具体看哪些地方呢？","先看班级信息，包括当前所在班级、进出班记录，孩子之前上过几次课，还有通话次数、接通率、平均通话时长、聊天记录次数，这些都能查到。","再看通话记录和聊天记录，能听录音就听录音，能看聊天就看聊天，重点看家长说过什么，上一任老师是怎么跟进的。","举个例子，大家看截图里这组数据：通话25次，接通率88%，平均通话时长3分19秒；","聊天累计343次，其中老师发了283次，家长只回了60次。","这说明什么？","说明这是一位比较被动、话不多的家长。","那你这通电话就要多引导、多提问，而不是干巴巴地介绍课程。","做完这些，你要达成的目标只有一个，让家长感觉到核桃编程前后衔接很靠谱，老师们会认真交接孩子的具体情况，报课之前有人管，报课之后更有人管，而且新老师能做得更好。"],"durs":[4.512,3.432,3.168,9.6,7.488,2.208,14.04,10.584,10.08,7.416,1.872,4.128,6.048,16.896]},"P10":{"sents":["答案是不能，轨迹只能帮你初步判断。","分完层，打完电话之后，一定要填写学情表，把了解到的信息记录下来，越细越好。","我们手上的用户很多，不可能把每个家庭的诉求都记在脑子里。","学情表填得及时、填得完整，任何时候你都能迅速查到这个家长的信息，做到任何阶段都知己知彼。","后续入组之后，学部也会提供统一的模板，大家认真记录就可以了。","来看一张真实合格的学情表。","表头有用户ID、姓名、首通时间、首通录音、年级、性格、成绩、需求、上课设备、编程基础、风险预警重点这些字段。","最右边两列是风险预警重点和高危用户，用红、黄、绿三种颜色标记。","比如有个孩子，备注写的是孩子时间排满，课前直播来不及，第一次试课，风险预警标了黄灯。","这类家长就要置顶微信，重点跟进，课上也要重点盯着孩子的状态，提前规避风险，多做一些额外的服务去维护。","红灯代表的就是退费风险的用户，刚开始就提到退费，或者一直联系不上，上阶段就多次缺课，这些都是需要开课前额外多关注的用户。","绿灯的家长正常维护就好，但也不能掉以轻心，家长的想法是会变的。","这就是分层的意义，信息越全，你打电话的时候心里越有底。"],"durs":[3.792,7.728,5.736,9.48,6.216,3,12.672,7.464,9.24,10.632,13.008,6.528,5.808]},"P12":{"sents":["很明显，应该接着家长的话，去回应专注力的问题。","来看这位老师是怎么做的。","老师没有对家长的担忧置之不理，而是发出了第一课的知识点汇总，并且告诉家长，这些知识帮助宝贝理解了如何按照顺序执行任务，学会一步一步分析、解决问题，在生活中做计划、理步骤也会更清晰。","这就把编程学习和家长关心的专注力、条理性联系在了一起。","紧接着，家长又说孩子现在写字难看，阅读理解差，还有专注力和钻研精神不够。","老师没有回避，用一段语音给出了回应：写字可以买些练习题让孩子去练；","阅读理解差，其实背后是思维能力的问题，很多孩子读完之后没有做总结、做分析。","老师针对家长的顾虑给出具体的建议，家长自然就安心了。"],"durs":[5.016,2.736,18.432,6.096,8.136,7.08,8.088,5.616]},"P13":{"sents":["再看一个案例，这是一通三十多分钟的通话录音。","家长聊到夏天的期末考试，说本来以为孩子会考得很差，后来发现题都会做，就是马虎。","老师马上接住了马虎这个点，从编程的角度解释：编程是一门非常严谨的学科，孩子但凡多写一个代码、少写一个代码，或者写错一个代码，整个程序就会出现bug，走不通，没办法再往下进行。","通过这个解释，老师把编程和孩子的审题能力、细心程度联系了起来。","所以请大家记住这两个案例的共同点：家长说什么，你就接什么；","家长担心什么，你就给什么方案。","千万不要自说自话。"],"durs":[4.488,8.232,17.304,6.696,6.336,3.192,2.232]},"P14":{"sents":["学会了怎么接住家长的顾虑，但信息总有不全的时候。","如果准备阶段的信息就是不够，比如家长没怎么接过电话，也没怎么和上一任老师沟通过，但还是报了咱们的课，那怎么办？","办法只有一个，在通话中用提问把信息补回来。","核心原则是，善用开放式提问，挖掘关键细节。","什么叫开放式提问？","就是不问那种只能回答是或否的问题。","封闭式问题，家长答完一句，你就不知道怎么往下接了，通话会很尴尬，信息也补不全。","开放式提问，是引导家长从多个角度表达，把信息差补上。","也千万别因为信息不够，就自己去猜家长的诉求。","来看两个场景示例。","场景示例一，背景摸底。","不要问孩子之前学过编程吗，这种问题家长一句学过或者没学过就结束了。","可以换成，孩子之前有没有接触过编程相关的内容、课程或者小游戏呢？","接触过和学过是两个概念，家长会多说很多信息，你还能顺带了解孩子的兴趣程度。","放到二阶段的家庭，也可以问，这半年学下来，您觉得孩子在哪些方面变化最明显？","场景示例二，需求挖掘。","不要问您希望孩子提升成绩吗，可以这样问，您希望孩子通过学习编程，在逻辑思维、动手能力或者其他方面，获得哪些具体的提升？","你给家长几个方向，家长就更容易说出真实的期待，你也就知道这通电话后面该往哪里使劲。"],"durs":[5.208,10.776,4.536,5.232,2.256,3.888,8.064,5.616,4.8,2.256,2.904,7.224,7.08,8.016,8.04,2.928,12.024,8.424]},"P15":{"sents":["首通前的准备工作学完了，接下来是今天最重要的部分，第三部分，首通流程与话术梳理。"],"durs":[8.448]},"P16":{"sents":["前面我们学完了理论，接下来梳理一下这通电话到底该怎么打。","首通的标准框架分三个环节：破冰立人设、挖需下切法、收尾固化信任。","第一个环节是破冰立人设。","了解完用户情况之后，电话接通第一时间，要亲切温柔地告诉家长，我为什么给您打这个电话，简单介绍一下自己的身份和职责。","接着和家长确认上课相关的信息，比如上课时间、孩子上课用的设备，收货地址也要核对清楚。","基础信息确认完，就进入第二个环节，挖需下切法，这是整通电话的核心环节。","先和家长确认，家里平时是谁负责孩子的学习，在这个基础上去挖需求。","然后讲一讲算法阶段的课程安排和价值，问一问家长的需求点，了解清楚之后，带班期间就能有针对性地给孩子做规划。","再问问孩子前面上课有没有遇到卡点。","同时，可以结合孩子之前的赛考成绩，简单做一些分析，为接下来第二个level的赛事招报做个小小的铺垫。","注意是铺垫，不是当场推销。","比如孩子上一阶段参加过比赛，你就可以顺着成绩聊聊还有哪些提升空间。","通过这些内容，家长了解了你，你也摸清了家长的需求。","最后是第三个环节，收尾固化信任。","电话最后要把重点内容总结一下，再好好结束通话。","挂了电话之后，把这些内容在微信上再发给家长一遍，做好微信闭环。","收尾的目的不是再去挖需求，而是再次强化这通电话里沟通的内容，把信任固定下来。","最后，整个电话过程中，老师们一定要做到情绪饱满贯彻始终、人设建立形象饱满。"],"durs":[5.688,7.392,2.928,11.232,9.096,7.584,7.392,10.944,4.032,9.576,3,6.912,5.112,3.696,5.04,6.792,8.232,8.304]},"P17":{"sents":["前面我们学完了理论，接下来梳理一下这通电话到底该怎么打。","首通的标准框架分三个环节：破冰立人设、挖需下切法、收尾固化信任。","先明确一点，你班上的用户都已经学了半年编程，家长和孩子对我们的上课模式、老师的带班方式都有一定了解了。","所以在第一个环节破冰立人设里，作为即将带孩子的新老师，你要做的第一件事，就是用已知信息立人设。","用你提前了解到的孩子情况告诉家长，我和前任老师已经针对咱们孩子的情况做过交接，我是了解孩子的老师，不是一个什么都不知道的新老师。","比如你能说出孩子上一阶段上课的状态、擅长哪些内容，家长一听就知道你是做过功课的。","第二件事，换老师要前置讲，主动跟家长说明，换老师是因为课程升级了，所以给孩子换了一位更专业的老师。","第三件事，时间加硬件确认，把上课时间、硬件材料这些基础信息跟家长确认清楚。","接下来进入第二个环节，挖需下切法，这是首通的核心环节。","第一部分是识别风险和回顾，这部分是选问的。","逐字稿上有几部分内容，大家可以看一下，针对你在扒轨迹时发现的潜在风险点，在这里先问问家长。","风险了解得差不多之后，一定要记录到学情表上。","下一部分是考级承接，了解一下孩子上个学期有没有参加过比赛或考级，问问家长对比赛的需求和看法。","然后是算法预告，给家长讲讲算法阶段的价值和课程内容，也可以根据家长的需求有针对性地讲。","接着是见面会邀约，跟家长确认好见面会的时间。","最后是第三个环节，收尾固化信任。","先确认家长是否想参加转介绍活动，然后硬收尾，把重点信息在微信上再跟家长闭环一下，强化这通电话的内容，把信任固定下来。","注意，收尾的目的不是去明确需求，需求在挖需环节就该挖完了。","最后，整个电话过程中，老师们一定要做到情绪饱满贯彻始终、人设建立形象饱满。"],"durs":[5.688,7.392,10.872,9.696,12.432,8.424,10.32,8.568,5.832,4.656,9.312,4.512,9.792,9.192,4.92,3.696,12.432,6.624,8.304]},"P18":{"sents":["前面我们学完了理论，接下来梳理一下这通电话到底该怎么打。","首通的标准框架分三个环节：破冰立人设、挖需下切法、收尾固化信任。","第一个环节是破冰立人设。","了解完用户情况之后，电话接通第一时间，要亲切温柔地告诉家长，我为什么给您打这个电话，简单介绍一下自己的身份和职责。","接着和家长确认上课相关的信息，比如学习周期、上课时间，在确认的过程中就可以顺带做一些初步的挖需，然后再确认孩子上课用的设备。","基础信息确认完，就进入第二个环节，挖需下切法，这是整通电话的核心环节。","先和家长确认，家里平时是谁负责孩子的学习，这位负责人一般什么时候有时间，方便后续跟您沟通孩子的学习情况。","接着讲一讲算法阶段的课程安排和价值，再去了解家长和孩子的学习目标，了解清楚之后，带班期间就能有针对性地给孩子做规划。","也可以问问孩子前面上课有没有遇到卡点。","同时，针对孩子之前的赛考成绩，简单做一些分析，为接下来第二个level的赛事招报做个小小的铺垫。","注意是铺垫，不是当场推销。","比如孩子上一阶段考过级，你就可以顺着成绩聊聊下一步可以往哪个方向努力。","通过这些内容，家长了解了你，你也摸清了家长的需求。","最后是第三个环节，收尾固化信任。","电话最后要把重点信息总结一下，用标准的结束语结束通话。","挂了电话之后，把这些内容在微信上再发给家长一遍，做好微信闭环。","收尾的目的不是再去挖需求，而是再次强化这通电话里沟通的内容，把信任固定下来。","最后，页面左下角这两句话请大家记住：情绪饱满贯彻始终，人设建立形象饱满。"],"durs":[5.688,7.392,2.928,11.232,13.032,7.584,11.28,12.024,4.128,9.264,3,7.032,5.112,3.696,5.832,6.792,8.232,8.328]},"P20":{"sents":["流程和话术都讲完了，最后来看，什么样的首通电话才算达标？","这就是第四部分，首通的标准与要求。"],"durs":[5.904,3.84]},"P23":{"sents":["前面学了首通的框架和执行细则，那一通电话打完，到底好不好、能不能过关，就用这张通话质量评估表来打分。","总分100分，分四个维度，每个维度25分，分别是流程、规划、表达、答疑。","注意，总分60分以下就是不合格。","第一项，流程，25分。","考核两件事：一是流程完不完整，从开场介绍、信息确认、用户挖需、学习规划到总结强调，环节不能缺；","二是信息准不准确，开课时间、上课周期、设备问题、赛考规划、在线时间这些关键信息不能说错。","0到14分，是流程缺步骤或者有用词错误，同一个内容拆到好几处讲，啰嗦反复，内容冗长；","15到20分，是流程完整、没有知识点错误，这是基础合格档；","21到25分，是流程完整，内容简洁明了，还能结合孩子情况做额外补充，属于高分。","第二项，规划，25分，这一项最考验专业功底。","包括课程体系和个性化学习规划两部分，既要讲清楚核桃有哪些课程、课程之间怎么衔接、每种课程学多久，也要结合孩子的基础和家长的预期给出合适的路线，包括赛事方向。","0到14分，是能提到体系和规划，但讲得零散、卡顿，不顺畅；","15到20分，是能顺畅讲清楚课程体系和赛考规划；","21到25分，是能自然过渡到体系和赛考部分，自信输出，根据不同孩子的情况规划出不同的课程和赛事道路，引导家长看懂长期价值，这是我们要冲刺的高分标准。","第三项，表达，25分。","电话沟通，家长看不到我们，全靠声音传递状态。","0到14分，是语气冷淡平淡，磕绊多，语速不稳，甚至出现让家长不舒服的反问；","15到20分，是表达通顺自然，偶尔有小卡顿，但不影响理解，语气有起伏；","21到25分，是语气热情，应答流畅，亲和力强，家长听着舒服。","第四项，答疑，25分，考的是应对家长疑问和异议的能力。","0到14分，是抓不住家长的真实想法，回答生硬，解决不了诉求；","15到20分，是有回应，但没能完全打消家长的顾虑；","21到25分，是能从容解决问题，还能顺着家长的提问挖出更深层的需求，给到可行的建议，这是最高标准。","总结一下，流程保证我们不漏环节，规划体现我们的专业度，表达传递我们的服务温度，答疑检验我们的应变能力，四个维度缺一不可。"],"durs":[10.224,8.064,3.792,3.048,10.824,10.248,9.312,6.288,9,5.184,16.92,6.744,5.568,15.552,3.096,4.944,7.992,7.752,7.128,6.048,6.744,5.4,10.536,11.904]},"P04":{"sents":["先说目的。","首通的目的可以从两个角度来看，一个是对用户，一个是对老师。","对用户来说，我们要做到三件事：第一，和家长建立信任关系；","第二，让家长清楚咱们的课程是什么样的，老师的服务是什么样的；","第三，针对性地解决家长的疑虑。","比如二阶段的家长常会关心，换了新老师孩子能不能适应，接下来的算法课难不难，这些顾虑都要在电话里接住。","对老师来说，核心目标也是三件事：第一，了解家长和孩子的基础信息；","第二，挖掘孩子潜在的学习需求和痛点；","第三，判断这个用户是什么类型的，弄清楚家长当初为什么给孩子报编程课。","这里提醒一下，首通的目标里，没有当场说服家长续费这一条，也不是一上来就给孩子安排赛事获奖方案。","那大家想一想，首通的价值体现在哪两个方面？"],"durs":[1.872,6.12,6.048,6.168,3.408,10.392,7.224,4.2,7.368,9.648,4.416]},"P07":{"sents":["准备工作从哪里入手？","核心原则就四个字，知己知彼。","具体要做三件事。","第一，复盘历史沟通轨迹。","翻一翻这个用户过往的咨询记录，还有和上一任老师的聊天记录，梳理家长问过哪些细节、聊到过哪些节点，里面很可能藏着意向线索，或者还没说出口的异议。","第二，回顾家长反馈记录。","从反馈里找出这个家庭最核心的教育诉求，提前预判家长可能会问什么、顾虑什么、关注什么。","比如家长之前反复问过考级的事，那首通里大概率还会问，你就得提前想好怎么接。","第三，分析课程互动数据。","看看孩子上一阶段的互动频次，锁定孩子的兴趣点在哪；","再结合上课时长和互动数据，判断孩子是自信型还是内向型，是不是喜欢玩游戏，有没有不认真上课的情况。","这三件事都必须在打电话之前做完，而不是电话接通了再临时去翻记录。","页面下方这句话大家记一下：充分的前期准备，是高效沟通与信任建立的基石。","好，来看一道题，“充分的前期准备”被称为什么的基石？"],"durs":[2.448,3.432,2.16,3.144,14.016,3.048,9.168,7.8,3.12,5.136,10.392,7.248,7.728,5.28]},"P09":{"sents":["大家要注意，每个家庭的诉求都不一样。","有的家长想让孩子升学，有的想锻炼思维，有的就是先试试看。","所以光准备还不够，还要甄别归类。","看完沟通记录之后，要学会给用户分层，并且及时记录到学情表里。","怎么分？","我们可以根据自己掌握的轨迹信息，或者和上一任老师沟通，先做初步判断，大致分成三类。","第一类，思维型。","用户画像是普娃，家长追求的是孩子快乐成长、有可感知的进步，我们提供的是趣味编程学习和托管服务。","第二类，混合型，也就是既要又要。","用户画像也是普娃，家长兼顾兴趣和升学，需要看到可量化的成果、孩子行为上的改变，以及升学希望的证明。","第三类，升学型。","用户画像是牛娃，目标是顶级竞赛成绩和特殊升学的最优解，追求的是顶尖资源和效率。","比如家长在上一阶段就反复问过比赛和考级，那就可能偏混合型或升学型。","不过要注意，聊天记录和轨迹只能帮你做个初步判断，家长的真实想法，还得在首通里通过提问去确认。","那大家想一想，思维型用户的画像是？"],"durs":[3.792,5.904,3.768,6.48,1.872,8.4,2.304,10.032,3.72,10.224,2.4,8.784,7.488,10.008,3.768]},"P11":{"sents":["下面来看几个真实案例，都来自后台的录音和聊天记录。","大家重点看，家长在和班主任的沟通里，会抛出哪些自己在意的点，或者希望老师重视的点。","第一个案例，老师在给家长反馈孩子的课堂表现，说孩子评分优异，超过了班上大部分小朋友。","结果家长回了一句，感觉现在专注力越来越差。","这句话说明什么？","说明家长很想提升孩子的专注力，担心孩子学习达不到想要的效果。","这种时候，老师怎么回就特别关键。","如果你是这个老师你会怎么做？"],"durs":[5.4,8.424,8.904,4.464,1.968,6.528,3.648,3.024]},"P19":{"sents":["首通框架梳理完了。","如果你手里已经拿到了咱们的首通话术，现在就趁热打铁，对照刚才的框架，把这份逐字稿梳理一遍，看看哪段属于破冰立人设，哪段属于挖需下切法，哪段属于收尾固化信任。","然后把话术从头到尾读一遍，要带着感情读，想象电话那头就是一位刚把孩子交给你的二阶段家长。","大家确认一下，是否完成熟读一遍话术？"],"durs":[2.352,15.936,9.384,4.032]},"P21":{"sents":["刚才我们把首通电话的完整框架拆解清楚了，框架要落地，离不开这一页的四大标准与要求，这是每一通首通电话的底层准则：专业规范先行、需求深度挖掘、沟通高效简洁、传递服务温度。","第一点，专业规范先行。","开场白和结束语都要严格按照标准话术来，不能随心所欲。","规范不是束缚，而是帮我们第一时间展现专业素养，建立靠谱的职业形象。","家长接起电话的前30秒，就会形成对我们的第一印象，规范得体的表达，就是信任的起点。","第二点，需求深度挖掘。","这正好对应框架里的挖需下切法。","不能单向给家长灌输信息，要多用开放式提问，少用是不是、对不对这类封闭式问题，引导家长把真实的想法、顾虑和期待说出来。","抓住了家长的核心痛点和潜在需求，后面的规划和价值传递才能说到点子上，这也是后续转化的基础。","比如家长随口提了一句，想让孩子以后去参加比赛，你就要顺着问下去，想参加哪一类，孩子目前准备得怎么样。","第三点，沟通高效简洁。","首通是有节奏的，要学会把控通话节奏，减少漫无目的的闲聊和无效寒暄。","每一句话都要服务于沟通目标，清晰传递核心价值信息，在有限的时间里，把该同步、该确认、该挖掘的内容都落实，不拖沓、不跑题。","第四点，传递服务温度。","专业、规范、高效，不等于冷冰冰地背稿。","打电话时家长看不到我们的表情，但能听出我们的状态，所以全程语调要热情亲切。","还要敏锐捕捉家长的情绪，家长有担心、有疑问，要及时给到积极回应和专业建议，让家长感受到我们是真心为孩子考虑，而不是走流程。","这四条标准是相辅相成的：专业规范打底，深度挖掘抓需求，高效沟通控节奏，最后用温度留住好感。","大家后面练首通的时候，不光要背框架，还要用这四条标准给自己的通话做自检，每打完一通，都对照这四点复盘优化。","好，来看一道题，“运用开放式提问技巧，引导客户表达真实诉求”属于哪项首通标准？"],"durs":[17.784,2.856,5.856,7.032,8.448,2.832,3.384,11.832,9.864,9.864,2.928,7.464,12.96,2.76,4.536,7.776,12.84,10.248,10.896,8.256]},"P22":{"sents":["刚才讲的是四大标准，接下来这九条，是首通落地的硬性执行细则，也是大家打完每一通电话自查、质检打分的标尺，每一条都要记牢。","第一条，信息完整加流程正确。","严格按照首通框架走，破冰、挖需、收尾三个环节不能缺，该确认、该同步的信息全部落实到位，不跳流程，不漏信息。","这套框架是很多优秀老师总结出来的经验。","第二条，当日完成百分之百。","首通有很强的时效性，当天的学员首通要全部打完，不积压，不拖到第二天，让家长报名后第一时间就感受到老师的重视，及时建立信任。","第三条，完善数据表。","通话结束不是工作的终点，打完电话第一时间，就把挖到的需求、家长的顾虑、孩子的情况和风险点全部填进学情表，不能隔天再补。","学情表是后续跟进和续报的依据，记录越全，后面的服务越精准。","第四条，笑着打电话。","别觉得对方看不见就无所谓，微笑是能通过声音传出去的。","带着笑意说话，语调会更柔和亲切，这也是传递服务温度最简单的方法。","第五条，自信表述。","和家长沟通不要含糊，不要怯场。","我们是专业的编程辅导老师，熟悉课程，也熟悉孩子的学习路径。","二阶段的家长问到赛事、考级这类问题时，你答得越有底气，家长越愿意相信你给的规划和建议。","第六条，不打断。","家长在表达想法、吐槽顾虑的时候，要耐心听完，不要中途抢话，哪怕是为了效率也不行。","打断很容易让家长产生抵触，沟通氛围一下子就变差了。","第七条，多听家长说。","首通不是我们单方面宣讲，要把话语权交给家长，多听、多收集信息，才能找准家长的真实诉求，而不是自顾自地背话术。","第八条，互动式沟通。","拒绝单向念稿，多提问、多呼应，和家长一来一回地交流。","单向输出只会让家长觉得枯燥，很容易敷衍着就把电话结束了。","第九条，有效沟通不少于15分钟。","这里划个重点，不是凑时长，是有效沟通。","刨除无效寒暄，真正用在挖需求、聊规划、对齐问题上的时间，不少于15分钟。","太短的话，需求很难挖透，信任也很难建立。","这九条里，前五条是对我们自身工作动作和状态的要求，后四条是通话过程中的沟通行为准则。","后面的模拟演练和质检复盘，都会对照这九条来核对。","好，来看一道题，关于首通电话执行标准，以下说法正确的是？"],"durs":[12.24,3.384,11.952,4.248,2.976,12.888,2.664,12.48,6.456,2.616,5.424,6.768,2.472,3.648,6.216,9.288,2.208,8.376,5.424,2.64,11.112,2.568,5.88,6.144,3.744,4.344,7.872,4.56,8.784,5.424,6.144]},"P24":{"sents":["恭喜大家完成本节课的学习！","请用飞书扫描屏幕上的二维码，填写首通电话全流程调研问卷，把你最真实的感受告诉我们吧！","填写完成后，在下面的互动题里确认一下，是否已完成问卷填写？"],"durs":[3.096,8.784,6.24]}},"v":{"slides/P01.png":"e9727fd5","slides/P02.png":"71c6913b","slides/P03.png":"f0ec5a03","slides/P04.png":"c05919b9","slides/P05.png":"07119eab","slides/P06.png":"cc2f9059","slides/P07.png":"69ec4d33","slides/P08.png":"8fe392ab","slides/P09.png":"1a567d4a","slides/P10.png":"6d038434","slides/P11.png":"70a21a84","slides/P12.png":"e1e17e9f","slides/P13.png":"c23bf70d","slides/P14.png":"2c79e427","slides/P15.png":"6d40f7df","slides/P16.png":"9cf5be3f","slides/P17.png":"f97c195a","slides/P18.png":"f56f5998","slides/P19.png":"64b8a20e","slides/P20.png":"365b1f77","slides/P21.png":"c1ef546a","slides/P22.png":"794f6f03","slides/P23.png":"601e89df","slides/P24.png":"d22e0839","audio/P01.mp3":"54306d35","audio/P02.mp3":"df72a1e6","audio/P03.mp3":"a85075f1","audio/P04.mp3":"3edc48a6","audio/P05.mp3":"a8b2bcda","audio/P06.mp3":"545702fa","audio/P07.mp3":"c787d470","audio/P08.mp3":"96148f85","audio/P09.mp3":"af33c4f7","audio/P10.mp3":"91b2683e","audio/P11.mp3":"833da78a","audio/P12.mp3":"fbf797b4","audio/P13.mp3":"bcbb0858","audio/P14.mp3":"94220e50","audio/P15.mp3":"eb2483e4","audio/P16.mp3":"2cf82673","audio/P17.mp3":"28c89b84","audio/P18.mp3":"bb /* 第二个 Webhook：学员第一次出现时，在「学员实时状态」表新建他的那一行 */
const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid}, ev, snapshot(online));
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rate = +b.dataset.r; au.playbackRate = rate;
    document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on', x===b)); });
  if (autoplay) play();
}
function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});
  showQuiz('final');
}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`});
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
