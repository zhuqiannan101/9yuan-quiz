<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>首通电话全流程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}
</style>

<script>
const DATA = {"pages":[{"row":3,"stage":"首通电话全流程·阶段1","p":"P01","topic":"","script":"各位老师，这节课要给大家讲的是首通电话的全流程。这个电话其实对我们来说，包括对家长来说都是非常重要的一个首印象啊，大家现在可以想一下，上一次你接到陌生电话的时候，第一反应是什么？","interact":{"q":"接到陌生电话，你会怎么做？","at":"P01","options":["挂断","先听听看他会说什么"],"answer":-1,"answers":[],"vote":true,"wrong":"直接继续"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":4,"stage":"首通电话全流程·阶段1","p":"P02","topic":"","script":"其实大家更多的第一反应都会把它挂掉，我们的首通是介于在家长付完钱之后，你作为课导老师跟家长的第一通电话。那这通电话打的好不好？其实直接决定了接下来家长对你的一个印象，比如说今天我来上课的时候穿了一个非常温柔的衣服，或者是我穿了一个朋克风的衣服，那在大家的视角里面我的第一印象就会更倾向于这个风格的人设，对家长来说也是一样的，我们跟他的第一通交流其实就可以暴露出很多问题，比如说你是不是专业的啊，你是不是温柔的，是不是足够细心的？这些都是我们在第一个电话里，家长会比较关注的事情。今天就会从这四个方面来给大家讲一下在首通我们到底要做些什么？","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":5,"stage":"首通电话全流程·阶段1","p":"P03","topic":"","script":"首先我们先来讲一下这个电话为什么重要，除了刚刚我们提到的第一印象之外，一起来看看还有哪些内容是有它必须存在的价值。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":6,"stage":"首通电话全流程·阶段1","p":"P04","topic":"","script":"那这通电话我们要达成什么目的呢？对用户来说啊，我们要做到的三件事情，第一个就是建立信任关系，第二个呢要让他清楚，我们这个课程是什么样子的，老师的服务是什么样子的，第三个就是针对性的去解决家长的一些疑虑。那对我们老师来说核心目标也是三个事情，第一个我们要去通过这通电话了解到家长和孩子的基础信息，第二个要去挖掘一下用户可能能潜在的一些学习需求，痛点的问题。第3点我们也需要去明确一下用户是什么类型的，为什么要去来报我们的编程课呢？","interact":{"q":"这通电话只对课导自身有价值，对用户来说是没有意义的？","at":"P04","options":["对","错"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":7,"stage":"首通电话全流程·阶段1","p":"P05","topic":"","script":"目的清楚了，那这通电话具体能带来什么价值呢？首先第一个要去跟家长建立初步的联系啊，构建信任的基础，因为家长是带着期待才报课的，对吧？这一通电话就是我和这个家庭的第一次见面。第二个我们需要去收集用户的信息，不管是家长还是孩子都需要收集一些基础的信息，比如说他几年级了啊？孩子现在学校里的学习成绩怎么样，性格怎么样，这些信息在以后带班的过程中，比如说你要去给他做赛事规划或者是一些关键的节点，都会帮助到大家去更清晰的解决这个家长的疑虑。第三个传递我们的课程价值，塑造老师的形象，要让家长感觉到，这个老师是懂教育的，懂孩子的，把孩子交给我是放心的，第四个我们要做的就是规避试学期的风险啊，前面我们在讲过了，课程是有试学期的，那在这个首通里面我们要把一些可能存在的风险，记录下来，那在以后这个风险你就可以去干预它。那这里呢我需要强调一句啊。这个用户呢是已经花了几千块来到了我的班上的，所以他已经认可了编程的价值，所以我们的核心任务不是告诉她，编程有多么多么厉害，多么有用啊，而是要让他相信我可以把孩子带好，把孩子教好。让他愿意持续的学下去。未后续的续报打好基础。","interact":{"q":"首通的目的包含哪些方面？","at":"P05","options":["建立初步联系,构建信任基础","收集关键信息,精准挖掘真实需求","传递课程价值,塑造专业老师形象","规避试学风险,邀约见面会建联"],"answer":0,"answers":[0,1,2,3],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":8,"stage":"首通电话全流程·阶段2","p":"P06","topic":"","script":"我们进入第二部分：首通前的充分准备。老话说，不打无准备之仗。家长是因为有期待才报的课，如果你打过去，连孩子几年级、因为什么报的课都不知道，家长的第一反应就是：这个老师不靠谱。对你的第一印象就很差。第一印象不好后续也很难挽回。所以，准备工作，是这通电话的地基。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":9,"stage":"首通电话全流程·阶段2","p":"P07","topic":"","script":"首通前的准备工作从哪里入手？准备工作的核心原则，四个字：知己知彼。具体做三件事。\n第一，复盘历史沟通轨迹。翻一翻用户过往的咨询记录，和上一任老师的聊天记录，梳理他咨询过哪些细节、聊到过哪些节点，里面很可能藏着意向线索或者隐藏的异议。第二，回顾家长反馈记录。挖掘这个家庭核心的教育诉求，预判家长可能会问什么、顾虑什么、关注什么。第三，分析上阶段课程互动数据。互动频次，锁定孩子的兴趣重心。并且分析孩子的上课时长，以及互动数据推断出孩子是自信型？还是内向型？是否喜欢玩游戏，是否存在不认真上课的情况？\n这三件事在打电话之前都很重要，都必须要做","interact":{"q":"准备工作的核心原则是：知己知彼","at":"P07","options":["对","错"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":10,"stage":"首通电话全流程·阶段2","p":"P08","topic":"","script":"原则讲完了，具体看一下怎么操作。通话前必须完成。\n第一步，我们的crm系统是可以了解家长和上一任老师沟通的基本情况、历史聊天记录、通话记录等待。这里特别要注意两点：一是警惕退费风险，二是看清家长的报课需求。\n具体看哪些地方？带大家看一下后台。班级信息。看当前所在班级、进出班记录，孩子之前上过几次课，通话次数、接通率、平均通话时长，还有聊天记录次数——这都能看到。通话记录和聊天记录。能听录音就听录音，能看聊天就看聊天，重点看家长说过什么、之前的老师是怎么跟的。\n（举个例子）大家看截图里这个数据：通话25次，接通率88%，平均通话时长3分19秒；聊天累计343次，老师发了283次，家长只回了60次。这说明什么？家长是被动型的，话少。那你这通电话，就要多引导、多提问，而不是干巴巴地介绍课程。\n做完这些，你要达成的目标只有一个——让家长感觉：核桃编程“前后衔接靠谱”，老师们都是很认真负责的会交接她家孩子的具体情况，报课之前有人管，报课之后更有人管。下一任老师可以做的更好。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":11,"stage":"首通电话全流程·阶段2","p":"P09","topic":"","script":"大家要注意，每个用户的诉求都各有不同。有的家长想让孩子升学，有的想锻炼思维，有的就是先试试看。所以光准备还不够，还要“甄别归类”。所以我们看完沟通记录之后要学会给用户分层，及时记录到学情表里面。这页的内容就是教大家，如何给用户进行分类：我们可以根据自己掌握的轨迹信息或者和上一任老师沟通进行甄别；\n第一类：思维型，用户画像:普娃,追求孩子快乐成长与可感知进步,提供趣味编程学习与托管服务。\n第二类升学型用户画像:牛娃,目标顶级竞赛成绩与特殊升学最优解,追求顶尖资源与效率。\n第三类：混合型\n(既要又要)用户画像:普娃,兼顾兴趣与升学,需可量化成果、行为改变及升学希望证明。","interact":{"q":"光看聊天记录和轨迹就能给用户准确分层吗？","at":"P09","options":["对","错"],"answer":1,"answers":[1],"vote":false,"wrong":"仅弹正确提示继续\n正确提示：我们还需要自己跟家长来打电话了解情况切实的去分层，家长的需求是有可能会变动的"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":12,"stage":"首通电话全流程·阶段2","p":"P10","topic":"","script":"打完电话之后一定要填写学情表，把你了解到的信息记录下来。越细节越好，因为我们带的用户比较多，我们没有办法详细的记住每个用户的诉求。及时的记录学情表，可以帮助我们在任何阶段迅速检索家长的信息，做到任何时段的“知己知彼，百战不殆”。后续入组，学部也会提供统一的模板，我们只需要认真记录就可以啦。\n我们来看一张真实的合格的学情表。表头有用户ID、姓名、首通时间、首通录音、年级、性格、成绩、需求、上课设备、编程基础、风险预警重点这些字段。注意看最右边两列——“风险预警重点”和“高危用户”，标了红、黄、绿灯。比如有一个孩子，备注写“孩子时间排满，课前直播来不及，第一次试课”，风险预警标了黄灯——这种家长，就要置顶微信，重点跟进，避免流失。多做额外的服务去维护。而绿灯的家长，正常维护就好，但是也不能掉以轻心。家长的意向也会改变。\n这就是分层：信息越全，你打电话的时候心里越有底。","interact":{"q":"哪类家长需要重点关注？","at":"P10","options":["首通提出试课","查看沟通轨迹家长提出孩子不感兴趣","家长提出孩子时间紧张","家长提出课前直播不参加"],"answer":0,"answers":[0,1,2,3],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":13,"stage":"首通电话全流程·阶段2","p":"P11","topic":"","script":"下面我们来看看真实案例，都来自我们后台的录音和聊天记录。大家重点要看家长会在跟班主任的沟通里面抛出自己在意的点或者需要老师在意的点\n第一案例，老师在和家长反馈孩子的学习情况，家长却回复感觉专注力越来越差现在。说明家长是很想要去提升孩子的专注力，担心学习达不到想要的效果。","interact":{"q":"如果你是这个老师你会怎么做？","at":"P11","options":["继续夸奖孩子，不理会，家长听到夸奖就会放心；","接着家长的话回复专注力的问题。"],"answer":1,"answers":[1],"vote":false,"wrong":"直接继续"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":14,"stage":"首通电话全流程·阶段2","p":"P11-2","topic":"","script":"那我们来看看这位老师是怎么回复的？老师并没有对家长的担忧置之不理。而是发出这是第一课的知识点汇总,提出这些知识帮助宝贝理解了如何按照顺序执行任务,学会一步一步分析解决问题,在生活中做计划、理步骤也会更清晰!解决了家长针对于专注力的顾虑。紧接着家长又提出孩子现在写字难看,阅读理解差，然后就是专注力和钻研的精神没有。这位老师又针对于家长的顾虑给出了具体的解决方案让家长感到安心。","interact":{"q":"如果家长和你提出老师孩子专注力差，该怎么办？","at":"P12","options":["提出编程上课模式对思维的帮助和专注力的帮助","留到电话在解决。"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":15,"stage":"首通电话全流程·阶段2","p":"P11-3","topic":"","script":"再看一下这个案例：家长提出孩子比较马虎，老师就会根据家长的顾虑给出具体的解决方案。针对马虎：老师会提出,编程它是一个非常严谨的学科,但过程中但凡孩子多写一个代码,少写一个代码,错写一个代码,那他的整个程序就会出现bug。就走不通了,没有办法再往下进行。强化编程对于孩子审题能力的帮助。\n所以，请大家记住一个共同点：家长说什么，你就接什么；家长担心什么，你就给什么方案。千万不要自说自话。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":16,"stage":"首通电话全流程·阶段2","p":"P12","topic":"","script":"学会了如何接住家长的顾虑，但信息总有不全的时候。那如果准备阶段信息就是不够，怎么办？可能家长没有接过电话也没有过多跟上一任老师沟通，但是还是购买了我们的课程那怎么办？办法只有一个，在通话中用提问补回来。这里有一个核心原则：善用开放式提问，挖掘关键细节。学会正确提问。\n什么叫开放式提问？就是避免封闭式的“是”或“否”回答，家长回复完你也不知道怎么接，通话就会很尴尬。多用开放的问题引导家长多维度表达，弥补信息差。引导家长主动聊起来，我们看两个场景示例。\n场景示例一，背景摸底。你不要问“孩子之前学过编程吗？”——这种问题，家长一句“学过”或“没学过”就结束了。试试这样问：“孩子之前有没有接触过编程相关的内容、课程或者小游戏呢？”“接触过”和“学过”是两个概念，家长会多说很多信息，你还能顺带了解孩子的兴趣程度。\n场景示例二，需求挖掘。不要问“您希望孩子提升成绩吗？”可以这样问：“您希望孩子通过学习编程，在逻辑思维、动手能力或其他方面，获得哪些具体的提升？”你给家长几个方向，他就容易说出真实期待，你也就知道这通电话后面往哪使劲。","interact":{"q":"家长提出不知道学编程的目的是什么,应该怎么接？","at":"P14","options":["没关系，咱们慢慢发掘。（错误答案）","您希望孩子通过学习编程，在逻辑思维、动手能力或其他方面，获得哪些具体的提升"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":17,"stage":"首通电话全流程·阶段3","p":"P13","topic":"","script":"学会了首通前的准备工作，接下来我们一起看看，今天最重要的部分：首通的流程和话术梳理吧！","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":18,"stage":"首通电话全流程·阶段3","p":"P15","topic":"","script":"刚刚我们已经学完了理论知识，接下来一起来梳理一下这通电话我们到底该怎么样去打？在了解完用户的情况之后，电话沟通第一时间肯定是要先温柔的告诉他，我为什么要去给您打这个电话，简单的介绍一下自己的身份和职责。再跟家长去确认一些我们上课相关信息，比如说上课时间，孩子上课的设备，那这些基础信息我们都了解了之后，就该我们来探寻家长的需求了，首先第一个要去跟家长确认一下家里是谁平时负责孩子的学习呀，接着讲一下在算法阶段的一些课程安排和价值内容，去问一问家长的需求点，咱们在了解了需求之后带班期间针对性的给孩子去做一些规划啊再问一问他前面上课的时候有没有一些卡点？同时也可以针对他的赛考成绩去给他简单的做一些分析，为我们接下来在第二个level的赛事招报去小小的铺垫一下，那通过这些内容，家长了解你了，你也对家长的需求有了解了，在电话的最后我们还需要把重点内容去总结一下。挂掉电话以后，需要把这些内容在微信上给家长再发一下，这个目的就是在再次强化一下咱们和家长这通电话里面沟通的内容。","interact":{"q":"首通电话分为哪几大步骤？","at":"P16","options":["破冰·立人设","挖需·下切法","收尾·固化信任"],"answer":0,"answers":[0,1,2],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法","dept":"武汉铁军"},{"row":19,"stage":"首通电话全流程·阶段3","p":"P16","topic":"","script":"刚刚我们已经学完了理论知识，接下来一起来梳理一下这通电话我们到底该怎么样去打？首先大家要明确现在你班上的这一部分用户都已经学习过半年的编程了，所以在班的家长和孩子其实对我们的上课模式和老师的上课方式其实都有一定的了解了，那我们作为即将要带孩子的新老师，我们要做的第一个事情就是先用你已经知道的一些信息去告诉他，我确实和前任老师针对咱们孩子的情况已经有过交接了，我是了解孩子的一个老师，而不是一个纯纯的新老师，啥都不知道的，第二个呢也要主动的去跟家长说一下为什么要换老师，而是因为课程升级了。所以说给咱们换了一个更专业的老师，接下来把一些上课的基础信息跟他说一下，时间、硬件材料的确认，那在这些信息确认完了之后就到了，我们要找家长去了解一些他的需求了，首先第一部分是识别风险部分，那这块我们的逐字稿上有几部分的内容，大家可以看一下，针对你在扒轨迹的时候发现家长可能潜在的风险点，那你在这个部分都可以先问问家长接着再把风险了解的差不多了之后啊，一定要去往学情表上去记录。下一部分呢就到了考级部分了，可以了解一下上个学期孩子有没有参加过比赛呀？问问家长对比赛的需求和看法是什么，那你再接下来给去讲我们算法阶段的一些价值、课程内容你也可以根据家长的需求针对性的给家长去进行讲解，那这些需求我们了解完了之后就到了今天这通电话的结束环节了，跟家长确认一下见面会的时间以及转介绍活动是否想要去参加的，然后把这些重点的东西再到微信上给他再闭环一下，强化一下今天这通电话的内容。","interact":{"q":"首通电话分为哪几大步骤？","at":"P16","options":["破冰·立人设","挖需·下切法","收尾·固化信任"],"answer":0,"answers":[0,1,2],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"西安2部"},{"row":20,"stage":"首通电话全流程·阶段3","p":"P17","topic":"","script":"刚刚我们已经学完了理论知识，接下来一起来梳理一下这通电话我们到底该怎么样去打？在了解完用户的情况之后，电话沟通第一时间肯定是要先温柔的告诉他，我为什么要去给您打这个电话，简单的介绍一下自己的身份和职责。再跟家长去确认一些我们上课相关信息，比如说上课时间，学习周期，还有孩子上课的设备，那这些基础信息我们都了解了之后，就该我们来探寻家长的需求了，首先第一个要去跟家长确认一下家里是谁平时负责孩子的学习呀，这个学习的负责人一般什么时候有时间啊？方便后续你来跟家长去沟通孩子的学习情况？接着讲一下在算法阶段的一些课程安排和价值内容，去问一问家长的需求点，咱们在了解了需求之后带班期间针对性的给孩子去做一些规划啊再问一问他前面上课的时候有没有一些卡点？同时也可以针对他的赛考成绩去给他简单的做一些分析，为我们接下来在第二个level的赛事招报去小小的铺垫一下，那通过这些内容，家长了解你了，你也对家长的需求有了解了，在电话的最后我们还需要把重点内容去总结一下。挂掉电话以后，需要把这些内容在微信上给家长再发一下，这个目的就是在再次强化一下咱们和家长这通电话里面沟通的内容。","interact":{"q":"首通电话分为哪几大步骤？","at":"P16","options":["破冰·立人设","挖需·下切法","收尾·固化信任"],"answer":0,"answers":[0,1,2],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法","dept":"霞霞部"},{"row":21,"stage":"首通电话全流程·阶段3","p":"P18","topic":"","script":"首通框架已经梳理完了，如果你拿到了我们的首通话术，现在趁热打铁。按照我们的框架结构把你手里的这份逐字稿，梳理一下吧。\n把我们的话术从头到尾读一遍，要有感情哦~","interact":{"q":"是否完成熟读一遍话术？","at":"P17","options":["是","否"],"answer":-1,"answers":[],"vote":true,"wrong":"直接继续"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":22,"stage":"首通电话全流程·阶段4","p":"P19","topic":"","script":"流程和话术都讲完了，最后我们来看：什么样的首通电话才算达标？这就是第四部分——首通的标准与要求。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":23,"stage":"首通电话全流程·阶段4","p":"P20","topic":"","script":"刚刚我们把首通电话的完整框架拆解清楚了，那框架落地，离不开我们这一页的四大标准与要求，这是我们每一通首通电话的底层准则，一共四点：专业规范先行、需求深度挖掘、沟通高效简洁、传递服务温度。\n 首先第一点，专业规范先行。 大家一定要记住，开场白、结束语，都要严格按照我们的标准话术来执行，不能随心所欲。规范不是束缚，是帮我们第一时间建立专业靠谱的职业形象。家长接起电话的前 30 秒，就会形成对我们的第一印象，规范得体的表达，就是信任的起点。\n 第二点，需求深度挖掘。 这刚好对应上一页框架里 “挖需・下切法”。我们不能单向给家长灌输信息，要多用开放式提问，少用是不是、对不对这类封闭式问题。引导家长多说，把他真实的想法、顾虑、期待讲出来，我们才能抓住家长的痛点和潜在需求，后面的辅导规划、价值传递才能说到点子上，这也是后续转化的基础。\n 第三点，沟通高效简洁。 首通是有时间节奏的，我们要学会把控通话节奏，不要漫无目的地闲聊、做无效寒暄。我们每一句话都要服务沟通目标，清晰地传递核心信息，在有限的通话时长里，把该同步、该确认、该挖掘的内容落地完成，不拖沓、不跑题。\n 第四点，传递服务温度。 规范、专业、高效，不等于冷冰冰的背书。通话全程语调要热情亲切，打电话的时候，家长看不到我们的表情，但能听出我们的状态。我们要敏锐捕捉家长的情绪，家长有担心、有疑问，及时给到积极回应和专业建议，让家长感受到我们是真心为孩子考虑，而不是走流程打电话，用真诚拉近距离。\n 这四条标准，是相辅相成的。专业规范打底，深度挖掘抓需求，高效沟通控节奏，最后用温度留住好感。大家在后续练首通的时候，不光要背框架，还要用这四条标准自检自己的通话，每一通电话都对照这四点去复盘优化。","interact":{"q":"首通的标准与要求是？","at":"P19","options":["专业规范先行","需求深度挖掘","沟通高效简洁","传递服务温度"],"answer":0,"answers":[0,1,2,3],"vote":false,"wrong":"直接继续"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":24,"stage":"首通电话全流程·阶段4","p":"P21","topic":"","script":"刚我们讲完了四大沟通原则，接下来这 9 条，是我们首通电话落地的硬性执行细则，是大家打完每一通电话，用来自查、质检用来打分的标尺，每一条都要记牢。\n\n 一、信息完整 + 流程正确 我们要严格按照前面首通框架走，这是很多优秀老师总结的经验。破冰、挖需、收尾三个环节不能缺项，该确认、该同步的信息全部落实到位，不跳流程、不漏信息。\n 二当日完成 100% 首通有很强的时效性，我们要做到当天学员首通全部打完，不积压、不拖到第二天，保证家长的报名体感。建立及时的信任。\n三 完善数据表 通话结束不是工作终点，打完电话第一时间把挖到的需求、家长顾虑、孩子情况、风险点全部填进数据表。数据表是我们后续跟进、续报的依据，信息记录越全，后面服务越精准。\n 四 笑着打电话 大家别觉得对方看不见就无所谓，微笑是可以通过声音传递出去的。带着笑意沟通，语调会更柔和亲切，家长接电话的感受完全不一样，这也是我们传递服务温度最简单的办法。\n 五自信表述 跟家长沟通的时候，不要含糊、不要怯场。我们是专业的编程辅导老师，熟悉课程、熟悉孩子的学习路径，底气足，家长才愿意相信我们给到的规划和建议。\n 六 不打断 家长在表达想法、吐槽顾虑的时候，耐心听完，不要中途抢话打断。打断很容易让家长产生抵触感，沟通氛围一下子就变差了。\n 七 多听家长说 首通不是我们单方面宣讲，要学会把话语权交给家长，多听、多收集信息，我们才能找准家长真实诉求，而不是自顾自背话术。\n 八、互动式沟通 拒绝单向念稿，多提问、多呼应，跟家长一来一回交流。有问有答才叫沟通，单向输出只会让家长觉得枯燥，容易敷衍结束通话。\n 九、有效沟通≥15 分钟 这里划重点，不是凑时长，是有效沟通。刨除无效寒暄，真正做到挖需求、聊规划、对齐问题，有效沟通时长不少于 15 分钟，太短很难把需求挖透、建立信任。\n 这 9 条，前面 5 条是对我们自己工作动作、状态的要求，后面 4 条是通话过程里的沟通行为准则，后续我们模拟演练、质检复盘，都会对照这 9 条来核对。","interact":{"q":"关于核桃编程首通电话执行标准，以下说法正确的是？","at":"P20","options":["首通电话可以延后到次日完成","家长说话时，为了效率可以及时打断、快速引导","首通需要做到互动式沟通，有效沟通时长≥15 分钟","通话结束后，数据表可以隔天再完善"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":25,"stage":"首通电话全流程·阶段4","p":"P22","topic":"","script":"前面我们学习了首通的框架、沟通细则，那一通电话打完，到底好不好、能不能过关，就用这张通话质量评估表来打分。总分 100 分，一共四大维度，每个维度 25 分：流程、规划、表达、答疑\n 首先是流程分，25 分。考核两件事：一是整套首通流程完不完整，开场、信息确认、挖需求、学习规划、总结，环节不能缺；二是信息准不准确，开课时间、周期、设备、赛事这些关键信息不能说错。\n 0–14 分：流程缺步骤，或者反复啰嗦、内容冗长；\n 15–20 分：流程完整，没有知识点错误，这是我们的基础合格档；\n 21–25 分：流程完整干净，语言简洁，还能结合孩子情况做额外补充，属于高分。\n 第二块，规划，25 分，这是最考验大家专业功底的一项。包含课程体系和个性化学习规划两部分，要清楚核桃有哪些课程、课程之间的衔接，还要结合孩子基础、家长期待给出适配路线，包括赛事方向。\n 0–14 分：只能零散提几句规划，讲起来卡顿、不顺畅；\n 15–20 分：可以顺畅讲清楚课程体系和赛考相关内容；\n 21–25 分：自然过渡、自信输出，能根据不同孩子定制专属学习、赛事路径，引导家长看懂长期价值，是我们要冲刺的高分标准。\n 第三项，表达，25 分。电话沟通，家长看不到我们，全部靠声音传递状态。\n 0–14 分：语气冷淡、磕绊多、语速不稳，甚至出现让家长不舒服的反问；\n 15–20 分：表达通顺自然，偶尔小卡顿，不影响理解，语气有起伏；\n 21–25 分：语气热情、应答流畅，亲和力强，听着舒服。\n \n最后一项，答疑，25 分，也就是应对家长疑问、异议的能力。\n 0–14 分：抓不住家长真实想法，回答生硬、解决不了诉求；\n 15–20 分：有回应，但是没办法完全打消家长顾虑；\n 21–25 分：从容解决问题，还能顺着家长的提问深挖背后深层需求，给到可行建议，这是最高标准。\n \n流程保证我们不走漏环节，规划体现我们的专业度，表达传递我们的服务温度，答疑检验我们的应变能力。四个维度缺一不可。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":26,"stage":"首通电话全流程·阶段4","p":"P23","topic":"","script":"恭喜完成本次学习，请使用飞书扫二维码。请填写你的真实感受吧!","interact":{"q":"是否已完成问卷填写？","at":"P22","options":["是","否"],"answer":0,"answers":[0],"vote":false,"wrong":"直接继续"},"sku":"3299算法\n2699算法","dept":"通用"}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"首通电话全流程·阶段1","q":"我们的首通电话，是在哪个节点进行的课导和家长的第一通电话？","options":[{"k":"B","t":"家长付完钱之后"},{"k":"C","t":"家长刚咨询还未报名时"},{"k":"D","t":"续报沟通的时候"}],"answer":"B","back":"","sku":""},{"id":"T-S02","type":"阶段练习题","chapter":"首通电话全流程·阶段1","q":"对于家长来说，首通电话要达成的目标不包含以下哪一项？","options":[{"k":"A","t":"和家长建立信任关系"},{"k":"B","t":"让家长清楚课程、老师服务内容"},{"k":"C","t":"针对性解决家长疑虑"},{"k":"D","t":"当场说服家长续费"}],"answer":"D","back":"","sku":""},{"id":"T-S03","type":"阶段练习题","chapter":"首通电话全流程·阶段1","q":"课导老师视角，首通电话的核心目标，不包括","options":[{"k":"A","t":"了解家长和孩子基础信息"},{"k":"B","t":"挖掘孩子潜在学习需求、痛点"},{"k":"C","t":"判断用户类型，弄清报名编程课原因"},{"k":"D","t":"直接给孩子安排好赛事获奖方案"}],"answer":"D","back":"","sku":""},{"id":"T-S04","type":"阶段练习题","chapter":"首通电话全流程·阶段1","q":"首通电话的价值包含 4 项，以下描述错误的是","options":[{"k":"A","t":"和家长建立初步联系，搭建信任基础"},{"k":"B","t":"收集孩子年级、成绩、性格等基础信息"},{"k":"C","t":"传递课程价值，塑造懂教育、懂孩子的老师形象"},{"k":"D","t":"首通可以不用记录风险，等到试学期出问题再处理"}],"answer":"D","back":"","sku":""},{"id":"T-S05","type":"阶段练习题","chapter":"首通电话全流程·阶段1","q":"已经报名编程课的家长，首通电话我们的核心任务是？","options":[{"k":"A","t":"重点大肆宣传编程有多厉害、用处多大"},{"k":"B","t":"让家长相信我们能带好孩子、教好孩子，为后续续报打底"},{"k":"C","t":"先给家长推销更高价位的课程包"},{"k":"D","t":"询问家长要不要参加赛考"}],"answer":"B","back":"","sku":""},{"id":"T-S06","type":"阶段练习题","chapter":"首通电话全流程·阶段2","q":"首通前准备工作的核心原则，可以概括为四个字？","options":[{"k":"A","t":"知己知彼"},{"k":"B","t":"有问必答"},{"k":"C","t":"主动推销"},{"k":"D","t":"快速开场"}],"answer":"A","back":"","sku":""},{"id":"T-S07","type":"阶段练习题","chapter":"首通电话全流程·阶段2","q":"关于复盘历史沟通轨迹，下面说法错误的是","options":[{"k":"A","t":"回看之前咨询记录，挖掘潜在诉求"},{"k":"B","t":"预判家长疑问、关注点，拆分阶段目标"},{"k":"C","t":"锁定孩子兴趣、上课状态、是否认真上课"},{"k":"D","t":"通话开始之后再去翻看历史记录"}],"answer":"D","back":"","sku":""},{"id":"T-S08","type":"阶段练习题","chapter":"首通电话全流程·阶段2","q":"下面哪一项不属于课件里划分的用户画像类型？","options":[{"k":"A","t":"普娃：追求快乐与可感知进步"},{"k":"B","t":"牛娃：目标顶级竞赛成绩"},{"k":"C","t":"混合型：兼顾兴趣 + 升学成果"},{"k":"D","t":"躺平型：完全不想孩子学习"}],"answer":"D","back":"","sku":""},{"id":"T-S09","type":"阶段练习题","chapter":"首通电话全流程·阶段2","q":"学情表里面的风险预警重点，用红黄绿三色标记，下面说法正确的是","options":[{"k":"A","t":"红色预警家长：不用重点关注，正常维护即可"},{"k":"B","t":"黄色预警家长：课上重点盯、提前规避风险"},{"k":"C","t":"绿色预警家长：可以完全不用维护，放任不管"},{"k":"D","t":"信息填得越简略，打电话底气越足"}],"answer":"B","back":"","sku":""},{"id":"T-S10","type":"阶段练习题","chapter":"首通电话全流程·阶段2","q":"关于开放式提问，描述正确的是","options":[{"k":"A","t":"用 “是 / 否” 就能回答，快速结束对话"},{"k":"B","t":"引导家长多说，表达真实想法，补齐信息"},{"k":"C","t":"示例：孩子之前学过编程吗？（只能回答学过 / 没学过）"},{"k":"D","t":"信息不足时，直接自己猜测家长诉求"}],"answer":"B","back":"","sku":""},{"id":"T-S11","type":"阶段练习题","chapter":"首通电话全流程·阶段3","q":"首通电话标准框架分为哪三大模块？","options":[{"k":"A","t":"自我介绍→讲课程→催续费"},{"k":"B","t":"破冰立人设、挖需下切法、收尾固化信任"},{"k":"C","t":"询问学情→分析问题→安排赛事"},{"k":"D","t":"核实信息→推送资料→预约下次通话"}],"answer":"B","back":"","sku":""},{"id":"T-S12","type":"阶段练习题","chapter":"首通电话全流程·阶段3","q":"破冰立人设环节一共包含三件事，以下哪一项不属于？","options":[{"k":"A","t":"清晰表明身份，告知家长你是谁、负责孩子事项"},{"k":"B","t":"夸奖孩子，优先抓体验课闪光点"},{"k":"C","t":"顺势加微信，延伸沟通阵地"},{"k":"D","t":"直接询问家长是否报名赛考"}],"answer":"D","back":"","sku":""},{"id":"T-S13","type":"阶段练习题","chapter":"首通电话全流程·阶段3","q":"挖需下切法是首通核心环节，我们围绕几个方向和家长深度沟通？","options":[{"k":"A","t":"3 个"},{"k":"B","t":"4 个"},{"k":"C","t":"6 个"},{"k":"D","t":"8 个"}],"answer":"C","back":"","sku":""},{"id":"T-S14","type":"阶段练习题","chapter":"首通电话全流程·阶段3","q":"关于收尾固化信任环节的三点内容，说法错误的是","options":[{"k":"A","t":"和家长交流体验课体感发掘问题，沟通后续调整方案"},{"k":"B","t":"确认硬件、上课地址等基础问题，保障上课顺畅"},{"k":"C","t":"再次给到家长安心感，夯实信任"},{"k":"D","t":"收尾时快速抛出赛考，让家长确认是否报名"}],"answer":"D","back":"","sku":""},{"id":"T-S15","type":"阶段练习题","chapter":"首通电话全流程·阶段3","q":"整套首通电话全程的两个核心要求是？","options":[{"k":"A","t":"语速快、时间短"},{"k":"B","t":"情绪饱满贯彻始终，人设建立形象饱满"},{"k":"C","t":"多提问、少讲解"},{"k":"D","t":"优先讲竞赛、多展示获奖案例"}],"answer":"B","back":"","sku":""},{"id":"T-S16","type":"阶段练习题","chapter":"首通电话全流程·阶段4","q":"首通电话的四大标准与底层准则，不包含下面哪一项？","options":[{"k":"A","t":"专业规范先行"},{"k":"B","t":"需求深度挖掘"},{"k":"C","t":"高效沟通简洁"},{"k":"D","t":"优先推销续报"}],"answer":"D","back":"","sku":""},{"id":"T-S17","type":"阶段练习题","chapter":"首通电话全流程·阶段4","q":"首通电话硬性执行细则里，要求首通完成的时效是？","options":[{"k":"A","t":"3 天内完成"},{"k":"B","t":"当日完成 100%"},{"k":"C","t":"周末统一完成"},{"k":"D","t":"进班3 天后"}],"answer":"B","back":"","sku":""},{"id":"T-S18","type":"阶段练习题","chapter":"首通电话全流程·阶段4","q":"关于首通有效沟通时长，说法正确的是","options":[{"k":"A","t":"越长越好，最好超过 30 分钟"},{"k":"B","t":"有效沟通大于15 分钟，不是凑时长，要有问有答双向沟通"},{"k":"C","t":"控制在 5 分钟以内快速结束"},{"k":"D","t":"只要说完话术，时长不做要求"}],"answer":"B","back":"","sku":""},{"id":"T-S19","type":"阶段练习题","chapter":"首通电话全流程·阶段4","q":"首通质量评估打分表一共四大维度","options":[{"k":"A","t":"流程"},{"k":"B","t":"规划"},{"k":"C","t":"表达"},{"k":"D","t":"续报"}],"answer":"D","back":"","sku":""},{"id":"T-S20","type":"阶段练习题","chapter":"首通电话全流程·阶段4","q":"关于【表达】维度高分（21-25 分）的标准描述正确的是","options":[{"k":"A","t":"语气平淡，磕磕绊绊"},{"k":"B","t":"表达通顺自然，偶尔卡顿，不影响理解"},{"k":"C","t":"语气热情、应答流畅，亲和力强"},{"k":"D","t":"只会机械背诵话术，没有语气起伏"}],"answer":"C","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"我们的首通电话，是在哪个节点进行的课导和家长的第一通电话？","options":[{"k":"A","t":"孩子上完正式课之后"},{"k":"B","t":"家长付完钱之后"},{"k":"C","t":"家长刚咨询还未报名时"},{"k":"D","t":"续报沟通的时候"}],"answer":"B","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通的核心目的“不”包含以下哪一项","options":[{"k":"A","t":"建立初步联系，构建信任基础"},{"k":"B","t":"收集关键信息，精准挖掘真实需求"},{"k":"C","t":"推销赛事，引导家长报名"},{"k":"D","t":"传递课程价值，塑造专业老师形象"}],"answer":"C","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"用户分层类型不包含下面哪一类","options":[{"k":"A","t":"思维型"},{"k":"B","t":"混合型"},{"k":"C","t":"升学型"},{"k":"D","t":"应试型"}],"answer":"D","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通考核标准中，要求有效沟通时长需要","options":[{"k":"A","t":"≥10分钟"},{"k":"B","t":"≥15分钟"},{"k":"C","t":"≥20分钟"},{"k":"D","t":"≥25分钟"}],"answer":"B","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通工作要求，首通需要在（）完成","options":[{"k":"A","t":"次日"},{"k":"B","t":"3天内"},{"k":"C","t":"当日"},{"k":"D","t":"一周内"}],"answer":"C","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通前准备工作的核心原则是","options":[{"k":"A","t":"随机应变"},{"k":"B","t":"知己知彼"},{"k":"C","t":"快速沟通"},{"k":"D","t":"优先转化"}],"answer":"B","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通电话最重要目标就是让家长直接交钱报名","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"充分的前期准备，是高效沟通与信任建立的基石","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"混合型家长，兼顾兴趣与升学，希望通过学习改变及升学希望证明","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通结束后，需要完善数据表单，做好信息记录。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F11","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通的价值是建立信任，挖掘需求，为后续转化铺路。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F12","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通不需要提前查看历史聊天记录，直接打电话即","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":""},{"id":"T-F13","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通前充分准备，需要做哪些工作","options":[{"k":"A","t":"复盘历史沟通轨迹"},{"k":"B","t":"回顾家长反馈记录"},{"k":"C","t":"分析课程互动数据"},{"k":"D","t":"提前预判家长需求类型"}],"answer":"ABCD","back":"","sku":""},{"id":"T-F14","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通完整流程包含哪几个阶段","options":[{"k":"A","t":"破冰·立人设"},{"k":"B","t":"挖掘·下切法"},{"k":"C","t":"事务确认"},{"k":"D","t":"收尾·预约见面"},{"k":"E","t":"微信闭环"}],"answer":"ABCDE","back":"","sku":""},{"id":"T-F15","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通的标准与要求包含以下哪些？（）","options":[{"k":"A","t":"信息完整＋流程正确"},{"k":"B","t":"当日完成100%"},{"k":"C","t":"完善数据表单"},{"k":"D","t":"笑着打电话，自信表述"},{"k":"E","t":"多打断家长，快速推进话术"}],"answer":"ABCD","back":"","sku":""},{"id":"T-F16","type":"本章综合测试题","chapter":"首通电话全流程·全章","q":"首通沟通需要做到的几大方向标准是","options":[{"k":"A","t":"专业规范先行"},{"k":"B","t":"需求深度挖掘"},{"k":"C","t":"沟通高效简洁"},{"k":"D","t":"传递服务温度"}],"answer":"ABCD","back":"","sku":""}],"timing":{"P01":{"sents":["各位老师，这节课要给大家讲的是首通电话的全流程。","这个电话其实对我们来说，包括对家长来说都是非常重要的一个首印象啊，大家现在可以想一下，上一次你接到陌生电话的时候，第一反应是什么？"],"durs":[5.496,12.264]},"P02":{"sents":["其实大家更多的第一反应都会把它挂掉，我们的首通是介于在家长付完钱之后，你作为课导老师跟家长的第一通电话。","那这通电话打的好不好？","其实直接决定了接下来家长对你的一个印象，比如说今天我来上课的时候穿了一个非常温柔的衣服，或者是我穿了一个朋克风的衣服，那在大家的视角里面我的第一印象就会更倾向于这个风格的人设，对家长来说也是一样的，我们跟他的第一通交流其实就可以暴露出很多问题，比如说你是不是专业的啊，你是不是温柔的，是不是足够细心的？","这些都是我们在第一个电话里，家长会比较关注的事情。","今天就会从这四个方面来给大家讲一下在首通我们到底要做些什么？"],"durs":[10.728,2.568,28.272,5.088,6.144]},"P03":{"sents":["首先我们先来讲一下这个电话为什么重要，除了刚刚我们提到的第一印象之外，一起来看看还有哪些内容是有它必须存在的价值。"],"durs":[11.52]},"P04":{"sents":["那这通电话我们要达成什么目的呢？","对用户来说啊，我们要做到的三件事情，第一个就是建立信任关系，第二个呢要让他清楚，我们这个课程是什么样子的，老师的服务是什么样子的，第三个就是针对性的去解决家长的一些疑虑。","那对我们老师来说核心目标也是三个事情，第一个我们要去通过这通电话了解到家长和孩子的基础信息，第二个要去挖掘一下用户可能能潜在的一些学习需求，痛点的问题。","第3点我们也需要去明确一下用户是什么类型的，为什么要去来报我们的编程课呢？"],"durs":[3.36,16.296,15.048,7.728]},"P05":{"sents":["目的清楚了，那这通电话具体能带来什么价值呢？","首先第一个要去跟家长建立初步的联系啊，构建信任的基础，因为家长是带着期待才报课的，对吧？","这一通电话就是我和这个家庭的第一次见面。","第二个我们需要去收集用户的信息，不管是家长还是孩子都需要收集一些基础的信息，比如说他几年级了啊？","孩子现在学校里的学习成绩怎么样，性格怎么样，这些信息在以后带班的过程中，比如说你要去给他做赛事规划或者是一些关键的节点，都会帮助到大家去更清晰的解决这个家长的疑虑。","第三个传递我们的课程价值，塑造老师的形象，要让家长感觉到，这个老师是懂教育的，懂孩子的，把孩子交给我是放心的，第四个我们要做的就是规避试学期的风险啊，前面我们在讲过了，课程是有试学期的，那在这个首通里面我们要把一些可能存在的风险，记录下来，那在以后这个风险你就可以去干预它。","那这里呢我需要强调一句啊。","这个用户呢是已经花了几千块来到了我的班上的，所以他已经认可了编程的价值，所以我们的核心任务不是告诉她，编程有多么多么厉害，多么有用啊，而是要让他相信我可以把孩子带好，把孩子教好。","让他愿意持续的学下去。","未后续的续报打好基础。"],"durs":[4.56,8.952,4.08,9.552,16.008,27.024,2.664,17.664,2.52,2.808]},"P06":{"sents":["我们进入第二部分：首通前的充分准备。","老话说，不打无准备之仗。","家长是因为有期待才报的课，如果你打过去，连孩子几年级、因为什么报的课都不知道，家长的第一反应就是：这个老师不靠谱。","对你的第一印象就很差。","第一印象不好后续也很难挽回。","所以，准备工作，是这通电话的地基。"],"durs":[3.84,2.88,10.944,2.688,3.36,4.032]},"P07":{"sents":["首通前的准备工作从哪里入手？","准备工作的核心原则，四个字：知己知彼。","具体做三件事。\n","第一，复盘历史沟通轨迹。","翻一翻用户过往的咨询记录，和上一任老师的聊天记录，梳理他咨询过哪些细节、聊到过哪些节点，里面很可能藏着意向线索或者隐藏的异议。","第二，回顾家长反馈记录。","挖掘这个家庭核心的教育诉求，预判家长可能会问什么、顾虑什么、关注什么。","第三，分析上阶段课程互动数据。","互动频次，锁定孩子的兴趣重心。","并且分析孩子的上课时长，以及互动数据推断出孩子是自信型？","还是内向型？","是否喜欢玩游戏，是否存在不认真上课的情况？\n","这三件事在打电话之前都很重要，都必须要做"],"durs":[3.384,4.416,2.04,3.144,13.008,3.048,7.488,3.792,3.6,6.408,1.872,4.608,4.8]},"P08":{"sents":["原则讲完了，具体看一下怎么操作。","通话前必须完成。\n","第一步，我们的crm系统是可以了解家长和上一任老师沟通的基本情况、历史聊天记录、通话记录等待。","这里特别要注意两点：一是警惕退费风险，二是看清家长的报课需求。\n","具体看哪些地方？","带大家看一下后台。","班级信息。","看当前所在班级、进出班记录，孩子之前上过几次课，通话次数、接通率、平均通话时长，还有聊天记录次数——这都能看到。","通话记录和聊天记录。","能听录音就听录音，能看聊天就看聊天，重点看家长说过什么、之前的老师是怎么跟的。\n","（举个例子）大家看截图里这个数据：通话25次，接通率88%，平均通话时长3分19秒；","聊天累计343次，老师发了283次，家长只回了60次。","这说明什么？","家长是被动型的，话少。","那你这通电话，就要多引导、多提问，而不是干巴巴地介绍课程。\n","做完这些，你要达成的目标只有一个——让家长感觉：核桃编程“前后衔接靠谱”，老师们都是很认真负责的会交接她家孩子的具体情况，报课之前有人管，报课之后更有人管。","下一任老师可以做的更好。"],"durs":[3.48,2.256,9.864,7.056,2.064,2.28,1.872,12.024,2.664,7.968,9.84,6.864,1.872,2.928,6.12,15.864,2.856]},"P09":{"sents":["大家要注意，每个用户的诉求都各有不同。","有的家长想让孩子升学，有的想锻炼思维，有的就是先试试看。","所以光准备还不够，还要“甄别归类”。","所以我们看完沟通记录之后要学会给用户分层，及时记录到学情表里面。","这页的内容就是教大家，如何给用户进行分类：我们可以根据自己掌握的轨迹信息或者和上一任老师沟通进行甄别；\n","第一类：思维型，用户画像:普娃,追求孩子快乐成长与可感知进步,提供趣味编程学习与托管服务。\n","第二类升学型用户画像:牛娃,目标顶级竞赛成绩与特殊升学最优解,追求顶尖资源与效率。\n","第三类：混合型\n","(既要又要)用户画像:普娃,兼顾兴趣与升学,需可量化成果、行为改变及升学希望证明。"],"durs":[4.32,5.904,3.768,7.056,10.296,10.224,9.384,2.376,9.024]},"P10":{"sents":["打完电话之后一定要填写学情表，把你了解到的信息记录下来。","越细节越好，因为我们带的用户比较多，我们没有办法详细的记住每个用户的诉求。","及时的记录学情表，可以帮助我们在任何阶段迅速检索家长的信息，做到任何时段的“知己知彼，百战不殆”。","后续入组，学部也会提供统一的模板，我们只需要认真记录就可以啦。\n","我们来看一张真实的合格的学情表。","表头有用户ID、姓名、首通时间、首通录音、年级、性格、成绩、需求、上课设备、编程基础、风险预警重点这些字段。","注意看最右边两列——“风险预警重点”和“高危用户”，标了红、黄、绿灯。","比如有一个孩子，备注写“孩子时间排满，课前直播来不及，第一次试课”，风险预警标了黄灯——这种家长，就要置顶微信，重点跟进，避免流失。","多做额外的服务去维护。","而绿灯的家长，正常维护就好，但是也不能掉以轻心。","家长的意向也会改变。\n","这就是分层：信息越全，你打电话的时候心里越有底。"],"durs":[5.712,7.32,9.6,6.192,3.384,12.672,6.72,13.392,2.64,5.208,2.472,5.352]},"P11":{"sents":["下面我们来看看真实案例，都来自我们后台的录音和聊天记录。","大家重点要看家长会在跟班主任的沟通里面抛出自己在意的点或者需要老师在意的点\n","第一案例，老师在和家长反馈孩子的学习情况，家长却回复感觉专注力越来越差现在。","说明家长是很想要去提升孩子的专注力，担心学习达不到想要的效果。"],"durs":[5.712,7.728,8.352,6.792]},"P11-2":{"sents":["那我们来看看这位老师是怎么回复的？","老师并没有对家长的担忧置之不理。","而是发出这是第一课的知识点汇总,提出这些知识帮助宝贝理解了如何按照顺序执行任务,学会一步一步分析解决问题,在生活中做计划、理步骤也会更清晰!解决了家长针对于专注力的顾虑。","紧接着家长又提出孩子现在写字难看,阅读理解差，然后就是专注力和钻研的精神没有。","这位老师又针对于家长的顾虑给出了具体的解决方案让家长感到安心。"],"durs":[3.624,3.72,17.616,8.712,6.624]},"P11-3":{"sents":["再看一下这个案例：家长提出孩子比较马虎，老师就会根据家长的顾虑给出具体的解决方案。","针对马虎：老师会提出,编程它是一个非常严谨的学科,但过程中但凡孩子多写一个代码,少写一个代码,错写一个代码,那他的整个程序就会出现bug。","就走不通了,没有办法再往下进行。","强化编程对于孩子审题能力的帮助。\n","所以，请大家记住一个共同点：家长说什么，你就接什么；","家长担心什么，你就给什么方案。","千万不要自说自话。"],"durs":[8.592,13.944,3.504,3.744,5.616,3.192,2.232]},"P12":{"sents":["学会了如何接住家长的顾虑，但信息总有不全的时候。","那如果准备阶段信息就是不够，怎么办？","可能家长没有接过电话也没有过多跟上一任老师沟通，但是还是购买了我们的课程那怎么办？","办法只有一个，在通话中用提问补回来。","这里有一个核心原则：善用开放式提问，挖掘关键细节。","学会正确提问。\n","什么叫开放式提问？","就是避免封闭式的“是”或“否”回答，家长回复完你也不知道怎么接，通话就会很尴尬。","多用开放的问题引导家长多维度表达，弥补信息差。","引导家长主动聊起来，我们看两个场景示例。\n","场景示例一，背景摸底。","你不要问“孩子之前学过编程吗？”","——这种问题，家长一句“学过”或“没学过”就结束了。","试试这样问：“孩子之前有没有接触过编程相关的内容、课程或者小游戏呢？”","“接触过”和“学过”是两个概念，家长会多说很多信息，你还能顺带了解孩子的兴趣程度。\n","场景示例二，需求挖掘。","不要问“您希望孩子提升成绩吗？”","可以这样问：“您希望孩子通过学习编程，在逻辑思维、动手能力或其他方面，获得哪些具体的提升？”","你给家长几个方向，他就容易说出真实期待，你也就知道这通电话后面往哪使劲。"],"durs":[5.256,3.768,8.04,4.128,5.664,1.968,2.256,7.92,5.304,4.296,2.904,3.024,4.848,7.32,7.896,2.928,2.928,9.36,7.296]},"P13":{"sents":["学会了首通前的准备工作，接下来我们一起看看，今天最重要的部分：首通的流程和话术梳理吧！"],"durs":[8.664]},"P15":{"sents":["刚刚我们已经学完了理论知识，接下来一起来梳理一下这通电话我们到底该怎么样去打？","在了解完用户的情况之后，电话沟通第一时间肯定是要先温柔的告诉他，我为什么要去给您打这个电话，简单的介绍一下自己的身份和职责。","再跟家长去确认一些我们上课相关信息，比如说上课时间，孩子上课的设备，那这些基础信息我们都了解了之后，就该我们来探寻家长的需求了，首先第一个要去跟家长确认一下家里是谁平时负责孩子的学习呀，接着讲一下在算法阶段的一些课程安排和价值内容，去问一问家长的需求点，咱们在了解了需求之后带班期间针对性的给孩子去做一些规划啊再问一问他前面上课的时候有没有一些卡点？","同时也可以针对他的赛考成绩去给他简单的做一些分析，为我们接下来在第二个level的赛事招报去小小的铺垫一下，那通过这些内容，家长了解你了，你也对家长的需求有了解了，在电话的最后我们还需要把重点内容去总结一下。","挂掉电话以后，需要把这些内容在微信上给家长再发一下，这个目的就是在再次强化一下咱们和家长这通电话里面沟通的内容。"],"durs":[7.152,11.832,34.2,19.368,11.256]},"P16":{"sents":["刚刚我们已经学完了理论知识，接下来一起来梳理一下这通电话我们到底该怎么样去打？","首先大家要明确现在你班上的这一部分用户都已经学习过半年的编程了，所以在班的家长和孩子其实对我们的上课模式和老师的上课方式其实都有一定的了解了，那我们作为即将要带孩子的新老师，我们要做的第一个事情就是先用你已经知道的一些信息去告诉他，我确实和前任老师针对咱们孩子的情况已经有过交接了，我是了解孩子的一个老师，而不是一个纯纯的新老师，啥都不知道的，第二个呢也要主动的去跟家长说一下为什么要换老师，而是因为课程升级了。","所以说给咱们换了一个更专业的老师，接下来把一些上课的基础信息跟他说一下，时间、硬件材料的确认，那在这些信息确认完了之后就到了，我们要找家长去了解一些他的需求了，首先第一部分是识别风险部分，那这块我们的逐字稿上有几部分的内容，大家可以看一下，针对你在扒轨迹的时候发现家长可能潜在的风险点，那你在这个部分都可以先问问家长接着再把风险了解的差不多了之后啊，一定要去往学情表上去记录。","下一部分呢就到了考级部分了，可以了解一下上个学期孩子有没有参加过比赛呀？","问问家长对比赛的需求和看法是什么，那你再接下来给去讲我们算法阶段的一些价值、课程内容你也可以根据家长的需求针对性的给家长去进行讲解，那这些需求我们了解完了之后就到了今天这通电话的结束环节了，跟家长确认一下见面会的时间以及转介绍活动是否想要去参加的，然后把这些重点的东西再到微信上给他再闭环一下，强化一下今天这通电话的内容。"],"durs":[7.152,39.192,35.856,7.128,32.064]},"P17":{"sents":["刚刚我们已经学完了理论知识，接下来一起来梳理一下这通电话我们到底该怎么样去打？","在了解完用户的情况之后，电话沟通第一时间肯定是要先温柔的告诉他，我为什么要去给您打这个电话，简单的介绍一下自己的身份和职责。","再跟家长去确认一些我们上课相关信息，比如说上课时间，学习周期，还有孩子上课的设备，那这些基础信息我们都了解了之后，就该我们来探寻家长的需求了，首先第一个要去跟家长确认一下家里是谁平时负责孩子的学习呀，这个学习的负责人一般什么时候有时间啊？","方便后续你来跟家长去沟通孩子的学习情况？","接着讲一下在算法阶段的一些课程安排和价值内容，去问一问家长的需求点，咱们在了解了需求之后带班期间针对性的给孩子去做一些规划啊再问一问他前面上课的时候有没有一些卡点？","同时也可以针对他的赛考成绩去给他简单的做一些分析，为我们接下来在第二个level的赛事招报去小小的铺垫一下，那通过这些内容，家长了解你了，你也对家长的需求有了解了，在电话的最后我们还需要把重点内容去总结一下。","挂掉电话以后，需要把这些内容在微信上给家长再发一下，这个目的就是在再次强化一下咱们和家长这通电话里面沟通的内容。"],"durs":[7.152,11.832,23.328,4.44,16.08,19.368,11.256]},"P18":{"sents":["首通框架已经梳理完了，如果你拿到了我们的首通话术，现在趁热打铁。","按照我们的框架结构把你手里的这份逐字稿，梳理一下吧。\n","把我们的话术从头到尾读一遍，要有感情哦~"],"durs":[6.576,5.4,4.296]},"P19":{"sents":["流程和话术都讲完了，最后我们来看：什么样的首通电话才算达标？","这就是第四部分——首通的标准与要求。"],"durs":[6.288,3.84]},"P20":{"sents":["刚刚我们把首通电话的完整框架拆解清楚了，那框架落地，离不开我们这一页的四大标准与要求，这是我们每一通首通电话的底层准则，一共四点：专业规范先行、需求深度挖掘、沟通高效简洁、传递服务温度。\n"," 首先第一点，专业规范先行。"," 大家一定要记住，开场白、结束语，都要严格按照我们的标准话术来执行，不能随心所欲。","规范不是束缚，是帮我们第一时间建立专业靠谱的职业形象。","家长接起电话的前 30 秒，就会形成对我们的第一印象，规范得体的表达，就是信任的起点。\n"," 第二点，需求深度挖掘。"," 这刚好对应上一页框架里 “挖需・下切法”。","我们不能单向给家长灌输信息，要多用开放式提问，少用是不是、对不对这类封闭式问题。","引导家长多说，把他真实的想法、顾虑、期待讲出来，我们才能抓住家长的痛点和潜在需求，后面的辅导规划、价值传递才能说到点子上，这也是后续转化的基础。\n"," 第三点，沟通高效简洁。"," 首通是有时间节奏的，我们要学会把控通话节奏，不要漫无目的地闲聊、做无效寒暄。","我们每一句话都要服务沟通目标，清晰地传递核心信息，在有限的通话时长里，把该同步、该确认、该挖掘的内容落地完成，不拖沓、不跑题。\n"," 第四点，传递服务温度。"," 规范、专业、高效，不等于冷冰冰的背书。","通话全程语调要热情亲切，打电话的时候，家长看不到我们的表情，但能听出我们的状态。","我们要敏锐捕捉家长的情绪，家长有担心、有疑问，及时给到积极回应和专业建议，让家长感受到我们是真心为孩子考虑，而不是走流程打电话，用真诚拉近距离。\n"," 这四条标准，是相辅相成的。","专业规范打底，深度挖掘抓需求，高效沟通控节奏，最后用温度留住好感。","大家在后续练首通的时候，不光要背框架，还要用这四条标准自检自己的通话，每一通电话都对照这四点去复盘优化。"],"durs":[18.912,3.36,8.424,5.784,8.448,2.832,3.984,8.232,15.408,2.928,7.992,13.296,2.76,4.584,7.992,15.048,3.192,7.608,10.776]},"P21":{"sents":["刚我们讲完了四大沟通原则，接下来这 9 条，是我们首通电话落地的硬性执行细则，是大家打完每一通电话，用来自查、质检用来打分的标尺，每一条都要记牢。\n\n"," 一、信息完整 + 流程正确 我们要严格按照前面首通框架走，这是很多优秀老师总结的经验。","破冰、挖需、收尾三个环节不能缺项，该确认、该同步的信息全部落实到位，不跳流程、不漏信息。\n"," 二当日完成 100% 首通有很强的时效性，我们要做到当天学员首通全部打完，不积压、不拖到第二天，保证家长的报名体感。","建立及时的信任。\n","三 完善数据表 通话结束不是工作终点，打完电话第一时间把挖到的需求、家长顾虑、孩子情况、风险点全部填进数据表。","数据表是我们后续跟进、续报的依据，信息记录越全，后面服务越精准。\n"," 四 笑着打电话 大家别觉得对方看不见就无所谓，微笑是可以通过声音传递出去的。","带着笑意沟通，语调会更柔和亲切，家长接电话的感受完全不一样，这也是我们传递服务温度最简单的办法。\n"," 五自信表述 跟家长沟通的时候，不要含糊、不要怯场。","我们是专业的编程辅导老师，熟悉课程、熟悉孩子的学习路径，底气足，家长才愿意相信我们给到的规划和建议。\n"," 六 不打断 家长在表达想法、吐槽顾虑的时候，耐心听完，不要中途抢话打断。","打断很容易让家长产生抵触感，沟通氛围一下子就变差了。\n"," 七 多听家长说 首通不是我们单方面宣讲，要学会把话语权交给家长，多听、多收集信息，我们才能找准家长真实诉求，而不是自顾自背话术。\n"," 八、互动式沟通 拒绝单向念稿，多提问、多呼应，跟家长一来一回交流。","有问有答才叫沟通，单向输出只会让家长觉得枯燥，容易敷衍结束通话。\n"," 九、有效沟通≥15 分钟 这里划重点，不是凑时长，是有效沟通。","刨除无效寒暄，真正做到挖需求、聊规划、对齐问题，有效沟通时长不少于 15 分钟，太短很难把需求挖透、建立信任。\n"," 这 9 条，前面 5 条是对我们自己工作动作、状态的要求，后面 4 条是通话过程里的沟通行为准则，后续我们模拟演练、质检复盘，都会对照这 9 条来核对。"],"durs":[14.04,8.832,10.32,12.024,2.112,12.288,6.984,8.064,9.792,5.568,10.632,8.088,5.616,13.632,7.632,7.248,7.248,11.64,13.872]},"P22":{"sents":["前面我们学习了首通的框架、沟通细则，那一通电话打完，到底好不好、能不能过关，就用这张通话质量评估表来打分。","总分 100 分，一共四大维度，每个维度 25 分：流程、规划、表达、答疑\n"," 首先是流程分，25 分。","考核两件事：一是整套首通流程完不完整，开场、信息确认、挖需求、学习规划、总结，环节不能缺；","二是信息准不准确，开课时间、周期、设备、赛事这些关键信息不能说错。\n"," 0–14 分：流程缺步骤，或者反复啰嗦、内容冗长；\n"," 15–20 分：流程完整，没有知识点错误，这是我们的基础合格档；\n"," 21–25 分：流程完整干净，语言简洁，还能结合孩子情况做额外补充，属于高分。\n"," 第二块，规划，25 分，这是最考验大家专业功底的一项。","包含课程体系和个性化学习规划两部分，要清楚核桃有哪些课程、课程之间的衔接，还要结合孩子基础、家长期待给出适配路线，包括赛事方向。\n"," 0–14 分：只能零散提几句规划，讲起来卡顿、不顺畅；\n"," 15–20 分：可以顺畅讲清楚课程体系和赛考相关内容；\n"," 21–25 分：自然过渡、自信输出，能根据不同孩子定制专属学习、赛事路径，引导家长看懂长期价值，是我们要冲刺的高分标准。\n"," 第三项，表达，25 分。","电话沟通，家长看不到我们，全部靠声音传递状态。\n"," 0–14 分：语气冷淡、磕绊多、语速不稳，甚至出现让家长不舒服的反问；\n"," 15–20 分：表达通顺自然，偶尔小卡顿，不影响理解，语气有起伏；\n"," 21–25 分：语气热情、应答流畅，亲和力强，听着舒服。\n","最后一项，答疑，25 分，也就是应对家长疑问、异议的能力。\n"," 0–14 分：抓不住家长真实想法，回答生硬、解决不了诉求；\n"," 15–20 分：有回应，但是没办法完全打消家长顾虑；\n"," 21–25 分：从容解决问题，还能顺着家长的提问深挖背后深层需求，给到可行建议，这是最高标准。\n","流程保证我们不走漏环节，规划体现我们的专业度，表达传递我们的服务温度，答疑检验我们的应变能力。","四个维度缺一不可。"],"durs":[10.704,7.752,3.024,10.68,7.728,5.712,6.6,8.904,5.88,14.352,6.048,6.096,13.152,3.096,5.112,7.608,7.296,6.744,6.144,6.528,5.736,10.392,9.264,2.304]},"P23":{"sents":["恭喜完成本次学习，请使用飞书扫二维码。","请填写你的真实感受吧!"],"durs":[4.368,2.544]}}};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 课程结构 ---------- */
/* 部门 / SKU 可见性：标「通用」或未标的页所有人可见；带标签的页只有选中的部门/SKU 命中才显示（多选任一命中即可） */
const normTag = t => String(t||'').replace(/1部/g,'一部').replace(/2部/g,'二部').replace(/苍穹顶/g,'苍穹鼎').replace(/\s/g,'');
const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return tagOk(p.dept, st && st.depts) && tagOk(p.sku, st && st.skus); }
let STAGES = [];
function buildStages(){
  STAGES = [];
  for (const p of DATA.pages) {
    if (!pageVisible(p)) continue;
    let s = STAGES.find(x => x.name === p.stage);
    if (!s) { s = {name:p.stage, num:+(/阶段\s*(\d+)/.exec(p.stage)||[0,STAGES.length+1])[1], pages:[]}; STAGES.push(s); }
    s.pages.push(p);
  }
  for (const s of STAGES) s.quiz = DATA.qs.filter(q => q.type === '阶段练习题' && +(/阶段\s*(\d+)/.exec(q.chapter)||[])[1] === s.num);
}
let st = null; buildStages();
const TITLES = CFG.titles || {};
const FINAL = DATA.qs.filter(q => q.type === '本章综合测试题');

/* ---------- 学习记录（仅存本机浏览器） ---------- */
function fresh(){ return {name:'', team:'', sid:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), unlocked:0, heard:{}, passed:{}, tries:{}, best:{}, final:null, finalTries:0, view:'home', cur:{s:0,p:0}, stageSec:{}}; }
try { st = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e) { st = fresh(); }
buildStages();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }
if (!st.sid) st.sid = 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
if (!st.stageSec) st.stageSec = {};

/* ---------- 学习数据上报（飞书多维表格 Webhook，实时写入） ---------- */
const HOOK = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/Z0UnaFjXvwZxHrhrmiFcMjSJnEd';
const pad = n => String(n).padStart(2,'0');
function nowStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function stageLabel(i){ const s = STAGES[i]; return s ? (s.name + (TITLES[s.num] ? ' ' + TITLES[s.num] : '')) : ''; }
const mins = sec => Math.round((sec||0)/6)/10;
/* 每个关卡的过程数据：play=实际播放秒数 occ=占用秒数 pn/ps=暂停次数/秒 kn/ks=卡顿次数/秒 */
function stat(k){ st.stat = st.stat || {}; return st.stat[k] = st.stat[k] || {play:0, occ:0, pn:0, ps:0, kn:0, ks:0}; }
function curKey(){ return st.view === 'quiz' ? (st.quiz === 'final' ? 'f' : st.quiz) : st.cur.s; }
function stageStatusText(k){
  const done = k === 'f' ? !!(st.final && st.final.pass) : !!st.passed[k];
  if (done) return '已完成';
  if ((st.view === 'learn' || st.view === 'quiz') && String(curKey()) === String(k)) return '进行中';
  const s = st.stat && st.stat[k];
  return s && s.occ > 0 ? '进行中' : '未开始';
}
function snapshot(online){
  const keys = [0,1,2,3,'f'], sum = f => keys.reduce((a,k) => a + ((st.stat&&st.stat[k]&&st.stat[k][f])||0), 0);
  const play = sum('play'), occ = sum('occ');
  const sc = i => st.best[i] != null ? `${st.best[i]}/${STAGES[i].quiz.length}` : '';
  const cur = st.view === 'quiz' ? (st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz) + '·小测') : (st.view === 'learn' ? stageLabel(st.cur.s) : '课程首页');
  const cp = st.view === 'learn' ? (curPageSafe()||{}).p || '' : '';
  return {online: online || '学习中', cur_stage:cur, cur_page:cp,
    st1:stageStatusText(0), st2:stageStatusText(1), st3:stageStatusText(2), st4:stageStatusText(3), stf:stageStatusText('f'),
    sc1:sc(0), sc2:sc(1), sc3:sc(2), scf: st.final ? `${st.final.score}/${FINAL.length}` : '',
    play_min:mins(play), occ_min:mins(occ), gap_min:mins(Math.max(0, occ-play)),
    pause_n:sum('pn'), pause_min:mins(sum('ps')), stall_n:sum('kn'), stall_min:mins(sum('ks')),
    relearn_n:Object.values(st.relearnCnt||{}).reduce((a,b)=>a+b,0),
    quiz_switch_n:sum('qn'), quiz_switch_min:mins(sum('qs'))};
}
/* 第二个 Webhook：学员第一次出现时，在「学员实时状态」表新建他的那一行 */
const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid}, ev, snapshot(online));
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}
/* 实际收听时长：只在播放时累计，按真实时间计（倍速播放不重复计） */
let pageSec = 0, lastT = null;
function flushPage(event){
  const p = curPageSafe();
  if (p && pageSec >= 3) report({event, stage:stageLabel(st.cur.s), page:p.p, minutes:mins(pageSec), detail:p.topic});
  pageSec = 0;
}
function curPageSafe(){ try { return STAGES[st.cur.s].pages[st.cur.p]; } catch(e) { return null; } }
let leftSent = false;
function leaveCourse(){
  if (leftSent || !st.name) return; leftSent = true;
  if (st.view === 'learn') { endPause(false); flushPage('中途离开'); }
  endQuizAway(false);
  save();
  const where = st.view === 'quiz' ? '测试中' : st.view === 'learn' ? '听课中' : '课程首页';
  report({event:'离开课程', stage: st.view === 'home' ? '' : stageLabel(st.cur.s), page: st.view === 'learn' ? ((curPageSafe()||{}).p||'') : '', detail:`在${where}关闭或离开网页`}, '已离开');
}
// 不论停在哪个界面（含课程首页），关网页都上报「已离开」；pagehide 不触发的浏览器用 beforeunload 兜底
window.addEventListener('pagehide', leaveCourse);
window.addEventListener('beforeunload', leaveCourse);
window.addEventListener('pageshow', e => { if (e.persisted) { leftSent = false; report({event:'进入课程', detail:'返回网页'}); } });

/* 小测中切屏：不能暂停答题，但要记录每次离开和离开多久，并提示学员 */
let quizAwayAt = null;
function quizActive(){ return st.view === 'quiz' && quizState && !quizState.result; }
function quizAwayNow(){ return document.hidden || !document.hasFocus(); }
function startQuizAway(){
  if (quizAwayAt != null || !quizActive() || !quizAwayNow()) return;
  quizAwayAt = Date.now();
  const s = stat(curKey()); s.qn = (s.qn||0) + 1;
  report({event:'测试中切屏', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`本次测试第 ${s.qn} 次切屏（${document.hidden ? '切出页面' : '切到其他窗口'}）`});
}
function endQuizAway(doReport){
  if (quizAwayAt == null) return;
  const sec = (Date.now() - quizAwayAt)/1000; quizAwayAt = null;
  const s = stat(curKey()); s.qs = (s.qs||0) + sec;
  if (doReport) report({event:'回到测试', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`离开 ${Math.round(sec)} 秒`});
  const w = $('#quizWarn'); if (w) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs)} 秒，已同步给培训老师。`; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) startQuizAway(); else if (document.hasFocus()) endQuizAway(true); });
window.addEventListener('blur', startQuizAway);
window.addEventListener('focus', () => endQuizAway(true));
setInterval(() => { if (quizActive()) { if (quizAwayNow()) startQuizAway(); else endQuizAway(true); } }, 1000);
/* 占用时长：停留在某关卡（听课或做小测）的全部时间，含暂停、切走 */
let tickAt = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min((now - tickAt)/1000, 70); tickAt = now;
  if (st.name && (st.view === 'learn' || st.view === 'quiz')) { stat(curKey()).occ += dt; if (Math.random() < 0.1) save(); }
}, 1000);
/* 暂停：学员主动暂停或切走窗口导致的暂停（翻页、听完不算） */
let navPause = false, pauseAt = null, pauseWhy = '';
function endPause(doReport){
  if (pauseAt == null) return;
  const sec = (Date.now() - pauseAt)/1000; pauseAt = null;
  stat(st.cur.s).ps += sec;
  if (doReport) report({event:'继续播放', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`暂停 ${Math.round(sec)} 秒（${pauseWhy}）`});
}
/* 卡顿：播放中因网络缓冲停住 */
let stallAt = null;
function endStall(){
  if (stallAt == null) return;
  const sec = (Date.now() - stallAt)/1000; stallAt = null;
  if (sec < 0.8) return;
  const s = stat(st.cur.s); s.kn += 1; s.ks += sec;
  report({event:'卡顿', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`缓冲卡顿 ${sec.toFixed(1)} 秒`});
}

/* ---------- 音频播放 ---------- */
const au = $('#au');
let rate = 1, playing = false, pendingAfter = null;
function pageTiming(p){ return DATA.timing[p.p]; }
function sentAt(p, t){
  const tm = pageTiming(p); let acc = 0;
  for (let i=0;i<tm.durs.length;i++){ acc += tm.durs[i]; if (t < acc) return i; }
  return tm.durs.length-1;
}
au.addEventListener('timeupdate', () => {
  if (st.view !== 'learn') return;
  if (!au.paused && lastT != null) { const dt = au.currentTime - lastT; if (dt > 0 && dt < 3) { const real = dt/(au.playbackRate||1); pageSec += real; st.stageSec[st.cur.s] = (st.stageSec[st.cur.s]||0) + real; stat(st.cur.s).play += real; } }
  lastT = au.currentTime;
  const p = curPage(); const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const i = sentAt(p, au.currentTime);
  const sub = $('#sub'); if (sub && sub.dataset.i != i){ sub.dataset.i = i; sub.textContent = tm.sents[i].trim(); }
  const bar = $('#progfill'); if (bar) bar.style.width = (100*au.currentTime/total).toFixed(1)+'%';
  const tt = $('#time'); if (tt) tt.textContent = fmt(au.currentTime)+' / '+fmt(total);
});
au.addEventListener('ended', () => { playing = false; updPlayBtn(); onPageEnd(); });
au.addEventListener('pause', () => {
  playing = false; updPlayBtn(); endStall();
  const atEnd = au.ended || (au.duration && au.currentTime >= au.duration - 0.3);
  if (navPause || atEnd || st.view !== 'learn') { navPause = false; return; }
  const s = stat(st.cur.s); s.pn += 1; pauseAt = Date.now(); pauseWhy = autoWhy || (document.hidden ? '切出页面自动暂停' : '主动暂停'); autoWhy = '';
  report({event:'暂停', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:pauseWhy});
});
au.addEventListener('play', () => { playing = true; updPlayBtn(); const v=$('#veil'); if(v) v.hidden = true; endPause(true); });
au.addEventListener('waiting', () => { if (!au.paused && au.currentTime > 0.5 && stallAt == null) stallAt = Date.now(); });  // 每页开头的首次加载不算卡顿
au.addEventListener('playing', endStall);
function fmt(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function play(){ au.playbackRate = rate; au.play().catch(() => { const v=$('#veil'); if(v) v.hidden=false; }); }
function updPlayBtn(){ const b = $('#pp'); if (b) b.textContent = playing ? '暂停' : '播放'; }

/* 切走自动暂停——防挂机。两种情况都算：
   1) 页面被隐藏（最小化、切标签页、被完全挡住）；
   2) 浏览器窗口失去焦点（点到了 WPS、微信等其他窗口，哪怕只挡住一部分） */
let autoWhy = '';
function autoPause(why){
  if (!playing) return;
  autoWhy = why; au.pause();
  const v = $('#veil'); if (v) { v.hidden = false; $('#veilBtn').textContent = '检测到你切到了其他窗口，已暂停 · 点我继续'; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause('切出页面自动暂停'); });
window.addEventListener('blur', () => { autoPause('切到其他窗口自动暂停'); });
/* 兜底：个别环境 blur 不触发时，每秒检查一次窗口焦点 */
setInterval(() => { if (playing && !document.hasFocus()) autoPause('切到其他窗口自动暂停'); }, 1000);

/* ---------- 视图 ---------- */
function curStage(){ return STAGES[st.cur.s]; }
function curPage(){ return curStage().pages[st.cur.p]; }
function stageStatus(i){
  if (st.passed[i]) return 'pass';
  if (i <= st.unlocked) return 'open';
  return 'lock';
}
function mapHTML(active){
  const nodes = STAGES.map((s,i) => {
    const ss = stageStatus(i);
    const sub = ss==='pass' ? ('已过关'+(st.best[i]!=null?' · '+st.best[i]+'/'+s.quiz.length:'')) : ss==='open' ? (s.quiz.length?'学完测 '+s.quiz.length+' 题':'学完解锁综合测试') : '未解锁';
    return `<button class="node ${ss} ${active===i?'cur':''}" data-go="${i}" ${ss==='lock'?'disabled':''}>
      <span class="k">阶段 ${s.num}</span><span class="t">${esc(TITLES[s.num]||("阶段 "+s.num))}</span><span class="s">${sub}</span></button>`;
  });
  const fOpen = STAGES.every((s,i)=>st.passed[i]);
  const fs = st.final && st.final.pass ? '已通过 · '+st.final.score+'/'+FINAL.length : fOpen ? FINAL.length+' 题 · 待作答' : '全部阶段过关后解锁';
  nodes.push(`<button class="node ${st.final&&st.final.pass?'pass':fOpen?'open':'lock'} ${active==='final'?'cur':''}" data-final ${fOpen?'':'disabled'}>
    <span class="k">结业</span><span class="t">本章综合测试</span><span class="s">${fs}</span></button>`);
  return `<nav class="map" aria-label="闯关进度">${nodes.join('')}</nav>`;
}
function loopHTML(on){
  const w = ['学一段','练一题','测一轮','过一关','进一步'];
  return `<div class="loop" aria-label="学习闭环">${w.map((x,i)=>`<span class="${i===on?'on':''}">${x}</span>`).join('<i>→</i>')}</div>`;
}
function headerHTML(){
  return `<header><div class="brand"><h1>${esc(CFG.title)}</h1><span class="tag">${esc(CFG.tag)}</span></div>
    <div class="who">${st.name?('学员：'+esc(st.name)+(st.team?'（'+esc(st.team)+'）':'')+' · '):''}<button class="btn ghost" style="padding:4px 10px;font-size:13px" data-home>课程首页</button></div></header>`;
}
function bindCommon(){
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => startStage(+b.dataset.go));
  const f = document.querySelector('[data-final]'); if (f) f.onclick = () => showQuiz('final');
  const h = document.querySelector('[data-home]'); if (h) h.onclick = () => { navStop(); st.view='home'; save(); report({event:'回到首页'}); render(); };
}

function render(){
  if (st.view === 'learn') return renderLearn();
  if (st.view === 'quiz') return renderQuiz();
  renderHome();
}

  const totalMin = Math.round(Object.values(DATA.timing).reduce((a,t)=>a+t.durs.reduce((x,y)=>x+y,0),0)/60);
  const started = st.name;
  const done = st.final && st.final.pass;
  $('#app').innerHTML = `${headerHTML()}

      <h2 style="font-size:22px">${esc(CFG.title)}</h2>
      <p class="muted" style="margin:0">共 ${STAGES.length} 个学习板块、${DATA.pages.length} 页、约 ${totalMin} 分钟讲解。讲解中穿插随堂互动题；每个阶段学完做 5 题小测，正确率达 ${Math.round(PASS*100)}% 才解锁下一阶段，未达标需重学本阶段。</p>
      ${started ? `<div class="row" style="justify-content:flex-start">

          ${done?'<button class="btn soft" id="cert">查看成绩单</button>':''}
          <button class="btn ghost" id="reset">换人 / 重新开始</button></div>`

          <p class="rule" id="formMsg" hidden></p>
          <button class="btn" type="submit">开始学习</button></form>`}
      <p class="rule" id="resetMsg" hidden></p>

      <li>阶段小测 5 题，答对 ${Math.ceil(5*PASS)} 题及以上过关；未过关需重学本阶段后再测。</li>
      <li>全部阶段过关后，解锁本章综合测试（${FINAL.length} 题）。</li>
      <li>你的姓名、职场、各页学习时长和测试成绩会同步给培训老师。</li>
    </ol></section>`;
  bindCommon();
  const f = $('#nameForm');
  if (f) f.onsubmit = e => { e.preventDefault();
    const v = $('#nm').value.trim(); const pick = n => [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x => x.value);
    let t = '', extra = '';
    if (CFG.depts) {
      const ds = pick('dept'), ks = pick('sku'), m = $('#formMsg');
      if (!v || !ds.length || !ks.length) { m.hidden = false; m.textContent = '请填写姓名，并至少选择一个部门和一个 SKU。'; return; }
      st.depts = ds; st.skus = ks; t = ds.join('、'); extra = `｜部门：${ds.join('、')}｜SKU：${ks.join('、')}`;
    } else { t = $('#tm').value.trim(); if (!v || !t) return; }
    st.name = v; st.team = t; buildStages();
    if (!STAGES.length) { const m = $('#formMsg'); m.hidden = false; m.textContent = '你选择的部门 / SKU 暂时没有对应课件，请确认后重新选择。'; st.name = ''; st.depts = st.skus = null; buildStages(); return; }
    save();
    report({event:'进入课程', detail:'首次进入' + extra}); startStage(0); };
  const r = $('#resume'); if (r) r.onclick = () => { report({event:'进入课程', detail:'继续学习'}); startStage(Math.min(st.unlocked, STAGES.length-1), true); };
  const c = $('#cert'); if (c) c.onclick = () => showQuiz('final');
  const x = $('#reset'); if (x) x.onclick = () => {
    if (x.dataset.armed){ st = fresh(); save(); buildStages(); render(); return; }
    x.dataset.armed = 1; x.textContent = '再点一次确认清空记录';
    const m = $('#resetMsg'); m.hidden = false; m.textContent = '清空后本机的学习进度和成绩都会删除。';
  };
}

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function renderLearn(autoplay){
  const s = curStage(), p = curPage();
  const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const heard = !!st.heard[p.p];
  $('#app').innerHTML = `${headerHTML()}
  ${mapHTML(st.cur.s)}
  ${loopHTML(0)}
  <div class="stage-head"><h2>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}　<span class="muted" style="font-weight:400;font-size:15px">${p.p} ${esc(p.topic)}</span></h2>
    <span class="time">第 ${st.cur.p+1} / ${s.pages.length} 页</span></div>
  <div class="slide"><img src="slides/${p.p}.png" alt="${esc(p.p+' '+p.topic)}">
    <div class="veil" id="veil" ${autoplay?'hidden':''}><button class="btn" id="veilBtn">▶ 点击播放讲解</button></div></div>
  <div class="sub" id="sub" aria-live="polite">${esc(tm.sents[0].trim())}</div>
  <div class="bar">
    <button class="btn ghost" id="prev" ${st.cur.p===0?'disabled':''}>上一页</button>
    <button class="btn" id="pp">播放</button>
    <button class="btn ghost" id="again">重听本页</button>
    <div class="prog" aria-hidden="true"><div id="progfill"></div></div>
    <span class="time" id="time">0:00 / ${fmt(total)}</span>
    <div class="speed" role="group" aria-label="语速">${[1,1.25,1.5].map(r=>`<button data-r="${r}" class="${r===rate?'on':''}">${r}x</button>`).join('')}</div>
    <button class="btn" id="next" ${heard?'':'disabled'}>${st.cur.p===s.pages.length-1?(s.quiz.length?'去做阶段小测':'完成本阶段'):'下一页'}</button>
  </div>
  <div class="dots">${s.pages.map((pg,i)=>`<button class="dot ${st.heard[pg.p]?'heard':''} ${i===st.cur.p?'now':''} ${pg.interact?'q':''}" data-pg="${i}" ${(st.heard[pg.p]||i===st.cur.p)?'':'disabled'} title="${esc(pg.topic)}">${pg.p}</button>`).join('')}</div>
  <details class="full"><summary>展开本页讲解全文</summary><p>${esc(p.script)}</p></details>`;
  bindCommon();
  au.src = 'audio/'+p.p+'.mp3';
  au.currentTime = 0; lastT = 0;
  report({event:'进入页面', stage:stageLabel(st.cur.s), page:p.p, detail:p.topic});
  $('#veilBtn').onclick = play;
  $('#pp').onclick = () => playing ? au.pause() : play();
  $('#again').onclick = () => { au.currentTime = 0; play(); };
  $('#prev').onclick = () => goPage(st.cur.p-1);
  $('#next').onclick = () => nextPage();
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => goPage(+b.dataset.pg));
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rate = +b.dataset.r; au.playbackRate = rate;
    document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on', x===b)); });
  if (autoplay) play();
}
function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});
  showQuiz('final');
}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = () => askInteract(p); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div></div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`});
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
