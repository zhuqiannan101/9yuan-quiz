<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>首通电话全流程（国润）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%2740%27%3E%3Ctext x=%27100%27 y=%2725%27 fill=%27%23bbb%27 font-size=%2716%27 text-anchor=%27middle%27 font-family=%27sans-serif%27%3EPPT 加载中…%3C/text%3E%3C/svg%3E") center/200px 40px no-repeat;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}

<script>
const DATA = {"pages":[{"row":2,"stage":"阶段1·首通的定位与价值","p":"P01","topic":"封面：首通电话全流程——中价课 py 首通：定位·流程·话术·质检","script":"这节课要给大家讲的是首通电话的全流程。这通电话，对我们和家长来说，都是非常重要的第一印象。 大家换位思考一下：一个孩子坐在教室里，人没有离开、没有跑出教室，是不是就代表这节课孩子听进去、有收获了？ 放到我们首通电话里也是一样：家长没有挂断电话，不代表我们这通电话就打好了、沟通有效。 今天我主要学习首通电话全流程，核心四块 —— 定位、流程、话术、质检。\n很多人容易把这通电话只当成开课通知，打完没有信息沉淀，后续转化很难做。今天不只是给大家话术，先明确这通电话的目标，拆解全流程节点、配套话术，同时讲清楚质检和考核标准。","interact":null,"sku":"","dept":""},{"row":3,"stage":"阶段1·首通的定位与价值","p":"P02","topic":"目录：五大模块（定位价值/六步流程/采集摸底/沟通异议/红线质检）","script":"我们来看今天的课程目录，一共五大模块。\n第一块，首通的定位与价值。我们搞清楚什么是首通、这通电话能给家长带来什么、对我们自己有什么帮助，明确打电话的核心目标，不做无效通话。\n第二块，也是重中之重，首通六步全流程。后面我们会逐个拆解每一步怎么做。\n第三块，信息采集和摸底铺垫。学会收集关键信息，读懂家长的关注点，做到知己知彼。\n第四块，沟通技巧和异议处理。遇到家长疑问、顾虑，有对应的方法去应对。\n第五块，红线和质检。明确通话禁忌，遵守规范，严禁过度承诺，清楚考核标准。\n接下来我们先进入第一部分：首通的定位与价值。","interact":null,"sku":"","dept":""},{"row":4,"stage":"阶段1·首通的定位与价值","p":"P03","topic":"第一章（章节页）：首通的定位与价值","script":"我们进入第一部分，首通的定位与价值。很多新老师会觉得首通就是打个电话通知上课，这个理解是不够的。首通是家长付费之后的第一次深度接触，家长对你的信任和第一印象、对课程的信心，都是在这通电话里建立起来的。首通的重要性在这也会体现出来。","interact":null,"sku":"","dept":""},{"row":5,"stage":"阶段1·首通的定位与价值","p":"P04","topic":"什么是首通：家长半信任状态·购课后第一通服务电话·第一印象只有一次·客单价49~299口径","script":"我们先来搞清楚什么是首通。首先切换到家长的视角：家长刚付完费用，对我们处于半信任状态，钱已经花出去了，课程还没有开始上，心里一边抱有期待，一边也会有各种顾虑。所以首通的本质，就是家长购课之后我们打出的第一通服务电话，要在电话里完成信息确认、自我介绍、讲清楚课程安排，提前帮家长化解顾虑。第一印象只有一次，通话里的声音状态、专业度、条理性，家长都会在这一通里感知到。我们的49到299价格不等的 AI 思维训练营，大家要注意两点：第一，我们的课单价不低，家长一定是思考过才买的课，家长的质量也很高，肯定的对编程学习有所期待的。因此，他们对老师能力和教学水平的期待更高；第二，首通要突出训练营短期拔高的画面感。首通的质量直接影响后续出勤、完课和信任度。讲完什么是首通，接下来看它对家长、对我们分别有什么价值。来看一道题，刚付完费的家长处于什么状态？","interact":{"q":"刚付完费的家长处于什么状态？","at":"P04","options":["已经完全信任老师——交了钱就百分百放心","半信任状态——钱花了课还没上，有期待也有顾虑","完全不信任——随时准备申请全额退费","没有任何想法——交完钱自己都忘了这事"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":6,"stage":"阶段1·首通的定位与价值","p":"P05","topic":"首通的价值：对家长=安全感定心丸·对老师=核心数据+学情摸排（不打好就埋雷）","script":"首先是对家长，核心就是给到安全感。线上教育，家长最大的顾虑就是怕钱花出去之后没人跟进、没人管，而首通，就是提前把这颗定心丸给到家长，帮他们打消线上学习的顾虑，让家长觉得这笔钱花得踏实。\n其次就是兼顾个性化。每个孩子的基础、情况都不一样，家长也会有各自的需求和担心。我们要在首通里主动收集这些信息，针对家长的疑问给出对应的解决方案。\n\n然后是对我们自己，同样有两点。\n第一是数据。加微率、出勤率、完课率这些核心指标，直接和大家的绩效挂钩，而这些数据的底子，就是靠首通打下来的。\n第二是学情摸排。我们通过首通，摸清孩子的年龄、编程基础，还有家长的期待，后续的服务和沟通才能因材施教、有的放矢。\n\n反过来讲，大家一定要记住：首通不打，或者打得敷衍、质量差，后面出现的频繁请假、家长失联、甚至投诉问题，根源很多都是在这一步埋下的隐患。所以大家一定要足够重视首通这通电话。\n\n讲完价值，接下来我们来看首通的核心目的。","interact":null,"sku":"","dept":""},{"row":7,"stage":"阶段1·首通的定位与价值","p":"P06","topic":"首通核心目的三件事：①建立信任 ②摸清情况 ③铺垫课程——每句话都有任务","script":"接下来明确首通的核心目的，做好三件事。第一件，建立信任：稳住第一印象、立好老师人设，讲清楚我是谁、我怎么带班、怎么服务，让家长放心把孩子交给我们。第二件，摸清情况：孩子的年纪、年级分档、上课设备，设备是否达标直接关系后续能不能稳定上课；同时了解孩子的编程基础、学习兴趣，家长的期待和顾虑，一次采齐，打好标签，完成用户描述记录，及时落表。第三件，铺垫课程：激发家长和孩子对课程的期待，讲明白学什么、怎么学，约好一对一的开营第一课，提前强调按时出勤的重要性。最后记住：首通不是通知电话，是带着明确服务目标的结构化沟通，说的每一句话都有任务，走的每一步都算数。","interact":null,"sku":"","dept":""},{"row":8,"stage":"阶段2·首通全流程六步","p":"P07","topic":"第二章（章节页）：首通全流程六步（顺序经过验证，不能乱）","script":"进入第二部分，首通全流程。这部分是今天的重点。整个首通分为六步，顺序是经过验证的，不能乱：先开场建立身份，再确认课程信息，然后确认孩子的基本情况，接着摸学情挖需求，再立老师人设、提学习要求，最后温馨收尾。挂了电话之后还有记录和留存的动作。大家先把顺序记住，后面我们逐步拆每一步的话术。","interact":null,"sku":"","dept":""},{"row":9,"stage":"阶段2·首通全流程六步","p":"P08","topic":"首通全景：六步+挂机后课后动作（开场建身份·确认防出错·摸底打标签·收尾留钩子）","script":"接下来我们进入首通全景，整体就是六大通话步骤，再加挂机之后的配套课后动作，一环扣一环，顺序不能调换。\n\n首先第一步，热情开场。我们上来先自我介绍，清晰告诉家长我是谁、打电话的目的：我是接下来六周全程带孩子上课的带班老师，今天这通电话，主要是跟您对接课程，同步后续全部的学习安排，先把身份立住，让家长知道我们不是随便的推销电话。\n\n第二步，课程确认。这个环节最核心的一件事，就是引导家长添加微信，微信是我们后续长期沟通、发资料、跟进学习最主要的渠道，一定要在这个环节加上。同时和家长核对课表，确认上课时间，还要核对教具快递收货地址，避免后续教具发错、收不到，耽误孩子上课。\n\n第三步，信息确认。我们要核实关键信息：孩子的年龄、年级、平时对接的主要负责人、家里用来上课的设备情况。设备这块一定要重点检查，提前排查设备能不能正常运行，避免等到开课当天，才发现设备不兼容、用不了，导致孩子没法正常上课。\n\n第四步，学情摸底。到这里我们就要深挖信息了，了解孩子之前有没有接触过编程、基础怎么样，孩子对编程的兴趣高不高，同时倾听家长的想法、顾虑和期待，把这些需求都挖出来，方便我们后续针对性服务。\n\n第五步，人设和上课要求。跟家长讲清楚咱们的上课风格，是耐心引导型，还是偏严格督促的类型，让家长提前熟悉你的带班方式；同时同步上课规则，强调按时出勤的重要性，提前给家长建立上课的预期。\n\n第六步，温馨收尾。对本次通话简单复盘，给到家长安心感，浅浅铺垫后续的安排和编程政策。埋下钩子，方便我们之后继续跟进。\n\n通话结束，挂机之后的动作，同样非常关键，千万不能打完电话就放一边。我们要马上更新学生信息表，把刚刚沟通收集到的家长诉求、孩子情况补充完整，大家一定不要只靠脑子记，信息多了很容易遗忘、记错。\n\n这里有两个关键点，大家一定要刻在心里：\n第一，通话顺序绝对不能乱。我们要先介绍自己、建立身份，再去收集各类信息；先跟家长讲我们能提供什么服务，再提上课相关要求。一旦顺序颠倒，家长的防备和防御心马上就上来，沟通就很难推进。\n第二，每一步都有它对应的任务，不是随便聊聊：开场用来建立身份，信息确认用来规避后续出错，学情摸底用来方便因材施教、分班服务，打造人设是为了积累信任，收尾是为后续跟进留下钩子。\n\n一句话总结：电话里的沟通很重要，但电话结束之后的信息录入工作，和通话本身同等重要。如果聊完之后信息没有落到表格里，没有记录留存，那这一通首通，基本就等于白打了。来看一道题，挂机之后的配套动作是？","interact":{"q":"挂机之后的配套动作是？","at":"P08","options":["只靠脑子记——相信自己记得住，不需要落表留存","打完电话就结束——不用做任何配套动作，聊完就算完成","更新信息表→补充家长诉求→打好标签→发资料并文字确认","把记录删掉——等下次打电话的时候再重新填一遍"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":10,"stage":"阶段2·首通全流程六步","p":"P09","topic":"①热情开场：确认营期·亮明身份·引导加微信发课表；笑着打电话+先跟后带","script":"我们先来看看首通电话的热情开场环节。\n首先大家先看参考话术：“hello 您好，咱给孩子报名了价格是XX 的 AI 思维训练营对吧？我是孩子的专属老师 xx，咱们这次课程是 6 周，课程形式会比较丰富，您这会加下我的微信，我给您发下我们这次的课程安排，方便您随时查看。”\n\n这段话术背后，藏着我们开场必须完成的三个核心任务：\n第一，确认营期，核实家长报名的就是 AI 思维训练营；\n第二，亮明身份，告诉家长我是孩子的专属老师，6 周全程带班；\n第三，引导家长添加微信，同步发送课程安排。\n\n这里有个关键点：加微信是前置动作，用课表作为抓手，给到家长明确的价值，家长才愿意继续和我们沟通。\n\n沟通上有两个重点注意事项：\n第一，打电话的时候尽量带着笑意，声音会更有感染力；\n第二，灵活用好【先跟后带】的沟通方法，先共情、顺着家长的想法回应，再输出我们的内容和建议，不要直接反驳家长，避免家长产生防备心理。\n\n额外补充两个实操小技巧：\n\n1. 接通电话后，可以主动告知家长这通电话沟通的大致内容和预估时长，给家长心理预期，降低中途挂断的概率；全程语速放缓平稳，开场不要堆砌复杂信息。\n2. 如果接通后家长正在开车、做饭，当下不方便沟通，不要硬聊，礼貌约定合适时间再回拨。\n\n最后收尾提醒：通话结束后，一定要第一时间给用户打标签、填写用户信息记录到学情详情表，不要只靠脑子记忆，很容易遗漏信息","interact":null,"sku":"","dept":""},{"row":11,"stage":"阶段2·首通全流程六步","p":"P10","topic":"②课程确认：4软件+8硬件软硬结合·课表先存下来·核对快递地址·确认学习负责人","script":"接下来进入第二个环节：课程信息确认，核心围绕微信、课表、硬件快递三件事同步信息。\n先看参考话术：“咱是 4 节软件课程 + 8 节硬件课，软硬结合锻炼孩子的脑力和动手操作能力，便于孩子更好的理解人工智能。您看到课表了吧？咱们课程时间是 x 月 x 号开始的，时间会比较久一些，您可以先存下来。我先帮您核对下硬件的收货地址哈，您的地址是 xx 对吗？好。”\n\n这一段沟通，我们要落地三个核心任务：\n第一，发送课表，清晰讲清课程结构：4 节软件课搭配 8 节硬件课，软硬结合的模式，把课程形式传递给家长；\n第二，仔细核对硬件器材的收货地址，后续发给家长物流查询图，方便家长自主跟踪快递进度；\n第三，确认孩子学习的主要负责人，后续所有的服务跟进、学习督促、学情反馈，我们都优先对接这位家长，避免信息混乱。\n\n这里有两个重点提醒：\n一是引导家长把课表保存下来，整套营期周期不短，存图之后方便家长随时翻看、安排时间。\n二是大家要记住中价课用户的特点：这类家长是经过思考、主动对比之后才报名的，沟通时要对齐家长的期待，不要用低价引流课的沟通方式。\n\n同时，首通电话也是铺垫长期学习理念的好时机。我们可以在这个环节提前给家长建立预期，把课程价值、孩子后续的学习画面讲出来，明确告诉家长我们会怎么跟进孩子的学习、提供哪些服务，并且后续全程按照这个标准落地。让家长心里有数，感知到课程不是短期体验，而是一套完整的成长方案，为后续长期续费埋下伏笔。","interact":null,"sku":"","dept":""},{"row":12,"stage":"阶段2·首通全流程六步","p":"P11","topic":"③年级确认三档：3-4打底/5-6赛事/7-9新课标考点；统一发24年高考py真题做价值锚点","script":"这一步是精准匹配孩子学习价值、打动家长的关键。\n开场先统一提问：咱孩子目前是几年级了呀？拉近距离\n我们根据家长给到的年级，直接对应三档差异化话术，做到对号入座，不千篇一律。同时有一个统一动作：不管孩子是哪一档，沟通后都发给家长【24 年高考 Python 真题（浙江）】，用这份真题作为看得见的价值锚点，让家长直观感受到 Python 在升学里的分量，而不是空口讲好处。后续老师说关于python的规划都是有据可依的，家长的信服度更高。\n\n我们分开看三档的逻辑：\n3-4 年级：这个阶段是小学分水岭，孩子抽象思维刚刚萌芽。我们重点讲，课程会渗透变量、循环这些 Python 核心概念，不是急着写复杂代码，而是帮孩子铺垫思维，为高年级数学、信息学提前打好底层基础。\n5-6 年级：属于逻辑思维定型的黄金关键期。课程主打纯英文编程 + 项目实战，锻炼算法思维、工程化能力；同时抛出赛事路径，告诉家长学好之后可以参与白名单等国家级赛事，丰富孩子升学简历，增加竞争力。 7-9 年级：孩子面临中考升学压力。切入点贴合新课标政策，Python 已经纳入信息科技必考内容，它语法简单、上手快，提前学，就是帮孩子提前熟悉考点，避开后续校内考试踩坑。\n不要背话术生硬朗读，抓住每一档家长最关心的痛点。低龄家长关心思维打底、助力数学；高段小学家长看重赛事、升学加分；初中家长优先在意校内考点、应试减负。来看一道题，3-4 年级家长的沟通重点是？","interact":{"q":"3-4 年级家长的沟通重点是？","at":"P11","options":["不用差异化——所有年级念同一套话术","主推白名单等国家级赛事——讲参赛路径和简历加分","只讲新课标考点——提前学避开考试踩坑","小学分水岭、抽象思维刚萌芽——py 渗透变量循环，为高年级打底"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":13,"stage":"阶段2·首通全流程六步","p":"P12","topic":"④设备确认：手机用户低转化当场解决·分叉问题「第一次学编程不」·追问三连","script":"接下来到设备确认环节，这一步非常关键，原则就是：设备问题一定要提前排查、当场沟通解决，千万不要留到开课的时候才发现，直接影响孩子上课体验，也会拉低我们的转化。\n\n我们先看参考话术：“那用什么设备给孩子上课哈？咱们这个不是短期体验班，对上课设备是有要求的，手机上课后续转化会比较低。行，咱用 XX 也比较方便，我刚刚发您一张图片，是本次课程软件的代码样式，您可以浏览下。编程其实已经成为中小学教育里，继阅读、写作、算数之外的第四项基本技能。这次咱们孩子是第一次学编程不？”\n\n问完设备之后，我们抛出分叉问题：这次咱们孩子是第一次学编程不？ 根据家长的回答分两条路径沟通：\n第一种情况：孩子是第一次学编程。\n我们重点介绍课程体系，说明课程是和清华大学联合升级研发的；孩子上完课可以产出 4 个软件作品 + 硬件作品；课程里面会融入大约 30 个英语单词、20 多个理综知识点，反过来辅助孩子理解数学、理科难题。同时告诉家长，课前会安排 1v1 开营第一课做单独预习，后面我们再和家长敲定预习时间。\n\n第二种情况：孩子之前接触过编程，有基础。\n我们用追问三连来摸清学情：之前在哪里学过？学的是什么语言？学了多久？还可以拓展问问现在还在学吗、之前课程的费用。摸清基础之后，再给到正向肯定，告诉家长孩子有基础，在咱们寓教于乐的模式里，能收获更深的思考；夸赞家长很早就带孩子接触编程，很有前瞻的教育理念。\n\n最后重点强调这条设备纪律：手机上课的用户，后续续报转化概率偏低。所以设备这一关，在首通电话里就要落实清楚、引导到位，提前规避开课之后出问题。","interact":null,"sku":"","dept":""},{"row":14,"stage":"阶段2·首通全流程六步","p":"P13","topic":"挖需打标签+硬件外化：开放式提问下单初衷·教具覆盖四大AI知识点·产出兴趣标签","script":"挖掘家长核心诉求的第一步。\n先抛出开放式提问：“那妈妈，您是看到直播间主播老师讲的哪方面比较感兴趣，就下单了哈？”\n这句话不设限制，引导家长主动说出下单初衷：是看好 AI 硬件、想练代码、还是冲着赛事、校内信息课来的，我们认真倾听，先接住家长的想法。\n\n等家长说完，我们再介绍这套教具：咱们这套教具，完整覆盖物联网、机器视觉、语音 AI、传感交互四大中小学人工智能核心知识点，也是很多学校信息科技课堂在用的同款标准化实训教具。\n\n紧接着做硬件外化，把课程形式讲明白，让家长能想象到孩子上课的画面：咱们这个硬编课，就是带着孩子玩转 AI，一边跟着线上老师学习 Python 代码，一边亲手接线、组装、调试硬件，把写在代码里的逻辑，变成看得见、摸得着、能运行的实物科创作品。\n同时提前铺垫一个细节：后续上课硬件需要充电的时候，我会提前跟您提醒。\n\n沟通完一定要落地动作：根据家长的回答，判断孩子和家长的兴趣方向，打上标签，区分是偏向硬件动手、代码逻辑，还是 AI 场景应用，同步记录到标签和用户描述里。\n这一页最终产出两个关键信息：孩子兴趣方向标签 + 家长第一关注点，后面整通电话的学情沟通、价值塑造、异议处理，都围绕这个点来讲，沟通才有重心、有的放矢。","interact":null,"sku":"","dept":""},{"row":15,"stage":"阶段2·首通全流程六步","p":"P14","topic":"数学英语成绩分档：数好培优/数中应用题建模/数弱纠马虎；英语分档；思维习惯收口","script":"这一步我们在首通电话深挖学情，主动询问家长孩子数学、英语在校情况，根据成绩分档沟通，最后落地到 Python 编程对校内学习实实在在的助力，不说空泛的大道理。\n\n先问孩子数学情况，分三档应对：\n数学好：孩子本身逻辑推理能力强，Python 里的循环、分支、条件判断、算法建模，可以把孩子的逻辑优势进一步拔高。校内数学很多难题、奥数思维题，本质就是分步拆解、逻辑推导，编程刚好给孩子一个自由练习复杂推理的载体，锻炼多步骤问题拆解能力，为后续信息学赛事、初高中数学难题打基础。数学中等很多孩子数学丢分不是公式不会，是看不懂应用题、不会梳理题干条件。Python 写代码的过程，就是强迫孩子把文字题目翻译成步骤，先找已知条件、再梳理先后顺序、最后验证结果，持续训练应用题建模思维，慢慢学会读懂长题干、分步解题，补齐数学最容易丢分的阅读理解短板。\n数学偏弱：大多是审题马虎、跳步骤、思路混乱。Python 代码有严格的执行顺序，少一个步骤、写错逻辑就跑不出结果，能倒逼孩子养成按顺序思考、逐项核对、细心排查 bug 的习惯，慢慢改掉粗心跳步的问题，建立标准化解题思维，反哺校内计算和应用题。\n\n再结合英语情况跟进：\n英语好Python 关键字全是英文，if、for、print 这些指令，孩子可以在实操场景里巩固认读，把校内学到的英语词汇用起来，做到学以致用，提升英文信息读取能力。英语偏弱：课程不会单独布置背单词任务，是在写代码、调试程序的过程里，循序渐进接触编程高频英文词，在动手场景里记忆，比死记单词表更轻松，慢慢积累学科英文词汇。\n统一价值收口（重点，讲得具体）\n所以 Python 不是单纯补数学、补英语的单科补习班，它练的是底层思维：\n\n1. 对数学：专门解决应用题读不懂、不会分步推理、粗心马虎这几类高频痛点，训练建模思维，适配新课标信息科技，\n2. 对英语：在真实代码场景积累专业英文词汇，熟悉英文指令，适应信息学科的英文阅读环境；\n3. 长期校内红利：新课标已经把 信息科技纳入中小学信息科技必考内容，初中信息科技期末、会考都会考察 Python 基础，提前学，孩子到校内上课的时候上手更快，不用临时突击。\n\n沟通完记得把孩子数学、英语学情打好标签，后续续报、回访的时候，我们就可以精准对应孩子的薄弱点来讲价值，沟通更有说服力。来看一道题，数学好的孩子，沟通方向是？","interact":{"q":"数学好的孩子，沟通方向是？","at":"P14","options":["逻辑差、基础弱——需要先补数学再考虑编程","逻辑好、懂变通会举一反三——适合学编程，做培优和拔高","和编程无关——数学好的孩子不需要学编程","建议先放弃——等数学成绩下滑了再说"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":16,"stage":"阶段2·首通全流程六步","p":"P15","topic":"py认知两种讲法：不了解→场景化+三种语言对比；了解→顺着聊；收尾三件套再挂机","script":"接下来我们进入 Python 认知沟通环节，这一步要根据家长对 Python 的熟悉程度，分两套思路灵活沟通，核心目标是帮家长建立对 Python 清晰、正向的认知，最后做好收尾三件套。\n\n第一种情况：家长不了解 Python，我们用生活化场景切入，场景化讲解，避免讲专业术语，家长更容易听懂。\n我们可以和家长说，咱们日常在用的微信、抖音、支付宝，底层都是代码开发出来的软件；春晚的机器人、自动驾驶，很多 AI 硬件项目也都会用到 Python。现在已经是人工智能时代，编程不再是小众技能。\n聊完价值之后，我们可以请家长帮忙给孩子带一句带有鼓励和期待的话，首通电话末尾，如果条件允许，也可以把孩子拉到电话旁，家长直接复述这份期待给孩子，调动孩子的学习兴趣。\n\n紧接着我们做三种语言对比：Scratch、Python、C++，帮家长分清差异。\nScratch 是积木拖拽式，大多是小游戏，知识点很浅，更适合低龄启蒙；C++ 语法复杂、门槛高，不适合零基础孩子直接上手；而 Python 刚好卡在中间，零基础就能学，需要孩子手动敲写英文代码。\n这里我们可以结合真实带班案例来讲：很多孩子之前玩线上抽奖小游戏，总以为是靠运气，学完 Python 之后，就能看懂抽奖程序背后是提前写好的概率逻辑，明白中奖并不是随机的。而是可以通过程序设计好的。课程里还会做数据分析、趣味小工具这类项目，本质上全程锻炼孩子的逻辑思维，学会拆解复杂问题、排查 bug。\n关于学习时机和应用面也要同步讲清楚：Python 是校内信息会考、科创赛事、AI 类竞赛里最常用的语言。现阶段学习接受新知识快，等到高年级课业压力变大，很难再抽出整块时间入门，提前学，也是给孩子升学多准备一条备选赛道。\n\n第二种情况：家长本身就了解 Python。\n我们先正向肯定家长：“看来您提前做过功课呢，真难得！方便问下您是在哪了解的 Python 呀？”\n先倾听家长的认知、顾虑或者期待，顺着家长的话多聊两句，再自然衔接回咱们这套课程的规划，匹配他的需求，不要自顾自灌输内容。\n\n最后统一记住收尾三件套，确认完再挂机：\n第一，再次核对首次上课时间，几号、几点，明确由谁提醒孩子，责任落实到人；\n第二，给孩子传递鼓励的留言；\n第三，浅浅铺垫校内、赛事相关政策，不用深度展开，留到后续回访继续沟通。","interact":null,"sku":"","dept":""},{"row":17,"stage":"阶段2·首通全流程六步","p":"P16","topic":"人设+硬件外化+学习档案：严慈相济·科创择校优势·陪学建议·大价值收口","script":"前面我们已经和家长确认了年级、上课设备、摸清了孩子数学英语学情、聊完 Python 认知、挖好了孩子兴趣标签，到这一步，我们把师资、硬件价值、服务保障打包讲清楚，给家长建立完整的服务预期，最后做整通首通电话的终极价值收口。\n\n第一块，先讲授课老师的人设与教学风格。\n咱们授课老师是严慈相济的风格：课堂氛围轻松幽默，孩子愿意主动动手、愿意表达；但对课堂纪律、代码规范、学习习惯要求严格，严师出高徒。不管孩子课上发挥很好，还是薄弱点、易错地方，我们都会如实同步给家长，不夸大、不回避问题，真实反馈才能精准帮孩子查漏，进步更快。\n这里同步提醒我们自己：前面首通问到的所有信息 —— 孩子年级、上课负责人、上课设备、编程基础、兴趣方向、家长诉求，全部要及时录入学情表，不要靠脑子记忆。\n\n第二块，继续外化这套软硬结合课程的硬件价值，承接之前挖需、硬件外化那一页的内容。\n咱们这套教具，覆盖物联网、机器视觉、语音 AI、传感交互四大方向，孩子可以亲手组装调试 AI 伙伴机器人、感应装置、智能跟随小车这类科创作品。现在科创赛事、综合素质评价、重点学校自主招生，主流项目都是软件 + 硬件结合。孩子一边写 代码，一边动手组装调试，走的是和文化课不一样的赛道，多积累科创成果，就多一份择校优势。\n同时做好记录：通话里家长提出来的个性化需求，单独记一条，之后每一次回访、跟进之前，先翻这条记录，沟通精准贴合家长的想法。\n\n第三块，介绍专属学习档案 + 陪学建议，承接前面学情打标签的动作。\n我们会为每一个孩子建立专属学习档案，全程记录孩子每次课的代码作品、思维变化、能力成长，把我们刚才记录的数学、英语学情、兴趣标签全部归档，成长轨迹看得见。也建议家长有空可以陪着孩子一起上课、看孩子的作品，近距离观察孩子，看看孩子在编程上的思维天赋。\n沟通结束之后，课表、器材清单、上课注意事项，统一微信发文字版，用文字和家长二次确认关键信息，避免口头沟通产生误会。\n\n最后是整通首通电话的大价值收口，这句话一定要稳住、讲透：\n编程是未来的必备能力，就算孩子之后不走竞赛、考级这条路，在学习 Python、调试硬件的过程里练出来的独立思考、拆解复杂问题、自主排查 bug 解决问题的能力，是可以终身受用的。在 AI 和大数据的时代，拥有这套底层思维，孩子至少不会被动，看得懂科技、用得好工具。\n\n最后内部提醒：电话里答应家长的所有事项，全部靠学情表兜底，及时记录，不要依赖记忆，避免遗漏承诺。","interact":null,"sku":"","dept":""},{"row":18,"stage":"阶段2·首通全流程六步","p":"P17","topic":"⑥收尾三件套：留言扫码+政策浅铺+确认1v1时间；选拔口径：软编60%+硬件20%+综合20%","script":"来到首通电话最后的闭环收尾，固定走好留言、政策浅铺、确认时间这三步，平稳收尾，不仓促挂机。\n\n第一块：留言环节\n邀请家长用购课手机号对应的微信扫码，给孩子写下鼓励的话。孩子上课输入密码进入课程的时候，就可以看到家长的留言。这个环节不强制，如果家长不方便扫码，直接在微信小灶群里发留言也完全可以。目的是制造仪式感，给到孩子正向期待，激发上课的积极性。\n\n第二块：政策浅铺（这里重点把性价比、选拔规则细致讲透，点到为止，不过度展开，留足后续回访空间）\n跟家长讲清楚为什么现阶段学 Python 性价比很高：\n现在信息科技已经纳入中小学必修课，不少地区初中的信息学业水平考试，核心考察内容就是 Python。高考也有大量科技相关的命题方向，科创素养越来越受重视。同时教育部每年都会发布官方白名单科创赛事，像人工智能创新挑战赛、教育成果大赛、这类赛事，孩子用 Python 完成的科创项目都可以报名参赛。\n咱们后续还会有综合能力选拔，选拔的打分口径是：软编排名占 60%、硬件动手实操占 20%、综合应用能力占 20%，用来筛选出有科创天赋的孩子。孩子具备不错的潜力，建议咱们家长提醒孩子认真对待课程，好好练习，期待后续拿到不错的成绩。\n\n第三块：确认时间，落实到人\n敲定孩子 1v1 开营第一课准确时间，几号、几点全部核对清楚。提前和家长约定好，开课之前半小时我主动联系，带着孩子提前下载、调试上课软件，避免开课当天出现设备、软件问题，耽误上课。\n\n通话全程，用户标签、用户描述、学情表一定要随沟通随填写，不要靠大脑记忆，电话里答应家长的事项，全部靠表格兜底，避免遗漏。来看一道题，留言环节请家长用什么扫码？","interact":{"q":"留言环节请家长用什么扫码？","at":"P17","options":["电脑浏览器","任意 App 都可以","购课手机号对应的微信","不需要扫码"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":19,"stage":"阶段3·信息采集与摸底铺垫","p":"P18","topic":"第三章（章节页）：信息采集与摸底铺垫（采集清单/摸底提问/认知铺垫/关注地图）","script":"接下来我们进入第三章：信息采集与摸底铺垫。\n这一章，是咱们首通电话里承上启下的核心板块，里面包含四大模块：采集清单、摸底提问、编程认知铺垫、家长关注地图。\n\n很多老师打电话容易犯一个问题：想到哪问到哪，提问零散，聊完之后关键信息缺漏，后面没法精准服务。这一章就是帮我们把学情摸底标准化，我们不是随便聊天，是带着目标、带着清单去采集信息，搭好孩子和家长的完整画像。\n\n首先是采集清单，也就是我们要收集的全部信息项，前面我们学情摸底环节用到的内容，都在这个清单里：孩子编程基础、过往学习经历、兴趣来源、校内成绩、学科偏好、家长核心诉求、对 Python 的了解程度等等。清单就是我们的检查项，避免通话结束才发现漏掉关键信息。\n\n第二块是摸底提问，也就是我们的提问话术和追问逻辑。重点记住：听到家长笼统的需求，一定要深挖。比如家长说想锻炼思维，我们不能停在这里，要继续追问，把模糊的期待变具体。提问是有顺序、有节奏的，先了解孩子，再挖掘家长的真实想法，不是一连串审问式提问，是自然沟通。\n\n第三块是编程认知铺垫。我们会借着提问，判断家长和孩子对编程、Python 的认知深浅。如果完全零基础，后面沟通就少用专业术语；如果之前接触过，我们就可以适度拔高，聊对应的赛事、进阶方向，对齐家长认知，避免沟通错位。\n\n第四块是家长关注地图，简单来说，就是把家长的诉求分类标记好：有的家长看重思维能力、有的看重校内辅助、有的看重竞赛升学、有的只是孩子单纯感兴趣。我们把关注点标注清楚，这张 “地图”，就是后面小灶授课、课堂反馈、续报铺垫的方向。\n\n大家要明白，摸底铺垫，不是为了收集信息而收集。我们所有的提问、记录、判断，最终都是为了找准家长的关注点，做到因材施教、精准服务。这一章吃透，我们的学情摸底就不会浮于表面，沟通更有抓手，而不是漫无目的闲聊。","interact":null,"sku":"","dept":""},{"row":20,"stage":"阶段3·信息采集与摸底铺垫","p":"P19","topic":"信息采集清单：六大类必采项与用途（基础/条件/背景/动机/服务/画像）","script":"接下来我们看信息采集清单，这张表就是我们首通电话的采集标尺，分成六大类，每一项都有对应的用途，不是随便问问，每一条信息都服务于后面的教学和服务。\n\n第一类，学员基础信息。必收集孩子年级、主要照顾人以及联系方式。拿到这些，我们才能匹配适合孩子的课程，同时确定我们日常对接的服务人，避免之后沟通找不到对接家长。\n\n第二类，上课条件。要确认上课用电脑还是平板、摄像头麦克风是否正常、上课地点。提前排查设备问题，避免正式上课的时候设备故障，耽误孩子上课，减少临场问题。\n\n第三类，学习背景。重点问孩子有没有编程基础、有没有接触过 Python 这类语言，还有校内成绩、擅长或者薄弱的学科。这一项直接决定咱们小灶课怎么分层，跟家长沟通的深浅。零基础就多做科普，有基础就可以往进阶、赛事方向去聊。\n\n第四类，兴趣与动机。我们要搞清楚：孩子是自己喜欢编程，还是家长安排来学？家长报课最期待收获什么，最想改善孩子哪方面？这一步就是深挖真实需求，后面上课、反馈都能贴合孩子情况，因材施教。\n\n第五类，服务安排。确认微信好友有没有加上、快递地址核对、首次上课时间、照顾人的空闲时间。保障后续教具正常发货、准时触达、孩子能够正常出勤上课。\n\n第六类，家长画像。记录家长核心关注点，是看重升学竞赛、兴趣培养，还是逻辑思维锻炼；同时记下家长的沟通习惯，以及当下有没有顾虑。有了这个画像，我们就能定好后续回访、续报的沟通策略，提前做好异议预警。\n\n大家一定要记住，清单是框架，不是审问。我们穿插在聊天里自然提问，一边聊一边记录，通话结束同步填进学情表。这些信息串联起来，就是完整的孩子和家长画像，也是我们后面所有沟通、授课、跟进的依据。","interact":null,"sku":"","dept":""},{"row":21,"stage":"阶段3·信息采集与摸底铺垫","p":"P20","topic":"摸底提问：表面在问·实际在听（五个问题逐条拆解）；一次只问一个","script":"接下来我们来看摸底提问这一页，核心就是搞懂：我们嘴上在问什么，耳朵重点要听什么，提问不是走流程，每一句都带着目标。\n\n我们一条一条拆开：\n第一个问题：宝贝之前接触过编程吗？\n表面上是了解编程基础，实际我们要判断程度：零基础的孩子，后续沟通、小灶课就要多鼓励、降低门槛；有基础的，继续追问学到哪一步，避免内容重复，也方便匹配更高阶的引导。\n\n第二个问题：是孩子自己想学，还是您给他安排的？\n表面问兴趣来源，实际区分动力来源：如果是孩子自发想学，我们后续多给展示机会、多肯定；如果是家长安排的，我们重点要在小灶课上点燃孩子兴趣，帮孩子建立内驱力，不然很容易出现抵触、坚持不下去的情况。\n\n第三个问题：孩子在学校成绩怎么样，喜欢哪门课？\n表面了解校内情况，实际是找学科挂钩点。比如孩子喜欢数学，我们就多讲编程和逻辑、数学思维的关联；喜欢语文，就可以讲故事、项目创作，把课程价值和孩子现有优势绑定，这就是我们后面铺垫价值的 “弹药”。\n\n第四个问题：平时谁盯着孩子学习比较多？\n表面问家庭分工，实际锁定主要对接人。之后课堂反馈、学习提醒、回访沟通，优先找这位家长，避免消息多头传递、信息脱节，没人跟进学习。\n\n第五个问题：您希望孩子这期学完，最想看到什么变化？\n表面问期待，实际抓家长的核心诉求。这句话挖到的答案，一定要记录进学情表。之后所有的课堂反馈、阶段性沟通、续报铺垫，全部围绕这个诉求来讲，家长才会觉得我们懂他。\n\n最后重点看节奏提醒：一次只问一个问题，等家长回答完，再问下一个。\n千万不要连环抛问题，连问会让家长有被审问的压迫感，回答也容易敷衍应付，信息就摸不准了。我们一问一答，边听边回应，自然穿插，才是舒服的沟通节奏。\n\n这一组提问，刚好对应前面的信息采集清单，一边聊一边把关键信息收齐，为后面的沟通打好基础。","interact":null,"sku":"","dept":""},{"row":22,"stage":"阶段3·信息采集与摸底铺垫","p":"P21","topic":"编程认知铺垫：浅铺一层留足空间——为什么学/为什么现在学/为什么在核桃学","script":"接下来我们进入编程认知铺垫这一页，核心记住标题这句话：浅铺一层，留足空间。\n\n这里分成三个方向，我们依次来看：\n第一块，为什么学编程。\n我们可以简单跟家长提三点：新课标里已经加入信息科技；编程可以锻炼逻辑思维，反过来助力校内各科学习；长期来看，也是发展科技特长、参与信息类赛事的入口。\n\n第二块，为什么现在学。\n重点抓住年龄窗口期：孩子现阶段正是思维习惯养成的黄金阶段，早接触、早建立思维，收益会更明显。\n\n第三块，为什么在核桃学。\n给家长讲清楚我们完整的服务闭环：直播实操上课、配套教具动手练习、课导全程跟班服务，同时还有赛考通道，从学习到赛事，整套体系是完整的。\n\n最关键的是下方的分寸把握，这也是新人最容易踩坑的地方：\n首通只做浅铺，每一点一句话带过，不展开、不深讲、不逼问家长认不认可。\n首通的目标不是当场说服家长，只是先种下认知。深度讲解、价值论证、打消顾虑，全部留给小灶课、课后回访以及后续续报沟通。如果首通讲得太满，后面我们就没有抓手了。\n\n简单总结：首通是轻轻搭框架，不是一次性把所有价值全部说完。来看一道题，首通编程认知铺垫的分寸把握是？","interact":{"q":"首通编程认知铺垫的分寸把握是？","at":"P21","options":["反复追问——逼家长当场表态认可","越深越好——当场说服家长认可课程价值","完全不提——只聊上课安排和时间","浅铺一层——每点一句话带过，不展开不深讲不逼问"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":23,"stage":"阶段3·信息采集与摸底铺垫","p":"P22","topic":"家长最关心的话题地图：期待类顺着讲·顾虑类提前化解·服务类当场讲清","script":"接下来我们看家长最关心的话题地图，这张图把家长所有关注点分成了三大类：期待类、顾虑类、服务类，同时明确了我们首通里的处理策略。\n\n第一类，期待类，属于正向诉求。\n家长的关注点一般是升学、科技特长生、赛事，还有校内成绩、逻辑思维、学习习惯培养。这一类我们不用强行说服，顺着家长的想法去讲，给到对应的路径和真实案例，并且把这条诉求记在学情表里，后面所有个性化反馈、续报沟通都围绕它展开。\n\n第二类，顾虑类，是我们需要提前化解的。\n高频疑问大家看一下：孩子年纪小能不能学会、上网课伤眼睛、课时太长孩子消化不了、是不是直播、上课设备平板能不能用。这些都是家长很容易冒出来的担心，首通里我们主动覆盖高频顾虑，提前给到解释，避免后面反复纠结。\n\n第三类，服务类，是必须确认清楚的规则项。\n包含上课形式、上课时间、谁来提醒上课、请假流程、教具怎么使用。服务类信息优先在首通一次性讲明白，规则讲清楚，后续回访就不用反复答疑，最省心。\n\n最后重点看使用方式：\n首通沟通的标准动作是：主动覆盖【服务类全部内容】+【顾虑类高频问题】；【期待类】重点记录，不急于一次性讲透，留作后续个性化沟通的抓手。\n\n简单来说：规则当场说清，高频顾虑提前化解，家长的期待好好记下，作为我们之后服务的主线。","interact":null,"sku":"","dept":""},{"row":24,"stage":"阶段4·沟通技巧与异议处理","p":"P23","topic":"第四章（章节页）：沟通技巧与异议处理（先跟后带/听懂心声/四步框架/成交三性）","script":"第四部分，沟通技巧与异议处理。首通话术是骨架，沟通技巧是血肉。这一章是新人非常核心的能力板块，包含四个关键词：先跟后带、听懂心声、四步框架、成交三性。\n\n很多新人遇到家长有顾虑、提异议的时候，第一反应就是着急反驳、急于解释，很容易把天聊僵。这一章就是给大家一套标准化沟通逻辑，不是硬说服，而是先接住情绪，再解决问题。\n\n- 先跟后带：是我们处理异议的底层心法。先认同家长的感受，不抬杠，再慢慢引导，而不是一上来就讲道理。\n- 听懂心声：区分家长表面说出来的话，和藏在背后真实担心。比如家长说 “太贵了”，背后不一定是没钱，可能是担心价值不匹配、怕孩子坚持不下来。\n- 四步框架：一套固定的异议应答流程，遇到任何疑问都可以套用，保证沟通不乱、不跑偏。\n- 成交三性：我们最终要让家长感知到课程的必要性、适合性、确定性，这也是促成信任、提升续报的关键。","interact":null,"sku":"","dept":""},{"row":25,"stage":"阶段4·沟通技巧与异议处理","p":"P24","topic":"破冰与先跟后带：先顺着家长认可感受再带建议；反驳=开启心理防御","script":"我们来看这一页，核心就是先跟后带，也是我们和家长沟通、处理异议最基础的心法。\n什么叫先跟后带？简单说：先顺着家长，认可他的感受和想法，再带出我们的建议。\n千万不要一上来直接反驳，一旦反驳，家长马上拉起心理防线，后面我们讲再多内容，他都听不进去，心里只会觉得：你就是想说服我报课。\n\n左边是反面例子：\n家长提出担心，我们直接一句 “不是的，您理解错了”。这句话一出口，家长立刻警觉，沟通就卡住了。\n\n右边是正确的先跟后带话术：\n“您这个顾虑特别正常，很多家长一开始都这么想…… 其实咱们课程里……”\n先共情接住，再慢慢转折，家长感受到被理解，才愿意继续听我们往下讲。\n\n还有两个配套小动作，大家一定要养成习惯：\n第一，打电话的时候带着微笑。微笑会改变你的语气，隔着电话，家长是能感受到声音里的感染力的；\n第二，不管家长说什么，先接一句：“对”、“是的，我理解”，再接我们后面的内容。\n先接住情绪，再沟通内容，家长才愿意跟着我们的思路聊下去。","interact":null,"sku":"","dept":""},{"row":26,"stage":"阶段4·沟通技巧与异议处理","p":"P25","topic":"听懂家长话里的心声：先回应藏着的担心，再回答字面问题（三例拆解）","script":"这一页讲怎么听懂家长话里的心声。很多新人沟通，只会盯着家长字面的问题去回答，答完之后发现家长还是不放心。核心原因就是：没有读懂这句话背后藏着的真实想法。\n这里有一个核心原则：先回应他藏在里面的担心，再回答表面的问题。\n\n我们一条一条来看：\n第一句，家长问：孩子上一次课学多久啊？\n字面是问时长，真正担心的是：上课时间太长，伤眼睛、孩子坐不住、专注力跟不上。\n那我们回应的时候，就不能只说 “一次课 XX 分钟”，要讲清楚：课程时长是专门适配孩子专注力设计的，还有护眼安排、中途休息，打消他视力和坐不住的顾虑。\n\n第二句，家长问：你们老师带班带多久了？\n表面是问教龄，真实顾虑是：害怕老师是新手、不专业，怕没人跟进孩子学习。\n我们的回应方向，重点给到确定性：讲老师带班经验，同时把整套服务机制说出来 —— 每周反馈、课上答疑、全程跟班，让家长放心，不是只靠老师个人。\n\n第三句，家长说：我们家孩子平时表现可棒了。\n这句话不是单纯闲聊，家长的内心期待是：希望老师能看见孩子、多肯定、多鼓励孩子。\n我们就要顺着夸奖孩子的具体行为，并且给到承诺：课堂上会多给孩子展示、表达的机会。\n\n最后记住要点：\n家长随口的一句话，背后都带着一个具体的担心或者期待。沟通顺序一定是：先接住内心的担心，再回答字面问题。只答字面，家长的顾虑还在，沟通就很难推进。来看一道题，家长问「孩子上一次课学多久啊」，真正担心的是？","interact":{"q":"家长问「孩子上一次课学多久啊」，真正担心的是？","at":"P25","options":["时间太长伤视力、孩子坐不住","已经想退费了","嫌课程太短","只是随口一问"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":27,"stage":"阶段4·沟通技巧与异议处理","p":"P26","topic":"异议处理四步：共情→聚焦→解决→赋能（完整示范：担心孩子太小学不会）","script":"接下来我们学习标准化异议处理四步框架，不管家长抛出什么样的顾虑，我们都可以按这个顺序走，不会乱、不会慌。\n\n第一步，共情。\n对应咱们前面学的先跟后带，先接住家长的情绪，话术模板就是：您的担心特别正常，我特别理解。先不着急解释，让家长感受到我们站在他这边，放下防备。\n\n第二步，聚焦问题。\n很多家长的顾虑是笼统模糊的，比如 “我怕孩子学不会”“我担心没效果”。这时候我们不要猜，主动提问把问题具体化：您最担心的是哪一点？\n分清到底是怕跟不上、怕伤眼睛，还是怕没时间坚持，找准核心矛盾，才不会答非所问。\n\n第三步，解决问题。\n针对刚刚锁定的这一个顾虑，给出完整方案，方案要包含三块：课程本身的设计、老师会做的动作、需要家长配合的地方。三点讲清楚，方案才扎实，不是空口承诺。\n\n第四步，赋能。\n打消顾虑之后，最后一步要给家长和孩子信心，把家长拉到 “我们一边”，比如：孩子之前的努力您也看到了，咱们一起盯好。\n把这件事变成家校协同，而不是我们单方面推销课程。\n\n给大家串一遍完整示范，比如家长说：我担心孩子太小学不会。\n\n1. 共情：您这个担心特别正常，我特别理解。\n2. 聚焦：您最担心的是孩子跟不上，坐不住吗？\n3. 解决：咱们课程是低龄孩子专属的实操设计，课堂上老师会一步步引导，课导课后跟进反馈，平时您只需要提醒孩子按时上课就可以。\n4. 赋能：孩子本身好奇心很强，咱们一起陪着他慢慢入门。\n\n记住顺序：先共情稳情绪，再聚焦抓重点，再给方案解顾虑，最后赋能树信心。\n跳过前两步，上来直接讲方案，家长听不进去。","interact":null,"sku":"","dept":""},{"row":28,"stage":"阶段4·沟通技巧与异议处理","p":"P27","topic":"三大高频异议参考应对：请假/坚持不下去/时间太长——框架不变内容应变","script":"这部分给三个最高频的异议，按四步框架给出参考应对。第一个，老师，孩子有事上不了课，能请假吗。共情：计划赶不上变化很正常。聚焦：问清楚是一次性的冲突，还是经常性的时间问题。解决：能调课的提前报备调课，同时讲清楚缺课对学习连续性的影响。赋能：咱们尽量保证出勤，孩子跟得上，效果才看得到。第二个，我担心孩子坚持不下去，做事三分钟热度。共情：很多孩子一开始都这样，不用焦虑。聚焦：问一下之前放弃是因为没兴趣，还是没成就感。解决：直播实操加教具作品，让学习成果看得见，老师每周反馈、及时鼓励。赋能：前三周咱们一起帮他闯过新鲜期，表现好还能选上好苗子重点培养。第三个，课程时间太长，怕孩子消化不了。共情：怕孩子累着，这个想法特别贴心。聚焦：是担心单次课太长，还是整期的强度。解决：单次课时长是按孩子专注力设计的，中间有节奏安排，作业量也可控。赋能：先按课表上两周，我盯着反馈，有问题咱们随时调。最后强调一句，以上是参考思路，实际话术要按孩子的情况灵活调整，框架不变，内容随机应变。","interact":null,"sku":"","dept":""},{"row":29,"stage":"阶段4·沟通技巧与异议处理","p":"P28","topic":"第五章（章节页）：红线与质检（通话四不/质检扣分/注意事项/考核标准）","script":"接下来我们进入第五章，红线与质检。前面我们学了沟通方法、异议处理、成交逻辑，这些是帮我们把沟通做好；而这一章，是告诉大家什么绝对不能做、通话怎么考核，守住底线，避免违规扣分。\n\n这一章我们会围绕四块内容展开：通话四不、质检扣分点、注意事项、考核标准。\n很多新人前期沟通话术练得很好，但踩了红线，一通电话直接作废，甚至影响考核成绩，非常可惜。所以这一块大家一定要记牢，它是我们所有通话的安全底线。\n\n“通话四不” 是我们的基础行为准则，是绝对不能触碰的；\n质检扣分点，会告诉大家日常通话里哪些小问题会丢分，比如夸大承诺、回答不规范、态度生硬；\n还有日常沟通里的各类注意事项，比如信息怎么说、赛事政策怎么表述，不能随意承诺；\n最后是整套考核标准，大家清楚自己的通话会按照什么维度打分，知道怎么做才能拿到合格、优质的通话","interact":null,"sku":"","dept":""},{"row":30,"stage":"阶段4·沟通技巧与异议处理","p":"P29","topic":"成交三性：重要性讲值不值·紧迫性讲能不能等·唯一性讲在哪学最合适","script":"接下来我们看成交三性，这是咱们所有家长沟通、异议处理最后的落脚点。不管家长提什么问题，像担心孩子坚持不下来、上课时间不合适、想再等等、或者纠结要不要报，我们先用前面的四步框架把顾虑化解完，最后一定要收回到这三个核心点上。\n\n首先是重要性，也就是为什么要学编程。\n很多家长心里最根本的疑问就是：学这个到底有啥用，是不是单纯玩？咱们要讲清楚，编程不是兴趣消遣，它贴合新课标方向，看重的是逻辑、拆解、推理这些底层思维。这种思维能力，不是只用来写代码，它能帮孩子理清思路，对数学、理科的审题、解题都有正向帮助，是可以迁移到其他学科、长期受益的能力，让家长明白这件事是有价值、值得投入的。\n\n然后是紧迫性，为什么一定要现在这个年龄段学。\n不是催家长报名，而是客观讲孩子的成长特点。咱们这个阶段，正好是逻辑思维塑造的黄金窗口期，孩子好奇心强、愿意动手尝试，入门接受度高，更容易建立自信和兴趣。如果往后拖，等到年级升高，校内作业变多，文化课压力上来，各类补习班、兴趣班排得满满当当，孩子的空余时间会越来越碎片化，到那时候再想新开一门编程，时间挤不出来，孩子也很难沉下心去学。早启蒙，早积累，越往后越被动。\n\n最后是唯一性，为什么选核桃，而不是别的地方。\n市面上能学编程的机构不少，但完整配套的体系很少。咱们是直播实操课，不是单纯看录播；专门设计了护眼模式，照顾长时间线上学习的孩子；同时打通了完整的赛考通道，从日常学习到赛事、等级测评，一条路能走通；再加上稳定的师资团队、标准化的课后跟进服务。直播实操 + 护眼设计 + 赛考通路 + 配套服务，这一整套组合优势，不是随便一家机构都能配齐的，这就是我们独有的优势。\n\n给大家一个简单好记的口诀：重要性讲值不值，紧迫性讲能不能等，唯一性讲在哪学最合适。来看一道题，「唯一性」要讲清的内容是？","interact":{"q":"「唯一性」要讲清的内容是？","at":"P29","options":["直播实操+护眼模式+赛考通道+师资服务规模——这套组合别家不一定有","别家机构更便宜——价格才是最硬的竞争力","只谈价格优惠——用折扣力度打动家长报名","贬低其他同行——把别家说得一无是处"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":31,"stage":"阶段5·红线与质检","p":"P30","topic":"通话四不红线：不聊敏感话题·不夺命连环问·不垄断话语权·不过度承诺","script":"这一页是通话的四不红线，每一条都直接挂钩质检。第一，不聊敏感话题。和家长沟通要有边界感，可能引起争议和误会的话题一律不碰，比如家庭私事、对其他机构的评价、内部薪酬这些。第二，不夺命连环问。不要连续问一大串问题，每问一个，先等家长的回应和反馈，再问下一个。记住，首通不是审讯。第三，不垄断话语权。沟通是双向互动，如果你发现自己有大段的输出，立刻停下来，互动一句，您对课程还有什么想了解的呀。第四，不过度承诺。对方提的要求你做不到，就不要硬说我可以，答应了又做不到，只会更伤感情。所有的承诺都要留有余地，比如用我尽量、我争取、我帮您协调，这样的说法。","interact":null,"sku":"","dept":""},{"row":32,"stage":"阶段5·红线与质检","p":"P31","topic":"质检扣分点清单：漏必做动作·信息未落表·触犯四不·顺序错乱·状态与话术+挂机自检","script":"接下来我们看质检扣分清单，这是大家通话之后打分的直接依据，每一条都和我们的通话成绩挂钩，我们一条一条拆开讲清楚。\n\n第一点，漏必做动作。\n首通电话有几个硬性动作：加微信、核对快递地址、确认首次上课时间、约小灶课。这几项是规定动作，缺一项就扣一项分，不是说聊得好就可以跳过。很多新人光顾着和家长沟通、讲课程，最后忘了约小灶或者没核对地址，话术再好，照样扣分。\n\n第二点，信息未落表。\n通话里问到的孩子年级、基础情况、家长诉求这些信息，聊完一定要及时录入学生信息表、学期表。记住规则：不落表，视同没有采集。哪怕你电话里问得很全，但是后台没有记录，质检的时候直接判定这项没完成。\n\n第三点，触犯四不红线，这个是从重扣分的，一定要重点警惕。\n包含四类情况：聊敏感话题、连环发问一直逼家长、自顾自大段输出不给家长说话机会、承诺自己做不到的事情。红线问题和普通扣分不一样，一旦踩中，扣分力度会大很多，大家一定要管住自己的表达节奏，不随意许诺。\n\n第四点，顺序错乱。\n流程顺序属于质检硬指标。比如刚接通，还没自我介绍、建立信任，上来就索要信息；或者还没给家长讲清楚配套服务，一上来就催促家长配合上课。流程颠倒，家长体验差，同时直接判定扣分。\n\n最后底部给大家一个非常实用的自检方法：\n每次挂断电话之后，对照六步流程 + 课后动作，自己回放核对一遍：每一步有没有做完、信息有没有及时落表、刚刚有没有许下无法兑现的承诺。养成挂机自查的习惯，能帮我们避开绝大多数扣分。\n\n简单总结：必做动作不能少、采集信息要落表、红线内容绝不碰、沟通流程不乱序，打完电话主动自检，稳定拿到合格通话。","interact":null,"sku":"","dept":""},{"row":33,"stage":"阶段5·红线与质检","p":"P32","topic":"考核标准：总分100，流程/规划/表达/答疑各25分，低于60不合格","script":"最后一部分，看一下我们的考核标准。接下来我们看整张通话的打分表，总分 100 分，分成四大板块，每一块各 25 分：流程、规划、表达、答疑，总分低于 60 分就是不合格通话。咱们先把四个维度分别讲清楚，再看不同分数段的要求。\n\n第一个板块：流程，25 分。\n重点考察通话的完整性、信息准确性。我们开场介绍、信息确认、用户挖掘、学习规划、总结强调这一套流程要走全；开课时间、上课周期、设备、赛考这些关键信息，绝对不能说错。\n\n- 0–14 分：流程缺步骤，或者用词、信息出错，内容啰嗦反复；\n- 15–20 分：流程完整，没有知识点错误；\n- 21–25 分：流程完整干净，语言简洁，还能根据情况做合适的补充。\n\n第二个板块：规划，25 分。\n考察大家能不能讲明白核桃的课程体系，课程之间的衔接、学习周期、赛事规划，并且结合孩子的情况、家长期待，给出适配的学习路线，这也是高分的分水岭。\n\n- 0–14 分：能提到体系，但讲得卡顿、不顺畅；\n- 15–20 分：可以顺畅讲清课程和赛事规则；\n- 21–25 分：自然过渡到体系和赛考，自信流畅，还能根据孩子的情况，定制专属的学习、赛事路径，吸引家长。\n\n第三个板块：表达，25 分。\n电话沟通看不到表情，语气、节奏就是我们的门面。核心要求：信息准确传递、和家长建立连接，拉近距离。\n\n- 0–14 分：语气冷淡，有盘问感、敏感话题、磕绊严重、语速混乱；\n- 15–20 分：表达清晰通顺，有少量口误，但不影响理解，语气有起伏；\n- 21–25 分：语气热情，应答流畅，表达利落舒服。\n\n第四个板块：答疑，25 分。\n考验我们的异议处理能力，不是生硬背话术，是听懂诉求、妥善回应。来看一道题，「表达」板块 0–14 分的表现是？","interact":{"q":"「表达」板块 0–14 分的表现是？","at":"P32","options":["语气冷淡、有盘问感、磕绊严重、语速混乱","语气热情、应答流畅，表达利落舒服","有少量口误，但不影响家长理解","表达清晰通顺，语气有起伏"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":34,"stage":"阶段5·红线与质检","p":"P33","topic":"通话注意事项汇总：七条行为规范（笑着打/先跟后带/一次一问/随打随填…）","script":"最后把通话注意事项汇总成七条，也是首通的完整行为规范。第一，笑着打电话，声音是有感染力的，家长隔着电话能听出来你的状态。第二，先跟后带，先顺着家长说，再带出自己的建议，不反驳，不争论。第三，一次只问一个问题，问完等回答，家长答完了可以简单回应一下，再问下一个。第四，重要信息即时记录，学期表和信息表随打随填，不要考验自己的脑子。第五，家长时间不合适就约，开车、做饭、带娃的时候主动约一个二次拨打的明确时间。第六，承诺留余地，做不到的不硬答，用我帮您协调、我确认之后回复您这样的话替代。第七，也是最容易忘的一条：首通的目标不是卖课，是建立信任、采齐信息、铺垫课程，后面的事情后面做，不要在首通里着急推任何东西。","interact":null,"sku":"","dept":""},{"row":35,"stage":"阶段5·红线与质检","p":"P34","topic":"结束行动项：默写六步流程·本周对照执行自检·话术卡住找师父·总结定位","script":"到这里，我们整套首通电话的培训内容就全部讲完了，最后这一页，是给大家落地执行的行动清单，分四块，清晰好记。\n\n第一，现在立刻要做的任务：\n把六步流程默写一遍：开场→课程确认→信息确认→学情摸底→人设要求→收尾，同时把挂机之后的记录动作一并写上去。默写不是走形式，目的是让大家把流程刻进脑子里，打电话的时候不用翻笔记，顺序不乱、动作不漏。\n\n第二，本周落地要求：\n大家第一批首通电话，严格对照今天这套课件标准去执行。每一通打完，马上自检：六步流程是不是全部走完了、采集到的信息有没有及时落表。自检就是帮大家规避质检扣分，养成习惯。\n\n第三，求助规则，这条大家一定要记住：\n通话当中如果话术卡住、遇到陌生异议接不住，不要自己硬扛、不要随口乱承诺，随时飞书找师父或者主管求助。我们是团队带教，允许请教，不允许硬撑着说错话、踩红线。\n\n最后是核心总结，也是我们首通电话的底层定位：\n首通是服务电话，不是通知电话。\n我们打电话的目标，不是简单通知上课，核心是三件事：和家长建立信任、完整采集孩子学情信息、给家长铺垫课程价值。沟通的时候保持轻松的状态，笑着打，用好我们前面学的先跟后带，通话结束逐项把信息落表。\n\n今天所有的流程、异议处理、成交逻辑、红线质检，最终都落到这几句话、这几个行动上。接下来大家就按这个标准去练习。","interact":null,"sku":"","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"首通电话全流程国润·阶段1","q":"首通的本质是？","options":[{"k":"A","t":"购课后的第一通服务电话：确认信息、介绍自己、讲清课程，化解顾虑"},{"k":"B","t":"一通推销电话——核心目标是让家长当场续费报年课"},{"k":"C","t":"一通简单的上课通知——告知时间安排就完事"},{"k":"D","t":"可打可不打的回访——有空就打，没空就算了"}],"answer":"A","back":"","sku":""},{"id":"T-S02","type":"阶段练习题","chapter":"首通电话全流程国润·阶段1","q":"客单价 49~299 的中价课家长，正确的理解是？","options":[{"k":"A","t":"家长是冲动消费不用重视，按低价课节奏打就行"},{"k":"B","t":"和低价引流课家长没有区别，话术可以照搬"},{"k":"C","t":"家长对课程没有期待，态度冷淡是常态"},{"k":"D","t":"家长一定是思考过才买的课，对老师能力和教学水平的期待更高"}],"answer":"D","back":"","sku":""},{"id":"T-S03","type":"阶段练习题","chapter":"首通电话全流程国润·阶段1","q":"对家长而言，首通的核心价值是给到安全感——把这颗定心丸提前送到，帮家长打消线上学习的顾虑。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-S04","type":"阶段练习题","chapter":"首通电话全流程国润·阶段1","q":"对老师自己，首通直接影响的核心数据是？","options":[{"k":"A","t":"加微率、出勤率、完课率"},{"k":"B","t":"只有底薪"},{"k":"C","t":"退费率一项"},{"k":"D","t":"没有影响"}],"answer":"A","back":"","sku":""},{"id":"T-S05","type":"阶段练习题","chapter":"首通电话全流程国润·阶段1","q":"首通核心目的要做的三件事是？【多选】","options":[{"k":"A","t":"建立信任——把老师人设立住"},{"k":"B","t":"摸清情况——一次采齐打好标签"},{"k":"C","t":"铺垫课程——约好 1v1 开营第一课"},{"k":"D","t":"当场促成续费"}],"answer":"ABC","back":"","sku":""},{"id":"T-S06","type":"阶段练习题","chapter":"首通电话全流程国润·阶段2","q":"热情开场必须完成的三个核心任务是？","options":[{"k":"A","t":"确认营期、亮明身份、引导加微信并发送课程安排"},{"k":"B","t":"报价、逼单、成交——快速拿下续费订单"},{"k":"C","t":"问成绩、问设备、问地址——把信息一次问全"},{"k":"D","t":"闲聊拉家常——先聊多久再聊孩子"}],"answer":"A","back":"","sku":""},{"id":"T-S07","type":"阶段练习题","chapter":"首通电话全流程国润·阶段2","q":"课程信息确认环节要落地的三件事是？","options":[{"k":"A","t":"发课表讲课程结构（4 软件+8 硬件）、核对快递地址、确认学习负责人"},{"k":"B","t":"只发课表就够了，其他信息等家长自己问"},{"k":"C","t":"只核对快递地址，课表可以之后再发"},{"k":"D","t":"直接约续费，趁热打铁锁定长期班"}],"answer":"A","back":"","sku":""},{"id":"T-S08","type":"阶段练习题","chapter":"首通电话全流程国润·阶段2","q":"5-6 年级家长的沟通重点是？","options":[{"k":"A","t":"只讲趣味启蒙——像搭积木一样拖拽，不需要任何基础"},{"k":"B","t":"只讲新课标必考——提前背考点，期末考试不丢分"},{"k":"C","t":"逻辑思维定型关键期——纯英文编程+项目实战，可参加白名单等国家级赛事，升学简历加竞争力"},{"k":"D","t":"不需要差异化沟通——所有年级念同一套话术"}],"answer":"C","back":"","sku":""},{"id":"T-S09","type":"阶段练习题","chapter":"首通电话全流程国润·阶段2","q":"问完设备后抛出的「分叉问题」是？","options":[{"k":"A","t":"您觉得课程贵吗？"},{"k":"B","t":"这次咱们孩子是第一次学编程不？"},{"k":"C","t":"您什么时候有时间？"},{"k":"D","t":"您还报过别的班吗？"}],"answer":"B","back":"","sku":""},{"id":"T-S10","type":"阶段练习题","chapter":"首通电话全流程国润·阶段2","q":"收尾三件套是？【多选】","options":[{"k":"A","t":"留言"},{"k":"B","t":"政策浅铺"},{"k":"C","t":"确认时间"},{"k":"D","t":"当场报价促单"}],"answer":"ABC","back":"","sku":""},{"id":"T-S11","type":"阶段练习题","chapter":"首通电话全流程国润·阶段3","q":"信息采集清单中，「上课条件」类信息的用途是？","options":[{"k":"A","t":"定沟通策略——针对家长画像定回访策略"},{"k":"B","t":"小灶课分层——按基础决定小灶课深度"},{"k":"C","t":"出勤保障——保障准时触达和正常出勤"},{"k":"D","t":"提前排除设备隐患——设备/摄像头麦克风/上课地点"}],"answer":"D","back":"","sku":""},{"id":"T-S12","type":"阶段练习题","chapter":"首通电话全流程国润·阶段3","q":"「您希望孩子这期学完，最想看到什么变化？」实际在听什么？","options":[{"k":"A","t":"孩子的年级——决定用哪一档沟通话术"},{"k":"B","t":"上课设备——排查能不能正常上课"},{"k":"C","t":"快递地址——核对教具寄送到哪里"},{"k":"D","t":"家长的核心诉求——写进信息表，续报和反馈都围绕它"}],"answer":"D","back":"","sku":""},{"id":"T-S13","type":"阶段练习题","chapter":"首通电话全流程国润·阶段3","q":"摸底提问的节奏要求是：一次只问一个问题，等家长回答完再问下一个——连问会让家长应付了事。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-S14","type":"阶段练习题","chapter":"首通电话全流程国润·阶段3","q":"编程认知铺垫的三个方向是？","options":[{"k":"A","t":"为什么涨价、为什么加课、为什么换教材"},{"k":"B","t":"学多久、考几级、赛几场"},{"k":"C","t":"为什么学编程、为什么现在学、为什么在核桃学"},{"k":"D","t":"谁来教、用啥设备、几点上课"}],"answer":"C","back":"","sku":""},{"id":"T-S15","type":"阶段练习题","chapter":"首通电话全流程国润·阶段3","q":"首通里对话题地图的标准动作是？","options":[{"k":"A","t":"只聊期待类——顺着家长夸就可以了"},{"k":"B","t":"主动覆盖服务类全部+顾虑类高频项；期待类记下来作个性化抓手"},{"k":"C","t":"三类都不用覆盖——想到哪聊到哪"},{"k":"D","t":"全部深讲一遍——不留任何后续沟通空间"}],"answer":"B","back":"","sku":""},{"id":"T-S16","type":"阶段练习题","chapter":"首通电话全流程国润·阶段4","q":"「先跟后带」的正确做法是？","options":[{"k":"A","t":"直接指出家长理解错了"},{"k":"B","t":"一上来就讲道理说服"},{"k":"C","t":"冷处理不回应"},{"k":"D","t":"先顺着家长认可他的感受，再带出自己的建议"}],"answer":"D","back":"","sku":""},{"id":"T-S17","type":"阶段练习题","chapter":"首通电话全流程国润·阶段4","q":"家长问「你们老师带班带多久了」，真正担心的是什么？","options":[{"k":"A","t":"想打听老师的工资收入、福利待遇和排班情况"},{"k":"B","t":"怕老师不专业、是新手——要讲带班经验+服务机制给确定性"},{"k":"C","t":"嫌老师太年轻好看，担心管不住自家孩子"},{"k":"D","t":"随便聊聊，背后没有任何具体的担心"}],"answer":"B","back":"","sku":""},{"id":"T-S18","type":"阶段练习题","chapter":"首通电话全流程国润·阶段4","q":"异议处理四步的正确顺序是？","options":[{"k":"A","t":"解决→共情→赋能→聚焦"},{"k":"B","t":"聚焦→赋能→共情→解决"},{"k":"C","t":"共情→聚焦→解决→赋能"},{"k":"D","t":"赋能→解决→聚焦→共情"}],"answer":"C","back":"","sku":""},{"id":"T-S19","type":"阶段练习题","chapter":"首通电话全流程国润·阶段4","q":"应对「我担心孩子坚持不下去」，「聚焦」步骤要问清楚的是？","options":[{"k":"A","t":"家长年收入多少"},{"k":"B","t":"之前放弃是没兴趣还是没成就感"},{"k":"C","t":"要不要直接退费"},{"k":"D","t":"孩子几年级"}],"answer":"B","back":"","sku":""},{"id":"T-S20","type":"阶段练习题","chapter":"首通电话全流程国润·阶段4","q":"「成交三性」是？【多选】","options":[{"k":"A","t":"重要性——为啥要学"},{"k":"B","t":"紧迫性——为啥现在学"},{"k":"C","t":"唯一性——为啥选核桃"},{"k":"D","t":"随机性——想到哪说到哪"}],"answer":"ABC","back":"","sku":""},{"id":"T-S21","type":"阶段练习题","chapter":"首通电话全流程国润·阶段5","q":"「通话四不」红线包括？【多选】","options":[{"k":"A","t":"不聊敏感话题"},{"k":"B","t":"不夺命连环问"},{"k":"C","t":"不垄断话语权"},{"k":"D","t":"不主动要好评"}],"answer":"ABC","back":"","sku":""},{"id":"T-S22","type":"阶段练习题","chapter":"首通电话全流程国润·阶段5","q":"「不落表视同没采集」对应哪条质检扣分点？","options":[{"k":"A","t":"顺序错乱"},{"k":"B","t":"状态与话术"},{"k":"C","t":"触犯四不红线"},{"k":"D","t":"信息未落表"}],"answer":"D","back":"","sku":""},{"id":"T-S23","type":"阶段练习题","chapter":"首通电话全流程国润·阶段5","q":"首通的硬性必做动作（缺一项扣一项）包括？【多选】","options":[{"k":"A","t":"加微信"},{"k":"B","t":"核对快递地址"},{"k":"C","t":"确认首次上课时间"},{"k":"D","t":"当场促成续费"}],"answer":"ABC","back":"","sku":""},{"id":"T-S24","type":"阶段练习题","chapter":"首通电话全流程国润·阶段5","q":"首通通话考核总分 100 分，低于多少分为不合格？","options":[{"k":"A","t":"60 分"},{"k":"B","t":"70 分"},{"k":"C","t":"80 分"},{"k":"D","t":"50 分"}],"answer":"A","back":"","sku":""},{"id":"T-S25","type":"阶段练习题","chapter":"首通电话全流程国润·阶段5","q":"考核四大板块是流程、规划、表达、答疑，每个板块 25 分。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题","chapter":"首通电话全流程国润·全章","q":"这节课「首通电话全流程」的核心四块是？","options":[{"k":"A","t":"开场、报价、逼单、成交"},{"k":"B","t":"加微、催课、催续费、催转介绍"},{"k":"C","t":"定位、流程、话术、质检"},{"k":"D","t":"问候、闲聊、告别、复盘"}],"answer":"C","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题","chapter":"首通电话全流程国润·全章","q":"首通不打或者打得敷衍，后面出现的频繁请假、家长失联甚至投诉，根源很多都是在这第一步埋下的隐患。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题","chapter":"首通电话全流程国润·全章","q":"首通六步的正确顺序是？","options":[{"k":"A","t":"学情摸底→开场→收尾→课程确认→人设→信息确认"},{"k":"B","t":"热情开场→课程确认→信息确认→学情摸底→人设要求→温馨收尾"},{"k":"C","t":"课程确认→开场→人设→信息确认→学情→收尾"},{"k":"D","t":"开场→学情→课程确认→收尾→人设→信息确认"}],"answer":"B","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题","chapter":"首通电话全流程国润·全章","q":"课表要让家长「先存下来」，是因为整套营期周期不短，存图之后方便家长随时翻看、安排时间。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题","chapter":"首通电话全流程国润·全章","q":"不管孩子是哪一档年级，都要统一发给家长的价值锚点素材是？","options":[{"k":"A","t":"课程价格表"},{"k":"B","t":"别人家孩子的成绩单"},{"k":"C","t":"退费协议"},{"k":"D","t":"24 年高考 Python 真题（浙江）"}],"answer":"D","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题","chapter":"首通电话全流程国润·全章","q":"这套教具完整覆盖的四大中小学人工智能核心知识点是？","options":[{"k":"A","t":"物联网、机器视觉、语音 AI、传感交互"},{"k":"B","t":"语文、数学、英语、科学"},{"k":"C","t":"变量、循环、函数、算法"},{"k":"D","t":"绘画、音乐、视频、动画"}],"answer":"A","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题","chapter":"首通电话全流程国润·全章","q":"数学中等的孩子，典型情况是？","options":[{"k":"A","t":"公式完全不会"},{"k":"B","t":"完全不想学数学"},{"k":"C","t":"简单题能做，但粗心马虎、难题攻不下"},{"k":"D","t":"基础太差跟不上"}],"answer":"C","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题","chapter":"首通电话全流程国润·全章","q":"授课老师的人设是「严慈相济」：课堂氛围轻松幽默，但对纪律、代码规范、学习习惯严格要求，孩子学得好或不好都如实反馈。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题","chapter":"首通电话全流程国润·全章","q":"「沟通技巧与异议处理」章节的四个关键词是？","options":[{"k":"A","t":"逼单、催单、砍价、成交"},{"k":"B","t":"先跟后带、听懂心声、四步框架、成交三性"},{"k":"C","t":"加微、催课、约课、续费"},{"k":"D","t":"破冰、报价、谈判、收款"}],"answer":"B","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题","chapter":"首通电话全流程国润·全章","q":"首通的目标不是卖课，而是？","options":[{"k":"A","t":"当场成交续费——能推就推，能促就促"},{"k":"B","t":"收集家长隐私——收入、家庭情况都问一遍"},{"k":"C","t":"建立信任、采齐信息、铺垫课程——后面的事后面做"},{"k":"D","t":"介绍完就挂断——通知完上课时间就行"}],"answer":"C","back":"","sku":""}],"timing":{"P01":{"sents":["这节课要给大家讲的是首通电话的全流程。","这通电话，对我们和家长来说，都是非常重要的第一印象。"," 大家换位思考一下：一个孩子坐在教室里，人没有离开、没有跑出教室，是不是就代表这节课孩子听进去、有收获了？"," 放到我们首通电话里也是一样：家长没有挂断电话，不代表我们这通电话就打好了、沟通有效。"," 今天我主要学习首通电话全流程，核心四块 —— 定位、流程、话术、质检。\n","很多人容易把这通电话只当成开课通知，打完没有信息沉淀，后续转化很难做。","今天不只是给大家话术，先明确这通电话的目标，拆解全流程节点、配套话术，同时讲清楚质检和考核标准。"],"durs":[4.416,5.424,10.704,8.904,7.656,7.68,10.704]},"P02":{"sents":["我们来看今天的课程目录，一共五大模块。\n","第一块，首通的定位与价值。","我们搞清楚什么是首通、这通电话能给家长带来什么、对我们自己有什么帮助，明确打电话的核心目标，不做无效通话。\n","第二块，也是重中之重，首通六步全流程。","后面我们会逐个拆解每一步怎么做。\n","第三块，信息采集和摸底铺垫。","学会收集关键信息，读懂家长的关注点，做到知己知彼。\n","第四块，沟通技巧和异议处理。","遇到家长疑问、顾虑，有对应的方法去应对。\n","第五块，红线和质检。","明确通话禁忌，遵守规范，严禁过度承诺，清楚考核标准。\n","接下来我们先进入第一部分：首通的定位与价值。"],"durs":[4.008,3.096,10.848,4.44,3.384,3.696,5.688,3.384,4.296,2.712,6.12,4.776]},"P03":{"sents":["我们进入第一部分，首通的定位与价值。","很多新老师会觉得首通就是打个电话通知上课，这个理解是不够的。","首通是家长付费之后的第一次深度接触，家长对你的信任和第一印象、对课程的信心，都是在这通电话里建立起来的。","首通的重要性在这也会体现出来。"],"durs":[3.864,6.672,10.704,3.432]},"P04":{"sents":["我们先来搞清楚什么是首通。","首先切换到家长的视角：家长刚付完费用，对我们处于半信任状态，钱已经花出去了，课程还没有开始上，心里一边抱有期待，一边也会有各种顾虑。","所以首通的本质，就是家长购课之后我们打出的第一通服务电话，要在电话里完成信息确认、自我介绍、讲清楚课程安排，提前帮家长化解顾虑。","第一印象只有一次，通话里的声音状态、专业度、条理性，家长都会在这一通里感知到。","我们的49到299价格不等的 AI 思维训练营，大家要注意两点：第一，我们的课单价不低，家长一定是思考过才买的课，家长的质量也很高，肯定的对编程学习有所期待的。","因此，他们对老师能力和教学水平的期待更高；","第二，首通要突出训练营短期拔高的画面感。","首通的质量直接影响后续出勤、完课和信任度。","讲完什么是首通，接下来看它对家长、对我们分别有什么价值。","来看一道题，刚付完费的家长处于什么状态？"],"durs":[2.976,13.224,13.944,8.184,16.368,4.776,4.584,5.088,5.88,4.44]},"P05":{"sents":["首先是对家长，核心就是给到安全感。","线上教育，家长最大的顾虑就是怕钱花出去之后没人跟进、没人管，而首通，就是提前把这颗定心丸给到家长，帮他们打消线上学习的顾虑，让家长觉得这笔钱花得踏实。\n","其次就是兼顾个性化。","每个孩子的基础、情况都不一样，家长也会有各自的需求和担心。","我们要在首通里主动收集这些信息，针对家长的疑问给出对应的解决方案。\n\n","然后是对我们自己，同样有两点。\n","第一是数据。","加微率、出勤率、完课率这些核心指标，直接和大家的绩效挂钩，而这些数据的底子，就是靠首通打下来的。\n","第二是学情摸排。","我们通过首通，摸清孩子的年龄、编程基础，还有家长的期待，后续的服务和沟通才能因材施教、有的放矢。\n\n","反过来讲，大家一定要记住：首通不打，或者打得敷衍、质量差，后面出现的频繁请假、家长失联、甚至投诉问题，根源很多都是在这一步埋下的隐患。","所以大家一定要足够重视首通这通电话。\n\n","讲完价值，接下来我们来看首通的核心目的。"],"durs":[3.96,16.032,2.472,6.168,6.984,3.288,1.872,10.416,2.136,10.272,14.088,4.272,4.368]},"P06":{"sents":["接下来明确首通的核心目的，做好三件事。","第一件，建立信任：稳住第一印象、立好老师人设，讲清楚我是谁、我怎么带班、怎么服务，让家长放心把孩子交给我们。","第二件，摸清情况：孩子的年纪、年级分档、上课设备，设备是否达标直接关系后续能不能稳定上课；","同时了解孩子的编程基础、学习兴趣，家长的期待和顾虑，一次采齐，打好标签，完成用户描述记录，及时落表。","第三件，铺垫课程：激发家长和孩子对课程的期待，讲明白学什么、怎么学，约好一对一的开营第一课，提前强调按时出勤的重要性。","最后记住：首通不是通知电话，是带着明确服务目标的结构化沟通，说的每一句话都有任务，走的每一步都算数。"],"durs":[4.248,11.16,10.2,10.944,12.696,10.344]},"P07":{"sents":["进入第二部分，首通全流程。","这部分是今天的重点。","整个首通分为六步，顺序是经过验证的，不能乱：先开场建立身份，再确认课程信息，然后确认孩子的基本情况，接着摸学情挖需求，再立老师人设、提学习要求，最后温馨收尾。","挂了电话之后还有记录和留存的动作。","大家先把顺序记住，后面我们逐步拆每一步的话术。"],"durs":[3.168,2.472,17.064,3.816,5.064]},"P08":{"sents":["接下来我们进入首通全景，整体就是六大通话步骤，再加挂机之后的配套课后动作，一环扣一环，顺序不能调换。\n\n","首先第一步，热情开场。","我们上来先自我介绍，清晰告诉家长我是谁、打电话的目的：我是接下来六周全程带孩子上课的带班老师，今天这通电话，主要是跟您对接课程，同步后续全部的学习安排，先把身份立住，让家长知道我们不是随便的推销电话。\n\n","第二步，课程确认。","这个环节最核心的一件事，就是引导家长添加微信，微信是我们后续长期沟通、发资料、跟进学习最主要的渠道，一定要在这个环节加上。","同时和家长核对课表，确认上课时间，还要核对教具快递收货地址，避免后续教具发错、收不到，耽误孩子上课。\n\n","第三步，信息确认。","我们要核实关键信息：孩子的年龄、年级、平时对接的主要负责人、家里用来上课的设备情况。","设备这块一定要重点检查，提前排查设备能不能正常运行，避免等到开课当天，才发现设备不兼容、用不了，导致孩子没法正常上课。\n\n","第四步，学情摸底。","到这里我们就要深挖信息了，了解孩子之前有没有接触过编程、基础怎么样，孩子对编程的兴趣高不高，同时倾听家长的想法、顾虑和期待，把这些需求都挖出来，方便我们后续针对性服务。\n\n","第五步，人设和上课要求。","跟家长讲清楚咱们的上课风格，是耐心引导型，还是偏严格督促的类型，让家长提前熟悉你的带班方式；","同时同步上课规则，强调按时出勤的重要性，提前给家长建立上课的预期。\n\n","第六步，温馨收尾。","对本次通话简单复盘，给到家长安心感，浅浅铺垫后续的安排和编程政策。","埋下钩子，方便我们之后继续跟进。\n\n","通话结束，挂机之后的动作，同样非常关键，千万不能打完电话就放一边。","我们要马上更新学生信息表，把刚刚沟通收集到的家长诉求、孩子情况补充完整，大家一定不要只靠脑子记，信息多了很容易遗忘、记错。\n\n","这里有两个关键点，大家一定要刻在心里：\n","第一，通话顺序绝对不能乱。","我们要先介绍自己、建立身份，再去收集各类信息；","先跟家长讲我们能提供什么服务，再提上课相关要求。","一旦顺序颠倒，家长的防备和防御心马上就上来，沟通就很难推进。\n","第二，每一步都有它对应的任务，不是随便聊聊：开场用来建立身份，信息确认用来规避后续出错，学情摸底用来方便因材施教、分班服务，打造人设是为了积累信任，收尾是为后续跟进留下钩子。\n\n","一句话总结：电话里的沟通很重要，但电话结束之后的信息录入工作，和通话本身同等重要。","如果聊完之后信息没有落到表格里，没有记录留存，那这一通首通，基本就等于白打了。","来看一道题，挂机之后的配套动作是？"],"durs":[10.704,2.832,20.232,2.4,12.744,11.16,2.472,8.904,12.84,2.52,17.016,3,9.744,7.464,2.448,7.44,3.648,7.056,12.768,4.008,3.192,5.112,5.352,6.696,18.312,8.832,8.016,3.768]},"P09":{"sents":["我们先来看看首通电话的热情开场环节。\n","首先大家先看参考话术：“hello 您好，咱给孩子报名了价格是XX 的 AI 思维训练营对吧？","我是孩子的专属老师 xx，咱们这次课程是 6 周，课程形式会比较丰富，您这会加下我的微信，我给您发下我们这次的课程安排，方便您随时查看。”\n\n","这段话术背后，藏着我们开场必须完成的三个核心任务：\n","第一，确认营期，核实家长报名的就是 AI 思维训练营；\n","第二，亮明身份，告诉家长我是孩子的专属老师，6 周全程带班；\n","第三，引导家长添加微信，同步发送课程安排。\n\n","这里有个关键点：加微信是前置动作，用课表作为抓手，给到家长明确的价值，家长才愿意继续和我们沟通。\n\n","沟通上有两个重点注意事项：\n","第一，打电话的时候尽量带着笑意，声音会更有感染力；\n","第二，灵活用好【先跟后带】的沟通方法，先共情、顺着家长的想法回应，再输出我们的内容和建议，不要直接反驳家长，避免家长产生防备心理。\n\n","额外补充两个实操小技巧：\n\n","1. 接通电话后，可以主动告知家长这通电话沟通的大致内容和预估时长，给家长心理预期，降低中途挂断的概率；","全程语速放缓平稳，开场不要堆砌复杂信息。\n","2. 如果接通后家长正在开车、做饭，当下不方便沟通，不要硬聊，礼貌约定合适时间再回拨。\n\n","最后收尾提醒：通话结束后，一定要第一时间给用户打标签、填写用户信息记录到学情详情表，不要只靠脑子记忆，很容易遗漏信息"],"durs":[4.056,9.024,13.32,5.256,5.832,6.792,4.896,10.104,2.928,5.784,13.392,2.928,10.8,4.68,9.624,12.432]},"P10":{"sents":["接下来进入第二个环节：课程信息确认，核心围绕微信、课表、硬件快递三件事同步信息。\n","先看参考话术：“咱是 4 节软件课程 + 8 节硬件课，软硬结合锻炼孩子的脑力和动手操作能力，便于孩子更好的理解人工智能。","您看到课表了吧？","咱们课程时间是 x 月 x 号开始的，时间会比较久一些，您可以先存下来。","我先帮您核对下硬件的收货地址哈，您的地址是 xx 对吗？","好。”\n\n","这一段沟通，我们要落地三个核心任务：\n","第一，发送课表，清晰讲清课程结构：4 节软件课搭配 8 节硬件课，软硬结合的模式，把课程形式传递给家长；\n","第二，仔细核对硬件器材的收货地址，后续发给家长物流查询图，方便家长自主跟踪快递进度；\n","第三，确认孩子学习的主要负责人，后续所有的服务跟进、学习督促、学情反馈，我们都优先对接这位家长，避免信息混乱。\n\n","这里有两个重点提醒：\n","一是引导家长把课表保存下来，整套营期周期不短，存图之后方便家长随时翻看、安排时间。\n","二是大家要记住中价课用户的特点：这类家长是经过思考、主动对比之后才报名的，沟通时要对齐家长的期待，不要用低价引流课的沟通方式。\n\n","同时，首通电话也是铺垫长期学习理念的好时机。","我们可以在这个环节提前给家长建立预期，把课程价值、孩子后续的学习画面讲出来，明确告诉家长我们会怎么跟进孩子的学习、提供哪些服务，并且后续全程按照这个标准落地。","让家长心里有数，感知到课程不是短期体验，而是一套完整的成长方案，为后续长期续费埋下伏笔。"],"durs":[9.024,12.336,1.992,6.792,5.928,1.872,3.792,11.328,9.456,11.52,2.352,9.432,13.128,5.136,16.08,9.648]},"P11":{"sents":["这一步是精准匹配孩子学习价值、打动家长的关键。\n","开场先统一提问：咱孩子目前是几年级了呀？","拉近距离\n","我们根据家长给到的年级，直接对应三档差异化话术，做到对号入座，不千篇一律。","同时有一个统一动作：不管孩子是哪一档，沟通后都发给家长【24 年高考 Python 真题（浙江）】，用这份真题作为看得见的价值锚点，让家长直观感受到 Python 在升学里的分量，而不是空口讲好处。","后续老师说关于python的规划都是有据可依的，家长的信服度更高。\n\n","我们分开看三档的逻辑：\n","3-4 年级：这个阶段是小学分水岭，孩子抽象思维刚刚萌芽。","我们重点讲，课程会渗透变量、循环这些 Python 核心概念，不是急着写复杂代码，而是帮孩子铺垫思维，为高年级数学、信息学提前打好底层基础。\n","5-6 年级：属于逻辑思维定型的黄金关键期。","课程主打纯英文编程 + 项目实战，锻炼算法思维、工程化能力；","同时抛出赛事路径，告诉家长学好之后可以参与白名单等国家级赛事，丰富孩子升学简历，增加竞争力。"," 7-9 年级：孩子面临中考升学压力。","切入点贴合新课标政策，Python 已经纳入信息科技必考内容，它语法简单、上手快，提前学，就是帮孩子提前熟悉考点，避开后续校内考试踩坑。\n","不要背话术生硬朗读，抓住每一档家长最关心的痛点。","低龄家长关心思维打底、助力数学；","高段小学家长看重赛事、升学加分；","初中家长优先在意校内考点、应试减负。","来看一道题，3-4 年级家长的沟通重点是？"],"durs":[5.208,4.344,1.872,7.8,18.744,6.312,2.544,6.456,14.688,4.728,6.6,10.224,4.104,14.088,5.136,4.008,4.056,4.32,4.416]},"P12":{"sents":["接下来到设备确认环节，这一步非常关键，原则就是：设备问题一定要提前排查、当场沟通解决，千万不要留到开课的时候才发现，直接影响孩子上课体验，也会拉低我们的转化。\n\n","我们先看参考话术：“那用什么设备给孩子上课哈？","咱们这个不是短期体验班，对上课设备是有要求的，手机上课后续转化会比较低。","行，咱用 XX 也比较方便，我刚刚发您一张图片，是本次课程软件的代码样式，您可以浏览下。","编程其实已经成为中小学教育里，继阅读、写作、算数之外的第四项基本技能。","这次咱们孩子是第一次学编程不？”\n\n","问完设备之后，我们抛出分叉问题：这次咱们孩子是第一次学编程不？"," 根据家长的回答分两条路径沟通：\n","第一种情况：孩子是第一次学编程。\n","我们重点介绍课程体系，说明课程是和清华大学联合升级研发的；","孩子上完课可以产出 4 个软件作品 + 硬件作品；","课程里面会融入大约 30 个英语单词、20 多个理综知识点，反过来辅助孩子理解数学、理科难题。","同时告诉家长，课前会安排 1v1 开营第一课做单独预习，后面我们再和家长敲定预习时间。\n\n","第二种情况：孩子之前接触过编程，有基础。\n","我们用追问三连来摸清学情：之前在哪里学过？","学的是什么语言？","学了多久？","还可以拓展问问现在还在学吗、之前课程的费用。","摸清基础之后，再给到正向肯定，告诉家长孩子有基础，在咱们寓教于乐的模式里，能收获更深的思考；","夸赞家长很早就带孩子接触编程，很有前瞻的教育理念。\n\n","最后重点强调这条设备纪律：手机上课的用户，后续续报转化概率偏低。","所以设备这一关，在首通电话里就要落实清楚、引导到位，提前规避开课之后出问题。"],"durs":[16.92,4.752,7.824,9.384,7.728,3.336,6.336,3.36,3.6,6.552,4.896,9.72,9.6,4.632,4.92,2.016,1.872,4.8,9.648,5.424,7.32,8.616]},"P13":{"sents":["挖掘家长核心诉求的第一步。\n","先抛出开放式提问：“那妈妈，您是看到直播间主播老师讲的哪方面比较感兴趣，就下单了哈？”\n","这句话不设限制，引导家长主动说出下单初衷：是看好 AI 硬件、想练代码、还是冲着赛事、校内信息课来的，我们认真倾听，先接住家长的想法。\n\n","等家长说完，我们再介绍这套教具：咱们这套教具，完整覆盖物联网、机器视觉、语音 AI、传感交互四大中小学人工智能核心知识点，也是很多学校信息科技课堂在用的同款标准化实训教具。\n\n","紧接着做硬件外化，把课程形式讲明白，让家长能想象到孩子上课的画面：咱们这个硬编课，就是带着孩子玩转 AI，一边跟着线上老师学习 Python 代码，一边亲手接线、组装、调试硬件，把写在代码里的逻辑，变成看得见、摸得着、能运行的实物科创作品。\n","同时提前铺垫一个细节：后续上课硬件需要充电的时候，我会提前跟您提醒。\n\n","沟通完一定要落地动作：根据家长的回答，判断孩子和家长的兴趣方向，打上标签，区分是偏向硬件动手、代码逻辑，还是 AI 场景应用，同步记录到标签和用户描述里。\n","这一页最终产出两个关键信息：孩子兴趣方向标签 + 家长第一关注点，后面整通电话的学情沟通、价值塑造、异议处理，都围绕这个点来讲，沟通才有重心、有的放矢。"],"durs":[3,8.904,14.112,18.408,24.624,7.176,16.176,16.032]},"P14":{"sents":["这一步我们在首通电话深挖学情，主动询问家长孩子数学、英语在校情况，根据成绩分档沟通，最后落地到 Python 编程对校内学习实实在在的助力，不说空泛的大道理。\n\n","先问孩子数学情况，分三档应对：\n","数学好：孩子本身逻辑推理能力强，Python 里的循环、分支、条件判断、算法建模，可以把孩子的逻辑优势进一步拔高。","校内数学很多难题、奥数思维题，本质就是分步拆解、逻辑推导，编程刚好给孩子一个自由练习复杂推理的载体，锻炼多步骤问题拆解能力，为后续信息学赛事、初高中数学难题打基础。","数学中等很多孩子数学丢分不是公式不会，是看不懂应用题、不会梳理题干条件。","Python 写代码的过程，就是强迫孩子把文字题目翻译成步骤，先找已知条件、再梳理先后顺序、最后验证结果，持续训练应用题建模思维，慢慢学会读懂长题干、分步解题，补齐数学最容易丢分的阅读理解短板。\n","数学偏弱：大多是审题马虎、跳步骤、思路混乱。","Python 代码有严格的执行顺序，少一个步骤、写错逻辑就跑不出结果，能倒逼孩子养成按顺序思考、逐项核对、细心排查 bug 的习惯，慢慢改掉粗心跳步的问题，建立标准化解题思维，反哺校内计算和应用题。\n\n","再结合英语情况跟进：\n","英语好Python 关键字全是英文，if、for、print 这些指令，孩子可以在实操场景里巩固认读，把校内学到的英语词汇用起来，做到学以致用，提升英文信息读取能力。","英语偏弱：课程不会单独布置背单词任务，是在写代码、调试程序的过程里，循序渐进接触编程高频英文词，在动手场景里记忆，比死记单词表更轻松，慢慢积累学科英文词汇。\n","统一价值收口（重点，讲得具体）\n","所以 Python 不是单纯补数学、补英语的单科补习班，它练的是底层思维：\n\n","1. 对数学：专门解决应用题读不懂、不会分步推理、粗心马虎这几类高频痛点，训练建模思维，适配新课标信息科技，\n","2. 对英语：在真实代码场景积累专业英文词汇，熟悉英文指令，适应信息学科的英文阅读环境；\n","3. 长期校内红利：新课标已经把 信息科技纳入中小学信息科技必考内容，初中信息科技期末、会考都会考察 Python 基础，提前学，孩子到校内上课的时候上手更快，不用临时突击。\n\n","沟通完记得把孩子数学、英语学情打好标签，后续续报、回访的时候，我们就可以精准对应孩子的薄弱点来讲价值，沟通更有说服力。","来看一道题，数学好的孩子，沟通方向是？"],"durs":[16.224,3.624,11.568,17.736,7.944,20.472,5.376,20.04,2.568,15.504,17.088,3.552,7.368,11.616,9.384,18.12,12.456,4.344]},"P15":{"sents":["接下来我们进入 Python 认知沟通环节，这一步要根据家长对 Python 的熟悉程度，分两套思路灵活沟通，核心目标是帮家长建立对 Python 清晰、正向的认知，最后做好收尾三件套。\n\n","第一种情况：家长不了解 Python，我们用生活化场景切入，场景化讲解，避免讲专业术语，家长更容易听懂。\n","我们可以和家长说，咱们日常在用的微信、抖音、支付宝，底层都是代码开发出来的软件；","春晚的机器人、自动驾驶，很多 AI 硬件项目也都会用到 Python。","现在已经是人工智能时代，编程不再是小众技能。\n","聊完价值之后，我们可以请家长帮忙给孩子带一句带有鼓励和期待的话，首通电话末尾，如果条件允许，也可以把孩子拉到电话旁，家长直接复述这份期待给孩子，调动孩子的学习兴趣。\n\n","紧接着我们做三种语言对比：Scratch、Python、C++，帮家长分清差异。\n","Scratch 是积木拖拽式，大多是小游戏，知识点很浅，更适合低龄启蒙；","C++ 语法复杂、门槛高，不适合零基础孩子直接上手；","而 Python 刚好卡在中间，零基础就能学，需要孩子手动敲写英文代码。\n","这里我们可以结合真实带班案例来讲：很多孩子之前玩线上抽奖小游戏，总以为是靠运气，学完 Python 之后，就能看懂抽奖程序背后是提前写好的概率逻辑，明白中奖并不是随机的。","而是可以通过程序设计好的。","课程里还会做数据分析、趣味小工具这类项目，本质上全程锻炼孩子的逻辑思维，学会拆解复杂问题、排查 bug。\n","关于学习时机和应用面也要同步讲清楚：Python 是校内信息会考、科创赛事、AI 类竞赛里最常用的语言。","现阶段学习接受新知识快，等到高年级课业压力变大，很难再抽出整块时间入门，提前学，也是给孩子升学多准备一条备选赛道。\n\n","第二种情况：家长本身就了解 Python。\n","我们先正向肯定家长：“看来您提前做过功课呢，真难得！","方便问下您是在哪了解的 Python 呀？”\n","先倾听家长的认知、顾虑或者期待，顺着家长的话多聊两句，再自然衔接回咱们这套课程的规划，匹配他的需求，不要自顾自灌输内容。\n\n","最后统一记住收尾三件套，确认完再挂机：\n","第一，再次核对首次上课时间，几号、几点，明确由谁提醒孩子，责任落实到人；\n","第二，给孩子传递鼓励的留言；\n","第三，浅浅铺垫校内、赛事相关政策，不用深度展开，留到后续回访继续沟通。"],"durs":[17.76,10.56,8.712,6.72,4.8,16.848,7.464,6.936,6.312,7.296,17.112,2.904,10.752,10.44,12.336,4.032,5.424,4.296,12.6,4.584,8.4,3.288,8.064]},"P16":{"sents":["前面我们已经和家长确认了年级、上课设备、摸清了孩子数学英语学情、聊完 Python 认知、挖好了孩子兴趣标签，到这一步，我们把师资、硬件价值、服务保障打包讲清楚，给家长建立完整的服务预期，最后做整通首通电话的终极价值收口。\n\n","第一块，先讲授课老师的人设与教学风格。\n","咱们授课老师是严慈相济的风格：课堂氛围轻松幽默，孩子愿意主动动手、愿意表达；","但对课堂纪律、代码规范、学习习惯要求严格，严师出高徒。","不管孩子课上发挥很好，还是薄弱点、易错地方，我们都会如实同步给家长，不夸大、不回避问题，真实反馈才能精准帮孩子查漏，进步更快。\n","这里同步提醒我们自己：前面首通问到的所有信息 —— 孩子年级、上课负责人、上课设备、编程基础、兴趣方向、家长诉求，全部要及时录入学情表，不要靠脑子记忆。\n\n","第二块，继续外化这套软硬结合课程的硬件价值，承接之前挖需、硬件外化那一页的内容。\n","咱们这套教具，覆盖物联网、机器视觉、语音 AI、传感交互四大方向，孩子可以亲手组装调试 AI 伙伴机器人、感应装置、智能跟随小车这类科创作品。","现在科创赛事、综合素质评价、重点学校自主招生，主流项目都是软件 + 硬件结合。","孩子一边写 代码，一边动手组装调试，走的是和文化课不一样的赛道，多积累科创成果，就多一份择校优势。\n","同时做好记录：通话里家长提出来的个性化需求，单独记一条，之后每一次回访、跟进之前，先翻这条记录，沟通精准贴合家长的想法。\n\n","第三块，介绍专属学习档案 + 陪学建议，承接前面学情打标签的动作。\n","我们会为每一个孩子建立专属学习档案，全程记录孩子每次课的代码作品、思维变化、能力成长，把我们刚才记录的数学、英语学情、兴趣标签全部归档，成长轨迹看得见。","也建议家长有空可以陪着孩子一起上课、看孩子的作品，近距离观察孩子，看看孩子在编程上的思维天赋。\n","沟通结束之后，课表、器材清单、上课注意事项，统一微信发文字版，用文字和家长二次确认关键信息，避免口头沟通产生误会。\n\n","最后是整通首通电话的大价值收口，这句话一定要稳住、讲透：\n","编程是未来的必备能力，就算孩子之后不走竞赛、考级这条路，在学习 Python、调试硬件的过程里练出来的独立思考、拆解复杂问题、自主排查 bug 解决问题的能力，是可以终身受用的。","在 AI 和大数据的时代，拥有这套底层思维，孩子至少不会被动，看得懂科技、用得好工具。\n\n","最后内部提醒：电话里答应家长的所有事项，全部靠学情表兜底，及时记录，不要依赖记忆，避免遗漏承诺。"],"durs":[22.944,4.488,8.448,6.36,13.32,15.6,9,14.688,8.688,10.656,12.816,7.2,15.768,9.984,12.816,6.48,17.256,9,10.32]},"P17":{"sents":["来到首通电话最后的闭环收尾，固定走好留言、政策浅铺、确认时间这三步，平稳收尾，不仓促挂机。\n\n","第一块：留言环节\n","邀请家长用购课手机号对应的微信扫码，给孩子写下鼓励的话。","孩子上课输入密码进入课程的时候，就可以看到家长的留言。","这个环节不强制，如果家长不方便扫码，直接在微信小灶群里发留言也完全可以。","目的是制造仪式感，给到孩子正向期待，激发上课的积极性。\n\n","第二块：政策浅铺（这里重点把性价比、选拔规则细致讲透，点到为止，不过度展开，留足后续回访空间）\n","跟家长讲清楚为什么现阶段学 Python 性价比很高：\n","现在信息科技已经纳入中小学必修课，不少地区初中的信息学业水平考试，核心考察内容就是 Python。","高考也有大量科技相关的命题方向，科创素养越来越受重视。","同时教育部每年都会发布官方白名单科创赛事，像人工智能创新挑战赛、教育成果大赛、这类赛事，孩子用 Python 完成的科创项目都可以报名参赛。\n","咱们后续还会有综合能力选拔，选拔的打分口径是：软编排名占 60%、硬件动手实操占 20%、综合应用能力占 20%，用来筛选出有科创天赋的孩子。","孩子具备不错的潜力，建议咱们家长提醒孩子认真对待课程，好好练习，期待后续拿到不错的成绩。\n\n","第三块：确认时间，落实到人\n","敲定孩子 1v1 开营第一课准确时间，几号、几点全部核对清楚。","提前和家长约定好，开课之前半小时我主动联系，带着孩子提前下载、调试上课软件，避免开课当天出现设备、软件问题，耽误上课。\n\n","通话全程，用户标签、用户描述、学情表一定要随沟通随填写，不要靠大脑记忆，电话里答应家长的事项，全部靠表格兜底，避免遗漏。","来看一道题，留言环节请家长用什么扫码？"],"durs":[9.96,2.496,6,5.664,7.776,6.12,10.464,5.4,10.104,6.024,14.448,16.248,9.408,3.576,7.176,13.2,13.176,4.392]},"P18":{"sents":["接下来我们进入第三章：信息采集与摸底铺垫。\n","这一章，是咱们首通电话里承上启下的核心板块，里面包含四大模块：采集清单、摸底提问、编程认知铺垫、家长关注地图。\n\n","很多老师打电话容易犯一个问题：想到哪问到哪，提问零散，聊完之后关键信息缺漏，后面没法精准服务。","这一章就是帮我们把学情摸底标准化，我们不是随便聊天，是带着目标、带着清单去采集信息，搭好孩子和家长的完整画像。\n\n","首先是采集清单，也就是我们要收集的全部信息项，前面我们学情摸底环节用到的内容，都在这个清单里：孩子编程基础、过往学习经历、兴趣来源、校内成绩、学科偏好、家长核心诉求、对 Python 的了解程度等等。","清单就是我们的检查项，避免通话结束才发现漏掉关键信息。\n\n","第二块是摸底提问，也就是我们的提问话术和追问逻辑。","重点记住：听到家长笼统的需求，一定要深挖。","比如家长说想锻炼思维，我们不能停在这里，要继续追问，把模糊的期待变具体。","提问是有顺序、有节奏的，先了解孩子，再挖掘家长的真实想法，不是一连串审问式提问，是自然沟通。\n\n","第三块是编程认知铺垫。","我们会借着提问，判断家长和孩子对编程、Python 的认知深浅。","如果完全零基础，后面沟通就少用专业术语；","如果之前接触过，我们就可以适度拔高，聊对应的赛事、进阶方向，对齐家长认知，避免沟通错位。\n\n","第四块是家长关注地图，简单来说，就是把家长的诉求分类标记好：有的家长看重思维能力、有的看重校内辅助、有的看重竞赛升学、有的只是孩子单纯感兴趣。","我们把关注点标注清楚，这张 “地图”，就是后面小灶授课、课堂反馈、续报铺垫的方向。\n\n","大家要明白，摸底铺垫，不是为了收集信息而收集。","我们所有的提问、记录、判断，最终都是为了找准家长的关注点，做到因材施教、精准服务。","这一章吃透，我们的学情摸底就不会浮于表面，沟通更有抓手，而不是漫无目的闲聊。"],"durs":[4.872,12.072,10.056,11.304,20.304,6.192,5.256,4.632,7.656,9.984,2.808,6.576,4.776,9.456,14.952,8.256,5.016,8.736,7.92]},"P19":{"sents":["接下来我们看信息采集清单，这张表就是我们首通电话的采集标尺，分成六大类，每一项都有对应的用途，不是随便问问，每一条信息都服务于后面的教学和服务。\n\n","第一类，学员基础信息。","必收集孩子年级、主要照顾人以及联系方式。","拿到这些，我们才能匹配适合孩子的课程，同时确定我们日常对接的服务人，避免之后沟通找不到对接家长。\n\n","第二类，上课条件。","要确认上课用电脑还是平板、摄像头麦克风是否正常、上课地点。","提前排查设备问题，避免正式上课的时候设备故障，耽误孩子上课，减少临场问题。\n\n","第三类，学习背景。","重点问孩子有没有编程基础、有没有接触过 Python 这类语言，还有校内成绩、擅长或者薄弱的学科。","这一项直接决定咱们小灶课怎么分层，跟家长沟通的深浅。","零基础就多做科普，有基础就可以往进阶、赛事方向去聊。\n\n","第四类，兴趣与动机。","我们要搞清楚：孩子是自己喜欢编程，还是家长安排来学？","家长报课最期待收获什么，最想改善孩子哪方面？","这一步就是深挖真实需求，后面上课、反馈都能贴合孩子情况，因材施教。\n\n","第五类，服务安排。","确认微信好友有没有加上、快递地址核对、首次上课时间、照顾人的空闲时间。","保障后续教具正常发货、准时触达、孩子能够正常出勤上课。\n\n","第六类，家长画像。","记录家长核心关注点，是看重升学竞赛、兴趣培养，还是逻辑思维锻炼；","同时记下家长的沟通习惯，以及当下有没有顾虑。","有了这个画像，我们就能定好后续回访、续报的沟通策略，提前做好异议预警。\n\n","大家一定要记住，清单是框架，不是审问。","我们穿插在聊天里自然提问，一边聊一边记录，通话结束同步填进学情表。","这些信息串联起来，就是完整的孩子和家长画像，也是我们后面所有沟通、授课、跟进的依据。"],"durs":[14.808,2.856,4.68,10.368,2.472,7.128,8.256,2.496,10.224,5.664,5.928,2.616,5.784,5.112,7.656,2.376,7.632,6.192,2.496,7.056,4.752,7.368,4.368,7.2,9.12]},"P20":{"sents":["接下来我们来看摸底提问这一页，核心就是搞懂：我们嘴上在问什么，耳朵重点要听什么，提问不是走流程，每一句都带着目标。\n\n","我们一条一条拆开：\n","第一个问题：宝贝之前接触过编程吗？\n","表面上是了解编程基础，实际我们要判断程度：零基础的孩子，后续沟通、小灶课就要多鼓励、降低门槛；","有基础的，继续追问学到哪一步，避免内容重复，也方便匹配更高阶的引导。\n\n","第二个问题：是孩子自己想学，还是您给他安排的？\n","表面问兴趣来源，实际区分动力来源：如果是孩子自发想学，我们后续多给展示机会、多肯定；","如果是家长安排的，我们重点要在小灶课上点燃孩子兴趣，帮孩子建立内驱力，不然很容易出现抵触、坚持不下去的情况。\n\n","第三个问题：孩子在学校成绩怎么样，喜欢哪门课？\n","表面了解校内情况，实际是找学科挂钩点。","比如孩子喜欢数学，我们就多讲编程和逻辑、数学思维的关联；","喜欢语文，就可以讲故事、项目创作，把课程价值和孩子现有优势绑定，这就是我们后面铺垫价值的 “弹药”。\n\n","第四个问题：平时谁盯着孩子学习比较多？\n","表面问家庭分工，实际锁定主要对接人。","之后课堂反馈、学习提醒、回访沟通，优先找这位家长，避免消息多头传递、信息脱节，没人跟进学习。\n\n","第五个问题：您希望孩子这期学完，最想看到什么变化？\n","表面问期待，实际抓家长的核心诉求。","这句话挖到的答案，一定要记录进学情表。","之后所有的课堂反馈、阶段性沟通、续报铺垫，全部围绕这个诉求来讲，家长才会觉得我们懂他。\n\n","最后重点看节奏提醒：一次只问一个问题，等家长回答完，再问下一个。\n","千万不要连环抛问题，连问会让家长有被审问的压迫感，回答也容易敷衍应付，信息就摸不准了。","我们一问一答，边听边回应，自然穿插，才是舒服的沟通节奏。\n\n","这一组提问，刚好对应前面的信息采集清单，一边聊一边把关键信息收齐，为后面的沟通打好基础。"],"durs":[11.4,2.088,3.696,10.392,7.416,4.704,9.168,11.04,4.944,4.416,6.288,9.936,4.44,4.152,10.488,5.184,4.152,4.272,9.168,6.864,9.096,6.048,9.432]},"P21":{"sents":["接下来我们进入编程认知铺垫这一页，核心记住标题这句话：浅铺一层，留足空间。\n\n","这里分成三个方向，我们依次来看：\n","第一块，为什么学编程。\n","我们可以简单跟家长提三点：新课标里已经加入信息科技；","编程可以锻炼逻辑思维，反过来助力校内各科学习；","长期来看，也是发展科技特长、参与信息类赛事的入口。\n\n","第二块，为什么现在学。\n","重点抓住年龄窗口期：孩子现阶段正是思维习惯养成的黄金阶段，早接触、早建立思维，收益会更明显。\n\n","第三块，为什么在核桃学。\n","给家长讲清楚我们完整的服务闭环：直播实操上课、配套教具动手练习、课导全程跟班服务，同时还有赛考通道，从学习到赛事，整套体系是完整的。\n\n","最关键的是下方的分寸把握，这也是新人最容易踩坑的地方：\n","首通只做浅铺，每一点一句话带过，不展开、不深讲、不逼问家长认不认可。\n","首通的目标不是当场说服家长，只是先种下认知。","深度讲解、价值论证、打消顾虑，全部留给小灶课、课后回访以及后续续报沟通。","如果首通讲得太满，后面我们就没有抓手了。\n\n","简单总结：首通是轻轻搭框架，不是一次性把所有价值全部说完。","来看一道题，首通编程认知铺垫的分寸把握是？"],"durs":[8.088,3.456,2.64,5.688,5.064,5.712,2.664,10.536,2.928,14.4,5.736,7.608,5.064,8.184,4.416,6.6,4.608]},"P22":{"sents":["接下来我们看家长最关心的话题地图，这张图把家长所有关注点分成了三大类：期待类、顾虑类、服务类，同时明确了我们首通里的处理策略。\n\n","第一类，期待类，属于正向诉求。\n","家长的关注点一般是升学、科技特长生、赛事，还有校内成绩、逻辑思维、学习习惯培养。","这一类我们不用强行说服，顺着家长的想法去讲，给到对应的路径和真实案例，并且把这条诉求记在学情表里，后面所有个性化反馈、续报沟通都围绕它展开。\n\n","第二类，顾虑类，是我们需要提前化解的。\n","高频疑问大家看一下：孩子年纪小能不能学会、上网课伤眼睛、课时太长孩子消化不了、是不是直播、上课设备平板能不能用。","这些都是家长很容易冒出来的担心，首通里我们主动覆盖高频顾虑，提前给到解释，避免后面反复纠结。\n\n","第三类，服务类，是必须确认清楚的规则项。\n","包含上课形式、上课时间、谁来提醒上课、请假流程、教具怎么使用。","服务类信息优先在首通一次性讲明白，规则讲清楚，后续回访就不用反复答疑，最省心。\n\n","最后重点看使用方式：\n","首通沟通的标准动作是：主动覆盖【服务类全部内容】+【顾虑类高频问题】；","【期待类】重点记录，不急于一次性讲透，留作后续个性化沟通的抓手。\n\n","简单来说：规则当场说清，高频顾虑提前化解，家长的期待好好记下，作为我们之后服务的主线。"],"durs":[13.704,3.696,9.096,14.88,4.008,12.192,9.84,4.608,7.128,8.64,2.544,7.296,6.864,9.24]},"P23":{"sents":["第四部分，沟通技巧与异议处理。","首通话术是骨架，沟通技巧是血肉。","这一章是新人非常核心的能力板块，包含四个关键词：先跟后带、听懂心声、四步框架、成交三性。\n\n","很多新人遇到家长有顾虑、提异议的时候，第一反应就是着急反驳、急于解释，很容易把天聊僵。","这一章就是给大家一套标准化沟通逻辑，不是硬说服，而是先接住情绪，再解决问题。\n\n","- 先跟后带：是我们处理异议的底层心法。","先认同家长的感受，不抬杠，再慢慢引导，而不是一上来就讲道理。\n","- 听懂心声：区分家长表面说出来的话，和藏在背后真实担心。","比如家长说 “太贵了”，背后不一定是没钱，可能是担心价值不匹配、怕孩子坚持不下来。\n","- 四步框架：一套固定的异议应答流程，遇到任何疑问都可以套用，保证沟通不乱、不跑偏。\n","- 成交三性：我们最终要让家长感知到课程的必要性、适合性、确定性，这也是促成信任、提升续报的关键。"],"durs":[3.576,3.984,9.744,9.096,8.112,4.224,6.528,6.144,8.04,8.712,10.584]},"P24":{"sents":["我们来看这一页，核心就是先跟后带，也是我们和家长沟通、处理异议最基础的心法。\n","什么叫先跟后带？","简单说：先顺着家长，认可他的感受和想法，再带出我们的建议。\n","千万不要一上来直接反驳，一旦反驳，家长马上拉起心理防线，后面我们讲再多内容，他都听不进去，心里只会觉得：你就是想说服我报课。\n\n","左边是反面例子：\n","家长提出担心，我们直接一句 “不是的，您理解错了”。","这句话一出口，家长立刻警觉，沟通就卡住了。\n\n","右边是正确的先跟后带话术：\n","“您这个顾虑特别正常，很多家长一开始都这么想…… 其实咱们课程里……”\n","先共情接住，再慢慢转折，家长感受到被理解，才愿意继续听我们往下讲。\n\n","还有两个配套小动作，大家一定要养成习惯：\n","第一，打电话的时候带着微笑。","微笑会改变你的语气，隔着电话，家长是能感受到声音里的感染力的；\n","第二，不管家长说什么，先接一句：“对”、“是的，我理解”，再接我们后面的内容。\n","先接住情绪，再沟通内容，家长才愿意跟着我们的思路聊下去。"],"durs":[7.8,2.016,6.288,12.528,2.16,4.776,4.656,3.36,6.456,7.368,4.224,3.408,6.6,7.512,5.952]},"P25":{"sents":["这一页讲怎么听懂家长话里的心声。","很多新人沟通，只会盯着家长字面的问题去回答，答完之后发现家长还是不放心。","核心原因就是：没有读懂这句话背后藏着的真实想法。\n","这里有一个核心原则：先回应他藏在里面的担心，再回答表面的问题。\n\n","我们一条一条来看：\n","第一句，家长问：孩子上一次课学多久啊？\n","字面是问时长，真正担心的是：上课时间太长，伤眼睛、孩子坐不住、专注力跟不上。\n","那我们回应的时候，就不能只说 “一次课 XX 分钟”，要讲清楚：课程时长是专门适配孩子专注力设计的，还有护眼安排、中途休息，打消他视力和坐不住的顾虑。\n\n","第二句，家长问：你们老师带班带多久了？\n","表面是问教龄，真实顾虑是：害怕老师是新手、不专业，怕没人跟进孩子学习。\n","我们的回应方向，重点给到确定性：讲老师带班经验，同时把整套服务机制说出来 —— 每周反馈、课上答疑、全程跟班，让家长放心，不是只靠老师个人。\n\n","第三句，家长说：我们家孩子平时表现可棒了。\n","这句话不是单纯闲聊，家长的内心期待是：希望老师能看见孩子、多肯定、多鼓励孩子。\n","我们就要顺着夸奖孩子的具体行为，并且给到承诺：课堂上会多给孩子展示、表达的机会。\n\n","最后记住要点：\n","家长随口的一句话，背后都带着一个具体的担心或者期待。","沟通顺序一定是：先接住内心的担心，再回答字面问题。","只答字面，家长的顾虑还在，沟通就很难推进。","来看一道题，家长问「孩子上一次课学多久啊」，真正担心的是？"],"durs":[3.528,7.704,5.28,6.432,2.016,4.2,8.544,14.856,4.272,8.088,14.4,4.944,8.664,8.28,1.92,5.52,5.616,4.92,5.616]},"P26":{"sents":["接下来我们学习标准化异议处理四步框架，不管家长抛出什么样的顾虑，我们都可以按这个顺序走，不会乱、不会慌。\n\n","第一步，共情。\n","对应咱们前面学的先跟后带，先接住家长的情绪，话术模板就是：您的担心特别正常，我特别理解。","先不着急解释，让家长感受到我们站在他这边，放下防备。\n\n","第二步，聚焦问题。\n","很多家长的顾虑是笼统模糊的，比如 “我怕孩子学不会”“我担心没效果”。","这时候我们不要猜，主动提问把问题具体化：您最担心的是哪一点？\n","分清到底是怕跟不上、怕伤眼睛，还是怕没时间坚持，找准核心矛盾，才不会答非所问。\n\n","第三步，解决问题。\n","针对刚刚锁定的这一个顾虑，给出完整方案，方案要包含三块：课程本身的设计、老师会做的动作、需要家长配合的地方。","三点讲清楚，方案才扎实，不是空口承诺。\n\n","第四步，赋能。\n","打消顾虑之后，最后一步要给家长和孩子信心，把家长拉到 “我们一边”，比如：孩子之前的努力您也看到了，咱们一起盯好。\n","把这件事变成家校协同，而不是我们单方面推销课程。\n\n","给大家串一遍完整示范，比如家长说：我担心孩子太小学不会。\n\n","1. 共情：您这个担心特别正常，我特别理解。\n","2. 聚焦：您最担心的是孩子跟不上，坐不住吗？\n","3. 解决：咱们课程是低龄孩子专属的实操设计，课堂上老师会一步步引导，课导课后跟进反馈，平时您只需要提醒孩子按时上课就可以。\n","4. 赋能：孩子本身好奇心很强，咱们一起陪着他慢慢入门。\n\n","记住顺序：先共情稳情绪，再聚焦抓重点，再给方案解顾虑，最后赋能树信心。\n","跳过前两步，上来直接讲方案，家长听不进去。"],"durs":[10.632,2.112,9.192,5.952,2.4,6.312,6.048,8.496,2.496,11.064,4.512,2.112,11.064,5.496,6.24,4.56,5.16,13.176,6,8.016,4.608]},"P27":{"sents":["这部分给三个最高频的异议，按四步框架给出参考应对。","第一个，老师，孩子有事上不了课，能请假吗。","共情：计划赶不上变化很正常。","聚焦：问清楚是一次性的冲突，还是经常性的时间问题。","解决：能调课的提前报备调课，同时讲清楚缺课对学习连续性的影响。","赋能：咱们尽量保证出勤，孩子跟得上，效果才看得到。","第二个，我担心孩子坚持不下去，做事三分钟热度。","共情：很多孩子一开始都这样，不用焦虑。","聚焦：问一下之前放弃是因为没兴趣，还是没成就感。","解决：直播实操加教具作品，让学习成果看得见，老师每周反馈、及时鼓励。","赋能：前三周咱们一起帮他闯过新鲜期，表现好还能选上好苗子重点培养。","第三个，课程时间太长，怕孩子消化不了。","共情：怕孩子累着，这个想法特别贴心。","聚焦：是担心单次课太长，还是整期的强度。","解决：单次课时长是按孩子专注力设计的，中间有节奏安排，作业量也可控。","赋能：先按课表上两周，我盯着反馈，有问题咱们随时调。","最后强调一句，以上是参考思路，实际话术要按孩子的情况灵活调整，框架不变，内容随机应变。"],"durs":[5.592,4.68,3.528,5.688,7.32,5.664,5.184,4.272,5.52,7.92,7.752,4.44,4.296,4.776,7.776,6.024,9.336]},"P28":{"sents":["接下来我们进入第五章，红线与质检。","前面我们学了沟通方法、异议处理、成交逻辑，这些是帮我们把沟通做好；","而这一章，是告诉大家什么绝对不能做、通话怎么考核，守住底线，避免违规扣分。\n\n","这一章我们会围绕四块内容展开：通话四不、质检扣分点、注意事项、考核标准。\n","很多新人前期沟通话术练得很好，但踩了红线，一通电话直接作废，甚至影响考核成绩，非常可惜。","所以这一块大家一定要记牢，它是我们所有通话的安全底线。\n\n","“通话四不” 是我们的基础行为准则，是绝对不能触碰的；\n","质检扣分点，会告诉大家日常通话里哪些小问题会丢分，比如夸大承诺、回答不规范、态度生硬；\n","还有日常沟通里的各类注意事项，比如信息怎么说、赛事政策怎么表述，不能随意承诺；\n","最后是整套考核标准，大家清楚自己的通话会按照什么维度打分，知道怎么做才能拿到合格、优质的通话"],"durs":[3.912,7.176,7.992,8.064,9.672,5.52,4.992,9.744,8.04,10.104]},"P29":{"sents":["接下来我们看成交三性，这是咱们所有家长沟通、异议处理最后的落脚点。","不管家长提什么问题，像担心孩子坚持不下来、上课时间不合适、想再等等、或者纠结要不要报，我们先用前面的四步框架把顾虑化解完，最后一定要收回到这三个核心点上。\n\n","首先是重要性，也就是为什么要学编程。\n","很多家长心里最根本的疑问就是：学这个到底有啥用，是不是单纯玩？","咱们要讲清楚，编程不是兴趣消遣，它贴合新课标方向，看重的是逻辑、拆解、推理这些底层思维。","这种思维能力，不是只用来写代码，它能帮孩子理清思路，对数学、理科的审题、解题都有正向帮助，是可以迁移到其他学科、长期受益的能力，让家长明白这件事是有价值、值得投入的。\n\n","然后是紧迫性，为什么一定要现在这个年龄段学。\n","不是催家长报名，而是客观讲孩子的成长特点。","咱们这个阶段，正好是逻辑思维塑造的黄金窗口期，孩子好奇心强、愿意动手尝试，入门接受度高，更容易建立自信和兴趣。","如果往后拖，等到年级升高，校内作业变多，文化课压力上来，各类补习班、兴趣班排得满满当当，孩子的空余时间会越来越碎片化，到那时候再想新开一门编程，时间挤不出来，孩子也很难沉下心去学。","早启蒙，早积累，越往后越被动。\n\n","最后是唯一性，为什么选核桃，而不是别的地方。\n","市面上能学编程的机构不少，但完整配套的体系很少。","咱们是直播实操课，不是单纯看录播；","专门设计了护眼模式，照顾长时间线上学习的孩子；","同时打通了完整的赛考通道，从日常学习到赛事、等级测评，一条路能走通；","再加上稳定的师资团队、标准化的课后跟进服务。","直播实操 + 护眼设计 + 赛考通路 + 配套服务，这一整套组合优势，不是随便一家机构都能配齐的，这就是我们独有的优势。\n\n","给大家一个简单好记的口诀：重要性讲值不值，紧迫性讲能不能等，唯一性讲在哪学最合适。","来看一道题，「唯一性」要讲清的内容是？"],"durs":[7.056,15.504,4.248,6.84,9.696,17.496,4.608,4.8,11.832,19.104,3.768,4.68,5.4,3.84,5.136,7.344,4.848,11.496,8.712,3.72]},"P30":{"sents":["这一页是通话的四不红线，每一条都直接挂钩质检。","第一，不聊敏感话题。","和家长沟通要有边界感，可能引起争议和误会的话题一律不碰，比如家庭私事、对其他机构的评价、内部薪酬这些。","第二，不夺命连环问。","不要连续问一大串问题，每问一个，先等家长的回应和反馈，再问下一个。","记住，首通不是审讯。","第三，不垄断话语权。","沟通是双向互动，如果你发现自己有大段的输出，立刻停下来，互动一句，您对课程还有什么想了解的呀。","第四，不过度承诺。","对方提的要求你做不到，就不要硬说我可以，答应了又做不到，只会更伤感情。","所有的承诺都要留有余地，比如用我尽量、我争取、我帮您协调，这样的说法。"],"durs":[5.064,2.616,11.016,2.544,6.816,2.616,2.64,9.672,2.376,7.008,7.584]},"P31":{"sents":["接下来我们看质检扣分清单，这是大家通话之后打分的直接依据，每一条都和我们的通话成绩挂钩，我们一条一条拆开讲清楚。\n\n","第一点，漏必做动作。\n","首通电话有几个硬性动作：加微信、核对快递地址、确认首次上课时间、约小灶课。","这几项是规定动作，缺一项就扣一项分，不是说聊得好就可以跳过。","很多新人光顾着和家长沟通、讲课程，最后忘了约小灶或者没核对地址，话术再好，照样扣分。\n\n","第二点，信息未落表。\n","通话里问到的孩子年级、基础情况、家长诉求这些信息，聊完一定要及时录入学生信息表、学期表。","记住规则：不落表，视同没有采集。","哪怕你电话里问得很全，但是后台没有记录，质检的时候直接判定这项没完成。\n\n","第三点，触犯四不红线，这个是从重扣分的，一定要重点警惕。\n","包含四类情况：聊敏感话题、连环发问一直逼家长、自顾自大段输出不给家长说话机会、承诺自己做不到的事情。","红线问题和普通扣分不一样，一旦踩中，扣分力度会大很多，大家一定要管住自己的表达节奏，不随意许诺。\n\n","第四点，顺序错乱。\n","流程顺序属于质检硬指标。","比如刚接通，还没自我介绍、建立信任，上来就索要信息；","或者还没给家长讲清楚配套服务，一上来就催促家长配合上课。","流程颠倒，家长体验差，同时直接判定扣分。\n\n","最后底部给大家一个非常实用的自检方法：\n","每次挂断电话之后，对照六步流程 + 课后动作，自己回放核对一遍：每一步有没有做完、信息有没有及时落表、刚刚有没有许下无法兑现的承诺。","养成挂机自查的习惯，能帮我们避开绝大多数扣分。\n\n","简单总结：必做动作不能少、采集信息要落表、红线内容绝不碰、沟通流程不乱序，打完电话主动自检，稳定拿到合格通话。"],"durs":[11.328,2.616,8.664,6.264,9.312,2.64,9.768,3.888,7.368,6.12,10.968,9.912,2.544,3.192,5.736,6.384,4.944,4.032,13.248,5.04,11.976]},"P32":{"sents":["最后一部分，看一下我们的考核标准。","接下来我们看整张通话的打分表，总分 100 分，分成四大板块，每一块各 25 分：流程、规划、表达、答疑，总分低于 60 分就是不合格通话。","咱们先把四个维度分别讲清楚，再看不同分数段的要求。\n\n","第一个板块：流程，25 分。\n","重点考察通话的完整性、信息准确性。","我们开场介绍、信息确认、用户挖掘、学习规划、总结强调这一套流程要走全；","开课时间、上课周期、设备、赛考这些关键信息，绝对不能说错。\n\n","- 0–14 分：流程缺步骤，或者用词、信息出错，内容啰嗦反复；\n","- 15–20 分：流程完整，没有知识点错误；\n","- 21–25 分：流程完整干净，语言简洁，还能根据情况做合适的补充。\n\n","第二个板块：规划，25 分。\n","考察大家能不能讲明白核桃的课程体系，课程之间的衔接、学习周期、赛事规划，并且结合孩子的情况、家长期待，给出适配的学习路线，这也是高分的分水岭。\n\n","- 0–14 分：能提到体系，但讲得卡顿、不顺畅；\n","- 15–20 分：可以顺畅讲清课程和赛事规则；\n","- 21–25 分：自然过渡到体系和赛考，自信流畅，还能根据孩子的情况，定制专属的学习、赛事路径，吸引家长。\n\n","第三个板块：表达，25 分。\n","电话沟通看不到表情，语气、节奏就是我们的门面。","核心要求：信息准确传递、和家长建立连接，拉近距离。\n\n","- 0–14 分：语气冷淡，有盘问感、敏感话题、磕绊严重、语速混乱；\n","- 15–20 分：表达清晰通顺，有少量口误，但不影响理解，语气有起伏；\n","- 21–25 分：语气热情，应答流畅，表达利落舒服。\n\n","第四个板块：答疑，25 分。\n","考验我们的异议处理能力，不是生硬背话术，是听懂诉求、妥善回应。","来看一道题，「表达」板块 0–14 分的表现是？"],"durs":[3.552,13.92,5.352,3.288,4.128,8.04,6.792,6.888,4.536,7.44,3.312,15.072,5.28,4.92,11.304,3.36,5.232,5.976,7.296,7.536,5.952,3.384,6.648,4.56]},"P33":{"sents":["最后把通话注意事项汇总成七条，也是首通的完整行为规范。","第一，笑着打电话，声音是有感染力的，家长隔着电话能听出来你的状态。","第二，先跟后带，先顺着家长说，再带出自己的建议，不反驳，不争论。","第三，一次只问一个问题，问完等回答，家长答完了可以简单回应一下，再问下一个。","第四，重要信息即时记录，学期表和信息表随打随填，不要考验自己的脑子。","第五，家长时间不合适就约，开车、做饭、带娃的时候主动约一个二次拨打的明确时间。","第六，承诺留余地，做不到的不硬答，用我帮您协调、我确认之后回复您这样的话替代。","第七，也是最容易忘的一条：首通的目标不是卖课，是建立信任、采齐信息、铺垫课程，后面的事情后面做，不要在首通里着急推任何东西。"],"durs":[5.952,7.128,7.128,7.896,7.608,8.544,7.824,13.008]},"P34":{"sents":["到这里，我们整套首通电话的培训内容就全部讲完了，最后这一页，是给大家落地执行的行动清单，分四块，清晰好记。\n\n","第一，现在立刻要做的任务：\n","把六步流程默写一遍：开场→课程确认→信息确认→学情摸底→人设要求→收尾，同时把挂机之后的记录动作一并写上去。","默写不是走形式，目的是让大家把流程刻进脑子里，打电话的时候不用翻笔记，顺序不乱、动作不漏。\n\n","第二，本周落地要求：\n","大家第一批首通电话，严格对照今天这套课件标准去执行。","每一通打完，马上自检：六步流程是不是全部走完了、采集到的信息有没有及时落表。","自检就是帮大家规避质检扣分，养成习惯。\n\n","第三，求助规则，这条大家一定要记住：\n","通话当中如果话术卡住、遇到陌生异议接不住，不要自己硬扛、不要随口乱承诺，随时飞书找师父或者主管求助。","我们是团队带教，允许请教，不允许硬撑着说错话、踩红线。\n\n","最后是核心总结，也是我们首通电话的底层定位：\n","首通是服务电话，不是通知电话。\n","我们打电话的目标，不是简单通知上课，核心是三件事：和家长建立信任、完整采集孩子学情信息、给家长铺垫课程价值。","沟通的时候保持轻松的状态，笑着打，用好我们前面学的先跟后带，通话结束逐项把信息落表。\n\n","今天所有的流程、异议处理、成交逻辑、红线质检，最终都落到这几句话、这几个行动上。","接下来大家就按这个标准去练习。"],"durs":[11.304,3.024,11.784,9.648,2.592,5.904,8.208,4.656,4.488,10.8,6.192,4.752,3.432,11.616,9,8.448,3.504]}},"v":{"slides/P01.jpg":"cfe3ceca","slides/P01.png":"0c75e17d","slides/P02.jpg":"b4711ca8","slides/P02.png":"b2809fcc","slides/P03.jpg":"745aeb15","slides/P03.png":"25e44347","slides/P04.jpg":"840c452f","slides/P04.png":"74043673","slides/P05.jpg":"37133054","slides/P05.png":"a7836f5a","slides/P06.jpg":"3a196706","slides/P06.png":"72553d31","slides/P07.jpg":"b0711085","slides/P07.png":"cb80fa72","slides/P08.jpg":"9d625644","slides/P08.png":"70870ed7","slides/P09.jpg":"89bda559","slides/P09.png":"39b43e69","slides/P10.jpg":"15824468","slides/P10.png":"36fb7525","slides/P11.jpg":"163213ef","slides/P11.png":"49125a8e","slides/P12.jpg":"7cad04fa","slides/P12.png":"2dbf813f","slides/P13.jpg":"e2c52fd8","slides/P13.png":"667cef06","slides/P14.jpg":"d7a129c9","slides/P14.png":"2f24babb","slides/P15.jpg":"6b7299a2","slides/P15.png":"483bddf0","slides/P16.jpg":"10c55bda","slides/P16.png":"327c1f2c","slides/P17.jpg":"48ea7ff9","slides/P17.png":"5c1f6b93","slides/P18.jpg":"b6 /* ---------- 课程结构 ---------- */
/* 部门 / SKU 可见性：标「通用」或未标的页所有人可见；带标签的页只有选中的部门/SKU 命中才显示（多选任一命中即可） */
const normTag = t => String(t||'').replace(/1部/g,'一部').replace(/2部/g,'二部').replace(/苍穹鼎/g,'苍穹顶').replace(/\s/g,'');
const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return (!CFG.depts || tagOk(p.dept, st && st.depts)) && (!CFG.skus || tagOk(p.sku, st && st.skus)); }
let STAGES = [];
function buildStages(){
  STAGES = [];
  for (const p of DATA.pages) {
    if (!pageVisible(p)) continue;
    let s = STAGES.find(x => x.name === p.stage);
    if (!s) { s = {name:p.stage, num:+(/阶段\s*(\d+)/.exec(p.stage)||[0,STAGES.length+1])[1], pages:[]}; STAGES.push(s); }
    s.pages.push(p);
  }
  for (const s of STAGES) s.quiz = DATA.qs.filter(q => /阶段练习/.test(q.type) && +(/阶段\s*(\d+)/.exec(q.chapter)||[])[1] === s.num);
}
let st = null; buildStages();

/* 每个关卡的过程数据：play=实际播放秒数 occ=占用秒数 pn/ps=暂停次数/秒 kn/ks=卡顿次数/秒 */
function stat(k){ st.stat = st.stat || {}; return st.stat[k] = st.stat[k] || {play:0, occ:0, pn:0, ps:0, kn:0, ks:0}; }
function curKey(){ return st.view === 'quiz' ? (st.quiz === 'final' ? 'f' : st.quiz) : st.cur.s; }
function stageStatusText(k){
  if (k !== 'f' && !STAGES[k]) return '';

  if (done) return '已完成';
  if ((st.view === 'learn' || st.view === 'quiz') && String(curKey()) === String(k)) return '进行中';
  const s = st.stat && st.stat[k];
  return s && s.occ > 0 ? '进行中' : '未开始';
}
function snapshot(online){
  const keys = Object.keys(st.stat||{}), sum = f => keys.reduce((a,k) => a + ((st.stat&&st.stat[k]&&st.stat[k][f])||0), 0);
  const play = sum('play'), occ = sum('occ');

  const cur = st.view === 'quiz' ? (st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz) + '·小测') : (st.view === 'learn' ? stageLabel(st.cur.s) : '课程首页');
  const cp = st.view === 'learn' ? (curPageSafe()||{}).p || '' : '';

    relearn_n:Object.values(st.relearnCnt||{}).reduce((a,b)=>a+b,0),

/* 第二个 Webhook：学员第一次出现时，在「学员实时状态」表新建他的那一行 */
const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
// 明细表有 5 万行上限：这些动作量大、分析用不到（暂停时长等已汇总在状态快照里），不再单独记一行
const NO_LOG = new Set(['听完页面','暂停','继续播放','回到测试','学习页面(未听完)']);
function report(ev, online){
  if (!st.name) return;
  if (NO_LOG.has(ev.event) && online !== '已离开') return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid, course:CFG.short||CFG.title, date:nowStr().slice(0,10)}, ev, snapshot(online));
  { const CNm = CFG.short || CFG.title; if (!String(rec.stage||'').startsWith(CNm + '｜')) rec.stage = CNm + (rec.stage ? '｜' + rec.stage : ''); }
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

/* 占用时长：停留在某关卡（听课或做小测）的全部时间，含暂停、切走 */

/* ---------- 审核模式：姓名填「审核」进入，不上报、不计进度 ---------- */
function renderReview(){ window.REVIEW = 1;
  const L='ABCDEF', nz=x=>(x||'').replace(/\s/g,''), stem=q=>(q||'').replace(/^【[^】]*】/,'').replace(/【[^】]*】$/,'').replace(/[（(]\s*(多选|单选|判断)[^）)]*[）)]\s*$/,'').replace(/[?？]$/,'');
  let bad=0;
  const pages=DATA.pages.map(p=>{const t=DATA.timing[p.p]||{sents:[p.script],durs:[0]};let a=0;
    const ss=t.sents.map((x,i)=>{const b=a+(t.durs[i]||0);const h='<span class="rs" data-p="'+p.p+'" data-a="'+a+'" data-b="'+b+'">'+esc(x.trim())+' <b>▶</b></span>';a=b;return h;}).join('');
    const it=p.interact;let ih='';if(it){const ok=it.vote||nz(p.script).includes(nz(stem(it.q)));if(!ok)bad++;
      ih='<div class="rq"><div class="rh">互动题'+(it.vote?'（调查）':'')+(ok?'':' <b style="color:#dc2626">⚠ 讲稿没念到这道题</b>')+'</div><b>'+esc(it.q)+'</b>'+it.options.map((o,i)=>'<div class="'+((it.answers||[]).includes(i)?'ra':'')+'">'+L[i]+'. '+esc(o)+'</div>').join('')+'</div>';}
    const tags=[p.sku&&p.sku.trim()?'SKU：'+p.sku.replace(/\n/g,' / '):'',p.dept&&!/^通用$/.test(p.dept.trim())?'部门：'+p.dept.replace(/\n/g,' / '):''].filter(Boolean).join(' · ');
    return '<section class="rp" id="r'+p.p+'"><div>'+(p.video?'<video src="'+VU(p.video)+'" controls preload="none" style="width:100%"></video>':'<img loading="lazy" src="'+SL(p.p)+'" style="width:100%;border-radius:8px;border:1px solid #eee">')+'</div><div><div class="rh"><b style="color:#c2410c">'+p.p+'</b> · '+esc(p.stage)+(tags?' · '+esc(tags):'')+' · '+Math.round(a)+' 秒</div><div>'+ss+'</div>'+ih+'</div></section>';}).join('');
  const qs=DATA.qs.map(q=>'<div class="rq"><div class="rh">'+esc(q.id)+' · '+esc(q.type)+' · '+esc(q.chapter)+' · 答案 <b>'+esc(q.answer)+'</b></div><b>'+esc(q.q)+'</b>'+q.options.map(o=>'<div class="'+(q.answer.includes(o.k)?'ra':'')+'">'+o.k+'. '+esc(o.t)+'</div>').join('')+'</div>').join('');
  document.title='审核 · '+CFG.title;
  $('#app').innerHTML='<style>.rp{display:grid;grid-template-columns:minmax(0,46%) 1fr;gap:14px;background:#fff;border-radius:12px;padding:12px;margin:10px 0}@media(max-width:800px){.rp{grid-template-columns:1fr}}.rs{cursor:pointer;border-radius:4px}.rs b{color:#c2410c;font-size:11px}.rs:hover,.rs.on{background:#ffe0b2}.rq{border:1px solid #eee;border-radius:8px;padding:8px;margin-top:8px;background:#fff}.rh{font-size:13px;color:#777}.ra{color:#15803d;font-weight:700}.ra::after{content:"  ✓ 正确"}</style>'+
    '<h2 style="margin:8px 0">审核 · '+esc(CFG.title)+'</h2><p class="rule">'+DATA.pages.length+' 页 · '+DATA.qs.length+' 题 · '+(bad?'<b style="color:#dc2626">'+bad+' 处念题不一致</b>':'念题全部一致')+' · 点任意一句讲稿可单独播放（1.5 倍速）</p>'+pages+'<h2>题库（阶段小测 + 综合测试）</h2>'+qs;
  let stop=null,cur=null;au.ontimeupdate=()=>{if(stop!=null&&au.currentTime>=stop){au.pause();stop=null;if(cur)cur.classList.remove('on');}};
  document.querySelectorAll('.rs').forEach(el=>el.onclick=()=>{if(cur)cur.classList.remove('on');cur=el;el.classList.add('on');const p=el.dataset.p;const go=()=>{au.currentTime=+el.dataset.a;au.playbackRate=1.5;au.play();stop=+el.dataset.b;};if(au.dataset.rp!==p){au.dataset.rp=p;au.src=VU('audio/'+p+'.mp3');au.onloadedmetadata=()=>{au.onloadedmetadata=null;go();};}else go();});
  window.scrollTo(0,0);
}
// 课程锁：cfg.lock = 口令的哈希。未开放期间只有输入口令的人能进（口令存在本机，输一次即可）
const lockH = s => { let h = 2166136261; for (const c of s + '|' + CFG.key) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); };
let UNL = ''; function locked(){ if (!CFG.lock) return false; let ok = UNL; try { ok = localStorage.getItem('unlock_' + CFG.key) || UNL; } catch(e) {} return ok !== CFG.lock; }
function renderLock(){
  $('#app').innerHTML = `<section style="max-width:420px;margin:12vh auto;background:#fff;border-radius:16px;padding:28px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06)">
    <div style="font-size:40px">🔒</div><h2 style="margin:8px 0">${esc(CFG.title)}</h2>
    <p class="muted">课程暂未开放，开培时由培训老师统一开放。</p>
    <input id="lk" type="password" placeholder="管理员口令" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:12px;font-size:15px">
    <button id="lkb" class="btn" style="margin-top:10px;width:100%">进入</button><p id="lkm" class="muted" style="color:#dc2626" hidden>口令不对</p></section>`;
  const go = () => { const v = $('#lk').value.trim(); if (lockH(v) === CFG.lock) { UNL = CFG.lock; try { localStorage.setItem('unlock_' + CFG.key, CFG.lock); } catch(e) {} render(); } else $('#lkm').hidden = false; };
  $('#lkb').onclick = go; $('#lk').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function render(){
  if (locked()) return renderLock();
  if (st.view === 'learn') return renderLearn();
  if (st.view === 'quiz') return renderQuiz();
  renderHome();
}

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}
