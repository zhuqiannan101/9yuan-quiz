<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>少儿编程教育理念</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%2740%27%3E%3Ctext x=%27100%27 y=%2725%27 fill=%27%23bbb%27 font-size=%2716%27 text-anchor=%27middle%27 font-family=%27sans-serif%27%3EPPT 加载中…%3C/text%3E%3C/svg%3E") center/200px 40px no-repeat;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}
</style>

<script>
const DATA = {"pages":[{"row":2,"stage":"阶段1·编程基础认知","p":"P01","topic":"封面：少儿编程理念（编程基础认知 + 语言类别）","script":"今天我们的主题是：少儿编程理念。\n\n和家长沟通，很容易心里没底，不知道我们讲的内容底层逻辑是什么。所以这节课，我们先打好认知基础。\n\n本节课一共分为两大板块：\n第一板块，编程的基础认知，我们会分清：少儿编程和成人编程到底有什么不一样，纠正认知误区；\n第二板块，少儿编程的语言类别，带大家看懂 Scratch、Python、C++ 分别适合什么样的孩子、对应的学习方向。\n\n把这两块吃透，我们才能理解课程设计、看懂孩子的学习路径，之后和家长沟通的时候，每一句话都有理有据，而不是生硬背诵脚本。\n接下来我们正式开始今天的学习。","interact":null,"sku":"","dept":""},{"row":3,"stage":"阶段1·编程基础认知","p":"P02","topic":"目录：01 编程基础认知 / 02 少儿编程语言类别","script":"今天内容分成两大板块。\n第一部分，编程基础认知。在这里，我们会把少儿编程和成人编程做区分，搞懂两者核心差别，破除大家最容易有的误区。\n第二部分，少儿编程语言类别。我们会分别学习 Scratch、Python、C++ 这三类主流语言，清楚每一种语言适合什么样的孩子、对应什么学习方向。\n大家记住，先分清概念，再看懂语言赛道。理解完这两块，后面和家长沟通，我们才能讲得专业、不跑偏。\n那我们现在进入第一部分，编程基础认知。","interact":null,"sku":"","dept":""},{"row":4,"stage":"阶段1·编程基础认知","p":"P03","topic":"第一章：编程基础认知（章节页）","script":"首先我们进入第一个板块，编程基础认知，也就是什么是编程？","interact":null,"sku":"","dept":""},{"row":5,"stage":"阶段1·编程基础认知","p":"P04","topic":"说到编程你会想到什么？（程序员/高薪——沟通时别把价值落在当程序员）","script":"说到编程，大家脑子里会冒出什么画面？是穿格子衬衫、在格子间里埋头敲代码的程序员？是屏幕上密密麻麻的代码，还是右边这一大堆编程语言的名字？再看下面这张图，不同工作年限、不同学历的程序员，跳槽前的平均年薪都不低，工作六到十年的硕士，平均能到四十四点九万。所以很多人对编程的第一印象就是技术宅、高收入。这些印象没有错，但大家要注意，跟家长沟通的时候，千万别把学编程的价值落在将来当程序员、赚高薪上。家长最常见的反应就是：我家孩子又不当程序员。那编程和孩子到底有什么关系？我们接着往下看。来看一道题，跟家长沟通学编程的价值时，应该避免落在哪里？","interact":{"q":"跟家长沟通学编程的价值时，应该避免落在哪里？","at":"P04","options":["理解数字化世界","锻炼逻辑思维","培养良好学习习惯","将来当程序员、赚高薪"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":6,"stage":"阶段1·编程基础认知","p":"P05","topic":"程序无处不在（抖音/微信/淘宝/美团/支付宝/滴滴/12306 都是编程做出来的）","script":"我们的生活，程序目前是无处不在的 图上这些图标大家都见过吧，抖音、微信、淘宝、美团、支付宝、滴滴出行、铁路12306，都是我们每天在用的应用，它们全都是用编程做出来的。再比如咱们上班门口的打卡系统，背后也是一段程序。所以说，程序在我们的生活里无处不在。这一点在沟通里很好用：家长说孩子又不当程序员，学编程离我们太远，你就可以拿支付宝、滴滴打车、公司打卡这些例子告诉家长，程序就在生活里，孩子学编程，是在理解身边这个越来越数字化的世界。","interact":null,"sku":"","dept":""},{"row":7,"stage":"阶段1·编程基础认知","p":"P06","topic":"什么是编程？——人与计算机沟通的方式，让计算机帮人解决问题","script":"那到底什么是编程？大家看屏幕上这句定义：编程，就是我们为了完成某项任务，把解决问题的步骤，用计算机能够理解的语言写成指令。计算机会按照这些指令一步一步执行，最后完成任务。简单来说就是人和计算机沟通和对话，换句话说，让电脑、计算机能听懂我们在说什么，并按照我们的指令进行运行，帮人们解决某个问题。\n所以编程语言和我们平时说的中文、英语一样，都是用来沟通的语言，只不过沟通的对象换成了计算机。而程序，就是用计算机能理解的语言写下的一连串命令。来看一道题，编程的本质是什么？其实编写程序简称编程，","interact":null,"sku":"","dept":""},{"row":8,"stage":"阶段1·编程基础认知","p":"P07","topic":"主流编程语言区别：C（底层）C++（网游/操作系统）Java（安卓）Python（AI/大数据）","script":"现在我们进入编程基础认知板块，先来看这张表，了解几种主流编程语言的区别。\n\n首先是 C 语言，它多用于底层系统、驱动程序开发。特点是贴近计算机底层，执行效率很高，在很多底层设备里应用非常广泛。\n\n第二个是 C++，它可以用来开发网游、客户端应用还有操作系统。它是 C 语言的升级版，兼顾运行效率和拓展性，也是现在使用范围很广的一门语言。\n\n接下来是 Java，主要做网站开发、安卓手机程序开发。安卓开发基本都会用到它，跨平台的能力很强。\n\n最后是 Python，常用来做爬虫、人工智能、大数据分析。它语法简洁，配套的工具库非常丰富。\n\n大家可以发现，每一种编程语言，都有自己专属的应用场景。本质上，编程语言就是人和电脑沟通的工具，帮助我们高效完成不同类型的工作。表格右侧，就是市面上更多常见编程语言的图标，大家了解一下。来看一道题，主要用于安卓手机程序开发的编程语言是？","interact":{"q":"主要用于安卓手机程序开发的编程语言是？","at":"P07","options":["Java——网站开发、安卓程序，跨平台强","C 语言——网站开发、安卓程序，跨平台强","C++——网站开发、安卓程序，跨平台强","Scratch——网站开发、安卓程序，跨平台强"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":9,"stage":"阶段1·编程基础认知","p":"P08","topic":"编程未来的发展：大数据、人工智能两大核心板块（云计算/VR/AR/区块链）","script":"了解完主流编程语言之后，我们再来看看编程未来的发展方向。\n大家在图上能看到，大数据、人工智能是两大核心板块，还延伸出云计算、自动化、VR、AR、区块链、机器人、机器学习这些领域。\n\n这些新兴方向，底层都离不开编程。\n很多家长就是看到了这个趋势，才愿意让孩子提前接触编程。但这里我们要分清重点：\n不是说孩子学编程，以后一定要去做程序员。而是在数字化时代，编程思维会变成一项很重要的基础能力。\n\n我们理解这个大背景，之后和家长沟通的时候，才能讲清楚为什么现在适合让孩子学习编程，而不是单纯给家长灌输 “写代码” 的概念。","interact":null,"sku":"","dept":""},{"row":10,"stage":"阶段1·编程基础认知","p":"P09","topic":"编程是打开科技大门的一把钥匙","script":"对现阶段的小朋友来说，编程就像一把神奇的钥匙，能打开科技大门，带我们走进一个充满无限可能的世界。从日常使用的手机软件，到复杂的工厂机械，背后都离不开编程的支撑。\n孩子们现在慢慢开始掌握编程，也意味着掌握开启未来科技的密码。","interact":null,"sku":"","dept":""},{"row":11,"stage":"阶段1·编程基础认知","p":"P10","topic":"让孩子学编程有哪些难点？（枯燥/逻辑受挫/家长怕难）","script":"刚刚我们了解了编程广阔的发展前景，很多家长听到这里，会心动，但是也会有顾虑。\n那我们一起来思考一个问题：让孩子学习编程，会遇到哪些难点？\n\n大家可以先想一想，站在孩子的角度，还有家长的角度，都有哪些阻碍。\n比如孩子容易觉得代码枯燥、看不懂；或者逻辑跟不上，很容易受挫；也有家长担心太难，孩子学不会、坚持不下去。\n\n正是因为这些难点存在，我们少儿编程，才不能照搬成人编程的学习方式。","interact":null,"sku":"","dept":""},{"row":12,"stage":"阶段1·编程基础认知","p":"P11","topic":"成人编程 vs 少儿编程的误解来源（满屏代码·「头有点冷」梗）","script":"家长可能会问你：老师，孩子学编程，是让我孩子和成年人一样敲代码吗 ？\n很多家长看到密密麻麻的代码，第一反应就是这个疑问：青少年编程会不会很难？难道要让孩子直接敲代码吗？\n大家看左边这张图，满屏文字代码，这就是成人职业编程的样子。如果直接让孩子去学这种，难度非常高，很容易打击孩子的兴趣。\n\n网上也流传着一个梗，就是右边这张图：学编程挺好，就是头有点冷，我秃了，也变强了。\n这个段子，说的就是成人长期做开发的情况。我们要记住，少儿编程，绝对不是照搬成人写代码的模式。\n\n这也是很多新人容易踩的坑：误以为少儿编程，就是让小孩子提前写程序员那种代码。\n接下来我们就正式对比，少儿编程和成人编程，到底有哪些本质区别。来看一道题，关于青少年编程，正确的认知是？","interact":{"q":"关于青少年编程，正确的认知是？","at":"P11","options":["青少年编程≠敲代码、≠培养程序员——培养计算机思维和创新解难能力","青少年编程=敲代码、=培养程序员——提前适应成人编程模式","青少年编程=游戏娱乐——纯玩就行，学不到什么东西","青少年编程=大学专业课提前版——直接按大学大课讲"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":13,"stage":"阶段1·编程基础认知","p":"P12","topic":"青少年编程≠敲代码、≠培养程序员（游戏启蒙+图形化，培养思维与创新解难）","script":"现在我们正式来认识少儿编程。\n青少年编程，并不是像成人编程、大学专业课那样，直接让孩子敲代码写程序。\n我们会先用游戏启蒙、可视化图形编程这类形式上课，重点目标，是培养孩子的计算机思维，还有创新解决问题的能力。\n\n简单来说，少儿编程入门阶段，核心是锻炼孩子的逻辑思维。编程本身，就是一套高效梳理思路、拆解问题的方式。\n\n这里有两句非常关键的结论，大家一定要记牢：\n青少年编程不等于敲代码，青少年编程也不等于培养程序员。\n家长会给孩子报很多的兴趣班，给孩子报名画画是希望他成为梵高一样的艺术家吗？肯定不是，是希望对色彩有感知、对美有感知。学编程也不是让孩子成为程序员，更多是让孩子提升创新解难的能力。\n\n这两个点，是我们后续和家长沟通时，必须传递清楚的。帮家长放下顾虑，消除 “代码很难、孩子要当程序员” 这种误解，家长才更容易接受我们的课程。\n\n理解完少儿编程和成人编程的核心区别，第一板块编程基础认知我们就快要结束了，接下来我们进入第二大板块：少儿编程语言类别。","interact":null,"sku":"","dept":""},{"row":14,"stage":"阶段2·少儿编程语言类别","p":"P13","topic":"第二章：少儿编程语言类别（章节页）","script":"接下来我们一起来看看少儿编程有那些语言可以让孩子们学？","interact":null,"sku":"","dept":""},{"row":15,"stage":"阶段2·少儿编程语言类别","p":"P14","topic":"三大语言类别：Scratch（图形化）· Python（代码入门）· C++（信奥竞赛）","script":"少儿编程语言，主要有三大类。第一类是图形化编程，也就是Scratch，入门简单，重点培养孩子的编程思维。第二类是Python，属于代码入门，需要一定的英语基础，应用范围比较广。第三类是C++，可以用来参加信息学竞赛，难度较高，功能也很强大。来看一道题，少儿编程的三大主流语言类别是？","interact":{"q":"少儿编程的三大主流语言类别是？","at":"P14","options":["Java、C 语言、Go——三大后端主力开发语言","Scratch（图形化）、Python（代码入门）、C++（信息学竞赛）","HTML、CSS、JavaScript——三大前端网页开发语言","Python、Java、C#——三大通用应用开发语言"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":16,"stage":"阶段2·少儿编程语言类别","p":"P15","topic":"Scratch：图形化像搭积木，5 岁-2 年级及以下，不会英文键盘也可学","script":"少儿编程语言类别，一共三大主流类型，我们逐个拆解。\n首先第一个就是 Scratch，也就是图形化编程。\n图形化编程是国际通用的少儿编程入门语言，最大特点就是，孩子像搭积木一样拼接代码块，完成编程指令。\n\n大家可以想象积木块的形式，它对孩子门槛很低：不需要认识大量汉字，就算孩子不会英文、还不熟练用键盘，照样可以上手学。\n它适配的年龄段是 5 岁到二年级及以下，是孩子编程启蒙的第一站，用来先建立逻辑、感受编程思维。","interact":null,"sku":"","dept":""},{"row":17,"stage":"阶段2·少儿编程语言类别","p":"P16","topic":"Python：AI 最常用语言，需数学基础+英语词汇，3-6 年级（先 Scratch 过渡）","script":"图形化 Scratch 之后，我们来看第二类编程语言 ——Python。\nPython 是文本类编程语言，它语法简洁，也是人工智能方向最常用的编程语言，应用范围非常广。现在不少高中，已经把 Python 纳入校本课程了。\n\n它虽然代码好读懂，但还是有门槛，适合有一定数学基础、还有少量英语词汇储备的孩子，我们的适配年龄段是 3 到 6 年级。\n这里我们要跟新人强调：它不是零基础直接上手的，一般是孩子 Scratch 把逻辑思维练扎实之后，再过渡到 Python，平稳从积木编程转到代码编程。\n\n跟家长沟通时，这个点也很关键：Python 是衔接后续信息学赛事、AI 方向的重要过渡语言。","interact":null,"sku":"","dept":""},{"row":18,"stage":"阶段2·少儿编程语言类别","p":"P17","topic":"C++：NOI 系列只支持 C++；3-6 年级趣味 C++ 铺垫，7 年级及以上竞赛向","script":"最后我们来看第三种，C++。\nC++ 是非常经典的编程语言，大学计算机相关专业基本都会必修，功能很强。重点要记住：NOI 全国青少年信息学奥林匹克竞赛系列赛事，只支持 C++。\n\n它也是三类里面难度最高的，适合有编程基础、数理能力比较突出的孩子。\n我们的路线是：3–6 年级先学趣味 C++ 做铺垫，到七年级及以上，再正式学习竞赛向的 C++。\n\n这里划重点：很多家长奔着信息学竞赛、升学优势来咨询，我们就要讲清楚，想要走竞赛路线，最终一定要落到 C++ 上。但它门槛高，不能直接零基础上手，要按 编程学习路径循序渐进。","interact":null,"sku":"","dept":""},{"row":19,"stage":"阶段2·少儿编程语言类别","p":"P18","topic":"语言对比表：基础要求/难度/使用年级/信奥赛（对照年级基础匹配，不凭感觉推荐）","script":"那不同年龄的孩子适合学什么？大家看这张表，我们按难度从低到高过一遍。Scratch不需要编程基础，不用记英文单词，也不需要大量的键盘操作和语句记忆，入门容易，适合五岁到小学二年级及以下的孩子。Python需要一定的英文基础和基本的编程逻辑理解，难度中等，适合小学三到六年级。趣味C++的基础要求和Python一样，难度中上，同样适合小学三到六年级。它用的是和C++相同的标准代码语言，有利于孩子以后参加竞赛。很多家长更认可C++，但低龄孩子直接学C++难度太大，容易产生畏难情绪，趣味C++正好解决了这个问题。最后是C++，要求较高的英文水平和扎实的编程基础，还要学数据结构和算法，难度较高，适合七年级及以上的孩子。续费沟通时，家长偶尔会问后面要不要换一种语言，大家就对照这张表，看孩子的年级和基础来匹配，不要凭感觉推荐。","interact":null,"sku":"","dept":""},{"row":20,"stage":"阶段2·少儿编程语言类别","p":"P19","topic":"小试牛刀：5 位学员的语言规划练习","script":"刚才我们学了到底多大的孩子在核桃学习哪个语言，那现在我们一起来小试牛刀一下，看看大家掌握的怎么样.\n目前这里有五个学员。来看一道题，小试牛刀：学员 1（6 岁、一年级、无基础）应该匹配什么语言？","interact":{"q":"小试牛刀：学员 1（6 岁、一年级、无基础）应该匹配什么语言？","at":"P19","options":["C++","Python","Scratch 图形化","趣味 C++"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":21,"stage":"阶段2·少儿编程语言类别","p":"P20","topic":"结束寄语","script":"到这里，咱们今天编程基础认知、三大编程语言的内容就全部讲完了。\n最后送给大家这几句话：学习不息，成长不止；追求卓越，舍我其谁；培训很苦，坚持很酷。\n\n咱们新人培训要吸收的知识点多、要练的话术也多，过程确实不轻松。但大家要记住，你的付出，直接决定了你后续的成长速度。","interact":null,"sku":"","dept":""},{"row":22,"stage":"阶段2·少儿编程语言类别","p":"P21","topic":"调研问卷","script":"请使用飞书扫描填写真实评价吧~","interact":null,"sku":"","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"少儿编程教育理念·阶段1","q":"「编程」的定义是？","options":[{"k":"A","t":"一种网络游戏——通过充值升级，让孩子获得快乐"},{"k":"B","t":"人与计算机沟通的方式——通过编写程序，让计算机帮人们解决某个问题"},{"k":"C","t":"修理电脑故障的技术——通过更换硬件，让机器恢复正常"},{"k":"D","t":"一款手机软件的名称——通过下载安装，帮人们完成办公"}],"answer":"B","back":"","sku":""},{"id":"T-S02","type":"阶段练习题","chapter":"少儿编程教育理念·阶段1","q":"「程序无处不在」的例子包括？【多选】","options":[{"k":"A","t":"抖音、微信、淘宝、美团"},{"k":"B","t":"支付宝、滴滴出行、铁路 12306"},{"k":"C","t":"公司门口的打卡系统"},{"k":"D","t":"自然界的花草树木"}],"answer":"ABC","back":"","sku":""},{"id":"T-S03","type":"阶段练习题","chapter":"少儿编程教育理念·阶段1","q":"跟家长沟通时，学编程的价值应该避免落在？","options":[{"k":"A","t":"将来当程序员、赚高薪"},{"k":"B","t":"培养良好学习习惯"},{"k":"C","t":"锻炼逻辑思维"},{"k":"D","t":"反向助力校内学科"}],"answer":"A","back":"","sku":""},{"id":"T-S04","type":"阶段练习题","chapter":"少儿编程教育理念·阶段1","q":"C 语言、C++、Java、Python 的应用场景对应正确的是？","options":[{"k":"A","t":"C 语言-网站安卓开发；C++-爬虫人工智能大数据；Java-底层系统驱动；Python-网游客户端操作系统"},{"k":"B","t":"C 语言-底层系统驱动；C++-网游客户端操作系统；Java-网站安卓开发；Python-爬虫人工智能大数据"},{"k":"C","t":"C 语言-爬虫人工智能大数据；C++-网站安卓开发；Java-网游客户端操作系统；Python-底层系统驱动"},{"k":"D","t":"C 语言-网游客户端操作系统；C++-底层系统驱动；Java-爬虫人工智能大数据；Python-网站安卓开发"}],"answer":"B","back":"","sku":""},{"id":"T-S05","type":"阶段练习题","chapter":"少儿编程教育理念·阶段1","q":"青少年编程的两句关键结论是？","options":[{"k":"A","t":"青少年编程≠敲代码；青少年编程≠培养程序员"},{"k":"B","t":"青少年编程=游戏化娱乐；青少年编程=纯兴趣班"},{"k":"C","t":"青少年编程=缩小版成人编程；青少年编程=速成班"},{"k":"D","t":"青少年编程=提前学职业；青少年编程=尽早分科"}],"answer":"A","back":"","sku":""},{"id":"T-S06","type":"阶段练习题","chapter":"少儿编程教育理念·阶段2","q":"少儿编程的三大主流语言是？","options":[{"k":"A","t":"Scratch、Python、C++"},{"k":"B","t":"Java、"},{"k":"C","t":"Go"},{"k":"C","t":"PHP、Ruby、Swift"},{"k":"D","t":"只有图形化一种"}],"answer":"A","back":"","sku":""},{"id":"T-S07","type":"阶段练习题","chapter":"少儿编程教育理念·阶段2","q":"Scratch（图形化编程）的特点与适配人群是？","options":[{"k":"A","t":"主流成人编程语言，像写文章一样完成代码语句；适配 7 年级以上"},{"k":"B","t":"国际通用少儿编程语言，像搭积木一样完成编程语句；适配 5 岁-2 年级及以下"},{"k":"C","t":"小众启蒙编程工具，像看动画一样完成演示；适配 3 岁及以下"},{"k":"D","t":"高阶算法编程语言，像做数学一样完成推导；适配 9 年级以上"}],"answer":"B","back":"","sku":""},{"id":"T-S08","type":"阶段练习题","chapter":"少儿编程教育理念·阶段2","q":"Python 语言的特点与适配人群是？","options":[{"k":"A","t":"语法简洁、AI 最常用语言；适合有数学基础+英语词汇的孩子，适配 3-6 年级"},{"k":"B","t":"语法直观、图形化积木语言；适合零基础的孩子，适配 5 岁-2 年级"},{"k":"C","t":"语法复杂、C 系最底层语言；适合有英文基础的孩子，适配 7-9 年级"},{"k":"D","t":"语法随意、脚本玩具语言；适合学有余力的孩子，适配高中以上"}],"answer":"A","back":"","sku":""},{"id":"T-S09","type":"阶段练习题","chapter":"少儿编程教育理念·阶段2","q":"关于 C++，正确的说法是？","options":[{"k":"A","t":"NOI（全国青少年信息学奥林匹克竞赛）系列比赛只支持 C++"},{"k":"B","t":"各类信息学竞赛都可以自选任意编程语言参赛"},{"k":"C","t":"C++ 在所有少儿编程语言里难度最低、最容易上手"},{"k":"D","t":"GESP（编程能力等级认证）系列考试只支持图形化"}],"answer":"A","back":"","sku":""},{"id":"T-S10","type":"阶段练习题","chapter":"少儿编程教育理念·阶段2","q":"趣味 C++ 解决的问题与价值是？","options":[{"k":"A","t":"用与 Python 相同标准的代码语言，让大孩子提前接触，避免直接学 Python 费时"},{"k":"B","t":"用图形化积木替代代码，让孩子彻底跳过代码学习直接参赛"},{"k":"C","t":"用与 C++ 相同标准的代码语言，让低龄孩子提前接触，避免直接学 C++ 畏难"},{"k":"D","t":"用纯理论课替代实操，让孩子背熟语法后再动手写代码"}],"answer":"C","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题","chapter":"少儿编程教育理念·全章","q":"「程序无处不在」的生活例子包括？【多选】","options":[{"k":"A","t":"支付宝、滴滴出行"},{"k":"B","t":"铁路 12306"},{"k":"C","t":"公司门口的打卡系统"},{"k":"D","t":"微信、抖音、淘宝"},{"k":"E","t":"这些和编程无关"}],"answer":"ABCD","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题","chapter":"少儿编程教育理念·全章","q":"给孩子报画画是希望他有色彩和美的感知，同理，让孩子学编程是？","options":[{"k":"A","t":"为了让他成为程序员"},{"k":"B","t":"为了参加综艺"},{"k":"C","t":"提升创新解难的能力，培养计算机思维"},{"k":"D","t":"为了代替家长辅导作业"}],"answer":"C","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题","chapter":"少儿编程教育理念·全章","q":"少儿编程三大主流语言类别是？","options":[{"k":"A","t":"Java、PHP、Go"},{"k":"B","t":"Scratch、Python、C++"},{"k":"C","t":""},{"k":"C","t":"C#、VB"},{"k":"D","t":"只有图形化"}],"answer":"B","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题","chapter":"少儿编程教育理念·全章","q":"Scratch 图形化编程的特点是？","options":[{"k":"A","t":"像写作文一样完成编程语句；需要先认识大量汉字和英文单词"},{"k":"B","t":"像做应用题一样完成编程语句；需要先掌握方程和函数"},{"k":"C","t":"像搭积木一样完成编程语句；不需要认识很多汉字、不会英文键盘也能学"},{"k":"D","t":"像做实验一样完成编程语句；需要先学会焊接电路和接线"}],"answer":"C","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题","chapter":"少儿编程教育理念·全章","q":"Python 的适配人群与学习前提是？","options":[{"k":"A","t":"零基础零词汇的孩子（1-2 年级），直接从 Python 代码开始入门"},{"k":"B","t":"有一定数学基础+英语词汇储备的孩子（3-6 年级），先在 Scratch 练扎实逻辑再过渡"},{"k":"C","t":"已掌握 C++ 的孩子（7-9 年级），需要通过 Python 巩固语法"},{"k":"D","t":"学龄前的孩子（5-6 岁），用 Python 认识字母和单词"}],"answer":"B","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题","chapter":"少儿编程教育理念·全章","q":"信息学奥赛系列比赛只支持的编程语言是？","options":[{"k":"A","t":"Python"},{"k":"B","t":"Scratch"},{"k":"C","t":"C++"},{"k":"D","t":"Java"}],"answer":"C","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题","chapter":"少儿编程教育理念·全章","q":"「趣味 C++」的设计目的是？","options":[{"k":"A","t":"用比 C++ 更难的机器码语言，让 3-6 年级孩子提前吃苦，锻炼抗挫能力"},{"k":"B","t":"用图形化积木替代 C++，让 3-6 年级孩子跳过代码，直接参加信奥竞赛"},{"k":"C","t":"用视频课替代 C++ 实操，让 3-6 年级孩子先看后练，降低上课成本"},{"k":"D","t":"用与 C++ 相同标准的代码语言，让 3-6 年级孩子提前铺垫，避免直接学 C++ 畏难"}],"answer":"D","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题","chapter":"少儿编程教育理念·全章","q":"小试牛刀：学员 4（13 岁、初一）应该匹配什么语言？","options":[{"k":"A","t":"Scratch"},{"k":"B","t":"Python"},{"k":"C","t":"趣味 C++"},{"k":"D","t":"C++"}],"answer":"D","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题","chapter":"少儿编程教育理念·全章","q":"编程未来发展的两大核心板块与延伸领域是？","options":[{"k":"A","t":"游戏、短视频是核心，延伸出直播、电商、运营、推广、剪辑、美工"},{"k":"B","t":"办公、文档是核心，延伸出打字、排版、制表、幻灯片、邮件"},{"k":"C","t":"数学、英语是核心，延伸出奥数、口语、语法、阅读、写作、翻译"},{"k":"D","t":"大数据、人工智能是核心，延伸出云计算、自动化、VR、AR、区块链、机器人、机器学习"}],"answer":"D","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题","chapter":"少儿编程教育理念·全章","q":"少儿编程与成人编程的本质区别是？","options":[{"k":"A","t":"通过背诵代码、刷题考试，培养记忆能力和应试技巧，提前适应成人敲代码模式"},{"k":"B","t":"通过观看视频、听讲理论，培养兴趣爱好，完全不涉及动手实践"},{"k":"C","t":"通过严格训练、淘汰筛选，培养竞技能力，只面向有天赋的专业选手"},{"k":"D","t":"通过游戏启蒙、可视化图形编程，培养计算机思维和创新解难能力，而不是照搬成人敲代码模式"}],"answer":"D","back":"","sku":""}],"timing":{"P03":{"sents":["首先我们进入第一个板块，编程基础认知，也就是什么是编程？"],"durs":[6.216]},"P04":{"sents":["说到编程，大家脑子里会冒出什么画面？","是穿格子衬衫、在格子间里埋头敲代码的程序员？","是屏幕上密密麻麻的代码，还是右边这一大堆编程语言的名字？","再看下面这张图，不同工作年限、不同学历的程序员，跳槽前的平均年薪都不低，工作六到十年的硕士，平均能到四十四点九万。","所以很多人对编程的第一印象就是技术宅、高收入。","这些印象没有错，但大家要注意，跟家长沟通的时候，千万别把学编程的价值落在将来当程序员、赚高薪上。","家长最常见的反应就是：我家孩子又不当程序员。","那编程和孩子到底有什么关系？","我们接着往下看。","来看一道题，跟家长沟通学编程的价值时，应该避免落在哪里？"],"durs":[4.128,5.208,5.832,11.952,5.592,10.272,4.776,3.216,1.992,5.952]},"P05":{"sents":["我们的生活，程序目前是无处不在的 图上这些图标大家都见过吧，抖音、微信、淘宝、美团、支付宝、滴滴出行、铁路12306，都是我们每天在用的应用，它们全都是用编程做出来的。","再比如咱们上班门口的打卡系统，背后也是一段程序。","所以说，程序在我们的生活里无处不在。","这一点在沟通里很好用：家长说孩子又不当程序员，学编程离我们太远，你就可以拿支付宝、滴滴打车、公司打卡这些例子告诉家长，程序就在生活里，孩子学编程，是在理解身边这个越来越数字化的世界。"],"durs":[17.736,5.352,4.344,18.528]},"P06":{"sents":["那到底什么是编程？","大家看屏幕上这句定义：编程，就是我们为了完成某项任务，把解决问题的步骤，用计算机能够理解的语言写成指令。","计算机会按照这些指令一步一步执行，最后完成任务。","简单来说就是人和计算机沟通和对话，换句话说，让电脑、计算机能听懂我们在说什么，并按照我们的指令进行运行，帮人们解决某个问题。\n","所以编程语言和我们平时说的中文、英语一样，都是用来沟通的语言，只不过沟通的对象换成了计算机。","而程序，就是用计算机能理解的语言写下的一连串命令。","来看一道题，编程的本质是什么？","其实编写程序简称编程，"],"durs":[2.16,10.656,5.376,13.128,9.744,5.688,3.264,3.096]},"P08":{"sents":["了解完主流编程语言之后，我们再来看看编程未来的发展方向。\n","大家在图上能看到，大数据、人工智能是两大核心板块，还延伸出云计算、自动化、VR、AR、区块链、机器人、机器学习这些领域。\n\n","这些新兴方向，底层都离不开编程。\n","很多家长就是看到了这个趋势，才愿意让孩子提前接触编程。","但这里我们要分清重点：\n","不是说孩子学编程，以后一定要去做程序员。","而是在数字化时代，编程思维会变成一项很重要的基础能力。\n\n","我们理解这个大背景，之后和家长沟通的时候，才能讲清楚为什么现在适合让孩子学习编程，而不是单纯给家长灌输 “写代码” 的概念。"],"durs":[6,13.224,3.72,6.192,2.76,4.416,5.76,12.432]},"P09":{"sents":["对现阶段的小朋友来说，编程就像一把神奇的钥匙，能打开科技大门，带我们走进一个充满无限可能的世界。","从日常使用的手机软件，到复杂的工厂机械，背后都离不开编程的支撑。\n","孩子们现在慢慢开始掌握编程，也意味着掌握开启未来科技的密码。"],"durs":[9.936,6.912,6.624]},"P10":{"sents":["刚刚我们了解了编程广阔的发展前景，很多家长听到这里，会心动，但是也会有顾虑。\n","那我们一起来思考一个问题：让孩子学习编程，会遇到哪些难点？\n\n","大家可以先想一想，站在孩子的角度，还有家长的角度，都有哪些阻碍。\n","比如孩子容易觉得代码枯燥、看不懂；","或者逻辑跟不上，很容易受挫；","也有家长担心太难，孩子学不会、坚持不下去。\n\n","正是因为这些难点存在，我们少儿编程，才不能照搬成人编程的学习方式。"],"durs":[7.728,5.88,6.504,3.864,3.216,4.68,6.864]},"P11":{"sents":["家长可能会问你：老师，孩子学编程，是让我孩子和成年人一样敲代码吗 ？\n","很多家长看到密密麻麻的代码，第一反应就是这个疑问：青少年编程会不会很难？","难道要让孩子直接敲代码吗？\n","大家看左边这张图，满屏文字代码，这就是成人职业编程的样子。","如果直接让孩子去学这种，难度非常高，很容易打击孩子的兴趣。\n\n","网上也流传着一个梗，就是右边这张图：学编程挺好，就是头有点冷，我秃了，也变强了。\n","这个段子，说的就是成人长期做开发的情况。","我们要记住，少儿编程，绝对不是照搬成人写代码的模式。\n\n","这也是很多新人容易踩的坑：误以为少儿编程，就是让小孩子提前写程序员那种代码。\n","接下来我们就正式对比，少儿编程和成人编程，到底有哪些本质区别。","来看一道题，关于青少年编程，正确的认知是？"],"durs":[6.816,7.536,2.856,6.096,6.072,8.448,4.728,5.568,7.728,6.816,4.728]},"P12":{"sents":["现在我们正式来认识少儿编程。\n","青少年编程，并不是像成人编程、大学专业课那样，直接让孩子敲代码写程序。\n","我们会先用游戏启蒙、可视化图形编程这类形式上课，重点目标，是培养孩子的计算机思维，还有创新解决问题的能力。\n\n","简单来说，少儿编程入门阶段，核心是锻炼孩子的逻辑思维。","编程本身，就是一套高效梳理思路、拆解问题的方式。\n\n","这里有两句非常关键的结论，大家一定要记牢：\n","青少年编程不等于敲代码，青少年编程也不等于培养程序员。\n","家长会给孩子报很多的兴趣班，给孩子报名画画是希望他成为梵高一样的艺术家吗？","肯定不是，是希望对色彩有感知、对美有感知。","学编程也不是让孩子成为程序员，更多是让孩子提升创新解难的能力。\n\n","这两个点，是我们后续和家长沟通时，必须传递清楚的。","帮家长放下顾虑，消除 “代码很难、孩子要当程序员” 这种误解，家长才更容易接受我们的课程。\n\n","理解完少儿编程和成人编程的核心区别，第一板块编程基础认知我们就快要结束了，接下来我们进入第二大板块：少儿编程语言类别。"],"durs":[3.192,7.848,10.704,6.024,5.376,4.368,6.288,7.464,4.824,7.008,5.16,8.736,11.976]},"P13":{"sents":["接下来我们一起来看看少儿编程有那些语言可以让孩子们学？"],"durs":[6]},"P15":{"sents":["少儿编程语言类别，一共三大主流类型，我们逐个拆解。\n","首先第一个就是 Scratch，也就是图形化编程。\n","图形化编程是国际通用的少儿编程入门语言，最大特点就是，孩子像搭积木一样拼接代码块，完成编程指令。\n\n","大家可以想象积木块的形式，它对孩子门槛很低：不需要认识大量汉字，就算孩子不会英文、还不熟练用键盘，照样可以上手学。\n","它适配的年龄段是 5 岁到二年级及以下，是孩子编程启蒙的第一站，用来先建立逻辑、感受编程思维。"],"durs":[5.448,4.368,10.392,11.448,9.504]},"P16":{"sents":["图形化 Scratch 之后，我们来看第二类编程语言 ——Python。\n","Python 是文本类编程语言，它语法简洁，也是人工智能方向最常用的编程语言，应用范围非常广。","现在不少高中，已经把 Python 纳入校本课程了。\n\n","它虽然代码好读懂，但还是有门槛，适合有一定数学基础、还有少量英语词汇储备的孩子，我们的适配年龄段是 3 到 6 年级。\n","这里我们要跟新人强调：它不是零基础直接上手的，一般是孩子 Scratch 把逻辑思维练扎实之后，再过渡到 Python，平稳从积木编程转到代码编程。\n\n","跟家长沟通时，这个点也很关键：Python 是衔接后续信息学赛事、AI 方向的重要过渡语言。"],"durs":[5.232,9.432,4.848,11.256,13.56,9.024]},"P19":{"sents":["刚才我们学了到底多大的孩子在核桃学习哪个语言，那现在我们一起来小试牛刀一下，看看大家掌握的怎么样.\n","目前这里有五个学员。","来看一道题，小试牛刀：学员 1（6 岁、一年级、无基础）应该匹配什么语言？"],"durs":[9.72,2.52,7.656]},"P20":{"sents":["到这里，咱们今天编程基础认知、三大编程语言的内容就全部讲完了。\n","最后送给大家这几句话：学习不息，成长不止；","追求卓越，舍我其谁；","培训很苦，坚持很酷。\n\n","咱们新人培训要吸收的知识点多、要练的话术也多，过程确实不轻松。","但大家要记住，你的付出，直接决定了你后续的成长速度。"],"durs":[6.696,4.8,2.784,2.736,6.648,5.736]},"P01":{"sents":["今天我们的主题是：少儿编程理念。\n\n","和家长沟通，很容易心里没底，不知道我们讲的内容底层逻辑是什么。","所以这节课，我们先打好认知基础。\n\n","本节课一共分为两大板块：\n","第一板块，编程的基础认知，我们会分清：少儿编程和成人编程到底有什么不一样，纠正认知误区；\n","第二板块，少儿编程的语言类别，带大家看懂 Scratch、Python、C++ 分别适合什么样的孩子、对应的学习方向。\n\n","把这两块吃透，我们才能理解课程设计、看懂孩子的学习路径，之后和家长沟通的时候，每一句话都有理有据，而不是生硬背诵脚本。\n","接下来我们正式开始今天的学习。"],"durs":[3.672,6.12,3.624,3.048,9.216,10.536,12.048,3.384]},"P02":{"sents":["今天内容分成两大板块。\n","第一部分，编程基础认知。","在这里，我们会把少儿编程和成人编程做区分，搞懂两者核心差别，破除大家最容易有的误区。\n","第二部分，少儿编程语言类别。","我们会分别学习 Scratch、Python、C++ 这三类主流语言，清楚每一种语言适合什么样的孩子、对应什么学习方向。\n","大家记住，先分清概念，再看懂语言赛道。","理解完这两块，后面和家长沟通，我们才能讲得专业、不跑偏。\n","那我们现在进入第一部分，编程基础认知。"],"durs":[2.928,2.976,8.952,3.24,10.752,4.392,6.144,4.248]},"P07":{"sents":["现在我们进入编程基础认知板块，先来看这张表，了解几种主流编程语言的区别。\n\n","首先是 C 语言，它多用于底层系统、驱动程序开发。","特点是贴近计算机底层，执行效率很高，在很多底层设备里应用非常广泛。\n\n","第二个是 C++，它可以用来开发网游、客户端应用还有操作系统。","它是 C 语言的升级版，兼顾运行效率和拓展性，也是现在使用范围很广的一门语言。\n\n","接下来是 Java，主要做网站开发、安卓手机程序开发。","安卓开发基本都会用到它，跨平台的能力很强。\n\n","最后是 Python，常用来做爬虫、人工智能、大数据分析。","它语法简洁，配套的工具库非常丰富。\n\n","大家可以发现，每一种编程语言，都有自己专属的应用场景。","本质上，编程语言就是人和电脑沟通的工具，帮助我们高效完成不同类型的工作。","表格右侧，就是市面上更多常见编程语言的图标，大家了解一下。","来看一道题，主要用于安卓手机程序开发的编程语言是？"],"durs":[7.608,5.232,7.68,6.552,7.728,5.52,4.512,6,3.984,5.568,7.656,6.48,5.328]},"P14":{"sents":["少儿编程语言，主要有三大类。","第一类是图形化编程，也就是Scratch，入门简单，重点培养孩子的编程思维。","第二类是Python，属于代码入门，需要一定的英语基础，应用范围比较广。","第三类是C++，可以用来参加信息学竞赛，难度较高，功能也很强大。","来看一道题，少儿编程的三大主流语言类别是？"],"durs":[3.312,7.32,6.744,7.152,4.728]},"P17":{"sents":["最后我们来看第三种，C++。\n","C++ 是非常经典的编程语言，大学计算机相关专业基本都会必修，功能很强。","重点要记住：NOI 全国青少年信息学奥林匹克竞赛系列赛事，只支持 C++。\n\n","它也是三类里面难度最高的，适合有编程基础、数理能力比较突出的孩子。\n","我们的路线是：3–6 年级先学趣味 C++ 做铺垫，到七年级及以上，再正式学习竞赛向的 C++。\n\n","这里划重点：很多家长奔着信息学竞赛、升学优势来咨询，我们就要讲清楚，想要走竞赛路线，最终一定要落到 C++ 上。","但它门槛高，不能直接零基础上手，要按 编程学习路径循序渐进。"],"durs":[3.528,8.232,7.968,6.96,10.272,12.168,6.816]},"P18":{"sents":["那不同年龄的孩子适合学什么？","大家看这张表，我们按难度从低到高过一遍。","Scratch不需要编程基础，不用记英文单词，也不需要大量的键盘操作和语句记忆，入门容易，适合五岁到小学二年级及以下的孩子。","Python需要一定的英文基础和基本的编程逻辑理解，难度中等，适合小学三到六年级。","趣味C++的基础要求和Python一样，难度中上，同样适合小学三到六年级。","它用的是和C++相同的标准代码语言，有利于孩子以后参加竞赛。","很多家长更认可C++，但低龄孩子直接学C++难度太大，容易产生畏难情绪，趣味C++正好解决了这个问题。","最后是C++，要求较高的英文水平和扎实的编程基础，还要学数据结构和算法，难度较高，适合七年级及以上的孩子。","续费沟通时，家长偶尔会问后面要不要换一种语言，大家就对照这张表，看孩子的年级和基础来匹配，不要凭感觉推荐。"],"durs":[3.264,4.44,12.048,8.064,7.536,6.672,11.424,11.688,11.136]},"P21":{"sents":["请使用飞书扫描填写真实评价吧~"],"durs":[3.528]}},"v":{"slides/P01.jpg":"6977181f","slides/P01.png":"dc374274","slides/P02.jpg":"9f21ebaf","slides/P02.png":"92bd4d4d","slides/P03.jpg":"b85aea97","slides/P03.png":"4e99c653","slides/P04.jpg":"af56ec80","slides/P04.png":"b242bb2c","slides/P05.jpg":"506404ca","slides/P05.png":"73c17d62","slides/P06.jpg":"d6f3e1b8","slides/P06.png":"aa29ad05","slides/P07.jpg":"b1fad7d7","slides/P07.png":"37cfba6e","slides/P08.jpg":"ac4ae59e","slides/P08.png":"eff8abe0","slides/P09.jpg":"bd606e91","slides/P09.png":"e0e7def2","slides/P10.jpg":"0b2e1e74","slides/P10.png":"4095fea7","slides/P11.jpg":"5572a77b","slides/P11.png":"0780b289","slides/P12.jpg":"55dd0789","slides/P12.png":"d97bc94e","slides/P13.jpg":"65c06b5c","slides/P13.png":"5f59ff7e","slides/P14.jpg":"00cae5d0","slides/P14.png":"1a840775","slides/P15.jpg":"5b4adf43","slides/P15.png":"92fe68e1","slides/P16.jpg":"0ecb3da5","slides/P16.png":"c4731e78","slides/P17.jpg":"95a6ce55","slides/P17.png":"b6cacfab","slides/P18.jpg":"08dd7d8c","slides/P18.png":"c4135c45","slides/P19.jpg":"db99fe10","slides/P19.png":"3b3fee24","slides/P20.jpg":"973ef819","slides/P20.png":"69199880","slides/P21.jpg":"7ce5928f","slides/P21.png":"9dc02ebd","audio/P01.mp3":"4ba6b68f","audio/P02.mp3":"b95cbb2a","audio/P03.mp3":"db7b4bd4","audio/P04.mp3":"51318f14","audio/P05.mp3":"0b06681b","audio/P06.mp3":"90c0b27b","audio/P07.mp3":"3ec4cbed","audio/P08.mp3":"facf013a","audio/P09.mp3":"380acf84","audio/P10.mp3":"aeb95b54","audio/P11.mp3":"598e83cb","audio/P12.mp3":"3d8b36b8","audio/P13.mp3":"d2fbf46c","audio/P14.mp3":"de5e6d37","audio/P15.mp3":"cc6ed13a","audio/P16.mp3":"84a74590","audio/P17.mp3":"8f922215"," const PASS = 0.6; // 合格线：取自「合格线与重学规则」表「阶段合格线 60%」
const CFG = {"key":"中价_少儿编程教育理念-v1","title":"少儿编程教育理念","short":"少儿编程教育理念","tag":"中价课 · 新人训","hero":"P01","titles":{"1":"编程基础认知","2":"少儿编程语言类别"},"depts":["国润","汇诚"],"lock":"1nmxspe"};
const KEY = CFG.key;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 课程结构 ---------- */
/* 部门 / SKU 可见性：标「通用」或未标的页所有人可见；带标签的页只有选中的部门/SKU 命中才显示（多选任一命中即可） */
const normTag = t => String(t||'').replace(/1部/g,'一部').replace(/2部/g,'二部').replace(/苍穹鼎/g,'苍穹顶').replace(/\s/g,'');
const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return (!CFG.depts || tagOk(p.dept, st && st.depts)) && (!CFG.skus || tagOk(p.sku, st && st.skus)); }
let STAGES = [];
function buildStages(){
  STAGES = [];
  for (const p of DATA.pages) {
    if (!pageVisible(p)) continue;
    let s = STAGES.find(x => x.name === p.stage);
    if (!s) { s = {name:p.stage, num:+(/阶段\s*(\d+)/.exec(p.stage)||[0,STAGES.length+1])[1], pages:[]}; STAGES.push(s); }
    s.pages.push(p);
  }
  for (const s of STAGES) s.quiz = DATA.qs.filter(q => /阶段练习/.test(q.type) && +(/阶段\s*(\d+)/.exec(q.chapter)||[])[1] === s.num);
}
let st = null; buildStages();
const TITLES = CFG.titles || {};
const FINAL = DATA.qs.filter(q => /综合测试/.test(q.type));

/* ---------- 学习记录（仅存本机浏览器） ---------- */
function fresh(){ return {name:'', team:'', sid:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), unlocked:0, heard:{}, passed:{}, tries:{}, best:{}, final:null, finalTries:0, view:'home', cur:{s:0,p:0}, stageSec:{}}; }
try { st = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e) { st = fresh(); }
buildStages();
// 恢复进度链接：#r=base64(JSON {k,sid,passed:[..],best:{..}})，只对本课 key 生效
let RESTORE=null; try { const m=/[#&]r=([^&]+)/.exec(location.hash); if(m){ const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))))); if(o.k===CFG.key) RESTORE=o; history.replaceState(null,'',location.pathname+location.search); } } catch(e) {}
function applyRestore(){ if(!RESTORE) return false; const o=RESTORE; RESTORE=null;
  st.sid=o.sid||st.sid; st.rowCreated=true;
  for(const i of o.passed){ if(!STAGES[i]) continue; st.passed[i]=true; STAGES[i].pages.forEach(p=>st.heard[p.p]=true); }
  st.unlocked=Math.max(st.unlocked, Math.max(-1,...o.passed)+1); Object.assign(st.best,o.best||{}); save(); return true; }
// 后台补进度：cfg.restore = {姓名: {passed,best,sid}}，每人只补一次（妙搭链接带不了 #r=）
function pickRestore(n){ const o=CFG.restore&&CFG.restore[n]; if(!RESTORE&&o&&st.restoredFrom!==o.sid){ RESTORE=o; st.restoredFrom=o.sid; } }
if (st.name) pickRestore(st.name);
if (RESTORE && st.name) { applyRestore(); }
// 旧版本里小测没加载、0/0 直接过关的阶段：重新打开，补做小测（已听过的页面不用重听）
(function fixZeroPass(){ let first=-1; STAGES.forEach((s,i)=>{ if(st.passed[i] && s.quiz.length && st.best[i]==null){ delete st.passed[i]; if(first<0) first=i; } }); if(FINAL.length && st.final && st.final.pass && !st.final.score){ st.final=null; save(); } if(first>=0){ st.unlocked=Math.min(st.unlocked, first); if(st.final && !st.final.pass) st.final=null; save(); } })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }
if (!st.sid) st.sid = 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
if (!st.stageSec) st.stageSec = {};

/* ---------- 学习数据上报（飞书多维表格 Webhook，实时写入） ---------- */
const HOOK = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/Z0UnaFjXvwZxHrhrmiFcMjSJnEd';
const pad = n => String(n).padStart(2,'0');
function nowStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function stageLabel(i){ const s = STAGES[i]; return s ? (s.name + (TITLES[s.num] ? ' ' + TITLES[s.num] : '')) : ''; }
const mins = sec => Math.round((sec||0)/6)/10;
/* 每个关卡的过程数据：play=实际播放秒数 occ=占用秒数 pn/ps=暂停次数/秒 kn/ks=卡顿次数/秒 */
function stat(k){ st.stat = st.stat || {}; return st.stat[k] = st.stat[k] || {play:0, occ:0, pn:0, ps:0, kn:0, ks:0}; }
function curKey(){ return st.view === 'quiz' ? (st.quiz === 'final' ? 'f' : st.quiz) : st.cur.s; }
function stageStatusText(k){
  if (k !== 'f' && !STAGES[k]) return '';
  const done = k === 'f' ? !!(st.final && st.final.pass) : !!st.passed[k];
  if (done) return '已完成';
  if ((st.view === 'learn' || st.view === 'quiz') && String(curKey()) === String(k)) return '进行中';
  const s = st.stat && st.stat[k];
  return s && s.occ > 0 ? '进行中' : '未开始';
}
function snapshot(online){
  const keys = Object.keys(st.stat||{}), sum = f => keys.reduce((a,k) => a + ((st.stat&&st.stat[k]&&st.stat[k][f])||0), 0);
  const play = sum('play'), occ = sum('occ');
  const sc = i => st.best[i] != null ? `${st.best[i]}/${STAGES[i].quiz.length}` : '';
  const cur = st.view === 'quiz' ? (st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz) + '·小测') : (st.view === 'learn' ? stageLabel(st.cur.s) : '课程首页');
  const cp = st.view === 'learn' ? (curPageSafe()||{}).p || '' : '';
  return {online: online || '学习中', cur_stage:(CFG.short||CFG.title)+'｜'+cur, cur_page:cp,
    st1:stageStatusText(0), st2:stageStatusText(1), st3:stageStatusText(2), st4:stageStatusText(3), stf:stageStatusText('f'),
    sc1:sc(0), sc2:sc(1), sc3:sc(2), scf: st.final ? `${st.final.score}/${FINAL.length}` : '',
    play_min:mins(play), occ_min:mins(occ), gap_min:mins(Math.max(0, occ-play)),
    pause_n:sum('pn'), pause_min:mins(sum('ps')), stall_n:sum('kn'), stall_min:mins(sum('ks')),
    relearn_n:Object.values(st.relearnCnt||{}).reduce((a,b)=>a+b,0),

const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){

let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();

}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid, course:CFG.short||CFG.title, date:nowStr().slice(0,10)}, ev, snapshot(online));
  { const CNm = CFG.short || CFG.title; if (!String(rec.stage||'').startsWith(CNm + '｜')) rec.stage = CNm + (rec.stage ? '｜' + rec.stage : ''); }
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

    <div style="font-size:40px">🔒</div><h2 style="margin:8px 0">${esc(CFG.title)}</h2>
    <p class="muted">课程暂未开放，开培时由培训老师统一开放。</p>
    <input id="lk" type="password" placeholder="管理员口令" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:12px;font-size:15px">
    <button id="lkb" class="btn" style="margin-top:10px;width:100%">进入</button><p id="lkm" class="muted" style="color:#dc2626" hidden>口令不对</p></section>`;
  const go = () => { const v = $('#lk').value.trim(); if (lockH(v) === CFG.lock) { UNL = CFG.lock; try { localStorage.setItem('unlock_' + CFG.key, CFG.lock); } catch(e) {} render(); } else $('#lkm').hidden = false; };
  $('#lkb').onclick = go; $('#lk').onkeydown = e => { if (e.key === 'Enter') go(); };
}
function render(){
  if (locked()) return renderLock();
  if (st.view === 'learn') return renderLearn();
  if (st.view === 'quiz') return renderQuiz();
  renderHome();
}

      : `<form id="nameForm"><label for="nm">学员姓名</label>

          ${CFG.skus ? `<span>SKU（可多选）</span><div class="chips">${CFG.skus.map(d=>`<label class="chip"><input type="checkbox" name="sku" value="${esc(d)}"> ${esc(d)}</label>`).join('')}</div>` : ''}`
          : `<label for="tm">职场 / 团队</label>
          <input id="tm" required maxlength="20" placeholder="如：武汉、汇诚" list="teams" autocomplete="off">

          <p class="rule" id="formMsg" hidden></p>
          <button class="btn" type="submit">开始学习</button></form>`}
      <p class="rule" id="resetMsg" hidden></p>
    </div>
  </section>

  ${mapHTML(-1)}
  <section class="card"><h3 style="font-size:16px;margin-bottom:8px">上课须知</h3>
    <ol class="steps">
      <li>请打开声音。每页 PPT 配有老师讲解，字幕同步显示讲解原文。</li>
      <li>当前页讲完才能进入下一页；切到别的窗口会自动暂停。</li>

    const v = $('#nm').value.trim(); const pick = n => [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x => x.value); if (v === '审核') { renderReview(); return; }
    let t = '', extra = '';

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function renderLearn(autoplay){
  const s = curStage(), p = curPage();
  const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const heard = !!st.heard[p.p];
  $('#app').innerHTML = `${headerHTML()}
  ${mapHTML(st.cur.s)}
  ${loopHTML(0)}
  <div class="stage-head"><h2>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}　<span class="muted" style="font-weight:400;font-size:15px">${p.p} ${esc(p.topic)}</span></h2>
    <span class="time">第 ${st.cur.p+1} / ${s.pages.length} 页</span></div>
  <div class="slide">${p.video?`<video id="vd" src="${VU(p.video)}" poster="${SL(p.p)}" controls playsinline preload="metadata" style="width:100%;max-height:70vh;display:block;object-fit:contain;background:#000"></video>`:`<img src="${SL(p.p)}" alt="${esc(p.p+' '+p.topic)}">`}
    <div class="veil" id="veil" ${autoplay?'hidden':''}><button class="btn" id="veilBtn">▶ 点击播放讲解</button></div></div>

  <div class="bar">
    <button class="btn ghost" id="prev" ${st.cur.p===0?'disabled':''}>上一页</button>
    <button class="btn" id="pp">播放</button>
    <button class="btn ghost" id="again">重听本页</button>
    <div class="prog" aria-hidden="true"><div id="progfill"></div></div>
    <span class="time" id="time">0:00 / ${fmt(total)}</span>
    <div class="speed" role="group" aria-label="语速">${[1,1.25,1.5].map(r=>`<button data-r="${r}" class="${r===rate?'on':''}">${r}x</button>`).join('')}</div>
    <button class="btn" id="next" ${heard?'':'disabled'}>${st.cur.p===s.pages.length-1?(s.quiz.length?'去做阶段小测':'完成本阶段'):'下一页'}</button>
  </div>
  <div class="dots">${s.pages.map((pg,i)=>`<button class="dot ${st.heard[pg.p]?'heard':''} ${i===st.cur.p?'now':''} ${pg.interact?'q':''}" data-pg="${i}" ${(st.heard[pg.p]||i===st.cur.p)?'':'disabled'} title="${esc(pg.topic)}">${pg.p}</button>`).join('')}</div>
  <details class="full"><summary>展开本页讲解全文</summary><p>${esc(p.script)}</p></details>`;
  bindCommon();
  delete au.dataset.retried; au.src = VU('audio/'+p.p+'.mp3');
  { const im=document.querySelector('.slide img'); if(im && !im.complete){ im.style.opacity=0; im.onload=()=>{im.style.transition='opacity .2s';im.style.opacity=1;}; im.onerror=()=>{ if(!im.dataset.r){ im.dataset.r=1; im.src=im.src+'&r='+Date.now(); } else im.style.opacity=1; }; } }
  [1].forEach(k=>preload(s.pages[st.cur.p+k])); if(st.cur.p+1>=s.pages.length) preload((STAGES[st.cur.s+1]||{pages:[]}).pages[0]);
  au.currentTime = 0; lastT = 0;
  report({event:'进入页面', stage:stageLabel(st.cur.s), page:p.p, detail:p.topic});
  $('#veilBtn').onclick = play;
  { const v = $('#vd'); if (v) v.onplay = () => au.pause(); }
  $('#pp').onclick = () => playing ? au.pause() : play();
  $('#again').onclick = () => { au.currentTime = 0; play(); };
  $('#prev').onclick = () => goPage(st.cur.p-1);
  $('#next').onclick = () => nextPage();
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => goPage(+b.dataset.pg));
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rate = +b.dataset.r; au.playbackRate = rate;
    document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on', x===b)); });
  if (autoplay) {
    // 等这一页的 PPT 图片加载完再开始讲，避免「声音在讲、画面还没出来」；最多等 8 秒
    const im = document.querySelector('.slide img');
    if (im && !im.complete) {
      let done = false; const go = () => { if (done) return; done = true; if (curPage() === p && st.view === 'learn') play(); };
      im.addEventListener('load', go, { once: true }); im.addEventListener('error', go, { once: true }); setTimeout(go, 8000);

}
function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});
  showQuiz('final');
}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>
