<script>
const DATA = {"pages":[{"row":2,"stage":"阶段1·开篇与竞品需知","p":"P01","topic":"封面：竞品分析（py）——为什么新人必学竞品分析","script":"各位老师，大家好。今天这节课，我们一起来学习竞品分析。\n为什么新人必须学这块内容。咱们日常的工作场景里，不管是首次和家长沟通咨询，还是后期进入续报阶段，竞品对比类问题是高频异议。很多家长之前已经带孩子体验过别家少儿编程课，或者正在多家机构之间做选择，很容易直接问：核桃编程和别的机构比，差别在哪？\n\n刚上手的时候，一听到这类问题很容易慌：要么不知道怎么回答，下意识去贬低对手；要么讲不出咱们产品独有的亮点，只能笼统说我们更好，家长听完没有感知，信任很难建立。\n\n所以我们学习竞品分析，核心目标不是去背一堆竞品的缺点，更不是主动去踩其他机构。而是先熟悉市面上同类产品的特点，当家长主动提起对比的时候，我们可以做到客观、理性地拆解差异，站在孩子学习需求的角度，帮家长理清不同课程的适配人群，顺理成章讲清楚核桃编程的优势，打消家长的顾虑。\n只有我们自己吃透竞品、吃透自家产品，面对家长的对比提问，回答才稳、才有说服力。","interact":null,"sku":"","dept":""},{"row":3,"stage":"阶段1·开篇与竞品需知","p":"P02","topic":"目录：竞品需知/竞品处理流程/常见竞品对比/常用竞品对比思路","script":"在这节课开始之前我们需要知道的一个背景是：在双减之下学科是一直处在弱化的形势，现在当前大量兴起的是编程，众多的机构都加入了编程的课程；像学某思双减后加入了编程、某猿之前主做学科的也是因为双减加入了编程。但并不是当家长提及到竞品的时候，而用我们的主观意识去告知家长一定要选择我们，而是我们要客观的分析给家长我们之间有哪些不同之处，包括对应的细节点有哪些不同，这才是让我们所取了解的。那这节课我们也分成了四个板块，以下几个内容01/竞品需知\n02/竞品处理流程\n03/常见竞品对比\n04/常用竞品对比思路","interact":null,"sku":"","dept":""},{"row":4,"stage":"阶段1·开篇与竞品需知","p":"P03","topic":"第一章（章节页）：竞品需知","script":"先来看第一个板块竞品需知，是大家需要知道遇到竞品的时候，我们给家长说的时候所用到的思路。","interact":null,"sku":"","dept":""},{"row":5,"stage":"阶段1·开篇与竞品需知","p":"P04","topic":"成交三性：重要性·紧迫性·唯一性——唯一性是竞品分析的重点","script":"我们今天进入竞品须知板块，核心就是成交三性：重要性、紧迫性、唯一性，也是我们跟家长沟通时最核心的一套逻辑。\n\n首先第一个，重要性：为什么要学少儿编程？\n我们要先给家长讲明白少儿编程本身的价值。编程不是单纯教孩子敲代码，核心是锻炼孩子的逻辑思维、拆解问题、试错思考的能力，同时对接信息时代的素养，还有 CTL、GESP 这类权威赛事、科技特长生的升学规划路径，这是编程这件事本身的价值，先让家长认可 “学编程这件事是有意义的”。\n\n第二个，紧迫性：为什么现在就要学？\n认可价值之后，我们要告诉家长不能一直观望、拖延。孩子的思维黄金窗口期是有限的，低龄阶段更容易建立思维习惯；而且赛事、升学规划都有对应的时间节点，越往后，孩子课业压力越来越大，时间会越来越紧张，起步晚了，准备周期就不够。所以不是以后学不学，而是要抓住当下合适的阶段开始。\n\n前面这两点，是所有编程机构都能讲的，竞品一样会跟家长说。那我们真正拉开差距、打动家长、促成选择的，就是第三点，也是今天的重点 ——唯一性：为什么选择核桃编程？\n别的机构能讲编程的好处、能说要趁早学，但核桃有我们独有的优势。我们深耕少儿在线编程多年，有完整从 Scratch 到 C++ 的进阶体系，配套标准化实操课程、赛事辅导、专业的教研和服务，主打重实操，不是单纯看动画、背概念；同时我们的课程体系、学情跟进、赛考规划是成熟闭环，是专门适配孩子长期编程成长的。\n简单说：很多地方都能学编程，但核桃是更专业、体系更完整、更适合孩子稳步走竞赛和素养路线的选择，这就是我们的不可替代性。\n\n总结一下三性的逻辑：先靠重要性解决家长 “要不要学” 的疑问，再用紧迫性打消家长 “以后再说” 的拖延心态，最后用我们核桃独有的唯一性，回答家长 “凭什么选我们，而不是别家”，这也是我们课导在和家长沟通时，贯穿全程的底层思路。来看一道题，竞品需知板块，重点讲的是成交三性中的哪一性？","interact":{"q":"竞品需知板块，重点讲的是成交三性中的哪一性？","at":"P04","options":["重要性——为什么要学少儿编程","紧迫性——为什么现在就要学","唯一性——为什么选核桃而不是别家","时效性——什么时候能学完"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":6,"stage":"阶段1·开篇与竞品需知","p":"P05","topic":"竞品大忌：疯狂拉踩、诋毁对方","script":"这块儿需要给大家说的一个点是，我们在给家长分析竞品的时候一定是客观的分析并不是疯狂的去拉踩对方，诋毁对方，所以我们要有流程，客观的进行分析。","interact":null,"sku":"","dept":""},{"row":7,"stage":"阶段2·竞品处理流程","p":"P06","topic":"第二章（章节页）：竞品处理流程","script":"进入第二部分竞品处理的流程是什么~","interact":null,"sku":"","dept":""},{"row":8,"stage":"阶段2·竞品处理流程","p":"P07","topic":"竞品处理三步：理解认可夸赞理念→倾听了解竞品→客观分析区别","script":"那在这个开始之前呢，可以去思考一个问题，就是当家长向你主动的去询问关于竞品问题的时候，你认为这个家长他是否是有意向的呢？大家觉得家长说我不报还是说我去其他家报，哪个更有学习编程的意识\n\n那既然家长能向你去提出关于竞品的一些问题的比如说：“老师我想再去考虑一下，我想再去看看其他的机构或者是直接向你提出了老师我觉得你们的课程模式像是在看动画片等相关问题。那这个时候他其实是有一定是有意向想要去了解的，无非现在就是想要去对比一下，那家长既然有了想要去了解的想法，我们先要去主动夸赞家长的教育理念好，也说明提前是给孩子进行编程学习的规划。那我们对于家长表示完理解和认可之后，接下来要询问的就是，对比的是哪一家的一个机构，我们要知道我们的一个对手是谁，这样的话呢，我们才可以有效的去解决家长的一个问题。如果不问的话，你把这个家长追到天涯海角都不知道你在和谁对比。\n如果你和这个家长聊了半天，到最后我也没有询问到底是在和那家机构对比？这样明显就是在做无用功，在浪费你和家长的时间。\n那当然，在我们最后向家长了解到了，他在对比的竞品信息。要注意的是第一：刚才在前面说了，我们也不要去疯狂地去拉踩对方，而是我们要用客观的事实去给家长去讲我们的优势，给家长进行客观的分析，为什么要去选择核桃，为什么孩子一定要在核桃去学习。","interact":null,"sku":"","dept":""},{"row":9,"stage":"阶段3·常见竞品对比","p":"P08","topic":"第三章（章节页）：常见竞品对比","script":"第三个板块的话呢，我们来去看一下常见的一个竞品对比。","interact":null,"sku":"","dept":""},{"row":10,"stage":"阶段3·常见竞品对比","p":"P09","topic":"六维对比表：猿封装代码·编程猫 Kitten 自创·西瓜 C++ 外包·核桃 S/P/C 全自研","script":"接下来我们结合这张对比表，从 6 个维度，帮大家客观看看市面上主流编程机构的区别，方便咱们结合孩子目标做选择。\n\n首先第一块，我们先看机构背景和起家根基。\n先看成立时间：编程猫 2015 年成立，是这几家里面最早的，本身也是编程起家；核桃编程 2017 年成立，同样从创立之初就专注少儿编程赛道，是原生做编程的机构。\n很多家长听过猿辅导，名气很大，这个我们完全认可。但大家要区分一点：猿辅导本身是学科类起家，编程只是它拓展出来的一个分支业务，不是核心主业。而且猿辅导 Python 是封装代码，简单说就是把底层代码提前封装好了，孩子只是调用模块，学的内容和竞赛要考察的原生代码不一样。一旦离开它这个学习平台，孩子很难独立写出完整程序。\n再看编程猫，虽然起步早，但是它主推 Kitten 自研语言，这个语言属于平台自创，并不是行业通用编程语言，没办法对接 GESP、CSP 这类主流信息学赛事，后续孩子想打竞赛、走科技特长路线，这套语言是用不上的。\n西瓜创客这边，它的 C++ 课程是外包团队承接的，课程研发不是自有团队把控，整套 C++ 体系的稳定性、连贯性会弱一些。\n线下机构的特点是软硬件穿插学习，今天接触乐高硬件、明天学一点软件编程，内容比较零散，没有循序渐进、长期连贯的进阶学习路线。\n而核桃编程，Scratch 图形化、Python、C++ 全部都是自研体系，一条路线贯通，专门对标信息学学习路径。\n\n第二点，整套课程体系\n核桃是真正一站式闭环：Scratch→Python→C++，从低龄启蒙，到后期冲刺竞赛、科技特长生，一条路线可以一直学下去，规划清晰。\n其他机构都有明显短板：要么编程语言不通用，要么高阶 C++ 外包、要么硬件软件穿插打乱节奏，很难支撑孩子从启蒙到竞赛的完整长期规划。\n\n第三点，我们来看学习周期，也就是孩子要花多久学完。\n大家看表格里核桃的节奏：Scratch 1 年，Python 1 年，C++ 3 年，整体节奏规划紧凑合理，每一个阶段目标明确。\n对比竞品：猿、编程猫、西瓜，整体学习周期都比核桃更长。线下机构耗时是最久的，很多孩子光 Scratch+Python 就要学 6 年左右，周期拉得很长，等到想往 C++ 进阶的时候，时间非常紧张，甚至很多线下班根本不开稳定的 C++ 竞赛班，孩子很难走到竞赛阶段，时间成本很高。\n\n第四块，费用和退费风险，我们折算成单节课来看会更直观。\n核桃折算下来单节课只要 60 多块。猿辅导单节课折算 80 多，而且是按阶段缴费，长期下来成本更高。\n编程猫表面看报价低，但刚刚咱们提到，它的 Kitten 语言不通用，没法对接竞赛，看着便宜，但是匹配不了咱们走特长、打比赛的目标，性价比就要打折扣。\n线下机构单节价格普遍 200-300 元，单价高出非常多。同时线下退费协议里一般都设置了退费违约金。大家可以联想一下线下的健身、舞蹈兴趣班，一旦中途想退费，流程麻烦、限制多，还会有门店经营、闭店的风险，资金风险比线上更大。\n\n第五点上课模式核桃是实操课。很多家长可能会好奇，什么是实操课？简单说，上课全程孩子自己动手敲代码、调试程序，老师全程在线实时监测每个孩子的屏幕、学习状态，孩子卡壳、写错代码的时候，老师能够及时发现、针对性引导，孩子是边做边学。\n猿辅导是大班直播课，一个班孩子很多，老师要跟着全班进度走。如果咱们家孩子一个地方卡住了，老师很难单独停下来，专门等孩子、单独讲解，跟不上就容易掉队。\n编程猫、西瓜创客是 AI 双师模式，AI 录播为主，非常考验孩子自觉性。孩子听懂与否、有没有理解，老师没法实时看到，有问题必须孩子主动提问才能得到解答，被动的孩子很容易积攒问题。\n线下虽然是面对面授课，但少儿编程专业师资比较稀缺，老师水平参差不齐，师资稳定性很难保证。\n\n第六点，也是很多家长最关心的：赛考、考级，也就是升学含金量\n核桃这边，对接 CTL、GESP 这类认可度高、官方主流的考级，同时也有白名单国家级赛事资源，证书是信息学圈认可的，能够对接科技特长生规划。\n猿辅导、西瓜创客主推自家自研考级，这类证书属于机构内部认证，外面认可度低，后续升学、报名校测的时候很难被认可。编程猫和线下机构的赛考配套比较零散，没有完整的考级 + 赛事晋升路线，很难支撑孩子长期竞赛规划。\n\n最后总结一下：不是说别的机构不好，每家定位不一样。如果咱们只是想让孩子简单体验、玩一玩，选择会很多；但如果咱们目标很明确，想走信息学、科技特长生，需要一套连贯、通用、对接正规赛事，从启蒙一直学到 C++ 竞赛的体系，核桃这套一站式方案会更适配咱们孩子。来看一道题，猿编程 Python 的核心问题是什么？","interact":{"q":"猿编程 Python 的核心问题是什么？","at":"P09","options":["难度太高，孩子根本学不会","封装代码——学的和考的不一样","课时太短，内容讲不完","纯图形化，完全没有代码"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":11,"stage":"阶段4·线上竞品对比","p":"P10","topic":"第四章（章节页）：常用竞品对比思路","script":"第四个部分的话给大家讲的是常用的竞品话术。在这一块的话呢会带着大家统一去梳理一下解决竞品的思路，即使后续遇到被问到的竞品，也不会不知道从哪些方面去给家长去讲。","interact":null,"sku":"","dept":""},{"row":12,"stage":"阶段4·线上竞品对比","p":"P11","topic":"线上对比三抓手：比模式·比成绩·比价格（比价=算单课时+绑价值）","script":"刚刚我们看完了竞品横向对比表，大家要记住：我们给家长做对比的时候，核心抓手就是这三点 ——比模式、比成绩、比价格。这是我们和家长沟通线上竞品时固定的三个切入维度首先第一点：比模式\n模式本质就是上课底层逻辑，也是核桃和其他线上机构最大的差异点。\n第二点：比成绩\n这里的成绩，不只是课堂作业、随堂掌握度，重点指向考级、赛事成果、证书含金量，对应家长长期诉求 —— 科技特长生。\n大家要分清一个关键点：证书分两种，一种是行业通用、外部认可的，一种是机构自研自发证。\n我们主推 CTL、GESP，还有白名单赛事，学习内容和考点、赛纲完全对齐，有完整的备赛链路，证书在校测、特长申报中具备认可度。\n大家跟家长沟通的时候不要贬低竞品，只客观讲清楚：学的内容能不能对接主流赛考路线，这就是 “成绩” 维度的对比逻辑。我们要给家长展示的是，孩子投入时间之后，拿到的成果是有用的。\n\n第三点：比价格比价不是单纯谁便宜，而是折算单课时价值，一定要带着家长算单价，同时绑定价值去讲，不能只拼低价。\n我们核桃折算单节 60+；猿单节 80+，分期缴费；编程猫标价看着低，但是语言不通用，适配不了竞赛目标；线下单节 200-300，还有退费违约金、门店风险。\n这里重点提醒大家：比价的时候，不能孤立说我们便宜。话术逻辑是 —— 同样奔着信息学、科技特长路线，同样一套 S-P-C 完整体系，我们的单课成本更低；如果竞品价格低，但课程体系、语言、赛考不匹配家长目标，性价比其实不高。\n千万不要陷入单纯低价内卷，比价的底层是：同等目标下，谁的投入产出更高。","interact":null,"sku":"","dept":""},{"row":13,"stage":"阶段4·线上竞品对比","p":"P12","topic":"对标猿编程七维：双减转型/无图形化/封装代码/周期长/AICE 自研考级","script":"这一页我们专门对标猿编程做逐项拆解两两对照，逻辑清晰。以后给家长讲解，就按照表格里这 7 个维度依次对比：概况、语言、周期、价格、上课模式、赛考、硬件。\n\n首先是【对比概况】\n核桃 2017 年成立，原生编程起家，到现在已经深耕少儿编程赛道多年，从创立之初核心业务就是编程，所有教研、体系都是围绕编程长期打磨的。\n猿编程不一样，它不是一开始就做编程，是双减政策之后，才从原来的学科业务转型拓展出编程这条线，编程属于它后来新增的业务板块，不是根基主业。这一点，是两家底层定位最大的区别。\n\n第二，【对比语言、学习路径】\n核桃拥有图形化 Scratch→Python→C++ 完整一站式自研路径，低龄孩子先从图形化入门，平滑过渡 Python，再进阶 C++，整条链路连贯打通，孩子从启蒙到竞赛，在核桃就可以学完整套体系。\n反观猿编程，它没有图形化 Scratch 课程，直接从 Python 起步；而且 Python 用的是封装代码。这里大家要给家长讲明白封装代码是什么意思：平台提前把底层代码打包封装好，孩子只需要拖拽调用模块，并不是手写原生代码。\n直接带来两个问题：第一，孩子学的代码写法，和 GESP、CSP 等正规赛事考察的原生代码不一致，学的和考的脱节；第二，代码依赖猿自身平台环境，脱离平台之后，孩子没办法独立编写、运行程序，很难独立产出作品。而核桃全程学习通用标准代码，课堂所学和赛考考点完全一致，孩子走到任何平台，都能独立写代码、备赛。\n\n第三，【对比学习周期】\n核桃节奏紧凑、目标明确：Scratch 图形化 1 年、Python1 年、C++3 年，每阶段规划清晰，学习效率更高，稳步走完完整编程路线。\n猿编程这边，Python 就需要 2 年时间，周期更长；同时它没有明确、稳定的 C++ 完整学习周期规划。同样学到 Python 阶段，孩子在猿要花费双倍时间，时间成本更高，后续往高阶竞赛进阶也没有清晰路线。\n\n第四，【对比价格，一定要折算单节课价值】\n核桃：图形化半年 3299，折算单节课大概 60 元左右；Python 半年 4199，C++ 半年 4399，半年周期缴费。\n猿编程：Python4 个月 3198，折算单节课大约 80 元，缴费周期短、单价更高。\n横向对比，同样学习 Python，核桃单课成本更低，而且我们前面也说了，核桃是 S/P/C 全套体系，猿缺少图形化启蒙，综合性价比核桃更占优势。这里提醒大家：比价不是只看总价，一定要带着家长算单课时单价，结合课程体系一起说，不要单纯说便宜。\n\n第五，【对比上课模式】\n核桃是实操课，课堂实操占比 60% 以上，孩子当堂动手敲写代码、调试 BUG，老师实时监课，随时发现孩子卡点、及时引导，编程本身是动手学科，当堂实操才是落地掌握的关键。\n猿编程是大班直播课，一个班学员多，老师跟着全班统一进度走，很难针对单个孩子的代码问题停下来单独辅导。孩子如果跟不上、代码报错，很容易遗留问题，听懂不等于会写。\n\n第六，【对比赛考，这是升学核心】\n核桃配套的考级是 CTL、YCL、GESP，都是行业认可度很高的通用考级，同时对接白名单国家级赛事，证书在科技特长生、校测申报当中是具备参考价值的，孩子学习成果可以转化为升学加分的硬材料。\n猿编程的考级主要是 AICE，属于机构自营考级，是它自己发起认证的，外部学校、信息学圈子认可度有限，很难用来支撑科技特长规划。虽然它也有白名单赛事渠道，但是因为前期学习封装代码，所学内容和赛考原生代码不匹配，备赛衔接是断层的。\n\n第七，【对比硬件】\n核桃配套智能驾驶车 999 元，硬件兼容性、拓展性很强，可以和我们课程体系深度结合，跟着课程持续拓展学习。\n猿编程只有 Python 阶段配套机器人硬件，硬件配套的覆盖范围、拓展空间相对有限。\n\n总结下来，两家根源区别：核桃深耕编程、全套通用代码体系，学考统一、周期高效、实操落地、赛考证书认可度高；猿是转型业务，缺少图形化启蒙、Python 封装代码、单课价格更高、自研考级含金量不足。我们沟通的时候客观对比差异，不贬低竞品，只给家长讲清楚：如果目标是长期走信息学、科技特长路线，核桃的体系适配性更强。","interact":null,"sku":"","dept":""},{"row":14,"stage":"阶段4·线上竞品对比","p":"P13","topic":"猿大班直播痛点：直播不等人，测验锁定，孩子卡壳就错过作答","script":"我们看一下猿编程大班直播模式的痛点，同时对照讲清楚我们核桃实操课的优势大家先看屏幕上猿编程的课堂界面，它是典型的大班直播形式。直播课有一个核心特点：课程进度是固定的，直播不等人\n老师按照预设节奏往下讲课、发布测验，全班统一推进。如果孩子动手慢，代码还没写完、BUG 还没有调通，测验时间到了，系统就会直接锁定，就像截图提示的：老师已结束测验，不能作答。\n这个问题在编程课里影响很大。编程不是听知识点就行，是需要动手敲代码、调试验证的。孩子思路慢一点、哪里写错卡住了，没有完成当堂练习，就直接错过了这一轮作答机会，跟不上班级进度，问题就积攒下来了。直播老师要照顾整个大班几十名学生，不可能单独停下来，等咱们一个孩子把代码调试完成，只能继续往下走。\n\n我们对比核桃的实操课模式，逻辑完全不一样：\n我们课堂是以孩子实操为核心，不是老师单向讲课为主。实操课的节奏跟着孩子的完成情况走，老师后台实时查看每一个孩子的代码页面，能第一时间看到谁报错、谁卡住。孩子写不完、调不通的时候，老师可以及时介入引导，等孩子完成这一段实操任务，再进入下一个学习环节，不会出现直接锁题、跟不上就错过练习的情况。\n\n这里给大家划一个沟通重点，以后和家长讲的时候把握好分寸：\n我们不是否定直播课，直播课适合自律强、动手速度快、基础很好的孩子。但大部分学编程的孩子，尤其是低龄、新手，写代码很容易卡壳。大班直播这种统一节奏，对动手能力一般、容易卡顿的孩子非常不友好，听懂和独立写出代码之间的差距，直播模式很难补上。\n而编程学习，当堂动手、当堂调对、当堂吸收才是关键，这就是我们实操课和大班直播最本质的区别。\n\n简单来说，猿的大班直播：节奏跟着老师走，进度不等待孩子；核桃实操课：节奏跟着孩子实操情况走，老师盯每一个孩子的代码落地，保证当堂的练习能闭环。来看一道题，猿大班直播最大的痛点是什么？","interact":{"q":"猿大班直播最大的痛点是什么？","at":"P13","options":["老师数量太少，经常约不上课","没有课程回放，缺课就补不了","网速太慢，画面经常卡顿","直播不等人——孩子卡壳就错过当堂作答"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":15,"stage":"阶段4·线上竞品对比","p":"P14","topic":"核桃课程模式展示（实操课）","script":"我们一起来看看核桃的课程模式吧","interact":null,"sku":"","dept":"","video":"video/P14.mp4"},{"row":16,"stage":"阶段4·线上竞品对比","p":"P15","topic":"对比语言：封装代码只能在猿平台使用，限制性强","script":"猿辅导的代码是封装代码，不是标准的代码库，只能使用猿辅导的平台去做程序，有限制性。学生脱离了猿编程的平台就无法自己编写代码，编写程序。\n所学非所用，所学非所考，如果要考试的话，还要转到通用的代码语言。在核桃学习，无论未来哪个平台孩子都是可以用的，但是猿编程只能在自己的平台使用。","interact":null,"sku":"","dept":""},{"row":17,"stage":"阶段4·线上竞品对比","p":"P16","topic":"2024 GESP 考试真题：课堂练习代码=考试要考的代码","script":"这一页我们要把刚刚讲的 “标准代码” 落到实处，用GESP 真题来印证，让大家清楚为什么我们坚持教原生标准 Python。\n\n大家看页面，左边是核桃课堂里孩子手写练习的代码，右边是往年 GESP 官方考试真题。大家可以直观看到：核桃课上练习的语法、结构、写法，和 GESP 试卷里的代码完全是同一套标准 Python 语法。\n这里用到的 input()、int()、for 循环、if 判断、取模%，都是 Python 原生基础语法，也是 GESP、CSP-J 这类信息学赛事固定考察内容，没有任何平台自定义封装函数。\n\n结合上一页猿编程的封装代码，我们形成完整对比：\n猿编程大量使用平台专属封装库，代码语法是平台定制的，在 GESP 这类统考里根本不会出现。孩子长期练修改参数、调用封装函数，没有机会独立写循环、判断、取模这些核心考点，等到去参加 GESP 考试，看到真题这种原生代码题型，会非常陌生，相当于平时练的和考卷考的两套东西。\n\n而核桃的逻辑是：课堂练习代码 等于考试要考的代码。\n我们日常课堂实操训练，直接对标 GESP 的出题风格、语法体系、考点。孩子平时敲的每一段代码，就是以后考级、竞赛试卷上会出现的形式。孩子不用额外再换一套体系重新适应，学习和备考是一体的，学的内容直接可以拿去应对考级。\n\n这里给大家划沟通重点，跟家长讲解的时候这样表达：\n很多家长以为学了 Python 就能考 GESP，其实不是，关键看学的是哪一种 Python。如果学的是平台封装好的专属函数，只是改参数，孩子熟悉的只是这个平台，不是 Python 本身；只有学通用标准原生代码，才能无缝对接 GESP、CSP 这类正规信息学考试。","interact":null,"sku":"","dept":""},{"row":18,"stage":"阶段4·线上竞品对比","p":"P17","topic":"对比赛考成绩：NOI 机构榜第一；晋级不等于获奖","script":"先看左边这张 2026 NOI 信奥赛机构排名表，核桃编程排在第一位，金银铜牌的获奖数量在同行里面遥遥领先；猿编程在这份榜单里，复赛获奖数据是空白。\n\n再看中间和右侧两张喜报截图，对比两家对外发布的 CSP 喜报：\n猿编程对外公布的，大多只有初赛晋级的数据，很少放出复赛的获奖名单，图里标注的 “复赛全军覆没”，本质就是：很多孩子能通过初赛，但是到复赛阶段拿不到奖项。\n而核桃这边，我们可以清晰看到完整的复赛喜报，2024 年 CSP-J/S 复赛晋级总人数高达 1176 人，获奖学员覆盖全国 30 个赛区，初赛、复赛的成果都有完整数据支撑。\n\n猿长期使用封装代码教学，孩子熟悉的是平台专属函数，缺少标准代码的深度训练。所以很多孩子卡在复赛：初赛靠基础常识能过关，但复赛考察手写代码、算法逻辑的时候，能力跟不上。\n而核桃从底层就教标准 Python、C++ 原生代码，全程对标 GESP、CSP 的考点，配套完整的备赛体系，所以初赛晋级之后，复赛的晋级转化能力更强，这也是我们能拿到这么多复赛晋级、在 NOI 机构榜排名第一的核心原因。\n\n大家沟通注意分寸：我们不直接否定对方初赛的成果，客观区分初赛和复赛价值。跟家长讲清楚一个关键点：晋级不等于获奖，我们要看的，是能不能拿到有含金量的复赛奖项。来看一道题，初赛晋级就等于拿到有含金量的奖项吗？","interact":{"q":"初赛晋级就等于拿到有含金量的奖项吗？","at":"P17","options":["不是——初赛只是复赛门票，复赛奖项才有含金量","是——进了初赛就等于获奖","是——初赛的含金量比复赛更高","初赛复赛都没有证书"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":19,"stage":"阶段4·线上竞品对比","p":"P18","topic":"NOI/CSP 数据对标：金17银38铜17 合计72；CSP 复赛 1176 人","script":"这张表格把 NOI、CSP-J/S 两个含金量最高的信息学赛事的数据做了清晰对标，我们可以直接量化两家赛考成果的差距，和前面课程、语言的差异形成闭环印证。\n\n我们先看 2025 年 NOI 全国决赛：\n核桃编程一共拿下金牌 17 人、银牌 38 人、铜牌 17 人，合计获奖 72 人；猿编程在 NOI 决赛晋级人数为 0。NOI 是国内信奥最高级别赛事，能拿到国赛奖牌，代表机构的高阶教研、备赛体系是成熟完整的。\n\n再看 2024 年 CSP-J/S：\n核桃这边有完整、透明的复赛晋级明细：CSP-J 组晋级 887 人，CSP-S 组晋级 289 人，复赛晋级合计 1176 人猿编程对外只发布初赛晋级的人数，没有公开复赛的具体人数。这里大家要记住一个关键点：初赛只是拿到复赛门票，晋级不等于拿奖；真正对科技特长生有用、能用于校测申报的，是复赛奖项。很多孩子初赛可以晋级，但复赛很难拿到证书。表格里也标注了一个行业普遍情况：初赛晋级人数，往往是复赛晋级人数的两倍左右。\n核桃从 Python 阶段就对标 GESP 标准语法，C++ 体系完整，全程重实操、练算法，整套课程就是朝着 CSP、NOI 的考点去设计的，所以不仅初赛晋级率可观，复赛晋级转化能力也很强，高阶国赛也持续产出奖牌学员。\n和家长介绍的时候，不要直接下否定结论，客观区分两个概念：初赛晋级资格、复赛晋级证书。很多机构会拿初赛晋级数据做宣传，但我们要帮家长看懂：如果目标是科技特长，复赛晋级含金量更高","interact":null,"sku":"","dept":""},{"row":20,"stage":"阶段4·线上竞品对比","p":"P19","topic":"对比价格：猿 C1-C8 拉长周期 vs 核桃路径直达","script":"前面我们对比了课程模式、代码体系、赛考成果，我们接下来看阶段规划、学习周期背后的性价比，也是家长比价时我们重点拆解的地方。\n\n大家先看左边猿编程的 C 系列 Python 路线：Python 板块一共设置了 C1 到 C8，整整 8 个阶段。阶段拆分很细，拉长了整体学习周期。\n它的底层是封装式教学，前期上手简单、进度慢，孩子需要很长时间，才能过渡到标准算法和竞赛内容。周期拉长之后，总的课时、学费累计下来，整体投入会更高。\n\n再看右侧核桃 P1 的 Python 规划：我们同样覆盖 Python 基础、语法、算法、赛考考点，但是课程体系更凝练，分层清晰，Lv1-Lv6 有序推进，直接对标 GESP、CTL 这类考级和竞赛考点。\n我们教的是原生标准 Python，孩子每节课都在积累真实的代码逻辑，不需要在封装语法上花费大量过渡时间，能用更少的阶段，抵达竞赛备赛的能力要求。\n\n这里要给大家讲清楚比价的核心逻辑：\n家长比价，不要只看单节课单价，要看学到同等竞赛能力，一共需要走多少阶段、花多少总费用猿 8 个阶段才走完 Python 整条线，而且前面大量是封装代码内容，学到后面还要重新补标准语法，相当于多走一段弯路；核桃体系直接对标赛考标准，路径直达，没有多余过渡内容，达成同样的目标，学习周期更短，整体投入更划算。\n\n沟通分寸提醒：\n我们不说对方贵，而是帮家长区分：阶段数量不等于学到的能力。有的机构把内容拆碎拉长，阶段看着多，但前期大量是平台专属封装内容，不是竞赛认可的标准代码。看着课时多，有效备考的内容占比反而低。","interact":null,"sku":"","dept":""},{"row":21,"stage":"阶段4·线上竞品对比","p":"P20","topic":"量化拆解：课时/单课时费（约70 vs 约84）/赛考交付/完整周期","script":"接下来结合真实客户沟通记录，从课时、单课时费、赛考交付、完整学习周期做量化拆解，破解家长比价时容易踩的误区。\n\n先看左侧聊天截图，是猿编程真实客户沟通记录：猿 C1‑C8 完整 Python8 个阶段，整体总花费 3‑3.5 万，周期长达 3 年；核桃完整 Python 仅 2 个阶段 1 年，总投入 1 万以内。\n\n\n一、课时 & 费用维度拆解\n核桃编程：合计 60 课时，含软硬件课时 44 节 + 4 课时 OJ 赛考 + 12 课时专属赛考专项；单期报名 4199 元，折算单课时约 69.98 元；赛考专项、OJ 刷题全部计入课时，无额外付费。\n2. 猿编程：单期 38 课时（32 直播课 + 6 课时 AI 互动思维课），单期报名 3198 元，折算单课时 84.15 元；单期不含系统赛考专项，完整走完 8 阶段 3 年周期总投入达 4 万 +。\n\n沟通重点：比价不能只看单期单价，要算全周期总投入、有效课时占比。猿单期总价看似低，但阶段拆分细碎拉长周期，叠加总花费为核桃 3 倍以上；核桃将备赛刷题全部内置课时，有效学习占比更高。\n\n二、赛考交付核心差异1. 核桃编程： 3 个月交付 CTL 官方考级能力、6 个月白名单国家级赛事能力；均为行业通用官方认证，原生标准 Python 语法与赛考考点完全对齐，循序渐进夯实基础再备赛，复赛晋级转化有完整支撑。\n2. 猿编程 3 个月交付自营 AICE 考级、4 个月 AILD 提前灌输赛考知识能力；AICE 为机构自研证书外部认可度有限；提前讲赛考属于拔苗助长，前期以封装代码教学未夯实原生语法，因此标注 “获奖率低”，仅接触赛考概念很难拿到有效复赛奖项。\n\n注意沟通分寸：不否定对方有赛考内容，客观区分：有赛考课不等于拿高含金量奖项，超前灌输不等于底层基础扎实。","interact":null,"sku":"","dept":""},{"row":22,"stage":"阶段5·线下对比与物料","p":"P21","topic":"章节页：线下五维——比师资/比教学/比效果/比赛考/比价格","script":"接下来，我们切换赛道 ——看一下和线下机构做对比\n\n跟线上竞品对比，我们核心是比课程体系、原生代码、赛考成果、性价比；\n但面对线下机构，家长关心的维度完全不一样，我们就围绕这 5 个核心维度去拆解：\n比师资比教学\n比效果比赛考\n比价格\n\n很多家长天然会觉得：线下看得见教室、看得见老师，肯定更稳妥。我们不是否定线下，而是带着家长，拿着这 5 个标尺，客观去衡量，避开线下机构常见的坑。来看一道题，线下机构对比的五个维度不包括？","interact":{"q":"线下机构对比的五个维度不包括？","at":"P21","options":["比师资——是否有竞赛方向的老师","比教学——课程体系是否连贯","比赛考——出证和备赛节奏","比门店装修——环境越豪华越好"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":23,"stage":"阶段5·线下对比与物料","p":"P22","topic":"线下对比表：400+教研/一年4张证书 vs 三年才考一级/单价150+","script":"这张表格就是我们刚刚说的五大维度，把核桃和线下机构做了清晰对照，我们一条一条拆开讲，方便大家给家长讲解。\n\n首先是师资\n核桃背后是 400 人以上的专职教研团队，课程、赛考体系统一打磨、持续更新；而线下门店最大的痛点就是信奥方向的名师非常稀缺。很多线下老师是机器人、乐高老师转岗，很少有长期深耕 CSP、NOI 算法竞赛的专职师资，老师个人能力上限，直接决定孩子能走多远。\n\n第二点，教学体系\n核桃是一套完整闭环，从图形化 Scratch 到 Python 再到 C++，考级、备赛一站式打通；很多线下机构主打机器人搭建，软件编程只是附带，没有系统、连贯的代码学习路线，搭建玩得多，正经的软编、算法内容断层，很难往竞赛方向走。\n\n第三点，课堂效果\n核桃课堂实操占比达到 60%，孩子每节课有充足时间自己敲代码、调试 bug；线下班经常出现老师赶进度、讲得多，孩子上手写代码时间很少，看着坐满一节课，动手实操不足，听懂了但写不出来。\n\n第四点，学习效率\n跟着核桃体系，学习一年具备4张国家级证书竞赛水平；很多线下节奏很慢，常常学三年才考一个级别，周期拉得很长，容易消磨孩子兴趣，规划节奏跟不上科技特长的时间窗口。\n\n第五点，价格：\n核桃 Python 半年 4199，图形化半年 3299；线下同等编程内容，单课时普遍 150 元以上，整体费用要贵几倍。很多家长以为线下看得见更值，算下来性价比差距很大。\n\n沟通注意：不要全盘否定线下。可以这样开场：“线下的优势是环境看得见，但咱们要看师资是不是竞赛方向、课程能不能连贯学代码、孩子动手时间够不够、多久能拿到有效证书，还有长期的花费。”\n简单总结：线下缺稳定竞赛师资、课程容易重搭建轻编程、实操偏少、进度慢、单价更高；核桃有大教研团队支撑，体系连贯、实操充足、出证备赛节奏快，成本也更友好。","interact":null,"sku":"","dept":""},{"row":24,"stage":"阶段5·线下对比与物料","p":"P23","topic":"线下经营风险：童程童美家书、退费拖延四个多月","script":"接下来看一下线下机构的经营稳定性风险，同时配上真实家长的选择反馈。\n\n左边这部分是童程童美的公开家书和家长聊天记录，给大家拆解两个核心痛点：\n第一，经营风险。很多线下门店房租、人力成本很高，很容易遇到经营压力。一旦机构现金流出问题，就会出现退费难、拖退费的情况。截图里这位家长，退费被拖延了四个多月，钱一直没法顺利退回。孩子学编程是长期规划，少则一年、多则两三年，如果机构不稳定，中途停课、闭店，孩子的学习节奏直接断掉，前面的规划全部打乱。\n第二，课程偏向问题。大家看家长原话：之前一直学运动模块、齿轮搭建。这就是我们上一页说的，很多线下重心放在机器人搭建，软件编程、代码竞赛路线偏弱，和咱们家长想要走信奥、科技特长的目标不匹配。\n\n再看右侧家长的对话，这是非常优质的沟通切入点：\n很多已经对比过线下的家长，自己得出结论：Scratch、Python 其实没必要线下学。不少家长身边朋友都选择核桃，是家长之间互相推荐、口碑流转过来的。家长也直白反馈线下的问题：时间拖拉、效果达不到、价格还贵。\n\n沟通分寸提醒（重点！）：\n我们不要去恶意踩其他机构，不造谣抹黑。话术逻辑是客观提示风险：\n“线下门店有场地，体验感是一方面，但编程是长期学习，咱们除了看课堂，也要考虑机构的稳定性。一旦遇到闭店、退费纠纷，耽误的是孩子的备赛时间。很多对比过线下的家长，最后也会转回线上系统课。”\n\n总结：线下机构除了前面说的师资、体系、性价比短板，还额外存在经营不稳定、退费难的风险；很多真实家长亲身对比后，也会认可：Scratch、Python 这类代码学习，线上成熟体系，效率和稳定性反而更好，这也是核桃家长转介绍多的原因。","interact":null,"sku":"","dept":""},{"row":25,"stage":"阶段5·线下对比与物料","p":"P24","topic":"线下隐藏问题：路线杂乱偏搭建、孩子多易互相抄代码","script":"这是真实家长的反馈，帮我们把线下另外两个很容易被忽略的问题讲透：课程路线杂乱、课堂纪律干扰。\n\n先看左边家长原话：一开始报课只当兴趣，线下先学乐高积木、机器人搭建，兜兜转转一年多，才接触图形化编程。\n这就印证了我们上一张对比表的点：很多线下机构主线是机器人搭建，代码编程只是附带内容，路线混杂，进度拖沓。孩子大量时间花在拼积木上，真正敲代码、练逻辑的时间很少，家长想走科技特长、信奥路线的话，节奏会严重滞后，家长才会觉得 “亏、浪费时间”。\n\n右下角还有一条反馈，非常真实：线下班里孩子多，容易交头接耳，互相抄代码。编程这门课核心是独立思考、自己调试 bug。一旦养成抄代码的习惯，孩子就很难建立独立的代码思维，看着课堂坐满了，学习效果大打折扣。\n\n话术参考：“很多家长一开始都会优先选线下，但是学一段时间会发现，线下很多课前期大量在积木搭建，切入代码很慢；而且班里面孩子多，容易互相干扰，甚至直接抄旁边同学的代码，不利于独立思考。咱们核桃的路线是直奔编程逻辑，Scratch-Python-C++ 连贯推进，每节课孩子独立实操，老师单独盯每个孩子的代码，保证是自己动手写。”。来看一道题，线下班「互相抄代码」最大的危害是什么？","interact":{"q":"线下班「互相抄代码」最大的危害是什么？","at":"P24","options":["影响教室的卫生和秩序","老师的课堂不好管理","孩子难以建立独立的代码思维","电脑设备容易损坏"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":26,"stage":"阶段5·线下对比与物料","p":"P25","topic":"常用竞品话术物料库（飞书链接支撑）","script":"那在后续大家带班的过程当中，我们也会有超强的物料库去给大家去做出支撑点，大家都是可以再去用的。如果想不起来，记不住了，不知道咋和家长说了，可以去翻一翻物料，我们照着物料跟家长去说也是可以的。","interact":null,"sku":"","dept":""},{"row":27,"stage":"阶段5·线下对比与物料","p":"P26","topic":"结束页：学习不息，成长不止","script":"加油","interact":null,"sku":"","dept":""},{"row":28,"stage":"阶段5·线下对比与物料","p":"P27","topic":"飞书扫码（问卷）","script":"请用飞书扫码哦~","interact":null,"sku":"","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"阶段1测试题","q":"本次内训包含的四个板块是？【多选】","options":[{"k":"A","t":"竞品需知"},{"k":"B","t":"竞品处理流程"},{"k":"C","t":"常见竞品对比"},{"k":"D","t":"常用竞品对比思路"},{"k":"E","t":"竞品退费规则"}],"answer":"ABCD","back":"","sku":""},{"id":"T-S02","type":"阶段练习题","chapter":"阶段1测试题","q":"成交三性中，竞品分析重点讲的是？","options":[{"k":"A","t":"唯一性——为什么选核桃而不是别家"},{"k":"B","t":"重要性——为什么要学少儿编程"},{"k":"C","t":"紧迫性——为什么现在就要学"},{"k":"D","t":"时效性——什么时候能学完"}],"answer":"A","back":"","sku":""},{"id":"T-S03","type":"阶段练习题","chapter":"阶段1测试题","q":"重要性、紧迫性是所有编程机构都能讲的内容，真正拉开差距、促成选择的是唯一性。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-S04","type":"阶段练习题","chapter":"阶段1测试题","q":"「唯一性」要回答家长的问题是？","options":[{"k":"A","t":"为什么要学少儿编程"},{"k":"B","t":"为什么现在就要开始学"},{"k":"C","t":"凭什么选我们，而不是别家"},{"k":"D","t":"学编程要花多少钱"}],"answer":"C","back":"","sku":""},{"id":"T-S05","type":"阶段练习题","chapter":"阶段1测试题","q":"给家长分析竞品时，为了突出优势可以适当拉踩对手。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":""},{"id":"T-S06","type":"阶段练习题","chapter":"阶段2测试题","q":"家长主动向你询问竞品问题，说明什么？","options":[{"k":"A","t":"家长完全没有意向"},{"k":"B","t":"家长有意向了解，正在对比选择"},{"k":"C","t":"家长在故意刁难"},{"k":"D","t":"家长已经决定退费"}],"answer":"B","back":"","sku":""},{"id":"T-S07","type":"阶段练习题","chapter":"阶段2测试题","q":"竞品处理流程三步的正确顺序是？","options":[{"k":"A","t":"倾听竞品→直接分析区别→再夸赞理念"},{"k":"B","t":"客观分析→夸赞理念→倾听竞品"},{"k":"C","t":"直接分析区别→问对比机构→夸赞理念"},{"k":"D","t":"理解认可夸赞理念→倾听了解竞品→客观分析区别"}],"answer":"D","back":"","sku":""},{"id":"T-S08","type":"阶段练习题","chapter":"阶段2测试题","q":"为什么一定要问清家长对比的是哪家机构？","options":[{"k":"A","t":"知道对手是谁，才能有效解决家长的问题"},{"k":"B","t":"方便登记在表格里"},{"k":"C","t":"为了给竞品打电话核实"},{"k":"D","t":"为了向主管汇报工作量"}],"answer":"A","back":"","sku":""},{"id":"T-S09","type":"阶段练习题","chapter":"阶段2测试题","q":"家长主动提到竞品，说明家长没有意向学编程，可以直接放弃跟进。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":""},{"id":"T-S10","type":"阶段练习题","chapter":"阶段3测试题","q":"猿编程 Python 的核心问题是什么？","options":[{"k":"A","t":"手写原生代码，难度太大"},{"k":"B","t":"直播课节奏太快跟不上"},{"k":"C","t":"封装代码——学的和竞赛考察的原生代码不一样"},{"k":"D","t":"没有任何编程语言可选"}],"answer":"C","back":"","sku":""},{"id":"T-S11","type":"阶段练习题","chapter":"阶段3测试题","q":"编程猫 Kitten 语言的核心问题是？","options":[{"k":"A","t":"是行业通用的标准语言，赛事都认可"},{"k":"B","t":"平台自创语言，无法对接 GESP、CSP 赛事"},{"k":"C","t":"只能在苹果电脑上安装使用"},{"k":"D","t":"收费是全行业最贵的一款"}],"answer":"B","back":"","sku":""},{"id":"T-S12","type":"阶段练习题","chapter":"阶段3测试题","q":"西瓜创客 C++ 课程的问题是？","options":[{"k":"A","t":"全部由自有研发团队把控"},{"k":"B","t":"只教图形化不教代码"},{"k":"C","t":"只面向高中生开放"},{"k":"D","t":"外包团队承接，体系稳定性、连贯性弱"}],"answer":"D","back":"","sku":""},{"id":"T-S13","type":"阶段练习题","chapter":"阶段3测试题","q":"核桃课程体系的核心特点是？","options":[{"k":"A","t":"Scratch/Python/C++ 全自研，一站式对标信息学路径"},{"k":"B","t":"三种语言全部外包给第三方，没有一门自研"},{"k":"C","t":"只有一门图形化语言，不教 Python 和 C++"},{"k":"D","t":"主推平台自创语言，无法对接主流赛考"}],"answer":"A","back":"","sku":""},{"id":"T-S14","type":"阶段练习题","chapter":"阶段3测试题","q":"线下机构的学习特点是？","options":[{"k":"A","t":"纯代码路线，循序渐进"},{"k":"B","t":"直接从 C++ 竞赛开始"},{"k":"C","t":"软硬件穿插学习，内容零散，没有连贯进阶"},{"k":"D","t":"全部线上直播授课"}],"answer":"C","back":"","sku":""},{"id":"T-S15","type":"阶段练习题","chapter":"阶段4测试题","q":"线上竞品对比的三个抓手是？","options":[{"k":"A","t":"比规模、比装修、比赠品"},{"k":"B","t":"比模式、比成绩、比价格"},{"k":"C","t":"比老师、比教材、比教室"},{"k":"D","t":"比成立时间、比融资、比广告"}],"answer":"B","back":"","sku":""},{"id":"T-S16","type":"阶段练习题","chapter":"阶段4测试题","q":"猿编程的出身背景是？","options":[{"k":"A","t":"原生编程机构，创立即做少儿编程"},{"k":"B","t":"硬件厂商转型做编程"},{"k":"C","t":"线下门店起家，后来才做线上"},{"k":"D","t":"学科类起家，双减后转型拓展出编程业务"}],"answer":"D","back":"","sku":""},{"id":"T-S17","type":"阶段练习题","chapter":"阶段4测试题","q":"封装代码直接带来的两个问题是？【多选】","options":[{"k":"A","t":"学的代码写法和 GESP、CSP 考察的原生代码不一致"},{"k":"B","t":"依赖平台环境，脱离平台无法独立编写程序"},{"k":"C","t":"语法太简单，孩子学得太快"},{"k":"D","t":"报名费比核桃便宜一半"}],"answer":"AB","back":"","sku":""},{"id":"T-S18","type":"阶段练习题","chapter":"阶段4测试题","q":"猿大班直播的核心痛点是？","options":[{"k":"A","t":"直播不等人——孩子卡壳，测验到点直接锁定"},{"k":"B","t":"老师会单独停下来等每个孩子"},{"k":"C","t":"一个班只有几个孩子"},{"k":"D","t":"全程一对一辅导"}],"answer":"A","back":"","sku":""},{"id":"T-S19","type":"阶段练习题","chapter":"阶段4测试题","q":"猿封装代码的平台限制是？","options":[{"k":"A","t":"任何平台都能直接使用"},{"k":"B","t":"可以无缝对接 GESP 考试"},{"k":"C","t":"只能在猿平台使用，脱离平台无法编写程序"},{"k":"D","t":"和核桃的代码完全通用"}],"answer":"C","back":"","sku":""},{"id":"T-S20","type":"阶段练习题","chapter":"阶段4测试题","q":"核桃课堂代码与 GESP 真题的关系是？","options":[{"k":"A","t":"完全不同，考前要换一套体系"},{"k":"B","t":"同一套标准 Python 语法，课堂所学=考试所考"},{"k":"C","t":"只在封装函数上重合"},{"k":"D","t":"课堂代码比真题简单得多"}],"answer":"B","back":"","sku":""},{"id":"T-S21","type":"阶段练习题","chapter":"阶段4测试题","q":"「晋级不等于获奖」的正确理解是？","options":[{"k":"A","t":"初赛晋级就等于拿了奖"},{"k":"B","t":"初赛比复赛的含金量更高"},{"k":"C","t":"复赛没有证书"},{"k":"D","t":"初赛只是复赛门票，复赛奖项才有含金量"}],"answer":"D","back":"","sku":""},{"id":"T-S22","type":"阶段练习题","chapter":"阶段4测试题","q":"2024 年 CSP-J/S 核桃复赛晋级数据是？","options":[{"k":"A","t":"J 组晋级 887 人 + S 组晋级 289 人，合计 1176 人"},{"k":"B","t":"J 组晋级 289 人 + S 组晋级 887 人，合计 500 人"},{"k":"C","t":"合计 887 人"},{"k":"D","t":"复赛获奖数据未公开"}],"answer":"A","back":"","sku":""},{"id":"T-S23","type":"阶段练习题","chapter":"阶段4测试题","q":"猿 C 系列 Python 的规划特点是？","options":[{"k":"A","t":"两个阶段就能走完，直达竞赛赛道"},{"k":"B","t":"全程都是原生标准代码的训练"},{"k":"C","t":"C1-C8 八个阶段，周期长、封装内容多、总投入高"},{"k":"D","t":"学习周期与核桃完全一致"}],"answer":"C","back":"","sku":""},{"id":"T-S24","type":"阶段练习题","chapter":"阶段4测试题","q":"核桃与猿的单课时对比是？","options":[{"k":"A","t":"核桃约 84 元/节，猿约 70 元/节"},{"k":"B","t":"核桃约 70 元/节，猿约 84 元/节"},{"k":"C","t":"两者完全相同"},{"k":"D","t":"核桃约 200 元/节"}],"answer":"B","back":"","sku":""},{"id":"T-S25","type":"阶段练习题","chapter":"阶段5测试题","q":"线下机构对比的五个维度是？","options":[{"k":"A","t":"比环境、比装修、比位置、比停车、比餐食"},{"k":"B","t":"比成立时间、比门店数量、比注册资本"},{"k":"C","t":"比老师学历、比教室面积、比电脑数量"},{"k":"D","t":"比师资、比教学、比效果、比赛考、比价格"}],"answer":"D","back":"","sku":""},{"id":"T-S26","type":"阶段练习题","chapter":"阶段5测试题","q":"核桃教研团队的规模是？","options":[{"k":"A","t":"400 人以上的专职教研团队"},{"k":"B","t":"40 人左右的兼职团队"},{"k":"C","t":"没有专职教研团队"},{"k":"D","t":"教研全部外包"}],"answer":"A","back":"","sku":""},{"id":"T-S27","type":"阶段练习题","chapter":"阶段5测试题","q":"核桃与线下的学习效率对比是？","options":[{"k":"A","t":"线下一年考四级，核桃三年一级"},{"k":"B","t":"两者出证速度完全一样"},{"k":"C","t":"核桃一年具备 4 张国家级证书竞赛水平；线下三年才考一级"},{"k":"D","t":"核桃没有考级安排"}],"answer":"C","back":"","sku":""},{"id":"T-S28","type":"阶段练习题","chapter":"阶段5测试题","q":"线下机构的经营风险是？","options":[{"k":"A","t":"没有任何经营方面的风险"},{"k":"B","t":"门店成本高，可能出现退费难、拖退费甚至闭店"},{"k":"C","t":"只存在师资方面的风险"},{"k":"D","t":"只有线上机构才有经营风险"}],"answer":"B","back":"","sku":""},{"id":"T-S29","type":"阶段练习题","chapter":"阶段5测试题","q":"线下班的两个隐藏问题是？","options":[{"k":"A","t":"硬件太先进 + 软件太难"},{"k":"B","t":"上课时间太长 + 内容太深"},{"k":"C","t":"老师太多 + 班级太小"},{"k":"D","t":"课程路线杂乱偏搭建 + 孩子多易互相抄代码"}],"answer":"D","back":"","sku":""},{"id":"T-S30","type":"阶段练习题","chapter":"阶段5测试题","q":"后续带班过程中忘记竞品话术，应该怎么办？","options":[{"k":"A","t":"翻竞品物料库，照着物料给家长讲"},{"k":"B","t":"凭感觉贬低竞品"},{"k":"C","t":"直接不回应家长"},{"k":"D","t":"让家长自己去了解"}],"answer":"A","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题","chapter":"全章章节测试题","q":"成交三性的完整逻辑是？","options":[{"k":"A","t":"唯一性→重要性→紧迫性"},{"k":"B","t":"先比价格→再讲紧迫→最后讲重要"},{"k":"C","t":"重要性解决「要不要学」→紧迫性打消拖延→唯一性回答凭什么选我们"},{"k":"D","t":"先讲紧迫性→再讲唯一性→最后讲重要性"}],"answer":"C","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题","chapter":"全章章节测试题","q":"竞品处理流程的第一步是？","options":[{"k":"A","t":"客观分析两家区别"},{"k":"B","t":"理解认可，夸赞家长的教育理念"},{"k":"C","t":"直接报出核桃价格"},{"k":"D","t":"让家长自己回去对比"}],"answer":"B","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题","chapter":"全章章节测试题","q":"猿、编程猫、西瓜的语言类别对应正确的是？","options":[{"k":"A","t":"猿-Kitten 自创；编程猫-C 外包；西瓜-原生 Python"},{"k":"B","t":"猿-图形化起家；编程猫-封装 Python；西瓜-硬件为主"},{"k":"C","t":"三家都是原生标准代码"},{"k":"D","t":"猿-封装 Python；编程猫-Kitten 自创；西瓜-C 外包"}],"answer":"D","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题","chapter":"全章章节测试题","q":"核桃的学习周期规划是 Scratch 1 年、Python 1 年、C++ 3 年，每阶段目标明确。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题","chapter":"全章章节测试题","q":"比价的底层逻辑是？","options":[{"k":"A","t":"同等目标下，看谁的投入产出更高"},{"k":"B","t":"谁的报价低就选谁"},{"k":"C","t":"只看单期总价"},{"k":"D","t":"谁的赠品多就选谁"}],"answer":"A","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题","chapter":"全章章节测试题","q":"核桃与猿编程的根源区别是？","options":[{"k":"A","t":"核桃成立时间更晚，行业经验更少"},{"k":"B","t":"两者定位完全相同，没有区别"},{"k":"C","t":"核桃深耕编程、全套通用代码体系；猿是转型业务、封装代码"},{"k":"D","t":"猿的编程体系比核桃更加完整"}],"answer":"C","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题","chapter":"全章章节测试题","q":"平台封装代码会出现在 GESP 这类统考里吗？","options":[{"k":"A","t":"会——封装代码就是考试内容"},{"k":"B","t":"不会——统考考察的是原生标准代码"},{"k":"C","t":"偶尔会考一小部分"},{"k":"D","t":"统考不考代码"}],"answer":"B","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题","chapter":"全章章节测试题","q":"2025 年 NOI 全国决赛核桃的获奖数据是？","options":[{"k":"A","t":"金牌 7 人、银牌 8 人、铜牌 7 人，合计 22 人"},{"k":"B","t":"晋级人数为 0"},{"k":"C","t":"数据未公开"},{"k":"D","t":"金牌 17 人、银牌 38 人、铜牌 17 人，合计 72 人"}],"answer":"D","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题","chapter":"全章章节测试题","q":"家长比价时，除了单课时单价还要看什么？","options":[{"k":"A","t":"学到同等竞赛能力需要走的阶段数和总费用"},{"k":"B","t":"只看报名费的打折力度，越便宜越好"},{"k":"C","t":"只看赠品数量的多少，越多越划算"},{"k":"D","t":"只看老师数量的多少，人多更靠谱"}],"answer":"A","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题","chapter":"全章章节测试题","q":"猿单期与核桃单期的量化对比是？","options":[{"k":"A","t":"猿 60 课时 4199 元；核桃 38 课时 3198 元"},{"k":"B","t":"两者单课时完全一致"},{"k":"C","t":"猿 38 课时 3198 元约 84 元/节；核桃 60 课时 4199 元约 70 元/节"},{"k":"D","t":"核桃单课时更高"}],"answer":"C","back":"","sku":""},{"id":"T-F11","type":"本章综合测试题","chapter":"全章章节测试题","q":"线下机构的主要短板包括？【多选】","options":[{"k":"A","t":"信奥方向的稳定竞赛师资稀缺"},{"k":"B","t":"课程重搭建轻编程，体系断层"},{"k":"C","t":"实操偏少、进度慢、单价更高"},{"k":"D","t":"师资全部来自大厂算法工程师"}],"answer":"ABC","back":"","sku":""},{"id":"T-F12","type":"本章综合测试题","chapter":"全章章节测试题","q":"和线下机构对比时的沟通分寸是？","options":[{"k":"A","t":"直接说线下机构都要倒闭"},{"k":"B","t":"客观提示风险，不恶意踩、不造谣抹黑"},{"k":"C","t":"承诺线下一定学不出效果"},{"k":"D","t":"贬低线下老师和门店"}],"answer":"B","back":"","sku":""}],"timing":{"P01":{"sents":["各位老师，大家好。","今天这节课，我们一起来学习竞品分析。\n","为什么新人必须学这块内容。","咱们日常的工作场景里，不管是首次和家长沟通咨询，还是后期进入续报阶段，竞品对比类问题是高频异议。","很多家长之前已经带孩子体验过别家少儿编程课，或者正在多家机构之间做选择，很容易直接问：核桃编程和别的机构比，差别在哪？\n\n","刚上手的时候，一听到这类问题很容易慌：要么不知道怎么回答，下意识去贬低对手；","要么讲不出咱们产品独有的亮点，只能笼统说我们更好，家长听完没有感知，信任很难建立。\n\n","所以我们学习竞品分析，核心目标不是去背一堆竞品的缺点，更不是主动去踩其他机构。","而是先熟悉市面上同类产品的特点，当家长主动提起对比的时候，我们可以做到客观、理性地拆解差异，站在孩子学习需求的角度，帮家长理清不同课程的适配人群，顺理成章讲清楚核桃编程的优势，打消家长的顾虑。\n","只有我们自己吃透竞品、吃透自家产品，面对家长的对比提问，回答才稳、才有说服力。"],"durs":[2.424,3.912,2.808,10.392,12.384,7.944,8.784,8.328,20.256,8.424]},"P02":{"sents":["在这节课开始之前我们需要知道的一个背景是：在双减之下学科是一直处在弱化的形势，现在当前大量兴起的是编程，众多的机构都加入了编程的课程；","像学某思双减后加入了编程、某猿之前主做学科的也是因为双减加入了编程。","但并不是当家长提及到竞品的时候，而用我们的主观意识去告知家长一定要选择我们，而是我们要客观的分析给家长我们之间有哪些不同之处，包括对应的细节点有哪些不同，这才是让我们所取了解的。","那这节课我们也分成了四个板块，以下几个内容01/竞品需知\n","02/竞品处理流程\n","03/常见竞品对比\n","04/常用竞品对比思路"],"durs":[13.992,7.512,17.4,6,2.472,2.64,3.048]},"P03":{"sents":["先来看第一个板块竞品需知，是大家需要知道遇到竞品的时候，我们给家长说的时候所用到的思路。"],"durs":[9.024]},"P05":{"sents":["这块儿需要给大家说的一个点是，我们在给家长分析竞品的时候一定是客观的分析并不是疯狂的去拉踩对方，诋毁对方，所以我们要有流程，客观的进行分析。"],"durs":[13.608]},"P07":{"sents":["那在这个开始之前呢，可以去思考一个问题，就是当家长向你主动的去询问关于竞品问题的时候，你认为这个家长他是否是有意向的呢？","大家觉得家长说我不报还是说我去其他家报，哪个更有学习编程的意识\n\n","那既然家长能向你去提出关于竞品的一些问题的比如说：“老师我想再去考虑一下，我想再去看看其他的机构或者是直接向你提出了老师我觉得你们的课程模式像是在看动画片等相关问题。","那这个时候他其实是有一定是有意向想要去了解的，无非现在就是想要去对比一下，那家长既然有了想要去了解的想法，我们先要去主动夸赞家长的教育理念好，也说明提前是给孩子进行编程学习的规划。","那我们对于家长表示完理解和认可之后，接下来要询问的就是，对比的是哪一家的一个机构，我们要知道我们的一个对手是谁，这样的话呢，我们才可以有效的去解决家长的一个问题。","如果不问的话，你把这个家长追到天涯海角都不知道你在和谁对比。\n","如果你和这个家长聊了半天，到最后我也没有询问到底是在和那家机构对比？","这样明显就是在做无用功，在浪费你和家长的时间。\n","那当然，在我们最后向家长了解到了，他在对比的竞品信息。","要注意的是第一：刚才在前面说了，我们也不要去疯狂地去拉踩对方，而是我们要用客观的事实去给家长去讲我们的优势，给家长进行客观的分析，为什么要去选择核桃，为什么孩子一定要在核桃去学习。"],"durs":[11.664,6.552,16.536,17.832,15.12,6.24,6.936,5.184,5.784,18.192]},"P08":{"sents":["第三个板块的话呢，我们来去看一下常见的一个竞品对比。"],"durs":[5.016]},"P10":{"sents":["第四个部分的话给大家讲的是常用的竞品话术。","在这一块的话呢会带着大家统一去梳理一下解决竞品的思路，即使后续遇到被问到的竞品，也不会不知道从哪些方面去给家长去讲。"],"durs":[4.584,11.616]},"P13":{"sents":["我们看一下猿编程大班直播模式的痛点，同时对照讲清楚我们核桃实操课的优势大家先看屏幕上猿编程的课堂界面，它是典型的大班直播形式。","直播课有一个核心特点：课程进度是固定的，直播不等人\n","老师按照预设节奏往下讲课、发布测验，全班统一推进。","如果孩子动手慢，代码还没写完、BUG 还没有调通，测验时间到了，系统就会直接锁定，就像截图提示的：老师已结束测验，不能作答。\n","这个问题在编程课里影响很大。","编程不是听知识点就行，是需要动手敲代码、调试验证的。","孩子思路慢一点、哪里写错卡住了，没有完成当堂练习，就直接错过了这一轮作答机会，跟不上班级进度，问题就积攒下来了。","直播老师要照顾整个大班几十名学生，不可能单独停下来，等咱们一个孩子把代码调试完成，只能继续往下走。\n\n","我们对比核桃的实操课模式，逻辑完全不一样：\n","我们课堂是以孩子实操为核心，不是老师单向讲课为主。","实操课的节奏跟着孩子的完成情况走，老师后台实时查看每一个孩子的代码页面，能第一时间看到谁报错、谁卡住。","孩子写不完、调不通的时候，老师可以及时介入引导，等孩子完成这一段实操任务，再进入下一个学习环节，不会出现直接锁题、跟不上就错过练习的情况。\n\n","这里给大家划一个沟通重点，以后和家长讲的时候把握好分寸：\n","我们不是否定直播课，直播课适合自律强、动手速度快、基础很好的孩子。","但大部分学编程的孩子，尤其是低龄、新手，写代码很容易卡壳。","大班直播这种统一节奏，对动手能力一般、容易卡顿的孩子非常不友好，听懂和独立写出代码之间的差距，直播模式很难补上。\n","而编程学习，当堂动手、当堂调对、当堂吸收才是关键，这就是我们实操课和大班直播最本质的区别。\n\n","简单来说，猿的大班直播：节奏跟着老师走，进度不等待孩子；","核桃实操课：节奏跟着孩子实操情况走，老师盯每一个孩子的代码落地，保证当堂的练习能闭环。","来看一道题，猿大班直播最大的痛点是什么？"],"durs":[12.936,5.616,5.736,12.528,3.336,5.64,11.424,10.248,4.344,5.4,10.824,14.136,5.88,7.128,6.456,11.784,10.104,6.288,9.264,4.224]},"P14":{"sents":["我们一起来看看核桃的课程模式吧"],"durs":[3.504]},"P15":{"sents":["猿辅导的代码是封装代码，不是标准的代码库，只能使用猿辅导的平台去做程序，有限制性。","学生脱离了猿编程的平台就无法自己编写代码，编写程序。\n","所学非所用，所学非所考，如果要考试的话，还要转到通用的代码语言。","在核桃学习，无论未来哪个平台孩子都是可以用的，但是猿编程只能在自己的平台使用。"],"durs":[8.952,5.856,6.864,8.424]},"P21":{"sents":["接下来，我们切换赛道 ——看一下和线下机构做对比\n\n","跟线上竞品对比，我们核心是比课程体系、原生代码、赛考成果、性价比；\n","但面对线下机构，家长关心的维度完全不一样，我们就围绕这 5 个核心维度去拆解：\n","比师资比教学\n","比效果比赛考\n","比价格\n\n","很多家长天然会觉得：线下看得见教室、看得见老师，肯定更稳妥。","我们不是否定线下，而是带着家长，拿着这 5 个标尺，客观去衡量，避开线下机构常见的坑。","来看一道题，线下机构对比的五个维度不包括？"],"durs":[5.016,7.824,7.464,2.088,2.016,1.872,6.72,8.736,4.464]},"P25":{"sents":["那在后续大家带班的过程当中，我们也会有超强的物料库去给大家去做出支撑点，大家都是可以再去用的。","如果想不起来，记不住了，不知道咋和家长说了，可以去翻一翻物料，我们照着物料跟家长去说也是可以的。"],"durs":[9.504,9.432]},"P26":{"sents":["加油"],"durs":[1.872]},"P04":{"sents":["我们今天进入竞品须知板块，核心就是成交三性：重要性、紧迫性、唯一性，也是我们跟家长沟通时最核心的一套逻辑。\n\n","首先第一个，重要性：为什么要学少儿编程？\n","我们要先给家长讲明白少儿编程本身的价值。","编程不是单纯教孩子敲代码，核心是锻炼孩子的逻辑思维、拆解问题、试错思考的能力，同时对接信息时代的素养，还有 CTL、GESP 这类权威赛事、科技特长生的升学规划路径，这是编程这件事本身的价值，先让家长认可 “学编程这件事是有意义的”。\n\n","第二个，紧迫性：为什么现在就要学？\n","认可价值之后，我们要告诉家长不能一直观望、拖延。","孩子的思维黄金窗口期是有限的，低龄阶段更容易建立思维习惯；","而且赛事、升学规划都有对应的时间节点，越往后，孩子课业压力越来越大，时间会越来越紧张，起步晚了，准备周期就不够。","所以不是以后学不学，而是要抓住当下合适的阶段开始。\n\n","前面这两点，是所有编程机构都能讲的，竞品一样会跟家长说。","那我们真正拉开差距、打动家长、促成选择的，就是第三点，也是今天的重点 ——唯一性：为什么选择核桃编程？\n","别的机构能讲编程的好处、能说要趁早学，但核桃有我们独有的优势。","我们深耕少儿在线编程多年，有完整从 Scratch 到 C++ 的进阶体系，配套标准化实操课程、赛事辅导、专业的教研和服务，主打重实操，不是单纯看动画、背概念；","同时我们的课程体系、学情跟进、赛考规划是成熟闭环，是专门适配孩子长期编程成长的。\n","简单说：很多地方都能学编程，但核桃是更专业、体系更完整、更适合孩子稳步走竞赛和素养路线的选择，这就是我们的不可替代性。\n\n","总结一下三性的逻辑：先靠重要性解决家长 “要不要学” 的疑问，再用紧迫性打消家长 “以后再说” 的拖延心态，最后用我们核桃独有的唯一性，回答家长 “凭什么选我们，而不是别家”，这也是我们课导在和家长沟通时，贯穿全程的底层思路。","来看一道题，竞品需知板块，重点讲的是成交三性中的哪一性？"],"durs":[11.304,4.56,4.2,23.904,3.936,5.448,6.456,12,5.616,6.144,10.296,6.72,15.984,9.168,12.744,20.616,6.408]},"P06":{"sents":["进入第二部分竞品处理的流程是什么~"],"durs":[3.792]},"P09":{"sents":["接下来我们结合这张对比表，从 6 个维度，帮大家客观看看市面上主流编程机构的区别，方便咱们结合孩子目标做选择。\n\n","首先第一块，我们先看机构背景和起家根基。\n","先看成立时间：编程猫 2015 年成立，是这几家里面最早的，本身也是编程起家；","核桃编程 2017 年成立，同样从创立之初就专注少儿编程赛道，是原生做编程的机构。\n","很多家长听过猿辅导，名气很大，这个我们完全认可。","但大家要区分一点：猿辅导本身是学科类起家，编程只是它拓展出来的一个分支业务，不是核心主业。","而且猿辅导 Python 是封装代码，简单说就是把底层代码提前封装好了，孩子只是调用模块，学的内容和竞赛要考察的原生代码不一样。","一旦离开它这个学习平台，孩子很难独立写出完整程序。\n","再看编程猫，虽然起步早，但是它主推 Kitten 自研语言，这个语言属于平台自创，并不是行业通用编程语言，没办法对接 GESP、CSP 这类主流信息学赛事，后续孩子想打竞赛、走科技特长路线，这套语言是用不上的。\n","西瓜创客这边，它的 C++ 课程是外包团队承接的，课程研发不是自有团队把控，整套 C++ 体系的稳定性、连贯性会弱一些。\n","线下机构的特点是软硬件穿插学习，今天接触乐高硬件、明天学一点软件编程，内容比较零散，没有循序渐进、长期连贯的进阶学习路线。\n","而核桃编程，Scratch 图形化、Python、C++ 全部都是自研体系，一条路线贯通，专门对标信息学学习路径。\n\n","第二点，整套课程体系\n","核桃是真正一站式闭环：Scratch→Python→C++，从低龄启蒙，到后期冲刺竞赛、科技特长生，一条路线可以一直学下去，规划清晰。\n","其他机构都有明显短板：要么编程语言不通用，要么高阶 C++ 外包、要么硬件软件穿插打乱节奏，很难支撑孩子从启蒙到竞赛的完整长期规划。\n\n","第三点，我们来看学习周期，也就是孩子要花多久学完。\n","大家看表格里核桃的节奏：Scratch 1 年，Python 1 年，C++ 3 年，整体节奏规划紧凑合理，每一个阶段目标明确。\n","对比竞品：猿、编程猫、西瓜，整体学习周期都比核桃更长。","线下机构耗时是最久的，很多孩子光 Scratch+Python 就要学 6 年左右，周期拉得很长，等到想往 C++ 进阶的时候，时间非常紧张，甚至很多线下班根本不开稳定的 C++ 竞赛班，孩子很难走到竞赛阶段，时间成本很高。\n\n","第四块，费用和退费风险，我们折算成单节课来看会更直观。\n","核桃折算下来单节课只要 60 多块。","猿辅导单节课折算 80 多，而且是按阶段缴费，长期下来成本更高。\n","编程猫表面看报价低，但刚刚咱们提到，它的 Kitten 语言不通用，没法对接竞赛，看着便宜，但是匹配不了咱们走特长、打比赛的目标，性价比就要打折扣。\n","线下机构单节价格普遍 200-300 元，单价高出非常多。","同时线下退费协议里一般都设置了退费违约金。","大家可以联想一下线下的健身、舞蹈兴趣班，一旦中途想退费，流程麻烦、限制多，还会有门店经营、闭店的风险，资金风险比线上更大。\n\n","第五点上课模式核桃是实操课。","很多家长可能会好奇，什么是实操课？","简单说，上课全程孩子自己动手敲代码、调试程序，老师全程在线实时监测每个孩子的屏幕、学习状态，孩子卡壳、写错代码的时候，老师能够及时发现、针对性引导，孩子是边做边学。\n","猿辅导是大班直播课，一个班孩子很多，老师要跟着全班进度走。","如果咱们家孩子一个地方卡住了，老师很难单独停下来，专门等孩子、单独讲解，跟不上就容易掉队。\n","编程猫、西瓜创客是 AI 双师模式，AI 录播为主，非常考验孩子自觉性。","孩子听懂与否、有没有理解，老师没法实时看到，有问题必须孩子主动提问才能得到解答，被动的孩子很容易积攒问题。\n","线下虽然是面对面授课，但少儿编程专业师资比较稀缺，老师水平参差不齐，师资稳定性很难保证。\n\n","第六点，也是很多家长最关心的：赛考、考级，也就是升学含金量\n","核桃这边，对接 CTL、GESP 这类认可度高、官方主流的考级，同时也有白名单国家级赛事资源，证书是信息学圈认可的，能够对接科技特长生规划。\n","猿辅导、西瓜创客主推自家自研考级，这类证书属于机构内部认证，外面认可度低，后续升学、报名校测的时候很难被认可。","编程猫和线下机构的赛考配套比较零散，没有完整的考级 + 赛事晋升路线，很难支撑孩子长期竞赛规划。\n\n","最后总结一下：不是说别的机构不好，每家定位不一样。","如果咱们只是想让孩子简单体验、玩一玩，选择会很多；","但如果咱们目标很明确，想走信息学、科技特长生，需要一套连贯、通用、对接正规赛事，从启蒙一直学到 C++ 竞赛的体系，核桃这套一站式方案会更适配咱们孩子。","来看一道题，猿编程 Python 的核心问题是什么？"],"durs":[11.328,4.608,7.992,8.64,5.52,9.408,12.888,5.304,20.808,12.936,13.248,10.944,2.832,13.056,13.752,5.616,10.752,6.624,20.808,6.192,3.888,7.032,14.256,5.856,4.92,13.176,3.48,3.792,18.072,6.336,9.456,7.608,11.424,9.912,6.816,15.432,12.336,10.104,5.28,5.52,16.032,5.016]},"P11":{"sents":["刚刚我们看完了竞品横向对比表，大家要记住：我们给家长做对比的时候，核心抓手就是这三点 ——比模式、比成绩、比价格。","这是我们和家长沟通线上竞品时固定的三个切入维度首先第一点：比模式\n","模式本质就是上课底层逻辑，也是核桃和其他线上机构最大的差异点。\n","第二点：比成绩\n","这里的成绩，不只是课堂作业、随堂掌握度，重点指向考级、赛事成果、证书含金量，对应家长长期诉求 —— 科技特长生。\n","大家要分清一个关键点：证书分两种，一种是行业通用、外部认可的，一种是机构自研自发证。\n","我们主推 CTL、GESP，还有白名单赛事，学习内容和考点、赛纲完全对齐，有完整的备赛链路，证书在校测、特长申报中具备认可度。\n","大家跟家长沟通的时候不要贬低竞品，只客观讲清楚：学的内容能不能对接主流赛考路线，这就是 “成绩” 维度的对比逻辑。","我们要给家长展示的是，孩子投入时间之后，拿到的成果是有用的。\n\n","第三点：比价格比价不是单纯谁便宜，而是折算单课时价值，一定要带着家长算单价，同时绑定价值去讲，不能只拼低价。\n","我们核桃折算单节 60+；","猿单节 80+，分期缴费；","编程猫标价看着低，但是语言不通用，适配不了竞赛目标；","线下单节 200-300，还有退费违约金、门店风险。\n","这里重点提醒大家：比价的时候，不能孤立说我们便宜。","话术逻辑是 —— 同样奔着信息学、科技特长路线，同样一套 S-P-C 完整体系，我们的单课成本更低；","如果竞品价格低，但课程体系、语言、赛考不匹配家长目标，性价比其实不高。\n","千万不要陷入单纯低价内卷，比价的底层是：同等目标下，谁的投入产出更高。"],"durs":[11.712,7.272,6.816,2.256,11.832,8.904,13.968,11.136,6.168,11.856,2.904,3.12,5.664,5.304,5.424,11.64,8.088,7.656]},"P12":{"sents":["这一页我们专门对标猿编程做逐项拆解两两对照，逻辑清晰。","以后给家长讲解，就按照表格里这 7 个维度依次对比：概况、语言、周期、价格、上课模式、赛考、硬件。\n\n","首先是【对比概况】\n","核桃 2017 年成立，原生编程起家，到现在已经深耕少儿编程赛道多年，从创立之初核心业务就是编程，所有教研、体系都是围绕编程长期打磨的。\n","猿编程不一样，它不是一开始就做编程，是双减政策之后，才从原来的学科业务转型拓展出编程这条线，编程属于它后来新增的业务板块，不是根基主业。","这一点，是两家底层定位最大的区别。\n\n","第二，【对比语言、学习路径】\n","核桃拥有图形化 Scratch→Python→C++ 完整一站式自研路径，低龄孩子先从图形化入门，平滑过渡 Python，再进阶 C++，整条链路连贯打通，孩子从启蒙到竞赛，在核桃就可以学完整套体系。\n","反观猿编程，它没有图形化 Scratch 课程，直接从 Python 起步；","而且 Python 用的是封装代码。","这里大家要给家长讲明白封装代码是什么意思：平台提前把底层代码打包封装好，孩子只需要拖拽调用模块，并不是手写原生代码。\n","直接带来两个问题：第一，孩子学的代码写法，和 GESP、CSP 等正规赛事考察的原生代码不一致，学的和考的脱节；","第二，代码依赖猿自身平台环境，脱离平台之后，孩子没办法独立编写、运行程序，很难独立产出作品。","而核桃全程学习通用标准代码，课堂所学和赛考考点完全一致，孩子走到任何平台，都能独立写代码、备赛。\n\n","第三，【对比学习周期】\n","核桃节奏紧凑、目标明确：Scratch 图形化 1 年、Python1 年、C++3 年，每阶段规划清晰，学习效率更高，稳步走完完整编程路线。\n","猿编程这边，Python 就需要 2 年时间，周期更长；","同时它没有明确、稳定的 C++ 完整学习周期规划。","同样学到 Python 阶段，孩子在猿要花费双倍时间，时间成本更高，后续往高阶竞赛进阶也没有清晰路线。\n\n","第四，【对比价格，一定要折算单节课价值】\n","核桃：图形化半年 3299，折算单节课大概 60 元左右；","Python 半年 4199，C++ 半年 4399，半年周期缴费。\n","猿编程：Python4 个月 3198，折算单节课大约 80 元，缴费周期短、单价更高。\n","横向对比，同样学习 Python，核桃单课成本更低，而且我们前面也说了，核桃是 S/P/C 全套体系，猿缺少图形化启蒙，综合性价比核桃更占优势。","这里提醒大家：比价不是只看总价，一定要带着家长算单课时单价，结合课程体系一起说，不要单纯说便宜。\n\n","第五，【对比上课模式】\n","核桃是实操课，课堂实操占比 60% 以上，孩子当堂动手敲写代码、调试 BUG，老师实时监课，随时发现孩子卡点、及时引导，编程本身是动手学科，当堂实操才是落地掌握的关键。\n","猿编程是大班直播课，一个班学员多，老师跟着全班统一进度走，很难针对单个孩子的代码问题停下来单独辅导。","孩子如果跟不上、代码报错，很容易遗留问题，听懂不等于会写。\n\n","第六，【对比赛考，这是升学核心】\n","核桃配套的考级是 CTL、YCL、GESP，都是行业认可度很高的通用考级，同时对接白名单国家级赛事，证书在科技特长生、校测申报当中是具备参考价值的，孩子学习成果可以转化为升学加分的硬材料。\n","猿编程的考级主要是 AICE，属于机构自营考级，是它自己发起认证的，外部学校、信息学圈子认可度有限，很难用来支撑科技特长规划。","虽然它也有白名单赛事渠道，但是因为前期学习封装代码，所学内容和赛考原生代码不匹配，备赛衔接是断层的。\n\n","第七，【对比硬件】\n","核桃配套智能驾驶车 999 元，硬件兼容性、拓展性很强，可以和我们课程体系深度结合，跟着课程持续拓展学习。\n","猿编程只有 Python 阶段配套机器人硬件，硬件配套的覆盖范围、拓展空间相对有限。\n\n","总结下来，两家根源区别：核桃深耕编程、全套通用代码体系，学考统一、周期高效、实操落地、赛考证书认可度高；","猿是转型业务，缺少图形化启蒙、Python 封装代码、单课价格更高、自研考级含金量不足。","我们沟通的时候客观对比差异，不贬低竞品，只给家长讲清楚：如果目标是长期走信息学、科技特长路线，核桃的体系适配性更强。"],"durs":[6.312,10.824,2.472,14.64,14.352,3.768,3.312,19.08,6.336,3.6,12.216,11.568,10.368,10.896,2.712,12.96,5.184,5.544,10.752,4.512,6.84,7.848,9.12,16.92,10.128,2.688,17.712,10.488,6.12,3.672,20.28,13.296,10.632,2.256,11.568,8.712,12,9.24,12.744]},"P16":{"sents":["这一页我们要把刚刚讲的 “标准代码” 落到实处，用GESP 真题来印证，让大家清楚为什么我们坚持教原生标准 Python。\n\n","大家看页面，左边是核桃课堂里孩子手写练习的代码，右边是往年 GESP 官方考试真题。","大家可以直观看到：核桃课上练习的语法、结构、写法，和 GESP 试卷里的代码完全是同一套标准 Python 语法。\n","这里用到的 input()、int()、for 循环、if 判断、取模%，都是 Python 原生基础语法，也是 GESP、CSP-J 这类信息学赛事固定考察内容，没有任何平台自定义封装函数。\n\n","结合上一页猿编程的封装代码，我们形成完整对比：\n","猿编程大量使用平台专属封装库，代码语法是平台定制的，在 GESP 这类统考里根本不会出现。","孩子长期练修改参数、调用封装函数，没有机会独立写循环、判断、取模这些核心考点，等到去参加 GESP 考试，看到真题这种原生代码题型，会非常陌生，相当于平时练的和考卷考的两套东西。\n\n","而核桃的逻辑是：课堂练习代码 等于考试要考的代码。\n","我们日常课堂实操训练，直接对标 GESP 的出题风格、语法体系、考点。","孩子平时敲的每一段代码，就是以后考级、竞赛试卷上会出现的形式。","孩子不用额外再换一套体系重新适应，学习和备考是一体的，学的内容直接可以拿去应对考级。\n\n","这里给大家划沟通重点，跟家长讲解的时候这样表达：\n","很多家长以为学了 Python 就能考 GESP，其实不是，关键看学的是哪一种 Python。","如果学的是平台封装好的专属函数，只是改参数，孩子熟悉的只是这个平台，不是 Python 本身；","只有学通用标准原生代码，才能无缝对接 GESP、CSP 这类正规信息学考试。"],"durs":[11.304,9.216,11.208,17.592,4.968,9.552,18.528,5.448,7.512,6.744,8.904,5.28,8.376,9.576,8.088]},"P18":{"sents":["这张表格把 NOI、CSP-J/S 两个含金量最高的信息学赛事的数据做了清晰对标，我们可以直接量化两家赛考成果的差距，和前面课程、语言的差异形成闭环印证。\n\n","我们先看 2025 年 NOI 全国决赛：\n","核桃编程一共拿下金牌 17 人、银牌 38 人、铜牌 17 人，合计获奖 72 人；","猿编程在 NOI 决赛晋级人数为 0。","NOI 是国内信奥最高级别赛事，能拿到国赛奖牌，代表机构的高阶教研、备赛体系是成熟完整的。\n\n","再看 2024 年 CSP-J/S：\n","核桃这边有完整、透明的复赛晋级明细：CSP-J 组晋级 887 人，CSP-S 组晋级 289 人，复赛晋级合计 1176 人猿编程对外只发布初赛晋级的人数，没有公开复赛的具体人数。","这里大家要记住一个关键点：初赛只是拿到复赛门票，晋级不等于拿奖；","真正对科技特长生有用、能用于校测申报的，是复赛奖项。","很多孩子初赛可以晋级，但复赛很难拿到证书。","表格里也标注了一个行业普遍情况：初赛晋级人数，往往是复赛晋级人数的两倍左右。\n","核桃从 Python 阶段就对标 GESP 标准语法，C++ 体系完整，全程重实操、练算法，整套课程就是朝着 CSP、NOI 的考点去设计的，所以不仅初赛晋级率可观，复赛晋级转化能力也很强，高阶国赛也持续产出奖牌学员。\n","和家长介绍的时候，不要直接下否定结论，客观区分两个概念：初赛晋级资格、复赛晋级证书。","很多机构会拿初赛晋级数据做宣传，但我们要帮家长看懂：如果目标是科技特长，复赛晋级含金量更高"],"durs":[15.576,3.912,8.256,4.104,9.888,3.792,19.32,6.912,5.88,4.848,8.208,22.416,9.504,10.152]},"P19":{"sents":["前面我们对比了课程模式、代码体系、赛考成果，我们接下来看阶段规划、学习周期背后的性价比，也是家长比价时我们重点拆解的地方。\n\n","大家先看左边猿编程的 C 系列 Python 路线：Python 板块一共设置了 C1 到 C8，整整 8 个阶段。","阶段拆分很细，拉长了整体学习周期。\n","它的底层是封装式教学，前期上手简单、进度慢，孩子需要很长时间，才能过渡到标准算法和竞赛内容。","周期拉长之后，总的课时、学费累计下来，整体投入会更高。\n\n","再看右侧核桃 P1 的 Python 规划：我们同样覆盖 Python 基础、语法、算法、赛考考点，但是课程体系更凝练，分层清晰，Lv1-Lv6 有序推进，直接对标 GESP、CTL 这类考级和竞赛考点。\n","我们教的是原生标准 Python，孩子每节课都在积累真实的代码逻辑，不需要在封装语法上花费大量过渡时间，能用更少的阶段，抵达竞赛备赛的能力要求。\n\n","这里要给大家讲清楚比价的核心逻辑：\n","家长比价，不要只看单节课单价，要看学到同等竞赛能力，一共需要走多少阶段、花多少总费用猿 8 个阶段才走完 Python 整条线，而且前面大量是封装代码内容，学到后面还要重新补标准语法，相当于多走一段弯路；","核桃体系直接对标赛考标准，路径直达，没有多余过渡内容，达成同样的目标，学习周期更短，整体投入更划算。\n\n","沟通分寸提醒：\n","我们不说对方贵，而是帮家长区分：阶段数量不等于学到的能力。","有的机构把内容拆碎拉长，阶段看着多，但前期大量是平台专属封装内容，不是竞赛认可的标准代码。","看着课时多，有效备考的内容占比反而低。"],"durs":[12.864,9.432,4.08,10.08,6.192,20.184,14.184,3.84,20.376,10.848,2.016,6.312,9.768,4.392]},"P22":{"sents":["这张表格就是我们刚刚说的五大维度，把核桃和线下机构做了清晰对照，我们一条一条拆开讲，方便大家给家长讲解。\n\n","首先是师资\n","核桃背后是 400 人以上的专职教研团队，课程、赛考体系统一打磨、持续更新；","而线下门店最大的痛点就是信奥方向的名师非常稀缺。","很多线下老师是机器人、乐高老师转岗，很少有长期深耕 CSP、NOI 算法竞赛的专职师资，老师个人能力上限，直接决定孩子能走多远。\n\n","第二点，教学体系\n","核桃是一套完整闭环，从图形化 Scratch 到 Python 再到 C++，考级、备赛一站式打通；","很多线下机构主打机器人搭建，软件编程只是附带，没有系统、连贯的代码学习路线，搭建玩得多，正经的软编、算法内容断层，很难往竞赛方向走。\n\n","第三点，课堂效果\n","核桃课堂实操占比达到 60%，孩子每节课有充足时间自己敲代码、调试 bug；","线下班经常出现老师赶进度、讲得多，孩子上手写代码时间很少，看着坐满一节课，动手实操不足，听懂了但写不出来。\n\n","第四点，学习效率\n","跟着核桃体系，学习一年具备4张国家级证书竞赛水平；","很多线下节奏很慢，常常学三年才考一个级别，周期拉得很长，容易消磨孩子兴趣，规划节奏跟不上科技特长的时间窗口。\n\n","第五点，价格：\n","核桃 Python 半年 4199，图形化半年 3299；","线下同等编程内容，单课时普遍 150 元以上，整体费用要贵几倍。","很多家长以为线下看得见更值，算下来性价比差距很大。\n\n","沟通注意：不要全盘否定线下。","可以这样开场：“线下的优势是环境看得见，但咱们要看师资是不是竞赛方向、课程能不能连贯学代码、孩子动手时间够不够、多久能拿到有效证书，还有长期的花费。”\n","简单总结：线下缺稳定竞赛师资、课程容易重搭建轻编程、实操偏少、进度慢、单价更高；","核桃有大教研团队支撑，体系连贯、实操充足、出证备赛节奏快，成本也更友好。"],"durs":[10.656,1.896,7.992,5.664,13.488,2.424,8.76,13.968,2.52,8.04,11.448,2.472,5.976,11.544,2.136,6.888,7.008,5.976,3.384,15.48,9.528,8.304]},"P23":{"sents":["接下来看一下线下机构的经营稳定性风险，同时配上真实家长的选择反馈。\n\n","左边这部分是童程童美的公开家书和家长聊天记录，给大家拆解两个核心痛点：\n","第一，经营风险。","很多线下门店房租、人力成本很高，很容易遇到经营压力。","一旦机构现金流出问题，就会出现退费难、拖退费的情况。","截图里这位家长，退费被拖延了四个多月，钱一直没法顺利退回。","孩子学编程是长期规划，少则一年、多则两三年，如果机构不稳定，中途停课、闭店，孩子的学习节奏直接断掉，前面的规划全部打乱。\n","第二，课程偏向问题。","大家看家长原话：之前一直学运动模块、齿轮搭建。","这就是我们上一页说的，很多线下重心放在机器人搭建，软件编程、代码竞赛路线偏弱，和咱们家长想要走信奥、科技特长的目标不匹配。\n\n","再看右侧家长的对话，这是非常优质的沟通切入点：\n","很多已经对比过线下的家长，自己得出结论：Scratch、Python 其实没必要线下学。","不少家长身边朋友都选择核桃，是家长之间互相推荐、口碑流转过来的。","家长也直白反馈线下的问题：时间拖拉、效果达不到、价格还贵。\n\n","沟通分寸提醒（重点！","）：\n","我们不要去恶意踩其他机构，不造谣抹黑。","话术逻辑是客观提示风险：\n","“线下门店有场地，体验感是一方面，但编程是长期学习，咱们除了看课堂，也要考虑机构的稳定性。","一旦遇到闭店、退费纠纷，耽误的是孩子的备赛时间。","很多对比过线下的家长，最后也会转回线上系统课。”\n\n","总结：线下机构除了前面说的师资、体系、性价比短板，还额外存在经营不稳定、退费难的风险；","很多真实家长亲身对比后，也会认可：Scratch、Python 这类代码学习，线上成熟体系，效率和稳定性反而更好，这也是核桃家长转介绍多的原因。"],"durs":[7.296,8.136,2.28,5.736,5.856,6.432,13.176,2.64,5.304,12.864,4.896,7.8,7.032,6.552,2.568,0.3,4.008,3.168,9.216,5.568,5.28,9.72,13.896]},"P24":{"sents":["这是真实家长的反馈，帮我们把线下另外两个很容易被忽略的问题讲透：课程路线杂乱、课堂纪律干扰。\n\n","先看左边家长原话：一开始报课只当兴趣，线下先学乐高积木、机器人搭建，兜兜转转一年多，才接触图形化编程。\n","这就印证了我们上一张对比表的点：很多线下机构主线是机器人搭建，代码编程只是附带内容，路线混杂，进度拖沓。","孩子大量时间花在拼积木上，真正敲代码、练逻辑的时间很少，家长想走科技特长、信奥路线的话，节奏会严重滞后，家长才会觉得 “亏、浪费时间”。\n\n","右下角还有一条反馈，非常真实：线下班里孩子多，容易交头接耳，互相抄代码。","编程这门课核心是独立思考、自己调试 bug。","一旦养成抄代码的习惯，孩子就很难建立独立的代码思维，看着课堂坐满了，学习效果大打折扣。\n\n","话术参考：“很多家长一开始都会优先选线下，但是学一段时间会发现，线下很多课前期大量在积木搭建，切入代码很慢；","而且班里面孩子多，容易互相干扰，甚至直接抄旁边同学的代码，不利于独立思考。","咱们核桃的路线是直奔编程逻辑，Scratch-Python-C++ 连贯推进，每节课孩子独立实操，老师单独盯每个孩子的代码，保证是自己动手写。”","。","来看一道题，线下班「互相抄代码」最大的危害是什么？"],"durs":[9.744,11.184,11.064,14.136,7.968,4.608,9.024,11.52,8.016,13.92,0.3,4.944]},"P27":{"sents":["请用飞书扫码哦~"],"durs":[2.184]},"P20":{"sents":["接下来结合真实客户沟通记录，从课时、单课时费、赛考交付、完整学习周期做量化拆解，破解家长比价时容易踩的误区。\n\n","先看左侧聊天截图，是猿编程真实客户沟通记录：猿 C1‑C8 完整 Python8 个阶段，整体总花费 3‑3.5 万，周期长达 3 年；","核桃完整 Python 仅 2 个阶段 1 年，总投入 1 万以内。\n\n\n","一、课时 & 费用维度拆解\n","核桃编程：合计 60 课时，含软硬件课时 44 节 + 4 课时 OJ 赛考 + 12 课时专属赛考专项；","单期报名 4199 元，折算单课时约 69.98 元；","赛考专项、OJ 刷题全部计入课时，无额外付费。\n","2. 猿编程：单期 38 课时（32 直播课 + 6 课时 AI 互动思维课），单期报名 3198 元，折算单课时 84.15 元；","单期不含系统赛考专项，完整走完 8 阶段 3 年周期总投入达 4 万 +。\n\n","沟通重点：比价不能只看单期单价，要算全周期总投入、有效课时占比。","猿单期总价看似低，但阶段拆分细碎拉长周期，叠加总花费为核桃 3 倍以上；","核桃将备赛刷题全部内置课时，有效学习占比更高。\n\n","二、赛考交付核心差异1. 核桃编程： 3 个月交付 CTL 官方考级能力、6 个月白名单国家级赛事能力；","均为行业通用官方认证，原生标准 Python 语法与赛考考点完全对齐，循序渐进夯实基础再备赛，复赛晋级转化有完整支撑。\n","2. 猿编程 3 个月交付自营 AICE 考级、4 个月 AILD 提前灌输赛考知识能力；","AICE 为机构自研证书外部认可度有限；","提前讲赛考属于拔苗助长，前期以封装代码教学未夯实原生语法，因此标注 “获奖率低”，仅接触赛考概念很难拿到有效复赛奖项。\n\n","注意沟通分寸：不否定对方有赛考内容，客观区分：有赛考课不等于拿高含金量奖项，超前灌输不等于底层基础扎实。"],"durs":[12.408,12.672,5.448,0.3,10.08,6.288,5.304,12.528,7.176,7.392,8.016,5.592,10.752,12.624,8.232,4.512,12.768,11.496]},"P17":{"sents":["先看左边这张 2026 NOI 信奥赛机构排名表，核桃编程排在第一位，金银铜牌的获奖数量在同行里面遥遥领先；","猿编程在这份榜单里，复赛获奖数据是空白。\n\n","再看中间和右侧两张喜报截图，对比两家对外发布的 CSP 喜报：\n","猿编程对外公布的，大多只有初赛晋级的数据，很少放出复赛的获奖名单，图里标注的 “复赛全军覆没”，本质就是：很多孩子能通过初赛，但是到复赛阶段拿不到奖项。\n","而核桃这边，我们可以清晰看到完整的复赛喜报，2024 年 CSP-J/S 复赛晋级总人数高达 1176 人，获奖学员覆盖全国 30 个赛区，初赛、复赛的成果都有完整数据支撑。\n\n","猿长期使用封装代码教学，孩子熟悉的是平台专属函数，缺少标准代码的深度训练。","所以很多孩子卡在复赛：初赛靠基础常识能过关，但复赛考察手写代码、算法逻辑的时候，能力跟不上。\n","而核桃从底层就教标准 Python、C++ 原生代码，全程对标 GESP、CSP 的考点，配套完整的备赛体系，所以初赛晋级之后，复赛的晋级转化能力更强，这也是我们能拿到这么多复赛晋级、在 NOI 机构榜排名第一的核心原因。\n\n","大家沟通注意分寸：我们不直接否定对方初赛的成果，客观区分初赛和复赛价值。","跟家长讲清楚一个关键点：晋级不等于获奖，我们要看的，是能不能拿到有含金量的复赛奖项。","来看一道题，初赛晋级就等于拿到有含金量的奖项吗？"],"durs":[11.136,4.704,6.672,15.312,17.784,8.352,10.368,22.152,8.04,8.568,5.208]}},"v":{"slides/P01.jpg":"c62ac71c","slides/P01.png":"a999d76d","slides/P02.jpg":"bcd2bc22","slides/P02.png":"0eb4bdf2","slides/P03.jpg":"54827d21","slides/P03.png":"1ce76a15","slides/P04.jpg":"e0cb0466","slides/P04.png":"746e0688","slides/P05.jpg":"d4278c4f","slides/P05.png":"a373f9ef","slides/P06.jpg":"c5a618eb","slides/P06.png":"523ac26a","slides/P07.jpg":"16c21fc1","slides/P07.png":"20b7fbe7","slides/P08.jpg":"20dbfa5d","slides/P08.png":"eab2cea8","slides/P09.jpg":"9f96a88a","slides/P09.png":"691aae17","slides/P10.jpg":"59f42003","slides/P10.png":"c81dd505","slides/P11.jpg":"5ab05273","slides/P11.png":"547eb504","slides/P12.jpg":"05eb994d","slides/P12.png":"f5c455bb","slides/P13.jpg":"ede56dd8","slides/P13.png":"088d5f8c","slides/P14.jpg":"6c247c59","slides/P14.png":"4f75b232","slides/P15.jpg":"289c87e7","slides/P15.png":"698e0cb8","slides/P16.jpg":"68ca0075","slides/P16.png":"ece6e09c","slides/P17.jpg":"ef670bbf","slides/P17.png":"8483ab43","slides/P18.jpg":"e8e3202e","slides/P18.png":"7dd0cb32","slides/P19.jpg":"df608e51","slides/P19.png":"f97035d5","slides/P20.jpg":"dffdefae","slides/P20.png":"a5073824","slides/P21.jpg":"30897c2c","slides/P21.png":"ad75545d","slides/P22.jpg":"a9403f55","slides/P22.png":"cf1da025","slides/P23.jpg":"f963273e","slides/P23.png":"db038c79" /* ---------- 课程结构 ---------- */

const normTag = t => String(t||'').replace(/1部/g,'一部').replace(/2部/g,'二部').replace(/苍穹鼎/g,'苍穹顶').replace(/\s/g,'');
const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return (!CFG.depts || tagOk(p.dept, st && st.depts)) && (!CFG.skus || tagOk(p.sku, st && st.skus)); }

  for (const s of STAGES) s.quiz = DATA.qs.filter(q => /阶段练习/.test(q.type) && +(/阶段\s*(\d+)/.exec(q.chapter)||[])[1] === s.num);

try { st = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e) { st = fresh(); }
buildStages();

function applyRestore(){ if(!RESTORE) return false; const o=RESTORE; RESTORE=null;
  st.sid=o.sid||st.sid; st.rowCreated=true;
  for(const i of o.passed){ if(!STAGES[i]) continue; st.passed[i]=true; STAGES[i].pages.forEach(p=>st.heard[p.p]=true); }
  st.unlocked=Math.max(st.unlocked, Math.max(-1,...o.passed)+1); Object.assign(st.best,o.best||{}); save(); return true; }

function pickRestore(n){ const o=CFG.restore&&CFG.restore[n]; if(!RESTORE&&o&&st.restoredFrom!==o.sid){ RESTORE=o; st.restoredFrom=o.sid; } }
if (st.name) pickRestore(st.name);
if (RESTORE && st.name) { applyRestore(); }

function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }

const HOOK = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/Z0UnaFjXvwZxHrhrmiFcMjSJnEd';
const pad = n => String(n).padStart(2,'0');
function nowStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function stageLabel(i){ const s = STAGES[i]; return s ? (s.name + (TITLES[s.num] ? ' ' + TITLES[s.num] : '')) : ''; }
const mins = sec => Math.round((sec||0)/6)/10;
/* 每个关卡的过程数据：play=实际播放秒数 occ=占用秒数 pn/ps=暂停次数/秒 kn/ks=卡顿次数/秒 */
function stat(k){ st.stat = st.stat || {}; return st.stat[k] = st.stat[k] || {play:0, occ:0, pn:0, ps:0, kn:0, ks:0}; }
function curKey(){ return st.view === 'quiz' ? (st.quiz === 'final' ? 'f' : st.quiz) : st.cur.s; }
function stageStatusText(k){
  if (k !== 'f' && !STAGES[k]) return '';
  const done = k === 'f' ? !!(st.final && st.final.pass) : !!st.passed[k];
  if (done) return '已完成';
  if ((st.view === 'learn' || st.view === 'quiz') && String(curKey()) === String(k)) return '进行中';
  const s = st.stat && st.stat[k];
  return s && s.occ > 0 ? '进行中' : '未开始';
}
function snapshot(online){
  const keys = Object.keys(st.stat||{}), sum = f => keys.reduce((a,k) => a + ((st.stat&&st.stat[k]&&st.stat[k][f])||0), 0);
  const play = sum('play'), occ = sum('occ');
  const sc = i => st.best[i] != null ? `${st.best[i]}/${STAGES[i].quiz.length}` : '';
  const cur = st.view === 'quiz' ? (st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz) + '·小测') : (st.view === 'learn' ? stageLabel(st.cur.s) : '课程首页');
  const cp = st.view === 'learn' ? (curPageSafe()||{}).p || '' : '';
  return {online: online || '学习中', cur_stage:(CFG.short||CFG.title)+'｜'+cur, cur_page:cp,
    st1:stageStatusText(0), st2:stageStatusText(1), st3:stageStatusText(2), st4:stageStatusText(3), stf:stageStatusText('f'),
    sc1:sc(0), sc2:sc(1), sc3:sc(2), scf: st.final ? `${st.final.score}/${FINAL.length}` : '',
    play_min:mins(play), occ_min:mins(occ), gap_min:mins(Math.max(0, occ-play)),
    pause_n:sum('pn'), pause_min:mins(sum('ps')), stall_n:sum('kn'), stall_min:mins(sum('ks')),
    relearn_n:Object.values(st.relearnCnt||{}).reduce((a,b)=>a+b,0),
    quiz_switch_n:sum('qn'), quiz_switch_min:mins(sum('qs'))};
}
/* 第二个 Webhook：学员第一次出现时，在「学员实时状态」表新建他的那一行 */
const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
// 明细表有 5 万行上限：这些动作量大、分析用不到（暂停时长等已汇总在状态快照里），不再单独记一行
const NO_LOG = new Set(['听完页面','暂停','继续播放','回到测试','学习页面(未听完)']);
function report(ev, online){
  if (!st.name) return;
  if (NO_LOG.has(ev.event) && online !== '已离开') return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid, course:CFG.short||CFG.title, date:nowStr().slice(0,10)}, ev, snapshot(online));
  { const CNm = CFG.short || CFG.title; if (!String(rec.stage||'').startsWith(CNm + '｜')) rec.stage = CNm + (rec.stage ? '｜' + rec.stage : ''); }
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}
/* 实际收听时长：只在播放时累计，按真实时间计（倍速播放不重复计） */

function curPageSafe(){ try { return STAGES[st.cur.s].pages[st.cur.p]; } catch(e) { return null; } }
let leftSent = false;
function leaveCourse(){
  if (leftSent || !st.name) return; leftSent = true;
  if (st.view === 'learn') { endPause(false); flushPage('中途离开'); }
  endQuizAway(false);
  save();
  const where = st.view === 'quiz' ? '测试中' : st.view === 'learn' ? '听课中' : '课程首页';
  bot(who() + '在' + CN + '课已离开');
  report({event:'离开课程', stage: st.view === 'home' ? '' : stageLabel(st.cur.s), page: st.view === 'learn' ? ((curPageSafe()||{}).p||'') : '', detail:`在${where}关闭或离开网页`}, '已离开');
}
// 不论停在哪个界面（含课程首页），关网页都上报「已离开」；pagehide 不触发的浏览器用 beforeunload 兜底

window.addEventListener('pageshow', e => { if (e.persisted) { leftSent = false; report({event:'进入课程', detail:'返回网页'}); } });

/* 小测中切屏：不能暂停答题，但要记录每次离开和离开多久，并提示学员 */
let quizAwayAt = null;
function quizActive(){ return st.view === 'quiz' && quizState && !quizState.result; }
function quizAwayNow(){ return document.hidden || !document.hasFocus(); }
function startQuizAway(){
  if (quizAwayAt != null || !quizActive() || !quizAwayNow()) return;
  quizAwayAt = Date.now();
  const s = stat(curKey()); s.qn = (s.qn||0) + 1;
  report({event:'测试中切屏', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`本次测试第 ${s.qn} 次切屏（${document.hidden ? '切出页面' : '切到其他窗口'}）`});
}
function endQuizAway(doReport){
  if (quizAwayAt == null) return;
  const sec = (Date.now() - quizAwayAt)/1000; quizAwayAt = null;
  const s = stat(curKey()); s.qs = (s.qs||0) + sec;
  if (doReport) report({event:'回到测试', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`离开 ${Math.round(sec)} 秒`});
  const w = $('#quizWarn'); if (w) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs)} 秒，已同步给培训老师。`; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) startQuizAway(); else if (document.hasFocus()) endQuizAway(true); });
window.addEventListener('blur', startQuizAway);
window.addEventListener('focus', () => endQuizAway(true));
setInterval(() => { if (quizActive()) { if (quizAwayNow()) startQuizAway(); else endQuizAway(true); } }, 1000);
/* 占用时长：停留在某关卡（听课或做小测）的全部时间，含暂停、切走 */
let tickAt = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min((now - tickAt)/1000, 70); tickAt = now;
  if (st.name && (st.view === 'learn' || st.view === 'quiz')) { stat(curKey()).occ += dt; if (Math.random() < 0.1) save(); }
}, 1000);
/* 暂停：学员主动暂停或切走窗口导致的暂停（翻页、听完不算） */
let navPause = false, pauseAt = null, pauseWhy = '';
function endPause(doReport){
  if (pauseAt == null) return;
  const sec = (Date.now() - pauseAt)/1000; pauseAt = null;
  stat(st.cur.s).ps += sec;
  if (doReport) report({event:'继续播放', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`暂停 ${Math.round(sec)} 秒（${pauseWhy}）`});
}
/* 卡顿：播放中因网络缓冲停住 */
let stallAt = null;
function endStall(){
  if (stallAt == null) return;
  const sec = (Date.now() - stallAt)/1000; stallAt = null;
  if (sec < 0.8) return;
  const s = stat(st.cur.s); s.kn += 1; s.ks += sec;
  report({event:'卡顿', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`缓冲卡顿 ${sec.toFixed(1)} 秒`});
}

/* ---------- 音频播放 ---------- */
const au = $('#au');
const VU = f => (DATA.remote && DATA.remote[f]) || (f + '?v=' + ((DATA.v||{})[f]||''));
const SL = p => (DATA.v||{})['slides/'+p+'.jpg'] ? VU('slides/'+p+'.jpg') : VU('slides/'+p+'.png');
const PRE = {}; function preload(p){ if(!p||PRE[p.p]) return; PRE[p.p]=1; const i=new Image(); i.src=SL(p.p); const a=new Audio(); a.preload='auto'; a.src=VU('audio/'+p.p+'.mp3'); }
let rate = 1, playing = false, pendingAfter = null;
function pageTiming(p){ return DATA.timing[p.p]; }
function sentAt(p, t){
  const tm = pageTiming(p); let acc = 0;
  for (let i=0;i<tm.durs.length;i++){ acc += tm.durs[i]; if (t < acc) return i; }
  return tm.durs.length-1;
}
au.addEventListener('timeupdate', () => {
  if (st.view !== 'learn') return;
  if (!au.paused && lastT != null) { const dt = au.currentTime - lastT; if (dt > 0 && dt < 3) { const real = dt/(au.playbackRate||1); pageSec += real; st.stageSec[st.cur.s] = (st.stageSec[st.cur.s]||0) + real; stat(st.cur.s).play += real; } }
  lastT = au.currentTime;
  const p = curPage(); const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const i = sentAt(p, au.currentTime);
  const sub = $('#sub'); if (sub && sub.dataset.i != i){ sub.dataset.i = i; sub.textContent = tm.sents[i].trim(); }
  const bar = $('#progfill'); if (bar) bar.style.width = (100*au.currentTime/total).toFixed(1)+'%';
  const tt = $('#time'); if (tt) tt.textContent = fmt(au.currentTime)+' / '+fmt(total);
});

function bot(text, force){ if (!st.name) return; if (!force && st.final && st.final.pass) return; try { fetch(BOT, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify({msg_type:'text', content:{text}})}); } catch(e) {} }
const who = () => st.name + '（' + (st.team || '未填职场') + '）';
let awayT = null, pauseT = null;

au.addEventListener('play', () => clearTimeout(pauseT));

au.addEventListener('ended', () => { if (window.REVIEW) return; playing = false; updPlayBtn(); onPageEnd(); });
au.addEventListener('pause', () => {
  playing = false; updPlayBtn(); endStall();

  if (navPause || atEnd || st.view !== 'learn') { navPause = false; return; }
  const s = stat(st.cur.s); s.pn += 1; pauseAt = Date.now(); pauseWhy = autoWhy || (document.hidden ? '切出页面自动暂停' : '主动暂停'); autoWhy = '';
  report({event:'暂停', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:pauseWhy});

au.addEventListener('play', () => { playing = true; updPlayBtn(); const v=$('#veil'); if(v) v.hidden = true; endPause(true); });
au.addEventListener('waiting', () => { if (!au.paused && au.currentTime > 0.5 && stallAt == null) stallAt = Date.now(); });  // 每页开头的首次加载不算卡顿

function fmt(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
/* 防分屏：窗口不到屏幕 80% 宽就不让播；电脑上播放时自动全屏，退出全屏就暂停 */
const IS_MOBILE = /Mobi|Android|iPhone|iPad|iPod|HarmonyOS/i.test(navigator.userAgent);
function tooSmall(){ if (document.fullscreenElement) return false; const w = window.outerWidth || window.innerWidth; return w < (screen.availWidth || screen.width) * 0.8; }
function needFS(){ return !IS_MOBILE && document.fullscreenEnabled; }
function showVeil(msg){ const v = $('#veil'); if (v) { v.hidden = false; const b = $('#veilBtn'); if (b) b.textContent = msg; } }
function play(){
  if (st.view === 'learn' && tooSmall()) { showVeil('检测到分屏或窗口太小，请把窗口最大化后点我继续'); return; }
  if (st.view === 'learn' && needFS() && !document.fullscreenElement) { try { document.documentElement.requestFullscreen().catch(() => {}); } catch(e) {} }
  au.playbackRate = rate; au.play().catch(() => { const v=$('#veil'); if(v) v.hidden=false; });
}
window.addEventListener('resize', () => { if (st.view === 'learn' && playing && tooSmall()) { autoPause('分屏或窗口太小自动暂停'); showVeil('检测到分屏或窗口太小，请把窗口最大化后点我继续'); } });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && needFS() && st.view === 'learn' && playing) { autoPause('退出全屏自动暂停'); showVeil('已退出全屏，点我继续（会自动回到全屏）'); } });
function updPlayBtn(){ const b = $('#pp'); if (b) b.textContent = playing ? '暂停' : '播放'; }

/* 切走自动暂停——防挂机。两种情况都算：
   1) 页面被隐藏（最小化、切标签页、被完全挡住）；
   2) 浏览器窗口失去焦点（点到了 WPS、微信等其他窗口，哪怕只挡住一部分） */
let autoWhy = '';

/* 兜底：个别环境 blur 不触发时，每秒检查一次窗口焦点 */
setInterval(() => { if (playing && !document.hasFocus()) autoPause('切到其他窗口自动暂停'); }, 1000);

}

  const nodes = STAGES.map((s,i) => {

// 课程锁：cfg.lock = 口令的哈希。未开放期间只有输入口令的人能进（口令存在本机，输一次即可）
const lockH = s => { let h = 2166136261; for (const c of s + '|' + CFG.key) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); };

  $('#app').innerHTML = `<section style="max-width:420px;margin:12vh auto;background:#fff;border-radius:16px;padding:28px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06)">

          <p class="rule" id="formMsg" hidden></p>
          <button class="btn" type="submit">开始学习</button></form>`}
      <p class="rule" id="resetMsg" hidden></p>
    </div>
  </section>
  ${loopHTML(-1)}
  ${mapHTML(-1)}
  <section class="card"><h3 style="font-size:16px;margin-bottom:8px">上课须知</h3>
    <ol class="steps">
      <li>请打开声音。每页 PPT 配有老师讲解，字幕同步显示讲解原文。</li>
      <li>当前页讲完才能进入下一页；切到别的窗口会自动暂停。</li>
      <li>带 ✎ 的页面讲完会弹出互动题，答错可能需要重听本页。</li>
      <li>阶段小测 5 题，答对 ${Math.ceil(5*PASS)} 题及以上过关；未过关需重学本阶段后再测。</li>
      <li>全部阶段过关后，解锁本章综合测试（${FINAL.length} 题）。</li>
      <li>你的姓名、职场、各页学习时长和测试成绩会同步给培训老师。</li>
    </ol></section>`;
  bindCommon();
  const f = $('#nameForm');
  if (f) f.onsubmit = e => { e.preventDefault();
    const v = $('#nm').value.trim(); const pick = n => [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x => x.value); if (v === '审核') { renderReview(); return; }
    let t = '', extra = '';
    if (CFG.depts) {
      const ds = pick('dept'), ks = pick('sku'), m = $('#formMsg');
      if (!v || !ds.length || (CFG.skus && !ks.length)) { m.hidden = false; m.textContent = CFG.skus ? '请填写姓名，并至少选择一个部门和一个 SKU。' : '请填写姓名，并至少选择一个部门。'; return; }
      st.depts = ds; st.skus = ks; t = ds.join('、'); extra = `｜部门：${ds.join('、')}` + (CFG.skus ? `｜SKU：${ks.join('、')}` : '');
    } else { t = $('#tm').value.trim(); if (!v || !t) return; }
    st.name = v; st.team = t; buildStages();
    if (!STAGES.length) { const m = $('#formMsg'); m.hidden = false; m.textContent = '你选择的部门 / SKU 暂时没有对应课件，请确认后重新选择。'; st.name = ''; st.depts = st.skus = null; buildStages(); return; }
    pickRestore(v); const rs = applyRestore(); save();
    report({event:'进入课程', detail:(rs?'恢复进度':'首次进入') + extra}); startStage(rs ? Math.min(st.unlocked, STAGES.length-1) : 0); };
  const r = $('#resume'); if (r) r.onclick = () => { report({event:'进入课程', detail:'继续学习'}); startStage(Math.min(st.unlocked, STAGES.length-1), true); };
  const c = $('#cert'); if (c) c.onclick = () => showQuiz('final');
  const x = $('#reset'); if (x) x.onclick = () => {
    if (x.dataset.armed){ st = fresh(); save(); buildStages(); render(); return; }
    x.dataset.armed = 1; x.textContent = '再点一次确认清空记录';
    const m = $('#resetMsg'); m.hidden = false; m.textContent = '清空后本机的学习进度和成绩都会删除。';
  };
}

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function renderLearn(autoplay){
  const s = curStage(), p = curPage();
  const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const heard = !!st.heard[p.p];
  $('#app').innerHTML = `${headerHTML()}
  ${mapHTML(st.cur.s)}
  ${loopHTML(0)}
  <div class="stage-head"><h2>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}　<span class="muted" style="font-weight:400;font-size:15px">${p.p} ${esc(p.topic)}</span></h2>
    <span class="time">第 ${st.cur.p+1} / ${s.pages.length} 页</span></div>
  <div class="slide">${p.video?`<video id="vd" src="${VU(p.video)}" poster="${SL(p.p)}" controls playsinline preload="metadata" style="width:100%;max-height:70vh;display:block;object-fit:contain;background:#000"></video>`:`<img src="${SL(p.p)}" alt="${esc(p.p+' '+p.topic)}">`}
    <div class="veil" id="veil" ${autoplay?'hidden':''}><button class="btn" id="veilBtn">▶ 点击播放讲解</button></div></div>
  <div class="sub" id="sub" aria-live="polite">${esc(tm.sents[0].trim())}</div>
  <div class="bar">

    <button class="btn" id="pp">播放</button>
    <button class="btn ghost" id="again">重听本页</button>
    <div class="prog" aria-hidden="true"><div id="progfill"></div></div>
    <span class="time" id="time">0:00 / ${fmt(total)}</span>
    <div class="speed" role="group" aria-label="语速">${[1,1.25,1.5].map(r=>`<button data-r="${r}" class="${r===rate?'on':''}">${r}x</button>`).join('')}</div>
    <button class="btn" id="next" ${heard?'':'disabled'}>${st.cur.p===s.pages.length-1?(s.quiz.length?'去做阶段小测':'完成本阶段'):'下一页'}</button>
  </div>
  <div class="dots">${s.pages.map((pg,i)=>`<button class="dot ${st.heard[pg.p]?'heard':''} ${i===st.cur.p?'now':''} ${pg.interact?'q':''}" data-pg="${i}" ${(st.heard[pg.p]||i===st.cur.p)?'':'disabled'} title="${esc(pg.topic)}">${pg.p}</button>`).join('')}</div>
  <details class="full"><summary>展开本页讲解全文</summary><p>${esc(p.script)}</p></details>`;
  bindCommon();
  delete au.dataset.retried; au.src = VU('audio/'+p.p+'.mp3');
  { const im=document.querySelector('.slide img'); if(im && !im.complete){ im.style.opacity=0; im.onload=()=>{im.style.transition='opacity .2s';im.style.opacity=1;}; im.onerror=()=>{ if(!im.dataset.r){ im.dataset.r=1; im.src=im.src+'&r='+Date.now(); } else im.style.opacity=1; }; } }
  [1].forEach(k=>preload(s.pages[st.cur.p+k])); if(st.cur.p+1>=s.pages.length) preload((STAGES[st.cur.s+1]||{pages:[]}).pages[0]);
  au.currentTime = 0; lastT = 0;
  report({event:'进入页面', stage:stageLabel(st.cur.s), page:p.p, detail:p.topic});
  $('#veilBtn').onclick = play;
  { const v = $('#vd'); if (v) v.onplay = () => au.pause(); }
  $('#pp').onclick = () => playing ? au.pause() : play();
  $('#again').onclick = () => { au.currentTime = 0; play(); };
  $('#prev').onclick = () => goPage(st.cur.p-1);
  $('#next').onclick = () => nextPage();
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => goPage(+b.dataset.pg));
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rate = +b.dataset.r; au.playbackRate = rate;
    document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on', x===b)); });
  if (autoplay) {
    // 等这一页的 PPT 图片加载完再开始讲，避免「声音在讲、画面还没出来」；最多等 8 秒
    const im = document.querySelector('.slide img');
    if (im && !im.complete) {
      let done = false; const go = () => { if (done) return; done = true; if (curPage() === p && st.view === 'learn') play(); };
      im.addEventListener('load', go, { once: true }); im.addEventListener('error', go, { once: true }); setTimeout(go, 8000);
    } else play();
  }
}
function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});
  showQuiz('final');
}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
