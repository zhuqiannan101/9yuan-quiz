<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>规划电访全流程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}
</style>

<script>
const DATA = {"pages":[{"row":3,"stage":"规划电访-阶段1","p":"P01","topic":"开场提问","script":"各位伙伴，这节课要给大家讲的是规划电访的全流程。这通电话非常重要，会很大程度的影响大家的招报成绩。大家一定要重视起来。在正式开始之前和大家讨论一个小问题：大家可以心里想一想，假如你准备花钱买一样东西，两种方式，你更喜欢哪一种？\n A：有人提前跟你好好介绍、讲明白，帮你了解清楚之后，你再决定要不要买\n B：直接通知你，告诉你就选这个、直接下单","interact":{"q":"假如你买一样东西，两种方式，你更喜欢哪一种？","at":"P01","options":["A：有人提前跟你好好介绍、讲明白，帮你了解清楚之后，你再决定要不要买","B：直接通知你，告诉你就选这个、直接下单"],"answer":-1,"vote":true,"wrong":"直接继续"}},{"row":4,"stage":"规划电访-阶段1","p":"P02","topic":"章节页","script":"其实咱们的规划电访，道理一模一样。它不是一通催单通知电话，这是咱们孩子开课后，第一次正式主动打给家长的沟通电话。 我们不只是讲学习规划，更要去反馈孩子当下的课堂表现，认真听听家长的感受，了解孩子上课之后真实的想法和状态。 先把这一步沟通做扎实，家长能感受到我们是在持续关注孩子，体验感、信任感自然就上来了。有了这份信任打底，后面再顺势给家长介绍赛事机会，家长更容易理解、认可，咱们赛事的成交也会更顺畅。 所以今天，我们一起来学好规划电访，把这关键的第一通电话打好。\n那么接下来，我们就从以下三个方面来学习一下规划电访。","interact":{"q":"那通过刚刚的引入，你认为规划电访要和家长说一下什么内容？","at":"P02","options":["学习情况","赛考介绍","都需要说"],"answer":-1,"vote":true,"wrong":"直接继续"}},{"row":5,"stage":"规划电访-阶段1","p":"P03","topic":"第一章","script":"规划电访就是开课之后我们打给家长的第一通正式电话：先反馈孩子上课情况，倾听家长和孩子的真实感受，把服务体验做好、把信任搭起来。信任到位了，后面再跟家长聊赛事规划，家长更容易理解和认可，转化也会更顺畅。","interact":null},{"row":6,"stage":"规划电访-阶段1","p":"P04","topic":"规划电访引入","script":"思考一下:\n赛事招报是什么时候开始的呢?","interact":{"q":"赛事招报是什么时候开始的呢?","at":"P04","options":["L8-4","L9-2","L8-2  （错误答案）","L9-4（错误答案）"],"answer":0,"vote":false,"wrong":"重讲本页重触发"}},{"row":7,"stage":"规划电访-阶段1","p":"P05","topic":"电话定位","script":"好，我们清楚了规划电访的价值，接下来看它的时间节奏和核心定位。\n首先说时间节点：咱们的规划电访，对应课次是 L8-4 或者 L9-2，全部电话必须在 L8-4 之前完成，做到 100% 全覆盖，不能漏家长。同时大家要记住，打完电话之后，一定要在课导后台，按 SOP 要求上传任务记录，完成闭环。\n大家看这条时间线，规划电访周期大概一个月。我们做完这通沟通之后，赛事招报就正式启动了。 这里大家要理解，赛事招报本质上就像一场 “小续报”，它是检验我们规划电访效果最好的标尺：家长愿不愿意了解赛事、要不要让孩子参与，其实就是在告诉我们，他是不是认可咱们的课程、是不是打算让孩子长期坚持学编程。\n最重要的一点，牢牢记住我们这通电话的定位：摸底意向，不催报名。 这通电话不是成交电话，我们不逼家长当场报赛事。我们的目标，是提前摸清家长对孩子后续学习、赛事发展的想法，把信息收集到位、把预期铺垫好。等到后面赛事通道一开，前期铺垫到位的家长，转化自然水到渠成。","interact":{"q":"规划电访是定位是","at":"P05","options":["摸底意向,不催报名","学情反馈，催促成交"],"answer":0,"vote":false,"wrong":"重讲本页重触发"}},{"row":8,"stage":"规划电访-阶段1","p":"P06","topic":"规划电访作用","script":"刚刚我们明确了规划电访的时间节点、以及它 “摸底意向、不催报名” 的核心定位，那接下来我们拆开来看，这通电话到底能起到哪些作用，我们分成两个维度：对家长、对我们老师。\n首先我们先看【对家长】这一侧： 第一，帮家长清晰了解孩子当下的真实水平。很多家长只知道孩子在上编程课，但不清楚孩子现在掌握到哪一步、优势在哪、还有哪些地方需要加强。我们借着这通电话，客观反馈孩子课堂表现，把孩子当前的能力状态讲明白，家长心里才有底。也能够直观的感受到老师对于孩子的独特关注。 第二，让家长清楚后续的学习路径，知道接下来要学什么。很多家长是模糊的，只知道学编程，但不知道后面课程怎么安排、难度怎么递进。我们把短期和长期规划讲清楚，家长就不会觉得上课是 “走一步看一步”。 第三，让家长实实在在看见课程对孩子的帮助。不是空泛地说 “锻炼逻辑”，而是结合孩子课堂上的例子，告诉家长，通过这阶段的学习，孩子在思维、耐心、解决问题上有哪些变化，让家长感知到学习价值。 第四，帮家长建立合理、明确的学习预期。提前跟家长讲清楚编程学习的节奏、赛考安排 难点、需要配合的地方，避免家长期待过高，后期容易焦虑、失望。我们可以看到，你的规划电访打好了，家长可以了解清晰这么多信息，还担心赛招招不上来吗？\n说完对家长，我们再看【对老师】，也就是对我们自己的价值： 第一，建立专业可信的形象。我们主动打电话、有条理地分析孩子情况、给到清晰规划，家长感受到我们不是只负责上课，而是全程跟进孩子成长，专业感一下子就出来了。 第二，提升家长粘性和满意度。主动的关心反馈，会让家长觉得服务到位，愿意信任我们，后续沟通的阻力会小很多。 第三，提前摸清家长真实意向。借着沟通，我们可以了解家长对孩子学编程的想法：是只想当兴趣，还是未来想走赛事、升学方向。哪些家长意向高、哪些顾虑多，我们提前标记，做到心中有数。 第四，为后续赛事正式报名沟通做好铺垫。这也是和我们前面讲的时间线呼应的，现在把规划、价值、家长想法都铺垫到位，等到赛事招报启动的时候，我们再去沟通，就不是突兀的推销，而是顺着之前聊过的规划继续推进，顺畅很多。\n最后总结一下：这通电话，一边是帮家长看懂孩子、看懂学习；另一边，是帮我们做好信任铺垫、摸清意向，为后面的赛事沟通打好基础。","interact":{"q":"下面哪一项属于规划电访给老师带来的价值？","at":"P06","options":["A. 让家长清楚孩子当前水平","B. 让家长知道接下来学习内容","C. 提前摸清家长真实意向，为赛事沟通铺垫","D. 帮助家长建立学习预期"],"answer":2,"vote":false,"wrong":"重讲本页重触发"}},{"row":9,"stage":"规划电访-阶段2","p":"P07","topic":"第二章","script":"刚刚我们第一部分，把规划电访是什么、为什么要打、时间节点、定位和作用全部梳理清楚了。大家也记住了核心原则：摸底意向，不催报名。\n知道了它的价值和定位，接下来大家最关心的问题肯定就是：到底怎么才能把这通规划电访打好？ 这就是我们第二部分要重点拆解的内容。\n打好规划电访，不是拿起电话随便聊一聊，它是一套有流程、有话术、有重点、有避坑点的标准化沟通。也是我们的伙伴，通过这个模式拿到了很好的结果检验的。后面我们会一步步带着大家拆解：打电话前要准备哪些信息、通话的完整流程怎么安排、沟通里哪些话该说、哪些话不能说、遇到家长常见疑问怎么回应，以及打完之后怎么完成后台记录闭环。\n大家一定要记住，我们所有的沟通动作，都不能偏离前面说的定位：我们是做学习规划、摸底意向，不是上来推销赛事。所有的沟通技巧，都是为了帮我们更好地建立信任，摸清家长想法，为后面赛事招报做好铺垫。\n那接下来，我们就进入第二章节，一起来学习：怎么打好这通规划电话。","interact":null},{"row":10,"stage":"规划电访-阶段2","p":"P08","topic":"规划准备","script":"那我们正式开始实操第一步：打电话之前，一定要做好功课，也就是我们这一页的 —— 提前了解。 一共 4 个板块，我们一个个来看。\n第一点，先清晰孩子的学习数据。 我们要提前核对好孩子的年龄、所在省份、当前的 Level 阶段，还有完课、完课时情况、闯关记录、作业得分。这些是我们沟通的基础，所有对孩子的评价，都不能凭感觉，要拿真实数据说话。打电话的时候，我们能精准说出孩子课堂的真实表现，家长才会觉得我们用心、专业。\n第二点，提前熟悉省份政策与竞争情况。 每个省份的编程政策、升学路径都不一样。同样是学编程走赛事，不同地区的机会、门槛差别很大。我们提前摸清楚当地的情况，后面给家长做规划的时候，就不是一套话术用到底，而是贴合本地情况给建议，规划才会落地、有说服力。我们飞书工作台的（销冠助手就可以搜到不同地区的编程政策。）\n第三点，提前判断家长属于哪一类。 我们把家长分成三类：思维型、混合动机型、精英升学型。大家可以从平时微信聊天记录、前后端互通表里面去捕捉信息。 有的家长单纯想锻炼孩子逻辑思维；有的家长既看重思维培养，也考虑以后升学；还有的家长目标很明确，就是奔着科技特长、升学赛道。提前分清类型，我们沟通的侧重点就不一样，思维类的家长不会给他强推高难度的赛事，保持孩子的学习兴趣最重要。升学类的那我们就要了解更多的当地编程政策，给家长合理的规划。避免自说自话。\n第四点，提前约好通话时间。 不要直接突然打电话。优先微信预约，跟家长约一段 15 分钟、不被打扰的时间，并且提前跟家长说清楚：这通电话是专门给孩子做本学期的学习规划。 提前预约有两个好处：一是家长有心理准备，不会仓促、不耐烦；二是保证沟通完整，不会聊两句就被打断。\n这四项准备工作，全部服务于我们的核心定位：摸底意向，不催报名。我们提前做足信息储备，是为了精准规划、读懂家长，而不是上来就推销赛事。准备到位，电话沟通才稳。","interact":{"q":"在提前了解的 4 项准备里，哪一项可以帮我们调整沟通侧重点，精准匹配家长需求？","at":"P08","options":["A. 孩子学习数据","B. 省份政策与竞争情况","C. 判断家长属于哪一类","D. 提前约好时间"],"answer":2,"vote":false,"wrong":"重讲本页重触发"}},{"row":11,"stage":"规划电访-阶段2","p":"P09","topic":"家长分类","script":"刚刚我们说到，打电话前要先判断家长类型，也就是这三类：思维型、混合动机型、精英升学型。这三类家长的诉求不一样，我们沟通的侧重点、也是不同的。\n先看第一类：思维型家长 这类家长的核心特点：不关心升学，孩子感兴趣就学。 我们一直揪着升学、证书、加分去讲，很容易反感。 沟通重点： 核心放在兴趣保护、思维锻炼上。 短期目标：和家长重点聊怎么保住孩子的学习兴趣，坚持完课、稳定上课节奏；让家长看到孩子变化。赛考是作为一次锻炼、体验，不把升学价值放大。 长期目标：不用去铺 CSP、科技特长生路线。只要孩子状态好、愿意学，我们及时肯定孩子，告诉家长孩子表现优秀就足够。 沟通话术方向：多聊孩子课堂上的变化，比如逻辑、耐心、解决问题的能力。\n第二类：混合动机型家长，特点：以孩子兴趣为主，同时也会考虑升学这条路，两边都在意。 沟通重点：先保兴趣，再适度讲赛事价值。 短期目标：先肯定孩子的兴趣，再客观跟家长讲清楚赛事的作用，赛考是检验学习成果的方式，不是为了拿奖而硬逼孩子。 长期目标：可以给家长规划白名单赛事路线，循序渐进。 这类家长是我们重点铺垫的人群，我们要平衡好：不破坏兴趣，同时把赛事对升学的加分价值讲清楚，给家长留选择空间。\n第三类：精英升学型家长 特点：牛娃家庭，愿意投入大量时间精力，目标明确，瞄准升学赛道。 沟通重点：一定要讲赛事必要性、科技特长生路径。 短期目标：明确告知本学期赛考建议参加，讲清楚这一步对后续规划的必要性，关联科技特长生政策。 长期目标：直接对标 CSP-J/S，落地到小升初、初升高的升学规划。 和这类家长沟通，我们要专业、讲硬核信息，讲清楚赛事梯队、时间线、获奖对应的升学价值，给到清晰的进阶路线。\n最后总结一句关键： 不是三类家长都要使劲推升学。思维型重兴趣、混合型平衡兴趣 + 赛事、精英升学型聚焦升学赛道，顺着家长原本的诉求去聊，才不会引起抵触，也贴合我们 “摸底意向、不催报名” 的电访定位。\n","interact":{"q":"针对于混合动机的家长，我们规划的短期目标是","at":"P09","options":["A保持兴趣说明赛事作用本阶段赛考;","B保持兴趣坚持完课本阶段赛考","C本学期赛考必须参加","说明必要性、科技特长生"],"answer":0,"vote":false,"wrong":"重讲本页重触发"}},{"row":12,"stage":"规划电访-阶段2","p":"P10","topic":"电访流程","script":"接下来就看一下电访流程；第一步：自然开场确认方便，让家长感到被尊重。第二部学情复盘。学情反馈不能只说 “孩子表现不错”，那样太空了：第一步给信心，第二步提建议，接下来自然带到赛考。讲清楚赛考的具体情况和规划。接下来，来到家长的第一个决策点：如果家长没有异议，表示同意，顺势和家长讲清楚赛考的费用，再次询问家长关于费用是否有问题？若都没有问题，那我们就可以和家长说清楚报名具体时间和安排，愉快结尾了。\n若家长在任一决策点出现异议问题，一定要在电话里面及时的解决，这是解决问题最合适的时机了。解决完在和家长确认一下意向。不能默认家长同意了。这就是我们电访的主要流程。","interact":{"q":"规划电访主要包含哪些流程？","at":"P10","options":["自然开场","学情复盘","赛考说明","费用说明","收口拿到结果"],"answer":0,"vote":false,"wrong":"重讲本页重触发"}},{"row":13,"stage":"规划电访-阶段2","p":"P11","topic":"学情反馈","script":"注意一下学情反馈部分一定要有理有据。学情反馈不能只说 “孩子表现不错”，那样太空了。我们要按这三步走：\n第一步，给信心。 用具体数据或课堂表现，告诉家长孩子这个阶段学得不错。比如：“这阶段作业完成率很高，某个关卡已经顺利通过了，孩子的逻辑理解能力确实不错。” 先让家长觉得被肯定、被看见，后面才愿意听建议。一定要结合实际情况反馈；\n第二步，提建议。 肯定之后，再客观提一个不致命的，小的提升点，不能全是表扬。可以说：“我也发现孩子在这个地方还可以再加强，后面我们可以继续多练一练。” 这样家长会觉得你很真实，不是只说好话。\n第三步，带到赛考。 前面表扬和建议都讲完了，再自然勾连赛事。可以说：“之前跟您提到过赛事，刚好这个阶段可以让孩子去检验一下成果。” 注意，这里只是带出赛考，不是当场催报名。","interact":{"q":"学情反馈包括哪些步骤","at":"P11","options":["给信心","提建议","带到赛考","确认报名意向"],"answer":0,"vote":false,"wrong":"重讲本页重触发"}},{"row":14,"stage":"规划电访-阶段2","p":"P12","topic":"赛考类比","script":"学情反馈完成后，自然过渡到赛考规划：\n很多家长对赛事没有概念，我们可以把编程学习类比成高考：\n编程学到这个阶段，就像高中要面对高考一样。考级相当于模拟考试，而真正的赛事就像正式高考。孩子现在学到的内容，刚好能达到这个水平，可以去检验一下真实实力。您觉得孩子去试一下合适吗？\n这个类比的好处是，家长很容易理解：模拟考是练习，正式高考是检验。赛事就是孩子阶段性学习的正式检验。是必经之路。\n家长如果支持直接进费用不要多讲含金量,顺势往下走\n家长如果犹豫就进异议处理。处理完再确认一次支持度,不默认同意。\n\n","interact":null},{"row":15,"stage":"规划电访-阶段2","p":"P13","topic":"讲清考级","script":"很多家长接着会问：考级到底是什么？我们不用长篇大论，就用一句话讲清楚，同时匹配它的价值，这就是我们这一页的内容。\n先看左边的CTL：这是共青团中央主管、清华计算机系指导的能力认证，考完拿双章证书。 它的价值有四点： 第一，正向激励，帮孩子维持编程兴趣； 第二，用来查漏补缺，检验知识点哪里掌握得不扎实； 第三，提前适应考试流程、积累应试经验，为之后冲 GESP 打好基础； 第四，表现优秀的孩子，可以录入国家级人才库。\n再看右边的YCL ：这是工信部教育与考试中心、中国电子教育学会联合主办，唯一由中央部委直属单位主办的等级考试。 同样可以正向激励孩子、保持兴趣；帮孩子查漏补缺；提前积累考试经验，为后续国赛铺路；优秀选手纳入工信部人才库。","interact":{"q":"考级的主要作用包括","at":"P13","options":["正向激励,保持编程兴趣","查漏补缺","积累考试经验","优秀选手有机会进入对应的人才库"],"answer":0,"vote":false,"wrong":"重讲本页重触发"}},{"row":16,"stage":"规划电访-阶段2","p":"P14","topic":"讲清赛事","script":"接下来这两个，就是咱们说的正式赛事 ——Roborave 和图灵杯。同样，我们记住一句话版本，方便给家长讲清楚。\n先看Roborave：获得央视新闻等权威媒体认可。成绩受国内外学校认可，为升学履历增添亮点，给孩子拿到国际证书、和全球选手同台交流的机会，锻炼科创能力、拓宽国际视野。 它的 4 个核心价值： 央视新闻权威认证 、业内公认的素质教育标杆赛事 帮孩子积累全球化科创履历 、实战经验，为后面白名单赛事做铺垫\n再看图灵杯 ：这是共青团直属基金会主办、清华大学计算机科学与技术系牵头命题评审的国家级赛事，难度比考级更高。 它的核心价值： 用比赛检验阶段性真实学习成果 国赛一等奖选手有机会参与 985 教授科研项目 积累实战经验，对接后续白名单赛事\n只有我们详细的了解赛考信息才能准确的传达给家长，让家长更加的清晰。","interact":{"q":"roborave的主要价值有","at":"P14","options":["央视新闻权威认证","是业内认可的素质教育标杆","获得全球化科创活动履历","为后续白名单赛事积累实战经验"],"answer":0,"vote":false,"wrong":"重讲本页重触发"}},{"row":17,"stage":"规划电访-阶段2","p":"P15","topic":"常见异议","script":"讲完考级和赛事之后，家长很容易抛出各类顾虑，这一页就是咱们高频异议的标准回应逻辑，核心原则：不争执、先共情，再按逻辑解释，最后拉回目标。我们一条一条来看：\n 质疑整个赛考含金量 回应逻辑：类比大学四六级、清华牵头命题的奥数；含金量不是「有没有」，是「多和少」。 话术参考：其实咱们可以类比四六级、奥数，不是说一张证书就能直接升学，含金量是分梯度的，考级、赛事是一层一层往上积累的，是孩子能力的凭证。\n 考级含金量不如比赛 回应逻辑：阶段性检测价值 + 核桃 NOI 金牌数据佐证「学 - 练 - 考 - 赛」体系 话术参考：比赛含金量确实更高，但考级是非常好的阶段性检测。咱们很多 NOI 金牌学员，都是走学、练、考、赛这套体系，先用考级摸清漏洞，再冲赛事，一步一步往上走。\n 英语也考过级、没啥用 回应逻辑：编程没有统一高考，证书 = 分数，手里有证机会来了才能拿出来 话术参考：英语有中考高考统一考试可以直接看分数，但是编程没有统一的升学统考，证书就相当于孩子的 “分数证明”，等到有科技特长、择校机会的时候，有证书才能提交材料。\n 为什么要花 600 元 回应逻辑：官方考试，核桃代收，机构不赚一分钱，赛考辅导全程免费 话术参考：这个费用是官方收取的考试报名费，我们只是代收，机构不从中盈利，而且后续配套的赛考辅导，我们是免费给孩子上的。\n 为什么要考级 + 比赛都报名 回应逻辑：考点高度重合、效率最高，国家级比赛一年只有一次机会 话术参考：考级和赛事考点重合度很高，一起准备，复习效率最高；而且这类国家级赛事一年就一次，错过就要再等一整年。\n 为什么不能考前再报 回应逻辑：报名窗口固定，辅导是长周期，现在报锁定的是「考位」不是「今天就考」 话术参考：官方报名时间是固定窗口期，名额有限；同时咱们配套的备考辅导是长线安排，现在报名，本质是锁定考位，不是马上就要参加考试。\n 现在参加太早了 回应逻辑：只是提前了解，真正考试在 Level 4，时间绝对充足 话术参考：咱们现在只是提前规划、提前熟悉，正式考试安排在 Level4，准备周期很长，时间非常充裕，早规划不仓促。\n 孩子不想参加 回应逻辑：这个年龄段的正常心理，老师可直接跟孩子沟通鼓励，消除顾虑 话术参考：这个年纪孩子怕考试、怕挑战是很正常的，之后我单独和孩子聊一聊，帮他打消顾虑、建立信心。\n 孩子学得一般，考不过 回应逻辑：通过率 90%+，主要是积累经验，为比赛做铺垫 话术参考：这个考级通过率在 90% 以上，我们的核心目标也不是冲高分，主要是让孩子体验完整考试流程，积累应试经验，为后面赛事打底。\n 上个学期就没考过，不参加 回应逻辑：定位问题，针对性的给孩子辅导，肯定孩子近期的效果 话术参考：上次的情况我们也复盘过，找到了薄弱点，这段时间孩子进步很明显，我们会针对性辅导，帮孩子把之前的问题补上。","interact":null},{"row":18,"stage":"规划电访-阶段3","p":"P16","topic":"第三章","script":"流程和话术都讲完了，最后我们来看：什么样的电话才算达标？","interact":null},{"row":19,"stage":"规划电访-阶段3","p":"P17","topic":"考核标准","script":"规划电话的质检标标准，一共三大维度，是我们打完电话之后自查、组长抽检的依据。\n 通话时长 要求：通话时长＞10 分钟，并且规划相关内容占比要在 50% 以上。 太短的电话，很难把考级、赛事、规划讲透；不是单纯闲聊凑时长，重点是赛考规划的内容要占到一半以上，闲聊、简单寒暄不能占大头。\n 学情反馈 三个硬性要求：要有具体场景、有亮点、有不足、给到学习建议。 不能空泛说 “孩子学得不错”，一定要拿课堂实例；既要肯定孩子做得好的地方，也要客观指出薄弱点，最后配套可落地的学习建议，家长才会觉得专业可信。\n 异议处理 三点要求：不回避家长提出的疑问、回应逻辑到位、异议处理完之后，一定要再次确认报名意向。家长有顾虑不要绕开；按咱们前面的标准话术回应清楚；讲完之后不能直接结束通话，要闭环，再次确认家长要不要报名考级 / 赛事。\n \n一句话总结质检底线：电话够时长、学情讲具体、异议接住并且闭环确认意向。","interact":{"q":"学情反馈的标准包括","at":"P17","options":["有具体场景","有亮点有不足","有学习建议"],"answer":0,"vote":false,"wrong":"重讲本页重触发"}},{"row":20,"stage":"规划电访-阶段3","p":"P18","topic":"问卷调研","script":"恭喜完成本次学习，请使用飞书扫二维码。请填写你的真实感受吧!","interact":{"q":"是否已完成问卷填写？","at":"P18","options":["是","否"],"answer":0,"vote":false,"wrong":"直接继续"}},{"row":21,"stage":"规划电访-阶段3","p":"P19","topic":"结尾页","script":"电访打得好，招报没烦恼。","interact":null}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"规划电访-阶段1","q":"规划电访的核心定位是什么？","options":[{"k":"A","t":"打电话当场说服家长报名赛事"},{"k":"B","t":"摸底意向，不催报名"},{"k":"C","t":"重点和家长催长期续报"},{"k":"D","t":"主要用来解决家长投诉"}],"answer":"B","back":"P4"},{"id":"T-S02","type":"阶段练习题","chapter":"规划电访-阶段1","q":"规划电访要求在哪个课次之前 100% 全部完成？（多选）","options":[{"k":"A","t":"L8-4"},{"k":"B","t":"L9-2"},{"k":"C","t":"L7-4"},{"k":"D","t":"L8-2"}],"answer":"AB","back":""},{"id":"T-S03","type":"阶段练习题","chapter":"规划电访-阶段1","q":"规划电访结束后，多久会开启赛事招报？","options":[{"k":"A","t":"打完电话当天或者铺垫 2 周左右"},{"k":"B","t":"打完电话一个月之后"},{"k":"C","t":"打完电话次月月底"},{"k":"D","t":"没有固定时间"}],"answer":"A","back":""},{"id":"T-S04","type":"阶段练习题","chapter":"规划电访-阶段1","q":"以下哪一项不属于规划电访对家长的作用？","options":[{"k":"A","t":"清楚孩子当前编程水平"},{"k":"B","t":"知道后续学习内容"},{"k":"C","t":"建立明确的学习预期"},{"k":"D","t":"直接敲定赛事报名"}],"answer":"D","back":""},{"id":"T-S05","type":"阶段练习题","chapter":"规划电访-阶段1","q":"赛事招报相当于一场小续报，它主要用来检验什么？","options":[{"k":"A","t":"家长手里的预算是否充足"},{"k":"B","t":"家长是否愿意让孩子长期坚持学编程"},{"k":"C","t":"孩子是否一定能拿到赛事奖项"},{"k":"D","t":"家长会不会马上转介绍"}],"answer":"B","back":""},{"id":"T-S06","type":"阶段练习题","chapter":"规划电访-阶段2","q":"家长主要分为哪几大类？（多选）","options":[{"k":"A","t":"思维类"},{"k":"B","t":"混合类"},{"k":"C","t":"精英升学类"},{"k":"D","t":"托管类"}],"answer":"ABC","back":""},{"id":"T-S07","type":"阶段练习题","chapter":"规划电访-阶段2","q":"在规划电话沟通流程中，第一步是？","options":[{"k":"A","t":"学情反馈"},{"k":"B","t":"自然开场"},{"k":"C","t":"讲考级"},{"k":"D","t":"处理异议"}],"answer":"B","back":""},{"id":"T-S08","type":"阶段练习题","chapter":"规划电访-阶段2","q":"CTL 考级的主办指导单位是？","options":[{"k":"A","t":"工信部教育与考试中心"},{"k":"B","t":"共青团中央主管、清华计算机系指导"},{"k":"C","t":"共青团直属基金会"},{"k":"D","t":"央视科创组委会"}],"answer":"B","back":""},{"id":"T-S09","type":"阶段练习题","chapter":"规划电访-阶段2","q":"关于 Roborave 赛事，下面说法正确的是？","options":[{"k":"A","t":"由清华计算机系牵头命题评审"},{"k":"B","t":"获得央视新闻权威认可，可积累全球化科创履历"},{"k":"C","t":"通过率 90% 以上，定位只是模拟考"},{"k":"D","t":"一年有多次比赛机会"}],"answer":"B","back":""},{"id":"T-S10","type":"阶段练习题","chapter":"规划电访-阶段2","q":"家长提出 “孩子学得一般，考不过”，对应的标准回应逻辑是？","options":[{"k":"A","t":"直接建议不要报名，等学好再说"},{"k":"B","t":"通过率 90%+，主要是积累经验，为比赛做铺垫"},{"k":"C","t":"告诉家长考不过也可以全额退费"},{"k":"D","t":"跟家长说必须报名，才有参赛资格"}],"answer":"B","back":""},{"id":"T-S11","type":"阶段练习题","chapter":"规划电访-阶段3","q":"规划电话合格的通话时长要求是？","options":[{"k":"A","t":"大于 8 分钟"},{"k":"B","t":"大于 10 分钟"},{"k":"C","t":"大于 12 分钟"},{"k":"D","t":"大于 15 分钟"}],"answer":"B","back":""},{"id":"T-S12","type":"阶段练习题","chapter":"规划电访-阶段3","q":"规划电话里，规划相关内容占比要求？","options":[{"k":"A","t":"30% 以上"},{"k":"B","t":"50% 以上"},{"k":"C","t":"70% 以上"},{"k":"D","t":"90% 以上"}],"answer":"B","back":""},{"id":"T-S13","type":"阶段练习题","chapter":"规划电访-阶段3","q":"不属于合格学情反馈要求的是？","options":[{"k":"A","t":"有具体场景"},{"k":"B","t":"只讲亮点，不提不足"},{"k":"C","t":"有亮点也有不足"},{"k":"D","t":"给出学习建议"}],"answer":"B","back":""},{"id":"T-S14","type":"阶段练习题","chapter":"规划电访-阶段3","q":"异议处理完成之后，必须做的动作是？","options":[{"k":"A","t":"直接结束通话"},{"k":"B","t":"再次确认报名意向"},{"k":"C","t":"给家长发报名链接"},{"k":"D","t":"和家长约下次上课时间"}],"answer":"B","back":""},{"id":"T-S15","type":"阶段练习题","chapter":"规划电访-阶段3","q":"关于规划电话质检标准，说法正确的是？","options":[{"k":"A","t":"只要时长够，就一定达标"},{"k":"B","t":"学情反馈只夸孩子，不用提短板"},{"k":"C","t":"家长疑问不能回避，要规范回应"},{"k":"D","t":"规划内容占比没有硬性要求"}],"answer":"C","back":""},{"id":"T-F01","type":"本章综合测试题","chapter":"规划电访·全章","q":"规划电访要在哪个阶段之前完成？","options":[{"k":"A","t":"L8-4"},{"k":"B","t":"L9-2"},{"k":"C","t":"L11-4"},{"k":"D","t":"L8-1"}],"answer":"A","back":""},{"id":"T-F02","type":"本章综合测试题","chapter":"规划电访·全章","q":"对于家长，规划电访的作用是？（多选）","options":[{"k":"A","t":"清楚孩子当前水平"},{"k":"B","t":"知道接下来学什么"},{"k":"C","t":"看到课程对孩子的帮助"},{"k":"D","t":"对编程学习有明确预期"}],"answer":"ABCD","back":""},{"id":"T-F03","type":"本章综合测试题","chapter":"规划电访·全章","q":"在打规划电访之前我们应该了解哪些信息做好哪些准备？（多选）","options":[{"k":"A","t":"孩子学习数据"},{"k":"B","t":"家长属于哪一类"},{"k":"C","t":"省份政策与竞争情况"},{"k":"D","t":"确定好电访合适的时间"}],"answer":"ABCD","back":""},{"id":"T-F04","type":"本章综合测试题","chapter":"规划电访·全章","q":"规划电访的步骤包含？（多选）","options":[{"k":"A","t":"自然开场"},{"k":"B","t":"学情复盘（反馈）"},{"k":"C","t":"赛考说明"},{"k":"D","t":"费用说明"},{"k":"E","t":"收口拿结果"},{"k":"F","t":"异议处理（按需触发）\nG. 发送链接"}],"answer":"ABCDEF","back":""},{"id":"T-F05","type":"本章综合测试题","chapter":"规划电访·全章","q":"学情反馈主要包含哪些方面？（多选）","options":[{"k":"A","t":"确认意向"},{"k":"B","t":"给信心"},{"k":"C","t":"提建议"},{"k":"D","t":"自然带到赛考"}],"answer":"BCD","back":""},{"id":"T-F06","type":"本章综合测试题","chapter":"规划电访·全章","q":"赛事招报可能在哪个阶段开始进行？（多选）","options":[{"k":"A","t":"L9-2"},{"k":"B","t":"L8-4"},{"k":"C","t":"L9-4"},{"k":"D","t":"L8-3"}],"answer":"AB","back":""},{"id":"T-F07","type":"本章综合测试题","chapter":"规划电访·全章","q":"关于规划电访的说法正确的是？（多选）","options":[{"k":"A","t":"大于 10 分钟"},{"k":"B","t":"规划内容占比 50% 以上"},{"k":"C","t":"大于 8 分钟"},{"k":"D","t":"没时长要求"}],"answer":"AB","back":""},{"id":"T-F08","type":"本章综合测试题","chapter":"规划电访·全章","q":"YCL的主办单位是","options":[{"k":"A","t":"工业和信息化部教育与考试中心、中国电子教育学会联合主办"},{"k":"B","t":"共青团中央主管"},{"k":"C","t":"清华大学计算机系"},{"k":"D","t":"计算机电子学会"}],"answer":"A","back":""},{"id":"T-F09","type":"本章综合测试题","chapter":"规划电访·全章","q":"roborave的作用包括","options":[{"k":"A","t":"央视新闻权威认证"},{"k":"B","t":"是业内认可的素质教育标杆"},{"k":"C","t":"获得全球化科创活动履历"},{"k":"D","t":"为后续白名单赛事积累实战经验"}],"answer":"ABCD","back":""},{"id":"T-F10","type":"本章综合测试题","chapter":"规划电访·全章","q":"家长质疑整个赛考含金量正确的回应逻辑是","options":[{"k":"A","t":"类比大学四六级、清华牵头命题的奥数;"},{"k":"B","t":"含金量不是「有无」,是是「多与少」"},{"k":"C","t":"只要考级就能升学"},{"k":"D","t":"不考级学了就没用"}],"answer":"AB","back":""}],"timing":{"P01":{"sents":["各位伙伴，这节课要给大家讲的是规划电访的全流程。","这通电话非常重要，会很大程度的影响大家的招报成绩。","大家一定要重视起来。","在正式开始之前和大家讨论一个小问题：大家可以心里想一想，假如你准备花钱买一样东西，两种方式，你更喜欢哪一种？\n"," A：有人提前跟你好好介绍、讲明白，帮你了解清楚之后，你再决定要不要买\n"," B：直接通知你，告诉你就选这个、直接下单"],"durs":[5.424,5.568,2.304,11.136,7.176,4.896]},"P02":{"sents":["其实咱们的规划电访，道理一模一样。","它不是一通催单通知电话，这是咱们孩子开课后，第一次正式主动打给家长的沟通电话。"," 我们不只是讲学习规划，更要去反馈孩子当下的课堂表现，认真听听家长的感受，了解孩子上课之后真实的想法和状态。"," 先把这一步沟通做扎实，家长能感受到我们是在持续关注孩子，体验感、信任感自然就上来了。","有了这份信任打底，后面再顺势给家长介绍赛事机会，家长更容易理解、认可，咱们赛事的成交也会更顺畅。"," 所以今天，我们一起来学好规划电访，把这关键的第一通电话打好。\n","那么接下来，我们就从以下三个方面来学习一下规划电访。"],"durs":[3.84,8.088,11.064,8.928,10.488,6.168,5.376]},"P03":{"sents":["规划电访就是开课之后我们打给家长的第一通正式电话：先反馈孩子上课情况，倾听家长和孩子的真实感受，把服务体验做好、把信任搭起来。","信任到位了，后面再跟家长聊赛事规划，家长更容易理解和认可，转化也会更顺畅。"],"durs":[13.008,8.256]},"P04":{"sents":["思考一下:\n","赛事招报是什么时候开始的呢?"],"durs":[1.872,3.168]},"P05":{"sents":["好，我们清楚了规划电访的价值，接下来看它的时间节奏和核心定位。\n","首先说时间节点：咱们的规划电访，对应课次是 L8-4 或者 L9-2，全部电话必须在 L8-4 之前完成，做到 100% 全覆盖，不能漏家长。","同时大家要记住，打完电话之后，一定要在课导后台，按 SOP 要求上传任务记录，完成闭环。\n","大家看这条时间线，规划电访周期大概一个月。","我们做完这通沟通之后，赛事招报就正式启动了。"," 这里大家要理解，赛事招报本质上就像一场 “小续报”，它是检验我们规划电访效果最好的标尺：家长愿不愿意了解赛事、要不要让孩子参与，其实就是在告诉我们，他是不是认可咱们的课程、是不是打算让孩子长期坚持学编程。\n","最重要的一点，牢牢记住我们这通电话的定位：摸底意向，不催报名。"," 这通电话不是成交电话，我们不逼家长当场报赛事。","我们的目标，是提前摸清家长对孩子后续学习、赛事发展的想法，把信息收集到位、把预期铺垫好。","等到后面赛事通道一开，前期铺垫到位的家长，转化自然水到渠成。"],"durs":[6.504,14.016,8.832,4.824,4.68,20.304,6.72,5.544,9.576,6.72]},"P06":{"sents":["刚刚我们明确了规划电访的时间节点、以及它 “摸底意向、不催报名” 的核心定位，那接下来我们拆开来看，这通电话到底能起到哪些作用，我们分成两个维度：对家长、对我们老师。\n","首先我们先看【对家长】这一侧： 第一，帮家长清晰了解孩子当下的真实水平。","很多家长只知道孩子在上编程课，但不清楚孩子现在掌握到哪一步、优势在哪、还有哪些地方需要加强。","我们借着这通电话，客观反馈孩子课堂表现，把孩子当前的能力状态讲明白，家长心里才有底。","也能够直观的感受到老师对于孩子的独特关注。"," 第二，让家长清楚后续的学习路径，知道接下来要学什么。","很多家长是模糊的，只知道学编程，但不知道后面课程怎么安排、难度怎么递进。","我们把短期和长期规划讲清楚，家长就不会觉得上课是 “走一步看一步”。"," 第三，让家长实实在在看见课程对孩子的帮助。","不是空泛地说 “锻炼逻辑”，而是结合孩子课堂上的例子，告诉家长，通过这阶段的学习，孩子在思维、耐心、解决问题上有哪些变化，让家长感知到学习价值。"," 第四，帮家长建立合理、明确的学习预期。","提前跟家长讲清楚编程学习的节奏、赛考安排 难点、需要配合的地方，避免家长期待过高，后期容易焦虑、失望。","我们可以看到，你的规划电访打好了，家长可以了解清晰这么多信息，还担心赛招招不上来吗？\n","说完对家长，我们再看【对老师】，也就是对我们自己的价值： 第一，建立专业可信的形象。","我们主动打电话、有条理地分析孩子情况、给到清晰规划，家长感受到我们不是只负责上课，而是全程跟进孩子成长，专业感一下子就出来了。"," 第二，提升家长粘性和满意度。","主动的关心反馈，会让家长觉得服务到位，愿意信任我们，后续沟通的阻力会小很多。"," 第三，提前摸清家长真实意向。","借着沟通，我们可以了解家长对孩子学编程的想法：是只想当兴趣，还是未来想走赛事、升学方向。","哪些家长意向高、哪些顾虑多，我们提前标记，做到心中有数。"," 第四，为后续赛事正式报名沟通做好铺垫。","这也是和我们前面讲的时间线呼应的，现在把规划、价值、家长想法都铺垫到位，等到赛事招报启动的时候，我们再去沟通，就不是突兀的推销，而是顺着之前聊过的规划继续推进，顺畅很多。\n","最后总结一下：这通电话，一边是帮家长看懂孩子、看懂学习；","另一边，是帮我们做好信任铺垫、摸清意向，为后面的赛事沟通打好基础。"],"durs":[16.08,7.752,10.08,8.784,4.608,5.52,7.632,6.624,5.016,14.856,4.464,11.304,8.352,8.328,12.912,3.48,7.944,3.552,10.032,6.192,4.728,17.28,6.408,7.08]},"P07":{"sents":["刚刚我们第一部分，把规划电访是什么、为什么要打、时间节点、定位和作用全部梳理清楚了。","大家也记住了核心原则：摸底意向，不催报名。\n","知道了它的价值和定位，接下来大家最关心的问题肯定就是：到底怎么才能把这通规划电访打好？"," 这就是我们第二部分要重点拆解的内容。\n","打好规划电访，不是拿起电话随便聊一聊，它是一套有流程、有话术、有重点、有避坑点的标准化沟通。","也是我们的伙伴，通过这个模式拿到了很好的结果检验的。","后面我们会一步步带着大家拆解：打电话前要准备哪些信息、通话的完整流程怎么安排、沟通里哪些话该说、哪些话不能说、遇到家长常见疑问怎么回应，以及打完之后怎么完成后台记录闭环。\n","大家一定要记住，我们所有的沟通动作，都不能偏离前面说的定位：我们是做学习规划、摸底意向，不是上来推销赛事。","所有的沟通技巧，都是为了帮我们更好地建立信任，摸清家长想法，为后面赛事招报做好铺垫。\n","那接下来，我们就进入第二章节，一起来学习：怎么打好这通规划电话。"],"durs":[8.544,4.776,8.808,3.816,9.864,5.616,17.376,10.512,8.544,6.696]},"P08":{"sents":["那我们正式开始实操第一步：打电话之前，一定要做好功课，也就是我们这一页的 —— 提前了解。"," 一共 4 个板块，我们一个个来看。\n","第一点，先清晰孩子的学习数据。"," 我们要提前核对好孩子的年龄、所在省份、当前的 Level 阶段，还有完课、完课时情况、闯关记录、作业得分。","这些是我们沟通的基础，所有对孩子的评价，都不能凭感觉，要拿真实数据说话。","打电话的时候，我们能精准说出孩子课堂的真实表现，家长才会觉得我们用心、专业。\n","第二点，提前熟悉省份政策与竞争情况。"," 每个省份的编程政策、升学路径都不一样。","同样是学编程走赛事，不同地区的机会、门槛差别很大。","我们提前摸清楚当地的情况，后面给家长做规划的时候，就不是一套话术用到底，而是贴合本地情况给建议，规划才会落地、有说服力。","我们飞书工作台的（销冠助手就可以搜到不同地区的编程政策。","）\n","第三点，提前判断家长属于哪一类。"," 我们把家长分成三类：思维型、混合动机型、精英升学型。","大家可以从平时微信聊天记录、前后端互通表里面去捕捉信息。"," 有的家长单纯想锻炼孩子逻辑思维；","有的家长既看重思维培养，也考虑以后升学；","还有的家长目标很明确，就是奔着科技特长、升学赛道。","提前分清类型，我们沟通的侧重点就不一样，思维类的家长不会给他强推高难度的赛事，保持孩子的学习兴趣最重要。","升学类的那我们就要了解更多的当地编程政策，给家长合理的规划。","避免自说自话。\n","第四点，提前约好通话时间。"," 不要直接突然打电话。","优先微信预约，跟家长约一段 15 分钟、不被打扰的时间，并且提前跟家长说清楚：这通电话是专门给孩子做本学期的学习规划。"," 提前预约有两个好处：一是家长有心理准备，不会仓促、不耐烦；","二是保证沟通完整，不会聊两句就被打断。\n","这四项准备工作，全部服务于我们的核心定位：摸底意向，不催报名。","我们提前做足信息储备，是为了精准规划、读懂家长，而不是上来就推销赛事。","准备到位，电话沟通才稳。"],"durs":[8.424,3.192,3.456,10.224,7.272,8.04,4.32,4.392,5.832,12.504,5.736,0.3,3.984,6,6.24,3.72,4.56,5.544,10.536,6.408,2.016,3.264,2.328,12.168,6.696,4.488,6.528,7.728,3.024]},"P09":{"sents":["刚刚我们说到，打电话前要先判断家长类型，也就是这三类：思维型、混合动机型、精英升学型。","这三类家长的诉求不一样，我们沟通的侧重点、也是不同的。\n","先看第一类：思维型家长 这类家长的核心特点：不关心升学，孩子感兴趣就学。"," 我们一直揪着升学、证书、加分去讲，很容易反感。"," 沟通重点： 核心放在兴趣保护、思维锻炼上。"," 短期目标：和家长重点聊怎么保住孩子的学习兴趣，坚持完课、稳定上课节奏；","让家长看到孩子变化。","赛考是作为一次锻炼、体验，不把升学价值放大。"," 长期目标：不用去铺 CSP、科技特长生路线。","只要孩子状态好、愿意学，我们及时肯定孩子，告诉家长孩子表现优秀就足够。"," 沟通话术方向：多聊孩子课堂上的变化，比如逻辑、耐心、解决问题的能力。\n","第二类：混合动机型家长，特点：以孩子兴趣为主，同时也会考虑升学这条路，两边都在意。"," 沟通重点：先保兴趣，再适度讲赛事价值。"," 短期目标：先肯定孩子的兴趣，再客观跟家长讲清楚赛事的作用，赛考是检验学习成果的方式，不是为了拿奖而硬逼孩子。"," 长期目标：可以给家长规划白名单赛事路线，循序渐进。"," 这类家长是我们重点铺垫的人群，我们要平衡好：不破坏兴趣，同时把赛事对升学的加分价值讲清楚，给家长留选择空间。\n","第三类：精英升学型家长 特点：牛娃家庭，愿意投入大量时间精力，目标明确，瞄准升学赛道。"," 沟通重点：一定要讲赛事必要性、科技特长生路径。"," 短期目标：明确告知本学期赛考建议参加，讲清楚这一步对后续规划的必要性，关联科技特长生政策。"," 长期目标：直接对标 CSP-J/S，落地到小升初、初升高的升学规划。"," 和这类家长沟通，我们要专业、讲硬核信息，讲清楚赛事梯队、时间线、获奖对应的升学价值，给到清晰的进阶路线。\n","最后总结一句关键： 不是三类家长都要使劲推升学。","思维型重兴趣、混合型平衡兴趣 + 赛事、精英升学型聚焦升学赛道，顺着家长原本的诉求去聊，才不会引起抵触，也贴合我们 “摸底意向、不催报名” 的电访定位。\n"],"durs":[9.696,5.448,8.136,5.16,4.824,7.896,2.544,5.064,5.088,7.776,7.44,9.048,4.776,11.736,5.736,11.664,9.984,5.28,9.792,7.2,11.448,5.28,14.88]},"P10":{"sents":["接下来就看一下电访流程；","第一步：自然开场确认方便，让家长感到被尊重。","第二部学情复盘。","学情反馈不能只说 “孩子表现不错”，那样太空了：第一步给信心，第二步提建议，接下来自然带到赛考。","讲清楚赛考的具体情况和规划。","接下来，来到家长的第一个决策点：如果家长没有异议，表示同意，顺势和家长讲清楚赛考的费用，再次询问家长关于费用是否有问题？","若都没有问题，那我们就可以和家长说清楚报名具体时间和安排，愉快结尾了。\n","若家长在任一决策点出现异议问题，一定要在电话里面及时的解决，这是解决问题最合适的时机了。","解决完在和家长确认一下意向。","不能默认家长同意了。","这就是我们电访的主要流程。"],"durs":[2.832,5.04,2.016,9.456,3.264,12.648,7.008,9.024,3.168,2.376,2.88]},"P11":{"sents":["注意一下学情反馈部分一定要有理有据。","学情反馈不能只说 “孩子表现不错”，那样太空了。","我们要按这三步走：\n","第一步，给信心。"," 用具体数据或课堂表现，告诉家长孩子这个阶段学得不错。","比如：“这阶段作业完成率很高，某个关卡已经顺利通过了，孩子的逻辑理解能力确实不错。”"," 先让家长觉得被肯定、被看见，后面才愿意听建议。","一定要结合实际情况反馈；\n","第二步，提建议。"," 肯定之后，再客观提一个不致命的，小的提升点，不能全是表扬。","可以说：“我也发现孩子在这个地方还可以再加强，后面我们可以继续多练一练。”"," 这样家长会觉得你很真实，不是只说好话。\n","第三步，带到赛考。"," 前面表扬和建议都讲完了，再自然勾连赛事。","可以说：“之前跟您提到过赛事，刚好这个阶段可以让孩子去检验一下成果。”"," 注意，这里只是带出赛考，不是当场催报名。"],"durs":[4.056,4.776,2.088,2.112,5.904,8.544,5.256,2.88,2.232,6.168,7.176,4.224,2.424,4.416,6.888,4.8]},"P12":{"sents":["学情反馈完成后，自然过渡到赛考规划：\n","很多家长对赛事没有概念，我们可以把编程学习类比成高考：\n","编程学到这个阶段，就像高中要面对高考一样。","考级相当于模拟考试，而真正的赛事就像正式高考。","孩子现在学到的内容，刚好能达到这个水平，可以去检验一下真实实力。","您觉得孩子去试一下合适吗？\n","这个类比的好处是，家长很容易理解：模拟考是练习，正式高考是检验。","赛事就是孩子阶段性学习的正式检验。","是必经之路。\n","家长如果支持直接进费用不要多讲含金量,顺势往下走\n","家长如果犹豫就进异议处理。","处理完再确认一次支持度,不默认同意。\n\n"],"durs":[4.2,6,4.512,5.4,6.384,3,6.864,4.008,1.872,5.568,3.072,4.224]},"P13":{"sents":["很多家长接着会问：考级到底是什么？","我们不用长篇大论，就用一句话讲清楚，同时匹配它的价值，这就是我们这一页的内容。\n","先看左边的CTL：这是共青团中央主管、清华计算机系指导的能力认证，考完拿双章证书。"," 它的价值有四点： 第一，正向激励，帮孩子维持编程兴趣；"," 第二，用来查漏补缺，检验知识点哪里掌握得不扎实；"," 第三，提前适应考试流程、积累应试经验，为之后冲 GESP 打好基础；"," 第四，表现优秀的孩子，可以录入国家级人才库。\n","再看右边的YCL ：这是工信部教育与考试中心、中国电子教育学会联合主办，唯一由中央部委直属单位主办的等级考试。"," 同样可以正向激励孩子、保持兴趣；","帮孩子查漏补缺；","提前积累考试经验，为后续国赛铺路；","优秀选手纳入工信部人才库。"],"durs":[3.984,7.848,9.48,6.024,5.352,7.728,5.016,11.496,3.648,2.208,4.152,3.312]},"P14":{"sents":["接下来这两个，就是咱们说的正式赛事 ——Roborave 和图灵杯。","同样，我们记住一句话版本，方便给家长讲清楚。\n","先看Roborave：获得央视新闻等权威媒体认可。","成绩受国内外学校认可，为升学履历增添亮点，给孩子拿到国际证书、和全球选手同台交流的机会，锻炼科创能力、拓宽国际视野。"," 它的 4 个核心价值： 央视新闻权威认证 、业内公认的素质教育标杆赛事 帮孩子积累全球化科创履历 、实战经验，为后面白名单赛事做铺垫\n","再看图灵杯 ：这是共青团直属基金会主办、清华大学计算机科学与技术系牵头命题评审的国家级赛事，难度比考级更高。"," 它的核心价值： 用比赛检验阶段性真实学习成果 国赛一等奖选手有机会参与 985 教授科研项目 积累实战经验，对接后续白名单赛事\n","只有我们详细的了解赛考信息才能准确的传达给家长，让家长更加的清晰。"],"durs":[5.688,4.824,4.776,12.96,13.464,12.024,13.704,6.936]},"P15":{"sents":["讲完考级和赛事之后，家长很容易抛出各类顾虑，这一页就是咱们高频异议的标准回应逻辑，核心原则：不争执、先共情，再按逻辑解释，最后拉回目标。","我们一条一条来看：\n"," 质疑整个赛考含金量 回应逻辑：类比大学四六级、清华牵头命题的奥数；","含金量不是「有没有」，是「多和少」。"," 话术参考：其实咱们可以类比四六级、奥数，不是说一张证书就能直接升学，含金量是分梯度的，考级、赛事是一层一层往上积累的，是孩子能力的凭证。\n"," 考级含金量不如比赛 回应逻辑：阶段性检测价值 + 核桃 NOI 金牌数据佐证「学 - 练 - 考 - 赛」体系 话术参考：比赛含金量确实更高，但考级是非常好的阶段性检测。","咱们很多 NOI 金牌学员，都是走学、练、考、赛这套体系，先用考级摸清漏洞，再冲赛事，一步一步往上走。\n"," 英语也考过级、没啥用 回应逻辑：编程没有统一高考，证书 = 分数，手里有证机会来了才能拿出来 话术参考：英语有中考高考统一考试可以直接看分数，但是编程没有统一的升学统考，证书就相当于孩子的 “分数证明”，等到有科技特长、择校机会的时候，有证书才能提交材料。\n"," 为什么要花 600 元 回应逻辑：官方考试，核桃代收，机构不赚一分钱，赛考辅导全程免费 话术参考：这个费用是官方收取的考试报名费，我们只是代收，机构不从中盈利，而且后续配套的赛考辅导，我们是免费给孩子上的。\n"," 为什么要考级 + 比赛都报名 回应逻辑：考点高度重合、效率最高，国家级比赛一年只有一次机会 话术参考：考级和赛事考点重合度很高，一起准备，复习效率最高；","而且这类国家级赛事一年就一次，错过就要再等一整年。\n"," 为什么不能考前再报 回应逻辑：报名窗口固定，辅导是长周期，现在报锁定的是「考位」不是「今天就考」 话术参考：官方报名时间是固定窗口期，名额有限；","同时咱们配套的备考辅导是长线安排，现在报名，本质是锁定考位，不是马上就要参加考试。\n"," 现在参加太早了 回应逻辑：只是提前了解，真正考试在 Level 4，时间绝对充足 话术参考：咱们现在只是提前规划、提前熟悉，正式考试安排在 Level4，准备周期很长，时间非常充裕，早规划不仓促。\n"," 孩子不想参加 回应逻辑：这个年龄段的正常心理，老师可直接跟孩子沟通鼓励，消除顾虑 话术参考：这个年纪孩子怕考试、怕挑战是很正常的，之后我单独和孩子聊一聊，帮他打消顾虑、建立信心。\n"," 孩子学得一般，考不过 回应逻辑：通过率 90%+，主要是积累经验，为比赛做铺垫 话术参考：这个考级通过率在 90% 以上，我们的核心目标也不是冲高分，主要是让孩子体验完整考试流程，积累应试经验，为后面赛事打底。\n"," 上个学期就没考过，不参加 回应逻辑：定位问题，针对性的给孩子辅导，肯定孩子近期的效果 话术参考：上次的情况我们也复盘过，找到了薄弱点，这段时间孩子进步很明显，我们会针对性辅导，帮孩子把之前的问题补上。"],"durs":[14.592,2.016,7.488,3.312,14.808,15.648,10.824,26.904,20.952,15.984,5.904,14.304,9.072,19.488,19.2,21.888,20.88]},"P16":{"sents":["流程和话术都讲完了，最后我们来看：什么样的电话才算达标？"],"durs":[5.712]},"P17":{"sents":["规划电话的质检标标准，一共三大维度，是我们打完电话之后自查、组长抽检的依据。\n"," 通话时长 要求：通话时长＞10 分钟，并且规划相关内容占比要在 50% 以上。"," 太短的电话，很难把考级、赛事、规划讲透；","不是单纯闲聊凑时长，重点是赛考规划的内容要占到一半以上，闲聊、简单寒暄不能占大头。\n"," 学情反馈 三个硬性要求：要有具体场景、有亮点、有不足、给到学习建议。"," 不能空泛说 “孩子学得不错”，一定要拿课堂实例；","既要肯定孩子做得好的地方，也要客观指出薄弱点，最后配套可落地的学习建议，家长才会觉得专业可信。\n"," 异议处理 三点要求：不回避家长提出的疑问、回应逻辑到位、异议处理完之后，一定要再次确认报名意向。","家长有顾虑不要绕开；","按咱们前面的标准话术回应清楚；","讲完之后不能直接结束通话，要闭环，再次确认家长要不要报名考级 / 赛事。\n","一句话总结质检底线：电话够时长、学情讲具体、异议接住并且闭环确认意向。"],"durs":[8.064,8.76,4.896,9.576,7.728,4.392,9.792,10.08,2.64,3.456,7.608,8.16]},"P18":{"sents":["恭喜完成本次学习，请使用飞书扫二维码。","请填写你的真实感受吧!"],"durs":[4.368,2.544]},"P19":{"sents":["电访打得好，招报没烦恼。"],"durs":[2.976]}}};

  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid}, ev, snapshot(online));
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}
/* 实际收听时长：只在播放时累计，按真实时间计（倍速播放不重复计） */
let pageSec = 0, lastT = null;
function flushPage(event){
  const p = curPageSafe();
  if (p && pageSec >= 3) report({event, stage:stageLabel(st.cur.s), page:p.p, minutes:mins(pageSec), detail:p.topic});
  pageSec = 0;
}
function curPageSafe(){ try { return STAGES[st.cur.s].pages[st.cur.p]; } catch(e) { return null; } }
let leftSent = false;
function leaveCourse(){
  if (leftSent || !st.name) return; leftSent = true;
  if (st.view === 'learn') { endPause(false); flushPage('中途离开'); }
  endQuizAway(false);
  save();
  const where = st.view === 'quiz' ? '测试中' : st.view === 'learn' ? '听课中' : '课程首页';
  report({event:'离开课程', stage: st.view === 'home' ? '' : stageLabel(st.cur.s), page: st.view === 'learn' ? ((curPageSafe()||{}).p||'') : '', detail:`在${where}关闭或离开网页`}, '已离开');
}
// 不论停在哪个界面（含课程首页），关网页都上报「已离开」；pagehide 不触发的浏览器用 beforeunload 兜底
window.addEventListener('pagehide', leaveCourse);
window.addEventListener('beforeunload', leaveCourse);
window.addEventListener('pageshow', e => { if (e.persisted) { leftSent = false; report({event:'进入课程', detail:'返回网页'}); } });

/* 小测中切屏：不能暂停答题，但要记录每次离开和离开多久，并提示学员 */
let quizAwayAt = null;
function quizActive(){ return st.view === 'quiz' && quizState && !quizState.result; }
function quizAwayNow(){ return document.hidden || !document.hasFocus(); }
function startQuizAway(){
  if (quizAwayAt != null || !quizActive() || !quizAwayNow()) return;
  quizAwayAt = Date.now();
  const s = stat(curKey()); s.qn = (s.qn||0) + 1;
  report({event:'测试中切屏', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`本次测试第 ${s.qn} 次切屏（${document.hidden ? '切出页面' : '切到其他窗口'}）`});
}
function endQuizAway(doReport){
  if (quizAwayAt == null) return;
  const sec = (Date.now() - quizAwayAt)/1000; quizAwayAt = null;
  const s = stat(curKey()); s.qs = (s.qs||0) + sec;
  if (doReport) report({event:'回到测试', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`离开 ${Math.round(sec)} 秒`});
  const w = $('#quizWarn'); if (w) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs)} 秒，已同步给培训老师。`; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) startQuizAway(); else if (document.hasFocus()) endQuizAway(true); });
window.addEventListener('blur', startQuizAway);
window.addEventListener('focus', () => endQuizAway(true));
setInterval(() => { if (quizActive()) { if (quizAwayNow()) startQuizAway(); else endQuizAway(true); } }, 1000);
/* 占用时长：停留在某关卡（听课或做小测）的全部时间，含暂停、切走 */
let tickAt = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min((now - tickAt)/1000, 70); tickAt = now;
  if (st.name && (st.view === 'learn' || st.view === 'quiz')) { stat(curKey()).occ += dt; if (Math.random() < 0.1) save(); }
}, 1000);
/* 暂停：学员主动暂停或切走窗口导致的暂停（翻页、听完不算） */
let navPause = false, pauseAt = null, pauseWhy = '';
function endPause(doReport){
  if (pauseAt == null) return;
  const sec = (Date.now() - pauseAt)/1000; pauseAt = null;
  stat(st.cur.s).ps += sec;
  if (doReport) report({event:'继续播放', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`暂停 ${Math.round(sec)} 秒（${pauseWhy}）`});
}
/* 卡顿：播放中因网络缓冲停住 */
let stallAt = null;
function endStall(){
  if (stallAt == null) return;
  const sec = (Date.now() - stallAt)/1000; stallAt = null;
  if (sec < 0.8) return;
  const s = stat(st.cur.s); s.kn += 1; s.ks += sec;
  report({event:'卡顿', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`缓冲卡顿 ${sec.toFixed(1)} 秒`});
}

/* ---------- 音频播放 ---------- */
const au = $('#au');
let rate = 1, playing = false, pendingAfter = null;
function pageTiming(p){ return DATA.timing[p.p]; }
function sentAt(p, t){
  const tm = pageTiming(p); let acc = 0;
  for (let i=0;i<tm.durs.length;i++){ acc += tm.durs[i]; if (t < acc) return i; }
  return tm.durs.length-1;
}
au.addEventListener('timeupdate', () => {
  if (st.view !== 'learn') return;
  if (!au.paused && lastT != null) { const dt = au.currentTime - lastT; if (dt > 0 && dt < 3) { const real = dt/(au.playbackRate||1); pageSec += real; st.stageSec[st.cur.s] = (st.stageSec[st.cur.s]||0) + real; stat(st.cur.s).play += real; } }
  lastT = au.currentTime;
  const p = curPage(); const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const i = sentAt(p, au.currentTime);
  const sub = $('#sub'); if (sub && sub.dataset.i != i){ sub.dataset.i = i; sub.textContent = tm.sents[i].trim(); }
  const bar = $('#progfill'); if (bar) bar.style.width = (100*au.currentTime/total).toFixed(1)+'%';
  const tt = $('#time'); if (tt) tt.textContent = fmt(au.currentTime)+' / '+fmt(total);
});
au.addEventListener('ended', () => { playing = false; updPlayBtn(); onPageEnd(); });
au.addEventListener('pause', () => {
  playing = false; updPlayBtn(); endStall();
  const atEnd = au.ended || (au.duration && au.currentTime >= au.duration - 0.3);
  if (navPause || atEnd || st.view !== 'learn') { navPause = false; return; }
  const s = stat(st.cur.s); s.pn += 1; pauseAt = Date.now(); pauseWhy = autoWhy || (document.hidden ? '切出页面自动暂停' : '主动暂停'); autoWhy = '';
  report({event:'暂停', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:pauseWhy});
});
au.addEventListener('play', () => { playing = true; updPlayBtn(); const v=$('#veil'); if(v) v.hidden = true; endPause(true); });
au.addEventListener('waiting', () => { if (!au.paused && au.currentTime > 0.5 && stallAt == null) stallAt = Date.now(); });  // 每页开头的首次加载不算卡顿
au.addEventListener('playing', endStall);
function fmt(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function play(){ au.playbackRate = rate; au.play().catch(() => { const v=$('#veil'); if(v) v.hidden=false; }); }
function updPlayBtn(){ const b = $('#pp'); if (b) b.textContent = playing ? '暂停' : '播放'; }

/* 切走自动暂停——防挂机。两种情况都算：
   1) 页面被隐藏（最小化、切标签页、被完全挡住）；
   2) 浏览器窗口失去焦点（点到了 WPS、微信等其他窗口，哪怕只挡住一部分） */
let autoWhy = '';
function autoPause(why){
  if (!playing) return;
  autoWhy = why; au.pause();
  const v = $('#veil'); if (v) { v.hidden = false; $('#veilBtn').textContent = '检测到你切到了其他窗口，已暂停 · 点我继续'; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause('切出页面自动暂停'); });
window.addEventListener('blur', () => { autoPause('切到其他窗口自动暂停'); });
/* 兜底：个别环境 blur 不触发时，每秒检查一次窗口焦点 */
setInterval(() => { if (playing && !document.hasFocus()) autoPause('切到其他窗口自动暂停'); }, 1000);

/* ---------- 视图 ---------- */
function curStage(){ return STAGES[st.cur.s]; }

function stageStatus(i){
  if (st.passed[i]) return 'pass';

  return 'lock';
}
function mapHTML(active){
  const nodes = STAGES.map((s,i) => {

    const sub = ss==='pass' ? ('已过关'+(st.best[i]!=null?' · '+st.best[i]+'/'+s.quiz.length:'')) : ss==='open' ? (s.quiz.length?'学完测 '+s.quiz.length+' 题':'学完解锁综合测试') : '未解锁';
    return `<button class="node ${ss} ${active===i?'cur':''}" data-go="${i}" ${ss==='lock'?'disabled':''}>
      <span class="k">阶段 ${s.num}</span><span class="t">${esc(TITLES[s.num]||("阶段 "+s.num))}</span><span class="s">${sub}</span></button>`;
  });

function headerHTML(){

function bindCommon(){

}

      ${started ? `<div class="row" style="justify-content:flex-start">

      : `<form id="nameForm"><label for="nm">学员姓名</label>

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function renderLearn(autoplay){
  const s = curStage(), p = curPage();
  const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);

  $('#app').innerHTML = `${headerHTML()}
  ${mapHTML(st.cur.s)}
  ${loopHTML(0)}
  <div class="stage-head"><h2>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}　<span class="muted" style="font-weight:400;font-size:15px">${p.p} ${esc(p.topic)}</span></h2>

function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});

}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];

  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${esc(it.q)}</h3>
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow"></div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    m.querySelectorAll('.opt').forEach(x => x.disabled = true);
    const ok = it.vote || i === it.answer;
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${'ABCD'[i]}：${it.options[i]}`});
    if (ok) {
      st.answered[p.p] = true; save();
      b.classList.add('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    b.classList.add('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = () => askInteract(p); play(); };
    } else {
      m.querySelector(`.opt[data-i="${it.answer}"]`).classList.add('right');
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${'ABCD'[it.answer]}：${esc(it.options[it.answer])}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  });
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div></div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`});
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>
