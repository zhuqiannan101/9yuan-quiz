<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>规划电访全流程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%2740%27%3E%3Ctext x=%27100%27 y=%2725%27 fill=%27%23bbb%27 font-size=%2716%27 text-anchor=%27middle%27 font-family=%27sans-serif%27%3EPPT 加载中…%3C/text%3E%3C/svg%3E") center/200px 40px no-repeat;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}
</style>

<script>
const DATA = {"pages":[{"row":2,"stage":"规划电访-阶段1","p":"P01","topic":"开场提问","script":"各位老师大家好，今天这堂课我们一起来学习「规划沟通」。\n在正式展开之前，我想先让大家建立一个最核心的认识：规划电访这通电话，非常重要。它不是一通随便跟家长寒暄的电话，而是我们在赛事招报正式开始之前，必须提前打好的一通前置电话。\n为什么说它重要？因为等到比赛报名正式开放以后，我们希望家长能够很顺畅地完成报名，而这份顺畅，恰恰来自招报之前的这通电话。在这通电话里，我们要提前把接下来要报名的这场比赛，它的价值和重要性跟家长讲明白，也把报名涉及的费用跟家长说清楚；同时，家长心里可能存在的各种疑问和顾虑，我们要在这通电话里提前沟通、提前化解掉。\n把这些功课都做在前面，等到招报真正开始的时候，我们就会轻松很多。家长已经了解清楚比赛是怎么回事，也清楚费用，心里没有遗留的顾虑，自然就能很快做出报名的决定，不需要我们在招报阶段再反复解释、反复催促。\n所以大家要记住：规划电访的本质，是在招报之前把沟通做足、把铺垫做到位，后面的报名才会水到渠成。","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":3,"stage":"规划电访-阶段1","p":"P02","topic":"章节页","script":"接下来，我们就围绕下面三个部分，一步步给大家展开讲。第一，为什么要做规划电访；第二，这通电话具体该怎么打；第三，我们用什么样的标准来考核这通电话。","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":4,"stage":"规划电访-阶段1","p":"P03","topic":"第一章","script":"我们先进入第一部分：为什么要做规划电访。这一部分我会结合赛事招报的时间安排，以及这通电话对家长、对我们老师分别起到的作用，带大家理清楚。 ","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":5,"stage":"规划电访-阶段1","p":"P04","topic":"规划电访引入","script":"来看一道题，（多选，选2项）赛事招报会在哪个课次开始？","interact":{"q":"（多选，选2项）赛事招报会在哪个课次开始？","at":"P04","options":["L8-4","L9-2","L8-2","L9-4"],"answer":0,"answers":[0,1],"vote":false,"wrong":"直接继续"},"sku":"3299算法\n2699 算法","dept":""},{"row":6,"stage":"规划电访-阶段1","p":"P05","topic":"电话定位","script":"大家看这张时间线。赛事招报是在 L8-4 或者 L9-2 这个阶段才正式开始报名的。所以我们一定要赶在 L8-4 之前，用大约一个月左右的时间，把班里的孩子完整地做一轮规划电访。\n这里要强调一点：规划电访这件事，必须做到百分百覆盖，班里每个孩子我们都要打到，不能漏掉任何一个家长。\n那为什么非要提前花这么大力气做这一轮呢？是因为正式的赛事招报，从头到尾其实只有三天。这三天里，我们要把班上所有家长的意向和异议都处理完，时间是非常紧的。要想在这三天里把这件事高效做完，功夫其实就下在规划电访这里。\n我们需要在规划电访阶段，提前把家长可能存在的异议、真实的意向都排查清楚、摸明白。这样等到赛事招报正式开始以后，我们再去跟家长沟通，心里就有了优先级和顺序，哪些家长意向明确可以先跟进，哪些家长还有顾虑需要重点处理，都能安排得明明白白，处理起来也会更加高效。\n同时也要明确这通电话的定位：它主要是摸底家长的真实意向、提前做好铺垫，并不是在这通电话里催着家长报名，这个分寸大家要把握好。来看一道题，按PPT，规划电访的周期大约多长？","interact":{"q":"按PPT，规划电访的周期大约多长？","at":"P05","options":["约一个月","约一周","约两个月","约半年"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699 算法","dept":""},{"row":7,"stage":"规划电访-阶段1","p":"P06","topic":"规划电访作用","script":"明确了电话的节奏和定位之后，这一页我们来看：这通规划电访，对老师、对家长分别能起到什么作用。\n先看老师这一侧。最直接的作用，是提前摸清家长的真实意向，把可能出现的异议在招报之前化解掉。在此之上，它还有一层更长远的价值：一通有数据、有规划、有针对性的电话，能够帮老师建立起专业、可信的形象，提升家长的粘性和满意度，也为后续正式的赛事报名沟通做好铺垫。\n再看家长这一侧。需要先说明的是，班里的家长基本都在上个学期经历过一次赛事招报，孩子目前大致分为三种情况：第一种，参加了考级并且顺利通过；第二种，参加了考级，但成绩不够理想，或者没有通过；第三种，上学期老师已经给出过比较完整的规划，家长仍然没有选择报名，这类家长往往存在一些尚未解开的顾虑。\n无论家长属于哪一种，我们都要通过这通电话帮他理清四件事：孩子当前处在什么水平，接下来将要学习什么，现阶段的课程对孩子有哪些切实的帮助，以及当下和未来的学习路径分别是怎样的。把这些讲清楚，家长才能对孩子的编程学习形成明确、稳定的预期。","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":8,"stage":"规划电访-阶段2","p":"P07","topic":"第二章","script":"前面我们已经理清了这通电话为什么要打，以及它对老师、对家长分别有哪些价值。那到底怎样才能把这通规划电话打好呢？接下来，我会从打电话之前要做的准备、一通电话完整的流程，再到家长常见异议的回应方式，一步步给大家拆开来讲。","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":9,"stage":"规划电访-阶段2","p":"P08","topic":"规划准备","script":"正式打电话之前，首先要做到知己知彼，这一点跟我们打首通电话是一样的：先把孩子的情况和家长的需求摸清楚。具体来说，打电话前我们需要了解四件事。\n第一，孩子目前的学习情况。一方面看本学期的学习数据，包括年龄、所在省份、当前所在 Level、完课情况和完课时长、闯关表现、作业得分；另一方面也要回顾上一个阶段，孩子有没有参加过考级，考级的结果怎么样。这些数据，就是后面我们跟家长反馈学情的依据。\n第二，简单了解孩子所在省份的竞赛强弱和当地政策，比如当地竞赛氛围如何、科技特长生政策怎样、升学路径是什么。举个例子，如果孩子在北京，我们心里就要清楚，这里的竞争压力是比较大的；如果是陕西、山西这类地区，目前编程方向的竞争压力相对小一些。地域情况不同，我们沟通的侧重点也会跟着调整。\n第三，判断家长属于哪一类型，是思维型、混合动机型，还是精英升学型。这个判断，可以从平时的微信沟通、前后端互通表的记录里去感知。不同类型的家长，沟通重点也不一样：思维型的家长，不宜过多强调比赛对升学的作用，含金量点到为止，重点放在对孩子思维的锻炼、竞赛水平和心理素质的提升上；混合动机型的家长，兴趣和升学两边都要兼顾到；精英升学型的家长，重点在于讲清这次选择对后续路径的铺垫，比如上次已经考过一级，这次去考二级和另一项含金量更高的比赛，既是对这段时间学习的检验和查漏补缺，也是为将来参加更高水平的比赛打基础。三类家长更详细的对比，我们在下一页展开。\n第四，提前约好通话时间。我们先通过微信跟家长约一段十五分钟左右、不被打扰的时间，并明确告知这通电话是围绕孩子本学期的学习规划来沟通。这样做，是为了避免通话时家长身边还有其他人，或者正在忙工作，无法说出真实想法。时间提前空出来，当我们问到他真实意向的时候，家长才能安心作答，把真实的想法和异议都暴露出来。","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":10,"stage":"规划电访-阶段2","p":"P09","topic":"家长分类","script":"这一页我们详细讲解不同类型家长的沟通方式。表格从典型画像、短期目标、长期目标三个维度，对三类家长做了对比。\n首先是思维型家长。这类家长不太关心升学，孩子有兴趣，就愿意让他继续学。短期目标上，我们以保持兴趣、坚持完课、参与本阶段赛考为主；长期目标上，主要是让家长了解到孩子本身很优秀即可，不需要刻意往升学方向引导。\n第二类是混合动机型。孩子有兴趣是基础，同时家长也会考虑升学。短期目标上，以保持兴趣为主，同时向家长说明本期赛事的作用与本阶段赛考的安排；长期目标上，可以引导家长关注白名单赛事，争取拿到市一、省二、国三这样的成绩。\n第三类是精英升学型。这类家长的孩子本身基础较好，家长也愿意投入大量精力。短期目标上，本学期的赛考要明确参加，把参赛的必要性、科技特长生的路径向家长讲透；长期目标则对齐到CSP-J、CSP-S，以及小升初、初升高这样的升学规划。\n还有一个带班时的判断原则需要把握：目前实际带班中，思维型家长的占比是最高的。如果在 L8 轨迹以及前面的服务过程中，还不能明确家长属于哪一类，就一律先按思维型来做规划；后续沟通中，家长若逐渐表现出精英升学的倾向，再往那个方向靠拢。来看一道题，按PPT，混合动机型家长的短期目标是？","interact":{"q":"按PPT，混合动机型家长的短期目标是？","at":"P09","options":["保持兴趣、说明赛事作用、本阶段赛考","保持兴趣、坚持完课、本阶段赛考","本学期赛考必须参加，说明必要性、科技特长生","白名单赛事，市一省二国三"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699 算法","dept":""},{"row":11,"stage":"规划电访-阶段2","p":"P10","topic":"电访流程","script":"接下来我们看规划电访的完整流程，整通电话一共分为五步，中间设有两个决策点。下面我们按顺序一步步来讲。\n第一步，自然开场。接通后先确认家长现在是否方便接听，让家长感受到被尊重，再进入正题。这一步不用急于推销，先把沟通的氛围放松下来，保证家长能安心把这通电话听完。\n第二步，学情复盘。这里要注意顺序：先问，再给信心。我们先问家长一句：\"孩子在家有跟您提过上课的事吗？\" 先听听家长和孩子的真实感受，然后再开始反馈。学情复盘一定要有理有据，不能只看这一学期，还要和上一个阶段做对比，比如上阶段的完课率、随堂测正确率，这学期进步体现在哪里、有哪些课程上的高光时刻，让家长切实看到孩子学下去的希望。这一段具体怎么讲，我们下一页会展开，这里大家先记住三个步骤：给信心、提建议、带到赛考。\n第三步，赛考说明，这是决策点 A。我们把赛考的具体情况和后续规划跟家长讲清楚，这里同样要结合孩子上一阶段的考级情况来分类沟通。如果孩子没有参加过考级，要让家长知道，图形化算法阶段的赛考，是最后一次在图形化阶段检验孩子学习成果的机会；如果孩子参加过但没有通过，上学期已经积累了经验，这一阶段正好查漏补缺，给图形化的学习一个完美收尾；如果孩子参加并且已经通过，一级只是入门证明，二级更能体现孩子持续学习的能力，优势又增加了一层，这学期一定要接着参加。说明清楚之后，再问家长一句：\"您支持孩子去试一下吗？\" 确认他的态度。\n第四步，费用说明，这是决策点 B。如果家长没有异议、表示支持，我们就顺势把赛考的费用讲清楚，再确认一句：\"关于费用没啥问题吧？\" 确认家长在费用上是否还有顾虑。\n第五步，收口，拿到明确的结果。如果两个决策点都没有问题，就跟家长把报名的具体时间和安排说清楚，愉快地结束通话。如果家长在任何一个决策点提出异议，就触发异议处理。异议一定要在这通电话里及时解决，因为当下正是处理问题最合适的时机；处理完之后，要回到刚才的决策点再确认一次意向，不能默认家长已经同意。\n最后，规划电访主要包含哪些流程？来做一个题","interact":{"q":"规划电访主要包含哪些流程？","at":"P10","options":["自然开场","学情复盘","赛考说明","费用说明","收口拿到结果"],"answer":0,"answers":[0,1,2,3,4],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699 算法","dept":""},{"row":12,"stage":"规划电访-阶段2","p":"P11","topic":"学情反馈","script":"学情反馈不能只说孩子表现不错，那样太空了。可以拆成给信心、提建议、带到赛考三步。\n第一步，给信心。这个环节的重点，是讲清楚孩子二阶段这段时间的学习情况，最好能落到某一节课、某一个具体的场景上。比如课前直播里你和孩子做过什么样的互动，如果当时留有截图，讲出来会更加分。所以也建议大家平时带班时多留意、多给自己留存一些这类小物料，打电话时随手就能用上。反馈亮点时尽量用具体的数据和细节，让家长真切感觉到孩子学得不错，比如可以这样说：\"这阶段孩子的作业完成质量很高，XX 在 XX 关卡是自己琢磨着通过的，接受能力很不错。\"\n第二步，提建议。这里要先说明，为什么一定要给孩子提出一个待提升点。一方面，现在的家长通常比较理性，一味地夸奖、只画大饼是行不通的，家长反而会觉得这个老师不够真实；另一方面，从我们后续做规划的角度看，先提出孩子的一个待提升点，再在接下来的学习中针对这个方向持续做功，等家长看到孩子在这一点上确实有了改变，就能非常直观地感受到孩子的进步，也能切实体会到这一学期学下来是有效果的。讲的时候可以先点出问题，再给出后续的学习方向，比如：\"我也注意到孩子在这个地方还有提升空间，这块我们后续会多带着练。\"\n第三步，自然过渡到赛考。前两步讲完之后，不要生硬地切到报名，而是顺着学习情况把话题带到赛考上。可以先问一下上阶段的考试情况：如果孩子上阶段已经报名，就沿这个方向询问考试结果；如果上阶段没有报名，可以这样问：\"上个阶段我看咱 XX 没有参加考试，是时间不太合适，还是有其他特殊情况？\" 问清楚之后，再自然地把话题引回新学期，比如：\"这个阶段刚开始我也跟您电话沟通过，这学期我们同样会有赛事方面的规划，今天再跟您简单聊一聊这学期的赛事安排。\" 这样就把学情反馈和后面的赛考说明顺畅地衔接在了一起。","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":13,"stage":"规划电访-阶段2","p":"P12","topic":"赛考类比","script":"进入赛考说明这一步，我们先用一句简单的话，让家长明白孩子为什么要去参加赛事。这里可以用一个贴近家长认知的类比：编程学到现在这个阶段，就跟高中要面对高考一样，考级相当于模拟考，而正式的赛事就相当于高考。孩子现在所学的内容，刚好已经具备了对应的能力，不妨让他参加一下，顺便检验一下自己的实力。\n把这个道理讲清楚之后，接着向家长抛出决策问题：\"您支持孩子去试一下吗？\" 根据家长的反应，我们分两种情况往下走。\n如果家长表示支持，就顺势进入下一部分的费用说明。这里要注意，不要在这个环节过多展开比赛的含金量，避免节外生枝，顺着家长已经接受的态度往下走就可以。\n如果家长表现出犹豫，或者当场提出了异议，我们就先转入异议处理，针对他提出的问题逐一解答。异议处理完之后，还要再确认一次家长的支持度，不能默认他已经同意，确认家长态度明确之后，再继续往下推进。","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":14,"stage":"规划电访-阶段2","p":"P13","topic":"讲清考级","script":"这一页和下一页，都是配合赛考说明使用的话术。当家长对考级或者赛事的含金量提出质疑时，我们不需要长篇大论地展开，用对应页面上的一句话，把考试的背景和含金量简单讲清楚就可以。\n先看两类考级。如果家长问起 CTL 有什么用，我们可以这样一句话带过：这是共青团中央主管、清华大学计算机系指导的C加加能力认证，考完可以拿到双章证书。在这个基础上，考级的作用主要有几点：通过正向激励，保持孩子学习编程的兴趣；帮助查漏补缺，看看哪些知识点掌握得还不牢；同时积累考试经验，为后面冲刺 GESP 做准备；表现优秀的选手，还可以进入国家级人才库。\n另一类是 YCL。它的一句话介绍是：这是由工业和信息化部教育与考试中心、中国电子教育学会联合主办，也是唯一由中央部委直属单位主办的等级考试。它同样能起到保持兴趣、查漏补缺、积累考试经验的作用，为后面参加国赛打基础，优秀选手可以进入工信部人才库。\n大家在使用时记住原则：家长问起来，先把主办单位和证书性质一句话说清，价值点到为止。来看一道题，考级的主要作用包括？","interact":{"q":"考级的主要作用包括（多选）","at":"P13","options":["正向激励,保持编程兴趣","查漏补缺","积累考试经验","优秀选手有机会进入对应的人才库"],"answer":0,"answers":[0,1,2,3],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699 算法","dept":""},{"row":15,"stage":"规划电访-阶段2","p":"P14","topic":"讲清赛事","script":"这一页是两个赛事的一句话介绍。\n第一类是 Roborave。它获得了央视新闻等权威媒体的认可，成绩受到国内外学校认可，可以为孩子的升学履历增添亮点；同时能让孩子拿到国际证书，有机会和全球选手同台交流，在培养科创能力的同时拓展国际化视野。概括来说，它既有央视新闻的权威认证，是业内认可的素质教育标杆，也能形成一份全球化的科创活动履历，为后续参加白名单赛事积累实战经验。\n第二类是图灵杯。可以这样一句话介绍：这是共青团直属基金会主办、由清华大学计算机科学与技术系牵头赛事命题和评审的国家级赛事，难度比考级更高。参加图灵杯，主要是用比赛检验孩子阶段性的学习效果；拿到国一的选手，还有机会参与 985 高校教授的科研项目，同时也为后续的白名单赛事积累实战经验。\n和上一页一样，这些介绍都是用来回应家长对含金量的疑问，点到为止即可，讲清楚背景和价值之后，再回到通话的主流程上。","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":16,"stage":"规划电访-阶段2","p":"P15","topic":"常见异议","script":"讲完考级和赛事，家长很容易抛出各种顾虑。这一页是高频异议的标准回应逻辑。核心原则是：不争执，先共情，再按逻辑解释，最后拉回目标，也就是回到决策点再确认一次意向。我们一条一条看。第一条，质疑整个赛考的含金量。回应逻辑是类比大学四六级，含金量不是有没有，而是多和少。可以这样说：不是一张证书就能直接升学，含金量是分梯度的，考级、赛事是一层一层往上积累的，是孩子能力的凭证。如果孩子之前参加过，还可以补一句，有了赛考基础，这学期通过的概率会更大。第二条，考级含金量不如比赛。先认同，比赛含金量确实更高，但考级是非常好的阶段性检测。再用核桃 NOI 金牌学员来佐证：很多金牌学员都是走学、练、考、赛这套体系，先用考级摸清漏洞，再冲赛事，一步一步往上走。第三条，英语也考过级，没啥用。回应逻辑是，英语有中考、高考统一考试，可以直接看分数；编程没有统一的升学统考，证书就相当于孩子的分数证明，等到有科技特长、择校机会的时候，手里有证书才能拿出来。第四条，为什么要花 600 元。这是官方考试的报名费，核桃只是代收，机构不赚一分钱，而且配套的赛考辅导全程免费。第五条，为什么考级和比赛都要报名。两者考点高度重合，一起准备复习效率最高；考级是正规的能力认证，能证明孩子已经具备稳定的逻辑编程能力；而且国家级比赛一年只有一次机会，错过就要再等一整年。第六条，为什么不能考前再报。官方报名是固定窗口期，名额有限；配套的备考辅导又是长周期安排。现在报名，锁定的是考位，不是今天就考。第七条，现在参加太早了。告诉家长，现在只是提前了解、提前规划，正式考试安排在 Level 10，准备时间非常充足，早规划不仓促。第八条，孩子不想参加。这个年纪的孩子怕考试、怕挑战很正常，老师可以直接跟孩子沟通鼓励。结合孩子上阶段的赛考通过情况给孩子信心，并跟家长说，之后老师单独和孩子聊一聊，帮孩子打消顾虑。第九条，孩子学得一般，考不过。这个考级通过率在 90% 以上，我们的目标也不是冲高分，主要是让孩子体验完整的考试流程，积累经验，为后面的比赛做铺垫。第十条，上个学期就没考过，不参加。先定位问题，上次的情况我们复盘过，找到了薄弱点；再肯定孩子近期的进步；最后说明会针对性辅导，帮孩子把之前的问题补上。最后再补一个二阶段家长常提的问题：老师一直在提白名单赛事，可我感觉不到有什么实际成果。这时候千万别争辩，先承认家长的感受，再从三个方面让成果看得见。第一，讲能力上的成果。拿孩子的学情数据和课堂表现，对比上阶段讲进步，这是家长最能直接感受到的。第二，讲证书的用途。编程没有统一考试，证书就是孩子的分数证明，平时看不出来，等到科技特长、择校这些机会来了，手里有证才拿得出来。第三，讲本地的具体用途。结合电话前查好的当地科技特长生政策和升学路径，告诉家长这条路在当地具体怎么走。注意按家长类型来，思维型家长不要硬讲升学。讲完，同样要回到决策点，再确认一次意向。","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":17,"stage":"规划电访-阶段3","p":"P16","topic":"第三章","script":"流程和话术都讲完了，最后进入第三部分，考核标准：什么样的规划电话才算达标？","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":18,"stage":"规划电访-阶段3","p":"P17","topic":"考核标准","script":"规划电话的质检标准一共三个维度，是大家打完电话自查、组长抽检的依据，也是本次考核标准。第一，通话时长。要求大于 10 分钟，而且规划相关内容占比要在 50% 以上。电话太短，考级、赛事、规划很难讲透；但也不是闲聊凑时长，寒暄不能占大头，赛考规划的内容要占到一半以上。第二，学情反馈，三个硬性要求：有具体场景，有亮点有不足，有学习建议。不能空泛地说孩子学得不错，要拿课堂实例；既肯定做得好的地方，也客观指出薄弱点，最后给出能落地的学习建议，家长才会觉得专业可信。第三，异议处理，也是三点：不回避问题，回应到位，处理完再确认意向。家长有顾虑不要绕开，按前面的标准逻辑回应清楚；讲完不能直接挂电话，要再次确认家长要不要报名考级或赛事。来看一道题，按考核标准，学情反馈的要求是？","interact":{"q":"按考核标准，学情反馈的要求是？","at":"P17","options":["有具体场景、有亮点有不足、有学习建议","不回避问题、回应到位、处理完再确认意向","大于10分钟、规划内容占比50%以上","用具体数据说亮点、只讲优点"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699 算法","dept":""},{"row":19,"stage":"规划电访-阶段3","p":"P18","topic":"问卷调研","script":"恭喜大家完成本次学习！请用飞书扫一扫屏幕上的二维码，填写规划沟通调研问卷，把你的真实感受告诉我们。填写完成后，回答下面这道题就可以了。","interact":null,"sku":"3299算法\n2699 算法","dept":""},{"row":20,"stage":"规划电访-阶段3","p":"P19","topic":"结尾页","script":"最后送大家一句话：电访打得好，招报没烦恼。","interact":null,"sku":"3299算法\n2699 算法","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题·单选","chapter":"规划电访-阶段1","q":"规划电访的核心定位是什么？","options":[{"k":"A","t":"打电话当场说服家长报名赛事"},{"k":"B","t":"摸底意向，不催报名"},{"k":"C","t":"重点和家长催长期续报"},{"k":"D","t":"主要用来解决家长投诉"}],"answer":"B","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S02","type":"阶段练习题·单选","chapter":"规划电访-阶段1","q":"按PPT，规划电访的完成时间要求是？","options":[{"k":"A","t":"L8-4前必须完成"},{"k":"B","t":"L9-2前必须完成"},{"k":"C","t":"L8-2前必须完成"},{"k":"D","t":"L9-4前必须完成"}],"answer":"A","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S03","type":"阶段练习题·多选","chapter":"规划电访-阶段1","q":"按PPT，下列哪项属于规划电访对老师的作用？","options":[{"k":"A","t":"为正式报名沟通做铺垫"},{"k":"B","t":"清楚孩子当前水平"},{"k":"C","t":"知道接下来学什么"},{"k":"D","t":"看到课程对孩子的帮助"}],"answer":"A","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S04","type":"阶段练习题·多选","chapter":"规划电访-阶段1","q":"以下哪一项不属于规划电访对家长的作用？","options":[{"k":"A","t":"清楚孩子当前编程水平"},{"k":"B","t":"知道后续学习内容"},{"k":"C","t":"建立明确的学习预期"},{"k":"D","t":"直接敲定赛事报名"}],"answer":"AB","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S05","type":"阶段练习题·单选","chapter":"规划电访-阶段1","q":"按PPT，规划电访对家长的作用，除清楚孩子当前水平、知道接下来学什么外，还包括？","options":[{"k":"A","t":"看到课程对孩子的帮助、对编程学习有明确预期"},{"k":"B","t":"建立专业可信形象、提升家长粘性"},{"k":"C","t":"提前摸清家长真实意向"},{"k":"D","t":"为正式报名沟通做铺垫"}],"answer":"A","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S06","type":"阶段练习题·多选","chapter":"规划电访-阶段2","q":"（多选）按PPT，家长主要分为哪几类？","options":[{"k":"A","t":"思维型"},{"k":"B","t":"混合动机型"},{"k":"C","t":"精英升学型"},{"k":"D","t":"托管型"}],"answer":"ABC","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S07","type":"阶段练习题·单选","chapter":"规划电访-阶段2","q":"在规划电话沟通流程中，第一步是？","options":[{"k":"A","t":"学情反馈"},{"k":"B","t":"自然开场"},{"k":"C","t":"讲考级"},{"k":"D","t":"处理异议"}],"answer":"B","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S08","type":"阶段练习题·单选","chapter":"规划电访-阶段2","q":"CTL 考级的主办指导单位是？","options":[{"k":"A","t":"工信部教育与考试中心"},{"k":"B","t":"共青团中央主管、清华计算机系指导"},{"k":"C","t":"共青团直属基金会"},{"k":"D","t":"央视科创组委会"}],"answer":"B","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S09","type":"阶段练习题·单选","chapter":"规划电访-阶段2","q":"关于 Roborave 赛事，下面说法正确的是？","options":[{"k":"A","t":"由清华计算机系牵头命题评审"},{"k":"B","t":"获得央视新闻权威认可，可积累全球化科创履历"},{"k":"C","t":"通过率 90% 以上，定位只是模拟考"},{"k":"D","t":"一年有多次比赛机会"}],"answer":"B","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S10","type":"阶段练习题·单选","chapter":"规划电访-阶段2","q":"家长提出 “孩子学得一般，考不过”，对应的标准回应逻辑是？","options":[{"k":"A","t":"直接建议不要报名，等学好再说"},{"k":"B","t":"通过率 90%+，主要是积累经验，为比赛做铺垫"},{"k":"C","t":"告诉家长考不过也可以全额退费"},{"k":"D","t":"跟家长说必须报名，才有参赛资格"}],"answer":"B","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S11","type":"阶段练习题·单选","chapter":"规划电访-阶段3","q":"规划电话合格的通话时长要求是？","options":[{"k":"A","t":"大于 8 分钟"},{"k":"B","t":"大于 10 分钟"},{"k":"C","t":"大于 12 分钟"},{"k":"D","t":"大于 15 分钟"}],"answer":"B","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S12","type":"阶段练习题·单选","chapter":"规划电访-阶段3","q":"规划电话里，规划相关内容占比要求？","options":[{"k":"A","t":"30% 以上"},{"k":"B","t":"50% 以上"},{"k":"C","t":"70% 以上"},{"k":"D","t":"90% 以上"}],"answer":"B","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S13","type":"阶段练习题·单选","chapter":"规划电访-阶段3","q":"不属于合格学情反馈要求的是？","options":[{"k":"A","t":"有具体场景"},{"k":"B","t":"只讲亮点，不提不足"},{"k":"C","t":"有亮点也有不足"},{"k":"D","t":"给出学习建议"}],"answer":"B","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S14","type":"阶段练习题·单选","chapter":"规划电访-阶段3","q":"按考核标准，异议处理完之后应做什么？","options":[{"k":"A","t":"再确认意向"},{"k":"B","t":"直接结束通话"},{"k":"C","t":"直接进入收口"},{"k":"D","t":"默认家长已同意"}],"answer":"A","back":"","sku":"3299算法\n2699 算法"},{"id":"T-S15","type":"阶段练习题·单选","chapter":"规划电访-阶段3","q":"关于规划电话质检标准，说法正确的是？","options":[{"k":"A","t":"只要时长够，就一定达标"},{"k":"B","t":"学情反馈只夸孩子，不用提短板"},{"k":"C","t":"家长疑问不能回避，要规范回应"},{"k":"D","t":"规划内容占比没有硬性要求"}],"answer":"C","back":"","sku":"3299算法\n2699 算法"},{"id":"T-F01","type":"本章综合测试题·单选","chapter":"规划电访·全章","q":"规划电访中，赛考说明后家长表示犹豫，按PPT应如何推进？","options":[{"k":"A","t":"进异议处理，处理完再确认一次支持度，不默认同意"},{"k":"B","t":"不要多讲含金量，直接进费用说明"},{"k":"C","t":"跳过赛考说明，直接收口"},{"k":"D","t":"默认家长同意，进入费用说明"}],"answer":"A","back":"","sku":"3299算法\n2699 算法"},{"id":"T-F02","type":"本章综合测试题·多选","chapter":"规划电访·全章","q":"对于家长，规划电访的作用是？（多选）","options":[{"k":"A","t":"清楚孩子当前水平"},{"k":"B","t":"知道接下来学什么"},{"k":"C","t":"看到课程对孩子的帮助"},{"k":"D","t":"对编程学习有明确预期"}],"answer":"ABCD","back":"","sku":"3299算法\n2699 算法"},{"id":"T-F03","type":"本章综合测试题·多选","chapter":"规划电访·全章","q":"在打规划电访之前我们应该了解哪些信息做好哪些准备？（多选）","options":[{"k":"A","t":"孩子学习数据"},{"k":"B","t":"家长属于哪一类"},{"k":"C","t":"省份政策与竞争情况"},{"k":"D","t":"确定好电访合适的时间"}],"answer":"ABCD","back":"","sku":"3299算法\n2699 算法"},{"id":"T-F04","type":"本章综合测试题·多选","chapter":"规划电访·全章","q":"规划电访的步骤包含？（多选）","options":[{"k":"A","t":"自然开场"},{"k":"B","t":"学情复盘"},{"k":"C","t":"赛考说明"},{"k":"D","t":"费用说明"},{"k":"E","t":"收口"}],"answer":"ABCDE","back":"","sku":"3299算法\n2699 算法"},{"id":"T-F05","type":"本章综合测试题·多选","chapter":"规划电访·全章","q":"按PPT，精英升学型家长的长期目标是？","options":[{"k":"A","t":"CSP-J/S、小升初/初升高"},{"k":"B","t":"白名单赛事，市一省二国三"},{"k":"C","t":"告知家长孩子优秀即可"},{"k":"D","t":"本学期赛考必须参加"}],"answer":"A","back":"","sku":"3299算法\n2699 算法"},{"id":"T-F06","type":"本章综合测试题·单选","chapter":"规划电访·全章","q":"家长问「为什么要花600元」，按PPT回应逻辑是？","options":[{"k":"A","t":"官方考试，核桃代收，机构不赚一分钱，赛考辅导全程免费"},{"k":"B","t":"考点高度重合、效率最高，国家级比赛一年只有一次机会"},{"k":"C","t":"编程没有统一高考，证书=分数"},{"k":"D","t":"报名窗口固定，现在报锁定的是「考位」"}],"answer":"A","back":"","sku":"3299算法\n2699 算法"},{"id":"T-F07","type":"本章综合测试题·单选","chapter":"规划电访·全章","q":"家长说「现在参加太早了」，按PPT回应逻辑是？","options":[{"k":"A","t":"只是提前了解，真正考试在Level 10，时间绝对充足"},{"k":"B","t":"通过率90%+，主要是积累经验，为比赛做铺垫"},{"k":"C","t":"报名窗口固定，辅导是长周期"},{"k":"D","t":"这个年龄段的正常心理，老师可直接跟孩子沟通鼓励"}],"answer":"A","back":"","sku":"3299算法\n2699 算法"},{"id":"T-F08","type":"本章综合测试题·单选","chapter":"规划电访·全章","q":"YCL的主办单位是？","options":[{"k":"A","t":"工业和信息化部教育与考试中心、中国电子教育学会联合主办"},{"k":"B","t":"共青团中央主管"},{"k":"C","t":"清华大学计算机系"},{"k":"D","t":"计算机电子学会"}],"answer":"A","back":"","sku":"3299算法\n2699 算法"},{"id":"T-F09","type":"本章综合测试题·多选","chapter":"规划电访·全章","q":"图灵杯的主办与命题评审单位是？","options":[{"k":"A","t":"共青团直属基金会主办，清华大学计算机科学与技术系牵头命题和评审"},{"k":"B","t":"共青团中央主管，清华计算机系指导"},{"k":"C","t":"工业和信息化部教育与考试中心、中国电子教育学会联合主办"},{"k":"D","t":"央视新闻等权威媒体认可"}],"answer":"A","back":"","sku":"3299算法\n2699 算法"},{"id":"T-F10","type":"本章综合测试题·多选","chapter":"规划电访·全章","q":"（多选）家长质疑整个赛考含金量，按PPT回应逻辑包括？","options":[{"k":"A","t":"类比大学四六级"},{"k":"B","t":"含金量不是「有无」，是「多与少」"},{"k":"C","t":"阶段性检测价值+核桃NOI金牌数据佐证"},{"k":"D","t":"考点高度重合、效率最高"}],"answer":"AB","back":"","sku":"3299算法\n2699 算法"}],"timing":{"P01":{"sents":["各位老师大家好，今天这堂课我们一起来学习「规划沟通」。\n","在正式展开之前，我想先让大家建立一个最核心的认识：规划电访这通电话，非常重要。","它不是一通随便跟家长寒暄的电话，而是我们在赛事招报正式开始之前，必须提前打好的一通前置电话。\n","为什么说它重要？","因为等到比赛报名正式开放以后，我们希望家长能够很顺畅地完成报名，而这份顺畅，恰恰来自招报之前的这通电话。","在这通电话里，我们要提前把接下来要报名的这场比赛，它的价值和重要性跟家长讲明白，也把报名涉及的费用跟家长说清楚；","同时，家长心里可能存在的各种疑问和顾虑，我们要在这通电话里提前沟通、提前化解掉。\n","把这些功课都做在前面，等到招报真正开始的时候，我们就会轻松很多。","家长已经了解清楚比赛是怎么回事，也清楚费用，心里没有遗留的顾虑，自然就能很快做出报名的决定，不需要我们在招报阶段再反复解释、反复催促。\n","所以大家要记住：规划电访的本质，是在招报之前把沟通做足、把铺垫做到位，后面的报名才会水到渠成。"],"durs":[5.328,8.136,9.6,1.968,10.608,11.592,8.832,6.528,13.464,10.32]},"P02":{"sents":["接下来，我们就围绕下面三个部分，一步步给大家展开讲。","第一，为什么要做规划电访；","第二，这通电话具体该怎么打；","第三，我们用什么样的标准来考核这通电话。"],"durs":[5.256,3.072,3.408,4.416]},"P03":{"sents":["我们先进入第一部分：为什么要做规划电访。","这一部分我会结合赛事招报的时间安排，以及这通电话对家长、对我们老师分别起到的作用，带大家理清楚。"],"durs":[4.176,9.888]},"P06":{"sents":["明确了电话的节奏和定位之后，这一页我们来看：这通规划电访，对老师、对家长分别能起到什么作用。\n","先看老师这一侧。","最直接的作用，是提前摸清家长的真实意向，把可能出现的异议在招报之前化解掉。","在此之上，它还有一层更长远的价值：一通有数据、有规划、有针对性的电话，能够帮老师建立起专业、可信的形象，提升家长的粘性和满意度，也为后续正式的赛事报名沟通做好铺垫。\n","再看家长这一侧。","需要先说明的是，班里的家长基本都在上个学期经历过一次赛事招报，孩子目前大致分为三种情况：第一种，参加了考级并且顺利通过；","第二种，参加了考级，但成绩不够理想，或者没有通过；","第三种，上学期老师已经给出过比较完整的规划，家长仍然没有选择报名，这类家长往往存在一些尚未解开的顾虑。\n","无论家长属于哪一种，我们都要通过这通电话帮他理清四件事：孩子当前处在什么水平，接下来将要学习什么，现阶段的课程对孩子有哪些切实的帮助，以及当下和未来的学习路径分别是怎样的。","把这些讲清楚，家长才能对孩子的编程学习形成明确、稳定的预期。"],"durs":[9.552,2.112,7.992,17.304,2.064,12.768,5.472,10.512,17.736,6.816]},"P07":{"sents":["前面我们已经理清了这通电话为什么要打，以及它对老师、对家长分别有哪些价值。","那到底怎样才能把这通规划电话打好呢？","接下来，我会从打电话之前要做的准备、一通电话完整的流程，再到家长常见异议的回应方式，一步步给大家拆开来讲。"],"durs":[7.8,4.104,10.656]},"P08":{"sents":["正式打电话之前，首先要做到知己知彼，这一点跟我们打首通电话是一样的：先把孩子的情况和家长的需求摸清楚。","具体来说，打电话前我们需要了解四件事。\n","第一，孩子目前的学习情况。","一方面看本学期的学习数据，包括年龄、所在省份、当前所在 Level、完课情况和完课时长、闯关表现、作业得分；","另一方面也要回顾上一个阶段，孩子有没有参加过考级，考级的结果怎么样。","这些数据，就是后面我们跟家长反馈学情的依据。\n","第二，简单了解孩子所在省份的竞赛强弱和当地政策，比如当地竞赛氛围如何、科技特长生政策怎样、升学路径是什么。","举个例子，如果孩子在北京，我们心里就要清楚，这里的竞争压力是比较大的；","如果是陕西、山西这类地区，目前编程方向的竞争压力相对小一些。","地域情况不同，我们沟通的侧重点也会跟着调整。\n","第三，判断家长属于哪一类型，是思维型、混合动机型，还是精英升学型。","这个判断，可以从平时的微信沟通、前后端互通表的记录里去感知。","不同类型的家长，沟通重点也不一样：思维型的家长，不宜过多强调比赛对升学的作用，含金量点到为止，重点放在对孩子思维的锻炼、竞赛水平和心理素质的提升上；","混合动机型的家长，兴趣和升学两边都要兼顾到；","精英升学型的家长，重点在于讲清这次选择对后续路径的铺垫，比如上次已经考过一级，这次去考二级和另一项含金量更高的比赛，既是对这段时间学习的检验和查漏补缺，也是为将来参加更高水平的比赛打基础。","三类家长更详细的对比，我们在下一页展开。\n","第四，提前约好通话时间。","我们先通过微信跟家长约一段十五分钟左右、不被打扰的时间，并明确告知这通电话是围绕孩子本学期的学习规划来沟通。","这样做，是为了避免通话时家长身边还有其他人，或者正在忙工作，无法说出真实想法。","时间提前空出来，当我们问到他真实意向的时候，家长才能安心作答，把真实的想法和异议都暴露出来。"],"durs":[10.248,4.32,3.048,11.328,6.768,4.92,11.928,7.056,6.696,4.752,7.488,6.384,15.552,5.04,19.8,4.296,3.144,11.28,8.304,9.312]},"P10":{"sents":["接下来我们看规划电访的完整流程，整通电话一共分为五步，中间设有两个决策点。","下面我们按顺序一步步来讲。\n","第一步，自然开场。","接通后先确认家长现在是否方便接听，让家长感受到被尊重，再进入正题。","这一步不用急于推销，先把沟通的氛围放松下来，保证家长能安心把这通电话听完。\n","第二步，学情复盘。","这里要注意顺序：先问，再给信心。","我们先问家长一句：\"孩子在家有跟您提过上课的事吗？\""," 先听听家长和孩子的真实感受，然后再开始反馈。","学情复盘一定要有理有据，不能只看这一学期，还要和上一个阶段做对比，比如上阶段的完课率、随堂测正确率，这学期进步体现在哪里、有哪些课程上的高光时刻，让家长切实看到孩子学下去的希望。","这一段具体怎么讲，我们下一页会展开，这里大家先记住三个步骤：给信心、提建议、带到赛考。\n","第三步，赛考说明，这是决策点 A。","我们把赛考的具体情况和后续规划跟家长讲清楚，这里同样要结合孩子上一阶段的考级情况来分类沟通。","如果孩子没有参加过考级，要让家长知道，图形化算法阶段的赛考，是最后一次在图形化阶段检验孩子学习成果的机会；","如果孩子参加过但没有通过，上学期已经积累了经验，这一阶段正好查漏补缺，给图形化的学习一个完美收尾；","如果孩子参加并且已经通过，一级只是入门证明，二级更能体现孩子持续学习的能力，优势又增加了一层，这学期一定要接着参加。","说明清楚之后，再问家长一句：\"您支持孩子去试一下吗？\""," 确认他的态度。\n","第四步，费用说明，这是决策点 B。","如果家长没有异议、表示支持，我们就顺势把赛考的费用讲清楚，再确认一句：\"关于费用没啥问题吧？\""," 确认家长在费用上是否还有顾虑。\n","第五步，收口，拿到明确的结果。","如果两个决策点都没有问题，就跟家长把报名的具体时间和安排说清楚，愉快地结束通话。","如果家长在任何一个决策点提出异议，就触发异议处理。","异议一定要在这通电话里及时解决，因为当下正是处理问题最合适的时机；","处理完之后，要回到刚才的决策点再确认一次意向，不能默认家长已经同意。\n","最后，规划电访主要包含哪些流程？","来做一个题"],"durs":[8.112,2.904,2.352,7.824,7.92,2.448,3.72,5.04,5.016,18.144,9.048,3.864,9.624,11.328,10.68,12.168,5.28,1.896,3.768,9.24,3.48,3.552,8.256,5.328,7.08,7.512,3.864,1.872]},"P11":{"sents":["学情反馈不能只说孩子表现不错，那样太空了。","可以拆成给信心、提建议、带到赛考三步。\n","第一步，给信心。","这个环节的重点，是讲清楚孩子二阶段这段时间的学习情况，最好能落到某一节课、某一个具体的场景上。","比如课前直播里你和孩子做过什么样的互动，如果当时留有截图，讲出来会更加分。","所以也建议大家平时带班时多留意、多给自己留存一些这类小物料，打电话时随手就能用上。","反馈亮点时尽量用具体的数据和细节，让家长真切感觉到孩子学得不错，比如可以这样说：\"这阶段孩子的作业完成质量很高，XX 在 XX 关卡是自己琢磨着通过的，接受能力很不错。\"\n","第二步，提建议。","这里要先说明，为什么一定要给孩子提出一个待提升点。","一方面，现在的家长通常比较理性，一味地夸奖、只画大饼是行不通的，家长反而会觉得这个老师不够真实；","另一方面，从我们后续做规划的角度看，先提出孩子的一个待提升点，再在接下来的学习中针对这个方向持续做功，等家长看到孩子在这一点上确实有了改变，就能非常直观地感受到孩子的进步，也能切实体会到这一学期学下来是有效果的。","讲的时候可以先点出问题，再给出后续的学习方向，比如：\"我也注意到孩子在这个地方还有提升空间，这块我们后续会多带着练。\"\n","第三步，自然过渡到赛考。","前两步讲完之后，不要生硬地切到报名，而是顺着学习情况把话题带到赛考上。","可以先问一下上阶段的考试情况：如果孩子上阶段已经报名，就沿这个方向询问考试结果；","如果上阶段没有报名，可以这样问：\"上个阶段我看咱 XX 没有参加考试，是时间不太合适，还是有其他特殊情况？\""," 问清楚之后，再自然地把话题引回新学期，比如：\"这个阶段刚开始我也跟您电话沟通过，这学期我们同样会有赛事方面的规划，今天再跟您简单聊一聊这学期的赛事安排。\""," 这样就把学情反馈和后面的赛考说明顺畅地衔接在了一起。"],"durs":[5.016,4.416,2.112,9.6,7.776,8.688,16.8,2.232,5.208,10.056,21.312,11.952,2.928,7.512,8.592,10.248,15.48,5.904]},"P12":{"sents":["进入赛考说明这一步，我们先用一句简单的话，让家长明白孩子为什么要去参加赛事。","这里可以用一个贴近家长认知的类比：编程学到现在这个阶段，就跟高中要面对高考一样，考级相当于模拟考，而正式的赛事就相当于高考。","孩子现在所学的内容，刚好已经具备了对应的能力，不妨让他参加一下，顺便检验一下自己的实力。\n","把这个道理讲清楚之后，接着向家长抛出决策问题：\"您支持孩子去试一下吗？\""," 根据家长的反应，我们分两种情况往下走。\n","如果家长表示支持，就顺势进入下一部分的费用说明。","这里要注意，不要在这个环节过多展开比赛的含金量，避免节外生枝，顺着家长已经接受的态度往下走就可以。\n","如果家长表现出犹豫，或者当场提出了异议，我们就先转入异议处理，针对他提出的问题逐一解答。","异议处理完之后，还要再确认一次家长的支持度，不能默认他已经同意，确认家长态度明确之后，再继续往下推进。"],"durs":[7.56,13.176,8.736,6.912,4.32,5.04,10.176,9.024,10.824]},"P14":{"sents":["这一页是两个赛事的一句话介绍。\n","第一类是 Roborave。","它获得了央视新闻等权威媒体的认可，成绩受到国内外学校认可，可以为孩子的升学履历增添亮点；","同时能让孩子拿到国际证书，有机会和全球选手同台交流，在培养科创能力的同时拓展国际化视野。","概括来说，它既有央视新闻的权威认证，是业内认可的素质教育标杆，也能形成一份全球化的科创活动履历，为后续参加白名单赛事积累实战经验。\n","第二类是图灵杯。","可以这样一句话介绍：这是共青团直属基金会主办、由清华大学计算机科学与技术系牵头赛事命题和评审的国家级赛事，难度比考级更高。","参加图灵杯，主要是用比赛检验孩子阶段性的学习效果；","拿到国一的选手，还有机会参与 985 高校教授的科研项目，同时也为后续的白名单赛事积累实战经验。\n","和上一页一样，这些介绍都是用来回应家长对含金量的疑问，点到为止即可，讲清楚背景和价值之后，再回到通话的主流程上。"],"durs":[3.384,2.256,9.216,9.72,13.632,2.112,13.752,5.568,9.792,11.928]},"P16":{"sents":["流程和话术都讲完了，最后进入第三部分，考核标准：什么样的规划电话才算达标？"],"durs":[7.824]},"P18":{"sents":["恭喜大家完成本次学习！","请用飞书扫一扫屏幕上的二维码，填写规划沟通调研问卷，把你的真实感受告诉我们。","填写完成后，回答下面这道题就可以了。"],"durs":[2.856,7.896,3.864]},"P19":{"sents":["最后送大家一句话：电访打得好，招报没烦恼。"],"durs":[4.8]},"P13":{"sents":["这一页和下一页，都是配合赛考说明使用的话术。","当家长对考级或者赛事的含金量提出质疑时，我们不需要长篇大论地展开，用对应页面上的一句话，把考试的背景和含金量简单讲清楚就可以。\n","先看两类考级。","如果家长问起 CTL 有什么用，我们可以这样一句话带过：这是共青团中央主管、清华大学计算机系指导的C加加能力认证，考完可以拿到双章证书。","在这个基础上，考级的作用主要有几点：通过正向激励，保持孩子学习编程的兴趣；","帮助查漏补缺，看看哪些知识点掌握得还不牢；","同时积累考试经验，为后面冲刺 GESP 做准备；","表现优秀的选手，还可以进入国家级人才库。\n","另一类是 YCL。","它的一句话介绍是：这是由工业和信息化部教育与考试中心、中国电子教育学会联合主办，也是唯一由中央部委直属单位主办的等级考试。","它同样能起到保持兴趣、查漏补缺、积累考试经验的作用，为后面参加国赛打基础，优秀选手可以进入工信部人才库。\n","大家在使用时记住原则：家长问起来，先把主办单位和证书性质一句话说清，价值点到为止。","来看一道题，考级的主要作用包括？"],"durs":[4.752,12.816,2.064,13.992,7.752,4.68,5.448,4.44,2.352,12.648,11.328,8.904,3.456]},"P04":{"sents":["来看一道题，（多选，选2项）赛事招报会在哪个课次开始？"],"durs":[6.024]},"P05":{"sents":["大家看这张时间线。","赛事招报是在 L8-4 或者 L9-2 这个阶段才正式开始报名的。","所以我们一定要赶在 L8-4 之前，用大约一个月左右的时间，把班里的孩子完整地做一轮规划电访。\n","这里要强调一点：规划电访这件事，必须做到百分百覆盖，班里每个孩子我们都要打到，不能漏掉任何一个家长。\n","那为什么非要提前花这么大力气做这一轮呢？","是因为正式的赛事招报，从头到尾其实只有三天。","这三天里，我们要把班上所有家长的意向和异议都处理完，时间是非常紧的。","要想在这三天里把这件事高效做完，功夫其实就下在规划电访这里。\n","我们需要在规划电访阶段，提前把家长可能存在的异议、真实的意向都排查清楚、摸明白。","这样等到赛事招报正式开始以后，我们再去跟家长沟通，心里就有了优先级和顺序，哪些家长意向明确可以先跟进，哪些家长还有顾虑需要重点处理，都能安排得明明白白，处理起来也会更加高效。\n","同时也要明确这通电话的定位：它主要是摸底家长的真实意向、提前做好铺垫，并不是在这通电话里催着家长报名，这个分寸大家要把握好。","来看一道题，按PPT，规划电访的周期大约多长？"],"durs":[2.328,6.648,9.168,10.128,4.128,5.016,6.864,6.576,8.544,17.904,13.152,5.568]},"P09":{"sents":["这一页我们详细讲解不同类型家长的沟通方式。","表格从典型画像、短期目标、长期目标三个维度，对三类家长做了对比。\n","首先是思维型家长。","这类家长不太关心升学，孩子有兴趣，就愿意让他继续学。","短期目标上，我们以保持兴趣、坚持完课、参与本阶段赛考为主；","长期目标上，主要是让家长了解到孩子本身很优秀即可，不需要刻意往升学方向引导。\n","第二类是混合动机型。","孩子有兴趣是基础，同时家长也会考虑升学。","短期目标上，以保持兴趣为主，同时向家长说明本期赛事的作用与本阶段赛考的安排；","长期目标上，可以引导家长关注白名单赛事，争取拿到市一、省二、国三这样的成绩。\n","第三类是精英升学型。","这类家长的孩子本身基础较好，家长也愿意投入大量精力。","短期目标上，本学期的赛考要明确参加，把参赛的必要性、科技特长生的路径向家长讲透；","长期目标则对齐到CSP-J、CSP-S，以及小升初、初升高这样的升学规划。\n","还有一个带班时的判断原则需要把握：目前实际带班中，思维型家长的占比是最高的。","如果在 L8 轨迹以及前面的服务过程中，还不能明确家长属于哪一类，就一律先按思维型来做规划；","后续沟通中，家长若逐渐表现出精英升学的倾向，再往那个方向靠拢。","来看一道题，按PPT，混合动机型家长的短期目标是？"],"durs":[4.728,7.2,2.52,5.88,6.384,8.256,2.568,4.776,8.496,8.424,2.664,5.808,8.856,8.136,7.872,9.048,6.96,5.736]},"P17":{"sents":["规划电话的质检标准一共三个维度，是大家打完电话自查、组长抽检的依据，也是本次考核标准。","第一，通话时长。","要求大于 10 分钟，而且规划相关内容占比要在 50% 以上。","电话太短，考级、赛事、规划很难讲透；","但也不是闲聊凑时长，寒暄不能占大头，赛考规划的内容要占到一半以上。","第二，学情反馈，三个硬性要求：有具体场景，有亮点有不足，有学习建议。","不能空泛地说孩子学得不错，要拿课堂实例；","既肯定做得好的地方，也客观指出薄弱点，最后给出能落地的学习建议，家长才会觉得专业可信。","第三，异议处理，也是三点：不回避问题，回应到位，处理完再确认意向。","家长有顾虑不要绕开，按前面的标准逻辑回应清楚；","讲完不能直接挂电话，要再次确认家长要不要报名考级或赛事。","来看一道题，按考核标准，学情反馈的要求是？"],"durs":[9.048,2.352,6.384,4.968,7.32,7.728,4.44,8.856,7.464,5.016,6.432,4.824]},"P15":{"sents":["讲完考级和赛事，家长很容易抛出各种顾虑。","这一页是高频异议的标准回应逻辑。","核心原则是：不争执，先共情，再按逻辑解释，最后拉回目标，也就是回到决策点再确认一次意向。","我们一条一条看。","第一条，质疑整个赛考的含金量。","回应逻辑是类比大学四六级，含金量不是有没有，而是多和少。","可以这样说：不是一张证书就能直接升学，含金量是分梯度的，考级、赛事是一层一层往上积累的，是孩子能力的凭证。","如果孩子之前参加过，还可以补一句，有了赛考基础，这学期通过的概率会更大。","第二条，考级含金量不如比赛。","先认同，比赛含金量确实更高，但考级是非常好的阶段性检测。","再用核桃 NOI 金牌学员来佐证：很多金牌学员都是走学、练、考、赛这套体系，先用考级摸清漏洞，再冲赛事，一步一步往上走。","第三条，英语也考过级，没啥用。","回应逻辑是，英语有中考、高考统一考试，可以直接看分数；","编程没有统一的升学统考，证书就相当于孩子的分数证明，等到有科技特长、择校机会的时候，手里有证书才能拿出来。","第四条，为什么要花 600 元。","这是官方考试的报名费，核桃只是代收，机构不赚一分钱，而且配套的赛考辅导全程免费。","第五条，为什么考级和比赛都要报名。","两者考点高度重合，一起准备复习效率最高；","考级是正规的能力认证，能证明孩子已经具备稳定的逻辑编程能力；","而且国家级比赛一年只有一次机会，错过就要再等一整年。","第六条，为什么不能考前再报。","官方报名是固定窗口期，名额有限；","配套的备考辅导又是长周期安排。","现在报名，锁定的是考位，不是今天就考。","第七条，现在参加太早了。","告诉家长，现在只是提前了解、提前规划，正式考试安排在 Level 10，准备时间非常充足，早规划不仓促。","第八条，孩子不想参加。","这个年纪的孩子怕考试、怕挑战很正常，老师可以直接跟孩子沟通鼓励。","结合孩子上阶段的赛考通过情况给孩子信心，并跟家长说，之后老师单独和孩子聊一聊，帮孩子打消顾虑。","第九条，孩子学得一般，考不过。","这个考级通过率在 90% 以上，我们的目标也不是冲高分，主要是让孩子体验完整的考试流程，积累经验，为后面的比赛做铺垫。","第十条，上个学期就没考过，不参加。","先定位问题，上次的情况我们复盘过，找到了薄弱点；","再肯定孩子近期的进步；","最后说明会针对性辅导，帮孩子把之前的问题补上。","最后再补一个二阶段家长常提的问题：老师一直在提白名单赛事，可我感觉不到有什么实际成果。","这时候千万别争辩，先承认家长的感受，再从三个方面让成果看得见。","第一，讲能力上的成果。","拿孩子的学情数据和课堂表现，对比上阶段讲进步，这是家长最能直接感受到的。","第二，讲证书的用途。","编程没有统一考试，证书就是孩子的分数证明，平时看不出来，等到科技特长、择校这些机会来了，手里有证才拿得出来。","第三，讲本地的具体用途。","结合电话前查好的当地科技特长生政策和升学路径，告诉家长这条路在当地具体怎么走。","注意按家长类型来，思维型家长不要硬讲升学。","讲完，同样要回到决策点，再确认一次意向。"],"durs":[4.584,3.576,9.912,1.872,3.456,6.168,11.28,7.464,3.408,6.48,12.864,3.696,6.024,11.112,3.048,8.856,3.816,4.68,6.552,5.832,3.192,3.864,3.528,4.176,2.976,10.344,2.712,7.224,10.272,3.432,11.76,3.912,5.448,2.664,5.112,8.952,6.792,2.736,8.04,2.592,11.4,3.024,8.952,4.824,4.44]}},"v":{"slides/P01.jpg":"826b28d7","slides/P01.png":"4fff9614","slides/P02.jpg":"dae360da","slides/P02.png":"836c3a34","slides/P03.jpg":"65fa0f3a","slides/P03.png":"12b036bc","slides/P04.jpg":"5bdaf90a","slides/P04.png":"4bc2dca7","slides/P05.jpg":"dc5b203f","slides/P05.png":"44082026","slides/P06.jpg":"0b914984","slides/P06.png":"eb1e8378","slides/P07.jpg":"da997e88","slides/P07.png":"3bda61e8","slides/P08.jpg":"b709f92b","slides/P08.png":"08cdfb37","slides/P09.jpg":"24b47ddd","slides/P09.png":"1879c121","slides/P10.jpg":"7a683909","slides/P10.png":"82cf40b5","slides/P11.jpg":"588c6ce8","slides/P11.png":"2f9e079e","slides/P12.jpg":"c0e2ac7b","slides/P12.png":"61c62b7b","slides/P13.jpg":"14825a6f","slides/P13.png":"d78f0456","slides/P14.jpg":"51eae859","slides/P14.png":"888dd58b","slides/P15.jpg":"25141753","slides/P15.png":"4292152e","slides/P15_orig.jpg":"ace39ec5","slides/P15_orig.png":"61081d3a","slides/P16.jpg":"8ee1fc15","slides/P16.png":"6c916bfd","slides/P17.jpg":"e606fc44","slides/P17.png":"8b47a983","slides/P18.jpg":"497fad85","slides/P18.png":"39015e0b","slides/P19.jpg":"dfbf413d","slides/P19.png":"7142c022","audio/P01.mp3":"22f6a493","audio/P02.mp3":"7ab4d7ec","audio/P03.mp3":"3d2 /* 每个关卡的过程数据：play=实际播放秒数 occ=占用秒数 pn/ps=暂停次数/秒 kn/ks=卡顿次数/秒 */
function stat(k){ st.stat = st.stat || {}; return st.stat[k] = st.stat[k] || {play:0, occ:0, pn:0, ps:0, kn:0, ks:0}; }
function curKey(){ return st.view === 'quiz' ? (st.quiz === 'final' ? 'f' : st.quiz) : st.cur.s; }

  if (done) return '已完成';

const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid, course:CFG.short||CFG.title, date:nowStr().slice(0,10)}, ev, snapshot(online));
  { const CNm = CFG.short || CFG.title; if (!String(rec.stage||'').startsWith(CNm + '｜')) rec.stage = CNm + (rec.stage ? '｜' + rec.stage : ''); }
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

function quizAwayNow(){ return document.hidden || !document.hasFocus(); }
function startQuizAway(){
  if (quizAwayAt != null || !quizActive() || !quizAwayNow()) return;
  quizAwayAt = Date.now();
  const s = stat(curKey()); s.qn = (s.qn||0) + 1;
  report({event:'测试中切屏', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`本次测试第 ${s.qn} 次切屏（${document.hidden ? '切出页面' : '切到其他窗口'}）`});
}
function endQuizAway(doReport){
  if (quizAwayAt == null) return;
  const sec = (Date.now() - quizAwayAt)/1000; quizAwayAt = null;
  const s = stat(curKey()); s.qs = (s.qs||0) + sec;
  if (doReport) report({event:'回到测试', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`离开 ${Math.round(sec)} 秒`});
  const w = $('#quizWarn'); if (w) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs)} 秒，已同步给培训老师。`; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) startQuizAway(); else if (document.hasFocus()) endQuizAway(true); });
window.addEventListener('blur', startQuizAway);
window.addEventListener('focus', () => endQuizAway(true));
setInterval(() => { if (quizActive()) { if (quizAwayNow()) startQuizAway(); else endQuizAway(true); } }, 1000);
/* 占用时长：停留在某关卡（听课或做小测）的全部时间，含暂停、切走 */
let tickAt = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min((now - tickAt)/1000, 70); tickAt = now;
  if (st.name && (st.view === 'learn' || st.view === 'quiz')) { stat(curKey()).occ += dt; if (Math.random() < 0.1) save(); }
}, 1000);
/* 暂停：学员主动暂停或切走窗口导致的暂停（翻页、听完不算） */
let navPause = false, pauseAt = null, pauseWhy = '';
function endPause(doReport){
  if (pauseAt == null) return;
  const sec = (Date.now() - pauseAt)/1000; pauseAt = null;
  stat(st.cur.s).ps += sec;
  if (doReport) report({event:'继续播放', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`暂停 ${Math.round(sec)} 秒（${pauseWhy}）`});
}
/* 卡顿：播放中因网络缓冲停住 */
let stallAt = null;
function endStall(){
  if (stallAt == null) return;
  const sec = (Date.now() - stallAt)/1000; stallAt = null;
  if (sec < 0.8) return;
  const s = stat(st.cur.s); s.kn += 1; s.ks += sec;
  report({event:'卡顿', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`缓冲卡顿 ${sec.toFixed(1)} 秒`});
}

/* ---------- 音频播放 ---------- */
const au = $('#au');
const VU = f => (DATA.remote && DATA.remote[f]) || (f + '?v=' + ((DATA.v||{})[f]||''));
const SL = p => (DATA.v||{})['slides/'+p+'.jpg'] ? VU('slides/'+p+'.jpg') : VU('slides/'+p+'.png');
const PRE = {}; function preload(p){ if(!p||PRE[p.p]) return; PRE[p.p]=1; const i=new Image(); i.src=SL(p.p); const a=new Audio(); a.preload='auto'; a.src=VU('audio/'+p.p+'.mp3'); }
let rate = 1, playing = false, pendingAfter = null;
function pageTiming(p){ return DATA.timing[p.p]; }
function sentAt(p, t){
  const tm = pageTiming(p); let acc = 0;
  for (let i=0;i<tm.durs.length;i++){ acc += tm.durs[i]; if (t < acc) return i; }
  return tm.durs.length-1;
}
au.addEventListener('timeupdate', () => {
  if (st.view !== 'learn') return;
  if (!au.paused && lastT != null) { const dt = au.currentTime - lastT; if (dt > 0 && dt < 3) { const real = dt/(au.playbackRate||1); pageSec += real; st.stageSec[st.cur.s] = (st.stageSec[st.cur.s]||0) + real; stat(st.cur.s).play += real; } }
  lastT = au.currentTime;
  const p = curPage(); const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const i = sentAt(p, au.currentTime);
  const sub = $('#sub'); if (sub && sub.dataset.i != i){ sub.dataset.i = i; sub.textContent = tm.sents[i].trim(); }
  const bar = $('#progfill'); if (bar) bar.style.width = (100*au.currentTime/total).toFixed(1)+'%';
  const tt = $('#time'); if (tt) tt.textContent = fmt(au.currentTime)+' / '+fmt(total);
});
/* 群播报：暂停/切屏/离开满 2 分钟、结业 */
const BOT = 'https://open.feishu.cn/open-apis/bot/v2/hook/82649ac6-80a5-409e-9121-95139667f76c';
const CN = CFG.short || CFG.title;
function bot(text, force){ if (!st.name) return; if (!force && st.final && st.final.pass) return; try { fetch(BOT, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify({msg_type:'text', content:{text}})}); } catch(e) {} }
const who = () => st.name + '（' + (st.team || '未填职场') + '）';
let awayT = null, pauseT = null;

window.addEventListener('blur', () => { if (!document.hidden) watchAway('切屏'); });
window.addEventListener('focus', backAway);
au.addEventListener('pause', () => { clearTimeout(pauseT); if (au.ended || st.view !== 'learn') return; pauseT = setTimeout(() => { if (au.paused && !document.hidden && document.hasFocus() && st.view === 'learn') bot(who() + '在' + CN + '课已暂停2分钟'); }, 120000); });
au.addEventListener('play', () => clearTimeout(pauseT));
au.addEventListener('error', () => { if (window.REVIEW) return; if (st.view !== 'learn' || !au.getAttribute('src')) return; const p = curPageSafe(); if (!p) return; if (!au.dataset.retried) { au.dataset.retried = 1; const t = au.currentTime; au.src = au.src + (au.src.includes('?') ? '&' : '?') + 'r=' + Date.now(); au.currentTime = t; play(); return; } st.heard[p.p] = true; save(); const nb = $('#next'); if (nb) nb.disabled = false; const sub = $('#sub'); if (sub) sub.textContent = '本页声音加载失败，可以看字幕后直接点「下一页」继续。'; });
au.addEventListener('ended', () => { if (window.REVIEW) return; playing = false; updPlayBtn(); onPageEnd(); });
au.addEventListener('pause', () => {

  if (navPause || atEnd || st.view !== 'learn') { navPause = false; return; }
  const s = stat(st.cur.s); s.pn += 1; pauseAt = Date.now(); pauseWhy = autoWhy || (document.hidden ? '切出页面自动暂停' : '主动暂停'); autoWhy = '';
  report({event:'暂停', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:pauseWhy});

au.addEventListener('play', () => { playing = true; updPlayBtn(); const v=$('#veil'); if(v) v.hidden = true; endPause(true); });
au.addEventListener('waiting', () => { if (!au.paused && au.currentTime > 0.5 && stallAt == null) stallAt = Date.now(); });  // 每页开头的首次加载不算卡顿
au.addEventListener('playing', endStall);
function fmt(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
/* 防分屏：窗口不到屏幕 80% 宽就不让播；电脑上播放时自动全屏，退出全屏就暂停 */
const IS_MOBILE = /Mobi|Android|iPhone|iPad|iPod|HarmonyOS/i.test(navigator.userAgent);
function tooSmall(){ if (document.fullscreenElement) return false; const w = window.outerWidth || window.innerWidth; return w < (screen.availWidth || screen.width) * 0.8; }
function needFS(){ return !IS_MOBILE && document.fullscreenEnabled; }
function showVeil(msg){ const v = $('#veil'); if (v) { v.hidden = false; const b = $('#veilBtn'); if (b) b.textContent = msg; } }
function play(){
  if (st.view === 'learn' && tooSmall()) { showVeil('检测到分屏或窗口太小，请把窗口最大化后点我继续'); return; }
  if (st.view === 'learn' && needFS() && !document.fullscreenElement) { try { document.documentElement.requestFullscreen().catch(() => {}); } catch(e) {} }
  au.playbackRate = rate; au.play().catch(() => { const v=$('#veil'); if(v) v.hidden=false; });
}
window.addEventListener('resize', () => { if (st.view === 'learn' && playing && tooSmall()) { autoPause('分屏或窗口太小自动暂停'); showVeil('检测到分屏或窗口太小，请把窗口最大化后点我继续'); } });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && needFS() && st.view === 'learn' && playing) { autoPause('退出全屏自动暂停'); showVeil('已退出全屏，点我继续（会自动回到全屏）'); } });

/* 切走自动暂停——防挂机。两种情况都算：
   1) 页面被隐藏（最小化、切标签页、被完全挡住）；
   2) 浏览器窗口失去焦点（点到了 WPS、微信等其他窗口，哪怕只挡住一部分） */
let autoWhy = '';
function autoPause(why){

function stageStatus(i){
  if (st.passed[i]) return 'pass';
  if (i <= st.unlocked) return 'open';
  return 'lock';
}
function mapHTML(active){
  const nodes = STAGES.map((s,i) => {
    const ss = stageStatus(i);
    const sub = ss==='pass' ? ('已过关'+(st.best[i]!=null?' · '+st.best[i]+'/'+s.quiz.length:'')) : ss==='open' ? (s.quiz.length?'学完测 '+s.quiz.length+' 题':'学完解锁综合测试') : '未解锁';
    return `<button class="node ${ss} ${active===i?'cur':''}" data-go="${i}" ${ss==='lock'?'disabled':''}>
      <span class="k">阶段 ${s.num}</span><span class="t">${esc(TITLES[s.num]||("阶段 "+s.num))}</span><span class="s">${sub}</span></button>`;
  });
  const fOpen = STAGES.every((s,i)=>st.passed[i]);
  const fs = st.final && st.final.pass ? '已通过 · '+st.final.score+'/'+FINAL.length : fOpen ? FINAL.length+' 题 · 待作答' : '全部阶段过关后解锁';

      ih='<div class="rq"><div class="rh">互动题'+(it.vote?'（调查）':'')+(ok?'':' <b style="color:#dc2626">⚠ 讲稿没念到这道题</b>')+'</div><b>'+esc(it.q)+'</b>'+it.options.map((o,i)=>'<div class="'+((it.answers||[]).includes(i)?'ra':'')+'">'+L[i]+'. '+esc(o)+'</div>').join('')+'</div>';}
    const tags=[p.sku&&p.sku.trim()?'SKU：'+p.sku.replace(/\n/g,' / '):'',p.dept&&!/^通用$/.test(p.dept.trim())?'部门：'+p.dept.replace(/\n/g,' / '):''].filter(Boolean).join(' · ');

    '<h2 style="margin:8px 0">审核 · '+esc(CFG.title)+'</h2><p class="rule">'+DATA.pages.length+' 页 · '+DATA.qs.length+' 题 · '+(bad?'<b style="color:#dc2626">'+bad+' 处念题不一致</b>':'念题全部一致')+' · 点任意一句讲稿可单独播放（1.5 倍速）</p>'+pages+'<h2>题库（阶段小测 + 综合测试）</h2>'+qs;
  let stop=null,cur=null;au.ontimeupdate=()=>{if(stop!=null&&au.currentTime>=stop){au.pause();stop=null;if(cur)cur.classList.remove('on');}};

  const r = $('#resume'); if (r) r.onclick = () => { report({event:'进入课程', detail:'继续学习'}); startStage(Math.min(st.unlocked, STAGES.length-1), true); };
  const c = $('#cert'); if (c) c.onclick = () => showQuiz('final');
  const x = $('#reset'); if (x) x.onclick = () => {
    if (x.dataset.armed){ st = fresh(); save(); buildStages(); render(); return; }
    x.dataset.armed = 1; x.textContent = '再点一次确认清空记录';
    const m = $('#resetMsg'); m.hidden = false; m.textContent = '清空后本机的学习进度和成绩都会删除。';
  };
}

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function renderLearn(autoplay){
  const s = curStage(), p = curPage();
  const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const heard = !!st.heard[p.p];
  $('#app').innerHTML = `${headerHTML()}
  ${mapHTML(st.cur.s)}
  ${loopHTML(0)}
  <div class="stage-head"><h2>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}　<span class="muted" style="font-weight:400;font-size:15px">${p.p} ${esc(p.topic)}</span></h2>
    <span class="time">第 ${st.cur.p+1} / ${s.pages.length} 页</span></div>
  <div class="slide">${p.video?`<video id="vd" src="${VU(p.video)}" poster="${SL(p.p)}" controls playsinline preload="metadata" style="width:100%;max-height:70vh;display:block;object-fit:contain;background:#000"></video>`:`<img src="${SL(p.p)}" alt="${esc(p.p+' '+p.topic)}">`}
    <div class="veil" id="veil" ${autoplay?'hidden':''}><button class="btn" id="veilBtn">▶ 点击播放讲解</button></div></div>
  <div class="sub" id="sub" aria-live="polite">${esc(tm.sents[0].trim())}</div>
  <div class="bar">
    <button class="btn ghost" id="prev" ${st.cur.p===0?'disabled':''}>上一页</button>
    <button class="btn" id="pp">播放</button>
    <button class="btn ghost" id="again">重听本页</button>
    <div class="prog" aria-hidden="true"><div id="progfill"></div></div>
    <span class="time" id="time">0:00 / ${fmt(total)}</span>
    <div class="speed" role="group" aria-label="语速">${[1,1.25,1.5].map(r=>`<button data-r="${r}" class="${r===rate?'on':''}">${r}x</button>`).join('')}</div>
    <button class="btn" id="next" ${heard?'':'disabled'}>${st.cur.p===s.pages.length-1?(s.quiz.length?'去做阶段小测':'完成本阶段'):'下一页'}</button>
  </div>
  <div class="dots">${s.pages.map((pg,i)=>`<button class="dot ${st.heard[pg.p]?'heard':''} ${i===st.cur.p?'now':''} ${pg.interact?'q':''}" data-pg="${i}" ${(st.heard[pg.p]||i===st.cur.p)?'':'disabled'} title="${esc(pg.topic)}">${pg.p}</button>`).join('')}</div>
  <details class="full"><summary>展开本页讲解全文</summary><p>${esc(p.script)}</p></details>`;
  bindCommon();
  delete au.dataset.retried; au.src = VU('audio/'+p.p+'.mp3');
  { const im=document.querySelector('.slide img'); if(im && !im.complete){ im.style.opacity=0; im.onload=()=>{im.style.transition='opacity .2s';im.style.opacity=1;}; im.onerror=()=>{ if(!im.dataset.r){ im.dataset.r=1; im.src=im.src+'&r='+Date.now(); } else im.style.opacity=1; }; } }
  [1].forEach(k=>preload(s.pages[st.cur.p+k])); if(st.cur.p+1>=s.pages.length) preload((STAGES[st.cur.s+1]||{pages:[]}).pages[0]);
  au.currentTime = 0; lastT = 0;
  report({event:'进入页面', stage:stageLabel(st.cur.s), page:p.p, detail:p.topic});
  $('#veilBtn').onclick = play;
  { const v = $('#vd'); if (v) v.onplay = () => au.pause(); }
  $('#pp').onclick = () => playing ? au.pause() : play();
  $('#again').onclick = () => { au.currentTime = 0; play(); };
  $('#prev').onclick = () => goPage(st.cur.p-1);
  $('#next').onclick = () => nextPage();
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => goPage(+b.dataset.pg));
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rate = +b.dataset.r; au.playbackRate = rate;
    document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on', x===b)); });
  if (autoplay) play();
}
function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});
  showQuiz('final');
}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
