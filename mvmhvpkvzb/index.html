<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>用户来源解析</title>

<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}
</style>

<script>
const DATA = {"pages":[{"row":3,"stage":"用户来源解析·阶段1","p":"P01","topic":"开场导入","script":"各位小伙伴，大家好，今天这节课的主题是《用户来源解析》。先问大家一个问题：咱们手上的这些孩子，到底是怎么来到核桃编程的？其实每一个学员都不是凭空出现的。从投放团队花钱获客，到前端班主任做体验课服务，再到首单阶段课导老师的带班和续报，中间经过了好几个环节、好几拨人的付出。这节课我们就把三件事讲清楚：你的用户从哪来；每个环节由谁负责，前面的人已经做了什么；到你这一棒，交接时要注意什么，怎么接好，怎么做得更好。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":4,"stage":"用户来源解析·阶段1","p":"P02","topic":"板块总览","script":"大家看目录，今天的内容分三个部分。第一部分是业务链路，看一个用户从接触核桃到成为你的学员，中间经过了哪些团队，每一段由谁负责。第二部分是用户来源，具体看用户从哪些渠道来、来核桃想要什么，以及接手前你要掌握哪些信息。第三部分是接力与传承，看前面的老师已经为你打下了哪些服务基础，你要怎么在这个基础上做得更好，不辜负每一个来之不易的用户。来看一道题，今天这节课分为哪三个部分？","interact":{"q":"今天这节课分为哪三个部分？【多选】","at":"P02","options":["业务链路","用户来源","接力与传承","赛考体系"],"answer":0,"answers":[0,1,2],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":5,"stage":"用户来源解析·阶段1","p":"P03","topic":"业务链路","script":"我们先看第一部分，业务链路。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":6,"stage":"用户来源解析·阶段1","p":"P04","topic":"业务链路（一）","script":"大家来看这张业务链路图。主线从左到右分为三段：投放团队负责获客，把流量给到班主任；班主任承接体验课的服务与转化；学员转正课之后，就移交到课导团队带班，也就是红框标注的我们这一环。\n除此之外，还有两条贯穿全链路的支撑线：赛事部门和质检部门，它们不局限于单一环节，全程协同整条业务线。 所以一个用户从初次接触核桃编程，到成为正式学员，是投放、班主任、课导、赛事、质检多方配合、环环相扣的结果，并不是课导单打独斗。前面每一环的交付质量，都会直接影响我们后续和家长、孩子的沟通。\n这里重点强调：课导不需要自主拓客。投放团队持续投入成本获客，线上抖音、视频号投流，线下校园合作、地推，每一个体验课用户都有获客成本。分到我们手上的每一位学员，都是公司投入资源、前面伙伴付出精力换来的，来之不易。来看一道题，业务链路分析中，用户流转的顺序是？","interact":{"q":"业务链路分析中，用户流转的顺序是？","at":"P04","options":["投放团队→班主任→课导团队","班主任→投放团队→课导团队","课导团队→班主任→投放团队","投放团队→课导团队→班主任"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"2699首单\n3299首单","dept":""},{"row":7,"stage":"用户来源解析·阶段1","p":"P05","topic":"业务链路（二）","script":"大家来看这张业务链路图，顺着从左到右看，先把每一段的责任分工记清楚。\n最前端是投放团队，负责获取流量，把线索交付给班主任。班主任承接体验课阶段的服务和转化，转化成功后，学员进入图形化一阶段。由一阶段的课导老师带班，完成日常教学、学情跟进和阶段续报。等学员完成这一阶段续报，才会流转到算法板块，也就是图中红框标注的、由我们算法课导接手的环节。\n赛事部门和质检部门不归属某一段，而是贯穿整条链路，全程协同支撑。\n这里需要大家明确一个前提：学员交到我们手上之前，已经经过班主任、前课导两轮服务。每一次交接，家长都要重新认识一位老师。我们作为承接方，核心职责就是把前面团队积累下来的信任稳稳接住，在交接环节不出现断层。分到我们手上的每一位学员，都是公司投入资源、前面伙伴付出精力换来的，来之不易。","interact":null,"sku":"2699算法\n3299算法","dept":""},{"row":8,"stage":"用户来源解析·阶段2","p":"P06","topic":"用户分析","script":"接下来进入第二部分，用户来源。 上一部分我们梳理了整条业务链路，明确了各个环节的分工。这一部分，我们把视角落到用户本身：我们的用户是谁，他们选择报名二阶段的核心原因是什么。只有做到知己知彼，我们的服务才能精准落地。同时我们也要清楚，通过哪些沟通路径，去挖掘、获取这些关键信息。","interact":null,"sku":"3299算法\n2699算法","dept":""},{"row":9,"stage":"用户来源解析·阶段2","p":"P07","topic":"用户来源板块开篇","script":"我们先明确服务对象。核桃编程的学员主要集中在 5 到 15 岁，以小学、初中阶段的孩子为主。\n这里有一个关键点需要大家牢记：我们的用户不只有孩子，还包括家长。孩子是教学服务的主体，而家长是付费决策者，也是孩子学习过程中的主要负责人。作为课导，我们既要面向孩子做好教学，也要维护好与家长的沟通关系 —— 后续的续报、转介绍，最终的决策都来自家长。\n同时大家要清楚，流转到我们算法板块的学员，在交接过来之前，已经经历了前端班主任的体验课服务，也经过了首单阶段课导老师多轮的沟通与跟进，家长对品牌并不陌生。来看一道题，我们的用户集中在哪个年龄段？","interact":{"q":"我们的用户集中在哪个年龄段？","at":"P07","options":["3-6岁的幼儿","7-12岁的小学生","5-15岁的小初学生","15-18岁的高中生"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":10,"stage":"用户来源解析·阶段2","p":"P08","topic":"用户画像","script":"大家来看这张三角关系图，我们先来思考一个问题：平时沟通，你更多是和孩子聊，还是和家长聊？\n图里清晰标注了：家长是客户，负责付费购买课程；孩子是实际用户，接收核桃编程的教学。孩子学完之后产出的学习效果，再反馈给家长，形成完整闭环。\n孩子和家长在意的点完全不一样：孩子在意课堂好不好玩、有没有兴趣；家长更看重学习效果、思维提升，能不能帮到校内学习。 而我们课导，就是连接这两端的关键纽带。从前端班主任，到首单课导，再到我们，每一棒都要接稳。 我们既要照顾孩子的上课体验，留住孩子的兴趣；也要持续给家长反馈效果，打消家长顾虑。前面老师已经铺垫好了信任，我们接手之后，要把这份信任稳住、继续加深。这个三角逻辑，大家一定要吃透。来看一道题，三角关系都包含那三个？","interact":{"q":"三角关系都包含那三个？","at":"P08","options":["核桃","家长","孩子","体验课"],"answer":0,"answers":[0,1,2],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":11,"stage":"用户来源解析·阶段2","p":"P09","topic":"用户五大渠道总述","script":"知道了用户是谁，再来看他们从哪里来。大家看这棵渠道树，主要有五大渠道：家长自发宣传的口碑转介绍、前端直播、赛事奖项吸引、线下活动引流，以及前端班主任的体验课转化，另外还有更多正在拓展中的渠道。后面我们一个一个看。先请大家记住一句话：不管哪个渠道，每一个用户背后都有成本和付出。直播要投流；线下活动要花场地、物料、师资和人力；口碑转介绍看起来不花钱，其实是老学员用真功夫换来的，是家长认可了前面老师的服务才愿意推荐。所以，珍惜你手上的每一个用户。来看一道题，“他们从哪里来”中，标注了“（体验课）”的是哪个渠道？","interact":{"q":"“他们从哪里来”中，标注了“（体验课）”的是哪个渠道？","at":"P09","options":["前端直播","赛事奖项","线下活动引流","前端班主任"],"answer":3,"answers":[3],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":12,"stage":"用户来源解析·阶段2","p":"P10","topic":"渠道 1","script":"第一个渠道，家长自发宣传，也就是口碑转介绍。大家看截图里的聊天，家长对课程认可之后，主动向身边的朋友推荐，带来了新的学生。口碑转介绍是质量最高的渠道之一。老家长为什么愿意主动推荐？根本原因是孩子在核桃真的学到了东西，家长看到了效果。这也说明，前面的老师把服务做到位了，家长才愿意替我们说话。现在这些通过口碑来的学员，经过前一位老师的服务铺垫，续报之后流转到了你手上。接手这类学员要心里有数：家长本来就认可核桃，你要接住的正是这份认可。接下来的问题是，你能不能也做到，让家长愿意主动帮你转介绍？这是接力，也是挑战。来看一道题，家长自发宣传/口碑转介绍是怎样带来新学生的？","interact":{"q":"家长自发宣传/口碑转介绍是怎样带来新学生的？","at":"P10","options":["家长通过抖音、小红书、快手等平台直播购买课程","家长对课程认可后，主动向身边人推荐","学生通过赛事奖项了解课程","通过线下活动吸引学生了解课程"],"answer":1,"answers":[1],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":13,"stage":"用户来源解析·阶段2","p":"P11","topic":"渠道 2","script":"第二个渠道，前端直播，这是我们主要的获客渠道之一。家长通过抖音、小红书、快手等平台的直播了解核桃，购买课程进入班级。大家可能不知道，一场直播的投流成本很高，从家长刷到直播间、听主播介绍，到下单报名体验课，转化率其实并不高。也就是说，每一个最终报名的用户，背后可能是几十个甚至上百个浏览量堆出来的。这些用户报名体验课之后，先由前端班主任服务和转化，转成正式课再交给课导带班，一路走到你手上，我们更要用心服务。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":14,"stage":"用户来源解析·阶段2","p":"P12","topic":"渠道 3","script":"第三个渠道，赛事奖项吸引。大家看这几张海报，核桃学员在各类赛事里拿奖，还有很多学员拿到了科技特长生认证资格，这些成绩会吸引一部分家长慕名而来。这类学生通常是通过赛事奖项了解到核桃，先上体验课，再续报正式课。他们本身就对编程学习有较高的期待和明确的目标，所以期望更高，对教学质量的要求也更高。接手这类学员要心里有数：家长看重的是孩子能不能真正学出成果，我们要用真正的教学效果接住这份期待。来看一道题，赛事奖项吸引来的用户有什么特点？","interact":{"q":"赛事奖项吸引来的用户有什么特点？","at":"P12","options":["期望更高，对教学质量要求也更高","基础普遍更薄弱","付费意愿更低","只想短期体验一下"],"answer":0,"answers":[0],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":15,"stage":"用户来源解析·阶段2","p":"P13","topic":"渠道 4","script":"第四个渠道，线下活动引流，包括线下门店体验，还有冬令营、夏令营。大家看右边这张公司地址图，核桃编程的公司地址覆盖全国十二个省市。办一场线下活动的成本很高，场地、物料、师资、人力，每一项都要花钱。反过来看，家长愿意花时间带孩子来参加线下活动，说明他们对编程学习是有真实需求的。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":16,"stage":"用户来源解析·阶段2","p":"P14","topic":"渠道 5","script":"第五个渠道，也是最关键的一环：前端班主任的体验课转化。前面几个渠道来的用户，很多都要先进入体验课，再由前端班主任负责服务和转化。用户通常先花10.9，也有299元的。班主任完成体验课转化后，体验满意的学员转入正式课，由课导老师负责带班，完成日常教学、学情跟进，再到阶段续报。大家要记住：交到我们手里的学员，已经经过一轮完整服务，本身带着明确的学习期待，目标感会更强。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":17,"stage":"用户来源解析·阶段2","p":"P15","topic":"家长学习诉求","script":"五个渠道我们梳理完了。这里大家要区分清楚，我们现在面对的算法板块家长，和前端体验课的家长不一样。 这些家长不是第一次接触核桃，孩子已经在咱们这边学习了一段时间，是选择再次续报复购的用户。我问大家：已经学了半年、还愿意继续投入时间和费用往下学的家长，他们想要什么？读懂他们的诉求，我们的服务才能踩准方向。\n同样对应这五点： 第一，兴趣试探与能力提升。对他们来说不再是试探，而是已经看到孩子有兴趣，希望持续巩固、拔高逻辑思维能力。 第二，咨询长期费用。他们已经认可课程，现在关心的是完整长期学习路线，以及后续阶段的投入规划。 第三，体验核桃产品。不再是初次试课，而是认可咱们的课程体系，希望跟着体系持续往下深耕。 第四，硬件动手锻炼。希望继续借助实操内容，持续锻炼孩子动手、解决问题的能力。 第五，助力升学。这部分家长的目标会更清晰，愿意长期跟着规划，朝着科技特长生、赛事升学的方向稳步推进。\n简单总结：前端家长是 “试一试”，我们算法板块的家长，是已经验证价值，选择长期学习。我们沟通的时候，要站在长期规划的角度，而不是还当成第一次体验的客户。","interact":null,"sku":"3299算法\n2699算法","dept":""},{"row":18,"stage":"用户来源解析·阶段2","p":"P16","topic":"强调","script":"大家来看这几张家长聊天截图，都是咱们续报家长真实的想法。 有的家长本身清楚编程的价值，希望帮孩子提升专注力、锻炼逻辑；有的家长认可编程对思维的锻炼；还有家长很关注，能不能带动校内其他学科的学习。 这些想法，本质上都是家长对孩子成长的期待，也是他们选择持续付费、继续往下学的底层原因。\n这里重点提醒：这些诉求，前面的老师大概率已经做过记录。我们接手之后，不要全部重新提问、反复盘问。要基于已有学情记录，顺着线索继续深挖，匹配对应的服务。 我们只有精准接住、持续满足家长的核心诉求，学员才会稳定留存，愿意继续续报，也会主动给我们做转介绍。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":19,"stage":"用户来源解析·阶段2","p":"P17","topic":"学员基础信息","script":"清楚了用户来源和家长诉求之后，我们落地到课导的实操动作：接手一名学员，首先要摸清哪些信息？第一大类就是学员信息。\n大家看用户详情页，这里面是我们必须掌握的内容：年级、学情、课程进度、已经学完的单元、硬件配置、学员标签等等。页面下方还可以查看孩子每一个单元的到课、完课记录，以及待订正错题。\n这些信息需要我们主动查阅、提前熟悉。我们只有吃透学员情况，教学和跟进才能精准，把课上好。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":20,"stage":"用户来源解析·阶段2","p":"P18","topic":"用户行为轨迹","script":"第二类必查信息，是用户轨迹。 除了学员基础学情，我们还要重点查看学习轨迹、聊天会话、通话录音以及全部历史沟通记录。大家看截图，详情页里可以看到每一通电话的时间、时长，还有历任老师和家长的聊天记录。\n通过这些内容，我们能快速摸清这个学员之前的经历，清楚家长一直关注什么、还有哪些遗留问题没有闭环。 交接最忌讳的就是：家长之前提过的顾虑、在意的问题，到我们这里断掉、需要家长重复再说一遍。 所以接手学员之前，一定要认真查阅历史记录，这是我们承接信任、平稳交接最重要的一手资料。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":21,"stage":"用户来源解析·阶段2","p":"P19","topic":"信息维护","script":"收集完学员信息、用户轨迹之后，还有一个关键动作：及时记录、留存总结。\n每次和家长沟通结束，要马上更新学生信息表，记下本次沟通要点，同步更新家长诉求；给家长发送重要资料，尽量用文字确认；同时定期复盘总结。 大家看这张学生信息表，里面包含需求、标签、前端历史信息等栏目，我们接手之后，就在原有记录的基础上持续补充，不用从零搭建。\n这些工作看着细碎，但恰恰是稳定服务的根基。上一任老师就是靠着持续记录，慢慢建立起家长信任的。我们要把这个习惯承接下来，做得更细致。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":22,"stage":"用户来源解析·阶段3","p":"P20","topic":"接力与传承板块开篇","script":"接下来进入第三部分，也是今天希望大家重点关注的内容：接力与传承。 前面我们理清了用户的来源、整条链路各个岗位的分工。这一部分，我们聚焦交接环节：学员流转到我们手上之前，前序老师已经打下了哪些服务基础；接棒时我们有哪些注意事项，以及我们该如何在原有基础上，把服务做得更好。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":23,"stage":"用户来源解析·阶段3","p":"P21","topic":"三重服务属性①","script":"前一任老师给我们打下的服务基础，可以总结成三重服务属性。第一重，就是做孩子的老师。\n大家看截图，左边是日常答疑，孩子发语音、截图来提问；右边是作业批改。教代码只是其中一部分，更核心的是，当孩子被难题卡住的时候，陪着他拆解思路、多鼓励，引导孩子自己找到答案，而不是直接给结果。课后还要及时批改作业。\n在前一段的服务里，孩子已经习惯了这份持续的关注与正向反馈。我们接手之后，要继续当好孩子的老师，并且要求做得更深。毕竟算法阶段课程目标更高、学习周期更长，对孩子的思维要求也更高。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":24,"stage":"用户来源解析·阶段3","p":"P22","topic":"三重服务属性②","script":"第二重身份，是家长的教育专家。\n大部分家长本身并不懂编程，之前的课导会用通俗的大白话，给家长讲明白编程能锻炼的能力，比如逻辑思维、专注力。同时结合作业批改、课堂观察，持续同步孩子真实的学习状态。 长期这样沟通下来，已经在家长心里建立起 “核桃老师很专业” 的认知。\n我们接手之后，要延续这份专业，并且再往上升级。用更深度的学情分析、更及时的学习反馈，让家长感受到：进入算法阶段，老师的专业度更强，更值得托付。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":25,"stage":"用户来源解析·阶段3","p":"P23","topic":"三重服务属性③","script":"第三重身份，是孩子和家长共同的朋友。\n大家看这些聊天记录，有家长提到，虽然只是线上网课的相处，却印象很深，甚至会舍不得之前的老师。前任老师搭建起了双向的情感桥梁：孩子取得进步，第一时间同步给家长；家长有困惑，也耐心倾听解答。这份情感链接，就是信任的根基。\n现在这份链接交到了我们手里。我们不只是简单维持，还要继续加深。要让家长和孩子感受到，虽然升到算法阶段、更换了对接老师，但我们的关心和温度没有中断，反而更加贴心。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":26,"stage":"用户来源解析·阶段3","p":"P24","topic":"首通电话","script":"前面这三重身份，落到实操动作里，重中之重就是首通电话。首通，是我们承接信任的起点。 之前的老师和家长慢慢建立起长期信任，很多也是从一通首通电话起步的。大家看 PPT 里的首通录音，时长三十七分钟。标准首通电话包含四个环节：自我介绍、了解孩子情况、深挖家长诉求、同步课程安排，每个环节都有章法。\n一通高质量的首通，能稳住家长长期学习的意愿。这里大家一定要记住：我们对接的家长，已经经过前一位老师的服务和铺垫，不是全新客户。 所以我们这通首通，不是从零破冰，它的核心价值，是在已经存在的信任之上，进一步建立家长对我们的信心。首通的重心是承接、巩固信任，不要一上来就聊续费、费用。来看一道题，“首通”被定位为什么？","interact":{"q":"“首通”被定位为什么？","at":"P24","options":["信任的起点","认真的付出","他们共同的朋友","家长的教育专家"],"answer":0,"answers":[0],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":27,"stage":"用户来源解析·阶段3","p":"P25","topic":"直播与小灶课","script":"除了首通电话，前一位老师还有一项很重要的交付，就是小灶课。 小灶课是正课之外，给学员额外安排的拓展辅导。除常规课程，还有课前直播、赛考直播、小灶直播，截图里展示的就是课前直播的场景。\n坚持落地这些直播，本身就是责任心的体现：基础薄弱的孩子可以查漏补缺，学有余力的孩子可以拓展拔高。也正是这份额外付出，让家长认可核桃老师的用心。\n现在学员流转到我们算法班，大家可以思考：我们还能给孩子提供哪些差异化价值？这就是我们接过接力棒、做得比上一棒更好的机会。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":28,"stage":"用户来源解析·阶段3","p":"P26","topic":"结尾总结寄语","script":"最后送给大家几句话共勉：学习不息，成长不止；追求卓越，舍我其谁；培训很苦，坚持很酷；你的付出，决定成长速度。\n在这里我想额外再强调一句：交到我们手上的每一位学员，都来之不易。投放团队投入成本引流，前端班主任完成体验转化，首单课导长期跟进、促成续报，一棒接一棒，才流转到我们算法板块。 希望大家珍惜每一个用户，稳稳接好这一棒，争取做得比上一棒更出色。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""},{"row":29,"stage":"用户来源解析·阶段3","p":"P27","topic":"调研问卷","script":"今天的课就到这里。请大家拿出手机，扫码填写一下《课导侧用户来源》培训调研问卷，写下你的真实感受。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题·单选","chapter":"用户来源解析·阶段1","q":"在主链路下方并列展示、贯穿各环节的两个部门是？","options":[{"k":"A","t":"投放团队和班主任"},{"k":"B","t":"赛事部门和质检部门"},{"k":"C","t":"班主任和课导团队"},{"k":"D","t":"首单S和算法"}],"answer":"B","back":"","sku":""},{"id":"T-S02","type":"阶段练习题·多选","chapter":"用户来源解析·阶段1","q":"（多选）业务链路分析中，用箭头依次连接的主链路团队有？","options":[{"k":"A","t":"投放团队"},{"k":"B","t":"班主任"},{"k":"C","t":"课导团队"},{"k":"D","t":"质检部门"}],"answer":"ABC","back":"","sku":""},{"id":"T-S03","type":"阶段练习题·单选","chapter":"用户来源解析·阶段1","q":"学员交接环节，承接方课导的核心职责是？","options":[{"k":"A","t":"把前面团队积累的信任稳稳接住，交接不出现断层"},{"k":"B","t":"把之前的服务记录清零，重新开始"},{"k":"C","t":"回避提及前任老师，避免家长比较"},{"k":"D","t":"优先向家长推销更高阶段的课程"}],"answer":"A","back":"","sku":""},{"id":"T-S04","type":"阶段练习题·单选","chapter":"用户来源解析·阶段1","q":"学员流转链路中，体验课阶段由谁负责带班服务？","options":[{"k":"A","t":"投放团队"},{"k":"B","t":"前端班主任"},{"k":"C","t":"首单阶段的前课导老师"},{"k":"D","t":"算法课导"}],"answer":"B","back":"","sku":""},{"id":"T-S05","type":"阶段练习题·判断","chapter":"用户来源解析·阶段1","q":"赛事部门和质检部门只负责业务链路中某一段的工作。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":""},{"id":"T-S06","type":"阶段练习题·单选","chapter":"用户来源解析·阶段2","q":"我们的用户主要是哪个年龄段的学生？","options":[{"k":"A","t":"3~6 岁幼儿"},{"k":"B","t":"5~15 岁小学、初中学生"},{"k":"C","t":"15~18 岁高中生"},{"k":"D","t":"不限年龄"}],"answer":"B","back":"","sku":""},{"id":"T-S07","type":"阶段练习题·判断","chapter":"用户来源解析·阶段2","q":"（情景）家长在抖音看了核桃的直播介绍后购买课程进入班级，他属于哪个用户来源渠道？","options":[{"k":"A","t":"前端直播"},{"k":"B","t":"前端班主任（体验课）"},{"k":"C","t":"家长自发宣传/口碑转介绍"},{"k":"D","t":"线下活动引流"}],"answer":"A","back":"","sku":""},{"id":"T-S08","type":"阶段练习题·多选","chapter":"用户来源解析·阶段2","q":"用户来源主要有哪几大渠道？【多选】","options":[{"k":"A","t":"口碑转介绍与前端直播"},{"k":"B","t":"赛事奖项吸引"},{"k":"C","t":"线下活动引流"},{"k":"D","t":"前端班主任的体验课转化"}],"answer":"ABCD","back":"","sku":""},{"id":"T-S09","type":"阶段练习题·判断","chapter":"用户来源解析·阶段2","q":"流转到算法板块的家长，大多是孩子已学习一段时间、续报复购的老用户，而不是初次试课的新客户。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-S10","type":"阶段练习题·多选","chapter":"用户来源解析·阶段2","q":"家长送孩子来学编程的五点诉求包括哪些？【多选】","options":[{"k":"A","t":"兴趣试探与能力提升"},{"k":"B","t":"咨询长期费用"},{"k":"C","t":"体验核桃产品、硬件动手锻炼"},{"k":"D","t":"保证校内考试满分"}],"answer":"ABC","back":"","sku":""},{"id":"T-S11","type":"阶段练习题·单选","chapter":"用户来源解析·阶段3","q":"三角关系，以下对应正确的是？","options":[{"k":"A","t":"家长是用户，孩子是客户"},{"k":"B","t":"家长是客户，孩子是用户"},{"k":"C","t":"家长和孩子都是客户"},{"k":"D","t":"家长和孩子都是用户"}],"answer":"B","back":"","sku":""},{"id":"T-S12","type":"阶段练习题·多选","chapter":"用户来源解析·阶段3","q":"（多选）前任老师已建立的服务基础（身份）有？","options":[{"k":"A","t":"是孩子的老师"},{"k":"B","t":"是家长的教育专家"},{"k":"C","t":"是他们共同的朋友"},{"k":"D","t":"是孩子的教育专家"}],"answer":"ABC","back":"","sku":""},{"id":"T-S13","type":"阶段练习题·多选","chapter":"用户来源解析·阶段3","q":"首通电话的标准环节包括哪些？【多选】","options":[{"k":"A","t":"自我介绍"},{"k":"B","t":"了解孩子情况"},{"k":"C","t":"挖掘家长诉求"},{"k":"D","t":"说明课程安排"}],"answer":"ABCD","back":"","sku":""},{"id":"T-S14","type":"阶段练习题·单选","chapter":"用户来源解析·阶段3","q":"小灶课指的是？","options":[{"k":"A","t":"正常课程之外，给学员额外补充的拓展教学"},{"k":"B","t":"只在周末开设的补课"},{"k":"C","t":"家长陪同上课的亲子课"},{"k":"D","t":"赛前的集中集训"}],"answer":"A","back":"","sku":""},{"id":"T-S15","type":"阶段练习题·判断","chapter":"用户来源解析·阶段3","q":"（情景）家长对前任老师说“突然感觉有点依依不舍”，这体现了前任老师的哪种身份？","options":[{"k":"A","t":"是他们共同的朋友"},{"k":"B","t":"是孩子的老师"},{"k":"C","t":"是家长的教育专家"},{"k":"D","t":"首通：信任的起点"}],"answer":"A","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题·单选","chapter":"用户来源解析·全章","q":"家长说：「孩子喜欢就行，我就想让他玩得开心。」这类家长最原始的诉求是？","options":[{"k":"A","t":"兴趣试探与能力提升"},{"k":"B","t":"助力升学、科技特长生"},{"k":"C","t":"咨询长期费用"},{"k":"D","t":"硬件动手锻炼"}],"answer":"A","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题·单选","chapter":"用户来源解析·全章","q":"（多选）以下渠道与PPT描述的对应，正确的有？","options":[{"k":"A","t":"前端直播：家长通过抖音、小红书、快手等平台的直播介绍，购买课程进入班级"},{"k":"B","t":"赛事奖项：学生通过赛事奖项了解课程，先上体验课再续报正式课"},{"k":"C","t":"前端班主任：家长对课程认可后，主动向身边人推荐"},{"k":"D","t":"线下活动引流：前端班主任负责的体验课学员，体验满意后转入正式课"}],"answer":"AB","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题·单选","chapter":"用户来源解析·全章","q":"核桃学员的赛事奖项和科技特长生认证资格，在获客上的作用是？","options":[{"k":"A","t":"吸引部分家长慕名而来，成为获客渠道之一"},{"k":"B","t":"可以直接抵扣学费"},{"k":"C","t":"能保证学员一定续报"},{"k":"D","t":"对获客没有任何帮助"}],"answer":"A","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题·多选","chapter":"用户来源解析·全章","q":"（多选）“课导老师必知信息”包括哪两项？","options":[{"k":"A","t":"学员信息"},{"k":"B","t":"用户轨迹"},{"k":"C","t":"赛事成绩单"},{"k":"D","t":"公司地址"}],"answer":"AB","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题·单选","chapter":"用户来源解析·全章","q":"每次和家长沟通后，关于记录留存的正确做法是？","options":[{"k":"A","t":"记住就行，不用写"},{"k":"B","t":"更新学生信息表、补充家长诉求，重要资料用文字确认，定期总结"},{"k":"C","t":"只记录投诉内容"},{"k":"D","t":"等续报期再统一整理"}],"answer":"B","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题·单选","chapter":"用户来源解析·全章","q":"（情景）接手学员后，孩子作业卡住、家长又想了解学情。课导分别应延续哪项工作？","options":[{"k":"A","t":"对孩子：反馈学情；对家长：辅导答疑"},{"k":"B","t":"对孩子：编程赋能；对家长：批改作业"},{"k":"C","t":"对孩子：批改作业；对家长：辅导答疑"},{"k":"D","t":"对孩子：辅导答疑；对家长：反馈学情"}],"answer":"D","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题·单选","chapter":"用户来源解析·全章","q":"（情景）首通中家长说希望编程能帮孩子助力升学，课导应如何处理？","options":[{"k":"A","t":"识别为“助力升学”诉求，并在学生信息表中补充家长诉求"},{"k":"B","t":"识别为“咨询长期费用”诉求，并在学生信息表中补充家长诉求"},{"k":"C","t":"识别为“助力升学”诉求，记在心里不做记录"},{"k":"D","t":"识别为“硬件动手锻炼”诉求，并在学生信息表中补充家长诉求"}],"answer":"A","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题·单选","chapter":"用户来源解析·全章","q":"（多选）“已建立的服务基础”中，以下对应正确的有？","options":[{"k":"A","t":"首通：信任的起点"},{"k":"B","t":"小灶课：认真的付出"},{"k":"C","t":"是家长的教育专家：辅导答疑、批改作业"},{"k":"D","t":"是孩子的老师：反馈学情、编程赋能"}],"answer":"AB","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题·多选","chapter":"用户来源解析·全章","q":"关于「用户来之不易」，下列理解正确的有？【多选】","options":[{"k":"A","t":"投放团队花真金白银获客"},{"k":"B","t":"前端班主任完成体验课转化"},{"k":"C","t":"前课导完成首单阶段带班与续报铺垫"},{"k":"D","t":"课导可以随时更换手上的学员"}],"answer":"ABC","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题·多选","chapter":"用户来源解析·全章","q":"（多选，选3项）接手学员后，延续前任老师服务基础的做法，正确的是？","options":[{"k":"A","t":"继续为孩子辅导答疑、批改作业"},{"k":"B","t":"向家长反馈学情、做编程赋能"},{"k":"C","t":"重视首通，把它作为信任的起点"},{"k":"D","t":"把小灶课当作可有可无的补充"}],"answer":"ABC","back":"","sku":""}],"timing":{"P01":{"sents":["各位小伙伴，大家好，今天这节课的主题是《用户来源解析》。","先问大家一个问题：咱们手上的这些孩子，到底是怎么来到核桃编程的？","其实每一个学员都不是凭空出现的。","从投放团队花钱获客，到前端班主任做体验课服务，再到首单阶段课导老师的带班和续报，中间经过了好几个环节、好几拨人的付出。","这节课我们就把三件事讲清楚：你的用户从哪来；","每个环节由谁负责，前面的人已经做了什么；","到你这一棒，交接时要注意什么，怎么接好，怎么做得更好。"],"durs":[5.736,6.432,3.456,12.432,4.896,4.2,5.496]},"P02":{"sents":["大家看目录，今天的内容分三个部分。","第一部分是业务链路，看一个用户从接触核桃到成为你的学员，中间经过了哪些团队，每一段由谁负责。","第二部分是用户来源，具体看用户从哪些渠道来、来核桃想要什么，以及接手前你要掌握哪些信息。","第三部分是接力与传承，看前面的老师已经为你打下了哪些服务基础，你要怎么在这个基础上做得更好，不辜负每一个来之不易的用户。","来看一道题，今天这节课分为哪三个部分？"],"durs":[3.888,9.816,9.312,11.784,4.392]},"P03":{"sents":["我们先看第一部分，业务链路。"],"durs":[3.072]},"P05":{"sents":["大家来看这张业务链路图，顺着从左到右看，先把每一段的责任分工记清楚。\n","最前端是投放团队，负责获取流量，把线索交付给班主任。","班主任承接体验课阶段的服务和转化，转化成功后，学员进入图形化一阶段。","由一阶段的课导老师带班，完成日常教学、学情跟进和阶段续报。","等学员完成这一阶段续报，才会流转到算法板块，也就是图中红框标注的、由我们算法课导接手的环节。\n","赛事部门和质检部门不归属某一段，而是贯穿整条链路，全程协同支撑。\n","这里需要大家明确一个前提：学员交到我们手上之前，已经经过班主任、前课导两轮服务。","每一次交接，家长都要重新认识一位老师。","我们作为承接方，核心职责就是把前面团队积累下来的信任稳稳接住，在交接环节不出现断层。","分到我们手上的每一位学员，都是公司投入资源、前面伙伴付出精力换来的，来之不易。"],"durs":[7.272,5.952,7.392,6.552,9.336,7.392,8.376,4.176,8.952,7.896]},"P06":{"sents":["接下来进入第二部分，用户来源。"," 上一部分我们梳理了整条业务链路，明确了各个环节的分工。","这一部分，我们把视角落到用户本身：我们的用户是谁，他们选择报名二阶段的核心原因是什么。","只有做到知己知彼，我们的服务才能精准落地。","同时我们也要清楚，通过哪些沟通路径，去挖掘、获取这些关键信息。"],"durs":[3.432,5.568,8.688,4.56,6.888]},"P11":{"sents":["第二个渠道，前端直播，这是我们主要的获客渠道之一。","家长通过抖音、小红书、快手等平台的直播了解核桃，购买课程进入班级。","大家可能不知道，一场直播的投流成本很高，从家长刷到直播间、听主播介绍，到下单报名体验课，转化率其实并不高。","也就是说，每一个最终报名的用户，背后可能是几十个甚至上百个浏览量堆出来的。","这些用户报名体验课之后，先由前端班主任服务和转化，转成正式课再交给课导带班，一路走到你手上，我们更要用心服务。"],"durs":[5.136,7.632,11.688,7.752,11.28]},"P12":{"sents":["第三个渠道，赛事奖项吸引。","大家看这几张海报，核桃学员在各类赛事里拿奖，还有很多学员拿到了科技特长生认证资格，这些成绩会吸引一部分家长慕名而来。","这类学生通常是通过赛事奖项了解到核桃，先上体验课，再续报正式课。","他们本身就对编程学习有较高的期待和明确的目标，所以期望更高，对教学质量的要求也更高。","接手这类学员要心里有数：家长看重的是孩子能不能真正学出成果，我们要用真正的教学效果接住这份期待。","来看一道题，赛事奖项吸引来的用户有什么特点？"],"durs":[3.264,12.36,7.296,9.528,10.104,4.848]},"P13":{"sents":["第四个渠道，线下活动引流，包括线下门店体验，还有冬令营、夏令营。","大家看右边这张公司地址图，核桃编程的公司地址覆盖全国十二个省市。","办一场线下活动的成本很高，场地、物料、师资、人力，每一项都要花钱。","反过来看，家长愿意花时间带孩子来参加线下活动，说明他们对编程学习是有真实需求的。"],"durs":[7.08,7.128,7.296,8.664]},"P14":{"sents":["第五个渠道，也是最关键的一环：前端班主任的体验课转化。","前面几个渠道来的用户，很多都要先进入体验课，再由前端班主任负责服务和转化。","用户通常先花10.9，也有299元的。","班主任完成体验课转化后，体验满意的学员转入正式课，由课导老师负责带班，完成日常教学、学情跟进，再到阶段续报。","大家要记住：交到我们手里的学员，已经经过一轮完整服务，本身带着明确的学习期待，目标感会更强。"],"durs":[5.664,7.944,4.44,11.688,9.288]},"P15":{"sents":["五个渠道我们梳理完了。","这里大家要区分清楚，我们现在面对的算法板块家长，和前端体验课的家长不一样。"," 这些家长不是第一次接触核桃，孩子已经在咱们这边学习了一段时间，是选择再次续报复购的用户。","我问大家：已经学了半年、还愿意继续投入时间和费用往下学的家长，他们想要什么？","读懂他们的诉求，我们的服务才能踩准方向。\n","同样对应这五点： 第一，兴趣试探与能力提升。","对他们来说不再是试探，而是已经看到孩子有兴趣，希望持续巩固、拔高逻辑思维能力。"," 第二，咨询长期费用。","他们已经认可课程，现在关心的是完整长期学习路线，以及后续阶段的投入规划。"," 第三，体验核桃产品。","不再是初次试课，而是认可咱们的课程体系，希望跟着体系持续往下深耕。"," 第四，硬件动手锻炼。","希望继续借助实操内容，持续锻炼孩子动手、解决问题的能力。"," 第五，助力升学。","这部分家长的目标会更清晰，愿意长期跟着规划，朝着科技特长生、赛事升学的方向稳步推进。\n","简单总结：前端家长是 “试一试”，我们算法板块的家长，是已经验证价值，选择长期学习。","我们沟通的时候，要站在长期规划的角度，而不是还当成第一次体验的客户。"],"durs":[2.592,7.536,8.832,7.704,4.464,4.848,8.448,2.712,7.632,2.76,7.248,2.736,6,2.256,9.12,8.544,6.912]},"P16":{"sents":["大家来看这几张家长聊天截图，都是咱们续报家长真实的想法。"," 有的家长本身清楚编程的价值，希望帮孩子提升专注力、锻炼逻辑；","有的家长认可编程对思维的锻炼；","还有家长很关注，能不能带动校内其他学科的学习。"," 这些想法，本质上都是家长对孩子成长的期待，也是他们选择持续付费、继续往下学的底层原因。\n","这里重点提醒：这些诉求，前面的老师大概率已经做过记录。","我们接手之后，不要全部重新提问、反复盘问。","要基于已有学情记录，顺着线索继续深挖，匹配对应的服务。"," 我们只有精准接住、持续满足家长的核心诉求，学员才会稳定留存，愿意继续续报，也会主动给我们做转介绍。"],"durs":[6.144,6.72,3.48,4.944,9.264,5.928,4.68,5.808,10.2]},"P17":{"sents":["清楚了用户来源和家长诉求之后，我们落地到课导的实操动作：接手一名学员，首先要摸清哪些信息？","第一大类就是学员信息。\n","大家看用户详情页，这里面是我们必须掌握的内容：年级、学情、课程进度、已经学完的单元、硬件配置、学员标签等等。","页面下方还可以查看孩子每一个单元的到课、完课记录，以及待订正错题。\n","这些信息需要我们主动查阅、提前熟悉。","我们只有吃透学员情况，教学和跟进才能精准，把课上好。"],"durs":[9.48,2.736,11.64,7.152,4.224,5.712]},"P18":{"sents":["第二类必查信息，是用户轨迹。"," 除了学员基础学情，我们还要重点查看学习轨迹、聊天会话、通话录音以及全部历史沟通记录。","大家看截图，详情页里可以看到每一通电话的时间、时长，还有历任老师和家长的聊天记录。\n","通过这些内容，我们能快速摸清这个学员之前的经历，清楚家长一直关注什么、还有哪些遗留问题没有闭环。"," 交接最忌讳的就是：家长之前提过的顾虑、在意的问题，到我们这里断掉、需要家长重复再说一遍。"," 所以接手学员之前，一定要认真查阅历史记录，这是我们承接信任、平稳交接最重要的一手资料。"],"durs":[3.384,8.928,8.64,9.72,9.024,9.264]},"P19":{"sents":["收集完学员信息、用户轨迹之后，还有一个关键动作：及时记录、留存总结。\n","每次和家长沟通结束，要马上更新学生信息表，记下本次沟通要点，同步更新家长诉求；","给家长发送重要资料，尽量用文字确认；","同时定期复盘总结。"," 大家看这张学生信息表，里面包含需求、标签、前端历史信息等栏目，我们接手之后，就在原有记录的基础上持续补充，不用从零搭建。\n","这些工作看着细碎，但恰恰是稳定服务的根基。","上一任老师就是靠着持续记录，慢慢建立起家长信任的。","我们要把这个习惯承接下来，做得更细致。"],"durs":[7.584,8.616,4.152,2.544,12.408,4.584,5.472,4.008]},"P20":{"sents":["接下来进入第三部分，也是今天希望大家重点关注的内容：接力与传承。"," 前面我们理清了用户的来源、整条链路各个岗位的分工。","这一部分，我们聚焦交接环节：学员流转到我们手上之前，前序老师已经打下了哪些服务基础；","接棒时我们有哪些注意事项，以及我们该如何在原有基础上，把服务做得更好。"],"durs":[6.84,5.112,8.904,7.488]},"P21":{"sents":["前一任老师给我们打下的服务基础，可以总结成三重服务属性。","第一重，就是做孩子的老师。\n","大家看截图，左边是日常答疑，孩子发语音、截图来提问；","右边是作业批改。","教代码只是其中一部分，更核心的是，当孩子被难题卡住的时候，陪着他拆解思路、多鼓励，引导孩子自己找到答案，而不是直接给结果。","课后还要及时批改作业。\n","在前一段的服务里，孩子已经习惯了这份持续的关注与正向反馈。","我们接手之后，要继续当好孩子的老师，并且要求做得更深。","毕竟算法阶段课程目标更高、学习周期更长，对孩子的思维要求也更高。"],"durs":[5.856,3,6,2.256,12.96,2.88,6.312,5.664,7.224]},"P22":{"sents":["第二重身份，是家长的教育专家。\n","大部分家长本身并不懂编程，之前的课导会用通俗的大白话，给家长讲明白编程能锻炼的能力，比如逻辑思维、专注力。","同时结合作业批改、课堂观察，持续同步孩子真实的学习状态。"," 长期这样沟通下来，已经在家长心里建立起 “核桃老师很专业” 的认知。\n","我们接手之后，要延续这份专业，并且再往上升级。","用更深度的学情分析、更及时的学习反馈，让家长感受到：进入算法阶段，老师的专业度更强，更值得托付。"],"durs":[3.408,11.256,6.432,6.432,5.088,10.656]},"P23":{"sents":["第三重身份，是孩子和家长共同的朋友。\n","大家看这些聊天记录，有家长提到，虽然只是线上网课的相处，却印象很深，甚至会舍不得之前的老师。","前任老师搭建起了双向的情感桥梁：孩子取得进步，第一时间同步给家长；","家长有困惑，也耐心倾听解答。","这份情感链接，就是信任的根基。\n","现在这份链接交到了我们手里。","我们不只是简单维持，还要继续加深。","要让家长和孩子感受到，虽然升到算法阶段、更换了对接老师，但我们的关心和温度没有中断，反而更加贴心。"],"durs":[4.152,9.6,7.224,3.432,3.432,3.12,3.72,10.008]},"P25":{"sents":["除了首通电话，前一位老师还有一项很重要的交付，就是小灶课。"," 小灶课是正课之外，给学员额外安排的拓展辅导。","除常规课程，还有课前直播、赛考直播、小灶直播，截图里展示的就是课前直播的场景。\n","坚持落地这些直播，本身就是责任心的体现：基础薄弱的孩子可以查漏补缺，学有余力的孩子可以拓展拔高。","也正是这份额外付出，让家长认可核桃老师的用心。\n","现在学员流转到我们算法班，大家可以思考：我们还能给孩子提供哪些差异化价值？","这就是我们接过接力棒、做得比上一棒更好的机会。"],"durs":[6.048,5.04,8.88,10.344,5.136,7.584,4.632]},"P26":{"sents":["最后送给大家几句话共勉：学习不息，成长不止；","追求卓越，舍我其谁；","培训很苦，坚持很酷；","你的付出，决定成长速度。\n","在这里我想额外再强调一句：交到我们手上的每一位学员，都来之不易。","投放团队投入成本引流，前端班主任完成体验转化，首单课导长期跟进、促成续报，一棒接一棒，才流转到我们算法板块。"," 希望大家珍惜每一个用户，稳稳接好这一棒，争取做得比上一棒更出色。"],"durs":[5.088,2.784,2.736,2.88,6.648,11.688,6.552]},"P27":{"sents":["今天的课就到这里。","请大家拿出手机，扫码填写一下《课导侧用户来源》培训调研问卷，写下你的真实感受。"],"durs":[2.16,8.184]},"P04":{"sents":["大家来看这张业务链路图。","主线从左到右分为三段：投放团队负责获客，把流量给到班主任；","班主任承接体验课的服务与转化；","学员转正课之后，就移交到课导团队带班，也就是红框标注的我们这一环。\n","除此之外，还有两条贯穿全链路的支撑线：赛事部门和质检部门，它们不局限于单一环节，全程协同整条业务线。"," 所以一个用户从初次接触核桃编程，到成为正式学员，是投放、班主任、课导、赛事、质检多方配合、环环相扣的结果，并不是课导单打独斗。","前面每一环的交付质量，都会直接影响我们后续和家长、孩子的沟通。\n","这里重点强调：课导不需要自主拓客。","投放团队持续投入成本获客，线上抖音、视频号投流，线下校园合作、地推，每一个体验课用户都有获客成本。","分到我们手上的每一位学员，都是公司投入资源、前面伙伴付出精力换来的，来之不易。","来看一道题，业务链路分析中，用户流转的顺序是？"],"durs":[2.976,6.624,3.456,6.72,10.8,14.208,6.36,4.008,11.088,7.896,5.016]},"P07":{"sents":["我们先明确服务对象。","核桃编程的学员主要集中在 5 到 15 岁，以小学、初中阶段的孩子为主。\n","这里有一个关键点需要大家牢记：我们的用户不只有孩子，还包括家长。","孩子是教学服务的主体，而家长是付费决策者，也是孩子学习过程中的主要负责人。","作为课导，我们既要面向孩子做好教学，也要维护好与家长的沟通关系 —— 后续的续报、转介绍，最终的决策都来自家长。\n","同时大家要清楚，流转到我们算法板块的学员，在交接过来之前，已经经历了前端班主任的体验课服务，也经过了首单阶段课导老师多轮的沟通与跟进，家长对品牌并不陌生。","来看一道题，我们的用户集中在哪个年龄段？"],"durs":[2.4,7.056,6.456,7.92,11.352,15.6,4.272]},"P08":{"sents":["大家来看这张三角关系图，我们先来思考一个问题：平时沟通，你更多是和孩子聊，还是和家长聊？\n","图里清晰标注了：家长是客户，负责付费购买课程；","孩子是实际用户，接收核桃编程的教学。","孩子学完之后产出的学习效果，再反馈给家长，形成完整闭环。\n","孩子和家长在意的点完全不一样：孩子在意课堂好不好玩、有没有兴趣；","家长更看重学习效果、思维提升，能不能帮到校内学习。"," 而我们课导，就是连接这两端的关键纽带。","从前端班主任，到首单课导，再到我们，每一棒都要接稳。"," 我们既要照顾孩子的上课体验，留住孩子的兴趣；","也要持续给家长反馈效果，打消家长顾虑。","前面老师已经铺垫好了信任，我们接手之后，要把这份信任稳住、继续加深。","这个三角逻辑，大家一定要吃透。","来看一道题，三角关系都包含那三个？"],"durs":[9.816,5.376,4.296,6.384,6.84,5.808,4.176,5.64,4.584,4.416,7.224,3.312,3.888]},"P09":{"sents":["知道了用户是谁，再来看他们从哪里来。","大家看这棵渠道树，主要有五大渠道：家长自发宣传的口碑转介绍、前端直播、赛事奖项吸引、线下活动引流，以及前端班主任的体验课转化，另外还有更多正在拓展中的渠道。","后面我们一个一个看。","先请大家记住一句话：不管哪个渠道，每一个用户背后都有成本和付出。","直播要投流；","线下活动要花场地、物料、师资和人力；","口碑转介绍看起来不花钱，其实是老学员用真功夫换来的，是家长认可了前面老师的服务才愿意推荐。","所以，珍惜你手上的每一个用户。","来看一道题，“他们从哪里来”中，标注了“（体验课）”的是哪个渠道？"],"durs":[3.864,16.32,2.184,6.624,1.872,4.536,9.528,3.408,5.88]},"P10":{"sents":["第一个渠道，家长自发宣传，也就是口碑转介绍。","大家看截图里的聊天，家长对课程认可之后，主动向身边的朋友推荐，带来了新的学生。","口碑转介绍是质量最高的渠道之一。","老家长为什么愿意主动推荐？","根本原因是孩子在核桃真的学到了东西，家长看到了效果。","这也说明，前面的老师把服务做到位了，家长才愿意替我们说话。","现在这些通过口碑来的学员，经过前一位老师的服务铺垫，续报之后流转到了你手上。","接手这类学员要心里有数：家长本来就认可核桃，你要接住的正是这份认可。","接下来的问题是，你能不能也做到，让家长愿意主动帮你转介绍？","这是接力，也是挑战。","来看一道题，家长自发宣传/口碑转介绍是怎样带来新学生的？"],"durs":[5.04,8.184,3.744,3.024,5.832,6.048,8.064,7.488,6.048,2.592,6.192]},"P24":{"sents":["前面这三重身份，落到实操动作里，重中之重就是首通电话。","首通，是我们承接信任的起点。"," 之前的老师和家长慢慢建立起长期信任，很多也是从一通首通电话起步的。","大家看 PPT 里的首通录音，时长三十七分钟。","标准首通电话包含四个环节：自我介绍、了解孩子情况、深挖家长诉求、同步课程安排，每个环节都有章法。\n","一通高质量的首通，能稳住家长长期学习的意愿。","这里大家一定要记住：我们对接的家长，已经经过前一位老师的服务和铺垫，不是全新客户。"," 所以我们这通首通，不是从零破冰，它的核心价值，是在已经存在的信任之上，进一步建立家长对我们的信心。","首通的重心是承接、巩固信任，不要一上来就聊续费、费用。","来看一道题，“首通”被定位为什么？"],"durs":[6.24,3.288,7.032,4.872,10.68,4.824,8.136,9.96,6.504,3.432]}},"v":{"slides/P01.jpg":"05179e94","slides/P01.png":"80c7f01b","slides/P02.jpg":"ac8b0c5c","slides/P02.png":"b2442510","slides/P03.jpg":"a3f8d035","slides/P03.png":"19d47a4d","slides/P04.jpg":"d0d0fa56","slides/P04.png":"5446cc7f","slides/P05.jpg":"105e1a5c","slides/P05.png":"a5bca012","slides/P06.jpg":"f609e008","slides/P06.png":"459b6319","slides/P07.jpg":"bd0d5a71","slides/P07.png":"ba53db4d","slides/P08.jpg":"65f29376","slides/P08.png":"29689cbb","slides/P09.jpg":"a372cbeb","slides/P09.png":"6e46d341","slides/P10.jpg":"f346a01e","slides/P10.png":"5779d6bb","slides/P11.j const PASS = 0.6; // 合格线：取自「合格线与重学规则」表「阶段合格线 60%」
const CFG = {"key":"yhly-course-v1","title":"用户来源解析","tag":"图形化 · 课导培训","hero":"P01","titles":{},"depts":["霞霞部","西安一部","西安二部","武汉铁军","长春铁军","苍穹顶"],"skus":["3299首单","3299算法","2699首单","2699算法"],"short":"用户来源解析"};
const KEY = CFG.key;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 课程结构 ---------- */
/* 部门 / SKU 可见性：标「通用」或未标的页所有人可见；带标签的页只有选中的部门/SKU 命中才显示（多选任一命中即可） */
const normTag = t => String(t||'').replace(/1部/g,'一部').replace(/2部/g,'二部').replace(/苍穹鼎/g,'苍穹顶').replace(/\s/g,'');
const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return (!CFG.depts || tagOk(p.dept, st && st.depts)) && (!CFG.skus || tagOk(p.sku, st && st.skus)); }
let STAGES = [];
function buildStages(){
  STAGES = [];
  for (const p of DATA.pages) {
    if (!pageVisible(p)) continue;
    let s = STAGES.find(x => x.name === p.stage);
    if (!s) { s = {name:p.stage, num:+(/阶段\s*(\d+)/.exec(p.stage)||[0,STAGES.length+1])[1], pages:[]}; STAGES.push(s); }
    s.pages.push(p);
  }
  for (const s of STAGES) s.quiz = DATA.qs.filter(q => /阶段练习/.test(q.type) && +(/阶段\s*(\d+)/.exec(q.chapter)||[])[1] === s.num);
}
let st = null; buildStages();
const TITLES = CFG.titles || {};
const FINAL = DATA.qs.filter(q => /综合测试/.test(q.type));

/* ---------- 学习记录（仅存本机浏览器） ---------- */
function fresh(){ return {name:'', team:'', sid:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), unlocked:0, heard:{}, passed:{}, tries:{}, best:{}, final:null, finalTries:0, view:'home', cur:{s:0,p:0}, stageSec:{}}; }
try { st = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e) { st = fresh(); }
buildStages();
// 恢复进度链接：#r=base64(JSON {k,sid,passed:[..],best:{..}})，只对本课 key 生效
let RESTORE=null; try { const m=/[#&]r=([^&]+)/.exec(location.hash); if(m){ const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))))); if(o.k===CFG.key) RESTORE=o; history.replaceState(null,'',location.pathname+location.search); } } catch(e) {}

const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid}, ev, snapshot(online));
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

      <li>带 ✎ 的页面讲完会弹出互动题，答错可能需要重听本页。</li>
      <li>阶段小测 5 题，答对 ${Math.ceil(5*PASS)} 题及以上过关；未过关需重学本阶段后再测。</li>
      <li>全部阶段过关后，解锁本章综合测试（${FINAL.length} 题）。</li>
      <li>你的姓名、职场、各页学习时长和测试成绩会同步给培训老师。</li>
    </ol></section>`;
  bindCommon();
  const f = $('#nameForm');
  if (f) f.onsubmit = e => { e.preventDefault();
    const v = $('#nm').value.trim(); const pick = n => [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x => x.value);
    let t = '', extra = '';
    if (CFG.depts) {
      const ds = pick('dept'), ks = pick('sku'), m = $('#formMsg');
      if (!v || !ds.length || (CFG.skus && !ks.length)) { m.hidden = false; m.textContent = CFG.skus ? '请填写姓名，并至少选择一个部门和一个 SKU。' : '请填写姓名，并至少选择一个部门。'; return; }
      st.depts = ds; st.skus = ks; t = ds.join('、'); extra = `｜部门：${ds.join('、')}` + (CFG.skus ? `｜SKU：${ks.join('、')}` : '');
    } else { t = $('#tm').value.trim(); if (!v || !t) return; }
    st.name = v; st.team = t; buildStages();
    if (!STAGES.length) { const m = $('#formMsg'); m.hidden = false; m.textContent = '你选择的部门 / SKU 暂时没有对应课件，请确认后重新选择。'; st.name = ''; st.depts = st.skus = null; buildStages(); return; }
    const rs = applyRestore(); save();
    report({event:'进入课程', detail:(rs?'恢复进度':'首次进入') + extra}); startStage(rs ? Math.min(st.unlocked, STAGES.length-1) : 0); };
  const r = $('#resume'); if (r) r.onclick = () => { report({event:'进入课程', detail:'继续学习'}); startStage(Math.min(st.unlocked, STAGES.length-1), true); };
  const c = $('#cert'); if (c) c.onclick = () => showQuiz('final');
  const x = $('#reset'); if (x) x.onclick = () => {
    if (x.dataset.armed){ st = fresh(); save(); buildStages(); render(); return; }
    x.dataset.armed = 1; x.textContent = '再点一次确认清空记录';
    const m = $('#resetMsg'); m.hidden = false; m.textContent = '清空后本机的学习进度和成绩都会删除。';
  };
}

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function renderLearn(autoplay){
  const s = curStage(), p = curPage();
  const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const heard = !!st.heard[p.p];
  $('#app').innerHTML = `${headerHTML()}
  ${mapHTML(st.cur.s)}
  ${loopHTML(0)}
  <div class="stage-head"><h2>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}　<span class="muted" style="font-weight:400;font-size:15px">${p.p} ${esc(p.topic)}</span></h2>
    <span class="time">第 ${st.cur.p+1} / ${s.pages.length} 页</span></div>
  <div class="slide">${p.video?`<video id="vd" src="${VU(p.video)}" poster="${SL(p.p)}" controls playsinline preload="metadata" style="width:100%;max-height:70vh;display:block;object-fit:contain;background:#000"></video>`:`<img src="${SL(p.p)}" alt="${esc(p.p+' '+p.topic)}">`}
    <div class="veil" id="veil" ${autoplay?'hidden':''}><button class="btn" id="veilBtn">▶ 点击播放讲解</button></div></div>
  <div class="sub" id="sub" aria-live="polite">${esc(tm.sents[0].trim())}</div>
  <div class="bar">
    <button class="btn ghost" id="prev" ${st.cur.p===0?'disabled':''}>上一页</button>
    <button class="btn" id="pp">播放</button>
    <button class="btn ghost" id="again">重听本页</button>
    <div class="prog" aria-hidden="true"><div id="progfill"></div></div>
    <span class="time" id="time">0:00 / ${fmt(total)}</span>
    <div class="speed" role="group" aria-label="语速">${[1,1.25,1.5].map(r=>`<button data-r="${r}" class="${r===rate?'on':''}">${r}x</button>`).join('')}</div>
    <button class="btn" id="next" ${heard?'':'disabled'}>${st.cur.p===s.pages.length-1?(s.quiz.length?'去做阶段小测':'完成本阶段'):'下一页'}</button>
  </div>
  <div class="dots">${s.pages.map((pg,i)=>`<button class="dot ${st.heard[pg.p]?'heard':''} ${i===st.cur.p?'now':''} ${pg.interact?'q':''}" data-pg="${i}" ${(st.heard[pg.p]||i===st.cur.p)?'':'disabled'} title="${esc(pg.topic)}">${pg.p}</button>`).join('')}</div>
  <details class="full"><summary>展开本页讲解全文</summary><p>${esc(p.script)}</p></details>`;
  bindCommon();
  au.src = VU('audio/'+p.p+'.mp3');
  { const im=document.querySelector('.slide img'); if(im && !im.complete){ im.style.opacity=0; im.onload=()=>{im.style.transition='opacity .2s';im.style.opacity=1;}; } }
  [1,2].forEach(k=>preload(s.pages[st.cur.p+k])); if(st.cur.p+1>=s.pages.length) preload((STAGES[st.cur.s+1]||{pages:[]}).pages[0]);
  au.currentTime = 0; lastT = 0;
  report({event:'进入页面', stage:stageLabel(st.cur.s), page:p.p, detail:p.topic});
  $('#veilBtn').onclick = play;
  { const v = $('#vd'); if (v) v.onplay = () => au.pause(); }
  $('#pp').onclick = () => playing ? au.pause() : play();
  $('#again').onclick = () => { au.currentTime = 0; play(); };
  $('#prev').onclick = () => goPage(st.cur.p-1);
  $('#next').onclick = () => nextPage();
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => goPage(+b.dataset.pg));
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rate = +b.dataset.r; au.playbackRate = rate;
    document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on', x===b)); });
  if (autoplay) play();
}
function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});
  showQuiz('final');
}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
