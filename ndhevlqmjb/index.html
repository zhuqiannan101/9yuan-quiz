<script>
const DATA = {"pages":[{"row":2,"stage":"阶段1·培养习惯","p":"P01","topic":"封面：为什么要学少儿编程（下）——内部因素","script":"接下来我们在从另外一个角度看看：为什么要学少儿编程。","interact":null,"sku":"","dept":""},{"row":3,"stage":"阶段1·培养习惯","p":"P02","topic":"内部因素导入：只讲政策不够，更要聚焦当下孩子立刻能获得的能力提升","script":"上节课我们重点讲解了学习编程的外部因素，也就是各项政策与时代趋势。这些属于长期发展优势，能够为孩子后续的中考、高考乃至长远职业发展提供支撑。\n讲到这里，我们可以思考一个问题：如果孩子现在读小学二年级，家长只听到 “编程对中高考有帮助”，会不会立刻产生报名意愿？\n多数情况下，家长并不会马上行动。大家的顾虑，也正是家长真实的心态：政策虽然利好，但这份收益距离当下太远。我们的学员大多以小学生为主。孩子目前年纪尚小，几年之后的升学环境存在不确定性，孩子能不能坚持学到那个阶段，也是未知数。\n\n这也提醒我们：只讲政策、唤醒重视还不够，更要聚焦当下，和家长聊清楚眼前的收获 —— 孩子现在学习编程，立刻能获得哪些能力上的提升。这才是家长当下最关心的内容。\n本节课我们就来讲解学习编程的短期好处，也就是内部因素。内部能力提升与外部政策趋势相辅相成：外部大势指明方向，内部成长支撑孩子走得更远。\n家长大多已经听过三个关键词：培养习惯、锻炼思维、提升学科。我们的工作不只是简单告知家长有这些益处，更要讲清楚背后的逻辑：编程究竟如何培养学习习惯，又怎样具体助力数学、英语等学科的提升。\n我们要用真实、具体的案例，把价值讲透，让家长真正认可：孩子为什么要学编程，以及为什么现在就要开始学习。","interact":null,"sku":"","dept":""},{"row":4,"stage":"阶段1·培养习惯","p":"P03","topic":"第一章：培养习惯（章节页）——学校和家长常用「治标不治本」的方法","script":"第一个作用，学习编程可以培养孩子的习惯\n目前学校和家长是没有培养习惯的意识，更多采用的方法是”治标不治本“的","interact":null,"sku":"","dept":""},{"row":5,"stage":"阶段1·培养习惯","p":"P04","topic":"学习习惯问题树：专注力差·粗心马虎·自制力（粗心根源=没建立检查习惯）","script":"先看学习习惯。这棵树挂满了影响学习的问题：专注力差、粗心、拖延、叛逆、反应迟钝、没耐心、畏难情绪、沉迷游戏。今天我们挑最有代表性的三个，讲清楚编程是怎么解决的，分别对应提高专注力、改善粗心马虎和增强自制力。\n第一个是专注力差。表现是上课、写作业时东张西望，玩一会儿笔写一个字。为什么孩子学习时坐不住，看动画片却能一动不动？主要是兴趣问题，动画片声光效果丰富、剧情抓人，写作业相对枯燥，孩子自然难以投入。第二个是粗心马虎。这个场景大家都不陌生：题目上的数字8，抄下来变成了0；简单的英语单词总是拼错。这些问题往往不是孩子不会，而是出在粗心上。粗心的根源其实很简单，就是孩子从小没有建立起检查的习惯。考试时总有一些聪明的孩子，一小时的卷子三十分钟就做完了，剩下的时间在摆弄笔袋、给橡皮戳洞，就是不去检查，走过去一看，口算题还有空着的，应用题也没写答。更关键的是，现在很多家庭里，检查作业的任务落在了家长身上，孩子就更缺乏主动检查的意识。第三个是自制力。很多家长反映，孩子一拿起手机、一打开电脑，就沉浸在游戏里抢不回来，不让玩就偷偷玩，亲子关系也变得紧张。这个问题编程是怎么解决的，我们稍后结合视频来看。来看一道题，孩子「粗心马虎」的根源是什么？","interact":{"q":"孩子「粗心马虎」的根源是什么？","at":"P04","options":["题目太难","知识点完全不会","从小没有建立起主动检查的习惯","天生性格如此"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":6,"stage":"阶段1·培养习惯","p":"P05","topic":"核桃提高专注力：兴趣吸引（任务制+动画剧情）·拆解降低难度·及时反馈激励","script":"让我们一起来看看这个视频，核桃编程是如何提高专注力的 第一，用兴趣吸引注意力。视频里大家能感受到，我们的课程是任务制的，每个知识点都穿插在动画剧情里。大家想想，小学阶段的孩子，是更喜欢看动画，还是看纯文字、听老师干讲？而且我们把长时间的学习拆成一个个短小的任务，孩子像闯关一样往前走，自然不容易走神。第二，用拆解降低难度。编程会让孩子一口气写完所有代码吗？不会。就像那个经典问题，怎么把大象放进冰箱？要拆成打开门、放进去、关上门三步。我们的课程也是这样，引导孩子把大难题拆成小关卡，循序渐进，孩子就不容易因为畏难而放弃。第三，用及时反馈激励坚持。每通过一个关卡，系统都会给出即时的正向反馈和鼓励。这种我做到了的成就感，会激励孩子主动挑战下一关，在不知不觉中延长专注学习的时间。跟续费家长沟通时，可以请家长回想一下，孩子这六个月上课时能不能一直跟下来，这就是最有说服力的例子。来看一道题，核桃编程用什么方式吸引孩子的注意力？","interact":null,"sku":"","dept":""},{"row":7,"stage":"阶段1·培养习惯","p":"P06","topic":"改善粗心马虎：代码写错一个字符程序就报错——倒逼孩子自查核对","script":"那接下来我们来讲第二个点，改善粗心马虎。这个问题相信大家都很熟悉，很多孩子做题的时候，题目上的数字 8 抄下来就变成 0，简单的英语单词也总是拼错。很多家长以为是孩子不会，其实根源并不是知识点没掌握，而是没有养成主动检查的习惯。\n不少聪明的孩子，卷子半个小时就写完了，剩下的时间就在摆弄文具、抠橡皮，不会主动回头核对。很多家庭里，检查作业这件事一直都是家长在做，久而久之孩子就缺少自查意识。\n而编程刚好可以帮孩子改掉这个问题，代码只要写错一个字符、一个数字，程序就跑不出来，没有办法蒙混过关。孩子在调试程序的过程中，必须一点点回看、核对、排查错误，慢慢就会养成主动检查、仔细核对的习惯，把这份细心迁移到平时的作业和考试当中，改善粗心马虎的问题。","interact":null,"sku":"","dept":""},{"row":8,"stage":"阶段1·培养习惯","p":"P07","topic":"改善粗心马虎（视频）：报错机制+编写习惯记录+金币奖励","script":"让我们一起来看看核桃编程是如何改善粗心马虎的。编程本身是一件非常严谨的事情，就像我们填表格的时候，公式里面逗号格式不对，结果就出不来，编程更是这样。只要任何一个符号写错，程序就会立刻报错、卡住，不会直接告诉孩子答案，只会让他再试试。这种机制，就是在倒逼着孩子自己从头检查，去思考到底是哪一个代码出问题了，是哪一步逻辑出错了，还是哪个细节写错了，应该怎么去修改。而且我们的课程还会记录孩子的编写习惯，就像图片上大家看到的这样，会给到孩子正向的奖励。孩子通过自己不断调试、认真编写代码，顺利通关之后，页面就会弹出恭喜挑战完成的提示，鼓励孩子继续向前闯关，同时还会给到对应的金币奖励。长此以往，孩子不光慢慢建立起主动检查的意识，更重要的是家长也省心了，不用时时刻刻帮孩子检查作业。来看一道题，核桃编程提高专注力的方式包括？","interact":{"q":"核桃编程提高专注力的方式包括？【多选】","at":"P07","options":["用兴趣吸引注意力——任务制，知识点穿插在动画剧情里","用拆解降低难度——大难题拆成小关卡，像把大象放进冰箱分三步","用及时反馈激励坚持——每过一关都有正向反馈和成就感","罚抄课本十遍"],"answer":0,"answers":[0,1,2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":9,"stage":"阶段1·培养习惯","p":"P08","topic":"增强自制力：从游戏的玩家变成游戏的设计者","script":"接下来我们来讲第三个，增强自制力。很多家长都有这样的困扰，孩子一拿起手机、一开电脑，就很容易沉浸在游戏里面，很难收回来，不让玩还会偷偷玩，亲子关系也会变得紧张。编程刚好可以帮孩子把对电子产品的兴趣，从单纯玩游戏，转变为创造游戏。孩子不再只是游戏的玩家，而是变成游戏的设计者，他会明白游戏背后都是一行一行代码搭建出来的。慢慢的，孩子看待电子产品的心态就不一样了，自制力也会一点点提升，不会再一味沉迷游戏","interact":null,"sku":"","dept":""},{"row":10,"stage":"阶段1·培养习惯","p":"P09","topic":"自制力思路：堵不如疏——从消费者变创造者，「我来制定规则」的掌控感","script":"再来看自制力，也就是沉迷游戏的问题。核桃编程的思路是四个字：堵不如疏。我们不是一味禁止孩子玩游戏，而是通过编程，引导孩子从游戏的消费者，转变成游戏的创造者，成为整个课堂的主人。当孩子开始学怎么设计关卡、布置场景、设置人物和触发条件，视角就完全变了。孩子会去想：怎么让游戏更好玩？怎么让玩家跟着我的设计走？这种我来制定规则的掌控感和创造力，是比打通关更高级、更持久的成就感。这样一来，孩子对游戏的理解提升了，兴趣也从玩转到了造，既能缓解沉迷的问题，又把孩子的热情引导到了学习和创造上。我们一起来看一段视频，了解一下核桃编程的实操课程模式。","interact":null,"sku":"","dept":""},{"row":11,"stage":"阶段1·培养习惯","p":"P10","topic":"三个家长真实反馈+沟通三步法：讲清原理→展示画面→激发期待（体验课邀请）","script":"我们可以看看三个家长的真实反馈：编程到底有没有培养孩子的学习习惯？我们也总结一下：\n第一步，讲清原理：表现表述以及归因，告诉家长编程是如何通过“任务拆解”和“即时反馈”来训练专注力的，给家长一个清晰的逻辑。\n第二步，展示画面：紧接着，拿出我们准备好的案例图片或视频，让家长亲眼看到其他孩子在上课时那种投入的状态，把抽象的原理变得具体、可信。\n第三步，激发期待：最后，用体验课发出最有力的邀请。您可以对家长说：\n“xx妈妈，这次体验课您完全可以和孩子一起来感受。您会亲眼看到，平时可能坐不住20分钟的孩子，是如何被课程吸引，专注地完成40分钟任务的。您也能观察到，为了闯关成功，他会开始主动地、一遍遍地检查自己的代码。这种变化，是您说多少遍‘要认真检查’都比不了的。”\n当您完成了这三步，家长就不再只是听到一个概念，而是预见到了孩子改变的可能性，从而产生强烈的期待和好奇，报名也就成了顺理成章的事。","interact":null,"sku":"","dept":""},{"row":12,"stage":"阶段2·锻炼思维","p":"P11","topic":"第二章：锻炼思维（章节页）——「思维」抽象，需要定义","script":"“编程能锻炼思维”，这几乎是所有家长最看重的核心价值之一。但“思维”这个词听起来很高级，却也特别抽象。\n接下来我们一起看看编程思维如何定义的；","interact":null,"sku":"","dept":""},{"row":13,"stage":"阶段2·锻炼思维","p":"P12","topic":"编程思维四部分：分解·模式识别·抽象·算法（应用：丢三落四/题型/举一反三/一题多解）","script":"大多数人都觉得有点模糊。没关系，我们先看这张表，编程思维可以拆成四个部分。第一是分解，把复杂问题拆成一系列小问题，每个小问题都能单独解决，用在学习上，专治丢三落四，提高审题能力。第二是模式识别，把新问题通过简单的转化，变成已知的老问题，降低解题难度，对应常见题型和公式应用。第三是抽象，忽略问题的细节，专注于问题的核心和关键点，对应举一反三、归纳总结。第四是算法，设计解决问题的步骤，然后执行这些步骤，对应一题多解和简便算法。来看一道题，「专治丢三落四、提高审题能力」对应编程思维的哪个部分？","interact":{"q":"「专治丢三落四、提高审题能力」对应编程思维的哪个部分？","at":"P12","options":["算法——把信息按顺序梳理成完整解题步骤","模式识别——识别固定规律，套用学过的知识模板","抽象——忽略细节，专注核心和关键点","分解——把复杂问题拆解成一系列小问题"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":14,"stage":"阶段2·锻炼思维","p":"P13","topic":"学习案例①分解-化繁为简：泳池铺砖拆成两步（审题能力提升）","script":"接下来我们来看这个学习案例，理解什么是化繁为简。前面我们说到，化繁为简，就是把一个复杂的大问题，拆解成一个个简单的小问题，逐个去解决，这个方法刚好可以帮孩子改掉做题丢三落四的毛病，提升审题能力。\n就拿这道数学应用题来说，题目问我们一共需要多少块方砖。直接看整道题，有的孩子一下子会觉得无从下手。我们就用拆解的思路，把它拆成两步：第一步，先算出整个泳池的面积；第二步，我们已经知道单块瓷砖的面积，再用泳池总面积除以单块瓷砖面积，就能算出一共需要多少块砖。\n编程里也是一样，一个大任务不会一口气写完，而是拆成一小步一小步去实现。孩子长期练习这种拆解思维，再去做数学大题、复杂应用题的时候，就懂得先拆分、一步步梳理条件，不会漏看信息，审题和解题能力也会慢慢提上来。","interact":null,"sku":"","dept":""},{"row":15,"stage":"阶段2·锻炼思维","p":"P14","topic":"学习案例②模式识别-规律整合：长方形面积公式（快速判断题型）","script":"那接下来我们来看第二个思维：模式识别、规律整合。简单来说，就是学会从题目里找到固定的公式和规律，把学过的知识模板套用进来，不用每次遇到新题都从头摸索。\n还是这道泳池铺砖的应用题，我们刚刚已经把题目拆成了两步：先算泳池面积，再算需要多少块砖。那想要算出泳池面积，我们就要识别出它是长方形，对应的固定规律就是长方形面积公式：长 × 宽。\n在编程学习里也是一样，很多重复的逻辑、固定的模块，孩子学会识别模式、总结规律之后，遇到同类问题就可以直接复用这套思路。长期锻炼这种模式识别的能力，孩子做数学题的时候，就能快速判断题型、匹配对应的公式，不会拿到题目就慌乱，做题速度和准确率都会提升。","interact":null,"sku":"","dept":""},{"row":16,"stage":"阶段2·锻炼思维","p":"P15","topic":"学习案例③抽象-聚焦关键：区分已知条件与未知量（审题不跑偏）","script":"那接下来我们来看第三个思维，抽象、聚焦关键。抽象思维，就是让孩子在读题的时候，学会过滤掉无关的描述，快速区分哪些是已知条件、哪些是我们要求的未知量，抓住解题核心。\n还是这道泳池铺砖的题目，我们用面积公式长 × 宽来梳理信息：瓷砖面积是已经告诉我们的，9 平方米，这是已知条件；泳池的面积，是我们还不知道、需要先算出来的未知量。\n很多孩子读应用题容易被一大段文字绕晕，分不清什么信息有用、什么不用管。在编程里也是一样，写代码之前，我们要先明确目标是什么、手上有哪些可用数据。长期练习这种抽象聚焦的思维，孩子读题就不会被多余文字干扰，一眼抓准关键条件，审题不容易跑偏。","interact":null,"sku":"","dept":""},{"row":17,"stage":"阶段2·锻炼思维","p":"P16","topic":"学习案例④算法-逻辑整合：1800÷9=200 三步规范作答","script":"那接下来我们来看第四个，算法 —— 逻辑整合。逻辑整合，就是把前面拆解、找规律、抓关键得到的信息，按照先后顺序，梳理成一套完整、有序的解题步骤，一步一步算出结果。\n还是这道泳池铺砖的题目，我们把完整逻辑串起来：\n第一步，先算出泳池的总面积，60 乘 30 等于 1800 平方米；\n第二步，我们已知单块瓷砖面积是 9 平方米，用总面积除以单块瓷砖面积，1800÷9=200 块；\n第三步，规范写出答案。\n放到编程里面，算法就是我们写代码的执行顺序，先做什么、再做什么、最后输出结果。孩子长期练习这种有序的逻辑整合，做题就不会东算一步、西算一步，解题思路条理清晰，步骤不容易混乱，也能养成规范答题的习惯。以上的四个模式的话，就是我们可以用实际的案例去跟家长去讲的。","interact":null,"sku":"","dept":""},{"row":18,"stage":"阶段2·锻炼思维","p":"P17","topic":"家长真实反馈：锻炼严谨性、逻辑思维、打开思路","script":"接下来我们一起来看看，核桃编程家长的真实反馈。很多家长都发现，编程不只是学技能，更能锻炼孩子的严谨性、逻辑思维，帮孩子打开思路，建立创新的思维模式，对孩子长期的学习发展很有帮助。来看一道题，家长真实反馈中，编程对孩子的帮助是？","interact":{"q":"家长真实反馈中，编程对孩子的帮助是？","at":"P17","options":["锻炼严谨性、逻辑思维，帮孩子打开思路、建立创新思维模式","提升视力、听力，帮孩子改善坐姿和保护眼睛健康","只能玩游戏，孩子每天惦记的都是打游戏通关","只影响视力，屏幕时间越长对眼睛伤害越大"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":19,"stage":"阶段2·锻炼思维","p":"P18","topic":"总结：编程思维=四大能力，可迁移到校内各科学习","script":"我们来总结一下：编程思维，核心就是这四大能力 ——分解化繁为简、模式识别规律整合、抽象聚焦关键、算法逻辑整合。它不是单纯教孩子敲代码，而是一套可以迁移到校内各科学习里的思考方式，帮孩子学会拆解难题、找准规律、抓准条件、有序解题，从底层提升逻辑和思考能力。","interact":null,"sku":"","dept":""},{"row":20,"stage":"阶段3·提升学科与价值总结","p":"P19","topic":"第三章：提升学科（章节页）——主动挂钩学科能力提升","script":"学科成绩永远是家长最核心的关切。因此，在向家长介绍编程的作用时，我们必须主动、清晰地将其与孩子学科能力的提升挂钩，将编程的价值直接转化为家长能立刻感知的学科优势。","interact":null,"sku":"","dept":""},{"row":21,"stage":"阶段3·提升学科与价值总结","p":"P20","topic":"语文学科：田忌赛马可视化——阅读理解与信息整合能力","script":"先看语文。左边是语文课本里的田忌赛马，右边是用编程做出来的田忌赛马。大家说，读一篇文章去理解田忌为什么获胜，和看着马一场一场比下来，哪个更容易理解？显然是后者，因为它把逻辑可视化了。而编程正是在训练这种能力，它要求孩子把文字描述的故事，像拍电影一样拆解成一步一步的逻辑指令。这直接锻炼的，就是语文学习需要的阅读理解和信息整合能力，对写作时把事情讲清楚、讲有条理也很有帮助，大家可以一起来感受，我们借助少儿编程，把田忌赛马的故事完整复原出来。大家就能直观体会，这种方式是如何帮助孩子加深理解的。 和单纯阅读文字、听故事相比，编程实现的版本画面感更强，逻辑过程可视化，抽象的策略变得直观，孩子理解起来会轻松很多。","interact":null,"sku":"","dept":""},{"row":22,"stage":"阶段3·提升学科与价值总结","p":"P21","topic":"数学学科：蜗牛爬井题——理解题意与拆解步骤（分解问题、逻辑建模）","script":"再看数学：我们来看一道经典数学题：“一口井深70，蜗牛白天爬30，晚上下滑10，第几天能到达地面？”\n\n很多孩子加减法都会算，30-10也不难，但为什么一做就错？难就难在“理解题意”和“拆解步骤”。孩子可能读不懂“白天爬、晚上滑”的循环规律，也不知道如何把“到达地面”这个目标转化成一步步的计算。\n\n而编程思维，就是解决这个问题的钥匙。它要求孩子不能只看开头和结尾，必须像设计程序一样，把整个过程拆解成“爬升-下滑-判断是否到达”的清晰循环。来看一道题，「蜗牛爬井」这道数学题，孩子容易做错的原因是？","interact":{"q":"「蜗牛爬井」这道数学题，孩子容易做错的原因是？","at":"P21","options":["加减法不会算——孩子计算能力太弱","难在「理解题意」和「拆解步骤」——读不懂白天爬晚上滑的循环规律","题目超纲——这个年级根本不该考这个","数字太大——井的深度数字太大容易算错"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":23,"stage":"阶段3·提升学科与价值总结","p":"P22","topic":"英语学科：编程指令大量接触英文单词（power/shoot/style/draw）+家长真实反馈","script":"Python和C++会涉及到英语。编程里会大量接触英文单词，比如屏幕上的power、shoot、style、draw，都是编程指令里常用的词。孩子在写代码、做项目时，自然就记住了这些单词，不再是死记硬背。再看右边这段家长的真实反馈：孩子很喜欢这种上课的感觉，晚上还在准备第二天要背的英语；家长说孩子数学本来还可以，英语不太行，最近一个多月英语也赶上来了，就是为了学好编程在努力。用编程场景带动英语学习，孩子有目标、有动力，从被动背单词变成主动去学，英语学习兴趣自然就提上来了。","interact":null,"sku":"","dept":""},{"row":24,"stage":"阶段3·提升学科与价值总结","p":"P23","topic":"信息学科：创始人参与国家信息科技教材编写·知识点对标新课标","script":"核桃编程和信息学科的结合。课程的权威性、实用性是很有保障的：核桃创始人曾参与国家信息科技教材编写，课程体系从源头就和国家级标准同源，知识点完全对标教育部信息科技新课标。孩子在核桃学到的内容，和校内信息课要求、考核方向保持一致，做到所学贴合校内考点。","interact":null,"sku":"","dept":""},{"row":25,"stage":"阶段3·提升学科与价值总结","p":"P24","topic":"内部因素总结：习惯·思维·学科三个层面助力成长","script":"学习编程最核心的益处，在于它对孩子思维方式的塑造。\n这不仅仅是一门技能的学习，更是一次对思维完整性和逻辑严密性的系统训练。以上就是咱们内部因素的总结：核桃编程从三个层面助力孩子成长，一是培养良好的学习习惯，二是锻炼核心的编程思维，三是把思维能力迁移到校内，助力提升学科成绩。后面咱们和家长沟通、讲解为什么要学少儿编程的时候，就可以把今天这套内容完整用上，有理有据地给家长做介绍。来看一道题，内部因素总结中，编程助力孩子成长的三个层面是？","interact":{"q":"内部因素总结中，编程助力孩子成长的三个层面是？【多选】","at":"P24","options":["培养良好的学习习惯","锻炼核心的编程思维","把思维能力迁移到校内，提升学科成绩","当场承诺保送名校——报了就能进重点"],"answer":0,"answers":[0,1,2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":26,"stage":"阶段3·提升学科与价值总结","p":"P25","topic":"学编程价值全景：短期学科助推器+长期升学通道（强基/科技特长生）","script":"接下来我们就用这张图，整体梳理学编程的价值，分为短期收益和长期规划两块，两者相辅相成。\n\n短期来看，编程是助力校内学习的助推器，联动数学、语文、英语三科：数学上锻炼逻辑思维、加深对数学概念的理解；语文锻炼阅读理解与写作能力；英语拓展词汇、提升阅读能力，最终实现综合学科素养和学习能力的提升。编程不是脱离校内的，它和学科学习紧密结合，帮孩子解决当下的学习问题。\n\n长期来看，它是孩子升学的加分规划，打造多元升学通道。信息科技能力是现在人才选拔的重要参考，孩子可以走科技特长生、强基计划、自主招生等方向，拿到升学的双重保障，同时提前打好计算思维、创新和解决问题的底层能力，为长远发展蓄力。\n\n最后也和各位老师共勉：这些价值我们都清楚，但不能等着家长主动来理解，要把这套思路，融入到每一次和家长的沟通里面，主动传递。","interact":null,"sku":"","dept":""},{"row":27,"stage":"阶段3·提升学科与价值总结","p":"P26","topic":"结束寄语","script":"外部看时代、政策和升学，内部看习惯、思维和学科。面对续费家长，外部因素帮家长看清长期方向，内部因素帮家长看到眼前收获，两者结合，才能帮家长坚定地让孩子长期学下去。最后送大家几句话：学习不息，成长不止；追求卓越，舍我其谁；培训很苦，坚持很酷；你的付出，决定成长速度。","interact":null,"sku":"","dept":""},{"row":28,"stage":"阶段3·提升学科与价值总结","p":"P27","topic":"调研问卷","script":"请扫码填写你的真实想法吧~","interact":null,"sku":"","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段1","q":"「学习习惯问题树」上挂着的学习问题包括？","options":[{"k":"A","t":"专注力差、粗心、沉迷游戏、畏难情绪"},{"k":"B","t":"视力差、听力差、记忆力差"},{"k":"C","t":"偏科、厌学、早恋"},{"k":"D","t":"只列出了粗心一项"}],"answer":"A","back":"","sku":""},{"id":"T-S02","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段1","q":"编程帮助孩子改善粗心马虎的机制是？","options":[{"k":"A","t":"代码写错一个字符程序就跑不出来——调试必须回看核对排查，养成主动检查习惯"},{"k":"B","t":"老师全程代为检查代码，孩子只负责观看学习"},{"k":"C","t":"系统自动纠错报答案，孩子不用自己排查错误"},{"k":"D","t":"罚抄正确代码十遍，用重复记忆加深印象"}],"answer":"A","back":"","sku":""},{"id":"T-S03","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段1","q":"核桃对「沉迷游戏」的思路是四个字：堵不如疏——引导孩子从游戏的消费者变成游戏的创造者。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-S04","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段1","q":"跟家长沟通培养习惯时的「三步法」正确顺序是？","options":[{"k":"A","t":"展示画面→讲清原理→报价逼单"},{"k":"B","t":"激发期待→直接邀请体验→签约后再补讲原理"},{"k":"C","t":"先报价再讲原理，最后展示画面收尾"},{"k":"D","t":"讲清原理→展示画面→激发期待（用体验课发出邀请）"}],"answer":"D","back":"","sku":""},{"id":"T-S05","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段1","q":"孩子从游戏的玩家变成游戏的设计者之后，会发生什么？","options":[{"k":"A","t":"更加沉迷游戏，每天花更多时间设计新关卡"},{"k":"B","t":"完全失去兴趣，觉得编程比玩游戏辛苦"},{"k":"C","t":"心态没有任何变化，依然只想玩不想创造"},{"k":"D","t":"明白游戏背后是一行行代码搭建的，看待电子产品的心态不一样，自制力提升"}],"answer":"D","back":"","sku":""},{"id":"T-S06","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段2","q":"编程思维的四个组成部分是？","options":[{"k":"A","t":"分解、模式识别、抽象、算法"},{"k":"B","t":"听说读写"},{"k":"C","t":"记忆、理解、应用、创新"},{"k":"D","t":"拆解、背诵、计算、检查"}],"answer":"A","back":"","sku":""},{"id":"T-S07","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段2","q":"泳池铺砖应用题用「分解」思路拆成的两步是？","options":[{"k":"A","t":"先算泳池总面积，再用总面积除以单块瓷砖面积得出块数"},{"k":"B","t":"先数出砖块总数，再测量每块砖的边长宽度"},{"k":"C","t":"先算池壁的周长，再乘以水深得出所需块数"},{"k":"D","t":"直接心算答案，不需要任何拆解步骤"}],"answer":"A","back":"","sku":""},{"id":"T-S08","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段2","q":"泳池铺砖题中「长方形面积=长×宽」体现的思维是？","options":[{"k":"A","t":"分解-化繁为简——把大问题拆成小问题逐个击破"},{"k":"B","t":"算法-逻辑整合——按顺序梳理成完整解题步骤"},{"k":"C","t":"抽象-聚焦关键——过滤无关信息抓住解题核心"},{"k":"D","t":"模式识别-规律整合——识别固定规律，把学过的知识模板套用进来"}],"answer":"D","back":"","sku":""},{"id":"T-S09","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段2","q":"「抽象-聚焦关键」思维在读题时的作用是？","options":[{"k":"A","t":"把题目从头到尾抄写一遍，标记所有出现过的数字"},{"k":"B","t":"只找数字列算式，不管数字之间的先后逻辑"},{"k":"C","t":"把无关描述也全部算一遍，算得越多越保险"},{"k":"D","t":"过滤无关描述，区分已知条件（瓷砖 9 平方米）与未知量（泳池面积）"}],"answer":"D","back":"","sku":""},{"id":"T-S10","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段2","q":"「算法-逻辑整合」在解题中的体现是？","options":[{"k":"A","t":"想到哪算到哪，东算一步西算一步，最后拼凑结果"},{"k":"B","t":"跳过中间步骤直接写答案，过程能省则省"},{"k":"C","t":"把拆解、找规律、抓关键的信息按顺序梳理成完整步骤，规范写出答案"},{"k":"D","t":"只写最终答案，不写任何计算过程"}],"answer":"C","back":"","sku":""},{"id":"T-S11","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段3","q":"编程版「田忌赛马」对语文学习的帮助是？","options":[{"k":"A","t":"代替孩子完成阅读理解和作文，直接提分"},{"k":"B","t":"自动生成故事大纲，孩子只需要背诵即可"},{"k":"C","t":"把文字故事像拍电影一样拆解成一步步逻辑指令，锻炼阅读理解和信息整合能力"},{"k":"D","t":"只锻炼打字速度，与语文能力没有关系"}],"answer":"C","back":"","sku":""},{"id":"T-S12","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段3","q":"编程如何帮助英语学习？","options":[{"k":"A","t":"直接代替英语课，孩子不用再背课本单词"},{"k":"B","t":"大量接触 power、draw 等英文指令单词——变被动背为主动学"},{"k":"C","t":"每节课随机蹦英文单词，和课程内容无关"},{"k":"D","t":"只练打字不碰英文，对英语没有帮助"}],"answer":"B","back":"","sku":""},{"id":"T-S13","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段3","q":"核桃课程与信息学科的关联是？","options":[{"k":"A","t":"与校内信息课完全无关，是独立的游戏开发课"},{"k":"B","t":"创始人参与国家信息科技教材编写——课程对标教育部新课标"},{"k":"C","t":"只教游戏，不涉及任何校内考点内容"},{"k":"D","t":"进度落后于校内要求，孩子学了会跟不上"}],"answer":"B","back":"","sku":""},{"id":"T-S14","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段3","q":"内部因素（学编程的短期好处）的三个层面是？【多选】","options":[{"k":"A","t":"培养良好的学习习惯"},{"k":"B","t":"锻炼核心的编程思维"},{"k":"C","t":"把思维能力迁移到校内，助力提升学科成绩"},{"k":"D","t":"直接提升收入"}],"answer":"ABC","back":"","sku":""},{"id":"T-S15","type":"阶段练习题","chapter":"为什么要学少儿编程下国润·阶段3","q":"学编程的价值全景（短期+长期）是？","options":[{"k":"A","t":"只有短期收益——就是一门让家长安心的兴趣课，与升学无关"},{"k":"B","t":"短期联动数学、语文、英语三科，助力校内学习；长期走科技特长生、强基等升学通道"},{"k":"C","t":"只有长期规划——当下看不到任何学科上的变化"},{"k":"D","t":"与学科和升学都无关，纯粹是玩游戏的爱好"}],"answer":"B","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题","chapter":"为什么要学少儿编程下国润·全章","q":"只讲政策利好（编程对中高考有帮助），家长就会立刻产生报名意愿吗？","options":[{"k":"A","t":"会立刻产生报名意愿——政策就是最好的成交话术"},{"k":"B","t":"一定会——只要提中高考，家长当场就报名"},{"k":"C","t":"多数情况下不会——政策收益距离当下太远，要聚焦孩子立刻能获得的能力提升"},{"k":"D","t":"与政策完全无关——家长从不关心政策话题"}],"answer":"C","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题","chapter":"为什么要学少儿编程下国润·全章","q":"编程对数学学科的帮助是？","options":[{"k":"A","t":"直接代替孩子解题，报答案省时间"},{"k":"B","t":"培养死记硬背能力，背熟公式就够了"},{"k":"C","t":"锻炼题目理解能力——如「蜗牛爬井」题，拆解题意和步骤"},{"k":"D","t":"只提升打字速度，与数学思维无关"}],"answer":"C","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题","chapter":"为什么要学少儿编程下国润·全章","q":"核桃课程提高专注力的三个方式是？【多选】","options":[{"k":"A","t":"用兴趣吸引注意力——任务制，知识点穿插动画剧情"},{"k":"B","t":"用拆解降低难度——把大难题拆成小关卡"},{"k":"C","t":"用及时反馈激励坚持——「我做到了」的成就感延长专注时间"},{"k":"D","t":"增加纯理论讲课时长"}],"answer":"ABC","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题","chapter":"为什么要学少儿编程下国润·全章","q":"「堵不如疏」在解决孩子沉迷游戏上的应用是？","options":[{"k":"A","t":"一味禁止孩子玩游戏，没收家里所有电子设备"},{"k":"B","t":"限制一切屏幕时间，用打卡表严格管控"},{"k":"C","t":"完全放任孩子玩游戏，等孩子自己觉醒"},{"k":"D","t":"通过编程引导孩子从游戏的消费者转变成创造者，把热情引导到学习和创造上"}],"answer":"D","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题","chapter":"为什么要学少儿编程下国润·全章","q":"培养习惯沟通的「三步法」是？","options":[{"k":"A","t":"讲清原理→展示画面（案例/视频）→激发期待（用体验课发出邀请）"},{"k":"B","t":"报价→逼单→成交，三板斧快速签单"},{"k":"C","t":"批评→鼓励→放弃，观察一段时间再说"},{"k":"D","t":"只发资料不打扰，让家长自己看课程介绍"}],"answer":"A","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题","chapter":"为什么要学少儿编程下国润·全章","q":"编程思维的四大能力是？【多选】","options":[{"k":"A","t":"分解——化繁为简（专治丢三落四、提高审题能力）"},{"k":"B","t":"模式识别——规律整合（常见题型、公式应用）"},{"k":"C","t":"抽象——聚焦关键（举一反三、归纳总结）"},{"k":"D","t":"算法——逻辑整合（死记答案、套用模板）"}],"answer":"ABC","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题","chapter":"为什么要学少儿编程下国润·全章","q":"「抽象-聚焦关键」思维的应用是？","options":[{"k":"A","t":"把所有信息都算一遍，算得越多越保险"},{"k":"B","t":"过滤无关描述，区分已知条件与未知量——如瓷砖 9 平方米和泳池面积"},{"k":"C","t":"只看题目最后一句，其余一概不读"},{"k":"D","t":"跳过读题直接套公式，套哪个算哪个"}],"answer":"B","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题","chapter":"为什么要学少儿编程下国润·全章","q":"编程版田忌赛马对语文的帮助是？","options":[{"k":"A","t":"只能学历史典故，跟阅读写作没有任何关系"},{"k":"B","t":"自动生成作文范文，孩子背诵就能提分"},{"k":"C","t":"把故事拆解成一步步逻辑指令——锻炼阅读理解与信息整合，写作更有条理"},{"k":"D","t":"只锻炼打字速度，练的是键盘熟练度"}],"answer":"C","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题","chapter":"为什么要学少儿编程下国润·全章","q":"核桃课程体系与校内信息学科的关系是？","options":[{"k":"A","t":"创始人参与国家信息科技教材编写——课程对标教育部新课标"},{"k":"B","t":"课程与校内完全脱节，内容自成体系自己讲"},{"k":"C","t":"只教游戏开发，不涉及校内考点"},{"k":"D","t":"进度落后于校内要求，学了反而跟不上"}],"answer":"A","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题","chapter":"为什么要学少儿编程下国润·全章","q":"学编程给孩子的短期+长期价值是？","options":[{"k":"A","t":"只有短期收益，和升学路线没有任何关系"},{"k":"B","t":"短期联动数学、语文、英语三科；长期走科技特长生、强基等升学通道"},{"k":"C","t":"只有长期规划，当下学科看不到变化"},{"k":"D","t":"与学科和升学都无关，只是游戏爱好"}],"answer":"B","back":"","sku":""}],"timing":{"P01":{"sents":["接下来我们在从另外一个角度看看：为什么要学少儿编程。"],"durs":[5.352]},"P02":{"sents":["上节课我们重点讲解了学习编程的外部因素，也就是各项政策与时代趋势。","这些属于长期发展优势，能够为孩子后续的中考、高考乃至长远职业发展提供支撑。\n","讲到这里，我们可以思考一个问题：如果孩子现在读小学二年级，家长只听到 “编程对中高考有帮助”，会不会立刻产生报名意愿？\n","多数情况下，家长并不会马上行动。","大家的顾虑，也正是家长真实的心态：政策虽然利好，但这份收益距离当下太远。","我们的学员大多以小学生为主。","孩子目前年纪尚小，几年之后的升学环境存在不确定性，孩子能不能坚持学到那个阶段，也是未知数。\n\n","这也提醒我们：只讲政策、唤醒重视还不够，更要聚焦当下，和家长聊清楚眼前的收获 —— 孩子现在学习编程，立刻能获得哪些能力上的提升。","这才是家长当下最关心的内容。\n","本节课我们就来讲解学习编程的短期好处，也就是内部因素。","内部能力提升与外部政策趋势相辅相成：外部大势指明方向，内部成长支撑孩子走得更远。\n","家长大多已经听过三个关键词：培养习惯、锻炼思维、提升学科。","我们的工作不只是简单告知家长有这些益处，更要讲清楚背后的逻辑：编程究竟如何培养学习习惯，又怎样具体助力数学、英语等学科的提升。\n","我们要用真实、具体的案例，把价值讲透，让家长真正认可：孩子为什么要学编程，以及为什么现在就要开始学习。"],"durs":[7.296,8.208,11.544,3.696,8.112,3.216,9.6,13.2,3.24,5.808,8.952,6.552,13.008,10.632]},"P03":{"sents":["第一个作用，学习编程可以培养孩子的习惯\n","目前学校和家长是没有培养习惯的意识，更多采用的方法是”治标不治本“的"],"durs":[4.44,7.32]},"P04":{"sents":["先看学习习惯。","这棵树挂满了影响学习的问题：专注力差、粗心、拖延、叛逆、反应迟钝、没耐心、畏难情绪、沉迷游戏。","今天我们挑最有代表性的三个，讲清楚编程是怎么解决的，分别对应提高专注力、改善粗心马虎和增强自制力。\n","第一个是专注力差。","表现是上课、写作业时东张西望，玩一会儿笔写一个字。","为什么孩子学习时坐不住，看动画片却能一动不动？","主要是兴趣问题，动画片声光效果丰富、剧情抓人，写作业相对枯燥，孩子自然难以投入。","第二个是粗心马虎。","这个场景大家都不陌生：题目上的数字8，抄下来变成了0；","简单的英语单词总是拼错。","这些问题往往不是孩子不会，而是出在粗心上。","粗心的根源其实很简单，就是孩子从小没有建立起检查的习惯。","考试时总有一些聪明的孩子，一小时的卷子三十分钟就做完了，剩下的时间在摆弄笔袋、给橡皮戳洞，就是不去检查，走过去一看，口算题还有空着的，应用题也没写答。","更关键的是，现在很多家庭里，检查作业的任务落在了家长身上，孩子就更缺乏主动检查的意识。","第三个是自制力。","很多家长反映，孩子一拿起手机、一打开电脑，就沉浸在游戏里抢不回来，不让玩就偷偷玩，亲子关系也变得紧张。","这个问题编程是怎么解决的，我们稍后结合视频来看。","来看一道题，孩子「粗心马虎」的根源是什么？"],"durs":[2.064,11.016,10.632,2.232,6,5.016,9.144,2.16,6,3.144,4.704,6.144,15.288,9.216,2.088,10.464,5.136,3.984]},"P05":{"sents":["让我们一起来看看这个视频，核桃编程是如何提高专注力的 第一，用兴趣吸引注意力。","视频里大家能感受到，我们的课程是任务制的，每个知识点都穿插在动画剧情里。","大家想想，小学阶段的孩子，是更喜欢看动画，还是看纯文字、听老师干讲？","而且我们把长时间的学习拆成一个个短小的任务，孩子像闯关一样往前走，自然不容易走神。","第二，用拆解降低难度。","编程会让孩子一口气写完所有代码吗？","不会。","就像那个经典问题，怎么把大象放进冰箱？","要拆成打开门、放进去、关上门三步。","我们的课程也是这样，引导孩子把大难题拆成小关卡，循序渐进，孩子就不容易因为畏难而放弃。","第三，用及时反馈激励坚持。","每通过一个关卡，系统都会给出即时的正向反馈和鼓励。","这种我做到了的成就感，会激励孩子主动挑战下一关，在不知不觉中延长专注学习的时间。","跟续费家长沟通时，可以请家长回想一下，孩子这六个月上课时能不能一直跟下来，这就是最有说服力的例子。","来看一道题，核桃编程用什么方式吸引孩子的注意力？"],"durs":[8.088,7.608,7.368,8.64,2.88,3.648,1.872,4.128,4.128,9.048,3.432,5.568,8.544,9.816,5.16]},"P06":{"sents":["那接下来我们来讲第二个点，改善粗心马虎。","这个问题相信大家都很熟悉，很多孩子做题的时候，题目上的数字 8 抄下来就变成 0，简单的英语单词也总是拼错。","很多家长以为是孩子不会，其实根源并不是知识点没掌握，而是没有养成主动检查的习惯。\n","不少聪明的孩子，卷子半个小时就写完了，剩下的时间就在摆弄文具、抠橡皮，不会主动回头核对。","很多家庭里，检查作业这件事一直都是家长在做，久而久之孩子就缺少自查意识。\n","而编程刚好可以帮孩子改掉这个问题，代码只要写错一个字符、一个数字，程序就跑不出来，没有办法蒙混过关。","孩子在调试程序的过程中，必须一点点回看、核对、排查错误，慢慢就会养成主动检查、仔细核对的习惯，把这份细心迁移到平时的作业和考试当中，改善粗心马虎的问题。"],"durs":[4.464,11.016,8.304,9.528,8.208,10.032,16.008]},"P07":{"sents":["让我们一起来看看核桃编程是如何改善粗心马虎的。","编程本身是一件非常严谨的事情，就像我们填表格的时候，公式里面逗号格式不对，结果就出不来，编程更是这样。","只要任何一个符号写错，程序就会立刻报错、卡住，不会直接告诉孩子答案，只会让他再试试。","这种机制，就是在倒逼着孩子自己从头检查，去思考到底是哪一个代码出问题了，是哪一步逻辑出错了，还是哪个细节写错了，应该怎么去修改。","而且我们的课程还会记录孩子的编写习惯，就像图片上大家看到的这样，会给到孩子正向的奖励。","孩子通过自己不断调试、认真编写代码，顺利通关之后，页面就会弹出恭喜挑战完成的提示，鼓励孩子继续向前闯关，同时还会给到对应的金币奖励。","长此以往，孩子不光慢慢建立起主动检查的意识，更重要的是家长也省心了，不用时时刻刻帮孩子检查作业。","来看一道题，核桃编程提高专注力的方式包括？"],"durs":[5.136,10.296,8.88,12.96,8.928,13.92,10.464,4.584]},"P08":{"sents":["接下来我们来讲第三个，增强自制力。","很多家长都有这样的困扰，孩子一拿起手机、一开电脑，就很容易沉浸在游戏里面，很难收回来，不让玩还会偷偷玩，亲子关系也会变得紧张。","编程刚好可以帮孩子把对电子产品的兴趣，从单纯玩游戏，转变为创造游戏。","孩子不再只是游戏的玩家，而是变成游戏的设计者，他会明白游戏背后都是一行一行代码搭建出来的。","慢慢的，孩子看待电子产品的心态就不一样了，自制力也会一点点提升，不会再一味沉迷游戏"],"durs":[3.984,13.296,7.344,9.264,8.616]},"P09":{"sents":["再来看自制力，也就是沉迷游戏的问题。","核桃编程的思路是四个字：堵不如疏。","我们不是一味禁止孩子玩游戏，而是通过编程，引导孩子从游戏的消费者，转变成游戏的创造者，成为整个课堂的主人。","当孩子开始学怎么设计关卡、布置场景、设置人物和触发条件，视角就完全变了。","孩子会去想：怎么让游戏更好玩？","怎么让玩家跟着我的设计走？","这种我来制定规则的掌控感和创造力，是比打通关更高级、更持久的成就感。","这样一来，孩子对游戏的理解提升了，兴趣也从玩转到了造，既能缓解沉迷的问题，又把孩子的热情引导到了学习和创造上。","我们一起来看一段视频，了解一下核桃编程的实操课程模式。"],"durs":[3.864,3.96,10.848,7.944,3.336,2.832,7.32,11.064,5.736]},"P11":{"sents":["“编程能锻炼思维”，这几乎是所有家长最看重的核心价值之一。","但“思维”这个词听起来很高级，却也特别抽象。\n","接下来我们一起看看编程思维如何定义的；"],"durs":[6.048,4.536,4.32]},"P12":{"sents":["大多数人都觉得有点模糊。","没关系，我们先看这张表，编程思维可以拆成四个部分。","第一是分解，把复杂问题拆成一系列小问题，每个小问题都能单独解决，用在学习上，专治丢三落四，提高审题能力。","第二是模式识别，把新问题通过简单的转化，变成已知的老问题，降低解题难度，对应常见题型和公式应用。","第三是抽象，忽略问题的细节，专注于问题的核心和关键点，对应举一反三、归纳总结。","第四是算法，设计解决问题的步骤，然后执行这些步骤，对应一题多解和简便算法。","来看一道题，「专治丢三落四、提高审题能力」对应编程思维的哪个部分？"],"durs":[2.784,5.352,11.352,10.536,8.592,8.016,6.768]},"P13":{"sents":["接下来我们来看这个学习案例，理解什么是化繁为简。","前面我们说到，化繁为简，就是把一个复杂的大问题，拆解成一个个简单的小问题，逐个去解决，这个方法刚好可以帮孩子改掉做题丢三落四的毛病，提升审题能力。\n","就拿这道数学应用题来说，题目问我们一共需要多少块方砖。","直接看整道题，有的孩子一下子会觉得无从下手。","我们就用拆解的思路，把它拆成两步：第一步，先算出整个泳池的面积；","第二步，我们已经知道单块瓷砖的面积，再用泳池总面积除以单块瓷砖面积，就能算出一共需要多少块砖。\n","编程里也是一样，一个大任务不会一口气写完，而是拆成一小步一小步去实现。","孩子长期练习这种拆解思维，再去做数学大题、复杂应用题的时候，就懂得先拆分、一步步梳理条件，不会漏看信息，审题和解题能力也会慢慢提上来。"],"durs":[5.184,14.784,5.664,4.8,6.696,10.2,7.392,14.136]},"P16":{"sents":["那接下来我们来看第四个，算法 —— 逻辑整合。","逻辑整合，就是把前面拆解、找规律、抓关键得到的信息，按照先后顺序，梳理成一套完整、有序的解题步骤，一步一步算出结果。\n","还是这道泳池铺砖的题目，我们把完整逻辑串起来：\n","第一步，先算出泳池的总面积，60 乘 30 等于 1800 平方米；\n","第二步，我们已知单块瓷砖面积是 9 平方米，用总面积除以单块瓷砖面积，1800÷9=200 块；\n","第三步，规范写出答案。\n","放到编程里面，算法就是我们写代码的执行顺序，先做什么、再做什么、最后输出结果。","孩子长期练习这种有序的逻辑整合，做题就不会东算一步、西算一步，解题思路条理清晰，步骤不容易混乱，也能养成规范答题的习惯。","以上的四个模式的话，就是我们可以用实际的案例去跟家长去讲的。"],"durs":[4.656,12.384,4.704,6.408,10.128,2.76,8.28,12.6,5.736]},"P17":{"sents":["接下来我们一起来看看，核桃编程家长的真实反馈。","很多家长都发现，编程不只是学技能，更能锻炼孩子的严谨性、逻辑思维，帮孩子打开思路，建立创新的思维模式，对孩子长期的学习发展很有帮助。","来看一道题，家长真实反馈中，编程对孩子的帮助是？"],"durs":[5.112,13.824,5.304]},"P18":{"sents":["我们来总结一下：编程思维，核心就是这四大能力 ——分解化繁为简、模式识别规律整合、抽象聚焦关键、算法逻辑整合。","它不是单纯教孩子敲代码，而是一套可以迁移到校内各科学习里的思考方式，帮孩子学会拆解难题、找准规律、抓准条件、有序解题，从底层提升逻辑和思考能力。"],"durs":[11.784,15.24]},"P19":{"sents":["学科成绩永远是家长最核心的关切。","因此，在向家长介绍编程的作用时，我们必须主动、清晰地将其与孩子学科能力的提升挂钩，将编程的价值直接转化为家长能立刻感知的学科优势。"],"durs":[3.984,13.944]},"P20":{"sents":["先看语文。","左边是语文课本里的田忌赛马，右边是用编程做出来的田忌赛马。","大家说，读一篇文章去理解田忌为什么获胜，和看着马一场一场比下来，哪个更容易理解？","显然是后者，因为它把逻辑可视化了。","而编程正是在训练这种能力，它要求孩子把文字描述的故事，像拍电影一样拆解成一步一步的逻辑指令。","这直接锻炼的，就是语文学习需要的阅读理解和信息整合能力，对写作时把事情讲清楚、讲有条理也很有帮助，大家可以一起来感受，我们借助少儿编程，把田忌赛马的故事完整复原出来。","大家就能直观体会，这种方式是如何帮助孩子加深理解的。"," 和单纯阅读文字、听故事相比，编程实现的版本画面感更强，逻辑过程可视化，抽象的策略变得直观，孩子理解起来会轻松很多。"],"durs":[1.872,6.096,8.232,3.6,9.552,17.496,5.76,12.336]},"P23":{"sents":["核桃编程和信息学科的结合。","课程的权威性、实用性是很有保障的：核桃创始人曾参与国家信息科技教材编写，课程体系从源头就和国家级标准同源，知识点完全对标教育部信息科技新课标。","孩子在核桃学到的内容，和校内信息课要求、考核方向保持一致，做到所学贴合校内考点。"],"durs":[3.456,15.936,8.784]},"P24":{"sents":["学习编程最核心的益处，在于它对孩子思维方式的塑造。\n","这不仅仅是一门技能的学习，更是一次对思维完整性和逻辑严密性的系统训练。","以上就是咱们内部因素的总结：核桃编程从三个层面助力孩子成长，一是培养良好的学习习惯，二是锻炼核心的编程思维，三是把思维能力迁移到校内，助力提升学科成绩。","后面咱们和家长沟通、讲解为什么要学少儿编程的时候，就可以把今天这套内容完整用上，有理有据地给家长做介绍。","来看一道题，内部因素总结中，编程助力孩子成长的三个层面是？"],"durs":[5.52,7.44,16.104,10.608,6.168]},"P25":{"sents":["接下来我们就用这张图，整体梳理学编程的价值，分为短期收益和长期规划两块，两者相辅相成。\n\n","短期来看，编程是助力校内学习的助推器，联动数学、语文、英语三科：数学上锻炼逻辑思维、加深对数学概念的理解；","语文锻炼阅读理解与写作能力；","英语拓展词汇、提升阅读能力，最终实现综合学科素养和学习能力的提升。","编程不是脱离校内的，它和学科学习紧密结合，帮孩子解决当下的学习问题。\n\n","长期来看，它是孩子升学的加分规划，打造多元升学通道。","信息科技能力是现在人才选拔的重要参考，孩子可以走科技特长生、强基计划、自主招生等方向，拿到升学的双重保障，同时提前打好计算思维、创新和解决问题的底层能力，为长远发展蓄力。\n\n","最后也和各位老师共勉：这些价值我们都清楚，但不能等着家长主动来理解，要把这套思路，融入到每一次和家长的沟通里面，主动传递。"],"durs":[9.6,11.928,3.36,7.584,7.488,5.904,18.624,12.504]},"P26":{"sents":["外部看时代、政策和升学，内部看习惯、思维和学科。","面对续费家长，外部因素帮家长看清长期方向，内部因素帮家长看到眼前收获，两者结合，才能帮家长坚定地让孩子长期学下去。","最后送大家几句话：学习不息，成长不止；","追求卓越，舍我其谁；","培训很苦，坚持很酷；","你的付出，决定成长速度。"],"durs":[5.688,12.768,4.488,2.784,2.736,2.88]},"P10":{"sents":["我们可以看看三个家长的真实反馈：编程到底有没有培养孩子的学习习惯？","我们也总结一下：\n","第一步，讲清原理：表现表述以及归因，告诉家长编程是如何通过“任务拆解”和“即时反馈”来训练专注力的，给家长一个清晰的逻辑。\n","第二步，展示画面：紧接着，拿出我们准备好的案例图片或视频，让家长亲眼看到其他孩子在上课时那种投入的状态，把抽象的原理变得具体、可信。\n","第三步，激发期待：最后，用体验课发出最有力的邀请。","您可以对家长说：\n","“xx妈妈，这次体验课您完全可以和孩子一起来感受。","您会亲眼看到，平时可能坐不住20分钟的孩子，是如何被课程吸引，专注地完成40分钟任务的。","您也能观察到，为了闯关成功，他会开始主动地、一遍遍地检查自己的代码。","这种变化，是您说多少遍‘要认真检查’都比不了的。”\n","当您完成了这三步，家长就不再只是听到一个概念，而是预见到了孩子改变的可能性，从而产生强烈的期待和好奇，报名也就成了顺理成章的事。"],"durs":[6.984,1.968,12.048,14.256,5.832,1.992,5.112,9.024,6.864,4.704,13.08]},"P14":{"sents":["那接下来我们来看第二个思维：模式识别、规律整合。","简单来说，就是学会从题目里找到固定的公式和规律，把学过的知识模板套用进来，不用每次遇到新题都从头摸索。\n","还是这道泳池铺砖的应用题，我们刚刚已经把题目拆成了两步：先算泳池面积，再算需要多少块砖。","那想要算出泳池面积，我们就要识别出它是长方形，对应的固定规律就是长方形面积公式：长 × 宽。\n","在编程学习里也是一样，很多重复的逻辑、固定的模块，孩子学会识别模式、总结规律之后，遇到同类问题就可以直接复用这套思路。","长期锻炼这种模式识别的能力，孩子做数学题的时候，就能快速判断题型、匹配对应的公式，不会拿到题目就慌乱，做题速度和准确率都会提升。"],"durs":[5.4,11.184,9.024,10.032,11.952,13.344]},"P15":{"sents":["那接下来我们来看第三个思维，抽象、聚焦关键。","抽象思维，就是让孩子在读题的时候，学会过滤掉无关的描述，快速区分哪些是已知条件、哪些是我们要求的未知量，抓住解题核心。\n","还是这道泳池铺砖的题目，我们用面积公式长 × 宽来梳理信息：瓷砖面积是已经告诉我们的，9 平方米，这是已知条件；","泳池的面积，是我们还不知道、需要先算出来的未知量。\n","很多孩子读应用题容易被一大段文字绕晕，分不清什么信息有用、什么不用管。","在编程里也是一样，写代码之前，我们要先明确目标是什么、手上有哪些可用数据。","长期练习这种抽象聚焦的思维，孩子读题就不会被多余文字干扰，一眼抓准关键条件，审题不容易跑偏。"],"durs":[5.04,12.504,11.4,5.136,7.416,7.8,10.08]},"P21":{"sents":["再看数学：我们来看一道经典数学题：“一口井深70，蜗牛白天爬30，晚上下滑10，第几天能到达地面？”\n\n","很多孩子加减法都会算，30-10也不难，但为什么一做就错？","难就难在“理解题意”和“拆解步骤”。","孩子可能读不懂“白天爬、晚上滑”的循环规律，也不知道如何把“到达地面”这个目标转化成一步步的计算。\n\n","而编程思维，就是解决这个问题的钥匙。","它要求孩子不能只看开头和结尾，必须像设计程序一样，把整个过程拆解成“爬升-下滑-判断是否到达”的清晰循环。","来看一道题，「蜗牛爬井」这道数学题，孩子容易做错的原因是？"],"durs":[10.44,5.856,3.336,9.12,4.032,10.68,6.096]},"P22":{"sents":["Python和C++会涉及到英语。","编程里会大量接触英文单词，比如屏幕上的power、shoot、style、draw，都是编程指令里常用的词。","孩子在写代码、做项目时，自然就记住了这些单词，不再是死记硬背。","再看右边这段家长的真实反馈：孩子很喜欢这种上课的感觉，晚上还在准备第二天要背的英语；","家长说孩子数学本来还可以，英语不太行，最近一个多月英语也赶上来了，就是为了学好编程在努力。","用编程场景带动英语学习，孩子有目标、有动力，从被动背单词变成主动去学，英语学习兴趣自然就提上来了。"],"durs":[3.432,9.264,6.6,8.712,9.432,11.088]},"P27":{"sents":["请扫码填写你的真实想法吧~"],"durs":[2.952]}},"v":{"slides/P01.jpg":"f05dfdf0","slides/P01.png":"7c713bae","slides/P02.jpg":"bd7c47af","slides/P02.png":"8f5c0d8e","slides/P03.jpg":"1a0753c4","slides/P03.png":"13aa8932","slides/P04.jpg":"bd9a62c1","slides/P04.png":"8769f1f1","slides/P05.jpg":"59dfb8d2","slides/P05.png":"affbe24c","slides/P06.jpg":"e63706f5","slides/P06.png":"c268b2b7","slides/P07.jpg":"42816d66","slides/P07.png":"f0eb5a2a","slides/P08.jpg":"5a5a38f3","slides/P08.png":"b083590e","slides/P09.jpg":"5586fe36","slides/P09.png":"5e50ebd9","slides/P10.jpg":"bd2dfc74","slides/P10.png":"c1024498","slides/P11.jpg":"e1e5c112","slides/P11.png":"1e7f77f5","slides/P12.jpg":"44b8887f","slides/P12.png":"75b12313","slides/P13.jpg":"3245e261","slides/P13.png":"50296458","slides/P14.jpg":"55bbc8b7","slides/P14.png":"9d380a19","slides/P15.jpg":"a7968571","slides/P15.png":"0b4833ef","slides/P16.jpg":"3038b208","slides/P16.png":"f5e41923","slides/P17.jpg":"3071d0d8","slides const PASS = 0.6; // 合格线：取自「合格线与重学规则」表「阶段合格线 60%」
const CFG = {"key":"中价_为什么学下国润-v1","title":"为什么要学少儿编程（下·国润）","short":"为什么要学少儿编程（下·国润）","tag":"中价课 · 新人训","hero":"P01","titles":{"1":"培养习惯","2":"锻炼思维","3":"提升学科与价值总结"},"depts":["国润","汇诚"]};
const KEY = CFG.key;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 课程结构 ---------- */
/* 部门 / SKU 可见性：标「通用」或未标的页所有人可见；带标签的页只有选中的部门/SKU 命中才显示（多选任一命中即可） */
const normTag = t => String(t||'').replace(/1部/g,'一部').replace(/2部/g,'二部').replace(/苍穹鼎/g,'苍穹顶').replace(/\s/g,'');
const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return (!CFG.depts || tagOk(p.dept, st && st.depts)) && (!CFG.skus || tagOk(p.sku, st && st.skus)); }
let STAGES = [];
function buildStages(){
  STAGES = [];
  for (const p of DATA.pages) {
    if (!pageVisible(p)) continue;
    let s = STAGES.find(x => x.name === p.stage);
    if (!s) { s = {name:p.stage, num:+(/阶段\s*(\d+)/.exec(p.stage)||[0,STAGES.length+1])[1], pages:[]}; STAGES.push(s); }
    s.pages.push(p);
  }
  for (const s of STAGES) s.quiz = DATA.qs.filter(q => /阶段练习/.test(q.type) && +(/阶段\s*(\d+)/.exec(q.chapter)||[])[1] === s.num);
}
let st = null; buildStages();
const TITLES = CFG.titles || {};
const FINAL = DATA.qs.filter(q => /综合测试/.test(q.type));

/* ---------- 学习记录（仅存本机浏览器） ---------- */
function fresh(){ return {name:'', team:'', sid:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), unlocked:0, heard:{}, passed:{}, tries:{}, best:{}, final:null, finalTries:0, view:'home', cur:{s:0,p:0}, stageSec:{}}; }
try { st = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e) { st = fresh(); }
buildStages();
// 恢复进度链接：#r=base64(JSON {k,sid,passed:[..],best:{..}})，只对本课 key 生效
let RESTORE=null; try { const m=/[#&]r=([^&]+)/.exec(location.hash); if(m){ const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))))); if(o.k===CFG.key) RESTORE=o; history.replaceState(null,'',location.pathname+location.search); } } catch(e) {}
function applyRestore(){ if(!RESTORE) return false; const o=RESTORE; RESTORE=null;
  st.sid=o.sid||st.sid; st.rowCreated=true;
  for(const i of o.passed){ if(!STAGES[i]) continue; st.passed[i]=true; STAGES[i].pages.forEach(p=>st.heard[p.p]=true); }
  st.unlocked=Math.max(st.unlocked, Math.max(-1,...o.passed)+1); Object.assign(st.best,o.best||{}); save(); return true; }

const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid, course:CFG.short||CFG.title, date:nowStr().slice(0,10)}, ev, snapshot(online));
  { const CNm = CFG.short || CFG.title; if (!String(rec.stage||'').startsWith(CNm + '｜')) rec.stage = CNm + (rec.stage ? '｜' + rec.stage : ''); }
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {

    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }

function onPageEnd(){

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }

        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }

  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
