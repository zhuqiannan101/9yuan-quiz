<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;

  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}

  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%2740%27%3E%3Ctext x=%27100%27 y=%2725%27 fill=%27%23bbb%27 font-size=%2716%27 text-anchor=%27middle%27 font-family=%27sans-serif%27%3EPPT 加载中…%3C/text%3E%3C/svg%3E") center/200px 40px no-repeat;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}

<script>
const DATA = {"pages":[{"row":2,"stage":"高情商沟通·阶段1","p":"P01","topic":"","script":"大家好，这节课是课导老师高情商沟通能力培训这节课不是教大家说漂亮话，也不是教大家怎么讨好家长。咱们要解决的是特别实在的问题：每天给家长发消息、回消息，怎么把每一条都说到点子上，让家长觉得你专业，也觉得你暖心，愿意一直跟你聊下去。咱们面对的家长，孩子已经在核桃学完了第一阶段，跟老师打了半年交道，哪条消息是走流程、哪条是真上心，他们一眼就看得出来。这节课分两部分，前半部分用几个案例，看看沟通为什么这么关键；后半部分给大家一个四步公式，再拆几个高频场景，学完就能直接用到带班里。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":3,"stage":"高情商沟通·阶段1","p":"P02","topic":"","script":"先看第一个案例。大家先别急着评判对错，把自己代入家长的位置，看到下面这几条消息，心里是什么滋味。\n家长说：“老师，今晚孩子要晚一点到家，可能赶不上课。”老师回：“家长您好，今天的课很重要，还是尽量让孩子来上吧。”家长又说：“实在不行，今天确实赶不回来。”老师接着劝：“那能不能让孩子先上线听一会儿？今天内容挺关键的，落下了不好补。”\n到这儿，家长直接爆发了：“你们到底是关心孩子，还是关心到课率？这课我不上了，以后也别催了！”\n大家品一品，这位老师出发点坏吗？不坏，老师觉得自己是在负责任，是为孩子好。可家长接收到的是什么？是你根本不在乎我家孩子今天累不累、方不方便，你只关心你的KPI，不关心我的孩子。\n问题出在哪？家长已经说了赶不回来，老师还在一遍一遍地劝，一直站在自己的角度要结果。本来好好商量就能解决的事，就因为话说得不对，把家长推远了。这种情况带班时很常见，大家先记住这个感觉，下一页咱们看正确的做法。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":4,"stage":"高情商沟通·阶段1","p":"P03","topic":"","script":"那家长说赶不上课，正确的流程应该怎么走？其实就三步。\n第一步，先别急着劝，先把情况问清楚。你可以说：“好的，那今天大概几点能到家呀？路上注意安全哈。”先搞明白时间，再谈别的。这一步最容易被跳过，很多老师一听赶不上，第一反应就是劝来上课，结果就成了上一页那样。\n第二步，根据家长说的时间，分情况处理。情况一，时间还行，能赶上后半段，你就说：“那我看时间还来得及，等孩子到了我单独带他补一下前面的内容。”情况二，时间确实太晚，赶不上了，那就主动安排补课：“那今天就先不赶了，我给孩子安排明天XX点补课，您看方便吗？”注意这句的结尾是问家长方不方便，把选择权交给家长。\n第三步，也是最后的落点。事情都协调完了，家长也满意了，你再顺嘴提一句：“今天特殊情况没关系哈，后面咱们一定要准时来，课前直播我会带着XX复习知识点，可有意思了。”这时候再提准时，家长听着就是提醒，不是催。\n核心就一句话：先解决问题，再提要求。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":5,"stage":"高情商沟通·阶段2","p":"P04","topic":"","script":"再看第二个案例，这个特别容易踩坑。\n前一天晚上，家长发消息：“老师，孩子今天发烧了，明天的课先不上了。”老师回了一句：“好的，您照顾好宝贝。”\n到第二天下午，老师又照常发来一条：“XX妈妈，今天晚上有个编程小灶课，是之前没学过的内容，记得让孩子来上哦。”\n家长一下子就火了：“老师，我不是昨天说了孩子生病了吗？他还在发烧呢！你们根本不记家长说的话？”\n问题出在哪？说句公道话，老师真不是故意的，多半是带班多、消息杂，忘了这个孩子请过假，走流程把通知发出去了。但在家长看来，你昨天答应我照顾好宝贝，今天就忘了？你说的话都是假的？我家孩子在你这儿就是个到课数据，不是一个具体的人。\n这种失望比当面吵架还可怕。家长不会跟你吵，只会默默记在心里，到续课的时候就不找你了。\n那如果换你来回复这位家长，从前一天晚上那条开始，你有把握做得更好吗？大家先凭直觉选一下。","interact":{"q":"如果是你来回复这个家长，你会做得更好吗？","at":"P04","options":["一般吧","我可以的","有点悬"],"answer":-1,"answers":[],"vote":true,"wrong":"直接继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":6,"stage":"高情商沟通·阶段1","p":"P05","topic":"","script":"那孩子生病请假，到底该怎么聊？大家看这组完整的聊天记录。\n家长说：“老师，孩子发烧了，今天就不上课了。”老师没有只回一句好的，而是先问：“啊，宝贝怎么了？严重吗？您先别着急，照顾好孩子。”紧接着又发一条：“课我来安排，您不用操心哈。”家长这才放松下来：“好的谢谢老师，他就是有点感冒。”\n最关键的是第二天下午，老师又主动来了一句：“宝贝今天好点了吗？落下的课您别担心，等他恢复了咱们再补。”\n大家注意三个动作：先关心孩子，主动把安排扛过来，隔天再跟进问候。尤其是第二天那句跟进，正是让家长从客户变成朋友的关键。\n还有个细节，老师是分几条消息发的，不是一次砸过去一大段。这样看着就像真人在一句一句打字，不像群发模板。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":7,"stage":"高情商沟通·阶段1","p":"P06","topic":"","script":"把刚才这个案例拆开，生病请假的沟通节奏一共三步。\n第一步，请假当天，先关心孩子，别提课。话术就是：“啊，宝贝怎么了？严重吗？您先照顾好孩子，课我来安排，您别操心。”\n第二步，生病期间，不要主动发任何课程通知，小灶课、补课提醒、作业通知，全部先停一停。家长正为孩子的病着急，这时候收到课程通知，只会觉得你只关心上课。上一页那个案例，就是在这一步出的问题。所以孩子一请病假，大家最好自己记一笔，提醒自己这几天别给这个家长发通知。\n第三步，孩子好了之后，主动问候，再安排补课：“宝贝今天好点了吗？落下的课您别担心，我看明天下午XX点有空，咱们安排补一下？”\n核心原则就一句话：先把人放在前面，课放在后面。人先顾好了，课的事再说。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":8,"stage":"高情商沟通·阶段1","p":"P07","topic":"","script":"看完两个反面案例，咱们看一个正面的，这个特别暖。\n背景是这样：这位家长平时回复特别少，基本是老师说一句，她回一句好的，从来不主动多聊，你根本摸不透她在想什么。\n这次老师发了一条不一样的消息：“XX妈妈，今天课上宝贝做了一个特别酷的小飞船，还跟我说，这是给他家猫咪做的，哈哈太可爱了！回家您可以问问他猫咪叫什么名字呀。”\n家长一下子就接话了：“哈哈！他真的跟您说这个呀？他在家从来不怎么跟我说学校的事，没想到跟您说了这么多。”聊着聊着，她又主动说：“对了老师，他最近是不是有点坐不住？我看他写作业老是动来动去的，您课上也留意一下？”\n大家看，就因为老师提了一句给猫咪做的飞船，一个特别小的细节，家长立刻觉得：这个老师是真的在关注我家孩子，不是在走流程。然后才愿意主动开口，把真实的顾虑说出来。\n家长愿意说真实顾虑，咱们才有机会帮上忙，关系也就是这样一点点近起来的。很多时候不是家长不愿意理你，是你之前发的全是通知，没让家长感觉到你看见了这个孩子。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":9,"stage":"高情商沟通·阶段1","p":"P08","topic":"","script":"看完这三个案例，咱们回头想一个问题：家长日常真正关心的，到底是什么？\n很多老师以为，家长最关心的是今天学了什么知识点、作业写得对不对、成绩进步了多少。这些当然重要，但它们是结果，是最后才拿出来看的东西，不是家长每天在感受的东西。\n家长平时跟你聊天，心里真正在琢磨的是这几件事：我把孩子交到你手上，你真的看见他了吗？你记不记得他说过的话、他的小爱好？你是真关心他，还是在完成你的工作？\n回头看，被催到课的家长、被小灶课通知气到的家长，生气的根子都不在课本身，而是觉得你根本不在乎我家孩子。而那位被提到猫咪飞船的家长，一下子就打开了话匣子，因为感觉到被重视了。所以家长最后愿意买单、愿意续课，是因为觉得我的孩子被这个老师放在心上了。\n补一个小技巧：咱们带班多，不可能每个孩子都记得特别细。实在想不起具体表现，可以先说上节课咱们一起做的那个小项目，这是孩子确实做过的，说出来不假，家长听着也像在聊自家孩子。但这只是兜底，平时还是要多留意，尽量往具体细节上靠。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":10,"stage":"高情商沟通·阶段1","p":"P09","topic":"","script":"那怎么让家长觉得，这条消息是你专门发给他的，不是群发？四个小技巧，都很好上手。\n第一，拆开发，不要一大段砸过去。像真人打字一样，一句话一条消息，中间停几秒。发三条短消息，比一条长消息更像活人。\n第二，加一个孩子的专属细节。提一句上次课的具体表现、说过的话、喜欢的环节，比如上次他做的那个小游戏特别有意思。家长一看就知道你不是群发。\n第三，不要太规整，留点口语感。适当用用波浪号，还有哈、呢这样的语气词，偶尔打个短句。每句话都是完整的书面语，一看就是模板。\n第四，发完等一等，别追着问。说完一件事就停，等家长回复了再接下一句。一口气把所有话都说完，就像客服话术了。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":11,"stage":"高情商沟通·阶段1","p":"P10","topic":"","script":"技巧讲完了，我想跟大家说清楚一件事：咱们为什么要花这么多时间练沟通？\n因为咱们是线上老师，跟家长不见面，全靠文字。线下老师跟家长面对面，一个微笑、一个点头，家长就放心了。咱们没有表情、没有语气、没有肢体语言，家长只能通过文字来判断咱们这个人。你发的每一条消息，就是家长眼里的你。同样一句话，换个说法，家长的感受就天差地别：你回得敷衍，家长觉得你不在乎；你回得用心，家长觉得你靠谱。\n而且一个孩子要跟咱们上30次课。这30次课里，你和家长的每一次沟通，都是在往信任账户里存钱。存够了，续课就是水到渠成的事。\n做好了能得到什么？家长愿意回复你的消息，愿意开口说真实想法，续课的时候不犹豫，出了问题先找你商量，而不是直接投诉。\n所以记住一句话：线上课导的竞争力，不在课讲得多好，而在你和家长的关系有多近。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":12,"stage":"高情商沟通·阶段2","p":"P11","topic":"","script":"进入第二部分，先纠正一个常见误解：高情商沟通，不等于会说话、会拍马屁。\n左边是错误理解：说话好听、会夸人；八面玲珑、不得罪人；模板话术，复制粘贴；客户说什么都答应。这些都不是高情商。\n真正的高情商沟通是右边这样：先看见情绪，再处理事情；既解决问题，又让人舒服；有温度，但不失专业；站在对方角度说话。\n家长来找咱们的时候，背后基本都带着情绪，可能是焦虑，可能是担心，也可能是不满。咱们的回复要先把这个情绪接住，再去解决具体问题。而且高情商不是一味讨好，什么都答应反而不专业。真正的高情商是既专业又有分寸，知道什么该说、什么不该说。来看一道题，下列哪项属于“真正的高情商沟通”？","interact":{"q":"下列哪项属于“真正的高情商沟通”？","at":"P11","options":["说话好听，会夸人","八面玲珑，不得罪人","既解决问题，又让人舒服","客户说什么都答应"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":13,"stage":"高情商沟通·阶段2","p":"P12","topic":"","script":"接下来这个公式，是今天最核心的东西，大家背下来就能用。高情商沟通四步：共情、确认、方案、跟进。\n第一步共情，先接住情绪。比如：“我特别理解您的担心。”“啊，宝贝怎么了？”目的是让家长觉得：你懂我。\n第二步确认，说清现状。比如：“宝贝在XX方面进步了。”“XX这块还要再巩固。”让家长觉得：你专业。\n第三步方案，给出办法。比如：“我们接下来这样做。”“在家每天花5分钟就行。”让家长觉得：有办法。\n第四步跟进，事后回访。比如：“宝贝今天好点了吗？”“作业做了吗？我看看。”让家长觉得：被重视。\n大家回想一下前面生病请假那个案例，先问宝贝怎么了，再说课我来安排，第二天再问好点没有，其实就用到了这个公式里的共情、方案和跟进。不管是请假、投诉、学情反馈还是挖需，都能套用。记住：先情绪，后事情；先共情，后方案。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":14,"stage":"高情商沟通·阶段2","p":"P13","topic":"","script":"线上沟通全靠文字，所以排版这件事特别重要。同样的话，怎么排版家长才愿意看？咱们看对比。\n左边这种，一大段文字砸过去：“XX妈妈您好，今天孩子上课表现整体还可以，前面热身环节参与比较积极，但是到了后面编程实操环节注意力有点不太集中，有几个地方需要提醒才能跟上，回家之后可以让孩子把今天的作业再练一遍，尤其是第二个任务，下次课我们会重点复习一下。”家长在手机上一看，密密麻麻，扫一眼就关掉了，太长了。\n右边这个版本，短句拆分，重点突出：“XX妈妈，跟您反馈下今天上课情况。宝贝热身环节特别积极，状态很好！编程实操部分稍微有点吃力，这个阶段正常，我们慢慢练。今晚可以让他把作业第2题再练一遍哈。”分段、留白、有重点，家长愿意读完。\n记住三个排版原则：一句话不超过两行；说完一个意思就空一行；重点用语气词带一下就行，别堆一大堆表情符号。另外跟前面说的一样，别一次发一大段，拆成两三条发，更自然。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":15,"stage":"高情商沟通·阶段2","p":"P14","topic":"","script":"这一页是咱们课导老师的沟通地图，分成课前、课中、课后三个阶段。\n课前，主要是到课提醒通知、请假调课沟通、上课前的预热。课中，是实时上课反馈、孩子表现点评、突发情况沟通。课后，是学情总结反馈、作业完成情况、挖需与续课沟通。\n每个阶段的沟通重点不一样，但核心是同一个：让家长感觉到你在真心关心孩子，而不是在走流程。刚才学的四步公式和排版技巧，在每个环节都用得上。\n接下来，咱们就挑几个高频场景，一个一个拆。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":16,"stage":"高情商沟通·阶段2","p":"P15","topic":"","script":"先看场景一，课前到课通知。同样是发上课提醒，为什么家长感受天差地别？\n左边低情商版本，机器人式：“家长您好，今天下午3点有课，请提醒孩子准时参加。”这就是一条通知，不像关心。\n右边高情商版本，有人情味：“XX妈妈下午好，宝贝今天下午3点的课别忘啦，上次他特别喜欢那个环节，今天还会有哦！”\n差别关键在哪？不在通知信息本身，时间一样，事情一样，差的是那一句我记得你家孩子。提到孩子的具体细节，距离一下子就拉近了。不需要多复杂，一句话就够。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":17,"stage":"高情商沟通·阶段2","p":"P16","topic":"","script":"这一页讲一个最容易拉开差距的技巧，叫活人感。也就是30次课，怎么聊出朋友感。\n先看问题：一个孩子上30次课，如果每次你发的都是上课提醒，第一次明天3点上课，第二次还是明天3点上课，一直到第30次都一样，家长心里就一句话：这个老师就是个机器人。\n解法很简单：偶尔插一句非工作的话。比如第3次：“今天降温，宝贝出门多穿点哈。”第10次：“周末带宝贝去哪玩了呀？”第18次：“最近宝贝好像话变多了，开心！”家长就会觉得：这个老师是真的在关注我家孩子。\n三个随时能用的活人感小技巧。一是天气节日闲聊，降温了提醒加衣服，下雨了提醒带伞，过年了拜个年。二是聊孩子的小变化，比如宝贝今天上课笑了好多次，心情不错呀；最近打字快了好多。三是偶尔分享点小事，比如今天看到一个特别好玩的编程小例子，下次课带宝贝玩。\n所以活人感，不是回得越快越好，也不是多用网络热梗，而是偶尔一句自然的闲聊，让家长感受到你真的在关注孩子。不用多，隔几次课来一句就够，关键是自然，别太刻意。咱们给家长的，不只是一节节课，更是有人在真心陪着我家孩子长大的那种感觉。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":18,"stage":"高情商沟通·阶段2","p":"P17","topic":"","script":"场景二，课中实时反馈。孩子上课表现一般，怎么说才不让家长焦虑？\n左边低情商版本，只说结果：“XX妈妈，宝贝今天上课注意力不太集中，回答问题也不太积极。”家长看完更焦虑了，孩子回家说不定还要挨一顿说。\n右边高情商版本，先肯定，再提建议：“XX妈妈，宝贝今天整体还不错，前面热身环节特别积极，后面进入难点的时候稍微有点走神，这个阶段正常，我们多引导就好。”\n差别的关键：先给一个具体的肯定，再把问题说成正常阶段，并且告诉家长我们会引导。注意，这不是只报喜不报忧，问题照样说了，只是换了一种家长能接住的说法。家长不焦虑，才愿意配合咱们。\n记住：反馈不是告状，是和家长站在一边。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":19,"stage":"高情商沟通·阶段2","p":"P18","topic":"","script":"再看挖需。挖需的时候，你问孩子喜不喜欢，家长的回应常常让话题卡住。这里分两种情况，接法不一样。\n情况一：你问孩子喜不喜欢，家长说我还没问他。尴尬的回复是：“哦，那您回头问问他。”话题一下就断在这儿了。高情商的接法是：“没事，宝贝今天课上玩那个游戏的时候特别开心，眼睛都亮了！您晚上可以跟他聊聊，今天最有意思的是哪个环节。”你主动给家长一个话题引子，话就接上了。\n情况二：你问完，家长直接说孩子说不喜欢。慌乱的回复是：“啊？为什么呀？是不是哪里没做好？”这一下就把自己放到了弱势位置。高情商的接法是：“哈哈宝贝很真实！他是不喜欢哪个部分呀？是有点难，还是觉得无聊？我好调整一下。”\n别慌，也别急着道歉。孩子说不喜欢，可能是因为难，因为累，也可能只是那天心情不好。咱们要做的是问清楚不喜欢什么，再表达愿意调整，这样既专业又开放。\n大家发现没有，第一种接法里，起作用的正是孩子课上的具体表现。来看一道题，你问家长“孩子喜不喜欢”，家长说“孩子说不喜欢”，高情商的接法是？","interact":{"q":"你问家长“孩子喜不喜欢”，家长说“孩子说不喜欢”，高情商的接法是？","at":"P18","options":["“啊？为什么呀？是不是哪里没做好？”","“哈哈宝贝很真实！他是不喜欢哪个部分呀？是有点难，还是觉得无聊？我好调整一下~”","“哦，那您回头问问他。”","“好的，收到。”"],"answer":1,"answers":[1],"vote":false,"wrong":"直接继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":20,"stage":"高情商沟通·阶段2","p":"P19","topic":"","script":"场景三，课后学情反馈。家长说孩子最近学得不好，怎么接？\n家长原话是：“老师，我感觉孩子最近学得不好，好像没什么进步，怎么办啊？”\n左边是错误回复，辩解或者甩锅：“不会啊，宝贝上课挺认真的，可能是在家练习不够吧？”这句话的潜台词是什么？是你没辅导好。家长听了肯定不舒服。\n右边是高情商回复，共情加拆解加方案：“我特别理解您的担心！其实宝贝在XX方面进步挺明显的，就是XX这块确实还要再巩固一下。我们接下来这样，在家每天花5分钟练一下就行，我这边课上也会多带他练。”\n家长说学得不好的时候，其实不是来问责的，是在焦虑，是来求助的。这时候千万别辩解，更别把锅甩给家长。先共情，再客观拆解现状，哪里进步了、哪里要巩固，最后给具体方案，这就是刚才四步公式的前三步。家长会觉得你专业，而且跟自己站在一边。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":21,"stage":"高情商沟通·阶段2","p":"P20","topic":"","script":"咱们再看一组聊天实录，把这个场景完整走一遍。\n家长先开口：“老师，我感觉孩子最近学得不好，好像没什么进步，怎么办啊？”\n老师第一条：“我特别理解您的担心！很多家长这个阶段都会有这种感觉。”先接住情绪。\n第二条：“其实宝贝在XX方面进步挺明显的，就是XX这块确实还要再巩固一下。”客观拆解现状，不全盘否定，也不只挑好听的说。\n第三条：“我们接下来这样，在家每天花5分钟练一下就行，我这边课上也会多带他练。”给出具体方案。\n家长回：“好的好的，谢谢老师。”\n关键路径就是：先共情接住情绪，再客观拆解现状，再给出具体方案，不辩解，不甩锅。聊完了也别忘了第四步，过几天问一句练得怎么样。大家还注意到没有，老师依然是分三条发的，家长读着不累，也像真人在慢慢说。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":22,"stage":"高情商沟通·阶段2","p":"P21","topic":"","script":"除了知道该说什么，还得知道哪些话千万别说，说了就踩雷。\n第一，绝对化否定孩子。比如这孩子就是坐不住，注意力天生就差，不是学这块的料。这种话一说，家长可能真就放弃了。孩子还在成长，很多问题都是阶段性的。可以改成：“这个阶段专注力还在发展中，我们多引导就会越来越好。”\n第二，把责任全推给家长。比如您在家得多盯着他啊，他在家练得不够，您怎么不检查作业。家长把孩子交给咱们，是信任咱们，不是来挨训的。可以改成：“我们一起来配合，在家这样练就行，课上我也多带他练。”\n第三，敷衍式回复。好的，收到，嗯嗯，行，没有下文，没有关心，没有温度。哪怕只是回复一条请假消息，也要多问一句孩子怎么样了。\n大家可以对照一下自己平时发的消息，这三类话有没有不小心说过。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":23,"stage":"高情商沟通·阶段2","p":"P22","topic":"","script":"好啦，今天的课就到这里。最后再收一句：先情绪，后事情；先共情，后方案；把人放在前面，课放在后面。大家扫码填写一下培训调研问卷，说说你的真实感受吧！","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"}],"qs":[{"id":"T-S01","type":"阶段练习题·单选","chapter":"高情商沟通·阶段1","q":"家长在日常沟通中最在意的是？","options":[{"k":"A","t":"今天学了哪些知识点"},{"k":"B","t":"作业写得对不对"},{"k":"C","t":"孩子有没有被老师真正看见、放在心上"},{"k":"D","t":"成绩进步了多少"}],"answer":"C","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S02","type":"阶段练习题·单选","chapter":"高情商沟通·阶段1","q":"关于线上课导和家长沟通的特殊之处是？","options":[{"k":"A","t":"和家长不见面，全靠文字"},{"k":"B","t":"可以靠表情、语气补充说明"},{"k":"C","t":"家长主要通过上课视频判断我们"},{"k":"D","t":"沟通次数多，单次沟通影响不大"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S03","type":"阶段练习题·单选","chapter":"高情商沟通·阶段1","q":"家长说孩子今晚晚归、可能赶不上课，老师第一步应该做什么？","options":[{"k":"A","t":"马上劝孩子尽量来上课"},{"k":"B","t":"先问清楚大概几点能到家，把情况了解清楚"},{"k":"C","t":"直接安排明天补课"},{"k":"D","t":"先提醒后面一定要准时"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S04","type":"阶段练习题·单选","chapter":"高情商沟通·阶段1","q":"家长说孩子生病请假，生病期间老师最合适的做法是？","options":[{"k":"A","t":"照常发小灶课和补课提醒"},{"k":"B","t":"暂停一切课程通知，先关心孩子"},{"k":"C","t":"多发作业让孩子在家补上"},{"k":"D","t":"等家长主动联系再说"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S05","type":"阶段练习题·单选","chapter":"高情商沟通·阶段1","q":"孩子生病请假，PPT总结的沟通关键是？","options":[{"k":"A","t":"回一句“好的”就结束"},{"k":"B","t":"先关心孩子 + 主动承担安排 + 隔天跟进问候"},{"k":"C","t":"先发补课时间，再提醒下次准时上课"},{"k":"D","t":"照常发小灶课通知，并附一句关心"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S06","type":"阶段练习题·单选","chapter":"高情商沟通·阶段2","q":"同样发上课提醒，高情商版本和低情商版本的差别关键是？","options":[{"k":"A","t":"不是通知信息，而是“我记得你家孩子”，提到孩子的具体细节"},{"k":"B","t":"写清准确的上课时间"},{"k":"C","t":"用“家长您好”正式开头"},{"k":"D","t":"消息写得越长越显得重视"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S07","type":"阶段练习题·单选","chapter":"高情商沟通·阶段2","q":"同样的话，怎么排版家长才愿意看？","options":[{"k":"A","t":"一大段文字一次说全"},{"k":"B","t":"短句拆分，分段、留白、有重点"},{"k":"C","t":"多用完整的书面长句"},{"k":"D","t":"把所有信息压缩成一句话"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S08","type":"阶段练习题·单选","chapter":"高情商沟通·阶段2","q":"课中反馈孩子表现一般时，比较合适的说法是？","options":[{"k":"A","t":"直接说孩子注意力不集中、回答不积极"},{"k":"B","t":"先给具体肯定，再把问题说成正常阶段并表明会引导"},{"k":"C","t":"只夸优点，回避存在的问题"},{"k":"D","t":"把问题归为孩子天生坐不住"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S09","type":"阶段练习题·单选","chapter":"高情商沟通·阶段2","q":"家长说“感觉孩子最近学得不好、没什么进步”，老师应避免的回复是？","options":[{"k":"A","t":"先共情家长的担心"},{"k":"B","t":"客观拆解哪里有进步、哪里还要巩固"},{"k":"C","t":"辩解说孩子挺认真，可能是在家练习不够"},{"k":"D","t":"给出在家配合的具体小方案"}],"answer":"C","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S10","type":"阶段练习题·单选","chapter":"高情商沟通·阶段2","q":"关于高情商沟通，下列理解正确的是？","options":[{"k":"A","t":"就是说话好听、会夸人、八面玲珑"},{"k":"B","t":"模板话术复制粘贴，客户说什么都答应"},{"k":"C","t":"先看见情绪再处理事情，有温度也不失专业"},{"k":"D","t":"尽量不得罪任何人，回避所有问题"}],"answer":"C","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F01","type":"本章综合测试题·单选","chapter":"高情商沟通·全章","q":"“活人感”主要指？","options":[{"k":"A","t":"消息回复速度一定要快"},{"k":"B","t":"偶尔插一句非工作的自然闲聊，体现真实关注"},{"k":"C","t":"多使用网络热梗拉近距离"},{"k":"D","t":"每条消息都写得很长很详细"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F02","type":"本章综合测试题·单选","chapter":"高情商沟通·全章","q":"根据“这些话千万别说”，下列属于踩雷说法的是？（多选）","options":[{"k":"A","t":"“这孩子就是坐不住”"},{"k":"B","t":"“您在家得多盯着他啊”"},{"k":"C","t":"只回“好的 / 收到”，没有下文"},{"k":"D","t":"“这个阶段专注力还在发展中，我们多引导就会越来越好”"}],"answer":"ABC","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F03","type":"本章综合测试题·单选","chapter":"高情商沟通·全章","q":"家长在日常沟通中在意的内容是？","options":[{"k":"A","t":"孩子成绩进步了多少"},{"k":"B","t":"“我孩子被这个老师放在心上了”"},{"k":"C","t":"老师每天发的通知足够多"},{"k":"D","t":"每节课学的知识点足够多"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F04","type":"本章综合测试题·单选","chapter":"高情商沟通·全章","q":"孩子生病请假，正确沟通节奏的核心原则是？","options":[{"k":"A","t":"先把“人”放在前面，“课”放在后面"},{"k":"B","t":"先把补课安排好，再关心孩子"},{"k":"C","t":"课程通知照常发，避免落下进度"},{"k":"D","t":"等家长主动联系再跟进"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F05","type":"本章综合测试题·单选","chapter":"高情商沟通·全章","q":"想让家长觉得你是“专门发给他的”，关于发消息方式正确的是？","options":[{"k":"A","t":"拆开发，一句话一条消息，中间停几秒"},{"k":"B","t":"一口气把所有话都说完"},{"k":"C","t":"每句话都用完整书面语"},{"k":"D","t":"发完马上追问家长看了没"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F06","type":"本章综合测试题·单选","chapter":"高情商沟通·全章","q":"线上课导把和家长的沟通做好了，能得到什么？（多选）","options":[{"k":"A","t":"家长愿意回复你的消息"},{"k":"B","t":"续课的时候不犹豫"},{"k":"C","t":"出问题的时候家长先找你商量"},{"k":"D","t":"可以减少和家长的沟通次数"}],"answer":"ABC","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F07","type":"本章综合测试题·单选","chapter":"高情商沟通·全章","q":"高情商沟通四步公式的正确顺序是？","options":[{"k":"A","t":"共情→确认→方案→跟进"},{"k":"B","t":"确认→共情→方案→跟进"},{"k":"C","t":"方案→共情→确认→跟进"},{"k":"D","t":"共情→方案→确认→跟进"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F08","type":"本章综合测试题·判断","chapter":"高情商沟通·全章","q":"在课导老师的沟通地图中，下列属于“课中”环节的是？","options":[{"k":"A","t":"实时上课反馈"},{"k":"B","t":"到课提醒通知"},{"k":"C","t":"学情总结反馈"},{"k":"D","t":"作业完成情况"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F09","type":"本章综合测试题·单选","chapter":"高情商沟通·全章","q":"你问家长“孩子喜不喜欢”，家长说“我还没问他”，高情商的接法是？","options":[{"k":"A","t":"“哦，那您回头问问他。”"},{"k":"B","t":"“没事~宝贝今天课上玩那个游戏的时候特别开心，眼睛都亮了！您晚上可以跟他聊聊今天最有意思的是哪个环节~”"},{"k":"C","t":"“啊？为什么呀？是不是哪里没做好？”"},{"k":"D","t":"“好的，收到。”"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F10","type":"本章综合测试题·单选","chapter":"高情商沟通·全章","q":"家长说孩子晚归、可能赶不上课，问清后发现时间还行、能赶上后半段，PPT建议怎么回复？","options":[{"k":"A","t":"“那我看时间还来得及，等孩子到了我单独带他补一下前面的内容~”"},{"k":"B","t":"“那今天就先不赶了，我给孩子安排明天XX点补课，您看方便吗？”"},{"k":"C","t":"“今天的课很重要，还是尽量让孩子来上吧。”"},{"k":"D","t":"“那能不能让孩子先上线听一会儿？”"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"}],"timing":{"P01":{"sents":["大家好，这节课是课导老师高情商沟通能力培训这节课不是教大家说漂亮话，也不是教大家怎么讨好家长。","咱们要解决的是特别实在的问题：每天给家长发消息、回消息，怎么把每一条都说到点子上，让家长觉得你专业，也觉得你暖心，愿意一直跟你聊下去。","咱们面对的家长，孩子已经在核桃学完了第一阶段，跟老师打了半年交道，哪条消息是走流程、哪条是真上心，他们一眼就看得出来。","这节课分两部分，前半部分用几个案例，看看沟通为什么这么关键；","后半部分给大家一个四步公式，再拆几个高频场景，学完就能直接用到带班里。"],"durs":[10.32,13.488,12.216,6.312,7.632]},"P02":{"sents":["先看第一个案例。","大家先别急着评判对错，把自己代入家长的位置，看到下面这几条消息，心里是什么滋味。\n","家长说：“老师，今晚孩子要晚一点到家，可能赶不上课。”","老师回：“家长您好，今天的课很重要，还是尽量让孩子来上吧。”","家长又说：“实在不行，今天确实赶不回来。”","老师接着劝：“那能不能让孩子先上线听一会儿？","今天内容挺关键的，落下了不好补。”\n","到这儿，家长直接爆发了：“你们到底是关心孩子，还是关心到课率？","这课我不上了，以后也别催了！”\n","大家品一品，这位老师出发点坏吗？","不坏，老师觉得自己是在负责任，是为孩子好。","可家长接收到的是什么？","是你根本不在乎我家孩子今天累不累、方不方便，你只关心你的KPI，不关心我的孩子。\n","问题出在哪？","家长已经说了赶不回来，老师还在一遍一遍地劝，一直站在自己的角度要结果。","本来好好商量就能解决的事，就因为话说得不对，把家长推远了。","这种情况带班时很常见，大家先记住这个感觉，下一页咱们看正确的做法。"],"durs":[2.04,8.112,5.592,6.264,4.368,4.392,3.552,6.168,2.976,3.648,4.992,2.544,8.568,1.872,7.608,5.952,7.056]},"P03":{"sents":["那家长说赶不上课，正确的流程应该怎么走？","其实就三步。\n","第一步，先别急着劝，先把情况问清楚。","你可以说：“好的，那今天大概几点能到家呀？","路上注意安全哈。”","先搞明白时间，再谈别的。","这一步最容易被跳过，很多老师一听赶不上，第一反应就是劝来上课，结果就成了上一页那样。\n","第二步，根据家长说的时间，分情况处理。","情况一，时间还行，能赶上后半段，你就说：“那我看时间还来得及，等孩子到了我单独带他补一下前面的内容。”","情况二，时间确实太晚，赶不上了，那就主动安排补课：“那今天就先不赶了，我给孩子安排明天XX点补课，您看方便吗？”","注意这句的结尾是问家长方不方便，把选择权交给家长。\n","第三步，也是最后的落点。","事情都协调完了，家长也满意了，你再顺嘴提一句：“今天特殊情况没关系哈，后面咱们一定要准时来，课前直播我会带着XX复习知识点，可有意思了。”","这时候再提准时，家长听着就是提醒，不是催。\n","核心就一句话：先解决问题，再提要求。"],"durs":[4.704,1.872,4.176,4.296,2.064,2.976,8.76,4.296,10.128,11.232,5.592,2.904,13.536,4.704,4.176]},"P04":{"sents":["再看第二个案例，这个特别容易踩坑。\n","前一天晚上，家长发消息：“老师，孩子今天发烧了，明天的课先不上了。”","老师回了一句：“好的，您照顾好宝贝。”\n","到第二天下午，老师又照常发来一条：“XX妈妈，今天晚上有个编程小灶课，是之前没学过的内容，记得让孩子来上哦。”\n","家长一下子就火了：“老师，我不是昨天说了孩子生病了吗？","他还在发烧呢！","你们根本不记家长说的话？”\n","问题出在哪？","说句公道话，老师真不是故意的，多半是带班多、消息杂，忘了这个孩子请过假，走流程把通知发出去了。","但在家长看来，你昨天答应我照顾好宝贝，今天就忘了？","你说的话都是假的？","我家孩子在你这儿就是个到课数据，不是一个具体的人。\n","这种失望比当面吵架还可怕。","家长不会跟你吵，只会默默记在心里，到续课的时候就不找你了。\n","那如果换你来回复这位家长，从前一天晚上那条开始，你有把握做得更好吗？","大家先凭直觉选一下。"],"durs":[3.576,6.984,3.744,10.824,5.616,1.872,2.616,1.872,9.624,5.112,2.232,4.848,3.192,6.096,6.888,2.424]},"P05":{"sents":["那孩子生病请假，到底该怎么聊？","大家看这组完整的聊天记录。\n","家长说：“老师，孩子发烧了，今天就不上课了。”","老师没有只回一句好的，而是先问：“啊，宝贝怎么了？","严重吗？","您先别着急，照顾好孩子。”","紧接着又发一条：“课我来安排，您不用操心哈。”","家长这才放松下来：“好的谢谢老师，他就是有点感冒。”\n","最关键的是第二天下午，老师又主动来了一句：“宝贝今天好点了吗？","落下的课您别担心，等他恢复了咱们再补。”\n","大家注意三个动作：先关心孩子，主动把安排扛过来，隔天再跟进问候。","尤其是第二天那句跟进，正是让家长从客户变成朋友的关键。\n","还有个细节，老师是分几条消息发的，不是一次砸过去一大段。","这样看着就像真人在一句一句打字，不像群发模板。"],"durs":[3.336,2.928,4.896,5.328,1.872,2.904,4.464,5.064,6.312,4.32,6.912,5.904,6.288,4.92]},"P06":{"sents":["把刚才这个案例拆开，生病请假的沟通节奏一共三步。\n","第一步，请假当天，先关心孩子，别提课。","话术就是：“啊，宝贝怎么了？","严重吗？","您先照顾好孩子，课我来安排，您别操心。”\n","第二步，生病期间，不要主动发任何课程通知，小灶课、补课提醒、作业通知，全部先停一停。","家长正为孩子的病着急，这时候收到课程通知，只会觉得你只关心上课。","上一页那个案例，就是在这一步出的问题。","所以孩子一请病假，大家最好自己记一笔，提醒自己这几天别给这个家长发通知。\n","第三步，孩子好了之后，主动问候，再安排补课：“宝贝今天好点了吗？","落下的课您别担心，我看明天下午XX点有空，咱们安排补一下？”\n","核心原则就一句话：先把人放在前面，课放在后面。","人先顾好了，课的事再说。"],"durs":[5.424,4.608,3.144,1.872,4.224,9.48,7.296,3.912,8.016,6.432,6.048,5.208,2.952]},"P07":{"sents":["看完两个反面案例，咱们看一个正面的，这个特别暖。\n","背景是这样：这位家长平时回复特别少，基本是老师说一句，她回一句好的，从来不主动多聊，你根本摸不透她在想什么。\n","这次老师发了一条不一样的消息：“XX妈妈，今天课上宝贝做了一个特别酷的小飞船，还跟我说，这是给他家猫咪做的，哈哈太可爱了！","回家您可以问问他猫咪叫什么名字呀。”\n","家长一下子就接话了：“哈哈！","他真的跟您说这个呀？","他在家从来不怎么跟我说学校的事，没想到跟您说了这么多。”","聊着聊着，她又主动说：“对了老师，他最近是不是有点坐不住？","我看他写作业老是动来动去的，您课上也留意一下？”\n","大家看，就因为老师提了一句给猫咪做的飞船，一个特别小的细节，家长立刻觉得：这个老师是真的在关注我家孩子，不是在走流程。","然后才愿意主动开口，把真实的顾虑说出来。\n","家长愿意说真实顾虑，咱们才有机会帮上忙，关系也就是这样一点点近起来的。","很多时候不是家长不愿意理你，是你之前发的全是通知，没让家长感觉到你看见了这个孩子。"],"durs":[4.92,10.92,12.144,3.6,3.024,2.16,5.424,6,4.728,12.024,4.224,6.888,8.736]},"P08":{"sents":["看完这三个案例，咱们回头想一个问题：家长日常真正关心的，到底是什么？\n","很多老师以为，家长最关心的是今天学了什么知识点、作业写得对不对、成绩进步了多少。","这些当然重要，但它们是结果，是最后才拿出来看的东西，不是家长每天在感受的东西。\n","家长平时跟你聊天，心里真正在琢磨的是这几件事：我把孩子交到你手上，你真的看见他了吗？","你记不记得他说过的话、他的小爱好？","你是真关心他，还是在完成你的工作？\n","回头看，被催到课的家长、被小灶课通知气到的家长，生气的根子都不在课本身，而是觉得你根本不在乎我家孩子。","而那位被提到猫咪飞船的家长，一下子就打开了话匣子，因为感觉到被重视了。","所以家长最后愿意买单、愿意续课，是因为觉得我的孩子被这个老师放在心上了。\n","补一个小技巧：咱们带班多，不可能每个孩子都记得特别细。","实在想不起具体表现，可以先说上节课咱们一起做的那个小项目，这是孩子确实做过的，说出来不假，家长听着也像在聊自家孩子。","但这只是兜底，平时还是要多留意，尽量往具体细节上靠。"],"durs":[6.888,8.208,8.064,8.496,3.504,3.648,10.848,7.032,7.896,5.712,12,5.688]},"P09":{"sents":["那怎么让家长觉得，这条消息是你专门发给他的，不是群发？","四个小技巧，都很好上手。\n","第一，拆开发，不要一大段砸过去。","像真人打字一样，一句话一条消息，中间停几秒。","发三条短消息，比一条长消息更像活人。\n","第二，加一个孩子的专属细节。","提一句上次课的具体表现、说过的话、喜欢的环节，比如上次他做的那个小游戏特别有意思。","家长一看就知道你不是群发。\n","第三，不要太规整，留点口语感。","适当用用波浪号，还有哈、呢这样的语气词，偶尔打个短句。","每句话都是完整的书面语，一看就是模板。\n","第四，发完等一等，别追着问。","说完一件事就停，等家长回复了再接下一句。","一口气把所有话都说完，就像客服话术了。"],"durs":[5.808,3,3.648,4.896,4.248,3.552,8.568,3.024,3.6,5.64,4.104,3.36,4.752,4.104]},"P10":{"sents":["技巧讲完了，我想跟大家说清楚一件事：咱们为什么要花这么多时间练沟通？\n","因为咱们是线上老师，跟家长不见面，全靠文字。","线下老师跟家长面对面，一个微笑、一个点头，家长就放心了。","咱们没有表情、没有语气、没有肢体语言，家长只能通过文字来判断咱们这个人。","你发的每一条消息，就是家长眼里的你。","同样一句话，换个说法，家长的感受就天差地别：你回得敷衍，家长觉得你不在乎；","你回得用心，家长觉得你靠谱。\n","而且一个孩子要跟咱们上30次课。","这30次课里，你和家长的每一次沟通，都是在往信任账户里存钱。","存够了，续课就是水到渠成的事。\n","做好了能得到什么？","家长愿意回复你的消息，愿意开口说真实想法，续课的时候不犹豫，出了问题先找你商量，而不是直接投诉。\n","所以记住一句话：线上课导的竞争力，不在课讲得多好，而在你和家长的关系有多近。"],"durs":[6.744,4.896,6.12,7.512,3.84,7.896,3.168,3.552,6.096,3.696,2.328,9.768,7.896]},"P12":{"sents":["接下来这个公式，是今天最核心的东西，大家背下来就能用。","高情商沟通四步：共情、确认、方案、跟进。\n","第一步共情，先接住情绪。","比如：“我特别理解您的担心。”","“啊，宝贝怎么了？”","目的是让家长觉得：你懂我。\n","第二步确认，说清现状。","比如：“宝贝在XX方面进步了。”","“XX这块还要再巩固。”","让家长觉得：你专业。\n","第三步方案，给出办法。","比如：“我们接下来这样做。”","“在家每天花5分钟就行。”","让家长觉得：有办法。\n","第四步跟进，事后回访。","比如：“宝贝今天好点了吗？”","“作业做了吗？","我看看。”","让家长觉得：被重视。\n","大家回想一下前面生病请假那个案例，先问宝贝怎么了，再说课我来安排，第二天再问好点没有，其实就用到了这个公式里的共情、方案和跟进。","不管是请假、投诉、学情反馈还是挖需，都能套用。","记住：先情绪，后事情；","先共情，后方案。"],"durs":[5.592,5.112,2.928,2.976,2.112,3.24,2.76,3.264,2.568,2.616,2.664,2.688,2.856,2.616,2.76,2.808,1.872,1.872,2.712,12.984,5.496,3.12,2.328]},"P13":{"sents":["线上沟通全靠文字，所以排版这件事特别重要。","同样的话，怎么排版家长才愿意看？","咱们看对比。\n","左边这种，一大段文字砸过去：“XX妈妈您好，今天孩子上课表现整体还可以，前面热身环节参与比较积极，但是到了后面编程实操环节注意力有点不太集中，有几个地方需要提醒才能跟上，回家之后可以让孩子把今天的作业再练一遍，尤其是第二个任务，下次课我们会重点复习一下。”","家长在手机上一看，密密麻麻，扫一眼就关掉了，太长了。\n","右边这个版本，短句拆分，重点突出：“XX妈妈，跟您反馈下今天上课情况。","宝贝热身环节特别积极，状态很好！","编程实操部分稍微有点吃力，这个阶段正常，我们慢慢练。","今晚可以让他把作业第2题再练一遍哈。”","分段、留白、有重点，家长愿意读完。\n","记住三个排版原则：一句话不超过两行；","说完一个意思就空一行；","重点用语气词带一下就行，别堆一大堆表情符号。","另外跟前面说的一样，别一次发一大段，拆成两三条发，更自然。"],"durs":[5.064,3.504,1.872,25.656,5.544,7.488,3.792,5.856,3.816,4.248,4.224,2.712,4.824,6.12]},"P14":{"sents":["这一页是咱们课导老师的沟通地图，分成课前、课中、课后三个阶段。\n","课前，主要是到课提醒通知、请假调课沟通、上课前的预热。","课中，是实时上课反馈、孩子表现点评、突发情况沟通。","课后，是学情总结反馈、作业完成情况、挖需与续课沟通。\n","每个阶段的沟通重点不一样，但核心是同一个：让家长感觉到你在真心关心孩子，而不是在走流程。","刚才学的四步公式和排版技巧，在每个环节都用得上。\n","接下来，咱们就挑几个高频场景，一个一个拆。"],"durs":[6.912,6.24,5.952,6.168,9.36,5.28,4.416]},"P15":{"sents":["先看场景一，课前到课通知。","同样是发上课提醒，为什么家长感受天差地别？\n","左边低情商版本，机器人式：“家长您好，今天下午3点有课，请提醒孩子准时参加。”","这就是一条通知，不像关心。\n","右边高情商版本，有人情味：“XX妈妈下午好，宝贝今天下午3点的课别忘啦，上次他特别喜欢那个环节，今天还会有哦！”\n","差别关键在哪？","不在通知信息本身，时间一样，事情一样，差的是那一句我记得你家孩子。","提到孩子的具体细节，距离一下子就拉近了。","不需要多复杂，一句话就够。"],"durs":[3.312,4.968,8.208,3.024,11.328,1.968,7.008,4.08,2.952]},"P16":{"sents":["这一页讲一个最容易拉开差距的技巧，叫活人感。","也就是30次课，怎么聊出朋友感。\n","先看问题：一个孩子上30次课，如果每次你发的都是上课提醒，第一次明天3点上课，第二次还是明天3点上课，一直到第30次都一样，家长心里就一句话：这个老师就是个机器人。\n","解法很简单：偶尔插一句非工作的话。","比如第3次：“今天降温，宝贝出门多穿点哈。”","第10次：“周末带宝贝去哪玩了呀？”","第18次：“最近宝贝好像话变多了，开心！”","家长就会觉得：这个老师是真的在关注我家孩子。\n","三个随时能用的活人感小技巧。","一是天气节日闲聊，降温了提醒加衣服，下雨了提醒带伞，过年了拜个年。","二是聊孩子的小变化，比如宝贝今天上课笑了好多次，心情不错呀；","最近打字快了好多。","三是偶尔分享点小事，比如今天看到一个特别好玩的编程小例子，下次课带宝贝玩。\n","所以活人感，不是回得越快越好，也不是多用网络热梗，而是偶尔一句自然的闲聊，让家长感受到你真的在关注孩子。","不用多，隔几次课来一句就够，关键是自然，别太刻意。","咱们给家长的，不只是一节节课，更是有人在真心陪着我家孩子长大的那种感觉。"],"durs":[5.016,3.504,16.584,3.864,4.68,3.504,4.44,4.776,3.288,7.152,6.504,2.208,7.848,10.608,5.64,7.344]},"P17":{"sents":["场景二，课中实时反馈。","孩子上课表现一般，怎么说才不让家长焦虑？\n","左边低情商版本，只说结果：“XX妈妈，宝贝今天上课注意力不太集中，回答问题也不太积极。”","家长看完更焦虑了，孩子回家说不定还要挨一顿说。\n","右边高情商版本，先肯定，再提建议：“XX妈妈，宝贝今天整体还不错，前面热身环节特别积极，后面进入难点的时候稍微有点走神，这个阶段正常，我们多引导就好。”\n","差别的关键：先给一个具体的肯定，再把问题说成正常阶段，并且告诉家长我们会引导。","注意，这不是只报喜不报忧，问题照样说了，只是换了一种家长能接住的说法。","家长不焦虑，才愿意配合咱们。\n","记住：反馈不是告状，是和家长站在一边。"],"durs":[3.048,4.344,9.192,4.92,15.744,8.304,7.344,3.216,4.512]},"P19":{"sents":["场景三，课后学情反馈。","家长说孩子最近学得不好，怎么接？\n","家长原话是：“老师，我感觉孩子最近学得不好，好像没什么进步，怎么办啊？”\n","左边是错误回复，辩解或者甩锅：“不会啊，宝贝上课挺认真的，可能是在家练习不够吧？”","这句话的潜台词是什么？","是你没辅导好。","家长听了肯定不舒服。\n","右边是高情商回复，共情加拆解加方案：“我特别理解您的担心！","其实宝贝在XX方面进步挺明显的，就是XX这块确实还要再巩固一下。","我们接下来这样，在家每天花5分钟练一下就行，我这边课上也会多带他练。”\n","家长说学得不好的时候，其实不是来问责的，是在焦虑，是来求助的。","这时候千万别辩解，更别把锅甩给家长。","先共情，再客观拆解现状，哪里进步了、哪里要巩固，最后给具体方案，这就是刚才四步公式的前三步。","家长会觉得你专业，而且跟自己站在一边。"],"durs":[3.024,3.624,6.984,8.232,2.616,1.992,2.664,6.216,6.984,7.056,6.528,4.152,9.768,4.128]},"P20":{"sents":["咱们再看一组聊天实录，把这个场景完整走一遍。\n","家长先开口：“老师，我感觉孩子最近学得不好，好像没什么进步，怎么办啊？”\n","老师第一条：“我特别理解您的担心！","很多家长这个阶段都会有这种感觉。”","先接住情绪。\n","第二条：“其实宝贝在XX方面进步挺明显的，就是XX这块确实还要再巩固一下。”","客观拆解现状，不全盘否定，也不只挑好听的说。\n","第三条：“我们接下来这样，在家每天花5分钟练一下就行，我这边课上也会多带他练。”","给出具体方案。\n","家长回：“好的好的，谢谢老师。”\n","关键路径就是：先共情接住情绪，再客观拆解现状，再给出具体方案，不辩解，不甩锅。","聊完了也别忘了第四步，过几天问一句练得怎么样。","大家还注意到没有，老师依然是分三条发的，家长读着不累，也像真人在慢慢说。"],"durs":[4.632,6.984,3.456,3.576,1.872,7.968,4.944,7.968,1.896,3.432,8.832,5.016,7.632]},"P21":{"sents":["除了知道该说什么，还得知道哪些话千万别说，说了就踩雷。\n","第一，绝对化否定孩子。","比如这孩子就是坐不住，注意力天生就差，不是学这块的料。","这种话一说，家长可能真就放弃了。","孩子还在成长，很多问题都是阶段性的。","可以改成：“这个阶段专注力还在发展中，我们多引导就会越来越好。”\n","第二，把责任全推给家长。","比如您在家得多盯着他啊，他在家练得不够，您怎么不检查作业。","家长把孩子交给咱们，是信任咱们，不是来挨训的。","可以改成：“我们一起来配合，在家这样练就行，课上我也多带他练。”\n","第三，敷衍式回复。","好的，收到，嗯嗯，行，没有下文，没有关心，没有温度。","哪怕只是回复一条请假消息，也要多问一句孩子怎么样了。\n","大家可以对照一下自己平时发的消息，这三类话有没有不小心说过。"],"durs":[5.64,2.856,5.784,3.552,4.128,6.384,3.024,5.832,4.8,6.504,2.52,5.952,5.28,6.24]},"P22":{"sents":["好啦，今天的课就到这里。","最后再收一句：先情绪，后事情；","先共情，后方案；","把人放在前面，课放在后面。","大家扫码填写一下培训调研问卷，说说你的真实感受吧！"],"durs":[2.808,3.696,2.328,3.096,5.256]},"P11":{"sents":["进入第二部分，先纠正一个常见误解：高情商沟通，不等于会说话、会拍马屁。\n","左边是错误理解：说话好听、会夸人；","八面玲珑、不得罪人；","模板话术，复制粘贴；","客户说什么都答应。","这些都不是高情商。\n","真正的高情商沟通是右边这样：先看见情绪，再处理事情；","既解决问题，又让人舒服；","有温度，但不失专业；","站在对方角度说话。\n","家长来找咱们的时候，背后基本都带着情绪，可能是焦虑，可能是担心，也可能是不满。","咱们的回复要先把这个情绪接住，再去解决具体问题。","而且高情商不是一味讨好，什么都答应反而不专业。","真正的高情商是既专业又有分寸，知道什么该说、什么不该说。","来看一道题，下列哪项属于“真正的高情商沟通”？"],"durs":[7.512,4.056,2.616,2.736,2.232,2.232,5.88,2.928,2.592,2.28,8.04,5.136,5.28,6.12,4.512]},"P18":{"sents":["再看挖需。","挖需的时候，你问孩子喜不喜欢，家长的回应常常让话题卡住。","这里分两种情况，接法不一样。\n","情况一：你问孩子喜不喜欢，家长说我还没问他。","尴尬的回复是：“哦，那您回头问问他。”","话题一下就断在这儿了。","高情商的接法是：“没事，宝贝今天课上玩那个游戏的时候特别开心，眼睛都亮了！","您晚上可以跟他聊聊，今天最有意思的是哪个环节。”","你主动给家长一个话题引子，话就接上了。\n","情况二：你问完，家长直接说孩子说不喜欢。","慌乱的回复是：“啊？","为什么呀？","是不是哪里没做好？”","这一下就把自己放到了弱势位置。","高情商的接法是：“哈哈宝贝很真实！","他是不喜欢哪个部分呀？","是有点难，还是觉得无聊？","我好调整一下。”\n","别慌，也别急着道歉。","孩子说不喜欢，可能是因为难，因为累，也可能只是那天心情不好。","咱们要做的是问清楚不喜欢什么，再表达愿意调整，这样既专业又开放。\n","大家发现没有，第一种接法里，起作用的正是孩子课上的具体表现。","来看一道题，你问家长“孩子喜不喜欢”，家长说“孩子说不喜欢”，高情商的接法是？"],"durs":[1.872,6.12,3.168,4.728,3.84,2.448,7.944,4.632,4.224,4.752,2.376,1.872,2.208,3.312,3.792,2.472,2.808,1.872,2.568,6.312,6.768,6.504,7.368]}},"v":{"slides/P01.jpg":"8b33f389","slides/P01.png":"da2c45bd","slides/P02.jpg":"68961b7d","slides/P02.png":"f2945b81","slides/P03.jpg":"71f1eb78","slides/P03.png":"4a6b8d2f","slides/P04.jpg":"eaa838cf","slides/P04.png":"b70a817f","slides/P05.jpg":"a22bf06f","slides/P05.png":"9082a4f5","slides/P06.jpg":"d8977827","slides/P06.png":"82d9ef22","slides/P07.jpg":"e1ec9b7a","slides/P07.png":"edb38e2c","slides/P08.jpg":"9c4ae3a3","slides/P08.png":"799972bf","slides/P09.jpg":"44c40c8b","slides/P09.png":"7c5108cd","slides/P10.jpg":"4dbf09b4","slides/P10.png":"3e8b47bc","slides/P11.jpg":"1f60ebb0","slides/P11.png":"0935426a","slides/P12.jpg":"85c08d1e","slides/P12.png":"7722bc1f","slides/P13.jpg":"1a94e22c","slides/P13.png":"40e55ea6","slides/P14.jpg":"936020bd","slides/P14.png":"afa86218","slides/P15.jpg":"87649f4c","slides/P15.png":"0a977082","slides/P16.jpg":"63464600","slides/P16.png":"194366f7","slides/P17.jpg":"d8fecb6f","slides/P17.png":"7c9074d3","slides/P18.jpg":"3fbf3405","slides/P18.png":"3f934141","slides/P19.jpg":"092970e6","slides/P19.png":"7dc22e4c","slides/P20.jpg":"1067d501","slides/P20.png":"c514b122","slides/P21.jpg":"45459ea5","slides/P21.png":"773b function post(url, body){

/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；

let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid}, ev, snapshot(online));
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

  if (navPause || atEnd || st.view !== 'learn') { navPause = false; return; }
  const s = stat(st.cur.s); s.pn += 1; pauseAt = Date.now(); pauseWhy = autoWhy || (document.hidden ? '切出页面自动暂停' : '主动暂停'); autoWhy = '';
  report({event:'暂停', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:pauseWhy});
});
au.addEventListener('play', () => { playing = true; updPlayBtn(); const v=$('#veil'); if(v) v.hidden = true; endPause(true); });
au.addEventListener('waiting', () => { if (!au.paused && au.currentTime > 0.5 && stallAt == null) stallAt = Date.now(); });  // 每页开头的首次加载不算卡顿
au.addEventListener('playing', endStall);
function fmt(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function play(){ au.playbackRate = rate; au.play().catch(() => { const v=$('#veil'); if(v) v.hidden=false; }); }
function updPlayBtn(){ const b = $('#pp'); if (b) b.textContent = playing ? '暂停' : '播放'; }

/* 切走自动暂停——防挂机。两种情况都算：
   1) 页面被隐藏（最小化、切标签页、被完全挡住）；
   2) 浏览器窗口失去焦点（点到了 WPS、微信等其他窗口，哪怕只挡住一部分） */
let autoWhy = '';
function autoPause(why){
  if (!playing) return;
  autoWhy = why; au.pause();
  const v = $('#veil'); if (v) { v.hidden = false; $('#veilBtn').textContent = '检测到你切到了其他窗口，已暂停 · 点我继续'; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause('切出页面自动暂停'); });
window.addEventListener('blur', () => { autoPause('切到其他窗口自动暂停'); });
/* 兜底：个别环境 blur 不触发时，每秒检查一次窗口焦点 */
setInterval(() => { if (playing && !document.hasFocus()) autoPause('切到其他窗口自动暂停'); }, 1000);

/* ---------- 视图 ---------- */
function curStage(){ return STAGES[st.cur.s]; }
function curPage(){ return curStage().pages[st.cur.p]; }
function stageStatus(i){
  if (st.passed[i]) return 'pass';
  if (i <= st.unlocked) return 'open';
  return 'lock';
}
function mapHTML(active){
  const nodes = STAGES.map((s,i) => {
    const ss = stageStatus(i);
    const sub = ss==='pass' ? ('已过关'+(st.best[i]!=null?' · '+st.best[i]+'/'+s.quiz.length:'')) : ss==='open' ? (s.quiz.length?'学完测 '+s.quiz.length+' 题':'学完解锁综合测试') : '未解锁';
    return `<button class="node ${ss} ${active===i?'cur':''}" data-go="${i}" ${ss==='lock'?'disabled':''}>
      <span class="k">阶段 ${s.num}</span><span class="t">${esc(TITLES[s.num]||("阶段 "+s.num))}</span><span class="s">${sub}</span></button>`;
  });
  const fOpen = STAGES.every((s,i)=>st.passed[i]);
  const fs = st.final && st.final.pass ? '已通过 · '+st.final.score+'/'+FINAL.length : fOpen ? FINAL.length+' 题 · 待作答' : '全部阶段过关后解锁';
  nodes.push(`<button class="node ${st.final&&st.final.pass?'pass':fOpen?'open':'lock'} ${active==='final'?'cur':''}" data-final ${fOpen?'':'disabled'}>
    <span class="k">结业</span><span class="t">本章综合测试</span><span class="s">${fs}</span></button>`);

}
function loopHTML(on){
  const w = ['学一段','练一题','测一轮','过一关','进一步'];
  return `<div class="loop" aria-label="学习闭环">${w.map((x,i)=>`<span class="${i===on?'on':''}">${x}</span>`).join('<i>→</i>')}</div>`;
}
function headerHTML(){
  return `<header><div class="brand"><h1>${esc(CFG.title)}</h1><span class="tag">${esc(CFG.tag)}</span></div>
    <div class="who">${st.name?('学员：'+esc(st.name)+(st.team?'（'+esc(st.team)+'）':'')+' · '):''}<button class="btn ghost" style="padding:4px 10px;font-size:13px" data-home>课程首页</button></div></header>`;
}
function bindCommon(){
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => startStage(+b.dataset.go));
  const f = document.querySelector('[data-final]'); if (f) f.onclick = () => showQuiz('final');
  const h = document.querySelector('[data-home]'); if (h) h.onclick = () => { navStop(); st.view='home'; save(); report({event:'回到首页'}); render(); };
}

function render(){
  if (st.view === 'learn') return renderLearn();
  if (st.view === 'quiz') return renderQuiz();

}

      ${started ? `<div class="row" style="justify-content:flex-start">

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

  bindCommon();

  [1].forEach(k=>preload(s.pages[st.cur.p+k])); if(st.cur.p+1>=s.pages.length) preload((STAGES[st.cur.s+1]||{pages:[]}).pages[0]);

function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});
  showQuiz('final');
}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
