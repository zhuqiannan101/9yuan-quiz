/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}

h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}

.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */

  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}

.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}

.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}

<script>
const DATA = {"pages":[{"row":3,"stage":"为什么学少儿编程·阶段1","p":"P01","topic":"开篇导入","script":"好，我们正式开启本次课程。本次课程主题：为什么要学少儿编程。 咱们都是新入职的老师，这节课的定位，是帮大家打好编程认知的地基。 它不是让大家直接去网上复制通用话术，拿生硬的术语或者大白话直接讲给家长。我们要学会结合咱们的课程体系，把底层逻辑吃透，转化成家长听得懂的表达。\n这里跟大家明确一个核心：家长很多时候，是看重编程带来的附加价值才会产生兴趣 —— 比如能不能改善孩子的学习习惯、锻炼逻辑思维、和校内语文数学形成联动。我们吃透这些底层认知，最终目的，是拥有独立回应、解决家长各类异议的能力。 不管家长抛出什么疑问，你都能讲明白编程到底是怎么帮到孩子的。\n只有把「为什么学少儿编程」的底层逻辑吃透，我们才能从容应对家长的各种提问，而不是只会套固定句子。\n今天课程分成两大板块： 第一板块：编程的基础认知 第二板块：为什么要学习少儿编程","interact":null,"sku":"","dept":""},{"row":4,"stage":"为什么学少儿编程·阶段1","p":"P02","topic":"课程模块介绍","script":"我们来看本节课的目录。 本节课一共两大板块： 第一板块，编程的基础认知； 第二板块，为什么去学少儿编程，从内部因素和外部因素两个方向去讲。来看一道题，第二部分「为什么要学编程」，分为哪两类因素？","interact":{"q":"【单选】第二部分「为什么要学编程」，分为哪两类因素？","at":"P02","options":["外部因素和内部因素","政策因素和市场因素","家长因素和孩子因素","短期因素和兴趣因素"],"answer":0,"answers":[0],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"","dept":""},{"row":5,"stage":"为什么学少儿编程·阶段1","p":"P03","topic":"编程基础认知","script":"好，我们进入第一个板块，编程基础认知，先回答一个最基本的问题：什么是编程。","interact":null,"sku":"","dept":""},{"row":6,"stage":"为什么学少儿编程·阶段1","p":"P04","topic":"大家印象里的编程","script":"说到编程，大家脑子里会冒出什么画面？是穿格子衬衫、在格子间里埋头敲代码的程序员？是屏幕上密密麻麻的代码，还是右边这一大堆编程语言的名字？再看下面这张图，不同工作年限、不同学历的程序员，跳槽前的平均年薪都不低，工作六到十年的硕士，平均能到四十四点九万。所以很多人对编程的第一印象就是技术宅、高收入。这些印象没有错，但大家要注意，跟家长沟通的时候，千万别把学编程的价值落在将来当程序员、赚高薪上。家长最常见的反应就是：我家孩子又不当程序员。那编程和孩子到底有什么关系？我们接着往下看。","interact":null,"sku":"","dept":""},{"row":7,"stage":"为什么学少儿编程·阶段1","p":"P05","topic":"生活里随处可见的编程","script":"其实编程离我们一点都不远。图上这些图标，抖音、微信、淘宝、美团、支付宝、滴滴出行、铁路12306，都是我们每天在用的应用，它们全都是用编程做出来的。再比如咱们上班门口的打卡系统，背后也是一段程序。所以说，程序在我们的生活里无处不在。这一点在沟通里很好用：家长说孩子又不当程序员，学编程离我们太远，你就可以拿支付宝、滴滴打车、公司打卡这些例子告诉家长，程序就在生活里，孩子学编程，是在理解身边这个越来越数字化的世界。","interact":null,"sku":"","dept":""},{"row":8,"stage":"为什么学少儿编程·阶段1","p":"P06","topic":"编程语言的定义","script":"那到底什么是编程？大家看屏幕上这句定义：编程，就是我们为了完成某项任务，把解决问题的步骤，用计算机能够理解的语言写成指令。计算机会按照这些指令一步一步执行，最后完成任务。拆开来看，分工很清楚：我们负责思考解决问题的步骤，再用计算机能理解的语言把这些步骤描述出来；计算机负责执行。整个过程就是图上的思路，先思考，再整理思路，最后用计算机语言表达出来。所以编程语言和我们平时说的中文、英语一样，都是用来沟通的语言，只不过沟通的对象换成了计算机。而程序，就是用计算机能理解的语言写下的一连串命令。来看一道题，编程的本质是什么？","interact":{"q":"【单选】编程的本质是什么？","at":"P06","options":["把解决问题的步骤，用计算机能理解的语言写成指令","用电脑打字、做表格","只有专业人员才能学的技能","记住大量英文单词"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":9,"stage":"为什么学少儿编程·阶段1","p":"P07","topic":"三大少儿编程语言介绍","script":"少儿编程语言，主要有三大类。第一类是图形化编程，也就是Scratch，入门简单，重点培养孩子的编程思维。第二类是Python，属于代码入门，需要一定的英语基础，应用范围比较广。第三类是C++，可以用来参加信息学竞赛，难度较高，功能也很强大。","interact":null,"sku":"","dept":""},{"row":10,"stage":"为什么学少儿编程·阶段1","p":"P08","topic":"编程语言对比","script":"那不同年龄的孩子适合学什么？大家看这张表，我们按难度从低到高过一遍。Scratch不需要编程基础，不用记英文单词，也不需要大量的键盘操作和语句记忆，入门容易，适合五岁到小学二年级及以下的孩子。Python需要一定的英文基础和基本的编程逻辑理解，难度中等，适合小学三到六年级。趣味C++的基础要求和Python一样，难度中上，同样适合小学三到六年级。它用的是和C++相同的标准代码语言，有利于孩子以后参加竞赛。很多家长更认可C++，但低龄孩子直接学C++难度太大，容易产生畏难情绪，趣味C++正好解决了这个问题。最后是C++，要求较高的英文水平和扎实的编程基础，还要学数据结构和算法，难度较高，适合七年级及以上的孩子。续费沟通时，家长偶尔会问后面要不要换一种语言，大家就对照这张表，看孩子的年级和基础来匹配，不要凭感觉推荐。来看一道题，使用年级为3—6年级的编程语言是？","interact":{"q":"【多选】使用年级为3—6年级的编程语言是？","at":"P08","options":["Scratch","Python","趣味C++","C++"],"answer":1,"answers":[1,2],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"","dept":""},{"row":11,"stage":"为什么学少儿编程·阶段2","p":"P09","topic":"为什么学编程","script":"在前面我们讲了什么是编程，也了解了不同年龄对应的编程语言。接下来，进入我们第二个板块：为什么要学编程。\n这也是家长问得最多的问题：“老师，学编程到底有什么好处？” 同时，也是我们跟家长沟通、传递编程价值、强调它重要性最核心的部分。所以这块大家一定要认真听，吃透逻辑，后面跟家长沟通才能说得清楚、讲的更有画面感。","interact":null,"sku":"","dept":""},{"row":12,"stage":"为什么学少儿编程·阶段2","p":"P10","topic":"内外因素","script":"那我们在跟家长讲为什么学编程的时候，可以分成两大维度去梳理，逻辑会特别清晰，也好记、也好讲。 一类是外部因素，一类是内部因素。\n外部因素，简单来说，就是大环境、政策、升学、赛道机会这些客观存在的红利和路径； 内部因素，就是落在孩子自己身上的，思维、习惯、能力这些底层素养的提升。","interact":null,"sku":"","dept":""},{"row":13,"stage":"为什么学少儿编程·阶段2","p":"P11","topic":"外部因素","script":"我们先来看一下外部因素。外部因素，核心就是国家层面的导向、针对少儿科技教育、编程教育出台的一系列政策文件。我们跟家长讲这部分，核心要传递一个信息：编程已经不是一个课外兴趣、可有可无的爱好，而是国家在大力推进的信息科技素养，是未来孩子需要具备的基础能力。","interact":null,"sku":"","dept":""},{"row":14,"stage":"为什么学少儿编程·阶段2","p":"P12","topic":"时代趋势","script":"我们先来看第一个，我们如何去说明编程已经纳入到我们的生活当中了？其实我们可以举一些信息科技时代的一些场景，比如说像我们的无人加油站、无人超市、无人驾驶等等。那其实现在的这些基础的服务岗位的需求在下降，因为 AI、机器人进行了一部分的替代，这个也是大的趋势。那包括像 2025 年的时候也是第一年机器人走到春晚的舞台上面。那我们都知道春晚的话每一个节目每一个内容都是精心安排的，那其实这个也是一个非常大的一个信号。所以从这些案例我们已经能看到，无论是我们的数字化还是我们的智能化，其实都已经来到了我们的身边。那也就意味着现在教育的整个的方向，国家的发展是希望教育培养的人才和国家发展相匹配，所以你看国家的教育方向也在大力推进的信息科技素养。","interact":null,"sku":"","dept":""},{"row":15,"stage":"为什么学少儿编程·阶段2","p":"P13","topic":"国际趋势","script":"时代的趋势我们刚刚看完了，现在我们再来看看国际趋势。全球一共有 24 个国家，已经把编程纳入到基础教育体系当中。像日本早在 2012 年，就已经把编程纳入小学教育，还有很多国家也都在同步推进这件事。不难看出，编程教育早就已经是全球的大趋势。 咱们中国，是在 2017 年出台了第一批少儿编程相关政策，所以不管是时代趋势，还是国际趋势，都再次印证了，少儿编程这个方向的发展潜力和重要性。","interact":null,"sku":"","dept":""},{"row":16,"stage":"为什么学少儿编程·阶段2","p":"P14","topic":"市场发展","script":"再从市场来看。2024年少儿编程市场规模大约488亿人民币，未来有望发展成千亿市场。整个行业会经历三个阶段。现阶段是素质教育，市场规模不到500亿，编程主要作为课外培养孩子思维和兴趣的方式，相对小众。未来5到10年，会走向素质学科化，越来越多家长认可编程教育，部分地区试点推广，进入教学体系，市场达到千亿级别。再往后10到20年，会升级到学科教育，人人参与学习，全面纳入学科体系，形成千亿以上的市场规模。跟家长沟通时，这条趋势线可以帮家长理解：现在坚持学，是走在前面，而不是跟风。","interact":null,"sku":"","dept":""},{"row":17,"stage":"为什么学少儿编程·阶段2","p":"P15","topic":"人才需求","script":"国家的发展方向、教育调整方向，核心都是匹配当下的人才需求。这也是少儿编程需求持续上涨的底层原因，我们可以顺着社会发展的阶段来看。 70 年代，国家重点需要基础劳动力，核心看重体力、吃苦能力和实操手艺，所以技校、专项手艺是当时主流的培养方向。 到了80、90年代，“知识就是力量” 成为共识，学历成为竞争的核心门槛，本科及以上高学历，是进入优质企业的重要加分项。 发展到今天，本科已经是非常普遍的基础门槛，大家开始内卷更高学历。但我们也能看到一个现状：单纯的学历，已经不足以匹配国家的人才标准。不少高学历的人才，缺少创新能力和硬核专项技能。 我们现在的大目标是科教强国、科技强国，需要大量创新型科技人才。人才需求发生转变，教育政策就会同步调整，最终目标，就是培养出适配时代的专项科技后备人才","interact":null,"sku":"","dept":""},{"row":18,"stage":"为什么学少儿编程·阶段2","p":"P16","topic":"政策视频","script":"下面我们一起看一段视频。大家边看边留意，视频里提到国家在哪些时间节点，发布了哪些和编程教育相关的政策。","interact":null,"sku":"","dept":""},{"row":19,"stage":"为什么学少儿编程·阶段2","p":"P16-2","topic":"政策视频","script":"视频里的政策比较多，大家不需要逐条背下来，有个大概印象就可以。最需要记住的是两个时间点：2017年，国内编程教育开始落地；2022年，新课标改革，信息科技成为独立的课程科目。下一页我们用一张时间轴，把这条线串起来。","interact":null,"sku":"","dept":"","video":"video/P16-2.mp4"},{"row":20,"stage":"为什么学少儿编程·阶段2","p":"P17","topic":"国内政策","script":"从这张时间轴可以看到，国内编程教育从2017年开始落地。那一年国务院发布了新一代人工智能发展规划，提出在中小学设置人工智能相关课程，逐步推广编程教育。核桃也正是在2017年成立的。之后教育部的相关政策不断调整完善：2018年，新课标提出信息技术从兴趣课程变为必修课程；2019年，北京、广州、深圳、武汉、西安5个城市作为第一批试点，3到8年级学生全面试点学习人工智能与编程课程。到了2022年，教育部发布义务教育课程方案和课程标准2022年版，信息科技成为全国统一开设的独立课程科目，在3到8年级开设。也就是说，编程已经从课外兴趣，变成了正式纳入考核的重要学科。","interact":null,"sku":"","dept":""},{"row":21,"stage":"为什么学少儿编程·阶段2","p":"P18","topic":"解读新课标","script":"刚才多次提到新课标，不少伙伴对这个概念可能还有点模糊。新课标就是新的课程标准，是国家课程的基本纲领性文件。国家会根据当下发展需要的人才类型，来调整课程标准。它不会年年改，大约十年修改一次，最近一次就是在2022年。这次修改最关键的一点，是把信息科技列为一门独立的课程，这意味着信息科技现在和家长、学生重视的语数外学科同等重要。来看一道题，「新课标」多久改革一次？来看一道题，新课标大约多久修改一次？最近一次修改在哪一年？","interact":{"q":"新课标大约多久修改一次？最近一次修改在哪一年？","at":"P18","options":["约5年一次，2019年","约10年一次，2022年","约10年一次，2017年","约5年一次，2022年"],"answer":1,"answers":[1],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"","dept":""},{"row":22,"stage":"为什么学少儿编程·阶段2","p":"P19","topic":"信息科技课","script":"再看右边这张表，它把2001版、2017修订版和2022版的义务教育课程方案放在一起对比。大家回忆一下自己上学时的信息技术课是什么样？很多人还记得进机房要套鞋套，课上大多就是学学开机关机这类简单操作，一节课就过去了。那时候信息技术并没有单独列出来，只是放在综合实践活动里。再看2022版，红圈里的信息科技，单独成为3到8年级的一门课程。现在义务教育阶段的信息课，有明确的必修内容，比如正式学习算法、编写程序代码，这些都是新课标要求孩子必须掌握的。所以如果家长还以为学校的信息课只教开关机，大家就可以拿这张表告诉家长，现在早就不一样了。左边这份教育部关于强基计划的文件，我们后面讲升学时再细说。","interact":null,"sku":"","dept":""},{"row":23,"stage":"为什么学少儿编程·阶段2","p":"P20","topic":"学科新定位","script":"既然我们已经经历了十年一次的新课标大改革，信息科技也成了一门独立学科，那国家到底有多重视？再给大家普及一个知识点。在十四届全国人大三次会议的部长通道上，教育部部长怀进鹏提到，DeepSeek和机器人是教育的重大机遇，将加强计算机等学科建设，推动人工智能等学科设计。大家想一想，部长在这样的场合专门提到这个方向，能不能说明它的重要性？国家层面都这么重视，作为老师和家长，我们要不要重视起来？这也是和续费家长沟通时一个很实在的理由：孩子现在坚持学的，正是国家大力推动的方向。","interact":null,"sku":"","dept":""},{"row":24,"stage":"为什么学少儿编程·阶段2","p":"P21","topic":"升学新趋势","script":"接下来看升学的新趋势。左边这张地图，展示的是2025年哪些省份把信息科技纳入了中考：深红色的省份，信息科技是中考考试科目，直接计入中考总分；浅红色的省份，是中考考核科目，计入学生档案。右边是教育部的文件，全国一共有184所中小学入选人工智能教育基地名单，这些基地都以中小学信息科技、通用技术等课程为主要依托，去探索人工智能教育的新理念。看完这些，大家就能感受到，信息科技在升学里的分量正在持续提升。","interact":null,"sku":"","dept":""},{"row":25,"stage":"为什么学少儿编程·阶段2","p":"P22","topic":"科技特长生","script":"大家都熟悉特长生赛道，特长生主要分为三大类：艺术、体育、科技。 我们先看政策变化，2024 年开始，艺术特长生的招生通道在收紧。以前很多家长等到孩子初高中成绩不理想，才临时突击学艺术，想用这个方式助力升学。这类情况越来越多，艺术类人才供给也逐渐饱和，所以现在政策提高了门槛，更看重长期深耕、科班积累的孩子，短期突击很难再走通。 体育赛道同样有它的特点，属于金字塔型竞争，非常依赖先天天赋，能走到最后的孩子占比很小。 而科技特长生，是现在国家重点扶持的新赛道。这张图上也能看到，目前科技特长生全国覆盖率已经达到 88%，覆盖 22 个省份、4 个直辖市、4 个自治区。 它的优势在于，这条赛道可以贯穿小升初、初升高、高考，甚至未来留学、就业，是一条能够长期发展的特长路线，对比艺术、体育赛道，选择空间会更广。","interact":null,"sku":"","dept":""},{"row":26,"stage":"为什么学少儿编程·阶段2","p":"P23","topic":"强基计划","script":"还有一个大家必须知道的政策，就是强基计划。2020年，国家取消了自主招生，新增了强基计划。一句话总结它的优势：它不只看高考分，还要看校测成绩，高考分数稍低的孩子也有机会考取名校，相当于存在降分录取的机制。左边是39所强基计划试点高校名单，全部都是九八五高校。右边的对比表里还有几点要注意：强基计划是本省竞争，名额没有限制，录取按百分之八十五的高考成绩加百分之十五的校测成绩评价，招生专业集中在基础学科、计算机类和新工科类。如果家长还是很难理解，我们可以这样讲：学编程，能帮孩子多一条进入重点院校的路，分数不够的时候，特长来补齐。来看一道题，对比表中，强基计划的评价方式是？","interact":{"q":"对比表中，强基计划的评价方式是？","at":"P23","options":["降分录取","85%高考+15%校测","15%高考+85%校测","严控（5%）"],"answer":1,"answers":[1],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"","dept":""},{"row":27,"stage":"为什么学少儿编程·阶段2","p":"P24","topic":"清北升学通道","script":"再看一组数据。这是2025年清华北大本科新生的统计，通过强基计划录取的人数，在清华内地招生中占比24.32%，在北大本部占比29.51%。强基计划从2020年开始，一直稳坐清北第二大升学通道，也就是说，除了高考统招，它是进入清北最重要的通道。大家想一想，普通学生想进清华北大，最常见的方式是高考统招。而在高考录取批次里，强基计划在7月5号就完成录取，是最早的一批，早于国家专项计划、国防生等录取批次，足以看出国家对强基计划的重视。所以说，强基计划是普通学生冲刺985院校又一条重要的通道。","interact":null,"sku":"","dept":""},{"row":28,"stage":"为什么学少儿编程·阶段2","p":"P25","topic":"小升初择校","script":"在和家长沟通升学规划时，我们要分清不同升学节点：小升初、初升高、高考。但大家要结合我们学员的年龄来看，图形化算法学员以 5 岁–2 年级为主，中考、高考距离孩子周期很长，离他们最近的关键节点是小升初。\n因此，我们和家长沟通，切忌一次性把全阶段升学路径全部抛出，而是聚焦当下，向家长说明：在现阶段的升学环境里，编程能够为孩子带来的实际价值。\n很多家长都会提出疑问：小升初没有科技特长相关政策。这里我们要给家长做好专业解读：并非国家不重视科技素养的发展，而是小升初属于九年义务教育范畴，义务教育实行免试就近入学，政策层面不允许选拔性筛选；中考、高考才属于选拔性考试。现阶段义务教育主流入学方式为对口、摇号。\n同时我们也要客观传递一个核心逻辑：部分学校在收集学生综合素质材料时，会参考孩子的综合履历。同等条件下，拥有正规科创赛事奖项的孩子，综合素质展示会优于无奖项的孩子，奖项含金量越高，履历的差异化优势越明显。\n当下很多孩子的兴趣集中在艺术、体育等方向，而编程能力需要长期系统学习，很难靠短期突击速成。在众多兴趣赛道里，科技特长是稀缺的硬核能力，能够帮助孩子建立区别于其他同龄人的差异化竞争力。","interact":null,"sku":"","dept":""},{"row":29,"stage":"为什么学少儿编程·阶段2","p":"P26","topic":"五大奥赛","script":"讲完政策层面的外部趋势之后，我们还要帮家长厘清一个认知：编程是一门学科能力，而不是一个可有可无的兴趣班。\n\n我们可以用高校高度认可的奥赛体系来举例。大家熟悉的五大学科奥赛，分别是数学、物理、化学、生物、信息学。其中信息学奥赛，也就是我们常说的信奥赛，核心考察内容就是编程。\n\n从高校的招生简章里也能看到，数学、物理、化学、生物、信息学这几类学科竞赛，是放在同一序列里被认可的。这里面的信息学，对应的正是少儿编程所学的编程内容。\n\n这也说明，编程并不是课外消遣类的兴趣班，而是和数学、物理一样，属于被教育体系和高校认可的学科方向。我们可以通过这个角度，向家长再次强调编程学习的重要性和长期价值。\n\n刚刚我们从时代环境、国际趋势、人才需求变迁、特长生赛道，再到信息学的学科定位，完整梳理了外部层面的逻辑。 所有这些外部信号，共同印证：编程教育不是一时兴起的课外热点，而是顺应科教强国战略、全球同步推进的基础教育方向。 外部大势我们已经梳理清楚，接下来，我们把视角从大环境收回到孩子身上，一起来看学习编程，会给孩子带来哪些底层能力的提升，也就是我们接下来要讲的内部因素。来看一道题，北理工强基简章中，第二类考生须在全国中学生学科奥林匹克竞赛全国决赛中获得什么奖项？","interact":{"q":"北理工强基简章中，第二类考生须在全国中学生学科奥林匹克竞赛全国决赛中获得什么奖项？","at":"P26","options":["全国二等奖及以上","全国三等奖及以上","全国一等奖","市级三等奖以上"],"answer":0,"answers":[0],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"","dept":""},{"row":30,"stage":"为什么学少儿编程·阶段3","p":"P27","topic":"编程短期收益","script":"刚才我们重点讲解了学习编程的外部因素，也就是各项政策与时代趋势。这些属于长期发展优势，能够为孩子后续的中考、高考乃至长远职业发展提供支撑。\n讲到这里，我们可以思考一个问题：如果孩子现在读小学二年级，家长只听到 “编程对中高考有帮助”，会不会立刻产生报名意愿？\n多数情况下，家长并不会马上行动。大家的顾虑，也正是家长真实的心态：政策虽然利好，但这份收益距离当下太远。我们的学员大多集中在 5 到3年级，以小学生为主。孩子目前年纪尚小，几年之后的升学环境存在不确定性，孩子能不能坚持学到那个阶段，也是未知数。\n\n这也提醒我们：只讲政策、唤醒重视还不够，更要聚焦当下，和家长聊清楚眼前的收获 —— 孩子现在学习编程，立刻能获得哪些能力上的提升。这才是家长当下最关心的内容。\n本节课我们就来讲解学习编程的短期好处，也就是内部因素。内部能力提升与外部政策趋势相辅相成：外部大势指明方向，内部成长支撑孩子走得更远。\n家长大多已经听过三个关键词：培养习惯、锻炼思维、提升学科。我们的工作不只是简单告知家长有这些益处，更要讲清楚背后的逻辑：编程究竟如何培养学习习惯，又怎样具体助力数学、英语等学科的提升。\n我们要用真实、具体的案例，把价值讲透，让家长真正认可：孩子为什么要学编程，以及为什么现在就要开始学习。","interact":null,"sku":"","dept":""},{"row":31,"stage":"为什么学少儿编程·阶段3","p":"P28","topic":"三大学习陋习","script":"先看学习习惯。图上这棵树挂满了影响学习的问题：专注力差、粗心、拖延、叛逆、反应迟钝、没耐心、畏难情绪、沉迷游戏。今天我们挑最有代表性的三个，讲清楚编程是怎么解决的，分别对应提高专注力、改善粗心马虎和增强自制力。第一个是专注力差。表现是上课、写作业时东张西望，玩一会儿笔写一个字。为什么孩子学习时坐不住，看动画片却能一动不动？主要是兴趣问题，动画片声光效果丰富、剧情抓人，写作业相对枯燥，孩子自然难以投入。第二个是粗心马虎。这个场景大家都不陌生：题目上的数字8，抄下来变成了0；简单的英语单词总是拼错。这些问题往往不是孩子不会，而是出在粗心上。粗心的根源其实很简单，就是孩子从小没有建立起检查的习惯。考试时总有一些聪明的孩子，一小时的卷子三十分钟就做完了，剩下的时间在摆弄笔袋、给橡皮戳洞，就是不去检查，走过去一看，口算题还有空着的，应用题也没写答。更关键的是，现在很多家庭里，检查作业的任务落在了家长身上，孩子就更缺乏主动检查的意识。第三个是自制力。很多家长反映，孩子一拿起手机、一打开电脑，就沉浸在游戏里抢不回来，不让玩就偷偷玩，亲子关系也变得紧张。这个问题编程是怎么解决的，我们稍后结合视频来看。来看一道题，孩子「粗心马虎」的根源是什么？","interact":{"q":"【单选】孩子「粗心马虎」的根源是什么？","at":"P28","options":["孩子从小没有建立起「检查」的习惯","孩子智商不够","题目太难","老师讲得不好"],"answer":0,"answers":[0],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"","dept":""},{"row":32,"stage":"为什么学少儿编程·阶段3","p":"P29","topic":"提升专注力","script":"先说专注力。我们通过一段视频，看看核桃编程的课是什么样的。大家边看边想：这样的课，孩子为什么坐得住。","interact":null,"sku":"","dept":""},{"row":33,"stage":"为什么学少儿编程·阶段3","p":"P29-2","topic":"提升专注力","script":"第一，用兴趣吸引注意力。视频里大家能感受到，我们的课程是任务制的，每个知识点都穿插在动画剧情里。大家想想，小学阶段的孩子，是更喜欢看动画，还是看纯文字、听老师干讲？而且我们把长时间的学习拆成一个个短小的任务，孩子像闯关一样往前走，自然不容易走神。第二，用拆解降低难度。编程会让孩子一口气写完所有代码吗？不会。就像那个经典问题，怎么把大象放进冰箱？要拆成打开门、放进去、关上门三步。我们的课程也是这样，引导孩子把大难题拆成小关卡，循序渐进，孩子就不容易因为畏难而放弃。第三，用及时反馈激励坚持。每通过一个关卡，系统都会给出即时的正向反馈和鼓励。这种我做到了的成就感，会激励孩子主动挑战下一关，在不知不觉中延长专注学习的时间。跟续费家长沟通时，可以请家长回想一下，孩子这六个月上课时能不能一直跟下来，这就是最有说服力的例子。来看一道题，核桃编程用什么方式吸引孩子的注意力？","interact":{"q":"【单选】核桃编程用什么方式吸引孩子的注意力？","at":"P29","options":["课程任务制，每个知识点穿插在动画剧情中","延长单节课的时长","反复抄写代码","用考试排名施压"],"answer":0,"answers":[0],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"","dept":"","video":"video/P29-2.mp4"},{"row":34,"stage":"为什么学少儿编程·阶段3","p":"P30","topic":"游戏沉迷疏导","script":"再来看自制力，也就是沉迷游戏的问题。核桃编程的思路是四个字：堵不如疏。我们不是一味禁止孩子玩游戏，而是通过编程，引导孩子从游戏的消费者，转变成游戏的创造者，成为整个课堂的主人。当孩子开始学怎么设计关卡、布置场景、设置人物和触发条件，视角就完全变了。孩子会去想：怎么让游戏更好玩？怎么让玩家跟着我的设计走？这种我来制定规则的掌控感和创造力，是比打通关更高级、更持久的成就感。这样一来，孩子对游戏的理解提升了，兴趣也从玩转到了造，既能缓解沉迷的问题，又把孩子的热情引导到了学习和创造上。我们一起来看一段视频，了解一下核桃编程的实操课程模式。","interact":null,"sku":"","dept":""},{"row":35,"stage":"为什么学少儿编程·阶段3","p":"P30-2","topic":"游戏沉迷疏导","script":"看完视频大家就明白了，核桃的实操课，就是让孩子从游戏的参与者，变成游戏的制作者。家长担心孩子沉迷游戏的时候，不要跟家长说别让孩子碰游戏，而是告诉家长，我们是把孩子对游戏的兴趣，转成做游戏的动力。来看一道题，核桃编程的哪种课程模式？","interact":{"q":"核桃编程的哪种课程模式？","at":"P30","options":["实操课程模式","科技特长生实验班","知识点对标新课标","课程大纲涉及数学学科知识点"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":"","video":"video/P30-2.mp4"},{"row":36,"stage":"为什么学少儿编程·阶段3","p":"P31","topic":"读懂编程思维","script":"接下来讲编程思维。编程能锻炼思维，几乎是所有家长最看重的价值之一。但思维这个词听起来很高级，也特别抽象。听到逻辑思维，你脑子里能马上浮现出它具体的样子吗？大多数人都觉得有点模糊。没关系，我们先看这张表，编程思维可以拆成四个部分。第一是分解，把复杂问题拆成一系列小问题，每个小问题都能单独解决，用在学习上，专治丢三落四，提高审题能力。第二是模式识别，把新问题通过简单的转化，变成已知的老问题，降低解题难度，对应常见题型和公式应用。第三是抽象，忽略问题的细节，专注于问题的核心和关键点，对应举一反三、归纳总结。第四是算法，设计解决问题的步骤，然后执行这些步骤，对应一题多解和简便算法。后面我会用一道数学题，带大家看这四步在做题时是怎么发生的，在编程里又是怎么实现的。","interact":null,"sku":"","dept":""},{"row":37,"stage":"为什么学少儿编程·阶段3","p":"P32","topic":"沟通话术库","script":"这张表是咱们跟家长沟通的话术库。家长听不懂专业名词，我们就用大白话翻译给家长听，这本身就是专业。分解能力，就是把一道大数学题分成几步做，一步一步解决，不慌不乱。模式识别，就是做了10道题，发现这类题都有规律，以后一眼就能看出来。抽象能力，就是把复杂的东西简化成一个公式或步骤，以后直接用。算法思维，就是找到解决问题最快的方法，而不是蛮干狂刷题。大家一定要把这四句白话记熟，跟家长聊的时候直接用。","interact":null,"sku":"","dept":""},{"row":38,"stage":"为什么学少儿编程·阶段3","p":"P33","topic":"例题拆解思维","script":"我们来看这道数学应用题：一个长方形的游泳池，长60米，宽30米，池底铺面积为9平方米的方砖，需要多少块？第一步是分解，也就是化繁为简。需要多少块这个问题，可以拆成两个小问题：泳池面积是多少？瓷砖面积是多少？先算出泳池的总面积，再用总面积除以单块方砖的面积，就能得到一共需要多少块。大家看右下角，对应到编程里，就是先设置变量，把长和宽定义好，后面再一步步写计算逻辑。","interact":null,"sku":"","dept":""},{"row":39,"stage":"为什么学少儿编程·阶段3","p":"P34","topic":"识别数学规律","script":"第二步是模式识别，也就是规律整合。求长方形面积有固定的公式：长乘以宽。对应到编程里，就是用一块积木让面积等于长乘宽，代入长和宽，直接算出泳池面积。这就是模式识别的思维：找到同类问题通用的规律和公式，下次遇到类似的题，直接套用就行。不管是做数学题还是写代码，找到固定规律，就不用每次从头想，效率会大大提升。","interact":null,"sku":"","dept":""},{"row":40,"stage":"为什么学少儿编程·阶段3","p":"P35","topic":"抽象聚焦关键","script":"第三步是抽象，也就是聚焦关键信息。拿到题目，先把信息拆出来，哪些是已知，哪些是未知。方砖面积是已知条件，9平方米；泳池面积是要求的未知量。把无关的信息过滤掉，只抓住核心要素，代入长乘宽的公式计算。放到编程里，就是用变量算出泳池面积，再把结果显示出来。这种抽象思维，就是教孩子读题时快速抓住有用信息，排除干扰，找准解题核心，做数学题和写程序都离不开它。来看一道题，从泳池题里找出“瓷砖面积已知9平方米、泳池面积未知”，对应编程思维的哪一步？","interact":{"q":"从泳池题里找出“瓷砖面积已知9平方米、泳池面积未知”，对应编程思维的哪一步？","at":"P35","options":["分解-化繁为简","模式识别-规律整合","抽象-聚焦关键","算法-逻辑整合"],"answer":2,"answers":[2],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"","dept":""},{"row":41,"stage":"为什么学少儿编程·阶段3","p":"P36","topic":"算法逻辑整合","script":"最后一步是算法，也就是逻辑整合，把完整的解题步骤梳理出来。具体计算时，先算出泳池面积，60乘30等于1800平方米，方砖面积已知是9平方米。接着用泳池总面积除以单块方砖面积，1800除以9，等于200块。最后写出答案：需要200块。右边的程序，就是把算泳池面积这一步按顺序写进去，点击绿旗，程序就一步一步执行。算法，就是一套有序、完整的步骤，一步一步完成目标。大家把这四步连起来看：先拆分问题，再用模式识别套公式，接着抽象出关键信息，最后用算法列步骤求解。数学应用题的解题思路，和编程写程序的逻辑完全一致，这就是为什么我们说编程思维可以直接用到校内数学上。以后家长问学编程对数学到底有什么用，你就拿这道题完整讲一遍，比空泛地说锻炼逻辑，说服力强得多。","interact":null,"sku":"","dept":""},{"row":42,"stage":"为什么学少儿编程·阶段3","p":"P37","topic":"赋能校内学科","script":"学科成绩，永远是家长最核心的关切。所以向家长介绍编程的作用时，我们要主动、清晰地把它和孩子的学科能力挂钩，把编程的价值转化成家长能立刻感知的学科优势。大家看这页，在知识获取上，编程和AI工具能从多个方面辅助学科提升。数学上，通过动画演示把抽象变具体，孩子能直观看到图形的变化过程，遇到难题时还能获得多种解题思路，培养举一反三的能力。语文上，可以借助有趣的字词游戏扩大词汇量，还能让课本上的人物复活，帮孩子轻松背古诗。英语上，可以生成押韵的打油诗和单词卡片，帮孩子记单词、记句子。科学上，可以模拟火山喷发、雷电形成这类危险或难以实现的实验，让孩子安全地观察完整过程。接下来我们挑语文、数学、英语，具体看看。","interact":null,"sku":"","dept":""},{"row":43,"stage":"为什么学少儿编程·阶段3","p":"P38","topic":"语文","script":"先看语文。左边是语文课本里的田忌赛马，右边是用编程做出来的田忌赛马。大家说，读一篇文章去理解田忌为什么获胜，和看着马一场一场比下来，哪个更容易理解？显然是后者，因为它把逻辑可视化了。而编程正是在训练这种能力，它要求孩子把文字描述的故事，像拍电影一样拆解成一步一步的逻辑指令。这直接锻炼的，就是语文学习需要的阅读理解和信息整合能力，对写作时把事情讲清楚、讲有条理也很有帮助。","interact":null,"sku":"","dept":""},{"row":44,"stage":"为什么学少儿编程·阶段3","p":"P39","topic":"38页素材视频","script":"大家可以一起来感受，我们借助少儿编程，把田忌赛马的故事完整复原出来。大家就能直观体会，这种方式是如何帮助孩子加深理解的。 和单纯阅读文字、听故事相比，编程实现的版本画面感更强，逻辑过程可视化，抽象的策略变得直观，孩子理解起来会轻松很多。","interact":null,"sku":"","dept":"","video":"video/P39.mp4"},{"row":45,"stage":"为什么学少儿编程·阶段3","p":"P40","topic":"课程权威特色","script":"再说为什么核桃的课能和学科挂上钩。核桃编程的课程内容有很强的权威性和实用性。右边这张图，核桃创始人参与了国家教材编写，受聘为清华大学出版社信息科技教材的编委会委员和特约作者，这是对核桃教研专业度的高度认可。左边这张图是核桃编程知识点对标新课标，比如二维码原理、北斗卫星导航系统、自动驾驶这些知识点，都能在新课标对应的年级里找到。也就是说，孩子在核桃学到的，正是在学校里需要掌握、考试中会遇到的，做到所学即所考。另外，咱们课程有一个特色打法，叫以赛代练、以考促学。意思是，我们不是学完再去找考试，而是用比赛和考级来倒推学习节奏：每个阶段学什么、对标哪个等级的考试都很清楚，孩子边学边赛，每考过一级，信心和成就感就上一个台阶。家长最怕学了没结果，我们就让每个阶段都有看得见的里程碑。对续费家长来说，这一点很关键，孩子接下来每个阶段的目标都是清楚的。","interact":null,"sku":"","dept":""},{"row":46,"stage":"为什么学少儿编程·阶段3","p":"P41","topic":"课程大纲知识点","script":"大家现在看到的是Scratch科技特长生实验班的课程大纲，分为两大模块：语法基础赛考入门和算法进阶赛考加强。整个课程一共十二个级别，前六级是语法基础，后六级是算法进阶，循序渐进。每一级都配有阶段目标、课程内容，还有扩展知识点和思维训练目标。课程里融入了大量校内数学知识点，比如坐标、角度、面积、数列、变量运算等等。所以这不是单纯在学编程代码，而是一边学编程，一边同步锻炼数学思维。大纲里还穿插了赛考专题直播，赛考入门打好基础，赛考加强拔高训练，一步步对接赛事，实现编程能力和校内学科能力的双向提升。跟续费家长沟通时，可以拿着这张大纲，让家长看清楚孩子已经学完了哪一段，接下来要学什么、能对接什么赛事。","interact":null,"sku":"","dept":""},{"row":47,"stage":"为什么学少儿编程·阶段3","p":"P42","topic":"英语场景记忆","script":"Python和C++会涉及到英语。编程里会大量接触英文单词，比如屏幕上的power、shoot、style、draw，都是编程指令里常用的词。孩子在写代码、做项目时，自然就记住了这些单词，不再是死记硬背。再看右边这段家长的真实反馈：孩子很喜欢这种上课的感觉，晚上还在准备第二天要背的英语；家长说孩子数学本来还可以，英语不太行，最近一个多月英语也赶上来了，就是为了学好编程在努力。用编程场景带动英语学习，孩子有目标、有动力，从被动背单词变成主动去学，英语学习兴趣自然就提上来了。","interact":null,"sku":"","dept":""},{"row":48,"stage":"为什么学少儿编程·阶段3","p":"P43","topic":"短期长期价值","script":"学编程有什么用？短期和长期缺一不可。大家看这页的标题，必学编程的两大理由：进则科技特长，退则数理化强。我们可以这样向家长传达：学编程，短期是提升学科成绩、改善学习习惯的助推器；长期是为升学增加筹码，形成短期打基础、长期拓出路的良性循环。先说短期，也就是提成绩。编程学习不是独立在学业之外的，它和学科表现紧密相连。数学上，强化逻辑思维，加深对抽象概念的理解，提升解题的条理和严谨性。语文上，通过编程里的逻辑构建和故事设计，增强阅读理解和写作表达。英语上，在代码环境里自然积累词汇，提升英文阅读能力。综合来看，编程过程还能同步改善学习习惯、提升专注力，全面提升学习素养。再说长期，也就是助升学。编程能力已经成为新时代人才选拔的重要参考，通过科技特长生、强基计划等渠道，孩子能在关键的升学节点获得额外竞争力，有机会进重点班、重点中学，冲刺985、211。同时，编程培养的计算思维、创新和解决问题的能力，也是孩子面对未来的核心素养。听完短期和长期，如果你是一位孩子刚学完第一阶段的家长，会不会愿意让孩子继续学下去？最后跟各位老师共勉：这些道理很重要，但更需要我们主动去讲。不能坐等家长自己想明白，而要把它融入每一次沟通，通过精准的提问，挖出家长对孩子思维和习惯的真实痛点和期待，再用我们准备好的案例和话术，把逻辑思维这样抽象的概念，变成家长听得懂、想象得到的画面。主动把价值传递出去，把家长的认同，变成孩子继续成长的机会。","interact":null,"sku":"","dept":""},{"row":49,"stage":"为什么学少儿编程·阶段3","p":"P44","topic":"课程收尾总结","script":"以上就是这节课的全部内容，大家都清楚了吗？我们快速回顾一下。编程是什么？是和计算机沟通的语言，把解决问题的步骤写成计算机能理解的指令。少儿编程语言怎么选？图形化、Python、趣味C++、C++，看年龄，也看目标。为什么学编程？外部看时代、政策和升学，内部看习惯、思维和学科。面对续费家长，外部因素帮家长看清长期方向，内部因素帮家长看到眼前收获，两者结合，才能帮家长坚定地让孩子长期学下去。最后送大家几句话：学习不息，成长不止；追求卓越，舍我其谁；培训很苦，坚持很酷；你的付出，决定成长速度。","interact":null,"sku":"","dept":""},{"row":50,"stage":"为什么学少儿编程·阶段3","p":"P45","topic":"调研问卷","script":"最后，请大家拿出手机，扫一扫屏幕上的二维码，填写这节课的培训调研问卷，写下你的真实感受。","interact":null,"sku":"","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题·单选","chapter":"为什么学少儿编程·阶段1","q":"对Python的描述是？","options":[{"k":"A","t":"代码入门，需要英语基础；运用比较广泛"},{"k":"B","t":"入门简单，培养孩子的编程思维"},{"k":"C","t":"可参加信息学竞赛，难度较高、功能强大"},{"k":"D","t":"无需编程基础，无关英文单词"}],"answer":"A","back":"","sku":""},{"id":"T-S02","type":"阶段练习题·单选","chapter":"为什么学少儿编程·阶段1","q":"编程中“我们”和“计算机”的分工是？","options":[{"k":"A","t":"我们负责思考解决问题的步骤，并用计算机能理解的语言描述；计算机负责执行"},{"k":"B","t":"计算机负责思考解决问题的步骤，我们负责执行"},{"k":"C","t":"我们负责执行步骤，计算机负责描述步骤"},{"k":"D","t":"计算机负责思考和描述步骤，我们只负责检查结果"}],"answer":"A","back":"","sku":""},{"id":"T-S03","type":"阶段练习题·多选","chapter":"为什么学少儿编程·阶段1","q":"【多选】介绍的三种少儿编程语言是？","options":[{"k":"A","t":"Scratch"},{"k":"B","t":"Python"},{"k":"C","t":"C++"},{"k":"D","t":"Java"}],"answer":"ABC","back":"","sku":""},{"id":"T-S04","type":"阶段练习题·单选","chapter":"为什么学少儿编程·阶段1","q":"不需要编程基础、不用记英文单词、适合 5 岁到小学二年级及以下孩子的语言是？","options":[{"k":"A","t":"Scratch"},{"k":"B","t":"Python"},{"k":"C","t":"趣味 C++"},{"k":"D","t":"C++"}],"answer":"A","back":"","sku":""},{"id":"T-S05","type":"阶段练习题·判断","chapter":"为什么学少儿编程·阶段1","q":"C++的使用年级是？","options":[{"k":"A","t":"5岁-2年级及以下"},{"k":"B","t":"3—6年级"},{"k":"C","t":"7年级及以上"},{"k":"D","t":"3—8年级"}],"answer":"C","back":"","sku":""},{"id":"T-S06","type":"阶段练习题·单选","chapter":"为什么学少儿编程·阶段2","q":"全球已有多少个国家把编程纳入基础教育体系？","options":[{"k":"A","t":"12 个"},{"k":"B","t":"24 个"},{"k":"C","t":"40 个"},{"k":"D","t":"60 个"}],"answer":"B","back":"","sku":""},{"id":"T-S07","type":"阶段练习题·单选","chapter":"为什么学少儿编程·阶段2","q":"2024 年少儿编程市场规模大约是多少？","options":[{"k":"A","t":"188 亿人民币"},{"k":"B","t":"488 亿人民币"},{"k":"C","t":"988 亿人民币"},{"k":"D","t":"1000 亿人民币"}],"answer":"B","back":"","sku":""},{"id":"T-S08","type":"阶段练习题·判断","chapter":"为什么学少儿编程·阶段2","q":"P17时间轴中，2022年《义务教育课程方案和课程标准（2022年版）》明确了什么？","options":[{"k":"A","t":"信息科技落实为全国统一开设的独立课程科目，在3-8年级开设"},{"k":"B","t":"信息技术由兴趣课程变为必修课程"},{"k":"C","t":"北京、广州等5个城市作为第一批试点"},{"k":"D","t":"实施全民智能教育项目，逐步推广编程教育"}],"answer":"A","back":"","sku":""},{"id":"T-S09","type":"阶段练习题·单选","chapter":"为什么学少儿编程·阶段2","q":"2024 年开始，哪一类特长生的招生通道明显收紧？","options":[{"k":"A","t":"艺术类"},{"k":"B","t":"体育类"},{"k":"C","t":"学科类"},{"k":"D","t":"科技类"}],"answer":"A","back":"","sku":""},{"id":"T-S10","type":"阶段练习题·单选","chapter":"为什么学少儿编程·阶段2","q":"强基计划的参与高校是？","options":[{"k":"A","t":"39所（全都是985）"},{"k":"B","t":"90所（含87所211）"},{"k":"C","t":"39所（含87所211）"},{"k":"D","t":"90所（全都是985）"}],"answer":"A","back":"","sku":""},{"id":"T-S11","type":"阶段练习题·多选","chapter":"为什么学少儿编程·阶段3","q":"“必学编程的两大理由”中，可以训练的效果是？","options":[{"k":"A","t":"学习习惯"},{"k":"B","t":"逻辑思维"},{"k":"C","t":"专注力"},{"k":"D","t":"重点班"}],"answer":"ABC","back":"","sku":""},{"id":"T-S12","type":"阶段练习题·多选","chapter":"为什么学少儿编程·阶段3","q":"P31中，“将新问题通过简单的转化，变成已知的老问题，从而降低解题难度”指的是？","options":[{"k":"A","t":"分解"},{"k":"B","t":"模式识别"},{"k":"C","t":"抽象"},{"k":"D","t":"算法"}],"answer":"B","back":"","sku":""},{"id":"T-S13","type":"阶段练习题·单选","chapter":"为什么学少儿编程·阶段3","q":"对家长解释“算法思维”的是？","options":[{"k":"A","t":"找到解决问题最快的方法"},{"k":"B","t":"把一道大数学题分成几步做，一步一步解决"},{"k":"C","t":"做了10道题，发现这类题都有规律"},{"k":"D","t":"把复杂的东西简化成一个公式/步骤"}],"answer":"A","back":"","sku":""},{"id":"T-S14","type":"阶段练习题·单选","chapter":"为什么学少儿编程·阶段3","q":"用泳池铺砖题演示编程思维，四个步骤的先后顺序是？","options":[{"k":"A","t":"分解→模式识别→抽象→算法"},{"k":"B","t":"抽象→分解→算法→模式识别"},{"k":"C","t":"模式识别→分解→抽象→算法"},{"k":"D","t":"分解→抽象→算法→模式识别"}],"answer":"A","back":"","sku":""},{"id":"T-S15","type":"阶段练习题·单选","chapter":"为什么学少儿编程·阶段3","q":"核桃编程曾鹏轩、王宇航两位老师受聘参与编写的是？","options":[{"k":"A","t":"清华大学出版社《信息科技》教材"},{"k":"B","t":"《义务教育信息科技课程标准（2022年版）》"},{"k":"C","t":"《新一代人工智能发展规划》"},{"k":"D","t":"《中小学人工智能教育》项目阶段成果"}],"answer":"A","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题·单选","chapter":"为什么学少儿编程·全章","q":"家长说：「编程离我家孩子太远了，他又不当程序员。」最合适的回答是？","options":[{"k":"A","t":"确实很远，可以不学"},{"k":"B","t":"支付宝、滴滴打车、公司打卡系统都是编程的成果，程序就在生活里，孩子是在理解身边的世界"},{"k":"C","t":"程序员收入很高，值得学"},{"k":"D","t":"学了就能进大厂"}],"answer":"B","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题·单选","chapter":"为什么学少儿编程·全章","q":"家长说：“政策是好，但孩子才二年级，我更想知道学编程对孩子本身有什么帮助。”应重点讲哪组“内部因素”？","options":[{"k":"A","t":"培养习惯、编程思维、提升学科"},{"k":"B","t":"时代背景、国家政策"},{"k":"C","t":"强基计划、科技特长生"},{"k":"D","t":"新课标、信息科技纳入中考"}],"answer":"A","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题·判断","chapter":"为什么学少儿编程·全章","q":"《义务教育课程方案（2022版）》里信息科技在哪些年级开设？","options":[{"k":"A","t":"3-8年级"},{"k":"B","t":"1-9年级"},{"k":"C","t":"3-9年级"},{"k":"D","t":"7-9年级"}],"answer":"A","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题·单选","chapter":"为什么学少儿编程·全章","q":"家长问“科技特长生有什么优势”，P22“科技特长生全解读”标注的三个关键词是？","options":[{"k":"A","t":"官方政策、降分录取、锁定名校"},{"k":"B","t":"全国竞争、严控名额、降分录取"},{"k":"C","t":"本省竞争、没有限制、小班制"},{"k":"D","t":"85%高考、15%校测、本硕博"}],"answer":"A","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题·多选","chapter":"为什么学少儿编程·全章","q":"【多选】考生可凭哪些学科的奥林匹克竞赛全国决赛二等奖及以上报名？","options":[{"k":"A","t":"信息学"},{"k":"B","t":"数学"},{"k":"C","t":"物理"},{"k":"D","t":"外语"}],"answer":"ABC","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题·单选","chapter":"为什么学少儿编程·全章","q":"核桃编程招生最小年龄不低于（≥）几岁？","options":[{"k":"A","t":"6岁"},{"k":"B","t":"5岁"},{"k":"C","t":"4岁"},{"k":"D","t":"7岁"}],"answer":"B","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题·单选","chapter":"为什么学少儿编程·全章","q":"小升初阶段，学校参考孩子综合素质材料时，最容易拉开差距的是什么？","options":[{"k":"A","t":"兴趣爱好"},{"k":"B","t":"获奖情况"},{"k":"C","t":"身高体重"},{"k":"D","t":"家长职业"}],"answer":"B","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题·判断","chapter":"为什么学少儿编程·全章","q":"编程只是一门兴趣班，与学科成绩、学习习惯没有关系。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题·单选","chapter":"为什么学少儿编程·全章","q":"社会对人才需求的变化顺序是？","options":[{"k":"A","t":"劳动力→高知劳动力→创新"},{"k":"B","t":"高知劳动力→劳动力→创新"},{"k":"C","t":"创新→劳动力→高知劳动力"},{"k":"D","t":"劳动力→创新→高知劳动力"}],"answer":"A","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题·多选","chapter":"为什么学少儿编程·全章","q":"学习编程的短期收益包括哪些？【多选】","options":[{"k":"A","t":"数学：强化逻辑思维、提升解题条理"},{"k":"B","t":"语文：增强阅读理解与写作表达"},{"k":"C","t":"英语：在代码环境中积累词汇"},{"k":"D","t":"综合：改善学习习惯"}],"answer":"ABCD","back":"","sku":""}],"timing":{"P01":{"sents":["好，我们正式开启本次课程。","本次课程主题：为什么要学少儿编程。"," 咱们都是新入职的老师，这节课的定位，是帮大家打好编程认知的地基。"," 它不是让大家直接去网上复制通用话术，拿生硬的术语或者大白话直接讲给家长。","我们要学会结合咱们的课程体系，把底层逻辑吃透，转化成家长听得懂的表达。\n","这里跟大家明确一个核心：家长很多时候，是看重编程带来的附加价值才会产生兴趣 —— 比如能不能改善孩子的学习习惯、锻炼逻辑思维、和校内语文数学形成联动。","我们吃透这些底层认知，最终目的，是拥有独立回应、解决家长各类异议的能力。"," 不管家长抛出什么疑问，你都能讲明白编程到底是怎么帮到孩子的。\n","只有把「为什么学少儿编程」的底层逻辑吃透，我们才能从容应对家长的各种提问，而不是只会套固定句子。\n","今天课程分成两大板块： 第一板块：编程的基础认知 第二板块：为什么要学习少儿编程"],"durs":[3.12,3.84,6.624,7.872,7.248,15.432,7.584,5.976,9.24,8.688]},"P02":{"sents":["我们来看本节课的目录。"," 本节课一共两大板块： 第一板块，编程的基础认知；"," 第二板块，为什么去学少儿编程，从内部因素和外部因素两个方向去讲。","来看一道题，第二部分「为什么要学编程」，分为哪两类因素？"],"durs":[2.424,5.184,6.816,5.448]},"P03":{"sents":["好，我们进入第一个板块，编程基础认知，先回答一个最基本的问题：什么是编程。"],"durs":[7.584]},"P04":{"sents":["说到编程，大家脑子里会冒出什么画面？","是穿格子衬衫、在格子间里埋头敲代码的程序员？","是屏幕上密密麻麻的代码，还是右边这一大堆编程语言的名字？","再看下面这张图，不同工作年限、不同学历的程序员，跳槽前的平均年薪都不低，工作六到十年的硕士，平均能到四十四点九万。","所以很多人对编程的第一印象就是技术宅、高收入。","这些印象没有错，但大家要注意，跟家长沟通的时候，千万别把学编程的价值落在将来当程序员、赚高薪上。","家长最常见的反应就是：我家孩子又不当程序员。","那编程和孩子到底有什么关系？","我们接着往下看。"],"durs":[4.128,5.208,5.832,11.952,5.592,10.272,4.776,3.216,1.992]},"P05":{"sents":["其实编程离我们一点都不远。","图上这些图标，抖音、微信、淘宝、美团、支付宝、滴滴出行、铁路12306，都是我们每天在用的应用，它们全都是用编程做出来的。","再比如咱们上班门口的打卡系统，背后也是一段程序。","所以说，程序在我们的生活里无处不在。","这一点在沟通里很好用：家长说孩子又不当程序员，学编程离我们太远，你就可以拿支付宝、滴滴打车、公司打卡这些例子告诉家长，程序就在生活里，孩子学编程，是在理解身边这个越来越数字化的世界。"],"durs":[3.048,13.32,5.352,4.344,18.528]},"P06":{"sents":["那到底什么是编程？","大家看屏幕上这句定义：编程，就是我们为了完成某项任务，把解决问题的步骤，用计算机能够理解的语言写成指令。","计算机会按照这些指令一步一步执行，最后完成任务。","拆开来看，分工很清楚：我们负责思考解决问题的步骤，再用计算机能理解的语言把这些步骤描述出来；","计算机负责执行。","整个过程就是图上的思路，先思考，再整理思路，最后用计算机语言表达出来。","所以编程语言和我们平时说的中文、英语一样，都是用来沟通的语言，只不过沟通的对象换成了计算机。","而程序，就是用计算机能理解的语言写下的一连串命令。","来看一道题，编程的本质是什么？"],"durs":[2.16,10.656,5.376,9.6,2.28,7.704,9.744,5.688,3.264]},"P07":{"sents":["少儿编程语言，主要有三大类。","第一类是图形化编程，也就是Scratch，入门简单，重点培养孩子的编程思维。","第二类是Python，属于代码入门，需要一定的英语基础，应用范围比较广。","第三类是C++，可以用来参加信息学竞赛，难度较高，功能也很强大。"],"durs":[3.312,7.32,6.744,7.008]},"P09":{"sents":["在前面我们讲了什么是编程，也了解了不同年龄对应的编程语言。","接下来，进入我们第二个板块：为什么要学编程。\n","这也是家长问得最多的问题：“老师，学编程到底有什么好处？”"," 同时，也是我们跟家长沟通、传递编程价值、强调它重要性最核心的部分。","所以这块大家一定要认真听，吃透逻辑，后面跟家长沟通才能说得清楚、讲的更有画面感。"],"durs":[6,4.488,5.976,7.2,8.616]},"P10":{"sents":["那我们在跟家长讲为什么学编程的时候，可以分成两大维度去梳理，逻辑会特别清晰，也好记、也好讲。"," 一类是外部因素，一类是内部因素。\n","外部因素，简单来说，就是大环境、政策、升学、赛道机会这些客观存在的红利和路径；"," 内部因素，就是落在孩子自己身上的，思维、习惯、能力这些底层素养的提升。"],"durs":[9.624,3.6,8.904,8.136]},"P11":{"sents":["我们先来看一下外部因素。","外部因素，核心就是国家层面的导向、针对少儿科技教育、编程教育出台的一系列政策文件。","我们跟家长讲这部分，核心要传递一个信息：编程已经不是一个课外兴趣、可有可无的爱好，而是国家在大力推进的信息科技素养，是未来孩子需要具备的基础能力。"],"durs":[2.592,8.616,14.952]},"P12":{"sents":["我们先来看第一个，我们如何去说明编程已经纳入到我们的生活当中了？","其实我们可以举一些信息科技时代的一些场景，比如说像我们的无人加油站、无人超市、无人驾驶等等。","那其实现在的这些基础的服务岗位的需求在下降，因为 AI、机器人进行了一部分的替代，这个也是大的趋势。","那包括像 2025 年的时候也是第一年机器人走到春晚的舞台上面。","那我们都知道春晚的话每一个节目每一个内容都是精心安排的，那其实这个也是一个非常大的一个信号。","所以从这些案例我们已经能看到，无论是我们的数字化还是我们的智能化，其实都已经来到了我们的身边。","那也就意味着现在教育的整个的方向，国家的发展是希望教育培养的人才和国家发展相匹配，所以你看国家的教育方向也在大力推进的信息科技素养。"],"durs":[6.168,9.552,10.128,6.096,9,9.384,13.608]},"P13":{"sents":["时代的趋势我们刚刚看完了，现在我们再来看看国际趋势。","全球一共有 24 个国家，已经把编程纳入到基础教育体系当中。","像日本早在 2012 年，就已经把编程纳入小学教育，还有很多国家也都在同步推进这件事。","不难看出，编程教育早就已经是全球的大趋势。"," 咱们中国，是在 2017 年出台了第一批少儿编程相关政策，所以不管是时代趋势，还是国际趋势，都再次印证了，少儿编程这个方向的发展潜力和重要性。"],"durs":[5.88,5.952,8.28,4.896,14.712]},"P14":{"sents":["再从市场来看。","2024年少儿编程市场规模大约488亿人民币，未来有望发展成千亿市场。","整个行业会经历三个阶段。","现阶段是素质教育，市场规模不到500亿，编程主要作为课外培养孩子思维和兴趣的方式，相对小众。","未来5到10年，会走向素质学科化，越来越多家长认可编程教育，部分地区试点推广，进入教学体系，市场达到千亿级别。","再往后10到20年，会升级到学科教育，人人参与学习，全面纳入学科体系，形成千亿以上的市场规模。","跟家长沟通时，这条趋势线可以帮家长理解：现在坚持学，是走在前面，而不是跟风。"],"durs":[2.016,8.184,2.976,9.552,11.664,9.816,8.64]},"P15":{"sents":["国家的发展方向、教育调整方向，核心都是匹配当下的人才需求。","这也是少儿编程需求持续上涨的底层原因，我们可以顺着社会发展的阶段来看。"," 70 年代，国家重点需要基础劳动力，核心看重体力、吃苦能力和实操手艺，所以技校、专项手艺是当时主流的培养方向。"," 到了80、90年代，“知识就是力量” 成为共识，学历成为竞争的核心门槛，本科及以上高学历，是进入优质企业的重要加分项。"," 发展到今天，本科已经是非常普遍的基础门槛，大家开始内卷更高学历。","但我们也能看到一个现状：单纯的学历，已经不足以匹配国家的人才标准。","不少高学历的人才，缺少创新能力和硬核专项技能。"," 我们现在的大目标是科教强国、科技强国，需要大量创新型科技人才。","人才需求发生转变，教育政策就会同步调整，最终目标，就是培养出适配时代的专项科技后备人才"],"durs":[6.384,7.2,12.168,11.856,7.056,6.6,5.328,6.912,9.648]},"P16":{"sents":["下面我们一起看一段视频。","大家边看边留意，视频里提到国家在哪些时间节点，发布了哪些和编程教育相关的政策。"],"durs":[2.976,8.352]},"P16-2":{"sents":["视频里的政策比较多，大家不需要逐条背下来，有个大概印象就可以。","最需要记住的是两个时间点：2017年，国内编程教育开始落地；","2022年，新课标改革，信息科技成为独立的课程科目。","下一页我们用一张时间轴，把这条线串起来。"],"durs":[6.24,6.576,6.048,4.32]},"P17":{"sents":["从这张时间轴可以看到，国内编程教育从2017年开始落地。","那一年国务院发布了新一代人工智能发展规划，提出在中小学设置人工智能相关课程，逐步推广编程教育。","核桃也正是在2017年成立的。","之后教育部的相关政策不断调整完善：2018年，新课标提出信息技术从兴趣课程变为必修课程；","2019年，北京、广州、深圳、武汉、西安5个城市作为第一批试点，3到8年级学生全面试点学习人工智能与编程课程。","到了2022年，教育部发布义务教育课程方案和课程标准2022年版，信息科技成为全国统一开设的独立课程科目，在3到8年级开设。","也就是说，编程已经从课外兴趣，变成了正式纳入考核的重要学科。"],"durs":[6.024,10.008,3.456,10.32,12.144,13.128,6.552]},"P19":{"sents":["再看右边这张表，它把2001版、2017修订版和2022版的义务教育课程方案放在一起对比。","大家回忆一下自己上学时的信息技术课是什么样？","很多人还记得进机房要套鞋套，课上大多就是学学开机关机这类简单操作，一节课就过去了。","那时候信息技术并没有单独列出来，只是放在综合实践活动里。","再看2022版，红圈里的信息科技，单独成为3到8年级的一门课程。","现在义务教育阶段的信息课，有明确的必修内容，比如正式学习算法、编写程序代码，这些都是新课标要求孩子必须掌握的。","所以如果家长还以为学校的信息课只教开关机，大家就可以拿这张表告诉家长，现在早就不一样了。","左边这份教育部关于强基计划的文件，我们后面讲升学时再细说。"],"durs":[9.144,4.536,8.904,6.12,6.84,11.16,9.288,6.312]},"P20":{"sents":["既然我们已经经历了十年一次的新课标大改革，信息科技也成了一门独立学科，那国家到底有多重视？","再给大家普及一个知识点。","在十四届全国人大三次会议的部长通道上，教育部部长怀进鹏提到，DeepSeek和机器人是教育的重大机遇，将加强计算机等学科建设，推动人工智能等学科设计。","大家想一想，部长在这样的场合专门提到这个方向，能不能说明它的重要性？","国家层面都这么重视，作为老师和家长，我们要不要重视起来？","这也是和续费家长沟通时一个很实在的理由：孩子现在坚持学的，正是国家大力推动的方向。"],"durs":[9.408,2.64,14.832,6.912,5.664,8.592]},"P21":{"sents":["接下来看升学的新趋势。","左边这张地图，展示的是2025年哪些省份把信息科技纳入了中考：深红色的省份，信息科技是中考考试科目，直接计入中考总分；","浅红色的省份，是中考考核科目，计入学生档案。","右边是教育部的文件，全国一共有184所中小学入选人工智能教育基地名单，这些基地都以中小学信息科技、通用技术等课程为主要依托，去探索人工智能教育的新理念。","看完这些，大家就能感受到，信息科技在升学里的分量正在持续提升。"],"durs":[2.64,13.056,4.992,16.008,6.912]},"P22":{"sents":["大家都熟悉特长生赛道，特长生主要分为三大类：艺术、体育、科技。"," 我们先看政策变化，2024 年开始，艺术特长生的招生通道在收紧。","以前很多家长等到孩子初高中成绩不理想，才临时突击学艺术，想用这个方式助力升学。","这类情况越来越多，艺术类人才供给也逐渐饱和，所以现在政策提高了门槛，更看重长期深耕、科班积累的孩子，短期突击很难再走通。"," 体育赛道同样有它的特点，属于金字塔型竞争，非常依赖先天天赋，能走到最后的孩子占比很小。"," 而科技特长生，是现在国家重点扶持的新赛道。","这张图上也能看到，目前科技特长生全国覆盖率已经达到 88%，覆盖 22 个省份、4 个直辖市、4 个自治区。"," 它的优势在于，这条赛道可以贯穿小升初、初升高、高考，甚至未来留学、就业，是一条能够长期发展的特长路线，对比艺术、体育赛道，选择空间会更广。"],"durs":[7.248,7.008,8.544,13.176,9.24,4.896,10.944,14.928]},"P24":{"sents":["再看一组数据。","这是2025年清华北大本科新生的统计，通过强基计划录取的人数，在清华内地招生中占比24.32%，在北大本部占比29.51%。","强基计划从2020年开始，一直稳坐清北第二大升学通道，也就是说，除了高考统招，它是进入清北最重要的通道。","大家想一想，普通学生想进清华北大，最常见的方式是高考统招。","而在高考录取批次里，强基计划在7月5号就完成录取，是最早的一批，早于国家专项计划、国防生等录取批次，足以看出国家对强基计划的重视。","所以说，强基计划是普通学生冲刺985院校又一条重要的通道。"],"durs":[1.872,14.352,10.896,6.696,14.088,6.504]},"P25":{"sents":["在和家长沟通升学规划时，我们要分清不同升学节点：小升初、初升高、高考。","但大家要结合我们学员的年龄来看，图形化算法学员以 5 岁–2 年级为主，中考、高考距离孩子周期很长，离他们最近的关键节点是小升初。\n","因此，我们和家长沟通，切忌一次性把全阶段升学路径全部抛出，而是聚焦当下，向家长说明：在现阶段的升学环境里，编程能够为孩子带来的实际价值。\n","很多家长都会提出疑问：小升初没有科技特长相关政策。","这里我们要给家长做好专业解读：并非国家不重视科技素养的发展，而是小升初属于九年义务教育范畴，义务教育实行免试就近入学，政策层面不允许选拔性筛选；","中考、高考才属于选拔性考试。","现阶段义务教育主流入学方式为对口、摇号。\n","同时我们也要客观传递一个核心逻辑：部分学校在收集学生综合素质材料时，会参考孩子的综合履历。","同等条件下，拥有正规科创赛事奖项的孩子，综合素质展示会优于无奖项的孩子，奖项含金量越高，履历的差异化优势越明显。\n","当下很多孩子的兴趣集中在艺术、体育等方向，而编程能力需要长期系统学习，很难靠短期突击速成。","在众多兴趣赛道里，科技特长是稀缺的硬核能力，能够帮助孩子建立区别于其他同龄人的差异化竞争力。"],"durs":[7.92,13.368,14.664,5.712,15.432,3.648,4.68,9.792,12.336,10.08,9.6]},"P27":{"sents":["刚才我们重点讲解了学习编程的外部因素，也就是各项政策与时代趋势。","这些属于长期发展优势，能够为孩子后续的中考、高考乃至长远职业发展提供支撑。\n","讲到这里，我们可以思考一个问题：如果孩子现在读小学二年级，家长只听到 “编程对中高考有帮助”，会不会立刻产生报名意愿？\n","多数情况下，家长并不会马上行动。","大家的顾虑，也正是家长真实的心态：政策虽然利好，但这份收益距离当下太远。","我们的学员大多集中在 5 到3年级，以小学生为主。","孩子目前年纪尚小，几年之后的升学环境存在不确定性，孩子能不能坚持学到那个阶段，也是未知数。\n\n","这也提醒我们：只讲政策、唤醒重视还不够，更要聚焦当下，和家长聊清楚眼前的收获 —— 孩子现在学习编程，立刻能获得哪些能力上的提升。","这才是家长当下最关心的内容。\n","本节课我们就来讲解学习编程的短期好处，也就是内部因素。","内部能力提升与外部政策趋势相辅相成：外部大势指明方向，内部成长支撑孩子走得更远。\n","家长大多已经听过三个关键词：培养习惯、锻炼思维、提升学科。","我们的工作不只是简单告知家长有这些益处，更要讲清楚背后的逻辑：编程究竟如何培养学习习惯，又怎样具体助力数学、英语等学科的提升。\n","我们要用真实、具体的案例，把价值讲透，让家长真正认可：孩子为什么要学编程，以及为什么现在就要开始学习。"],"durs":[7.056,8.208,11.544,3.696,8.112,5.088,9.6,13.2,3.24,5.808,8.952,6.552,13.008,10.632]},"P28":{"sents":["先看学习习惯。","图上这棵树挂满了影响学习的问题：专注力差、粗心、拖延、叛逆、反应迟钝、没耐心、畏难情绪、沉迷游戏。","今天我们挑最有代表性的三个，讲清楚编程是怎么解决的，分别对应提高专注力、改善粗心马虎和增强自制力。","第一个是专注力差。","表现是上课、写作业时东张西望，玩一会儿笔写一个字。","为什么孩子学习时坐不住，看动画片却能一动不动？","主要是兴趣问题，动画片声光效果丰富、剧情抓人，写作业相对枯燥，孩子自然难以投入。","第二个是粗心马虎。","这个场景大家都不陌生：题目上的数字8，抄下来变成了0；","简单的英语单词总是拼错。","这些问题往往不是孩子不会，而是出在粗心上。","粗心的根源其实很简单，就是孩子从小没有建立起检查的习惯。","考试时总有一些聪明的孩子，一小时的卷子三十分钟就做完了，剩下的时间在摆弄笔袋、给橡皮戳洞，就是不去检查，走过去一看，口算题还有空着的，应用题也没写答。","更关键的是，现在很多家庭里，检查作业的任务落在了家长身上，孩子就更缺乏主动检查的意识。","第三个是自制力。","很多家长反映，孩子一拿起手机、一打开电脑，就沉浸在游戏里抢不回来，不让玩就偷偷玩，亲子关系也变得紧张。","这个问题编程是怎么解决的，我们稍后结合视频来看。","来看一道题，孩子「粗心马虎」的根源是什么？"],"durs":[2.064,11.256,10.632,2.232,6,5.016,9.144,2.16,6,3.144,4.704,6.144,15.288,9.216,2.088,10.464,5.136,3.984]},"P29":{"sents":["先说专注力。","我们通过一段视频，看看核桃编程的课是什么样的。","大家边看边想：这样的课，孩子为什么坐得住。"],"durs":[1.872,4.68,4.488]},"P29-2":{"sents":["第一，用兴趣吸引注意力。","视频里大家能感受到，我们的课程是任务制的，每个知识点都穿插在动画剧情里。","大家想想，小学阶段的孩子，是更喜欢看动画，还是看纯文字、听老师干讲？","而且我们把长时间的学习拆成一个个短小的任务，孩子像闯关一样往前走，自然不容易走神。","第二，用拆解降低难度。","编程会让孩子一口气写完所有代码吗？","不会。","就像那个经典问题，怎么把大象放进冰箱？","要拆成打开门、放进去、关上门三步。","我们的课程也是这样，引导孩子把大难题拆成小关卡，循序渐进，孩子就不容易因为畏难而放弃。","第三，用及时反馈激励坚持。","每通过一个关卡，系统都会给出即时的正向反馈和鼓励。","这种我做到了的成就感，会激励孩子主动挑战下一关，在不知不觉中延长专注学习的时间。","跟续费家长沟通时，可以请家长回想一下，孩子这六个月上课时能不能一直跟下来，这就是最有说服力的例子。","来看一道题，核桃编程用什么方式吸引孩子的注意力？"],"durs":[2.856,7.608,7.368,8.64,2.88,3.648,1.872,4.128,4.128,9.048,3.432,5.568,8.544,9.816,5.16]},"P30":{"sents":["再来看自制力，也就是沉迷游戏的问题。","核桃编程的思路是四个字：堵不如疏。","我们不是一味禁止孩子玩游戏，而是通过编程，引导孩子从游戏的消费者，转变成游戏的创造者，成为整个课堂的主人。","当孩子开始学怎么设计关卡、布置场景、设置人物和触发条件，视角就完全变了。","孩子会去想：怎么让游戏更好玩？","怎么让玩家跟着我的设计走？","这种我来制定规则的掌控感和创造力，是比打通关更高级、更持久的成就感。","这样一来，孩子对游戏的理解提升了，兴趣也从玩转到了造，既能缓解沉迷的问题，又把孩子的热情引导到了学习和创造上。","我们一起来看一段视频，了解一下核桃编程的实操课程模式。"],"durs":[3.864,3.96,10.848,7.944,3.336,2.832,7.32,11.064,5.736]},"P31":{"sents":["接下来讲编程思维。","编程能锻炼思维，几乎是所有家长最看重的价值之一。","但思维这个词听起来很高级，也特别抽象。","听到逻辑思维，你脑子里能马上浮现出它具体的样子吗？","大多数人都觉得有点模糊。","没关系，我们先看这张表，编程思维可以拆成四个部分。","第一是分解，把复杂问题拆成一系列小问题，每个小问题都能单独解决，用在学习上，专治丢三落四，提高审题能力。","第二是模式识别，把新问题通过简单的转化，变成已知的老问题，降低解题难度，对应常见题型和公式应用。","第三是抽象，忽略问题的细节，专注于问题的核心和关键点，对应举一反三、归纳总结。","第四是算法，设计解决问题的步骤，然后执行这些步骤，对应一题多解和简便算法。","后面我会用一道数学题，带大家看这四步在做题时是怎么发生的，在编程里又是怎么实现的。"],"durs":[2.4,5.424,4.32,5.112,2.784,5.352,11.352,10.536,8.592,8.016,8.76]},"P32":{"sents":["这张表是咱们跟家长沟通的话术库。","家长听不懂专业名词，我们就用大白话翻译给家长听，这本身就是专业。","分解能力，就是把一道大数学题分成几步做，一步一步解决，不慌不乱。","模式识别，就是做了10道题，发现这类题都有规律，以后一眼就能看出来。","抽象能力，就是把复杂的东西简化成一个公式或步骤，以后直接用。","算法思维，就是找到解决问题最快的方法，而不是蛮干狂刷题。","大家一定要把这四句白话记熟，跟家长聊的时候直接用。"],"durs":[3.744,6.744,6.96,6.768,6.48,6.12,5.376]},"P33":{"sents":["我们来看这道数学应用题：一个长方形的游泳池，长60米，宽30米，池底铺面积为9平方米的方砖，需要多少块？","第一步是分解，也就是化繁为简。","需要多少块这个问题，可以拆成两个小问题：泳池面积是多少？","瓷砖面积是多少？","先算出泳池的总面积，再用总面积除以单块方砖的面积，就能得到一共需要多少块。","大家看右下角，对应到编程里，就是先设置变量，把长和宽定义好，后面再一步步写计算逻辑。"],"durs":[10.728,3.48,5.76,2.16,7.992,8.88]},"P34":{"sents":["第二步是模式识别，也就是规律整合。","求长方形面积有固定的公式：长乘以宽。","对应到编程里，就是用一块积木让面积等于长乘宽，代入长和宽，直接算出泳池面积。","这就是模式识别的思维：找到同类问题通用的规律和公式，下次遇到类似的题，直接套用就行。","不管是做数学题还是写代码，找到固定规律，就不用每次从头想，效率会大大提升。"],"durs":[3.84,4.344,8.256,8.856,8.088]},"P36":{"sents":["最后一步是算法，也就是逻辑整合，把完整的解题步骤梳理出来。","具体计算时，先算出泳池面积，60乘30等于1800平方米，方砖面积已知是9平方米。","接着用泳池总面积除以单块方砖面积，1800除以9，等于200块。","最后写出答案：需要200块。","右边的程序，就是把算泳池面积这一步按顺序写进去，点击绿旗，程序就一步一步执行。","算法，就是一套有序、完整的步骤，一步一步完成目标。","大家把这四步连起来看：先拆分问题，再用模式识别套公式，接着抽象出关键信息，最后用算法列步骤求解。","数学应用题的解题思路，和编程写程序的逻辑完全一致，这就是为什么我们说编程思维可以直接用到校内数学上。","以后家长问学编程对数学到底有什么用，你就拿这道题完整讲一遍，比空泛地说锻炼逻辑，说服力强得多。"],"durs":[6,9.192,6.72,3.096,8.376,5.4,10.416,10.536,9.504]},"P37":{"sents":["学科成绩，永远是家长最核心的关切。","所以向家长介绍编程的作用时，我们要主动、清晰地把它和孩子的学科能力挂钩，把编程的价值转化成家长能立刻感知的学科优势。","大家看这页，在知识获取上，编程和AI工具能从多个方面辅助学科提升。","数学上，通过动画演示把抽象变具体，孩子能直观看到图形的变化过程，遇到难题时还能获得多种解题思路，培养举一反三的能力。","语文上，可以借助有趣的字词游戏扩大词汇量，还能让课本上的人物复活，帮孩子轻松背古诗。","英语上，可以生成押韵的打油诗和单词卡片，帮孩子记单词、记句子。","科学上，可以模拟火山喷发、雷电形成这类危险或难以实现的实验，让孩子安全地观察完整过程。","接下来我们挑语文、数学、英语，具体看看。"],"durs":[4.176,12.384,7.44,12.528,8.856,7.128,9.432,4.8]},"P38":{"sents":["先看语文。","左边是语文课本里的田忌赛马，右边是用编程做出来的田忌赛马。","大家说，读一篇文章去理解田忌为什么获胜，和看着马一场一场比下来，哪个更容易理解？","显然是后者，因为它把逻辑可视化了。","而编程正是在训练这种能力，它要求孩子把文字描述的故事，像拍电影一样拆解成一步一步的逻辑指令。","这直接锻炼的，就是语文学习需要的阅读理解和信息整合能力，对写作时把事情讲清楚、讲有条理也很有帮助。"],"durs":[1.872,6.096,8.232,3.6,9.552,10.776]},"P39":{"sents":["大家可以一起来感受，我们借助少儿编程，把田忌赛马的故事完整复原出来。","大家就能直观体会，这种方式是如何帮助孩子加深理解的。"," 和单纯阅读文字、听故事相比，编程实现的版本画面感更强，逻辑过程可视化，抽象的策略变得直观，孩子理解起来会轻松很多。"],"durs":[7.056,5.76,12.336]},"P40":{"sents":["再说为什么核桃的课能和学科挂上钩。","核桃编程的课程内容有很强的权威性和实用性。","右边这张图，核桃创始人参与了国家教材编写，受聘为清华大学出版社信息科技教材的编委会委员和特约作者，这是对核桃教研专业度的高度认可。","左边这张图是核桃编程知识点对标新课标，比如二维码原理、北斗卫星导航系统、自动驾驶这些知识点，都能在新课标对应的年级里找到。","也就是说，孩子在核桃学到的，正是在学校里需要掌握、考试中会遇到的，做到所学即所考。","另外，咱们课程有一个特色打法，叫以赛代练、以考促学。","意思是，我们不是学完再去找考试，而是用比赛和考级来倒推学习节奏：每个阶段学什么、对标哪个等级的考试都很清楚，孩子边学边赛，每考过一级，信心和成就感就上一个台阶。","家长最怕学了没结果，我们就让每个阶段都有看得见的里程碑。","对续费家长来说，这一点很关键，孩子接下来每个阶段的目标都是清楚的。"],"durs":[4.032,4.8,14.04,12.984,8.832,5.76,17.256,5.688,6.84]},"P41":{"sents":["大家现在看到的是Scratch科技特长生实验班的课程大纲，分为两大模块：语法基础赛考入门和算法进阶赛考加强。","整个课程一共十二个级别，前六级是语法基础，后六级是算法进阶，循序渐进。","每一级都配有阶段目标、课程内容，还有扩展知识点和思维训练目标。","课程里融入了大量校内数学知识点，比如坐标、角度、面积、数列、变量运算等等。","所以这不是单纯在学编程代码，而是一边学编程，一边同步锻炼数学思维。","大纲里还穿插了赛考专题直播，赛考入门打好基础，赛考加强拔高训练，一步步对接赛事，实现编程能力和校内学科能力的双向提升。","跟续费家长沟通时，可以拿着这张大纲，让家长看清楚孩子已经学完了哪一段，接下来要学什么、能对接什么赛事。"],"durs":[11.016,8.064,6.744,8.328,7.344,13.08,10.584]},"P42":{"sents":["Python和C++会涉及到英语。","编程里会大量接触英文单词，比如屏幕上的power、shoot、style、draw，都是编程指令里常用的词。","孩子在写代码、做项目时，自然就记住了这些单词，不再是死记硬背。","再看右边这段家长的真实反馈：孩子很喜欢这种上课的感觉，晚上还在准备第二天要背的英语；","家长说孩子数学本来还可以，英语不太行，最近一个多月英语也赶上来了，就是为了学好编程在努力。","用编程场景带动英语学习，孩子有目标、有动力，从被动背单词变成主动去学，英语学习兴趣自然就提上来了。"],"durs":[3.36,9.264,6.6,8.712,9.432,11.088]},"P43":{"sents":["学编程有什么用？","短期和长期缺一不可。","大家看这页的标题，必学编程的两大理由：进则科技特长，退则数理化强。","我们可以这样向家长传达：学编程，短期是提升学科成绩、改善学习习惯的助推器；","长期是为升学增加筹码，形成短期打基础、长期拓出路的良性循环。","先说短期，也就是提成绩。","编程学习不是独立在学业之外的，它和学科表现紧密相连。","数学上，强化逻辑思维，加深对抽象概念的理解，提升解题的条理和严谨性。","语文上，通过编程里的逻辑构建和故事设计，增强阅读理解和写作表达。","英语上，在代码环境里自然积累词汇，提升英文阅读能力。","综合来看，编程过程还能同步改善学习习惯、提升专注力，全面提升学习素养。","再说长期，也就是助升学。","编程能力已经成为新时代人才选拔的重要参考，通过科技特长生、强基计划等渠道，孩子能在关键的升学节点获得额外竞争力，有机会进重点班、重点中学，冲刺985、211。","同时，编程培养的计算思维、创新和解决问题的能力，也是孩子面对未来的核心素养。","听完短期和长期，如果你是一位孩子刚学完第一阶段的家长，会不会愿意让孩子继续学下去？","最后跟各位老师共勉：这些道理很重要，但更需要我们主动去讲。","不能坐等家长自己想明白，而要把它融入每一次沟通，通过精准的提问，挖出家长对孩子思维和习惯的真实痛点和期待，再用我们准备好的案例和话术，把逻辑思维这样抽象的概念，变成家长听得懂、想象得到的画面。","主动把价值传递出去，把家长的认同，变成孩子继续成长的机会。"],"durs":[2.04,2.64,7.32,8.352,6.984,3.048,5.952,7.776,7.296,6,8.016,3.144,17.04,8.304,8.352,6.024,18.864,6.312]},"P44":{"sents":["以上就是这节课的全部内容，大家都清楚了吗？","我们快速回顾一下。","编程是什么？","是和计算机沟通的语言，把解决问题的步骤写成计算机能理解的指令。","少儿编程语言怎么选？","图形化、Python、趣味C++、C++，看年龄，也看目标。","为什么学编程？","外部看时代、政策和升学，内部看习惯、思维和学科。","面对续费家长，外部因素帮家长看清长期方向，内部因素帮家长看到眼前收获，两者结合，才能帮家长坚定地让孩子长期学下去。","最后送大家几句话：学习不息，成长不止；","追求卓越，舍我其谁；","培训很苦，坚持很酷；","你的付出，决定成长速度。"],"durs":[4.416,2.064,1.872,6.768,2.424,6.528,1.872,5.688,12.768,4.488,2.784,2.736,2.88]},"P45":{"sents":["最后，请大家拿出手机，扫一扫屏幕上的二维码，填写这节课的培训调研问卷，写下你的真实感受。"],"durs":[9.312]},"P08":{"sents":["那不同年龄的孩子适合学什么？","大家看这张表，我们按难度从低到高过一遍。","Scratch不需要编程基础，不用记英文单词，也不需要大量的键盘操作和语句记忆，入门容易，适合五岁到小学二年级及以下的孩子。","Python需要一定的英文基础和基本的编程逻辑理解，难度中等，适合小学三到六年级。","趣味C++的基础要求和Python一样，难度中上，同样适合小学三到六年级。","它用的是和C++相同的标准代码语言，有利于孩子以后参加竞赛。","很多家长更认可C++，但低龄孩子直接学C++难度太大，容易产生畏难情绪，趣味C++正好解决了这个问题。","最后是C++，要求较高的英文水平和扎实的编程基础，还要学数据结构和算法，难度较高，适合七年级及以上的孩子。","续费沟通时，家长偶尔会问后面要不要换一种语言，大家就对照这张表，看孩子的年级和基础来匹配，不要凭感觉推荐。","来看一道题，使用年级为3—6年级的编程语言是？"],"durs":[3.264,4.44,12.048,8.064,7.536,6.672,11.472,11.496,11.136,5.04]},"P18":{"sents":["刚才多次提到新课标，不少伙伴对这个概念可能还有点模糊。","新课标就是新的课程标准，是国家课程的基本纲领性文件。","国家会根据当下发展需要的人才类型，来调整课程标准。","它不会年年改，大约十年修改一次，最近一次就是在2022年。","这次修改最关键的一点，是把信息科技列为一门独立的课程，这意味着信息科技现在和家长、学生重视的语数外学科同等重要。","来看一道题，「新课标」多久改革一次？","来看一道题，新课标大约多久修改一次？","最近一次修改在哪一年？"],"durs":[5.952,5.784,5.544,6.504,11.616,3.672,4.056,2.784]},"P23":{"sents":["还有一个大家必须知道的政策，就是强基计划。","2020年，国家取消了自主招生，新增了强基计划。","一句话总结它的优势：它不只看高考分，还要看校测成绩，高考分数稍低的孩子也有机会考取名校，相当于存在降分录取的机制。","左边是39所强基计划试点高校名单，全部都是九八五高校。","右边的对比表里还有几点要注意：强基计划是本省竞争，名额没有限制，录取按百分之八十五的高考成绩加百分之十五的校测成绩评价，招生专业集中在基础学科、计算机类和新工科类。","如果家长还是很难理解，我们可以这样讲：学编程，能帮孩子多一条进入重点院校的路，分数不够的时候，特长来补齐。","来看一道题，对比表中，强基计划的评价方式是？"],"durs":[4.32,5.352,12.048,6.144,17.256,10.752,4.944]},"P26":{"sents":["讲完政策层面的外部趋势之后，我们还要帮家长厘清一个认知：编程是一门学科能力，而不是一个可有可无的兴趣班。\n\n","我们可以用高校高度认可的奥赛体系来举例。","大家熟悉的五大学科奥赛，分别是数学、物理、化学、生物、信息学。","其中信息学奥赛，也就是我们常说的信奥赛，核心考察内容就是编程。\n\n","从高校的招生简章里也能看到，数学、物理、化学、生物、信息学这几类学科竞赛，是放在同一序列里被认可的。","这里面的信息学，对应的正是少儿编程所学的编程内容。\n\n","这也说明，编程并不是课外消遣类的兴趣班，而是和数学、物理一样，属于被教育体系和高校认可的学科方向。","我们可以通过这个角度，向家长再次强调编程学习的重要性和长期价值。\n\n","刚刚我们从时代环境、国际趋势、人才需求变迁、特长生赛道，再到信息学的学科定位，完整梳理了外部层面的逻辑。"," 所有这些外部信号，共同印证：编程教育不是一时兴起的课外热点，而是顺应科教强国战略、全球同步推进的基础教育方向。"," 外部大势我们已经梳理清楚，接下来，我们把视角从大环境收回到孩子身上，一起来看学习编程，会给孩子带来哪些底层能力的提升，也就是我们接下来要讲的内部因素。","来看一道题，北理工强基简章中，第二类考生须在全国中学生学科奥林匹克竞赛全国决赛中获得什么奖项？"],"durs":[10.512,4.104,7.128,6.912,11.016,5.376,10.296,6.96,10.896,11.856,15.6,10.32]},"P30-2":{"sents":["看完视频大家就明白了，核桃的实操课，就是让孩子从游戏的参与者，变成游戏的制作者。","家长担心孩子沉迷游戏的时候，不要跟家长说别让孩子碰游戏，而是告诉家长，我们是把孩子对游戏的兴趣，转成做游戏的动力。","来看一道题，核桃编程的哪种课程模式？"],"durs":[8.616,11.424,4.032]},"P35":{"sents":["第三步是抽象，也就是聚焦关键信息。","拿到题目，先把信息拆出来，哪些是已知，哪些是未知。","方砖面积是已知条件，9平方米；","泳池面积是要求的未知量。","把无关的信息过滤掉，只抓住核心要素，代入长乘宽的公式计算。","放到编程里，就是用变量算出泳池面积，再把结果显示出来。","这种抽象思维，就是教孩子读题时快速抓住有用信息，排除干扰，找准解题核心，做数学题和写程序都离不开它。","来看一道题，从泳池题里找出“瓷砖面积已知9平方米、泳池面积未知”，对应编程思维的哪一步？"],"durs":[3.984,5.52,3.768,3.048,6.192,5.832,11.328,9]}},"v":{"slides/P01.jpg":"47be9e9f","slides/P01.png":"8b714562","slides/P02.jpg":"47767c13","slides/P02.png":"80daa88d","slides/P03.jpg":"afe8e9af","slides/P03.png":"cc30afca","slides/P04.jpg":"33ae54ec","slides/P04.png":"e21ac3e3","sl /* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；

let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}

  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

function quizAwayNow(){ return document.hidden || !document.hasFocus(); }
function startQuizAway(){
  if (quizAwayAt != null || !quizActive() || !quizAwayNow()) return;
  quizAwayAt = Date.now();
  const s = stat(curKey()); s.qn = (s.qn||0) + 1;
  report({event:'测试中切屏', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`本次测试第 ${s.qn} 次切屏（${document.hidden ? '切出页面' : '切到其他窗口'}）`});
}
function endQuizAway(doReport){
  if (quizAwayAt == null) return;
  const sec = (Date.now() - quizAwayAt)/1000; quizAwayAt = null;
  const s = stat(curKey()); s.qs = (s.qs||0) + sec;
  if (doReport) report({event:'回到测试', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`离开 ${Math.round(sec)} 秒`});
  const w = $('#quizWarn'); if (w) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs)} 秒，已同步给培训老师。`; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) startQuizAway(); else if (document.hasFocus()) endQuizAway(true); });
window.addEventListener('blur', startQuizAway);
window.addEventListener('focus', () => endQuizAway(true));
setInterval(() => { if (quizActive()) { if (quizAwayNow()) startQuizAway(); else endQuizAway(true); } }, 1000);
/* 占用时长：停留在某关卡（听课或做小测）的全部时间，含暂停、切走 */
let tickAt = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min((now - tickAt)/1000, 70); tickAt = now;
  if (st.name && (st.view === 'learn' || st.view === 'quiz')) { stat(curKey()).occ += dt; if (Math.random() < 0.1) save(); }
}, 1000);
/* 暂停：学员主动暂停或切走窗口导致的暂停（翻页、听完不算） */
let navPause = false, pauseAt = null, pauseWhy = '';
function endPause(doReport){
  if (pauseAt == null) return;
  const sec = (Date.now() - pauseAt)/1000; pauseAt = null;
  stat(st.cur.s).ps += sec;
  if (doReport) report({event:'继续播放', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`暂停 ${Math.round(sec)} 秒（${pauseWhy}）`});
}
/* 卡顿：播放中因网络缓冲停住 */
let stallAt = null;
function endStall(){
  if (stallAt == null) return;
  const sec = (Date.now() - stallAt)/1000; stallAt = null;
  if (sec < 0.8) return;
  const s = stat(st.cur.s); s.kn += 1; s.ks += sec;
  report({event:'卡顿', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`缓冲卡顿 ${sec.toFixed(1)} 秒`});
}

/* ---------- 音频播放 ---------- */
const au = $('#au');
const VU = f => f + '?v=' + ((DATA.v||{})[f]||'');
const SL = p => (DATA.v||{})['slides/'+p+'.jpg'] ? VU('slides/'+p+'.jpg') : VU('slides/'+p+'.png');
const PRE = {}; function preload(p){ if(!p||PRE[p.p]) return; PRE[p.p]=1; const i=new Image(); i.src=SL(p.p); const a=new Audio(); a.preload='auto'; a.src=VU('audio/'+p.p+'.mp3'); }
let rate = 1, playing = false, pendingAfter = null;
function pageTiming(p){ return DATA.timing[p.p]; }
function sentAt(p, t){
  const tm = pageTiming(p); let acc = 0;
  for (let i=0;i<tm.durs.length;i++){ acc += tm.durs[i]; if (t < acc) return i; }
  return tm.durs.length-1;
}
au.addEventListener('timeupdate', () => {
  if (st.view !== 'learn') return;
  if (!au.paused && lastT != null) { const dt = au.currentTime - lastT; if (dt > 0 && dt < 3) { const real = dt/(au.playbackRate||1); pageSec += real; st.stageSec[st.cur.s] = (st.stageSec[st.cur.s]||0) + real; stat(st.cur.s).play += real; } }
  lastT = au.currentTime;
  const p = curPage(); const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const i = sentAt(p, au.currentTime);
  const sub = $('#sub'); if (sub && sub.dataset.i != i){ sub.dataset.i = i; sub.textContent = tm.sents[i].trim(); }
  const bar = $('#progfill'); if (bar) bar.style.width = (100*au.currentTime/total).toFixed(1)+'%';
  const tt = $('#time'); if (tt) tt.textContent = fmt(au.currentTime)+' / '+fmt(total);
});
/* 群播报：暂停/切屏/离开满 2 分钟、结业 */
const BOT = 'https://open.feishu.cn/open-apis/bot/v2/hook/82649ac6-80a5-409e-9121-95139667f76c';
const CN = CFG.short || CFG.title;
function bot(text, force){ if (!st.name) return; if (!force && st.final && st.final.pass) return; try { fetch(BOT, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify({msg_type:'text', content:{text}})}); } catch(e) {} }
const who = () => st.name + '（' + (st.team || '未填职场') + '）';
let awayT = null, pauseT = null;
function watchAway(kind){ if (!st.name || awayT || st.view === 'home') return; awayT = setTimeout(() => bot(who() + '在' + CN + '课已' + kind + '2分钟'), 120000); }
function backAway(){ clearTimeout(awayT); awayT = null; }
document.addEventListener('visibilitychange', () => { if (document.hidden) { backAway(); watchAway('离开'); } else if (document.hasFocus()) backAway(); });
window.addEventListener('blur', () => { if (!document.hidden) watchAway('切屏'); });
window.addEventListener('focus', backAway);
au.addEventListener('pause', () => { clearTimeout(pauseT); if (au.ended || st.view !== 'learn') return; pauseT = setTimeout(() => { if (au.paused && !document.hidden && document.hasFocus() && st.view === 'learn') bot(who() + '在' + CN + '课已暂停2分钟'); }, 120000); });
au.addEventListener('play', () => clearTimeout(pauseT));
au.addEventListener('ended', () => { playing = false; updPlayBtn(); onPageEnd(); });
au.addEventListener('pause', () => {
  playing = false; updPlayBtn(); endStall();
  const atEnd = au.ended || (au.duration && au.currentTime >= au.duration - 0.3);
  if (navPause || atEnd || st.view !== 'learn') { navPause = false; return; }
  const s = stat(st.cur.s); s.pn += 1; pauseAt = Date.now(); pauseWhy = autoWhy || (document.hidden ? '切出页面自动暂停' : '主动暂停'); autoWhy = '';
  report({event:'暂停', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:pauseWhy});
});
au.addEventListener('play', () => { playing = true; updPlayBtn(); const v=$('#veil'); if(v) v.hidden = true; endPause(true); });
au.addEventListener('waiting', () => { if (!au.paused && au.currentTime > 0.5 && stallAt == null) stallAt = Date.now(); });  // 每页开头的首次加载不算卡顿
au.addEventListener('playing', endStall);
function fmt(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function play(){ au.playbackRate = rate; au.play().catch(() => { const v=$('#veil'); if(v) v.hidden=false; }); }
function updPlayBtn(){ const b = $('#pp'); if (b) b.textContent = playing ? '暂停' : '播放'; }

/* 切走自动暂停——防挂机。两种情况都算：
   1) 页面被隐藏（最小化、切标签页、被完全挡住）；
   2) 浏览器窗口失去焦点（点到了 WPS、微信等其他窗口，哪怕只挡住一部分） */
let autoWhy = '';
function autoPause(why){
  if (!playing) return;
  autoWhy = why; au.pause();
  const v = $('#veil'); if (v) { v.hidden = false; $('#veilBtn').textContent = '检测到你切到了其他窗口，已暂停 · 点我继续'; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause('切出页面自动暂停'); });
window.addEventListener('blur', () => { autoPause('切到其他窗口自动暂停'); });
/* 兜底：个别环境 blur 不触发时，每秒检查一次窗口焦点 */
setInterval(() => { if (playing && !document.hasFocus()) autoPause('切到其他窗口自动暂停'); }, 1000);

/* ---------- 视图 ---------- */
function curStage(){ return STAGES[st.cur.s]; }
function curPage(){ return curStage().pages[st.cur.p]; }
function stageStatus(i){
  if (st.passed[i]) return 'pass';
  if (i <= st.unlocked) return 'open';
  return 'lock';
}
function mapHTML(active){
  const nodes = STAGES.map((s,i) => {
    const ss = stageStatus(i);
    const sub = ss==='pass' ? ('已过关'+(st.best[i]!=null?' · '+st.best[i]+'/'+s.quiz.length:'')) : ss==='open' ? (s.quiz.length?'学完测 '+s.quiz.length+' 题':'学完解锁综合测试') : '未解锁';
    return `<button class="node ${ss} ${active===i?'cur':''}" data-go="${i}" ${ss==='lock'?'disabled':''}>
      <span class="k">阶段 ${s.num}</span><span class="t">${esc(TITLES[s.num]||("阶段 "+s.num))}</span><span class="s">${sub}</span></button>`;
  });
  const fOpen = STAGES.every((s,i)=>st.passed[i]);
  const fs = st.final && st.final.pass ? '已通过 · '+st.final.score+'/'+FINAL.length : fOpen ? FINAL.length+' 题 · 待作答' : '全部阶段过关后解锁';
  nodes.push(`<button class="node ${st.final&&st.final.pass?'pass':fOpen?'open':'lock'} ${active==='final'?'cur':''}" data-final ${fOpen?'':'disabled'}>
    <span class="k">结业</span><span class="t">本章综合测试</span><span class="s">${fs}</span></button>`);
  return `<nav class="map" aria-label="闯关进度">${nodes.join('')}</nav>`;
}
function loopHTML(on){
  const w = ['学一段','练一题','测一轮','过一关','进一步'];
  return `<div class="loop" aria-label="学习闭环">${w.map((x,i)=>`<span class="${i===on?'on':''}">${x}</span>`).join('<i>→</i>')}</div>`;
}
function headerHTML(){
  return `<header><div class="brand"><h1>${esc(CFG.title)}</h1><span class="tag">${esc(CFG.tag)}</span></div>
    <div class="who">${st.name?('学员：'+esc(st.name)+(st.team?'（'+esc(st.team)+'）':'')+' · '):''}<button class="btn ghost" style="padding:4px 10px;font-size:13px" data-home>课程首页</button></div></header>`;
}
function bindCommon(){
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => startStage(+b.dataset.go));
  const f = document.querySelector('[data-final]'); if (f) f.onclick = () => showQuiz('final');
  const h = document.querySelector('[data-home]'); if (h) h.onclick = () => { navStop(); st.view='home'; save(); report({event:'回到首页'}); render(); };
}

function render(){
  if (st.view === 'learn') return renderLearn();
  if (st.view === 'quiz') return renderQuiz();
  renderHome();
}

function renderHome(){
  const totalMin = Math.round(Object.values(DATA.timing).reduce((a,t)=>a+t.durs.reduce((x,y)=>x+y,0),0)/60);
  const started = st.name;
  const done = st.final && st.final.pass;
  $('#app').innerHTML = `${headerHTML()}
  <section class="card hero">
    <img src="${SL(CFG.hero)}" alt="${esc(CFG.title)}">
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <h2 style="font-size:22px">${esc(CFG.title)}</h2>
      <p class="muted" style="margin:0">共 ${STAGES.length} 个学习板块、${DATA.pages.length} 页、约 ${totalMin} 分钟讲解。讲解中穿插随堂互动题；每个阶段学完做 5 题小测，正确率达 ${Math.round(PASS*100)}% 才解锁下一阶段，未达标需重学本阶段。</p>
      ${started ? `<div class="row" style="justify-content:flex-start">
          <button class="btn" id="resume">${done?'回看课程':'继续学习'}</button>
          ${done?'<button class="btn soft" id="cert">查看成绩单</button>':''}
          <button class="btn ghost" id="reset">换人 / 重新开始</button></div>`
      : `<form id="nameForm"><label for="nm">学员姓名</label>
          <input id="nm" required maxlength="20" placeholder="请输入真实姓名" autocomplete="name">
          ${CFG.depts ? `<span>部门（可多选）</span><div class="chips">${CFG.depts.map(d=>`<label class="chip"><input type="checkbox" name="dept" value="${esc(d)}"> ${esc(d)}</label>`).join('')}</div>
          ${CFG.skus ? `<span>SKU（可多选）</span><div class="chips">${CFG.skus.map(d=>`<label class="chip"><input type="checkbox" name="sku" value="${esc(d)}"> ${esc(d)}</label>`).join('')}</div>` : ''}`
          : `<label for="tm">职场 / 团队</label>
          <input id="tm" required maxlength="20" placeholder="如：武汉、汇诚" list="teams" autocomplete="off">
          <datalist id="teams"><option value="武汉"><option value="汇诚"><option value="国润"><option value="长春"></datalist>`}
          <p class="rule" id="formMsg" hidden></p>
          <button class="btn" type="submit">开始学习</button></form>`}
      <p class="rule" id="resetMsg" hidden></p>
    </div>
  </section>
  ${loopHTML(-1)}
  ${mapHTML(-1)}
  <section class="card"><h3 style="font-size:16px;margin-bottom:8px">上课须知</h3>
    <ol class="steps">
      <li>请打开声音。每页 PPT 配有老师讲解，字幕同步显示讲解原文。</li>
      <li>当前页讲完才能进入下一页；切到别的窗口会自动暂停。</li>
      <li>带 ✎ 的页面讲完会弹出互动题，答错可能需要重听本页。</li>
      <li>阶段小测 5 题，答对 ${Math.ceil(5*PASS)} 题及以上过关；未过关需重学本阶段后再测。</li>
      <li>全部阶段过关后，解锁本章综合测试（${FINAL.length} 题）。</li>
      <li>你的姓名、职场、各页学习时长和测试成绩会同步给培训老师。</li>
    </ol></section>`;
  bindCommon();
  const f = $('#nameForm');
  if (f) f.onsubmit = e => { e.preventDefault();
    const v = $('#nm').value.trim(); const pick = n => [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x => x.value);
    let t = '', extra = '';
    if (CFG.depts) {
      const ds = pick('dept'), ks = pick('sku'), m = $('#formMsg');
      if (!v || !ds.length || (CFG.skus && !ks.length)) { m.hidden = false; m.textContent = CFG.skus ? '请填写姓名，并至少选择一个部门和一个 SKU。' : '请填写姓名，并至少选择一个部门。'; return; }
      st.depts = ds; st.skus = ks; t = ds.join('、'); extra = `｜部门：${ds.join('、')}` + (CFG.skus ? `｜SKU：${ks.join('、')}` : '');

    if (!STAGES.length) { const m = $('#formMsg'); m.hidden = false; m.textContent = '你选择的部门 / SKU 暂时没有对应课件，请确认后重新选择。'; st.name = ''; st.depts = st.skus = null; buildStages(); return; }
    const rs = applyRestore(); save();
    report({event:'进入课程', detail:(rs?'恢复进度':'首次进入') + extra}); startStage(rs ? Math.min(st.unlocked, STAGES.length-1) : 0); };
  const r = $('#resume'); if (r) r.onclick = () => { report({event:'进入课程', detail:'继续学习'}); startStage(Math.min(st.unlocked, STAGES.length-1), true); };
  const c = $('#cert'); if (c) c.onclick = () => showQuiz('final');
  const x = $('#reset'); if (x) x.onclick = () => {

    x.dataset.armed = 1; x.textContent = '再点一次确认清空记录';
    const m = $('#resetMsg'); m.hidden = false; m.textContent = '清空后本机的学习进度和成绩都会删除。';
  };

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function renderLearn(autoplay){
  const s = curStage(), p = curPage();
  const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const heard = !!st.heard[p.p];
  $('#app').innerHTML = `${headerHTML()}
  ${mapHTML(st.cur.s)}
  ${loopHTML(0)}
  <div class="stage-head"><h2>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}　<span class="muted" style="font-weight:400;font-size:15px">${p.p} ${esc(p.topic)}</span></h2>
    <span class="time">第 ${st.cur.p+1} / ${s.pages.length} 页</span></div>
  <div class="slide">${p.video?`<video id="vd" src="${VU(p.video)}" poster="${SL(p.p)}" controls playsinline preload="metadata" style="width:100%;max-height:70vh;display:block;object-fit:contain;background:#000"></video>`:`<img src="${SL(p.p)}" alt="${esc(p.p+' '+p.topic)}">`}
    <div class="veil" id="veil" ${autoplay?'hidden':''}><button class="btn" id="veilBtn">▶ 点击播放讲解</button></div></div>
  <div class="sub" id="sub" aria-live="polite">${esc(tm.sents[0].trim())}</div>
  <div class="bar">
    <button class="btn ghost" id="prev" ${st.cur.p===0?'disabled':''}>上一页</button>
    <button class="btn" id="pp">播放</button>
    <button class="btn ghost" id="again">重听本页</button>
    <div class="prog" aria-hidden="true"><div id="progfill"></div></div>
    <span class="time" id="time">0:00 / ${fmt(total)}</span>
    <div class="speed" role="group" aria-label="语速">${[1,1.25,1.5].map(r=>`<button data-r="${r}" class="${r===rate?'on':''}">${r}x</button>`).join('')}</div>
    <button class="btn" id="next" ${heard?'':'disabled'}>${st.cur.p===s.pages.length-1?(s.quiz.length?'去做阶段小测':'完成本阶段'):'下一页'}</button>
  </div>
  <div class="dots">${s.pages.map((pg,i)=>`<button class="dot ${st.heard[pg.p]?'heard':''} ${i===st.cur.p?'now':''} ${pg.interact?'q':''}" data-pg="${i}" ${(st.heard[pg.p]||i===st.cur.p)?'':'disabled'} title="${esc(pg.topic)}">${pg.p}</button>`).join('')}</div>
  <details class="full"><summary>展开本页讲解全文</summary><p>${esc(p.script)}</p></details>`;
  bindCommon();
  au.src = VU('audio/'+p.p+'.mp3');
  { const im=document.querySelector('.slide img'); if(im && !im.complete){ im.style.opacity=0; im.onload=()=>{im.style.transition='opacity .2s';im.style.opacity=1;}; } }
  [1,2].forEach(k=>preload(s.pages[st.cur.p+k])); if(st.cur.p+1>=s.pages.length) preload((STAGES[st.cur.s+1]||{pages:[]}).pages[0]);
  au.currentTime = 0; lastT = 0;
  report({event:'进入页面', stage:stageLabel(st.cur.s), page:p.p, detail:p.topic});
  $('#veilBtn').onclick = play;
  { const v = $('#vd'); if (v) v.onplay = () => au.pause(); }
  $('#pp').onclick = () => playing ? au.pause() : play();
  $('#again').onclick = () => { au.currentTime = 0; play(); };
  $('#prev').onclick = () => goPage(st.cur.p-1);
  $('#next').onclick = () => nextPage();
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => goPage(+b.dataset.pg));
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rate = +b.dataset.r; au.playbackRate = rate;
    document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on', x===b)); });
  if (autoplay) play();
}
function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});
  showQuiz('final');
}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>
