<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>核桃课程体系</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}
</style>

<script>
const DATA = {"pages":[{"row":2,"stage":"课程体系·阶段1","p":"P01","topic":"","script":"大家好，上节课咱们把课导工作的全流程过了一遍，这节课来讲核桃的课程体系和学科特点。先说说这节课为什么重要。咱们接手的家长，孩子已经在核桃学完了第一阶段六个月，马上要进入第二阶段的图形化算法长期班。这批家长对编程、考级、赛事都已经有了解，问的问题会很具体，比如接下来学什么、课怎么排、能冲什么证。所以咱们自己得先把课程体系吃透，讲得清、讲得准。开始之前，先做个小调查，在座的各位老师，之前有没有接触过教培行业？如果接触过，是哪一类的？大家在屏幕上选一下。","interact":{"q":"之前曾接触过什么类型的教培工作？","at":"P01","options":["学科类","编程类","兴趣类","没接触过"],"answer":-1,"answers":[],"vote":true,"wrong":"直接继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":3,"stage":"课程体系·阶段1","p":"P02","topic":"","script":"这节课分两部分，第一部分是我们的课程体系，第二部分是我们的课程优势。进入正题之前，再请大家想一个问题。不管是平时带班，还是做续报沟通，大家觉得哪个更重要，是产品本身过硬，还是老师自己的专业能力足够强？这题没有标准答案，凭第一感觉选一个就好。","interact":{"q":"产品和个人能力哪个更重要？","at":"P02","options":["产品","个人能力"],"answer":-1,"answers":[],"vote":true,"wrong":"直接继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":4,"stage":"课程体系·阶段1","p":"P03","topic":"","script":"这题确实没有标准答案，两样都不能少。不过我个人更看重产品。产品是根基，产品不行，老师说得再好，孩子学不出效果，家长也不会买账。反过来，产品再好，老师自己说不清楚，家长也感受不到。所以这节课的目的，就是帮大家把产品吃透，知道我们的课程是怎么设计的、好在哪里，跟家长沟通的时候心里有底。下面先看第一部分，课程体系。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":5,"stage":"课程体系·阶段1","p":"P04","topic":"","script":"编程语言有很多种，核桃的课程体系里用的是三种，就是屏幕上的Scratch图形化、Python和C++。像Java这类语言，不在我们的体系里。这三门语言是按孩子的认知发展规律一级一级搭起来的。第一门是Scratch图形化，孩子拖拽积木就能写程序，不用记语法，成就感来得快，效果也容易做出来，主要培养的是编程兴趣和编程思维。第二门是Python，它是代码入门语言，语法简洁，应用也广，对孩子来说是从图形化过渡到真正写代码的一步。第三门是C++，它是竞赛语言，含金量最高。为什么这么说？信奥赛，也就是CSP-J和CSP-S，唯一指定的语言就是C++。它锻炼的是底层思维，对逻辑能力的训练最强，所以是升学加分的硬通货。大家再留意一下每张卡片中间的代码，写的是同一件事，下雨就带伞，不下雨就不带伞。逻辑完全一样，从积木到Python再到C++，表达方式越来越接近真正的程序。跟家长解释为什么要从图形化学起，这个例子很好用。好，考考大家，图形化、Python、C++都可以参加信奥赛，对还是错？","interact":{"q":"图形化、Python、C++都可以参加信奥赛？","at":"P04","options":["对","错"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":6,"stage":"课程体系·阶段1","p":"P05","topic":"","script":"那课程为什么要这样设置？我们从政策和市场两个角度来看。先看政策。国家层面越来越重视编程教育，信息科技已经正式进入中小学课标，科技特长生的招生比例也在逐年扩大。左边这张图显示，目前科技特长生全国覆盖率已经达到88%，涉及22个省份、4个直辖市和4个自治区。再看市场。家长对孩子编程启蒙的需求逐年增长，越来越多的家长知道了C++、知道了信奥赛。右边这组数据把家长分成三类，核心升学占38%，泛升学占26%，两者加起来是64%，非升学占36%。也就是说，多数家长让孩子学编程，或多或少都和升学有关。但有一个现实问题，直接学代码太枯燥，低龄、零基础的孩子很容易放弃。所以我们的体系从图形化起步，先把兴趣和思维建立起来，再一步步过渡到Python和C++。政策有导向，家长有需求，孩子也学得下去，这就是这套课程体系的出发点。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":7,"stage":"课程体系·阶段1","p":"P06","topic":"","script":"接下来看整体的课程规划。这张图大家一定要看懂，后面讲的内容都挂在这张图上。横着看是三种语言，图形化、Python和C++。竖着看分两条线，上面蓝色是思维线，下面橙色是科特线。两条线的方向一样，都是先学图形化，再学Python，最后衔接C++，但课程和课时安排都不一样，Python的阶段数也不同。思维线的图形化有两个阶段，叫思维S低和思维算法，Python有三个阶段，思维P1、P2、P3。科特线的图形化也是两个阶段，叫科特S低和科特算法，但Python只有两个阶段，科特P1和P2。咱们接手的家长，孩子刚学完的就是S低，接下来要进的就是算法这一阶段。到了C++就不再按思维、科特分了，而是看年级，6年级及以下进入趣味C1到C6，7年级及以上进入常规C1到C6。最后看图下方这行特殊需求。正常情况下，每个孩子都按这条路径一级一级往上学，不跳级，也不跨线。只有家长主动提出想跨级或者跨线，我们才根据孩子的情况针对性调整。注意，提出的一方是家长。课导不能因为觉得孩子学得好，就主动提跳级或者调整进度。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":8,"stage":"课程体系·阶段2","p":"P07","topic":"","script":"下面按语言逐个展开，先看图形化，从科特线开始。科特线图形化一共两个阶段，每个阶段半年，每周一次课。每个阶段60课时，一次课两课时。这60课时的构成大家一定要记牢，30课时软编课，加12课时硬编课，加12课时赛事强化课，再加6课时赛考辅导直播课。上课形式是实操课、硬件课、赛考课和综合项目。价格是优惠后3299元一个阶段，面向大众学员，师资是课导老师。赛考规划这一栏，我们跟家长同步的是学一年，也就是图形化两个阶段学完，孩子具备四张国家级证书的竞赛水平。这里要特别注意措辞，说的是具备这个水平，不是承诺学完一年一定拿到四张证书。跟家长沟通时，千万别说成保证拿证。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":9,"stage":"课程体系·阶段2","p":"P08","topic":"","script":"再看科特线图形化两个阶段分别学什么、达到什么效果。左边是第一阶段，Scratch科技特长生实验班，也就是孩子刚学完的这半年。从掌握顺序、循环两大程序结构，到能独立创作小动画、小游戏，再到结合数学、科学等知识做跨学科作品。考级对标CTL1级，同时规划一场白名单等国家级赛事，比如图灵杯、AILD智能设计大赛、全国青少年人工智能创新挑战赛。右边是第二阶段，叫算法进阶和赛考加强，正是咱们接下来要带的阶段。内容明显加深，第1到2个月学变量、逻辑和比较这些概念，第3到4个月学比较运算、条件循环这些程序结构和简单算法，第5到6个月学自定义代码块、新的数据类型和进阶算法。赛考上同样是一次考级加一次比赛，考级对标CTL3级，赛事对标图灵杯、全国青少年人工智能创新挑战赛这类白名单等国家级赛事。图的下方还有学习保证和退款保障，比如专业赛考规划、历年真题模拟训练，课程随时可退，前10个课时全额退课时费，教材和硬件拆封的需要扣除相关费用。家长问二阶段孩子能学到什么、能考什么，这张图就是你的答案。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":10,"stage":"课程体系·阶段2","p":"P09","topic":"","script":"接下来看图形化第一阶段每个月的学习节奏，也就是孩子刚学完的那半年是怎么上的。横着看是6个level，一个level对应一个月；竖着看是每个月的第一到第四周。规律是这样的，每个level的第一周、第二周都是软编课，第三周固定是硬编课，也就是硬件课。第四周比较特别，会解锁两次课，一共4个课时。单数level的第四周是一次软编课加一次赛事课，双数level是一次赛事课加一次赛事直播课。整个阶段加起来，软编课30课时，硬编课12课时，赛事课12课时，赛事直播课6课时，正好对上前面说的60课时。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":11,"stage":"课程体系·阶段2","p":"P10","topic":"","script":"这张是图形化第二阶段，也就是算法阶段的学习节奏。因为难度提升了，硬件课的位置做了调整。双数level和第一阶段一样，第三周是硬编课，第四周是赛事课加赛事直播课。单数level变了，第三周改成软编课，硬编课挪到第四周，和赛事课排在一起。总课时没有变，还是软编30、硬编12、赛事12、赛事直播6，但每周上什么课，两个阶段并不一样。为什么要强调这个？因为二阶段家长常会问，这周孩子上的是什么课，怎么跟上学期不一样。带算法阶段的老师一定要对照这张表看清楚，别给家长和孩子讲错了。好，来做一道题，第一阶段和第二阶段的课时分布一模一样，对还是错？","interact":{"q":"第一阶段和第二阶段的课时分布一模一样？","at":"P10","options":["对","错"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":12,"stage":"课程体系·阶段2","p":"P11","topic":"","script":"图形化科特线讲完了，再看思维线。思维线的图形化同样是两个阶段，每个阶段半年，每周一次课。区别在课时构成上，思维线每个阶段48课时，42课时软编课加6课时硬编课，没有赛事课。注意，没有赛事课不等于没有硬件课，思维线也有硬件课，上课形式是实操课、硬件课加综合项目。价格更低一些，优惠后2699元一个阶段，同样面向大众学员，师资也是课导老师。赛考规划上，思维线是半年具备YCL1级水平，学一年具备三张国家级证书的竞赛水平。大家把两条线对比着记，科特线60课时、3299元、一年四张；思维线48课时、2699元、一年三张。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":13,"stage":"课程体系·阶段2","p":"P12","topic":"","script":"思维线的学习节奏就简单多了，一阶段和二阶段的分布是一样的。每个level四周基本都是软编课，只有level2、level4和level6这三个月，第三周换成一次硬编课。算下来软编课42课时，硬编课6课时。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":14,"stage":"课程体系·阶段2","p":"P13","topic":"","script":"赛考规划这里，思维线和科特线也不一样。思维线第一阶段只规划一次考级，到第二阶段才同时规划一次考级和一场国家级或白名单比赛，比如图上的图灵杯。还有一个细节，细心的老师可能已经发现了，科特线对标的考级是CTL，思维线对标的考级是YCL。这两个名字很像，跟家长沟通时千万不能说混。我们马上来确认一下，科特线的赛事规划对标的是哪个考级？","interact":{"q":"科特线的赛事规划哪个考级？","at":"P13","options":["CTL","YCL"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":15,"stage":"课程体系·阶段3","p":"P14","topic":"","script":"图形化讲完了，接下来是Python。不管是思维线还是科特线，孩子学完图形化两个阶段之后，都会按规划进入Python。如果中途家长主动提出想直接跳到C++，那就另外做规划，大部分孩子还是按体系顺次升到Python。这里再强调一次，线是延续的。图形化是科特线，Python还是科特线；图形化是思维线，Python还是思维线。家长不能在图形化学完之后随意挑选科特Python或者思维Python。先看科特Python。课程名称叫Python语法和竞赛入门，价格4199元一个阶段，一共两个阶段。上课时间是周四、周五、周六，晚上6点45有课前直播，7点正式上课，每次课平均60到80分钟。一共60课时，6个单元，半年上完，其中软编36课时，硬编8课时，赛事4课时，赛事直播12课时。节奏上是一周解锁一次课，一次课两课时。有两个月例外，level3每周解锁三个课时，两课时软编加一课时赛事；level6每周解锁四个课时，两课时软编加两课时赛事。赛考规划和科特图形化一样，学一年具备四张国家级证书的竞赛水平。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":16,"stage":"课程体系·阶段3","p":"P15","topic":"","script":"为什么level3和level6每周要多解锁一到两个课时？看这张图就明白了。科特Python把考级和赛事的专项课集中放在了这两个月。level3是CTL1级的赛考专项突破课，每周在软编课之外再加1课时赛事直播课，四周一共4课时。level6是国家级或白名单赛事的专项课，每周加2课时赛事直播课，四周一共8课时。两块加起来，正好是前面说的12课时赛事直播课。相当于在考前把专项内容集中突破。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":17,"stage":"课程体系·阶段3","p":"P16","topic":"","script":"再看科特Python两个阶段的赛事规划。P1阶段规划一次CTL1级考级和一场白名单等国家级赛事，比如图灵杯、AILD智能设计大赛、全国青少年人工智能创新挑战赛。P2阶段同样是一次考级加一次赛事，考级对标CTL3级。一年两次考级、两场比赛，这就是前面说的学一年具备四张国家级证书水平。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":18,"stage":"课程体系·阶段3","p":"P17","topic":"","script":"再来看思维Python。首先周期不一样，思维Python一共三个阶段，也就是说思维线的孩子需要一年半才能把Python学完。课程名称同样叫Python语法和竞赛入门，价格是2999元一个阶段。上课时间和科特线一样，周四、周五、周六，晚上6点45课前直播，7点正式上课。课时是48课时，软编36课时，硬编8课时，赛事4课时，没有赛事直播课。节奏是一周解锁一次课，一次两课时，6个单元，每个阶段半年上完。赛考规划这一栏，思维Python学一年可以具备三张国家级证书的竞赛水平。具体的考级和赛事，我们后面赛事那一页再看。价格大家对比着记，科特Python是4199元，思维Python是2999元。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":19,"stage":"课程体系·阶段3","p":"P18","topic":"","script":"思维Python的课时安排看这张图。硬件课分布在level1、level2、level4和level5，赛事课在level2和level4。level3这个月全部是软编课，level6最后一周是综合项目，所以level3和level6这两个月都没有硬件课和赛事课。合起来就是软编36课时，硬编8课时，赛事4课时。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":20,"stage":"课程体系·阶段3","p":"P19","topic":"","script":"思维线Python的赛事怎么规划？左边是思维线Python的全阶段规划图。Python1的主题是人工智能初探，培养方向是代码编程基础；Python2是APP应用开发；Python3是游戏开发和算法。每个阶段都有20多个软硬件作品，考级对标YCL4到6级，赛事有图灵杯、AILD智能设计大赛、全国青少年人工智能创新挑战赛这些白名单等国家级赛事。图上方还写着，Python各阶段均有机会直升C++。但要注意，思维线课程里的赛事课比较少，所以思维线的孩子如果想报YCL考级或者国家级赛事，需要额外付费购买赛考辅导课程，也就是右边这个YCL Python4级提升营。这一页大家知道有这个提升营就可以，家长问到时能说出来。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":21,"stage":"课程体系·阶段4","p":"P20","topic":"","script":"Python学完，不管思维线还是科特线，都会进入C++。到了C++就不按思维、科特分了，而是按年级分班。6年级及以下进入趣味C++，课程名称是趣味C++信奥科特班；7年级及以上进入常规C++，课程名称是C++信奥科特班。所以上哪一个，是由孩子的年级决定的，不是家长任意挑选。两者价格一样，都是4399元。课时不一样，趣味C++是60课时，包含实操、硬件和赛考；常规C++是56课时，48课时实操课加8课时考前直播。两个都是6个阶段，趣味C++是QC1到QC6，常规C++是C1到C6，每阶段半年，一共三年。有人会以为趣味C++有硬件课所以更贵，其实价格完全一样。最后是页面底部这条红字规则，课导不主动跟家长提趣味C++和常规C++的区别，沟通时统一说C++。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":22,"stage":"课程体系·阶段4","p":"P21","topic":"","script":"这两张图把两条线的完整路径和对应赛考放在了一起，左边是思维线，右边是科特线。思维线是Scratch预备启航期之后，学三个阶段的Python，再进入C++的信奥基础期、信奥超越期，最后是信奥集训队。科特线是Scratch之后学两个阶段的Python，然后同样进入C++。图形化和Python阶段，思维线对标的考级是YCL，科特线对标的是CTL；到了C++阶段，两条线都往GESP、CSP-J、CSP-S、NOIP、NOI这条信奥路线走。这里请大家记住一句话，思维线和科特线是两个独立的体系，按规划不交叉。两条线有一个共同规则，写在图下方，Python阶段随时有机会直升C++。但还是那个原则，家长没有主动提跳级，老师尽量不要主动去讲。好，检验一下，思维线的Python一共分几个阶段？","interact":{"q":"思维线的Python分为几个阶段？","at":"P21","options":["1个阶段","2个阶段","3个阶段","4个阶段"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":23,"stage":"课程体系·阶段4","p":"P22","topic":"","script":"前面讲的都是以半年为周期的长期班。除了长期班，核桃还有短期集训营，作用就是集中冲刺、快速提升。屏幕上列了五种，小核桃营、语法速通班、算法提优班、CSP-J满分班和CSP-S满分班，每一种都有对应的适合人群，比如小核桃营面向三、四年级，语法速通班面向四年级以上，CSP-J满分班需要先测试。除此之外还有夏令营、冬令营这类集训。如果家长有需求，可以结合孩子的年龄、当前进度和家长的意愿，帮他规划合适的集训营，作为长期班的补充。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":24,"stage":"课程体系·阶段5","p":"P23","topic":"","script":"课程体系到这里就讲完了，我们知道了核桃有哪些课、每门课怎么排、对应什么赛考。接下来进入第二部分，看看我们的课程到底好在哪里。这部分是跟家长沟通时最常用的素材，尤其是家长担心孩子学不会、坐不住的时候。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":25,"stage":"课程体系·阶段5","p":"P24","topic":"","script":"什么样的课程才算好课程？就是中间这句话，让孩子愿意学、学得会。我们靠两样东西来实现，三大支柱和三层保障。三大支柱决定课程的专业高度，在上面一排。第一个是课程模式，直播加实操加实操监课。第二个是因材施教，分支教学加课前自动复习。第三个是学练考一体，每次课都对标赛考题型。三层保障决定孩子的学习效果，在下面一排。第一层是愿意学，靠剧情闯关、金币激励和软硬件结合。第二层是学得会，靠科学时间轴和专注力训练。第三层是额外价值，包括科普知识、校内学科结合和英语跟读。这张图是整个第二部分的地图，接下来我们一块一块展开。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":26,"stage":"课程体系·阶段5","p":"P25","topic":"","script":"先看第一个支柱，课程模式，由三部分组成。第一部分是直播课，包括课前直播和赛考直播，赛考直播也就是前面课表里的赛事直播课。第二部分是实操课，孩子以闯关的形式边学边练，有剧情互动、闯关特效和金币奖励。第三部分是实时跟课，孩子上课的时候，老师在核桃辅导的界面上能实时看到每个孩子的进度，也能看到某一个孩子的学习界面。孩子遇到不会的题，老师可以主动发起视频、语音连麦或者发文字消息。这里有个容易混的点，直播课只有课前直播和赛考直播两种，视频、语音连麦属于实时跟课，不属于直播课。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":27,"stage":"课程体系·阶段5","p":"P26","topic":"","script":"第二个支柱，因材施教，核心就是每个孩子的关卡都不一样，体现在两个地方。一个是课前复习。课程剧情里设置了回顾环节，会问孩子上次学的知识还记不记得，孩子如果点了有点忘了，系统就会自动回放这个知识点；记得的孩子就直接往下走。另一个是分支关卡。系统会根据孩子的学习时长自动分流，学得快的孩子会触发隐藏关卡，进行拔高训练；学得慢的孩子，会针对薄弱的知识点多练几次。这样慢的不掉队，快的也不会吃不饱。二阶段家长常担心算法变难孩子跟不上，这一点就可以讲给他听。那么问题来了，每次课所有孩子学习的关卡都是一样的吗？","interact":{"q":"每次课程所有孩子学习的关卡都是一样的？","at":"P26","options":["对","错"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":28,"stage":"课程体系·阶段5","p":"P27","topic":"","script":"第三个支柱，学练考一体。意思是学什么，就练什么，练的就是将来考什么，全程对标真实的赛考题型。屏幕上就是课程里的两类题，左边是选择题，右边是编程题，这正是孩子参加考级和比赛时会遇到的题型。平时课上练熟了，真到考试的时候，题型就不陌生。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":29,"stage":"课程体系·阶段5","p":"P28","topic":"","script":"讲完三大支柱，再看三层保障。第一层是愿意学，靠剧情闯关、金币激励和软硬件结合这三块。先说剧情闯关。每次课都是一个侦探剧情，孩子扮演小侦探去破案，写代码就像在找线索，学编程就像玩游戏。孩子是被剧情推着往下走的，自然更愿意学。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":30,"stage":"课程体系·阶段5","p":"P28-2","topic":"","script":"下面这段视频，展示的是课程里剧情闯关的实际画面。大家仔细看看，孩子在课上是怎么跟着剧情一步步闯关、一步步写代码的。以后家长问孩子平时怎么上课，你脑子里就有画面了。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":31,"stage":"课程体系·阶段5","p":"P28-3","topic":"","script":"第二块是金币激励。孩子完成关卡就能得到金币，解锁隐藏关卡还能拿奖励，还有排行榜可以跟同学比一比，孩子就有动力主动去学。接下来这段视频，大家看看金币是怎么发给孩子的，孩子在客户端里又是怎么使用金币的。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":32,"stage":"课程体系·阶段5","p":"P28-4","topic":"","script":"第三块是软硬件结合。编程不只是屏幕里的代码，孩子还要搭机器人、连传感器，让代码控制真实世界里的东西，这种成就感跟单纯写程序完全不一样。我们的课程里，图形化、Python和趣味C++都有硬件课，只有常规C++没有。以图形化算法阶段为例，这一阶段科特线有6次硬件课，思维线有3次。左边这六个作品，触摸电子琴、红外感应垃圾桶、密码收纳盒、智能调速风扇、语音识别助手和智能电子秤，展示的是图形化算法阶段科特线的硬件课内容，也就是二阶段科特线的孩子接下来要做的作品。家长问二阶段做什么硬件，可以直接拿这几个作品举例。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":33,"stage":"课程体系·阶段5","p":"P29","topic":"","script":"第二层保障是学得会，关键在于每次课的时间都经过精心设计。这张图横轴是课程时间，几条曲线分别是学习体验、学习内容和剧情内容，整体是按这个年龄段孩子的注意力曲线来设计的。前5分钟是唤醒，用背景介绍和知识回顾把孩子带进状态。中间是高专注的学练阶段，剧情不断推进，在注意力容易下滑的时候设置悬念或冲突，再加入体验关卡、合作这类交互，把孩子的兴趣重新拉起来。最后5分钟收束，做知识总结和破案对峙，让孩子带着成就感下课。所以孩子坐得住、学得进去，不是靠硬撑，而是课程本身的节奏在帮他。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":34,"stage":"课程体系·阶段5","p":"P30","topic":"","script":"第三层保障是额外价值。第一个是科普知识，每次课都会融入科普小知识，比如屏幕上讲的手机计步原理，孩子学编程的同时知识面也在拓宽，不只是写代码。第二个是和校内学科相结合，编程题会跟校内知识打通，比如图上的负数。数学思维和编程能力互相促进，家长会觉得报一门顶两门。另外，前面总览里提到的英语跟读，也是额外价值的一部分。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":35,"stage":"课程体系·阶段6","p":"P31","topic":"","script":"课程优势讲完了，再看怎么用到实际沟通里。下面是三个跟课程相关的家长常见异议。第一个，家长说，新学期的算法学不会怎么办？孩子从S低升到算法，难度确实上来了，这是二阶段家长最常问的一句。回答分四步。第一步共情，先理解家长的担心，不要一上来就反驳。第二步归因，告诉家长课程模式跟上学期一样，孩子已经适应了，老师也会一直关注。第三步亮方案，讲四重保障，课程模式、因材施教、学练考一体和时间轴。第四步给信心，结合孩子上学期的表现，告诉家长孩子基础扎实，大概率没有问题。参考话术可以这样说，家长您好，特别理解您的担心，咱们的课程跟上学期是一样的，直播加实操加老师监课，孩子卡壳老师会立刻介入；因材施教，慢的多练，快的解锁高难度；学练考一体，每次课都对标赛考；时间轴也符合孩子的注意力曲线。孩子上学期成绩优异，基础扎实，肯定能学会。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":36,"stage":"课程体系·阶段6","p":"P32","topic":"","script":"第二个异议，家长说，我家孩子专注力差，能学吗？图形化阶段的孩子年纪普遍比较小，这个担心很常见。回答也是四步。第一步共情，告诉家长专注力差是这个年龄段的普遍问题，不是孩子的错。第二步转观点，专注力差的孩子，反而更需要我们这样的课程，专注力本身就是我们课程的核心卖点。第三步亮方案，讲四个手段，强互动、监课、剧情闯关和时间轴。第四步给效果，告诉家长上几次课就能看到孩子专注力明显提升。参考话术是这样的，家长您好，专注力差的孩子特别多，这不是孩子的问题，关键看课程设计得好不好。我们的课程专门解决专注力，实时监课，老师能看到孩子的屏幕，发现走神立刻提醒；剧情闯关，每次课都是侦探故事，孩子想知道结局，自然坐得住；时间轴设计上，每15分钟就有一次节奏变化。上几次课您就会发现，孩子的专注力明显提升了。对续费家长，你还可以结合孩子第一阶段的实际上课表现来讲，会更有说服力。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":37,"stage":"课程体系·阶段6","p":"P33","topic":"","script":"第三个异议，有些家长会说，课程全是动画，是不是太简单了？回答同样分四步。第一步认同，先肯定家长观察得仔细，动画确实是我们的特点，目的是让孩子愿意学。第二步澄清，动画只是外壳，内容是有深度的。第三步亮证据，每次课都对标赛事题型，有核桃专属题库，历年真题全覆盖，难度分层适配，还有硬件课让孩子搭机器人，有真实的工程深度。第四步给信心，学得快的孩子会解锁高难度和隐藏关卡，不会吃不饱。最后用一句话收住，动画是兴趣的入口，内容是真材实料。对二阶段家长，你还可以拿孩子接下来要学的算法内容，以及对应的考级、赛事目标来佐证，课程到底简不简单，家长一听就明白。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":38,"stage":"课程体系·阶段6","p":"P34","topic":"","script":"最后把课程优势总结一下，就是三大支柱加三层保障。三大支柱决定专业高度。课程模式是直播加实操加实操监课。因材施教是关卡差异化加课前自动复习，慢的不落下，快的解锁隐藏关卡。学练考一体是每次课对标赛考，配合OJ题库，历年真题全覆盖，分层适配。三层保障决定学习效果。愿意学靠剧情闯关、金币和软硬件结合；学得会靠精心设计的时间轴和四重保障；额外价值是科普、学科结合和英语跟读。这张总结页建议大家记在本子上，前面三个异议的回答，素材基本都从这里来。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":39,"stage":"课程体系·阶段6","p":"P35","topic":"","script":"再给大家看看我们的赛事成绩，这是家长很关心的硬指标。第一张，CTL全国青少年计算思维等级测评，核桃学员C++一级通过率高达94.84%，累计获得CTL证书的核桃学员达到30692人。第二张，2025年教育部白名单赛事，核桃助力104050名学员拿下科技特长生入场券，获奖人数位居青少年编程行业第一，是第二、第三名编程机构的总和。第三张，全国信息学奥林匹克竞赛，2026年NOI成绩出炉，金牌的二分之一在核桃，一共是29金、109银、66铜。家长问到核桃的赛考实力，这些数据可以直接用。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":40,"stage":"课程体系·阶段6","p":"P36","topic":"","script":"再来看家长的真实反馈。第一位家长说，核桃的课程真不错，孩子都喜欢，动画和知识真正抓住了孩子的兴趣，之前买的课都是一味地教，孩子听不下去。第二位家长提到，自己跟孩子讲编程会用到数学和英语，孩子为了学好编程，最近一个多月英语也赶上来了。第三位家长发现孩子的逻辑性越来越强，问问题越来越少，问的时候也能自己把问题说清楚，还没上小学就能算30以内的加减法。第四位家长说，以前孩子做数学题一遇到问题就来问，现在会先自己思考。这些都是课程设计在孩子身上的实际体现。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":41,"stage":"课程体系·阶段6","p":"P37","topic":"","script":"最后，分享核桃的教育理念，让每个孩子爱学习、会学习，让优质的教育触手可及。前面讲的愿意学、学得会，其实都是在落实这句话。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":42,"stage":"课程体系·阶段6","p":"P38","topic":"","script":"好啦，这节课程体系的内容就到这里。最后请大家扫一扫屏幕上的二维码，填写课程体系的调研问卷，把你的真实感受告诉我们。填写完成后，在下面的互动题里确认一下。","interact":{"q":"是否已完成问卷填写？","at":"P38","options":["是","否"],"answer":0,"answers":[0],"vote":false,"wrong":"直接继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"课程体系·阶段1","q":"核桃的课程体系包含哪些编程语言？","options":[{"k":"A","t":"C+ 思维Python？","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F09","type":"本章综合测试题","chapter":"课程体系·全章","q":"决定课程的专业高度的有哪些？","options":[{"k":"A","t":"课程模式"},{"k":"B","t":"因材施教"},{"k":"C","t":"学练考一体"},{"k":"D","t":"软硬件结合"}],"answer":"ABC","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F10","type":"本章综合测试题","chapter":"课程体系·全章","q":"学习的过程中课导老师可以根据孩子的学习情况，主动提出跳级或者调整进度？","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"}],"timing":{"P01":{"sents":["大家好，上节课咱们把课导工作的全流程过了一遍，这节课来讲核桃的课程体系和学科特点。","先说说这节课为什么重要。","咱们接手的家长，孩子已经在核桃学完了第一阶段六个月，马上要进入第二阶段的图形化算法长期班。","这批家长对编程、考级、赛事都已经有了解，问的问题会很具体，比如接下来学什么、课怎么排、能冲什么证。","所以咱们自己得先把课程体系吃透，讲得清、讲得准。","开始之前，先做个小调查，在座的各位老师，之前有没有接触过教培行业？","如果接触过，是哪一类的？","大家在屏幕上选一下。"],"durs":[8.856,3.024,8.976,10.8,5.448,7.032,2.76,2.376]},"P02":{"sents":["这节课分两部分，第一部分是我们的课程体系，第二部分是我们的课程优势。","进入正题之前，再请大家想一个问题。","不管是平时带班，还是做续报沟通，大家觉得哪个更重要，是产品本身过硬，还是老师自己的专业能力足够强？","这题没有标准答案，凭第一感觉选一个就好。"],"durs":[7.176,3.72,10.464,4.176]},"P03":{"sents":["这题确实没有标准答案，两样都不能少。","不过我个人更看重产品。","产品是根基，产品不行，老师说得再好，孩子学不出效果，家长也不会买账。","反过来，产品再好，老师自己说不清楚，家长也感受不到。","所以这节课的目的，就是帮大家把产品吃透，知道我们的课程是怎么设计的、好在哪里，跟家长沟通的时候心里有底。","下面先看第一部分，课程体系。"],"durs":[4.104,2.712,7.488,5.664,10.848,3.576]},"P04":{"sents":["编程语言有很多种，核桃的课程体系里用的是三种，就是屏幕上的Scratch图形化、Python和C++。","像Java这类语言，不在我们的体系里。","这三门语言是按孩子的认知发展规律一级一级搭起来的。","第一门是Scratch图形化，孩子拖拽积木就能写程序，不用记语法，成就感来得快，效果也容易做出来，主要培养的是编程兴趣和编程思维。","第二门是Python，它是代码入门语言，语法简洁，应用也广，对孩子来说是从图形化过渡到真正写代码的一步。","第三门是C++，它是竞赛语言，含金量最高。","为什么这么说？","信奥赛，也就是CSP-J和CSP-S，唯一指定的语言就是C++。","它锻炼的是底层思维，对逻辑能力的训练最强，所以是升学加分的硬通货。","大家再留意一下每张卡片中间的代码，写的是同一件事，下雨就带伞，不下雨就不带伞。","逻辑完全一样，从积木到Python再到C++，表达方式越来越接近真正的程序。","跟家长解释为什么要从图形化学起，这个例子很好用。","好，考考大家，图形化、Python、C++都可以参加信奥赛，对还是错？"],"durs":[9.312,3.648,5.424,12.888,10.488,4.92,1.872,7.392,6.984,8.256,7.44,5.208,7.128]},"P05":{"sents":["那课程为什么要这样设置？","我们从政策和市场两个角度来看。","先看政策。","国家层面越来越重视编程教育，信息科技已经正式进入中小学课标，科技特长生的招生比例也在逐年扩大。","左边这张图显示，目前科技特长生全国覆盖率已经达到88%，涉及22个省份、4个直辖市和4个自治区。","再看市场。","家长对孩子编程启蒙的需求逐年增长，越来越多的家长知道了C++、知道了信奥赛。","右边这组数据把家长分成三类，核心升学占38%，泛升学占26%，两者加起来是64%，非升学占36%。","也就是说，多数家长让孩子学编程，或多或少都和升学有关。","但有一个现实问题，直接学代码太枯燥，低龄、零基础的孩子很容易放弃。","所以我们的体系从图形化起步，先把兴趣和思维建立起来，再一步步过渡到Python和C++。","政策有导向，家长有需求，孩子也学得下去，这就是这套课程体系的出发点。"],"durs":[2.64,3.384,1.872,10.608,11.208,1.872,8.112,13.32,6.24,7.296,8.928,7.176]},"P06":{"sents":["接下来看整体的课程规划。","这张图大家一定要看懂，后面讲的内容都挂在这张图上。","横着看是三种语言，图形化、Python和C++。","竖着看分两条线，上面蓝色是思维线，下面橙色是科特线。","两条线的方向一样，都是先学图形化，再学Python，最后衔接C++，但课程和课时安排都不一样，Python的阶段数也不同。","思维线的图形化有两个阶段，叫思维S低和思维算法，Python有三个阶段，思维P1、P2、P3。","科特线的图形化也是两个阶段，叫科特S低和科特算法，但Python只有两个阶段，科特P1和P2。","咱们接手的家长，孩子刚学完的就是S低，接下来要进的就是算法这一阶段。","到了C++就不再按思维、科特分了，而是看年级，6年级及以下进入趣味C1到C6，7年级及以上进入常规C1到C6。","最后看图下方这行特殊需求。","正常情况下，每个孩子都按这条路径一级一级往上学，不跳级，也不跨线。","只有家长主动提出想跨级或者跨线，我们才根据孩子的情况针对性调整。","注意，提出的一方是家长。","课导不能因为觉得孩子学得好，就主动提跳级或者调整进度。"],"durs":[2.904,5.592,5.016,6.144,11.16,10.224,9.792,7.056,12.504,3.408,7.224,7.08,2.88,5.76]},"P07":{"sents":["下面按语言逐个展开，先看图形化，从科特线开始。","科特线图形化一共两个阶段，每个阶段半年，每周一次课。","每个阶段60课时，一次课两课时。","这60课时的构成大家一定要记牢，30课时软编课，加12课时硬编课，加12课时赛事强化课，再加6课时赛考辅导直播课。","上课形式是实操课、硬件课、赛考课和综合项目。","价格是优惠后3299元一个阶段，面向大众学员，师资是课导老师。","赛考规划这一栏，我们跟家长同步的是学一年，也就是图形化两个阶段学完，孩子具备四张国家级证书的竞赛水平。","这里要特别注意措辞，说的是具备这个水平，不是承诺学完一年一定拿到四张证书。","跟家长沟通时，千万别说成保证拿证。"],"durs":[5.232,5.856,3.72,12.408,5.736,7.656,10.704,8.232,3.984]},"P08":{"sents":["再看科特线图形化两个阶段分别学什么、达到什么效果。","左边是第一阶段，Scratch科技特长生实验班，也就是孩子刚学完的这半年。","从掌握顺序、循环两大程序结构，到能独立创作小动画、小游戏，再到结合数学、科学等知识做跨学科作品。","考级对标CTL1级，同时规划一场白名单等国家级赛事，比如图灵杯、AILD智能设计大赛、全国青少年人工智能创新挑战赛。","右边是第二阶段，叫算法进阶和赛考加强，正是咱们接下来要带的阶段。","内容明显加深，第1到2个月学变量、逻辑和比较这些概念，第3到4个月学比较运算、条件循环这些程序结构和简单算法，第5到6个月学自定义代码块、新的数据类型和进阶算法。","赛考上同样是一次考级加一次比赛，考级对标CTL3级，赛事对标图灵杯、全国青少年人工智能创新挑战赛这类白名单等国家级赛事。","图的下方还有学习保证和退款保障，比如专业赛考规划、历年真题模拟训练，课程随时可退，前10个课时全额退课时费，教材和硬件拆封的需要扣除相关费用。","家长问二阶段孩子能学到什么、能考什么，这张图就是你的答案。"],"durs":[5.448,7.032,10.992,12.96,7.176,17.4,13.416,15.576,6.408]},"P09":{"sents":["接下来看图形化第一阶段每个月的学习节奏，也就是孩子刚学完的那半年是怎么上的。","横着看是6个level，一个level对应一个月；","竖着看是每个月的第一到第四周。","规律是这样的，每个level的第一周、第二周都是软编课，第三周固定是硬编课，也就是硬件课。","第四周比较特别，会解锁两次课，一共4个课时。","单数level的第四周是一次软编课加一次赛事课，双数level是一次赛事课加一次赛事直播课。","整个阶段加起来，软编课30课时，硬编课12课时，赛事课12课时，赛事直播课6课时，正好对上前面说的60课时。"],"durs":[8.136,4.104,3.216,8.904,4.968,8.784,12.096]},"P10":{"sents":["这张是图形化第二阶段，也就是算法阶段的学习节奏。","因为难度提升了，硬件课的位置做了调整。","双数level和第一阶段一样，第三周是硬编课，第四周是赛事课加赛事直播课。","单数level变了，第三周改成软编课，硬编课挪到第四周，和赛事课排在一起。","总课时没有变，还是软编30、硬编12、赛事12、赛事直播6，但每周上什么课，两个阶段并不一样。","为什么要强调这个？","因为二阶段家长常会问，这周孩子上的是什么课，怎么跟上学期不一样。","带算法阶段的老师一定要对照这张表看清楚，别给家长和孩子讲错了。","好，来做一道题，第一阶段和第二阶段的课时分布一模一样，对还是错？"],"durs":[5.208,4.248,7.824,7.656,10.056,2.112,6.816,6.648,6.768]},"P11":{"sents":["图形化科特线讲完了，再看思维线。","思维线的图形化同样是两个阶段，每个阶段半年，每周一次课。","区别在课时构成上，思维线每个阶段48课时，42课时软编课加6课时硬编课，没有赛事课。","注意，没有赛事课不等于没有硬件课，思维线也有硬件课，上课形式是实操课、硬件课加综合项目。","价格更低一些，优惠后2699元一个阶段，同样面向大众学员，师资也是课导老师。","赛考规划上，思维线是半年具备YCL1级水平，学一年具备三张国家级证书的竞赛水平。","大家把两条线对比着记，科特线60课时、3299元、一年四张；","思维线48课时、2699元、一年三张。"],"durs":[3.768,6.144,9.84,9.984,9.168,9.384,7.32,5.28]},"P12":{"sents":["思维线的学习节奏就简单多了，一阶段和二阶段的分布是一样的。","每个level四周基本都是软编课，只有level2、level4和level6这三个月，第三周换成一次硬编课。","算下来软编课42课时，硬编课6课时。"],"durs":[6.048,9.24,4.728]},"P13":{"sents":["赛考规划这里，思维线和科特线也不一样。","思维线第一阶段只规划一次考级，到第二阶段才同时规划一次考级和一场国家级或白名单比赛，比如图上的图灵杯。","还有一个细节，细心的老师可能已经发现了，科特线对标的考级是CTL，思维线对标的考级是YCL。","这两个名字很像，跟家长沟通时千万不能说混。","我们马上来确认一下，科特线的赛事规划对标的是哪个考级？"],"durs":[4.344,10.92,10.392,4.704,6.048]},"P14":{"sents":["图形化讲完了，接下来是Python。","不管是思维线还是科特线，孩子学完图形化两个阶段之后，都会按规划进入Python。","如果中途家长主动提出想直接跳到C++，那就另外做规划，大部分孩子还是按体系顺次升到Python。","这里再强调一次，线是延续的。","图形化是科特线，Python还是科特线；","图形化是思维线，Python还是思维线。","家长不能在图形化学完之后随意挑选科特Python或者思维Python。","先看科特Python。","课程名称叫Python语法和竞赛入门，价格4199元一个阶段，一共两个阶段。","上课时间是周四、周五、周六，晚上6点45有课前直播，7点正式上课，每次课平均60到80分钟。","一共60课时，6个单元，半年上完，其中软编36课时，硬编8课时，赛事4课时，赛事直播12课时。","节奏上是一周解锁一次课，一次课两课时。","有两个月例外，level3每周解锁三个课时，两课时软编加一课时赛事；","level6每周解锁四个课时，两课时软编加两课时赛事。","赛考规划和科特图形化一样，学一年具备四张国家级证书的竞赛水平。"],"durs":[3.528,7.728,9.576,3.216,4.104,4.008,6.504,2.28,8.04,10.776,11.064,4.416,6.984,5.64,7.248]},"P15":{"sents":["为什么level3和level6每周要多解锁一到两个课时？","看这张图就明白了。","科特Python把考级和赛事的专项课集中放在了这两个月。","level3是CTL1级的赛考专项突破课，每周在软编课之外再加1课时赛事直播课，四周一共4课时。","level6是国家级或白名单赛事的专项课，每周加2课时赛事直播课，四周一共8课时。","两块加起来，正好是前面说的12课时赛事直播课。","相当于在考前把专项内容集中突破。"],"durs":[5.064,2.256,5.52,10.272,8.784,5.184,3.912]},"P16":{"sents":["再看科特Python两个阶段的赛事规划。","P1阶段规划一次CTL1级考级和一场白名单等国家级赛事，比如图灵杯、AILD智能设计大赛、全国青少年人工智能创新挑战赛。","P2阶段同样是一次考级加一次赛事，考级对标CTL3级。","一年两次考级、两场比赛，这就是前面说的学一年具备四张国家级证书水平。"],"durs":[3.744,13.296,6.312,7.776]},"P17":{"sents":["再来看思维Python。","首先周期不一样，思维Python一共三个阶段，也就是说思维线的孩子需要一年半才能把Python学完。","课程名称同样叫Python语法和竞赛入门，价格是2999元一个阶段。","上课时间和科特线一样，周四、周五、周六，晚上6点45课前直播，7点正式上课。","课时是48课时，软编36课时，硬编8课时，赛事4课时，没有赛事直播课。","节奏是一周解锁一次课，一次两课时，6个单元，每个阶段半年上完。","赛考规划这一栏，思维Python学一年可以具备三张国家级证书的竞赛水平。","具体的考级和赛事，我们后面赛事那一页再看。","价格大家对比着记，科特Python是4199元，思维Python是2999元。"],"durs":[2.304,9.192,7.536,8.784,8.52,6.696,7.296,4.728,8.52]},"P18":{"sents":["思维Python的课时安排看这张图。","硬件课分布在level1、level2、level4和level5，赛事课在level2和level4。","level3这个月全部是软编课，level6最后一周是综合项目，所以level3和level6这两个月都没有硬件课和赛事课。","合起来就是软编36课时，硬编8课时，赛事4课时。"],"durs":[3.672,7.728,11.232,5.808]},"P19":{"sents":["思维线Python的赛事怎么规划？","左边是思维线Python的全阶段规划图。","Python1的主题是人工智能初探，培养方向是代码编程基础；","Python2是APP应用开发；","Python3是游戏开发和算法。","每个阶段都有20多个软硬件作品，考级对标YCL4到6级，赛事有图灵杯、AILD智能设计大赛、全国青少年人工智能创新挑战赛这些白名单等国家级赛事。","图上方还写着，Python各阶段均有机会直升C++。","但要注意，思维线课程里的赛事课比较少，所以思维线的孩子如果想报YCL考级或者国家级赛事，需要额外付费购买赛考辅导课程，也就是右边这个YCL Python4级提升营。","这一页大家知道有这个提升营就可以，家长问到时能说出来。"],"durs":[3.408,3.888,6.168,2.928,3.048,15.744,5.4,16.704,5.904]},"P20":{"sents":["Python学完，不管思维线还是科特线，都会进入C++。","到了C++就不按思维、科特分了，而是按年级分班。","6年级及以下进入趣味C++，课程名称是趣味C++信奥科特班；","7年级及以上进入常规C++，课程名称是C++信奥科特班。","所以上哪一个，是由孩子的年级决定的，不是家长任意挑选。","两者价格一样，都是4399元。","课时不一样，趣味C++是60课时，包含实操、硬件和赛考；","常规C++是56课时，48课时实操课加8课时考前直播。","两个都是6个阶段，趣味C++是QC1到QC6，常规C++是C1到C6，每阶段半年，一共三年。","有人会以为趣味C++有硬件课所以更贵，其实价格完全一样。","最后是页面底部这条红字规则，课导不主动跟家长提趣味C++和常规C++的区别，沟通时统一说C++。"],"durs":[5.472,5.544,7.08,6.912,5.544,4.104,6.552,7.176,10.704,6.336,10.896]},"P21":{"sents":["这两张图把两条线的完整路径和对应赛考放在了一起，左边是思维线，右边是科特线。","思维线是Scratch预备启航期之后，学三个阶段的Python，再进入C++的信奥基础期、信奥超越期，最后是信奥集训队。","科特线是Scratch之后学两个阶段的Python，然后同样进入C++。","图形化和Python阶段，思维线对标的考级是YCL，科特线对标的是CTL；","到了C++阶段，两条线都往GESP、CSP-J、CSP-S、NOIP、NOI这条信奥路线走。","这里请大家记住一句话，思维线和科特线是两个独立的体系，按规划不交叉。","两条线有一个共同规则，写在图下方，Python阶段随时有机会直升C++。","但还是那个原则，家长没有主动提跳级，老师尽量不要主动去讲。","好，检验一下，思维线的Python一共分几个阶段？"],"durs":[8.304,11.256,6.288,8.04,10.152,7.32,7.344,6.408,4.848]},"P22":{"sents":["前面讲的都是以半年为周期的长期班。","除了长期班，核桃还有短期集训营，作用就是集中冲刺、快速提升。","屏幕上列了五种，小核桃营、语法速通班、算法提优班、CSP-J满分班和CSP-S满分班，每一种都有对应的适合人群，比如小核桃营面向三、四年级，语法速通班面向四年级以上，CSP-J满分班需要先测试。","除此之外还有夏令营、冬令营这类集训。","如果家长有需求，可以结合孩子的年龄、当前进度和家长的意愿，帮他规划合适的集训营，作为长期班的补充。"],"durs":[3.816,6.792,20.688,4.056,10.224]},"P23":{"sents":["课程体系到这里就讲完了，我们知道了核桃有哪些课、每门课怎么排、对应什么赛考。","接下来进入第二部分，看看我们的课程到底好在哪里。","这部分是跟家长沟通时最常用的素材，尤其是家长担心孩子学不会、坐不住的时候。"],"durs":[7.752,5.04,8.136]},"P24":{"sents":["什么样的课程才算好课程？","就是中间这句话，让孩子愿意学、学得会。","我们靠两样东西来实现，三大支柱和三层保障。","三大支柱决定课程的专业高度，在上面一排。","第一个是课程模式，直播加实操加实操监课。","第二个是因材施教，分支教学加课前自动复习。","第三个是学练考一体，每次课都对标赛考题型。","三层保障决定孩子的学习效果，在下面一排。","第一层是愿意学，靠剧情闯关、金币激励和软硬件结合。","第二层是学得会，靠科学时间轴和专注力训练。","第三层是额外价值，包括科普知识、校内学科结合和英语跟读。","这张图是整个第二部分的地图，接下来我们一块一块展开。"],"durs":[3,4.248,5.088,4.656,4.8,4.848,4.896,4.656,5.808,4.824,6.624,5.64]},"P25":{"sents":["先看第一个支柱，课程模式，由三部分组成。","第一部分是直播课，包括课前直播和赛考直播，赛考直播也就是前面课表里的赛事直播课。","第二部分是实操课，孩子以闯关的形式边学边练，有剧情互动、闯关特效和金币奖励。","第三部分是实时跟课，孩子上课的时候，老师在核桃辅导的界面上能实时看到每个孩子的进度，也能看到某一个孩子的学习界面。","孩子遇到不会的题，老师可以主动发起视频、语音连麦或者发文字消息。","这里有个容易混的点，直播课只有课前直播和赛考直播两种，视频、语音连麦属于实时跟课，不属于直播课。"],"durs":[4.512,8.808,8.472,11.664,6.912,10.44]},"P26":{"sents":["第二个支柱，因材施教，核心就是每个孩子的关卡都不一样，体现在两个地方。","一个是课前复习。","课程剧情里设置了回顾环节，会问孩子上次学的知识还记不记得，孩子如果点了有点忘了，系统就会自动回放这个知识点；","记得的孩子就直接往下走。","另一个是分支关卡。","系统会根据孩子的学习时长自动分流，学得快的孩子会触发隐藏关卡，进行拔高训练；","学得慢的孩子，会针对薄弱的知识点多练几次。","这样慢的不掉队，快的也不会吃不饱。","二阶段家长常担心算法变难孩子跟不上，这一点就可以讲给他听。","那么问题来了，每次课所有孩子学习的关卡都是一样的吗？"],"durs":[7.368,2.208,11.52,3,2.232,8.64,4.632,3.816,6.144,5.328]},"P27":{"sents":["第三个支柱，学练考一体。","意思是学什么，就练什么，练的就是将来考什么，全程对标真实的赛考题型。","屏幕上就是课程里的两类题，左边是选择题，右边是编程题，这正是孩子参加考级和比赛时会遇到的题型。","平时课上练熟了，真到考试的时候，题型就不陌生。"],"durs":[2.952,7.752,10.176,5.04]},"P28":{"sents":["讲完三大支柱，再看三层保障。","第一层是愿意学，靠剧情闯关、金币激励和软硬件结合这三块。","先说剧情闯关。","每次课都是一个侦探剧情，孩子扮演小侦探去破案，写代码就像在找线索，学编程就像玩游戏。","孩子是被剧情推着往下走的，自然更愿意学。"],"durs":[3.48,6.336,2.088,9.648,4.44]},"P28-2":{"sents":["下面这段视频，展示的是课程里剧情闯关的实际画面。","大家仔细看看，孩子在课上是怎么跟着剧情一步步闯关、一步步写代码的。","以后家长问孩子平时怎么上课，你脑子里就有画面了。"],"durs":[5.688,7.08,5.256]},"P28-3":{"sents":["第二块是金币激励。","孩子完成关卡就能得到金币，解锁隐藏关卡还能拿奖励，还有排行榜可以跟同学比一比，孩子就有动力主动去学。","接下来这段视频，大家看看金币是怎么发给孩子的，孩子在客户端里又是怎么使用金币的。"],"durs":[2.304,10.68,8.04]},"P28-4":{"sents":["第三块是软硬件结合。","编程不只是屏幕里的代码，孩子还要搭机器人、连传感器，让代码控制真实世界里的东西，这种成就感跟单纯写程序完全不一样。","我们的课程里，图形化、Python和趣味C++都有硬件课，只有常规C++没有。","以图形化算法阶段为例，这一阶段科特线有6次硬件课，思维线有3次。","左边这六个作品，触摸电子琴、红外感应垃圾桶、密码收纳盒、智能调速风扇、语音识别助手和智能电子秤，展示的是图形化算法阶段科特线的硬件课内容，也就是二阶段科特线的孩子接下来要做的作品。","家长问二阶段做什么硬件，可以直接拿这几个作品举例。"],"durs":[2.64,11.976,7.704,7.2,19.2,5.28]},"P29":{"sents":["第二层保障是学得会，关键在于每次课的时间都经过精心设计。","这张图横轴是课程时间，几条曲线分别是学习体验、学习内容和剧情内容，整体是按这个年龄段孩子的注意力曲线来设计的。","前5分钟是唤醒，用背景介绍和知识回顾把孩子带进状态。","中间是高专注的学练阶段，剧情不断推进，在注意力容易下滑的时候设置悬念或冲突，再加入体验关卡、合作这类交互，把孩子的兴趣重新拉起来。","最后5分钟收束，做知识总结和破案对峙，让孩子带着成就感下课。","所以孩子坐得住、学得进去，不是靠硬撑，而是课程本身的节奏在帮他。"],"durs":[6.264,11.712,6.048,13.728,7.056,7.44]},"P30":{"sents":["第三层保障是额外价值。","第一个是科普知识，每次课都会融入科普小知识，比如屏幕上讲的手机计步原理，孩子学编程的同时知识面也在拓宽，不只是写代码。","第二个是和校内学科相结合，编程题会跟校内知识打通，比如图上的负数。","数学思维和编程能力互相促进，家长会觉得报一门顶两门。","另外，前面总览里提到的英语跟读，也是额外价值的一部分。"],"durs":[2.976,12.288,7.584,6.12,5.832]},"P31":{"sents":["课程优势讲完了，再看怎么用到实际沟通里。","下面是三个跟课程相关的家长常见异议。","第一个，家长说，新学期的算法学不会怎么办？","孩子从S低升到算法，难度确实上来了，这是二阶段家长最常问的一句。","回答分四步。","第一步共情，先理解家长的担心，不要一上来就反驳。","第二步归因，告诉家长课程模式跟上学期一样，孩子已经适应了，老师也会一直关注。","第三步亮方案，讲四重保障，课程模式、因材施教、学练考一体和时间轴。","第四步给信心，结合孩子上学期的表现，告诉家长孩子基础扎实，大概率没有问题。","参考话术可以这样说，家长您好，特别理解您的担心，咱们的课程跟上学期是一样的，直播加实操加老师监课，孩子卡壳老师会立刻介入；","因材施教，慢的多练，快的解锁高难度；","学练考一体，每次课都对标赛考；","时间轴也符合孩子的注意力曲线。","孩子上学期成绩优异，基础扎实，肯定能学会。"],"durs":[4.344,4.416,4.728,7.104,1.872,5.328,8.184,7.8,8.184,12.6,4.296,3.768,3.576,4.896]},"P32":{"sents":["第二个异议，家长说，我家孩子专注力差，能学吗？","图形化阶段的孩子年纪普遍比较小，这个担心很常见。","回答也是四步。","第一步共情，告诉家长专注力差是这个年龄段的普遍问题，不是孩子的错。","第二步转观点，专注力差的孩子，反而更需要我们这样的课程，专注力本身就是我们课程的核心卖点。","第三步亮方案，讲四个手段，强互动、监课、剧情闯关和时间轴。","第四步给效果，告诉家长上几次课就能看到孩子专注力明显提升。","参考话术是这样的，家长您好，专注力差的孩子特别多，这不是孩子的问题，关键看课程设计得好不好。","我们的课程专门解决专注力，实时监课，老师能看到孩子的屏幕，发现走神立刻提醒；","剧情闯关，每次课都是侦探故事，孩子想知道结局，自然坐得住；","时间轴设计上，每15分钟就有一次节奏变化。","上几次课您就会发现，孩子的专注力明显提升了。","对续费家长，你还可以结合孩子第一阶段的实际上课表现来讲，会更有说服力。"],"durs":[4.944,5.376,1.968,7.104,8.736,6.912,6.552,9.36,8.232,6.552,4.776,4.896,7.344]},"P33":{"sents":["第三个异议，有些家长会说，课程全是动画，是不是太简单了？","回答同样分四步。","第一步认同，先肯定家长观察得仔细，动画确实是我们的特点，目的是让孩子愿意学。","第二步澄清，动画只是外壳，内容是有深度的。","第三步亮证据，每次课都对标赛事题型，有核桃专属题库，历年真题全覆盖，难度分层适配，还有硬件课让孩子搭机器人，有真实的工程深度。","第四步给信心，学得快的孩子会解锁高难度和隐藏关卡，不会吃不饱。","最后用一句话收住，动画是兴趣的入口，内容是真材实料。","对二阶段家长，你还可以拿孩子接下来要学的算法内容，以及对应的考级、赛事目标来佐证，课程到底简不简单，家长一听就明白。"],"durs":[5.952,2.16,8.232,4.632,13.656,6.864,6,11.64]},"P34":{"sents":["最后把课程优势总结一下，就是三大支柱加三层保障。","三大支柱决定专业高度。","课程模式是直播加实操加实操监课。","因材施教是关卡差异化加课前自动复习，慢的不落下，快的解锁隐藏关卡。","学练考一体是每次课对标赛考，配合OJ题库，历年真题全覆盖，分层适配。","三层保障决定学习效果。","愿意学靠剧情闯关、金币和软硬件结合；","学得会靠精心设计的时间轴和四重保障；","额外价值是科普、学科结合和英语跟读。","这张总结页建议大家记在本子上，前面三个异议的回答，素材基本都从这里来。"],"durs":[5.688,2.976,4.176,7.608,7.848,3.024,4.416,4.248,4.608,7.344]},"P35":{"sents":["再给大家看看我们的赛事成绩，这是家长很关心的硬指标。","第一张，CTL全国青少年计算思维等级测评，核桃学员C++一级通过率高达94.84%，累计获得CTL证书的核桃学员达到30692人。","第二张，2025年教育部白名单赛事，核桃助力104050名学员拿下科技特长生入场券，获奖人数位居青少年编程行业第一，是第二、第三名编程机构的总和。","第三张，全国信息学奥林匹克竞赛，2026年NOI成绩出炉，金牌的二分之一在核桃，一共是29金、109银、66铜。","家长问到核桃的赛考实力，这些数据可以直接用。"],"durs":[5.616,15.6,16.08,12.84,4.872]},"P36":{"sents":["再来看家长的真实反馈。","第一位家长说，核桃的课程真不错，孩子都喜欢，动画和知识真正抓住了孩子的兴趣，之前买的课都是一味地教，孩子听不下去。","第二位家长提到，自己跟孩子讲编程会用到数学和英语，孩子为了学好编程，最近一个多月英语也赶上来了。","第三位家长发现孩子的逻辑性越来越强，问问题越来越少，问的时候也能自己把问题说清楚，还没上小学就能算30以内的加减法。","第四位家长说，以前孩子做数学题一遇到问题就来问，现在会先自己思考。","这些都是课程设计在孩子身上的实际体现。"],"durs":[2.64,11.856,10.104,12.144,7.056,4.296]},"P37":{"sents":["最后，分享核桃的教育理念，让每个孩子爱学习、会学习，让优质的教育触手可及。","前面讲的愿意学、学得会，其实都是在落实这句话。"],"durs":[8.208,4.968]},"P38":{"sents":["好啦，这节课程体系的内容就到这里。","最后请大家扫一扫屏幕上的二维码，填写课程体系的调研问卷，把你的真实感受告诉我们。","填写完 const PASS = 0.6; // 合格线：取自「合格线与重学规则」表「阶段合格线 60%」

/* ---------- 课程结构 ---------- */
/* 部门 / SKU 可见性：标「通用」或未标的页所有人可见；带标签的页只有选中的部门/SKU 命中才显示（多选任一命中即可） */
const normTag = t => String(t||'').replace(/1部/g,'一部').replace(/2部/g,'二部').replace(/苍穹顶/g,'苍穹鼎').replace(/\s/g,'');
const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return (!CFG.depts || tagOk(p.dept, st && st.depts)) && (!CFG.skus || tagOk(p.sku, st && st.skus)); }
let STAGES = [];
function buildStages(){
  STAGES = [];
  for (const p of DATA.pages) {
    if (!pageVisible(p)) continue;
    let s = STAGES.find(x => x.name === p.stage);
    if (!s) { s = {name:p.stage, num:+(/阶段\s*(\d+)/.exec(p.stage)||[0,STAGES.length+1])[1], pages:[]}; STAGES.push(s); }
    s.pages.push(p);
  }
  for (const s of STAGES) s.quiz = DATA.qs.filter(q => q.type === '阶段练习题' && +(/阶段\s*(\d+)/.exec(q.chapter)||[])[1] === s.num);
}
let st = null; buildStages();

/* 每个关卡的过程数据：play=实际播放秒数 occ=占用秒数 pn/ps=暂停次数/秒 kn/ks=卡顿次数/秒 */
function stat(k){ st.stat = st.stat || {}; return st.stat[k] = st.stat[k] || {play:0, occ:0, pn:0, ps:0, kn:0, ks:0}; }
function curKey(){ return st.view === 'quiz' ? (st.quiz === 'final' ? 'f' : st.quiz) : st.cur.s; }
function stageStatusText(k){
  const done = k === 'f' ? !!(st.final && st.final.pass) : !!st.passed[k];
  if (done) return '已完成';
  if ((st.view === 'learn' || st.view === 'quiz') && String(curKey()) === String(k)) return '进行中';
  const s = st.stat && st.stat[k];
  return s && s.occ > 0 ? '进行中' : '未开始';
}
function snapshot(online){

/* 第二个 Webhook：学员第一次出现时，在「学员实时状态」表新建他的那一行 */
const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid}, ev, snapshot(online));
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

  au.src = 'audio/'+p.p+'.mp3';
  au.currentTime = 0; lastT = 0;
  report({event:'进入页面', stage:stageLabel(st.cur.s), page:p.p, detail:p.topic});
  $('#veilBtn').onclick = play;
  $('#pp').onclick = () => playing ? au.pause() : play();
  $('#again').onclick = () => { au.currentTime = 0; play(); };
  $('#prev').onclick = () => goPage(st.cur.p-1);
  $('#next').onclick = () => nextPage();
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => goPage(+b.dataset.pg));
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rate = +b.dataset.r; au.playbackRate = rate;
    document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on', x===b)); });
  if (autoplay) play();
}
function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});
  showQuiz('final');
}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = () => askInteract(p); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div></div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`});
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
