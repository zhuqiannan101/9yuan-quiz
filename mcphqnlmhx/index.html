<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>中价课工作流程</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%2740%27%3E%3Ctext x=%27100%27 y=%2725%27 fill=%27%23bbb%27 font-size=%2716%27 text-anchor=%27middle%27 font-family=%27sans-serif%27%3EPPT 加载中…%3C/text%3E%3C/svg%3E") center/200px 40px no-repeat;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}
</style>

<script>
const DATA = {"pages":[{"row":2,"stage":"阶段1·业务链路","p":"P01","topic":"封面：中价课工作流程——课导岗位完整工作链路与核心能力","script":"接下来我们正式进入今天的内容，给大家讲解中价课课导完整工作流程。\n大家先看屏幕上这个标题：中价课工作流程。咱们今天这节课，核心就是围绕中价课课导这个岗位展开。\n我们会一起梳理清楚，这个岗位完整的工作链路是什么样的，同时也会拆解，想要把课导工作做好，我们需要具备哪些核心能力项。","interact":null,"sku":"","dept":""},{"row":3,"stage":"阶段1·业务链路","p":"P02","topic":"目录：业务链路 / 用户分析 / 工作属性 / 工作流程","script":"这节课会从四个方面给大家完整的介绍清楚该岗位的工作流程：\n第一个：我们的业务链路是怎么发展的？我们工作的上下游都有哪些团队？\n第二个：我们的用户都是谁？我们和用户之间有怎样的关系？\n第三个：如果你想做这个岗位，需要具备哪些能力和动作？\n第四个：完整带一期班，我们的工作流程是什么样的？来看一道题，本节课从哪四个方面介绍中价课课导岗位？","interact":{"q":"本节课从哪四个方面介绍中价课课导岗位？","at":"P02","options":["产品功能、价格体系、渠道投放、促销策略","招聘要求、培训体系、考核标准、晋升通道","业务链路、用户分析、工作属性、工作流程","电话话术、微信模板、邮件规范、面访流程"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":4,"stage":"阶段1·业务链路","p":"P03","topic":"第一章：业务链路（章节页）","script":"首先我们来看第一部分：我们的业务链路有哪些？","interact":null,"sku":"","dept":""},{"row":5,"stage":"阶段1·业务链路","p":"P04","topic":"业务链路分析：投放获客→中价课课导（6 周服务+续报）→长期班课导；质检+赛事并行协同","script":"我们来看这一页，业务链路分析。首先大家要先找准自己的定位：我们是中价课课导团队。\n我们核心负责孩子为期 6 周课程的学习辅导、日常跟进、学情反馈，还有续报转化。前期投放团队，线上、线下渠道去获客招生。招进来的学员，流转到我们手上，由我们承接这 6 周的陪伴辅导。等我们这 6 周中价课服务结束之后，一部分认可课程、愿意继续学的孩子，就会流转到后方长期班课导团队。长期班课导，承接孩子正式课的跟进、答疑、续报，他们的续报周期大概是半年一次；而我们中价课的续报节奏是，大约 4 周左右就会启动续报。\n所以大家能感受到，我们岗位是承上启下的关键一环。家长愿意选择继续学，一方面是孩子上课体验好、能看到当下的学习收获，另一方面，也是信任编程学习长期的价值，而这个价值传递，就是我们的工作。\n\n大家再看这张图，和我们并行配合的还有两个部门：赛事部门、质检部门。\n我们先理解质检部门，它就像咱们团队的安全员。我们日常和家长沟通、电访、发消息，话术、服务动作都有规范。质检会抽查我们的通话、聊天记录，帮我们及时发现沟通里的风险点，规避违规问题，保护大家，也保护我们的业务。\n而赛事部门，是我们非常重要的协同伙伴。很多家长送孩子学编程，目标就是赛事考级、拿证书。后续我们给家长规划长期学习路径、讲升学和能力规划的时候，赛事部门会给我们提供赛事政策、备考信息、考级安排这些支撑，帮我们给家长讲清楚长期学习的出口。\n\n整条链路串起来就是：投放团队获客 → 交到我们中价课课导做 服务、做价值传递和续报 → 意向学员流转长期班课导；全程有质检把控服务合规，赛事部门给我们做专业内容支撑。","interact":null,"sku":"","dept":""},{"row":6,"stage":"阶段2·用户分析","p":"P05","topic":"第二章：用户分析（章节页）","script":"接下来是第二部分：我们要了解我们的用户，俗话说知己知彼，方能百战百胜","interact":null,"sku":"","dept":""},{"row":7,"stage":"阶段2·用户分析","p":"P06","topic":"我们的用户：5-15 岁小初学生（Scratch→Python→C++ 差异化教学）+ 家长","script":"接下来我们来看下一个问题：我们的用户是谁？\n大家看屏幕，我们的学员集中在5-15 岁的小初学生。这个年龄段跨度其实很大，前后差了整整 10 岁。\n这也就意味着，我们面对的孩子，认知水平、接受能力完全不一样，课程内容也会做区分。\n课程体系从图形化 Scratch，再到 Python，最后过渡到 C++，我们会根据孩子的年龄、所在年级，做差异化的教学安排。\n\n这里也给大家提个重点：我们课导在跟进的时候，不能用同一套方式去对待所有孩子。低龄孩子和高年级孩子，沟通节奏、学情反馈、引导方式都要不一样。后续我们跟进学情、和家长沟通的时候，也要结合孩子所在阶段的课程特点去讲。我们的用户不是单一的只有孩子，还有家长，因为家长是孩子学习的主要负责人，而且在我们续报期给孩子报名的也是家长，我们和家长之间的关系建立也是非常重要的。来看一道题，中价课的学员集中在哪个年龄段？","interact":{"q":"中价课的学员集中在哪个年龄段？","at":"P06","options":["3-6 岁幼儿园","成年人","16-18 岁高中生","5-15 岁的小初学生"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":8,"stage":"阶段2·用户分析","p":"P07","topic":"三角关系：核桃-家长（付费客户）-孩子（用户）；课导要做记录+翻译","script":"接下来我们来看这个三角关系。刚刚我们说用户是孩子，但除了服务孩子，还有一个非常关键的群体 —— 家长。\n道理很简单：家长是付费客户。给大家举个例子：孩子在商场看上一件衣服，特别想要，但最后买单的一定是家长。家长不只会看孩子喜不喜欢，还要综合考量这件衣服值不值、性价比高不高。\n\n放到我们课程里也是一样，孩子喜欢课程只是基础。我们的工作，一边要给孩子做好辅导，另一边，还要做好两件事：记录 + 翻译。\n记录，就是把孩子每一步的学习过程、成长变化留存下来；\n翻译，就是做转化的工作。家长不会跟着一起上课，看不懂代码、不明白编程知识点，我们就要把孩子的学习成果，翻译成家长听得懂、能感知到的价值，帮家长看懂编程学习长期的意义。\n\n大家看这个三角形：核桃编程、作为客户的家长、作为用户的孩子，三者形成稳定的三角关系。\n这就要求我们一定要做到双向沟通：面对孩子，耐心细致辅导，帮孩子吃透知识点、保持学习兴趣；面对家长，及时同步学情、反馈进步，把学习效果清晰传递出去。只有家长实实在在看到孩子的成长，认可课程价值，后续的续报才会更顺利。","interact":null,"sku":"","dept":""},{"row":9,"stage":"阶段2·用户分析","p":"P08","topic":"用户从哪里来：抖音直播、视频号、更多渠道拓展中","script":"那这些用户都是从哪里来呢？其实前面讲了我们的用户主要来自线上和线下不同渠道，除了搜索或刷到核桃直播间或视频，其他报名的用户可能是听到同事家的孩子在学习、学习里老师推荐、孩子听到同学在学自己也想学的等等。右边这个图片就是真实核桃的直播间，大家可以了解一下","interact":null,"sku":"","dept":""},{"row":10,"stage":"阶段2·用户分析","p":"P09","topic":"家长五大诉求：兴趣试探/体验产品/硬件动手/助力升学/咨询长期费用——一视同仁+个性化跟进","script":"接下来我们来看，家长选择给孩子报名编程，背后的诉求主要分为这五大类。\n大家要先清楚一点：不同家长，对编程的认知程度差别很大。有的家长认知很高，本身就认可编程的价值，体验完觉得合适，就会考虑长期报名；也有一部分家长，一开始只是抱着试一试、体验课程的心态，暂时没有报正式课的打算。\n\n但是这里有一个核心原则：不管家长最初的想法是什么，我们都要同等对待。我们没办法提前预判哪位家长最后一定会续报、哪位一定不报名。所以我们的服务必须做到两件事：一视同仁，同时个性化跟进\n不管我们刚加上家长微信的时候，对方态度热情，还是比较冷淡，我们的服务标准、耐心程度都不能打折扣。很多时候，正是我们持续稳定、高质量的服务，慢慢打动家长，改变他原本的想法，最终愿意为长期课程买单。\n\n我们一起来看这五个诉求：\n第一，兴趣试探与能力提升：很多家长就是想让孩子接触新东西，锻炼逻辑思维；\n第二，体验核桃产品：单纯想试一下咱们的课程、上课模式，看看孩子适不适合；\n第三，硬件动手锻炼：看重实操硬件，希望孩子动手、动脑结合；\n第四，助力升学：这也是很多高年级家长最核心的目标，想通过赛事、考级给孩子增加竞争力；\n第五，咨询长期费用：本身有长期学习意向，先来了解课程、价格、学习规划。\n\n大家后续和家长沟通的时候，要先听、先判断，找准这位家长最在意的点，针对性去传递价值，而不是一套话术讲给所有人。来看一道题，家长给孩子报名编程的诉求包括？","interact":{"q":"家长给孩子报名编程的诉求包括？【多选】","at":"P09","options":["兴趣试探与能力提升","体验核桃产品","硬件动手锻炼","助力升学","帮家长辅导学校作业"],"answer":0,"answers":[0,1,2,3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":11,"stage":"阶段3·课导工作属性与核心能力","p":"P10","topic":"第三章：中价课课导工作属性（章节页）","script":"第三部分是关于工作的属性，了解我们需要具备哪些能力和要求","interact":null,"sku":"","dept":""},{"row":12,"stage":"阶段3·课导工作属性与核心能力","p":"P11","topic":"你印象中的老师形象？（互动引入）","script":"那我想先问问大家一个问题：你印象当中的老师是什么样的？\n\n地中海？手背后站在门后面？严肃？站在讲台上讲课？给学生答疑解惑？","interact":null,"sku":"","dept":""},{"row":13,"stage":"阶段3·课导工作属性与核心能力","p":"P12","topic":"核桃课导老师关键词：亲切+耐心","script":"我们刚刚了解完家长和孩子，那接下来大家想一想：核桃的课导老师，应该是什么样子的？\n给大家标了两个关键词：亲切 + 耐心。\n\n我们面对的是 5-15 岁的孩子，还有形形色色的家长。对孩子来说，我们要足够亲切，拉近距离，让孩子愿意主动跟我们说上课遇到的难题、愿意分享自己的作品；同时一定要有耐心，孩子卡壳、反复出错的时候，不能急躁，慢慢引导他找到思路。\n\n放到和家长沟通上也是一样。有的家长对编程不了解，会反复问很多基础问题，也有的家长比较焦虑，担心孩子跟不上。这时候亲切、耐心的沟通状态，会让家长觉得我们靠谱、放心，愿意信任我们给到的学习建议。\n\n亲切和耐心不是表面客气，是我们所有服务动作的底色。不管是辅导孩子写代码，还是跟家长同步学情、解答疑问，这两点，是我们做好课导岗位最基础、也最重要的特质。","interact":null,"sku":"","dept":""},{"row":14,"stage":"阶段3·课导工作属性与核心能力","p":"P13","topic":"核桃课导 vs 传统老师：服务+销售双属性（40% 服务 / 60% 销售）","script":"核桃课导和大家印象里传统老师，既有联系，也有很关键的区别。\n\n先看传统学校老师，核心只有服务属性：上课、布置作业、答疑辅导，是没有销售属性的。\n而咱们核桃的课导，是服务属性 + 销售属性两者兼具。\n\n当然二者有一个最重要的共同点：不管是学校老师，还是我们，初心都是一样的 —— 心里装着孩子，希望孩子学好、看到进步，孩子遇到难题我们都会尽力去帮。这份对孩子负责任的服务之心，是相通的。\n\n但大家一定要清楚我们岗位的特殊性：我们的绩效只和续报挂钩；从岗位属性来看，服务属性占 40%，销售属性占 60%。\n40% 的服务，就是我们的重实操：孩子代码写不出来、思路卡壳、题目看不懂，我们点对点跟进辅导，陪着孩子练，直到弄懂学会，做好学情陪伴和反馈。\n\n那 60% 的销售属性怎么理解？大家要明白，短短 6 周的中价课，只能试探孩子兴趣、看到初步变化，很难实现能力大幅提升，也支撑不了赛事、考级、升学规划。\n所以我们的责任，就是在看到孩子适合学、愿意学之后，帮家长规划完整的长期学习路线，专业地给家长介绍长期正式课，也就是我们说的 “专业选核桃”。\n而学校里孩子是按年级自然升学，不需要做课程推荐，自然没有销售属性。\n这一点，是我们所有人都要先吃透的岗位本质。来看一道题，核桃课导的岗位属性构成是？","interact":{"q":"核桃课导的岗位属性构成是？","at":"P13","options":["全部是销售","全部是服务","服务占 40%，销售属性占 60%","服务占 60%，销售占 40%"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":15,"stage":"阶段3·课导工作属性与核心能力","p":"P14","topic":"服务属性三角色：孩子的老师·家长的教育专家·共同的朋友","script":"刚刚我们说了岗位 40% 是服务属性，那服务属性落地，就是我们要做好这三个角色。\n\n第一个角色，是孩子的老师。我们要给孩子答疑解惑，辅导代码、解决上课卡点，也会和孩子多沟通，了解他上课的状态、学习感受，陪伴他一步步把编程学明白。\n\n第二个角色，是家长的教育专家。在少儿编程这块，我们比家长掌握更完整的体系、赛事信息和学习节奏，所以大家要有专业自信。我们要给家长及时同步孩子的学情反馈，同时结合孩子的情况，帮他规划短期的学习安排，还有长期的编程成长路线，给到专业的建议。\n\n第三个角色，是他们共同的朋友。我们也是家长和孩子之间的纽带。一方面把孩子课堂上真实的学习状态传递给家长，另一方面也理解家长的教育焦虑和期待，搭建好双方沟通的桥梁，和孩子、家长都建立信任。","interact":null,"sku":"","dept":""},{"row":16,"stage":"阶段3·课导工作属性与核心能力","p":"P15","topic":"孩子的老师：辅导答疑·批改作业·学情记录","script":"我们作为孩子的老师，服务不是上完课就结束，核心落地三件事：\n第一是辅导答疑：孩子上课、写作业过程中卡壳、有不懂的问题，我们随时跟进解答；\n第二是批改作业：每一份课后作品、练习题我们都会逐一批改反馈，明确问题、给到优化方向；\n第三就是学情记录：我们会把孩子整段学习过程里的课堂表现、作业成绩、阶段掌握情况，全部沉淀记录到专属学情表里。\n这份记录既是我们后续针对性调整教学节奏、帮孩子补短板的依据，也能完整留存孩子的成长路径，让家长清晰看到孩子每一步的进步。","interact":null,"sku":"","dept":""},{"row":17,"stage":"阶段3·课导工作属性与核心能力","p":"P16","topic":"家长的教育专家：反馈学情·编程赋能——做好「翻译官」","script":"很多家长本身不懂编程，看不懂代码，不知道孩子敲这些积木块到底在学什么、有什么用。所以我们要做好两件核心事：反馈学情、编程赋能，本质上是做好「翻译官」。\n\n第一，我们要把专业内容翻译成家长能听懂的话传递给家长。不用跟家长讲复杂的代码术语，而是讲孩子收获：锻炼逻辑思维、专注力、拆解问题的能力，讲清楚编程对校内学科、赛事、升学的长期价值。\n第二，不只是聊编程。家长在孩子教育上有困惑，不管是校内学科学习、习惯培养，还是家庭教育方面的难题，我们都可以给到专业、贴合孩子情况的参考建议，不局限在编程本身。\n\n很多家长看不懂编程代码，我们就要当好这个翻译：把看不懂的代码，翻译成孩子真实的成长和进步 —— 比如这节课孩子学会了拆解任务、学会排查 bug、思考更有条理，把成果具象化，让家长看得见收获。\n\n当家长能持续看懂孩子的成长、认可学习价值，才愿意给孩子做长期学习规划，愿意持续跟着课程学习。这也是我们稳定拉高续报率非常关键的一环。","interact":null,"sku":"","dept":""},{"row":18,"stage":"阶段3·课导工作属性与核心能力","p":"P17","topic":"共同的朋友：搭建家长与孩子沟通的桥梁，建立信任","script":"来到最后这一层服务身份 ——是孩子和家长共同的朋友。\n\n很多家庭都会有这样的情况：家长辅导孩子学习的时候容易着急、产生矛盾。而我们，就可以成为孩子和家长之间沟通的一座桥梁。\n我们和家长、孩子的关系，不该只局限于上课、聊学习这件事。在不触碰法规、公司红线，不做过度承诺的前提下，我们可以建立温暖的情感连接：和妈妈聊聊孩子日常成长、生活小事；和爸爸聊聊行业、教育大环境等等。\n\n道理很简单：越是熟悉、了解对方，我们越能读懂这个家庭真实的痛点和需求，做到知己知彼。后续不管是学情沟通，还是规划学习路线，我们都能精准给到贴合他家情况的建议。\n\n我们不想做一个只通知上课、发消息的冰冷工具人。当家长感受到老师是有温度、真心在意孩子，孩子也愿意信任我们的时候，信任基础就建立起来了。这份信任，也是我们稳住续报非常核心的底气。\n所以，我们的服务，就是希望能真正融入到孩子的学习和家庭的成长里，当好这个老师、专家和朋友。来看一道题，作为「共同的朋友」，正确的做法是？","interact":{"q":"作为「共同的朋友」，正确的做法是？","at":"P17","options":["和妈妈聊孩子日常成长、和爸爸聊行业教育大环境——建立温暖情感连接","只发上课提醒和作业通知，做冰冷的消息推送工具人","只聊编程学习，其他话题一概不碰也不多说","过度承诺搞定一切，用大话快速赢得家长的信任"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":19,"stage":"阶段3·课导工作属性与核心能力","p":"P18","topic":"老师五心：爱心·责任心·用心·耐心·慧心","script":"希望各位老师在接下来跟家长孩子沟通中保持5心：\n有爱心，是真心喜欢孩子，把他们当成自己的弟弟妹妹来看。\n有责任心，是把孩子学有所成当成自己的头等大事。\n有耐心，就是不管孩子问多少遍，我们都会一遍遍讲明白。\n用心，我们全身心投入，关注每个孩子的进步。\n慧心，我们用专业的方法，巧妙地引导孩子爱上编程、学好编程。","interact":null,"sku":"","dept":""},{"row":20,"stage":"阶段3·课导工作属性与核心能力","p":"P19","topic":"销售属性：理想的续报期（问一句就报名）","script":"第二个具备的属性是销售属性：\n我们理想的续报期是什么样的？你打电话给家长，问家长想给孩子报名吗？\n家长说报名！哇，这个续报也太简单了，但是大家觉得现实吗？\n是的，不太现实，那现实是怎样的呢？","interact":null,"sku":"","dept":""},{"row":21,"stage":"阶段3·课导工作属性与核心能力","p":"P20","topic":"现实：每一单都不容易——异议、犹豫、观望是常态","script":"大家可能对销售的想象是很理想化的：我们一问家长，家长直接爽快报名、主动续报，沟通简单顺利。\n但真实的情况并不是这样，现实里每一单都不容易。我们会遇到各种各样的反馈，最常听到的就是 “我再考虑考虑”，电话、微信沟通里，异议、犹豫、观望都是常态。\n\n这里不是让大家硬催单、强行推销。恰恰相反：正是因为续报没有那么容易，前面那一套有温度、专业的服务才格外重要。\n家长不会因为我们一句 “要不要报名” 就买单，而是因为在长期相处里，认可我们作为老师的专业、信任我们给出的教育建议、愿意和我们沟通，才愿意选择继续跟着课程学习。\n销售不是我们单独去做的一件事，而是前面所有服务积累之后，水到渠成的结果。我们先把服务做扎实，才有底气去沟通规划、推进续报。","interact":null,"sku":"","dept":""},{"row":22,"stage":"阶段3·课导工作属性与核心能力","p":"P21","topic":"如何缩小理想和现实的差距？","script":"如何缩小理想和现实的差距呢?","interact":null,"sku":"","dept":""},{"row":23,"stage":"阶段3·课导工作属性与核心能力","p":"P22","topic":"老师 A vs 老师 B 案例：前置服务思维——服务与销售相辅相成","script":"我们一起来看这个非常贴近日常沟通的案例。家长就简简单单问一句：老师，今晚 7 点上课吗？\n\n大家可以先想一想，如果是朋友问咱们晚上要不要吃烧烤，我们简单回答 “去或者不去” 就够了。但面对家长，我们不能只做到被动应答。\n我们看老师 A 的回复：是的孩子妈妈，七点准时开课。这句话没有错，信息给到了，但是很平淡，没有亮点，只回答了家长当下的问题，没有预判家长后面的顾虑。\n\n再看老师 B 的回复：是的孩子妈妈，咱们今晚 7 点准时开课，您到时候记得提醒孩子进入到课堂，我会全程在后台跟进孩子学习情况，孩子上课遇到问题或困难，我后台可以跟孩子发消息、语音连麦给孩子辅导，您把孩子交给我就行。\n\n这里核心就是前置服务思维。我们预判到这位家长大概率是第一次上课，心里会悄悄担心：上课的时候孩子遇到难题怎么办？有没有老师管？\n我们不等家长主动来问，主动提前把这个顾虑打消。这就好比我们逛街口渴，主动去店里要一杯水，和店家看见我们累了，主动递上一杯水，体验完全不一样。后者是主动的、贴心的服务。\n\n好处有两点：\n第一，家长沟通体验更好，能实实在在感受到老师的责任心，心里踏实；\n第二，帮我们规避后续的麻烦。如果我们现在不说，上课中途家长突然发来消息问能不能辅导，那时候我们正在同步跟进多个孩子，很容易来不及回复，家长就容易觉得被冷落。能提前预判、提前讲清楚的问题，就不要留到后面。\n\n很多新人会觉得，我这一段只是在做服务，没有在销售。但大家要记住：服务和销售，相辅相成。\n在这段贴心的回复里面，其实我们已经把核桃编程的核心优势传递出去了：我们不是单纯的录播、大班直播课，上课期间有专属老师全程后台跟进，可以一对一消息、语音连麦辅导。\n这个就是和普通直播课最大的区别。我们没有硬推课程，但是在服务的过程当中，自然而然把课程价值传递给家长。\n\n家长感受到我们的专业、细心、有责任心，后续到续报沟通的时候，愿意信任我们。条件合适的家长愿意续报；就算当下预算或者规划暂时不考虑，也愿意静下心听完我们的规划和建议。\n所有的续报铺垫，都藏在这一句一句日常沟通里。来看一道题，老师 B 的回复比老师 A 好在哪里？","interact":{"q":"老师 B 的回复比老师 A 好在哪里？","at":"P22","options":["前置服务思维——主动预判并打消家长顾虑，顺势传递全程跟进的优势","话更多——字数多显得热情，家长更容易被打动","直接报价——价格透明不藏着掖着，家长更放心","承诺效果——敢保证学习结果，给家长吃定心丸"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":24,"stage":"阶段3·课导工作属性与核心能力","p":"P23","topic":"课导必备五大能力：沟通·学习·小灶课·销售技巧·灵活度","script":"那我们作为课导老师，必须具备五大核心能力。\n\n第一点就是我们的沟通能力，这是咱们课导老师最基础、最核心的必备能力。\n首先，我们要能够清晰地介绍产品的特点、优势和价值，和家长沟通的时候抓住重点，逻辑清晰，不冗长、不啰嗦。\n第二，我们要善于运用生动的语言、恰当的比喻或者真实学员案例，让课程、服务更有吸引力和感染力，让家长直观感受到孩子学编程之后实实在在的进步，也能更加清楚看懂咱们课程的价值。\n\n第二点，学习能力。\n第一，我们要持续把课程专业知识、还有用户心理这些内容融合在一起，搭建属于自己完整的知识体系，并且灵活用到日常和家长、孩子的沟通里面。不是只会背知识点，而是懂课程、懂家长的顾虑，懂孩子的学习规律。\n第二，在平时工作当中，要养成复盘总结的习惯。不管是成功续报的好案例，还是遇到异议没有成交的情况，我们都要去分析背后的原因，多学习优秀同事的经验，持续调整自己的沟通方式和跟进策略，不断提高我们的工作效率和沟通质量。\n\n第三点，小灶课能力\n第一，我们要结合孩子当下的认知水平去设计小灶课内容，把复杂的编程知识点化繁为简，让孩子听得懂、跟得上，提升课堂参与感，上完课有满满的收获感。\n第二，每一次小灶课结束之后，一定要做好复盘迭代，多借鉴优秀老师的授课经验，持续打磨、优化我们自己的授课方式。\n第三，课上多用互动，课后做好持续跟进，牢牢抓住孩子，提升学员粘性，让孩子愿意持续跟着我们学，为长期学习、后续续报打好基础。\n\n第四点，销售技巧。大家不要一听到销售就觉得是硬推，我们的销售是建立在专业和服务之上的。\n第一，沟通的时候要突出咱们课程的价值，把核桃编程和其他课程差异化的地方讲清楚；\n第二，慢慢建立家长对我们的信任，合适的时候展示我们的教学资质、学员获奖案例、学习成果，用真实成果说话；\n第三，做好长期的情感维系，多关注孩子每阶段的学习状态，主动给到针对性的学习关心和学习建议，慢慢拉近距离。\n\n第五点，灵活度。\n我们没有一套万能话术可以适配所有家庭，要根据每个家长、每个孩子的真实需求，灵活组合咱们课程的优势，给到个性化的解决方案。举个例子，家长纠结价格、觉得贵的时候，不要死磕价格，我们可以灵活地给家长拆解课程配套服务、长期学习的性价比，结合当下的优惠活动去沟通，而不是死板地照搬话术。\n\n总结一下，这五大能力是相辅相成的：沟通是基础，学习是我们持续成长的底气，小灶课用来抓孩子、建立好感，销售技巧帮我们传递价值，灵活度让我们适配不同家庭。五项能力一起做好，我们的服务和续报才能稳稳落地。","interact":null,"sku":"","dept":""},{"row":25,"stage":"阶段4·工作流程·数据·岗位要求","p":"P24","topic":"第四章：中价课课导工作流程（章节页）","script":"这是我们最后讲到的第四点：中价课课导的工作流程","interact":null,"sku":"","dept":""},{"row":26,"stage":"阶段4·工作流程·数据·岗位要求","p":"P25","topic":"六周工作流程：报名体验课→全程服务跟进→续报长期班（第五周启动续报）","script":"接下来这一页，我们来讲课导的主要工作流程，整个流程一共分为六周，核心链路就是：家长报名体验课，我们全程跟进服务，最终目标是引导孩子续报长期班。\n\n我们先看第一周：会前三天开始进人。进人阶段大家一定要记住，从加微信这一步做起，及时添加家长微信。这是家长对我们的第一印象，第一印象直接决定家长后面愿不愿意回复我们消息，所以亲和力，在这个阶段就要展现出来。到了第一周周四我们开家长会；周五是第一课的课前直播，周六是第二课的课前直播，周日我们要做补课、回访以及复习课的跟进。\n\n然后是第二周：周一到周四我们重点做补课、回访、复习课；周五安排第三课的课前直播，周六是第四课的课前直播，周日开展搭建课。\n\n到第三周：周一到周四，我们持续补课、回访，做视频跟进，提前提醒孩子打卡，双份任务同步跟进；还要协助家长做硬件拼接，检查充电、蓝牙连接、配件数量有没有问题，同步做好复习课。周五安排硬件课，周六搭建课，周日没有额外课程任务。\n\n第四周：周一到周四依旧是补课、回访，通过电话或者视频的方式跟进，同样协助家长做硬件拼接，核对充电、蓝牙、配件数量。周五硬件课，周六搭建课。\n\n第五周：重点来了，这周我们正式启动续报工作。周一到周四，续报跟进为主，通过电话、视频和家长沟通，同时继续协助家长处理硬件拼接、充电、蓝牙、配件核对这些问题。周五硬件课，周六是 AI 课，周日搭建课。\n\n第六周：周一到周四持续做续报跟进，同步协助家长解决硬件拼接、充电、蓝牙、配件数量的问题。大家再看下面这个渐变箭头，非常直观，整个周期就是从报名体验课开始，我们一步一步做好服务、跟进、陪伴，一直走到最终的续报长期班。六周里面每一周都有明确任务，补课、回访、硬件协助、续报，环环相扣，哪一步都不能落下。","interact":null,"sku":"","dept":""},{"row":27,"stage":"阶段4·工作流程·数据·岗位要求","p":"P26","topic":"互动引入：工作过程中都有哪些数据？","script":"来看看：工作的过程中都有哪些数据？","interact":null,"sku":"","dept":""},{"row":28,"stage":"阶段4·工作流程·数据·岗位要求","p":"P27","topic":"数据漏斗：微信添加率→客户端下载率→备课率→到课率→完课率→续报率","script":"接下来我们看这页的数据漏斗。很多老师一上来只关注最后一个结果 —— 续报率，觉得续报好就是能力强，续报不好就是家长不感兴趣。但我要告诉大家，真正决定续报的，往往不是最后一天，而是前面每一步过程数据。\n\n大家看左边这个漏斗，最上面是微信添加率，然后是客户端下载率、备课率、到课率、完课率，最后才是续报率。每一层都在往下漏，前面漏得越多，后面续报率自然就越低。\n\n所以我们一定要有一个意识：过程数据，不是用来给大家增加工作量的，它是我们带好一个班的导航仪。\n\n举个例子。如果微信添加率低，说明什么？说明我们连家长的第一关都没有进去，后面再好的服务、再好的课程，家长都收不到，根本没有机会感知。所以加微信不是简单点一下申请，而是我们和家长建立连接的第一步。\n\n如果客户端下载率低呢？那说明家长还没有完成上课准备。家长没有下载软件，孩子后面就很难顺利上课；孩子不上课，就看不到学习效果，我们谈续报就没有根基。\n\n再往下看，备课率、到课率、完课率，这些同样不是形式指标。备课率，反映的是家长有没有重视这门课；到课率，反映的是孩子有没有真正参与；完课率，反映的是孩子有没有持续获得学习成果。家长和孩子参与得越深，我们后面沟通续报才越有底气。\n\n所以我希望大家记住一句话：过程做好了，结果只是自然呈现；过程失控了，结果一定不稳定。\n\n我们不要平时不关注过程，到了续报期才着急。那个时候家长没有感知、孩子没有参与、前面该做的动作都没做，你再去沟通续报，就会非常吃力，也会显得很像单纯的销售。\n\n反过来，如果我们每一周都把过程数据盯好：该加的微信及时加上，该下载的软件督促下载，该参加的直播提醒参加，该补的课及时补，该回访的回访做到位，孩子的到课率、完课率自然会提升。孩子学得越连贯，家长越能看到变化，到了续报阶段，我们不是去 “推” 家长，而是顺理成章地跟家长规划孩子下一步学习。\n\n所以过程数据的重要性，总结起来就是三点：\n\n第一，它是我们带班的晴雨表。哪一层数据掉了，就说明哪一个环节出了问题，我们可以及时发现、及时补救。\n\n第二，它决定了家长的感知深度。家长不是因为我们最后说一句 “课程很好” 才报名，而是因为孩子一路上课、一路进步，才愿意长期学习。\n\n第三，它最终决定续报的稳定性。只看结果，结果是不可控的；把过程做扎实，结果才会有保障。\n\n因此，大家以后带班，不要只盯着续报率。我们要先盯住前面每一个过程指标：微信有没有加上，软件有没有下载，课有没有上，孩子有没有连续参与。把这些过程动作做到位，续报自然会水涨船高。来看一道题，数据漏斗从上到下的正确顺序是？","interact":{"q":"数据漏斗从上到下的正确顺序是？","at":"P27","options":["续报率→完课率→到课率→备课率→客户端下载率→微信添加率","微信添加率→客户端下载率→备课率→到课率→完课率→续报率","备课率→微信添加率→续报率→完课率","只看续报率"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":29,"stage":"阶段4·工作流程·数据·岗位要求","p":"P28","topic":"数据对比：第一名续报率 20% vs 第六名 8.33%·到课率 64%-68%·续报窗口期持久战","script":"我们先看上面这两组对比，同样都是进班 60 个人，第一名和第六名，续报结果差距非常大。第一名续课 12 人，续报率 20%；第六名只续报 5 人，续报率只有 8.33%。大家重点看前面的过程指标：第一名的加微率 91.7%、登录率 76.7%，明显高于第六名的 80%、71.7%。\n这就印证了刚刚漏斗里说的：加微、登录这些前端过程数据，从一开始就拉开了差距。前面的连接没做好，后面续报天然就难。\n\n再往下看，是我们往期多期的到课数据。不管是 L1-1、L1-2 还是 L2-1，三期的平均到课率稳定在 64%-68% 这个区间。到课率就是我们的核心底盘，孩子能不能准时上课、跟上课程，直接决定家长能不能看到学习效果。如果到课持续偏低，家长看不到孩子的变化，我们后续谈续报就没有支撑。\n\n最下面这一块，是我们续报窗口期每天的续报数据，从首日、二日、三日一直到末日。大家可以观察一个规律：大部分班级的续报，是随着跟进推进慢慢上涨的，不少班级的增量集中在中后期。\n这也提醒我们，续报不是等最后一天才发力，续报是一场持续跟进的持久战。不要第一天跟进效果一般就放弃，我们要持续做好回访、同步孩子学习情况，抓住整个窗口期的机会，把整体续报拉高。加微率、登录率、到课率，这些前置过程指标，就是续报的地基。地基稳，后续的续报上限才会高；地基弱，哪怕后面再努力，也很难追上。我们带班，就是要盯着这些对标数据，对标优秀渠道、对标往期均值，找到自己哪里掉链、哪里可以优化，把每一步过程指标做上去，最终拿到更好的续报结果。","interact":null,"sku":"","dept":""},{"row":30,"stage":"阶段4·工作流程·数据·岗位要求","p":"P29","topic":"工作时间与岗位要求：周内 13:00-22:00/周末 10:00-22:00·休假分配·四点要求","script":"接下来我们来看中价课课导的工作时间和岗位要求，这一块大家一定要认真听清楚，提前了解我们日常的节奏。\n\n首先是上班时间周内我们的上班时段是 13:00 到 22:00；周六、周日是 10:00 到 22:00。大家可以看到，周末是我们上课、跟进家长的高峰期，时间会提前一点。\n\n然后是我们岗位的属性，这里给大家标注清楚：服务占比 40%，销售占比 60%。也就是说我们不是单纯做服务，也不是硬推单，是以服务为基础，最终做好续报，这是我们岗位的核心定位。\n\n再往下是休假模式，我们是 6 周为一个周期，每月合计休 6 天。第一周是开课期，休 1 天；\n第 2 到 4 周属于行课期，每周休 2 天；\n第 5 周是续报期，只休 1 天，而且续报期的休息日固定在周四；\n第 6 周是衔接期，休 2 天。\n如果当月休假不足 8 天，是可以折算调休的\n右边是我们明确的岗位要求，一共四点：\n第一，我们的续报主要方式，是语音、电话联系家长，所以大家要适应电话沟通，练好我们的电话表达；\n第二，岗位工作和休息很难完全切割开，休假期间，如果有紧急的家长消息、学员问题，也需要及时响应处理，不过不用担心也不是所有的家长都会在休假联系你哦；\n第三，我们要做小灶视频授课，需要大家接受露脸上课，镜头前的状态、表达都要做好；\n\n整体跟大家总结一下，咱们这个岗位有清晰的周期节奏，行课期、续报期的休息安排不一样，尤其是到了续报周，任务会更集中。我们既要做好日常的学员服务，也要承担续报跟进的工作，能够接受这个节奏，才更适合咱们中价课课导这个岗位。来看一道题，中价课课导周末的上班时间是？","interact":{"q":"中价课课导周末的上班时间是？","at":"P29","options":["13:00-22:00","10:00-22:00","9:00-18:00","不用上班"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":31,"stage":"阶段4·工作流程·数据·岗位要求","p":"P30","topic":"结束寄语","script":"大家加油","interact":null,"sku":"","dept":""},{"row":32,"stage":"阶段4·工作流程·数据·岗位要求","p":"P31","topic":"调研问卷","script":"记得飞书扫码填写哦","interact":null,"sku":"","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"中价课工作流程·阶段1","q":"中价课课导团队核心负责的工作是？","options":[{"k":"A","t":"线上线下渠道的获客投放、素材投放、线索筛选"},{"k":"B","t":"孩子 6 周课程的学习辅导、日常跟进、学情反馈、续报转化"},{"k":"C","t":"正式年课的开班排课、长期班学员答疑"},{"k":"D","t":"赛事政策制定、白名单赛事组织报名"}],"answer":"B","back":"","sku":""},{"id":"T-S02","type":"阶段练习题","chapter":"中价课工作流程·阶段1","q":"中价课的续报节奏与长期班的对比是？","options":[{"k":"A","t":"中价课约半年启动一次续报；长期班课导续报周期约 4 周一次"},{"k":"B","t":"中价课随堂随报没有节奏；长期班只在结课当天集中续报"},{"k":"C","t":"中价课约 4 周左右启动续报；长期班课导续报周期大概半年一次"},{"k":"D","t":"两条业务线都没有固定续报节奏，全看家长意愿"}],"answer":"C","back":"","sku":""},{"id":"T-S03","type":"阶段练习题","chapter":"中价课工作流程·阶段1","q":"与中价课课导并行配合的两个部门是？【多选】","options":[{"k":"A","t":"赛事部门（提供赛事政策、备考信息、考级安排支撑）"},{"k":"B","t":"质检部门（抽查通话与聊天记录，规避违规风险）"},{"k":"C","t":"投放团队"},{"k":"D","t":"客服部门"}],"answer":"AB","back":"","sku":""},{"id":"T-S04","type":"阶段练习题","chapter":"中价课工作流程·阶段1","q":"投放团队的职能是？","options":[{"k":"A","t":"负责学员上课辅导、作业批改和学情反馈"},{"k":"B","t":"通过线上、线下渠道获客招生，把学员流转到中价课课导团队"},{"k":"C","t":"负责正式年课的跟进、答疑和续报"},{"k":"D","t":"负责赛事命题、组织白名单赛事报名"}],"answer":"B","back":"","sku":""},{"id":"T-S05","type":"阶段练习题","chapter":"中价课工作流程·阶段1","q":"质检部门的职能是？","options":[{"k":"A","t":"直接开除违规员工，负责团队人员的招聘解聘"},{"k":"B","t":"负责渠道投放、获客招生和线索筛选流转"},{"k":"C","t":"抽查通话、聊天记录，帮助及时发现沟通里的风险点，规避违规"},{"k":"D","t":"负责上课辅导、作业批改和学情反馈"}],"answer":"C","back":"","sku":""},{"id":"T-S06","type":"阶段练习题","chapter":"中价课工作流程·阶段2","q":"中价课学员集中的年龄段是？","options":[{"k":"A","t":"只集中在小学高年级，5-6 年级认知接近"},{"k":"B","t":"5-15 岁的小初学生，跨度大、认知水平差异大"},{"k":"C","t":"只集中在初中阶段，7-9 年级认知一致"},{"k":"D","t":"以成年学员为主，没有认知差异问题"}],"answer":"B","back":"","sku":""},{"id":"T-S07","type":"阶段练习题","chapter":"中价课工作流程·阶段2","q":"三角关系中，课导要做的两件关键事情是？","options":[{"k":"A","t":"记录（留存孩子学习过程和成长变化）+翻译（把成果翻译成家长能感知的价值）"},{"k":"B","t":"售卖（向家长推销课程优惠）+催单（每周电话催促报名）"},{"k":"C","t":"招生（负责投放获客引流）+质检（抽查老师通话记录）"},{"k":"D","t":"讲课（代替老师给孩子上课）+督促（每天催家长提交作业）"}],"answer":"A","back":"","sku":""},{"id":"T-S08","type":"阶段练习题","chapter":"中价课工作流程·阶段2","q":"家长报名编程的五大诉求是？【多选】","options":[{"k":"A","t":"兴趣试探与能力提升"},{"k":"B","t":"体验核桃产品"},{"k":"C","t":"硬件动手锻炼"},{"k":"D","t":"助力升学"},{"k":"E","t":"帮家长辅导学校作业"}],"answer":"ABCD","back":"","sku":""},{"id":"T-S09","type":"阶段练习题","chapter":"中价课工作流程·阶段2","q":"关于服务标准，正确的说法是？","options":[{"k":"A","t":"家长态度冷淡就可以降低标准，把精力留给高意愿家长"},{"k":"B","t":"只重点服务能续报的家长，其他家庭标准从简"},{"k":"C","t":"不管家长最初想法是什么，服务标准、耐心程度都不能打折扣"},{"k":"D","t":"只服务高认知家长，低认知家长交由系统回复"}],"answer":"C","back":"","sku":""},{"id":"T-S10","type":"阶段练习题","chapter":"中价课工作流程·阶段2","q":"用户除了孩子还包括家长，原因是？","options":[{"k":"A","t":"家长是孩子学习的主要负责人，续报期给孩子报名的也是家长"},{"k":"B","t":"家长付费意愿更强，只需要服务好家长就行"},{"k":"C","t":"孩子年龄太小，全程由家长代替学习"},{"k":"D","t":"家长也一起上课，需要和家长同步批改作业"}],"answer":"A","back":"","sku":""},{"id":"T-S11","type":"阶段练习题","chapter":"中价课工作流程·阶段3","q":"核桃课导老师的两个关键词是？","options":[{"k":"A","t":"亲切+耐心"},{"k":"B","t":"严肃、严格"},{"k":"C","t":"高冷、距离感"},{"k":"D","t":"强势、果断"}],"answer":"A","back":"","sku":""},{"id":"T-S12","type":"阶段练习题","chapter":"中价课工作流程·阶段3","q":"核桃课导与传统老师的岗位属性差异是？","options":[{"k":"A","t":"传统老师也有销售属性；核桃课导只有服务属性"},{"k":"B","t":"两者完全相同，都有服务属性和销售属性"},{"k":"C","t":"传统老师只有服务属性；核桃课导服务属性+销售属性兼具"},{"k":"D","t":"两者都没有销售属性，只看服务满意度"}],"answer":"C","back":"","sku":""},{"id":"T-S13","type":"阶段练习题","chapter":"中价课工作流程·阶段3","q":"服务属性落地的三个角色是？【多选】","options":[{"k":"A","t":"是孩子的老师（答疑解惑、辅导代码、陪伴学习）"},{"k":"B","t":"是家长的教育专家（同步学情、规划短期学习与长期成长路线）"},{"k":"C","t":"是他们共同的朋友（搭建沟通桥梁、建立信任）"},{"k":"D","t":"是课程的推销员"}],"answer":"ABC","back":"","sku":""},{"id":"T-S14","type":"阶段练习题","chapter":"中价课工作流程·阶段3","q":"作为家长的教育专家，「翻译官」的核心动作是？","options":[{"k":"A","t":"不堆术语，讲孩子收获（逻辑思维、专注力、拆解能力）和对升学、赛事的长期价值"},{"k":"B","t":"多讲复杂代码术语，显得专业权威，家长自然会信服"},{"k":"C","t":"只聊价格优惠和赠品，用折扣力度打动家长报名"},{"k":"D","t":"只发成绩截图和排名，用数据说话，其他内容一律不多讲"}],"answer":"A","back":"","sku":""},{"id":"T-S15","type":"阶段练习题","chapter":"中价课工作流程·阶段3","q":"现实中的续报情况是？","options":[{"k":"A","t":"家长一问就爽快报名，续报基本不需要跟进"},{"k":"B","t":"每一单都不容易——异议、犹豫、观望是常态，最常听到「我再考虑考虑」"},{"k":"C","t":"只要到课率达标，续报当天全部自动成交"},{"k":"D","t":"续报和课导动作无关，全靠家长自发报名"}],"answer":"B","back":"","sku":""},{"id":"T-S16","type":"阶段练习题","chapter":"中价课工作流程·阶段4","q":"六周工作流程中，正式启动续报工作是在第几周？","options":[{"k":"A","t":"第五周"},{"k":"B","t":"第一周"},{"k":"C","t":"第三周"},{"k":"D","t":"第六周"}],"answer":"A","back":"","sku":""},{"id":"T-S17","type":"阶段练习题","chapter":"中价课工作流程·阶段4","q":"第一周的关键动作是？【多选】","options":[{"k":"A","t":"会前三天开始进人，从加微信做起（第一印象决定家长是否回复消息）"},{"k":"B","t":"周四开家长会"},{"k":"C","t":"周五第一课课前直播、周六第二课课前直播"},{"k":"D","t":"周日补课、回访、复习课跟进"},{"k":"E","t":"直接开始上第一课，不做任何课前准备"}],"answer":"ABCD","back":"","sku":""},{"id":"T-S18","type":"阶段练习题","chapter":"中价课工作流程·阶段4","q":"数据漏斗从上到下的顺序是？","options":[{"k":"A","t":"续报率→完课率→到课率→备课率→客户端下载率→微信添加率"},{"k":"B","t":"微信添加率→客户端下载率→备课率→到课率→完课率→续报率"},{"k":"C","t":"备课率→到课率→微信添加率→续报率→完课率→客户端下载率"},{"k":"D","t":"微信添加率→续报率→完课率→到课率→客户端下载率→备课率"}],"answer":"B","back":"","sku":""},{"id":"T-S19","type":"阶段练习题","chapter":"中价课工作流程·阶段4","q":"往期到课数据的规律是？","options":[{"k":"A","t":"L1-1、L1-2、L2-1 三期平均到课率稳定在 64%-68%，是核心底盘"},{"k":"B","t":"三期平均到课率只有 34%-38%，各班之间毫无规律"},{"k":"C","t":"到课率数据没有参考价值，不需要纳入日常监控"},{"k":"D","t":"三期平均到课率稳定在 84%-88%，且每期都在大幅上涨"}],"answer":"A","back":"","sku":""},{"id":"T-S20","type":"阶段练习题","chapter":"中价课工作流程·阶段4","q":"中价课课导的工作时间是？","options":[{"k":"A","t":"周内 9:00-18:00；周六、周日正常双休"},{"k":"B","t":"周内 13:00-22:00；周六、周日 10:00-22:00"},{"k":"C","t":"全周 8:00-17:00，周末轮班不固定"},{"k":"D","t":"周内 10:00-19:00；周日休息周一上班"}],"answer":"B","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题","chapter":"中价课工作流程·全章","q":"中价课课导团队在业务链路中的定位是？","options":[{"k":"A","t":"业务链路的第一环——负责渠道投放和获客，把线索交给长期班"},{"k":"B","t":"业务链路的最后一环——只负责结课后的售后与退费处理"},{"k":"C","t":"独立于业务链路之外，只对赛事部门负责"},{"k":"D","t":"承上启下的关键一环——承接 6 周服务与价值传递，家长认可后流转长期班课导"}],"answer":"D","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题","chapter":"中价课工作流程·全章","q":"面对 5-15 岁跨度很大的学员，正确的跟进方式是？","options":[{"k":"A","t":"一套标准话术通吃所有年龄，无需区分学段和认知差异"},{"k":"B","t":"只按年龄分组发送模板消息，不结合课程特点调整"},{"k":"C","t":"只跟家长沟通，孩子年龄大小不影响任何动作"},{"k":"D","t":"低龄和高年级孩子的沟通节奏、学情反馈、引导方式都要不一样，结合课程阶段特点去讲"}],"answer":"D","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题","chapter":"中价课工作流程·全章","q":"家长报名编程的五大诉求包括？【多选】","options":[{"k":"A","t":"兴趣试探与能力提升"},{"k":"B","t":"体验核桃产品"},{"k":"C","t":"硬件动手锻炼"},{"k":"D","t":"助力升学"},{"k":"E","t":"帮家长辅导学校作业"}],"answer":"ABCD","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题","chapter":"中价课工作流程·全章","q":"课导服务属性落地的三个角色是？【多选】","options":[{"k":"A","t":"是孩子的老师"},{"k":"B","t":"是家长的教育专家"},{"k":"C","t":"是他们共同的朋友"},{"k":"D","t":"是课程的推销员"}],"answer":"ABC","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题","chapter":"中价课工作流程·全章","q":"作为「家长的教育专家」，核心动作是？","options":[{"k":"A","t":"只发成绩排名截图，用数据说话，不做任何翻译解释"},{"k":"B","t":"大量使用代码术语，展示专业度，让家长产生敬畏"},{"k":"C","t":"反馈学情+编程赋能，本质是做好「翻译官」——把专业内容翻译成家长听得懂的话"},{"k":"D","t":"只推送课程促销信息，用折扣和赠品打动家长"}],"answer":"C","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题","chapter":"中价课工作流程·全章","q":"老师五心指的是？","options":[{"k":"A","t":"爱心、细心、贴心、耐心、恒心"},{"k":"B","t":"责任心、上进心、事业心、好奇心、平常心"},{"k":"C","t":"只有爱心和耐心"},{"k":"D","t":"爱心、责任心、用心、耐心、慧心"}],"answer":"D","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题","chapter":"中价课工作流程·全章","q":"「服务和销售相辅相成」的理解，正确的是？","options":[{"k":"A","t":"销售是独立的最后动作，服务归服务、销售归销售，互不影响"},{"k":"B","t":"先集中催单逼单再补服务，成交之后服务可以慢慢补上"},{"k":"C","t":"服务和销售完全无关，续报只取决于价格折扣力度"},{"k":"D","t":"家长不是被一句「要不要报名」说动的，而是在长期相处中认可专业、信任建议"}],"answer":"D","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题","chapter":"中价课工作流程·全章","q":"课导必备的核心能力包括？【多选】","options":[{"k":"A","t":"沟通能力（最基础最核心）"},{"k":"B","t":"学习能力（搭建知识体系、复盘总结）"},{"k":"C","t":"小灶课能力（化繁为简、复盘迭代、互动跟进）"},{"k":"D","t":"销售技巧（突出价值、建立信任、情感维系）"},{"k":"E","t":"演讲能力（公开主持活动、上台讲课）"}],"answer":"ABCD","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题","chapter":"中价课工作流程·全章","q":"「过程数据」重要性的三点总结是？【多选】","options":[{"k":"A","t":"是带班的晴雨表——哪层掉了就是哪个环节出问题"},{"k":"B","t":"决定家长的感知深度——孩子一路上课一路进步才愿意长期学习"},{"k":"C","t":"最终决定续报的稳定性——过程扎实结果才有保障"},{"k":"D","t":"只是为了增加工作量"}],"answer":"ABC","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题","chapter":"中价课工作流程·全章","q":"关于续报窗口期的数据规律，正确的做法是？","options":[{"k":"A","t":"续报是首日决胜的闪电战——第一天不定，后面就没有机会了"},{"k":"B","t":"续报只靠最后一天冲刺，中间过程的数据不用看"},{"k":"C","t":"续报与过程数据无关，只和家长消费能力有关"},{"k":"D","t":"续报是持久战——续报随跟进推进上涨，增量集中在中后期，别第一天没效果就放弃"}],"answer":"D","back":"","sku":""}],"timing":{"P01":{"sents":["接下来我们正式进入今天的内容，给大家讲解中价课课导完整工作流程。\n","大家先看屏幕上这个标题：中价课工作流程。","咱们今天这节课，核心就是围绕中价课课导这个岗位展开。\n","我们会一起梳理清楚，这个岗位完整的工作链路是什么样的，同时也会拆解，想要把课导工作做好，我们需要具备哪些核心能力项。"],"durs":[7.104,4.632,5.592,11.376]},"P02":{"sents":["这节课会从四个方面给大家完整的介绍清楚该岗位的工作流程：\n","第一个：我们的业务链路是怎么发展的？","我们工作的上下游都有哪些团队？\n","第二个：我们的用户都是谁？","我们和用户之间有怎样的关系？\n","第三个：如果你想做这个岗位，需要具备哪些能力和动作？\n","第四个：完整带一期班，我们的工作流程是什么样的？","来看一道题，本节课从哪四个方面介绍中价课课导岗位？"],"durs":[6.408,3.96,3.36,2.904,3.12,5.352,5.04,5.856]},"P03":{"sents":["首先我们来看第一部分：我们的业务链路有哪些？"],"durs":[4.44]},"P05":{"sents":["接下来是第二部分：我们要了解我们的用户，俗话说知己知彼，方能百战百胜"],"durs":[7.488]},"P07":{"sents":["接下来我们来看这个三角关系。","刚刚我们说用户是孩子，但除了服务孩子，还有一个非常关键的群体 —— 家长。\n","道理很简单：家长是付费客户。","给大家举个例子：孩子在商场看上一件衣服，特别想要，但最后买单的一定是家长。","家长不只会看孩子喜不喜欢，还要综合考量这件衣服值不值、性价比高不高。\n\n","放到我们课程里也是一样，孩子喜欢课程只是基础。","我们的工作，一边要给孩子做好辅导，另一边，还要做好两件事：记录 + 翻译。\n","记录，就是把孩子每一步的学习过程、成长变化留存下来；\n","翻译，就是做转化的工作。","家长不会跟着一起上课，看不懂代码、不明白编程知识点，我们就要把孩子的学习成果，翻译成家长听得懂、能感知到的价值，帮家长看懂编程学习长期的意义。\n\n","大家看这个三角形：核桃编程、作为客户的家长、作为用户的孩子，三者形成稳定的三角关系。\n","这就要求我们一定要做到双向沟通：面对孩子，耐心细致辅导，帮孩子吃透知识点、保持学习兴趣；","面对家长，及时同步学情、反馈进步，把学习效果清晰传递出去。","只有家长实实在在看到孩子的成长，认可课程价值，后续的续报才会更顺利。"],"durs":[3.168,7.128,3.504,7.896,7.2,4.944,7.248,5.64,2.928,14.376,9,9.648,6.696,7.488]},"P08":{"sents":["那这些用户都是从哪里来呢？","其实前面讲了我们的用户主要来自线上和线下不同渠道，除了搜索或刷到核桃直播间或视频，其他报名的用户可能是听到同事家的孩子在学习、学习里老师推荐、孩子听到同学在学自己也想学的等等。","右边这个图片就是真实核桃的直播间，大家可以了解一下"],"durs":[3.048,18.48,5.4]},"P09":{"sents":["接下来我们来看，家长选择给孩子报名编程，背后的诉求主要分为这五大类。\n","大家要先清楚一点：不同家长，对编程的认知程度差别很大。","有的家长认知很高，本身就认可编程的价值，体验完觉得合适，就会考虑长期报名；","也有一部分家长，一开始只是抱着试一试、体验课程的心态，暂时没有报正式课的打算。\n\n","但是这里有一个核心原则：不管家长最初的想法是什么，我们都要同等对待。","我们没办法提前预判哪位家长最后一定会续报、哪位一定不报名。","所以我们的服务必须做到两件事：一视同仁，同时个性化跟进\n","不管我们刚加上家长微信的时候，对方态度热情，还是比较冷淡，我们的服务标准、耐心程度都不能打折扣。","很多时候，正是我们持续稳定、高质量的服务，慢慢打动家长，改变他原本的想法，最终愿意为长期课程买单。\n\n","我们一起来看这五个诉求：\n","第一，兴趣试探与能力提升：很多家长就是想让孩子接触新东西，锻炼逻辑思维；\n","第二，体验核桃产品：单纯想试一下咱们的课程、上课模式，看看孩子适不适合；\n","第三，硬件动手锻炼：看重实操硬件，希望孩子动手、动脑结合；\n","第四，助力升学：这也是很多高年级家长最核心的目标，想通过赛事、考级给孩子增加竞争力；\n","第五，咨询长期费用：本身有长期学习意向，先来了解课程、价格、学习规划。\n\n","大家后续和家长沟通的时候，要先听、先判断，找准这位家长最在意的点，针对性去传递价值，而不是一套话术讲给所有人。","来看一道题，家长给孩子报名编程的诉求包括？"],"durs":[7.488,6.024,7.92,8.112,7.032,6.216,6.456,10.032,10.32,2.544,7.992,8.016,6.912,9.432,8.232,11.592,4.728]},"P10":{"sents":["第三部分是关于工作的属性，了解我们需要具备哪些能力和要求"],"durs":[6.312]},"P11":{"sents":["那我想先问问大家一个问题：你印象当中的老师是什么样的？\n\n","地中海？","手背后站在门后面？","严肃？","站在讲台上讲课？","给学生答疑解惑？"],"durs":[5.256,1.872,2.424,1.872,2.16,2.16]},"P14":{"sents":["刚刚我们说了岗位 40% 是服务属性，那服务属性落地，就是我们要做好这三个角色。\n\n","第一个角色，是孩子的老师。","我们要给孩子答疑解惑，辅导代码、解决上课卡点，也会和孩子多沟通，了解他上课的状态、学习感受，陪伴他一步步把编程学明白。\n\n","第二个角色，是家长的教育专家。","在少儿编程这块，我们比家长掌握更完整的体系、赛事信息和学习节奏，所以大家要有专业自信。","我们要给家长及时同步孩子的学情反馈，同时结合孩子的情况，帮他规划短期的学习安排，还有长期的编程成长路线，给到专业的建议。\n\n","第三个角色，是他们共同的朋友。","我们也是家长和孩子之间的纽带。","一方面把孩子课堂上真实的学习状态传递给家长，另一方面也理解家长的教育焦虑和期待，搭建好双方沟通的桥梁，和孩子、家长都建立信任。"],"durs":[8.088,3,12.144,3.288,9.408,12.408,3.288,3.288,13.344]},"P15":{"sents":["我们作为孩子的老师，服务不是上完课就结束，核心落地三件事：\n","第一是辅导答疑：孩子上课、写作业过程中卡壳、有不懂的问题，我们随时跟进解答；\n","第二是批改作业：每一份课后作品、练习题我们都会逐一批改反馈，明确问题、给到优化方向；\n","第三就是学情记录：我们会把孩子整段学习过程里的课堂表现、作业成绩、阶段掌握情况，全部沉淀记录到专属学情表里。\n","这份记录既是我们后续针对性调整教学节奏、帮孩子补短板的依据，也能完整留存孩子的成长路径，让家长清晰看到孩子每一步的进步。"],"durs":[6.216,8.256,9.096,11.424,12.576]},"P16":{"sents":["很多家长本身不懂编程，看不懂代码，不知道孩子敲这些积木块到底在学什么、有什么用。","所以我们要做好两件核心事：反馈学情、编程赋能，本质上是做好「翻译官」。\n\n","第一，我们要把专业内容翻译成家长能听懂的话传递给家长。","不用跟家长讲复杂的代码术语，而是讲孩子收获：锻炼逻辑思维、专注力、拆解问题的能力，讲清楚编程对校内学科、赛事、升学的长期价值。\n","第二，不只是聊编程。","家长在孩子教育上有困惑，不管是校内学科学习、习惯培养，还是家庭教育方面的难题，我们都可以给到专业、贴合孩子情况的参考建议，不局限在编程本身。\n\n","很多家长看不懂编程代码，我们就要当好这个翻译：把看不懂的代码，翻译成孩子真实的成长和进步 —— 比如这节课孩子学会了拆解任务、学会排查 bug、思考更有条理，把成果具象化，让家长看得见收获。\n\n","当家长能持续看懂孩子的成长、认可学习价值，才愿意给孩子做长期学习规划，愿意持续跟着课程学习。","这也是我们稳定拉高续报率非常关键的一环。"],"durs":[8.424,7.584,5.976,13.968,2.64,14.568,18.72,9.768,4.248]},"P17":{"sents":["来到最后这一层服务身份 ——是孩子和家长共同的朋友。\n\n","很多家庭都会有这样的情况：家长辅导孩子学习的时候容易着急、产生矛盾。","而我们，就可以成为孩子和家长之间沟通的一座桥梁。\n","我们和家长、孩子的关系，不该只局限于上课、聊学习这件事。","在不触碰法规、公司红线，不做过度承诺的前提下，我们可以建立温暖的情感连接：和妈妈聊聊孩子日常成长、生活小事；","和爸爸聊聊行业、教育大环境等等。\n\n","道理很简单：越是熟悉、了解对方，我们越能读懂这个家庭真实的痛点和需求，做到知己知彼。","后续不管是学情沟通，还是规划学习路线，我们都能精准给到贴合他家情况的建议。\n\n","我们不想做一个只通知上课、发消息的冰冷工具人。","当家长感受到老师是有温度、真心在意孩子，孩子也愿意信任我们的时候，信任基础就建立起来了。","这份信任，也是我们稳住续报非常核心的底气。\n","所以，我们的服务，就是希望能真正融入到孩子的学习和家庭的成长里，当好这个老师、专家和朋友。","来看一道题，作为「共同的朋友」，正确的做法是？"],"durs":[5.016,7.296,5.424,6.12,11.472,3.624,9.24,7.944,5.04,9.048,4.704,9.456,4.416]},"P18":{"sents":["希望各位老师在接下来跟家长孩子沟通中保持5心：\n","有爱心，是真心喜欢孩子，把他们当成自己的弟弟妹妹来看。\n","有责任心，是把孩子学有所成当成自己的头等大事。\n","有耐心，就是不管孩子问多少遍，我们都会一遍遍讲明白。\n","用心，我们全身心投入，关注每个孩子的进步。\n","慧心，我们用专业的方法，巧妙地引导孩子爱上编程、学好编程。"],"durs":[5.232,5.688,5.256,5.784,4.656,6.576]},"P19":{"sents":["第二个具备的属性是销售属性：\n","我们理想的续报期是什么样的？","你打电话给家长，问家长想给孩子报名吗？\n","家长说报名！","哇，这个续报也太简单了，但是大家觉得现实吗？\n","是的，不太现实，那现实是怎样的呢？"],"durs":[3.24,3.048,4.224,1.872,4.848,4.008]},"P20":{"sents":["大家可能对销售的想象是很理想化的：我们一问家长，家长直接爽快报名、主动续报，沟通简单顺利。\n","但真实的情况并不是这样，现实里每一单都不容易。","我们会遇到各种各样的反馈，最常听到的就是 “我再考虑考虑”，电话、微信沟通里，异议、犹豫、观望都是常态。\n\n","这里不是让大家硬催单、强行推销。","恰恰相反：正是因为续报没有那么容易，前面那一套有温度、专业的服务才格外重要。\n","家长不会因为我们一句 “要不要报名” 就买单，而是因为在长期相处里，认可我们作为老师的专业、信任我们给出的教育建议、愿意和我们沟通，才愿意选择继续跟着课程学习。\n","销售不是我们单独去做的一件事，而是前面所有服务积累之后，水到渠成的结果。","我们先把服务做扎实，才有底气去沟通规划、推进续报。"],"durs":[9.72,4.824,10.608,3.792,8.04,14.88,7.536,5.448]},"P21":{"sents":["如何缩小理想和现实的差距呢?"],"durs":[3.24]},"P22":{"sents":["我们一起来看这个非常贴近日常沟通的案例。","家长就简简单单问一句：老师，今晚 7 点上课吗？\n\n","大家可以先想一想，如果是朋友问咱们晚上要不要吃烧烤，我们简单回答 “去或者不去” 就够了。","但面对家长，我们不能只做到被动应答。\n","我们看老师 A 的回复：是的孩子妈妈，七点准时开课。","这句话没有错，信息给到了，但是很平淡，没有亮点，只回答了家长当下的问题，没有预判家长后面的顾虑。\n\n","再看老师 B 的回复：是的孩子妈妈，咱们今晚 7 点准时开课，您到时候记得提醒孩子进入到课堂，我会全程在后台跟进孩子学习情况，孩子上课遇到问题或困难，我后台可以跟孩子发消息、语音连麦给孩子辅导，您把孩子交给我就行。\n\n","这里核心就是前置服务思维。","我们预判到这位家长大概率是第一次上课，心里会悄悄担心：上课的时候孩子遇到难题怎么办？","有没有老师管？\n","我们不等家长主动来问，主动提前把这个顾虑打消。","这就好比我们逛街口渴，主动去店里要一杯水，和店家看见我们累了，主动递上一杯水，体验完全不一样。","后者是主动的、贴心的服务。\n\n","好处有两点：\n","第一，家长沟通体验更好，能实实在在感受到老师的责任心，心里踏实；\n","第二，帮我们规避后续的麻烦。","如果我们现在不说，上课中途家长突然发来消息问能不能辅导，那时候我们正在同步跟进多个孩子，很容易来不及回复，家长就容易觉得被冷落。","能提前预判、提前讲清楚的问题，就不要留到后面。\n\n","很多新人会觉得，我这一段只是在做服务，没有在销售。","但大家要记住：服务和销售，相辅相成。\n","在这段贴心的回复里面，其实我们已经把核桃编程的核心优势传递出去了：我们不是单纯的录播、大班直播课，上课期间有专属老师全程后台跟进，可以一对一消息、语音连麦辅导。\n","这个就是和普通直播课最大的区别。","我们没有硬推课程，但是在服务的过程当中，自然而然把课程价值传递给家长。\n\n","家长感受到我们的专业、细心、有责任心，后续到续报沟通的时候，愿意信任我们。","条件合适的家长愿意续报；","就算当下预算或者规划暂时不考虑，也愿意静下心听完我们的规划和建议。\n","所有的续报铺垫，都藏在这一句一句日常沟通里。","来看一道题，老师 B 的回复比老师 A 好在哪里？"],"durs":[4.152,5.04,8.208,4.2,5.352,9.768,20.952,3.048,8.856,1.872,4.848,9.552,3.072,1.872,7.032,3.192,13.176,5.016,5.424,4.344,16.104,3.696,7.416,7.704,3.048,7.008,4.632,4.728]},"P23":{"sents":["那我们作为课导老师，必须具备五大核心能力。\n\n","第一点就是我们的沟通能力，这是咱们课导老师最基础、最核心的必备能力。\n","首先，我们要能够清晰地介绍产品的特点、优势和价值，和家长沟通的时候抓住重点，逻辑清晰，不冗长、不啰嗦。\n","第二，我们要善于运用生动的语言、恰当的比喻或者真实学员案例，让课程、服务更有吸引力和感染力，让家长直观感受到孩子学编程之后实实在在的进步，也能更加清楚看懂咱们课程的价值。\n\n","第二点，学习能力。\n","第一，我们要持续把课程专业知识、还有用户心理这些内容融合在一起，搭建属于自己完整的知识体系，并且灵活用到日常和家长、孩子的沟通里面。","不是只会背知识点，而是懂课程、懂家长的顾虑，懂孩子的学习规律。\n","第二，在平时工作当中，要养成复盘总结的习惯。","不管是成功续报的好案例，还是遇到异议没有成交的情况，我们都要去分析背后的原因，多学习优秀同事的经验，持续调整自己的沟通方式和跟进策略，不断提高我们的工作效率和沟通质量。\n\n","第三点，小灶课能力\n","第一，我们要结合孩子当下的认知水平去设计小灶课内容，把复杂的编程知识点化繁为简，让孩子听得懂、跟得上，提升课堂参与感，上完课有满满的收获感。\n","第二，每一次小灶课结束之后，一定要做好复盘迭代，多借鉴优秀老师的授课经验，持续打磨、优化我们自己的授课方式。\n","第三，课上多用互动，课后做好持续跟进，牢牢抓住孩子，提升学员粘性，让孩子愿意持续跟着我们学，为长期学习、后续续报打好基础。\n\n","第四点，销售技巧。","大家不要一听到销售就觉得是硬推，我们的销售是建立在专业和服务之上的。\n","第一，沟通的时候要突出咱们课程的价值，把核桃编程和其他课程差异化的地方讲清楚；\n","第二，慢慢建立家长对我们的信任，合适的时候展示我们的教学资质、学员获奖案例、学习成果，用真实成果说话；\n","第三，做好长期的情感维系，多关注孩子每阶段的学习状态，主动给到针对性的学习关心和学习建议，慢慢拉近距离。\n\n","第五点，灵活度。\n","我们没有一套万能话术可以适配所有家庭，要根据每个家长、每个孩子的真实需求，灵活组合咱们课程的优势，给到个性化的解决方案。","举个例子，家长纠结价格、觉得贵的时候，不要死磕价格，我们可以灵活地给家长拆解课程配套服务、长期学习的性价比，结合当下的优惠活动去沟通，而不是死板地照搬话术。\n\n","总结一下，这五大能力是相辅相成的：沟通是基础，学习是我们持续成长的底气，小灶课用来抓孩子、建立好感，销售技巧帮我们传递价值，灵活度让我们适配不同家庭。","五项能力一起做好，我们的服务和续报才能稳稳落地。"],"durs":[4.44,6.816,11.232,18,2.4,13.68,6.768,5.016,16.752,2.64,14.904,11.352,13.44,2.52,7.032,8.496,10.992,11.352,2.208,12.096,15.936,16.176,5.136]},"P24":{"sents":["这是我们最后讲到的第四点：中价课课导的工作流程"],"durs":[5.04]},"P25":{"sents":["接下来这一页，我们来讲课导的主要工作流程，整个流程一共分为六周，核心链路就是：家长报名体验课，我们全程跟进服务，最终目标是引导孩子续报长期班。\n\n","我们先看第一周：会前三天开始进人。","进人阶段大家一定要记住，从加微信这一步做起，及时添加家长微信。","这是家长对我们的第一印象，第一印象直接决定家长后面愿不愿意回复我们消息，所以亲和力，在这个阶段就要展现出来。","到了第一周周四我们开家长会；","周五是第一课的课前直播，周六是第二课的课前直播，周日我们要做补课、回访以及复习课的跟进。\n\n","然后是第二周：周一到周四我们重点做补课、回访、复习课；","周五安排第三课的课前直播，周六是第四课的课前直播，周日开展搭建课。\n\n","到第三周：周一到周四，我们持续补课、回访，做视频跟进，提前提醒孩子打卡，双份任务同步跟进；","还要协助家长做硬件拼接，检查充电、蓝牙连接、配件数量有没有问题，同步做好复习课。","周五安排硬件课，周六搭建课，周日没有额外课程任务。\n\n","第四周：周一到周四依旧是补课、回访，通过电话或者视频的方式跟进，同样协助家长做硬件拼接，核对充电、蓝牙、配件数量。","周五硬件课，周六搭建课。\n\n","第五周：重点来了，这周我们正式启动续报工作。","周一到周四，续报跟进为主，通过电话、视频和家长沟通，同时继续协助家长处理硬件拼接、充电、蓝牙、配件核对这些问题。","周五硬件课，周六是 AI 课，周日搭建课。\n\n","第六周：周一到周四持续做续报跟进，同步协助家长解决硬件拼接、充电、蓝牙、配件数量的问题。","大家再看下面这个渐变箭头，非常直观，整个周期就是从报名体验课开始，我们一步一步做好服务、跟进、陪伴，一直走到最终的续报长期班。","六周里面每一周都有明确任务，补课、回访、硬件协助、续报，环环相扣，哪一步都不能落下。"],"durs":[14.808,3.792,6.768,10.968,3.192,9.36,6.168,7.344,10.056,8.832,5.568,12.912,3,4.968,12.864,4.536,10.2,13.104,9.12]},"P26":{"sents":["来看看：工作的过程中都有哪些数据？"],"durs":[4.08]},"P27":{"sents":["接下来我们看这页的数据漏斗。","很多老师一上来只关注最后一个结果 —— 续报率，觉得续报好就是能力强，续报不好就是家长不感兴趣。","但我要告诉大家，真正决定续报的，往往不是最后一天，而是前面每一步过程数据。\n\n","大家看左边这个漏斗，最上面是微信添加率，然后是客户端下载率、备课率、到课率、完课率，最后才是续报率。","每一层都在往下漏，前面漏得越多，后面续报率自然就越低。\n\n","所以我们一定要有一个意识：过程数据，不是用来给大家增加工作量的，它是我们带好一个班的导航仪。\n\n","举个例子。","如果微信添加率低，说明什么？","说明我们连家长的第一关都没有进去，后面再好的服务、再好的课程，家长都收不到，根本没有机会感知。","所以加微信不是简单点一下申请，而是我们和家长建立连接的第一步。\n\n","如果客户端下载率低呢？","那说明家长还没有完成上课准备。","家长没有下载软件，孩子后面就很难顺利上课；","孩子不上课，就看不到学习效果，我们谈续报就没有根基。\n\n","再往下看，备课率、到课率、完课率，这些同样不是形式指标。","备课率，反映的是家长有没有重视这门课；","到课率，反映的是孩子有没有真正参与；","完课率，反映的是孩子有没有持续获得学习成果。","家长和孩子参与得越深，我们后面沟通续报才越有底气。\n\n","所以我希望大家记住一句话：过程做好了，结果只是自然呈现；","过程失控了，结果一定不稳定。\n\n","我们不要平时不关注过程，到了续报期才着急。","那个时候家长没有感知、孩子没有参与、前面该做的动作都没做，你再去沟通续报，就会非常吃力，也会显得很像单纯的销售。\n\n","反过来，如果我们每一周都把过程数据盯好：该加的微信及时加上，该下载的软件督促下载，该参加的直播提醒参加，该补的课及时补，该回访的回访做到位，孩子的到课率、完课率自然会提升。","孩子学得越连贯，家长越能看到变化，到了续报阶段，我们不是去 “推” 家长，而是顺理成章地跟家长规划孩子下一步学习。\n\n","所以过程数据的重要性，总结起来就是三点：\n\n","第一，它是我们带班的晴雨表。","哪一层数据掉了，就说明哪一个环节出了问题，我们可以及时发现、及时补救。\n\n","第二，它决定了家长的感知深度。","家长不是因为我们最后说一句 “课程很好” 才报名，而是因为孩子一路上课、一路进步，才愿意长期学习。\n\n","第三，它最终决定续报的稳定性。","只看结果，结果是不可控的；","把过程做扎实，结果才会有保障。\n\n","因此，大家以后带班，不要只盯着续报率。","我们要先盯住前面每一个过程指标：微信有没有加上，软件有没有下载，课有没有上，孩子有没有连续参与。","把这些过程动作做到位，续报自然会水涨船高。","来看一道题，数据漏斗从上到下的正确顺序是？"],"durs":[3.168,9.576,7.32,10.944,5.88,9.24,1.872,3.264,9.648,6.72,2.592,3.528,4.68,5.616,6.432,4.368,4.2,5.04,5.664,6.216,3.192,4.368,11.424,17.808,10.896,4.656,3.192,7.128,3.384,9.384,3.624,3.096,3.576,4.176,9.672,4.68,4.584]},"P29":{"sents":["接下来我们来看中价课课导的工作时间和岗位要求，这一块大家一定要认真听清楚，提前了解我们日常的节奏。\n\n","首先是上班时间周内我们的上班时段是 13:00 到 22:00；","周六、周日是 10:00 到 22:00。","大家可以看到，周末是我们上课、跟进家长的高峰期，时间会提前一点。\n\n","然后是我们岗位的属性，这里给大家标注清楚：服务占比 40%，销售占比 60%。","也就是说我们不是单纯做服务，也不是硬推单，是以服务为基础，最终做好续报，这是我们岗位的核心定位。\n\n","再往下是休假模式，我们是 6 周为一个周期，每月合计休 6 天。","第一周是开课期，休 1 天；\n","第 2 到 4 周属于行课期，每周休 2 天；\n","第 5 周是续报期，只休 1 天，而且续报期的休息日固定在周四；\n","第 6 周是衔接期，休 2 天。\n","如果当月休假不足 8 天，是可以折算调休的\n","右边是我们明确的岗位要求，一共四点：\n","第一，我们的续报主要方式，是语音、电话联系家长，所以大家要适应电话沟通，练好我们的电话表达；\n","第二，岗位工作和休息很难完全切割开，休假期间，如果有紧急的家长消息、学员问题，也需要及时响应处理，不过不用担心也不是所有的家长都会在休假联系你哦；\n","第三，我们要做小灶视频授课，需要大家接受露脸上课，镜头前的状态、表达都要做好；\n\n","整体跟大家总结一下，咱们这个岗位有清晰的周期节奏，行课期、续报期的休息安排不一样，尤其是到了续报周，任务会更集中。","我们既要做好日常的学员服务，也要承担续报跟进的工作，能够接受这个节奏，才更适合咱们中价课课导这个岗位。","来看一道题，中价课课导周末的上班时间是？"],"durs":[10.536,5.904,3.504,6.696,9,9.84,6.096,3.024,3.96,6.288,3.168,4.272,3.864,9.816,15.048,8.424,11.784,10.008,4.464]},"P30":{"sents":["大家加油"],"durs":[1.872]},"P31":{"sents":["记得飞书扫码填写哦"],"durs":[2.424]},"P04":{"sents":["我们来看这一页，业务链路分析。","首先大家要先找准自己的定位：我们是中价课课导团队。\n","我们核心负责孩子为期 6 周课程的学习辅导、日常跟进、学情反馈，还有续报转化。","前期投放团队，线上、线下渠道去获客招生。","招进来的学员，流转到我们手上，由我们承接这 6 周的陪伴辅导。","等我们这 6 周中价课服务结束之后，一部分认可课程、愿意继续学的孩子，就会流转到后方长期班课导团队。","长期班课导，承接孩子正式课的跟进、答疑、续报，他们的续报周期大概是半年一次；","而我们中价课的续报节奏是，大约 4 周左右就会启动续报。\n","所以大家能感受到，我们岗位是承上启下的关键一环。","家长愿意选择继续学，一方面是孩子上课体验好、能看到当下的学习收获，另一方面，也是信任编程学习长期的价值，而这个价值传递，就是我们的工作。\n\n","大家再看这张图，和我们并行配合的还有两个部门：赛事部门、质检部门。\n","我们先理解质检部门，它就像咱们团队的安全员。","我们日常和家长沟通、电访、发消息，话术、服务动作都有规范。","质检会抽查我们的通话、聊天记录，帮我们及时发现沟通里的风险点，规避违规问题，保护大家，也保护我们的业务。\n","而赛事部门，是我们非常重要的协同伙伴。","很多家长送孩子学编程，目标就是赛事考级、拿证书。","后续我们给家长规划长期学习路径、讲升学和能力规划的时候，赛事部门会给我们提供赛事政策、备考信息、考级安排这些支撑，帮我们给家长讲清楚长期学习的出口。\n\n","整条链路串起来就是：投放团队获客 → 交到我们中价课课导做 服务、做价值传递和续报 → 意向学员流转长期班课导；","全程有质检把控服务合规，赛事部门给我们做专业内容支撑。"],"durs":[3.264,5.64,8.232,5.016,5.904,9.912,8.424,5.76,5.184,13.944,7.368,4.608,6.624,10.584,4.104,5.928,15.504,11.328,6.024]},"P06":{"sents":["接下来我们来看下一个问题：我们的用户是谁？\n","大家看屏幕，我们的学员集中在5-15 岁的小初学生。","这个年龄段跨度其实很大，前后差了整整 10 岁。\n","这也就意味着，我们面对的孩子，认知水平、接受能力完全不一样，课程内容也会做区分。\n","课程体系从图形化 Scratch，再到 Python，最后过渡到 C++，我们会根据孩子的年龄、所在年级，做差异化的教学安排。\n\n","这里也给大家提个重点：我们课导在跟进的时候，不能用同一套方式去对待所有孩子。","低龄孩子和高年级孩子，沟通节奏、学情反馈、引导方式都要不一样。","后续我们跟进学情、和家长沟通的时候，也要结合孩子所在阶段的课程特点去讲。","我们的用户不是单一的只有孩子，还有家长，因为家长是孩子学习的主要负责人，而且在我们续报期给孩子报名的也是家长，我们和家长之间的关系建立也是非常重要的。","来看一道题，中价课的学员集中在哪个年龄段？"],"durs":[4.392,5.304,4.752,8.784,11.544,8.04,7.296,7.704,15.768,4.776]},"P12":{"sents":["我们刚刚了解完家长和孩子，那接下来大家想一想：核桃的课导老师，应该是什么样子的？\n","给大家标了两个关键词：亲切 + 耐心。\n\n","我们面对的是 5-15 岁的孩子，还有形形色色的家长。","对孩子来说，我们要足够亲切，拉近距离，让孩子愿意主动跟我们说上课遇到的难题、愿意分享自己的作品；","同时一定要有耐心，孩子卡壳、反复出错的时候，不能急躁，慢慢引导他找到思路。\n\n","放到和家长沟通上也是一样。","有的家长对编程不了解，会反复问很多基础问题，也有的家长比较焦虑，担心孩子跟不上。","这时候亲切、耐心的沟通状态，会让家长觉得我们靠谱、放心，愿意信任我们给到的学习建议。\n\n","亲切和耐心不是表面客气，是我们所有服务动作的底色。","不管是辅导孩子写代码，还是跟家长同步学情、解答疑问，这两点，是我们做好课导岗位最基础、也最重要的特质。"],"durs":[8.04,3.936,5.376,10.224,7.992,3.096,8.376,9.192,5.424,10.608]},"P28":{"sents":["我们先看上面这两组对比，同样都是进班 60 个人，第一名和第六名，续报结果差距非常大。","第一名续课 12 人，续报率 20%；","第六名只续报 5 人，续报率只有 8.33%。","大家重点看前面的过程指标：第一名的加微率 91.7%、登录率 76.7%，明显高于第六名的 80%、71.7%。\n","这就印证了刚刚漏斗里说的：加微、登录这些前端过程数据，从一开始就拉开了差距。","前面的连接没做好，后面续报天然就难。\n\n","再往下看，是我们往期多期的到课数据。","不管是 L1-1、L1-2 还是 L2-1，三期的平均到课率稳定在 64%-68% 这个区间。","到课率就是我们的核心底盘，孩子能不能准时上课、跟上课程，直接决定家长能不能看到学习效果。","如果到课持续偏低，家长看不到孩子的变化，我们后续谈续报就没有支撑。\n\n","最下面这一块，是我们续报窗口期每天的续报数据，从首日、二日、三日一直到末日。","大家可以观察一个规律：大部分班级的续报，是随着跟进推进慢慢上涨的，不少班级的增量集中在中后期。\n","这也提醒我们，续报不是等最后一天才发力，续报是一场持续跟进的持久战。","不要第一天跟进效果一般就放弃，我们要持续做好回访、同步孩子学习情况，抓住整个窗口期的机会，把整体续报拉高。","加微率、登录率、到课率，这些前置过程指标，就是续报的地基。","地基稳，后续的续报上限才会高；","地基弱，哪怕后面再努力，也很难追上。","我们带班，就是要盯着这些对标数据，对标优秀渠道、对标往期均值，找到自己哪里掉链、哪里可以优化，把每一步过程指标做上去，最终拿到更好的续报结果。"],"durs":[8.448,4.08,4.92,13.104,8.352,4.056,3.888,10.248,9.48,6.984,8.376,9.432,7.056,10.848,6.528,3.576,4.2,14.448]},"P13":{"sents":["核桃课导和大家印象里传统老师，既有联系，也有很关键的区别。\n\n","先看传统学校老师，核心只有服务属性：上课、布置作业、答疑辅导，是没有销售属性的。\n","而咱们核桃的课导，是服务属性 + 销售属性两者兼具。\n\n","当然二者有一个最重要的共同点：不管是学校老师，还是我们，初心都是一样的 —— 心里装着孩子，希望孩子学好、看到进步，孩子遇到难题我们都会尽力去帮。","这份对孩子负责任的服务之心，是相通的。\n\n","但大家一定要清楚我们岗位的特殊性：我们的绩效只和续报挂钩；","从岗位属性来看，服务属性占 40%，销售属性占 60%。\n","40% 的服务，就是我们的重实操：孩子代码写不出来、思路卡壳、题目看不懂，我们点对点跟进辅导，陪着孩子练，直到弄懂学会，做好学情陪伴和反馈。\n\n","那 60% 的销售属性怎么理解？","大家要明白，短短 6 周的中价课，只能试探孩子兴趣、看到初步变化，很难实现能力大幅提升，也支撑不了赛事、考级、升学规划。\n","所以我们的责任，就是在看到孩子适合学、愿意学之后，帮家长规划完整的长期学习路线，专业地给家长介绍长期正式课，也就是我们说的 “专业选核桃”。\n","而学校里孩子是按年级自然升学，不需要做课程推荐，自然没有销售属性。\n","这一点，是我们所有人都要先吃透的岗位本质。","来看一道题，核桃课导的岗位属性构成是？"],"durs":[6.48,8.832,5.616,14.16,4.152,6.24,6.912,14.448,3.576,12.504,13.944,7.44,4.416,4.464]}},"v":{"slides/P01.jpg":"66c7bec6","slides/P01.png":"32f9cdde","slides/P02.jpg":"5e97bc27","slides/P02.png":"4ccdb5bf","slides/P03.jpg":"abd87332","slides/P03.png":"7187602b","slides/P04.jpg":"2a09bcca","slides/P04.png":"0d46a179","slides/P05.jpg":"a069722a","slides/P05.png":"e321ca0f","slides/P06.jpg":"d6c7772c","slides/P06.png":"9f935171","slides/P07.jpg":"56cb7fd1","slides/P07.png":"ca24ff80","slides/P08.jpg":"85425b49","slides/P08.png":"78f50609","slides/P09.jpg":"0b805fc5","slides/P09.png":"50b50e87","slides/P10.jpg":"10451776","slides/P10.png":"e9fcb68e","slides/P11.jpg":"bb8a44a2","slides/P11.png":"b104a985","slides/P12.jpg":"38d5129f","slides/P12.png":"928afad1","slides/P13.jpg":"1fe981de","slides/P13.png":"33efe2d4","slides/P14.jpg":"ef2513bc","slides/P14.png":"d86032c4","slides/P15.jpg":"e78d5a06","slides/P15.png":"a1b5e4cb","slides/P16.jpg":"4747a5c5","slides/P16.png":"f4ae7365","slides/P17.jpg":"e4e66625","slides/P17.png":" const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return (!CFG.depts || tagOk(p.dept, st && st.depts)) && (!CFG.skus || tagOk(p.sku, st && st.skus)); }

}

try { st = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e) { st = fresh(); }

function applyRestore(){ if(!RESTORE) return false; const o=RESTORE; RESTORE=null;

const pad = n => String(n).padStart(2,'0');
function nowStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function stageLabel(i){ const s = STAGES[i]; return s ? (s.name + (TITLES[s.num] ? ' ' + TITLES[s.num] : '')) : ''; }

/* 每个关卡的过程数据：play=实际播放秒数 occ=占用秒数 pn/ps=暂停次数/秒 kn/ks=卡顿次数/秒 */
function stat(k){ st.stat = st.stat || {}; return st.stat[k] = st.stat[k] || {play:0, occ:0, pn:0, ps:0, kn:0, ks:0}; }
function curKey(){ return st.view === 'quiz' ? (st.quiz === 'final' ? 'f' : st.quiz) : st.cur.s; }
function stageStatusText(k){
  if (k !== 'f' && !STAGES[k]) return '';
  const done = k === 'f' ? !!(st.final && st.final.pass) : !!st.passed[k];
  if (done) return '已完成';
  if ((st.view === 'learn' || st.view === 'quiz') && String(curKey()) === String(k)) return '进行中';
  const s = st.stat && st.stat[k];
  return s && s.occ > 0 ? '进行中' : '未开始';
}
function snapshot(online){
  const keys = [0,1,2,3,'f'], sum = f => keys.reduce((a,k) => a + ((st.stat&&st.stat[k]&&st.stat[k][f])||0), 0);
  const play = sum('play'), occ = sum('occ');
  const sc = i => st.best[i] != null ? `${st.best[i]}/${STAGES[i].quiz.length}` : '';
  const cur = st.view === 'quiz' ? (st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz) + '·小测') : (st.view === 'learn' ? stageLabel(st.cur.s) : '课程首页');
  const cp = st.view === 'learn' ? (curPageSafe()||{}).p || '' : '';

    st1:stageStatusText(0), st2:stageStatusText(1), st3:stageStatusText(2), st4:stageStatusText(3), stf:stageStatusText('f'),
    sc1:sc(0), sc2:sc(1), sc3:sc(2), scf: st.final ? `${st.final.score}/${FINAL.length}` : '',
    play_min:mins(play), occ_min:mins(occ), gap_min:mins(Math.max(0, occ-play)),
    pause_n:sum('pn'), pause_min:mins(sum('ps')), stall_n:sum('kn'), stall_min:mins(sum('ks')),
    relearn_n:Object.values(st.relearnCnt||{}).reduce((a,b)=>a+b,0),
    quiz_switch_n:sum('qn'), quiz_switch_min:mins(sum('qs'))};

const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid}, ev, snapshot(online));
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

function flushPage(event){
  const p = curPageSafe();
  if (p && pageSec >= 3) report({event, stage:stageLabel(st.cur.s), page:p.p, minutes:mins(pageSec), detail:p.topic});
  pageSec = 0;
}
function curPageSafe(){ try { return STAGES[st.cur.s].pages[st.cur.p]; } catch(e) { return null; } }
let leftSent = false;
function leaveCourse(){
  if (leftSent || !st.name) return; leftSent = true;
  if (st.view === 'learn') { endPause(false); flushPage('中途离开'); }
  endQuizAway(false);
  save();
  const where = st.view === 'quiz' ? '测试中' : st.view === 'learn' ? '听课中' : '课程首页';
  bot(who() + '在' + CN + '课已离开');
  report({event:'离开课程', stage: st.view === 'home' ? '' : stageLabel(st.cur.s), page: st.view === 'learn' ? ((curPageSafe()||{}).p||'') : '', detail:`在${where}关闭或离开网页`}, '已离开');
}
// 不论停在哪个界面（含课程首页），关网页都上报「已离开」；pagehide 不触发的浏览器用 beforeunload 兜底
window.addEventListener('pagehide', leaveCourse);
window.addEventListener('beforeunload', leaveCourse);
window.addEventListener('pageshow', e => { if (e.persisted) { leftSent = false; report({event:'进入课程', detail:'返回网页'}); } });

/* 小测中切屏：不能暂停答题，但要记录每次离开和离开多久，并提示学员 */
let quizAwayAt = null;
function quizActive(){ return st.view === 'quiz' && quizState && !quizState.result; }
function quizAwayNow(){ return document.hidden || !document.hasFocus(); }
function startQuizAway(){
  if (quizAwayAt != null || !quizActive() || !quizAwayNow()) return;
  quizAwayAt = Date.now();
  const s = stat(curKey()); s.qn = (s.qn||0) + 1;
  report({event:'测试中切屏', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`本次测试第 ${s.qn} 次切屏（${document.hidden ? '切出页面' : '切到其他窗口'}）`});
}
function endQuizAway(doReport){
  if (quizAwayAt == null) return;
  const sec = (Date.now() - quizAwayAt)/1000; quizAwayAt = null;
  const s = stat(curKey()); s.qs = (s.qs||0) + sec;
  if (doReport) report({event:'回到测试', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`离开 ${Math.round(sec)} 秒`});
  const w = $('#quizWarn'); if (w) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs)} 秒，已同步给培训老师。`; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) startQuizAway(); else if (document.hasFocus()) endQuizAway(true); });
window.addEventListener('blur', startQuizAway);
window.addEventListener('focus', () => endQuizAway(true));
setInterval(() => { if (quizActive()) { if (quizAwayNow()) startQuizAway(); else endQuizAway(true); } }, 1000);
/* 占用时长：停留在某关卡（听课或做小测）的全部时间，含暂停、切走 */
let tickAt = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min((now - tickAt)/1000, 70); tickAt = now;
  if (st.name && (st.view === 'learn' || st.view === 'quiz')) { stat(curKey()).occ += dt; if (Math.random() < 0.1) save(); }
}, 1000);
/* 暂停：学员主动暂停或切走窗口导致的暂停（翻页、听完不算） */
let navPause = false, pauseAt = null, pauseWhy = '';
function endPause(doReport){
  if (pauseAt == null) return;
  const sec = (Date.now() - pauseAt)/1000; pauseAt = null;
  stat(st.cur.s).ps += sec;
  if (doReport) report({event:'继续播放', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`暂停 ${Math.round(sec)} 秒（${pauseWhy}）`});
}
/* 卡顿：播放中因网络缓冲停住 */
let stallAt = null;
function endStall(){
  if (stallAt == null) return;
  const sec = (Date.now() - stallAt)/1000; stallAt = null;
  if (sec < 0.8) return;
  const s = stat(st.cur.s); s.kn += 1; s.ks += sec;
  report({event:'卡顿', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`缓冲卡顿 ${sec.toFixed(1)} 秒`});
}

/* ---------- 音频播放 ---------- */
const au = $('#au');
const VU = f => (DATA.remote && DATA.remote[f]) || (f + '?v=' + ((DATA.v||{})[f]||''));
const SL = p => (DATA.v||{})['slides/'+p+'.jpg'] ? VU('slides/'+p+'.jpg') : VU('slides/'+p+'.png');
const PRE = {}; function preload(p){ if(!p||PRE[p.p]) return; PRE[p.p]=1; const i=new Image(); i.src=SL(p.p); const a=new Audio(); a.preload='auto'; a.src=VU('audio/'+p.p+'.mp3'); }
let rate = 1, playing = false, pendingAfter = null;
function pageTiming(p){ return DATA.timing[p.p]; }
function sentAt(p, t){
  const tm = pageTiming(p); let acc = 0;
  for (let i=0;i<tm.durs.length;i++){ acc += tm.durs[i]; if (t < acc) return i; }
  return tm.durs.length-1;
}
au.addEventListener('timeupdate', () => {
  if (st.view !== 'learn') return;
  if (!au.paused && lastT != null) { const dt = au.currentTime - lastT; if (dt > 0 && dt < 3) { const real = dt/(au.playbackRate||1); pageSec += real; st.stageSec[st.cur.s] = (st.stageSec[st.cur.s]||0) + real; stat(st.cur.s).play += real; } }
  lastT = au.currentTime;
  const p = curPage(); const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const i = sentAt(p, au.currentTime);
  const sub = $('#sub'); if (sub && sub.dataset.i != i){ sub.dataset.i = i; sub.textContent = tm.sents[i].trim(); }
  const bar = $('#progfill'); if (bar) bar.style.width = (100*au.currentTime/total).toFixed(1)+'%';
  const tt = $('#time'); if (tt) tt.textContent = fmt(au.currentTime)+' / '+fmt(total);
});
/* 群播报：暂停/切屏/离开满 2 分钟、结业 */
const BOT = 'https://open.feishu.cn/open-apis/bot/v2/hook/82649ac6-80a5-409e-9121-95139667f76c';
const CN = CFG.short || CFG.title;
function bot(text, force){ if (!st.name) return; if (!force && st.final && st.final.pass) return; try { fetch(BOT, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify({msg_type:'text', content:{text}})}); } catch(e) {} }
const who = () => st.name + '（' + (st.team || '未填职场') + '）';
let awayT = null, pauseT = null;
function watchAway(kind){ if (!st.name || awayT || st.view === 'home') return; awayT = setTimeout(() => bot(who() + '在' + CN + '课已' + kind + '2分钟'), 120000); }
function backAway(){ clearTimeout(awayT); awayT = null; }
document.addEventListener('visibilitychange', () => { if (document.hidden) { backAway(); watchAway('离开'); } else if (document.hasFocus()) backAway(); });
window.addEventListener('blur', () => { if (!document.hidden) watchAway('切屏'); });
window.addEventListener('focus', backAway);
au.addEventListener('pause', () => { clearTimeout(pauseT); if (au.ended || st.view !== 'learn') return; pauseT = setTimeout(() => { if (au.paused && !document.hidden && document.hasFocus() && st.view === 'learn') bot(who() + '在' + CN + '课已暂停2分钟'); }, 120000); });
au.addEventListener('play', () => clearTimeout(pauseT));
au.addEventListener('error', () => { if (window.REVIEW) return; if (st.view !== 'learn' || !au.getAttribute('src')) return; const p = curPageSafe(); if (!p) return; if (!au.dataset.retried) { au.dataset.retried = 1; const t = au.currentTime; au.src = au.src + (au.src.includes('?') ? '&' : '?') + 'r=' + Date.now(); au.currentTime = t; play(); return; } st.heard[p.p] = true; save(); const nb = $('#next'); if (nb) nb.disabled = false; const sub = $('#sub'); if (sub) sub.textContent = '本页声音加载失败，可以看字幕后直接点「下一页」继续。'; });
au.addEventListener('ended', () => { if (window.REVIEW) return; playing = false; updPlayBtn(); onPageEnd(); });
au.addEventListener('pause', () => {
  playing = false; updPlayBtn(); endStall();
  const atEnd = au.ended || (au.duration && au.currentTime >= au.duration - 0.3);
  if (navPause || atEnd || st.view !== 'learn') { navPause = false; return; }
  const s = stat(st.cur.s); s.pn += 1; pauseAt = Date.now(); pauseWhy = autoWhy || (document.hidden ? '切出页面自动暂停' : '主动暂停'); autoWhy = '';
  report({event:'暂停', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:pauseWhy});
});
au.addEventListener('play', () => { playing = true; updPlayBtn(); const v=$('#veil'); if(v) v.hidden = true; endPause(true); });
au.addEventListener('waiting', () => { if (!au.paused && au.currentTime > 0.5 && stallAt == null) stallAt = Date.now(); });  // 每页开头的首次加载不算卡顿
au.addEventListener('playing', endStall);
function fmt(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
/* 防分屏：窗口不到屏幕 80% 宽就不让播；电脑上播放时自动全屏，退出全屏就暂停 */
const IS_MOBILE = /Mobi|Android|iPhone|iPad|iPod|HarmonyOS/i.test(navigator.userAgent);
function tooSmall(){ if (document.fullscreenElement) return false; const w = window.outerWidth || window.innerWidth; return w < (screen.availWidth || screen.width) * 0.8; }
function needFS(){ return !IS_MOBILE && document.fullscreenEnabled; }
function showVeil(msg){ const v = $('#veil'); if (v) { v.hidden = false; const b = $('#veilBtn'); if (b) b.textContent = msg; } }
function play(){
  if (st.view === 'learn' && tooSmall()) { showVeil('检测到分屏或窗口太小，请把窗口最大化后点我继续'); return; }
  if (st.view === 'learn' && needFS() && !document.fullscreenElement) { try { document.documentElement.requestFullscreen().catch(() => {}); } catch(e) {} }
  au.playbackRate = rate; au.play().catch(() => { const v=$('#veil'); if(v) v.hidden=false; });
}
window.addEventListener('resize', () => { if (st.view === 'learn' && playing && tooSmall()) { autoPause('分屏或窗口太小自动暂停'); showVeil('检测到分屏或窗口太小，请把窗口最大化后点我继续'); } });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && needFS() && st.view === 'learn' && playing) { autoPause('退出全屏自动暂停'); showVeil('已退出全屏，点我继续（会自动回到全屏）'); } });
function updPlayBtn(){ const b = $('#pp'); if (b) b.textContent = playing ? '暂停' : '播放'; }

/* 切走自动暂停——防挂机。两种情况都算：
   1) 页面被隐藏（最小化、切标签页、被完全挡住）；
   2) 浏览器窗口失去焦点（点到了 WPS、微信等其他窗口，哪怕只挡住一部分） */
let autoWhy = '';
function autoPause(why){
  if (!playing) return;
  autoWhy = why; au.pause();
  const v = $('#veil'); if (v) { v.hidden = false; $('#veilBtn').textContent = '检测到你切到了其他窗口，已暂停 · 点我继续'; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause('切出页面自动暂停'); });
window.addEventListener('blur', () => { autoPause('切到其他窗口自动暂停'); });
/* 兜底：个别环境 blur 不触发时，每秒检查一次窗口焦点 */
setInterval(() => { if (playing && !document.hasFocus()) autoPause('切到其他窗口自动暂停'); }, 1000);

/* ---------- 视图 ---------- */
function curStage(){ return STAGES[st.cur.s]; }
function curPage(){ return curStage().pages[st.cur.p]; }
function stageStatus(i){
  if (st.passed[i]) return 'pass';
  if (i <= st.unlocked) return 'open';
  return 'lock';
}
function mapHTML(active){
  const nodes = STAGES.map((s,i) => {
    const ss = stageStatus(i);
    const sub = ss==='pass' ? ('已过关'+(st.best[i]!=null?' · '+st.best[i]+'/'+s.quiz.length:'')) : ss==='open' ? (s.quiz.length?'学完测 '+s.quiz.length+' 题':'学完解锁综合测试') : '未解锁';
    return `<button class="node ${ss} ${active===i?'cur':''}" data-go="${i}" ${ss==='lock'?'disabled':''}>
      <span class="k">阶段 ${s.num}</span><span class="t">${esc(TITLES[s.num]||("阶段 "+s.num))}</span><span class="s">${sub}</span></button>`;
  });
  const fOpen = STAGES.every((s,i)=>st.passed[i]);
  const fs = st.final && st.final.pass ? '已通过 · '+st.final.score+'/'+FINAL.length : fOpen ? FINAL.length+' 题 · 待作答' : '全部阶段过关后解锁';
  nodes.push(`<button class="node ${st.final&&st.final.pass?'pass':fOpen?'open':'lock'} ${active==='final'?'cur':''}" data-final ${fOpen?'':'disabled'}>

    '<h2 style="margin:8px 0">审核 · '+esc(CFG.title)+'</h2><p class="rule">'+DATA.pages.length+' 页 · '+DATA.qs.length+' 题 · '+(bad?'<b style="color:#dc2626">'+bad+' 处念题不一致</b>':'念题全部一致')+' · 点任意一句讲稿可单独播放（1.5 倍速）</p>'+pages+'<h2>题库（阶段小测 + 综合测试）</h2>'+qs;
