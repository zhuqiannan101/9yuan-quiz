<script>
const DATA = {"pages":[{"row":2,"stage":"阶段1·科技特长生认知","p":"P01","topic":"封面：科技特长生规划（PY 线）","script":"前面我们已经一起了解过，孩子学习编程，能锻炼逻辑思维、培养良好学习习惯，还能反向助力校内学科提升。\n但很多家长心里会有一个疑问：短期学是锻炼能力，那长期坚持学编程，最终能给到孩子一条什么样清晰的出路？\n这就是我们今天这节课的核心 ——科技特长生规划。\n在核桃编程，我们不只是带着孩子零散上课、学知识点，而是给孩子搭好一条长期可落地的成长路线，对接考级、赛事与科技特长升学通道。\n学好这部分内容，大家后续和家长沟通的时候，就不再只讲思维、兴趣，还能给到家长一份长远、清晰的成长方案，建立更专业丰满的老师形象，增强家长长期续报、持续跟着我们学习的信心。\n今天我们就一起来搞懂：科技特长生规划的适用场景、核心内容，以及我们需要掌握的沟通技能","interact":null,"sku":"","dept":""},{"row":3,"stage":"阶段1·科技特长生认知","p":"P02","topic":"目录：科技特长生 / 核桃赛考规划 / 核桃赛考优势","script":"那今天咱们整节课就围绕这三大板块展开。\n第一块，我们先把底层概念讲清楚：到底什么是科技特长生，以及我们为什么一定要把这个信息传递给家长、它能给孩子带来哪些实实在在的价值。\n第二块，也是我们核心落地的内容：在核桃编程，我们给到孩子一套完整的赛考规划路线，孩子从入门到高阶，考级、参赛的节奏是怎么安排的。\n第三块，我们来看核桃的硬实力，讲我们在赛考板块独有的优势，都是有真实获奖成绩、真实案例支撑的，不是空口宣传。\n这三块层层递进，大家吃透之后，跟家长沟通的时候，既能讲清楚政策方向，又能给到可落地的学习方案，还能拿出我们的成果建立信任。","interact":null,"sku":"","dept":""},{"row":4,"stage":"阶段1·科技特长生认知","p":"P03","topic":"第一章：科技特长生（章节页）","script":"首先我们进入第一部分，我们先来了解一下科技特长生这个概念","interact":null,"sku":"","dept":""},{"row":5,"stage":"阶段1·科技特长生认知","p":"P04","topic":"什么是科技特长生？（认证条件·好处·覆盖 88%）","script":"各位小伙伴在之前有没有见过体育特长生或者艺术特长生呀？那他们的特征是不是可以通过一个考一般的分数，但是可以去一个好学校？\n好，那接下来我们一块来看一看到底什么是科技特长生。\n科技特长生是经教育厅、教育局发文，有正式定义、享有特殊招生政策的学生群体\n获得特长生认证需学业成绩达标，并在科技领域有一定特长或在市级及以上的科技比赛拿到三等奖以上的奖项,如编程类白名单赛事。很多重点高中都有科技特长生招生政策。好，那我们再来看一个很关键的一条，首先第一个点，获得科技特长生认证，它需要学业成绩达标。且在科技领域有一定特长，比如获得市级一等奖、省级二等奖、国家三等奖\n那被认定为科技特长生之后，他会有什么样的好处呢？比如这个小朋友被认定成功了，那他在初中阶段，升学的时候，比如初升高就可以享受或实现降分录取的一个效果。来看一道题，获得科技特长生认证，在比赛奖项上的门槛是？","interact":{"q":"获得科技特长生认证，在比赛奖项上的门槛是？","at":"P04","options":["校级二等奖、区级三等奖、参与奖即可","市级一等奖、省级二等奖、国家级三等奖及以上","只要参加比赛，不要求获奖等级","没有奖项要求，学业达标就够了"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":6,"stage":"阶段1·科技特长生认知","p":"P05","topic":"国家为什么重视科技特长生？（政策扶持·急需人才·2024 取消艺术特长生）","script":"那了解完什么是科技特长生，我们一块来看看，国家为什么特别重视科技特长生呢？\n先看图片左边第一张图科技特长生全国覆盖趋势全分析。\n从柱状数据我们能清晰看到变化：2022 年开放科技特长生招生的地区还比较少，到 2023 年、2024 年，覆盖省份、城市数量逐年上涨，这个赛道是在稳步扩容，不是一阵风的短期热点。同时图里也标注了定义：科技特长生，就是拿到赛事证书、有科创成果，在科技领域具备特长的学生；还有核桃的成果数据，这么多年我们已经帮助上万名孩子拿到相关证书，走科技特长路线。\n接着我们看中间第二张图从科技特长生政策变化看升学规划\n表格把政策调整分成了招生计划、招生项目、强基计划、出国留学这几个板块。招生人数逐年增加，很多地区允许降分录取；招生重点方向就是机器人、信息学也就是咱们的编程、科技创新；而且科技特长和强基计划挂钩，能提升孩子冲刺重点高校的概率，就算未来有出国打算，科创赛事经历也能丰富背景。下方还给了家长规划建议：提早备赛、选感兴趣方向、多去实践，这些也是我们后面给家长做规划时会用到的要点。\n\n最后我们再看右侧的文字要点，这里提炼了三层核心逻辑：\n第一，国家政策扶持，从 2015 年就开始布局科技特长生，目标是储备科创人才；\n第二，国家现在急需科技人才，围绕科技兴国、科技强国的战略，信息技术、人工智能方向的人才缺口很大；\n第三，也是家长最关心的对比点：2024 年教育部全面取消艺术特长生，政策重心转向科技特长生，学编程，就是切入这条赛道最主流的方式。\n\n所以综合整张页面的信息不难发现，国家正在大力支持科技教育。作为家长，就需要给孩子提前布局，通过编程提升孩子的科技素养，抓住科技特长生在升学中的红利，锁定优质学校的录取机会。\n最后注意：跟家长沟通的时候，我们只讲增加赛道、多一个选择权、政策红利，千万不要承诺保录取、一定降分，守住沟通风险，避免过度承诺，这是红线。","interact":null,"sku":"","dept":""},{"row":7,"stage":"阶段1·科技特长生认知","p":"P06","topic":"科技特长生趋势（各地招生规则案例）","script":"先来看一下这几个科技特长生的招生规则，我们会发现不同地区不同学校对于科技特长生的标准是不同的。","interact":null,"sku":"","dept":""},{"row":8,"stage":"阶段1·科技特长生认知","p":"P07","topic":"怎样才能被认定为科技特长生？（市一省二国三·初升高）","script":"大家看页面上的案例图，看完之后大家就能发现：全国各个省市、各个学校，对应的招生政策其实是有差异的，并不是全国统一一套标准。\n\n那我们来回顾一个核心问题：怎样才能被认定为科技特长生？\n很多伙伴会记得一句话：市一、省二、国三。但是大家一定要记住，这个标准不是绝对固定的，不同省份、不同城市，强省和弱省之间，认定门槛是有区别的。\n就像图里展示的中学科技特长招生简章，很多学校开设专项科技特长班的时候，会在自己的招生公告里，写明本校认可的比赛、以及对应的获奖成绩要求，以学校公布的标准为准。\n\n这里还有一个非常关键的知识点，大家一定要牢牢记住：\n科技特长生政策，主要是在初升高阶段发挥作用；小升初阶段，是没有直接加分、降分录取政策的，赛事证书更多是给孩子的简历增色，丰富孩子的背景，这个区分点，我们跟家长沟通的时候一定要讲清楚，避免家长产生误解。来看一道题，科技特长生政策主要在哪个升学阶段发挥作用？","interact":{"q":"科技特长生政策主要在哪个升学阶段发挥作用？","at":"P07","options":["幼升小","小升初（直接加分降分）","各阶段完全相同","初升高（小升初主要是简历加分）"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":9,"stage":"阶段2·核桃赛考规划：考级与赛事","p":"P08","topic":"第二章：核桃赛考规划（章节页）","script":"好，前面我们介绍了科技特长生，接下来我们一块来看在核桃编程，我们是如何给孩子做赛考规划的","interact":null,"sku":"","dept":""},{"row":10,"stage":"阶段2·核桃赛考规划：考级与赛事","p":"P09","topic":"赛考梯度：入门级·专业级·奥赛级（金字塔价值逻辑）","script":"大家先看左边这张国内主流编程竞赛概览图，它是按照孩子的学习阶段，分成了三个梯度：入门级、专业级、奥赛级。\n\n第一个，入门级，对应小学阶段，就是编程考级考级本质是检验孩子基础知识掌握得怎么样，孩子学完对应阶段内容就可以参加。考级也是后面竞赛的基础。如果家长打算让孩子后续走竞赛路线，可以先从考级入手，拿到基础能力认证，提前积累参赛经验。\n\n第二个，专业级，覆盖小学和初中，是编程竞赛\n竞赛分软件类，也就是咱们的代码编程，还有硬件类，像机器人这类科创项目。比赛会按照孩子学的编程语言分开，而且竞赛大多是选拔制，有晋级比例，难度会比考级更高。\n\n第三个，奥赛级，面向初中和高中，也就是信息学奥赛\n信息学奥赛是五大奥赛之一，考察 C++，也是很多编程孩子的目标。拿到省级奖项，对升学就有很大帮助；如果能拿到国家级奖项，会受到清北等顶尖名校的青睐。\n\n我们再看右边这个金字塔，它讲清楚了这条路线的价值逻辑：\n最底层，先锻炼思维、试错成本低；往上走，证书可以给孩子履历添彩；再往上，用来检验学习成果；最终，服务于升学。\n页面底部这句话大家一定要记牢：目前核桃是全流程配套课程，不管孩子是入门考级、打专业竞赛，还是冲刺信息学奥赛，我们都有对应的课程和赛事服务可以跟上。\n也就是说，孩子从入门到高阶，不用中途换体系，在核桃一条路就能走到底。\n跟家长沟通的时候，要结合孩子年龄去匹配路线，低龄孩子优先讲考级打基础，不要一上来就跟家长讲 CSP、国赛，避免家长觉得门槛太高、压力太大。预期过高。","interact":null,"sku":"","dept":""},{"row":11,"stage":"阶段2·核桃赛考规划：考级与赛事","p":"P10","topic":"可参加的考级与比赛清单（YCL/CTL/GESP·图灵杯·信奥赛）","script":"好，那前面讲了那么多，接下来呢，我们一块来看一看。在核桃编程它可以参加的考级和比赛都有哪些？首先考级有三个，YCL  CTL 和 GESP 比赛我们分成两个板块，一个叫国家级比赛，一个叫白名单比赛。国家级比赛包括图灵杯、白名单比赛主要是信奥赛\n\n后面我们会详细的去讲。这个时候我们知道有哪些考级和比赛就可以","interact":null,"sku":"","dept":""},{"row":12,"stage":"阶段2·核桃赛考规划：考级与赛事","p":"P11","topic":"主推考级对比：CTL vs GESP（主办·频次·费用·价值）","script":"刚刚我们了解了核桃完整的赛考梯度路线，接下来我们就聚焦咱们核桃主推、可以内推报名的两大考级：CTL 和 GESP。大家跟着我先看左边这个对比表格。\n\n第一个，全国青少年计算思维等级测评，也就是 CTL。\n它的主办单位是中国光华科技基金会，由共青团中央主管，指导单位是清华大学计算机科学与技术系，这也是它含金量的核心亮点。\n它的考试频次是每个月都有一次，这里重点跟大家强调：虽然每月都能考，但我们不建议家长自己随便挑时间报，一定要跟着咱们核桃课程的运营规划走。我们是统一安排好节奏的，哪个阶段复习考级、哪个阶段备战比赛，都是规划好的，跟着节奏走，孩子备考效率更高。\n参赛语言包含图形化、Python、C++ 三种；费用方面，各级统一 300 元每级（图形化 1-4 级，Python、C++ 1-6 级）。CTL有纸质版证书\n它最大的价值，就是共青团中央直属单位主办的专业等级测评，这个点我们跟家长沟通的时候，可以重点突出。\n\n第二个，CCF 编程能力等级认证，GESP。\n主办单位是中国计算机学会，也就是咱们信奥的官方主办方。\n考试时间固定在 3、6、9、12 这四个月份。同样，报名节奏也要跟着我们课程安排走，不建议家长自行盲目报考。\n参赛语言同样是图形化、Python、C++；费用是一级 300 元，之后每升一级增加 20 元。\n它最核心的价值大家一定要记牢：GESP 可以衔接 CSP，拿到对应成绩，就有机会直接获得 CSP-J 普及组、CSP-S 提高组第二轮的参赛资格，而且是信奥主办方亲自命题，权威性、公信力非常高，是往信息学奥赛方向走非常关键的一步。\n\n大家再看页面右侧，这两张就是 GESP 和 CTL 的证书样例，也是孩子考完之后拿到的成果证明，不管是用来检验学习成果，还是给孩子简历增色，都是实打实的凭证。来看一道题，关于 CTL 与 GESP 两大主推考级，正确的说法是？","interact":{"q":"关于 CTL 与 GESP 两大主推考级，正确的说法是？【多选】","at":"P11","options":["CTL 由中国光华科技基金会主办（共青团中央主管），清华大学计算机科学与技术系指导","GESP 由中国计算机学会（CCF）主办","GESP 拿到对应成绩，有机会直接获得 CSP-J/S 第二轮的参赛资格","CTL 每月一次；GESP 一年 3、6、9、12 月四次","两个考级都由共青团中央主管"],"answer":0,"answers":[0,1,2,3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":13,"stage":"阶段2·核桃赛考规划：考级与赛事","p":"P12","topic":"国家级赛事：图灵杯（一年 2 场·300 元·电子证书）","script":"接下来我们来看核桃主推的国家级赛事 ——图灵杯全国青少年编程及人工智能挑战活动\n首先是举办单位：中国光华科技基金会主办，指导单位是清华大学计算机科学与技术系，和我们前面 CTL 考级是同一个主办体系，背书同样是共青团中央。\n它一年会举办 2 场：上半年是 3-7 月初赛，8 月决赛；下半年是 9-1 月初赛，次年 2 月决赛最终时间还是以组委会当年发布的赛制为准。\n参赛语言同样覆盖图形化、Python、C++，适配咱们不同阶段的学员；参赛费用是 300 元每人。图灵杯没有纸质版证书，只有 电子版\n重点说赛事价值：它的主办单位背靠团中央，同时也是教育部白名单赛事的主办单位之一，权威性、含金量都很高，证书在科技特长生认定、简历增色的时候认可度很好。\n\n大家再看右边，这就是图灵杯的证书样例，分不同组别，像大家看到的这个就是算法竞赛组一等奖证书。\n这里也跟大家同步沟通要点：图灵杯属于竞赛类，和考级不一样，考级偏向检验基础，而图灵杯是竞技比拼，适合有一定基础、想要冲奖项、丰富科创履历的孩子。同样，参赛节奏我们也是统一规划，跟着核桃的课程进度安排备赛，不建议家长单独报名。\n和家长介绍的时候，可以联动 CTL 一起讲：CTL 偏向等级测评、打基础；图灵杯是同体系下的竞赛赛道，用来拿奖项，两个可以搭配规划最合理。","interact":null,"sku":"","dept":""},{"row":14,"stage":"阶段2·核桃赛考规划：考级与赛事","p":"P13","topic":"什么是教育部白名单赛事（47 项·科学素养 22 项·不收费硬性条件）","script":"刚刚我们介绍了图灵杯，很多家长都会问到一个关键词：白名单赛事。那这一页，我们就一起来搞懂，到底什么是教育部白名单赛事。\n\n先看页面左边：什么是白名单赛事？\n白名单赛事，就是教育部官方公布，面向 6 到 18 岁中小学生的全国性竞赛活动。\n它有四个核心特点：\n第一，主办机构权威，必须是中央编办、民政部登记注册的正规机构，拿到教育部认可；\n第二，编程科创类赛事占比很高，最新 2025-2028 学年的白名单里一共 47 项竞赛，其中科学素养类就有 22 项；\n第三，奖项对升学有参考价值，在白名单五大科学竞赛里，像信息学奥赛，金牌选手是顶尖名校重点关注的对象，银牌选手也有机会走强基计划冲刺名校；\n第四，它是人才培养的风向标，代表国家教育和科创人才的发展方向。\n\n接着我们再看页面右侧，分三块给大家拆解：解读、要求、作用。\n首先：白名单是教育部面向 6-18 岁学生发布的全国竞赛名单，主办方资质严格，是官方认可的正规赛事。\n然后：有一个关键点大家一定要记住，赛事本身不收费，是入选白名单的硬性条件之一。这\n最后是作用，也是家长最关心的：\n第一，它是培养孩子特长的风向标，代表国家未来科创人才的培养方向；\n第二，竞赛成果对升学是有参考作用的；\n第三，现在很多学校都在做综合素养评价，还有科技特长生招生，白名单体系内的竞赛经历、获奖证书，在里面权重很高，含金量更好。\n\n最后底部这句话大家可以记一下：现在是科技强国的时代，国家急需科创人才，教育方向也在跟着这个大方向调整。\n\n跟家长沟通注意话术边界：白名单证书不是直接加分，是在综合评价、科技特长招生、强基初审里更有优势；另外一定要区分：主办单位在白名单 不等于这个活动本身就是白名单赛事，不要说错。","interact":null,"sku":"","dept":""},{"row":15,"stage":"阶段2·核桃赛考规划：考级与赛事","p":"P14","topic":"白名单赛事：信息学奥林匹克竞赛 NOI（CSP-J/S 入口·金银铜价值）","script":"刚刚我们了解了什么是教育部白名单赛事，那这一页，咱们就来看编程赛道里含金量最高的白名单赛事 ——信息学奥林匹克竞赛 NOI，也就是大家常说的信奥，它的入门通道就是 CSP-J/S\n举办单位是中国计算机学会 CCF，也就是 GESP 同一个主办方，一年举办一次。\n参赛语言固定只有 C++，这也是为什么我们高阶阶段会专门带孩子学习 C++。\n费用这块大家记清楚：CSP 初赛 50 元；复赛里面，J 普及组 310 元，S 提高组 560 元。\n参赛时间节点：初赛在 9 月下旬，复赛 10 月下旬；之后 NOIP 是 11 月，最高级别 NOI 在次年 7 月，是一条逐级向上晋级的路线。\n重点就是赛事价值，也是家长最关心的：\n拿到金牌，有机会直接被清北等顶尖名校录取；银牌，可以走强基计划，在 985、211 院校的招生里获得降分优势；铜牌，报考中科大少年班、少创班，还有额外 20 分的加分机会。\n注意：以上表述都不能用确定性保证的口吻，因为政策每年都会改变。\n大家再看右边，这就是 CSP-J/S 的官方证书样例，分为入门级和提高组，有一级、二级、三级能力等级。\n这里跟大家同步沟通要点：这条路周期长、难度高，不是短期速成的。咱们前面的 CTL和GESP 考级，就是用来铺垫、帮孩子拿到 CSP 复赛资格的前置路径，整条路线是连贯的。同样，备赛节奏统一跟着核桃课程规划走，循序渐进。\n跟家长沟通一定要把握好分寸，不要承诺拿金牌、保送。要客观说明：信奥是长线赛道，适合逻辑思维强、能长期坚持的孩子；它是升学的加分机会，不是捷径。来看一道题，CSP 初赛的报名费用是？","interact":{"q":"CSP 初赛的报名费用是？","at":"P14","options":["100 元","50 元","310 元","免费"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":16,"stage":"阶段2·核桃赛考规划：考级与赛事","p":"P15","topic":"信奥完整晋级路线：CSP-J/S→NOIP→NOI→IOI","script":"刚刚我们认识了 CSP-J/S，这一页我们把完整的信奥晋级路线串起来，也就是：CSP-J/S → NOIP → NOI → IOI，大家看这条时间轴。\n\n我们按时间顺序一步步看：\n每年9 月，最先开始的是 CSP-J/S 初赛；\n通过初赛之后，10 月参加 CSP-J/S 复赛；\n复赛达到要求的成绩，11 月可以参加 NOIP；\nNOIP 结束，在次年3、4 月进行省队选拔；\n选拔成功，7 月去参加 NOI 全国决赛；\n最后，从 NOI 里选出国家队选手，在8、9 月出战 IOI 国际信息学奥赛，这是信奥最高舞台。\n\n这条是一条层层晋级、逐级筛选的长线赛道。前面我们讲的 GESP，就是帮孩子提前铺垫，拿到 CSP 复赛资格的前置关卡。\n我们给家长介绍的时候，要讲清楚：不是所有人都能一路走到 IOI，大部分孩子的目标，是走到 CSP、NOIP，拿到奖项服务科技特长生、强基计划。整条路线周期很长，需要持续稳定的学习和备赛，核桃会跟着这个赛程节点，匹配对应的课程和集训。","interact":null,"sku":"","dept":""},{"row":17,"stage":"阶段3·核桃赛考优势与服务","p":"P16","topic":"第三章：核桃赛考优势（章节页）","script":"下来进入我们第三部分：核桃赛考优势，我们一起来看一看，核桃是怎么帮孩子系统化规划、稳稳落地赛考的。","interact":null,"sku":"","dept":""},{"row":18,"stage":"阶段3·核桃赛考优势与服务","p":"P17","topic":"核桃赛考两大核心优势（完善的赛事规划·优异的赛考成绩）","script":"接下来我们来看核桃赛考两大核心优势。\n第一点，完善的赛事规划。\n很多家长自己去了解赛事，很容易混乱：不知道什么时候考、先考哪个、考级和比赛怎么搭配，容易盲目报考，浪费时间和机会。在核桃，我们会根据孩子的学习进度、年龄、逻辑能力，给孩子做一整条长期赛考路线。从入门 CTL考级打底，到图灵杯冲奖项，再到高阶冲击 CSP 信奥，什么阶段备考、什么时候报名、考前什么时候安排集训，全部统一规划，不用家长自己费心研究政策和时间节点，跟着课程节奏走就可以。\n\n第二点，优异的赛考成绩。\n有了清晰规划之后，最终落地就是成绩。我们不是只带孩子报名，配套有专门的赛考集训、真题训练、考点梳理，历年也有很多学员在 CTL、GESP、图灵杯、CSP 当中拿到不错的等级和奖项，有真实的成果案例可以给家长参考，证明这套路线是跑通的。","interact":null,"sku":"","dept":""},{"row":19,"stage":"阶段3·核桃赛考优势与服务","p":"P18","topic":"PY 短期规划：1 学期达国家级证书竞赛备考水平（3 个月 CTL 一级）","script":"Python 方向的短期规划，左边这条时间轴，是 Python 科技特长实验班的学习节奏：1 个学期，孩子可以达到国家级证书竞赛的备考水平。\n第 1 个月做 Python 编程知识启蒙；2 个月开始接触等级考试题型；3 个月达到 CTL 一级的备考水平；4-5 个月进阶学习，积累各类赛考知识点；6 个月达到白名单国家级赛事的备赛水平；后续持续深耕，朝着科技特长生方向积累能力，为小升初、初升高做准备。同样是：进可以朝着科技特长方向准备，退可以夯实数理基础。\n\n右边是 Python 一年的能力规划：学满一年，孩子可以达到 4 类国家级证书赛事的备考水平。\n包含 CTL 一级、CTL 三级两类权威等级的备考能力，以及两项国家级赛事的参赛准备能力。\n大家也可以对比学习周期：在核桃，达到 CTL 一级备考水平仅需 3 个月、CTL 三级备考水平 9 个月，另外两项赛事备赛能力分别 6 个月、12 个月；市面上其他机构，达到同等水平需要的周期会更长。\n\n4199 的 Python 科特线对应 CTL，思维方向的 Python 对应 YCL，给家长介绍的时候不要混淆两条路线。来看一道题，4199 的 Python 科特线对应哪个考级？","interact":{"q":"4199 的 Python 科特线对应哪个考级？","at":"P18","options":["CTL（思维方向的 Python 对应 YCL，不要混淆）","YCL（科特方向的 Python 对应 YCL，容易记混）","GESP（一级 300 元起，逐级加 20 元的那个）","CSP-J（信奥普及组的第一轮比赛）"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":20,"stage":"阶段3·核桃赛考优势与服务","p":"P19","topic":"PY 长期规划：五阶段对标（CTL→GESP→CSP-S/NOIP→NOI）","script":"Python 科技特长实验班的长期赛考规划，适合直接从 Python 起步的孩子。\n整条路线分为五个阶段：基础储备期 Python 阶段 1、基础特长期 Python 阶段 2、信奥基础期 C++1-3 阶段、信奥超越期 C++4-6 阶段，最后是信奥集训队。\n每个阶段对应的能力对标：\n\n基础储备期 Python 阶段 1：对标 CTL 1 级，具备 Python 方向白名单赛事的备赛能力；\n基础特长期 Python 阶段 2：对标 CTL 3 级；\n信奥基础期 C++1-3 阶段：对标 GESP 1-4 级，可以达到 CTL、CSP-J 以及白名单赛事的参赛准备水平；\n信奥超越期 C++4-6 阶段：对标 GESP 5-8 级，具备 CSP-S、NOIP 的备赛能力；\n信奥集训队阶段：具备 NOIP 省赛、NOI 国赛的备赛能力。","interact":null,"sku":"","dept":""},{"row":21,"stage":"阶段3·核桃赛考优势与服务","p":"P20","topic":"过往等级考试成绩（CTL 通过率 94.84%·GESP 跳级资格）","script":"接下来我们看核桃赛考的第二大优势：过往等级考试的学员成果。\n左边是 CTL 全国青少年计算思维等级测评的数据，咱们核桃学员 C++ 一级的通过率高达 94.84%，累计已有 30692 名学员拿到 CTL 测评证书，这些都是我们往期学员的真实数据。\n右边是 GESP 等级认证的喜报，2025 年 9 月这场考试里，一共有 2868 位核桃学员顺利通过 GESP 等级认证；其中 402 位学员拿到 90 分及以上，获得跳级资格；还有 309 位学员，经指导老师评估推荐，获得跳考资格。\n\n这里跟大家说明一下：这些是我们往期学员的历史参考数据，能看出咱们配套的赛考集训、考点训练体系是经过验证的，但每个孩子的吸收情况不同，我们不保证一定可以通过或者跳级。","interact":null,"sku":"","dept":""},{"row":22,"stage":"阶段3·核桃赛考优势与服务","p":"P21","topic":"国家级/白名单赛事成绩（NOI 29 金·CSP 2218 人·白名单 104050 人）","script":"接下来我们看国家级、白名单赛事的往期学员成果，这也是咱们赛考体系实力的体现。\n\n第一张是 NOI 全国信息学奥林匹克的喜报，2026 年 NOI 赛事，核桃学员收获 29 金、109 银、66 铜，全国一半的金牌出自核桃；\n第二张是 CSP-J/S 的成绩，复赛获奖总人数 2218 人，其中 CSP-J 组 1445 人，CSP-S 组 773 人，还有 60 位学员拿到满分，同时核桃 OJ 平台一共有 4012 位获奖选手；\n第三张是 2025 年白名单赛事数据，累计 104050 名学员获奖，获奖人数在青少年编程行业里位居前列；\n第四张是图灵杯赛事，省级三等奖及以上获奖一共 88766 人，其中 12585 位选手晋级决赛，还有学员入选团中央认证的光华人才库。\n\n这里跟家长说明：以上全部都是往期学员的历史真实数据，能说明我们的赛考教研、集训配套体系是经过大量学员验证的，但赛事本身存在竞争，我们不保证孩子参赛就一定能够获奖。来看一道题，2026 年 NOI 赛事，核桃学员的获奖成绩是？","interact":{"q":"2026 年 NOI 赛事，核桃学员的获奖成绩是？","at":"P21","options":["29 金、109 银、66 铜——全国一半的金牌出自核桃","9 金、19 银、16 铜——全国三分之一的奖牌出自核桃","19 金、29 银、36 铜——奖牌总数全国排名第一","数据未公示——官方没有公布过获奖统计"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":23,"stage":"阶段3·核桃赛考优势与服务","p":"P22","topic":"权威认可（央广网等多家媒体报道）","script":"咱们在 NOI 全国信息学奥林匹克竞赛中的学员成绩，被央广网等多家权威媒体进行报道。媒体也对主流线上机构的赛事数据做了统计，核桃在 NOI 赛事里的表现，在同类线上编程机构当中位居前列，这也侧面印证了我们整套赛考培养体系的专业度。","interact":null,"sku":"","dept":""},{"row":24,"stage":"阶段3·核桃赛考优势与服务","p":"P23","topic":"成果可靠·遍布全国（优秀学员遍布全国·重点学校覆盖广）","script":"左边地图可以看到，核桃的优秀学员遍布全国多个省市，不管是不同地区、不同学情的孩子，都有跟着这套体系稳步成长、参与赛考的学员。\n右边是 2025 年白名单赛事的获奖情况，获奖学员来自全国大量重点中小学，重点学校的覆盖范围很广，也能说明这套培养方案适配不同地区、不同学校的孩子。","interact":null,"sku":"","dept":""},{"row":25,"stage":"阶段3·核桃赛考优势与服务","p":"P24","topic":"成果可靠·优秀学员（核桃 1 号学员李静榕 2023 NOI 金牌）","script":"李静榕是我们核桃的 1 号学员，他也在 2023 年获得了 NOI 金牌——他也是目前国内所有线上编程教育机构里边第一个获得 NOI 金牌的学员；\n这有一个当时对李静榕和他妈妈进行采访的视频，我们可以看一下","interact":null,"sku":"","dept":""},{"row":26,"stage":"阶段3·核桃赛考优势与服务","p":"P25","topic":"赛考全流程服务（护航·备赛群·直播·远程伴考·查分提醒）","script":"前面说了那么多，那我们一块来看看核桃编程会给家长提供哪些服务，或者说他报名成功之后，他可以享受哪些赛考类的服呢？ 除了成熟的赛考教研体系，核桃还给学员提供赛考全流程配套服务，帮家长和孩子省去很多琐事。\n第一，全流程护航：从报名提醒、赛前复习准备，到赛中参赛、赛后查分、证书发放，每个环节都有跟进；\n第二，专属备赛规划：结合孩子当下的学情，定制适合他的备赛节奏；\n第三，备赛期间会建立专属备赛微信群，随时给孩子答疑；\n第四，冲刺阶段安排直播，讲解考点、技术要点和答题拿分技巧；\n第五，比赛当天提供远程伴考，遇到突发问题可以及时响应；\n第六，成绩出来之后，主动提醒家长查询成绩、领取证书。\n\n简单来说，家长不用自己到处查赛事通知、找备考资料，从备赛到拿证，我们全程配合跟进。来看一道题，下列哪项不属于核桃赛考全流程服务？","interact":{"q":"下列哪项不属于核桃赛考全流程服务？","at":"P25","options":["全流程护航（报名提醒→赛前复习→赛中参赛→赛后查分→证书发放）","专属备赛微信群，备赛答疑","考后代查分数并修改成绩","远程伴考服务，突发问题及时响应"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":27,"stage":"阶段3·核桃赛考优势与服务","p":"P26","topic":"赛事研究中心（白名单聚焦·蓝桥青少首家官方合作）","script":"我们还有专门的赛事研究中心，来给孩子做长期赛考规划。\n这边会实时跟进各类赛事政策变动，及时更新赛事信息，给大家提供完整的赛事规划，包含赛前报名、备赛指导、赛后答疑、估分等全流程服务。\n我们重点聚焦教育部白名单这类高含金量赛事，也是蓝桥青少考试中心首家官方合作单位。\n课程内容和考试大纲紧密贴合，覆盖考点，做到精准对标。同时我们很多授课老师受邀担任多项赛事组委会成员，师资这块有很强的赛事经验，更好地助力孩子走科技特长路线。","interact":null,"sku":"","dept":""},{"row":28,"stage":"阶段3·核桃赛考优势与服务","p":"P27","topic":"结束寄语","script":"学习不息,成长不止\n追求卓越,舍我其谁\n培训很苦,坚持很酷\n你的付出\n决定成长速度","interact":null,"sku":"","dept":""},{"row":29,"stage":"阶段3·核桃赛考优势与服务","p":"P28","topic":"调研问卷","script":"记得扫码填写真实评价哦","interact":null,"sku":"","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"科技特长生规划·阶段1","q":"获得科技特长生认证需要满足的条件是？","options":[{"k":"A","t":"学业成绩达标，且参加任意一次科技活动"},{"k":"B","t":"学业成绩达标，且担任三年以上班干部"},{"k":"C","t":"学业成绩达标，且在市一、省二、国三及以上比赛中获奖"},{"k":"D","t":"学业成绩达标，且获校级运动会奖状"}],"answer":"C","back":"","sku":""},{"id":"T-S02","type":"阶段练习题","chapter":"科技特长生规划·阶段1","q":"被认定为科技特长生后，可以享受的好处是？【多选】","options":[{"k":"A","t":"初升高可享受降分录取"},{"k":"B","t":"小升初有机会入选初中名校科技专题班"},{"k":"C","t":"中考有机会走科技特长生招生通道升入重点高中"},{"k":"D","t":"高中拿下信奥赛银牌就有机会破格走强基计划；金牌且入选国家队，才有机会保送清北"},{"k":"E","t":"获得认证即可直接保送清北，无需任何比赛成绩"}],"answer":"ABCD","back":"","sku":""},{"id":"T-S03","type":"阶段练习题","chapter":"科技特长生规划·阶段1","q":"目前科技特长生在全国的覆盖比率是？","options":[{"k":"A","t":"50%"},{"k":"B","t":"66%"},{"k":"C","t":"88%"},{"k":"D","t":"100%"}],"answer":"C","back":"","sku":""},{"id":"T-S04","type":"阶段练习题","chapter":"科技特长生规划·阶段1","q":"国家重视科技特长生的原因包括？【多选】","options":[{"k":"A","t":"2015 年起国家大力推行科技特长生政策，储备科技创新人才"},{"k":"B","t":"科技兴国、科技强国战略下，科技创新型人才需求增大"},{"k":"C","t":"2024 年教育部全面取消艺术特长生，政策重心转向科技特长生"},{"k":"D","t":"艺术特长生规模扩大并保留重点扶持"}],"answer":"ABC","back":"","sku":""},{"id":"T-S05","type":"阶段练习题","chapter":"科技特长生规划·阶段1","q":"「市一、省二、国三」的认定标准，正确的理解是？","options":[{"k":"A","t":"全国统一固定标准，各地执行完全一致"},{"k":"B","t":"一般标准，各省市学校有差异，以学校招生标准为准"},{"k":"C","t":"只在小升初阶段适用，初中之后就失效"},{"k":"D","t":"已经全面取消，不再有认定一说"}],"answer":"B","back":"","sku":""},{"id":"T-S06","type":"阶段练习题","chapter":"科技特长生规划·阶段2","q":"编程赛考按学习阶段分为三个梯度，正确的对应关系是？","options":[{"k":"A","t":"入门级（初中·竞赛）、专业级（高中·考级）、奥赛级（小学·图形化）"},{"k":"B","t":"只分为考级和奥赛两级"},{"k":"C","t":"不按学习阶段划分"},{"k":"D","t":"入门级（小学·考级）、专业级（小学&初中·竞赛）、奥赛级（初中&高中·信息学奥赛）"}],"answer":"D","back":"","sku":""},{"id":"T-S07","type":"阶段练习题","chapter":"科技特长生规划·阶段2","q":"核桃学员可以参加的考级和比赛包括？【多选】","options":[{"k":"A","t":"考级：YCL、CTL、GESP"},{"k":"B","t":"国家级比赛：图灵杯"},{"k":"C","t":"白名单比赛：信奥赛"},{"k":"D","t":"蓝桥杯（在本节清单内）"}],"answer":"ABC","back":"","sku":""},{"id":"T-S08","type":"阶段练习题","chapter":"科技特长生规划·阶段2","q":"CTL 考级的主办与指导单位是？","options":[{"k":"A","t":"中国计算机学会主办，教育部直接指导"},{"k":"B","t":"中国光华科技基金会主办，清华大学计算机系指导"},{"k":"C","t":"核桃编程主办，中国计算机学会指导"},{"k":"D","t":"各省市教育厅轮流主办，没有固定单位"}],"answer":"B","back":"","sku":""},{"id":"T-S09","type":"阶段练习题","chapter":"科技特长生规划·阶段2","q":"GESP 最核心的价值是？","options":[{"k":"A","t":"升学加分——拿到证书即可抵扣中考分数"},{"k":"B","t":"直接保送——获奖即可免试进入信奥省赛"},{"k":"C","t":"衔接 CSP——拿到对应成绩就有机会获 CSP-J/S 第二轮参赛资格"},{"k":"D","t":"就业直通——拿到证书即可进入企业实习"}],"answer":"C","back":"","sku":""},{"id":"T-S10","type":"阶段练习题","chapter":"科技特长生规划·阶段2","q":"关于图灵杯，正确的说法是？","options":[{"k":"A","t":"一年 4 场：每季度各一场初赛加决赛，200 元/人"},{"k":"B","t":"一年 2 场：上半年 3-7 月初赛、8 月决赛；下半年 9-1 月初赛、2 月决赛"},{"k":"C","t":"一年 1 场：固定 8 月决赛，费用 500 元/人"},{"k":"D","t":"一年 12 场：每月都有一场，随报随考还免费"}],"answer":"B","back":"","sku":""},{"id":"T-S11","type":"阶段练习题","chapter":"科技特长生规划·阶段3","q":"核桃赛考的两大核心优势是？","options":[{"k":"A","t":"价格便宜 + 送课多"},{"k":"B","t":"名师多 + 教室大"},{"k":"C","t":"免费试听 + 无忧退费"},{"k":"D","t":"完善的赛事规划 + 优异的赛考成绩"}],"answer":"D","back":"","sku":""},{"id":"T-S12","type":"阶段练习题","chapter":"科技特长生规划·阶段3","q":"Python 科技特长实验班（短期规划）的学习节奏是？","options":[{"k":"A","t":"半年过 CTL 一级；一年后才接触考级和赛事"},{"k":"B","t":"1 个月达 CTL 三级；3 个月参加白名单国家级赛事"},{"k":"C","t":"1 个学期达国家级证书备考水平；6 个月达白名单赛事备赛水平"},{"k":"D","t":"无固定节奏，学员自由安排学习和备赛时间"}],"answer":"C","back":"","sku":""},{"id":"T-S13","type":"阶段练习题","chapter":"科技特长生规划·阶段3","q":"Python 方向的能力对标时间节点是？【多选】","options":[{"k":"A","t":"3 个月达到 CTL 一级备考水平"},{"k":"B","t":"9 个月达到 CTL 三级备考水平"},{"k":"C","t":"6 个月达到白名单国家级赛事备赛水平"},{"k":"D","t":"12 个月达到 CTL 一级备考水平"}],"answer":"ABC","back":"","sku":""},{"id":"T-S14","type":"阶段练习题","chapter":"科技特长生规划·阶段3","q":"Python 科技特长实验班长期规划的五个阶段中，「信奥超越期 C++4-6 阶段」对标的是？","options":[{"k":"A","t":"CTL 4-6 级，达到 NOIP 省赛的水平"},{"k":"B","t":"CTL 1-3 级，达到白名单赛事的参赛水平"},{"k":"C","t":"GESP 1-4 级，达到 CSP-J 的参赛水平"},{"k":"D","t":"GESP 5-8 级，具备 CSP-S、NOIP 的备赛能力"}],"answer":"D","back":"","sku":""},{"id":"T-S15","type":"阶段练习题","chapter":"科技特长生规划·阶段3","q":"核桃学员 CTL C++ 一级的通过率是？","options":[{"k":"A","t":"94.84%，累计 30692 名学员拿到 CTL 测评证书"},{"k":"B","t":"74.84%，累计 20692 名学员拿到 CTL 测评证书"},{"k":"C","t":"54.84%，累计 10692 名学员拿到 CTL 测评证书"},{"k":"D","t":"34.84%，累计 3069 名学员拿到 CTL 测评证书"}],"answer":"A","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题","chapter":"科技特长生规划·全章","q":"获得科技特长生认证，比赛奖项的最低门槛是？","options":[{"k":"A","t":"市级一等奖、省级二等奖、国家级三等奖及以上"},{"k":"B","t":"校级一等奖、区级二等奖、市级三等奖及以上"},{"k":"C","t":"有任意科技活动的参与奖即可，无等级要求"},{"k":"D","t":"无奖项要求，学业成绩达标就能认定"}],"answer":"A","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题","chapter":"科技特长生规划·全章","q":"国家为什么重视科技特长生？【多选】","options":[{"k":"A","t":"2015 年起大力推行科技特长生政策，为选拔培养科技创新人才做准备"},{"k":"B","t":"科技兴国、科技强国战略，科技创新型人才需求增大"},{"k":"C","t":"2024 年全面取消艺术特长生，重视科技特长生"},{"k":"D","t":"艺术特长生继续扩大招生"}],"answer":"ABC","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题","chapter":"科技特长生规划·全章","q":"科技特长生政策主要在初升高阶段发挥作用，小升初阶段赛事证书主要是简历加分。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题","chapter":"科技特长生规划·全章","q":"核桃学员能参加的考级与赛事有哪些？【多选】","options":[{"k":"A","t":"考级：YCL、CTL、GESP"},{"k":"B","t":"国家级比赛：图灵杯"},{"k":"C","t":"白名单比赛：信奥赛"},{"k":"D","t":"蓝桥杯（在本节清单内）"}],"answer":"ABC","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题","chapter":"科技特长生规划·全章","q":"GESP 的费用规则是？","options":[{"k":"A","t":"一级 300 元，之后每升一级增加 20 元"},{"k":"B","t":"一级 300 元，之后每升一级减少 20 元"},{"k":"C","t":"每级统一 300 元，升不升级别都一样"},{"k":"D","t":"一级 500 元，之后逐级递增 50 元"}],"answer":"A","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题","chapter":"科技特长生规划·全章","q":"图灵杯的赛事价值是？","options":[{"k":"A","t":"主办背靠团中央，教育部白名单赛事主办单位之一，含金量高"},{"k":"B","t":"主办是地方培训机构，赛事只在本市范围内认可"},{"k":"C","t":"主办是商业公司，只为营销课程而设的促销赛"},{"k":"D","t":"主办单位没有官方背景，证书只做纪念不留档"}],"answer":"A","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题","chapter":"科技特长生规划·全章","q":"教育部白名单赛事的核心特点包括？【多选】","options":[{"k":"A","t":"主办机构权威——中央编办、民政部登记注册的正规机构"},{"k":"B","t":"2025-2028 学年白名单共 47 项竞赛，科学素养类 22 项"},{"k":"C","t":"奖项对升学有参考价值"},{"k":"D","t":"是人才培养的风向标"},{"k":"E","t":"参赛必须收费"}],"answer":"ABCD","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题","chapter":"科技特长生规划·全章","q":"信奥赛事金牌、银牌、铜牌对应的价值是？","options":[{"k":"A","t":"金牌-仅荣誉证书；银牌-仅奖金奖励；铜牌-仅纪念奖品"},{"k":"B","t":"金牌-清北一流名校；银牌-强基/降分 985、211；铜牌-中科大少创班加 20 分"},{"k":"C","t":"金牌-直接保送清北；银牌-直接保送 985；铜牌-直接保送一本"},{"k":"D","t":"金牌-985 一流名校；银牌-普通一本降分；铜牌-无升学价值"}],"answer":"B","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题","chapter":"科技特长生规划·全章","q":"信奥完整晋级路线的正确顺序是？","options":[{"k":"A","t":"CSP-J/S 初赛（9 月）→NOIP（10 月）→复赛（11 月）→NOI（3-4 月）→省队选拔（7 月）→IOI（8-9 月）"},{"k":"B","t":"NOIP（9 月）→CSP-J/S 初赛（10 月）→IOI（11 月）→复赛（3-4 月）→省队选拔（7 月）→NOI（8-9 月）"},{"k":"C","t":"CSP-J/S 复赛（9 月）→初赛（10 月）→NOI（11 月）→NOIP（3-4 月）→IOI（7 月）→省队选拔（8-9 月）"},{"k":"D","t":"CSP-J/S 初赛（9 月）→复赛（10 月）→NOIP（11 月）→省队选拔（次年 3-4 月）→NOI（7 月）→IOI（8-9 月）"}],"answer":"D","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题","chapter":"科技特长生规划·全章","q":"下列哪项不属于核桃赛考全流程服务？","options":[{"k":"A","t":"保证参赛即获奖"},{"k":"B","t":"赛考全流程护航（报名提醒→赛中参赛→赛后查分→证书发放）"},{"k":"C","t":"专属备赛微信群答疑"},{"k":"D","t":"远程伴考服务、成绩/证书查询提醒"}],"answer":"A","back":"","sku":""}],"timing":{"P01":{"sents":["前面我们已经一起了解过，孩子学习编程，能锻炼逻辑思维、培养良好学习习惯，还能反向助力校内学科提升。\n","但很多家长心里会有一个疑问：短期学是锻炼能力，那长期坚持学编程，最终能给到孩子一条什么样清晰的出路？\n","这就是我们今天这节课的核心 ——科技特长生规划。\n","在核桃编程，我们不只是带着孩子零散上课、学知识点，而是给孩子搭好一条长期可落地的成长路线，对接考级、赛事与科技特长升学通道。\n","学好这部分内容，大家后续和家长沟通的时候，就不再只讲思维、兴趣，还能给到家长一份长远、清晰的成长方案，建立更专业丰满的老师形象，增强家长长期续报、持续跟着我们学习的信心。\n","今天我们就一起来搞懂：科技特长生规划的适用场景、核心内容，以及我们需要掌握的沟通技能"],"durs":[10.536,10.272,4.68,13.656,17.448,9.048]},"P02":{"sents":["那今天咱们整节课就围绕这三大板块展开。\n","第一块，我们先把底层概念讲清楚：到底什么是科技特长生，以及我们为什么一定要把这个信息传递给家长、它能给孩子带来哪些实实在在的价值。\n","第二块，也是我们核心落地的内容：在核桃编程，我们给到孩子一套完整的赛考规划路线，孩子从入门到高阶，考级、参赛的节奏是怎么安排的。\n","第三块，我们来看核桃的硬实力，讲我们在赛考板块独有的优势，都是有真实获奖成绩、真实案例支撑的，不是空口宣传。\n","这三块层层递进，大家吃透之后，跟家长沟通的时候，既能讲清楚政策方向，又能给到可落地的学习方案，还能拿出我们的成果建立信任。"],"durs":[4.464,13.056,13.344,11.208,12.312]},"P03":{"sents":["首先我们进入第一部分，我们先来了解一下科技特长生这个概念"],"durs":[6.408]},"P04":{"sents":["各位小伙伴在之前有没有见过体育特长生或者艺术特长生呀？","那他们的特征是不是可以通过一个考一般的分数，但是可以去一个好学校？\n","好，那接下来我们一块来看一看到底什么是科技特长生。\n","科技特长生是经教育厅、教育局发文，有正式定义、享有特殊招生政策的学生群体\n","获得特长生认证需学业成绩达标，并在科技领域有一定特长或在市级及以上的科技比赛拿到三等奖以上的奖项,如编程类白名单赛事。","很多重点高中都有科技特长生招生政策。","好，那我们再来看一个很关键的一条，首先第一个点，获得科技特长生认证，它需要学业成绩达标。","且在科技领域有一定特长，比如获得市级一等奖、省级二等奖、国家三等奖\n","那被认定为科技特长生之后，他会有什么样的好处呢？","比如这个小朋友被认定成功了，那他在初中阶段，升学的时候，比如初升高就可以享受或实现降分录取的一个效果。","来看一道题，获得科技特长生认证，在比赛奖项上的门槛是？"],"durs":[5.736,6.168,5.64,8.352,12.816,4.32,8.76,7.416,4.896,10.608,6.12]},"P05":{"sents":["那了解完什么是科技特长生，我们一块来看看，国家为什么特别重视科技特长生呢？\n","先看图片左边第一张图科技特长生全国覆盖趋势全分析。\n","从柱状数据我们能清晰看到变化：2022 年开放科技特长生招生的地区还比较少，到 2023 年、2024 年，覆盖省份、城市数量逐年上涨，这个赛道是在稳步扩容，不是一阵风的短期热点。","同时图里也标注了定义：科技特长生，就是拿到赛事证书、有科创成果，在科技领域具备特长的学生；","还有核桃的成果数据，这么多年我们已经帮助上万名孩子拿到相关证书，走科技特长路线。\n","接着我们看中间第二张图从科技特长生政策变化看升学规划\n","表格把政策调整分成了招生计划、招生项目、强基计划、出国留学这几个板块。","招生人数逐年增加，很多地区允许降分录取；","招生重点方向就是机器人、信息学也就是咱们的编程、科技创新；","而且科技特长和强基计划挂钩，能提升孩子冲刺重点高校的概率，就算未来有出国打算，科创赛事经历也能丰富背景。","下方还给了家长规划建议：提早备赛、选感兴趣方向、多去实践，这些也是我们后面给家长做规划时会用到的要点。\n\n","最后我们再看右侧的文字要点，这里提炼了三层核心逻辑：\n","第一，国家政策扶持，从 2015 年就开始布局科技特长生，目标是储备科创人才；\n","第二，国家现在急需科技人才，围绕科技兴国、科技强国的战略，信息技术、人工智能方向的人才缺口很大；\n","第三，也是家长最关心的对比点：2024 年教育部全面取消艺术特长生，政策重心转向科技特长生，学编程，就是切入这条赛道最主流的方式。\n\n","所以综合整张页面的信息不难发现，国家正在大力支持科技教育。","作为家长，就需要给孩子提前布局，通过编程提升孩子的科技素养，抓住科技特长生在升学中的红利，锁定优质学校的录取机会。\n","最后注意：跟家长沟通的时候，我们只讲增加赛道、多一个选择权、政策红利，千万不要承诺保录取、一定降分，守住沟通风险，避免过度承诺，这是红线。"],"durs":[7.608,5.928,18.576,10.344,8.592,6.168,7.872,4.728,6.528,11.928,11.328,5.664,8.448,10.776,14.16,6.816,11.832,14.52]},"P06":{"sents":["先来看一下这几个科技特长生的招生规则，我们会发现不同地区不同学校对于科技特长生的标准是不同的。"],"durs":[9.84]},"P07":{"sents":["大家看页面上的案例图，看完之后大家就能发现：全国各个省市、各个学校，对应的招生政策其实是有差异的，并不是全国统一一套标准。\n\n","那我们来回顾一个核心问题：怎样才能被认定为科技特长生？\n","很多伙伴会记得一句话：市一、省二、国三。","但是大家一定要记住，这个标准不是绝对固定的，不同省份、不同城市，强省和弱省之间，认定门槛是有区别的。\n","就像图里展示的中学科技特长招生简章，很多学校开设专项科技特长班的时候，会在自己的招生公告里，写明本校认可的比赛、以及对应的获奖成绩要求，以学校公布的标准为准。\n\n","这里还有一个非常关键的知识点，大家一定要牢牢记住：\n","科技特长生政策，主要是在初升高阶段发挥作用；","小升初阶段，是没有直接加分、降分录取政策的，赛事证书更多是给孩子的简历增色，丰富孩子的背景，这个区分点，我们跟家长沟通的时候一定要讲清楚，避免家长产生误解。","来看一道题，科技特长生政策主要在哪个升学阶段发挥作用？"],"durs":[12.792,5.592,4.824,10.728,16.416,4.944,4.896,16.272,5.976]},"P08":{"sents":["好，前面我们介绍了科技特长生，接下来我们一块来看在核桃编程，我们是如何给孩子做赛考规划的"],"durs":[9.6]},"P10":{"sents":["好，那前面讲了那么多，接下来呢，我们一块来看一看。","在核桃编程它可以参加的考级和比赛都有哪些？","首先考级有三个，YCL  CTL 和 GESP 比赛我们分成两个板块，一个叫国家级比赛，一个叫白名单比赛。","国家级比赛包括图灵杯、白名单比赛主要是信奥赛\n\n","后面我们会详细的去讲。","这个时候我们知道有哪些考级和比赛就可以"],"durs":[5.304,4.704,10.464,5.304,2.472,4.344]},"P16":{"sents":["下来进入我们第三部分：核桃赛考优势，我们一起来看一看，核桃是怎么帮孩子系统化规划、稳稳落地赛考的。"],"durs":[10.248]},"P17":{"sents":["接下来我们来看核桃赛考两大核心优势。\n","第一点，完善的赛事规划。\n","很多家长自己去了解赛事，很容易混乱：不知道什么时候考、先考哪个、考级和比赛怎么搭配，容易盲目报考，浪费时间和机会。","在核桃，我们会根据孩子的学习进度、年龄、逻辑能力，给孩子做一整条长期赛考路线。","从入门 CTL考级打底，到图灵杯冲奖项，再到高阶冲击 CSP 信奥，什么阶段备考、什么时候报名、考前什么时候安排集训，全部统一规划，不用家长自己费心研究政策和时间节点，跟着课程节奏走就可以。\n\n","第二点，优异的赛考成绩。\n","有了清晰规划之后，最终落地就是成绩。","我们不是只带孩子报名，配套有专门的赛考集训、真题训练、考点梳理，历年也有很多学员在 CTL、GESP、图灵杯、CSP 当中拿到不错的等级和奖项，有真实的成果案例可以给家长参考，证明这套路线是跑通的。"],"durs":[4.176,2.88,11.952,8.352,19.464,2.904,4.104,20.664]},"P22":{"sents":["咱们在 NOI 全国信息学奥林匹克竞赛中的学员成绩，被央广网等多家权威媒体进行报道。","媒体也对主流线上机构的赛事数据做了统计，核桃在 NOI 赛事里的表现，在同类线上编程机构当中位居前列，这也侧面印证了我们整套赛考培养体系的专业度。"],"durs":[8.592,15.216]},"P23":{"sents":["左边地图可以看到，核桃的优秀学员遍布全国多个省市，不管是不同地区、不同学情的孩子，都有跟着这套体系稳步成长、参与赛考的学员。\n","右边是 2025 年白名单赛事的获奖情况，获奖学员来自全国大量重点中小学，重点学校的覆盖范围很广，也能说明这套培养方案适配不同地区、不同学校的孩子。"],"durs":[12.84,15.528]},"P24":{"sents":["李静榕是我们核桃的 1 号学员，他也在 2023 年获得了 NOI 金牌——他也是目前国内所有线上编程教育机构里边第一个获得 NOI 金牌的学员；\n","这有一个当时对李静榕和他妈妈进行采访的视频，我们可以看一下"],"durs":[13.128,6.096]},"P25":{"sents":["前面说了那么多，那我们一块来看看核桃编程会给家长提供哪些服务，或者说他报名成功之后，他可以享受哪些赛考类的服呢？"," 除了成熟的赛考教研体系，核桃还给学员提供赛考全流程配套服务，帮家长和孩子省去很多琐事。\n","第一，全流程护航：从报名提醒、赛前复习准备，到赛中参赛、赛后查分、证书发放，每个环节都有跟进；\n","第二，专属备赛规划：结合孩子当下的学情，定制适合他的备赛节奏；\n","第三，备赛期间会建立专属备赛微信群，随时给孩子答疑；\n","第四，冲刺阶段安排直播，讲解考点、技术要点和答题拿分技巧；\n","第五，比赛当天提供远程伴考，遇到突发问题可以及时响应；\n","第六，成绩出来之后，主动提醒家长查询成绩、领取证书。\n\n","简单来说，家长不用自己到处查赛事通知、找备考资料，从备赛到拿证，我们全程配合跟进。","来看一道题，下列哪项不属于核桃赛考全流程服务？"],"durs":[11.208,9.84,10.968,7.152,6.168,6.936,6.168,6.216,9.264,5.112]},"P26":{"sents":["我们还有专门的赛事研究中心，来给孩子做长期赛考规划。\n","这边会实时跟进各类赛事政策变动，及时更新赛事信息，给大家提供完整的赛事规划，包含赛前报名、备赛指导、赛后答疑、估分等全流程服务。\n","我们重点聚焦教育部白名单这类高含金量赛事，也是蓝桥青少考试中心首家官方合作单位。\n","课程内容和考试大纲紧密贴合，覆盖考点，做到精准对标。","同时我们很多授课老师受邀担任多项赛事组委会成员，师资这块有很强的赛事经验，更好地助力孩子走科技特长路线。"],"durs":[5.568,14.04,8.712,6.048,11.448]},"P27":{"sents":["学习不息,成长不止\n","追求卓越,舍我其谁\n","培训很苦,坚持很酷\n","你的付出\n","决定成长速度"],"durs":[2.712,2.784,2.736,1.872,2.016]},"P28":{"sents":["记得扫码填写真实评价哦"],"durs":[2.736]},"P09":{"sents":["大家先看左边这张国内主流编程竞赛概览图，它是按照孩子的学习阶段，分成了三个梯度：入门级、专业级、奥赛级。\n\n","第一个，入门级，对应小学阶段，就是编程考级考级本质是检验孩子基础知识掌握得怎么样，孩子学完对应阶段内容就可以参加。","考级也是后面竞赛的基础。","如果家长打算让孩子后续走竞赛路线，可以先从考级入手，拿到基础能力认证，提前积累参赛经验。\n\n","第二个，专业级，覆盖小学和初中，是编程竞赛\n","竞赛分软件类，也就是咱们的代码编程，还有硬件类，像机器人这类科创项目。","比赛会按照孩子学的编程语言分开，而且竞赛大多是选拔制，有晋级比例，难度会比考级更高。\n\n","第三个，奥赛级，面向初中和高中，也就是信息学奥赛\n","信息学奥赛是五大奥赛之一，考察 C++，也是很多编程孩子的目标。","拿到省级奖项，对升学就有很大帮助；","如果能拿到国家级奖项，会受到清北等顶尖名校的青睐。\n\n","我们再看右边这个金字塔，它讲清楚了这条路线的价值逻辑：\n","最底层，先锻炼思维、试错成本低；","往上走，证书可以给孩子履历添彩；","再往上，用来检验学习成果；","最终，服务于升学。\n","页面底部这句话大家一定要记牢：目前核桃是全流程配套课程，不管孩子是入门考级、打专业竞赛，还是冲刺信息学奥赛，我们都有对应的课程和赛事服务可以跟上。\n","也就是说，孩子从入门到高阶，不用中途换体系，在核桃一条路就能走到底。\n","跟家长沟通的时候，要结合孩子年龄去匹配路线，低龄孩子优先讲考级打基础，不要一上来就跟家长讲 CSP、国赛，避免家长觉得门槛太高、压力太大。","预期过高。"],"durs":[11.424,11.736,3.024,9.48,5.112,7.68,9.384,5.568,6.768,4.128,5.52,5.592,4.056,3.744,3.24,2.496,15.456,7.752,14.88,1.872]},"P12":{"sents":["接下来我们来看核桃主推的国家级赛事 ——图灵杯全国青少年编程及人工智能挑战活动\n","首先是举办单位：中国光华科技基金会主办，指导单位是清华大学计算机科学与技术系，和我们前面 CTL 考级是同一个主办体系，背书同样是共青团中央。\n","它一年会举办 2 场：上半年是 3-7 月初赛，8 月决赛；","下半年是 9-1 月初赛，次年 2 月决赛最终时间还是以组委会当年发布的赛制为准。\n","参赛语言同样覆盖图形化、Python、C++，适配咱们不同阶段的学员；","参赛费用是 300 元每人。","图灵杯没有纸质版证书，只有 电子版\n","重点说赛事价值：它的主办单位背靠团中央，同时也是教育部白名单赛事的主办单位之一，权威性、含金量都很高，证书在科技特长生认定、简历增色的时候认可度很好。\n\n","大家再看右边，这就是图灵杯的证书样例，分不同组别，像大家看到的这个就是算法竞赛组一等奖证书。\n","这里也跟大家同步沟通要点：图灵杯属于竞赛类，和考级不一样，考级偏向检验基础，而图灵杯是竞技比拼，适合有一定基础、想要冲奖项、丰富科创履历的孩子。","同样，参赛节奏我们也是统一规划，跟着核桃的课程进度安排备赛，不建议家长单独报名。\n","和家长介绍的时候，可以联动 CTL 一起讲：CTL 偏向等级测评、打基础；","图灵杯是同体系下的竞赛赛道，用来拿奖项，两个可以搭配规划最合理。"],"durs":[8.616,15.432,5.688,8.016,7.2,2.784,4.32,16.344,9.816,15.336,8.88,7.8,7.008]},"P13":{"sents":["刚刚我们介绍了图灵杯，很多家长都会问到一个关键词：白名单赛事。","那这一页，我们就一起来搞懂，到底什么是教育部白名单赛事。\n\n","先看页面左边：什么是白名单赛事？\n","白名单赛事，就是教育部官方公布，面向 6 到 18 岁中小学生的全国性竞赛活动。\n","它有四个核心特点：\n","第一，主办机构权威，必须是中央编办、民政部登记注册的正规机构，拿到教育部认可；\n","第二，编程科创类赛事占比很高，最新 2025-2028 学年的白名单里一共 47 项竞赛，其中科学素养类就有 22 项；\n","第三，奖项对升学有参考价值，在白名单五大科学竞赛里，像信息学奥赛，金牌选手是顶尖名校重点关注的对象，银牌选手也有机会走强基计划冲刺名校；\n","第四，它是人才培养的风向标，代表国家教育和科创人才的发展方向。\n\n","接着我们再看页面右侧，分三块给大家拆解：解读、要求、作用。\n","首先：白名单是教育部面向 6-18 岁学生发布的全国竞赛名单，主办方资质严格，是官方认可的正规赛事。\n","然后：有一个关键点大家一定要记住，赛事本身不收费，是入选白名单的硬性条件之一。","这\n","最后是作用，也是家长最关心的：\n","第一，它是培养孩子特长的风向标，代表国家未来科创人才的培养方向；\n","第二，竞赛成果对升学是有参考作用的；\n","第三，现在很多学校都在做综合素养评价，还有科技特长生招生，白名单体系内的竞赛经历、获奖证书，在里面权重很高，含金量更好。\n\n","最后底部这句话大家可以记一下：现在是科技强国的时代，国家急需科创人才，教育方向也在跟着这个大方向调整。\n\n","跟家长沟通注意话术边界：白名单证书不是直接加分，是在综合评价、科技特长招生、强基初审里更有优势；","另外一定要区分：主办单位在白名单 不等于这个活动本身就是白名单赛事，不要说错。"],"durs":[6.504,5.616,3.744,8.016,2.208,8.544,11.88,15.192,7.08,6.936,10.824,8.448,1.872,3.384,6.936,4.296,13.056,10.56,11.28,8.256]},"P15":{"sents":["刚刚我们认识了 CSP-J/S，这一页我们把完整的信奥晋级路线串起来，也就是：CSP-J/S → NOIP → NOI → IOI，大家看这条时间轴。\n\n","我们按时间顺序一步步看：\n","每年9 月，最先开始的是 CSP-J/S 初赛；\n","通过初赛之后，10 月参加 CSP-J/S 复赛；\n","复赛达到要求的成绩，11 月可以参加 NOIP；\n","NOIP 结束，在次年3、4 月进行省队选拔；\n","选拔成功，7 月去参加 NOI 全国决赛；\n","最后，从 NOI 里选出国家队选手，在8、9 月出战 IOI 国际信息学奥赛，这是信奥最高舞台。\n\n","这条是一条层层晋级、逐级筛选的长线赛道。","前面我们讲的 GESP，就是帮孩子提前铺垫，拿到 CSP 复赛资格的前置关卡。\n","我们给家长介绍的时候，要讲清楚：不是所有人都能一路走到 IOI，大部分孩子的目标，是走到 CSP、NOIP，拿到奖项服务科技特长生、强基计划。","整条路线周期很长，需要持续稳定的学习和备赛，核桃会跟着这个赛程节点，匹配对应的课程和集训。"],"durs":[14.256,2.928,4.968,4.92,5.016,5.208,4.488,9.72,4.608,8.04,14.376,9.648]},"P18":{"sents":["Python 方向的短期规划，左边这条时间轴，是 Python 科技特长实验班的学习节奏：1 个学期，孩子可以达到国家级证书竞赛的备考水平。\n","第 1 个月做 Python 编程知识启蒙；","2 个月开始接触等级考试题型；","3 个月达到 CTL 一级的备考水平；","4-5 个月进阶学习，积累各类赛考知识点；","6 个月达到白名单国家级赛事的备赛水平；","后续持续深耕，朝着科技特长生方向积累能力，为小升初、初升高做准备。","同样是：进可以朝着科技特长方向准备，退可以夯实数理基础。\n\n","右边是 Python 一年的能力规划：学满一年，孩子可以达到 4 类国家级证书赛事的备考水平。\n","包含 CTL 一级、CTL 三级两类权威等级的备考能力，以及两项国家级赛事的参赛准备能力。\n","大家也可以对比学习周期：在核桃，达到 CTL 一级备考水平仅需 3 个月、CTL 三级备考水平 9 个月，另外两项赛事备赛能力分别 6 个月、12 个月；","市面上其他机构，达到同等水平需要的周期会更长。\n\n","4199 的 Python 科特线对应 CTL，思维方向的 Python 对应 YCL，给家长介绍的时候不要混淆两条路线。","来看一道题，4199 的 Python 科特线对应哪个考级？"],"durs":[13.8,3.816,3.456,3.864,4.56,4.368,7.584,6.336,9.336,9.288,14.784,5.232,12.024,6.384]},"P19":{"sents":["Python 科技特长实验班的长期赛考规划，适合直接从 Python 起步的孩子。\n","整条路线分为五个阶段：基础储备期 Python 阶段 1、基础特长期 Python 阶段 2、信奥基础期 C++1-3 阶段、信奥超越期 C++4-6 阶段，最后是信奥集训队。\n","每个阶段对应的能力对标：\n\n","基础储备期 Python 阶段 1：对标 CTL 1 级，具备 Python 方向白名单赛事的备赛能力；\n","基础特长期 Python 阶段 2：对标 CTL 3 级；\n","信奥基础期 C++1-3 阶段：对标 GESP 1-4 级，可以达到 CTL、CSP-J 以及白名单赛事的参赛准备水平；\n","信奥超越期 C++4-6 阶段：对标 GESP 5-8 级，具备 CSP-S、NOIP 的备赛能力；\n","信奥集训队阶段：具备 NOIP 省赛、NOI 国赛的备赛能力。"],"durs":[7.848,16.92,2.688,9.288,5.256,11.928,9.912,6.408]},"P20":{"sents":["接下来我们看核桃赛考的第二大优势：过往等级考试的学员成果。\n","左边是 CTL 全国青少年计算思维等级测评的数据，咱们核桃学员 C++ 一级的通过率高达 94.84%，累计已有 30692 名学员拿到 CTL 测评证书，这些都是我们往期学员的真实数据。\n","右边是 GESP 等级认证的喜报，2025 年 9 月这场考试里，一共有 2868 位核桃学员顺利通过 GESP 等级认证；","其中 402 位学员拿到 90 分及以上，获得跳级资格；","还有 309 位学员，经指导老师评估推荐，获得跳考资格。\n\n","这里跟大家说明一下：这些是我们往期学员的历史参考数据，能看出咱们配套的赛考集训、考点训练体系是经过验证的，但每个孩子的吸收情况不同，我们不保证一定可以通过或者跳级。"],"durs":[6.288,19.104,11.976,5.592,6.096,16.656]},"P21":{"sents":["接下来我们看国家级、白名单赛事的往期学员成果，这也是咱们赛考体系实力的体现。\n\n","第一张是 NOI 全国信息学奥林匹克的喜报，2026 年 NOI 赛事，核桃学员收获 29 金、109 银、66 铜，全国一半的金牌出自核桃；\n","第二张是 CSP-J/S 的成绩，复赛获奖总人数 2218 人，其中 CSP-J 组 1445 人，CSP-S 组 773 人，还有 60 位学员拿到满分，同时核桃 OJ 平台一共有 4012 位获奖选手；\n","第三张是 2025 年白名单赛事数据，累计 104050 名学员获奖，获奖人数在青少年编程行业里位居前列；\n","第四张是图灵杯赛事，省级三等奖及以上获奖一共 88766 人，其中 12585 位选手晋级决赛，还有学员入选团中央认证的光华人才库。\n\n","这里跟家长说明：以上全部都是往期学员的历史真实数据，能说明我们的赛考教研、集训配套体系是经过大量学员验证的，但赛事本身存在竞争，我们不保证孩子参赛就一定能够获奖。","来看一道题，2026 年 NOI 赛事，核桃学员的获奖成绩是？"],"durs":[8.184,14.184,20.472,11.304,14.64,16.584,6.36]},"P11":{"sents":["刚刚我们了解了核桃完整的赛考梯度路线，接下来我们就聚焦咱们核桃主推、可以内推报名的两大考级：CTL 和 GESP。","大家跟着我先看左边这个对比表格。\n\n","第一个，全国青少年计算思维等级测评，也就是 CTL。\n","它的主办单位是中国光华科技基金会，由共青团中央主管，指导单位是清华大学计算机科学与技术系，这也是它含金量的核心亮点。\n","它的考试频次是每个月都有一次，这里重点跟大家强调：虽然每月都能考，但我们不建议家长自己随便挑时间报，一定要跟着咱们核桃课程的运营规划走。","我们是统一安排好节奏的，哪个阶段复习考级、哪个阶段备战比赛，都是规划好的，跟着节奏走，孩子备考效率更高。\n","参赛语言包含图形化、Python、C++ 三种；","费用方面，各级统一 300 元每级（图形化 1-4 级，Python、C++ 1-6 级）。","CTL有纸质版证书\n","它最大的价值，就是共青团中央直属单位主办的专业等级测评，这个点我们跟家长沟通的时候，可以重点突出。\n\n","第二个，CCF 编程能力等级认证，GESP。\n","主办单位是中国计算机学会，也就是咱们信奥的官方主办方。\n","考试时间固定在 3、6、9、12 这四个月份。","同样，报名节奏也要跟着我们课程安排走，不建议家长自行盲目报考。\n","参赛语言同样是图形化、Python、C++；","费用是一级 300 元，之后每升一级增加 20 元。\n","它最核心的价值大家一定要记牢：GESP 可以衔接 CSP，拿到对应成绩，就有机会直接获得 CSP-J 普及组、CSP-S 提高组第二轮的参赛资格，而且是信奥主办方亲自命题，权威性、公信力非常高，是往信息学奥赛方向走非常关键的一步。\n\n","大家再看页面右侧，这两张就是 GESP 和 CTL 的证书样例，也是孩子考完之后拿到的成果证明，不管是用来检验学习成果，还是给孩子简历增色，都是实打实的凭证。","来看一道题，关于 CTL 与 GESP 两大主推考级，正确的说法是？"],"durs":[11.544,3.648,5.904,12.384,13.944,10.68,5.184,7.752,2.736,10.176,5.04,5.688,4.896,6.84,4.656,4.8,22.824,16.056,6.888]},"P14":{"sents":["刚刚我们了解了什么是教育部白名单赛事，那这一页，咱们就来看编程赛道里含金量最高的白名单赛事 ——信息学奥林匹克竞赛 NOI，也就是大家常说的信奥，它的入门通道就是 CSP-J/S\n","举办单位是中国计算机学会 CCF，也就是 GESP 同一个主办方，一年举办一次。\n","参赛语言固定只有 C++，这也是为什么我们高阶阶段会专门带孩子学习 C++。\n","费用这块大家记清楚：CSP 初赛 50 元；","复赛里面，J 普及组 310 元，S 提高组 560 元。\n","参赛时间节点：初赛在 9 月下旬，复赛 10 月下旬；","之后 NOIP 是 11 月，最高级别 NOI 在次年 7 月，是一条逐级向上晋级的路线。\n","重点就是赛事价值，也是家长最关心的：\n","拿到金牌，有机会直接被清北等顶尖名校录取；","银牌，可以走强基计划，在 985、211 院校的招生里获得降分优势；","铜牌，报考中科大少年班、少创班，还有额外 20 分的加分机会。\n","注意：以上表述都不能用确定性保证的口吻，因为政策每年都会改变。\n","大家再看右边，这就是 CSP-J/S 的官方证书样例，分为入门级和提高组，有一级、二级、三级能力等级。\n","这里跟大家同步沟通要点：这条路周期长、难度高，不是短期速成的。","咱们前面的 CTL和GESP 考级，就是用来铺垫、帮孩子拿到 CSP 复赛资格的前置路径，整条路线是连贯的。","同样，备赛节奏统一跟着核桃课程规划走，循序渐进。\n","跟家长沟通一定要把握好分寸，不要承诺拿金牌、保送。","要客观说明：信奥是长线赛道，适合逻辑思维强、能长期坚持的孩子；","它是升学的加分机会，不是捷径。","来看一道题，CSP 初赛的报名费用是？"],"durs":[17.76,8.376,8.136,4.464,5.64,5.376,8.376,4.032,4.92,7.296,6.576,6.84,10.968,6.912,11.04,5.712,5.496,7.008,3.432,4.08]}},"v":{"slides/P01.jpg":"52ca7989","slides/P01.png":"d869d609","slides/P02.jpg":"5b999f73","slides/P02.png":"942f3323","slides/P03.jpg":"1f92fc90","slides/P03.png":"1dff const KEY = CFG.key;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 课程结构 ---------- */
/* 部门 / SKU 可见性：标「通用」或未标的页所有人可见；带标签的页只有选中的部门/SKU 命中才显示（多选任一命中即可） */
const normTag = t => String(t||'').replace(/1部/g,'一部').replace(/2部/g,'二部').replace(/苍穹鼎/g,'苍穹顶').replace(/\s/g,'');
const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return (!CFG.depts || tagOk(p.dept, st && st.depts)) && (!CFG.skus || tagOk(p.sku, st && st.skus)); }
let STAGES = [];
function buildStages(){
  STAGES = [];
  for (const p of DATA.pages) {
    if (!pageVisible(p)) continue;
    let s = STAGES.find(x => x.name === p.stage);
    if (!s) { s = {name:p.stage, num:+(/阶段\s*(\d+)/.exec(p.stage)||[0,STAGES.length+1])[1], pages:[]}; STAGES.push(s); }
    s.pages.push(p);
  }
  for (const s of STAGES) s.quiz = DATA.qs.filter(q => /阶段练习/.test(q.type) && +(/阶段\s*(\d+)/.exec(q.chapter)||[])[1] === s.num);
}
let st = null; buildStages();
const TITLES = CFG.titles || {};

  for(const i of o.passed){ if(!STAGES[i]) continue; st.passed[i]=true; STAGES[i].pages.forEach(p=>st.heard[p.p]=true); }
  st.unlocked=Math.max(st.unlocked, Math.max(-1,...o.passed)+1); Object.assign(st.best,o.best||{}); save(); return true; }

(function fixZeroPass(){ let first=-1; STAGES.forEach((s,i)=>{ if(st.passed[i] && s.quiz.length && st.best[i]==null){ delete st.passed[i]; if(first<0) first=i; } }); if(FINAL.length && st.final && st.final.pass && !st.final.score){ st.final=null; save(); } if(first>=0){ st.unlocked=Math.min(st.unlocked, first); if(st.final && !st.final.pass) st.final=null; save(); } })();

if (!st.stageSec) st.stageSec = {};

const HOOK = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/Z0UnaFjXvwZxHrhrmiFcMjSJnEd';
const pad = n => String(n).padStart(2,'0');
function nowStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function stageLabel(i){ const s = STAGES[i]; return s ? (s.name + (TITLES[s.num] ? ' ' + TITLES[s.num] : '')) : ''; }

/* 每个关卡的过程数据：play=实际播放秒数 occ=占用秒数 pn/ps=暂停次数/秒 kn/ks=卡顿次数/秒 */
function stat(k){ st.stat = st.stat || {}; return st.stat[k] = st.stat[k] || {play:0, occ:0, pn:0, ps:0, kn:0, ks:0}; }
function curKey(){ return st.view === 'quiz' ? (st.quiz === 'final' ? 'f' : st.quiz) : st.cur.s; }
function stageStatusText(k){
  if (k !== 'f' && !STAGES[k]) return '';
  const done = k === 'f' ? !!(st.final && st.final.pass) : !!st.passed[k];
  if (done) return '已完成';
  if ((st.view === 'learn' || st.view === 'quiz') && String(curKey()) === String(k)) return '进行中';
  const s = st.stat && st.stat[k];
  return s && s.occ > 0 ? '进行中' : '未开始';
}
function snapshot(online){
  const keys = Object.keys(st.stat||{}), sum = f => keys.reduce((a,k) => a + ((st.stat&&st.stat[k]&&st.stat[k][f])||0), 0);
  const play = sum('play'), occ = sum('occ');
  const sc = i => st.best[i] != null ? `${st.best[i]}/${STAGES[i].quiz.length}` : '';
  const cur = st.view === 'quiz' ? (st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz) + '·小测') : (st.view === 'learn' ? stageLabel(st.cur.s) : '课程首页');
  const cp = st.view === 'learn' ? (curPageSafe()||{}).p || '' : '';
  return {online: online || '学习中', cur_stage:(CFG.short||CFG.title)+'｜'+cur, cur_page:cp,
    st1:stageStatusText(0), st2:stageStatusText(1), st3:stageStatusText(2), st4:stageStatusText(3), stf:stageStatusText('f'),
    sc1:sc(0), sc2:sc(1), sc3:sc(2), scf: st.final ? `${st.final.score}/${FINAL.length}` : '',
    play_min:mins(play), occ_min:mins(occ), gap_min:mins(Math.max(0, occ-play)),
    pause_n:sum('pn'), pause_min:mins(sum('ps')), stall_n:sum('kn'), stall_min:mins(sum('ks')),
    relearn_n:Object.values(st.relearnCnt||{}).reduce((a,b)=>a+b,0),
    quiz_switch_n:sum('qn'), quiz_switch_min:mins(sum('qs'))};
}
/* 第二个 Webhook：学员第一次出现时，在「学员实时状态」表新建他的那一行 */
const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
// 明细表有 5 万行上限：这些动作量大、分析用不到（暂停时长等已汇总在状态快照里），不再单独记一行
const NO_LOG = new Set(['听完页面','暂停','继续播放','回到测试','学习页面(未听完)']);
function report(ev, online){
  if (!st.name) return;
  if (NO_LOG.has(ev.event) && online !== '已离开') return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid, course:CFG.short||CFG.title, date:nowStr().slice(0,10)}, ev, snapshot(online));
  { const CNm = CFG.short || CFG.title; if (!String(rec.stage||'').startsWith(CNm + '｜')) rec.stage = CNm + (rec.stage ? '｜' + rec.stage : ''); }
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}
/* 实际收听时长：只在播放时累计，按真实时间计（倍速播放不重复计） */

/* 小测中切屏：不能暂停答题，但要记录每次离开和离开多久，并提示学员 */

}

  const s = stat(curKey()); s.qs = (s.qs||0) + sec;
  if (doReport) report({event:'回到测试', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`离开 ${Math.round(sec)} 秒`});

}

/* 占用时长：停留在某关卡（听课或做小测）的全部时间，含暂停、切走 */
let tickAt = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min((now - tickAt)/1000, 70); tickAt = now;
  if (st.name && (st.view === 'learn' || st.view === 'quiz')) { stat(curKey()).occ += dt; if (Math.random() < 0.1) save(); }
}, 1000);

}
/* 卡顿：播放中因网络缓冲停住 */
let stallAt = null;

  if (stallAt == null) return;

  if (sec < 0.8) return;

  report({event:'卡顿', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`缓冲卡顿 ${sec.toFixed(1)} 秒`});
}

/* ---------- 审核模式：姓名填「审核」进入，不上报、不计进度 ---------- */
function renderReview(){ window.REVIEW = 1;
  const L='ABCDEF', nz=x=>(x||'').replace(/\s/g,''), stem=q=>(q||'').replace(/^【[^】]*】/,'').replace(/【[^】]*】$/,'').replace(/[（(]\s*(多选|单选|判断)[^）)]*[）)]\s*$/,'').replace(/[?？]$/,'');
  let bad=0;
  const pages=DATA.pages.map(p=>{const t=DATA.timing[p.p]||{sents:[p.script],durs:[0]};let a=0;
    const ss=t.sents.map((x,i)=>{const b=a+(t.durs[i]||0);const h='<span class="rs" data-p="'+p.p+'" data-a="'+a+'" data-b="'+b+'">'+esc(x.trim())+' <b>▶</b></span>';a=b;return h;}).join('');
    const it=p.interact;let ih='';if(it){const ok=it.vote||nz(p.script).includes(nz(stem(it.q)));if(!ok)bad++;
      ih='<div class="rq"><div class="rh">互动题'+(it.vote?'（调查）':'')+(ok?'':' <b style="color:#dc2626">⚠ 讲稿没念到这道题</b>')+'</div><b>'+esc(it.q)+'</b>'+it.options.map((o,i)=>'<div class="'+((it.answers||[]).includes(i)?'ra':'')+'">'+L[i]+'. '+esc(o)+'</div>').join('')+'</div>';}
    const tags=[p.sku&&p.sku.trim()?'SKU：'+p.sku.replace(/\n/g,' / '):'',p.dept&&!/^通用$/.test(p.dept.trim())?'部门：'+p.dept.replace(/\n/g,' / '):''].filter(Boolean).join(' · ');
    return '<section class="rp" id="r'+p.p+'"><div>'+(p.video?'<video src="'+VU(p.video)+'" controls preload="none" style="width:100%"></video>':'<img loading="lazy" src="'+SL(p.p)+'" style="width:100%;border-radius:8px;border:1px solid #eee">')+'</div><div><div class="rh"><b style="color:#c2410c">'+p.p+'</b> · '+esc(p.stage)+(tags?' · '+esc(tags):'')+' · '+Math.round(a)+' 秒</div><div>'+ss+'</div>'+ih+'</div></section>';}).join('');
  const qs=DATA.qs.map(q=>'<div class="rq"><div class="rh">'+esc(q.id)+' · '+esc(q.type)+' · '+esc(q.chapter)+' · 答案 <b>'+esc(q.answer)+'</b></div><b>'+esc(q.q)+'</b>'+q.options.map(o=>'<div class="'+(q.answer.includes(o.k)?'ra':'')+'">'+o.k+'. '+esc(o.t)+'</div>').join('')+'</div>').join('');
  document.title='审核 · '+CFG.title;
  $('#app').innerHTML='<style>.rp{display:grid;grid-template-columns:minmax(0,46%) 1fr;gap:14px;background:#fff;border-radius:12px;padding:12px;margin:10px 0}@media(max-width:800px){.rp{grid-template-columns:1fr}}.rs{cursor:pointer;border-radius:4px}.rs b{color:#c2410c;font-size:11px}.rs:hover,.rs.on{background:#ffe0b2}.rq{border:1px solid #eee;border-radius:8px;padding:8px;margin-top:8px;background:#fff}.rh{font-size:13px;color:#777}.ra{color:#15803d;font-weight:700}.ra::after{content:"  ✓ 正确"}</style>'+
    '<h2 style="margin:8px 0">审核 · '+esc(CFG.title)+'</h2><p class="rule">'+DATA.pages.length+' 页 · '+DATA.qs.length+' 题 · '+(bad?'<b style="color:#dc2626">'+bad+' 处念题不一致</b>':'念题全部一致')+' · 点任意一句讲稿可单独播放（1.5 倍速）</p>'+pages+'<h2>题库（阶段小测 + 综合测试）</h2>'+qs;
  let stop=null,cur=null;au.ontimeupdate=()=>{if(stop!=null&&au.currentTime>=stop){au.pause();stop=null;if(cur)cur.classList.remove('on');}};
  document.querySelectorAll('.rs').forEach(el=>el.onclick=()=>{if(cur)cur.classList.remove('on');cur=el;el.classList.add('on');const p=el.dataset.p;const go=()=>{au.currentTime=+el.dataset.a;au.playbackRate=1.5;au.play();stop=+el.dataset.b;};if(au.dataset.rp!==p){au.dataset.rp=p;au.src=VU('audio/'+p+'.mp3');au.onloadedmetadata=()=>{au.onloadedmetadata=null;go();};}else go();});
  window.scrollTo(0,0);
}
// 课程锁：cfg.lock = 口令的哈希。未开放期间只有输入口令的人能进（口令存在本机，输一次即可）
const lockH = s => { let h = 2166136261; for (const c of s + '|' + CFG.key) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); };
let UNL = ''; function locked(){ if (!CFG.lock) return false; let ok = UNL; try { ok = localStorage.getItem('unlock_' + CFG.key) || UNL; } catch(e) {} return ok !== CFG.lock; }
function renderLock(){
  $('#app').innerHTML = `<section style="max-width:420px;margin:12vh auto;background:#fff;border-radius:16px;padding:28px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06)">

    <p class="muted">课程暂未开放，开培时由培训老师统一开放。</p>

    <button id="lkb" class="btn" style="margin-top:10px;width:100%">进入</button><p id="lkm" class="muted" style="color:#dc2626" hidden>口令不对</p></section>`;
  const go = () => { const v = $('#lk').value.trim(); if (lockH(v) === CFG.lock) { UNL = CFG.lock; try { localStorage.setItem('unlock_' + CFG.key, CFG.lock); } catch(e) {} render(); } else $('#lkm').hidden = false; };
  $('#lkb').onclick = go; $('#lk').onkeydown = e => { if (e.key === 'Enter') go(); };
}

  renderHome();
}

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});

}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
