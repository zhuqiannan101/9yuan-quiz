<script>
const DATA = {"pages":[{"row":2,"stage":"阶段1·开篇与成交三性","p":"P01","topic":"封面：异议处理——带班的必备技能","script":"欢迎来到今天的培训课堂，我们学一个带班的必备技能，异议处理。\n在正式学方法之前，我们先来搞懂一个概念：到底什么是异议？ 咱们先代入一个生活场景想一想：逛街的时候导购给你推荐一件衣服，说特别适合你，但是你心里会不自觉冒出很多想法：会不会显胖？价格值不值？好不好打理、耐不耐穿？ 大家注意，这不是我们故意找茬、也不是我们一定不想买，只是心里有顾虑、有担心，这些内心的疑问，就是异议。\n放到我们的工作里也是一模一样的。 在和家长沟通的过程中家长会有各种各样的问题出现，导致他们可能对孩子是否继续学编程产生动摇。所以就产生了异议。很多新人一听到家长提顾虑、说不想学、要退费，第一反应就是紧张，觉得家长是在拒绝我们。但大家一定要记住：异议不等于拒绝，异议只是家长的担心没有被接住，这也是我们今天专门花时间打磨这项技能的原因。","interact":null,"sku":"","dept":""},{"row":3,"stage":"阶段1·开篇与成交三性","p":"P02","topic":"课前小互动：异议处理是续报才开始的嘛/问题没解决家长会付费嘛","script":"在课程开始之前呢，大家可以思考一下。我们的异议处理是续报的时候才开始的呢？还是说我们加上好友之后就开始了？\n如果说家长的问题我们没有解决，或者他不满意我们解决的问题，那他最终会付费吗？\n好，思考完之后，我们带着这两个问题进入我们这节课","interact":null,"sku":"","dept":""},{"row":4,"stage":"阶段1·开篇与成交三性","p":"P03","topic":"目录：01 成交三性 / 02 常见异议及处理方式","script":"本节课由两个部分组成，第一部分呢，会给大家介绍一个东西，叫成交三性。\n第二部分呢，会给大家去介绍常见的异议以及我们遇到这些问题的时候，我们应当如何解决？","interact":null,"sku":"","dept":""},{"row":5,"stage":"阶段1·开篇与成交三性","p":"P04","topic":"第一章（章节页）：成交三性","script":"首先第一个我们先来看一下成交三性","interact":null,"sku":"","dept":""},{"row":6,"stage":"阶段1·开篇与成交三性","p":"P05","topic":"成交三性：重要性·紧迫性·唯一性——为什么学/为什么现在学/为什么在核桃学","script":"这个成交3性分别是重要性、紧迫性和唯一性。那它，我们在生活中的使用场景也特别的多，只要你涉及任何劝说别人的事情，你都可以用这成交三性去套，全部都用得上\n 成交三性：重要性、紧迫性、唯一性，也是我们跟家长沟通时最核心的一套逻辑。\n首先第一个，重要性：为什么要学少儿编程？\n我们要先给家长讲明白少儿编程本身的价值。编程不是单纯教孩子敲代码，核心是锻炼孩子的逻辑思维、拆解问题、试错思考的能力，同时对接信息时代的素养，还有 CTL、GESP 这类权威赛事、科技特长生的升学规划路径，这是编程这件事本身的价值，先让家长认可 “学编程这件事是有意义的”。\n第二个，紧迫性：为什么现在就要学？\n认可价值之后，我们要告诉家长不能一直观望、拖延。孩子的思维黄金窗口期是有限的，低龄阶段更容易建立思维习惯；而且赛事、升学规划都有对应的时间节点，越往后，孩子课业压力越来越大，时间会越来越紧张，起步晚了，准备周期就不够。所以不是以后学不学，而是要抓住当下合适的阶段开始。\n第三点，唯一性：为什么选择核桃编程？\n核桃有我们独有的优势。我们深耕少儿在线编程多年，有完整从 Scratch 到 C++ 的进阶体系，配套标准化实操课程、赛事辅导、专业的教研和服务，主打重实操，不是单纯看动画、背概念；同时我们的课程体系、学情跟进、赛考规划是成熟闭环，是专门适配孩子长期编程成长的。\n简单说：很多地方都能学编程，但核桃是更专业、体系更完整、更适合孩子稳步走竞赛和素养路线的选择，这就是我们的不可替代性。\n总结一下三性的逻辑：先靠重要性解决家长 “要不要学” 的疑问，再用紧迫性打消家长 “以后再说” 的拖延心态，最后用我们核桃独有的唯一性，回答家长 “凭什么选我们，而不是别家”，这也是我们课导在和家长沟通时，贯穿全程的底层思路。来看一道题，成交三性里，「紧迫性」回答的是家长的哪个问题？","interact":{"q":"成交三性里，「紧迫性」回答的是家长的哪个问题？","at":"P05","options":["为什么要学编程","为什么得现在学","为什么得在核桃学","为什么编程这么火"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":7,"stage":"阶段2·异议认知与方法","p":"P06","topic":"第二章（章节页）：常见异议及处理方式","script":"好，接下来我们一块来看一看常见的异议以及对应的解决方式","interact":null,"sku":"","dept":""},{"row":8,"stage":"阶段2·异议认知与方法","p":"P07","topic":"异议处理定义与目的：异议处理=解决家长问题；不是争辩，落脚点是解决问题","script":"我们进入第二大模块：异议处理。\n很多新人一听到家长提疑问、说顾虑，第一反应就是紧张，觉得家长在拒绝自己。我们先把定义吃透，纠正这个认知。\n大家看 PPT 上的定义：异议处理，就是在服务、沟通转化的过程里，我们针对家长提出的疑问、不满、反对意见，去回应、解决的过程。\n这里重点记住这句加粗核心：异议处理 = 解决家长问题划重点：家长提出异议，不等于拒绝报名。异议本质是家长心里还有顾虑、信息没补齐，他愿意把想法说出来，反而是沟通机会。如果家长什么都不问、直接不回复，那才是真正没有机会。\n再看异议处理的目的：消除客户的疑虑，提高客户满意度，最终推动促成。\n这里有一个误区要跟大家强调：异议处理，不是去争辩、说服家长、把家长 “辩赢”。\n不是家长说一个问题，我们立刻反驳 “不是这样的”。我们的目标是打消顾虑，让家长理解、放心，而不是争对错。争辩只会让家长防备心变强，反而把沟通聊死。\n我给大家梳理一下底层心态，后面所有异议话术都建立在这个心态上：\n1. 接纳异议：家长有顾虑是正常的，换作是我们自己报课，也会问价格、担心孩子学不会、对比别家；\n2. 先接住，再解决：先共情认可，再解释、给方案；\n3. 落脚点是解决问题，而不是强行逼单。\n这一页是总起页，是整个异议板块的地基。来看一道题，家长说「我不想学了、再考虑下」，这算拒绝吗？","interact":{"q":"家长说「我不想学了、再考虑下」，这算拒绝吗？","at":"P07","options":["算拒绝，直接放弃跟进","不算拒绝，是家长的担心没被接住","算拒绝，过一个月再问","不算拒绝，家长会自己想通"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":9,"stage":"阶段2·异议认知与方法","p":"P08","topic":"互动思考：假如你是家长，体验课结束会用什么理由拒绝报名","script":"再思考一下，如果你是家长，体验课结束了，你以什么样的理由拒绝报名呢？","interact":null,"sku":"","dept":""},{"row":10,"stage":"阶段2·异议认知与方法","p":"P09","topic":"家长可能拒绝的理由清单（12 条高频异议）","script":"这里汇总了咱们日常沟通里，家长最高频抛出的拒绝理由。\n大家可以先看一圈，比如学编程没啥用、是不是动画片、是不是录播课、担心是骗子、没时间、家人不同意、孩子视力不好、想报线下、孩子不爱学、太贵、担心孩子学不会等等。\n很多新人遇到这些话，第一反应就慌了，觉得家长直接拒绝了。但大家一定要记住上一页的核心：异议不是拒绝，是家长心里的疑问。\n这些理由，本质上就是家长的顾虑清单，也是我们后面要逐个拆解、专项练习的异议场景。我们提前把这些场景熟悉好，等到家长说出来的时候，我们才不会慌乱，有章法去回应。\n那我们一块来看一看。这些理由我们是怎么样分类的？来看一道题，下面哪几项是页面里列出的家长高频拒绝理由？","interact":{"q":"下面哪几项是页面里列出的家长高频拒绝理由？","at":"P09","options":["孩子视力不好","老师太年轻","我要在线下学","课程太前沿"],"answer":-1,"answers":[],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":11,"stage":"阶段2·异议认知与方法","p":"P10","topic":"异议三大类：家长重视度 / 产品认知度 / 安全性问题","script":"我们接着看这一页，这里把刚才那么多零散的家长异议，归纳成了三大类：家长重视度、产品认知度、安全性问题，这是我们后续拆解异议的分类框架。\n我们先看第一类：家长重视度。\n这类异议，本质是家长还没有建立认知，没有把编程这件事放在心上。\n典型就是咱们刚才看到的：学编程没啥用、觉得可以以后再学、不急着安排；孩子不感兴趣、视力顾虑、时间排不开，很多时候根源也是重视度没建立起来。\n家长的卡点：不知道编程对孩子的价值，看不到学习窗口期，觉得这件事可学可不学。我们沟通的核心目标，就是帮家长建立价值认知，讲清楚政策、赛事、科技特长的路径，把重视度拉起来。\n第二类： 产品认知度。\n这一类是家长知道编程有用，但是不了解咱们核桃的课程模式。\n常见疑问：是不是动画片？是不是录播课？我想找线下课、担心孩子学不会、觉得价格贵。\n家长不是否定编程，是对我们的上课形式、课程内容、交付效果、性价比有疑问。我们要做的，是讲清楚实验班的体系、授课模式、配套辅导、赛考交付，消除信息差，帮家长看懂我们课程和别的课的区别。\n第三类 安全性问题。\n这个是家长的风险顾虑，最典型的：会不会是骗子、担心资金、上课安全等。\n家长认可价值，也看懂课程了，但是心里有风险担忧，害怕踩坑、担心影响孩子。我们沟通重点，就是拿出品牌背书、合规保障、护眼上课安排、服务体系，给家长安全感。来看一道题，「不会是骗子吧？怕学费打水漂」属于三大类里的哪一类？","interact":{"q":"「不会是骗子吧？怕学费打水漂」属于三大类里的哪一类？","at":"P10","options":["家长重视度","产品认知度","课程时长问题","安全性问题"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":12,"stage":"阶段2·异议认知与方法","p":"P11","topic":"核心抓手「问」：望闻问切·问已打勾——通过询问挖真实卡点","script":"前面我们已经学会识别家长的各类异议，那找到顾虑之后，核心抓手是什么？就是页面上标对勾的 ——问。\n今天我们只抓核心：问\n很多新人容易踩坑：家长刚说出顾虑，我们立刻着急解释、急于说服，但是根本不知道家长这句话背后真正的想法是什么。\n这句话大家记牢：通过询问找到家长异议，进行解决，不管任何问题都可以解决。\n表层的拒绝理由，往往不是真实卡点。提问，就是帮我们挖到真实原因的工具。\n举个例子，家长说 “孩子没时间”。\n我们不要直接上来就讲课程时长、时间灵活。\n我们可以先提问：想问下，是平时课外班排得比较满，还是担心每次上课占用的时间太长呀？\n一句话，就能区分家长到底是档期冲突，还是觉得课程耗时间，我们再针对性给方案。来看一道题，观察页面右边的四张图，打了红色对勾的是哪个字？","interact":{"q":"观察页面右边的四张图，打了红色对勾的是哪个字？","at":"P11","options":["望","闻","问","切"],"answer":2,"answers":[2],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"","dept":""},{"row":13,"stage":"阶段3·家长重视度异议","p":"P12","topic":"重视度板块总览：6 类异议（年龄/时间/兴趣/视力/家人/英文），根源=价值认可未建立","script":"我们来看这一块，对应咱们前面三大异议分类里的第一类：家长重视度，底层对应的就是成交三性里的【重要性】，核心回答：为什么要学编程。\n右边这 6 个，都是属于家长重视度板块下面高频出现的异议：年龄太小、时间问题、不感兴趣、视力问题、家里人异议、英文基础差。\n这里先跟大家讲清楚：这些话，表面看起来是各种各样的理由，但本质上，根源是家长还没有真正认可编程的价值。\n不是问题本身解决不了，是家长心里觉得这件事可学可不学，所以会找出各种理由来暂缓或者拒绝。\n举几个例子：\n家长说 “孩子年龄太小”，我们先问：您是担心孩子理解跟不上，还是觉得现在没必要接触编程？\n家长说 “孩子不感兴趣”，我们先问：是之前接触过觉得没意思，还是担心编程本身枯燥，孩子坐不住？\n提问之后我们再判断：\n如果只是单纯担心难度、适配问题，我们再讲课程分层、低龄的授课设计；\n如果深挖之后，家长核心想法是 “学这个没啥用”，那我们就要回归到【重要性】，重新帮家长建立价值认知，讲清楚逻辑思维、信息素养、科技特长、赛事路径这些。\n这里给大家一个关键提醒：\n重视度类异议，是我们最先要攻克的一关。只要家长的重视度没有建立起来，就算我们把时间、视力、英文这些问题全部解释清楚，他后面依然会冒出新的顾虑。\n价值认同是根基，根基不稳，后面所有沟通都会很吃力。来看一道题，「孩子不感兴趣」表面是兴趣问题，根源通常是什么？","interact":{"q":"「孩子不感兴趣」表面是兴趣问题，根源通常是什么？","at":"P12","options":["课程太贵","家长重视度没建立，觉得编程可学可不学","孩子能力不行","老师不好"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":14,"stage":"阶段3·家长重视度异议","p":"P13","topic":"年龄太小：共情→聚焦→答疑（拼音模式/语音读题/平板上课）→赋能（重要性&紧迫性）","script":"接下来我们进入第一个场景演练：家长说孩子年龄太小\n这个异议，连同 “听不懂、过几年再学”，逻辑完全一致，统一用固定四步流程：共情→聚焦提问→针对性答疑→赋能拔高（重要性 + 紧迫性），一步都不能跳。\n第一步：共情，接住情绪。\n大家一定要记住：家长愿意说出顾虑，不是拒绝，是信任我们，愿意把心里的担心讲出来。我们先站在家长一边，不要一上来就反驳 “不小，可以学”。\n标准话术：我特别理解您，担心孩子年龄小，学习上会跟不上、遇到困难。\n先共情，拉近距离，让家长感受到我们和他是一边的，不是对立的。\n第二步：聚焦问题、缩小问题（也就是我们前面重点练习的【问】）\n共情完不要直接解释，主动提问，把模糊的担心，挖到具体卡点，区分他到底怕什么。\n标准提问话术：您是不是担心孩子太小，没办法独立上完课程？是担心不认字看不懂题目，还是不会操作鼠标、电脑呀？\n一句话把顾虑锁定，避免我们自说自话，答非所问。\n第三步：针对具体问题答疑，给方案、给案例，打消顾虑\n根据家长的回答对应解释：\n如果担心不识字：\n咱们是实操课，配有拼音模式、语音读题，不用孩子自己认字读题，上课还有老师在线实时答疑，跟着引导动手就行。\n如果担心不会操作鼠标 / 电脑：\n咱们平板也能上课，课程前期会专门带着孩子学习基础操作；很多和咱家同龄的孩子，刚开始也不熟练，跟着课程慢慢适应，后面都学得很好，也拿到了不错的学习成果。\n这里核心：给落地的支撑，用同龄学员案例，给家长定心丸。\n第四步：结合年龄赋能，回归重要性、紧迫性\n顾虑解决之后，我们再往上拔高，讲黄金学习窗口，对应成交三性里的重要性和紧迫性。\n标准话术：\n其实这个年龄段恰恰是逻辑思维开拓的黄金期，新课标也对信息素养、编程思维有明确要求。早接触早受益，既能锻炼逻辑、养成良好的学习习惯，还能反过来助力校内学科；\n现在课业压力相对宽松，有充足时间去培养思维；等到后面高年级科目变多，时间紧张，再想安排就很难挤出时间了。\n话术参考：\n我特别理解您，担心孩子年龄小，学习上会遇到困难。（共情）\n您是不是担心孩子太小没办法独立完成课程？是担心不认字看不懂题目，还是不会操作鼠标、电脑呀？（聚焦提问）\n如果是不认字您不用担心，咱们实操课有拼音模式、语音读题，还有老师在线答疑；如果是不会操作设备，平板也能上课，课程里面会带着孩子慢慢学操作。咱们很多同年龄段的孩子也是从零开始，适应之后学习效果都很好。（针对性答疑）\n而且这个阶段正是孩子思维发展的黄金期，新课标也重视信息素养培养，早学早受益，锻炼逻辑思维、培养学习习惯，还能助力校内学科。现在课业压力不大，还有时间深耕，等到后面高年级功课多了，就很难抽出时间了。（赋能、讲重要性 + 紧迫性）。来看一道题，「年龄太小」的标准处理流程，正确的顺序是？","interact":{"q":"「年龄太小」的标准处理流程，正确的顺序是？","at":"P13","options":["共情→聚焦提问→针对性答疑→赋能","答疑→共情→赋能→提问","提问→共情→赋能→答疑","赋能→答疑→提问→共情"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":15,"stage":"阶段3·家长重视度异议","p":"P14","topic":"英语太差：图形化不涉英文代码、Python 关键字固定几个、逐行带练、课前带过单词","script":"接下来我们学习第二个高频异议：家长担心孩子英语基础弱，学不了编程。\n同样严格沿用咱们统一的四步流程：共情→聚焦提问→针对性答疑→赋能拔高（重要性 + 紧迫性），步骤不能跳。\n第一步：共情，接住情绪\n家长愿意说出这份担心，不是直接拒绝，是心里有顾虑，希望得到靠谱的解答。我们先站在家长这边，不要直接反驳 “学编程不用英语好”。\n标准话术：我特别理解您的顾虑，担心孩子英语基础薄弱，跟不上编程课、看不懂代码指令。\n第二步：聚焦问题、缩小问题（核心动作：问）\n共情完不要直接开始解释，主动提问，把模糊的担心锁定到具体卡点，搞清楚家长真正怕什么。\n标准提问话术：您是不是担心孩子英语不好，看不懂代码指令、记不住里面的英文单词，怕词汇量不够跟不上？\n第三步：针对具体问题答疑，给方案、打消顾虑\n根据家长的回答对应解释：\n咱们编程学习，并不要求孩子去背大量英语单词。图形化阶段还涉及不到英文代码。您不用担心的。\n就算学到 Python 阶段，用到的关键字也就固定那几个，数量很少，上课老师会逐行带着孩子实操、反复练习，熟练之后自然就记住了，编程学习和校内英语成绩并不直接挂钩，反而还能顺便积累这部分专用英文词汇。课前老师也会提前带着孩子过一遍本节课要用到的单词。如果孩子看不懂英文命令也不用担心，实操课界面自带提示，上课老师会一步步拆解、讲解每一条语句的含义和用法，孩子跟着引导动手操作，就可以完成任务。\n第四步：结合年龄赋能，回归重要性、紧迫性\n顾虑解开之后，我们再拔高价值，讲清楚当下学习的意义。\n标准话术：\n编程核心锻炼的是逻辑思维，培养孩子的学习习惯，在学习过程中，还能反过来带动孩子对信息科技、英文词汇的兴趣。\n现在新课标越来越看重信息素养，当下正是孩子思维发展的黄金期，咱们可以先把学习意识、良好的思维习惯建立起来，不用被英语基础这个门槛困住。\n话术参考：\n我特别理解您的顾虑，担心孩子英语基础薄弱，跟不上编程课、看不懂代码指令。（共情）\n您是不是担心孩子英语不好，看不懂代码指令、记不住里面的英文单词，怕词汇量不够跟不上？（聚焦提问）\n其实学编程不需要背大量英文单词，图形化阶段没有英文代码，就算学到 Python 阶段，用到的关键字就固定几个，老师上课会逐行带练、反复巩固，和校内英语成绩不直接挂钩，还能顺带积累专用词汇；课前也会提前带孩子预习单词。看不懂命令也不用担心，实操界面有提示，老师会一步步讲解语句意思，孩子跟着操作就能完成。（针对性答疑）\n而且咱们零基础就能入门，编程重点锻炼逻辑思维、培养学习习惯，还能带动孩子对信息科技和英语的兴趣。新课标越来越重视信息素养，正好趁着思维黄金期，帮孩子把学习意识和习惯先建立起来。（赋能、讲重要性 + 紧迫性）。来看一道题，图形化阶段需要孩子先背大量英文单词吗？","interact":{"q":"图形化阶段需要孩子先背大量英文单词吗？","at":"P14","options":["需要，先背 3000 词","不需要，图形化不涉及英文代码","需要，每周考单词","看孩子心情"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":16,"stage":"阶段3·家长重视度异议","p":"P15","topic":"时间问题：先问是您没时间还是孩子没时间；一次两课时 70-90min；思维提升反帮省时间","script":"接下来我们学习第三个高频异议：家长说没时间、排不开。\n依旧严格使用统一四步流程：共情→聚焦提问→针对性答疑→赋能拔高（重要性），顺序不能跳。\n第一步：共情，接住情绪\n现在孩子课外安排多，家长陪学也耗精力，家长提出时间紧张，是非常现实的顾虑。我们先共情，不要直接跟家长说 “挤一挤就有时间”。\n标准话术：我特别理解，现在孩子课业、兴趣班多，不管是孩子还是咱们家长，平时都挺忙的。\n第二步：聚焦问题、缩小问题（核心动作：问）\n共情之后先不着急给方案，主动提问，分清到底卡点在家长，还是孩子本身。\n标准提问话术：想问下，是您没时间陪孩子上课，还是孩子课外班排得太满，抽不出时间呀？\n第三步：针对具体问题答疑，分两种情况解决\n如果是档期冲突、怕固定时间不方便：\n咱们上课时间很灵活，遇到特殊情况没法上课，可以直接跟课程老师预约补课。单次两课时合计 70–90 分钟，整体安排轻量化，不会给孩子造成很重的负担。\n如果是担心孩子学得慢、耗时间：\n很多孩子学东西慢，并不是能力不够，而是缺少好的学习思路和方法。编程核心练的就是逻辑思维，思维提上来之后，孩子掌握学习方法，之后学其他科目、新知识都会更快。\n第四步：结合编程赋能，回归重要性\n把格局拉高，讲清楚编程不是额外增加负担，而是帮孩子提升效率的工具。\n标准话术：\n现在越来越多家长重视信息素养、逻辑思维的培养，编程锻炼的思维和学习方法，是可以迁移到校内各科的。学好之后，孩子学习效率更高，反而能帮孩子省下不少时间，越学越轻松。\n话术参考：\n我特别理解，现在孩子课业、兴趣班多，不管是孩子还是咱们家长，平时都挺忙的。（共情）\n想问下，是您没时间陪孩子上课，还是孩子课外班排得太满，抽不出时间呀？（聚焦提问）\n如果是时间不好协调，咱们上课时间灵活，有事可以跟导师约补课，一次两课时一共 70–90 分钟，不会有很重的负担；如果您担心孩子学得慢、耗时间，其实很多孩子学得慢，根源是缺少学习方法。编程专门锻炼逻辑思维，思维提上来之后，学新知识会更快。（针对性答疑）\n现在大环境下，逻辑思维、信息素养都是重点。编程练出来的思维能力可以用到其他学科，提升孩子整体学习效率，长远来看，是帮孩子省时间，而不是单纯多报一门课。（赋能、讲重要性）。来看一道题，家长说「没时间」，共情之后第一句该问什么？","interact":{"q":"家长说「没时间」，共情之后第一句该问什么？","at":"P15","options":["直接介绍补课规则","是您没时间陪孩子上课，还是孩子自己没时间上课","那就算了不勉强","让爸爸决定"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":17,"stage":"阶段3·家长重视度异议","p":"P16","topic":"视力问题：根源=用眼习惯；护眼模式+节奏科学；第⑤步 有效引导比杜绝更有效","script":"接下来我们学习视力这个高频异议，这个家长顾虑非常真实，很多家长都会担心线上上课伤眼睛。咱们这套流程在之前 4 步基础上，增加第 5 步，顺序不能乱：共情→聚焦问题→针对性答疑→编程赋能→时代认知引导\n第一步：共情，接住情绪\n家长担心视力是非常合理的，孩子的健康肯定是第一位的，我们千万不要否定家长的担心。\n标准话术：特别理解您的想法，担心孩子长时间看屏幕影响视力，毕竟孩子的身体健康肯定是放在第一位的。\n第二步：聚焦问题、缩小问题\n共情之后，我们帮家长理清核心：近视的根源，并不只是看电子屏幕，更多是用眼习惯。\n标准话术：其实很多家长都会有这个顾虑，咱们可以先客观说一下，影响视力的根本，主要还是用眼时长、坐姿、休息这些用眼习惯，不是电子产品本身。\n第三步：具体问题答疑，讲课程护眼设计\n咱们课程本身也做了对应的护眼安排，给家长落地的安心方案：\n咱们实操课自带护眼模式，同时课程节奏是科学拆分的，不是一直盯着屏幕；后期续报之后的项目学习，也会穿插思考、构思环节，不会让孩子全程盯着屏幕操作。我们上课也会提醒孩子保持距离、定时休息，帮孩子养成良好的用眼习惯。\n第四步：编程赋能，回归重要性 + 紧迫性\n打消屏幕焦虑之后，再给家长讲课程价值：\n现在很多家长都在布局信息素养学习，编程锻炼逻辑思维、解决问题的能力，是新课标重点方向，趁着孩子思维黄金期培养，对孩子长期发展很有帮助。核桃实操课重在动手思考，收获的是思维能力，不是单纯对着屏幕玩。\n第五步：时代认知拔高：有效引导，比杜绝更有用\n收尾升华：\n现在孩子本身就处在电子信息时代，完全不让孩子接触电子产品是很难做到的。与其被动让孩子无目的刷短视频、玩游戏，不如我们做正向有效的引导，用编程把电子产品变成学习工具，让孩子有目标、有规划地使用，学会合理把控屏幕时间。\n话术参考  我特别理解您的想法，担心孩子长时间看屏幕影响视力，毕竟孩子的身体健康肯定是放在第一位的。（共情）\n其实很多家长都会有这个顾虑，咱们客观来说，影响视力的根本，主要还是用眼习惯，不单单是电子产品本身。（聚焦问题）\n咱们实操课自带护眼模式，课程节奏也是科学设计的，不会让孩子一直盯着屏幕；后期项目学习阶段，也会预留思考规划的时间，同时上课过程中老师也会提醒孩子注意坐姿、定时休息，帮孩子建立好的用眼习惯。（答疑）\n现在大环境下信息素养越来越重要，编程锻炼逻辑思维，也是新课标要求的方向，核桃实操课重点培养孩子思考能力，对孩子长期学习很有帮助。（赋能）\n而且现在孩子本来就在电子信息时代，完全隔绝电子产品很难。与其放任孩子漫无目的地刷视频，不如正向引导，把电子产品变成学习工具，学会合理使用，这比单纯禁止更有意义。（时代引导）。来看一道题，视力异议的处理比其他异议多出第⑤步，第⑤步讲什么？","interact":{"q":"视力异议的处理比其他异议多出第⑤步，第⑤步讲什么？","at":"P16","options":["降价安抚","目前孩子处于电子信息时代，有效引导比杜绝更有效","发护眼宣传单","承诺保护视力"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":18,"stage":"阶段3·家长重视度异议","p":"P17","topic":"不感兴趣：先挖学不会/太简单/对学习不感兴趣；闯关+实操建成就感，兴趣靠正反馈培养","script":"接下来我们学习 “孩子不感兴趣” 这个异议，这个异议很常见，大家记住，兴趣不是凭空来的，我们依旧用固定流程：共情→聚焦提问挖真实原因→分情况答疑→编程赋能拔高\n第一步：共情，接住情绪\n家长担心孩子没兴趣、学着学着就放弃，这份顾虑非常实在，我们先认可家长的担心，不要直接反驳。\n标准话术：我特别理解您的担心，怕孩子没有兴趣，学不进去、坚持不下来。\n第二步：聚焦问题、缩小问题（核心动作：问）\n共情之后不要直接讲课程，主动提问，区分背后真实原因，是太难、太简单，还是本身对学习没动力。\n标准提问话术：想问下，您是觉得孩子之前试了觉得学不会，还是觉得内容太简单没意思，或是孩子本身对学习类内容不容易提起兴趣呀？\n第三步：分情况针对性答疑\n如果是孩子对学习本身没兴趣、缺少自信：\n很多孩子不爱学习，根源是很少拿到成就感。咱们课程是闯关 + 实操的模式，每完成一个作品、闯过一关，都能看到自己的成果，一点点帮孩子建立成就感和自信心，慢慢愿意主动投入。主动给孩子安排小灶或电话沟通，给信心和肯定。\n如果是孩子对编程本身提不起兴趣：\n咱们可以先问问孩子上课感受，看是觉得难度跟不上，还是觉得内容太简单。编程本身是需要多练习的，很多孩子年纪小，暂时看不到它的价值。\n很多时候孩子当下不感兴趣很正常，编程对升学、思维、未来信息素养的帮助，是孩子现阶段理解不到的，这就需要家长多一点教育前瞻性，帮孩子抓住机会。\n第四步：编程赋能，回归重要性\n现在信息素养是大趋势，很多家长都在给孩子规划编程学习。核桃莫顿实操课不只是学代码，核心锻炼逻辑思维。\n这里大家一定要记住核心总结：我们先沟通摸清孩子不感兴趣的真实原因，再用闯关实操的正向反馈培养兴趣。兴趣不是天生的，是一次次拿到成就感之后慢慢养出来的学好编程，既能锻炼逻辑，还能带动孩子整体的学习主动性。\n话术参考：孩子对这个不感兴趣，怕学两天就不想学了。\n老师：我特别理解您的担心，怕孩子没有兴趣，学不进去、坚持不下来。（共情）\n想问下，您是觉得孩子之前试了觉得学不会，还是觉得内容太简单没意思，或是孩子本身对学习类内容不容易提起兴趣呀？（聚焦提问）\n如果是孩子平时学习不容易有动力，大多是缺少成就感。咱们课程闯关 + 实操的形式，孩子每做完一个作品就能看到成果，慢慢建立自信；如果是孩子对编程本身没感觉，咱们也可以先看上课感受，判断是难度不合适还是别的原因。\n很多小朋友年纪小，暂时感受不到编程的价值，这特别正常，编程带来的思维提升、信息素养积累，是需要家长带着前瞻性眼光去规划的。（针对性答疑）\n现在大环境下信息素养越来越重要，核桃莫顿实操课重点锻炼逻辑。兴趣不是天生就有的，是在一次次正向反馈里慢慢培养出来的，学好编程，不仅锻炼思维，还能带动孩子整体的学习主动性。（赋能）。来看一道题，「不感兴趣」第②步要挖掘的三种可能原因是？","interact":{"q":"「不感兴趣」第②步要挖掘的三种可能原因是？","at":"P17","options":["学不会","太简单","对学习不感兴趣","太贵"],"answer":-1,"answers":[],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":19,"stage":"阶段3·家长重视度异议","p":"P18","topic":"家里人不同意：区分不了解编程还是不了解核桃；邀请共同沟通+试学期看到效果","script":"家里人不支持学编程。很多家庭报课需要全家达成共识，第一步：共情，接住情绪\n孩子报课本来就是一家人一起商量的大事，有不同意见很正常，不要给家长施压。\n标准话术：我特别理解，孩子的学习规划本来就是一家人一起商量决定的，有不同想法特别正常。\n第二步：聚焦问题、缩小问题\n共情之后，主动提问，找到家人反对的根源，区分是不了解编程，还是不了解咱们核桃的课程。\n标准提问话术：想问下，家里人是对编程本身不太了解，还是不清楚咱们核桃这种项目实操课的优势，才不太认可呀\n第三步：具体问题答疑\n如果家人是不了解编程、不了解咱们课程：\n咱们可以跟家长讲清楚核桃编程的课程模式和价值，咱们是项目实操课，不是单纯敲代码，重点锻炼孩子逻辑思维。\n同时给到方案：方便的话，可以邀请家里另一位家长一起沟通，我把课程内容、培养方向再完整讲一遍；咱们还有试学期权益，也可以先体验，不用一下子做长期决定，降低决策压力。\n第四步：编程赋能，回归重要性\n现在新课标对信息素养越来越重视，很多家庭都在给孩子规划编程学习。核桃实操课，是以项目带动学习，锻炼孩子拆解问题、动手解决问题的能力，这个能力是可以迁移到校内各科学习里的。\n第五步：落地收尾，用试学期看见效果\n咱们可以先利用试学期，让孩子先上课、做出作品，家人亲眼看到孩子的变化、上课成果，比口头解释更有说服力，更容易达成共识。\n最后可以询问编程平时是谁跟进，跟进人肯定更加了解孩子的学习情况。家里其他人不了解孩子的兴趣和课程表现自然没有那么肯定。\n参考话术：我特别理解，孩子的学习规划本来就是一家人一起商量决定的，有不同想法特别正常。（共情）\n想问下，家里人是对编程本身不太了解，还是不清楚咱们核桃这种项目制实操课的优势，才不太认可呀？（聚焦提问）\n如果是还不了解，我可以跟您说下咱们核桃的课程模式，咱们是项目制实操课，核心锻炼孩子的逻辑思维。要是方便，也可以邀请家里另一位家长一起来沟通，我完整介绍；而且咱们有试学期权益，可以先体验，不用一下子做长期决定，压力会小很多。（针对性答疑）\n现在大环境里信息素养是重点方向，很多家长都在提前规划，咱们实操课重在项目式学习，锻炼孩子拆解问题、解决问题的能力，对孩子长期学习帮助很大。（赋能）\n咱们可以先借着试学期，让孩子先上课、产出作品，等家里人看到孩子上课的状态和学习成果，也更容易理解和认可。（试学期落地）。来看一道题，家里人不同意，靠什么让家人亲眼看到效果？","interact":{"q":"家里人不同意，靠什么让家人亲眼看到效果？","at":"P18","options":["口头保证","利用试学期，让孩子先上课、做出作品","直接降价","发朋友圈宣传"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":20,"stage":"阶段4·产品认知度异议","p":"P19","topic":"产品认知度板块总览：价格问题/课程模式问题/竞品对比（唯一性）","script":"前面我们讲的是孩子层面的异议，比如年龄、兴趣、视力、时间。这一板块，进入【产品认知度】，也就是成交三性里的唯一性，核心回答家长一句话：为什么我要选择核桃，而不是别的？\n家长在这里的疑问，集中在三个：价格、上课模式、和其他机构对比。我们所有回答，都不要去否定别的机构，而是帮家长看懂价值差别，把核桃实操体系这个核心优势讲透。","interact":null,"sku":"","dept":""},{"row":21,"stage":"阶段4·产品认知度异议","p":"P20","topic":"价格问题：先问贵还是对比过；拆分讲价值+优惠券；头部品牌、排名靠前","script":"接下来我们看价格异议，共情→聚焦问题→解决问题（讲价值回报）→编程赋能（唯一性）→试学期兜底。核心思路：先接纳家长的经济顾虑，再把家长的关注点从 “多少钱” 转到 “能拿到什么价值”，最后用试学期降低决策压力。\n第①步：共情\n老师也特别理解，这几年大环境都不太好，大家挣钱都不容易，也正是这样，咱们更要帮孩子提升综合能力和长期竞争力。\n第②步：聚焦问题\n【目标】搞清楚家长觉得贵的根源：是单纯觉得预算超了，还是横向对比过别家\n话术：您是单纯觉得价格偏高，还是已经和其他机构对比过？\n第③步：具体问题进行解决\n【目标】让家长看见产品的价值与回报，拆分价格、讲优惠、讲品牌课程优势\n话术：咱们可以拆开看总价、课时和配套权益，同时咱们还有优惠券可以用。核桃是编程行业头部品牌，课程因材施教、学练考一体，业内赛考成绩排名靠前。很多家长对比之后发现，同等甚至更低的预算，孩子在这里掌握的知识、配套赛事资源，是其他机构很难给到的。\n 第④步：编程赋能（唯一性为什么在核桃学）\n【目标】绑定孩子个人学情，讲清楚专属学习成果\n话术：结合咱们孩子现在的学情，这套课程是适配他能力阶段的，跟着体系稳步搭建编程逻辑，后续可以衔接 GESP、CTL 赛事，拿到赛考成果，给孩子多一条科技特长发展路径。\n第⑤步：利用试学期，让家长看到效果\n话术：咱们还有试学期，不用一次性做长期的报名决定，先让孩子上课体验，您直接观察孩子的课堂状态、产出的作品，亲眼看见学习效果。\n参考话术：老师也特别理解，这几年大环境都不太好，大家挣钱都不容易，也正是这样，咱们更要帮孩子提升综合能力和长期竞争力。（共情）\n您是单纯觉得价格偏高，还是已经和其他机构对比过？（聚焦）\n咱们可以拆开看总价、课时和配套权益，同时咱们还有优惠券可以用。核桃是编程行业头部品牌，课程因材施教、学练考一体，业内赛考成绩排名靠前。很多家长对比之后发现，同等甚至更低的预算，孩子在这里掌握的知识、配套赛事资源，是其他机构很难给到的。（解决问题）\n结合咱们孩子现在的学情，这套课程是适配他能力阶段的，跟着体系稳步搭建编程逻辑，后续可以衔接 GESP、CTL 赛事，拿到赛考成果，给孩子多一条科技特长发展路径。（唯一性赋能）\n咱们还有试学期，不用一次性做长期的报名决定，先让孩子上课体验，您直接观察孩子的课堂状态、产出的作品，亲眼看见学习效果。（试学期落地）。来看一道题，家长说「太贵了」，第②步要先弄清什么？","interact":{"q":"家长说「太贵了」，第②步要先弄清什么？","at":"P20","options":["家长的收入水平","是单纯觉得贵，还是已经和其他机构对比过","孩子的成绩","家长的职业"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":22,"stage":"阶段4·产品认知度异议","p":"P21","topic":"课程模式：莫顿实操课不是动画/游戏/录播；侦探题材热门；科普剧情+闯关激励","script":"接下来我们是课程模式异议，一共 4 步：共情→聚焦问题→课程模式赋能（唯一性）→优秀案例展示。很多家长容易把咱们的莫顿实操课，误以为是动画片、游戏、单纯录播回放，我们这一步核心就是区分清楚：咱们是莫顿+实操课，不是动画游戏课。\n第①步：共情\n老师也特别理解，之前很多家长没接触过这种实操课，会担心这种形式学习效果不好。\n第②步：聚焦问题\n【目标】明确区分，纠正认知：咱们是莫顿实操课，不是动画、游戏，也不是单纯录播回放\n话术：很多家长第一眼会以为是动画片、游戏或者录播回放，其实咱们是莫顿实操课，孩子是跟着剧情动手写代码做项目，不是光看动画。\n第③步：课程模式赋能（唯一性｜为什么在核桃学）\n话术：咱们这套实操课，用科普剧情抓住孩子注意力，闯关激励机制，持续给到孩子成就感。\n咱们选用孩子很喜欢的侦探类题材，这类题材本身就很吸引孩子，是寓教于乐，不是单纯玩；而且剧情里面融入科普知识、真实生活场景，孩子上一节编程课，编程思维、科普常识、生活认知一起收获。\n第④步：优秀案例展示\n话术：之前也有不少家长一开始和您想法一样，担心是看动画玩游戏，您可以看下这些学员的作品和家长反馈，孩子都是独立动手完成项目，学完之后逻辑、专注力提升都很明显。\n话术参考老师也特别理解，之前很多家长没接触过这种实操课，会担心这种形式学习效果不好。（共情）\n很多家长第一眼会以为是动画片、游戏或者录播回放，其实咱们是莫顿实操课，孩子是跟着剧情动手写代码做项目，不是光看动画。（聚焦）\n咱们这套实操课，用科普剧情抓住孩子注意力，闯关激励机制，持续给到孩子成就感。咱们选用孩子很喜欢的侦探类题材，这类题材本身就很吸引孩子，是寓教于乐，不是单纯玩；而且剧情里面融入科普知识、真实生活场景，孩子上一节编程课，编程思维、科普常识、生活认知一起收获。（课程赋能，唯一性）\n之前也有不少家长一开始和您想法一样，担心是看动画玩游戏，您可以看下这些学员的作品和家长反馈，孩子都是独立动手完成项目，学完之后逻辑、专注力提升都很明显。来看一道题，关于咱们的课程，哪种描述是对的？","interact":{"q":"关于咱们的课程，哪种描述是对的？","at":"P21","options":["动画片课","游戏课","纯录播回放","莫顿实操课，孩子跟着剧情动手写代码做项目"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":23,"stage":"阶段4·产品认知度异议","p":"P22","topic":"对比竞品：先问对比哪家；不拉踩只做差异化；衔接 GESP、CTL 赛事","script":"接下来是竞品对比异议，一共 5 步：共情→聚焦问题→对比拆解优势（不踩竞品）→编程赋能→展示学习效果与获奖案例。核心原则：不拉踩同行，只做差异化对比，回归核桃唯一性。\n第①步：共情\n老师也特别理解，咱们给孩子报课，肯定要多方对比，挑选一个真正适合孩子的机构。\n第②步：聚焦问题\n【目标】摸清家长正在对比的机构，找准对比方向\n话术：您目前是在和哪家机构做对比呀？我从专业编程老师的角度，帮您一起客观分析一下。\n第③步：具体问题进行解决（对比突出优势，不贬低竞品）\n话术：每家机构的定位不一样，他们侧重什么，而核桃主打莫顿实操体系，学练考一体，整套课程从图形化平稳衔接C++，配套完整赛事规划，会更贴合咱们孩子长期的编程学习路线。\n第④步：编程赋能（唯一性为什么在核桃学）\n话术：结合咱们孩子现在的学情来看，这套体系匹配他现阶段能力，循序渐进搭建逻辑思维，后续可以冲刺 GESP、CTL 赛事，拿到对应的证书成果，给孩子多一条科技特长发展路径。也有很多之前在多家机构对比过的家长，最后选择核桃，您可以参考下他们的反馈。\n⑤步：强调孩子在核桃的学习效果和获奖情况\n话术：咱们很多学员跟着体系持续学习，不仅编程思维、自主解决问题的能力提升明显，在各类官方赛事中也取得了不错的成绩，这也是咱们整套体系落地的结果。\n话术参考：老师也特别理解，咱们给孩子报课，肯定要多方对比，挑选一个真正适合孩子的机构。（共情）\n您目前是在和哪家机构做对比呀？我从专业编程老师的角度，帮您一起客观分析一下。（聚焦）\n每家机构的定位不一样，他们侧重什么，而核桃主打莫顿项目制实操体系，学练考一体，整套课程从图形化平稳衔接趣 C、C++，配套完整赛事规划，会更贴合咱们孩子长期的编程学习路线。（对比拆解，不拉踩）\n结合咱们孩子现在的学情来看，这套体系匹配他现阶段能力，循序渐进搭建逻辑思维，后续可以冲刺 GESP、CTL 赛事，拿到对应的证书成果，给孩子多一条科技特长发展路径。也有很多之前在多家机构对比过的家长，最后选择核桃，您可以参考下他们的反馈。（编程赋能）\n咱们很多学员跟着体系持续学习，不仅编程思维、自主解决问题的能力提升明显，在各类官方赛事中也取得了不错的成绩，这也是咱们整套体系落地的结果。（学习效果 & 获奖佐证）。来看一道题，对比竞品的核心原则是？","interact":{"q":"对比竞品的核心原则是？","at":"P22","options":["贬低对手抬高自己","不拉踩、不贬低，只做差异化对比","报更低价格","回避家长问题"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":24,"stage":"阶段4·产品认知度异议","p":"P23","topic":"想在线下学：区分督促/接送诉求；线下受师资场地限制 vs 我们完整体系；试学期落地","script":"接下来我们看「想在线下学」这个异议，同样沿用 5 步流程：共情→聚焦问题→讲清线上线下差异（不贬低线下）→编程赋能→试学期落地。核心原则：不否定线下课，帮家长看懂线上系统实操的差异化优势。\n第①步：共情\n老师也特别理解，线下课老师面对面盯着孩子，家长确实更放心，有这样的偏好很正常。\n第②步：聚焦问题\n【目标】摸清家长想报线下的真实原因\n话术：您是希望老师面对面督促孩子学习，还是觉得线下离家近、接送方便呀？\n第③步：具体问题进行解决（讲清线上线下差异，不贬低线下）\n话术：线下课面对面督促有它的优势，不过线下受师资、场地和时间限制，大多集中在启蒙入门阶段；咱们线上是完整的系统实操体系，从图形化到趣 C、C++ 全程进阶，授课的是全国头部教研团队，孩子每节课跟着剧情动手写代码做项目，时间安排也灵活，不用来回接送，省下的时间可以更好地安排学习。\n第④步：编程赋能（唯一性为什么在核桃学）\n话术：结合咱们孩子现在的学情来看，这套体系匹配他现阶段能力，循序渐进搭建逻辑思维，后续可以衔接 GESP、CTL 赛事，拿到对应的证书成果，给孩子多一条科技特长发展路径。\n第⑤步：利用试学期体验，先让孩子试，用效果说话\n话术：咱们有试学期，不用直接做长期决定，先让孩子上课体验，您观察孩子的课堂状态和产出的作品，眼见为实。\n话术参考：老师也特别理解，线下课老师面对面盯着孩子，家长确实更放心，有这样的偏好很正常。（共情）\n您是希望老师面对面督促孩子学习，还是觉得线下离家近、接送方便呀？（聚焦）\n线下课面对面督促有优势，不过线下受师资、场地和时间限制，大多集中在启蒙入门；咱们线上是完整系统实操体系，图形化到 C++ 全程进阶，孩子每节课跟着剧情动手写代码做项目，时间灵活不用接送，授课的是全国头部教研团队。（解决问题）\n结合咱们孩子现在的学情，这套体系匹配他现阶段能力，循序渐进搭建编程逻辑，后续衔接 GESP、CTL 赛事，拿到对应的证书成果，给孩子多一条科技特长发展路径。（赋能）\n咱们有试学期，不用直接做长期决定，先让孩子上课体验，您直接看孩子的课堂状态和产出作品，用效果说话。（试学期落地）","interact":null,"sku":"","dept":""},{"row":25,"stage":"阶段5·安全性异议与汇总","p":"P24","topic":"第三章（章节页）：安全性问题——担心学费 & 公司跑路","script":"接下来是担心学费安全这个异议，一共 5 步：共情→聚焦问题→出示资质佐证→可视化参观→强调学员规模。核心目标：打消家长机构跑路、学费没有保障的顾虑，用监管、资质、体量建立信任。\n第①步：共情\n老师也特别理解，近些年确实有部分机构出现过类似情况，有这样的顾虑很正常，您别担心。\n第②步：聚焦问题\n话术：核桃不会出现这类情况，我们是有资金监管账户来保障大家学费安全的。\n第③步：发公司资质、公司规模\n话术：咱们这边可以给您提供营业执照、报名可以开具正规发票，同时还有试学期，加上资金监管账户多重保障，您的权益是有保障的，也可以了解下咱们公司的学员体量。\n第④步：可视化参观\n话术：如果您离得近，欢迎您来公司实地参观；距离比较远的话，咱们也可以视频沟通，给您介绍公司环境和团队。\n第⑤步：强调学员规模\n话术：核桃累计学员 1000万以上，是编程赛道头部品牌，体量很大，运营稳定，您完全可以放心。\n话术参考：老师也特别理解，近些年确实有部分机构出现过类似情况，有这样的顾虑很正常，您别担心。（共情）\n核桃不会出现这类情况，我们是有资金监管账户来保障大家学费安全的。（聚焦）\n咱们这边可以给您提供营业执照、报名可以开具正规发票，同时还有试学期，加上资金监管账户多重保障，您的权益是有保障的，也可以了解下咱们公司的学员体量。（资质佐证）\n如果您离得近，欢迎您来公司实地参观；距离比较远的话，咱们也可以视频沟通，给您介绍公司环境和团队。（可视化参观）\n核桃累计学员 1000万以上，是编程赛道头部品牌，体量很大，运营稳定，您完全可以放心。（强调规模）。来看一道题，打消学费安全顾虑的佐证有哪些？","interact":{"q":"打消学费安全顾虑的佐证有哪些？","at":"P24","options":["营业执照、正规发票","资金监管账户","试学期","以上全部"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":26,"stage":"阶段5·安全性异议与汇总","p":"P25","topic":"担心学费安全：资金监管账户/执照发票/试学期/可视化参观/学员规模 1000W+","script":"这一页汇总了 5 类高频家长异议，核心思路统一延续咱们之前的 5 步异议框架，每一类的核心抓手：\n1. 不感兴趣：先提问挖清孩子不感兴趣的真实原因，再用闯关 + 实操的正向反馈，帮孩子找回成就感和自信心\n2. 时间问题：先共情，聚焦区分是家长没时间还是孩子排不开；给到灵活约课、约补课方案，再讲思维提升反帮孩子省时间\n3. 担心学不会：拼音模式、语音读题、在线答疑，加上小灶辅导兜底；把复杂知识点拆分，降低难度，帮孩子逐步建立信心\n4. 家里人不同意：邀请另一位家长共同沟通，对齐认知；用试学期降低决策压力，不用直接敲定长期报名\n5. 对比竞品：只突出核桃莫顿实操体系的独特优势，严格不拉踩、不贬低其他机构","interact":null,"sku":"","dept":""},{"row":27,"stage":"阶段5·安全性异议与汇总","p":"P26","topic":"汇总：5 种常见异议应对方案（不感兴趣/时间/学不会/家里人/竞品）","script":"然后我们今天这节课到这就全部结束了，更多的是在课上给大家讲的思路，你只要有思路了，知道怎么说了，有大概一个思路之后呢，我们会给到你具体的话术，你思路结合话术，你掌握起来也很快，而且最后的效果也非常好。来看一道题，「担心学不会」的应对抓手是？","interact":{"q":"「担心学不会」的应对抓手是？","at":"P26","options":["提供小灶辅导，拆解难点建立信心","直接降价","推荐换课程","让家长自己想办法"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":28,"stage":"阶段5·安全性异议与汇总","p":"P27","topic":"结束页：学习不息，成长不止","script":"记得扫码哦~","interact":null,"sku":"","dept":""},{"row":29,"stage":"阶段5·安全性异议与汇总","p":"P28","topic":"飞书扫码（问卷）","script":"记得扫码哦~","interact":null,"sku":"","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"阶段1测试题","q":"本次培训由哪两部分组成？【多选】","options":[{"k":"A","t":"成交三性"},{"k":"B","t":"常见异议及处理方式"},{"k":"C","t":"赛考政策解读"},{"k":"D","t":"退费流程演练"}],"answer":"AB","back":"","sku":""},{"id":"T-S02","type":"阶段练习题","chapter":"阶段1测试题","q":"「紧迫性」要回答家长的问题是？","options":[{"k":"A","t":"为什么要学编程"},{"k":"B","t":"为什么别的机构便宜"},{"k":"C","t":"为什么得在核桃学"},{"k":"D","t":"为什么得现在学"}],"answer":"D","back":"","sku":""},{"id":"T-S03","type":"阶段练习题","chapter":"阶段1测试题","q":"「唯一性」要回答家长的问题是？","options":[{"k":"A","t":"为什么得在核桃学"},{"k":"B","t":"为什么要学编程"},{"k":"C","t":"为什么得现在学"},{"k":"D","t":"为什么编程这么火"}],"answer":"A","back":"","sku":""},{"id":"T-S04","type":"阶段练习题","chapter":"阶段1测试题","q":"重要性、紧迫性是所有机构都能讲的内容，真正让家长选择核桃的，是唯一性。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answer":"A","back":"","sku":""},{"id":"T-S05","type":"阶段练习题","chapter":"阶段2测试题","q":"页面划重点的等式是「异议处理 = ？」","options":[{"k":"A","t":"把家长辩赢"},{"k":"B","t":"给家长降价"},{"k":"C","t":"让家长别再提问"},{"k":"D","t":"解决家长问题"}],"answer":"D","back":"","sku":""},{"id":"T-S06","type":"阶段练习题","chapter":"阶段2测试题","q":"家长愿意把顾虑说出来，反而是沟通机会；什么都不问、直接不回复，才是真正没有机会。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answer":"A","back":"","sku":""},{"id":"T-S07","type":"阶段练习题","chapter":"阶段2测试题","q":"下面哪些是页面列出的家长高频拒绝理由？【多选】","options":[{"k":"A","t":"孩子视力不好"},{"k":"B","t":"老师太年轻"},{"k":"C","t":"我要在线下学"},{"k":"D","t":"课程太前沿"}],"answer":"AC","back":"","sku":""},{"id":"T-S08","type":"阶段练习题","chapter":"阶段2测试题","q":"家长的异议被归纳成哪三大类？【多选】","options":[{"k":"A","t":"家长重视度"},{"k":"B","t":"产品认知度"},{"k":"C","t":"安全性问题"},{"k":"D","t":"课程时长问题"}],"answer":"ABC","back":"","sku":""},{"id":"T-S09","type":"阶段练习题","chapter":"阶段2测试题","q":"「不会是骗子吧？怕学费打水漂」属于哪一类？","options":[{"k":"A","t":"家长重视度"},{"k":"B","t":"产品认知度"},{"k":"C","t":"课程时长问题"},{"k":"D","t":"安全性问题"}],"answer":"D","back":"","sku":""},{"id":"T-S10","type":"阶段练习题","chapter":"阶段2测试题","q":"家长说「孩子没时间」，用「问」先区分的真实卡点是？","options":[{"k":"A","t":"孩子笨还是聪明"},{"k":"B","t":"是档期排太满，还是担心每次上课耗时太长"},{"k":"C","t":"贵不贵"},{"k":"D","t":"家里谁做主"}],"answer":"B","back":"","sku":""},{"id":"T-S11","type":"阶段练习题","chapter":"阶段 {"id":"T-S20","type":"阶段练习题","chapter":"阶段3测试题","q":"「家里人不同意」第②步要区分的是？","options":[{"k":"A","t":"爸爸还是妈妈说了算"},{"k":"B","t":"预算够不够"},{"k":"C","t":"家里人对编程本身不了解，还是不了解核桃项目实操课的优势"},{"k":"D","t":"孩子成绩如何"}],"answer":"C","back":"","sku":""},{"id":"T-S21","type":"阶段练习题","chapter":"阶段3测试题","q":"让家里人看到效果、达成共识的落地方式是？","options":[{"k":"A","t":"发课程海报"},{"k":"B","t":"承诺保过"},{"k":"C","t":"朋友圈打卡"},{"k":"D","t":"利用试学期让孩子先上课、做出作品"}],"answer":"D","back":"","sku":""},{"id":"T-S22","type":"阶段练习题","chapter":"阶段4测试题","q":"产品认知度板块，家长的疑问集中在哪三个？【多选】","options":[{"k":"A","t":"价格问题"},{"k":"B","t":"课程模式问题"},{"k":"C","t":"竞品对比"},{"k":"D","t":"上课人数"}],"answer":"ABC","back":"","sku":""},{"id":"T-S23","type":"阶段练习题","chapter":"阶段4测试题","q":"家长说「太贵了」，第②步先弄清什么？","options":[{"k":"A","t":"家长的收入水平"},{"k":"B","t":"是单纯觉得贵，还是已经和其他机构对比过"},{"k":"C","t":"孩子的学习成绩"},{"k":"D","t":"家长的职业"}],"answer":"B","back":"","sku":""},{"id":"T-S24","type":"阶段练习题","chapter":"阶段4测试题","q":"页面给到的品牌与课程价值背书包括？【多选】","options":[{"k":"A","t":"核桃是编程行业头部品牌"},{"k":"B","t":"课程因材施教、学练考一体"},{"k":"C","t":"业内赛考成绩排名靠前"},{"k":"D","t":"学费全网最低"}],"answer":"ABC","back":"","sku":""},{"id":"T-S25","type":"阶段练习题","chapter":"阶段4测试题","q":"关于咱们的课程，正确的说法是？","options":[{"k":"A","t":"动画片课"},{"k":"B","t":"游戏课"},{"k":"C","t":"纯录播回放"},{"k":"D","t":"莫顿实操课，孩子跟着剧情动手写代码做项目"}],"answer":"D","back":"","sku":""},{"id":"T-S26","type":"阶段练习题","chapter":"阶段4测试题","q":"「为什么用动画实操」给到的理由是？【多选】","options":[{"k":"A","t":"侦探题材一直是全球动画收视里的热门题材"},{"k":"B","t":"剧情融入科普知识和现实生活真实场景"},{"k":"C","t":"一份编程课，同时学到科普 + 生活实例"},{"k":"D","t":"动画越长越好"}],"answer":"ABC","back":"","sku":""},{"id":"T-S27","type":"阶段练习题","chapter":"阶段4测试题","q":"对比竞品时的核心原则是？","options":[{"k":"A","t":"直接说对手坏话"},{"k":"B","t":"不拉踩、不贬低，只做差异化对比"},{"k":"C","t":"报更低价格"},{"k":"D","t":"回避家长问题"}],"answer":"B","back":"","sku":""},{"id":"T-S28","type":"阶段练习题","chapter":"阶段4测试题","q":"家长说「我要在线下学」，第②步先区分什么？","options":[{"k":"A","t":"家长学历"},{"k":"B","t":"是否认识线下机构"},{"k":"C","t":"希望老师面对面督促，还是觉得离家近方便接送"},{"k":"D","t":"孩子是否喜欢线下"}],"answer":"C","back":"","sku":""},{"id":"T-S29","type":"阶段练习题","chapter":"阶段5测试题","q":"打消学费安全顾虑的佐证有哪些？【多选】","options":[{"k":"A","t":"营业执照、正规发票"},{"k":"B","t":"资金监管账户"},{"k":"C","t":"试学期"},{"k":"D","t":"近距离可邀请来公司参观、远距离打视频介绍"}],"answer":"ABCD","back":"","sku":""},{"id":"T-S30","type":"阶段练习题","chapter":"阶段5测试题","q":"强调公司学员规模，页面给到的口径是？","options":[{"k":"A","t":"100 万+"},{"k":"B","t":"500 万+"},{"k":"C","t":"1000W+"},{"k":"D","t":"1 万+"}],"answer":"C","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题","chapter":"本章综合测试题","q":"异议处理四步标准流程的正确顺序是？","options":[{"k":"A","t":"聚焦提问→共情→答疑→赋能"},{"k":"B","t":"赋能→答疑→聚焦提问→共情"},{"k":"C","t":"共情→答疑→聚焦提问→赋能"},{"k":"D","t":"共情→聚焦提问→针对性答疑→赋能"}],"answer":"D","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题","chapter":"本章综合测试题","q":"「有效引导比杜绝更有效」出自哪个异议的处理？","options":[{"k":"A","t":"年龄太小"},{"k":"B","t":"时间问题"},{"k":"C","t":"视力问题"},{"k":"D","t":"英语太差"}],"answer":"C","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题","chapter":"本章综合测试题","q":"「担心学不会」类异议，咱们能给的支撑有？【多选】","options":[{"k":"A","t":"拼音模式、语音读题"},{"k":"B","t":"老师在线实时答疑"},{"k":"C","t":"平板也能上课、课程里教具体操作"},{"k":"D","t":"直接免除作业"}],"answer":"ABC","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题","chapter":"本章综合测试题","q":"家长说「孩子学两天就不想学了」，共情之后第一个问题应该问？","options":[{"k":"A","t":"您是觉得孩子学不会，还是内容太简单没意思，或孩子对学习类内容不容易提起兴趣"},{"k":"B","t":"您预算多少"},{"k":"C","t":"您要不要先交定金"},{"k":"D","t":"您孩子几年级"}],"answer":"A","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题","chapter":"本章综合测试题","q":"处理价格异议和竞品对比时，共同的落地兜底动作是？","options":[{"k":"A","t":"直接申请最低折扣"},{"k":"B","t":"让家长自己去比较"},{"k":"C","t":"利用试学期，先体验看到效果再做长期决定"},{"k":"D","t":"承诺随时退款"}],"answer":"C","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题","chapter":"本章综合测试题","q":"通过询问找到家长异议，进行解决，不管任何问题都可以解决。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answer":"A","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题","chapter":"本章综合测试题","q":"关于成交三性，正确的有？【多选】","options":[{"k":"A","t":"重要性——先让家长认可「学编程这件事有意义」"},{"k":"B","t":"紧迫性——打消「以后再说」的拖延心态"},{"k":"C","t":"唯一性——回答「凭什么选我们而不是别家」"},{"k":"D","t":"三性的讲解顺序是唯一性优先"}],"answer":"ABC","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题","chapter":"本章综合测试题","q":"家长「想报线下课」在分类上属于？","options":[{"k":"A","t":"家长重视度"},{"k":"B","t":"产品认知度"},{"k":"C","t":"安全性问题"},{"k":"D","t":"上述都不是"}],"answer":"B","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题","chapter":"本章综合测试题","q":"家长说「XX 机构也有编程课，还便宜」，你的第一步是？","options":[{"k":"A","t":"立刻贬低该机构课程"},{"k":"B","t":"共情后问清家长在对比哪家机构，再帮家长客观分析"},{"k":"C","t":"直接说我们最便宜"},{"k":"D","t":"让家长自己看着办"}],"answer":"B","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题","chapter":"本章综合测试题","q":"异议处理的目标是把家长「辩赢」，让家长无话可说。","options":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"answer":"B","back":"","sku":""},{"id":"T-F11","type":"本章综合测试题","chapter":"本章综合测试题","q":"讲「资金监管」相关内容时，可以配合的动作有？【多选】","options":[{"k":"A","t":"提供营业执照"},{"k":"B","t":"说明报名可以开具正规发票"},{"k":"C","t":"近距离邀请来公司参观、远距离打视频介绍"},{"k":"D","t":"回避家长资金问题"}],"answer":"ABC","back":"","sku":""},{"id":"T-F12","type":"本章综合测试题","chapter":"本章综合测试题","q":"家里人说「我跟孩子爸商量一下」，最合适的组合动作是？","options":[{"k":"A","t":"邀请另一位家长共同沟通 + 用试学期降低决策压力"},{"k":"B","t":"让家长自己说服"},{"k":"C","t":"放弃跟进"},{"k":"D","t":"只跟已认可的一方联系"}],"answer":"A","back":"","sku":""}],"timing":{"P01":{"sents":["欢迎来到今天的培训课堂，我们学一个带班的必备技能，异议处理。\n","在正式学方法之前，我们先来搞懂一个概念：到底什么是异议？"," 咱们先代入一个生活场景想一想：逛街的时候导购给你推荐一件衣服，说特别适合你，但是你心里会不自觉冒出很多想法：会不会显胖？","价格值不值？","好不好打理、耐不耐穿？"," 大家注意，这不是我们故意找茬、也不是我们一定不想买，只是心里有顾虑、有担心，这些内心的疑问，就是异议。\n","放到我们的工作里也是一模一样的。"," 在和家长沟通的过程中家长会有各种各样的问题出现，导致他们可能对孩子是否继续学编程产生动摇。","所以就产生了异议。","很多新人一听到家长提顾虑、说不想学、要退费，第一反应就是紧张，觉得家长是在拒绝我们。","但大家一定要记住：异议不等于拒绝，异议只是家长的担心没有被接住，这也是我们今天专门花时间打磨这项技能的原因。"],"durs":[6.096,6.048,11.784,1.872,2.64,10.056,3.36,9.432,2.232,9,10.68]},"P02":{"sents":["在课程开始之前呢，大家可以思考一下。","我们的异议处理是续报的时候才开始的呢？","还是说我们加上好友之后就开始了？\n","如果说家长的问题我们没有解决，或者他不满意我们解决的问题，那他最终会付费吗？\n","好，思考完之后，我们带着这两个问题进入我们这节课"],"durs":[3.912,3.936,3.48,7.704,5.304]},"P03":{"sents":["本节课由两个部分组成，第一部分呢，会给大家介绍一个东西，叫成交三性。\n","第二部分呢，会给大家去介绍常见的异议以及我们遇到这些问题的时候，我们应当如何解决？"],"durs":[7.104,8.28]},"P04":{"sents":["首先第一个我们先来看一下成交三性"],"durs":[3.984]},"P05":{"sents":["这个成交3性分别是重要性、紧迫性和唯一性。","那它，我们在生活中的使用场景也特别的多，只要你涉及任何劝说别人的事情，你都可以用这成交三性去套，全部都用得上\n"," 成交三性：重要性、紧迫性、唯一性，也是我们跟家长沟通时最核心的一套逻辑。\n","首先第一个，重要性：为什么要学少儿编程？\n","我们要先给家长讲明白少儿编程本身的价值。","编程不是单纯教孩子敲代码，核心是锻炼孩子的逻辑思维、拆解问题、试错思考的能力，同时对接信息时代的素养，还有 CTL、GESP 这类权威赛事、科技特长生的升学规划路径，这是编程这件事本身的价值，先让家长认可 “学编程这件事是有意义的”。\n","第二个，紧迫性：为什么现在就要学？\n","认可价值之后，我们要告诉家长不能一直观望、拖延。","孩子的思维黄金窗口期是有限的，低龄阶段更容易建立思维习惯；","而且赛事、升学规划都有对应的时间节点，越往后，孩子课业压力越来越大，时间会越来越紧张，起步晚了，准备周期就不够。","所以不是以后学不学，而是要抓住当下合适的阶段开始。\n","第三点，唯一性：为什么选择核桃编程？\n","核桃有我们独有的优势。","我们深耕少儿在线编程多年，有完整从 Scratch 到 C++ 的进阶体系，配套标准化实操课程、赛事辅导、专业的教研和服务，主打重实操，不是单纯看动画、背概念；","同时我们的课程体系、学情跟进、赛考规划是成熟闭环，是专门适配孩子长期编程成长的。\n","简单说：很多地方都能学编程，但核桃是更专业、体系更完整、更适合孩子稳步走竞赛和素养路线的选择，这就是我们的不可替代性。\n","总结一下三性的逻辑：先靠重要性解决家长 “要不要学” 的疑问，再用紧迫性打消家长 “以后再说” 的拖延心态，最后用我们核桃独有的唯一性，回答家长 “凭什么选我们，而不是别家”，这也是我们课导在和家长沟通时，贯穿全程的底层思路。","来看一道题，成交三性里，「紧迫性」回答的是家长的哪个问题？"],"durs":[5.088,10.992,8.088,4.56,4.2,23.904,3.936,5.448,6.456,12,5.616,4.224,2.592,15.696,9.168,12.744,20.616,6.096]},"P06":{"sents":["好，接下来我们一块来看一看常见的异议以及对应的解决方式"],"durs":[5.856]},"P07":{"sents":["我们进入第二大模块：异议处理。\n","很多新人一听到家长提疑问、说顾虑，第一反应就是紧张，觉得家长在拒绝自己。","我们先把定义吃透，纠正这个认知。\n","大家看 PPT 上的定义：异议处理，就是在服务、沟通转化的过程里，我们针对家长提出的疑问、不满、反对意见，去回应、解决的过程。\n","这里重点记住这句加粗核心：异议处理 = 解决家长问题划重点：家长提出异议，不等于拒绝报名。","异议本质是家长心里还有顾虑、信息没补齐，他愿意把想法说出来，反而是沟通机会。","如果家长什么都不问、直接不回复，那才是真正没有机会。\n","再看异议处理的目的：消除客户的疑虑，提高客户满意度，最终推动促成。\n","这里有一个误区要跟大家强调：异议处理，不是去争辩、说服家长、把家长 “辩赢”。\n","不是家长说一个问题，我们立刻反驳 “不是这样的”。","我们的目标是打消顾虑，让家长理解、放心，而不是争对错。","争辩只会让家长防备心变强，反而把沟通聊死。\n","我给大家梳理一下底层心态，后面所有异议话术都建立在这个心态上：\n","1. 接纳异议：家长有顾虑是正常的，换作是我们自己报课，也会问价格、担心孩子学不会、对比别家；\n","2. 先接住，再解决：先共情认可，再解释、给方案；\n","3. 落脚点是解决问题，而不是强行逼单。\n","这一页是总起页，是整个异议板块的地基。","来看一道题，家长说「我不想学了、再考虑下」，这算拒绝吗？"],"durs":[3.192,7.704,3.408,12.792,9.648,7.992,5.4,7.176,7.92,4.632,6.192,4.776,6.288,9.696,5.592,4.2,4.08,5.52]},"P08":{"sents":["再思考一下，如果你是家长，体验课结束了，你以什么样的理由拒绝报名呢？"],"durs":[6.456]},"P09":{"sents":["这里汇总了咱们日常沟通里，家长最高频抛出的拒绝理由。\n","大家可以先看一圈，比如学编程没啥用、是不是动画片、是不是录播课、担心是骗子、没时间、家人不同意、孩子视力不好、想报线下、孩子不爱学、太贵、担心孩子学不会等等。\n","很多新人遇到这些话，第一反应就慌了，觉得家长直接拒绝了。","但大家一定要记住上一页的核心：异议不是拒绝，是家长心里的疑问。\n","这些理由，本质上就是家长的顾虑清单，也是我们后面要逐个拆解、专项练习的异议场景。","我们提前把这些场景熟悉好，等到家长说出来的时候，我们才不会慌乱，有章法去回应。\n","那我们一块来看一看。","这些理由我们是怎么样分类的？","来看一道题，下面哪几项是页面里列出的家长高频拒绝理由？"],"durs":[5.568,16.944,5.736,6.216,8.4,7.848,2.088,3.024,6]},"P10":{"sents":["我们接着看这一页，这里把刚才那么多零散的家长异议，归纳成了三大类：家长重视度、产品认知度、安全性问题，这是我们后续拆解异议的分类框架。\n","我们先看第一类：家长重视度。\n","这类异议，本质是家长还没有建立认知，没有把编程这件事放在心上。\n","典型就是咱们刚才看到的：学编程没啥用、觉得可以以后再学、不急着安排；","孩子不感兴趣、视力顾虑、时间排不开，很多时候根源也是重视度没建立起来。\n","家长的卡点：不知道编程对孩子的价值，看不到学习窗口期，觉得这件事可学可不学。","我们沟通的核心目标，就是帮家长建立价值认知，讲清楚政策、赛事、科技特长的路径，把重视度拉起来。\n","第二类： 产品认知度。\n","这一类是家长知道编程有用，但是不了解咱们核桃的课程模式。\n","常见疑问：是不是动画片？","是不是录播课？","我想找线下课、担心孩子学不会、觉得价格贵。\n","家长不是否定编程，是对我们的上课形式、课程内容、交付效果、性价比有疑问。","我们要做的，是讲清楚实验班的体系、授课模式、配套辅导、赛考交付，消除信息差，帮家长看懂我们课程和别的课的区别。\n","第三类 安全性问题。\n","这个是家长的风险顾虑，最典型的：会不会是骗子、担心资金、上课安全等。\n","家长认可价值，也看懂课程了，但是心里有风险担忧，害怕踩坑、担心影响孩子。","我们沟通重点，就是拿出品牌背书、合规保障、护眼上课安排、服务体系，给家长安全感。","来看一道题，「不会是骗子吧？","怕学费打水漂」属于三大类里的哪一类？"],"durs":[13.848,3.192,6.648,7.248,7.656,8.28,10.08,2.616,5.928,2.976,1.896,4.632,7.8,11.832,2.664,7.224,7.824,8.856,2.976,3.816]},"P11":{"sents":["前面我们已经学会识别家长的各类异议，那找到顾虑之后，核心抓手是什么？","就是页面上标对勾的 ——问。\n","今天我们只抓核心：问\n","很多新人容易踩坑：家长刚说出顾虑，我们立刻着急解释、急于说服，但是根本不知道家长这句话背后真正的想法是什么。\n","这句话大家记牢：通过询问找到家长异议，进行解决，不管任何问题都可以解决。\n","表层的拒绝理由，往往不是真实卡点。","提问，就是帮我们挖到真实原因的工具。\n","举个例子，家长说 “孩子没时间”。\n","我们不要直接上来就讲课程时长、时间灵活。\n","我们可以先提问：想问下，是平时课外班排得比较满，还是担心每次上课占用的时间太长呀？\n","一句话，就能区分家长到底是档期冲突，还是觉得课程耗时间，我们再针对性给方案。","来看一道题，观察页面右边的四张图，打了红色对勾的是哪个字？"],"durs":[6.936,3.096,2.76,11.136,7.92,3.768,3.816,3.264,4.848,8.544,8.424,6.336]},"P12":{"sents":["我们来看这一块，对应咱们前面三大异议分类里的第一类：家长重视度，底层对应的就是成交三性里的【重要性】，核心回答：为什么要学编程。\n","右边这 6 个，都是属于家长重视度板块下面高频出现的异议：年龄太小、时间问题、不感兴趣、视力问题、家里人异议、英文基础差。\n","这里先跟大家讲清楚：这些话，表面看起来是各种各样的理由，但本质上，根源是家长还没有真正认可编程的价值。\n","不是问题本身解决不了，是家长心里觉得这件事可学可不学，所以会找出各种理由来暂缓或者拒绝。\n","举几个例子：\n","家长说 “孩子年龄太小”，我们先问：您是担心孩子理解跟不上，还是觉得现在没必要接触编程？\n","家长说 “孩子不感兴趣”，我们先问：是之前接触过觉得没意思，还是担心编程本身枯燥，孩子坐不住？\n","提问之后我们再判断：\n","如果只是单纯担心难度、适配问题，我们再讲课程分层、低龄的授课设计；\n","如果深挖之后，家长核心想法是 “学这个没啥用”，那我们就要回归到【重要性】，重新帮家长建立价值认知，讲清楚逻辑思维、信息素养、科技特长、赛事路径这些。\n","这里给大家一个关键提醒：\n","重视度类异议，是我们最先要攻克的一关。","只要家长的重视度没有建立起来，就算我们把时间、视力、英文这些问题全部解释清楚，他后面依然会冒出新的顾虑。\n","价值认同是根基，根基不稳，后面所有沟通都会很吃力。","来看一道题，「孩子不感兴趣」表面是兴趣问题，根源通常是什么？"],"durs":[12.936,12.912,10.68,9.408,1.872,8.664,9.504,2.568,7.176,14.952,2.952,3.984,10.608,5.592,5.904]},"P13":{"sents":["接下来我们进入第一个场景演练：家长说孩子年龄太小\n","这个异议，连同 “听不懂、过几年再学”，逻辑完全一致，统一用固定四步流程：共情→聚焦提问→针对性答疑→赋能拔高（重要性 + 紧迫性），一步都不能跳。\n","第一步：共情，接住情绪。\n","大家一定要记住：家长愿意说出顾虑，不是拒绝，是信任我们，愿意把心里的担心讲出来。","我们先站在家长一边，不要一上来就反驳 “不小，可以学”。\n","标准话术：我特别理解您，担心孩子年龄小，学习上会跟不上、遇到困难。\n","先共情，拉近距离，让家长感受到我们和他是一边的，不是对立的。\n","第二步：聚焦问题、缩小问题（也就是我们前面重点练习的【问】）\n","共情完不要直接解释，主动提问，把模糊的担心，挖到具体卡点，区分他到底怕什么。\n","标准提问话术：您是不是担心孩子太小，没办法独立上完课程？","是担心不认字看不懂题目，还是不会操作鼠标、电脑呀？\n","一句话把顾虑锁定，避免我们自说自话，答非所问。\n","第三步：针对具体问题答疑，给方案、给案例，打消顾虑\n","根据家长的回答对应解释：\n","如果担心不识字：\n","咱们是实操课，配有拼音模式、语音读题，不用孩子自己认字读题，上课还有老师在线实时答疑，跟着引导动手就行。\n","如果担心不会操作鼠标 / 电脑：\n","咱们平板也能上课，课程前期会专门带着孩子学习基础操作；","很多和咱家同龄的孩子，刚开始也不熟练，跟着课程慢慢适应，后面都学得很好，也拿到了不错的学习成果。\n","这里核心：给落地的支撑，用同龄学员案例，给家长定心丸。\n","第四步：结合年龄赋能，回归重要性、紧迫性\n","顾虑解决之后，我们再往上拔高，讲黄金学习窗口，对应成交三性里的重要性和紧迫性。\n","标准话术：\n","其实这个年龄段恰恰是逻辑思维开拓的黄金期，新课标也对信息素养、编程思维有明确要求。","早接触早受益，既能锻炼逻辑、养成良好的学习习惯，还能反过来助力校内学科；\n","现在课业压力相对宽松，有充足时间去培养思维；","等到后面高年级科目变多，时间紧张，再想安排就很难挤出时间了。\n","话术参考：\n","我特别理解您，担心孩子年龄小，学习上会遇到困难。","（共情）\n","您是不是担心孩子太小没办法独立完成课程？","是担心不认字看不懂题目，还是不会操作鼠标、电脑呀？","（聚焦提问）\n","如果是不认字您不用担心，咱们实操课有拼音模式、语音读题，还有老师在线答疑；","如果是不会操作设备，平板也能上课，课程里面会带着孩子慢慢学操作。","咱们很多同年龄段的孩子也是从零开始，适应之后学习效果都很好。","（针对性答疑）\n","而且这个阶段正是孩子思维发展的黄金期，新课标也重视信息素养培养，早学早受益，锻炼逻辑思维、培养学习习惯，还能助力校内学科。","现在课业压力不大，还有时间深耕，等到后面高年级功课多了，就很难抽出时间了。","（赋能、讲重要性 + 紧迫性）。","来看一道题，「年龄太小」的标准处理流程，正确的顺序是？"],"durs":[5.688,14.496,3.192,8.016,5.328,7.224,6.6,5.952,8.064,6.168,5.496,4.992,5.904,2.832,2.088,10.92,3.168,6.312,9.984,6.096,5.184,8.352,1.872,9.12,7.92,5.112,6.576,1.872,5.28,1.872,4.416,5.496,1.872,7.92,7.176,6.696,1.872,12.96,7.56,3.384,5.496]},"P14":{"sents":["接下来我们学习第二个高频异议：家长担心孩子英语基础弱，学不了编程。\n","同样严格沿用咱们统一的四步流程：共情→聚焦提问→针对性答疑→赋能拔高（重要性 + 紧迫性），步骤不能跳。\n","第一步：共情，接住情绪\n","家长愿意说出这份担心，不是直接拒绝，是心里有顾虑，希望得到靠谱的解答。","我们先站在家长这边，不要直接反驳 “学编程不用英语好”。\n","标准话术：我特别理解您的顾虑，担心孩子英语基础薄弱，跟不上编程课、看不懂代码指令。\n","第二步：聚焦问题、缩小问题（核心动作：问）\n","共情完不要直接开始解释，主动提问，把模糊的担心锁定到具体卡点，搞清楚家长真正怕什么。\n","标准提问话术：您是不是担心孩子英语不好，看不懂代码指令、记不住里面的英文单词，怕词汇量不够跟不上？\n","第三步：针对具体问题答疑，给方案、打消顾虑\n","根据家长的回答对应解释：\n","咱们编程学习，并不要求孩子去背大量英语单词。","图形化阶段还涉及不到英文代码。","您不用担心的。\n","就算学到 Python 阶段，用到的关键字也就固定那几个，数量很少，上课老师会逐行带着孩子实操、反复练习，熟练之后自然就记住了，编程学习和校内英语成绩并不直接挂钩，反而还能顺便积累这部分专用英文词汇。","课前老师也会提前带着孩子过一遍本节课要用到的单词。","如果孩子看不懂英文命令也不用担心，实操课界面自带提示，上课老师会一步步拆解、讲解每一条语句的含义和用法，孩子跟着引导动手操作，就可以完成任务。\n","第四步：结合年龄赋能，回归重要性、紧迫性\n","顾虑解开之后，我们再拔高价值，讲清楚当下学习的意义。\n","标准话术：\n","编程核心锻炼的是逻辑思维，培养孩子的学习习惯，在学习过程中，还能反过来带动孩子对信息科技、英文词汇的兴趣。\n","现在新课标越来越看重信息素养，当下正是孩子思维发展的黄金期，咱们可以先把学习意识、良好的思维习惯建立起来，不用被英语基础这个门槛困住。\n","话术参考：\n","我特别理解您的顾虑，担心孩子英语基础薄弱，跟不上编程课、看不懂代码指令。","（共情）\n","您是不是担心孩子英语不好，看不懂代码指令、记不住里面的英文单词，怕词汇量不够跟不上？","（聚焦提问）\n","其实学编程不需要背大量英文单词，图形化阶段没有英文代码，就算学到 Python 阶段，用到的关键字就固定几个，老师上课会逐行带练、反复巩固，和校内英语成绩不直接挂钩，还能顺带积累专用词汇；","课前也会提前带孩子预习单词。","看不懂命令也不用担心，实操界面有提示，老师会一步步讲解语句意思，孩子跟着操作就能完成。","（针对性答疑）\n","而且咱们零基础就能入门，编程重点锻炼逻辑思维、培养学习习惯，还能带动孩子对信息科技和英语的兴趣。","新课标越来越重视信息素养，正好趁着思维黄金期，帮孩子把学习意识和习惯先建立起来。","（赋能、讲重要性 + 紧迫性）。","来看一道题，图形化阶段需要孩子先背大量英文单词吗？"],"durs":[7.44,10.464,3.192,7.272,5.184,8.736,4.992,9.432,10.056,5.064,2.832,5.04,3.648,1.872,20.976,5.64,14.616,5.184,5.568,1.872,11.328,13.416,1.872,7.488,1.872,8.448,1.872,19.584,3.528,8.928,1.872,10.344,8.568,3.384,5.352]},"P15":{"sents":["接下来我们学习第三个高频异议：家长说没时间、排不开。\n","依旧严格使用统一四步流程：共情→聚焦提问→针对性答疑→赋能拔高（重要性），顺序不能跳。\n","第一步：共情，接住情绪\n","现在孩子课外安排多，家长陪学也耗精力，家长提出时间紧张，是非常现实的顾虑。","我们先共情，不要直接跟家长说 “挤一挤就有时间”。\n","标准话术：我特别理解，现在孩子课业、兴趣班多，不管是孩子还是咱们家长，平时都挺忙的。\n","第二步：聚焦问题、缩小问题（核心动作：问）\n","共情之后先不着急给方案，主动提问，分清到底卡点在家长，还是孩子本身。\n","标准提问话术：想问下，是您没时间陪孩子上课，还是孩子课外班排得太满，抽不出时间呀？\n","第三步：针对具体问题答疑，分两种情况解决\n","如果是档期冲突、怕固定时间不方便：\n","咱们上课时间很灵活，遇到特殊情况没法上课，可以直接跟课程老师预约补课。","单次两课时合计 70–90 分钟，整体安排轻量化，不会给孩子造成很重的负担。\n","如果是担心孩子学得慢、耗时间：\n","很多孩子学东西慢，并不是能力不够，而是缺少好的学习思路和方法。","编程核心练的就是逻辑思维，思维提上来之后，孩子掌握学习方法，之后学其他科目、新知识都会更快。\n","第四步：结合编程赋能，回归重要性\n","把格局拉高，讲清楚编程不是额外增加负担，而是帮孩子提升效率的工具。\n","标准话术：\n","现在越来越多家长重视信息素养、逻辑思维的培养，编程锻炼的思维和学习方法，是可以迁移到校内各科的。","学好之后，孩子学习效率更高，反而能帮孩子省下不少时间，越学越轻松。\n","话术参考：\n","我特别理解，现在孩子课业、兴趣班多，不管是孩子还是咱们家长，平时都挺忙的。","（共情）\n","想问下，是您没时间陪孩子上课，还是孩子课外班排得太满，抽不出时间呀？","（聚焦提问）\n","如果是时间不好协调，咱们上课时间灵活，有事可以跟导师约补课，一次两课时一共 70–90 分钟，不会有很重的负担；","如果您担心孩子学得慢、耗时间，其实很多孩子学得慢，根源是缺少学习方法。","编程专门锻炼逻辑思维，思维提上来之后，学新知识会更快。","（针对性答疑）\n","现在大环境下，逻辑思维、信息素养都是重点。","编程练出来的思维能力可以用到其他学科，提升孩子整体学习效率，长远来看，是帮孩子省时间，而不是单纯多报一门课。","（赋能、讲重要性）。","来看一道题，家长说「没时间」，共情之后第一句该问什么？"],"durs":[6.12,9,3.192,7.944,4.608,9.192,4.992,7.608,8.952,4.728,3.96,7.368,8.016,3.432,6.456,10.368,4.248,7.296,1.872,9.984,7.272,1.872,7.824,1.872,7.248,1.872,11.016,7.68,6.192,1.872,5.016,11.544,2.328,5.712]},"P16":{"sents":["接下来我们学习视力这个高频异议，这个家长顾虑非常真实，很多家长都会担心线上上课伤眼睛。","咱们这套流程在之前 4 步基础上，增加第 5 步，顺序不能乱：共情→聚焦问题→针对性答疑→编程赋能→时代认知引导\n","第一步：共情，接住情绪\n","家长担心视力是非常合理的，孩子的健康肯定是第一位的，我们千万不要否定家长的担心。\n","标准话术：特别理解您的想法，担心孩子长时间看屏幕影响视力，毕竟孩子的身体健康肯定是放在第一位的。\n","第二步：聚焦问题、缩小问题\n","共情之后，我们帮家长理清核心：近视的根源，并不只是看电子屏幕，更多是用眼习惯。\n","标准话术：其实很多家长都会有这个顾虑，咱们可以先客观说一下，影响视力的根本，主要还是用眼时长、坐姿、休息这些用眼习惯，不是电子产品本身。\n","第三步：具体问题答疑，讲课程护眼设计\n","咱们课程本身也做了对应的护眼安排，给家长落地的安心方案：\n","咱们实操课自带护眼模式，同时课程节奏是科学拆分的，不是一直盯着屏幕；","后期续报之后的项目学习，也会穿插思考、构思环节，不会让孩子全程盯着屏幕操作。","我们上课也会提醒孩子保持距离、定时休息，帮孩子养成良好的用眼习惯。\n","第四步：编程赋能，回归重要性 + 紧迫性\n","打消屏幕焦虑之后，再给家长讲课程价值：\n","现在很多家长都在布局信息素养学习，编程锻炼逻辑思维、解决问题的能力，是新课标重点方向，趁着孩子思维黄金期培养，对孩子长期发展很有帮助。","核桃实操课重在动手思考，收获的是思维能力，不是单纯对着屏幕玩。\n","第五步：时代认知拔高：有效引导，比杜绝更有用\n","收尾升华：\n","现在孩子本身就处在电子信息时代，完全不让孩子接触电子产品是很难做到的。","与其被动让孩子无目的刷短视频、玩游戏，不如我们做正向有效的引导，用编程把电子产品变成学习工具，让孩子有目标、有规划地使用，学会合理把控屏幕时间。\n","话术参考  我特别理解您的想法，担心孩子长时间看屏幕影响视力，毕竟孩子的身体健康肯定是放在第一位的。","（共情）\n","其实很多家长都会有这个顾虑，咱们客观来说，影响视力的根本，主要还是用眼习惯，不单单是电子产品本身。","（聚焦问题）\n","咱们实操课自带护眼模式，课程节奏也是科学设计的，不会让孩子一直盯着屏幕；","后期项目学习阶段，也会预留思考规划的时间，同时上课过程中老师也会提醒孩子注意坐姿、定时休息，帮孩子建立好的用眼习惯。","（答疑）\n","现在大环境下信息素养越来越重要，编程锻炼逻辑思维，也是新课标要求的方向，核桃实操课重点培养孩子思考能力，对孩子长期学习很有帮助。","（赋能）\n","而且现在孩子本来就在电子信息时代，完全隔绝电子产品很难。","与其放任孩子漫无目的地刷视频，不如正向引导，把电子产品变成学习工具，学会合理使用，这比单纯禁止更有意义。","（时代引导）。","来看一道题，视力异议的处理比其他异议多出第⑤步，第⑤步讲什么？"],"durs":[9.72,11.112,3.192,8.376,10.464,3.528,8.544,14.04,4.488,5.976,7.512,8.184,7.296,4.848,4.536,14.352,6.912,5.328,1.872,7.536,15.264,10.368,1.872,10.008,1.872,7.776,12.456,1.872,13.608,1.872,6.192,11.232,1.872,7.176]},"P17":{"sents":["接下来我们学习 “孩子不感兴趣” 这个异议，这个异议很常见，大家记住，兴趣不是凭空来的，我们依旧用固定流程：共情→聚焦提问挖真实原因→分情况答疑→编程赋能拔高\n","第一步：共情，接住情绪\n","家长担心孩子没兴趣、学着学着就放弃，这份顾虑非常实在，我们先认可家长的担心，不要直接反驳。\n","标准话术：我特别理解您的担心，怕孩子没有兴趣，学不进去、坚持不下来。\n","第二步：聚焦问题、缩小问题（核心动作：问）\n","共情之后不要直接讲课程，主动提问，区分背后真实原因，是太难、太简单，还是本身对学习没动力。\n","标准提问话术：想问下，您是觉得孩子之前试了觉得学不会，还是觉得内容太简单没意思，或是孩子本身对学习类内容不容易提起兴趣呀？\n","第三步：分情况针对性答疑\n","如果是孩子对学习本身没兴趣、缺少自信：\n","很多孩子不爱学习，根源是很少拿到成就感。","咱们课程是闯关 + 实操的模式，每完成一个作品、闯过一关，都能看到自己的成果，一点点帮孩子建立成就感和自信心，慢慢愿意主动投入。","主动给孩子安排小灶或电话沟通，给信心和肯定。\n","如果是孩子对编程本身提不起兴趣：\n","咱们可以先问问孩子上课感受，看是觉得难度跟不上，还是觉得内容太简单。","编程本身是需要多练习的，很多孩子年纪小，暂时看不到它的价值。\n","很多时候孩子当下不感兴趣很正常，编程对升学、思维、未来信息素养的帮助，是孩子现阶段理解不到的，这就需要家长多一点教育前瞻性，帮孩子抓住机会。\n","第四步：编程赋能，回归重要性\n","现在信息素养是大趋势，很多家长都在给孩子规划编程学习。","核桃莫顿实操课不只是学代码，核心锻炼逻辑思维。\n","这里大家一定要记住核心总结：我们先沟通摸清孩子不感兴趣的真实原因，再用闯关实操的正向反馈培养兴趣。","兴趣不是天生的，是一次次拿到成就感之后慢慢养出来的学好编程，既能锻炼逻辑，还能带动孩子整体的学习主动性。\n","话术参考：孩子对这个不感兴趣，怕学两天就不想学了。\n","老师：我特别理解您的担心，怕孩子没有兴趣，学不进去、坚持不下来。","（共情）\n","想问下，您是觉得孩子之前试了觉得学不会，还是觉得内容太简单没意思，或是孩子本身对学习类内容不容易提起兴趣呀？","（聚焦提问）\n","如果是孩子平时学习不容易有动力，大多是缺少成就感。","咱们课程闯关 + 实操的形式，孩子每做完一个作品就能看到成果，慢慢建立自信；","如果是孩子对编程本身没感觉，咱们也可以先看上课感受，判断是难度不合适还是别的原因。\n","很多小朋友年纪小，暂时感受不到编程的价值，这特别正常，编程带来的思维提升、信息素养积累，是需要家长带着前瞻性眼光去规划的。","（针对性答疑）\n","现在大环境下信息素养越来越重要，核桃莫顿实操课重点锻炼逻辑。","兴趣不是天生就有的，是在一次次正向反馈里慢慢培养出来的，学好编程，不仅锻炼思维，还能带动孩子整体的学习主动性。","（赋能）。","来看一道题，「不感兴趣」第②步要挖掘的三种可能原因是？"],"durs":[15.552,3.192,9.528,7.176,4.992,10.08,12.72,3.336,4.416,4.776,12.936,4.944,3.744,6.648,6.432,14.808,3.792,6.288,5.328,10.32,10.944,5.472,6.768,1.872,11.208,1.872,5.448,7.728,8.664,12.96,1.872,6.816,11.784,1.872,5.568]},"P18":{"sents":["家里人不支持学编程。","很多家庭报课需要全家达成共识，第一步：共情，接住情绪\n","孩子报课本来就是一家人一起商量的大事，有不同意见很正常，不要给家长施压。\n","标准话术：我特别理解，孩子的学习规划本来就是一家人一起商量决定的，有不同想法特别正常。\n","第二步：聚焦问题、缩小问题\n","共情之后，主动提问，找到家人反对的根源，区分是不了解编程，还是不了解咱们核桃的课程。\n","标准提问话术：想问下，家里人是对编程本身不太了解，还是不清楚咱们核桃这种项目实操课的优势，才不太认可呀\n","第三步：具体问题答疑\n","如果家人是不了解编程、不了解咱们课程：\n","咱们可以跟家长讲清楚核桃编程的课程模式和价值，咱们是项目实操课，不是单纯敲代码，重点锻炼孩子逻辑思维。\n","同时给到方案：方便的话，可以邀请家里另一位家长一起沟通，我把课程内容、培养方向再完整讲一遍；","咱们还有试学期权益，也可以先体验，不用一下子做长期决定，降低决策压力。\n","第四步：编程赋能，回归重要性\n","现在新课标对信息素养越来越重视，很多家庭都在给孩子规划编程学习。","核桃实操课，是以项目带动学习，锻炼孩子拆解问题、动手解决问题的能力，这个能力是可以迁移到校内各科学习里的。\n","第五步：落地收尾，用试学期看见效果\n","咱们可以先利用试学期，让孩子先上课、做出作品，家人亲眼看到孩子的变化、上课成果，比口头解释更有说服力，更容易达成共识。\n","最后可以询问编程平时是谁跟进，跟进人肯定更加了解孩子的学习情况。","家里其他人不了解孩子的兴趣和课程表现自然没有那么肯定。\n","参考话术：我特别理解，孩子的学习规划本来就是一家人一起商量决定的，有不同想法特别正常。","（共情）\n","想问下，家里人是对编程本身不太了解，还是不清楚咱们核桃这种项目制实操课的优势，才不太认可呀？","（聚焦提问）\n","如果是还不了解，我可以跟您说下咱们核桃的课程模式，咱们是项目制实操课，核心锻炼孩子的逻辑思维。","要是方便，也可以邀请家里另一位家长一起来沟通，我完整介绍；","而且咱们有试学期权益，可以先体验，不用一下子做长期决定，压力会小很多。","（针对性答疑）\n","现在大环境里信息素养是重点方向，很多家长都在提前规划，咱们实操课重在项目式学习，锻炼孩子拆解问题、解决问题的能力，对孩子长期学习帮助很大。","（赋能）\n","咱们可以先借着试学期，让孩子先上课、产出作品，等家里人看到孩子上课的状态和学习成果，也更容易理解和认可。","（试学期落地）。","来看一道题，家里人不同意，靠什么让家人亲眼看到效果？"],"durs":[2.568,6.312,7.488,9.144,3.528,9.048,11.232,2.784,4.2,10.488,9.624,7.248,3.792,7.368,10.848,4.344,12.48,6.984,5.592,9.168,1.872,9.912,1.872,9.744,5.952,7.56,1.872,14.544,1.872,10.704,1.872,5.976]},"P19":{"sents":["前面我们讲的是孩子层面的异议，比如年龄、兴趣、视力、时间。","这一板块，进入【产品认知度】，也就是成交三性里的唯一性，核心回答家长一句话：为什么我要选择核桃，而不是别的？\n","家长在这里的疑问，集中在三个：价格、上课模式、和其他机构对比。","我们所有回答，都不要去否定别的机构，而是帮家长看懂价值差别，把核桃实操体系这个核心优势讲透。"],"durs":[6.576,10.656,6.864,9.552]},"P20":{"sents":["接下来我们看价格异议，共情→聚焦问题→解决问题（讲价值回报）→编程赋能（唯一性）→试学期兜底。","核心思路：先接纳家长的经济顾虑，再把家长的关注点从 “多少钱” 转到 “能拿到什么价值”，最后用试学期降低决策压力。\n","第①步：共情\n","老师也特别理解，这几年大环境都不太好，大家挣钱都不容易，也正是这样，咱们更要帮孩子提升综合能力和长期竞争力。\n","第②步：聚焦问题\n","【目标】搞清楚家长觉得贵的根源：是单纯觉得预算超了，还是横向对比过别家\n","话术：您是单纯觉得价格偏高，还是已经和其他机构对比过？\n","第③步：具体问题进行解决\n","【目标】让家长看见产品的价值与回报，拆分价格、讲优惠、讲品牌课程优势\n","话术：咱们可以拆开看总价、课时和配套权益，同时咱们还有优惠券可以用。","核桃是编程行业头部品牌，课程因材施教、学练考一体，业内赛考成绩排名靠前。","很多家长对比之后发现，同等甚至更低的预算，孩子在这里掌握的知识、配套赛事资源，是其他机构很难给到的。\n"," 第④步：编程赋能（唯一性为什么在核桃学）\n","【目标】绑定孩子个人学情，讲清楚专属学习成果\n","话术：结合咱们孩子现在的学情，这套课程是适配他能力阶段的，跟着体系稳步搭建编程逻辑，后续可以衔接 GESP、CTL 赛事，拿到赛考成果，给孩子多一条科技特长发展路径。\n","第⑤步：利用试学期，让家长看到效果\n","话术：咱们还有试学期，不用一次性做长期的报名决定，先让孩子上课体验，您直接观察孩子的课堂状态、产出的作品，亲眼看见学习效果。\n","参考话术：老师也特别理解，这几年大环境都不太好，大家挣钱都不容易，也正是这样，咱们更要帮孩子提升综合能力和长期竞争力。","（共情）\n","您是单纯觉得价格偏高，还是已经和其他机构对比过？","（聚焦）\n","咱们可以拆开看总价、课时和配套权益，同时咱们还有优惠券可以用。","核桃是编程行业头部品牌，课程因材施教、学练考一体，业内赛考成绩排名靠前。","很多家长对比之后发现，同等甚至更低的预算，孩子在这里掌握的知识、配套赛事资源，是其他机构很难给到的。","（解决问题）\n","结合咱们孩子现在的学情，这套课程是适配他能力阶段的，跟着体系稳步搭建编程逻辑，后续可以衔接 GESP、CTL 赛事，拿到赛考成果，给孩子多一条科技特长发展路径。","（唯一性赋能）\n","咱们还有试学期，不用一次性做长期的报名决定，先让孩子上课体验，您直接观察孩子的课堂状态、产出的作品，亲眼看见学习效果。","（试学期落地）。","来看一道题，家长说「太贵了」，第②步要先弄清什么？"],"durs":[9.384,11.28,2.472,11.304,2.76,7.344,5.832,3.648,7.752,7.536,8.4,10.536,5.088,4.992,17.328,4.656,12.912,12.168,1.872,5.016,1.872,6.672,8.4,10.536,1.872,16.656,1.872,12.12,1.872,5.448]},"P21":{"sents":["接下来我们是课程模式异议，一共 4 步：共情→聚焦问题→课程模式赋能（唯一性）→优秀案例展示。","很多家长容易把咱们的莫顿实操课，误以为是动画片、游戏、单纯录播回放，我们这一步核心就是区分清楚：咱们是莫顿+实操课，不是动画游戏课。\n","第①步：共情\n","老师也特别理解，之前很多家长没接触过这种实操课，会担心这种形式学习效果不好。\n","第②步：聚焦问题\n","【目标】明确区分，纠正认知：咱们是莫顿实操课，不是动画、游戏，也不是单纯录播回放\n","话术：很多家长第一眼会以为是动画片、游戏或者录播回放，其实咱们是莫顿实操课，孩子是跟着剧情动手写代码做项目，不是光看动画。\n","第③步：课程模式赋能（唯一性｜为什么在核桃学）\n","话术：咱们这套实操课，用科普剧情抓住孩子注意力，闯关激励机制，持续给到孩子成就感。\n","咱们选用孩子很喜欢的侦探类题材，这类题材本身就很吸引孩子，是寓教于乐，不是单纯玩；","而且剧情里面融入科普知识、真实生活场景，孩子上一节编程课，编程思维、科普常识、生活认知一起收获。\n","第④步：优秀案例展示\n","话术：之前也有不少家长一开始和您想法一样，担心是看动画玩游戏，您可以看下这些学员的作品和家长反馈，孩子都是独立动手完成项目，学完之后逻辑、专注力提升都很明显。\n","话术参考老师也特别理解，之前很多家长没接触过这种实操课，会担心这种形式学习效果不好。","（共情）\n","很多家长第一眼会以为是动画片、游戏或者录播回放，其实咱们是莫顿实操课，孩子是跟着剧情动手写代码做项目，不是光看动画。","（聚焦）\n","咱们这套实操课，用科普剧情抓住孩子注意力，闯关激励机制，持续给到孩子成就感。","咱们选用孩子很喜欢的侦探类题材，这类题材本身就很吸引孩子，是寓教于乐，不是单纯玩；","而且剧情里面融入科普知识、真实生活场景，孩子上一节编程课，编程思维、科普常识、生活认知一起收获。","（课程赋能，唯一性）\n","之前也有不少家长一开始和您想法一样，担心是看动画玩游戏，您可以看下这些学员的作品和家长反馈，孩子都是独立动手完成项目，学完之后逻辑、专注力提升都很明显。","来看一道题，关于咱们的课程，哪种描述是对的？"],"durs":[9.216,13.728,2.472,8.4,2.76,8.736,13.248,5.64,9.216,8.496,11.016,3.336,16.416,8.832,1.872,12.504,1.872,8.376,8.496,11.016,2.4,15.528,4.608]},"P22":{"sents":["接下来是竞品对比异议，一共 5 步：共情→聚焦问题→对比拆解优势（不踩竞品）→编程赋能→展示学习效果与获奖案例。","核心原则：不拉踩同行，只做差异化对比，回归核桃唯一性。\n","第①步：共情\n","老师也特别理解，咱们给孩子报课，肯定要多方对比，挑选一个真正适合孩子的 /* 每个关卡的过程数据：play=实际播放秒数 occ=占用秒数 pn/ps=暂停次数/秒 kn/ks=卡顿次数/秒 */
function stat(k){ st.stat = st.stat || {}; return st.stat[k] = st.stat[k] || {play:0, occ:0, pn:0, ps:0, kn:0, ks:0}; }
function curKey(){ return st.view === 'quiz' ? (st.quiz === 'final' ? 'f' : st.quiz) : st.cur.s; }
function stageStatusText(k){

  if (done) return '已完成';
  if ((st.view === 'learn' || st.view === 'quiz') && String(curKey()) === String(k)) return '进行中';

function snapshot(online){
  const keys = Object.keys(st.stat||{}), sum = f => keys.reduce((a,k) => a + ((st.stat&&st.stat[k]&&st.stat[k][f])||0), 0);

/* 第二个 Webhook：学员第一次出现时，在「学员实时状态」表新建他的那一行 */
const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
// 明细表有 5 万行上限：这些动作量大、分析用不到（暂停时长等已汇总在状态快照里），不再单独记一行
const NO_LOG = new Set(['听完页面','暂停','继续播放','回到测试','学习页面(未听完)']);
function report(ev, online){
  if (!st.name) return;
  if (NO_LOG.has(ev.event) && online !== '已离开') return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid, course:CFG.short||CFG.title, date:nowStr().slice(0,10)}, ev, snapshot(online));
  { const CNm = CFG.short || CFG.title; if (!String(rec.stage||'').startsWith(CNm + '｜')) rec.stage = CNm + (rec.stage ? '｜' + rec.stage : ''); }
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

/* 占用时长：停留在某关卡（听课或做小测）的全部时间，含暂停、切走 */

    const ss=t.sents.map((x,i)=>{const b=a+(t.durs[i]||0);const h='<span class="rs" data-p="'+p.p+'" data-a="'+a+'" data-b="'+b+'">'+esc(x.trim())+' <b>▶</b></span>';a=b;return h;}).join('');

    '<h2 style="margin:8px 0">审核 · '+esc(CFG.title)+'</h2><p class="rule">'+DATA.pages.length+' 页 · '+DATA.qs.length+' 题 · '+(bad?'<b style="color:#dc2626">'+bad+' 处念题不一致</b>':'念题全部一致')+' · 点任意一句讲稿可单独播放（1.5 倍速）</p>'+pages+'<h2>题库（阶段小测 + 综合测试）</h2>'+qs;
  let stop=null,cur=null;au.ontimeupdate=()=>{if(stop!=null&&au.currentTime>=stop){au.pause();stop=null;if(cur)cur.classList.remove('on');}};

// 课程锁：cfg.lock = 口令的哈希。未开放期间只有输入口令的人能进（口令存在本机，输一次即可）
const lockH = s => { let h = 2166136261; for (const c of s + '|' + CFG.key) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); };
let UNL = ''; function locked(){ if (!CFG.lock) return false; let ok = UNL; try { ok = localStorage.getItem('unlock_' + CFG.key) || UNL; } catch(e) {} return ok !== CFG.lock; }

  $('#app').innerHTML = `<section style="max-width:420px;margin:12vh auto;background:#fff;border-radius:16px;padding:28px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06)">

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }

function onPageEnd(){

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
