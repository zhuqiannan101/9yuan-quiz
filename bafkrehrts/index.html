<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>图形化赛考体系【算法】</title>

<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%2740%27%3E%3Ctext x=%27100%27 y=%2725%27 fill=%27%23bbb%27 font-size=%2716%27 text-anchor=%27middle%27 font-family=%27sans-serif%27%3EPPT 加载中…%3C/text%3E%3C/svg%3E") center/200px 40px no-repeat;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}

<script>
const DATA = {"pages":[{"row":2,"stage":"赛考体系·阶段1","p":"P01","topic":"","script":"大家好，这节课咱们来学核桃的赛考体系，也就是图形化阶段孩子会接触到的考级和比赛。开始之前先考考大家，还记不记得之前讲过，咱们在哪个阶段组织孩子报名赛事？","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":3,"stage":"赛考体系·阶段1","p":"P02","topic":"","script":"答案是L7-4/L8-2。今天这节课分五个部分。第一，为什么要懂赛考体系；第二，编程如何助力升学；第三，核桃主流赛事介绍；第四，核桃的赛事优势；第五，核桃赛考的成绩。这五部分听完，家长再问到赛事和升学的问题，大家心里就有底了。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":4,"stage":"赛考体系·阶段1","p":"P03","topic":"","script":"我们首先进入第一部分：赛考体系的重要性。\n这一部分之所以放在开篇讲解，是因为赛考规划是家长关注度非常高的内容。孩子完成第一阶段学习之后，家长通常会自然产生疑问：后续可以参加哪些赛事、学习路径如何延伸，这些赛考对孩子的成长与发展有什么价值。\n如果一线老师和课导自身对赛考体系不够清晰，无法给出有依据的规划说明，家长就很难信任我们提供的长期学习方案。\n本部分我们重点讲解两大核心内容：第一，赛考本身的业务价值与意义；第二，课导老师在赛考服务与规划过程中的核心角色定位。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":5,"stage":"赛考体系·阶段1","p":"P04","topic":"","script":"我们一起来学习赛考的三重业务价值。\n第一重价值，拉齐赛事认知。家长对于赛考的认知通常存在两极分化：一部分家长认为学习编程的核心是锻炼思维，参不参赛、考不考试无关紧要；还有一部分家长期望值过高，认为拿到证书就能直接助力升学。这两种认知都存在偏差。因此我们和家长沟通赛考，首要目标并不是推销赛事，而是统一认知，引导家长理解，赛考是编程学习路径里自然且重要的一环。\n第二重价值，检验学习效果，也就是以考促学。借助赛事和标准化测评，能够直观呈现孩子阶段性的学习收获，同时帮助孩子建立成就感，持续提升学习动力。\n第三重价值，增强家长长期规划的意愿。这里大家记住一句关键结论：赛事报名，等同于一次小型续报。家长愿意为赛事报名，孩子完成参赛并拿到成果，家长亲眼看见学习效果，会更愿意继续报名下一阶段课程以及后续赛事。所以赛事报名不是一锤子买卖，而是我们长期维护家长信任、深耕学员关系的重要入口。来看一道题，“明白参加赛考是编程学习的必经之路”对应赛考的哪一重业务价值？","interact":{"q":"“明白参加赛考是编程学习的必经之路”对应赛考的哪一重业务价值？","at":"P04","options":["检验学习效果","增强长期规划意愿","拉齐赛事认知","规划专家"],"answer":2,"answers":[2],"vote":false,"wrong":"直接继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":6,"stage":"赛考体系·阶段1","p":"P05","topic":"","script":"接下来我们看课导老师在赛考体系中的核心角色定位，页面上提炼了两个关键词。\n第一个关键词，是关键桥梁。真正系统了解升学政策、熟悉正规赛考资源的家长并不多，课导的核心作用之一，就是在家长与升学政策、赛事资源之间搭建桥梁，把准确、专业的信息清晰传递给家长。\n第二个关键词，是规划专家。课导需要结合孩子的成长阶段、当前学习情况和后续目标，精准匹配合适的赛事与学习路径，为家长和孩子提供科学、清晰的规划建议。\n大家记住这句话：懂赛考，加会规划，就是我们后期带班服务的核心竞争力。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":7,"stage":"赛考体系·阶段2","p":"P06","topic":"","script":"接下来我们进入第二部分内容：编程如何助力升学。正式开始之前，我们先来做一个小调研。大家可以想一想，对于编程助力升学这条赛道，你之前的了解程度是什么样的？是完全不了解、隐约知道一些，还是已经掌握得非常清晰？大家按照自己真实的情况选择就可以。","interact":{"q":"关于编程助力升学，你了解多少呢？","at":"P06","options":["完全不了解","隐约知道一点","非常清晰"],"answer":-1,"answers":[],"vote":true,"wrong":"直接继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":8,"stage":"赛考体系·阶段2","p":"P07","topic":"","script":"接班之后，我们接触小升初的家长，经常会听到这句话：“老师，我们学校没有政策，我们是学区房，小升初不需要竞赛证书。”\n那小升初真的是没有政策吗？我们先看表面现象：小升初主流是摇号、划片区入学，没有公开的竞赛选拔政策，很多家长就会直接认为证书没有用处，忽略了背后隐形的选拔机制。\n但真实情况是，优质学校依然会筛选优秀生源，只是选拔的方式更加隐蔽。简历筛选、荣誉证书、点招、考位机会，这些都属于隐形选拔。 所以大家要理清核心逻辑：没有明文公开的选拔政策，不代表没有选拔；没有竞赛直接录取的政策，也不代表证书没有价值。含金量高的科创证书，是孩子综合素质简历里很重要的加分素材。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":9,"stage":"赛考体系·阶段2","p":"P08","topic":"","script":"很多家长都会疑惑，小升初为什么没有公开的竞赛升学政策？核心原因在于，九年义务教育属于普及性教育，政策层面不允许公开选拔、公开拔尖，我们可以拆成三点来理解。\n第一，保障教育公平。为了维护义务教育阶段的公平原则，国家明确禁止把竞赛成绩作为入学录取的依据。 第二，优质学校存在生源筛选需求。优质学校背负着教学与升学的考核目标，本身有筛选优质生源的需求，既然不能公开选拔，就会采用更隐蔽的方式开展筛选。 第三，综合素质简历是核心载体。荣誉证书、赛事经历、综合评价材料，就是这类隐形选拔里重要的参考依据。\n所以最终的结论是：并不是完全没有相关的参考方向，而是政策不允许公开选拔。在这样的规则之下，高质量的赛事证书与完整的成长履历，反而更具备价值。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":10,"stage":"赛考体系·阶段2","p":"P09","topic":"","script":"小升初之后是初升高，这里有一个重要政策，叫科技特长生。什么是科技特长生？它是经过教育厅、教育局发文，有正式定义的、享有特殊招生政策的学生群体，在科技领域有特长或获奖，可以被重点高中以特长生身份录取。怎么成为科技特长生？看三点。适用阶段，主要是在初升高阶段有政策，小升初阶段可以作为简历加分。认定条件，是学业成绩达标，再加上科技领域的特长。注意事项，需要被学校认定的比赛才算，而且各地标准不同，没有统一认证。所以跟家长沟通时，咱们同步的是孩子初步具备资格和可能性，具体能不能认定，还要看当地学校的政策。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":11,"stage":"赛考体系·阶段2","p":"P10","topic":"","script":"来看一个带班中常被问到的问题。家长会说：老师，市一省二国三的含金量太难拿了，我孩子拿不到奖，是不是就认证不了科技特长生？其实不是。大家看这两张截图。左边这所学校的科技招生计划，报名条件写的是品学兼优、学有余力，积极参加科技活动，对科技活动有浓厚兴趣，有一定的科技创新实践基础，并没有硬性要求拿大奖。右边是北理工附属实验学校的信息学拔尖创新人才培养计划，对信息学奥赛获奖的要求就高得多。同样是科技特长生，不同学校的要求差别很大，有的看奖项，有的看能力和参赛经历。所以具体给孩子选什么赛事，要看孩子所在地区的政策和目标学校。但总的一句话，考了肯定比不考好，有证书比没证书好，证书含金量也是越高越好。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":12,"stage":"赛考体系·阶段2","p":"P11","topic":"","script":"说完科技特长生，再往上看一层，白名单赛事。什么是白名单赛事？它是教育部每年公布的、面向6到18岁学生的竞赛活动，有严格的评判标准，含金量高，赛事成绩官方认可。它的价值体现在四个方面：科技特长生认定条件、强基计划入围参考、保送生认定依据，还有小升初简历的核心素材。也就是说，白名单赛事是贯穿孩子升学全程的硬通货。这里请留意年龄范围是6到18岁。来看一道题，白名单赛事是教育部每年公布的、面向多大年龄学生的竞赛活动？","interact":{"q":"白名单赛事是教育部每年公布的、面向多大年龄学生的竞赛活动？","at":"P11","options":["5-18岁","6-15岁","8-18岁","6-18岁"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":13,"stage":"赛考体系·阶段2","p":"P12","topic":"","script":"那白名单赛事和编程有什么关系？看这张图。它依据的是教育部最新公布的2025到2028学年面向中小学生的全国性竞赛活动名单，一共47项竞赛。这页的标题是编程在白名单里面的占比，对应的就是左边饼图里最大的一块，占47%，编程类赛事就在这一块科学素养类里。大家记住，编程类赛事在白名单里的占比就看这个47%；另外艺术体育类占27%，人文综合素养类占26%。右边列得更细，47项竞赛里有17项会用到编程知识，大约占总数的三分之一。也就是说，编程这条赛道能参加的白名单比赛非常多，孩子不管走思维路线还是竞赛路线，都能找到适合自己的舞台。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":14,"stage":"赛考体系·阶段2","p":"P13","topic":"","script":"再往后是高考阶段的强基计划。这块对咱们现在带的学员来说还比较远，大家了解即可。强基计划是我国重大高等教育招生改革试点，覆盖清华北大等39所一流大学。选拔目标是有志于服务国家重大战略需求、综合素质优秀或基础学科拔尖的学生，适合高三考生。录取方式大家记一下：高考成绩占85%，校考或面试占15%，根据总得分排名录取。也就是说，参加强基计划并不是不用高考，高考成绩恰恰占了大头。它的核心优势有三个：有降分录取的机会，覆盖39所双一流大学，在提前批之前录取。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":15,"stage":"赛考体系·阶段2","p":"P14","topic":"","script":"这张金字塔把整条升学路线串了起来。小升初，靠丰富履历，有机会入选名校专班；初升高，靠科技特长生，有机会被重点高中降分录取；高升大，靠强基计划，这是名校敲门砖；再往上到大学和留学阶段，国际赛事能提升国际竞争力。从小学到大学，每个阶段编程都有发挥作用的地方。这张图建议大家保存下来，以后给家长做规划时，先问清家长现在的需求和目标院校，再对照这张图，帮孩子做科学的规划。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":16,"stage":"赛考体系·阶段2","p":"P15","topic":"","script":"最后做个总结编程是唯一贯穿孩子每个阶段的有效赛道。对比舞蹈、音乐、体育这些课外班，它们也很好，但以兴趣培养为主，升学助力有限，没办法辅助学科，职业路径也比较窄。编程不一样，它贯穿小学到高中，能全程助力升学，能辅助语数学科，未来职业也是刚需。所以说，编程是所有课外班中，唯一一个从小学到高中、甚至到未来工作都持续有效的赛道。但给家长做规划时要注意，规划要落地，不要空谈。打个比方，想减肥，肯定是按周、按月做计划，不会说三年以后再开始。规划也一样，张嘴就跟家长讲强基计划、清华北大，对家长来说太远了。咱们的规划要落在思维培养加学习习惯上，再顺道拿证书，检验学习效果。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":17,"stage":"赛考体系·阶段2","p":"P16","topic":"","script":"这一页想告诉大家，编程已经不只是兴趣班了。先看右边，2022年新版课标和2011年旧版对比，旧版里没有信息科技课程标准，只包含在实践活动里；新课标改革后，重视编程教育，新增信息科技课，并且成为了独立学科。再看左边，这是2025年哪些省份把信息科技纳入中考的速览图，颜色深的省份是作为中考考试科目、计入中考总分，颜色浅的是作为中考考核科目、计入学生档案。以后家长再说编程不就是个兴趣班吗，大家可以很有底气地讲清楚：编程是学科，是国家课程体系里的一部分。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":18,"stage":"赛考体系·阶段3","p":"P17","topic":"","script":"第二部分讲完了。知道了编程能助力升学，那具体能参加哪些考试和比赛呢？接下来进入第三部分，核桃主流赛事介绍。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":19,"stage":"赛考体系·阶段3","p":"P18","topic":"","script":"这页把核桃主流赛考分成了四类。第一类是等级考试，属于考试，适合大多数学员参加，作用是阶段性梳理知识，为竞赛打基础，代表有YCL、CTL、GESP，难度在四类里最低。第二类是国家级赛事，属于竞赛，有高含金量证书，能助力评优，帮孩子积累赛事经验，锻炼抗压能力，培养竞技心态，代表有图灵杯、RoboRAVE。第三类是白名单赛事，也属于竞赛，特指教育部规定的面向中小学生的全国性竞赛活动名单里的赛事，比如全国青少年心理成长知识与应用创新大赛、全国青少年人工智能创新挑战赛。第四类是信息学奥赛，也就是NOI这条线，包括CSP-J、CSP-S和NOIP，难度极高，仅适合少数拔尖的学员参加。来看一道题，“核桃编程主流赛考分类”中，哪一类属于“考试”而不是“竞赛”？","interact":{"q":"“核桃编程主流赛考分类”中，哪一类属于“考试”而不是“竞赛”？","at":"P18","options":["国家级赛事","等级考试","白名单赛事","信息学奥赛"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":20,"stage":"赛考体系·阶段3","p":"P19","topic":"","script":"很多家长会问，等级考试和国家级赛事含金量够吗？是不是直接冲信奥赛就行？给大家打个比方。文化课的学习路径是日常学习、期末考试、中考、高考，没有人会说期末考试没用，直接准备高考就行。编程也是一样：日常学习、等级考试、国家级赛事、信奥赛。两条路径一一对应，等级考试相当于期末考试，国家级赛事相当于中考，信奥赛相当于高考。每一步考试都是学习的检验、能力的积累、信心的建立。等级考试和国家级赛事不是终点，而是通往更高目标的必经之路，各有不可替代的价值。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":21,"stage":"赛考体系·阶段3","p":"P20","topic":"","script":"知道了核桃的赛事全貌，接下来聚焦咱们自己，看一看图形化的履约赛事，也就是老师们带班时会直接接触到的考试和比赛。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":22,"stage":"赛考体系·阶段3","p":"P21","topic":"","script":"讲具体赛事之前，先看家长的分类，按目标导向分两类。第一类是竞赛升学导向。核心诉求是通过编程赛事冲击科技特长生升学，需要硬核证书和赛事履历来支撑升学材料申报。这类家庭目标清晰明确，愿意为备赛投入时间和精力，重视赛事结果和奖项等级。他们的关键需求是权威等级证书、高认可度赛事奖项和完整的升学履历。第二类是体验探索导向。暂时没有明确的竞赛升学目标，希望借助赛事检验学习成果、锻炼综合能力，观察孩子的兴趣与天赋。这类家庭态度开放灵活，不把拿奖作为硬性指标，重视过程体验和孩子的真实感受，可进可退。他们的关键需求是低压力参赛、能力客观检验，以及保留双向选择权。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":23,"stage":"赛考体系·阶段3","p":"P22","topic":"","script":"那双向选择怎么落地？先根据本年度孩子的赛事表现做评估，再动态选择两条路径。路径一，正向进阶，转竞赛赛道。触发条件是意愿强烈、抗压能力强、能力突出。这时就顺势调整方向，规划参与白名单等国家级赛事，向竞赛升学路线过渡，前一年的训练基础和参赛经验可以直接复用，快速进入高阶备赛状态。路径二，回归兴趣，适度学习。触发条件是兴趣有限，难以承受竞赛强度。这时就不再推进高强度赛事规划，回归兴趣化编程的学习。孩子依然收获了科创实践经历，又不会陷入无效内卷，不消耗学习热情。尤其是体验探索导向的家长，通过这一年的赛事表现，就能更清楚孩子适合走哪条路。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":24,"stage":"赛考体系·阶段3","p":"P23","topic":"","script":"落到具体的赛考组合，等级考试加国家级赛事，是孩子成长的双引擎。等级考试负责夯实基础，作用有五点：系统检验知识点掌握程度，建立阶段性学习目标和成就感，获得官方认证的能力证书，为高阶赛事打下扎实基础，培养孩子的应试心态和时间管理。国家级赛事负责提升能力，也有五点：真实场景下的实战能力锻炼，与全国优秀选手同台竞技，积累宝贵的赛事经验和履历，开阔视野、激发学习动力，获奖证书为升学加分添彩。两者相辅相成，缺一不可，所以等级考试最好和国家级赛事搭配着一起参加。基础扎实，加上实战丰富，才是真正的编程能力。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":25,"stage":"赛考体系·阶段4","p":"P24","topic":"","script":"接下来逐个看具体赛事。第一个是等级考试CTL，全国青少年计算思维等级测评。为什么选CTL？看含金量。主办单位是共青团中央直属单位中国光华科技基金会，清华大学计算机科学与技术系作为官方指导单位；成绩优秀者可以录入光华科技人才数据库；它是共青团系统证书，可以助力评优评奖。报名费用是300元，参赛形式是线上机考。右边是证书样例，大家可以看一下。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":26,"stage":"赛考体系·阶段4","p":"P25","topic":"","script":"再通过表格把CTL的细节过一遍。主办单位是中国光华科技基金会，指导单位是清华大学计算机科学与技术系。测评语言有图形化、Python和C++三种。年龄范围是6到18岁，线上考试。等级设置上，图形化是一到四级，Python和C++都是一到六级。每个月都可以报名参加，收费300元。考试规则有三条：逐级报考，60分视为通过；题型有单选题、判断题和编程题；考试时长90分钟，不同级别时长有差异，以实际通知为准。右边这张海报是核桃学员的成绩，CTL的C++一级通过率高达94.84%，核桃学员累计获得CTL证书30692人。来看一道题，CTL考级多少分合格通过？","interact":{"q":"CTL考级多少分合格通过？","at":"P25","options":["60","65","70","80"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":27,"stage":"赛考体系·阶段4","p":"P26","topic":"","script":"给家长讲CTL的价值，可以抓住这四点。第一，光华人才库。CTL各等级测评结果获得优秀等级的选手，可以进入团中央认证的光华人才库，入库人才将优先推荐参与团中央系列活动。第二，官方双章认证。通过CTL测评的考生，会获得团中央直属单位中国光华科技基金会、全国青少年计算思维等级测评组织委员会的联合双章认证。第三，考试标准权威。考试标准由主办方联合清华大学计算机科学与技术系共同制定，985高校计算机、人工智能领域的顶尖专家全程参与命题与评审。第四，能力可视化。专业等级测评能快速检验学习效果，精准攻克薄弱项，看清孩子在全省、全国同年龄段的真实编程水平。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":28,"stage":"赛考体系·阶段4","p":"P27","topic":"","script":"那怎么简单地跟家长介绍CTL呢？这页给了一段参考话术，大家可以直接用：某某家长，咱们CTL全称叫全国青少年计算思维等级测评，是由中国光华科技基金会主办、清华大学计算机科学与技术系作为指导单位的，通过后可以获得双章证书，可以为咱们孩子未来编程能力发展提供平台。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":29,"stage":"赛考体系·阶段4","p":"P28","topic":"","script":"第二个等级考试是YCL，青少年人工智能编程水平测试。为什么选YCL？先看含金量。第一，双章认证，由工业和信息化部教育与考试中心和中国电子教育学会联合主办。第二，考试体系和试题研发，由中国科学院计算机技术研究所负责。第三，它是行业内唯一由中央部委直属单位主办的等级考试。报名费用是300元，参赛形式是线上机考。右边是证书样例，大家可以看一下。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":30,"stage":"赛考体系·阶段4","p":"P29","topic":"","script":"同样用表格把YCL过一遍。主办单位是工业和信息化部教育与考试中心和中国电子教育学会。测评语言是图形化、Python和C++，线上考试。等级设置上，图形化是一到三级，Python和C++是四到八级。每个月都可以报名参加，收费300元。考试规则：一级和四级必考，60分视为通过；题型有单选题、判断题和编程题；考试时长90分钟，不同级别会有差异，以实际通知为准。右边海报上，2025年YCL一级通过率是96%。大家注意，CTL和YCL的题型里都有编程题，不是只有选择和判断。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":31,"stage":"赛考体系·阶段4","p":"P30","topic":"","script":"这五点是YCL的含金量，给家长讲规划时一定会用到，大家要熟悉。第一，双章证书含金量高，YCL由工业和信息化部教育与考试中心、中国电子教育学会联合盖章。第二，检验孩子编程水平，看清孩子在全省、全国同年龄段的编程水平。第三，积攒大赛比赛经验，为后续参加白名单赛事积累经验，锻炼竞技心态。第四，履历闪光、评奖评优，高含金量证书为孩子的评优简历添色。第五，为升学之路打基础，通过考级为走科技特长生升学之路打好基础。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":32,"stage":"赛考体系·阶段4","p":"P31","topic":"","script":"跟家长介绍YCL，参考话术是这样的：某某家长，YCL是工信部教育与考试中心和中国电子教育学会联合盖章的，证书能在国家人才数据库查到，这是中央部委直属单位主办的正规等级考试，就类似于大学英语的四六级，不一定是什么加分神器，但绝对是编程学习能力的权威证明。四六级这个类比很好用，既讲清了权威性，也没有夸大升学作用。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":33,"stage":"赛考体系·阶段4","p":"P32","topic":"","script":"等级考试讲完，来看国家级赛事。第一个是图灵杯全国青少年编程及人工智能挑战活动。为什么选图灵杯？含金量有三点。第一，国家级权威赛事，由共青团中央直属单位主办，清华大学提供技术支持，985高校专家参与命题和评审。第二，升学助力显著，国赛一等奖获奖学员，可参加985高校人工智能学院教授的科研项目，为升学添彩。第三，全国同台竞技，总评在全国多座城市、多所高校同步开启，能开阔视野、增长见识。赛事面向全国6到18岁青少年，命题坚持真实情境、真实问题，重点检验孩子灵活运用编程解决实际问题的能力。报名费用是300元，参赛形式是线上机考。来看一道题，图灵杯国赛哪个奖项的获奖学员，可参加985高校人工智能学院教授的科研项目？","interact":{"q":"图灵杯国赛哪个奖项的获奖学员，可参加985高校人工智能学院教授的科研项目？","at":"P32","options":["优秀奖","三等奖","二等奖","一等奖"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":34,"stage":"赛考体系·阶段4","p":"P33","topic":"","script":"再通过表格把图灵杯的细节过一遍，其中奖项设置这一栏要重点记。主办方和CTL一样，是中国光华科技基金会，指导单位是清华大学计算机科学与技术系。考试时间是每年两场，上半年3到7月初赛、8月决赛，下半年9月到1月初赛、2月决赛，具体以组委会每年同步的赛制为准。考试地点是线上，图形化、Python、C++都可以参赛，费用300元。重点来看奖项设置。初赛设一等奖、二等奖、三等奖和优秀奖，比例分别是10%、25%、35%、30%。大家把这四个数加一加，正好是100%。这说明什么？参加初赛的孩子，都会落在这四个奖项里，最起码也能拿到优秀奖。初赛前10%的选手可以进入决赛，正好对应一等奖的比例。决赛设一、二、三等奖，比例是10%、40%、50%，加起来同样是100%，进了决赛的孩子也都会获奖。而且初赛、决赛的获奖选手都能拿到电子版证书。所以家长问，参加图灵杯的孩子都能拿到奖吗？按这张表的奖项设置，答案是能。但要分清两件事，人人有奖，不等于人人拿一等奖。拿哪个等级的奖、能不能进决赛，要看孩子的真实表现。跟家长沟通时，可以说参加了就有获奖证书，帮孩子建立信心，但不要承诺一定拿到某个等级的奖项。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":35,"stage":"赛考体系·阶段4","p":"P34","topic":"","script":"这四点是图灵杯的含金量，给家长讲规划时一定会用到。第一，共青团中央直属单位中国光华科技基金会主办，它是共青团中央主管下的全国性公募基金会，行政级别是正厅级。第二，清华大学计算机科学与技术系牵头赛事命题和评审，代表着青少年科创竞赛的高水准。第三，国赛一等奖获奖学员，可参加985高校人工智能学院教授的科研项目，接触更多前沿技术，帮孩子开阔眼界、提早科研立志。第四，全国选拔阶段一等奖获奖选手，将直接进入光华科技人才数据库，这是鉴定孩子编程能力与人工智能水平的重要依据，长远助力孩子的职业发展。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":36,"stage":"赛考体系·阶段4","p":"P35","topic":"","script":"跟家长介绍图灵杯，参考话术是：某某家长，咱们图灵杯是由共青团中央直属基金会主办、清华技术指导的国家级编程赛事，主要涵盖了算法编程、AI创作、硬件开发等前沿领域，咱们孩子获奖的话有机会进入国家级人才数据库，一等奖更是可以参与985名校科研项目，是培养未来科技人才的黄金奖项。大家留意，话术里说的是有机会，不是一定。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":37,"stage":"赛考体系·阶段4","p":"P36","topic":"","script":"第二个国家级赛事是RoboRAVE国际教育机器人大会。赛程分三个阶段。第一阶段是开放挑战，相当于省赛，每个月都有一次线上参赛机会。第二阶段是亚洲分会，相当于国赛，每半年一次。第三阶段是国际大会，相当于国际赛，每年2月份左右举办。前两个阶段在线上进行，第三阶段国际大会是在线下进行的，所以不能说RoboRAVE都是线上比赛。参赛语言同样是图形化、Python、C++三种，费用300元。每个阶段的获奖比例，大家也要了解清楚。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":38,"stage":"赛考体系·阶段4","p":"P37","topic":"","script":"这三点是RoboRAVE的含金量。第一，央媒背书。RoboRAVE是业内认可的素质教育标杆，曾获中央电视台、中国科技网等权威媒体多次报道，央视新闻每年都会转播国际大会进行专项宣传。第二，升学履历。参赛能获得全球化科创活动履历，成为进入重点学校的加分项，选手成绩被国内外众多学校、学区认可，不仅丰富个人履历，未来也是申请顶尖学府的有利证明，RoboRAVE也曾是普林斯顿大学机械工程博士的专业启蒙。第三，国际化视野。活动已覆盖40多个国家和地区，每年3万多人参与，累计参与人数超过50万，孩子有机会获得国际证书，与国际优秀选手同台交流。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":39,"stage":"赛考体系·阶段4","p":"P38","topic":"","script":"跟家长介绍RoboRAVE，参考话术是：某某家长，RoboRAVE是拥有20多年历史的国际化科创活动，获得央视新闻等权威媒体认可。它的成绩受国内外学校认可，能为升学履历增添亮点，更曾是普林斯顿大学博士的专业启蒙。活动覆盖40多国，每年3万多人参与，截至目前累计参与人数超过50万，为孩子提供获得国际证书、与全球选手同台交流的机会，在培养科创能力的同时拓展国际化视野。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":40,"stage":"赛考体系·阶段5","p":"P39","topic":"","script":"图形化阶段的履约赛事就讲到这里。接下来看一看，在其他阶段，核桃还会组织学员参加哪些赛事。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":41,"stage":"赛考体系·阶段5","p":"P40","topic":"","script":"第一个是等级考试GESP，全称中国计算机学会编程能力等级认证，主办方是中国计算机学会，也就是CCF。考试语言同样是图形化、Python、C++。每年考四次，分别在3月、6月、9月、12月，具体以当年每期公布的时间为准。这里要注意，GESP都是线下考试。收费是一级300元，之后每升一级增加20元。一共8个级别，图形化是一到四级，但目前暂不推荐孩子在图形化阶段考GESP；Python和C++是一到八级，核桃主要推荐在C++阶段参加。报考规则是逐级报考，可以跨语言报考，成绩在90分以上可以跨一级。比如孩子这次一级考了95分，下次就可以跳过二级，直接报三级。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":42,"stage":"赛考体系·阶段5","p":"P41","topic":"","script":"GESP的参考话术是：某某家长，GESP是中国计算机学会主办的等级考试，它和CSP-J、CSP-S、信奥赛是同一主办单位，有很强的公信力和权威性。考试机会也多，一年可以考四次，参加GESP，就能给晋级CSP-J、CSP-S多几次机会。而且GESP的考纲和难度对标CSP-J、CSP-S，能为孩子后续参加CSP和NOI做准备。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":43,"stage":"赛考体系·阶段5","p":"P42","topic":"","script":"接下来是白名单赛事。这页列了两个。一个是全国青少年人工智能创新挑战赛，主办方是中国少年儿童发展服务中心，它是白名单赛事，权威认可，可用于科技特长生认定、国内升学和海外留学申请，还能提升个人能力，培养项目管理和解决问题的能力，强化团队协作和抗挫折心态。另一个是全国青少年心理成长知识与应用创新大赛，主办方是中国心理卫生协会，它填补了白名单赛事里心理成长方向的空白，备赛和参赛本身就是一次心理健康的自我教育。这里要特别提醒大家：带班过程中，我们一定会给家长规划考试和比赛，但具体规划哪一个，目前还不确定，需要等赛事招报前一个月左右，由专门的老师给大家同步。所以给家长做规划时，不要过度承诺一定能参加某个比赛、一定能拿到某个奖项，这些都是违规的。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":44,"stage":"赛考体系·阶段5","p":"P43","topic":"","script":"再来了解信息学奥赛。全国青少年信息学奥林匹克竞赛，简称信奥赛，是五大学科竞赛之一，其余是数学、物理、化学、生物。它由中国计算机学会主办，是白名单赛事中科技类的最高赛项，C++是唯一参赛编程语言，认可度和含金量极高。CSP是参加信奥赛的预选赛，在CSP-S能力认证中取得优秀成绩的选手，可以获得NOIP参赛资格；再根据NOIP成绩进行省队筛选，进入国内最高水平、最高含金量的编程竞赛，也就是NOI国赛；国赛前五名有望进入国家队，征战IOI国际赛。看上面的赛程图，9月是CSP-J和CSP-S初赛，10月复赛，11月NOIP，3、4月NOIP省队选拔，7月NOI全国决赛，8、9月IOI国际赛。信奥赛系列的CSP、NOIP、NOI都是在线下考场进行的。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":45,"stage":"赛考体系·阶段5","p":"P44","topic":"","script":"这两张图都是孩子学编程后可以参加的白名单赛事。左边是核桃整理的编程类相关白名单赛事汇总，右边是与编程相关的教育部白名单赛事列表，分成会有编程赛项的比赛和会用到编程知识的比赛。大家不用背，眼熟一下名字，家长问起来能对得上就行。左边还有一组数据和前面呼应：47项竞赛里，科学素养类22项、人文综合素养类12项、艺术体育类13项，其中17项会用到编程知识。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":46,"stage":"赛考体系·阶段5","p":"P45","topic":"","script":"这一页是信奥赛系列赛事的具体规则，考试时长、报名费用、赛制规则、学到哪适合报，大家都要熟悉，测试里也会考到。CSP-J普及组和CSP-S提高组，第一轮2小时，第二轮3.5小时或4小时；报名费第一轮100元，第二轮310元或560元；参赛学员需年满12周岁，第一轮晋级才能参加第二轮；CSP-J建议C++学习一年以上，CSP-S建议两年以上。NOIP考试4.5小时，免费，要求CSP-S第二轮达到所在省份分数线，并且仅限高中生，建议C++学习三年以上。省选考两天，每天4.5小时，免费，由各省组织选拔，建议学习三年以上。NOI考两天，每天5小时，免费，由各省省队成员参加，建议学习四年以上。这些比赛全部是线下考试。下面三条是赛事成绩的作用：NOI金牌可直接获得保送清华北大等一流名校的资格；NOI银牌可入围强基计划，一本或降20到50分进985，有助于提前锁定985、211名校；NOI铜牌在中科大少创班可额外加20分。特别注意，跟家长描述时不能用确定性的表述。这里说的是可以，代表有机会，不是一定会被保送。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":47,"stage":"赛考体系·阶段5","p":"P46","topic":"","script":"这张图是科技特长生实验班的对应赛考关系，也是大家以后带班会接触到的具体赛事规划。上面是编程阶段，从预备启航期的Scratch，到基础储备期、基础特长期的Python，再到信奥基础期、信奥超越期、信奥集训队的C++。下面是每个阶段对标的考级和赛事，比如预备启航期对应CTL一到三级和白名单等国家级赛事，到了C++阶段，会逐步对应GESP、CSP-J、CSP-S、NOIP，直到NOI。再看右边，这是重点：整个图形化课程目前设计上共有两个阶段，也就是一年。科特线每个阶段都对应一场考级加一场赛事；思维线一阶段仅有一次考级，二阶段对应一场考级加一场赛事。所以科特线和思维线对应的赛考安排是不一样的。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":48,"stage":"赛考体系·阶段5","p":"P47","topic":"","script":"学到这里，咱们要给家长一个清晰的画面。第一，不是最后一个赛事才是最好的，每个赛事都得经历。高含金量的赛事周期长，需要让孩子一步一步来。第二，核桃的课程和赛事是匹配的，每个阶段都有对应的赛事规划。家长跟着课程节奏走，考级和比赛自然就衔接上了。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":49,"stage":"赛考体系·阶段6","p":"P48","topic":"","script":"好，赛事体系和赛事价值都学完了。接下来进入第四部分，看看核桃在赛事方面到底有哪些优势。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":50,"stage":"赛考体系·阶段6","p":"P49","topic":"","script":"前面讲的过程中，大家已经看到了一些核桃学员的赛事成绩。这些成绩是怎么来的？靠的是三大核心优势，为孩子的赛事之路保驾护航，就是PPT上这个公式：好课程加好老师加好服务，等于核桃学员赛事好成绩。来看一道题，核桃为赛事之路保驾护航的三大核心优势不包括哪一项？","interact":{"q":"核桃为赛事之路保驾护航的三大核心优势不包括哪一项？","at":"P49","options":["好课程","好平台","好老师","好服务"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":51,"stage":"赛考体系·阶段6","p":"P50","topic":"","script":"先说好课程，金牌选手研发，日常学习即训练。我们的研发团队有这几个特点：信奥赛金牌选手亲自参与课程研发，他们最懂赛事考什么、怎么考；还有深耕编程教育多年的资深教研团队。课程内容紧贴等级考试和赛事考点，会根据赛事动态实时更新，打造了从零基础到信奥赛的完整学习路径。右边就是我们的信奥金牌主讲团队和清北名校教研团队。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":52,"stage":"赛考体系·阶段6","p":"P51","topic":"","script":"在课程模式上，我们采用学练结合。日常课程融入赛事真题训练，每节课都有对应的算法练习，还有阶段性模拟考试检验学习效果，错题本系统针对性查漏补缺。左边这张课表里也能看到，课程中专门安排了综合复习、赛考强化和赛考专题直播。孩子不用额外花时间突击，学习即备考，效率更高。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":53,"stage":"赛考体系·阶段6","p":"P52","topic":"","script":"再说好服务，专业课导，全程陪伴。备考服务分三段。第一段是实操覆盖，包括实操练习、精准提炼考点、归纳总结和技巧传递，高效提升备考效率，不再需要额外报名任何提升营。第二段是赛前冲刺，有模拟真题训练、押题冲刺和直播冲刺总复习。第三段是赛事辅导，包括各时间节点提醒、报名流程全程指导、一对一赛事规划，以及专业赛考教师指导。另外，我们还有自己的在线评测平台核桃OJ，一年办了158场线上赛事，孩子平时就能参加实战训练，练的就是临场感。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":54,"stage":"赛考体系·阶段6","p":"P53","topic":"","script":"这七步把备考全流程串了起来。第一步赛事规划，一对一规划，匹配孩子的学习进度和目标。第二步报名指导，报名流程全程指导，各时间节点主动提醒。第三步考点梳理，精准提炼考点，归纳总结、技巧传递。第四步实操练习，实操覆盖、模拟考试、错题本查漏补缺。第五步赛前辅导，专业赛考教师指导，提升备考效率。第六步心态调整，赛前心态疏导，帮孩子从容应考。第七步参赛陪伴，从报名到参赛，课导老师全程一对一跟课带赛，家长只需配合。这里提醒一句，报名指导是带着家长把流程走清楚，缴费由家长自己操作，课导不代家长缴费。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":55,"stage":"赛考体系·阶段6","p":"P54","topic":"","script":"最后说好老师，专业课导，全程陪伴。我们的课导老师懂编程，更懂孩子。严格筛选，每位课导老师都经过层层选拔和专业培训。专业背景，熟悉图形化编程和赛事体系，能做专业的赛考辅导。全程陪伴，从报名、备考到参赛，一对一跟进指导。及时反馈，每周学习反馈，问题及时解答，进度实时掌握。心理疏导，赛前心态调整，帮孩子从容应考。左边这张图也能看到，在知名编程教育机构的NOI考核通过教师数量中，核桃遥遥领先。这些也是咱们以后要对家长做到的。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":56,"stage":"赛考体系·阶段6","p":"P55","topic":"","script":"第四部分讲完了。最后一部分，来看看核桃赛考的成绩，这些成绩也印证了咱们赛事体系的设置是科学合理的。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":57,"stage":"赛考体系·阶段6","p":"P56","topic":"","script":"先看等级考试、国家级赛事和白名单赛事。第一张，2025年教育部白名单赛事，核桃编程助力104050名学员拿下科技特长生入场券，获奖人数位居青少年编程行业第一，是编程机构第二、第三名的总和。第二张是图灵杯省赛喜报，核桃获奖总人数4277名，其中一等奖469人，二等奖1099人，三等奖1519人，优秀奖1190人，469位选手成功晋级国赛。大家对照一下前面的奖项设置，四个奖项人数加起来正好是4277，一等奖约占一成，一等奖人数也正好等于晋级国赛的人数，和前10%进决赛的规则对得上。第三张，CTL的C++一级通过率高达94.84%。第四张，YCL一级通过率高达96%。所以说，核桃学员CTL和YCL的通过率都在90%以上。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":58,"stage":"赛考体系·阶段6","p":"P57","topic":"","script":"再来看2026年信奥赛NOI的成绩。核桃学员拿下了29枚金牌、109枚银牌、66枚铜牌。全国金牌一共50枚，核桃占了29枚，金牌占比过半，央广网等多家央媒的报道。来看一道题，2026年NOI核桃学员拿到了多少枚金牌？","interact":{"q":"2026年NOI核桃学员拿到了多少枚金牌？","at":"P57","options":["17","50","29","66"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":59,"stage":"赛考体系·阶段6","p":"P58","topic":"","script":"最后给大家介绍一个好用的工具，销冠助手，10秒就能搜到想要的赛考物料。在飞书上搜索销冠助手，直接在对话框里输入相关的赛考问题就行，比如什么是科技特长生、白名单赛事成绩如何，或者查询某个地区的升学政策，它就能把对应的物料整理出来。家长问到当地政策时，大家可以先用它查一查。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":60,"stage":"赛考体系·阶段6","p":"P59","topic":"","script":"好，这节课就到这里。请大家扫码填写一下核桃赛事体系调研问卷，写下你的真实感受。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"}],"qs":[{"id":"T-S01","type":"阶段练习题·多选","chapter":"赛考体系·阶段1","q":"（多选，选3项）P04中，赛考的三重业务价值包括哪些？","options":[{"k":"A","t":"拉齐赛事认知"},{"k":"B","t":"精准匹配赛事机会"},{"k":"C","t":"检验学习效果"},{"k":"D","t":"增强长期规划意愿"}],"answer":"ACD","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S02","type":"阶段练习题·判断","chapter":"赛考体系·阶段1","q":"P04中，“招报=小续报”是对赛考哪一重业务价值的说明？","options":[{"k":"A","t":"拉齐赛事认知"},{"k":"B","t":"增强长期规划意愿"},{"k":"C","t":"检验学习效果"},{"k":"D","t":"关键桥梁"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-S03","type":"阶段练习题·多选","chapter":"赛考体系·阶段1","q":"（多选，选2项）P05中，“老师后期带班的核心竞争力”由哪两项组成？","options":[{"k":"A","t":"懂政策"}, 本或降20-50分进985"},{"k":"C","t":"NOI金牌中科大少创班外加20分"},{"k":"D","t":"NOI银牌可直接获得保送清北大资格"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F06","type":"本章综合测试题·单选","chapter":"赛考体系·全章","q":"某家庭目标清晰，愿意为备赛投入时间和精力，重视赛事结果和奖项等级。按PPT，该家庭属于哪一类？","options":[{"k":"A","t":"体验探索导向"},{"k":"B","t":"回归兴趣路径"},{"k":"C","t":"低压力参赛型"},{"k":"D","t":"竞赛升学导向"}],"answer":"D","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F07","type":"本章综合测试题·单选","chapter":"赛考体系·全章","q":"孩子本年度赛事表现评估显示：兴趣有限、难以承受竞赛强度。按PPT应建议走哪条路径？","options":[{"k":"A","t":"回归兴趣，适度学习"},{"k":"B","t":"正向进阶，转竞赛赛道"},{"k":"C","t":"规划参加国家级或白名单赛事，向竞赛升学路线过渡"},{"k":"D","t":"直接进入高阶备赛状态"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F08","type":"本章综合测试题·多选","chapter":"赛考体系·全章","q":"（多选，选2项）在“核桃编程主流赛考分类”中，属于“等级考试”的有？","options":[{"k":"A","t":"图灵杯"},{"k":"B","t":"CTL"},{"k":"C","t":"RoboRAVE"},{"k":"D","t":"GESP"}],"answer":"BD","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F09","type":"本章综合测试题·单选","chapter":"赛考体系·全章","q":"下列赛考与主办单位的对应，正确的是？","options":[{"k":"A","t":"YCL—中国光华科技基金会"},{"k":"B","t":"图灵杯—中国电子教育学会"},{"k":"C","t":"GESP—中国计算机学会（CCF）"},{"k":"D","t":"CTL—工业和信息化部教育与考试中心"}],"answer":"C","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F10","type":"本章综合测试题·单选","chapter":"赛考体系·全章","q":"孩子 NOI 拿了银牌，家长问「是不是稳进清北了？」按本课表述规范你应该怎么说？","options":[{"k":"A","t":"承诺肯定能保送清北"},{"k":"B","t":"说明NOI金牌才有保送资格、银牌可入围强基计划；表述留有余地，不做确定性承诺"},{"k":"C","t":"让家长别问这么多"},{"k":"D","t":"承诺能降200分录取"}],"answer":"B","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"}],"timing":{"P01":{"sents":["大家好，这节课咱们来学核桃的赛考体系，也就是图形化阶段孩子会接触到的考级和比赛。","开始之前先考考大家，还记不记得之前讲过，咱们在哪个阶段组织孩子报名赛事？"],"durs":[8.592,7.536]},"P02":{"sents":["答案是L7-4/L8-2。","今天这节课分五个部分。","第一，为什么要懂赛考体系；","第二，编程如何助力升学；","第三，核桃主流赛事介绍；","第四，核桃的赛事优势；","第五，核桃赛考的成绩。","这五部分听完，家长再问到赛事和升学的问题，大家心里就有底了。"],"durs":[3.384,2.568,3.096,3,3.12,2.904,2.808,6.288]},"P03":{"sents":["我们首先进入第一部分：赛考体系的重要性。\n","这一部分之所以放在开篇讲解，是因为赛考规划是家长关注度非常高的内容。","孩子完成第一阶段学习之后，家长通常会自然产生疑问：后续可以参加哪些赛事、学习路径如何延伸，这些赛考对孩子的成长与发展有什么价值。\n","如果一线老师和课导自身对赛考体系不够清晰，无法给出有依据的规划说明，家长就很难信任我们提供的长期学习方案。\n","本部分我们重点讲解两大核心内容：第一，赛考本身的业务价值与意义；","第二，课导老师在赛考服务与规划过程中的核心角色定位。"],"durs":[4.296,7.44,13.848,11.016,7.176,5.952]},"P05":{"sents":["接下来我们看课导老师在赛考体系中的核心角色定位，页面上提炼了两个关键词。\n","第一个关键词，是关键桥梁。","真正系统了解升学政策、熟悉正规赛考资源的家长并不多，课导的核心作用之一，就是在家长与升学政策、赛事资源之间搭建桥梁，把准确、专业的信息清晰传递给家长。\n","第二个关键词，是规划专家。","课导需要结合孩子的成长阶段、当前学习情况和后续目标，精准匹配合适的赛事与学习路径，为家长和孩子提供科学、清晰的规划建议。\n","大家记住这句话：懂赛考，加会规划，就是我们后期带班服务的核心竞争力。"],"durs":[7.944,3.096,16.2,3.048,13.104,7.248]},"P06":{"sents":["接下来我们进入第二部分内容：编程如何助力升学。","正式开始之前，我们先来做一个小调研。","大家可以想一想，对于编程助力升学这条赛道，你之前的了解程度是什么样的？","是完全不了解、隐约知道一些，还是已经掌握得非常清晰？","大家按照自己真实的情况选择就可以。"],"durs":[4.968,4.152,6.864,5.448,3.816]},"P07":{"sents":["接班之后，我们接触小升初的家长，经常会听到这句话：“老师，我们学校没有政策，我们是学区房，小升初不需要竞赛证书。”\n","那小升初真的是没有政策吗？","我们先看表面现象：小升初主流是摇号、划片区入学，没有公开的竞赛选拔政策，很多家长就会直接认为证书没有用处，忽略了背后隐形的选拔机制。\n","但真实情况是，优质学校依然会筛选优秀生源，只是选拔的方式更加隐蔽。","简历筛选、荣誉证书、点招、考位机会，这些都属于隐形选拔。"," 所以大家要理清核心逻辑：没有明文公开的选拔政策，不代表没有选拔；","没有竞赛直接录取的政策，也不代表证书没有价值。","含金量高的科创证书，是孩子综合素质简历里很重要的加分素材。"],"durs":[11.352,3.072,14.064,7.56,6.72,6.768,5.016,6.528]},"P08":{"sents":["很多家长都会疑惑，小升初为什么没有公开的竞赛升学政策？","核心原因在于，九年义务教育属于普及性教育，政策层面不允许公开选拔、公开拔尖，我们可以拆成三点来理解。\n","第一，保障教育公平。","为了维护义务教育阶段的公平原则，国家明确禁止把竞赛成绩作为入学录取的依据。"," 第二，优质学校存在生源筛选需求。","优质学校背负着教学与升学的考核目标，本身有筛选优质生源的需求，既然不能公开选拔，就会采用更隐蔽的方式开展筛选。"," 第三，综合素质简历是核心载体。","荣誉证书、赛事经历、综合评价材料，就是这类隐形选拔里重要的参考依据。\n","所以最终的结论是：并不是完全没有相关的参考方向，而是政策不允许公开选拔。","在这样的规则之下，高质量的赛事证书与完整的成长履历，反而更具备价值。"],"durs":[5.784,10.68,2.64,7.92,4.08,11.544,3.984,7.752,7.776,7.2]},"P09":{"sents":["小升初之后是初升高，这里有一个重要政策，叫科技特长生。","什么是科技特长生？","它是经过教育厅、教育局发文，有正式定义的、享有特殊招生政策的学生群体，在科技领域有特长或获奖，可以被重点高中以特长生身份录取。","怎么成为科技特长生？","看三点。","适用阶段，主要是在初升高阶段有政策，小升初阶段可以作为简历加分。","认定条件，是学业成绩达标，再加上科技领域的特长。","注意事项，需要被学校认定的比赛才算，而且各地标准不同，没有统一认证。","所以跟家长沟通时，咱们同步的是孩子初步具备资格和可能性，具体能不能认定，还要看当地学校的政策。"],"durs":[5.88,2.28,13.368,2.424,1.872,6.912,5.568,7.08,9.792]},"P10":{"sents":["来看一个带班中常被问到的问题。","家长会说：老师，市一省二国三的含金量太难拿了，我孩子拿不到奖，是不是就认证不了科技特长生？","其实不是。","大家看这两张截图。","左边这所学校的科技招生计划，报名条件写的是品学兼优、学有余力，积极参加科技活动，对科技活动有浓厚兴趣，有一定的科技创新实践基础，并没有硬性要求拿大奖。","右边是北理工附属实验学校的信息学拔尖创新人才培养计划，对信息学奥赛获奖的要求就高得多。","同样是科技特长生，不同学校的要求差别很大，有的看奖项，有的看能力和参赛经历。","所以具体给孩子选什么赛事，要看孩子所在地区的政策和目标学校。","但总的一句话，考了肯定比不考好，有证书比没证书好，证书含金量也是越高越好。"],"durs":[3.264,9.24,1.872,2.352,15.816,9.288,8.376,6.744,8.04]},"P12":{"sents":["那白名单赛事和编程有什么关系？","看这张图。","它依据的是教育部最新公布的2025到2028学年面向中小学生的全国性竞赛活动名单，一共47项竞赛。","这页的标题是编程在白名单里面的占比，对应的就是左边饼图里最大的一块，占47%，编程类赛事就在这一块科学素养类里。","大家记住，编程类赛事在白名单里的占比就看这个47%；","另外艺术体育类占27%，人文综合素养类占26%。","右边列得更细，47项竞赛里有17项会用到编程知识，大约占总数的三分之一。","也就是说，编程这条赛道能参加的白名单比赛非常多，孩子不管走思维路线还是竞赛路线，都能找到适合自己的舞台。"],"durs":[3.288,1.872,11.016,12.456,6.456,6.672,8.352,11.016]},"P13":{"sents":["再往后是高考阶段的强基计划。","这块对咱们现在带的学员来说还比较远，大家了解即可。","强基计划是我国重大高等教育招生改革试点，覆盖清华北大等39所一流大学。","选拔目标是有志于服务国家重大战略需求、综合素质优秀或基础学科拔尖的学生，适合高三考生。","录取方式大家记一下：高考成绩占85%，校考或面试占15%，根据总得分排名录取。","也就是说，参加强基计划并不是不用高考，高考成绩恰恰占了大头。","它的核心优势有三个：有降分录取的机会，覆盖39所双一流大学，在提前批之前录取。"],"durs":[3.408,5.592,8.088,9.672,9.864,6.816,8.712]},"P14":{"sents":["这张金字塔把整条升学路线串了起来。","小升初，靠丰富履历，有机会入选名校专班；","初升高，靠科技特长生，有机会被重点高中降分录取；","高升大，靠强基计划，这是名校敲门砖；","再往上到大学和留学阶段，国际赛事能提升国际竞争力。","从小学到大学，每个阶段编程都有发挥作用的地方。","这张图建议大家保存下来，以后给家长做规划时，先问清家长现在的需求和目标院校，再对照这张图，帮孩子做科学的规划。"],"durs":[3.936,4.728,5.616,4.296,5.928,5.064,11.928]},"P15":{"sents":["最后做个总结编程是唯一贯穿孩子每个阶段的有效赛道。","对比舞蹈、音乐、体育这些课外班，它们也很好，但以兴趣培养为主，升学助力有限，没办法辅助学科，职业路径也比较窄。","编程不一样，它贯穿小学到高中，能全程助力升学，能辅助语数学科，未来职业也是刚需。","所以说，编程是所有课外班中，唯一一个从小学到高中、甚至到未来工作都持续有效的赛道。","但给家长做规划时要注意，规划要落地，不要空谈。","打个比方，想减肥，肯定是按周、按月做计划，不会说三年以后再开始。","规划也一样，张嘴就跟家长讲强基计划、清华北大，对家长来说太远了。","咱们的规划要落在思维培养加学习习惯上，再顺道拿证书，检验学习效果。"],"durs":[5.52,11.64,8.712,8.904,5.424,7.056,7.248,7.44]},"P16":{"sents":["这一页想告诉大家，编程已经不只是兴趣班了。","先看右边，2022年新版课标和2011年旧版对比，旧版里没有信息科技课程标准，只包含在实践活动里；","新课标改革后，重视编程教育，新增信息科技课，并且成为了独立学科。","再看左边，这是2025年哪些省份把信息科技纳入中考的速览图，颜色深的省份是作为中考考试科目、计入中考总分，颜色浅的是作为中考考核科目、计入学生档案。","以后家长再说编程不就是个兴趣班吗，大家可以很有底气地讲清楚：编程是学科，是国家课程体系里的一部分。"],"durs":[4.296,10.56,7.272,15.912,9.936]},"P17":{"sents":["第二部分讲完了。","知道了编程能助力升学，那具体能参加哪些考试和比赛呢？","接下来进入第三部分，核桃主流赛事介绍。"],"durs":[1.896,5.52,4.368]},"P19":{"sents":["很多家长会问，等级考试和国家级赛事含金量够吗？","是不是直接冲信奥赛就行？","给大家打个比方。","文化课的学习路径是日常学习、期末考试、中考、高考，没有人会说期末考试没用，直接准备高考就行。","编程也是一样：日常学习、等级考试、国家级赛事、信奥赛。","两条路径一一对应，等级考试相当于期末考试，国家级赛事相当于中考，信奥赛相当于高考。","每一步考试都是学习的检验、能力的积累、信心的建立。","等级考试和国家级赛事不是终点，而是通往更高目标的必经之路，各有不可替代的价值。"],"durs":[5.208,2.832,2.016,10.32,6.504,9.384,5.496,8.616]},"P20":{"sents":["知道了核桃的赛事全貌，接下来聚焦咱们自己，看一看图形化的履约赛事，也就是老师们带班时会直接接触到的考试和比赛。"],"durs":[11.256]},"P21":{"sents":["讲具体赛事之前，先看家长的分类，按目标导向分两类。","第一类是竞赛升学导向。","核心诉求是通过编程赛事冲击科技特长生升学，需要硬核证书和赛事履历来支撑升学材料申报。","这类家庭目标清晰明确，愿意为备赛投入时间和精力，重视赛事结果和奖项等级。","他们的关键需求是权威等级证书、高认可度赛事奖项和完整的升学履历。","第二类是体验探索导向。","暂时没有明确的竞赛升学目标，希望借助赛事检验学习成果、锻炼综合能力，观察孩子的兴趣与天赋。","这类家庭态度开放灵活，不把拿奖作为硬性指标，重视过程体验和孩子的真实感受，可进可退。","他们的关键需求是低压力参赛、能力客观检验，以及保留双向选择权。"],"durs":[5.712,2.832,9.624,8.04,7.176,2.808,9.768,9.288,6.864]},"P22":{"sents":["那双向选择怎么落地？","先根据本年度孩子的赛事表现做评估，再动态选择两条路径。","路径一，正向进阶，转竞赛赛道。","触发条件是意愿强烈、抗压能力强、能力突出。","这时就顺势调整方向，规划参与白名单等国家级赛事，向竞赛升学路线过渡，前一年的训练基础和参赛经验可以直接复用，快速进入高阶备赛状态。","路径二，回归兴趣，适度学习。","触发条件是兴趣有限，难以承受竞赛强度。","这时就不再推进高强度赛事规划，回归兴趣化编程的学习。","孩子依然收获了科创实践经历，又不会陷入无效内卷，不消耗学习热情。","尤其是体验探索导向的家长，通过这一年的赛事表现，就能更清楚孩子适合走哪条路。"],"durs":[2.448,6.072,3.816,5.064,14.256,3.576,4.632,6.024,6.792,8.112]},"P23":{"sents":["落到具体的赛考组合，等级考试加国家级赛事，是孩子成长的双引擎。","等级考试负责夯实基础，作用有五点：系统检验知识点掌握程度，建立阶段性学习目标和成就感，获得官方认证的能力证书，为高阶赛事打下扎实基础，培养孩子的应试心态和时间管理。","国家级赛事负责提升能力，也有五点：真实场景下的实战能力锻炼，与全国优秀选手同台竞技，积累宝贵的赛事经验和履历，开阔视野、激发学习动力，获奖证书为升学加分添彩。","两者相辅相成，缺一不可，所以等级考试最好和国家级赛事搭配着一起参加。","基础扎实，加上实战丰富，才是真正的编程能力。"],"durs":[6.936,17.904,17.472,7.608,5.04]},"P24":{"sents":["接下来逐个看具体赛事。","第一个是等级考试CTL，全国青少年计算思维等级测评。","为什么选CTL？","看含金量。","主办单位是共青团中央直属单位中国光华科技基金会，清华大学计算机科学与技术系作为官方指导单位；","成绩优秀者可以录入光华科技人才数据库；","它是共青团系统证书，可以助力评优评奖。","报名费用是300元，参赛形式是线上机考。","右边是证书样例，大家可以看一下。"],"durs":[2.688,6,2.064,1.872,10.488,4.584,4.296,4.536,3.48]},"P25":{"sents":["再通过表格把CTL的细节过一遍。","主办单位是中国光华科技基金会，指导单位是清华大学计算机科学与技术系。","测评语言有图形化、Python和C++三种。","年龄范围是6到18岁，线上考试。","等级设置上，图形化是一到四级，Python和C++都是一到六级。","每个月都可以报名参加，收费300元。","考试规则有三条：逐级报考，60分视为通过；","题型有单选题、判断题和编程题；","考试时长90分钟，不同级别时长有差异，以实际通知为准。","右边这张海报是核桃学员的成绩，CTL的C++一级通过率高达94.84%，核桃学员累计获得CTL证书30692人。","来看一道题，CTL考级多少分合格通过？"],"durs":[3.648,7.944,4.824,3.888,6.432,3.912,4.8,4.008,6.312,13.608,4.488]},"P26":{"sents":["给家长讲CTL的价值，可以抓住这四点。","第一，光华人才库。","CTL各等级测评结果获得优秀等级的选手，可以进入团中央认证的光华人才库，入库人才将优先推荐参与团中央系列活动。","第二，官方双章认证。","通过CTL测评的考生，会获得团中央直属单位中国光华科技基金会、全国青少年计算思维等级测评组织委员会的联合双章认证。","第三，考试标准权威。","考试标准由主办方联合清华大学计算机科学与技术系共同制定，985高校计算机、人工智能领域的顶尖专家全程参与命题与评审。","第四，能力可视化。","专业等级测评能快速检验学习效果，精准攻克薄弱项，看清孩子在全省、全国同年龄段的真实编程水平。"],"durs":[4.416,2.544,11.928,2.688,12.6,2.688,12.792,2.472,10.392]},"P27":{"sents":["那怎么简单地跟家长介绍CTL呢？","这页给了一段参考话术，大家可以直接用：某某家长，咱们CTL全称叫全国青少年计算思维等级测评，是由中国光华科技基金会主办、清华大学计算机科学与技术系作为指导单位的，通过后可以获得双章证书，可以为咱们孩子未来编程能力发展提供平台。"],"durs":[3.648,23.928]},"P28":{"sents":["第二个等级考试是YCL，青少年人工智能编程水平测试。","为什么选YCL？","先看含金量。","第一，双章认证，由工业和信息化部教育与考试中心和中国电子教育学会联合主办。","第二，考试体系和试题研发，由中国科学院计算机技术研究所负责。","第三，它是行业内唯一由中央部委直属单位主办的等级考试。","报名费用是300元，参赛形式是线上机考。","右边是证书样例，大家可以看一下。"],"durs":[5.952,2.064,1.872,8.328,6.888,6.072,4.536,3.48]},"P29":{"sents":["同样用表格把YCL过一遍。","主办单位是工业和信息化部教育与考试中心和中国电子教育学会。","测评语言是图形化、Python和C++，线上考试。","等级设置上，图形化是一到三级，Python和C++是四到八级。","每个月都可以报名参加，收费300元。","考试规则：一级和四级必考，60分视为通过；","题型有单选题、判断题和编程题；","考试时长90分钟，不同级别会有差异，以实际通知为准。","右边海报上，2025年YCL一级通过率是96%。","大家注意，CTL和YCL的题型里都有编程题，不是只有选择和判断。"],"durs":[3.168,6.552,5.304,6.432,3.912,4.872,4.008,5.832,6.192,7.08]},"P30":{"sents":["这五点是YCL的含金量，给家长讲规划时一定会用到，大家要熟悉。","第一，双章证书含金量高，YCL由工业和信息化部教育与考试中心、中国电子教育学会联合盖章。","第二，检验孩子编程水平，看清孩子在全省、全国同年龄段的编程水平。","第三，积攒大赛比赛经验，为后续参加白名单赛事积累经验，锻炼竞技心态。","第四，履历闪光、评奖评优，高含金量证书为孩子的评优简历添色。","第五，为升学之路打基础，通过考级为走科技特长生升学之路打好基础。"],"durs":[7.032,9.84,7.344,7.944,7.08,7.488]},"P31":{"sents":["跟家长介绍YCL，参考话术是这样的：某某家长，YCL是工信部教育与考试中心和中国电子教育学会联合盖章的，证书能在国家人才数据库查到，这是中央部委直属单位主办的正规等级考试，就类似于大学英语的四六级，不一定是什么加分神器，但绝对是编程学习能力的权威证明。","四六级这个类比很好用，既讲清了权威性，也没有夸大升学作用。"],"durs":[26.184,6.144]},"P33":{"sents":["再通过表格把图灵杯的细节过一遍，其中奖项设置这一栏要重点记。","主办方和CTL一样，是中国光华科技基金会，指导单位是清华大学计算机科学与技术系。","考试时间是每年两场，上半年3到7月初赛、8月决赛，下半年9月到1月初赛、2月决赛，具体以组委会每年同步的赛制为准。","考试地点是线上，图形化、Python、C++都可以参赛，费用300元。","重点来看奖项设置。","初赛设一等奖、二等奖、三等奖和优秀奖，比例分别是10%、25%、35%、30%。","大家把这四个数加一加，正好是100%。","这说明什么？","参加初赛的孩子，都会落在这四个奖项里，最起码也能拿到优秀奖。","初赛前10%的选手可以进入决赛，正好对应一等奖的比例。","决赛设一、二、三等奖，比例是10%、40%、50%，加起来同样是100%，进了决赛的孩子也都会获奖。","而且初赛、决赛的获奖选手都能拿到电子版证书。","所以家长问，参加图灵杯的孩子都能拿到奖吗？","按这张表的奖项设置，答案是能。","但要分清两件事，人人有奖，不等于人人拿一等奖。","拿哪个等级的奖、能不能进决赛，要看孩子的真实表现。","跟家长沟通时，可以说参加了就有获奖证书，帮孩子建立信心，但不要承诺一定拿到某个等级的奖项。"],"durs":[6.552,9.12,12.312,7.056,2.376,10.8,4.248,1.872,6.48,6.096,12.168,5.4,4.656,3.456,5.016,5.328,9.384]},"P34":{"sents":["这四点是图灵杯的含金量，给家长讲规划时一定会用到。","第一，共青团中央直属单位中国光华科技基金会主办，它是共青团中央主管下的全国性公募基金会，行政级别是正厅级。","第二，清华大学计算机科学与技术系牵头赛事命题和评审，代表着青少年科创竞赛的高水准。","第三，国赛一等奖获奖学员，可参加985高校人工智能学院教授的科研项目，接触更多前沿技术，帮孩子开阔眼界、提早科研立志。","第四，全国选拔阶段一等奖获奖选手，将直接进入光华科技人才数据库，这是鉴定孩子编程能力与人工智能水平的重要依据，长远助力孩子的职业发展。"],"durs":[5.88,11.904,9.312,12.96,14.28]},"P35":{"sents":["跟家长介绍图灵杯，参考话术是：某某家长，咱们图灵杯是由共青团中央直属基金会主办、清华技术指导的国家级编程赛事，主要涵盖了算法编程、AI创作、硬件开发等前沿领域，咱们孩子获奖的话有机会进入国家级人才数据库，一等奖更是可以参与985名校科研项目，是培养未来科技人才的黄金奖项。","大家留意，话术里说的是有机会，不是一定。"],"durs":[28.8,4.704]},"P36":{"sents":["第二个国家级赛事是RoboRAVE国际教育机器人大会。","赛程分三个阶段。","第一阶段是开放挑战，相当于省赛，每个月都有一次线上参赛机会。","第二阶段是亚洲分会，相当于国赛，每半年一次。","第三阶段是国际大会，相当于国际赛，每年2月份左右举办。","前两个阶段在线上进行，第三阶段国际大会是在线下进行的，所以不能说RoboRAVE都是线上比赛。","参赛语言同样是图形化、Python、C++三种，费用300元。","每个阶段的获奖比例，大家也要了解清楚。"],"durs":[5.472,2.184,6.528,4.896,5.856,9.696,6.384,4.104]},"P37":{"sents":["这三点是RoboRAVE的含金量。","第一，央媒背书。","RoboRAVE是业内认可的素质教育标杆，曾获中央电视台、中国科技网等权威媒体多次报道，央视新闻每年都会转播国际大会进行专项宣传。","第二，升学履历。","参赛能获得全球化科创活动履历，成为进入重点学校的加分项，选手成绩被国内外众多学校、学区认可，不仅丰富个人履历，未来也是申请顶尖学府的有利证明，RoboRAVE也曾是普林斯顿大学机械工程博士的专业启蒙。","第三，国际化视野。","活动已覆盖40多个国家和地区，每年3万多人参与，累计参与人数超过50万，孩子有机会获得国际证书，与国际优秀选手同台交流。"],"durs":[3.576,2.304,13.968,2.304,20.568,2.544,12.888]},"P38":{"sents":["跟家长介绍RoboRAVE，参考话术是：某某家长，RoboRAVE是拥有20多年历史的国际化科创活动，获得央视新闻等权威媒体认可。","它的成绩受国内外学校认可，能为升学履历增添亮点，更曾是普林斯顿大学博士的专业启蒙。","活动覆盖40多国，每年3万多人参与，截至目前累计参与人数超过50万，为孩子提供获得国际证书、与全球选手同台交流的机会，在培养科创能力的同时拓展国际化视野。"],"durs":[13.152,9.216,16.464]},"P39":{"sents":["图形化阶段的履约赛事就讲到这里。","接下来看一看，在其他阶段，核桃还会组织学员参加哪些赛事。"],"durs":[3.768,6.312]},"P40":{"sents":["第一个是等级考试GESP，全称中国计算机学会编程能力等级认证，主办方是中国计算机学会，也就是CCF。","考试语言同样是图形化、Python、C++。","每年考四次，分别在3月、6月、9月、12月，具体以当年每期公布的时间为准。","这里要注意，GESP都是线下考试。","收费是一级300元，之后每升一级增加20元。","一共8个级别，图形化是一到四级，但目前暂不推荐孩子在图形化阶段考GESP；","Python和C++是一到八级，核桃主要推荐在C++阶段参加。","报考规则是逐级报考，可以跨语言报考，成绩在90分以上可以跨一级。","比如孩子这次一级考了95分，下次就可以跳过二级，直接报三级。"],"durs":[11.04,4.632,8.544,4.176,4.992,8.352,6.528,6.816,6.744]},"P41":{"sents":["GESP的参考话术是：某某家长，GESP是中国计算机学会主办的等级考试，它和CSP-J、CSP-S、信奥赛是同一主办单位，有很强的公信力和权威性。","考试机会也多，一年可以考四次，参加GESP，就能给晋级CSP-J、CSP-S多几次机会。","而且GESP的考纲和难度对标CSP-J、CSP-S，能为孩子后续参加CSP和NOI做准备。"],"durs":[15.792,9.984,10.008]},"P42":{"sents":["接下来是白名单赛事。","这页列了两个。","一个是全国青少年人工智能创新挑战赛，主办方是中国少年儿童发展服务中心，它是白名单赛事，权威认可，可用于科技特长生认定、国内升学和海外留学申请，还能提升个人能力，培养项目管理和解决问题的能力，强化团队协作和抗挫折心态。","另一个是全国青少年心理成长知识与应用创新大赛，主办方是中国心理卫生协会，它填补了白名单赛事里心理成长方向的空白，备赛和参赛本身就是一次心理健康的自我教育。","这里要特别提醒大家：带班过程中，我们一定会给家长规划考试和比赛，但具体规划哪一个，目前还不确定，需要等赛事招报前一个月左右，由专门的老师给大家同步。","所以给家长做规划时，不要过度承诺一定能参加某个比赛、一定能拿到某个奖项，这些都是违规的。"],"durs":[2.568,1.872,23.4,16.464,14.64,9.24]},"P43":{"sents":["再来了解信息学奥赛。","全国青少年信息学奥林匹克竞赛，简称信奥赛，是五大学科竞赛之一，其余是数学、物理、化学、生物。","它由中国计算机学会主办，是白名单赛事中科技类的最高赛项，C++是唯一参赛编程语言，认可度和含金量极高。","CSP是参加信奥赛的预选赛，在CSP-S能力认证中取得优秀成绩的选手，可以获得NOIP参赛资格；","再根据NOIP成绩进行省队筛选，进入国内最高水平、最高含金量的编程竞赛，也就是NOI国赛；","国赛前五名有望进入国家队，征战IOI国际赛。","看上面的赛程图，9月是CSP-J和CSP-S初赛，10月复赛，11月NOIP，3、4月NOIP省队选拔，7月NOI全国决赛，8、9月IOI国际赛。","信奥赛系列的CSP、NOIP、NOI都是在线下考场进行的。"],"durs":[2.448,10.368,11.688,10.656,10.224,5.208,16.536,6.408]},"P44":{"sents":["这两张图都是孩子学编程后可以参加的白名单赛事。","左边是核桃整理的编程类相关白名单赛事汇总，右边是与编程相关的教育部白名单赛事列表，分成会有编程赛项的比赛和会用到编程知识的比赛。","大家不用背，眼熟一下名字，家长问起来能对得上就行。","左边还有一组数据和前面呼应：47项竞赛里，科学素养类22项、人文综合素养类12项、艺术体育类13项，其中17项会用到编程知识。"],"durs":[5.136,13.392,5.52,14.088]},"P45":{"sents":["这一页是信奥赛系列赛事的具体规则，考试时长、报名费用、赛制规则、学到哪适合报，大家都要熟悉，测试里也会考到。","CSP-J普及组和CSP-S提高组，第一轮2小时，第二轮3.5小时或4小时；","报名费第一轮100元，第二轮310元或560元；","参赛学员需年满12周岁，第一轮晋级才能参加第二轮；","CSP-J建议C++学习一年以上，CSP-S建议两年以上。","NOIP考试4.5小时，免费，要求CSP-S第二轮达到所在省份分数线，并且仅限高中生，建议C++学习三年以上。","省选考两天，每天4.5小时，免费，由各省组织选拔，建议学习三年以上。","NOI考两天，每天5小时，免费，由各省省队成员参加，建议学习四年以上。","这些比赛全部是线下考试。","下面三条是赛事成绩的作用：NOI金牌可直接获得保送清华北大等一流名校的资格；","NOI银牌可入围强基计划，一本或降20到50分进985，有助于提前锁定985、211名校；","NOI铜牌在中科大少创班可额外加20分。","特别注意，跟家长描述时不能用确定性的表述。","这里说的是可以，代表有机会，不是一定会被保送。"],"durs":[11.664,8.304,5.496,5.736,6.36,12.48,7.704,8.064,3.12,8.376,10.464,4.824,4.944,4.824]},"P46":{"sents":["这张图是科技特长生实验班的对应赛考关系，也是大家以后带班会接触到的具体赛事规划。","上面是编程阶段，从预备启航期的Scratch，到基础储备期、基础特长期的Python，再到信奥基础期、信奥超越期、信奥集训队的C++。","下面是每个阶段对标的考级和赛事，比如预备启航期对应CTL一到三级和白名单等国家级赛事，到了C++阶段，会逐步对应GESP、CSP-J、CSP-S、NOIP，直到NOI。","再看右边，这是重点：整个图形化课程目前设计上共有两个阶段，也就是一年。","科特线每个阶段都对应一场考级加一场赛事；","思维线一阶段仅有一次考级，二阶段对应一场考级加一场赛事。","所以科特线和思维线对应的赛考安排是不一样的。"],"durs":[8.616,12.744,17.976,7.656,4.728,6.36,4.992]},"P47":{"sents":["学到这里，咱们要给家长一个清晰的画面。","第一，不是最后一个赛事才是最好的，每个赛事都得经历。","高含金量的赛事周期长，需要让孩子一步一步来。","第二，核桃的课程和赛事是匹配的，每个阶段都有对应的赛事规划。","家长跟着课程节奏走，考级和比赛自然就衔接上了。"],"durs":[3.984,5.736,4.584,6.432,5.064]},"P48":{"sents":["好，赛事体系和赛事价值都学完了。","接下来进入第四部分，看看核桃在赛事方面到底有哪些优势。"],"durs":[3.84,6]},"P50":{"sents":["先说好课程，金牌选手研发，日常学习即训练。","我们的研发团队有这几个特点：信奥赛金牌选手亲自参与课程研发，他们最懂赛事考什么、怎么考；","还有深耕编程教育多年的资深教研团队。","课程内容紧贴等级考试和赛事考点，会根据赛事动态实时更新，打造了从零基础到信奥赛的完整学习路径。","右边就是我们的信奥金牌主讲团队和清北名校教研团队。"],"durs":[5.256,9.288,4.008,10.248,5.592]},"P51":{"sents":["在课程模式上，我们采用学练结合。","日常课程融入赛事真题训练，每节课都有对应的算法练习，还有阶段性模拟考试检验学习效果，错题本系统针对性查漏补缺。","左边这张课表里也能看到，课程中专门安排了综合复习、赛考强化和赛考专题直播。","孩子不用额外花时间突击，学习即备考，效率更高。"],"durs":[3.696,12.216,8.232,5.448]},"P52":{"sents":["再说好服务，专业课导，全程陪伴。","备考服务分三段。","第一段是实操覆盖，包括实操练习、精准提炼考点、归纳总结和技巧传递，高效提升备考效率，不再需要额外报名任何提升营。","第二段是赛前冲刺，有模拟真题训练、押题冲刺和直播冲刺总复习。","第三段是赛事辅导，包括各时间节点提醒、报名流程全程指导、一对一赛事规划，以及专业赛考教师指导。","另外，我们还有自己的在线评测平台核桃OJ，一年办了158场线上赛事，孩子平时就能参加实战训练，练的就是临场感。"],"durs":[3.936,2.208,12.384,7.056,10.536,12.12]},"P53":{"sents":["这七步把备考全流程串了起来。","第一步赛事规划，一对一规划，匹配孩子的学习进度和目标。","第二步报名指导，报名流程全程指导，各时间节点主动提醒。","第三步考点梳理，精准提炼考点，归纳总结、技巧传递。","第四步实操练习，实操覆盖、模拟考试、错题本查漏补缺。","第五步赛前辅导，专业赛考教师指导，提升备考效率。","第六步心态调整，赛前心态疏导，帮孩子从容应考。","第七步参赛陪伴，从报名到参赛，课导老师全程一对一跟课带赛，家长只需配合。","这里提醒一句，报名指导是带着家长把流程走清楚，缴费由家长自己操作，课导不代家长缴费。"],"durs":[3.336,5.88,6.264,5.976,6.264,5.52,5.376,8.208,9.216]},"P54":{"sents":["最后说好老师，专业课导，全程陪伴。","我们的课导老师懂编程，更懂孩子。","严格筛选，每位课导老师都经过层层选拔和专业培训。","专业背景，熟悉图形化编程和赛事体系，能做专业的赛考辅导。","全程陪伴，从报名、备考到参赛，一对一跟进指导。","及时反馈，每周学习反馈，问题及时解答，进度实时掌握。","心理疏导，赛前心态调整，帮孩子从容应考。","左边这张图也能看到，在知名编程教育机构的NOI考核通过教师数量中，核桃遥遥领先。","这些也是咱们以后要对家长做到的。"],"durs":[4.344,3.864,5.856,6.48,5.4,6.144,4.824,8.664,3.456]},"P55":{"sents":["第四部分讲完了。","最后一部分，来看看核桃赛考的成绩，这些成绩也印证了咱们赛事体系的设置是科学合理的。"],"durs":[2.016,8.712]},"P56":{"sents":["先看等级考试、国家级赛事和白名单赛事。","第一张，2025年教育部白名单赛事，核桃编程助力104050名学员拿下科技特长生入场券，获奖人数位居青少年编程行业第一，是编程机构第二、第三名的总和。","第二张是图灵杯省赛喜报，核桃获奖总人数4277名，其中一等奖469人，二等奖1099人，三等奖1519人，优秀奖1190人，469位选手成功晋级国赛。","大家对照一下前面的奖项设置，四个奖项人数加起来正好是4277，一等奖约占一成，一等奖人数也正好等于晋级国赛的人数，和前10%进决赛的规则对得上。","第三张，CTL的C++一级通过率高达94.84%。","第四张，YCL一级通过率高达96%。","所以说，核桃学员CTL和YCL的通过率都在90%以上。"],"durs":[4.776,16.536,19.296,16.2,6.456,4.968,6.6]},"P58":{"sents":["最后给大家介绍一个好用的工具，销冠助手，10秒就能搜到想要的赛考物料。","在飞书上搜索销冠助手，直接在对话框里输入相关的赛考问题就行，比如什么是科技特长生、白名单赛事成绩如何，或者查询某个地区的升学政策，它就能把对应的物料整理出来。","家长问到当地政策时，大家可以先用它查一查。"],"durs":[7.2,16.368,4.488]},"P59":{"sents":["好，这节课就到这里。","请大家扫码填写一下核桃赛事体系调研问卷，写下你的真实感受。"],"durs":[2.616,6.168]},"P04":{"sents":["我们一起来学习赛考的三重业务价值。\n","第一重价值，拉齐赛事认知。","家长对于赛考的认知通常存在两极分化：一部分家长认为学习编程的核心是锻炼思维，参不参赛、考不考试无关紧要；","还有一部分家长期望值过高，认为拿到证书就能直接助力升学。","这两种认知都存在偏差。","因此我们和家长沟通赛考，首要目标并不是推销赛事，而是统一认知，引导家长理解，赛考是编程学习路径里自然且重要的一环。\n","第二重价值，检验学习效果，也就是以考促学。","借助赛事和标准化测评，能够直观呈现孩子阶段性的学习收获，同时帮助孩子建立成就感，持续提升学习动力。\n","第三重价值，增强家长长期规划的意愿。","这里大家记住一句关键结论：赛事报名，等同于一次小型续报。","家长愿意为赛事报名，孩子完成参赛并拿到成果，家长亲眼看见学习效果，会更愿意继续报名下一阶段课程以及后续赛事。","所以赛事报名不是一锤子买卖，而是我们长期维护家长信任、深耕学员关系的重要入口。","来看一道题，“明白参加赛考是编程学习的必经之路”对应赛考的哪一重业务价值？"],"durs":[3.648,3.192,11.64,6.024,2.856,12.432,4.8,10.8,4.296,6.048,11.808,8.568,7.488]},"P11":{"sents":["说完科技特长生，再往上看一层，白名单赛事。","什么是白名单赛事？","它是教育部每年公布的、面向6到18岁学生的竞赛活动，有严格的评判标准，含金量高，赛事成绩官方认可。","它的价值体现在四个方面：科技特长生认定条件、强基计划入围参考、保送生认定依据，还有小升初简历的核心素材。","也就是说，白名单赛事是贯穿孩子升学全程的硬通货。","这里请留意年龄范围是6到18岁。","来看一道题，白名单赛事是教育部每年公布的、面向多大年龄学生的竞赛活动？"],"durs":[4.968,2.256,10.464,11.16,5.592,3.864,7.656]},"P18":{"sents":["这页把核桃主流赛考分成了四类。","第一类是等级考试，属于考试，适合大多数学员参加，作用是阶段性梳理知识，为竞赛打基础，代表有YCL、CTL、GESP，难度在四类里最低。","第二类是国家级赛事，属于竞赛，有高含金量证书，能助力评优，帮孩子积累赛事经验，锻炼抗压能力，培养竞技心态，代表有图灵杯、RoboRAVE。","第三类是白名单赛事，也属于竞赛，特指教育部规定的面向中小学生的全国性竞赛活动名单里的赛事，比如全国青少年心理成长知识与应用创新大赛、全国青少年人工智能创新挑战赛。","第四类是信息学奥赛，也就是NOI这条线，包括CSP-J、CSP-S和NOIP，难度极高，仅适合少数拔尖的学员参加。","来看一道题，“核桃编程主流赛考分类”中，哪一类属于“考试”而不是“竞赛”？"],"durs":[3.408,14.784,14.568,17.448,12.432,6.792]},"P32":{"sents":["等级考试讲完，来看国家级赛事。","第一个是图灵杯全国青少年编程及人工智能挑战活动。","为什么选图灵杯？","含金量有三点。","第一，国家级权威赛事，由共青团中央直属单位主办，清华大学提供技术支持，985高校专家参与命题和评审。","第二，升学助力显著，国赛一等奖获奖学员，可参加985高校人工智能学院教授的科研项目，为升学添彩。","第三，全国同台竞技，总评在全国多座城市、多所高校同步开启，能开阔视野、增长见识。","赛事面向全国6到18岁青少年，命题坚持真实情境、真实问题，重点检验孩子灵活运用编程解决实际问题的能力。","报名费用是300元，参赛形式是线上机考。","来看一道题，图灵杯国赛哪个奖项的获奖学员，可参加985高校人工智能学院教授的科研项目？"],"durs":[3.72,5.592,1.944,2.016,11.52,10.44,9.408,11.256,4.536,9.024]},"P49":{"sents":["前面讲的过程中，大家已经看到了一些核桃学员的赛事成绩。","这些成绩是怎么来的？","靠的是三大核心优势，为孩子的赛事之路保驾护航，就是PPT上这个公式：好课程加好老师加好服务，等于核桃学员赛事好成绩。","来看一道题，核桃为赛事之路保驾护航的三大核心优势不包括哪一项？"],"durs":[5.544,2.376,12.6,6.72]},"P57":{"sents":["再来看2026年信奥赛NOI的成绩。","核桃学员拿下了29枚金牌、109枚银牌、66枚铜牌。","全国金牌一共50枚，核桃占了29枚，金牌占比过半，央广网等多家央媒的报道。","来看一道题，2026年NOI核桃学员拿到了多少枚金牌？"],"durs":[4.176,6.336,8.208,6.024]}},"v":{"slides/P01.jpg":"f3f7ddad","slides/P01.png":"7e4e404f","slides/P02.jpg":"b31fc772","slides/P02.png":"244b3a83","slides/P03.jpg":"403c55d7","slides/P03.png":"59f46530","slides/P04.jpg":"cd80c9dd","slides/P04.png":"4a22169e","slides/P05.jpg":"df872bb8","slides/P05.png":"fbfddf74","slides/P06.jpg":"d1576cb2","slides/P06.png":"b601fe0d","slides/P07.jpg":"98e12367","slides/P07.png":"c22c9230","slides/P08.jpg":"75c2d73b","slides/P08.png":"5922724b","slides/P09.jpg":"e5048cd2","slides/P09.png":"bd14dc1d","slides/P10.jpg":"935ac18b","slides/P10.png":"086e070e","slides/P11.jpg":"e570ea1f","slides/P11.png":"8117092e","slides/P12.jpg":"750fa4dc","slides/P12.png":"45305f22","slides/P13.jpg":"812958eb","slides/P13.png":"eb78c4f8","slides/P14.jpg":"c41ed59b","slides/P14.png":"a2785 const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){

/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；

let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid, course:CFG.short||CFG.title, date:nowStr().slice(0,10)}, ev, snapshot(online));
  { const CNm = CFG.short || CFG.title; if (!String(rec.stage||'').startsWith(CNm + '｜')) rec.stage = CNm + (rec.stage ? '｜' + rec.stage : ''); }
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});

function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;

  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">

      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>
