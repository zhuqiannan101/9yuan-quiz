<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>图形化-科特算法工作流</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}
</style>

<script>
const DATA = {"pages":[{"row":3,"stage":"工作流·阶段1","p":"P01","topic":"开场提问","script":"今天要讲的工作流，就是帮大家解决什么时候该干什么的问题，保证关键动作一件都不漏。今天的主题是图形化课导工作流。这套工作流专门为课导岗位梳理，从接班一直到结课，每个阶段做什么、为什么做、做到什么程度，我们都会讲清楚。不管你是刚入行的新人，还是已经带过几期班的老课导，都可以借这节课把自己的工作重新理一遍，把服务做得更扎实。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":4,"stage":"工作流·阶段1","p":"P02","topic":"内容框架","script":"先看今天的整体框架，一共四个板块。第一块，课导价值。先想明白课导这份工作为什么重要，价值落在哪里。第二块，带班期全流程概览。给大家一张带班全景图，看清楚半年里每个节点在什么时候、要做什么。第三块，七大阶段重点，这是今天的核心。我们会把每个阶段的目标和关键动作逐一拆开，讲清楚做什么、为什么做、做到什么程度。第四块，成果验证，用真实的战绩看看，把这些动作做扎实能拿到什么结果。从认知，到方法，再到结果，我们一步一步来看。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":5,"stage":"工作流·阶段1","p":"P03","topic":"课导价值","script":"先进入第一个板块，课导价值导向。 课导在我们整个电销转化链路里，位置至关重要，核心定位就是承上启下。它不是简单打一通电话、完成一个动作，而是学习的关键一环。这份价值，我们拆成三个层面来看。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":6,"stage":"工作流·阶段1","p":"P04","topic":"价值三层","script":"这三个层面分别是：面向家长、面向公司、面向自己。\n首先是家长层面。 我们要给家长交付可感知的学习成果。家长能清楚感知到：孩子上课有人跟进、有人盯学习、有问题有人及时解答。这些看得见的服务，会收获家长的信任和认可。家长认可了，才会愿意跟着我们继续规划下一阶段学习、选择续报。 反过来，如果我们服务缺位，家长看不到孩子的学习进展，配合度会慢慢下降，等到续报节点，家长自然没有继续学习的想法。\n第二个是公司层面。 课导做好服务，直接拉动完课率、续报率，最终真正帮孩子实现持续成长。大家要明白，前端每一个新生，公司都是投入了获客成本的，不是零成本。我们课导的作用，就是把一次性的流量，变成长期学习的学员，让家长和孩子持续拿到长期价值，一阶一阶往下学。 如果服务没跟上，用户体验差、学一次就流失，那前端投入的获客成本，全部白费了。\n第三个，落到我们自己身上。 最直观的就是绩效收入，其次是长期的职业发展。把课导工作做扎实，不管是当下的薪资收益，还是后续想要晋升、往管理方向成长，这都是核心底气。 反过来，如果工作没做到位，一方面很难拿到理想收入，另一方面也很难获得学员和家长的正向反馈，缺少成就感，工作状态自然很难提上来。\n所以大家会发现，课导这份工作，本质是一套正向循环： 我们用心服务家长，让家长真切看见课程价值、感受到你的专业服务，认可我们的教学，愿意续报；稳定的续报，会给公司沉淀源源不断的在读生源，还会带来老带新转介绍；生源稳定、转化向好，我们的续报指标、绩效收入也跟着持续向好。一环扣一环，形成良性闭环。来判断一下，做好课导工作，只对课导自身有价值？","interact":{"q":"做好课导工作，只对课导自身有价值？","at":"P04","options":["对","错"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":7,"stage":"工作流·阶段1","p":"P05","topic":"价值链条","script":"那课导的核心价值，具体落在哪里？一句话：不仅是完成课程，而是让家长看到看得见的进步。现在的家长，很少能每节课都陪在孩子身边，孩子在屏幕前学了什么、写了什么代码、做了什么作品，家长其实是看不见的。我们的工作，就是把这个看不见的过程，变成家长能看见的效果。看屏幕上这条链路，一共五步。第一步，孩子在学，上课、写代码、做作品，但家长看不到过程。第二步，课导记录，把到课、作业、作品、课堂表现这些情况记下来。第三步，课导翻译，通过课后反馈、阶段报告，把代码说成成长，让家长听得懂孩子哪里变了。第四步，家长感知，家长看完会觉得，孩子真的变了，这钱花得值。第五步，续报决策，家长自己得出结论，愿意继续投入。这里有一个关键判断：我们能直接影响的，是中间两步，记录和翻译。这两步做扎实了，续报是自然而然的结果；跳过这两步，任何话术、任何方法都救不回来。大家想一想，孩子学→课导做什么→家长感知→续报，课导能直接掌控的是哪两步？","interact":{"q":"孩子学→课导做什么→家长感知→续报，课导能直接掌控的是哪两步？","at":"P05","options":["记录＋翻译","上课＋写代码","家长感知＋续报决策","催费＋追单"],"answer":0,"answers":[0],"vote":false,"wrong":"仅弹正确提示继续"},"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":8,"stage":"工作流·阶段1","p":"P06","topic":"带班基本信息","script":"了解科特线的带班信息。 先说整体周期：科特线完整行课周期是半年，一共划分 6 个 Level。 带班时间是周四、周五、周六晚上7点三个时段，每位课导分配其中两个时段，一般带两个班。\n再看学员来源，这点非常关键：科特线的学员，都是从一阶课导服务续报上来的。也就是说，这批孩子已经在我们这边有半年的学习基础，很多孩子接触过等级考试、国家级赛事，对编程本身有基础认知。而且正是因为在第一阶段体验到了我们完整、优质的服务，家长才愿意继续续报进入第二个阶段\n然后我们看课时排布规则：半年周期拆成 6 个 Level。 每个 Level 里面，前三周，每周 1 次课，一次课包含 2 个课时； 到了每个 Level 的第四周，节奏会调整为一周 2 次课。除了家长选定的常规时段外，我们会额外在周日加开一次和赛事有关的课程，用来做二阶段的赛事冲刺。来看一道题，科特带班每个 Level 的课时结构是？","interact":{"q":"科特带班每个 Level 的课时结构是？","at":"P06","options":["前三周每周一次课（一次两课时），第四周两次课（共四课时）","每周两次课，共八课时","前三周每周两次课，第四周一次课","每周一次课，一次一课时"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法","dept":"通用"},{"row":9,"stage":"工作流·阶段1","p":"P07","topic":"带班基本信息","script":"了解科特线的带班信息。 先说整体周期：科特线完整行课周期是半年，一共划分 6 个 Level。 带班时间是周四、周五、周六晚上7点三个时段，每位课导分配其中两个时段，一般带两个班。\n\n学员来源是前端班主任续报，学员基本都没有编程基础。\n\n然后我们看课时排布规则：半年周期拆成 6 个 Level。 每个 Level 里面，前三周，每周 1 次课，一次课包含 2 个课时； 到了每个 Level 的第四周，节奏会调整为一周 2 次课。除了家长选定的常规时段外，我们会额外在周日加开一次和赛事有关的课程，用来做赛事冲刺。来看一道题，科特线算法带班信息表中，“用户来源”一栏写的是？","interact":{"q":"科特线算法带班信息表中，“用户来源”一栏写的是？","at":"P07","options":["基本都无编程基础","每人分配两个时间段","前任课导老师续报","两个班级"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299首单","dept":"通用"},{"row":10,"stage":"工作流·阶段1","p":"P08","topic":"带班基本信息","script":"了解思维线的带班信息。先说整体周期：思维线完整行课周期是半年，一共划分 6 个 Level。 带班时间是周四、周五、周六晚上7点三个时段，每位课导分配其中两个时段，一般带两个班。\n再看学员来源，这点非常关键：到二阶段的学生，都是从一阶课导服务续报上来的。也就是说，这批孩子已经在我们这边有半年的学习基础，很多孩子接触过等级考试、国家级赛事，对编程本身有基础认知。而且正是因为在第一阶段体验到了我们完整、优质的服务，家长 容易起反效果。 大家看这张表格，一共七个阶段，每个阶段对应家长不一样的心理状态。\n接班期，一共 3 周。家长刚对接新老师，信任需要重新搭建，他们心里最大的焦虑就是：这个老师到底懂不懂我家孩子？所以这个阶段千万不要着急推动作、谈转化，首要目标是建立信任，多倾听、多安抚家长的不安。\nL7 阶段，4 周。家长会不自觉拿你和上一阶段老师的服务做对比，同时持续观察孩子的学习状态，内心核心疑问：新老师行不行、孩子能不能跟上课程。这个阶段不要提前去聊续报，核心是给到家长安全感，持续让家长看见孩子正在适应、看得见进步。\nL8 阶段，4 周。家长已经认可赛事的价值，现在主要在权衡要不要继续报赛考，关心的核心是：报这个赛事到底值不值得。我们不硬推，而是站在客观角度帮家长判断孩子适不适合参赛，以及参赛之后可以拿到什么样的成果。\nL9 阶段，4 周。一部分已经参赛的家长，期待孩子取得比上一次更好的成绩；还有一部分家长还在观望、没有报名。这个阶段家长最看重确定性、看重实实在在的结果，沟通的时候，多用孩子课堂表现、作业数据、阶段作品成果去支撑。\nL10 阶段，4 周，进入续报铺垫期。家长开始思考，要不要继续往下学 Python。这个阶段家长不是不信任老师，而是在衡量时间、金钱成本和学习收益。我们要提前持续铺垫孩子一路的成长变化，让续报是顺理成章的学习延续，而不是突兀的推销。\nL11 阶段，4 周，属于关键决策期。家长的问题会非常直接：要不要缴费、要不要继续报课。这个阶段沟通动作要聚焦，紧紧围绕家长最关心的核心疑问，讲清楚持续学习的长期价值。\nL12 阶段，4 周，家长很容易产生结果焦虑，退费风险偏高，对追单、催单格外敏感。这个时候越催，家长抵触感越强。核心原则就是稳：稳住家长情绪、稳住孩子的学习状态，做好成果收口。\n总结一句话：七个阶段，七种心态。咱们所有的运营节奏、沟通方式，都要跟着家长的心理节奏走。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":18,"stage":"工作流·阶段2","p":"P16","topic":"七种家长心态","script":"我们做所有运营动作之前，一定要先搞懂：这个阶段家长心里在想什么。心态摸准了，一句话顶十句；摸不准，说得再多都容易起反效果。大家看这张表，一共七个阶段，对应七种不一样的家长心态。\n接班期，一共 3 周。家长对接新老师，信任需要重新搭建，他最焦虑的就是：这个老师到底了不了解我家孩子？所以这个阶段千万不要着急推动作，优先把信任建立起来，多听家长讲，安抚好家长的不安。\nL1 阶段，4 周。家长会不自觉拿你和上一阶段老师的服务做对比，同时紧盯孩子的学习状态，心里的疑问就是：新老师行不行、孩子能不能跟上课程。这个阶段不要提前聊续报，核心是给到家长安全感，持续让家长看见孩子在适应、看得见实实在在的进步。\nL2 阶段，4 周。家长已经认可赛事价值，现在主要在权衡要不要继续报赛考，最关心报赛到底值不值得。我们不硬推，站在客观角度帮家长判断孩子适不适合参赛，讲清楚参赛之后能拿到什么样的成果。\nL3 阶段，4 周。已经参赛的家长，期待孩子取得比上一次更好的成绩；还有一部分家长还没报名，处在观望状态。这个阶段家长最看重结果和确定性，沟通的时候，多用孩子的课堂表现、作业情况、阶段成果去支撑。\nL4 阶段，4 周，进入续报考虑期。家长开始思考，要不要继续往下学 Python。家长不是不信任咱们老师，而是在权衡时间、金钱的成本和学习收益。我们要提前铺垫孩子一路的成长变化，让续报是顺理成章的学习延续，而不是很突兀的推销。\nL5 阶段，4 周，关键决策期。家长的问题会非常直接：要不要交钱、要不要继续报课。这个阶段沟通动作要聚焦，围绕家长最关心的疑问，讲清楚持续学习的长期价值。\nL6 阶段，4 周，家长很容易产生结果焦虑，退费风险偏高，对追单、催单格外敏感。这个时候越催，家长抵触感越强。核心就是一个字：稳。稳住家长情绪、稳住孩子的学习状态，做好成果收口。\n\n总结一句话：七个阶段，七种心态。咱们所有的运营节奏、沟通方式，都要跟着家长的心理节奏走。","interact":null,"sku":"3299首单\n2699首单","dept":"通用"},{"row":19,"stage":"工作流·阶段3","p":"P17","topic":"板块三引入","script":"接下来进入今天最核心的板块，七大阶段重点。从接班期一直到最后的用户维稳，每个阶段我们都讲清楚三件事：阶段目标是什么，要做哪几个核心动作，每个动作做到什么程度才算到位。大家可以边听边对照自己手上的班级。先从第一个阶段，接班期开始。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":20,"stage":"工作流·阶段3","p":"P18","topic":"阶段一・接班期","script":"接班期一共 3 周，核心目标就两个：防流失、建立信任。 大家要先理清一个前提：家长已经在核桃体验过一轮课程，对咱们的课程模式并不陌生，但对咱们课导是完全陌生的。想要拿到家长的信任，核心就是让家长感受到，咱们的专业度、服务方式，是优于上一任老师的，这是信任建立的基础。\n接班期我们固定 4 个关键动作，按顺序落地： 第一，扒轨迹。打电话之前，一定要先把孩子的信息摸透。摸清孩子的学习情况、当初报名二阶段的动机，排查是不是高风险学员。只有把这些细节掌握了，沟通才不会空泛，才知道该从哪里切入。 第二，首通电话。基于前面扒出来的学员信息，完成首通，搭建情感连接。通话里再次跟家长同步二阶段课程内容、服务标准，确认家长报二阶段的目标，同步好这一阶段整体学习安排。 第三，学员见面会。这点非常重要。孩子已经跟着之前的老师学了半年，突然换老师，一定会有不适应。我们通过见面会和孩子拉近关系、提升兴趣度，提高孩子对开课的期待值，同时回扣一下直播课程模式，同时让家长看见：孩子可以适应新老师，状态不受影响。 第四，家长会。面向家长正式介绍自己，向家长同步这一阶段的学习规划，讲清楚服务升级在哪里，建立信任、明确预期。\n把这四步扎实落地，接班期的信任就能稳稳建立，学员流失风险自然减少。来看一道题，以下哪一项不属于接班期的四项重点工作？","interact":{"q":"以下哪一项不属于接班期的四项重点工作？","at":"P18","options":["扒轨迹","小灶课全覆盖","打首通","家长会"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":21,"stage":"工作流·阶段3","p":"P19","topic":"阶段二・L7 试学期","script":"接下来到 L7 阶段，也就是试学期，一共 4 周。这个阶段核心目标，一是给家长吃定心丸，让家长确信选我们没错；二是帮孩子建立学习习惯，同时预防流失。\n落地有这几项重点动作： 首先，三大基础流程必须落实到位：课前通知家长上课，课中及时同步反馈，课后主动和孩子、家长建联，把日常行课全流程覆盖住。\n第二，做好日常反馈和沟通。家长平时要忙工作，还有别的学科要对接，咱们发的消息，很容易被忽略、忘记回复。针对一直不回消息、没有学习互动的家长，一定要电话跟进，及时对接，保证沟通不断档。\n第三，小灶课全覆盖。这个阶段每个孩子都要安排小灶课，借助小灶课和孩子、家长建立连接，一方面强化孩子的学习兴趣，另一方面也直观展示咱们的服务。\n第四，通过硬件随材预判流失风险。试学期有规则：不拆随材，是可以全额退课时费的。咱们可以观察家长的动作：愿意拆开随材，基本心态稳定；如果迟迟不拆，或者明确说再观望、再等等，就要重点留意，深度沟通，提前做好退费防控。\n大家一定要记住，试学期是家长犹豫感最强的时候。我们要持续给家长输出孩子这段时间细微、真实的成长变化，用这些变化，给家长吃下定心丸。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":22,"stage":"工作流·阶段3","p":"P20","topic":"阶段二・L1 试学期","script":"接下来到 L1 阶段，也就是试学期，一共 4 周。这个阶段核心目标，一是给家长吃定心丸，让家长确信选我们没错；二是帮孩子建立学习习惯，同时预防流失。\n落地有这几项重点动作： 首先，三大基础流程必须落实到位：课前通知家长上课，课中及时同步反馈，课后主动和孩子、家长建联，把日常行课全流程覆盖住。\n第二，做好日常反馈和沟通。家长平时要忙工作，还有别的学科要对接，咱们发的消息，很容易被忽略、忘记回复。针对一直不回消息、没有学习互动的家长，一定要电话跟进，及时对接，保证沟通不断档。\n第三，小灶课全覆盖。这个阶段每个孩子都要安排小灶课，借助小灶课和孩子、家长建立连接，一方面强化孩子的学习兴趣，另一方面也直观展示咱们的服务。\n第四，通过硬件随材预判流失风险。试学期有规则：不拆随材，是可以全额退课时费的。咱们可以观察家长的动作：愿意拆开随材，基本心态稳定；如果迟迟不拆，或者明确说再观望、再等等，就要重点留意，深度沟通，提前做好退费防控。\n大家一定要记住，试学期是家长犹豫感最强的时候。我们要持续给家长输出孩子这段时间细微、真实的成长变化，用这些变化，给家长吃下定心丸。","interact":null,"sku":"3299首单\n2699首单","dept":"通用"},{"row":23,"stage":"工作流·阶段3","p":"P21","topic":"日常行课全流程","script":"接下来我们单独拆解日常行课全流程，一共分成三大模块：开课前、开课中、开课后。\n首先是开课前，固定三件事：确认到课、备课、课前直播。 确认到课，就是提前摸排学员出勤，清楚哪些孩子正常上课、哪些有可能缺席，预判缺课的学员我们提前跟进。 备课，要吃透本节课内容，抓准重难点，完成后台备课操作，上传辅助提示、批改模板，这一项也是我们质检必查项。 课前直播，提前进直播间做好准备，同时也是和孩子预热互动很好的方式，调动孩子的上课积极性。\n然后是开课中，同样三件核心动作：课中反馈、课上连麦、后台答疑。 课中反馈，实时把孩子课堂表现同步给家长；课上连麦，鼓励孩子主动参与，拉高课堂投入度；后台答疑，第一时间响应孩子和家长课堂上提出的各类问题。\n最后是开课后，重点三件事：课后反馈、作业批改、小灶直播补充辅导。作业要批改到位，错题、有问题的作业单独给家长反馈，配套小灶直播做针对性补强。\n这里大家注意：课程分软件课、硬件课、赛事课，基础流程全部统一；思维线是没有赛事课的。 日常行课是咱们课导工作的基本面，这个流程扎扎实实落地，带班质量才有基本保障。","interact":null,"sku":"3299首单\n3299算法\n2699首单\n2699算法","dept":"通用"},{"row":24,"stage":"工作流·阶段3","p":"P22","topic":"阶段三・L8 招报预热","script":"接下来进入 L8 阶段，也就是招报预热阶段。这个阶段核心目标，就是把赛事招报预热电话落地，同时提升赛考联报达成率，这块非常关键。\n首先第一点，做好招报预热前的准备工作。我们要安排赛事小测，依托小测成绩和家长做反馈、做沟通。预热期间，我们可以开一对一或者一对多的讲题小灶课，让家长直观看到咱们在赛事配套上的服务；同时借着成绩反馈，给家长铺垫，让家长建立认知：咱们孩子是具备参赛能力的。\n第二，赛考规划电访。一定要在 L8-4 之前完成规划电访。大家记住，每个阶段都有固定工作流程，节奏一旦拖慢，后面阶段的动作就会全部堆积。电访环节严格按照 SOP 来走，打完后上传 SOP，沟通里清晰告知家长赛事开始招报，讲清楚完整赛事路径、为什么要参加二阶段的白名单国家级赛事，以及我们整体的规划，最后收集家长的报考意愿。\n第三，报名启动阶段，同步清楚时间节点。要跟家长讲明白报名起止时间、考试时间，引导家长在规定周期内完成报名，以此提升招报转化率。\n最后重点提醒：做招报的同时，千万不要打乱日常基础动作。咱们现在才到 L8，这一阶段从 L7 到 L12 共 6 个 Level，后面还有四个月左右的服务周期。服务永远是根基，日常反馈、正常行课节奏都不能停。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":25,"stage":"工作流·阶段3","p":"P23","topic":"阶段三・L2招报预热","script":"我们来到七大阶段的第三阶段：L2 招报预热。核心目标就是招报预热，同步推进赛考联报。 本阶段重点抓好四项工作： 第一，招报预热前，开展赛事小测，通过一对一或者一对多的讲题小灶课，提前给孩子铺垫赛考认知。 第二，赛考招报电访，要在 L2-4 之前完成规划电访并且上传 SOP，帮家长理清赛事路径，确认报考意愿。 第三，赛考联报，按时启动联报工作，引导学员参与赛事、辅助家长完成报名，讲清楚赛考相关安排，提升招报率。 第四，日常行课，持续输出教学反馈，稳住学员学习节奏，提升完课率。 这个阶段重在铺垫，提前做好赛考和招报的准备。","interact":null,"sku":"3299首单\n2699首单","dept":"通用"},{"row":26,"stage":"工作流·阶段3","p":"P24","topic":"阶段四・L9 赛考履约","script":"接下来进入 L9 阶段，也就是赛事履约阶段。本阶段核心就是赛事履约、考务提醒，这个阶段非常关键。 已经报名赛事的家长，心里是期待孩子拿到更好成绩的，毕竟他们在第一阶段已经体验过；还有一部分家长还在观望。我们要用落地的服务、孩子真实的课堂表现，给到家长信心。这里大家一定要记住一条：不能因为家长没有报名赛事，就区别对待孩子。\n整个阶段我们分四大板块同步推进： 第一，赛事履约课。按时上好赛事直播课，带着孩子做赛考专项训练。给大家一个小建议：哪怕孩子没有报名赛事，也可以正常参与专项练习。我们这一块的目标，一方面提升参赛孩子的通过率，另一方面兑现之前跟家长承诺好的全套赛事配套服务。\n第二，落实全部考务确认工作。提醒家长提前检测设备、考试环境，准考证、考试入口、操作要求等细节逐一同步到位。有些家长之前参加过赛事，流程比较熟悉；还有一类是第一阶段没参赛，经过咱们沟通这次才报名的家长，这类我们要重点关注，多跟进。\n第三，组织学员参加赛考，考前做好预期管理，考后及时私信运营跟进家长。不要一味拉高期待，帮孩子和家长放平心态。尤其是平时训练成绩不算突出的孩子，一定要提前降低预期，跟家长传递清楚：参与本身也很有价值，提前做好结果层面的预期管理。\n第四，稳住主线日常行课。千万不要因为备战赛事，把主线课程落下。课前、课中、课后的标准化动作照常推进，赛事辅导和常规学习两头兼顾，守住咱们的完课率。\n总结一下：L9 是兑现赛事服务承诺的阶段，我们不能只盯着考试。常规课、赛事辅导双线并行，让家长实实在在看到服务和成果。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":27,"stage":"工作流·阶段3","p":"P25","topic":"阶段四・L3 赛考履约","script":"我们进入七大阶段第四阶段：L3 赛考履约，核心目标是做好赛考履约、同步落实各项考务提醒。 这个阶段重点抓四件事： 第一，赛事课履约，上好赛事直播课，针对赛考题型开展专项训练，尽力提升学员通过率。 第二，赛考辅导，开展赛前集中辅导，逐项完成全部考务相关动作。 第三，参加赛考，组织学员参与赛事，考前做好预期管理，考后及时私信运营跟进家长。 第四，日常行课，稳步推进正常教学进度，兼顾赛考备考和常规学习，持续拉高完课率。 本阶段核心就是落地赛考全流程服务。","interact":null,"sku":"3299首单\n2699首单","dept":"通用"},{"row":28,"stage":"工作流·阶段3","p":"P26","topic":"阶段五・L10 续报预热","script":"第五个阶段，L10续报预热，核心目标是等考考试加续报预热。这个阶段家长开始考虑要不要继续学，所以我们要用实实在在的成果，提前把续报的认知铺垫好。重点抓四件事。第一，等考考试。在L10-1或L10-3组织学员参加等考，检验阶段学习成果。第二，续报预热电访。启动预热电访，和家长沟通下一阶段的学习规划，让家长对续报有认知，提前了解并解决家长不续报的异议。要注意，预热电访不是催费，核心是铺垫沟通，让家长提前有心理准备。第三，等考成绩查询。成绩一出来，第一时间向家长展示学习成果，用真实的结果增强家长的续报信心。孩子考得好，可以跟家长说，这一阶段学习效果很明显，下一阶段我们可以挑战更高的目标。成绩不理想也不要回避，可以说，这次考试暴露出一些薄弱点，正好在下一阶段针对性补齐。第四，日常行课。保持教学质量，做好阶段收尾和过渡，提高完课率。这个阶段是续报的前奏，前奏铺垫到位，到了正式续报阶段，沟通会顺畅很多。来看一道题，续报预热电访的核心目的是？","interact":{"q":"续报预热电访的核心目的是？","at":"P26","options":["铺垫沟通，聊下一阶段规划、提前处理不续报的异议","直接催家长交费","通知优惠截止时间","确认孩子是否退课"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"3299算法\n2699算法","dept":"通用"},{"row":29,"stage":"工作流·阶段3","p":"P27","topic":"阶段五・L4 续报预热","script":"我们来到七大阶段第五阶段：L4续报预热，核心目标是等考考试和续报预热。 本阶段重点抓好四项工作： 第一，等考考试，学员在L4-1或者L4-3参加等考，检验阶段学习成果。 第二，续报预热电访，启动预热电访，和家长沟通下阶段学习规划，摸清家长的续报想法，提前化解不续报的异议。 第三，等考成绩查询，拿到成绩后，及时向家长展示孩子的学习成果，增强家长的续报信心。 第四，日常行课，稳住教学质量，做好课程收尾与过渡，持续提升完课率。 这个阶段，依托等考成果铺垫，为后面正式续报打好基础。","interact":null,"sku":"3299首单\n2699首单","dept":"通用"},{"row":30,"stage":"工作流·阶段3","p":"P28","topic":"阶段六・L11 续报","script":"接下来第六个阶段，L11 正式续报阶段，核心目标就是完成正式续报，关键时间节点在 L11-2 或者 L11-4。这是咱们整个带班周期里最关键的转化战役，前面所有阶段的积累、铺垫，都要在这个阶段落地兑现。\n我们重点抓好四件事： 第一，推进正式续报。卡在 L11-2、L11-4 这两个节点全力推进转化，该打电话就打电话，该发消息就发消息，有需要的学员直接一对一深度沟通。 第二，持续跟进未续报学员。逐个跟进还没有报名的家庭，摸清家长真实顾虑：是担心价格、纠结学习效果，还是时间排不开，或是其他问题，找到根源再针对性化解。大家记住，家长说 “我再考虑一下”，不等于拒绝，很多时候只是需要我们再往前推一把。 第三，清晰解读续报政策。把优惠活动、班次安排给家长讲明白、讲透彻，信息传递到位，家长做决策的速度才会更快。 第四，守住日常行课底线。续报攻坚期，教学绝对不能松懈，我们要用教学质量带动续报。家长能看到，越是到后期，我们依旧认真负责，他才更愿意让孩子继续跟着我们学习。\n大家一定要记住，转化不是硬逼单，是前面所有服务、成果铺垫之后，水到渠成的落地，课不能放，服务不能掉。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":31,"stage":"工作流·阶段3","p":"P29","topic":"阶段六・L5 续报","script":"我们来到七大阶段第六阶段：L5续报阶段，核心目标就是正式续报，时间节点在L5-2或L5-4。 本阶段重点抓好四项工作： 第一，正式续报，在L5-2或L5-4节点全力推进续报转化。 第二，续报跟进，逐个跟进还没有续报的学员，摸清家长的顾虑，针对性解决问题。 第三，政策解读，给家长讲清楚续报政策、优惠力度以及班次安排，方便家长做决策。 第四，日常行课，教学质量不能松懈，依靠课堂质量来带动续报。 这是整个带班周期最关键的转化战役，前面所有阶段的铺垫，都要在这个阶段落地。","interact":null,"sku":"3299首单\n2699首单","dept":"通用"},{"row":32,"stage":"工作流·阶段3","p":"P30","topic":"阶段七・L12 用户维稳","script":"第七个阶段，L12 用户维稳阶段，这是咱们带班周期的最后一站，核心目标就是维稳、防退费、做最后的追单。 这个阶段家长很容易产生结果焦虑，退费风险偏高，而且对追单动作格外敏感，所以我们所有动作记住一个原则：稳，千万不能着急。\n同样重点抓好四件事： 第一，组织国赛、白名单等国家级赛事考试，冲刺高阶奖项。这是孩子整个学习周期的高光节点，也是我们给到家长的最后一次学习成果交付。 第二，重点做好防退费工作。持续盯紧高风险学员，一旦发现退费苗头第一时间介入维稳。像看到其他学员都续报了、自家孩子赛事结果不理想这类情况，都容易让家长萌生退费想法，我们要主动沟通、安抚情绪，提前化解风险。 第三，温和追单。针对还没有完成续报的学员，做最后一轮跟进，抓住收尾的转化机会。追单一定要讲究方式，不能强行施压，站在家长的视角帮他分析利弊，把选择权交给家长。 第四，做好结课过渡。完整走完结课流程，做好学习交接，圆满收尾整个带班周期。哪怕这个孩子最后没有选择续报，我们也要善始善终，服务不打折扣，好口碑就是这样一点点攒下来的。\n到这里，咱们课导带班全周期七大阶段就全部拆解完毕了。","interact":null,"sku":"3299算法\n2699算法","dept":"通用"},{"row":33,"stage":"工作流·阶段3","p":"P31","topic":"阶段七・L6 用户维稳","script":"我们来到七大阶段最后一个阶段：L6用户维稳，核心目标是用户维稳、防退费以及追单。 本阶段重点抓好四项工作： 第一，国赛或白名单考试，组织学员参加国赛、白名单赛事考试，冲刺高阶奖项。 第二，防退费，重点盯紧存在退费风险的学员，一旦发现问题及时介入、做好维稳。 第三，追单，跟进还没有续报的学员，把握最后的转化机会。 第四，结课过渡，妥善完成结课交接与学员过渡，圆满走完整个带班周期。 到这里，我们带班全周期的七大阶段就全部讲完了。","interact":null,"sku":"3299首单\n2699首单","dept":"通用"},{"row":34,"stage":"工作流·阶段4","p":"P32","topic":"板块四引入","script":"七大阶段讲完了，接下来进入第四个板块，成果验证。前面讲了这么多方法和流程，大家可能会问：这些动作真的有用吗？落地之后能不能拿到结果？接下来我们就用真实的带班战绩来看一看，把课导工作做扎实，能收获什么样的成果。" ack":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F10","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"L9 赛考履约阶段的核心目标是？","options":[{"k":"A","t":"招报预热+赛考联报"},{"k":"B","t":"等考考试+续报预热"},{"k":"C","t":"赛考履约+考务提醒"},{"k":"D","t":"维稳+防退费追单"}],"answer":"C","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F11","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"L10 续报预热阶段，学员参加等考的节点是？","options":[{"k":"A","t":"L10-1 / L10-3"},{"k":"B","t":"L10-2 / L10-4"},{"k":"C","t":"L11-2 / L11-4"},{"k":"D","t":"L9-1 / L9-3"}],"answer":"A","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"},{"id":"T-F12","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"接班期四项工作中，“家长会”的作用是？","options":[{"k":"A","t":"拉近师生关系、提升兴趣度"},{"k":"B","t":"建立情感连接、确认报名动机"},{"k":"C","t":"向家长同步规划、建立信任、明确预期"},{"k":"D","t":"了解学员上阶段学习、排查风险学员"}],"answer":"C","back":"","sku":"3299首单\n3299算法\n2699首单\n2699算法"}],"timing":{"P01":{"sents":["今天要讲的工作流，就是帮大家解决什么时候该干什么的问题，保证关键动作一件都不漏。","今天的主题是图形化课导工作流。","这套工作流专门为课导岗位梳理，从接班一直到结课，每个阶段做什么、为什么做、做到什么程度，我们都会讲清楚。","不管你是刚入行的新人，还是已经带过几期班的老课导，都可以借这节课把自己的工作重新理一遍，把服务做得更扎实。"],"durs":[8.064,3.672,10.776,10.32]},"P02":{"sents":["先看今天的整体框架，一共四个板块。","第一块，课导价值。","先想明白课导这份工作为什么重要，价值落在哪里。","第二块，带班期全流程概览。","给大家一张带班全景图，看清楚半年里每个节点在什么时候、要做什么。","第三块，七大阶段重点，这是今天的核心。","我们会把每个阶段的目标和关键动作逐一拆开，讲清楚做什么、为什么做、做到什么程度。","第四块，成果验证，用真实的战绩看看，把这些动作做扎实能拿到什么结果。","从认知，到方法，再到结果，我们一步一步来看。"],"durs":[3.816,2.448,5.064,3.288,6.6,4.368,8.232,7.512,4.824]},"P03":{"sents":["先进入第一个板块，课导价值导向。"," 课导在我们整个电销转化链路里，位置至关重要，核心定位就是承上启下。","它不是简单打一通电话、完成一个动作，而是学习的关键一环。","这份价值，我们拆成三个层面来看。"],"durs":[3.552,7.368,5.904,3.552]},"P10":{"sents":["基础带班信息是打底，而这套工作流，就是咱们长期班课导的行动地图。","课导是长周期服务，每个阶段要做的事不一样，重点也不一样，把每个节点的动作踩准，才能稳定建立家长长期信任，做好持续学习的维护。"],"durs":[6.912,12.624]},"P15":{"sents":["我们做所有运营动作之前，核心前提：先读懂这个阶段家长的心态。","心态摸准了，一句话顶十句；","摸不准，讲再多都容易起反效果。"," 大家看这张表格，一共七个阶段，每个阶段对应家长不一样的心理状态。\n","接班期，一共 3 周。","家长刚对接新老师，信任需要重新搭建，他们心里最大的焦虑就是：这个老师到底懂不懂我家孩子？","所以这个阶段千万不要着急推动作、谈转化，首要目标是建立信任，多倾听、多安抚家长的不安。\n","L7 阶段，4 周。","家长会不自觉拿你和上一阶段老师的服务做对比，同时持续观察孩子的学习状态，内心核心疑问：新老师行不行、孩子能不能跟上课程。","这个阶段不要提前去聊续报，核心是给到家长安全感，持续让家长看见孩子正在适应、看得见进步。\n","L8 阶段，4 周。","家长已经认可赛事的价值，现在主要在权衡要不要继续报赛考，关心的核心是：报这个赛事到底值不值得。","我们不硬推，而是站在客观角度帮家长判断孩子适不适合参赛，以及参赛之后可以拿到什么样的成果。\n","L9 阶段，4 周。","一部分已经参赛的家长，期待孩子取得比上一次更好的成绩；","还有一部分家长还在观望、没有报名。","这个阶段家长最看重确定性、看重实实在在的结果，沟通的时候，多用孩子课堂表现、作业数据、阶段作品成果去支撑。\n","L10 阶段，4 周，进入续报铺垫期。","家长开始思考，要不要继续往下学 Python。","这个阶段家长不是不信任老师，而是在衡量时间、金钱成本和学习收益。","我们要提前持续铺垫孩子一路的成长变化，让续报是顺理成章的学习延续，而不是突兀的推销。\n","L11 阶段，4 周，属于关键决策期。","家长的问题会非常直接：要不要缴费、要不要继续报课。","这个阶段沟通动作要聚焦，紧紧围绕家长最关心的核心疑问，讲清楚持续学习的长期价值。\n","L12 阶段，4 周，家长很容易产生结果焦虑，退费风险偏高，对追单、催单格外敏感。","这个时候越催，家长抵触感越强。","核心原则就是稳：稳住家长情绪、稳住孩子的学习状态，做好成果收口。\n","总结一句话：七个阶段，七种心态。","咱们所有的运营节奏、沟通方式，都要跟着家长的心理节奏走。"],"durs":[6.48,3.168,3.48,6.528,2.496,9.12,9.456,2.4,12.744,9.696,2.424,10.056,9.36,2.4,5.904,3.84,11.712,4.008,4.176,7.224,8.736,4.224,5.328,8.688,9.024,3.552,7.488,3.84,5.76]},"P16":{"sents":["我们做所有运营动作之前，一定要先搞懂：这个阶段家长心里在想什么。","心态摸准了，一句话顶十句；","摸不准，说得再多都容易起反效果。","大家看这张表，一共七个阶段，对应七种不一样的家长心态。\n","接班期，一共 3 周。","家长对接新老师，信任需要重新搭建，他最焦虑的就是：这个老师到底了不了解我家孩子？","所以这个阶段千万不要着急推动作，优先把信任建立起来，多听家长讲，安抚好家长的不安。\n","L1 阶段，4 周。","家长会不自觉拿你和上一阶段老师的服务做对比，同时紧盯孩子的学习状态，心里的疑问就是：新老师行不行、孩子能不能跟上课程。","这个阶段不要提前聊续报，核心是给到家长安全感，持续让家长看见孩子在适应、看得见实实在在的进步。\n","L2 阶段，4 周。","家长已经认可赛事价值，现在主要在权衡要不要继续报赛考，最关心报赛到底值不值得。","我们不硬推，站在客观角度帮家长判断孩子适不适合参赛，讲清楚参赛之后能拿到什么样的成果。\n","L3 阶段，4 周。","已经参赛的家长，期待孩子取得比上一次更好的成绩；","还有一部分家长还没报名，处在观望状态。","这个阶段家长最看重结果和确定性，沟通的时候，多用孩子的课堂表现、作业情况、阶段成果去支撑。\n","L4 阶段，4 周，进入续报考虑期。","家长开始思考，要不要继续往下学 Python。","家长不是不信任咱们老师，而是在权衡时间、金钱的成本和学习收益。","我们要提前铺垫孩子一路的成长变化，让续报是顺理成章的学习延续，而不是很突兀的推销。\n","L5 阶段，4 周，关键决策期。","家长的问题会非常直接：要不要交钱、要不要继续报课。","这个阶段沟通动作要聚焦，围绕家长最关心的疑问，讲清楚持续学习的长期价值。\n","L6 阶段，4 周，家长很容易产生结果焦虑，退费风险偏高，对追单、催单格外敏感。","这个时候越催，家长抵触感越强。","核心就是一个字：稳。","稳住家长情绪、稳住孩子的学习状态，做好成果收口。\n\n","总结一句话：七个阶段，七种心态。","咱们所有的运营节奏、沟通方式，都要跟着家长的心理节奏走。"],"durs":[6.624,3.168,3.552,5.64,2.496,8.304,8.736,2.424,12.504,10.32,2.376,8.496,9,2.424,5.328,4.128,9.96,3.888,4.176,6.84,8.64,3.672,5.424,7.968,8.832,3.552,2.544,5.52,3.84,5.76]},"P17":{"sents":["接下来进入今天最核心的板块，七大阶段重点。","从接班期一直到最后的用户维稳，每个阶段我们都讲清楚三件事：阶段目标是什么，要做哪几个核心动作，每个动作做到什么程度才算到位。","大家可以边听边对照自己手上的班级。","先从第一个阶段，接班期开始。"],"durs":[4.608,12.816,3.72,3.312]},"P19":{"sents":["接下来到 L7 阶段，也就是试学期，一共 4 周。","这个阶段核心目标，一是给家长吃定心丸，让家长确信选我们没错；","二是帮孩子建立学习习惯，同时预防流失。\n","落地有这几项重点动作： 首先，三大基础流程必须落实到位：课前通知家长上课，课中及时同步反馈，课后主动和孩子、家长建联，把日常行课全流程覆盖住。\n","第二，做好日常反馈和沟通。","家长平时要忙工作，还有别的学科要对接，咱们发的消息，很容易被忽略、忘记回复。","针对一直不回消息、没有学习互动的家长，一定要电话跟进，及时对接，保证沟通不断档。\n","第三，小灶课全覆盖。","这个阶段每个孩子都要安排小灶课，借助小灶课和孩子、家长建立连接，一方面强化孩子的学习兴趣，另一方面也直观展示咱们的服务。\n","第四，通过硬件随材预判流失风险。","试学期有规则：不拆随材，是可以全额退课时费的。","咱们可以观察家长的动作：愿意拆开随材，基本心态稳定；","如果迟迟不拆，或者明确说再观望、再等等，就要重点留意，深度沟通，提前做好退费防控。\n","大家一定要记住，试学期是家长犹豫感最强的时候。","我们要持续给家长输出孩子这段时间细微、真实的成长变化，用这些变化，给家长吃下定心丸。"],"durs":[5.064,6.648,4.56,15.912,3.216,7.896,8.28,2.688,12.552,3.96,5.256,5.592,9.312,5.064,9.144]},"P20":{"sents":["接下来到 L1 阶段，也就是试学期，一共 4 周。","这个阶段核心目标，一是给家长吃定心丸，让家长确信选我们没错；","二是帮孩子建立学习习惯，同时预防流失。\n","落地有这几项重点动作： 首先，三大基础流程必须落实到位：课前通知家长上课，课中及时同步反馈，课后主动和孩子、家长建联，把日常行课全流程覆盖住。\n","第二，做好日常反馈和沟通。","家长平时要忙工作，还有别的学科要对接，咱们发的消息，很容易被忽略、忘记回复。","针对一直不回消息、没有学习互动的家长，一定要电话跟进，及时对接，保证沟通不断档。\n","第三，小灶课全覆盖。","这个阶段每个孩子都要安排小灶课，借助小灶课和孩子、家长建立连接，一方面强化孩子的学习兴趣，另一方面也直观展示咱们的服务。\n","第四，通过硬件随材预判流失风险。","试学期有规则：不拆随材，是可以全额退课时费的。","咱们可以观察家长的动作：愿意拆开随材，基本心态稳定；","如果迟迟不拆，或者明确说再观望、再等等，就要重点留意，深度沟通，提前做好退费防控。\n","大家一定要记住，试学期是家长犹豫感最强的时候。","我们要持续给家长输出孩子这段时间细微、真实的成长变化，用这些变化，给家长吃下定心丸。"],"durs":[5.04,6.648,4.56,15.912,3.216,7.896,8.28,2.688,12.552,3.96,5.256,5.592,9.312,5.064,9.144]},"P21":{"sents":["接下来我们单独拆解日常行课全流程，一共分成三大模块：开课前、开课中、开课后。\n","首先是开课前，固定三件事：确认到课、备课、课前直播。"," 确认到课，就是提前摸排学员出勤，清楚哪些孩子正常上课、哪些有可能缺席，预判缺课的学员我们提前跟进。"," 备课，要吃透本节课内容，抓准重难点，完成后台备课操作，上传辅助提示、批改模板，这一项也是我们质检必查项。"," 课前直播，提前进直播间做好准备，同时也是和孩子预热互动很好的方式，调动孩子的上课积极性。\n","然后是开课中，同样三件核心动作：课中反馈、课上连麦、后台答疑。"," 课中反馈，实时把孩子课堂表现同步给家长；","课上连麦，鼓励孩子主动参与，拉高课堂投入度；","后台答疑，第一时间响应孩子和家长课堂上提出的各类问题。\n","最后是开课后，重点三件事：课后反馈、作业批改、小灶直播补充辅导。","作业要批改到位，错题、有问题的作业单独给家长反馈，配套小灶直播做针对性补强。\n","这里大家注意：课程分软件课、硬件课、赛事课，基础流程全部统一；","思维线是没有赛事课的。"," 日常行课是咱们课导工作的基本面，这个流程扎扎实实落地，带班质量才有基本保障。"],"durs":[8.784,6.336,10.512,11.688,9.528,7.368,4.872,5.064,6,7.464,8.832,7.32,2.52,8.424]},"P22":{"sents":["接下来进入 L8 阶段，也就是招报预热阶段。","这个阶段核心目标，就是把赛事招报预热电话落地，同时提升赛考联报达成率，这块非常关键。\n","首先第一点，做好招报预热前的准备工作。","我们要安排赛事小测，依托小测成绩和家长做反馈、做沟通。","预热期间，我们可以开一对一或者一对多的讲题小灶课，让家长直观看到咱们在赛事配套上的服务；","同时借着成绩反馈，给家长铺垫，让家长建立认知：咱们孩子是具备参赛能力的。\n","第二，赛考规划电访。","一定要在 L8-4 之前完成规划电访。","大家记住，每个阶段都有固定工作流程，节奏一旦拖慢，后面阶段的动作就会全部堆积。","电访环节严格按照 SOP 来走，打完后上传 SOP，沟通里清晰告知家长赛事开始招报，讲清楚完整赛事路径、为什么要参加二阶段的白名单国家级赛事，以及我们整体的规划，最后收集家长的报考意愿。\n","第三，报名启动阶段，同步清楚时间节点。","要跟家长讲明白报名起止时间、考试时间，引导家长在规定周期内完成报名，以此提升招报转化率。\n","最后重点提醒：做招报的同时，千万不要打乱日常基础动作。","咱们现在才到 L8，这一阶段从 L7 到 L12 共 6 个 Level，后面还有四个月左右的服务周期。","服务永远是根基，日常反馈、正常行课节奏都不能停。"],"durs":[4.464,9.24,4.224,6.24,8.952,8.064,2.688,4.176,8.616,18.336,4.56,9.84,6,8.712,5.52]},"P23":{"sents":["我们来到七大阶段的第三阶段：L2 招报预热。","核心目标就是招报预热，同步推进赛考联报。"," 本阶段重点抓好四项工作： 第一，招报预热前，开展赛事小测，通过一对一或者一对多的讲题小灶课，提前给孩子铺垫赛考认知。"," 第二，赛考招报电访，要在 L2-4 之前完成规划电访并且上传 SOP，帮家长理清赛事路径，确认报考意愿。"," 第三，赛考联报，按时启动联报工作，引导学员参与赛事、辅助家长完成报名，讲清楚赛考相关安排，提升招报率。"," 第四，日常行课，持续输出教学反馈，稳住学员学习节奏，提升完课率。"," 这个阶段重在铺垫，提前做好赛考和招报的准备。"],"durs":[4.584,4.848,12.408,10.92,11.424,7.608,4.944]},"P25":{"sents":["我们进入七大阶段第四阶段：L3 赛考履约，核心目标是做好赛考履约、同步落实各项考务提醒。"," 这个阶段重点抓四件事： 第一，赛事课履约，上好赛事直播课，针对赛考题型开展专项训练，尽力提升学员通过率。"," 第二，赛考辅导，开展赛前集中辅导，逐项完成全部考务相关动作。"," 第三，参加赛考，组织学员参与赛事，考前做好预期管理，考后及时私信运营跟进家长。"," 第四，日常行课，稳步推进正常教学进度，兼顾赛考备考和常规学习，持续拉高完课率。"," 本阶段核心就是落地赛考全流程服务。"],"durs":[9.36,11.616,6.888,9.12,9.024,4.128]},"P27":{"sents":["我们来到七大阶段第五阶段：L4续报预热，核心目标是等考考试和续报预热。"," 本阶段重点抓好四项工作： 第一，等考考试，学员在L4-1或者L4-3参加等考，检验阶段学习成果。"," 第二，续报预热电访，启动预热电访，和家长沟通下阶段学习规划，摸清家长的续报想法，提前化解不续报的异议。"," 第三，等考成绩查询，拿到成绩后，及时向家长展示孩子的学习成果，增强家长的续报信心。"," 第四，日常行课，稳住教学质量，做好课程收尾与过渡，持续提升完课率。"," 这个阶段，依托等考成果铺垫，为后面正式续报打好基础。"],"durs":[7.728,11.04,10.92,9.264,7.608,5.904]},"P28":{"sents":["接下来第六个阶段，L11 正式续报阶段，核心目标就是完成正式续报，关键时间节点在 L11-2 或者 L11-4。","这是咱们整个带班周期里最关键的转化战役，前面所有阶段的积累、铺垫，都要在这个阶段落地兑现。\n","我们重点抓好四件事： 第一，推进正式续报。","卡在 L11-2、L11-4 这两个节点全力推进转化，该打电话就打电话，该发消息就发消息，有需要的学员直接一对一深度沟通。"," 第二，持续跟进未续报学员。","逐个跟进还没有报名的家庭，摸清家长真实顾虑：是担心价格、纠结学习效果，还是时间排不开，或是其他问题，找到根源再针对性化解。","大家记住，家长说 “我再考虑一下”，不等于拒绝，很多时候只是需要我们再往前推一把。"," 第三，清晰解读续报政策。","把优惠活动、班次安排给家长讲明白、讲透彻，信息传递到位，家长做决策的速度才会更快。"," 第四，守住日常行课底线。","续报攻坚期，教学绝对不能松懈，我们要用教学质量带动续报。","家长能看到，越是到后期，我们依旧认真负责，他才更愿意让孩子继续跟着我们学习。\n","大家一定要记住，转化不是硬逼单，是前面所有服务、成果铺垫之后，水到渠成的落地，课不能放，服务不能掉。"],"durs":[11.376,9.408,4.656,12.576,3.216,13.056,7.56,3.144,9.216,3.216,6.144,7.872,10.488]},"P29":{"sents":["我们来到七大阶段第六阶段：L5续报阶段，核心目标就是正式续报，时间节点在L5-2或L5-4。"," 本阶段重点抓好四项工作： 第一，正式续报，在L5-2或L5-4节点全力推进续报转化。"," 第二，续报跟进，逐个跟进还没有续报的学员，摸清家长的顾虑，针对性解决问题。"," 第三，政策解读，给家长讲清楚续报政策、优惠力度以及班次安排，方便家长做决策。"," 第四，日常行课，教学质量不能松懈，依靠课堂质量来带动续报。"," 这是整个带班周期最关键的转化战役，前面所有阶段的铺垫，都要在这个阶段落地。"],"durs":[10.104,9.264,8.088,8.904,6.888,7.488]},"P30":{"sents":["第七个阶段，L12 用户维稳阶段，这是咱们带班周期的最后一站，核心目标就是维稳、防退费、做最后的追单。"," 这个阶段家长很容易产生结果焦虑，退费风险偏高，而且对追单动作格外敏感，所以我们所有动作记住一个原则：稳，千万不能着急。\n","同样重点抓好四件事： 第一，组织国赛、白名单等国家级赛事考试，冲刺高阶奖项。","这是孩子整个学习周期的高光节点，也是我们给到家长的最后一次学习成果交付。"," 第二，重点做好防退费工作。","持续盯紧高风险学员，一旦发现退费苗头第一时间介入维稳。","像看到其他学员都续报了、自家孩子赛事结果不理想这类情况，都容易让家长萌生退费想法，我们要主动沟通、安抚情绪，提前化解风险。"," 第三，温和追单。","针对还没有完成续报的学员，做最后一轮跟进，抓住收尾的转化机会。","追单一定要讲究方式，不能强行施压，站在家长的视角帮他分析利弊，把选择权交给家长。"," 第四，做好结课过渡。","完整走完结课流程，做好学习交接，圆满收尾整个带班周期。","哪怕这个孩子最后没有选择续报，我们也要善始善终，服务不打折扣，好口碑就是这样一点点攒下来的。\n","到这里，咱们课导带班全周期七大阶段就全部拆解完毕了。"],"durs":[10.968,12.816,8.592,7.344,3.288,6.192,12.648,2.304,6.384,8.64,2.688,6.456,9.336,5.64]},"P31":{"sents":["我们来到七大阶段最后一个阶段：L6用户维稳，核心目标是用户维稳、防退费以及追单。"," 本阶段重点抓好四项工作： 第一，国赛或白名单考试，组织学员参加国赛、白名单赛事考试，冲刺高阶奖项。"," 第二，防退费，重点盯紧存在退费风险的学员，一旦发现问题及时介入、做好维稳。"," 第三，追单，跟进还没有续报的学员，把握最后的转化机会。"," 第四，结课过渡，妥善完成结课交接与学员过渡，圆满走完整个带班周期。"," 到这里，我们带班全周期的七大阶段就全部讲完了。"],"durs":[8.712,11.232,8.424,5.856,7.8,4.944]},"P32":{"sents":["七大阶段讲完了，接下来进入第四个板块，成果验证。","前面讲了这么多方法和流程，大家可能会问：这些动作真的有用吗？","落地之后能不能拿到结果？","接下来我们就用真实的带班战绩来看一看，把课导工作做扎实，能收获什么样的成果。"],"durs":[5.184,6.144,2.976,7.752]},"P33":{"sents":["我们先来看武汉铁军的喜报。","这是武汉团队在招报和续报战役里拿到的成绩。","这些课导就是按今天讲的这套工作流在执行，从接班期的首通电访开始，每一步都走得很扎实，最后拿到了这样的结果。","工作流不是纸上谈兵，是一线实打实打出来的经验，照着做，你也能出成绩。"],"durs":[2.808,4.872,11.016,7.128]},"P34":{"sents":["先看暑1科特S低的招报战绩。","TOP学部是张祥带领的武汉铁军，招报率6 是课导工作做得细、做得实。","大家后面带班可以对标一下，看看自己在哪个环节还有差距，是首通打得不够好，还是日常反馈不够及时，还是续报跟进不够到位。","找到差距补上，下一次上榜的可能就是你。"],"durs":[2.928,4.944,4.584,4.488,4.032,2.184,3.288,11.664,4.248]},"P44":{"sents":["最后我们一起来回顾今天全部内容。","从课导岗位价值认知，到带班全流程全景图，再到七大阶段每个节点对应的重点动作，最后我们也用真实战绩做了成果验证。"," 希望大家把今天学到的内容带回日常工作当中，一步一个脚印落地执行。","课导这份工作没有捷径，就是把每一件小事做扎实，用心服务好每一位家长，跟进好每一个孩子。\n","最后送给大家八个字，也是咱们9元铁军的口号：攻无不克，使命必达。","祝愿大家后续带班，都能拿下满意的成绩！"],"durs":[3.624,12.072,6.552,8.64,6.816,4.08]},"P45":{"sents":["接下来，请大家拿出手机，扫描屏幕上的二维码，填写这份工作流程调研问卷。","今天培训最真实的感受，不管是收获、疑问，还是希望后续补充的内容，都可以写进问卷。","大家的反馈，是我们持续优化培训内容的重要依据。","感谢各位！"],"durs":[7.68,8.376,4.776,1.872]},"P04":{"sents":["这三个层面分别是：面向家长、面向公司、面向自己。\n","首先是家长层面。"," 我们要给家长交付可感知的学习成果。","家长能清楚感知到：孩子上课有人跟进、有人盯学习、有问题有人及时解答。","这些看得见的服务，会收获家长的信任和认可。","家长认可了，才会愿意跟着我们继续规划下一阶段学习、选择续报。"," 反过来，如果我们服务缺位，家长看不到孩子的学习进展，配合度会慢慢下降，等到续报节点，家长自然没有继续学习的想法。\n","第二个是公司层面。"," 课导做好服务，直接拉动完课率、续报率，最终真正帮孩子实现持续成长。","大家要明白，前端每一个新生，公司都是投入了获客成本的，不是零成本。","我们课导的作用，就是把一次性的流量，变成长期学习的学员，让家长和孩子持续拿到长期价值，一阶一阶往下学。"," 如果服务没跟上，用户体验差、学一次就流失，那前端投入的获客成本，全部白费了。\n","第三个，落到我们自己身上。"," 最直观的就是绩效收入，其次是长期的职业发展。","把课导工作做扎实，不管是当下的薪资收益，还是后续想要晋升、往管理方向成长，这都是核心底气。"," 反过来，如果工作没做到位，一方面很难拿到理想收入，另一方面也很难获得学员和家长的正向反馈，缺少成就感，工作状态自然很难提上来。\n","所以大家会发现，课导这份工作，本质是一套正向循环： 我们用心服务家长，让家长真切看见课程价值、感受到你的专业服务，认可我们的教学，愿意续报；","稳定的续报，会给公司沉淀源源不断的在读生源，还会带来老带新转介绍；","生源稳定、转化向好，我们的续报指标、绩效收入也跟着持续向好。","一环扣一环，形成良性闭环。","来判断一下，做好课导工作，只对课导自身有价值？"],"durs":[5.688,2.328,3.768,7.512,4.56,6.48,11.568,2.208,7.416,6.912,10.704,8.208,2.928,5.04,9.504,13.464,14.256,7.008,6.816,3.192,5.184]},"P05":{"sents":["那课导的核心价值，具体落在哪里？","一句话：不仅是完成课程，而是让家长看到看得见的进步。","现在的家长，很少能每节课都陪在孩子身边，孩子在屏幕前学了什么、写了什么代码、做了什么作品，家长其实是看不见的。","我们的工作，就是把这个看不见的过程，变成家长能看见的效果。","看屏幕上这条链路，一共五步。","第一步，孩子在学，上课、写代码、做作品，但家长看不到过程。","第二步，课导记录，把到课、作业、作品、课堂表现这些情况记下来。","第三步，课导翻译，通过课后反馈、阶段报告，把代码说成成长，让家长听得懂孩子哪里变了。","第四步，家长感知，家长看完会觉得，孩子真的变了，这钱花得值。","第五步，续报决策，家长自己得出结论，愿意继续投入。","这里有一个关键判断：我们能直接影响的，是中间两步，记录和翻译。","这两步做扎实了，续报是自然而然的结果；","跳过这两步，任何话术、任何方法都救不回来。","大家想一想，孩子学→课导做什么→家长感知→续报，课导能直接掌控的是哪两步？"],"durs":[3.6,5.928,11.136,5.928 8,6.288,8.976,7.008,8.376,12.312,3.552,7.392]},"P18":{"sents":["接班期一共 3 周，核心目标就两个：防流失、建立信任。"," 大家要先理清一个前提：家长已经在核桃体验过一轮课程，对咱们的课程模式并不陌生，但对咱们课导是完全陌生的。","想要拿到家长的信任，核心就是让家长感受到，咱们的专业度、服务方式，是优于上一任老师的，这是信任建立的基础。\n","接班期我们固定 4 个关键动作，按顺序落地： 第一，扒轨迹。","打电话之前，一定要先把孩子的信息摸透。","摸清孩子的学习情况、当初报名二阶段的动机，排查是不是高风险学员。","只有把这些细节掌握了，沟通才不会空泛，才知道该从哪里切入。"," 第二，首通电话。","基于前面扒出来的学员信息，完成首通，搭建情感连接。","通话里再次跟家长同步二阶段课程内容、服务标准，确认家长报二阶段的目标，同步好这一阶段整体学习安排。"," 第三，学员见面会。","这点非常重要。","孩子已经跟着之前的老师学了半年，突然换老师，一定会有不适应。","我们通过见面会和孩子拉近关系、提升兴趣度，提高孩子对开课的期待值，同时回扣一下直播课程模式，同时让家长看见：孩子可以适应新老师，状态不受影响。"," 第四，家长会。","面向家长正式介绍自己，向家长同步这一阶段的学习规划，讲清楚服务升级在哪里，建立信任、明确预期。\n","把这四步扎实落地，接班期的信任就能稳稳建立，学员流失风险自然减少。","来看一道题，以下哪一项不属于接班期的四项重点工作？"],"durs":[5.808,10.896,10.848,6.216,4.104,7.056,6.144,2.256,5.688,10.512,2.544,1.944,5.928,15.384,2.136,10.272,7.272,5.256]},"P26":{"sents":["第五个阶段，L10续报预热，核心目标是等考考试加续报预热。","这个阶段家长开始考虑要不要继续学，所以我们要用实实在在的成果，提前把续报的认知铺垫好。","重点抓四件事。","第一，等考考试。","在L10-1或L10-3组织学员参加等考，检验阶段学习成果。","第二，续报预热电访。","启动预热电访，和家长沟通下一阶段的学习规划，让家长对续报有认知，提前了解并解决家长不续报的异议。","要注意，预热电访不是催费，核心是铺垫沟通，让家长提前有心理准备。","第三，等考成绩查询。","成绩一出来，第一时间向家长展示学习成果，用真实的结果增强家长的续报信心。","孩子考得好，可以跟家长说，这一阶段学习效果很明显，下一阶段我们可以挑战更高的目标。","成绩不理想也不要回避，可以说，这次考试暴露出一些薄弱点，正好在下一阶段针对性补齐。","第四，日常行课。","保持教学质量，做好阶段收尾和过渡，提高完课率。","这个阶段是续报的前奏，前奏铺垫到位，到了正式续报阶段，沟通会顺畅很多。","来看一道题，续报预热电访的核心目的是？"],"durs":[6.456,9.192,2.088,2.304,6.912,2.64,10.32,7.248,2.784,8.064,8.352,8.784,2.376,5.208,7.536,4.152]},"P24":{"sents":["接下来进入 L9 阶段，也就是赛事履约阶段。","本阶段核心就是赛事履约、考务提醒，这个阶段非常关键。"," 已经报名赛事的家长，心里是期待孩子拿到更好成绩的，毕竟他们在第一阶段已经体验过；","还有一部分家长还在观望。","我们要用落地的服务、孩子真实的课堂表现，给到家长信心。","这里大家一定要记住一条：不能因为家长没有报名赛事，就区别对待孩子。\n","整个阶段我们分四大板块同步推进： 第一，赛事履约课。","按时上好赛事直播课，带着孩子做赛考专项训练。","给大家一个小建议：哪怕孩子没有报名赛事，也可以正常参与专项练习。","我们这一块的目标，一方面提升参赛孩子的通过率，另一方面兑现之前跟家长承诺好的全套赛事配套服务。\n","第二，落实全部考务确认工作。","提醒家长提前检测设备、考试环境，准考证、考试入口、操作要求等细节逐一同步到位。","有些家长之前参加过赛事，流程比较熟悉；","还有一类是第一阶段没参赛，经过咱们沟通这次才报名的家长，这类我们要重点关注，多跟进。\n","第三，组织学员参加赛考，考前做好预期管理，考后及时私信运营跟进家长。","不要一味拉高期待，帮孩子和家长放平心态。","尤其是平时训练成绩不算突出的孩子，一定要提前降低预期，跟家长传递清楚：参与本身也很有价值，提前做好结果层面的预期管理。\n","第四，稳住主线日常行课。","千万不要因为备战赛事，把主线课程落下。","课前、课中、课后的标准化动作照常推进，赛事辅导和常规学习两头兼顾，守住咱们的完课率。\n","总结一下：L9 是兑现赛事服务承诺的阶段，我们不能只盯着考试。","常规课、赛事辅导双线并行，让家长实实在在看到服务和成果。"],"durs":[4.536,5.928,8.28,2.688,5.592,6.6,5.736,5.304,6.816,9.768,3.408,9.096,4.536,9.12,8.088,4.704,12.408,3.144,4.344,9.576,6.672,6.6]}},"v":{"slides/P01.png":"01940885","slides/P02.png":"f756247e","slides/P03.png":"89cfc3ae","slides/P04.png":"8fe89b0e","slides/P05.png":"ea4f6e86","slides/P06.png":"bf3674ae","slides/P07.png":"c6d8c6d6","slides/P08.png":"96ca48a5","slides/P09.png":"239abfac","slides/P10.png":"9351369d","slides/P11.png":"efdbb87f","slides/P12.png":"efdbb87f","slides/P13.png":"71e83438","slides/P14.png":"87e325f0","slides/P15.png":"89c2334c","slides/P16.png":"738fdb60","slides/P17.png":"becb94b4","slides/P18.png":"678c7975","slides/P19.png":"fe71b3cb","slides/P20.png":"9e52f6c0","slides/P21.png":"b97c93f9","slides/P22.png":"dec3e4c7","slides/P23.png":"f65347fe","slides/P24.png":"55944b88","slides/P25.png":"809e8a38","slides/P26.png":"152747e3","slides/P27.png":"577656ed","slides/P28.png":"827ae8c2","slides/P29.png":"510e0f12","slides/P30.png":"cab20940","slides/P31.png":"f837c162","slides/P32.png":"ac79e0ca","slides/P33.png":"ae7499f9","slides/P34.png":"37207f7b","slides/P35.png":"3a634642","slides/P36.png":"81c0c215","slides/P37.png":"ec587939","slides/P38.png":"aed0b617","slides/P39.png":"22f00df5","slides/P40.png":"2d63ad2e","slides/P41.png":"549d9275","slides/P42.png":"8f880d89","slides/P43.png":"9c48a28b","slides/P44.png":"0c55cb0d","slides/P45.png":"b20bc04d","audio/P01.mp3":"c0f87019","audio/P02.mp3":"02bacf0a","audio/P03.mp3":"4c77fa62","audio/P04.mp3":"fcf11b74","audio/P05.mp3":"8f5c818f","audio/P06.mp3":"1412179f","audio/P07.mp3":"e441fa58","audio/P08.mp3":"e64aff2b","audio/P09.mp3":"dd6dc4bc","audio/P10.mp3":"da3d4cfd","audio/P11.mp3":"92a9c450","audio/P12.mp3":"a1b4ab48","audio/P13.mp3":"79f7a211","audio/P14.mp3":"fb0bdfb3","audio/P15.mp3":"8a1f233a","audio/P16.mp3":"424ae86d","audio/P17.mp3":"e6d3b750","audio function post(url, body){

/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；

let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){

  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);

    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}

          <p class="rule" id="formMsg" hidden></p>
          <button class="btn" type="submit">开始学习</button></form>`}
      <p class="rule" id="resetMsg" hidden></p>
    </div>
  </section>
  ${loopHTML(-1)}
  ${mapHTML(-1)}
  <section class="card"><h3 style="font-size:16px;margin-bottom:8px">上课须知</h3>
    <ol class="steps">
      <li>请打开声音。每页 PPT 配有老师讲解，字幕同步显示讲解原文。</li>
      <li>当前页讲完才能进入下一页；切到别的窗口会自动暂停。</li>
      <li>带 ✎ 的页面讲完会弹出互动题，答错可能需要重听本页。</li>
      <li>阶段小测 5 题，答对 ${Math.ceil(5*PASS)} 题及以上过关；未过关需重学本阶段后再测。</li>
      <li>全部阶段过关后，解锁本章综合测试（${FINAL.length} 题）。</li>
      <li>你的姓名、职场、各页学习时长和测试成绩会同步给培训老师。</li>
    </ol></section>`;
  bindCommon();
  const f = $('#nameForm');
  if (f) f.onsubmit = e => { e.preventDefault();
    const v = $('#nm').value.trim(); const pick = n => [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x => x.value);
    let t = '', extra = '';
    if (CFG.depts) {
      const ds = pick('dept'), ks = pick('sku'), m = $('#formMsg');
      if (!v || !ds.length || !ks.length) { m.hidden = false; m.textContent = '请填写姓名，并至少选择一个部门和一个 SKU。'; return; }
      st.depts = ds; st.skus = ks; t = ds.join('、'); extra = `｜部门：${ds.join('、')}｜SKU：${ks.join('、')}`;
    } else { t = $('#tm').value.trim(); if (!v || !t) return; }
    st.name = v; st.team = t; buildStages();
    if (!STAGES.length) { const m = $('#formMsg'); m.hidden = false; m.textContent = '你选择的部门 / SKU 暂时没有对应课件，请确认后重新选择。'; st.name = ''; st.depts = st.skus = null; buildStages(); return; }
    save();
    report({event:'进入课程', detail:'首次进入' + extra}); startStage(0); };
  const r = $('#resume'); if (r) r.onclick = () => { report({event:'进入课程', detail:'继续学习'}); startStage(Math.min(st.unlocked, STAGES.length-1), true); };
  const c = $('#cert'); if (c) c.onclick = () => showQuiz('final');
  const x = $('#reset'); if (x) x.onclick = () => {
    if (x.dataset.armed){ st = fresh(); save(); buildStages(); render(); return; }
    x.dataset.armed = 1; x.textContent = '再点一次确认清空记录';
    const m = $('#resetMsg'); m.hidden = false; m.textContent = '清空后本机的学习进度和成绩都会删除。';
  };
}

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function renderLearn(autoplay){
  const s = curStage(), p = curPage();
  const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const heard = !!st.heard[p.p];
  $('#app').innerHTML = `${headerHTML()}
  ${mapHTML(st.cur.s)}
  ${loopHTML(0)}
  <div class="stage-head"><h2>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}　<span class="muted" style="font-weight:400;font-size:15px">${p.p} ${esc(p.topic)}</span></h2>
    <span class="time">第 ${st.cur.p+1} / ${s.pages.length} 页</span></div>
  <div class="slide">${p.video?`<video id="vd" src="${VU(p.video)}" poster="${VU('slides/'+p.p+'.png')}" controls playsinline preload="metadata" style="width:100%;max-height:70vh;display:block;object-fit:contain;background:#000"></video>`:`<img src="${VU('slides/'+p.p+'.png')}" alt="${esc(p.p+' '+p.topic)}">`}
    <div class="veil" id="veil" ${autoplay?'hidden':''}><button class="btn" id="veilBtn">▶ 点击播放讲解</button></div></div>
  <div class="sub" id="sub" aria-live="polite">${esc(tm.sents[0].trim())}</div>
  <div class="bar">
    <button class="btn ghost" id="prev" ${st.cur.p===0?'disabled':''}>上一页</button>
    <button class="btn" id="pp">播放</button>
    <button class="btn ghost" id="again">重听本页</button>
    <div class="prog" aria-hidden="true"><div id="progfill"></div></div>
    <span class="time" id="time">0:00 / ${fmt(total)}</span>
    <div class="speed" role="group" aria-label="语速">${[1,1.25,1.5].map(r=>`<button data-r="${r}" class="${r===rate?'on':''}">${r}x</button>`).join('')}</div>
    <button class="btn" id="next" ${heard?'':'disabled'}>${st.cur.p===s.pages.length-1?(s.quiz.length?'去做阶段小测':'完成本阶段'):'下一页'}</button>
  </div>
  <div class="dots">${s.pages.map((pg,i)=>`<button class="dot ${st.heard[pg.p]?'heard':''} ${i===st.cur.p?'now':''} ${pg.interact?'q':''}" data-pg="${i}" ${(st.heard[pg.p]||i===st.cur.p)?'':'disabled'} title="${esc(pg.topic)}">${pg.p}</button>`).join('')}</div>
  <details class="full"><summary>展开本页讲解全文</summary><p>${esc(p.script)}</p></details>`;
  bindCommon();
  au.src = VU('audio/'+p.p+'.mp3');
  au.currentTime = 0; lastT = 0;
  report({event:'进入页面', stage:stageLabel(st.cur.s), page:p.p, detail:p.topic});
  $('#veilBtn').onclick = play;
  { const v = $('#vd'); if (v) v.onplay = () => au.pause(); }
  $('#pp').onclick = () => playing ? au.pause() : play();
  $('#again').onclick = () => { au.currentTime = 0; play(); };
  $('#prev').onclick = () => goPage(st.cur.p-1);
  $('#next').onclick = () => nextPage();
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => goPage(+b.dataset.pg));
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rate = +b.dataset.r; au.playbackRate = rate;
    document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on', x===b)); });
  if (autoplay) play();
}
function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});
  showQuiz('final');
}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`});
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
