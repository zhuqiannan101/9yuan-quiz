<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>QC 课导工作流</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */
:root{
  --bg:#f7f4f0; --surface:#ffffff; --ink:#24201c; --muted:#76695e; --line:#e7ddd3;
  --brand:#f06a1d; --brand-soft:#fde9dc; --brand-ink:#b84a0c;
  --ok:#1f8a5b; --ok-soft:#e1f3ea; --bad:#c8402f; --bad-soft:#fbe5e1;
  --sub-bg:#2a221c; --sub-fg:#fff7ef;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Space Grotesk","DIN Alternate","Segoe UI",var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c17; --ink:#f2ebe4; --muted:#ab9d90; --line:#3a3029;
  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;
  --ok:#4fc28c; --ok-soft:#173327; --bad:#ef7a69; --bad-soft:#3a1d18;
  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.btn{background:var(--brand);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}

/* 顶栏 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand .tag{font-size:12px;letter-spacing:.08em;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
.who{font-size:13px;color:var(--muted)}

/* 闭环口号 */
.loop{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.loop span{white-space:nowrap}
.loop span.on{color:var(--brand-ink);font-weight:700}
.loop i{font-style:normal;opacity:.5}

/* 关卡图 */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.node .k{font-size:11px;letter-spacing:.08em;color:var(--muted)}
.node .t{font-weight:700;font-size:14px}
.node .s{font-size:12px;color:var(--muted)}
.node.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.node.pass .s{color:var(--ok);font-weight:600}
.node.lock{opacity:.5}
@media (max-width:640px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}.node:last-child{grid-column:1/-1}}

/* 播放器 */
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:18px}
.slide{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain}
.veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.55)}
.veil button{font-size:17px;padding:14px 26px}
.sub{background:var(--sub-bg);color:var(--sub-fg);border-radius:12px;padding:14px 18px;min-height:76px;font-size:17px;line-height:1.7;white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.prog div{height:100%;background:var(--brand);width:0}
.time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{font-family:var(--f-num);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.dot.heard{color:var(--ink)}
.dot.now{background:var(--brand);border-color:var(--brand);color:#fff}
.dot.q::after{content:" ✎"}
details.full summary{cursor:pointer;color:var(--muted);font-size:13px}
details.full p{white-space:pre-wrap;margin:8px 0 0}
.speed{display:flex;gap:4px}
.speed button{padding:6px 10px;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--brand-ink);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;color:var(--ink)}
.opt b{font-family:var(--f-num);color:var(--brand-ink);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* 小测 */
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.rule{font-size:13px;color:var(--muted)}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}
</style>

<script>
const DATA = {"pages":[{"stage":"工作流·阶段1","p":"P01","topic":"开场提问","script":"这是咱们培训的第二节课。正式开始之前，先和大家探讨一个问题：新班刚接过来的第一周，当你打开电脑，第一件事要做什么？我再问大家，接班第一周必须完成的工作一共有几件？哪一件没做到位，会直接造成后续学员流失？很多人一时答不上来。给大家举个生活里的例子，点外卖的完整流程：1. 打开 APP 挑选菜品 2. 下单支付 3. 商家接单、备餐 4. 骑手接单取餐 5. 骑手配送 6. 用户收餐确认。每一步都有先后顺序，完成上一步，才会触发下一步；不同角色负责不同环节，信息、物品从一个环节流转到下一环。这就是一套工作流。如果缺少这套流程，就会出现没人接单、没人取餐，整个事情直接卡住的情况。今天要讲的工作流，就是帮大家解决「什么时候该干什么」的问题，保证关键工作一件都不漏。今天我们的主题是 ——QC 课导工作流。这套工作流专门针对课导岗位打造，从接班一直到结课，每一步该做什么、重点抓哪些内容，都会给大家讲透彻。不管你是教培新人，还是已经带过好几期班级的老课导，今天这节课都能帮大家梳理清楚工作，把服务做得更扎实。","interact":null},{"stage":"工作流·阶段1","p":"P02","topic":"内容框架","script":"先看一下今天的整体框架，一共四个板块。第一块，课导价值 —— 我们先搞明白，课导这份工作到底为什么重要，价值落在哪里？第二块，带班期全流程概览，给大家一张带班的全景图，知道整个带班周期是怎么运转的，每个节点做什么？怎么做？工作的重点在哪里？避免大家一腔热血去做了，但是拿不到想要的效果；第三块，七大阶段重点，这也是今天这节课的核心，会把每个阶段的工作目标、关键动作逐一拆解，让大家对于带班这件事有一个清晰的认知；第四块，成果验证 ——用真实数据和战绩说话，看看做好了能拿到什么结果。四个板块，从认知到方法再到结果，我们一步步一起来看一下。","interact":null},{"stage":"工作流·阶段1","p":"P03","topic":"课导价值","script":"首先进入第一个板块课导价值导向。家长问：老师，我家孩子在家也没见他写代码啊，这课到底学了个啥？如果你是这个课导，你怎么回？我们有很多回答方式，但核心就一件事，家长看不见孩子在屏幕前干了什么，你的工作就是把看不见的过程变成看得见的进步。你发的每一条反馈、改的每一次作业、打的每一个电话，都是在帮家长看见孩子的成长。这就是课导最核心的价值。我们展开讲。很多课导刚上手的时候，会觉得自己的工作就是盯孩子上课、给孩子改作业，催家长缴费，难道我们只盯上课改作业，家长就会续报吗？当然不是的。实际上，课导老师在整个带班过程中不仅仅是要完成这些内容，课导这个角色在整个业务链条里的分量，远比想象的要重。我们先把我们自己作为课导价值这件事想明白，后面的所有动作才有根。","interact":null},{"stage":"工作流·阶段1","p":"P04","topic":"价值三层","script":"做好课导工作，价值最终落到三个层面身上。第一个层面，对家长。刚刚我们也提到，家长看不见孩子在屏幕前干了什么，你的工作就是把看不见的过程变成看得见的进步。那对家长而言，孩子上课有人盯，进步看得见，家长认可你，自然愿意续报。相反，如果你不反馈、家长发现不了孩子的变化，孩子的进步家长看不见，一学期下来家长觉得没收获，后面就不配合了。第二个层面，对公司而言。我们想一下，如果你是老板，你主要靠什么来维持收益，是续报和客户。公司的每一个用户都是有成本的，前期投入很大，这个用户如果不能持续学习，或者中途退费，相当于前期投入都打水漂了。用户的完课率、续报率需要我们守住，各项工作环环相扣。第三个层面，对自己。同样的道理，我们和公司是利益共同体。做好了，续报率就是你的绩效和晋升依据，最后直接体现在你自己的收入和履历上；做差了，续报只能靠运气，收入和能力都很难提升。所以这是一个正循环，服务好家长，家长续报，公司业绩稳定，你的续报率带来绩效和晋升，你就更有动力把服务做好。这个循环转起来，三方共赢；转不起来，三方都输。","interact":{"q":"做好课导工作，只对课导自身有价值？","options":["对","错"],"answer":1,"vote":false,"wrong":"重讲本页重触发","at":"P04"}},{"stage":"工作流·阶段1","p":"P05","topic":"价值链条","script":"那课导的核心价值具体是什么？一句话，不仅是完成课程，而是让家长看到看得见的进步。大家想一个问题，现在的家长会时时刻刻陪在孩子身边上课吗？不会。所以就产生了一个问题，孩子在屏幕前学了什么、写了什么代码、做了什么作品，家长其实是看不见的。所以我们的工作，就是把这个看不见的过程，变成家长能看见的效果。结合实际的带班场景，整个链条是这样的，孩子在学，上课、写代码、做作品，但家长看不见过程；那课导可以做什么？记录，到课、作业、作品、课堂表现，我们把这些数据记下来；课导翻译，通过课后反馈、阶段报告，把冷冰冰的代码翻译成孩子的成长和变化；家长感知，家长看到后会想孩子真的变了，这钱花得值；最后是续报决策，家长自己得出结论，愿意继续投入。这里有一个关键判断，我们能直接影响的，是中间两步，记录和翻译。这两步做扎实了，续报是自然而然的结果；跳过这两步，即使你说的天花乱坠，没有这个步骤，任何话术、任何方法都救不回来，家长会觉得这个学费花的不值得。","interact":{"q":"孩子学→课导做什么→家长感知→续报，课导能直接掌控的是哪两步？","options":["记录＋翻译","上课＋写代码","家长感知＋续报决策","催费＋追单"],"answer":0,"vote":false,"wrong":"仅弹正确提示继续","at":"P05"}},{"stage":"工作流·阶段1","p":"P06","topic":"带班基本信息","script":"在正式带班之前，先把科特算法带班的基本信息对齐一下。班型是科特线班级，带班周期半年。具体带班时间是周四晚上七点、周五晚上七点、周六晚上七点，每人分配两个时间段。班级人数方面，一个课导带两个班级。用户来源是前课导续报上来的，用户特点是已经上过一期图形化课程。课时安排是每个Level前三周每周一次课，一次两个课时，第四周两次课，一共四个课时。这些基本信息大家心里有数，后面讲流程的时候就知道每个动作对应的是多大的工作量、什么样的用户。","interact":{"q":"科特带班每个 Level 的课时结构是？","options":["前三周每周一次课（一次两课时），第四周两次课（共四课时）","每周两次课，共八课时","前三周每周两次课，第四周一次课","每周一次课，一次一课时"],"answer":0,"vote":false,"wrong":"重讲本页重触发","at":"P06"}},{"stage":"工作流·阶段2","p":"P07","topic":"全流程概览引入","script":"基本信息大家心里有数了，带多少人、带多久、什么时候上课、用户是什么基础，这些我们都对齐了。知道了这些，我们是不是就知道这半年该怎么干了？肯定还不够。你知道自己带100多个孩子、带半年，但这半年里，哪个月该干什么、哪个节点必须冲、哪个阶段重点抓什么，很多人是模糊的。很多课导都会产生一个误区，开班了忙着接孩子，中间忙着改作业，快到续报了才想起来要跟家长谈，结果手忙脚乱，效果还不好。大家要明白，带班这件事，不是走一步看一步，是一开始就要把整张地图摊开，知道自己现在在哪、下一步去哪、终点在哪。所以接下来这个板块，就给大家一张全景图，带班期全流程概览。从接班到结课，整个半年的时间轴上铺开来，每个阶段在什么时候、关键节点是什么、重点抓什么，一张图给你讲明白。","interact":null},{"stage":"工作流·阶段2","p":"P08","topic":"七阶段时间轴","script":"这就是课导工作的全景时间轴。整个带班周期可以沿着这条时间轴分成七个关键阶段。首先是接班期，持续 3 周，这个阶段的关键动作是轨迹探查、首通电访、见面会和家长会。接着进入 LEVEL 7，也就是试学阶段，持续 4 周，也叫小灶阶段。之后到 LEVEL 9，进入等考履约阶段。再往后是 LEVEL 10 和 LEVEL 11，其中 LEVEL 10 要完成等考考试，并启动续报预热电访；LEVEL 11 进入续报阶段，对应 L11-2 到 L11-4。最后到 LEVEL 12，有国赛或白名单赛试，同时做好用户维稳，之后结课。带班的时候不要只盯着眼前一次课或一次作业，而要先看清这张地图：你现在在哪个阶段，接下来要进入哪个节点，这个阶段重点该抓什么。稍后会把这七个阶段拆开来讲。","interact":{"q":"带班全周期的第一阶段及其周期是？","options":["接班期，3 周","L7 试学阶段，4 周","L9 等考履约阶段","L11 续报阶段"],"answer":0,"vote":false,"wrong":"仅弹正确提示继续","at":"P08"}},{"stage":"工作流·阶段2","p":"P09","topic":"七种家长心态","script":"在做任何运营动作之前，要先知道这个阶段的家长心里到底在想什么。心态摸准了，一句话顶十句；心态摸不准，说再多都是反效果。我们一起来看这张表。\n接班期，也就是前 3 周，家长对新老师信任度不高，最焦虑的是老师是否了解自己家孩子。这个阶段我们不要急着推动作，先把信任建立起来，多听家长说，多安抚家长的不安。\n进入 L7，也就是 4 周的试学阶段，家长已经对比过上阶段老师的服务，也在观察孩子的状态有没有变化。这个阶段家长心里的问题是：新老师行不行，孩子能不能跟上。所以我们的重点不是提前谈续报，而是给家长安全感，让他看到孩子在适应、在进步。\n到了 L8，家长开始对赛事价值有认知，也会权衡是否再次报考。这个时候家长关心的不是课程本身，而是报赛到底值不值得。我们要做的不是硬推，而是帮家长判断孩子是不是适合报赛、报赛能拿到什么结果。\n进入 L9，家长期待比上次更好的成绩，也会关注孩子后续要不要报名观望。这个阶段家长更看重结果和确定性，我们要用孩子的课堂表现、作业情况和阶段成果来说话，让家长看到投入是有回报的。\n到了 L10，家长进入续报考虑期，会开始思考 Python 要不要继续学。这个时候家长不是不信任老师，而是在做成本和收益判断。我们要提前铺垫孩子的成长变化，让续报成为自然延续，而不是突然销售。\nL11 是关键决策期，家长心里最直接的问题就是：要不要交钱，要不要持续报课。这个阶段动作要更聚焦，围绕家长最关心的问题做沟通，明确告诉他继续学下去的价值是什么。\n最后到了 L12，家长容易出现结果焦虑，也会有退费风险，对追单特别敏感。这个阶段越催反而越容易引起反感，所以最重要的是稳，稳定家长情绪，稳定孩子学习状态，把结果收口做好。\n七个阶段，七种心态。我们的工作节奏必须跟着家长的心理走，而不是自己想干什么就干什么。","interact":null},{"stage":"工作流·阶段3","p":"P10","topic":"板块三引入","script":"好，接下来进入今天最核心的板块，七大阶段重点。从接班期到 L12，每个阶段都会给大家讲清楚阶段目标、核心动作、沟通重点和需要避开的坑，方便大家直接落地执行。我们先从第一个阶段接班期开始。","interact":null},{"stage":"工作流·阶段3","p":"P11","topic":"阶段一・接班期","script":"第一个阶段，接班期，周期 3 周，核心目标是防流失、建信任。 这个阶段有四件事必须做。第一件，扒轨迹。我们想一下，接到学员之后，如果直接打电话，面对的就是一个模糊的家长画像。扒轨迹，就是了解学员上阶段的学习情况，理清报名动机，排查风险学员，提前做好介入。 第二件，打首通。第一次电话沟通，用来建立情感连接，介绍课程和服务，确认报名动机，明确学期安排。首通沟通做好了，后面整个学期的沟通基础就能打牢。家长对老师第一印象好，自然也愿意配合。 第三件，见面会。通过见面会拉近师生关系，提升孩子的兴趣度，提高学员的开课期待值，同时回扣直播课程模式。 第四件，家长会。向家长同步学习规划，建立信任，明确预期。这四件事做好了，学员和家长的粘性就能建立起来，后续流失率自然降低。接班期是整个带班周期的地基，地基打牢了，后面的工作才稳。","interact":{"q":"哪一项不是接班期（前 3 周）必须完成的动作？","options":["扒轨迹","打首通","见面会＋家长会","小灶课全覆盖"],"answer":3,"vote":false,"wrong":"重讲本页重触发","at":"P11"}},{"stage":"工作流·阶段3","p":"P12","topic":"阶段二・L7 试学期","script":"第二个阶段，L7 试学期，周期 4 周，核心目标是给家长吃定心丸，帮孩子建立学习习惯，同时预防流失。 这个阶段重点抓四件事。第一，三大工作流程，覆盖开课前、开课中、开课后，完成日常行课全流程覆盖，这部分后面页面会详细展开。 第二，日常沟通反馈。这里有一条硬规矩，未回复的家长必须电话跟进，确保家校沟通不断档。发了消息家长没回，不代表家长没有问题，很可能是没有看到或者不知道怎么回复。这个时候主动打电话，既能体现责任心，也能及时发现潜在问题。 第三，小灶课。L7 阶段小灶课要做到全覆盖，夯实学员的学习意愿，不让任何一个孩子在起步阶段掉队，同时防范退费。针对风险学员，在小灶课上多互动，外化展示孩子的学习状态。 第四，硬件随材。重点做好两件事，一是流失预判，通过随材使用情况识别潜在流失学员；二是跟家长讲清楚随材扣费规则，避免后期因为扣费产生纠纷。 L7 是巩固家长和孩子信任的关键期，这个阶段把服务做细，后面的续报工作才能水到渠成。","interact":null},{"stage":"工作流·阶段3","p":"P13","topic":"日常行课全流程","script":"专门来讲一下日常行课的全流程，分为开课前、开课中、开课后三个环节。开课前，要做三件事：确认到课、备课、课前直播。确认到课就是提前摸清学员出勤情况，清楚哪些孩子正常上课、哪些可能缺席，对不到课的学员及时跟进；备课就是提前吃透本节课内容，把握重点难点，完成后台备课操作，上传辅助提示、批改模板，这也是我们的质检项目；课前直播需要提前进入直播间，做好各项准备，课前直播也是和孩子互动很有效的方式，调动孩子上课积极性。\n开课中，同样有三件核心工作：课中反馈、课上连麦、后台答疑。课中反馈，实时把孩子课堂上的表现同步给家长；课上连麦，鼓励孩子主动参与互动，提升课堂参与度；后台答疑，及时响应孩子和家长在课堂上提出的各类问题。\n开课后，核心工作是课后反馈、课后作业批改，错题作业要单独反馈，同时配套小灶直播课做补充辅导。\n课程分为软件课、硬件课和赛事课，思维线课程不适用这套流程。不同课程在行课细节上会存在差异，但软件、硬件、赛事课的基础流程是统一的。大家要记住，日常行课是课导工作的基本面，这个流程落实扎实，带班质量就有保障。","interact":null},{"stage":"工作流·阶段3","p":"P14","topic":"阶段三・L8 招报预热","script":"第三个阶段，L8 招报预热，核心目标是招报预热加赛考联报。这个阶段重点抓四件事。\n第一，招报预热前，开展赛事小测。通过 1V1 或者 1Vn 的讲题小灶课，铺垫赛考认知，让孩子提前接触赛考题型，也让家长看到孩子在赛事方向上的潜力。\n第二，赛考招报电访。要在 L8-4 前完成规划电访，并且上传 SOP。电访的目的，是帮家长明确赛事路径，确认报考意愿。很多家长对编程赛事并不了解，我们要帮他理清楚有哪些赛事、什么时候考、参赛有什么价值，以及孩子适合报考哪一项。\n第三，赛考联报。启动赛考联报，引导学员参与赛事，辅助家长完成报名，阐明赛考安排，提高招报率。\n第四，日常行课不能中断。持续做好日常教学反馈，保持学员学习节奏，提高完课率。\n大家记住，赛考并不是额外的负担，而是孩子学习成果的展示机会，也是家长感知课程价值、支撑后续续报的重要抓手。赛事招报就相当于一次小续报，赛招率高，往往续报率也会更高。","interact":null},{"stage":"工作流·阶段3","p":"P15","topic":"阶段四・L9 赛考履约","script":"第四个阶段，L9 赛考履约，核心目标是赛考履约加考务提醒。 这个阶段重点抓四件事。第一，赛事课履约。开设赛事直播课，针对赛考题型做专项训练，提升通过率。赛事课质量直接关系孩子能否拿到赛事成绩，一定要盯紧学员到课情况和听课效果。\n第二，赛考辅导。开展赛前集中辅导，帮孩子熟悉考试内容与流程，落实全部考务动作，完成报名确认、准考证核对、考试设备调试等工作，一项都不能遗漏。\n第三，参加赛考。组织学员参与赛事。考前做好预期管理，不要跟家长承诺一定能拿奖，可以告诉家长我们会全力准备，重在参与、积累经验。这样考出好成绩就是惊喜，结果不理想家长也更容易接受。考完之后做好私信运营，无论成绩如何，单独和家长沟通，肯定孩子的付出，总结经验，规划后续学习。\n第四，日常行课。正常推进教学进度，兼顾赛考备考和常规学习，提升完课率。\nL9 阶段的关键词就是履约，已经报名参赛的学员，要保障全员参加考试，这是我们对家长最基本的承诺。加分项就是尽可能帮助孩子顺利通过赛事，把不会的题目讲解清楚。","interact":null},{"stage":"工作流·阶段3","p":"P16","topic":"阶段五・L10 续报预热","script":"第五个阶段，L10 续报预热，核心目标：等考考试 + 续报预热。 这个阶段重点抓四件事。第一，等考考试。在 L10-1 或 L10-3 组织学员参加等考，检验阶段性学习成果。等考成绩出来后，就是我们和家长沟通续报最好的抓手。\n第二，续报预热电访。启动预热电访，和家长沟通下一阶段学习规划，建立家长的续报认知，提前处理家长不续报的异议。大家要注意，预热电访不是直接催费，核心是铺垫沟通，让家长提前做好心理准备。\n第三，等考成绩查询。成绩出来后第一时间向家长展示学习成果，用真实的数据增强家长续报信心。孩子考得好，可以跟家长说：“你看，这一阶段学习效果很明显，下一个阶段我们可以挑战更高目标。” 如果成绩不理想，可以这样沟通：“这次考试暴露出一些薄弱点，正好在下一阶段针对性补齐。”\n第四，日常行课。持续保持教学质量，做好阶段收尾和学习过渡，提升完课率。L10 是续报的前奏，前奏铺垫到位，到 L11 正式续报阶段沟通就会更加顺畅。","interact":{"q":"续报预热电访的核心目的是？","options":["铺垫沟通，聊下一阶段规划、提前处理不续报的异议","直接催家长交费","通知优惠截止时间","确认孩子是否退课"],"answer":0,"vote":false,"wrong":"重讲本页重触发","at":"P16"}},{"stage":"工作流·阶段3","p":"P17","topic":"阶段六・L11 续报","script":"第六个阶段，L11 续报阶段，核心目标就是正式续报，时间节点在 L11-2 或 L11-4。这个阶段是整个带班周期的关键战役，重点抓四件事。\n第一，正式续报。在 L11-2 或 L11-4 这两个节点全力推进续报转化，该打电话打电话，该发消息发消息，需要一对一沟通就一对一沟通，这个阶段必须全力冲刺。\n第二，续报跟进。逐一跟进还没有续报的学员，摸清家长的顾虑，是价格、学习效果、时间冲突，还是其他原因，再针对性解决。不要家长一说 “再考虑考虑” 就停下跟进，很多时候家长只是需要我们再推一把。\n第三，政策解读。给家长清晰解读续报政策，包含优惠力度、班次安排、上课时间等内容，信息传递到位，家长做决策才会更快。\n第四，日常行课。续报期间教学绝对不能松懈，依靠教学质量驱动续报。家长看到我们越到后期依旧认真负责，才更愿意继续让孩子跟着我们学习。\nL11 是出结果的阶段，前面所有的积累与铺垫，都会在这个阶段兑现落地。","interact":null},{"stage":"工作流·阶段3","p":"P18","topic":"阶段七・L12 用户维稳","script":"第七个阶段，L12 用户维稳，这是带班周期的最后一个阶段，核心目标是维稳 + 防退费追单。\n这个阶段重点抓四件事。第一，国赛 / 白赛考试。组织学员参加国赛、白名单赛事考试，冲刺高阶奖项。这是孩子整个学习周期的高光时刻，也是给到家长最后的学习交付。\n第二，防退费。重点关注存在退费风险的学员，及时介入维稳。L12 阶段家长很容易产生焦虑，看到其他学员续报、或是孩子考试结果不理想，都有可能产生退费想法。这时我们要主动沟通、做好安抚，提前化解潜在问题。\n第三，追单。针对尚未续报的学员开展最后追单，抓住最后的转化机会。追单要讲究方式方法，不要强行施压，站在家长视角帮他分析利弊，由家长自主做选择。\n第四，结课过渡。做好结课与学习过渡，圆满完成整个带班周期。就算学员最终没有续报，我们也要善始善终，给家长和孩子留下好印象，口碑就是这样积累出来的。L12 是收尾阶段，收尾工作做好，整个带班周期才算圆满落地。","interact":null},{"stage":"工作流·阶段4","p":"P19","topic":"板块四引入","script":"七大阶段讲完了，接下来进入第四个板块 —— 成果验证。前面讲了这么多方法和流程，大家可能会问：这些动作真的有用吗？落地之后能不能拿到结果？接下来我们就用真实数据和带班战绩来展示，把课导工作做扎实，可以收获什么样的成果。","interact":null},{"stage":"工作流·阶段4","p":"P20","topic":"武汉铁军喜报","script":"我们一起来看看武汉铁军的喜报。这是我们武汉团队在招报以及续报战役中拿到的成绩。我们的课导就是严格按照我们今天讲的工作流来执行的，从接班期的首通电访，每一步都走得很扎实，最后拿到了这样的喜报。说明工作流不是纸上谈兵，是真刀真枪打出来的经验，照着做，你也能出成绩。","interact":null},{"stage":"工作流·阶段4","p":"P21","topic":"暑 1 科特 S 低招报战绩","script":"我们一起来看武汉铁军暑 1 科特 S 低招报战绩。 武汉铁军，拿下 TOP 学部，招报率 69.40%； 杰瑞大组获评 TOP 大组，招报率同样 69.40%； 肉肉小组获评 TOP 小组，招报率 73.56%； 桑林怡拿下 TOP 个人，个人招报率 74.79%。\n从学部到大组、再到小组和个人，层层都跑出了高数据。能实现这样自上而下的全面出彩，靠的就是整个团队做事细致。每个课导严格落地整套带班流程，节点动作不打折扣，把学员跟进、学情服务做细做到位。这也证明，标准化工作流坚持落地，从团队到个人，都能拿到亮眼的招报成果。","interact":null},{"stage":"工作流·阶段4","p":"P22","topic":"暑 1 思维 S 招报战绩","script":"再看一组—— 暑 1 思维 S 的招报战绩。TOP 学部依旧是墩墩老师带领的武汉铁军；TOP 大组是刘德政带领的陆宸大组；大组内，TOP 小组是子杰带领的子杰组；TOP 个人是肖海亮。这些团队和个人，都是在招报战役中脱颖而出的佼佼者。他们的共同点是什么？就是课导工作做得细、做得实。大家后续带班过程中可以去对标一下，看看自己在哪个环节还有差距，是首通打得不够好，还是日常反馈不够及时，还是续报跟进不够到位。找到差距，补上，下一次上榜的可能就是你。","interact":null},{"stage":"工作流·阶段4","p":"P23","topic":"春 8 续报战绩","script":"我们再来看看春 8 期的续报战绩。科特 S 学部王者军团，是墩墩张祥老师带领的武汉基地，端端续报 69.32%；科特 S 个人单期战神是陈志文，端端续报 77.98%；思维 S 个人单期战神是郑佳炜，端端续报 69.44%。能拿下这么高的续报数据，核心就是他们坚持全周期做好学员经营，不等到续报期才临时发力。大家可以对照参考，复盘自己带班时的学情维护、阶段性成果交付有没有做到位。把日常服务做扎实，续报自然能拿到理想结果。","interact":null},{"stage":"工作流·阶段4","p":"P24","topic":"回顾与结语","script":"我们来回顾一下：从课导价值的认知，到带班全流程全景，再到七大阶段每个节点的重点动作，最后用真实的战绩做成果验证。希望大家把今天学到的内容带回工作里，一步一个脚印落地执行。课导这份工作，没有捷径，就是把每一件小事做扎实、服务好每一位家长、跟进好每一个孩子。最后送给大家八个字，也是咱们 9 元团队的 slogan—— 攻无不克，使命必达。祝愿大家在后续带班中，都拿下满意的成绩！","interact":null},{"stage":"工作流·阶段4","p":"P25","topic":"调研问卷","script":"接下来，请大家拿出手机，扫描屏幕上的二维码，填写这份《工作流程》调研问卷。欢迎大家写下今天培训最真实的感受，不管是收获、疑问，还是后续希望补充的内容，都可以写在问卷里。大家的反馈，也是我们持续优化培训内容的重要依据。感谢各位！","interact":null}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"工作流・阶段 1","q":"课导这份工作最核心的价值是什么？","options":[{"k":"A","t":"盯孩子上课、给孩子批改作业"},{"k":"B","t":"提醒家长缴费、完成续报"},{"k":"C","t":"把家长看不见的学习过程，变成家长能看得见的进步"},{"k":"D","t":"保证班级的完课率数据达标"}],"answer":"C","back":""},{"id":"T-S02","type":"阶段练习题","chapter":"工作流・阶段 1","q":"在 “学习 — 记录 — 翻译 — 感知 — 续报” 这条价值链条中，课导能够直接发力、直接影响的是哪两步？","options":[{"k":"A","t":"上课、写代码"},{"k":"B","t":"记录、翻译"},{"k":"C","t":"家长感知、续报决策"},{"k":"D","t":"续报、缴费"}],"answer":"B","back":""},{"id":"T-S03","type":"阶段练习题","chapter":"工作流・阶段 1","q":"课导工作的价值只体现在家长层面，与公司收益、个人绩效晋升无关。【判断】","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":""},{"id":"T-S04","type":"阶段练习题","chapter":"工作流・阶段 1","q":"科特算法班级的带班周期为半年，一个课导需要带两个班级，带班时间从周四晚七点、周五晚七点、周六晚七点这三个时段中分配两个给每位课导。【判断】","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":""},{"id":"T-S05","type":"阶段练习题","chapter":"工作流・阶段 1","q":"关于科特算法带班的基本信息，下列说法正确的有？【多选】","options":[{"k":"A","t":"用户来源于前课导续报，且都已上过一期图形化课程"},{"k":"B","t":"每个 Level 前三周每周一次课、一次两个课时，第四周两次课、共四个课时"},{"k":"C","t":"一个课导同时带三个班级"},{"k":"D","t":"班型为科特线班级，带班周期半年"}],"answer":"ABD","back":""},{"id":"T-S06","type":"阶段练习题","chapter":"工作流・阶段 2","q":"带班全周期可以沿时间轴分成七个关键阶段，其中第一阶段的名称和持续周期是？","options":[{"k":"A","t":"接班期，持续 3 周"},{"k":"B","t":"试学阶段，持续 4 周"},{"k":"C","t":"等考履约阶段，持续 6 周"},{"k":"D","t":"续报阶段，持续 4 周"}],"answer":"A","back":""},{"id":"T-S07","type":"阶段练习题","chapter":"工作流・阶段 2","q":"接班期（即前 3 周）必须完成的关键动作包括哪些？【多选】","options":[{"k":"A","t":"轨迹探查"},{"k":"B","t":"首通电访"},{"k":"C","t":"见面会与家长会"},{"k":"D","t":"启动续报预热电访"}],"answer":"ABC","back":""},{"id":"T-S08","type":"阶段练习题","chapter":"工作流・阶段 2","q":"L7 试学阶段持续 4 周，也叫小灶阶段；这个阶段的重点不是提前谈续报，而是给家长安全感，让家长看到孩子在适应、在进步。【判断】","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":""},{"id":"T-S09","type":"阶段练习题","chapter":"工作流・阶段 2","q":"家长进入续报考虑期，开始思考 “Python 要不要继续学”，这个阶段是？","options":[{"k":"A","t":"L9 等考履约阶段"},{"k":"B","t":"L10（完成等考考试并启动续报预热电访）"},{"k":"C","t":"L11 续报阶段"},{"k":"D","t":"L12 国赛白赛与用户维稳阶段"}],"answer":"B","back":""},{"id":"T-S10","type":"阶段练习题","chapter":"工作流・阶段 2","q":"关于各阶段家长心态与对应动作，下列说法正确的有？【多选】","options":[{"k":"A","t":"接班期家长对新老师信任度不高，最焦虑老师是否了解自己家孩子，应先建立信任、多听多安抚"},{"k":"B","t":"L8 家长关心报赛到底值不值得，应帮家长判断孩子是否适合报赛、能拿到什么结果，而不是硬推"},{"k":"C","t":"L11 是关键决策期，家长最关心要不要交钱、要不要持续报课，动作要更聚焦"},{"k":"D","t":"L12 家长结果焦虑、有退费风险且对追单敏感，应加大追单频率快速逼单"}],"answer":"ABC","back":""},{"id":"T-S11","type":"阶段练习题","chapter":"工作流・阶段 3","q":"接班期是整个带班周期的地基，这个阶段的核心目标是？","options":[{"k":"A","t":"防流失、建信任"},{"k":"B","t":"给家长吃定心丸、帮孩子建立学习习惯"},{"k":"C","t":"赛考履约、考务提醒"},{"k":"D","t":"正式续报、全力冲刺"}],"answer":"A","back":""},{"id":"T-S12","type":"阶段练习题","chapter":"工作流・阶段 3","q":"接班期必须完成的四件事包括哪些？【多选】","options":[{"k":"A","t":"扒轨迹，了解上阶段学习情况、理清报名动机、排查风险学员"},{"k":"B","t":"打首通，建立情感连接、确认报名动机、明确学期安排"},{"k":"C","t":"见面会与家长会，拉近师生关系并同步学习规划"},{"k":"D","t":"小灶课全覆盖，夯实学员学习意愿"}],"answer":"ABC","back":""},{"id":"T-S13","type":"阶段练习题","chapter":"工作流・阶段 3","q":"L7 试学期有一条硬规矩：给家长发了消息但家长没有回复，正确的做法是？","options":[{"k":"A","t":"等家长主动回复，避免打扰"},{"k":"B","t":"直接在系统里标记为流失学员"},{"k":"C","t":"必须电话跟进，确保家校沟通不断档"},{"k":"D","t":"只把情况报给主管，等主管处理"}],"answer":"C","back":""},{"id":"T-S14","type":"阶段练习题","chapter":"工作流・阶段 3","q":"日常行课全流程中，开课前需要完成的三件事是？","options":[{"k":"A","t":"确认到课、备课、课前直播"},{"k":"B","t":"课中反馈、课上连麦、后台答疑"},{"k":"C","t":"课后反馈、作业批改、小灶直播课"},{"k":"D","t":"赛事小测、规划电访、赛考联报"}],"answer":"A","back":""},{"id":"T-S15","type":"阶段练习题","chapter":"工作流・阶段 3","q":"日常行课全流程适用于软件课、硬件课和赛事课，思维线课程不适用这套流程。【判断】","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":""},{"id":"T-F01","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"L8 招报预热阶段，赛考规划电访要求在哪个节点前完成并上传 SOP？","options":[{"k":"A","t":"L8-1"},{"k":"B","t":"L8-2"},{"k":"C","t":"L8-4"},{"k":"D","t":"L9-1"}],"answer":"C","back":""},{"id":"T-F02","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"L9 赛考履约阶段，关于赛事组织与结果沟通，做法正确的有？【多选】","options":[{"k":"A","t":"开设赛事直播课，针对赛考题型做专项训练，盯紧学员到课与听课效果"},{"k":"B","t":"落实报名确认、准考证核对、考试设备调试等全部考务动作"},{"k":"C","t":"考前做好预期管理，不向家长承诺一定能拿奖"},{"k":"D","t":"考前向家长承诺一定获奖，以提高续报率"}],"answer":"ABC","back":""},{"id":"T-F03","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"续报预热电访的核心目的就是直接催家长交费，尽快锁定续报名额。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":""},{"id":"T-F04","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"L11 续报阶段的正式续报、全力推进转化，应在哪两个时间节点？","options":[{"k":"A","t":"L10-2 或 L10-4"},{"k":"B","t":"L11-2 或 L11-4"},{"k":"C","t":"L11-1 或 L11-3"},{"k":"D","t":"L12-1 或 L12-2"}],"answer":"B","back":""},{"id":"T-F05","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"关于 L12 用户维稳阶段，下列说法正确的有？【多选】","options":[{"k":"A","t":"组织学员参加国赛、白名单赛事，冲刺高阶奖项"},{"k":"B","t":"重点关注有退费风险的学员，主动沟通安抚、提前化解"},{"k":"C","t":"追单要站在家长视角分析利弊，由家长自主选择，不强行施压"},{"k":"D","t":"学员最终未续报，就不必再做结课与学习过渡"}],"answer":"ABC","back":""},{"id":"T-F06","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"接班期的见面会要达成哪些目的？【多选】","options":[{"k":"A","t":"拉近师生关系"},{"k":"B","t":"提升孩子的兴趣度与开课期待值"},{"k":"C","t":"回扣直播课程模式"},{"k":"D","t":"现场推动家长完成续报缴费"}],"answer":"ABC","back":""},{"id":"T-F07","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"日常行课中「开课后」的核心工作是？","options":[{"k":"A","t":"确认到课与后台备课"},{"k":"B","t":"课中反馈、课上连麦、后台答疑"},{"k":"C","t":"课后反馈、作业批改，错题作业单独反馈，并配套小灶直播课补充辅导"},{"k":"D","t":"课前进入直播间做各项准备"}],"answer":"C","back":""},{"id":"T-F08","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"L9 赛考履约阶段，已报名参赛的学员要保障全员参加考试，这是对家长最基本的承诺。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":""},{"id":"T-F09","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"L10 等考成绩不理想时，最好先回避成绩，等进入续报阶段再谈。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":""},{"id":"T-F10","type":"本章综合测试题","chapter":"图形化课导工作流·全章","q":"接班期家长会的核心目的是？","options":[{"k":"A","t":"集中收取本学期学费"},{"k":"B","t":"向家长同步学习规划、建立信任、明确预期"},{"k":"C","t":"公布班级成绩排名"},{"k":"D","t":"讲解续报优惠政策"}],"answer":"B","back":""}],"timing":{"P02":{"sents":["先看一下今天的整体框架，一共四个板块。","第一块，课导价值 —— 我们先搞明白，课导这份工作到底为什么重要，价值落在哪里？","第二块，带班期全流程概览，给大家一张带班的全景图，知道整个带班周期是怎么运转的，每个节点做什么？","怎么做？","工作的重点在哪里？","避免大家一腔热血去做了，但是拿不到想要的效果；","第三块，七大阶段重点，这也是今天这节课的核心，会把每个阶段的工作目标、关键动作逐一拆解，让大家对于带班这件事有一个清晰的认知；","第四块，成果验证 ——用真实数据和战绩说话，看看做好了能拿到什么结果。","四个板块，从认知到方法再到结果，我们一步步一起来看一下。"],"durs":[4.128,7.776,10.128,1.872,2.208,4.8,13.128,7.344,6]},"P01":{"sents":["这是咱们培训的第二节课。","正式开始之前，先和大家探讨一个问题：新班刚接过来的第一周，当你打开电脑，第一件事要做什么？","我再问大家，接班第一周必须完成的工作一共有几件？","哪一件没做到位，会直接造成后续学员流失？","很多人一时答不上来。","给大家举个生活里的例子，点外卖的完整流程：1. 打开 APP 挑选菜品 2. 下单支付 3. 商家接单、备餐 4. 骑手接单取餐 5. 骑手配送 6. 用户收餐确认。","每一步都有先后顺序，完成上一步，才会触发下一步；","不同角色负责不同环节，信息、物品从一个环节流转到下一环。","这就是一套工作流。","如果缺少这套流程，就会出现没人接单、没人取餐，整个事情直接卡住的情况。","今天要讲的工作流，就是帮大家解决「什么时候该干什么」的问题，保证关键工作一件都不漏。","今天我们的主题是 ——QC 课导工作流。","这套工作流专门针对课导岗位打造，从接班一直到结课，每一步该做什么、重点抓哪些内容，都会给大家讲透彻。","不管你是教培新人，还是已经带过好几期班级的老课导，今天这节课都能帮大家梳理清楚工作，把服务做得更扎实。"],"durs":[2.712,9.096,5.28,4.44,2.424,17.328,5.064,6.744,2.184,7.68,8.016,3.864,10.416,10.2]},"P03":{"sents":["首先进入第一个板块课导价值导向。","家长问：老师，我家孩子在家也没见他写代码啊，这课到底学了个啥？","如果你是这个课导，你怎么回？","我们有很多回答方式，但核心就一件事，家长看不见孩子在屏幕前干了什么，你的工作就是把看不见的过程变成看得见的进步。","你发的每一条反馈、改的每一次作业、打的每一个电话，都是在帮家长看见孩子的成长。","这就是课导最核心的价值。","我们展开讲。","很多课导刚上手的时候，会觉得自己的工作就是盯孩子上课、给孩子改作业，催家长缴费，难道我们只盯上课改作业，家长就会续报吗？","当然不是的。","实际上，课导老师在整个带班过程中不仅仅是要完成这些内容，课导这个角色在整个业务链条里的分量，远比想象的要重。","我们先把我们自己作为课导价值这件事想明白，后面的所有动作才有根。"],"durs":[3.648,6.768,3,11.088,7.752,2.832,1.872,12.552,1.872,11.592,6.288]},"P04":{"sents":["做好课导工作，价值最终落到三个层面身上。","第一个层面，对家长。","刚刚我们也提到，家长看不见孩子在屏幕前干了什么，你的工作就是把看不见的过程变成看得见的进步。","那对家长而言，孩子上课有人盯，进步看得见，家长认可你，自然愿意续报。","相反，如果你不反馈、家长发现不了孩子的变化，孩子的进步家长看不见，一学期下来家长觉得没收获，后面就不配合了。","第二个层面，对公司而言。","我们想一下，如果你是老板，你主要靠什么来维持收益，是续报和客户。","公司的每一个用户都是有成本的，前期投入很大，这个用户如果不能持续学习，或者中途退费，相当于前期投入都打水漂了。","用户的完课率、续报率需要我们守住，各项工作环环相扣。","第三个层面，对自己。","同样的道理，我们和公司是利益共同体。","做好了，续报率就是你的绩效和晋升依据，最后直接体现在你自己的收入和履历上；","做差了，续报只能靠运气，收入和能力都很难提升。","所以这是一个正循环，服务好家长，家长续报，公司业绩稳定，你的续报率带来绩效和晋升，你就更有动力把服务做好。","这个循环转起来，三方共赢；","转不起来，三方都输。"],"durs":[4.488,2.472,8.976,7.128,11.544,2.688,6.528,11.544,5.808,2.544,3.936,7.896,5.496,11.256,3.216,2.568]},"P05":{"sents":["那课导的核心价值具体是什么？","一句话，不仅是完成课程，而是让家长看到看得见的进步。","大家想一个问题，现在的家长会时时刻刻陪在孩子身边上课吗？","不会。","所以就产生了一个问题，孩子在屏幕前学了什么、写了什么代码、做了什么作品，家长其实是看不见的。","所以我们的工作，就是把这个看不见的过程，变成家长能看见的效果。","结合实际的带班场景，整个链条是这样的，孩子在学，上课、写代码、做作品，但家长看不见过程；","那课导可以做什么？","记录，到课、作业、作品、课堂表现，我们把这些数据记下来；","课导翻译，通过课后反馈、阶段报告，把冷冰冰的代码翻译成孩子的成长和变化；","家长感知，家长看到后会想孩子真的变了，这钱花得值；","最后是续报决策，家长自己得出结论，愿意继续投入。","这里有一个关键判断，我们能直接影响的，是中间两步，记录和翻译。","这两步做扎实了，续报是自然而然的结果；","跳过这两步，即使你说的天花乱坠，没有这个步骤，任何话术、任何方法都救不回来，家长会觉得这个学费花的不值得。"],"durs":[3.312,5.856,5.856,1.872,8.976,6.576,9.792,2.088,6.552,7.944,5.88,5.352,6.408,4.224,10.776]},"P06":{"sents":["在正式带班之前，先把科特算法带班的基本信息对齐一下。","班型是科特线班级，带班周期半年。","具体带班时间是周四晚上七点、周五晚上七点、周六晚上七点，每人分配两个时间段。","班级人数方面，一个课导带两个班级。","用户来源是前课导续报上来的，用户特点是已经上过一期图形化课程。","课时安排是每个Level前三周每周一次课，一次两个课时，第四周两次课，一共四个课时。","这些基本信息大家心里有数，后面讲流程的时候就知道每个动作对应的是多大的工作量、什么样的用户。"],"durs":[5.784,3.984,8.448,3.816,6.888,8.568,9.648]},"P07":{"sents":["基本信息大家心里有数了，带多少人、带多久、什么时候上课、用户是什么基础，这些我们都对齐了。","知道了这些，我们是不是就知道这半年该怎么干了？","肯定还不够。","你知道自己带100多个孩子、带半年，但这半年里，哪个月该干什么、哪个节点必须冲、哪个阶段重点抓什么，很多人是模糊的。","很多课导都会产生一个误区，开班了忙着接孩子，中间忙着改作业，快到续报了才想起来要跟家长谈，结果手忙脚乱，效果还不好。","大家要明白，带班这件事，不是走一步看一步，是一开始就要把整张地图摊开，知道自己现在在哪、下一步去哪、终点在哪。","所以接下来这个板块，就给大家一张全景图，带班期全流程概览。","从接班到结课，整个半年的时间轴上铺开来，每个阶段在什么时候、关键节点是什么、重点抓什么，一张图给你讲明白。"],"durs":[9.984,4.728,1.872,11.88,12.312,11.28,6.552,11.088]},"P08":{"sents":["这就是课导工作的全景时间轴。","整个带班周期可以沿着这条时间轴分成七个关键阶段。","首先是接班期，持续 3 周，这个阶段的关键动作是轨迹探查、首通电访、见面会和家长会。","接着进入 LEVEL 7，也就是试学阶段，持续 4 周，也叫小灶阶段。","之后到 LEVEL 9，进入等考履约阶段。","再往后是 LEVEL 10 和 LEVEL 11，其中 LEVEL 10 要完成等考考试，并启动续报预热电访；","LEVEL 11 进入续报阶段，对应 L11-2 到 L11-4。","最后到 LEVEL 12，有国赛或白名单赛试，同时做好用户维稳，之后结课。","带班的时候不要只盯着眼前一次课或一次作业，而要先看清这张地图：你现在在哪个阶段，接下来要进入哪个节点，这个阶段重点该抓什么。","稍后会把这七个阶段拆开来讲。"],"durs":[3.144,5.232,9.288,6.288,3.816,8.424,5.712,7.44,12.792,3.336]},"P09":{"sents":["在做任何运营动作之前，要先知道这个阶段的家长心里到底在想什么。","心态摸准了，一句话顶十句；","心态摸不准，说再多都是反效果。","我们一起来看这张表。\n","接班期，也就是前 3 周，家长对新老师信任度不高，最焦虑的是老师是否了解自己家孩子。","这个阶段我们不要急着推动作，先把信任建立起来，多听家长说，多安抚家长的不安。\n","进入 L7，也就是 4 周的试学阶段，家长已经对比过上阶段老师的服务，也在观察孩子的状态有没有变化。","这个阶段家长心里的问题是：新老师行不行，孩子能不能跟上。","所以我们的重点不是提前谈续报，而是给家长安全感，让他看到孩子在适应、在进步。\n","到了 L8，家长开始对赛事价值有认知，也会权衡是否再次报考。","这个时候家长关心的不是课程本身，而是报赛到底值不值得。","我们要做的不是硬推，而是帮家长判断孩子是不是适合报赛、报赛能拿到什么结果。\n","进入 L9，家长期待比上次更好的成绩，也会关注孩子后续要不要报名观望。","这个阶段家长更看重结果和确定性，我们要用孩子的课堂表现、作业情况和阶段成果来说话，让家长看到投入是有回报的。\n","到了 L10，家长进入续报考虑期，会开始思考 Python 要不要继续学。","这个时候家长不是不信任老师，而是在做成本和收益判断。","我们要提前铺垫孩子的成长变化，让续报成为自然延续，而不是突然销售。\n","L11 是关键决策期，家长心里最直接的问题就是：要不要交钱，要不要持续报课。","这个阶段动作要更聚焦，围绕家长最关心的问题做沟通，明确告诉他继续学下去的价值是什么。\n","最后到了 L12，家长容易出现结果焦虑，也会有退费风险，对追单特别敏感。","这个阶段越催反而越容易引起反感，所以最重要的是稳，稳定家长情绪，稳定孩子学习状态，把结果收口做好。\n","七个阶段，七种心态。","我们的工作节奏必须跟着家长的心理走，而不是自己想干什么就干什么。"],"durs":[6.696,3.168,3.84,2.256,8.88,7.68,9.888,6.024,8.64,6.552,6.168,7.848,7.488,12.024,6.552,5.712,7.032,8.064,8.712,7.488,10.44,2.64,6.72]},"P10":{"sents":["好，接下来进入今天最核心的板块，七大阶段重点。","从接班期到 L12，每个阶段都会给大家讲清楚阶段目标、核心动作、沟通重点和需要避开的坑，方便大家直接落地执行。","我们先从第一个阶段接班期开始。"],"durs":[5.136,11.664,3.192]},"P11":{"sents":["第一个阶段，接班期，周期 3 周，核心目标是防流失、建信任。"," 这个阶段有四件事必须做。","第一件，扒轨迹。","我们想一下，接到学员之后，如果直接打电话，面对的就是一个模糊的家长画像。","扒轨迹，就是了解学员上阶段的学习情况，理清报名动机，排查风险学员，提前做好介入。"," 第二件，打首通。","第一次电话沟通，用来建立情感连接，介绍课程和服务，确认报名动机，明确学期安排。","首通沟通做好了，后面整个学期的沟通基础就能打牢。","家长对老师第一印象好，自然也愿意配合。"," 第三件，见面会。","通过见面会拉近师生关系，提升孩子的兴趣度，提高学员的开课期待值，同时回扣直播课程模式。"," 第四件，家长会。","向家长同步学习规划，建立信任，明确预期。","这四件事做好了，学员和家长的粘性就能建立起来，后续流失率自然降低。","接班期是整个带班周期的地基，地基打牢了，后面的工作才稳。"],"durs":[6.6,3,2.28,7.32,9.096,2.232,8.544,5.376,4.2,2.328,9.552,2.304,4.776,7.032,6.096]},"P12":{"sents":["第二个阶段，L7 试学期，周期 4 周，核心目标是给家长吃定心丸，帮孩子建立学习习惯，同时预防流失。"," 这个阶段重点抓四件事。","第一，三大工作流程，覆盖开课前、开课中、开课后，完成日常行课全流程覆盖，这部分后面页面会详细展开。"," 第二，日常沟通反馈。","这里有一条硬规矩，未回复的家长必须电话跟进，确保家校沟通不断档。","发了消息家长没回，不代表家长没有问题，很可能是没有看到或者不知道怎么回复。","这个时候主动打电话，既能体现责任心，也能及时发现潜在问题。"," 第三，小灶课。","L7 阶段小灶课要做到全覆盖，夯实学员的学习意愿，不让任何一个孩子在起步阶段掉队，同时防范退费。","针对风险学员，在小灶课上多互动，外化展示孩子的学习状态。"," 第四，硬件随材。","重点做好两件事，一是流失预判，通过随材使用情况识别潜在流失学员；","二是跟家长讲清楚随材扣费规则，避免后期因为扣费产生纠纷。"," L7 是巩固家长和孩子信任的关键期，这个阶段把服务做细，后面的续报工作才能水到渠成。"],"durs":[10.656,2.88,11.112,2.712,6.864,7.536,6.168,2.136,10.248,6.384,2.352,7.176,6.744,9]},"P13":{"sents":["专门来讲一下日常行课的全流程，分为开课前、开课中、开课后三个环节。","开课前，要做三件事：确认到课、备课、课前直播。","确认到课就是提前摸清学员出勤情况，清楚哪些孩子正常上课、哪些可能缺席，对不到课的学员及时跟进；","备课就是提前吃透本节课内容，把握重点难点，完成后台备课操作，上传辅助提示、批改模板，这也是我们的质检项目；","课前直播需要提前进入直播间，做好各项准备，课前直播也是和孩子互动很有效的方式，调动孩子上课积极性。\n","开课中，同样有三件核心工作：课中反馈、课上连麦、后台答疑。","课中反馈，实时把孩子课堂上的表现同步给家长；","课上连麦，鼓励孩子主动参与互动，提升课堂参与度；","后台答疑，及时响应孩子和家长在课堂上提出的各类问题。\n","开课后，核心工作是课后反馈、课后作业批改，错题作业要单独反馈，同时配套小灶直播课做补充辅导。\n","课程分为软件课、硬件课和赛事课，思维线课程不适用这套流程。","不同课程在行课细节上会存在差异，但软件、硬件、赛事课的基础流程是统一的。","大家要记住，日常行课是课导工作的基本面，这个流程落实扎实，带班质量就有保障。"],"durs":[7.368,5.688,10.104,11.448,10.44,6.936,5.16,5.448,5.928,10.824,6.984,8.304,8.184]},"P14":{"sents":["第三个阶段，L8 招报预热，核心目标是招报预热加赛考联报。","这个阶段重点抓四件事。\n","第一，招报预热前，开展赛事小测。","通过 1V1 或者 1Vn 的讲题小灶课，铺垫赛考认知，让孩子提前接触赛考题型，也让家长看到孩子在赛事方向上的潜力。\n","第二，赛考招报电访。","要在 L8-4 前完成规划电访，并且上传 SOP。","电访的目的，是帮家长明确赛事路径，确认报考意愿。","很多家长对编程赛事并不了解，我们要帮他理清楚有哪些赛事、什么时候考、参赛有什么价值，以及孩子适合报考哪一项。\n","第三，赛考联报。","启动赛考联报，引导学员参与赛事，辅助家长完成报名，阐明赛考安排，提高招报率。\n","第四，日常行课不能中断。","持续做好日常教学反馈，保持学员学习节奏，提高完课率。\n","大家记住，赛考并不是额外的负担，而是孩子学习成果的展示机会，也是家长感知课程价值、支撑后续续报的重要抓手。","赛事招报就相当于一次小续报，赛招率高，往往续报率也会更高。"],"durs":[6.624,2.88,3.984,11.808,2.664,5.088,5.424,11.088,2.328,8.592,3.168,5.976,11.568,6.552]},"P15":{"sents":["第四个阶段，L9 赛考履约，核心目标是赛考履约加考务提醒。"," 这个阶段重点抓四件事。","第一，赛事课履约。","开设赛事直播课，针对赛考题型做专项训练，提升通过率。","赛事课质量直接关系孩子能否拿到赛事成绩，一定要盯紧学员到课情况和听课效果。\n","第二，赛考辅导。","开展赛前集中辅导，帮孩子熟悉考试内容与流程，落实全部考务动作，完成报名确认、准考证核对、考试设备调试等工作，一项都不能遗漏。\n","第三，参加赛考。","组织学员参与赛事。","考前做好预期管理，不要跟家长承诺一定能拿奖，可以告诉家长我们会全力准备，重在参与、积累经验。","这样考出好成绩就是惊喜，结果不理想家长也更容易接受。","考完之后做好私信运营，无论成绩如何，单独和家长沟通，肯定孩子的付出，总结经验，规划后续学习。\n","第四，日常行课。","正常推进教学进度，兼顾赛考备考和常规学习，提升完课率。\n","L9 阶段的关键词就是履约，已经报名参赛的学员，要保障全员参加考试，这是我们对家长最基本的承诺。","加分项就是尽可能帮助孩子顺利通过赛事，把不会的题目讲解清楚。"],"durs":[6.456,2.88,2.448,6.264,8.208,2.28,13.488,2.304,2.448,9.864,5.832,10.392,2.376,6.384,9.696,6.816]},"P16":{"sents":["第五个阶段，L10 续报预热，核心目标：等考考试 + 续报预热。"," 这个阶段重点抓四件事。","第一，等考考试。","在 L10-1 或 L10-3 组织学员参加等考，检验阶段性学习成果。","等考成绩出来后，就是我们和家长沟通续报最好的抓手。\n","第二，续报预热电访。","启动预热电访，和家长沟通下一阶段学习规划，建立家长的续报认知，提前处理家长不续报的异议。","大家要注意，预热电访不是直接催费，核心是铺垫沟通，让家长提前做好心理准备。\n","第三，等考成绩查询。","成绩出来后第一时间向家长展示学习成果，用真实的数据增强家长续报信心。","孩子考得好，可以跟家长说：“你看，这一阶段学习效果很明显，下一个阶段我们可以挑战更高目标。”"," 如果成绩不理想，可以这样沟通：“这次考试暴露出一些薄弱点，正好在下一阶段针对性补齐。”\n","第四，日常行课。","持续保持教学质量，做好阶段收尾和学习过渡，提升完课率。","L10 是续报的前奏，前奏铺垫到位，到 L11 正式续报阶段沟通就会更加顺畅。"],"durs":[6.528,2.88,2.304,6.864,5.28,2.64,9.408,8.376,2.784,7.728,9,8.544,2.376,6.144,8.28]},"P17":{"sents":["第六个阶段，L11 续报阶段，核心目标就是正式续报，时间节点在 L11-2 或 L11-4。","这个阶段是整个带班周期的关键战役，重点抓四件事。\n","第一，正式续报。","在 L11-2 或 L11-4 这两个节点全力推进续报转化，该打电话打电话，该发消息发消息，需要一对一沟通就一对一沟通，这个阶段必须全力冲刺。\n","第二，续报跟进。","逐一跟进还没有续报的学员，摸清家长的顾虑，是价格、学习效果、时间冲突，还是其他原因，再针对性解决。","不要家长一说 “再考虑考虑” 就停下跟进，很多时候家长只是需要我们再推一把。\n","第三，政策解读。","给家长清晰解读续报政策，包含优惠力度、班次安排、上课时间等内容，信息传递到位，家长做决策才会更快。\n","第四，日常行课。","续报期间教学绝对不能松懈，依靠教学质量驱动续报。","家长看到我们越到后期依旧认真负责，才更愿意继续让孩子跟着我们学习。\n","L11 是出结果的阶段，前面所有的积累与铺垫，都会在这个阶段兑现落地。"],"durs":[9.312,5.496,2.184,14.376,2.232,10.584,7.104,2.352,10.896,2.376,5.592,7.032,7.056]},"P18":{"sents":["第七个阶段，L12 用户维稳，这是带班周期的最后一个阶段，核心目标是维稳 + 防退费追单。\n","这个阶段重点抓四件事。","第一，国赛 / 白赛考试。","组织学员参加国赛、白名单赛事考试，冲刺高阶奖项。","这是孩子整个学习周期的高光时刻，也是给到家长最后的学习交付。\n","第二，防退费。","重点关注存在退费风险的学员，及时介入维稳。","L12 阶段家长很容易产生焦虑，看到其他学员续报、或是孩子考试结果不理想，都有可能产生退费想法。","这时我们要主动沟通、做好安抚，提前化解潜在问题。\n","第三，追单。","针对尚未续报的学员开展最后追单，抓住最后的转化机会。","追单要讲究方式方法，不要强行施压，站在家长视角 /* 第二个 Webhook：学员第一次出现时，在「学员实时状态」表新建他的那一行 */
const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid}, ev, snapshot(online));
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') { while (outbox.length) post(HOOK, outbox.shift()); return; }  // 关页面时立刻全部发出
  if (!pumpTimer) pump();
}
/* 实际收听时长：只在播放时累计，按真实时间计（倍速播放不重复计） */
let pageSec = 0, lastT = null;
function flushPage(event){
  const p = curPageSafe();
  if (p && pageSec >= 3) report({event, stage:stageLabel(st.cur.s), page:p.p, minutes:mins(pageSec), detail:p.topic});
  pageSec = 0;
}
function curPageSafe(){ try { return STAGES[st.cur.s].pages[st.cur.p]; } catch(e) { return null; } }
window.addEventListener('pagehide', () => {
  if (st.view === 'learn') { endPause(false); flushPage('中途离开'); }
  if (st.view === 'learn' || st.view === 'quiz') { save(); report({event:'离开课程', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||''}, '已离开'); }
});
/* 占用时长：停留在某关卡（听课或做小测）的全部时间，含暂停、切走 */
let tickAt = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min((now - tickAt)/1000, 70); tickAt = now;
  if (st.name && (st.view === 'learn' || st.view === 'quiz')) { stat(curKey()).occ += dt; if (Math.random() < 0.1) save(); }
}, 1000);
/* 暂停：学员主动暂停或切走窗口导致的暂停（翻页、听完不算） */
let navPause = false, pauseAt = null, pauseWhy = '';
function endPause(doReport){
  if (pauseAt == null) return;
  const sec = (Date.now() - pauseAt)/1000; pauseAt = null;
  stat(st.cur.s).ps += sec;
  if (doReport) report({event:'继续播放', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`暂停 ${Math.round(sec)} 秒（${pauseWhy}）`});
}
/* 卡顿：播放中因网络缓冲停住 */
let stallAt = null;
function endStall(){
  if (stallAt == null) return;
  const sec = (Date.now() - stallAt)/1000; stallAt = null;
  if (sec < 0.8) return;
  const s = stat(st.cur.s); s.kn += 1; s.ks += sec;
  report({event:'卡顿', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`缓冲卡顿 ${sec.toFixed(1)} 秒`});
}

/* ---------- 音频播放 ---------- */
const au = $('#au');
let rate = 1, playing = false, pendingAfter = null;
function pageTiming(p){ return DATA.timing[p.p]; }
function sentAt(p, t){
  const tm = pageTiming(p); let acc = 0;
  for (let i=0;i<tm.durs.length;i++){ acc += tm.durs[i]; if (t < acc) return i; }
  return tm.durs.length-1;
}
au.addEventListener('timeupdate', () => {
  if (st.view !== 'learn') return;
  if (!au.paused && lastT != null) { const dt = au.currentTime - lastT; if (dt > 0 && dt < 3) { const real = dt/(au.playbackRate||1); pageSec += real; st.stageSec[st.cur.s] = (st.stageSec[st.cur.s]||0) + real; stat(st.cur.s).play += real; } }
  lastT = au.currentTime;
  const p = curPage(); const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const i = sentAt(p, au.currentTime);
  const sub = $('#sub'); if (sub && sub.dataset.i != i){ sub.dataset.i = i; sub.textContent = tm.sents[i].trim(); }
  const bar = $('#progfill'); if (bar) bar.style.width = (100*au.currentTime/total).toFixed(1)+'%';
  const tt = $('#time'); if (tt) tt.textContent = fmt(au.currentTime)+' / '+fmt(total);
});
au.addEventListener('ended', () => { playing = false; updPlayBtn(); onPageEnd(); });
au.addEventListener('pause', () => {
  playing = false; updPlayBtn(); endStall();
  const atEnd = au.ended || (au.duration && au.currentTime >= au.duration - 0.3);
  if (navPause || atEnd || st.view !== 'learn') { navPause = false; return; }
  const s = stat(st.cur.s); s.pn += 1; pauseAt = Date.now(); pauseWhy = autoWhy || (document.hidden ? '切出页面自动暂停' : '主动暂停'); autoWhy = '';
  report({event:'暂停', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:pauseWhy});
});
au.addEventListener('play', () => { playing = true; updPlayBtn(); const v=$('#veil'); if(v) v.hidden = true; endPause(true); });
au.addEventListener('waiting', () => { if (!au.paused && au.currentTime > 0.5 && stallAt == null) stallAt = Date.now(); });  // 每页开头的首次加载不算卡顿
au.addEventListener('playing', endStall);

/* 切走自动暂停——防挂机。两种情况都算：

function startStage(i, resume){

    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }

  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>

    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow"></div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    m.querySelectorAll('.opt').forEach(x => x.disabled = true);
    const ok = it.vote || i === it.answer;
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${'ABCD'[i]}：${it.options[i]}`});
    if (ok) {
      st.answered[p.p] = true; save();
      b.classList.add('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    b.classList.add('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = () => askInteract(p); play(); };
    } else {
      m.querySelector(`.opt[data-i="${it.answer}"]`).classList.add('right');
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${'ABCD'[it.answer]}：${esc(it.options[it.answer])}</div>`;

      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  });
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测 · ${TITLES[STAGES[which].num]||''}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}</p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div></div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`});
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num} · ${esc(TITLES[s.num]||'')}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · QC 课导工作流 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
