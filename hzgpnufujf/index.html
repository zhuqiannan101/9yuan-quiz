<script>
const DATA = {"pages":[{"row":2,"stage":"阶段1·课程定位与成交三性","p":"P01","topic":"封面：为什么要学少儿编程（上）——打好编程认知的地基","script":"我们正式开启本次课程。本次课程主题：为什么要学少儿编程。 这节课的定位，是帮大家打好编程认知的地基。 它不是让大家直接去网上复制通用话术，拿生硬的术语或者大白话直接讲给家长。我们要学会结合咱们的课程体系，把底层逻辑吃透，转化成家长听得懂的表达。\n这里跟大家明确一个核心：家长很多时候，是看重编程带来的附加价值才会产生兴趣 —— 比如能不能改善孩子的学习习惯、锻炼逻辑思维、和校内语文数学形成联动。我们吃透这些底层认知，最终目的，是拥有独立回应、解决家长各类异议的能力。 不管家长抛出什么疑问，你都能讲明白编程到底是怎么帮到孩子的。\n只有把「为什么学少儿编程」的底层逻辑吃透，我们才能从容应对家长的各种提问，而不是只会套固定句子。","interact":null,"sku":"","dept":""},{"row":3,"stage":"阶段1·课程定位与成交三性","p":"P02","topic":"成交三性：重要性·紧迫性·唯一性（为什么学/为什么现在学/为什么选核桃）","script":"我们先来聊一聊成交三性，就是帮家长依次想清楚三个问题：为什么学、为什么现在学、为什么选核桃。\n\n1. 重要性：为什么要学编程\n编程锻炼孩子逻辑思维，助力校内理科学习；顺应 AI 时代发展，同时可以走信息竞赛赛道，给孩子多一条特长路径，不是单纯的兴趣课。编程不依附于任何校内学科，而是一门真正的学科了。\n2. 紧迫性：为什么要现在学\n小学低中段是逻辑培养黄金期，越早起步压力越小。编程是阶梯学习，备赛也需要周期，等到高年级学业变重再启动，时间紧、追赶难度大。越早学习孩子能达到的水平越高。\n3. 唯一性：为什么选择核桃编程\n我们拥有完整连贯的学习体系，覆盖 Scratch、Python、C++ 全路线，课程内容对标赛考考点，学练同步。独有莫顿课程体系，主打动手实操、一学九练，孩子兴趣启蒙、长期赛事规划一站式落地。\n总结：先让家长认可价值，再让家长明白不能一直等，最后锁定我们，三步打通，推动成交\n其实把课程售卖出去你们需要让家长意识到这个课程对于他来说是重要的，且现在就要买的，这样才能最大的情况下让家长进行购买，这节课就是给大家讲重要性的，也是让家长把钱掏出来的关键！重中之重！来看一道题，成交三性依次要帮家长想清楚的三个问题是？","interact":{"q":"成交三性依次要帮家长想清楚的三个问题是？","at":"P02","options":["学什么语言、考什么证书、赛什么比赛","为什么学编程、为什么现在学、为什么在核桃编程学","多少钱、多长时间、谁来给孩子上课","孩子喜不喜欢、家长有没有空、贵不贵"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":4,"stage":"阶段1·课程定位与成交三性","p":"P03","topic":"思考：那么多教育红利，为什么偏偏学习编程？","script":"编程的优势咱们都很清楚。但如果一上来全是我们主动去夸，家长听着就像我们自卖自夸。\n所以这里先抛一个问题，市面上有很多赛道、很多教育红利，为什么偏偏选择编程？","interact":null,"sku":"","dept":""},{"row":5,"stage":"阶段1·课程定位与成交三性","p":"P04","topic":"为什么学编程：外部因素（时代背景/国家政策）+ 内部因素（习惯/思维/学科）","script":"那我们在跟家长讲为什么学编程的时候，可以分成两大维度去梳理，逻辑会特别清晰，也好记、也好讲。 一类是外部因素，一类是内部因素。\n外部因素，简单来说，就是大环境、政策、升学、赛道机会这些客观存在的红利和路径； 内部因素，就是落在孩子自己身上的，思维、习惯、能力这些底层素养的提升。","interact":null,"sku":"","dept":""},{"row":6,"stage":"阶段1·课程定位与成交三性","p":"P05","topic":"外部因素：时代背景·国家政策（编程不是课外兴趣，是信息科技素养）","script":"我们先来看一下外部因素。外部因素，核心就是国家层面的导向、针对少儿科技教育、编程教育出台的一系列政策文件。我们跟家长讲这部分，核心要传递一个信息：编程已经不是一个课外兴趣、可有可无的爱好，而是国家在大力推进的信息科技素养，是未来孩子需要具备的基础能力。来看一道题，跟家长讲外部因素时，核心要传递的信息是？","interact":{"q":"跟家长讲外部因素时，核心要传递的信息是？","at":"P05","options":["编程就是玩电脑游戏，跟学习完全沾不上边","编程是可有可无的课外兴趣，学不学全看孩子心情","编程是国家大力推进的信息科技素养，是未来的基础能力","编程只适合有天赋的孩子，普通孩子学不了"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":7,"stage":"阶段2·编程的时代背景","p":"P06","topic":"了解编程的时代背景（章节页）","script":"先来了解一下编程的时代背景","interact":null,"sku":"","dept":""},{"row":8,"stage":"阶段2·编程的时代背景","p":"P07","topic":"无处不在的编程（无人加油站/无人超市/2025 春晚机器人跳民族舞）","script":"那既然我们要去了解编程的时代背景\n我们先来看第一个，我们如何去说明编程已经纳入到我们的生活当中了？其实我们可以举一些信息科技时代的一些场景，比如说像我们的无人加油站、无人超市、无人驾驶等等。那其实现在的这些基础的服务岗位的需求在下降，因为 AI、机器人进行了一部分的替代，这个也是大的趋势。那包括像 2025 年的时候也是第一年机器人走到春晚的舞台上面。那我们都知道春晚的话每一个节目每一个内容都是精心安排的，那其实这个也是一个非常大的一个信号。所以从这些案例我们已经能看到，无论是我们的数字化还是我们的智能化，其实都已经来到了我们的身边。那也就意味着现在教育的整个的方向，国家的发展是希望教育培养的人才和国家发展相匹配，所以你看国家的教育方向也在大力推进的信息科技素养。来看一道题，以下哪些属于「编程已融入生活」的案例？","interact":{"q":"以下哪些属于「编程已融入生活」的案例？【多选】","at":"P07","options":["2025 年春晚机器人跳民族舞","无人加油站、无人超市、无人驾驶","基础服务性岗位需求下降","手写信件越来越多"],"answer":0,"answers":[0,1,2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":9,"stage":"阶段2·编程的时代背景","p":"P08","topic":"少儿编程国际趋势：全球 24 国将编程纳入基础教育体系（日本 2012·中国 2017）","script":"用一张图看世界，可以从这张图看出什么\n我们再来看看国际趋势。全球一共有 24 个国家，已经把编程纳入到基础教育体系当中。像日本早在 2012 年，就已经把编程纳入小学教育，还有很多国家也都在同步推进这件事。不难看出，编程教育早就已经是全球的大趋势。 咱们中国，是在 2017 年出台了第一批少儿编程相关政策，所以不管是时代趋势，还是国际趋势，都再次印证了，少儿编程这个方向的发展潜力和重要性。","interact":null,"sku":"","dept":""},{"row":10,"stage":"阶段2·编程的时代背景","p":"P09","topic":"国内市场规模：2024 年约 488 亿，千亿市场可期（素质→素质学科化→学科教育）","script":"那为了追赶编程教育，在2024年的时候我们确实在编程市场上是有所提升的。2024年少儿编程市场规模大约488亿人民币，未来有望发展成千亿市场。整个行业会经历三个阶段。现阶段是素质教育，市场规模不到500亿，编程主要作为课外培养孩子思维和兴趣的方式，相对小众。未来5到10年，会走向素质学科化，越来越多家长认可编程教育，部分地区试点推广，进入教学体系，市场达到千亿级别。再往后10到20年，会升级到学科教育，人人参与学习，全面纳入学科体系，形成千亿以上的市场规模。跟家长沟通时，这条趋势线可以帮家长理解：现在坚持学，是走在前面，而不是跟风。来看一道题，2024 年少儿编程市场规模约为？","interact":{"q":"2024 年少儿编程市场规模约为？","at":"P09","options":["88 亿人民币——未来有望突破五百亿规模","488 亿人民币——未来有望发展为千亿市场","1488 亿人民币——已经是千亿级的成熟市场","48 亿人民币——行业整体在逐年萎缩退潮"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":11,"stage":"阶段2·编程的时代背景","p":"P10","topic":"10 年后孩子们将面临怎样的社会？（更加先进的人工智能时代）","script":"在10年前、20年前我们还都是小朋友的时候都在玩儿什么游戏？打沙包、纸牌，女孩子跳皮筋。那现在的孩子都在玩儿什么游戏？王者荣耀、三角洲、我的世界 等。这个就是最大的变化\n那大家现在可以先想一想，10年后的孩子们将面临一个什么样的社会？--更加先进、人工智能的时代。来看一道题，10 年后孩子们将面临一个怎样的社会？","interact":{"q":"10 年后孩子们将面临一个怎样的社会？","at":"P10","options":["回到传统手工时代","完全不变","更加先进的人工智能时代","无法预测"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":12,"stage":"阶段2·编程的时代背景","p":"P11","topic":"必备技能演变：70 年代劳动力→80/90 年代高知→科技时代创新人才","script":"了解编程的时代背景：国家的发展方向、教育调整方向，核心都是匹配当下的人才需求。这也是少儿编程需求持续上涨的底层原因，我们可以顺着社会发展的阶段来看。 70 年代，国家重点需要基础劳动力，核心看重体力、吃苦能力和实操手艺，所以技校、专项手艺是当时主流的培养方向。 到了80、90年代，“知识就是力量” 成为共识，学历成为竞争的核心门槛，本科及以上高学历，是进入优质企业的重要加分项。 发展到今天，本科已经是非常普遍的基础门槛，大家开始内卷更高学历。但我们也能看到一个现状：单纯的学历，已经不足以匹配国家的人才标准。不少高学历的人才，缺少创新能力和硬核专项技能。 我们现在的大目标是科教强国、科技强国，需要大量创新型科技人才。人才需求发生转变，教育政策就会同步调整，最终目标，就是培养出适配时代的专项科技后备人才","interact":null,"sku":"","dept":""},{"row":13,"stage":"阶段2·编程的时代背景","p":"P12","topic":"政策视频：记住两个时间点——2017 编程教育落地、2022 新课标改革","script":"那接下来给大家去看一个视频，大家在看的时候注意听，国家在哪个时间段发布了哪些编程教育的政策。视频里的政策比较多，大家不需要逐条背下来，有个大概印象就可以。最需要记住的是两个时间点：2017年，国内编程教育开始落地；2022年，新课标改革，信息科技成为独立的课程科目。下一页我们用一张时间轴，把这条线串起来。","interact":null,"sku":"","dept":""},{"row":14,"stage":"阶段3·少儿编程基础政策","p":"P13","topic":"熟悉少儿编程基础政策（章节页）","script":"接下来进入第二部分：熟悉少儿编程基础政策。\n我们和家长沟通，身份是专业的编程老师。咱们把政策吃透、讲得清楚有条理，家长才会认可我们的专业性，信任我们，放心把孩子交给我们。这块内容大家一定要认真听。","interact":null,"sku":"","dept":""},{"row":15,"stage":"阶段3·少儿编程基础政策","p":"P14","topic":"政策时间线：2017 国务院 AI 规划→2018 新课标必修→2019 五城试点→2022 独立科目","script":"从这张图里，我们国家是什么时候有的编程教育--2017年。通过不断的教育部修改，至今编程学科已经成为至关重要的科目，国内编程教育从2017年开始落地。那一年国务院发布了新一代人工智能发展规划，提出在中小学设置人工智能相关课程，逐步推广编程教育。核桃也正是在2017年成立的。之后教育部的相关政策不断调整完善：2018年，新课标提出信息技术从兴趣课程变为必修课程；2019年，北京、广州、深圳、武汉、西安5个城市作为第一批试点，3到8年级学生全面试点学习人工智能与编程课程。到了2022年，教育部发布义务教育课程方案和课程标准2022年版，信息科技成为全国统一开设的独立课程科目，在3到8年级开设。也就是说，编程已经从课外兴趣，变成了正式纳入考核的重要学科。来看一道题，国内编程教育政策最需要记住的两个时间点是？","interact":{"q":"国内编程教育政策最需要记住的两个时间点是？","at":"P14","options":["2019 年编程教育落地；2024 年新课标改革、信息科技独立成科","2010 年编程教育落地；2015 年新课标改革、信息科技独立成科","2013 年编程教育落地；2018 年新课标改革、信息科技独立成科","2017 年编程教育落地；2022 年新课标改革、信息科技独立成科"],"answer":3,"answers":[3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":16,"stage":"阶段3·少儿编程基础政策","p":"P15","topic":"新课标改革：十年一修，信息科技成为独立学科（与语数外同等重要）","script":"刚刚在2022年里面有提到一个词“新课标”，不少伙伴对这个概念可能还有点模糊。新课标就是新的课程标准，是国家课程的基本纲领性文件。国家会根据当下发展需要的人才类型，来调整课程标准。它不会年年改，大约十年修改一次，最近一次就是在2022年。这次修改最关键的一点，是把信息科技列为一门独立的课程，这意味着信息科技现在和家长、学生重视的语数外学科同等重要。","interact":null,"sku":"","dept":""},{"row":17,"stage":"阶段3·少儿编程基础政策","p":"P16","topic":"课程方案对比：2001 版/2017 修订版/2022 版（信息科技单独成课）","script":"看右边这张表，它把2001版、2017修订版和2022版的义务教育课程方案放在一起对比。大家回忆一下自己上学时的信息技术课是什么样？很多人还记得进机房要套鞋套，课上大多就是学学开机关机这类简单操作，一节课就过去了。那时候信息技术并没有单独列出来，只是放在综合实践活动里。再看2022版，红圈里的信息科技，单独成为3到8年级的一门课程。现在义务教育阶段的信息课，有明确的必修内容，比如正式学习算法、编写程序代码，这些都是新课标要求孩子必须掌握的。所以如果家长还以为学校的信息课只教开关机，大家就可以拿这张表告诉家长，现在早就不一样了。左边这份教育部关于强基计划的文件，我们后面讲升学时再细说。","interact":null,"sku":"","dept":""},{"row":18,"stage":"阶段3·少儿编程基础政策","p":"P17","topic":"部长通道：怀进鹏谈 DeepSeek 与机器人是教育重大机遇","script":"既然我们已经经历了十年一次的新课标大改革，信息科技也成了一门独立学科，那国家到底有多重视？再给大家普及一个知识点。在十四届全国人大三次会议的部长通道上，教育部部长怀进鹏提到，DeepSeek和机器人是教育的重大机遇，将加强计算机等学科建设，推动人工智能等学科设计。大家想一想，部长在这样的场合专门提到这个方向，能不能说明它的重要性？国家层面都这么重视，作为老师和家长，我们要不要重视起来？这也是和续费家长沟通时一个很实在的理由：孩子现在坚持学的，正是国家大力推动的方向。","interact":null,"sku":"","dept":""},{"row":19,"stage":"阶段3·少儿编程基础政策","p":"P18","topic":"学科红利：核桃创始人曾鹏轩、王宇航参与清华版新课标教材编写","script":"我们已经知道了信息科技是纳入到了中小学生的一个必修课程，也是信息科技的一个重要板块。那想给大家再次去普及的一个知识点，当我们在未来给家长去介绍这个编程的红利的时候，我们可以有非常自信的一个特点大家看，核桃的创始人曾鹏轩老师、联合创始人王宇航老师，两位都参与了清华版新课标小学信息科技教材的编写。\n就是信息科技清华版的教材编委。这就是我们最大的优势。来看一道题，核桃哪两位创始人参与了清华版新课标小学信息科技教材的编写？","interact":{"q":"核桃哪两位创始人参与了清华版新课标小学信息科技教材的编写？","at":"P18","options":["曾鹏轩、王宇航","李彦宏、马云","张一鸣、王兴","雷军、俞敏洪"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":20,"stage":"阶段3·少儿编程基础政策","p":"P19","topic":"升学新趋势：2025 信息科技纳入中考地图·184 所中小学 AI 教育基地","script":"接下来看升学的新趋势。左边这张地图，展示的是2025年哪些省份把信息科技纳入了中考：深红色的省份，信息科技是中考考试科目，直接计入中考总分；浅红色的省份，是中考考核科目，计入学生档案。右边是教育部的文件，全国一共有184所中小学入选人工智能教育基地名单，这些基地都以中小学信息科技、通用技术等课程为主要依托，去探索人工智能教育的新理念。看完这些，大家就能感受到，信息科技在升学里的分量正在持续提升。","interact":null,"sku":"","dept":""},{"row":21,"stage":"阶段3·少儿编程基础政策","p":"P20","topic":"地方政策落地：重庆 36 课时·海淀 Scratch/Python·河南纳入初中学业水平测试","script":"我们来讲少儿编程的基础政策。大家可以从图片里看到，现在很多地区，已经把编程纳入正式学习甚至考试当中，像海淀、河南、重庆这些教育重点区域都已经落地了相关政策。\n\n重庆明确要求各中小学开足、开齐编程教育课程，小学 3～6 年级、初中阶段均不少于 36 课时，高中也要按要求开设编程课程。\n海淀这边，建议在中小学开设 Scratch、Python 等程序设计课程，培养编程思维，普及编程教育。\n河南作为教育大省，直接把信息技术纳入初中学业水平测试，考试成绩会用于学生初中毕业认定和学校自主招生，考试不通过将不予毕业。\n\n所以大家能直观感受到，少儿编程这件事，已经越来越重要了。","interact":null,"sku":"","dept":""},{"row":22,"stage":"阶段3·少儿编程基础政策","p":"P21","topic":"名校落地：人大附中实验小学·西安高新十二小·成都锦城小学编程进课堂","script":"那这一页我们接着来看，大家可以看到图片上展示的这些学校，像西安高新区第十二小学、成都高新区锦城小学、中国人民大学附属中学实验小学，这些都是各地的优质名校，它们已经把编程课程正式搬进校内课堂了。\n结合我们刚刚前面讲的各地政策，大家就能发现，编程教育不是只停留在文件上，而是已经实实在在落地到很多重点小学里面了，这个趋势是看得见的。","interact":null,"sku":"","dept":""},{"row":23,"stage":"阶段3·少儿编程基础政策","p":"P22","topic":"物料支撑：最强赛考物料库（定期更新，务必用最新物料）","script":"这个时候可能会有很多的小伙伴说，老师我没接触过编程甚至也是第一次接触教培，我根本不知道如何下手，拿啥给家长讲。大家放心，你们的背后一定会有物料去支撑你们的。\n我们有最强赛考物料库！定期我们的老师会进行更新，大家一定要是最新的物料给家长进行讲解。来看一道题，新伙伴不知道拿什么给家长讲政策，背后的支撑是？","interact":{"q":"新伙伴不知道拿什么给家长讲政策，背后的支撑是？","at":"P22","options":["最强赛考物料库——定期更新，务必使用最新物料","自己上网搜索——搜到什么用什么，不管新旧","凭感觉讲——反正家长也不懂，说个大概就行","不需要支撑——政策内容自己编一编就够了"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":24,"stage":"阶段4·少儿编程升学政策","p":"P23","topic":"熟悉少儿编程升学政策（章节页）","script":"到了第三个部分，其实就是需要大家一起来熟悉一下少儿编程升学的一些政策。从小到大上学的时候，我们听到最多的就是什么？政策二字。\n\n因为走好一个政策是可以让我们在升学和择校这一方面是可以提升自己很大的一个优势。我可以通过政策去进入到好的一些学校，我可以通过一些政策有降分和减分的一些优势。","interact":null,"sku":"","dept":""},{"row":25,"stage":"阶段4·少儿编程升学政策","p":"P24","topic":"科技特长生来了：认证条件·88% 覆盖·2024 取消艺术特长生","script":"大家都熟悉特长生赛道，特长生主要分为三大类：艺术、体育、科技。 我们先看政策变化，2024 年开始，艺术特长生的招生通道在收紧。以前很多家长等到孩子初高中成绩不理想，才临时突击学艺术，想用这个方式助力升学。这类情况越来越多，艺术类人才供给也逐渐饱和，所以现在政策提高了门槛，更看重长期深耕、科班积累的孩子，短期突击很难再走通。 体育赛道同样有它的特点，属于金字塔型竞争，非常依赖先天天赋，能走到最后的孩子占比很小。 而科技特长生，是现在国家重点扶持的新赛道。这张图上也能看到，目前科技特长生全国覆盖率已经达到 88%，覆盖 22 个省份、4 个直辖市、4 个自治区。 它的优势在于，这条赛道可以贯穿小升初、初升高、高考，甚至未来留学、就业，是一条能够长期发展的特长路线，对比艺术、体育赛道，选择空间会更广。","interact":null,"sku":"","dept":""},{"row":26,"stage":"阶段4·少儿编程升学政策","p":"P25","topic":"2013 年推出英才计划：能力提升·助力升学·个人成长与资源","script":"了解完科技特长生呢，我们继续来去了解下一个政策，其实就是英才计划。那英才计划的一个作用呢，其实就是可以让孩子在这个上学期间，可以去多感受一些比如说实验呀，做项目啊。那结束之后的话呢，还会给孩子去颁发这样的一个测评证书。那对于孩子们来说，就是无非就是在升学的时候，再去选择学校的时候，我会被学校去抢着要。那这个其实就是我们最想看到的，最想拿到的这样的一个优势","interact":null,"sku":"","dept":""},{"row":27,"stage":"阶段4·少儿编程升学政策","p":"P26","topic":"强基计划：2020 取消自主招生·39 所 985·本省竞争·85% 高考+15% 校测","script":"还有一个大家必须知道的政策，就是强基计划。2020年，国家取消了自主招生，新增了强基计划。一句话总结它的优势：它不只看高考分，还要看校测成绩，高考分数稍低的孩子也有机会考取名校，相当于存在降分录取的机制。左边是39所强基计划试点高校名单，全部都是九八五高校。右边的对比表里还有几点要注意：强基计划是本省竞争，名额没有限制，录取按百分之八十五的高考成绩加百分之十五的校测成绩评价，招生专业集中在基础学科、计算机类和新工科类。如果家长还是很难理解，我们可以这样讲：学编程，能帮孩子多一条进入重点院校的路，分数不够的时候，特长来补齐。","interact":null,"sku":"","dept":""},{"row":28,"stage":"阶段4·少儿编程升学政策","p":"P27","topic":"强基计划稳坐清北第二大升学通道（清华 24.32%·北大 29.51%）","script":"这是2025年清华北大本科新生的统计，通过强基计划录取的人数，在清华内地招生中占比24.32%，在北大本部占比29.51%。强基计划从2020年开始，一直稳坐清北第二大升学通道，也就是说，除了高考统招，它是进入清北最重要的通道。大家想一想，普通学生想进清华北大，最常见的方式是高考统招。而在高考录取批次里，强基计划在7月5号就完成录取，是最早的一批，早于国家专项计划、国防生等录取批次，足以看出国家对强基计划的重视。所以说，强基计划是普通学生冲刺985院校又一条重要的通道。","interact":null,"sku":"","dept":""},{"row":29,"stage":"阶段4·少儿编程升学政策","p":"P28","topic":"外部因素总结：编程就是二十年前的英语","script":"那最后对于外部因素呢给大家总结出来了两个点。第一个少儿编程是未来的必备技能，孩子现在去学的话呢在未来一定享有优势的，更不用说在未来国家政策方面。\n那整体来说的话呢，编程这一门学科就像当年的我们的英语是一样的。在20年前英语可能对于我们并没有那么的一个重视。突然有一天，英语成为了我们考试当中的一个必考的一个科目并且要纳入到我们的中考和高考的时候，那我们就重视起来了。越早学习编程，孩子越早感受到红利政策，越可以赢在起跑线。","interact":null,"sku":"","dept":""},{"row":30,"stage":"阶段4·少儿编程升学政策","p":"P29","topic":"外部因素·小升初：择校/摇号——白名单编程奖项是简历加分项","script":"那这一页我们来讲外部因素，小升初。对于小学生来说，中考、高考都还比较遥远，他们最先要面对的升学环节就是小升初。虽然九年义务教育，大部分孩子小升初是摇号、划片区升学，但是很多优质学校，是有择优通道的，需要提交孩子简历择校。简历里面一般都会有获奖情况这一栏，有奖项的孩子，和没有奖项的孩子对比，有奖项的会更容易被学校青睐，这也是孩子简历里非常关键的加分项。现在奥数、英语这类竞赛受到限制，而教育部白名单竞赛里面，编程类项目占比很高，也就是说孩子学编程，参加权威竞赛拿到省级以上奖项的机会，会比其他竞赛更大。","interact":null,"sku":"","dept":""},{"row":31,"stage":"阶段4·少儿编程升学政策","p":"P30","topic":"小升初真实案例：双减背景下白名单编程竞赛奖项受优质初中看重","script":"这些都是我们小升初的真实案例~在奥数、英语竞赛受限的“双减”背景下，教育部白名单中的编程竞赛奖项，成为了优质初中筛选生源时非常看重的、能体现孩子学习能力和潜质的证明。","interact":null,"sku":"","dept":""},{"row":32,"stage":"阶段4·少儿编程升学政策","p":"P31","topic":"结束寄语","script":"学习不息,成长不止\n追求卓越,舍我其谁\n培训很苦,坚持很酷\n你的付出\n决定成长速度","interact":null,"sku":"","dept":""},{"row":33,"stage":"阶段4·少儿编程升学政策","p":"P32","topic":"调研问卷","script":"请使用飞书扫描填写你的真实想法吧~","interact":null,"sku":"","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段1","q":"成交三性的正确顺序与内容是？","options":[{"k":"A","t":"重要性（为什么学）→紧迫性（为什么现在学）→唯一性（为什么选核桃）"},{"k":"B","t":"紧迫性（什么时候学）→重要性（学什么）→唯一性（在哪学）"},{"k":"C","t":"唯一性（在哪学）→重要性（为什么学）→紧迫性（什么时候学）"},{"k":"D","t":"重要性（有什么用）→唯一性（凭什么选你）→紧迫性（为什么急）"}],"answer":"A","back":"","sku":""},{"id":"T-S02","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段1","q":"编程的紧迫性（为什么现在学）的理由是？","options":[{"k":"A","t":"小学低中段是逻辑培养黄金期，编程阶梯学习、备赛有周期，越早越从容"},{"k":"B","t":"年级越高课程越简单，短时间就能赶上进度"},{"k":"C","t":"编程课时短见效快，考前突击一两个月就够"},{"k":"D","t":"编程不占课外时间，随时插空学都来得及"}],"answer":"A","back":"","sku":""},{"id":"T-S03","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段1","q":"跟家长讲「为什么学编程」时，可以分成哪两大维度梳理？","options":[{"k":"A","t":"价格因素（课程定价/优惠力度）+服务因素（答疑频率）"},{"k":"B","t":"校内因素（成绩排名/班级表现）+校外因素（兴趣班数量）"},{"k":"C","t":"外部因素（时代背景/国家政策/升学赛道）+内部因素（思维/习惯/能力等素养）"},{"k":"D","t":"家庭因素（家长认知/教育投入）+学校因素（课程设置）"}],"answer":"C","back":"","sku":""},{"id":"T-S04","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段1","q":"「编程不依附于任何校内学科」这句话想传达什么？","options":[{"k":"A","t":"编程与校内无关"},{"k":"B","t":"编程不重要"},{"k":"C","t":"编程是一门真正的学科，不是单纯的兴趣课"},{"k":"D","t":"编程只是游戏"}],"answer":"C","back":"","sku":""},{"id":"T-S05","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段1","q":"本节课的定位是？","options":[{"k":"A","t":"打好编程认知地基——吃透底层逻辑，转化成家长听得懂的表达"},{"k":"B","t":"直接照搬网上的通用话术，拿生硬术语讲给家长"},{"k":"C","t":"只讲价格优惠和赠品，突出便宜好成交"},{"k":"D","t":"只讲赛事获奖案例，突出荣誉好吸引人"}],"answer":"A","back":"","sku":""},{"id":"T-S06","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段2","q":"「全球将编程纳入基础教育体系」的国家数量是？","options":[{"k":"A","t":"24 个——日本早在 2012 年就已纳入小学教育"},{"k":"B","t":"8 个——美国早在 2012 年就已纳入小学教育"},{"k":"C","t":"48 个——英国早在 2012 年就已纳入小学教育"},{"k":"D","t":"5 个——韩国早在 2012 年就已纳入小学教育"}],"answer":"A","back":"","sku":""},{"id":"T-S07","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段2","q":"2024 年少儿编程市场规模与未来趋势是？","options":[{"k":"A","t":"约 488 亿人民币，未来有望发展成千亿市场"},{"k":"B","t":"约 1488 亿人民币，已是千亿级成熟市场"},{"k":"C","t":"约 88 亿人民币，未来有望突破五百亿规模"},{"k":"D","t":"约 48 亿人民币，行业整体逐年萎缩退潮"}],"answer":"A","back":"","sku":""},{"id":"T-S08","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段2","q":"国家人才需求演变的正确顺序是？","options":[{"k":"A","t":"70 年代劳动力→80/90 年代高知劳动力→科技时代创新创造人才"},{"k":"B","t":"70 年代高知劳动力→80/90 年代创新人才→科技时代普通劳动力"},{"k":"C","t":"各个年代都只需要劳动力，人才需求没有变化"},{"k":"D","t":"70 年代创新人才→80/90 年代劳动力→科技时代高知劳动力"}],"answer":"A","back":"","sku":""},{"id":"T-S09","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段2","q":"国内编程教育政策里，最需要记住的两个时间点是？","options":[{"k":"A","t":"2017 年国内编程教育开始落地；2022 年新课标改革、信息科技独立成科"},{"k":"B","t":"2010 年国内编程教育开始落地；2015 年新课标改革、信息科技独立成科"},{"k":"C","t":"2013 年国内编程教育开始落地；2018 年新课标改革、信息科技独立成科"},{"k":"D","t":"2019 年国内编程教育开始落地；2024 年新课标改革、信息科技独立成科"}],"answer":"A","back":"","sku":""},{"id":"T-S10","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段2","q":"10 年后孩子们将面临的社会与当下最大的变化是？","options":[{"k":"A","t":"回归传统手工业时代——娱乐方式从电子游戏变回户外运动"},{"k":"B","t":"更先进的人工智能时代——孩子的娱乐方式已从跳皮筋变成编程相关游戏"},{"k":"C","t":"没有明显变化——学习和娱乐方式和现在基本一样"},{"k":"D","t":"更加依赖人力——孩子的核心技能仍是记忆和重复练习"}],"answer":"B","back":"","sku":""},{"id":"T-S11","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段3","q":"国内编程教育落地的年份，以及国务院发布的文件是？","options":[{"k":"A","t":"2010 年落地；国务院发布《中国教育现代化纲要》，提出全面普及编程教育"},{"k":"B","t":"2017 年落地；国务院发布《新一代人工智能发展规划》，提出逐步推广编程教育"},{"k":"C","t":"2020 年落地；国务院发布《全民数字素养提升意见》，提出编程必修"},{"k":"D","t":"2022 年落地；国务院发布《新课标实施方案》，提出信息科技必修化"}],"answer":"B","back":"","sku":""},{"id":"T-S12","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段3","q":"「新课标」的关键信息是？","options":[{"k":"A","t":"大约五年修改一次，最近一次 2022 年，信息科技列为兴趣选修"},{"k":"B","t":"大约十年修改一次，最近一次 2012 年，信息科技并入综合实践"},{"k":"C","t":"大约十五年修改一次，最近一次 2017 年，信息科技仍在试点"},{"k":"D","t":"大约十年修改一次，最近一次 2022 年，信息科技列为独立课程，与语数外同等重要"}],"answer":"D","back":"","sku":""},{"id":"T-S13","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段3","q":"信息科技纳入中考的情况是？","options":[{"k":"A","t":"全国统一作为中考考试科目计入总分，所有省份完全同步"},{"k":"B","t":"深红色省份仅作展示不计分；浅红色省份作为必修课加入课表"},{"k":"C","t":"深红色省份作为中考考试科目计入总分；浅红色省份作为考核科目计入学生档案"},{"k":"D","t":"所有省份都已取消中考考核，信息科技只做课外兴趣学习"}],"answer":"C","back":"","sku":""},{"id":"T-S14","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段3","q":"地方政策落地情况对应正确的是？【多选】","options":[{"k":"A","t":"重庆：各中小学开足开齐编程课程，小学 3-6 年级、初中不少于 36 课时"},{"k":"B","t":"海淀：建议中小学开设 Scratch、Python 等程序设计课程"},{"k":"C","t":"河南：信息技术纳入初中学业水平测试，不通过不予毕业"},{"k":"D","t":"各地均无编程相关政策"}],"answer":"ABC","back":"","sku":""},{"id":"T-S15","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段3","q":"核桃在学科红利方面的独有优势是？","options":[{"k":"A","t":"创始人曾鹏轩担任教育部新课标专家组组长，主导全国教材审定"},{"k":"B","t":"创始人曾鹏轩、联合创始人王宇航都参与了清华版新课标小学信息科技教材编写"},{"k":"C","t":"联合创始人王宇航是高考信息科技命题人，掌握校内考试方向"},{"k":"D","t":"核桃是唯一被指定为全国信息科技教材出版方的培训机构"}],"answer":"B","back":"","sku":""},{"id":"T-S16","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段4","q":"科技特长生的认定与覆盖情况是？","options":[{"k":"A","t":"教育厅、教育局发文正式定义；覆盖 22 省 4 自治区 4 直辖市，覆盖率超 88%"},{"k":"B","t":"学校自主发文认定；覆盖 12 省 8 自治区 2 直辖市，覆盖率约 50%"},{"k":"C","t":"媒体调查统计得出；覆盖 30 省，覆盖率接近 60%，无官方文件"},{"k":"D","t":"行业协会发文定义；覆盖 10 省，覆盖率不足 30%，仅试点城市"}],"answer":"A","back":"","sku":""},{"id":"T-S17","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段4","q":"「英才计划」对学生的价值不包括？","options":[{"k":"A","t":"能力提升：顶尖科学家指导下参与前沿科学研究"},{"k":"B","t":"助力升学：强基计划、综合评价招生的加分项"},{"k":"C","t":"个人成长：与顶尖导师建立联系、参加顶级科研竞赛"},{"k":"D","t":"直接保送清北"}],"answer":"D","back":"","sku":""},{"id":"T-S18","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段4","q":"关于强基计划，正确的说法是？【多选】","options":[{"k":"A","t":"2020 年取消自主招生后新增"},{"k":"B","t":"39 所试点高校全部是 985"},{"k":"C","t":"本省竞争、名额没有限制"},{"k":"D","t":"录取按 85% 高考+15% 校测"},{"k":"E","t":"面向所有专业"}],"answer":"ABCD","back":"","sku":""},{"id":"T-S19","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段4","q":"强基计划在清北录取中的地位是？","options":[{"k":"A","t":"占比不足 5%，只是普通学生的加分选项"},{"k":"B","t":"2020 年起已被自主招生取代，不再有升学通道作用"},{"k":"C","t":"只面向竞赛保送生，普通学员无法参与选拔"},{"k":"D","t":"2020 年起稳坐清北第二大升学通道（清华 24.32%、北大本部 29.51%）"}],"answer":"D","back":"","sku":""},{"id":"T-S20","type":"阶段练习题","chapter":"为什么要学少儿编程上·阶段4","q":"「编程就是二十年前的英语」想传达的是？","options":[{"k":"A","t":"编程会取代英语，成为校内分值最高的必考主科"},{"k":"B","t":"越早学编程越早享受政策红利、赢在起跑线——就像当年英语纳入中高考后大家才重视"},{"k":"C","t":"英语很快会被取消，编程只是过渡性的过渡科目"},{"k":"D","t":"家长应该先学好英语再学编程，两者不能同时进行"}],"answer":"B","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题","chapter":"为什么要学少儿编程上·全章","q":"成交三性帮家长依次想清楚的三个问题是？","options":[{"k":"A","t":"学什么、在哪学、跟谁学"},{"k":"B","t":"为什么学、为什么现在学、为什么在核桃学"},{"k":"C","t":"多贵、多久、多难"},{"k":"D","t":"老师、教材、教室"}],"answer":"B","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题","chapter":"为什么要学少儿编程上·全章","q":"教育部部长在「部长通道」上谈到的是？","options":[{"k":"A","t":"应试压力仍然优先，暂缓推进计算机等新兴学科建设"},{"k":"B","t":"教育资源仍要集中，不需要关注人工智能新变化"},{"k":"C","t":"传统学科依旧核心，计算机等学科建设不用加强"},{"k":"D","t":"DeepSeek 和机器人是教育重大机遇，要加强计算机、人工智能等学科建设"}],"answer":"D","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题","chapter":"为什么要学少儿编程上·全章","q":"编程的时代背景案例中，2025 年的标志性事件是？","options":[{"k":"A","t":"机器人第一次登上春晚舞台跳民族舞"},{"k":"B","t":"机器人退出春晚"},{"k":"C","t":"无人车被禁止"},{"k":"D","t":"编程被取消"}],"answer":"A","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题","chapter":"为什么要学少儿编程上·全章","q":"已经把编程「搬进课堂」的学校包括？","options":[{"k":"A","t":"北京中关村三小、上海浦东一小、广州天河二小"},{"k":"B","t":"目前只有大学开设，中小学还没有学校开展"},{"k":"C","t":"人大附中实验小学、西安高新区第十二小学、成都高新区锦城小学"},{"k":"D","t":"只有深圳、杭州两地的民办学校开展过编程课"}],"answer":"C","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题","chapter":"为什么要学少儿编程上·全章","q":"2019 年编程教育试点的城市与年级是？","options":[{"k":"A","t":"全国同步铺开试点，不设第一批城市，覆盖全部年级"},{"k":"B","t":"北京、广州、深圳、武汉、西安 5 城作为第一批试点，3-8 年级全面试点"},{"k":"C","t":"上海、南京、杭州、成都、重庆 5 城第一批试点，1-6 年级全面试点"},{"k":"D","t":"仅天津、苏州 2 城试点，只覆盖 9 年级毕业班"}],"answer":"B","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题","chapter":"为什么要学少儿编程上·全章","q":"关于核桃创始人与新课标教材的说法，正确的是？","options":[{"k":"A","t":"两位创始人担任教材的审校顾问，负责插图排版设计"},{"k":"B","t":"两位创始人仅提供教具方案，未参与教材编写工作"},{"k":"C","t":"教材由人民教育出版社出版，与核桃创始人无关"},{"k":"D","t":"曾鹏轩、王宇航两位创始人参与了清华版新课标小学信息科技教材的编写"}],"answer":"D","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题","chapter":"为什么要学少儿编程上·全章","q":"科技特长生的认定条件（奖项门槛）是？","options":[{"k":"A","t":"在校内期末考试中获全班前三，且大多需连续两次以上"},{"k":"B","t":"在专业比赛中获得国家、省市区一二三等奖，且大多需在市级及以上获奖"},{"k":"C","t":"参加任意科技类活动拿到参与证书即可，无获奖等级要求"},{"k":"D","t":"由班主任或学校领导推荐即可，不需要任何比赛成绩"}],"answer":"B","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题","chapter":"为什么要学少儿编程上·全章","q":"强基计划与自主招生的对比，正确的是？","options":[{"k":"A","t":"强基计划 90 所、全国竞争、名额严控 5%、85% 校测+15% 高考；自主招生 39 所、本省竞争"},{"k":"B","t":"强基计划 20 所、本省竞争、名额限制一半、50% 高考+50% 校测；自主招生扩招至 120 所"},{"k":"C","t":"强基计划 39 所（全部 985）、本省竞争、名额不限制、85% 高考+15% 校测；自主招生 90 所、全国竞争、严控 5%"},{"k":"D","t":"强基计划 39 所、全国竞争、名额严控 5%、100% 校测；自主招生已全部取消"}],"answer":"C","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题","chapter":"为什么要学少儿编程上·全章","q":"小升初阶段，白名单编程竞赛奖项的价值是？","options":[{"k":"A","t":"完全没有用，学校只看户籍和房产"},{"k":"B","t":"只能用于出国留学申请，对国内小升初没有帮助"},{"k":"C","t":"可以直接免除摇号环节，保证进入对口优质初中"},{"k":"D","t":"「双减」后奥数英语受限，白名单奖项成为优质初中筛生源的证明"}],"answer":"D","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题","chapter":"为什么要学少儿编程上·全章","q":"跟家长沟通政策与赛道时，正确的做法是？","options":[{"k":"A","t":"直接承诺保录取、保证降 50 分，给家长吃定心丸"},{"k":"B","t":"夸大赛事作用，说拿了奖所有学校都能进"},{"k":"C","t":"把政策说得模糊一点，避免家长追问细节"},{"k":"D","t":"只讲增加赛道、多一个选择权、政策红利，不承诺保录取、一定降分"}],"answer":"D","back":"","sku":""}],"timing":{"P01":{"sents":["我们正式开启本次课程。","本次课程主题：为什么要学少儿编程。"," 这节课的定位，是帮大家打好编程认知的地基。"," 它不是让大家直接去网上复制通用话术，拿生硬的术语或者大白话直接讲给家长。","我们要学会结合咱们的课程体系，把底层逻辑吃透，转化成家长听得懂的表达。\n","这里跟大家明确一个核心：家长很多时候，是看重编程带来的附加价值才会产生兴趣 —— 比如能不能改善孩子的学习习惯、锻炼逻辑思维、和校内语文数学形成联动。","我们吃透这些底层认知，最终目的，是拥有独立回应、解决家长各类异议的能力。"," 不管家长抛出什么疑问，你都能讲明白编程到底是怎么帮到孩子的。\n","只有把「为什么学少儿编程」的底层逻辑吃透，我们才能从容应对家长的各种提问，而不是只会套固定句子。"],"durs":[2.568,3.84,4.512,7.872,7.248,15.432,7.584,5.976,9.24]},"P03":{"sents":["编程的优势咱们都很清楚。","但如果一上来全是我们主动去夸，家长听着就像我们自卖自夸。\n","所以这里先抛一个问题，市面上有很多赛道、很多教育红利，为什么偏偏选择编程？"],"durs":[2.976,6.096,7.992]},"P04":{"sents":["那我们在跟家长讲为什么学编程的时候，可以分成两大维度去梳理，逻辑会特别清晰，也好记、也好讲。"," 一类是外部因素，一类是内部因素。\n","外部因素，简单来说，就是大环境、政策、升学、赛道机会这些客观存在的红利和路径；"," 内部因素，就是落在孩子自己身上的，思维、习惯、能力这些底层素养的提升。"],"durs":[9.624,3.6,8.904,8.136]},"P05":{"sents":["我们先来看一下外部因素。","外部因素，核心就是国家层面的导向、针对少儿科技教育、编程教育出台的一系列政策文件。","我们跟家长讲这部分，核心要传递一个信息：编程已经不是一个课外兴趣、可有可无的爱好，而是国家在大力推进的信息科技素养，是未来孩子需要具备的基础能力。","来看一道题，跟家长讲外部因素时，核心要传递的信息是？"],"durs":[2.592,8.616,14.952,5.688]},"P06":{"sents":["先来了解一下编程的时代背景"],"durs":[3.096]},"P07":{"sents":["那既然我们要去了解编程的时代背景\n","我们先来看第一个，我们如何去说明编程已经纳入到我们的生活当中了？","其实我们可以举一些信息科技时代的一些场景，比如说像我们的无人加油站、无人超市、无人驾驶等等。","那其实现在的这些基础的服务岗位的需求在下降，因为 AI、机器人进行了一部分的替代，这个也是大的趋势。","那包括像 2025 年的时候也是第一年机器人走到春晚的舞台上面。","那我们都知道春晚的话每一个节目每一个内容都是精心安排的，那其实这个也是一个非常大的一个信号。","所以从这些案例我们已经能看到，无论是我们的数字化还是我们的智能化，其实都已经来到了我们的身边。","那也就意味着现在教育的整个的方向，国家的发展是希望教育培养的人才和国家发展相匹配，所以你看国家的教育方向也在大力推进的信息科技素养。","来看一道题，以下哪些属于「编程已融入生活」的案例？"],"durs":[3.696,6.168,9.552,10.128,6.096,9,9.384,13.608,4.92]},"P08":{"sents":["用一张图看世界，可以从这张图看出什么\n","我们再来看看国际趋势。","全球一共有 24 个国家，已经把编程纳入到基础教育体系当中。","像日本早在 2012 年，就已经把编程纳入小学教育，还有很多国家也都在同步推进这件事。","不难看出，编程教育早就已经是全球的大趋势。"," 咱们中国，是在 2017 年出台了第一批少儿编程相关政策，所以不管是时代趋势，还是国际趋势，都再次印证了，少儿编程这个方向的发展潜力和重要性。"],"durs":[4.104,2.544,5.952,8.28,4.896,14.712]},"P09":{"sents":["那为了追赶编程教育，在2024年的时候我们确实在编程市场上是有所提升的。","2024年少儿编程市场规模大约488亿人民币，未来有望发展成千亿市场。","整个行业会经历三个阶段。","现阶段是素质教育，市场规模不到500亿，编程主要作为课外培养孩子思维和兴趣的方式，相对小众。","未来5到10年，会走向素质学科化，越来越多家长认可编程教育，部分地区试点推广，进入教学体系，市场达到千亿级别。","再往后10到20年，会升级到学科教育，人人参与学习，全面纳入学科体系，形成千亿以上的市场规模。","跟家长沟通时，这条趋势线可以帮家长理解：现在坚持学，是走在前面，而不是跟风。","来看一道题，2024 年少儿编程市场规模约为？"],"durs":[7.416,8.184,2.976,9.552,11.664,9.816,8.64,4.992]},"P10":{"sents":["在10年前、20年前我们还都是小朋友的时候都在玩儿什么游戏？","打沙包、纸牌，女孩子跳皮筋。","那现在的孩子都在玩儿什么游戏？","王者荣耀、三角洲、我的世界 等。","这个就是最大的变化\n","那大家现在可以先想一想，10年后的孩子们将面临一个什么样的社会？","--更加先进、人工智能的时代。","来看一道题，10 年后孩子们将面临一个怎样的社会？"],"durs":[5.88,3.48,3.216,3.888,2.352,6.288,3.12,5.064]},"P11":{"sents":["了解编程的时代背景：国家的发展方向、教育调整方向，核心都是匹配当下的人才需求。","这也是少儿编程需求持续上涨的底层原因，我们可以顺着社会发展的阶段来看。"," 70 年代，国家重点需要基础劳动力，核心看重体力、吃苦能力和实操手艺，所以技校、专项手艺是当时主流的培养方向。"," 到了80、90年代，“知识就是力量” 成为共识，学历成为竞争的核心门槛，本科及以上高学历，是进入优质企业的重要加分项。"," 发展到今天，本科已经是非常普遍的基础门槛，大家开始内卷更高学历。","但我们也能看到一个现状：单纯的学历，已经不足以匹配国家的人才标准。","不少高学历的人才，缺少创新能力和硬核专项技能。"," 我们现在的大目标是科教强国、科技强国，需要大量创新型科技人才。","人才需求发生转变，教育政策就会同步调整，最终目标，就是培养出适配时代的专项科技后备人才"],"durs":[8.52,7.2,12.168,11.856,7.056,6.6,5.328,6.912,9.648]},"P12":{"sents":["那接下来给大家去看一个视频，大家在看的时候注意听，国家在哪个时间段发布了哪些编程教育的政策。","视频里的政策比较多，大家不需要逐条背下来，有个大概印象就可以。","最需要记住的是两个时间点：2017年，国内编程教育开始落地；","2022年，新课标改革，信息科技成为独立的课程科目。","下一页我们用一张时间轴，把这条线串起来。"],"durs":[9.096,6.24,6.576,6.048,4.32]},"P13":{"sents":["接下来进入第二部分：熟悉少儿编程基础政策。\n","我们和家长沟通，身份是专业的编程老师。","咱们把政策吃透、讲得清楚有条理，家长才会认可我们的专业性，信任我们，放心把孩子交给我们。","这块内容大家一定要认真听。"],"durs":[4.68,4.224,9.216,3.048]},"P14":{"sents":["从这张图里，我们国家是什么时候有的编程教育--2017年。","通过不断的教育部修改，至今编程学科已经成为至关重要的科目，国内编程教育从2017年开始落地。","那一年国务院发布了新一代人工智能发展规划，提出在中小学设置人工智能相关课程，逐步推广编程教育。","核桃也正是在2017年成立的。","之后教育部的相关政策不断调整完善：2018年，新课标提出信息技术从兴趣课程变为必修课程；","2019年，北京、广州、深圳、武汉、西安5个城市作为第一批试点，3到8年级学生全面试点学习人工智能与编程课程。","到了2022年，教育部发布义务教育课程方案和课程标准2022年版，信息科技成为全国统一开设的独立课程科目，在3到8年级开设。","也就是说，编程已经从课外兴趣，变成了正式纳入考核的重要学科。","来看一道题，国内编程教育政策最需要记住的两个时间点是？"],"durs":[5.88,9.696,10.008,3.456,10.32,12.144,13.128,6.552,5.808]},"P15":{"sents":["刚刚在2022年里面有提到一个词“新课标”，不少伙伴对这个概念可能还有点模糊。","新课标就是新的课程标准，是国家课程的基本纲领性文件。","国家会根据当下发展需要的人才类型，来调整课程标准。","它不会年年改，大约十年修改一次，最近一次就是在2022年。","这次修改最关键的一点，是把信息科技列为一门独立的课程，这意味着信息科技现在和家长、学生重视的语数外学科同等重要。"],"durs":[8.256,5.784,5.544,6.504,11.616]},"P16":{"sents":["看右边这张表，它把2001版、2017修订版和2022版的义务教育课程方案放在一起对比。","大家回忆一下自己上学时的信息技术课是什么样？","很多人还记得进机房要套鞋套，课上大多就是学学开机关机这类简单操作，一节课就过去了。","那时候信息技术并没有单独列出来，只是放在综合实践活动里。","再看2022版，红圈里的信息科技，单独成为3到8年级的一门课程。","现在义务教育阶段的信息课，有明确的必修内容，比如正式学习算法、编写程序代码，这些都是新课标要求孩子必须掌握的。","所以如果家长还以为学校的信息课只教开关机，大家就可以拿这张表告诉家长，现在早就不一样了。","左边这份教育部关于强基计划的文件，我们后面讲升学时再细说。"],"durs":[8.976,4.536,8.904,6.12,6.84,11.16,9.288,6.312]},"P17":{"sents":["既然我们已经经历了十年一次的新课标大改革，信息科技也成了一门独立学科，那国家到底有多重视？","再给大家普及一个知识点。","在十四届全国人大三次会议的部长通道上，教育部部长怀进鹏提到，DeepSeek和机器人是教育的重大机遇，将加强计算机等学科建设，推动人工智能等学科设计。","大家想一想，部长在这样的场合专门提到这个方向，能不能说明它的重要性？","国家层面都这么重视，作为老师和家长，我们要不要重视起来？","这也是和续费家长沟通时一个很实在的理由：孩子现在坚持学的，正是国家大力推动的方向。"],"durs":[9.408,2.64,14.832,6.912,5.664,8.592]},"P18":{"sents":["我们已经知道了信息科技是纳入到了中小学生的一个必修课程，也是信息科技的一个重要板块。","那想给大家再次去普及的一个知识点，当我们在未来给家长去介绍这个编程的红利的时候，我们可以有非常自信的一个特点大家看，核桃的创始人曾鹏轩老师、联合创始人王宇航老师，两位都参与了清华版新课标小学信息科技教材的编写。\n","就是信息科技清华版的教材编委。","这就是我们最大的优势。","来看一道题，核桃哪两位创始人参与了清华版新课标小学信息科技教材的编写？"],"durs":[8.496,20.736,3.6,2.52,7.68]},"P19":{"sents":["接下来看升学的新趋势。","左边这张地图，展示的是2025年哪些省份把信息科技纳入了中考：深红色的省份，信息科技是中考考试科目，直接计入中考总分；","浅红色的省份，是中考考核科目，计入学生档案。","右边是教育部的文件，全国一共有184所中小学入选人工智能教育基地名单，这些基地都以中小学信息科技、通用技术等课程为主要依托，去探索人工智能教育的新理念。","看完这些，大家就能感受到，信息科技在升学里的分量正在持续提升。"],"durs":[2.64,13.056,4.992,16.008,6.912]},"P21":{"sents":["那这一页我们接着来看，大家可以看到图片上展示的这些学校，像西安高新区第十二小学、成都高新区锦城小学、中国人民大学附属中学实验小学，这些都是各地的优质名校，它们已经把编程课程正式搬进校内课堂了。\n","结合我们刚刚前面讲的各地政策，大家就能发现，编程教育不是只停留在文件上，而是已经实实在在落地到很多重点小学里面了，这个趋势是看得见的。"],"durs":[20.424,13.92]},"P22":{"sents":["这个时候可能会有很多的小伙伴说，老师我没接触过编程甚至也是第一次接触教培，我根本不知道如何下手，拿啥给家长讲。","大家放心，你们的背后一定会有物料去支撑你们的。\n","我们有最强赛考物料库！","定期我们的老师会进行更新，大家一定要是最新的物料给家长进行讲解。","来看一道题，新伙伴不知道拿什么给家长讲政策，背后的支撑是？"],"durs":[11.064,4.68,2.568,6.72,6.336]},"P23":{"sents":["到了第三个部分，其实就是需要大家一起来熟悉一下少儿编程升学的一些政策。","从小到大上学的时候，我们听到最多的就是什么？","政策二字。\n\n","因为走好一个政策是可以让我们在升学和择校这一方面是可以提升自己很大的一个优势。","我可以通过政策去进入到好的一些学校，我可以通过一些政策有降分和减分的一些优势。"],"durs":[7.08,4.392,1.872,7.128,7.68]},"P24":{"sents":["大家都熟悉特长生赛道，特长生主要分为三大类：艺术、体育、科技。"," 我们先看政策变化，2024 年开始，艺术特长生的招生通道在收紧。","以前很多家长等到孩子初高中成绩不理想，才临时突击学艺术，想用这个方式助力升学。","这类情况越来越多，艺术类人才供给也逐渐饱和，所以现在政策提高了门槛，更看重长期深耕、科班积累的孩子，短期突击很难再走通。"," 体育赛道同样有它的特点，属于金字塔型竞争，非常依赖先天天赋，能走到最后的孩子占比很小。"," 而科技特长生，是现在国家重点扶持的新赛道。","这张图上也能看到，目前科技特长生全国覆盖率已经达到 88%，覆盖 22 个省份、4 个直辖市、4 个自治区。"," 它的优势在于，这条赛道可以贯穿小升初、初升高、高考，甚至未来留学、就业，是一条能够长期发展的特长路线，对比艺术、体育赛道，选择空间会更广。"],"durs":[7.248,7.008,8.544,13.176,9.24,4.896,10.944,14.928]},"P25":{"sents":["了解完科技特长生呢，我们继续来去了解下一个政策，其实就是英才计划。","那英才计划的一个作用呢，其实就是可以让孩子在这个上学期间，可以去多感受一些比如说实验呀，做项目啊。","那结束之后的话呢，还会给孩子去颁发这样的一个测评证书。","那对于孩子们来说，就是无非就是在升学的时候，再去选择学校的时候，我会被学校去抢着要。","那这个其实就是我们最想看到的，最想拿到的这样的一个优势"],"durs":[6.888,9.624,5.328,8.592,5.64]},"P26":{"sents":["还有一个大家必须知道的政策，就是强基计划。","2020年，国家取消了自主招生，新增了强基计划。","一句话总结它的优势：它不只看高考分，还要看校测成绩，高考分数稍低的孩子也有机会考取名校，相当于存在降分录取的机制。","左边是39所强基计划试点高校名单，全部都是九八五高校。","右边的对比表里还有几点要注意：强基计划是本省竞争，名额没有限制，录取按百分之八十五的高考成绩加百分之十五的校测成绩评价，招生专业集中在基础学科、计算机类和新工科类。","如果家长还是很难理解，我们可以这样讲：学编程，能帮孩子多一条进入重点院校的路，分数不够的时候，特长来补齐。"],"durs":[4.32,5.352,12.048,6.144,17.256,10.752]},"P27":{"sents":["这是2025年清华北大本科新生的统计，通过强基计划录取的人数，在清华内地招生中占比24.32%，在北大本部占比29.51%。","强基计划从2020年开始，一直稳坐清北第二大升学通道，也就是说，除了高考统招，它是进入清北最重要的通道。","大家想一想，普通学生想进清华北大，最常见的方式是高考统招。","而在高考录取批次里，强基计划在7月5号就完成录取，是最早的一批，早于国家专项计划、国防生等录取批次，足以看出国家对强基计划的重视。","所以说，强基计划是普通学生冲刺985院校又一条重要的通道。"],"durs":[14.352,10.896,6.696,14.088,6.504]},"P28":{"sents":["那最后对于外部因素呢给大家总结出来了两个点。","第一个少儿编程是未来的必备技能，孩子现在去学的话呢在未来一定享有优势的，更不用说在未来国家政策方面。\n","那整体来说的话呢，编程这一门学科就像当年的我们的英语是一样的。","在20年前英语可能对于我们并没有那么的一个重视。","突然有一天，英语成为了我们考试当中的一个必考的一个科目并且要纳入到我们的中考和高考的时候，那我们就重视起来了。","越早学习编程，孩子越早感受到红利政策，越可以赢在起跑线。"],"durs":[4.68,10.248,6.168,4.968,10.032,6.216]},"P29":{"sents":["那这一页我们来讲外部因素，小升初。","对于小学生来说，中考、高考都还比较遥远，他们最先要面对的升学环节就是小升初。","虽然九年义务教育，大部分孩子小升初是摇号、划片区升学，但是很多优质学校，是有择优通道的，需要提交孩子简历择校。","简历里面一般都会有获奖情况这一栏，有奖项的孩子，和没有奖项的孩子对比，有奖项的会更容易被学校青睐，这也是孩子简历里非常关键的加分项。","现在奥数、英语这类竞赛受到限制，而教育部白名单竞赛里面，编程类项目占比很高，也就是说孩子学编程，参加权威竞赛拿到省级以上奖项的机会，会比其他竞赛更大。"],"durs":[3.888,8.448,11.616,14.04,16.296]},"P31":{"sents":["学习不息,成长不止\n","追求卓越,舍我其谁\n","培训很苦,坚持很酷\n","你的付出\n","决定成长速度"],"durs":[2.712,2.784,2.736,1.872,2.016]},"P02":{"sents":["我们先来聊一聊成交三性，就是帮家长依次想清楚三个问题：为什么学、为什么现在学、为什么选核桃。\n\n","1. 重要性：为什么要学编程\n","编程锻炼孩子逻辑思维，助力校内理科学习；","顺应 AI 时代发展，同时可以走信息竞赛赛道，给孩子多一条特长路径，不是单纯的兴趣课。","编程不依附于任何校内学科，而是一门真正的学科了。\n","2. 紧迫性：为什么要现在学\n","小学低中段是逻辑培养黄金期，越早起步压力越小。","编程是阶梯学习，备赛也需要周期，等到高年级学业变重再启动，时间紧、追赶难度大。","越早学习孩子能达到的水平越高。\n","3. 唯一性：为什么选择核桃编程\n","我们拥有完整连贯的学习体系，覆盖 Scratch、Python、C++ 全路线，课程内容对标赛考考点，学练同步。","独有莫顿课程体系，主打动手实操、一学九练，孩子兴趣启蒙、长期赛事规划一站式落地。\n","总结：先让家长认可价值，再让家长明白不能一直等，最后锁定我们，三步打通，推动成交\n","其实把课程售卖出去你们需要让家长意识到这个课程对于他来说是重要的，且现在就要买的，这样才能最大的情况下让家长进行购买，这节课就是给大家讲重要性的，也是让家长把钱掏出来的关键！","重中之重！","来看一道题，成交三性依次要帮家长想清楚的三个问题是？"],"durs":[9.624,3.12,4.536,8.904,4.968,3.168,5.64,8.736,3.552,3.6,10.584,9.048,9.12,17.352,1.872,5.616]},"P20":{"sents":["我们来讲少儿编程的基础政策。","大家可以从图片里看到，现在很多地区，已经把编程纳入正式学习甚至考试当中，像海淀、河南、重庆这些教育重点区域都已经落地了相关政策。\n\n","重庆明确要求各中小学开足、开齐编程教育课程，小学 3～6 年级、初中阶段均不少于 36 课时，高中也要按要求开设编程课程。\n","海淀这边，建议在中小学开设 Scratch、Python 等程序设计课程，培养编程思维，普及编程教育。\n","河南作为教育大省，直接把信息技术纳入初中学业水平测试，考试成绩会用于学生初中毕业认定和学校自主招生，考试不通过将不予毕业。\n\n","所以大家能直观感受到，少儿编程这件事，已经越来越重要了。"],"durs":[3.216,13.392,12.984,9.528,13.488,5.928]},"P30":{"sents":["这些都是我们小升初的真实案例~在奥数、英语竞赛受限的“双减”背景下，教育部白名单中的编程竞赛奖项，成为了优质初中筛选生源时非常看重的、能体现孩子学习能力和潜质的证明。"],"durs":[16.896]},"P32":{"sents":["请使用飞书扫描填写你的真实想法吧~"],"durs":[3.912]}},"v":{"slides/P01.jpg":"bd94cdd6","slides/P01.png":"3b7dbd8f","slides/P02.jpg":"357f22d8","slides/P02.png":"95c0a058","slides/P03.jpg":"8dbd5a60","slides/P03.png":"7235d3be","slides/P04.jpg":"5cc913f9","slides/P04.png":"1695c1f3","slides/P05.jpg":"be7daf6d","slides/P05.png":"39283efe","slides/P06.jpg":"89381e2d","slides/P06.png":"ee6286ea","slides/P07.jpg":"92ec4f10","slides/P07.png":"a673ed88","slides/P08.jpg":"92faadcb","slides/P08.png":"a76df819","slides/P09.jpg":"5814a1d9","slides/P09.png":"7eec5f4a","slides/P10.jpg":"db8a0870","slides/P10.png":"62de98d3","slides/P11.jpg":"5b7c1d9e","slides/P11.png":"4cc45900","slides/P12.jpg":"8bd1e54c","slides/P12.png":"22f490e4","slides/P13.jpg":"036a5c8b","slides/P13.png":"bb09f841","slides/P14.jpg":"36632673","slides/P14.png":"02908507","slides/P15.jpg":"b9ed03ef","slides/P15.png":"2ac84065","slides/P16.jpg":"e491d0d3","slides/P16.png":"992634b3","slides/P17.jpg":"2f35a783","slides/P17.png":"fcc93563","slides/P18.jpg":"1ccbf89f","slides/P18.png":"91300488","slides/P19.jpg":"13470f73","slides/P19.png":"3a995d77","slides/P20.jpg":"5d030e11","slides/P20.png":"f4cf1429","slides/P21.jpg":"77f89ab5","slides/P21.png":"4727233a","slides/P22.jpg":"4dabdbae","slides/P22.png":"401aa2eb","slides/P23.jpg":"7559d6b2","slides/P23.png":"b4d25439","slides/P24.jpg":"2da509e9","slides/P24.png":"eb033ce4","slides/P25.jpg":"3550f181","slides/P25.png":"b533cb8a","s const PASS = 0.6; // 合格线：取自「合格线与重学规则」表「阶段合格线 60%」
const CFG = {"key":"中价_为什么学上-v1","title":"为什么要学少儿编程（上）","short":"为什么要学少儿编程（上）","tag":"中价课 · 新人训","hero":"P01","titles":{"1":"课程定位与成交三性","2":"编程的时代背景","3":"少儿编程基础政策","4":"少儿编程升学政策"},"depts":["国润","汇诚"]};
const KEY = CFG.key;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 课程结构 ---------- */
/* 部门 / SKU 可见性：标「通用」或未标的页所有人可见；带标签的页只有选中的部门/SKU 命中才显示（多选任一命中即可） */
const normTag = t => String(t||'').replace(/1部/g,'一部').replace(/2部/g,'二部').replace(/苍穹鼎/g,'苍穹顶').replace(/\s/g,'');
const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return (!CFG.depts || tagOk(p.dept, st && st.depts)) && (!CFG.skus || tagOk(p.sku, st && st.skus)); }
let STAGES = [];
function buildStages(){
  STAGES = [];
  for (const p of DATA.pages) {
    if (!pageVisible(p)) continue;
    let s = STAGES.find(x => x.name === p.stage);
    if (!s) { s = {name:p.stage, num:+(/阶段\s*(\d+)/.exec(p.stage)||[0,STAGES.length+1])[1], pages:[]}; STAGES.push(s); }
    s.pages.push(p);
  }
  for (const s of STAGES) s.quiz = DATA.qs.filter(q => /阶段练习/.test(q.type) && +(/阶段\s*(\d+)/.exec(q.chapter)||[])[1] === s.num);
}
let st = null; buildStages();
const TITLES = CFG.titles || {};
const FINAL = DATA.qs.filter(q => /综合测试/.test(q.type));

/* ---------- 学习记录（仅存本机浏览器） ---------- */
function fresh(){ return {name:'', team:'', sid:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), unlocked:0, heard:{}, passed:{}, tries:{}, best:{}, final:null, finalTries:0, view:'home', cur:{s:0,p:0}, stageSec:{}}; }
try { st = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e) { st = fresh(); }
buildStages();
// 恢复进度链接：#r=base64(JSON {k,sid,passed:[..],best:{..}})，只对本课 key 生效
let RESTORE=null; try { const m=/[#&]r=([^&]+)/.exec(location.hash); if(m){ const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))))); if(o.k===CFG.key) RESTORE=o; history.replaceState(null,'',location.pathname+location.search); } } catch(e) {}
function applyRestore(){ if(!RESTORE) return false; const o=RESTORE; RESTORE=null;
  st.sid=o.sid||st.sid; st.rowCreated=true;
  for(const i of o.passed){ if(!STAGES[i]) continue; st.passed[i]=true; STAGES[i].pages.forEach(p=>st.heard[p.p]=true); }
  st.unlocked=Math.max(st.unlocked, Math.max(-1,...o.passed)+1); Object.assign(st.best,o.best||{}); save(); return true; }
if (RESTORE && st.name) { applyRestore(); }
// 旧版本里小测没加载、0/0 直接过关的阶段：重新打开，补做小测（已听过的页面不用重听）
(function fixZeroPass(){ let first=-1; STAGES.forEach((s,i)=>{ if(st.passed[i] && s.quiz.length && st.best[i]==null){ delete st.passed[i]; if(first<0) first=i; } }); if(FINAL.length && st.final && st.final.pass && !st.final.score){ st.final=null; save(); } if(first>=0){ st.unlocked=Math.min(st.unlocked, first); if(st.final && !st.final.pass) st.final=null; save(); } })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }
if (!st.sid) st.sid = 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
if (!st.stageSec) st.stageSec = {};

/* ---------- 学习数据上报（飞书多维表格 Webhook，实时写入） ---------- */
const HOOK = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/Z0UnaFjXvwZxHrhrmiFcMjSJnEd';
const pad = n => String(n).padStart(2,'0');
function nowStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function stageLabel(i){ const s = STAGES[i]; return s ? (s.name + (TITLES[s.num] ? ' ' + TITLES[s.num] : '')) : ''; }
const mins = sec => Math.round((sec||0)/6)/10;
/* 每个关卡的过程数据：play=实际播放秒数 occ=占用秒数 pn/ps=暂停次数/秒 kn/ks=卡顿次数/秒 */
function stat(k){ st.stat = st.stat || {}; return st.stat[k] = st.stat[k] || {play:0, occ:0, pn:0, ps:0, kn:0, ks:0}; }
function curKey(){ return st.view === 'quiz' ? (st.quiz === 'final' ? 'f' : st.quiz) : st.cur.s; }
function stageStatusText(k){
  if (k !== 'f' && !STAGES[k]) return '';
  const done = k === 'f' ? !!(st.final && st.final.pass) : !!st.passed[k];
  if (done) return '已完成';
  if ((st.view === 'learn' || st.view === 'quiz') && String(curKey()) === String(k)) return '进行中';
  const s = st.stat && st.stat[k];
  return s && s.occ > 0 ? '进行中' : '未开始';
}
function snapshot(online){
  const keys = [0,1,2,3,'f'], sum = f => keys.reduce((a,k) => a + ((st.stat&&st.stat[k]&&st.stat[k][f])||0), 0);
  const play = sum('play'), occ = sum('occ');
  const sc = i => st.best[i] != null ? `${st.best[i]}/${STAGES[i].quiz.length}` : '';
  const cur = st.view === 'quiz' ? (st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz) + '·小测') : (st.view === 'learn' ? stageLabel(st.cur.s) : '课程首页');
  const cp = st.view === 'learn' ? (curPageSafe()||{}).p || '' : '';
  return {online: online || '学习中', cur_stage:(CFG.short||CFG.title)+'｜'+cur, cur_page:cp,
    st1:stageStatusText(0), st2:stageStatusText(1), st3:stageStatusText(2), st4:stageStatusText(3), stf:stageStatusText('f'),
    sc1:sc(0), sc2:sc(1), sc3:sc(2), scf: st.final ? `${st.final.score}/${FINAL.length}` : '',
    play_min:mins(play), occ_min:mins(occ), gap_min:mins(Math.max(0, occ-play)),
    pause_n:sum('pn'), pause_min:mins(sum('ps')), stall_n:sum('kn'), stall_min:mins(sum('ks')),
    relearn_n:Object.values(st.relearnCnt||{}).reduce((a,b)=>a+b,0),
    quiz_switch_n:sum('qn'), quiz_switch_min:mins(sum('qs'))};
}
/* 第二个 Webhook：学员第一次出现时，在「学员实时状态」表新建他的那一行 */
const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid, course:CFG.short||CFG.title, date:nowStr().slice(0,10)}, ev, snapshot(online));
  { const CNm = CFG.short || CFG.title; if (!String(rec.stage||'').startsWith(CNm + '｜')) rec.stage = CNm + (rec.stage ? '｜' + rec.stage : ''); }
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}
/* 实际收听时长：只在播放时累计，按真实时间计（倍速播放不重复计） */
let pageSec = 0, lastT = null;
function flushPage(event){
  const p = curPageSafe();
  if (p && pageSec >= 3) report({event, stage:stageLabel(st.cur.s), page:p.p, minutes:mins(pageSec), detail:p.topic});
  pageSec = 0;
}
function curPageSafe(){ try { return STAGES[st.cur.s].pages[st.cur.p]; } catch(e) { return null; } }
let leftSent = false;
function leaveCourse(){
  if (leftSent || !st.name) return; leftSent = true;
  if (st.view === 'learn') { endPause(false); flushPage('中途离开'); }
  endQuizAway(false);
  save();
  const where = st.view === 'quiz' ? '测试中' : st.view === 'learn' ? '听课中' : '课程首页';
  bot(who() + '在' + CN + '课已离开');

      const ds = pick('dept'), ks = pick('sku'), m = $('#formMsg');
      if (!v || !ds.length || (CFG.skus && !ks.length)) { m.hidden = false; m.textContent = CFG.skus ? '请填写姓名，并至少选择一个部门和一个 SKU。' : '请填写姓名，并至少选择一个部门。'; return; }
      st.depts = ds; st.skus = ks; t = ds.join('、'); extra = `｜部门：${ds.join('、')}` + (CFG.skus ? `｜SKU：${ks.join('、')}` : '');
    } else { t = $('#tm').value.trim(); if (!v || !t) return; }
    st.name = v; st.team = t; buildStages();
    if (!STAGES.length) { const m = $('#formMsg'); m.hidden = false; m.textContent = '你选择的部门 / SKU 暂时没有对应课件，请确认后重新选择。'; st.name = ''; st.depts = st.skus = null; buildStages(); return; }
    const rs = applyRestore(); save();
    report({event:'进入课程', detail:(rs?'恢复进度':'首次进入') + extra}); startStage(rs ? Math.min(st.unlocked, STAGES.length-1) : 0); };
  const r = $('#resume'); if (r) r.onclick = () => { report({event:'进入课程', detail:'继续学习'}); startStage(Math.min(st.unlocked, STAGES.length-1), true); };
  const c = $('#cert'); if (c) c.onclick = () => showQuiz('final');
  const x = $('#reset'); if (x) x.onclick = () => {
    if (x.dataset.armed){ st = fresh(); save(); buildStages(); render(); return; }
    x.dataset.armed = 1; x.textContent = '再点一次确认清空记录';
    const m = $('#resetMsg'); m.hidden = false; m.textContent = '清空后本机的学习进度和成绩都会删除。';
  };
}

function startStage(i, resume){
  if (stageStatus(i) === 'lock') return;
  if (st.cur.s !== i || !resume) {
    // 进入阶段：从第一页未听完的页开始
    const s = STAGES[i]; let p = s.pages.findIndex(pg => !st.heard[pg.p]); if (p < 0) p = 0;
    st.cur = {s:i, p};
  }
  st.view = 'learn'; save(); renderLearn(true);
}

function renderLearn(autoplay){
  const s = curStage(), p = curPage();
  const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const heard = !!st.heard[p.p];
  $('#app').innerHTML = `${headerHTML()}
  ${mapHTML(st.cur.s)}
  ${loopHTML(0)}
  <div class="stage-head"><h2>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}　<span class="muted" style="font-weight:400;font-size:15px">${p.p} ${esc(p.topic)}</span></h2>
    <span class="time">第 ${st.cur.p+1} / ${s.pages.length} 页</span></div>
  <div class="slide">${p.video?`<video id="vd" src="${VU(p.video)}" poster="${SL(p.p)}" controls playsinline preload="metadata" style="width:100%;max-height:70vh;display:block;object-fit:contain;background:#000"></video>`:`<img src="${SL(p.p)}" alt="${esc(p.p+' '+p.topic)}">`}
    <div class="veil" id="veil" ${autoplay?'hidden':''}><button class="btn" id="veilBtn">▶ 点击播放讲解</button></div></div>
  <div class="sub" id="sub" aria-live="polite">${esc(tm.sents[0].trim())}</div>
  <div class="bar">
    <button class="btn ghost" id="prev" ${st.cur.p===0?'disabled':''}>上一页</button>
    <button class="btn" id="pp">播放</button>
    <button class="btn ghost" id="again">重听本页</button>
    <div class="prog" aria-hidden="true"><div id="progfill"></div></div>
    <span class="time" id="time">0:00 / ${fmt(total)}</span>
    <div class="speed" role="group" aria-label="语速">${[1,1.25,1.5].map(r=>`<button data-r="${r}" class="${r===rate?'on':''}">${r}x</button>`).join('')}</div>
    <button class="btn" id="next" ${heard?'':'disabled'}>${st.cur.p===s.pages.length-1?(s.quiz.length?'去做阶段小测':'完成本阶段'):'下一页'}</button>
  </div>
  <div class="dots">${s.pages.map((pg,i)=>`<button class="dot ${st.heard[pg.p]?'heard':''} ${i===st.cur.p?'now':''} ${pg.interact?'q':''}" data-pg="${i}" ${(st.heard[pg.p]||i===st.cur.p)?'':'disabled'} title="${esc(pg.topic)}">${pg.p}</button>`).join('')}</div>
  <details class="full"><summary>展开本页讲解全文</summary><p>${esc(p.script)}</p></details>`;
  bindCommon();
  delete au.dataset.retried; au.src = VU('audio/'+p.p+'.mp3');
  { const im=document.querySelector('.slide img'); if(im && !im.complete){ im.style.opacity=0; im.onload=()=>{im.style.transition='opacity .2s';im.style.opacity=1;}; im.onerror=()=>{ if(!im.dataset.r){ im.dataset.r=1; im.src=im.src+'&r='+Date.now(); } else im.style.opacity=1; }; } }
  [1].forEach(k=>preload(s.pages[st.cur.p+k])); if(st.cur.p+1>=s.pages.length) preload((STAGES[st.cur.s+1]||{pages:[]}).pages[0]);
  au.currentTime = 0; lastT = 0;
  report({event:'进入页面', stage:stageLabel(st.cur.s), page:p.p, detail:p.topic});
  $('#veilBtn').onclick = play;
  { const v = $('#vd'); if (v) v.onplay = () => au.pause(); }
  $('#pp').onclick = () => playing ? au.pause() : play();
  $('#again').onclick = () => { au.currentTime = 0; play(); };
  $('#prev').onclick = () => goPage(st.cur.p-1);
  $('#next').onclick = () => nextPage();
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => goPage(+b.dataset.pg));
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { rate = +b.dataset.r; au.playbackRate = rate;
    document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on', x===b)); });
  if (autoplay) {
    // 等这一页的 PPT 图片加载完再开始讲，避免「声音在讲、画面还没出来」；最多等 8 秒
    const im = document.querySelector('.slide img');
    if (im && !im.complete) {
      let done = false; const go = () => { if (done) return; done = true; if (curPage() === p && st.view === 'learn') play(); };
      im.addEventListener('load', go, { once: true }); im.addEventListener('error', go, { once: true }); setTimeout(go, 8000);
    } else play();
  }
}
function navStop(){ endPause(false); if (!au.paused) { navPause = true; au.pause(); } }
function goPage(i){ navStop(); flushPage('学习页面(未听完)'); st.cur.p = i; save(); renderLearn(true); }
function nextPage(){
  const s = curStage();
  if (st.cur.p < s.pages.length-1) return goPage(st.cur.p+1);
  navStop();
  if (s.quiz.length) return showQuiz(st.cur.s);
  // 无小测的阶段（成果验证）：听完即过关
  const firstDone = !st.passed[st.cur.s];
  st.passed[st.cur.s] = true; st.unlocked = Math.max(st.unlocked, st.cur.s+1); save();
  if (firstDone) report({event:'完成阶段', stage:stageLabel(st.cur.s), pass:'是', detail:`本阶段无小测，听完即过关｜${stageDetail(st.cur.s)}`});
  showQuiz('final');
}
function onPageEnd(){
  const p = curPage();
  const first = !st.heard[p.p];
  flushPage(first ? '听完页面' : '重听页面');
  st.heard[p.p] = true; save();
  const nb = $('#next'); if (nb) nb.disabled = false;
  if (pendingAfter) { const f = pendingAfter; pendingAfter = null; if (f.page === p.p) return f(); }
  if (p.interact && (first || !st.answered?.[p.p])) return askInteract(p);
  setTimeout(() => { if (!playing && st.view==='learn' && curPage()===p && !document.querySelector('.modal')) nextPage(); }, 1200);
}

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>

</body></html>
