/* Layout: 单列课堂播放器——上方阶段闯关条，中间 PPT 原图，下方字幕与控制；小测/成绩为同宽卡片 */

}

  --sub-bg:#0e0b09; --sub-fg:#fff7ef; color-scheme:dark}}

  --brand:#ff7d33; --brand-soft:#3c2618; --brand-ink:#ffb07f;

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}

button{font:inherit;cursor:pointer;border:0;border-radius:10px}

.speed button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}

/* 弹题 */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.6);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:560px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}

/* 小测 */

.qitem:first-of-type{border-top:0;padding-top:0}
.qitem .qt{font-weight:600}
.qitem .qn{font-family:var(--f-num);color:var(--brand-ink);margin-right:6px}

/* 首页 */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.hero img{border-radius:12px;width:100%}
.hero form{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;font-size:14px}.chip input{width:auto}
.hero input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}

@media (prefers-reduced-motion:no-preference){.prog div{transition:width .25s linear}}

<script>
const DATA = {"pages":[{"row":2,"stage":"阶段1·开篇共识与课程导览","p":"P01","topic":"封面：核桃编程·9元课导内训——图形化课程体系","script":"哈喽各位9元课导的小伙伴，今天的培训课程是「图形化课程体系」","interact":null,"sku":"","dept":""},{"row":3,"stage":"阶段1·开篇共识与课程导览","p":"P02","topic":"开篇共识·IDENTITY：这次课目标——把课程设计讲给家长听","script":"这次课程的核心目标是：在日程沟通把我们的课程设计讲给家长听。先说一个我们日常最容易踩的坑：家长一提问题、一提需求，我们第一反应往往是「我会怎么样」——我是孩子的课导老师，我个人能做什么？比如家长说：「老师，我希望孩子课程掌握得更好一点」，我们顺嘴就答：「行，我会给孩子额外出题」。站在家长那边，他听到的是一次性的个人承诺：万一我请假、万一有突发情况，这事可能就没了。换一种说法：我们的后台会实时监测学习进度，如果某个知识点掌握得特别快，系统会自动推送隐藏的拔高任务。同样一件事，家长感受到的是一套机制；用「我会」来讲，他感受到的只是课导个人。所以在课导这一层，我们要让家长信的是课程设置、是产品，不是某个人。以后每次回答家长的问题，大家先想一步：我们的课程设计怎么解决他这个疑虑，再说我这边会怎么跟进。把课程体系的设计逻辑外化出来，让家长看到背后是一套完整的成长机制。来看一道题，家长说「希望孩子掌握得更好一点」，下面哪种回应符合「外化课程设计」的核心原则？","interact":{"q":"家长说「希望孩子掌握得更好一点」，下面哪种回应符合「外化课程设计」的核心原则？","at":"P02","options":["行，我会给孩子额外出题","我们的后台会实时监测学习进度，知识点掌握得快，系统会自动推送隐藏的拔高任务"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":4,"stage":"阶段1·开篇共识与课程导览","p":"P03","topic":"目录","script":"那今天分3个板块。第一个，解决家长对图形化的简介；第二个，讲课程体系简介，了解我们的课程结构和市面上机构的差距；把课程设计拆开，让家长知道这套设计从哪来；第三个，AI 对练的流程和红线标准。","interact":{"q":"今天课程的三大板块，你最想先吃透哪一个？","at":"P03","options":["图形化简介","课程体系简介","AI对练"],"answer":-1,"answers":[],"vote":true,"wrong":"直接继续"},"sku":"","dept":""},{"row":5,"stage":"阶段2·图形化简介：为什么学编程·为什么学图形化","p":"P04","topic":"图形化简介 CHAPTER 01（章节页）","script":"我们首通和家长沟通，在询问孩子现有兴趣班、确认上课时间是否冲突时，就要提前铺垫编程的重要性，价值赋能不能偷懒，并且要贯穿整个半年学习周期。\n很多家长后期频繁请假，回溯根源，就是前期价值没有讲透。在家长视角里，各类兴趣班本质上都是争夺孩子有限的课余时间，属于互相竞争的关系。家长是在众多兴趣里选择了编程，但时间资源是有限的，别的课程挤压过来，编程就很容易变成优先舍弃的那一个。\n\n日常回访、家长提请假的时候，都是我们赋能的机会。我们要持续和家长讲清楚：少儿编程的核心价值，对比其他课外班的独特优势，以及图形化学习阶段的意义。只有家长真正理解我们的不可替代性，才愿意优先保留编程课时，稳定出勤，后续也更愿意续报下一阶段。","interact":null,"sku":"","dept":""},{"row":6,"stage":"阶段2·图形化简介：为什么学编程·为什么学图形化","p":"P05","topic":"三条教育赛道对比：科技是国家刚需","script":"我们日常和家长潜移默化沟通，经常会拿各类兴趣班做对比。\n在首次沟通，或是跟进孩子学习情况的时候，可以先询问家长，孩子目前在学习哪些兴趣班。\n\n无论家长回答是体育类，还是艺术类兴趣，我们都可以送上温馨提醒。\n如果是体育项目，可以这样说：体育类课程很不错，可以磨炼孩子耐心。运动前一定要充分热身，避免受伤。像学习游泳的孩子，冬天尽量选择水温适宜的游泳馆，防止水温过低引发不适。\n\n如果是舞蹈这类艺术项目，可以这样说：舞蹈训练对孩子的身形要求较高，不少学员需要控制饮食，甚至配合出汗服等方式管理体态，长期训练会比较辛苦。\n\n之后顺势过渡，还好您给孩子安排了编程课程。编程不存在运动受伤的风险，也不需要刻意管控体态。\n\n接下来，我们进一步了解家长的规划，询问家长，让孩子学习这项兴趣，是打算走专业路线，还是仅作为爱好培养。\n\n如果家长表示，只是当作爱好、锻炼孩子，我们可以这样回应：您的想法非常合理。\n体育方向属于竞争狭窄的赛道，可选出路有限；艺术类特长生的招生规模，也在逐步收缩。\n等到小学高年级，孩子时间紧张，大部分家庭会缩减兴趣班。在众多兴趣里面，编程建议从头坚持学习。它契合国家相关政策方向，属于刚需能力培养。\n\n整套沟通思路，就是通过询问孩子现有的兴趣班，引出不同教育赛道的客观对比，自然而然，向家长介绍编程的价值。","interact":null,"sku":"","dept":""},{"row":7,"stage":"阶段2·图形化简介：为什么学编程·为什么学图形化","p":"P06","topic":"政策层面：编程进入国家战略","script":"前面我们和家长做了潜移默化的沟通铺垫。但仅仅依靠口头讲解，家长的认可度和信任度往往很难拉满。我们需要结合国家教育政策，把价值落地。\n\n编程学习，已经纳入国家教育战略布局。我们国家正在推进科教强国、科技强国建设，需要大量信息科技方向的人才，国家人才导向非常清晰。教育是为国家输送人才，国家的发展方向，就是教育的发展方向。\n\n2022 年，十年一轮的义务教育新课改落地，信息科技正式从综合实践活动中独立出来，成为一门独立课程。\n\n同时，信息学竞赛，是强基计划认可的基础学科竞赛赛道之一。信息学的能力培养链路非常连贯。在众多兴趣方向里面，它是少数，能够从小升初特长登记、初升高科技特长、一直衔接至大学强基计划，甚至延伸到未来职业发展的长线赛道。这点和基础学科是一样的，是可以贯穿孩子整个求学阶段，长期发挥价值的底层能力。","interact":null,"sku":"","dept":""},{"row":8,"stage":"阶段2·图形化简介：为什么学编程·为什么学图形化","p":"P07","topic":"编程思维：说家长听得懂的「白话版」","script":"和家长沟通编程思维，我们要多角度输出，但不能说得太书面、太专业。一旦满是专业名词，家长反而会觉得我们不接地气，不容易认可。\n大家可以把这张白话对照表熟记下来，在跟家长讲思维能力的时候，全部换成生活化、孩子学习里能碰到的场景来讲，同时结合编程实操去解释。如果讲完之后家长还是不太理解，可以直接把这张对照表发给家长。\n\n首先是分解能力：简单来说，就是把复杂的大问题，拆成一个个好理解、好执行的小步骤。放到校内学习，就像孩子做数学应用题，先读题、拆分条件、一步步求解，也能改善孩子平时丢三落四的习惯。放到编程当中，孩子拿到一道编程题目，同样要先审题，找到里面的关键要求，再把整体任务拆成一步一步来实现。\n\n第二是模式识别：就是学会找规律，在陌生的新题目里面，认出以前学过、练过的同类题型。比如数学公式套用、语文里面同一个汉字在不同词语里的意思辨析，都用到这个能力。落实到编程里也是一样，孩子看到题目要求重复做一件事情，马上就能联想到重复执行、循环模块；看到想要实现某一种固定效果，也能快速对应上配套的代码。\n\n第三是抽象能力：就是从很多相似的事情里面，提炼出共通的规律，总结好之后，下次遇到同类问题直接复用，也就是我们常说的举一反三、归纳总结。在编程里，就是把重复用到的功能提炼出来，封装成一段通用代码，之后再需要这个效果的时候，直接调用就可以，不用从头重新编写。\n\n第四是算法思维：就是梳理出一套完整有序的思路来解决问题，同一个问题还可以有多种处理方式，找到更简便、效率更高的办法。就像从 1 加到 100，用求和公式就可以快速算出结果，不用一个个硬加。放到编程中，就是规划代码的执行顺序，思考多种写法，挑选逻辑更清晰、运行效率更高的方案。来看一道题，「孩子能从很多相似的事情里提炼出共通规律、举一反三」，指的是哪种编程思维？","interact":{"q":"「孩子能从很多相似的事情里提炼出共通规律、举一反三」，指的是哪种编程思维？","at":"P07","options":["分解","模式识别","抽象","算法"],"answer":2,"answers":[2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":9,"stage":"阶段2·图形化简介：为什么学编程·为什么学图形化","p":"P08","topic":"编程思维 × 学科学习，本质是同一套流程","script":"刚刚我们拆解了四大编程思维，大家会发现，这些能力并不是编程独有的。\n编程思维和校内学科学习，本质上走的是同一套思考流程。\n\n孩子在校内做题第一步是读题，放到编程里对应的就是需求分析，核心都是信息提取和筛选，本质就是读懂规则，只要漏掉关键信息，很容易全盘出错。\n第二步理解题意，对应编程里的问题拆解，锻炼的是逻辑分解、搭建思路的能力，也就是把大问题拆成小块，逐个去解决。\n第三步套用公式和方法，对应编程里调用模块、函数，考验知识迁移，要清楚工具什么时候能用、什么时候不能用。\n第四步按步骤演算，对应编程的顺序执行、流程控制，培养有序思维，一步一步推进，跳步骤就很容易出错，顺序本身就是逻辑。\n第五步得出答案，对应编程输出结果，目标清晰，对错分明，没有模糊空间。\n最后一步检查改错，对应编程里的调试 Debug，重点是找到错在哪一步，学会自我复盘纠正，这个能力比单纯改出正确答案更加重要。\n\n像舞蹈、架子鼓这类兴趣班，更多是帮孩子放松身心、培养爱好，很难直接对接校内做题的这套思考模式。\n但编程不一样，它训练的整套思考流程，和孩子上学做题高度相通。\n这里有一句可以直接讲给家长的金句：所有课外班里，除了语数外补课，最贴近孩子学习习惯和学习模式的就是编程。别的兴趣班让孩子放松，编程让孩子练大脑，而且练的是跟上学直接挂钩的大脑。","interact":null,"sku":"","dept":""},{"row":10,"stage":"阶段2·图形化简介：为什么学编程·为什么学图形化","p":"P09","topic":"图形化 vs Python / C++：低门槛、高上限","script":"刚刚我们了解到，编程训练的思考方式，能够直接迁移到校内学科的学习当中。很多家长接下来会疑惑，编程是不是一上来就要写英文代码，图形化编程和 Python、C++ 又有什么样的区别。\n\n我们可以这样跟家长解释：\n图形化编程，也就是 Scratch，是拖拽积木块的形式，不需要打字，5 岁以上的孩子就可以上手。它没有复杂语法门槛，内容直观好理解。\n而 Python 和 C++，需要孩子使用键盘输入英文语法，对识字、英文基础有一定要求，还需要记忆语法规则。\n\n很多家长担心，学图形化是不是上限很低，以后没法参加比赛。这里要跟家长明确：上限是一样的**。不管是图形化，还是 Python、C++，都可以参与等级考试、国家级以及白名单科创赛事，先学图形化，完全不会耽误孩子后续往高阶路线发展。\n\n图形化编程有三大优势：\n第一，门槛低，画面形象有趣，避开复杂语法的压力，但是完整保留编程思维训练；\n第二，上限高，同样可以对接白名单赛事、校园实践，还能做动画、小游戏开发；\n第三，同步提升孩子的逻辑思维、专注力，从小培养做事的条理性。\n\n简单来说，图形化是适合低龄孩子的入门路径，先把底层思维打牢，等能力、基础到位之后，再平稳过渡到 Python 和 C++。来做一道判断题：家长担心「学图形化上限低，以后没法参加白名单赛事」，这个担心是正确的吗？","interact":{"q":"家长担心「学图形化上限低，以后没法参加白名单赛事」，这个担心是正确的吗？","at":"P09","options":["对","错"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":11,"stage":"阶段3·课程体系简介：为什么选核桃·莫顿因材施教","p":"P10","topic":"课程体系简介 CHAPTER 02（章节页）","script":"前面我们区分了图形化、Python 和 C++ 各自的特点，清楚了图形化是低门槛、高上限的入门选择。\n接下来，我们进入第二部分，给大家介绍核桃编程完整的课程体系。\n这一部分，我们会跟家长讲明白，为什么选择核桃编程，我们如何做到因材施教，以及整套课程的设计逻辑和进阶结构。我们会按照孩子的年龄、学习基础、发展目标，匹配对应的学习路线，循序渐进，稳步培养孩子的编程能力。","interact":null,"sku":"","dept":""},{"row":12,"stage":"阶段3·课程体系简介：为什么选核桃·莫顿因材施教","p":"P11","topic":"莫顿课程：新课 vs 老课，处处不同","script":"接下来，我们重点介绍核桃编程的莫顿课程，这也是我们和其他编程品牌最核心的差异点。\n很多家长在多家机构对比的时候，都会问，核桃和别的编程平台有什么不一样。我们可以直接告诉家长，最核心的答案就是这套莫顿课程，市面上目前没有同类产品。\n\n我们可以通过新课和老课的对比，让家长清楚课程升级之后的变化。\n现在我们的新课是一周两课，一次上课包含两个课时，课程结构采用多分支解锁模式，可以根据每个孩子具体的学习情况，解锁对应的课程关卡，不再是所有学员统一一套课程。\n\n在介绍 S 低阶段新课之前，先跟大家说明一下，为什么我们会选择侦探题材。\n主要有两点原因。第一，孩子看侦探类内容，代入感会更强，故事里孩子就是主角，主动参与整个过程，主人公意识更突出，上课也更投入。第二，破案本身就需要梳理思路、一步步推理判断，这个过程正好能锻炼孩子的逻辑思维，和我们编程学习要练的思路是一致的。\n\n也有家长会关心，课堂里会不会出现不合适的内容。大家可以放心，我们的侦探题材，最终走向都是光明和正义，整体内容正向健康，符合少儿教学的标准。\n\nS 低阶段新课采用侦探题材，增加大量剧情互动；课堂讲解当中穿插多种互动形式，会根据孩子不同的回答给到差异化反馈。关卡可以按照孩子的掌握程度解锁分支，孩子也能根据自己的兴趣，挑选不同难度、不同样式的关卡。科普内容结合科技与生活，像二维码、自动驾驶、北斗卫星这些内容，并且把科普单独做成有仪式感的真人讲解环节。\n\nS 高阶段新课，题材升级为穿越加武侠风格，同样增加剧情互动。关卡增加前进、后退这类游戏化设计，趣味性更强。科普方向融入科技、生活和传统文化，比如舞狮、人体姿态识别等等。\n\n以前的老课是一周一课，全班进度统一、视频统一、关卡统一，科普只是简单融合在动画里面。新旧版本一对比，优势非常清晰。\n如果家长想看得更细致，我们可以直接把这张对比表发给家长。优质课程搭配贴心服务，才能给到孩子更好的学习效果。","interact":{"q":"莫顿 S 低阶段新课为什么选择侦探题材？（无对错，自由选择）","at":"P11","options":["孩子看侦探类内容代入感更强、上课更投入","破案要梳理思路、推理判断，正好锻炼逻辑思维","两者都是"],"answer":-1,"answers":[],"vote":true,"wrong":"直接继续"},"sku":"","dept":""},{"row":13,"stage":"阶段3·课程体系简介：为什么选核桃·莫顿因材施教","p":"P12","topic":"对标主竞品：直播大锅饭 vs 核桃设计","script":"刚刚我们了解了莫顿课程新旧版本的差异，很多家长在选课时，还会拿核桃和市面上其他编程机构做横向对比。猿编程、学而思、作业帮、高途编程，它们都属于直播大锅饭的模式，这类直播课，普遍会存在几个共通的问题。\n\n第一，直播大班很难实时关注到每一个孩子；核桃依靠系统实时监测学习进度，课导通过企微侧边栏点对点跟进。\n第二，直播很难做分层教学，经常是不同基础的孩子统一授课；我们依靠多分支关卡自动分层，真正做到因材施教。\n第三，直播课堂里很难随时停下答疑，孩子当场的疑问没法及时解决；核桃有课导同步跟课答疑，系统记录闯关数据，学习轨迹还可以回溯复盘。\n第四，纯直播的形式，孩子动手实操的体验比较弱；我们软硬件交替配合，搭配分支关卡，充分保障孩子动手实操训练。\n\n总结来说，市面上做少儿编程的品牌很多，家长经常会问我们到底差别在哪，最核心的答案依旧是这套独有的莫顿课程，目前市面上没有同类产品。我们这套课程结构、剧情设计、分支关卡，能够充分照顾到不同基础、不同进度的孩子，同时后台课导、授课老师同步跟进答疑。优质课程搭配贴心服务，才能给到孩子更好的学习效果。来看一道题，家长问「你们和猿编程、学而思有什么不一样」，最核心的答案是什么？","interact":{"q":"家长问「你们和猿编程、学而思有什么不一样」，最核心的答案是什么？","at":"P12","options":["我们价格更便宜","莫顿课程，市面上目前没有同类产品","我们广告打得响","我们老师更年轻"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":14,"stage":"阶段3·课程体系简介：为什么选核桃·莫顿因材施教","p":"P13","topic":"前置拆雷：家长问「为什么是动画？」","script":"接下来我们做一个前置拆雷，这是一个很高频的高危问题：很多家长会问，为什么我们的课程里面是动画？甚至会直接质疑，我花钱，难道只是买了一个动画看？这个疑问，我们一定要在前期主动给家长讲清楚，不要等到后面家长再来提出。\n\n我们可以用两个简单的类比跟家长解释。\n第一个类比，口述和视频的差别。如果我只跟孩子说，先举两下手、再扭屁股、再转三圈，孩子很难还原这个动作；但如果放一段视频演示，孩子马上就能看懂。\n第二个类比，看图识字。孩子还不认识字的时候，都是先通过图片去认字、认人、认事物，动画帮助孩子学习，是同一个道理。\n\n这里跟家长讲清楚核心：动画是剧情引入，最终落脚点是实操。剧情动画的目的，是抓住孩子的注意力，把孩子的心思带到学习当中。课程用视频演示，而不是单纯靠大段文字讲解，孩子一看就懂，不容易卡在同一个地方反复为难，学习节奏能够连贯，孩子的兴趣才能长久留住。","interact":null,"sku":"","dept":""},{"row":15,"stage":"阶段3·课程体系简介：为什么选核桃·莫顿因材施教","p":"P14","topic":"前置拆雷：「录播不如直播」","script":"还有一个家长很容易有的固有想法，就是觉得录播不如直播，经常会问我：录播课没有老师盯着，管得住孩子吗？我们也提前把这个问题给大家拆解清楚。\n\n我们可以这样跟家长沟通：您想一想，就算学校老师站在孩子面前，也很难做到百分百监管。孩子哪怕趴着走神，只要不扰乱课堂纪律，老师也很难时刻兼顾。所以老师站在面前，不等于做到了真正有效的监管。\n\n咱们核桃课程的底层设计是，孩子必须完成闯关，才可以继续推进剧情。后台可以清晰看到他尝试了多少次、选择了哪一关、卡在哪一步，这些都是孩子真实的学习数据。这种基于学习行为的追踪，比单纯有人坐在面前看着，要有效得多。\n\n简单来说，我们不靠老师盯着画面，而是依靠课程闯关机制，倒逼孩子动手练习，每一次操作、每一次尝试全部都能回溯，学习状态全程实时监测。","interact":null,"sku":"","dept":""},{"row":16,"stage":"阶段3·课程体系简介：为什么选核桃·莫顿因材施教","p":"P15","topic":"莫顿因材施教：多分支解锁，三种情况各有设计","script":"刚刚我们提前解答了家长对于动画、录播形式的疑问，接下来我们再深入看一看莫顿课程因材施教的核心设计：多分支解锁，针对孩子学习当中三种常见情况，都有专门对应的安排。\n\n第一种，学得快的孩子。系统会自动触发隐藏关卡，给孩子拔高拓展，不让学有余力的孩子 “吃不饱”。课导可以在企微侧边栏随时查看进度，点对点同步给家长。\n\n第二种，学得慢的孩子。孩子可以自主选择适合自己的难度星级，系统后台会持续记录，精准抓取反复出错的薄弱点。课导会按照孩子真实进度和家长反馈，沟通的时候我们绝对不会说 “孩子笨” 这类话，只客观反馈知识点掌握情况。\n\n第三种，孩子忘记上节课内容。课程自带剧情回顾环节，会提问孩子对应的知识点。孩子如果选择 “忘了”，系统就自动回放复习；如果记得，就直接进入新内容，灵活衔接，不会卡进度，也不用家长额外花时间帮孩子复习。\n\n也可以看画面里的星级选卡和回顾弹窗，难度选择权交给孩子，让每个孩子都在适配自己的节奏里学习。","interact":null,"sku":"","dept":""},{"row":17,"stage":"阶段3·课程体系简介：为什么选核桃·莫顿因材施教","p":"P16","topic":"隐藏关卡机制：怎么讲给家长听","script":"刚才提到学得快的孩子会触发隐藏关卡，这里我们来看一看隐藏关卡的底层机制，以及我们该怎么讲给家长听。\n\n大家可以看左边的流程图，系统会根据孩子每一关的完成时长自动判断。孩子做题速度快、掌握得熟练，满足时长条件之后，就会自动分流，开启额外的隐藏挑战关卡。整个过程孩子是无感的，不会觉得是额外加任务。\n\n给家长沟通的话术我们可以这样说：因为孩子学得快，在他不自知的情况下，系统给他单独加了几关，他比别的孩子多学了一点点知识。这样说，家长听完会很惊喜，会觉得：我孩子真棒！\n\n这些隐藏关卡里面，会包含知识点的嵌套、拓展练习，在巩固原有知识的基础上适度拔高，不强行加压，给学有余力的孩子多一点探索空间。","interact":null,"sku":"","dept":""},{"row":18,"stage":"阶段4·核桃如何教学：课程设计与专注力","p":"P17","topic":"课程设计·兴趣：三层互动设计","script":"了解完因材施教的闯关机制之后，我们来看核桃课程在兴趣上的设计 —— 三层互动体系。\n整个互动分为三层，是一个循序渐进的金字塔：\n第一层，先吸引注意力，让孩子坐得住，打好入门基础；\n第二层，给到参与感，充分激发孩子的学习兴趣；\n第三层，引发独立思考，给到孩子挑战感，让孩子愿意主动钻研。\n\n课程题材也做了丰富的区分，有古诗动画、白盒思维测试、飞机大战、舞台剧创作等等，兼顾不同孩子的喜好。\n我们可以用这句金句跟家长沟通：男孩喜欢飞机大战，女孩喜欢古诗动画，我们不会让您孩子学一套 “一刀切” 的内容。软件课和硬件课交替安排，不同题材轮换，孩子每周都有新鲜感，不容易学腻。学到 L4 到 L5 阶段，还会产出可以对外展示的作品，像古诗动画、坐标歌，孩子学到的成果看得见、摸得着，很有成就感。","interact":null,"sku":"","dept":""},{"row":19,"stage":"阶段4·核桃如何教学：课程设计与专注力","p":"P18","topic":"课程设计·效果外化：三类题材各有分工","script":"我们的课程题材不是随便设计的，一共分成三大类，各自承担不同作用，做到效果外化，平衡孩子的兴趣和家长的期待。\n\n第一类是**实用生活类**，主打展示价值，比如家务转盘、电子贺卡、声控机器人。优势是寓教于乐，贴合生活，还能增进亲子互动；短板是拓展空间有限，惊喜感偏弱。孩子做完可以直接展示给家人看，家长很容易看见学习成果。\n\n第二类是**游戏娱乐类**，核心用来吸引孩子，像飞机大战、彩虹猫、汉堡、电子宠物。趣味性、创造性很强，孩子愿意主动上手。但这类题材评价两极，家长会担心孩子沉迷。咱们的飞机大战和普通小游戏不一样，在设计上是引导孩子思考、锻炼设计能力，和单纯玩游戏区分开。\n\n第三类是**学科学习类**，用来取悦家长，比如蜗牛爬井、田忌赛马、古诗绘本。可以对接校内知识，锻炼逻辑思维，家长一眼就能看到和学科挂钩。相对的，趣味性会弱一些，部分孩子会觉得没有那么好玩。\n\n简单总结：生活类方便展示成果、游戏类抓住孩子、学科类对接课内，三类题材穿插搭配，兼顾两边的需求，不会偏科。来看一道题，下列课程题材中，哪些属于「学科学习类」、用来对接校内知识取悦家长？","interact":{"q":"下列课程题材中，哪些属于「学科学习类」、用来对接校内知识取悦家长？【多选】","at":"P18","options":["蜗牛爬井","飞机大战","田忌赛马","古诗绘本"],"answer":0,"answers":[0,2,3],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":20,"stage":"阶段4·核桃如何教学：课程设计与专注力","p":"P19","topic":"L1-L6：每个阶段的课程目的与侧重","script":"接下来我们看 L1 到 L6 每个阶段的课程目的和侧重点，大家对整条课程线的阶段规划要有清晰的认知。\n\nL1 属于全额退费期，这一阶段的核心目的是防退费。课程设计上做到轻松简单，覆盖的作品类型比较广，先让孩子学得轻松、有兴趣，顺利把入门阶段走完。\n\nL2、L3 是学习期，也是赛考期。这一阶段的目的是防止孩子流失，难度阶梯式慢慢往上爬坡，同时通过赛事激励保持活跃。对应的赛事类型比较多，像 CTL、YCL、图灵杯、RB 等都有覆盖。课程侧重点依然是轻松简单、类型覆盖面广，不让孩子一开始就被难度压住。\n\nL4、L5 是续报预热阶段，核心目的是效果外化。课程里加入更多和学科挂钩的内容，操作类型更丰富，同时做好难度控制。这一阶段也会多加硬件作品，像智能小车这类，现在家长的接受度比以前更高，孩子做出来看得见，满意度会明显提升。\n\nL6 是成长追单阶段，侧重点是给孩子仪式感和成长感。孩子会完成一个完整作品，做综合应用，快乐结业。这个环节有点像幼儿园毕业典礼，很多孩子学到这一步，会舍不得老师、舍不得课程，我们在这个阶段也能再跟进一部分续报。\n\n大家对每个阶段的目的和侧重心里有数之后，跟家长沟通时，就可以结合孩子当前所处的阶段，讲清楚这一阶段学什么、有什么收获。","interact":null,"sku":"","dept":""},{"row":21,"stage":"阶段4·核桃如何教学：课程设计与专注力","p":"P20","topic":"课程设计·学得会：三层难度设计","script":"我们每一次课内部，都做了三层难度设计，保证孩子 “学得会”，分层设置，不制造学习焦虑。\n\n第一层：**当前能学会的**，是本节课的核心知识点。教学方式是实操关卡、多加练习。目的是让孩子稳稳掌握基础，建立信心和成就感，这是本节课必须拿下的内容。\n\n第二层：**跳一跳能做到的**，属于略有挑战的拓展内容。我们用视频演示、科普讲解的方式呈现，**不强迫孩子上手操作**。主要用来开阔眼界，给孩子埋下期待，让他知道后面还有更有意思的内容。\n\n第三层：**跳一跳有可能的**，属于难度更高的进阶内容。只需要看一看、了解一下就可以，不强求掌握。目的是保护孩子的好奇心，不为难孩子，不制造焦虑。\n\n简单总结：保底内容保证学会、拓展内容激发向往、高阶内容只做科普。不揠苗助长，循序渐进，让孩子愿意持续学下去。来做一道判断题：「跳一跳有可能的」较难进阶内容，要求孩子必须当堂掌握、不能放过吗？","interact":{"q":"「跳一跳有可能的」较难进阶内容，要求孩子必须当堂掌握、不能放过吗？","at":"P20","options":["是，必须掌握","否，看一看就行，不强求掌握"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":22,"stage":"阶段4·核桃如何教学：课程设计与专注力","p":"P21","topic":"专为孩子专注力设计的课程结构","script":"接下来我们看专为孩子专注力设计的课程结构。\n整节课的学习体验、学习内容、剧情内容三条曲线，全部按照孩子专注力的变化规律来排布。\n\n前 20 到 30 分钟，是孩子专注力最强的黄金时段，我们安排集中学习 2 个核心知识板块，搭配实操练习，把重难点放在状态最好的时候吸收。\n30 分钟之后，孩子专注力自然开始下滑，这个时候课程的剧情密度、闯关密度会快速拉高，用孩子感兴趣的剧情、闯关任务，把注意力重新拉回来。\n最后安排第 3 个知识板块，也是难度最轻的板块，让孩子轻松完成，带着成就感收尾，不会带着挫败感下课。一节课一共设置 3 个知识板块。\n\n这里给大家准备好家长问「孩子坐不住」的标准应答话术：\n妈妈，20-30 分钟是孩子最专注的时间段，这是生理规律。我们的课程在前半课时学 2 个知识点，30 分钟后剧情密度和选关频率会显著增加，系统本身就在用孩子最爱的方式把注意力拉回来。我也会观察他的选关情况，判断他有没有走神。来看一道题，家长说「孩子坐不住」，下面哪种课导版回答是正确的？","interact":{"q":"家长说「孩子坐不住」，下面哪种课导版回答是正确的？","at":"P21","options":["20-30分钟是孩子最专注的时间段，这是生理规律；30分钟后剧情密度和选关频率会显著增加，系统在用孩子最爱的方式把注意力拉回来","孩子还小，长大就好了","那我每天陪着他上课盯着"],"answer":0,"answers":[0],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":23,"stage":"阶段5·课程结构梳理：思维版与科特版","p":"P22","topic":"思维版：软编 + 硬编交替推进","script":"现在我们进入第五部分，课程结构梳理，先看思维版：软编和硬编交替推进，也就是 Scratch 图形化这条线的学习节奏。\n\n整体从 LEVEL 1 到 LEVEL 6，按月度四周来排布：\n第一周、第二周、第四周，全部安排软编课。\n第三周穿插软硬课：L1、L3、L5 第三周是软编课；L2、L4、L6 第三周安排硬编课。\n\n整套思维版总课时：软编课一共 42 课时，硬编课一共 6 课时。\n\n硬件课穿插进来，作为阶段性的实物落地，把代码从屏幕里落到实物小车、硬件作品上，增加孩子的新鲜感，也方便效果外化。软硬搭配，不会一直对着电脑写代码。来看一道题，思维版课程中，L2、L4、L6 的第三周安排的是什么课？","interact":{"q":"思维版课程中，L2、L4、L6 的第三周安排的是什么课？","at":"P22","options":["软编课","硬编课","赛事直播课","复习课"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":24,"stage":"阶段5·课程结构梳理：思维版与科特版","p":"P23","topic":"科特版：软编 + 硬编 + 赛事课交替推进","script":"接下来我们看科特版课程，整体是**软编、硬编、赛事课交替推进**的学习节奏。\n它不是零散的兴趣班，而是一整套按月排布的体系，和思维版相比，科特增加了完整的赛事训练板块，赛事课、赛事直播是两类独立课程。\n整套科特版合计：软编课 30 课时，硬编课 12 课时，赛事课 12 课时，赛事直播课 6 课时。\n平时软编打编程思维基础，穿插硬编做硬件实物实操，同步搭配赛事课、赛事直播进行备赛训练，学练赛一体，让孩子把学到的编程知识运用到真实赛事当中，避免学完就忘。\n每周详细的排布安排，大家可以安排CRM排班为准。","interact":null,"sku":"","dept":""},{"row":25,"stage":"阶段6·AI对练：使用流程与规则红线","p":"P24","topic":"AI 对练 CHAPTER 03（章节页）","script":"培训有作业，因为有月考；月考单次未通过会扣绩效考核100块。绩效考核方案会粘贴到群标签页里，没找到的可以飞书私聊我要。作业是为了让大家把培训内容牢牢记住、顺利通过月考。","interact":null,"sku":"","dept":""},{"row":26,"stage":"阶段6·AI对练：使用流程与规则红线","p":"P25","topic":"AI 对练使用流程：三步完成","script":"接下来进入第六部分，课后作业，我们来看 AI 对练的使用流程，一共三步完成。\n第一步，粘贴剧本：Ctrl+A 全选剧本，复制之后粘贴到豆包新对话里发送。这里注意，指令不能漏发、少发，也不要直接发文档链接。\n第二步，电话对练：等豆包回复 “可以开始” 之后，点击右上角电话图标，我们给到指令，让豆包扮演角色 B，自己扮演角色 A，进行电话语音对练，注意是语音通话，不是文字聊天。\n第三步，出分交作业：通话结束挂断之后，豆包会输出成绩以及扣分点，我们把结果粘贴到作业表。重点提醒，对练的录屏，也必须一并粘贴进作业表。\n同时这里给大家标注了常见问题的处理办法：如果豆包不回复，就重启豆包；如果出现抢话，发指令「豆包！你是角色 B，别抢我的词～」；如果它不输出分数，就下发指令，让它按格式输出打分结果。来看一道题，AI 对练第二步「电话对练」的正确做法是？","interact":{"q":"AI 对练第二步「电话对练」的正确做法是？","at":"P25","options":["和豆包文字聊天完成即可","等豆包回复「可以开始」后点右上角电话图标，自己扮演角色A、让豆包扮演角色B","直接发文档链接给豆包","不用对练，直接填分数"],"answer":1,"answers":[1],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":27,"stage":"阶段6·AI对练：使用流程与规则红线","p":"P26","topic":"AI 对练规则：可以做 ✅ / 禁止做 ❌","script":"接下来我们看 AI 对练的规则，分可以做和禁止做两部分。\n\n先看✅可以做的：\n如果豆包抢话，我们可以发指令管控，就是这句：豆包！你是角色 B，别抢我的词～；\n如果输出结果里没有分数、没有扣分点，可以下发指令，让它按照规定格式重新输出。\n\n再看❌违规操作，这两点一定要记牢：\n第一，豆包重复追问的时候，不允许发指令直接跳过，正确做法是对照剧本完整作答，覆盖全部得分点；\n第二，分数不达标的时候，不能发指令去要求重新核查改分。标准是小于等于 70 分就判定不达标，需要重新对练。\n\n最后是违规后果：一旦违规，当天的作业需要重新提交，并且当月的月考成绩直接扣减 10 分。全程都要求录屏上交，浑水摸鱼是能够查出来的。来看一道题，下列哪些属于 AI 对练的违规操作？","interact":{"q":"下列哪些属于 AI 对练的违规操作？【多选】","at":"P26","options":["豆包抢话时发指令「豆包！你是角色B，别抢我的词~」","豆包重复追问时发指令直接跳过","分数不达标时发指令要求重新核查分数","输出没有分数时下发指令按格式重新输出"],"answer":1,"answers":[1,2],"vote":false,"wrong":"重讲本页重触发"},"sku":"","dept":""},{"row":28,"stage":"阶段6·AI对练：使用流程与规则红线","p":"P27","topic":"结束行动项 ACTION","script":"最后是我们本次培训的结束行动项，一共三点。\n第一，现在大家就可以扫码，在飞书上填写本次培训的调研问卷；\n第二，稍后培训文档和作业材料，会统一发到群里面；\n第三，提醒大家，按时完成 AI 对练作业，作业达标分数线是 70 分。今天内容就到这里，谢谢各位老师。","interact":null,"sku":"","dept":""}],"qs":[{"id":"T-S01","type":"阶段练习题","chapter":"阶段1测试题","q":"本次内训的核心目标是下面哪一个？","options":[{"k":"A","t":"熟记话术模板，第一时间给出个人承诺"},{"k":"B","t":"掌握 L1-L6 全部代码知识点"},{"k":"C","t":"把课程设计讲给家长听，让家长看到完整的成长机制"},{"k":"D","t":"学习 AI 对练的语音操作技巧"}],"answer":"C","back":"","sku":""},{"id":"T-S02","type":"阶段练习题","chapter":"阶段1测试题","q":"家长提出「希望孩子掌握得更好一点」，哪种回应更符合课导的核心原则？","options":[{"k":"A","t":"「行，我之后给孩子额外多出几套练习题，我自己来盯」"},{"k":"B","t":"「我们的后台会实时监测学习进度，掌握得快的知识点，系统会自动推送隐藏的拔高任务」"},{"k":"C","t":"「孩子的进度我每天都会手动记录，随时同步给您」"},{"k":"D","t":"「您放心，孩子有问题随时找我，我尽量马上回复」"}],"answer":"B","back":"","sku":""},{"id":"T-S03","type":"阶段练习题","chapter":"阶段1测试题","q":"课导回答家长问题时，应该先给出「我会怎么跟进」的个人承诺，再补充课程是怎么设计的。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":""},{"id":"T-S04","type":"阶段练习题","chapter":"阶段1测试题","q":"课导和班主任不一样：在课导这一层，我们要让家长信的是？","options":[{"k":"A","t":"课导个人的责任心和服务态度"},{"k":"B","t":"课程设置和产品背后的一套成长机制"},{"k":"C","t":"班主任的全程贴身陪伴"},{"k":"D","t":"优惠价格和赠品力度"}],"answer":"B","back":"","sku":""},{"id":"T-S05","type":"阶段练习题","chapter":"阶段2测试题","q":"很多家长后期频繁请假，回溯根源往往是？","options":[{"k":"A","t":"课程难度偏高，孩子跟不上"},{"k":"B","t":"孩子对动画剧情不感兴趣"},{"k":"C","t":"上课时间和学校作息冲突"},{"k":"D","t":"前期价值没有讲透，家长没看到编程的不可替代性"}],"answer":"D","back":"","sku":""},{"id":"T-S06","type":"阶段练习题","chapter":"阶段2测试题","q":"开场话术的正确逻辑顺序是？","options":[{"k":"A","t":"先问孩子现在学什么兴趣班→送上温馨提醒→顺势对比教育赛道→自然推导编程方向"},{"k":"B","t":"先介绍编程的三大好处→再询问孩子的兴趣班安排"},{"k":"C","t":"先讲国家政策文件→再引导家长对比兴趣班"},{"k":"D","t":"先询问家长的职业背景→再引出教育赛道对比"}],"answer":"A","back":"","sku":""},{"id":"T-S07","type":"阶段练习题","chapter":"阶段2测试题","q":"下列编程思维的「白话定义」，搭配正确的是？【多选】","options":[{"k":"A","t":"分解：把复杂问题拆成可执行、更好理解的小步骤"},{"k":"B","t":"模式识别：把新问题转化成熟悉的老问题，找规律认题型"},{"k":"C","t":"抽象：提炼共通规律便于复用，也就是举一反三、归纳总结"},{"k":"D","t":"算法：背下标准答案，遇到同类题直接照抄，不用理解过程"}],"answer":"ABC","back":"","sku":""},{"id":"T-S08","type":"阶段练习题","chapter":"阶段2测试题","q":"孩子在校内做题第二步「理解题意」，对应编程里的哪一步？","options":[{"k":"A","t":"需求分析"},{"k":"B","t":"调用模块、函数"},{"k":"C","t":"问题拆解"},{"k":"D","t":"调试 Debug"}],"answer":"C","back":"","sku":""},{"id":"T-S09","type":"阶段练习题","chapter":"阶段2测试题","q":"图形化和 Python、C++ 在上限上是一样的，都可以参与等级考试、国家级以及白名单赛事。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-S10","type":"阶段练习题","chapter":"阶段3测试题","q":"莫顿新课相比老课的变化有哪些？【多选】","options":[{"k":"A","t":"新课一周两课，一次上课包含两个课时"},{"k":"B","t":"课程结构采用多分支解锁模式"},{"k":"C","t":"一周一课，全班进度统一、视频统一、关卡统一"},{"k":"D","t":"科普单独做成有仪式感的真人讲解环节"}],"answer":"ABD","back":"","sku":""},{"id":"T-S11","type":"阶段练习题","chapter":"阶段3测试题","q":"猿编程、学而思、作业帮、高途编程同属「直播大锅饭」模式，劣势包含？","options":[{"k":"A","t":"不能实时关注学生"},{"k":"B","t":"不能分层教学，2-6年级统一授课"},{"k":"C","t":"不能及时辅导"},{"k":"D","t":"直播形式实操性差"}],"answer":"ABCD","back":"","sku":""},{"id":"T-S12","type":"阶段练习题","chapter":"阶段3测试题","q":"家长质疑「为什么花这个钱买了一个动画」，哪种回应是正确的排雷话术？","options":[{"k":"A","t":"「动画就是给孩子放松的，看够了自然会认真上课」"},{"k":"B","t":"「正式知识点都在课后文档里，动画只是赠送内容」"},{"k":"C","t":"「这是公司统一的课程形式，所有机构都一样」"},{"k":"D","t":"「动画是剧情引入、落脚点是实操——视频演示孩子看了就懂，节奏不断、兴趣留得住」"}],"answer":"D","back":"","sku":""},{"id":"T-S13","type":"阶段练习题","chapter":"阶段3测试题","q":"孩子忘记了上节课的内容，莫顿课程会怎么处理？","options":[{"k":"A","t":"剧情回顾环节提问知识点，点「忘了」自动回放复习，说记得直接进新内容"},{"k":"B","t":"课导电话家长，要求提前帮孩子复习完再上课"},{"k":"C","t":"系统直接跳过复习，按原进度推进新内容"},{"k":"D","t":"强制孩子从头重新学习整个阶段课程"}],"answer":"A","back":"","sku":""},{"id":"T-S14","type":"阶段练习题","chapter":"阶段3测试题","q":"学得快的孩子触发隐藏关卡，对家长的沟通话术是？","options":[{"k":"A","t":"「孩子进度太快，我们单独给他布置了额外作业加练」"},{"k":"B","t":"「孩子天赋突出，普通课程不够，建议升级更高阶课程」"},{"k":"C","t":"「系统检测到孩子学得快，自动放慢了后面课程的难度」"},{"k":"D","t":"「因为孩子学得快，在他不自知的情况下，系统给他单独加了几关，他比别的孩子多学了一点点知识」"}],"answer":"D","back":"","sku":""},{"id":"T-S15","type":"阶段练习题","chapter":"阶段4测试题","q":"下列课程题材中，哪些属于「学科学习类」、用来对接校内知识取悦家长？【多选】","options":[{"k":"A","t":"蜗牛爬井"},{"k":"B","t":"飞机大战"},{"k":"C","t":"田忌赛马"},{"k":"D","t":"古诗绘本"},{"k":"E","t":"彩虹猫"}],"answer":"ACD","back":"","sku":""},{"id":"T-S16","type":"阶段练习题","chapter":"阶段4测试题","q":"课程题材设计上，软件课和硬件课全程分开排布、题材固定不变，让孩子每次上课都保持熟悉感。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":""},{"id":"T-S17","type":"阶段练习题","chapter":"阶段4测试题","q":"下列阶段目的与课程设计的配对，正确的是 L1 阶段的哪一项？","options":[{"k":"A","t":"赛考——通过赛事激励保持活跃，防止孩子流失"},{"k":"B","t":"效果外化——加入更多学科挂钩内容，多加硬件作品"},{"k":"C","t":"成长追单——完成完整作品，给孩子仪式感和成长感"},{"k":"D","t":"防退费——课程轻松简单，作品类型覆盖面广"}],"answer":"D","back":"","sku":""},{"id":"T-S18","type":"阶段练习题","chapter":"阶段4测试题","q":"三层难度设计中，「跳一跳能做到的」略有挑战的拓展内容，要求孩子当堂必须上手操作、反复练习。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":""},{"id":"T-S19","type":"阶段练习题","chapter":"阶段4测试题","q":"孩子专注力最强的前 20-30 分钟，课程安排是？","options":[{"k":"A","t":"先放完整段剧情动画，再进入知识学习"},{"k":"B","t":"安排难度最高的知识板块，趁状态好多吸收"},{"k":"C","t":"集中学习 2 个核心知识板块，搭配实操练习"},{"k":"D","t":"三个知识板块平均分布，难度保持一致"}],"answer":"C","back":"","sku":""},{"id":"T-S20","type":"阶段练习题","chapter":"阶段5测试题","q":"思维版的课时构成是？","options":[{"k":"A","t":"软编 42 课时、硬编 6 课时"},{"k":"B","t":"软编 30 课时、硬编 12 课时"},{"k":"C","t":"软编 42 课时、硬编 12 课时"},{"k":"D","t":"软编 36 课时、硬编 8 课时"}],"answer":"A","back":"","sku":""},{"id":"T-S21","type":"阶段练习题","chapter":"阶段5测试题","q":"思维版课程中，L2、L4、L6 的第三周安排的是什么课？","options":[{"k":"A","t":"软编课"},{"k":"B","t":"硬编课"},{"k":"C","t":"赛事直播课"},{"k":"D","t":"硬编+赛事直播双课并行"}],"answer":"B","back":"","sku":""},{"id":"T-S22","type":"阶段练习题","chapter":"阶段5测试题","q":"科特版的课时构成，正确的是？【多选】","options":[{"k":"A","t":"软编课 30 课时"},{"k":"B","t":"硬编课 12 课时"},{"k":"C","t":"赛事课 12 课时"},{"k":"D","t":"赛事直播课 12 课时"}],"answer":"ABC","back":"","sku":""},{"id":"T-S23","type":"阶段练习题","chapter":"阶段5测试题","q":"科特版学练赛一体，平时软编打基础、硬编做实物实操，同步搭配赛事课备赛，让孩子把知识运用到真实赛事中，避免学完就忘。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-S24","type":"阶段练习题","chapter":"阶段5测试题","q":"关于思维版中硬件课的定位，下列说法正确的是？","options":[{"k":"A","t":"硬件课是主体，软编课只是每月穿插一次的补充"},{"k":"B","t":"硬件课集中在每月第四周，一个月连上 4 节"},{"k":"C","t":"把代码从屏幕落到实物小车、硬件作品上，增加孩子的新鲜感，也方便效果外化"},{"k":"D","t":"硬件课就是让孩子拆装玩具，和编程知识没有衔接"}],"answer":"C","back":"","sku":""},{"id":"T-S25","type":"阶段练习题","chapter":"阶段6测试题","q":"AI 对练第一步「粘贴剧本」的正确做法是？","options":[{"k":"A","t":"Ctrl+A 全选剧本复制后粘贴进豆包新对话发送，指令不能漏发少发、不发文档链接"},{"k":"B","t":"直接把剧本文档链接发给豆包，让它自己读取"},{"k":"C","t":"只粘贴剧本里自己要扮演的角色部分，节省时间"},{"k":"D","t":"把剧本截图发给豆包，不用发文字指令"}],"answer":"A","back":"","sku":""},{"id":"T-S26","type":"阶段练习题","chapter":"阶段6测试题","q":"AI 对练是电话语音对练，不是文字聊天。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-S27","type":"阶段练习题","chapter":"阶段6测试题","q":"AI 对练常见问题的处理办法，正确的是？【多选】","options":[{"k":"A","t":"豆包不回复→重启豆包"},{"k":"B","t":"豆包抢话→直接挂断电话，本次对练作废重新约时间"},{"k":"C","t":"豆包抢话→发指令「豆包！你是角色B，别抢我的词~」"},{"k":"D","t":"豆包不输出分数→给指令按格式输出"}],"answer":"ABD","back":"","sku":""},{"id":"T-S28","type":"阶段练习题","chapter":"阶段6测试题","q":"对练分数不达标时的正确做法是？","options":[{"k":"A","t":"发指令让豆包重新核查改分，改到达标为止"},{"k":"B","t":"小于等于 70 分判定不达标，对照剧本重新对练"},{"k":"C","t":"把成绩单里的扣分点删掉后再粘贴到作业表"},{"k":"D","t":"先交作业，等月考前再补一次对练"}],"answer":"B","back":"","sku":""},{"id":"T-S29","type":"阶段练习题","chapter":"阶段6测试题","q":"AI 对练违规的后果是当日作业须重新提交，且当月月考成绩扣减 10 分。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F01","type":"本章综合测试题","chapter":"全章章节测试题","q":"家长提出问题后，课导正确的表达顺序是？","options":[{"k":"A","t":"先给出个人承诺安抚家长，课程设计等家长追问再说"},{"k":"B","t":"先讲价格优惠稳住家长，其他问题以后再说"},{"k":"C","t":"先想一步我们的课程设计怎么解决他的疑虑，再说自己这边会怎么跟进"},{"k":"D","t":"先把问题记下来，统一转给班主任处理"}],"answer":"C","back":"","sku":""},{"id":"T-F02","type":"本章综合测试题","chapter":"全章章节测试题","q":"价值赋能在首通询问孩子现有兴趣班、确认上课时间是否冲突时就要提前铺垫，并且要贯穿整个半年学习周期。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"A","back":"","sku":""},{"id":"T-F03","type":"本章综合测试题","chapter":"全章章节测试题","q":"家长表示让孩子学兴趣只是当作爱好，等到小学高年级孩子时间紧张时的建议是？","options":[{"k":"A","t":"兴趣班以孩子开心为主，哪门轻松坚持哪门"},{"k":"B","t":"在众多兴趣里，编程建议从头坚持学习——它契合国家相关政策方向，属于刚需能力培养"},{"k":"C","t":"体育和艺术更适合长线坚持，编程随时可以补"},{"k":"D","t":"高年级以课内学业为重，编程等初中后再系统学"}],"answer":"B","back":"","sku":""},{"id":"T-F04","type":"本章综合测试题","chapter":"全章章节测试题","q":"关于强基计划，下列说法正确的是？","options":[{"k":"A","t":"已在北大、清华等 39 所一流大学开展试点，其中 40% 高校专业与编程有关，录取分数线通常低于高考统招分数线 20-50 分"},{"k":"B","t":"已在全部 985 高校试点，录取分数线低于统招 50-100 分"},{"k":"C","t":"只面向高三学生，与低年级编程学习无关"},{"k":"D","t":"信息学竞赛不在强基计划认可的赛道范围内"}],"answer":"A","back":"","sku":""},{"id":"T-F05","type":"本章综合测试题","chapter":"全章章节测试题","q":"讲完白话版家长还是不理解编程思维，该怎么办？","options":[{"k":"A","t":"换成更专业的术语，体现课导的专业度"},{"k":"B","t":"直接把白话对照表发给家长"},{"k":"C","t":"跳过这个话题，避免家长继续追问"},{"k":"D","t":"让家长自己上网查资料，回头再确认"}],"answer":"B","back":"","sku":""},{"id":"T-F06","type":"本章综合测试题","chapter":"全章章节测试题","q":"下列哪句话术可以原样讲给家长？","options":[{"k":"A","t":"编程和舞蹈、架子鼓一样，主要是帮孩子放松身心、培养爱好，很难直接对接校内做题"},{"k":"B","t":"编程的思维训练和校内做题是两套完全不同的流程，互不相关"},{"k":"C","t":"编程训练的思考方式只有编程课用得上，对校内学科帮助不大"},{"k":"D","t":"所有课外班里，除了语数外补课，最贴近孩子学习习惯和学习模式的就是编程——别的兴趣班让孩子放松，编程让孩子练大脑，而且练的是跟上学直接挂钩的大脑"}],"answer":"D","back":"","sku":""},{"id":"T-F07","type":"本章综合测试题","chapter":"全章章节测试题","q":"图形化编程（Scratch）需要孩子先背熟大量英文语法才能上手。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":""},{"id":"T-F08","type":"本章综合测试题","chapter":"全章章节测试题","q":"莫顿 S 低阶段新课选择侦探题材的原因有哪些？【多选】","options":[{"k":"A","t":"孩子看侦探类内容代入感更强，故事里孩子就是主角，上课更投入"},{"k":"B","t":"破案需要梳理思路、一步步推理判断，正好锻炼逻辑思维，和编程学习的思路一致"},{"k":"C","t":"侦探题材自带悬念和紧张感，能给孩子适度的学习压力"},{"k":"D","t":"侦探题材制作成本更低，方便快速更新课程内容"}],"answer":"AB","back":"","sku":""},{"id":"T-F09","type":"本章综合测试题","chapter":"全章章节测试题","q":"核桃应对「直播大锅饭」竞品的对应优势包括？【多选】","options":[{"k":"A","t":"系统实时监测学习进度，课导企微侧边栏点对点跟进"},{"k":"B","t":"多分支关卡自动分层，因材施教"},{"k":"C","t":"全程真人直播，老师随时停下答疑"},{"k":"D","t":"软硬件交替+分支关卡保障真实操作"}],"answer":"ABD","back":"","sku":""},{"id":"T-F10","type":"本章综合测试题","chapter":"全章章节测试题","q":"家长问「录播没有老师盯着，管得住孩子吗」，正确的回答口径是？","options":[{"k":"A","t":"站在面前不等于真的监管；孩子必须选关才能推进剧情，选了多少次、选了哪个关都能看到，这才是真实的学习数据"},{"k":"B","t":"录播可以随时暂停，孩子想学就学、不想学就停，更自由"},{"k":"C","t":"直播和录播效果差别不大，主要看孩子自觉"},{"k":"D","t":"录播课成本更低，省下的费用都让利给家长了"}],"answer":"A","back":"","sku":""},{"id":"T-F11","type":"本章综合测试题","chapter":"全章章节测试题","q":"学得慢的孩子，课导应该怎么做？","options":[{"k":"A","t":"直接调低全体课程难度，保证每个孩子都跟得上"},{"k":"B","t":"让学得快的孩子放慢进度，等学得慢的孩子一起"},{"k":"C","t":"孩子自主选难度星级，系统后台记录薄弱点，课导按进度点对点反馈，绝不说「孩子笨」"},{"k":"D","t":"单独给孩子延长课时，把没学会的内容反复讲"}],"answer":"C","back":"","sku":""},{"id":"T-F12","type":"本章综合测试题","chapter":"全章章节测试题","q":"隐藏关卡的触发机制是？","options":[{"k":"A","t":"课导在后台根据孩子表现手动开通"},{"k":"B","t":"家长在家长端申请，付费后解锁"},{"k":"C","t":"孩子连续答对三题后，自己点击解锁"},{"k":"D","t":"系统根据孩子每一关的完成时长自动判断，速度快、掌握熟练就自动分流开启隐藏挑战关卡"}],"answer":"D","back":"","sku":""},{"id":"T-F13","type":"本章综合测试题","chapter":"全章章节测试题","q":"下列阶段目的与课程设计的配对，正确的是 L4、L5 阶段的哪一项？","options":[{"k":"A","t":"效果外化——加入更多学科挂钩内容，多加智能小车这类硬件作品"},{"k":"B","t":"防退费——课程设计轻松简单，作品类型覆盖面广"},{"k":"C","t":"赛考——通过赛事激励保持活跃，防止孩子流失"},{"k":"D","t":"成长追单——完成完整作品，给孩子仪式感和成长感"}],"answer":"A","back":"","sku":""},{"id":"T-F14","type":"本章综合测试题","chapter":"全章章节测试题","q":"关于专为孩子专注力设计的课程结构，下列说法正确的是？","options":[{"k":"A","t":"全节课三个知识板块难度逐级递增，越学越有挑战"},{"k":"B","t":"前 20-30 分钟集中学 2 个核心知识板块，30 分钟后剧情密度、选关密度上升，第 3 个板块难度最轻、有成就感收尾"},{"k":"C","t":"剧情动画集中放在课程结尾，避免打断知识学习"},{"k":"D","t":"知识板块均匀分布在整节课，每 15 分钟切换一次"}],"answer":"B","back":"","sku":""},{"id":"T-F15","type":"本章综合测试题","chapter":"全章章节测试题","q":"分数不达标时，可以发指令让豆包重新核查改分。","options":[{"k":"A","t":"对"},{"k":"B","t":"错"}],"answer":"B","back":"","sku":""}],"timing":{"P01":{"sents":["哈喽各位9元课导的小伙伴，今天的培训课程是「图形化课程体系」"],"durs":[6.648]},"P02":{"sents":["这次课程的核心目标是：在日程沟通把我们的课程设计讲给家长听。","先说一个我们日常最容易踩的坑：家长一提问题、一提需求，我们第一反应往往是「我会怎么样」——我是孩子的课导老师，我个人能做什么？","比如家长说：「老师，我希望孩子课程掌握得更好一点」，我们顺嘴就答：「行，我会给孩子额外出题」。","站在家长那边，他听到的是一次性的个人承诺：万一我请假、万一有突发情况，这事可能就没了。","换一种说法：我们的后台会实时监测学习进度，如果某个知识点掌握得特别快，系统会自动推送隐藏的拔高任务。","同样一件事，家长感受到的是一套机制；","用「我会」来讲，他感受到的只是课导个人。","所以在课导这一层，我们要让家长信的是课程设置、是产品，不是某个人。","以后每次回答家长的问题，大家先想一步：我们的课程设计怎么解决他这个疑虑，再说我这边会怎么跟进。","把课程体系的设计逻辑外化出来，让家长看到背后是一套完整的成长机制。","来看一道题，家长说「希望孩子掌握得更好一点」，下面哪种回应符合「外化课程设计」的核心原则？"],"durs":[6.624,11.808,8.88,9.192,10.536,4.344,4.104,7.584,9.72,7.056,8.736]},"P03":{"sents":["那今天分3个板块。","第一个，解决家长对图形化的简介；","第二个，讲课程体系简介，了解我们的课程结构和市面上机构的差距；","把课程设计拆开，让家长知道这套设计从哪来；","第三个，AI 对练的流程和红线标准。"],"durs":[2.256,3.816,6.768,4.8,4.128]},"P04":{"sents":["我们首通和家长沟通，在询问孩子现有兴趣班、确认上课时间是否冲突时，就要提前铺垫编程的重要性，价值赋能不能偷懒，并且要贯穿整个半年学习周期。\n","很多家长后期频繁请假，回溯根源，就是前期价值没有讲透。","在家长视角里，各类兴趣班本质上都是争夺孩子有限的课余时间，属于互相竞争的关系。","家长是在众多兴趣里选择了编程，但时间资源是有限的，别的课程挤压过来，编程就很容易变成优先舍弃的那一个。\n\n","日常回访、家长提请假的时候，都是我们赋能的机会。","我们要持续和家长讲清楚：少儿编程的核心价值，对比其他课外班的独特优势，以及图形化学习阶段的意义。","只有家长真正理解我们的不可替代性，才愿意优先保留编程课时，稳定出勤，后续也更愿意续报下一阶段。"],"durs":[14.64,6.192,8.232,10.536,5.112,10.008,9.672]},"P05":{"sents":["我们日常和家长潜移默化沟通，经常会拿各类兴趣班做对比。\n","在首次沟通，或是跟进孩子学习情况的时候，可以先询问家长，孩子目前在学习哪些兴趣班。\n\n","无论家长回答是体育类，还是艺术类兴趣，我们都可以送上温馨提醒。\n","如果是体育项目，可以这样说：体育类课程很不错，可以磨炼孩子耐心。","运动前一定要充分热身，避免受伤。","像学习游泳的孩子，冬天尽量选择水温适宜的游泳馆，防止水温过低引发不适。\n\n","如果是舞蹈这类艺术项目，可以这样说：舞蹈训练对孩子的身形要求较高，不少学员需要控制饮食，甚至配合出汗服等方式管理体态，长期训练会比较辛苦。\n\n","之后顺势过渡，还好您给孩子安排了编程课程。","编程不存在运动受伤的风险，也不需要刻意管控体态。\n\n","接下来，我们进一步了解家长的规划，询问家长，让孩子学习这项兴趣，是打算走专业路线，还是仅作为爱好培养。\n\n","如果家长表示，只是当作爱好、锻炼孩子，我们可以这样回应：您的想法非常合理。\n","体育方向属于竞争狭窄的赛道，可选出路有限；","艺术类特长生的招生规模，也在逐步收缩。\n","等到小学高年级，孩子时间紧张，大部分家庭会缩减兴趣班。","在众多兴趣里面，编程建议从头坚持学习。","它契合国家相关政策方向，属于刚需能力培养。\n\n","整套沟通思路，就是通过询问孩子现有的兴趣班，引出不同教育赛道的客观对比，自然而然，向家长介绍编程的价值。"],"durs":[5.856,8.712,6.312,6.504,3.744,7.824,14.352,4.704,5.136,10.92,7.752,4.872,4.248,5.952,4.68,4.8,10.824]},"P06":{"sents":["前面我们和家长做了潜移默化的沟通铺垫。","但仅仅依靠口头讲解，家长的认可度和信任度往往很难拉满。","我们需要结合国家教育政策，把价值落地。\n\n","编程学习，已经纳入国家教育战略布局。","我们国家正在推进科教强国、科技强国建设，需要大量信息科技方向的人才，国家人才导向非常清晰。","教育是为国家输送人才，国家的发展方向，就是教育的发展方向。\n\n","2022 年，十年一轮的义务教育新课改落地，信息科技正式从综合实践活动中独立出来，成为一门独立课程。\n\n","同时，信息学竞赛，是强基计划认可的基础学科竞赛赛道之一。","信息学的能力培养链路非常连贯。","在众多兴趣方向里面，它是少数，能够从小升初特长登记、初升高科技特长、一直衔接至大学强基计划，甚至延伸到未来职业发展的长线赛道。","这点和基础学科是一样的，是可以贯穿孩子整个求学阶段，长期发挥价值的底层能力。"],"durs":[4.08,5.88,4.032,4.104,9.744,6.432,10.224,6.696,3.792,13.512,8.04]},"P07":{"sents":["和家长沟通编程思维，我们要多角度输出，但不能说得太书面、太专业。","一旦满是专业名词，家长反而会觉得我们不接地气，不容易认可。\n","大家可以把这张白话对照表熟记下来，在跟家长讲思维能力的时候，全部换成生活化、孩子学习里能碰到的场景来讲，同时结合编程实操去解释。","如果讲完之后家长还是不太理解，可以直接把这张对照表发给家长。\n\n","首先是分解能力：简单来说，就是把复杂的大问题，拆成一个个好理解、好执行的小步骤。","放到校内学习，就像孩子做数学应用题，先读题、拆分条件、一步步求解，也能改善孩子平时丢三落四的习惯。","放到编程当中，孩子拿到一道编程题目，同样要先审题，找到里面的关键要求，再把整体任务拆成一步一步来实现。\n\n","第二是模式识别：就是学会找规律，在陌生的新题目里面，认出以前学过、练过的同类题型。","比如数学公式套用、语文里面同一个汉字在不同词语里的意思辨析，都用到这个能力。","落实到编程里也是一样，孩子看到题目要求重复做一件事情，马上就能联想到重复执行、循环模块；","看到想要实现某一种固定效果，也能快速对应上配套的代码。\n\n","第三是抽象能力：就是从很多相似的事情里面，提炼出共通的规律，总结好之后，下次遇到同类问题直接复用，也就是我们常说的举一反三、归纳总结。","在编程里，就是把重复用到的功能提炼出来，封装成一段通用代码，之后再需要这个效果的时候，直接调用就可以，不用从头重新编写。\n\n","第四是算法思维：就是梳理出一套完整有序的思路来解决问题，同一个问题还可以有多种处理方式，找到更简便、效率更高的办法。","就像从 1 加到 100，用求和公式就可以快速算出结果，不用一个个硬加。","放到编程中，就是规划代码的执行顺序，思考多种写法，挑选逻辑更清晰、运行效率更高的方案。","来看一道题，「孩子能从很多相似的事情里提炼出共通规律、举一反三」，指的是哪种编程思维？"],"durs":[6.984,6.264,13.392,6.552,8.4,10.656,10.392,8.736,7.776,9.696,5.568,13.704,12.024,11.784,6.528,9.36,9.048]},"P08":{"sents":["刚刚我们拆解了四大编程思维，大家会发现，这些能力并不是编程独有的。\n","编程思维和校内学科学习，本质上走的是同一套思考流程。\n\n","孩子在校内做题第一步是读题，放到编程里对应的就是需求分析，核心都是信息提取和筛选，本质就是读懂规则，只要漏掉关键信息，很容易全盘出错。\n","第二步理解题意，对应编程里的问题拆解，锻炼的是逻辑分解、搭建思路的能力，也就是把大问题拆成小块，逐个去解决。\n","第三步套用公式和方法，对应编程里调用模块、函数，考验知识迁移，要清楚工具什么时候能用、什么时候不能用。\n","第四步按步骤演算，对应编程的顺序执行、流程控制，培养有序思维，一步一步推进，跳步骤就很容易出错，顺序本身就是逻辑。\n","第五步得出答案，对应编程输出结果，目标清晰，对错分明，没有模糊空间。\n","最后一步检查改错，对应编程里的调试 Debug，重点是找到错在哪一步，学会自我复盘纠正，这个能力比单纯改出正确答案更加重要。\n\n","像舞蹈、架子鼓这类兴趣班，更多是帮孩子放松身心、培养爱好，很难直接对接校内做题的这套思考模式。\n","但编程不一样，它训练的整套思考流程，和孩子上学做题高度相通。\n","这里有一句可以直接讲给家长的金句：所有课外班里，除了语数外补课，最贴近孩子学习习惯和学习模式的就是编程。","别的兴趣班让孩子放松，编程让孩子练大脑，而且练的是跟上学直接挂钩的大脑。"],"durs":[7.056,6.144,14.592,11.088,10.872,11.928,7.32,12.6,10.296,6.696,10.632,7.848]},"P09":{"sents":["刚刚我们了解到，编程训练的思考方式，能够直接迁移到校内学科的学习当中。","很多家长接下来会疑惑，编程是不是一上来就要写英文代码，图形化编程和 Python、C++ 又有什么样的区别。\n\n","我们可以这样跟家长解释：\n","图形化编程，也就是 Scratch，是拖拽积木块的形式，不需要打字，5 岁以上的孩子就可以上手。","它没有复杂语法门槛，内容直观好理解。\n","而 Python 和 C++，需要孩子使用键盘输入英文语法，对识字、英文基础有一定要求，还需要记忆语法规则。\n\n","很多家长担心，学图形化是不是上限很低，以后没法参加比赛。","这里要跟家长明确：上限是一样的**。","不管是图形化，还是 Python、C++，都可以参与等级考试、国家级以及白名单科创赛事，先学图形化，完全不会耽误孩子后续往高阶路线发展。\n\n","图形化编程有三大优势：\n","第一，门槛低，画面形象有趣，避开复杂语法的压力，但是完整保留编程思维训练；\n","第二，上限高，同样可以对接白名单赛事、校园实践，还能做动画、小游戏开发；\n","第三，同步提升孩子的逻辑思维、专注力，从小培养做事的条理性。\n\n","简单来说，图形化是适合低龄孩子的入门路径，先把底层思维打牢，等能力、基础到位之后，再平稳过渡到 Python 和 C++。","来做一道判断题：家长担心「学图形化上限低，以后没法参加白名单赛事」，这个担心是正确的吗？"],"durs":[7.224,10.584,2.76,8.784,4.056,10.896,6.336,4.344,14.232,3.048,8.352,8.064,6.648,12.264,9.12]},"P10":{"sents":["前面我们区分了图形化、Python 和 C++ 各自的特点，清楚了图形化是低门槛、高上限的入门选择。\n","接下来，我们进入第二部分，给大家介绍核桃编程完整的课程体系。\n","这一部分，我们会跟家长讲明白，为什么选择核桃编程，我们如何做到因材施教，以及整套课程的设计逻辑和进阶结构。","我们会按照孩子的年龄、学习基础、发展目标，匹配对应的学习路线，循序渐进，稳步培养孩子的编程能力。"],"durs":[9.528,6.456,10.848,9.984]},"P11":{"sents":["接下来，我们重点介绍核桃编程的莫顿课程，这也是我们和其他编程品牌最核心的差异点。\n","很多家长在多家机构对比的时候，都会问，核桃和别的编程平台有什么不一样。","我们可以直接告诉家长，最核心的答案就是这套莫顿课程，市面上目前没有同类产品。\n\n","我们可以通过新课和老课的对比，让家长清楚课程升级之后的变化。\n","现在我们的新课是一周两课，一次上课包含两个课时，课程结构采用多分支解锁模式，可以根据每个孩子具体的学习情况，解锁对应的课程关卡，不再是所有学员统一一套课程。\n\n","在介绍 S 低阶段新课之前，先跟大家说明一下，为什么我们会选择侦探题材。\n","主要有两点原因。","第一，孩子看侦探类内容，代入感会更强，故事里孩子就是主角，主动参与整个过程，主人公意识更突出，上课也更投入。","第二，破案本身就需要梳理思路、一步步推理判断，这个过程正好能锻炼孩子的逻辑思维，和我们编程学习要练的思路是一致的。\n\n","也有家长会关心，课堂里会不会出现不合适的内容。","大家可以放心，我们的侦探题材，最终走向都是光明和正义，整体内容正向健康，符合少儿教学的标准。\n\n","S 低阶段新课采用侦探题材，增加大量剧情互动；","课堂讲解当中穿插多种互动形式，会根据孩子不同的回答给到差异化反馈。","关卡可以按照孩子的掌握程度解锁分支，孩子也能根据自己的兴趣，挑选不同难度、不同样式的关卡。","科普内容结合科技与生活，像二维码、自动驾驶、北斗卫星这些内容，并且把科普单独做成有仪式感的真人讲解环节。\n\n","S 高阶段新课，题材升级为穿越加武侠风格，同样增加剧情互动。","关卡增加前进、后退这类游戏化设计，趣味性更强。","科普方向融入科技、生活和传统文化，比如舞狮、人体姿态识别等等。\n\n","以前的老课是一周一课，全班进度统一、视频统一、关卡统一，科普只是简单融合在动画里面。","新旧版本一对比，优势非常清晰。\n","如果家长想看得更细致，我们可以直接把这张对比表发给家长。","优质课程搭配贴心服务，才能给到孩子更好的学习效果。"],"durs":[8.064,7.464,7.872,6.384,16.056,7.344,1.992,11.64,11.784,5.064,9.888,5.28,7.32,9.288,11.352,6.816,5.328,7.32,9.456,3.528,5.976,5.52]},"P12":{"sents":["刚刚我们了解了莫顿课程新旧版本的差异，很多家长在选课时，还会拿核桃和市面上其他编程机构做横向对比。","猿编程、学而思、作业帮、高途编程，它们都属于直播大锅饭的模式，这类直播课，普遍会存在几个共通的问题。\n\n","第一，直播大班很难实时关注到每一个孩子；","核桃依靠系统实时监测学习进度，课导通过企微侧边栏点对点跟进。\n","第二，直播很难做分层教学，经常是不同基础的孩子统一授课；","我们依靠多分支关卡自动分层，真正做到因材施教。\n","第三，直播课堂里很难随时停下答疑，孩子当场的疑问没法及时解决；","核桃有课导同步跟课答疑，系统记录闯关数据，学习轨迹还可以回溯复盘。\n","第四，纯直播的形式，孩子动手实操的体验比较弱；","我们软硬件交替配合，搭配分支关卡，充分保障孩子动手实操训练。\n\n","总结来说，市面上做少儿编程的品牌很多，家长经常会问我们到底差别在哪，最核心的答案依旧是这套独有的莫顿课程，目前市面上没有同类产品。","我们这套课程结构、剧情设计、分支关卡，能够充分照顾到不同基础、不同进度的孩子，同时后台课导、授课老师同步跟进答疑。","优质课程搭配贴心服务，才能给到孩子更好的学习效果。","来看一道题，家长问「你们和猿编程、学而思有什么不一样」，最核心的答案是什么？"],"durs":[10.296,10.728,4.536,6.864,6.456,5.088,7.224,7.296,5.232,6.816,13.584,12.216,5.52,7.2]},"P13":{"sents":["接下来我们做一个前置拆雷，这是一个很高频的高危问题：很多家长会问，为什么我们的课程里面是动画？","甚至会直接质疑，我花钱，难道只是买了一个动画看？","这个疑问，我们一定要在前期主动给家长讲清楚，不要等到后面家长再来提出。\n\n","我们可以用两个简单的类比跟家长解释。\n","第一个类比，口述和视频的差别。","如果我只跟孩子说，先举两下手、再扭屁股、再转三圈，孩子很难还原这个动作；","但如果放一段视频演示，孩子马上就能看懂。\n","第二个类比，看图识字。","孩子还不认识字的时候，都是先通过图片去认字、认人、认事物，动画帮助孩子学习，是同一个道理。\n\n","这里跟家长讲清楚核心：动画是剧情引入，最终落脚点是实操。","剧情动画的目的，是抓住孩子的注意力，把孩子的心思带到学习当中。","课程用视频演示，而不是单纯靠大段文字讲解，孩子一看就懂，不容易卡在同一个地方反复为难，学习节奏能够连贯，孩子的兴趣才能长久留住。"],"durs":[9.312,5.424,7.32,3.792,3.408,7.728,4.248,2.664,9.6,6.456,6.696,13.608]},"P14":{"sents":["还有一个家长很容易有的固有想法，就是觉得录播不如直播，经常会问我：录播课没有老师盯着，管得住孩子吗？","我们也提前把这个问题给大家拆解清楚。\n\n","我们可以这样跟家长沟通：您想一想，就算学校老师站在孩子面前，也很难做到百分百监管。","孩子哪怕趴着走神，只要不扰乱课堂纪律，老师也很难时刻兼顾。","所以老师站在面前，不等于做到了真正有效的监管。\n\n","咱们核桃课程的底层设计是，孩子必须完成闯关，才可以继续推进剧情。","后台可以清晰看到他尝试了多少次、选择了哪一关、卡在哪一步，这些都是孩子真实的学习数据。","这种基于学习行为的追踪，比单纯有人坐在面前看着，要有效得多。\n\n","简单来说，我们不靠老师盯着画面，而是依靠课程闯关机制，倒逼孩子动手练习，每一次操作、每一次尝试全部都能回溯，学习状态全程实时监测。"],"durs":[9.888,4.008,8.664,6.504,5.16,6.744,8.88,6.408,14.232]},"P15":{"sents":["刚刚我们提前解答了家长对于动画、录播形式的疑问，接下来我们再深入看一看莫顿课程因材施教的核心设计：多分支解锁，针对孩子学习当中三种常见情况，都有专门对应的安排。\n\n","第一种，学得快的孩子。","系统会自动触发隐藏关卡，给孩子拔高拓展，不让学有余力的孩子 “吃不饱”。","课导可以在企微侧边栏随时查看进度，点对点同步给家长。\n\n","第二种，学得慢的孩子。","孩子可以自主选择适合自己的难度星级，系统后台会持续记录，精准抓取反复出错的薄弱点。","课导会按照孩子真实进度和家长反馈，沟通的时候我们绝对不会说 “孩子笨” 这类话，只客观反馈知识点掌握情况。\n\n","第三种，孩子忘记上节课内容。","课程自带剧情回顾环节，会提问孩子对应的知识点。","孩子如果选择 “忘了”，系统就自动回放复习；","如果记得，就直接进入新内容，灵活衔接，不会卡进度，也不用家长额外花时间帮孩子复习。\n\n","也可以看画面里的星级选卡和回顾弹窗，难度选择权交给孩子，让每个孩子都在适配自己的节奏里学习。"],"durs":[16.368,2.64,7.248,5.976,2.712,8.952,10.632,3.408,5.136,4.392,8.928,9.792]},"P16":{"sents":["刚才提到学得快的孩子会触发隐藏关卡，这里我们来看一看隐藏关卡的底层机制，以及我们该怎么讲给家长听。\n\n","大家可以看左边的流程图，系统会根据孩子每一关的完成时长自动判断。","孩子做题速度快、掌握得熟练，满足时长条件之后，就会自动分流，开启额外的隐藏挑战关卡。","整个过程孩子是无感的，不会觉得是额外加任务。\n\n","给家长沟通的话术我们可以这样说：因为孩子学得快，在他不自知的情况下，系统给他单独加了几关，他比别的孩子多学了一点点知识。","这样说，家长听完会很惊喜，会觉得：我孩子真棒！\n\n","这些隐藏关卡里面，会包含知识点的嵌套、拓展练习，在巩固原有知识的基础上适度拔高，不强行加压，给学有余力的孩子多一点探索空间。"],"durs":[10.344,6.768,9.144,4.848,11.952,5.136,13.248]},"P17":{"sents":["了解完因材施教的闯关机制之后，我们来看核桃课程在兴趣上的设计 —— 三层互动体系。\n","整个互动分为三层，是一个循序渐进的金字塔：\n","第一层，先吸引注意力，让孩子坐得住，打好入门基础；\n","第二层，给到参与感，充分激发孩子的学习兴趣；\n","第三层，引发独立思考，给到孩子挑战感，让孩子愿意主动钻研。\n\n","课程题材也做了丰富的区分，有古诗动画、白盒思维测试、飞机大战、舞台剧创作等等，兼顾不同孩子的喜好。\n","我们可以用这句金句跟家长沟通：男孩喜欢飞机大战，女孩喜欢古诗动画，我们不会让您孩子学一套 “一刀切” 的内容。","软件课和硬件课交替安排，不同题材轮换，孩子每周都有新鲜感，不容易学腻。","学到 L4 到 L5 阶段，还会产出可以对外展示的作品，像古诗动画、坐标歌，孩子学到的成果看得见、摸得着，很有成就感。"],"durs":[8.16,4.608,5.52,4.824,6.504,10.728,10.176,7.848,11.64]},"P18":{"sents":["我们的课程题材不是随便设计的，一共分成三大类，各自承担不同作用，做到效果外化，平衡孩子的兴趣和家长的期待。\n\n","第一类是**实用生活类**，主打展示价值，比如家务转盘、电子贺卡、声控机器人。","优势是寓教于乐，贴合生活，还能增进亲子互动；","短板是拓展空间有限，惊喜感偏弱。","孩子做完可以直接展示给家人看，家长很容易看见学习成果。\n\n","第二类是**游戏娱乐类**，核心用来吸引孩子，像飞机大战、彩虹猫、汉堡、电子宠物。","趣味性、创造性很强，孩子愿意主动上手。","但这类题材评价两极，家长会担心孩子沉迷。","咱们的飞机大战和普通小游戏不一样，在设计上是引导孩子思考、锻炼设计能力，和单纯玩游戏区分开。\n\n","第三类是**学科学习类**，用来取悦家长，比如蜗牛爬井、田忌赛马、古诗绘本。","可以对接校内知识，锻炼逻辑思维，家长一眼就能看到和学科挂钩。","相对的，趣味性会弱一些，部分孩子会觉得没有那么好玩。\n\n","简单总结：生活类方便展示成果、游戏类抓住孩子、学科类对接课内，三类题材穿插搭配，兼顾两边的需求，不会偏科。","来看一道题，下列课程题材中，哪些属于「学科学习类」、用来对接校内知识取悦家长？"],"durs":[11.328,9.72,5.208,3.936,5.904,9.912,4.512,4.704,9.912,9.648,6.792,5.784,12.024,8.232]},"P19":{"sents":["接下来我们看 L1 到 L6 每个阶段的课程目的和侧重点，大家对整条课程线的阶段规划要有清晰的认知。\n\n","L1 属于全额退费期，这一阶段的核心目的是防退费。","课程设计上做到轻松简单，覆盖的作品类型比较广，先让孩子学得轻松、有兴趣，顺利把入门阶段走完。\n\n","L2、L3 是学习期，也是赛考期。","这一阶段的目的是防止孩子流失，难度阶梯式慢慢往上爬坡，同时通过赛事激励保持活跃。","对应的赛事类型比较多，像 CTL、YCL、图灵杯、RB 等都有覆盖。","课程侧重点依然是轻松简单、类型覆盖面广，不让孩子一开始就被难度压住。\n\n","L4、L5 是续报预热阶段，核心目的是效果外化。","课程里加入更多和学科挂钩的内容，操作类型更丰富，同时做好难度控制。","这一阶段也会多加硬件作品，像智能小车这类，现在家长的接受度比以前更高，孩子做出来看得见，满意度会明显提升。\n\n","L6 是成长追单阶段，侧重点是给孩子仪式感和成长感。","孩子会完成一个完整作品，做综合应用，快乐结业。","这个环节有点像幼儿园毕业典礼，很多孩子学到这一步，会舍不得老师、舍不得课程，我们在这个阶段也能再跟进一部分续报。\n\n","大家对每个阶段的目的和侧重心里有数之后，跟家长沟通时，就可以结合孩子当前所处的阶段，讲清楚这一阶段学什么、有什么收获。"],"durs":[9.792,5.424,10.032,4.2,9.024,7.344,7.704,5.736,7.512,11.304,5.952,5.208,11.184,11.88]},"P20":{"sents":["我们每一次课内部，都做了三层难度设计，保证孩子 “学得会”，分层设置，不制造学习焦虑。\n\n","第一层：**当前能学会的**，是本节课的核心知识点。","教学方式是实操关卡、多加练习。","目的是让孩子稳稳掌握基础，建立信心和成就感，这是本节课必须拿下的内容。\n\n","第二层：**跳一跳能做到的**，属于略有挑战的拓展内容。","我们用视频演示、科普讲解的方式呈现，**不强迫孩子上手操作**。","主要用来开阔眼界，给孩子埋下期待，让他知道后面还有更有意思的内容。\n\n","第三层：**跳一跳有可能的**，属于难度更高的进阶内容。","只需要看一看、了解一下就可以，不强求掌握。","目的是保护孩子的好奇心，不为难孩子，不制造焦虑。\n\n","简单总结：保底内容保证学会、拓展内容激发向往、高阶内容只做科普。","不揠苗助长，循序渐进，让孩子愿意持续学下去。","来做一道判断题：「跳一跳有可能的」较难进阶内容，要求孩子必须当堂掌握、不能放过吗？"],"durs":[8.4,6.816,3.984,7.608,7.056,8.016,6.792,7.008,4.392,5.4,7.416,5.016,8.184]},"P21":{"sents":["接下来我们看专为孩子专注力设计的课程结构。\n","整节课的学习体验、学习内容、剧情内容三条曲线，全部按照孩子专注力的变化规律来排布。\n\n","前 20 到 30 分钟，是孩子专注力最强的黄金时段，我们安排集中学习 2 个核心知识板块，搭配实操练习，把重难点放在状态最好的时候吸收。\n","30 分钟之后，孩子专注力自然开始下滑，这个时候课程的剧情密度、闯关密度会快速拉高，用孩子感兴趣的剧情、闯关任务，把注意力重新拉回来。\n","最后安排第 3 个知识板块，也是难度最轻的板块，让孩子轻松完成，带着成就感收尾，不会带着挫败感下课。","一节课一共设置 3 个知识板块。\n\n","这里给大家准备好家长问「孩子坐不住」的标准应答话术：\n","妈妈，20-30 分钟是孩子最专注的时间段，这是生理规律。","我们的课程在前半课时学 2 个知识点，30 分钟后剧情密度和选关频率会显著增加，系统本身就在用孩子最爱的方式把注意力拉回来。","我也会观察他的选关情况，判断他有没有走神。","来看一道题，家长说「孩子坐不住」，下面哪种课导版回答是正确的？"],"durs":[4.584,8.688,12.984,14.28,9.912,3.408,5.232,6.312,12.624,4.464,6.192]},"P22":{"sents":["现在我们进入第五部分，课程结构梳理，先看思维版：软编和硬编交替推进，也就是 Scratch 图形化这条线的学习节奏。\n\n","整体从 LEVEL 1 到 LEVEL 6，按月度四周来排布：\n","第一周、第二周、第四周，全部安排软编课。\n","第三周穿插软硬课：L1、L3、L5 第三周是软编课；","L2、L4、L6 第三周安排硬编课。\n\n","整套思维版总课时：软编课一共 42 课时，硬编课一共 6 课时。\n\n","硬件课穿插进来，作为阶段性的实物落地，把代码从屏幕里落到实物小车、硬件作品上，增加孩子的新鲜感，也方便效果外化。","软硬搭配，不会一直对着电脑写代码。","来看一道题，思维版课程中，L2、L4、L6 的第三周安排的是什么课？"],"durs":[11.352,4.92,4.656,6.144,4.584,6.696,12,3.888,7.488]},"P23":{"sents":["接下来我们看科特版课程，整体是**软编、硬编、赛事课交替推进**的学习节奏。\n","它不是零散的兴趣班，而是一整套按月排布的体系，和思维版相比，科特增加了完整的赛事训练板块，赛事课、赛事直播是两类独立课程。\n","整套科特版合计：软编课 30 课时，硬编课 12 课时，赛事课 12 课时，赛事直播课 6 课时。\n","平时软编打编程思维基础，穿插硬编做硬件实物实操，同步搭配赛事课、赛事直播进行备赛训练，学练赛一体，让孩子把学到的编程知识运用到真实赛事当中，避免学完就忘。\n","每周详细的排布安排，大家可以安排CRM排班为准。"],"durs":[9.624,13.128,9.696,16.992,5.496]},"P24":{"sents":["培训有作业，因为有月考；","月考单次未通过会扣绩效考核100块。","绩效考核方案会粘贴到群标签页里，没找到的可以飞书私聊我要。","作业是为了让大家把培训内容牢牢记住、顺利通过月考。"],"durs":[2.928,4.128,6.456,5.448]},"P25":{"sents":["接下来进入第六部分，课后作业，我们来看 AI 对练的使用流程，一共三步完成。\n","第一步，粘贴剧本：Ctrl+A 全选剧本，复制之后粘贴到豆包新对话里发送。","这里注意，指令不能漏发、少发，也不要直接发文档链接。\n","第二步，电话对练：等豆包回复 “可以开始” 之后，点击右上角电话图标，我们给到指令，让豆包扮演角色 B，自己扮演角色 A，进行电话语音对练，注意是语音通话，不是文字聊天。\n","第三步，出分交作业：通话结束挂断之后，豆包会输出成绩以及扣分点，我们把结果粘贴到作业表。","重点提醒，对练的录屏，也必须一并粘贴进作业表。\n","同时这里给大家标注了常见问题的处理办法：如果豆包不回复，就重启豆包；","如果出现抢话，发指令「豆包！","你是角色 B，别抢我的词～」；","如果它不输出分数，就下发指令，让它按格式输出打分结果。","来看一道题，AI 对练第二步「电话对练」的正确做法是？"],"durs":[7.8,7.8,5.856,16.416,9.912,5.184,7.104,3.072,2.952,6,5.28]},"P26":{"sents":["接下来我们看 AI 对练的规则，分可以做和禁止做两部分。\n\n","先看✅可以做的：\n","如果豆包抢话，我们可以发指令管控，就是这句：豆包！","你是角色 B，别抢我的词～；\n","如果输出结果里没有分数、没有扣分点，可以下发指令，让它按照规定格式重新输出。\n\n","再看❌违规操作，这两点一定要记牢：\n","第一，豆包重复追问的时候，不允许发指令直接跳过，正确做法是对照剧本完整作答，覆盖全部得分点；\n","第二，分数不达标的时候，不能发指令去要求重新核查改分。","标准是小于等于 70 分就判定不达标，需要重新对练。\n\n","最后是违规后果：一旦违规，当天的作业需要重新提交，并且当月的月考成绩直接扣减 10 分。","全程都要求录屏上交，浑水摸鱼是能够查出来的。","来看一道题，下列哪些属于 AI 对练的违规操作？"],"durs":[5.736,2.568,5.136,2.952,8.232,4.104,10.128,6.096,5.448,8.976,5.04,4.848]},"P27":{"sents":["最后是我们本次培训的结束行动项，一共三点。\n","第一，现在大家就可以扫码，在飞书上填写本次培训的调研问卷；\n","第二，稍后培训文档和作业材料，会统一发到群里面；\n","第三，提醒大家，按时完成 AI 对练作业，作业达标分数线是 70 分。","今天内容就到这里，谢谢各位老师。"],"durs":[4.704,6.672,5.472,7.272,3.576]}},"v":{"slides/P01.png":"e01a2a60","slides/P02.png":"cb8ab692","slides/P03.png":"b099f716","slides/P04.png":"01728983","slides/P05.png":"22d65b68","slides/P06.png":"96320d9d","slides/P07.png":"f27cfb7a","slides/P08.png":"b182eb26","slides/P09.png":"7b83d404","slides/P10.png":"028ede9c","slides/P11.png":"49f70384","slides/P12.png":"42962ed7","slides/P13.png":"3e071d14","slides/P14.png":"dead3dc6","slides/P15.png":"daa6fb98","slides/P16.png":"867fe91d","slides/P17.png":"3f4e7cf2","slides/P18.png":"c22b3a3d","slides/P19.png":"94b9ead3","slides/P20.png":"f6c16e51","slides/P21.png":"ce1e3c6c","slides/P22.png":"acc07760","slides/P23.png":"f5bd2332","slides/P24.png":"347aa9bb","slides/P25.png":"a9cd39db","slides/P26.png":"86f15277","slides/P27.png":"c6cafbb5","audio/P01.mp3":"0136ae91","audio/P02.mp3":"51118150","audio/P03.mp3":"55f19925","audio/P04.mp3":"96ce2bda","audio/P05.mp3":"aaad403c","audio/P06.mp3":"b3fdd5e1","audio/P07.mp3":"b0de88fd","audio/P08.mp3":"e50bd1a7","audio/P09.mp3":"9c227948","audio/P10.mp3":"fcdfbd7e","audio/P11.mp3":"624cd64f","audio/P12.mp3":"2c5133d8","audio/P13.mp3":"d57e8da5","audio/P14.mp3":"90658689","audio/P15.mp3":"22ba868a","audio/P16.mp3":"f8584a44","audio/P17.mp3":"ab1d0707","audio/P18.mp3":"b2110174","audio/P19.mp3":"dace81dc","audio/P20.mp3":"0e008be4","audio/P21.mp3":"b82df5e6","au const PASS = 0.6; // 合格线：取自「合格线与重学规则」表「阶段合格线 60%」
const CFG = {"key":"tuxing-tixi-v1","title":"图形化体系","short":"图形化体系","tag":"图形化 · 课导培训","hero":"P01","titles":{"1":"开篇共识与课程导览","2":"图形化简介：为什么学编程·为什么学图形化","3":"课程体系简介：为什么选核桃·莫顿因材施教","4":"核桃如何教学：课程设计与专注力","5":"课程结构梳理：思维版与科特版","6":"AI对练：使用流程与规则红线"},"depts":["霞霞部","西安一部","西安二部","武汉铁军","长春铁军","苍穹顶"]};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 课程结构 ---------- */
/* 部门 / SKU 可见性：标「通用」或未标的页所有人可见；带标签的页只有选中的部门/SKU 命中才显示（多选任一命中即可） */
const normTag = t => String(t||'').replace(/1部/g,'一部').replace(/2部/g,'二部').replace(/苍穹鼎/g,'苍穹顶').replace(/\s/g,'');
const tagsOf = t => String(t||'').split(/[\n、,，\/;；|]+/).map(normTag).filter(Boolean);
function tagOk(tag, chosen){ const tags = tagsOf(tag); if (!tags.length || tags.includes('通用')) return true; return tags.some(x => (chosen||[]).map(normTag).includes(x)); }
function pageVisible(p){ return (!CFG.depts || tagOk(p.dept, st && st.depts)) && (!CFG.skus || tagOk(p.sku, st && st.skus)); }
let STAGES = [];
function buildStages(){
  STAGES = [];
  for (const p of DATA.pages) {
    if (!pageVisible(p)) continue;
    let s = STAGES.find(x => x.name === p.stage);
    if (!s) { s = {name:p.stage, num:+(/阶段\s*(\d+)/.exec(p.stage)||[0,STAGES.length+1])[1], pages:[]}; STAGES.push(s); }
    s.pages.push(p);
  }
  for (const s of STAGES) s.quiz = DATA.qs.filter(q => /阶段练习/.test(q.type) && +(/阶段\s*(\d+)/.exec(q.chapter)||[])[1] === s.num);
}
let st = null; buildStages();
const TITLES = CFG.titles || {};
const FINAL = DATA.qs.filter(q => /综合测试/.test(q.type));

/* ---------- 学习记录（仅存本机浏览器） ---------- */
function fresh(){ return {name:'', team:'', sid:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), unlocked:0, heard:{}, passed:{}, tries:{}, best:{}, final:null, finalTries:0, view:'home', cur:{s:0,p:0}, stageSec:{}}; }
try { st = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch(e) { st = fresh(); }
buildStages();
// 恢复进度链接：#r=base64(JSON {k,sid,passed:[..],best:{..}})，只对本课 key 生效
let RESTORE=null; try { const m=/[#&]r=([^&]+)/.exec(location.hash); if(m){ const o=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))))); if(o.k===CFG.key) RESTORE=o; history.replaceState(null,'',location.pathname+location.search); } } catch(e) {}
function applyRestore(){ if(!RESTORE) return false; const o=RESTORE; RESTORE=null;
  st.sid=o.sid||st.sid; st.rowCreated=true;
  for(const i of o.passed){ if(!STAGES[i]) continue; st.passed[i]=true; STAGES[i].pages.forEach(p=>st.heard[p.p]=true); }
  st.unlocked=Math.max(st.unlocked, Math.max(-1,...o.passed)+1); Object.assign(st.best,o.best||{}); save(); return true; }
if (RESTORE && st.name) { applyRestore(); }
// 旧版本里小测没加载、0/0 直接过关的阶段：重新打开，补做小测（已听过的页面不用重听）
(function fixZeroPass(){ let first=-1; STAGES.forEach((s,i)=>{ if(st.passed[i] && s.quiz.length && st.best[i]==null){ delete st.passed[i]; if(first<0) first=i; } }); if(FINAL.length && st.final && st.final.pass && !st.final.score){ st.final=null; save(); } if(first>=0){ st.unlocked=Math.min(st.unlocked, first); if(st.final && !st.final.pass) st.final=null; save(); } })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }
if (!st.sid) st.sid = 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
if (!st.stageSec) st.stageSec = {};

/* ---------- 学习数据上报（飞书多维表格 Webhook，实时写入） ---------- */
const HOOK = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/Z0UnaFjXvwZxHrhrmiFcMjSJnEd';
const pad = n => String(n).padStart(2,'0');
function nowStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function stageLabel(i){ const s = STAGES[i]; return s ? (s.name + (TITLES[s.num] ? ' ' + TITLES[s.num] : '')) : ''; }
const mins = sec => Math.round((sec||0)/6)/10;
/* 每个关卡的过程数据：play=实际播放秒数 occ=占用秒数 pn/ps=暂停次数/秒 kn/ks=卡顿次数/秒 */
function stat(k){ st.stat = st.stat || {}; return st.stat[k] = st.stat[k] || {play:0, occ:0, pn:0, ps:0, kn:0, ks:0}; }
function curKey(){ return st.view === 'quiz' ? (st.quiz === 'final' ? 'f' : st.quiz) : st.cur.s; }
function stageStatusText(k){
  const done = k === 'f' ? !!(st.final && st.final.pass) : !!st.passed[k];
  if (done) return '已完成';
  if ((st.view === 'learn' || st.view === 'quiz') && String(curKey()) === String(k)) return '进行中';
  const s = st.stat && st.stat[k];
  return s && s.occ > 0 ? '进行中' : '未开始';
}
function snapshot(online){
  const keys = [0,1,2,3,'f'], sum = f => keys.reduce((a,k) => a + ((st.stat&&st.stat[k]&&st.stat[k][f])||0), 0);
  const play = sum('play'), occ = sum('occ');
  const sc = i => st.best[i] != null ? `${st.best[i]}/${STAGES[i].quiz.length}` : '';
  const cur = st.view === 'quiz' ? (st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz) + '·小测') : (st.view === 'learn' ? stageLabel(st.cur.s) : '课程首页');
  const cp = st.view === 'learn' ? (curPageSafe()||{}).p || '' : '';
  return {online: online || '学习中', cur_stage:cur, cur_page:cp,
    st1:stageStatusText(0), st2:stageStatusText(1), st3:stageStatusText(2), st4:stageStatusText(3), stf:stageStatusText('f'),
    sc1:sc(0), sc2:sc(1), sc3:sc(2), scf: st.final ? `${st.final.score}/${FINAL.length}` : '',
    play_min:mins(play), occ_min:mins(occ), gap_min:mins(Math.max(0, occ-play)),
    pause_n:sum('pn'), pause_min:mins(sum('ps')), stall_n:sum('kn'), stall_min:mins(sum('ks')),
    relearn_n:Object.values(st.relearnCnt||{}).reduce((a,b)=>a+b,0),
    quiz_switch_n:sum('qn'), quiz_switch_min:mins(sum('qs'))};
}
/* 第二个 Webhook：学员第一次出现时，在「学员实时状态」表新建他的那一行 */
const HOOK_NEW = 'https://wrpnn3mat2.feishu.cn/base/automation/webhook/event/HLe6aYJ3Qwv8GNhw02NcO2XPn2I';
function post(url, body){
  let ok = false;
  try { ok = navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(e) {}
  if (!ok) { try { fetch(url, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=UTF-8'}, body}); } catch(e) {} }
}
/* 发送队列：每条至少间隔 1.2 秒，保证飞书按顺序更新「学员实时状态」那一行；
   新学员的状态行刚创建的 5 秒内先排队，避免更新时那一行还不存在 */
let rowReadyAt = 0, lastSent = 0, outbox = [], pumpTimer = null;
function pump(){
  pumpTimer = null;
  if (!outbox.length) return;
  const wait = Math.max(rowReadyAt - Date.now(), lastSent + 1200 - Date.now());
  if (wait > 0) { pumpTimer = setTimeout(pump, wait); return; }
  post(HOOK, outbox.shift()); lastSent = Date.now();
  if (outbox.length) pumpTimer = setTimeout(pump, 1200);
}
function report(ev, online){
  if (!st.name) return;
  const rec = Object.assign({name:st.name, team:st.team||'', event:'', stage:'', page:'', minutes:0, score:0, total:0, pass:'', relearn:'', detail:'', ts:nowStr(), sid:st.sid}, ev, snapshot(online));
  const body = JSON.stringify(rec);
  if (!st.rowCreated) { post(HOOK_NEW, body); st.rowCreated = true; save(); rowReadyAt = Date.now() + 5000; }
  outbox.push(body);
  if (online === '已离开') {
    // 关页面时立刻全部发出。飞书会并行处理，为防止较早的记录后到、把状态行改回「学习中」，
    // 排队中的每条记录都换成这一刻的最新状态（明细里的动作、详情不变）
    const latest = snapshot('已离开');
    while (outbox.length) post(HOOK, JSON.stringify(Object.assign(JSON.parse(outbox.shift()), latest)));
    return;
  }
  if (!pumpTimer) pump();
}
/* 实际收听时长：只在播放时累计，按真实时间计（倍速播放不重复计） */
let pageSec = 0, lastT = null;
function flushPage(event){
  const p = curPageSafe();
  if (p && pageSec >= 3) report({event, stage:stageLabel(st.cur.s), page:p.p, minutes:mins(pageSec), detail:p.topic});
  pageSec = 0;
}
function curPageSafe(){ try { return STAGES[st.cur.s].pages[st.cur.p]; } catch(e) { return null; } }
let leftSent = false;
function leaveCourse(){
  if (leftSent || !st.name) return; leftSent = true;
  if (st.view === 'learn') { endPause(false); flushPage('中途离开'); }
  endQuizAway(false);
  save();
  const where = st.view === 'quiz' ? '测试中' : st.view === 'learn' ? '听课中' : '课程首页';
  bot(who() + '在' + CN + '课已离开');
  report({event:'离开课程', stage: st.view === 'home' ? '' : stageLabel(st.cur.s), page: st.view === 'learn' ? ((curPageSafe()||{}).p||'') : '', detail:`在${where}关闭或离开网页`}, '已离开');
}
// 不论停在哪个界面（含课程首页），关网页都上报「已离开」；pagehide 不触发的浏览器用 beforeunload 兜底
window.addEventListener('pagehide', leaveCourse);
window.addEventListener('beforeunload', leaveCourse);
window.addEventListener('pageshow', e => { if (e.persisted) { leftSent = false; report({event:'进入课程', detail:'返回网页'}); } });

/* 小测中切屏：不能暂停答题，但要记录每次离开和离开多久，并提示学员 */
let quizAwayAt = null;
function quizActive(){ return st.view === 'quiz' && quizState && !quizState.result; }
function quizAwayNow(){ return document.hidden || !document.hasFocus(); }
function startQuizAway(){
  if (quizAwayAt != null || !quizActive() || !quizAwayNow()) return;
  quizAwayAt = Date.now();
  const s = stat(curKey()); s.qn = (s.qn||0) + 1;
  report({event:'测试中切屏', stage: st.quiz === 'final' ? '本章综合测试' : stageLabel(st.quiz), detail:`本次测试第 ${s.qn} 次切屏（${document.hidden ? '切出页面' : '切到其他窗口'}）`});
}
function endQuizAway(doReport){
  if (quizAwayAt == null) return;
  const sec = (Date.now() - quizAwayAt)/1000; quizAwayAt = null;
  const s = stat(curKey()); s.qs = (s.qs||0) + sec;

/* 占用时长：停留在某关卡（听课或做小测）的全部时间，含暂停、切走 */

function endPause(doReport){
  if (pauseAt == null) return;

  stat(st.cur.s).ps += sec;
  if (doReport) report({event:'继续播放', stage:stageLabel(st.cur.s), page:(curPageSafe()||{}).p||'', detail:`暂停 ${Math.round(sec)} 秒（${pauseWhy}）`});

function endStall(){

/* ---------- 音频播放 ---------- */

function pageTiming(p){ return DATA.timing[p.p]; }
function sentAt(p, t){
  const tm = pageTiming(p); let acc = 0;
  for (let i=0;i<tm.durs.length;i++){ acc += tm.durs[i]; if (t < acc) return i; }
  return tm.durs.length-1;
}

  if (st.view !== 'learn') return;
  if (!au.paused && lastT != null) { const dt = au.currentTime - lastT; if (dt > 0 && dt < 3) { const real = dt/(au.playbackRate||1); pageSec += real; st.stageSec[st.cur.s] = (st.stageSec[st.cur.s]||0) + real; stat(st.cur.s).play += real; } }
  lastT = au.currentTime;
  const p = curPage(); const tm = pageTiming(p);
  const total = tm.durs.reduce((a,b)=>a+b,0);
  const i = sentAt(p, au.currentTime);
  const sub = $('#sub'); if (sub && sub.dataset.i != i){ sub.dataset.i = i; sub.textContent = tm.sents[i].trim(); }
  const bar = $('#progfill'); if (bar) bar.style.width = (100*au.currentTime/total).toFixed(1)+'%';
  const tt = $('#time'); if (tt) tt.textContent = fmt(au.currentTime)+' / '+fmt(total);
});
/* 群播报：暂停/切屏/离开满 2 分钟、结业 */

const who = () => st.name + '（' + (st.team || '未填职场') + '）';
let awayT = null, pauseT = null;

/* ---------- 随堂互动题 ---------- */
function askInteract(p){
  const it = p.interact;
  const ans = it.answers && it.answers.length ? it.answers : [it.answer];
  const multi = !it.vote && ans.length > 1;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="iq">
    <span class="eyebrow">随堂互动 · ${p.p}</span>
    <h3 id="iq" style="font-size:18px">${it.tag?`<span class="muted" style="font-size:13px;font-weight:400">${esc(it.tag)}</span><br>`:""}${esc(it.q)}</h3>
    ${multi ? '<p class="rule" style="margin:0">本题为多选，选完点「提交」。</p>' : ''}
    <div class="opts">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><b>${'ABCDEF'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="ifb"></div><div class="row" id="irow">${multi ? '<button class="btn" id="isub">提交</button>' : ''}</div></div>`;
  document.body.appendChild(m);
  m.querySelector('.opt').focus();
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (multi) { b.classList.toggle('sel'); return; } decide([+b.dataset.i]); });
  if (multi) m.querySelector('#isub').onclick = () => { const picked = [...m.querySelectorAll('.opt.sel')].map(x => +x.dataset.i); if (picked.length) decide(picked); };
  function decide(picked){
    m.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); });
    const ok = it.vote || (picked.length === ans.length && picked.every(x => ans.includes(x)));
    const fb = m.querySelector('#ifb'), row = m.querySelector('#irow');
    const close = () => m.remove();
    const mark = cls => picked.forEach(x => m.querySelector(`.opt[data-i="${x}"]`).classList.add(cls));
    st.answered = st.answered || {};
    report({event:'随堂互动', stage:stageLabel(st.cur.s), page:p.p, score:ok?1:0, total:1, pass:ok?'是':'否', detail:`${it.q}｜选 ${picked.map(x => 'ABCDEF'[x] + '：' + it.options[x]).join('；')}`});
    if (ok) {
      st.answered[p.p] = true; save();
      mark('right');
      fb.innerHTML = `<div class="fb ok">${it.vote?'收到你的选择！':'回答正确！'}</div>`;
      row.innerHTML = `<button class="btn" id="go">继续听课</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
      row.querySelector('#go').focus();
      return;
    }
    mark('wrong');
    if (it.wrong.startsWith('重讲')) {
      fb.innerHTML = `<div class="fb no">答错了。再听一遍本页讲解，听完重新作答。</div>`;
      row.innerHTML = `<button class="btn" id="go">重听本页</button>`;
      row.querySelector('#go').onclick = () => { close(); au.currentTime = 0; pendingAfter = Object.assign(() => askInteract(p), {page: p.p}); play(); };
    } else {
      ans.forEach(x => { const o = m.querySelector(`.opt[data-i="${x}"]`); o.classList.remove('wrong'); o.classList.add('right'); });
      st.answered[p.p] = true; save();
      fb.innerHTML = `<div class="fb no">答错了。正确答案是 ${ans.map(x => 'ABCDEF'[x] + '：' + esc(it.options[x])).join('；')}</div>`;
      row.innerHTML = `<button class="btn" id="go">知道了，继续</button>`;
      row.querySelector('#go').onclick = () => { close(); nextPage(); };
    }
    row.querySelector('#go').focus();
  }
}

/* ---------- 阶段小测 / 综合测试 ---------- */
let quizState = null;
function showQuiz(which){ st.view = 'quiz'; st.quiz = which; save(); quizState = {sel:{}, result:null};
  report({event:'进入测试', stage: which === 'final' ? '本章综合测试' : stageLabel(which)});
  renderQuiz(); window.scrollTo(0,0); }
function stageDetail(k){ const s = stat(k); return `本关播放 ${mins(s.play)} 分｜占用 ${mins(s.occ)} 分｜时间差 ${mins(Math.max(0,s.occ-s.play))} 分｜暂停 ${s.pn} 次 ${mins(s.ps)} 分｜卡顿 ${s.kn} 次 ${mins(s.ks)} 分｜测试中切屏 ${s.qn||0} 次 ${Math.round(s.qs||0)} 秒`; }
function renderQuiz(){
  const which = st.quiz; const isFinal = which === 'final';
  if (!quizState) quizState = {sel:{}, result:null};
  const qs = isFinal ? FINAL : STAGES[which].quiz;
  const need = Math.ceil(qs.length*PASS);
  const r = quizState.result;
  const title = isFinal ? '本章综合测试' : `阶段 ${STAGES[which].num} 小测${TITLES[STAGES[which].num] ? " · " + TITLES[STAGES[which].num] : ""}`;
  const passedBefore = isFinal ? (st.final&&st.final.pass) : st.passed[which];
  let top = '';
  if (r) {
    top = `<div class="card" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-color:${r.pass?'var(--ok)':'var(--bad)'}">
      <div class="score" style="color:${r.pass?'var(--ok)':'var(--bad)'}">${r.score}<span style="font-size:20px">/${qs.length}</span></div>
      <div style="flex:1 1 240px;min-width:0"><h3 style="font-size:18px">${r.pass?(isFinal?'恭喜结业！本章综合测试通过':'过关！下一阶段已解锁'):'未达合格线'}</h3>
        <p class="muted" style="margin:4px 0 0">${r.pass?'下面是每题的正确答案，可对照复习。':(isFinal?'错题已标出。可回看任一阶段后重新作答。':`错题已标出（不显示答案）。需重学阶段 ${STAGES[which].num} 全部内容后再测。`)}</p></div>
      <div class="row">${r.pass
        ? (isFinal ? `<button class="btn ghost" data-home2>回到课程首页</button>` : (which+1<STAGES.length?`<button class="btn" id="nextStage">进入阶段 ${STAGES[which+1].num}</button>`:''))
        : (isFinal ? `<button class="btn" id="retry">重新作答</button>` : `<button class="btn" id="relearn">重学本阶段</button>`)}</div></div>`;
  }
  const cert = isFinal && st.final && st.final.pass ? certHTML() : '';
  $('#app').innerHTML = `${headerHTML()}${mapHTML(isFinal?'final':which)}${loopHTML(r?(r.pass?4:3):2)}
  ${cert}${top}
  <section class="card quiz"><div><span class="eyebrow">${isFinal?'结业测试':'阶段检测'}</span>
    <h2 style="font-size:20px;margin-top:4px">${esc(title)}</h2>
    <p class="rule" style="margin:6px 0 0">共 ${qs.length} 题，答对 ${need} 题及以上通过（合格线 ${Math.round(PASS*100)}%）。多选题需全部选对才得分。${passedBefore&&!r?'你已通过，可再次练习。':''}${r?'':'测试期间请不要切屏，切屏会被记录。'}</p>
    <p class="fb no" id="quizWarn" hidden style="margin:8px 0 0"></p></div>
    ${qs.map((q,qi)=>{ const multi = q.answer.length>1; const sel = quizState.sel[q.id]||'';
      const res = r && r.items[q.id];
      return `<div class="qitem"><div class="qt"><span class="qn">${qi+1}.</span>${q.tag?`<span class="muted" style="font-size:13px">${esc(q.tag)}</span> `:""}${esc(q.q)}${multi&&!/多选/.test(q.q)?'（多选）':''}
        ${res?` <span class="fb ${res.ok?'ok':'no'}" style="display:inline-block;padding:2px 8px;font-size:13px">${res.ok?'✓ 正确':'✗ 错误'}${r.pass&&!res.ok?' · 答案 '+q.answer:''}</span>`:''}</div>
        <div class="opts">${q.options.map(o=>{
          let cls = sel.includes(o.k)?'sel':'';
          if (r && r.pass) { if (q.answer.includes(o.k)) cls='right'; else if (sel.includes(o.k)) cls='wrong'; }
          return `<button class="opt ${cls}" data-q="${q.id}" data-k="${o.k}" ${r?'disabled':''} aria-pressed="${sel.includes(o.k)}"><b>${o.k}</b><span>${esc(o.t)}</span></button>`; }).join('')}</div>${r&&r.pass&&q.exp?`<p class="rule" style="margin:6px 0 0">解析：${esc(q.exp)}</p>`:""}</div>`; }).join('')}
    ${r?'':`<div class="row"><span class="rule" id="qmsg" style="margin-right:auto"></span><button class="btn" id="submit">提交答卷</button></div>`}
  </section>`;
  bindCommon();
  { const s = stat(curKey()); const w = $('#quizWarn'); if (w && !r && s.qn) { w.hidden = false; w.textContent = `⚠ 测试期间请不要切屏。本关测试已切屏 ${s.qn} 次、共离开 ${Math.round(s.qs||0)} 秒，已同步给培训老师。`; } }
  document.querySelectorAll('.opt[data-q]').forEach(b => b.onclick = () => {
    const q = qs.find(x => x.id === b.dataset.q); const k = b.dataset.k; let sel = quizState.sel[q.id]||'';
    if (q.answer.length>1) sel = sel.includes(k) ? sel.replace(k,'') : [...sel+k].sort().join(''); else sel = k;
    quizState.sel[q.id] = sel;
    b.parentElement.querySelectorAll('.opt').forEach(x => { const on = sel.includes(x.dataset.k); x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on); });
  });
  const sb = $('#submit'); if (sb) sb.onclick = () => {
    const miss = qs.filter(q => !quizState.sel[q.id]);
    if (miss.length) { $('#qmsg').textContent = `还有 ${miss.length} 题没作答（第 ${miss.map(q=>qs.indexOf(q)+1).join('、')} 题）`; return; }
    const items = {}; let score = 0;
    for (const q of qs) { const ok = quizState.sel[q.id] === q.answer; items[q.id] = {ok}; if (ok) score++; }
    const pass = score >= need;
    quizState.result = {score, pass, items};
    if (isFinal) {
      st.finalTries = (st.finalTries||0)+1;
      if (pass && !(st.final&&st.final.pass)) st.final = {score, pass, at:new Date().toLocaleString('zh-CN'), tries:st.finalTries};
      else if (!st.final || !st.final.pass) st.final = {score, pass, tries:st.finalTries};
    } else {
      st.tries[which] = (st.tries[which]||0)+1;
      st.best[which] = Math.max(st.best[which]||0, score);
      if (pass) { st.passed[which] = true; st.unlocked = Math.max(st.unlocked, which+1); }
    }
    const wrongIds = qs.filter(q => !items[q.id].ok).map(q => q.id).join('、') || '无';
    st.relearnCnt = st.relearnCnt || {};
    if (isFinal) {
      report({event:'综合测试', stage:'本章综合测试', score, total:qs.length, pass:pass?'是':'否', relearn:'否', detail:`第${st.finalTries}次作答｜错题：${wrongIds}｜${stageDetail('f')}`});
      if (pass && st.final.tries === st.finalTries) {
        const totalMin = mins(Object.values(st.stageSec||{}).reduce((a,b)=>a+b,0));
        report({event:'结业', stage:'本章综合测试', minutes:0, score, total:qs.length, pass:'是', detail:`全课累计学习 ${totalMin} 分钟`}); bot(st.name + '完成' + CN + '课全部学习，综合测试' + score + '/' + qs.length, true);
      }
    } else {
      report({event:'阶段小测', stage:stageLabel(which), score, total:qs.length, pass:pass?'是':'否', relearn:(st.relearnCnt[which]||0)>0?'是':'否',
        detail:`第${st.tries[which]}次作答｜错题：${wrongIds}｜已重学 ${st.relearnCnt[which]||0} 次｜${stageDetail(which)}`});
    }
    save(); renderQuiz(); window.scrollTo(0,0);
  };
  const rl = $('#relearn'); if (rl) rl.onclick = () => {
    // 重学：本阶段所有页重新听
    for (const pg of STAGES[which].pages) { delete st.heard[pg.p]; if (st.answered) delete st.answered[pg.p]; }
    st.relearnCnt = st.relearnCnt || {}; st.relearnCnt[which] = (st.relearnCnt[which]||0) + 1;
    report({event:'触发重学', stage:stageLabel(which), score:quizState&&quizState.result?quizState.result.score:0, total:STAGES[which].quiz.length, pass:'否', relearn:'是', detail:`第${st.relearnCnt[which]}次重学`});
    st.cur = {s:which, p:0}; st.view='learn'; quizState=null; save(); renderLearn(true);
  };
  const rt = $('#retry'); if (rt) rt.onclick = () => { quizState = null; renderQuiz(); window.scrollTo(0,0); };
  const ns = $('#nextStage'); if (ns) ns.onclick = () => { quizState=null; startStage(which+1); };
  const h2 = document.querySelector('[data-home2]'); if (h2) h2.onclick = () => { st.view='home'; quizState=null; save(); render(); };
}
function certHTML(){
  const rows = STAGES.map((s,i)=>`<tr><td>阶段 ${s.num}${TITLES[s.num] ? " · " + esc(TITLES[s.num]) : ""}</td><td class="n">${s.quiz.length?(st.best[i]??'-')+' / '+s.quiz.length:'听课完成'}</td><td class="n">${s.quiz.length?(st.tries[i]||0)+' 次':'-'}</td></tr>`).join('');
  return `<section class="card"><span class="eyebrow">成绩单</span>
    <h2 style="font-size:20px;margin:4px 0 10px">${esc(st.name)} · ${esc(CFG.title)} 已结业</h2>
    <div class="tbl"><table><thead><tr><th>板块</th><th>最高分</th><th>作答次数</th></tr></thead><tbody>${rows}
    <tr><td><b>本章综合测试</b></td><td class="n"><b>${st.final.score} / ${FINAL.length}</b></td><td class="n">${st.final.tries} 次</td></tr></tbody></table></div>
    <p class="rule" style="margin:10px 0 0">通过时间：${esc(st.final.at||'')}　可截图此成绩单提交给培训老师。</p></section>`;
}

render();
</script>
